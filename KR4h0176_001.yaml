body:
  text: 太昊十言之教乾坤震巽坎離艮兌消息見左傳定四年正義引易云伏羲作十言之教神農之禁春夏之所生不傷不害見群書治要六韜虎韜篇引神農之禁神農之數一穀不登減一穀穀之法什倍二穀不登減二穀穀之法再什倍夷疏滿之無食者豫之陳無種者貨之新見管子揆度神農之法丈夫丁壯不耕天下有受甚飢者婦人當年不織天下有受其寒者見文子上義淮南子濟俗訓不耕不織上皆有而字又呂氏春秋愛類引神農之教曰士有當年而不耕者則天下或受其飢矣女有當年而不織者則天下或受其寒矣神農之教有石城十仞有湯池百步帶甲百萬而亡粟弗能守也見漢食貨志朝錯引神農之教神農書禾生于棗出于上黨羊頭之山右谷中生七十日秀六十日熟凡一百三十日成忌于寅卯黍生于榆出于大梁之山左谷中生六十日秀四十日熟凡一百日成忌于丑大豆生于槐出于沮石之山谷中九十日華六十日熟凡一百五十日成忌于卯小豆生于李出于農石之山谷中生六十日華五十日熟凡一百一十日成忌于卯秫生于楊出于農石之山谷中七十日秀六十日熟凡一百三十日成忌于午蕎麥生于杏出于農石之山谷中生二十五日秀五十日熟凡七十五日成忌于子麻生于荊出于農石之山谷中生七十日秀六十日熟凡一百三十日成忌于未午辰亥小麥生于桃出于須石之山谷中生二百日秀三十日熟凡二百三十日成忌于子稻生于柳出于農石之山谷中生八十日秀七十日熟凡一百五十日成忌于亥五穀以生長日種者多實以老死日種者無實又難生以忌日種之一人不食禾生于已疾于酉長于子老于戌惡于丙丁忌于寅卯黍生于寅疾于午長于丙丁老于戌死于申惡于辰忌于丑豆生于申疾于子長于壬老子丑惡于甲乙忌于丙丁麥生于酉疾于卯長于辰老于午死于已惡于戌忌于子太歲在四季葶藶子熟時可種禾豆夏至時可種黍麻夏至後百日地氣上時可種麥丑未戌是也太歲在四仲椹熟時可種禾豆夏至可種黍麻夏至後九十日地氣上可種麥子午丑酉是也太歲在四孟以蠶眠起時可種禾豆夏至前五十日可種稻黍麻夏至後八十日地氣上可種麥寅申己亥是也見開元占經一百十一神農占正月上朔有風雨三月穀貴石五百錢八月有三卯旱麥大善無三卯麥不善凡蟲食李則黍貴食棗粟貴食杏麥貴食荊麻貴食桑絲貴正月上朔日風從東來植禾善從南來植黍善從北來稚禾善四月四日風從東來植豆善西來四日至七日中豆善七日至十日稚豆善十四日無風不種豆從冬至日到來年滿六十日有大風雨折樹木麥大善從平朔至食時植麥善至日中中麥善至日入稚麥善常以夏至後九十日可種四月朔日風從東來從平明至辰時植黍善至日中中黍善至日入稚黍善月朔日入清明蠶善正月有甲子糴初貴後賤正月上辛溫者善風寒者不好見開元占經一百十一有焱氏頌聽之不聞其聲視之不見其形充滿天地苞裏六極見莊子天運引有焱氏為之頌釋文焱亦作炎道言一者階于道機于神見六韜兵道十二芒芒昧昧因天之威與天同氣見文子符言上仁呂氏春秋應同淮南子繆稱訓泰族訓御覽七十七聲禁重色禁重衣禁重香禁重味禁重室禁重見呂氏春秋去私帝無常處也有處者乃無處也以言不刑蹇見呂氏春秋圜道厲女德而弗忘與女正而弗衰雖惡奚傷見呂氏春秋遇合四時之不正也正五穀而已矣見呂氏春秋審時政語日中必熭操刀必割見賈誼新書一宗首道若川谷之水其出無已其行無止見賈誼新書九修政語上巾几銘毋翕弱毋俷德毋違同毋敖禮毋謀非德毋犯非義見路史疏仡紀黃帝作巾几之銘案後漢朱穆傳注黃帝作巾機之法即此漢志道家有黃帝銘六篇金人銘古之慎言人也戒之哉戒之哉無多言多言多敗無多事多事多患安樂必戒無行所悔勿謂何傷其禍將長勿謂何害其禍將大勿謂何賤其禍將然勿謂莫聞天妖伺人熒熒不滅炎炎奈何涓涓不壅將成江河綿綿不絶將成網羅青青不伐將尋斧柯誠不能慎之禍之根也曰是何傷禍之門也強梁者不得其死好勝者必遇其敵盜怨主人民害其貴君子知天下之不可蓋也故後之下之使人慕之執雌持下莫能與之爭者人皆趨彼我獨守此衆人惑惑我獨不徒內藏我知不與人論技我雖尊高人莫我害夫江河長百穀者以其卑下也無道無親常與善人戒之哉戒之哉見說苑敬慎案此銘舊無撰人名據太公陰謀太公金匱知即黃帝六銘之一金匱僅載銘首草餘字今取說苑以足之戒余在民上搖搖恐夕不至朝見意林一引太公金匱武王問五帝之戒可得聞乎太公曰黃帝云丹書戒施舍在心平不幸乃弗聞過禍福在所密存亡在所用下匿其私用試其上上操度量以割其下上下一日百戰見路史疏仡紀黃帝用作戒于丹書又韓非子楊權引末五語誨顓頊爰有大圜在上大矩在下汝能法之為民父母見呂氏春秋序意文信侯曰嘗得學黃帝之所以誨顓頊矣黃雀占黃者土精赤者火熒爵者賞也余當立大功乎黃雀者桑也見御覽八百七十二引春秋考異郵黃帝將興有黃雀赤頭立干日旁黃帝曰藝文類聚九十九引作黃帝占曰黃者至精赤者火熒雀者賞也余當立李法壁壘已定穿窬不由路是謂姦人姦人者殺見漢書胡建傳兵法甲子從北斗魁第一星起順數至庚午在第七剛星至辛未還從第六星逆數至丙子又從第一星順數盡六甲見五行大義第五篇引黃帝兵訣案隋志黃帝兵法雜要訣一卷此省詞隋志黃帝兵法共八種又案李法律法兵律在其中今輯兵法次李法後沈陰日月俱無光晝不見日夜不見月星皆有雲障之而不雨此為君臣俱有陰謀雨敵相當陰相圖議也若晝陰夜月出君謀臣夜陰晝日出臣謀君下逆上也見開元占經五引黃帝用兵要法又十一引黃帝用兵要訣日月暈仰視之須臾忽有雲氣從傍入者急隨雲以攻之大勝見開元占經八引黃帝兵法熒惑出太白之陰若不有分軍必有他急分大軍也見開元占經二十一引黃帝兵法太白與辰星俱出東方西方國大敗俱出西方東方國大敗若客主人俱出軍在東方東方軍敗在西方西方軍敗言其表面軍也在表者不善不獲已軍堅守可也見開元占經二十二引黃帝兵法出軍訣牙旗者將軍之精金鼓者將軍之氣一軍之形候也見御覽三百三十八政語帝顓頊曰帝顓頊曰至道不可過也至道不可過也至義不可易至義不可易是故以後者復迹也是故以後者復迹也故上緣黃帝之道而行之故上緣黃帝之道而行之學黃帝之道而賞之學黃帝之道而賞之加而弗損加而弗損天下亦平也天下亦平也見賈誼新書修政語上見賈誼新書修政語上帝顓頊顓頊曰顓頊曰功莫美于去惡而為善功莫美于去惡而為善罪莫大于去善而為惡罪莫大于去善而為惡故非吾善善而已也故非吾善善而已也善緣善也善緣善也非惡惡而已也非惡惡而已也惡緣惡也惡緣惡也吾日慎一日吾日慎一日其此已也其此已也同上同上丹書敬勝怠者強怠勝敬者忘義勝欲者從欲勝義者凶凡事不強則枉不敬則不正枉者滅廢敬者萬世見大戴禮武王踐祚召師尚父而問焉曰昔帝顓頊之道存乎師尚父曰在丹書書之言云云案昔帝各本作黃帝今從官聚珍本學記疏云檢大戴禮惟云帝顓頊之道無黃字帝顓頊之法婦人不辟男子于路者拂之于四達之衢見淮南齊俗訓御覽七十九引淮南子拂作祓注云除其不祥政語帝嚳曰緣道者之辭而與為道已緣巧者之事而學當作與為巧已行仁者之操而與為仁已故節仁之器以修其躬而身專其美矣故上緣黃帝之道而明之學顓頊之道而行之而天下亦平也見賈誼新書修政語上帝嚳曰德莫高于博愛人而政莫高于博利人故政莫大于信治莫大于仁吾慎此而已也同上帝堯曰吾存心于千古加志于窮民痛萬姓之罹罪憂衆生之不遂也故一民或飢曰此我飢之也一民或寒曰此我寒之也一民有罪曰此我陷之也見賈誼新書修政語上堯戒戰戰栗栗日慎一日人莫蹪于山而蹪于垤見淮南子人間訓刻璧東沈于雒天子臣放勳德薄施行不玄見御覽八十引尚書中候九共豫辨下土使民平平使民無敖見尚書大傳政語帝舜曰吾盡吾敬而以事吾上故見為忠焉吾盡吾敬以接吾敵故見為信焉吾盡吾敬以使吾下故見為仁焉見賈誼新書修政語上祠田荷此長耜耕彼南畝四海俱有見文心雕龍祝盟篇引舜之祠田禹誓濟濟有衆咸聽朕言非惟小子敢行稱亂蠢茲有苗用天之罰若豫既率爾群對諸群以征有苗見墨子兼愛下禹禁春三月山林不登斧以成草木之長夏三月川澤不入網罟以成魚鱉之長且以并農力執成男女之功見周書大聚篇旦聞禹之禁政語民無食也則我弗能使也功成而不利于民我弗能勸也見賈誼新書修政語上夏針中不容利民乃外次見周書文傳篇引夏針孔朝曰夏禹之針戒書也小人無兼年之食遇天饑妻子非其有也大夫無兼年之食遇天飢臣妾輿馬非其有也戒之哉弗思弗行至無日矣同上開望土廣無守可襲伐土狹無食可圍竭二禍之來不稱之災天有四殃水旱飢荒其至無時非務積聚何以備之見周書文傳篇引開望孔朝曰開望古書名也北尚書鈔一百二引天有四殃已下為周書夏針引夏針今據編于夏針後簨虡銘教寡人以道者擊鼓教寡人以義者擊鐘教寡人以事者振鐸語寡人以憂者擊磬語寡人以獄訟者揮鞀見鬻子夏禹之治天下也以五聲聽門懸鐘鼓鐸磬而置鞀以待四海之士為銘于簨虡又見淮南子泛論訓作以待四方之士為號云云小異祀六沴若爾神靈洪祀六沴是合無差無傾無有不正若民有不敬事則會批之于六沴六事之機以垂示我我民人無敢不敬事上下王祀見尚書大傳鴻範五行傳教稷后稷曰所以務耕織者以為本教也見呂氏春秋上農后稷曰子能以窐為突乎子能藏其惡而揖之以陰乎子能使吾土靖而甽浴士乎子能使保濕安地而處乎子能使雚夷毋淫乎子能使子之野盡為泠風乎子能使藁數節而莖堅乎子能使穗大而堅均乎子能使粟圜而薄糠乎子能使米多沃而食之強乎無之若何凡耕之大方力者欲柔柔者欲力息者欲勞勞者欲息棘者欲肥肥者欲棘急者欲緩緩者欲急濕者欲燥燥者欲濕上田棄畝下田棄甽五耕五耨必審以盡其深殖之度陰土必得大草不生必無螟蜮今茲美禾來茲美麥是以六尺之耜所以成畝也其博八寸所以成甽也耨柄尺此其度也其耨六寸所以間稼也地可使肥又可使棘人肥必以澤使苗堅而地隙人耨必以旱使地肥而土緩草諯大月冬至後五旬七日菖始生菖者百草之先生者也于是始耕孟夏之昔殺三葉而獲大麥日至苦菜死而資生而樹麻與菽此告民地寶盡死凡草生藏日中出狶首生而麥無葉而從事于蓄藏此告民究也五時見生而樹生見死而獲死天下時地生財不與民謀有年瘞土無年瘞土無失民時無使之治下知貧富利器皆時至而作渴時而止是以老弱之力可盡起其用日半其功可使倍不知事者時未至而逆之時既往而慕之當時而薄之使其民而郤之民既𢙅乃以良時慕此從事之下也操事則苦不知高下民乃逾處種稑禾不為稑種重禾不為重是以粟少而失功見呂氏春秋任地帝告施章乃服明上下見困學紀聞二引尚書大傳帝告湯征湯曰豫有言人視水見形視民見治不伊尹曰明哉言能聽道乃進君國子民為善者皆在王官勉哉勉哉湯曰汝不能敬命豫大罰殛之無有攸赦見史記殷本紀案孟子滕文公篇引葛伯仇餉梁惠王篇引湯一征自葛始又引徯我後後來其蘇滕文公篇引湯始征自葛載又引傒我後後來其無罰皆湯征文以孔書入仲虺之誥故不録湯誥惟三月王自至于東郊告諸侯群後毋不有功于民勤力乃事豫乃大罰殛女毋豫怨曰古禹皋陶久勞于外其有功于民民乃有安東為江北為濟西為河南為淮四瀆已修萬民乃有居后稷降播農殖百穀三公咸有功于民故後有立昔蚩尤與其大夫作亂百姓帝乃弗豫有狀先王言不可不勉曰不道毋之在國女毋我怨見史記殷本紀與諸侯誓湯即天子之位與諸侯誓曰陰勝陽即謂之變而天弗施雌勝雄謂之亂而人弗行故諸侯之治政在諸侯之大夫治與從見周書殷祝政語湯曰學聖王之道者譬如其日靜思而獨居譬其若火夫舍學聖之道而靜居獨思譬其若去日之明于庭而就火之光于室也然可以小見而不可以大知見賈誼新書九湯曰藥食嘗于卑然後至于貴藥言獻于貴然後聞于卑同上又見說苑君道嫁妹辭無以天子之尊而乘諸侯無以天子之富而驕諸侯陰之從陽女之順夫本天地之義也往事爾夫必以禮義見困學紀聞一京房引湯嫁妹之詞盤銘苟日新日日新又日新見禮記大學網祝湯見設網者四面張祝曰自天下者自地出者自四方至者皆罹我網湯曰嘻盡之矣非桀其孰能如此令去三面舍一面而教之祝曰蛛蝥作網今之人循緒欲左者左欲右者右欲高者高欲下者下吾請受其犯命者見賈誼新書七又見呂氏春秋異用史記殷本紀新序五并小異桑林禱惟豫小子履敢用玄牡告于上天后曰今天大旱即當朕身履未知得罪于上下有善不敢蔽有罪不敢赦簡在帝心萬方有罪即當朕躬朕躬有罪無及萬方見墨子兼愛下下引湯說又呂氏春秋順民篇天大旱五年不收湯乃以身禱于桑林曰余一人有罪無及萬夫萬夫有罪在余一人無以一人之不敏使上帝鬼神傷民之命多末二語其為禱旱之詞可以互證而周語引湯誓曰余一人有罪無以萬夫萬夫有罪在余一人韋昭注湯誓商書伐桀之誓也今湯誓無此言則散亡矣又論語堯曰篇孔安國注此伐桀告天之文墨子引湯誓其詞若此則與墨子顯異所未詳也政不節與使民疾與宮室崇與婦謁盛與苞苴行與讒夫興與見荀子大略篇又公羊解詁二引韓詩傳說苑君道篇御覽八十三引帝王世紀小異說命高宗梁暗三年不言見尚書大傳曰以余正于四方余恐德之不類茲故不言見楚語上白公子張曰昔殷武丁能聳其德至于神明于是乎三年默以思道卿士患之曰王言以出令也若不言是無所稟令也武丁于是作書賈逵唐固曰書說命也曰若金用女作礪若津水用女作舟若天旱用女作霖雨啓乃心沃朕心若藥不瞑眩厥疾不瘳若跣不視地厥足用傷同上必交修余無余棄也同上念終始典于學見文王世子學學半見學記敬孫務時敏厥修乃來同上惟口起羞惟甲胄起兵惟衣裳在笥惟干戈省厥躬見緇衣爵無及惡德民立而正事純而祭祀是為不敬事煩則亂事神則難同上尹訓惟太甲元年十有二月乙丑朔伊尹祀于先王誕資有牧方明見漢書律曆志引伊訓天誅造攻自牧宮朕載自亳見孟子載孚在亳見堯典疏云鄭注典寶引伊訓征自三艐同上從諫而不拂微諫而不倦為上則明為下則遜見荀子臣道引書楊倞云書伊訓也四方獻令湯問伊尹曰諸侯來獻或無牛馬之所生而獻遠方之物事實相反不利今吾欲因其地勢所有而獻之本脫而字從文選左思咏史詩注引補必易得而不貴其為四方獻令伊尹受命于是為四方令曰臣請正東符婁仇州伊慮漚深九夷十蠻越漚鬋髮文身請令以魚皮之鞞𩶭鰂之醬𩶭字本空白從北堂書鈔一百四十六引補鮫瞂利劍為獻正南甌鄧桂國損子産里百濮九菌請令以珠璣𤩪瑁象齒文犀翠羽菌鶴短狗為獻正西昆侖狗國鬼親枳已闟耳貫胸雕題離丘漆齒請令以丹青白旄紕罽江歷龍角神龜為獻正北空同大夏莎車姑他旦略豹胡一作貌胡代翟胸奴樓煩月氏孅犁其龍東胡請令以橐駝白玉野馬騊駼駃騠良弓為獻湯曰善見周書王會說湯湯得伊尹祓之于廟熏以萑葦此四字本脫從風俗通祀典續漢禮儀志中注引補爝以爟火釁以犧猳明日設朝而見之說湯以至味湯曰可得本作可對從御覽八百四十九校改而為乎對曰君之國小不足以具之為天子然後可具夫三群之蟲水居者腥肉玃者燥草食者羶臭惡猶美皆有所以凡味之本水最為始五味三才九沸九變火為之紀時疾時徐滅腥去臊除羶必以其勝無失其理調和之事必以甘酸苦辛咸先後多少其齊甚微皆有自起鼎中之變精妙微纖口弗能言志弗能喻若射御之微陰陽之化四時之數故久而不弊熟而不爛甘而不噥酸而不嚛咸而不減辛而不烈淡而不薄肥而不𦞈肉之美者猩猩之唇獾獾之炙雋觾文選七命注作雋燕之翠述蕩之𢮝旄象之約流沙之西丹山之南有鳳之丸沃民所食魚之美者洞庭之鱄東海之鮞醴水之魚名曰朱鱉六足有珠百碧疑當作若碧雚水之魚名曰鰩其狀若鯉而有翼常從西海夜飛游于東海菜之美者昆侖之萍壽木之華指姑齊民要術引作括姑之東中容之國有赤木玄木之葉焉餘瞀之南南極之崖有菜其名曰嘉樹其色若碧陽華之藝云夢之芹說文作䔇具區之菁浸淵之草名曰土英和之美者陽朴之薑招搖之桂越駱之菌鱣鮪之醢大夏之鹽宰揭之露開元占經一百一作雩揭之露初學記二御覽十二作揭雩之露宋本初學記作揭萼其色如玉長澤之卵飯之美者玄山之禾不周之粟陽山之穄南海之秬水之美者三危之露昆侖之井沮江之丘名曰搖水曰山疑當作白山之水高泉之山其上有湧泉焉冀州之原果之美者沙棠之實常山之北投淵之上有百果焉群帝所食箕山之東青鳥之所有甘櫨焉江浦之橘云夢之柚漢上石耳所以致之馬之美者青龍之匹遺風之乘非先為天子不可得而具天子不可強為必先知道道者止彼在己己成而天子成天子成則至味具見呂氏春秋本味案漢志道家有伊尹五十一篇小說家有伊尹說二十七篇本注其語淺薄似依托也此疑即小說家之一篇孟子伊尹以割烹要湯謂此篇也對湯問湯問于伊尹曰欲取天下若何伊尹對曰欲取天下天下不可取可取身將先取見呂氏春秋先己湯問伊尹曰三公九卿二十七大夫八十一元士知之有道乎伊尹對曰昔者堯見人而知舜任人然後知禹以成功舉之夫三君之舉賢皆異道而成功然尚有失者況無法度而任己直意用人必大失矣故君臣自貢其能則萬一之不失矣王者何以選賢夫王者得賢材以自輔然後治也雖有堯舜之明而股肱不備則主恩不流化澤不行故明君在上慎于擇士務于求賢設四佐以自輔有英俊以治官尊其爵重其祿賢者進以顯榮罷者退而勞力是以主無遺憂下無邪慝百官能治臣下樂職恩流群生潤澤草木昔者虞舜左禹右皋陶不下堂而天下治此使能之效也見說苑君道湯問伊尹曰三公九卿大夫列士其相去何如伊尹對曰三公者知通于大道應變而不窮辨于萬物之情通于天道者也其言足以調陰陽正四時節風雨如是者舉以為三公故三公之事常在于道也九卿者不失四時通于溝渠修堤防樹五穀通于地理者也能通不能通能利不能利如是者舉以為九卿故九卿之事常在于德也大夫者出入與民同衆取去與民同利通于人事行猶舉繩不傷于言言之于世不害于身通于關梁實于府庫如是者舉以為大夫故大夫之事常在于仁也列士者知義而不失其心事功而不獨專其賞忠政強諫而無有姦詐去私立公而言有法度如是者舉以為列士故列士之事常在于義也故道德仁義定而天下正凡此四者明王臣而不名湯曰何謂臣而不名伊尹對曰君之所不名臣者四諸父臣而不名諸兄臣而不名先王之臣臣而不名盛德之士臣而不名是謂大順也見說苑臣術五行大義第二十二篇引帝王世紀湯問伊尹曰古者所以立三公九卿大夫列士者何也伊尹對曰三公者所以參王事也九卿者所以參三公也大夫者所以參九卿也列士者所以參大夫也故參而有參是謂事宗事宗不失外內若一同上仲虺之告我聞于夏人矯天命布命于下帝伐之惡龔喪厥師見墨子非命上引仲虺之告又非命中引作我聞有夏人矯天命布命于下帝式是惡用闕師又非命下引作我聞有夏人矯天命于下帝式是增用爽厥師凡三引互異諸侯自為得師者王得友者霸得疑者存自為謀而莫己若者亡見荀子堯問引中蘬之言又呂氏春秋驕恣引無霸得疑者四字亂者取之亡者侮之見左傳襄十四年引仲虺有言又襄三十年引仲虺之志同又宣十二年引仲虺有言曰取亂侮亡蓋約文
