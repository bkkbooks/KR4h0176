body:
  text: 周文王程寤文王去商在程正月既生魄太姒夢見商之庭産棘太子發取周庭之梓樹于闕閒化為松柏棫柞寤驚以告文王文王曰慎勿言乃召太子發占之于明堂王及太子發并拜吉夢受商之大命于皇天上帝見藝文類聚七十九又八十九文選石闕銘注御覽三百九十七五百三十三九百五十八又博物志八案御覽八十四引帝王世紀云十年正月文王自商至程太姒夢見商庭生棘太子發取周庭之梓樹之于闕間梓化為松柏棫柞覺而驚以告文王文王不敢占召太子發命祝以幣告于宗廟群神然後占之于明堂及發并拜吉夢遂作程寤亦據周書為說案周書度訓至文傳十七篇今見存不具録録諸篇中所載之詔告令而以程寤佚篇冠周代文之首詔牧不穀不德政事不時國家罷病不能胥匡二三子不尚助不穀官考厥職鄉問其人因其耆老及其總害慎問其故無隱乃情及某日以告于廟有不用命有常不赦見周書大匡維周王宅程三年遭天之大荒作大匡以詔牧其方詔太子發汝敬之哉民物多變民何嚮非利利維生痛痛維生樂樂維生禮禮維生義義維生仁鳴呼敬之哉民之適敗上察下遂信何嚮非私私維生抗抗維生奪奪維生亂亂維生亡亡維生死鳴呼敬之哉汝慎守勿失以詔有司夙夜勿忘若民之嚮引汝何慎非遂遂時不遠非本非標非微非輝壤非壤不高水非水不流嗚呼敬之哉倍本者槁汝何葆非監不維一葆監順時維周于民之適敗無有時蓋後戒後戒謀念勿擇見周書文警維周王告夢懼後祀之無保庚辰詔太子發告四方遊旅四方遊旅旁生欣通津濟道宿所至如歸幣租輕乃作母以行其子易資貴賤以均遊旅使無滯無粥熟無室市權內外以立均無蚤暮閭次均行均行衆從積而勿口以罰助均無使之窮平均無乏利民不淫無播蔬無食種以數度多少省用祈而不賓祭服漱不制車不雕飾人不食肉畜不食穀國不鄉射樂不牆合牆屋有補無作資農不敗務非公卿不賓賓不過具哭不留日登降一等庶人不獨葬伍有植送往迎來亦如之有不用命有常不違見周書大匡維周王宅程三年遭天之大荒于是告四方遊旅令縣鄙商旅能來三室者與之一室之祿見周書大聚乃令縣鄙商旅伐崇令毋殺人毋壞屋毋填井毋伐樹木毋動六畜有不如令者死無赦見說苑指武遺戒我稱非早一人固下修我度遵德紀我終之後恆稱太子河雒復告遵朕稱王見詩文王序疏引尚書中候文王之法有亡荒閲見左傳昭七年芋尹無宇引周文王之法注荒大也閲搜也有亡人當大搜其衆大誓唯四月太子發上祭于畢下至于孟津之上乃告司馬司徒司空諸節齊栗信哉子無知以先祖先父之有德之臣左右豫小子受先公功畢力賞罰以定厥功明于先祖之遺師行師尚父左杖黃鉞右把白旄以號曰蒼兕蒼兕總爾衆庶與爾舟楫後至者斬太子發升于舟中流白魚入于王舟王跪取入涘以燎群公咸曰休哉周公曰雖休勿休祇事不怠既渡至于五日有火自上復于下至于王屋流為雕其色赤其聲魄五至以穀俱來武王喜諸大夫皆喜周公曰茂哉茂哉天之見此以勸之也恐恃之使上附以周公書報誥于王王動色變八百諸侯不召自來不期同時不謀同辭皆曰紂可伐矣王曰爾未知天命未可伐乃還師歸見尚書大傳史記周本紀齊太公世家漢書董仲舒傳書太誓序疏引馬融書序詩大明疏思文疏閟宮疏周禮太祝疏春秋繁露同類相動篇白虎通爵篇楚詞天問注文選幽通賦舊注藝文類聚十六御覽一百四十六唯丙午王逮師前師乃鼓䵾譟師乃搯前歌後舞格于上天下地咸曰孜孜無怠天將有立父母民之有政有居見尚書大傳詩譜序疏大明疏又閟宮疏引漢律曆志周禮大司馬注說文手部御覽五百七十四引尚書大傳王乃作大誓告于衆庶今殷王紂乃用其婦人之言自絶于天毀壞其三正離蕩其王父母弟四方之多罪逋逃是宗是長是信是使乃斷棄其先祖之樂乃為淫聲用變亂正音以說婦人故今豫發唯其行天罰勖哉夫子不可再不可三見史記周本紀漢禮樂志谷永傅周公曰都懋哉豫聞古先哲王之格言見周禮太祝疏正稽古立功立事可以永年傳于亡窮丕天之大律見漢書郊祀志刑法志平當傳附下而罔上者死附上而罔下者刑與聞國政而無益于民者退在上位而不能進賢者逐見說苑臣術容齊續筆一小人見姦巧乃聞不言也發罪鈞見墨子尚同下太子發拜手稽首見周禮太祝疏于去發疑作太子發曰惡乎君子天有顯道其行甚章為鑒不遠在彼殷王謂人有命謂敬不可行謂祭無益謂暴無傷上帝不常九有以亡上帝不順祝降其喪惟我有周受之大帝見墨子非命下紂越厥夷居不肯事上帝鬼神禍厥先神禔不祀乃曰吾有民有命無僇𠏿務天亦縱之棄而弗葆見墨子非命上非命中天志中天視自我民視天聽自我民聽見孟子萬章天聰明自我民聰明見詩蒸民箋疏云大誓文民之所欲天必從之見左傳襄三十一年昭元年又周語單襄公引鄭語史伯引文王若日若月乍照光于四方于西土見墨子兼愛下獨夫紂見荀子議兵豫克紂非豫武惟朕文考無罪紂克豫非朕文考有罪惟豫小子無良見禮記坊記紂有億兆夷人亦有離德余有亂臣十人同心同德見左傳昭二十四年又略見成二年又管子法禁朕夢協朕卜龔于休祥戎商必克見周語單襄公引我武惟揚侵于之疆取彼凶殘我伐用張于湯有光見泰誓序疏馬融書序引孟子案詩大明疏引泰誓司馬在前謂他篇皆先司徒後司馬大誓獨云司馬司徒司空是在前也本非成語不録武成惟一月壬辰旁死霸若翌日癸巳武王乃朝步自周于征伐紂見漢書律曆志粵若來三月既死霸粵五日甲子咸劉商王紂同上惟四月既旁生霸粵六日庚戌武王燎于周廟翌日辛亥祀于天位粵五日乙卯乃以庶國祀馘于周廟同上血流浮杵見論衡語增案漢志引上三條與周書世浮同今此一語世浮無之知武成非即世浮也案周書柔武至五權十九篇皆武王書今見存不録立重泉戍令民自有百鼓之粟者不行見管子地數役靡令豹襜豹裘方得入朝見御覽六百九十四引管子矢栝銘肅慎氏之貢矢見魯語下昔武王克商肅慎氏貢楛矢石砮先王欲昭其令德之致遠也銘其栝席四端銘席前左端安樂必敬前右端無行可悔後左端一反一側亦不可以忘後右端所監不遠視邇所代機銘皇皇惟敬口生㖃口戕口鑒銘見爾前慮爾後盥盤銘與其溺于人也寧溺于淵溺于淵猶可緩也溺于人不可救也楹銘毋曰胡殘其禍將然毋曰胡害其禍將大毋曰胡傷其禍將長杖銘惡乎危于忿疐惡乎失道于嗜欲惡乎相忘于富貴帶銘火滅修容慎戒必恭恭則壽履屨銘慎之勞勞則富觴豆銘食自杖食自杖戒之憍憍則逃戶銘夫名難得易失無勤弗志而曰我知之乎無勤弗及而曰我杖之乎擾阻以泥之若風將至必先搖搖雖有聖人不能為謀也牖銘隨天之時以地之財敬祀皇天敬以先時劍銘帶之以為服動必行德行德則興倍德則崩弓銘屈伸之義廢興之行無忘自過矛銘造矛造矛少間弗忍終身之羞自席四端銘止此凡十七銘并見大戴禮武王阼踐衣銘桑蠶苦女工難得新捐故後必寒鏡銘以鏡自照者見形容以人自照者見吉凶案御覽五百九十引作書鏡曰以鏡自照則知吉凶即此銘傳寫有脫落耳觴銘樂極則悲沈湎致非社稷為危已上三銘并見後漢朱穆傳注引太公陰謀冠銘寵以著首將身不正遺為德咎見御覽五百九十引太公金匱書履行必慮正無懷僥幸同上書劍常以服兵而行道德行則福廢則覆見北堂書鈔一百二十二引太公金匱又御覽四百三廢上有德字書車自致者急載人者緩取欲無度自致而反見御覽五百九十引太公金匱書鋒忍之須臾乃全汝軀書刀刀利皚皚無為汝開書井源泉滑滑連旱則絶取事有常賦斂有節已上并見意林一引太公金匱几書安無忘危存無忘亡熟惟二者必後無凶杖書輔人無苟扶人無咎已上并見後漢崔駟傳注引太公金匱門書敬遇賓客貴賤無二見御覽一百八十三引太公金匱戶書出畏之入懼之鑰書昏慎守深察訛已上并見御覽一百八十四引太公金匱牖書窺望端審且念所得可思所忘見御覽一百八十八引太公金匱硯書石墨相著而黑邪心讒言無得污白見藝文類聚五十八初學記二十一御覽六百五事類賦注十五困學記聞五并引太公金匱筆書毫毛茂茂陷水可脫陷文不活見困學紀聞五引太公陰謀箠書馬不可極民不可劇馬極則躓民劇則敗見御覽三百五十九引太公陰謀卜居成周命龜豫一人兼有天下辟就百姓敢無中土乎使豫有罪則四方伐之無難得也見說苑至公案漢書婁敬傳成王營成周都洛以為此天下中諸侯四方納貢職道里鈞矣有德則易以興無德則易以亡凡居此者欲令務以德致人不欲險阻令後世驕奢以虐民也定成周惟余一人營居于成周惟余一人有善易得而見也有不善易得而誅也見呂氏春秋長利南宮括曰成王之定成周其辭云云齊魯之命女股肱周室以夾輔先王賜女土地質之以犧牲世世子孫無相害也見魯語上展禽使乙喜犒師曰昔者成王命我先君周公及齊先君太公又左傳僖二十六年引末二語伯禽告成王封伯禽為魯公召而告之曰爾知為人上之道乎凡處尊位者必以敬下順德規諫必開不諱之門撙節安靜以藉之諫者勿振以威勿格其言博采其辭乃擇可觀夫有文無武無以威下有武無文民畏不親文武俱行威德乃成既成威德民親以服清白上通巧佞下塞諫者得進忠信乃畜伯禽再拜受命而辭見說苑君道命晉文侯與鄭夾輔周室毋廢王命左傳宣十二年騂旄之盟世世無失職見左傳襄十年賜楚成王胙鎮爾南方夷越之亂無侵中國見史記楚世家告難不穀不德得罪于母弟之寵子帶鄙在鄭地汜敢告叔父見左傳僖二十四年策命晉文公王謂叔父敬服王命以綏四國糾逖王慝見左傳僖二十八年案史記晉世家載此命作王若曰父義和云云蓋誤以文侯當文公也時代縣隔司馬貞已正辨之賜齊靈公命昔伯舅太公右我先王股肱周室師保萬民世胙太師以表東海王室之不壞翳伯舅是賴今豫命汝環茲率舅氏之典纂乃祖考無忝乃舊敬之哉無廢朕命見左傳襄十四年追命衛襄公叔父陟恪在我先王之左右以佐事上帝余敢忘高圉亞圉見左傳昭七年以閻田辭于晉我自夏以后稷魏駘芮岐畢吾西土也及武王克商蒲姑商奄吾東土也巴濮楚鄧吾南土也肅慎燕亳吾北土也吾何邇封之有文武成康之建母弟以蕃屏周亦其廢隊是為豈如辨髦而因以敝之先王居檮杌于四裔以御螭魅故允姓之奸居于瓜州伯父惠公歸自秦而誘以來使逼我諸姬入我郊甸則戎焉取之戎有中國誰之咎也后稷封殖天下今戎制之不亦難乎伯父圖之我在伯父猶衣服之有冠冕木水之有本原民人之有謀主也伯父若裂冠毀冕拔木塞原專棄謀主雖戎狄其何有餘一人見左傳昭九年周甘人與晉閻嘉爭閻田晉梁丙張躍率陰戎伐潁王使詹桓伯辭于晉使告于諸侯昔武王克殷成王靖四方康王息民并建母弟以蕃屏周亦曰吾無專享文武之功且為後人之迷敗傾覆而溺入于難則振救之至于夷王王愆于厥身諸侯莫不并走其望以祈王身至于厲王王心戾虐萬民弗忍居王于彘諸侯釋位以間王政宣王有志而後效官至于幽王天不吊周王昏不若用愆厥位攜王奸命諸侯替之而建王嗣用遷郟鄏則是兄弟之能用力于王室也至于惠王天不靖周生頽禍心施于叔帶惠辟難越去王都則有晉鄭咸黜不端以綏定王家則是兄弟之能率先王之命也在定王六年秦人降妖曰周其有頿王亦克能修其職諸侯服享二世共職王室其有間王位諸侯不圖而受其亂災至于靈王生而有頿王甚神聖無惡于諸侯靈王景王克終其世今王室亂單旗劉狄剝亂天下一行不若謂先王何常之有唯余心所命其誰敢討之帥群不吊之人以行亂于王室侵欲無厭規求無度貫瀆鬼神慢棄刑法倍奸齊盟傲很威儀矯誣先王晉為不道是攝是贊思肆其罔極茲不穀震蕩播越竄在荊蠻未有攸底若我一二兄弟甥舅獎順天法無助狡猾以從先王之命毋速天罰赦圖不穀則所願也敢盡布其腹心及先王之經而諸侯實深圖之昔先王之命曰王後無適則擇立長年鈞以德德鈞以卜王不立愛公卿無私古之制也穆后及太子壽早夭即世單劉贊私立少以間先王亦唯伯仲叔季圖之見左傳昭二十六年王子朝及召氏之族毛伯得尹氏固南宮嚚奉周之典籍以奔楚王子朝使告于諸侯請城成周天子曰天降禍于周俾我兄弟并有亂心以為伯父憂我一二親昵甥舅不遑啓處于今十年勤戍五年余一人無日忘之閔閔焉如農夫之望歲懼以待時伯父若肆大惠復二文之業弛周室之憂徼文武之福以固盟主宣昭令名則余一人有大願矣昔成王合諸侯城成周以為東都崇文德焉今我欲徼福假靈于成王修成周之城俾戍人無勤諸侯用寧蝥賊遠屏晉之力也其委諸伯父使伯父實重圖之俾我一人無徵怨于百姓而伯父而榮施先王庸之見左傳昭三十二年王使大夫富辛與石張如晉請城成周虞針茫茫禹迹畫為九州經啓九道民有寢廟獸有茂草各有攸處德用不憂在帝夷羿冒于原善亡其國恤而思其麀牡武不可重用不恢于夏家獸臣司原敢告僕夫見左傳襄四年昔周辛甲之為太史也命百官官針王闕于虞人之針云云虞針如是可不懲乎武王即位策殷末孫受德迷先成湯之明侮滅神祇不祀昏暴商邑百姓其彰顯聞于昊天上帝見周書克殷解王入即位于社太卒之左尹逸策史記周本紀作尹佚策祝曰殷之末孫季紂殄廢先王明德侮蔑神祇不祀昏暴商邑百姓其章顯聞于天皇上帝齊世家作史佚策祝對成王問成王問政于尹逸曰吾何德之行而民親其上對曰使之以時而敬順之忠而愛之有令信而不食言王曰其度安在對曰如臨深淵如履薄冰王曰懼哉對曰天地之間四海之內善之則畜也不善是仇也夏殷之臣反仇桀紂而臣湯武夙沙之民自攻其主而歸神農氏此君之所明知也若何其無懼也見說苑政理史佚之志非我族類其心必異見左傳成四年遺言無始禍無怙亂無重怒見左傳僖十五年兄弟致美救乏賀善吊災祭敬喪哀情雖不同毋絶其愛親之道也見左傳文十五年因重而撫之見左傳襄十四年動莫若敬居莫若儉德莫若讓事莫若咨見周語下成王冠祝使王近于民遠于年嗇于時惠于財親賢使能見大戴禮公符又見說苑修文家語冠頌小異成王冠頌令月吉日王始加元服去王幼志服袞職欽若昊天六合是式率爾祖考永永無極見家語冠頌又說苑修文作令月吉日加子元服去爾幼志慎爾成德借筆牘書教周公社稷且危見說苑指武齊人王滿生見周公周公曰先生何以教之王滿生借筆牘書之曰云云周公仰視見書曰唯唯謹聞命矣明日誅管蔡盟諸侯于王庭要言皆獎王室無相害也有渝此盟明神殛之俾墜其師無克祚國及而玄孫無有老幼見左傅僖二十八年使人操金與書間遺昌他告昌他事可成勉成之不可成亟亡來亡來事久且泄自令身死見戰國策一昌他亡西周之東周盡輸西周之情于東周西周大怒馮旦曰臣能殺之君豫金三十斤馮旦使人操金與書間遺昌他候得而獻東周東周立殺昌他
