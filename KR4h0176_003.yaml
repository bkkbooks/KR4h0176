body:
  text: 魯周公周禮則以觀德德以處事事以度功功以食民見左傳文十八年誓命毀則為賊掩賊為藏竊賄為盜盜器為姦主藏之名賴姦之用為大凶德有常無赦在九刑不忘見左傳文十八年注誓命以下皆九刑之書九刑之書今亡卜居曲阜命龜作邑乎山之陽賢則茂昌不賢則速亡見説苑至公對武王問周武王問于王子旦曰敢問治有必成而戰有必勝乎攻有必得而守有必存乎王子旦對曰有政曰諸侯政平于內而威于外矣君子行修于身而信于輿人矣治民民治而榮于名矣故諸侯凡有治心者必修之以道而與之以敬然後能以成也凡有戰心者必修之以政而興之以義然後能以勝也凡有攻心者必結之以約而諭之以信然後能有得也凡有守心者必固之以和而諭之以愛然後能有存也周武王曰受命矣見賈誼新書修政語下四內盟加富三等就官一列見呂氏春秋誠廉武王使叔旦就膠鬲于次四內而與之盟注四內地名禱書王少未有識姦神命者乃旦也見史記魯周公世家初成王病周公乃自揃其蚤沉之河以祝于神云云亦藏其策于府及周公奔楚成王發府見禱書乃泣反周公王未有識是旦執事有罪殃旦受其不祥見史記蒙恬傳公旦自揃其爪以沉于河云云乃書而藏之記府成王觀于記府得周公旦沉書案即書金縢事書謂代武王史謂代成王為異禱請山川辭方今大旱野無生稼寡人當死百姓何依不敢煩民請命願撫萬民以身塞無狀見穀梁成八年疏又定元年注又見後漢郎顗傳注小異以書授莒僕呂夫莒太子不憚以吾故殺其君而以其寶來其愛我甚矣為我子之邑今日必授無逆命矣見魯語上莒太子僕弒紀公以其寶來奔宣公使僕人以書命季文子命孔子為司寇宋公之子弗甫有孫魯孔丘命爾為司寇見韓詩外傳八歸齊國書元置書篋上天若不識不衷何以使下國見左傳哀十一年孔子誄昊天不吊不憖遺一老俾屏余一人以在位煢煢余在疚鳴呼哀哉尼父無自律見左傳哀公十六年又見史記孔子世家作毋自天不遺耆老莫相豫位焉嗚呼哀哉尼父見禮記檀弓在齊密遺魯公書斂小器投諸台食獵犬組羊裘琴之合甚思之臧我羊羊有母食我以同魚冠纓不足帶有餘見列女傳三臧孫母者魯大夫臧文仲之母也文仲之齊齊拘之欲襲魯文仲使人遺魯公書恐得其書乃謬其辭云云召母語之盟從者載書戮力一心好惡同之信罪之有無繾綣從公無通外內見左傳昭二十五年戒子吾欲室之俠于兩社之間也使吾後世有不能事上者使其替之益速見説苑至公璽書告取卞聞守卞者將叛臣帥徒以討之既得之矣敢告見左傳襄二十九年季武子取卞使公冶問璽書追而與之卞人將畔臣討之既得之矣見魯語下以書告叔孫豹殯子固欲毀中軍既毀之矣故告見左傳昭五年盟臧氏無或如臧孫紇干國之紀犯門斬關見左傳襄二十三年被拘以爪鋟饋器版某月某日將殺我于蒲力能救我則于是見公羊傳定八年陽虎專季氏拘季孫孟氏與叔孫氏迭而食之餓而以爪鋟饋器之版更魯公書逐莒僕夫莒太子殺其君竊其寶來不識窮固又求自邇為我流于夷今日必通無逆命矣見魯語上宣公使僕人以書命季文子為我子之邑里革遇之而更其書為魯哀公下救火令不救火者比降北之罪逐獸者比入禁之罪見韓非子內儲説上魯人燒積澤天北風火南倚恐燒國哀公懼于是仲尼乃下令觀吳季札之子葬題字于乎有吳延陵君子之葬見碑拓本又見淳化帖絳帖字數次第不同季子聘上國喪子于嬴博之間見檀弓此蓋孔子使子貢觀葬後題字讀此當以于乎句有吳延陵君句子之葬句唐宋人不識篆文釋葬為墓非也命齊太公五侯九伯女實征之以夾輔周室見左傳僖四年共頭盟世為長侯守殷常祀相奉桑林宜私孟諸見呂氏春秋誠廉武王又使保召公就微子開于共頭之下而與之盟以書讓樂毅且謝之先王舉國而委將軍將軍為燕破齊報先王之仇天下莫不振動寡人豈敢一日而忘將軍之功哉會先王棄群臣寡人新即位左右誤寡人寡人之使騎劫代將軍者為將軍久暴露于外故召將軍且休計事將軍過聽以與寡人有郤遂捐燕而歸趙將軍自為計則可矣而亦何以報先王之所以遇將軍之意乎見戰國策三十史記樂毅傳以書謝樂間寡人不佞不能奉順君意故君捐國而去則寡人之不肖明矣敢端其願而君不肯聽故使使者陳愚意君試論之語曰仁不輕絶智不輕怨君之于先王也世之所明知也寡人望有非則君掩蓋之不虞君之明罪之也望有過則君教誨之不虞君之明罪之也且寡人之罪國人莫不知天下莫不聞君微出明怨以棄寡人寡人必有罪矣雖然恐君之未盡厚也諺曰厚者不毀人以自益也仁者不危人以安名以故掩人之邪者厚人之行也救人之過者仁者之道也世有掩寡人之邪救寡人之過非君心所望之今君厚受位于先王以成尊輕棄寡人以快心則掩邪救過難得于君矣且世有薄于故厚施行有失而故惠用今使寡人任不肖之罪而君有失厚之纍于為君擇之也無所取之國之有封疆猶家之有垣牆所以合好掩惡也室不能相和出語鄰家未為通計也怨惡未見而明棄之未盡厚也寡人雖不肖乎未如殷紂之亂也君雖不得意乎未如商容箕子之纍也然則不內蓋寡人而明怨于外恐其適足以傷于高而薄于行也非然也苟可以明君之義成君之高雖任惡名不難受也本欲以為明寡人之薄而君不得厚揚寡人之辱而君不得榮此一舉兩失之也義者不虧人以自益況傷人以自損乎願君無以寡人不肖纍往事之美昔者柳下惠吏于魯三黜而不去或謂之曰可以去柳下惠曰苟與人之異惡往而不黜乎猶且黜乎寧于故國爾柳下惠不以三黜自纍故前業不忘不以去為心故遠近無議今寡人之罪國人未知而議寡人者遍天下語曰論不修心議不纍物仁不輕絶智不簡功棄大功者輟也輕絶厚利者怨也輟而棄之怨而纍之宜在遠者不望之乎君也今以寡人無罪君豈怨之乎願君捐怨追維先王復以教寡人意君曰余且慝心以成而過不顧先王以明而惡使寡人進不得修功退不得寡過君之所揣也唯君圖之此寡人之愚意也敬以書謁之見戰國策三十一又見新序雜事篇作遺樂毅書文亦小異遺樂間書紂之時箕子不用犯諫不怠以冀其聽商容不達身祇辱焉以冀其變及民志不入獄囚自出然後二子退隱故紂負桀暴之纍二子不失忠聖之名何者其憂患之盡矣今寡人雖愚不若紂之暴也燕民雖亂不若殷民之甚也室有語不相盡以告鄰里二者寡人不為君取也見史記樂毅傳與傅麴武書丹不肖生于僻陋之國長于不毛之地未嘗得睹君子雅訓達人之道也然鄙意欲有所陳幸傅垂覽之丹聞丈夫所恥恥受辱以生于世也貞女所羞羞見劫以虧其節也故有刎喉不顧據鼎不避者斯豈樂死而忘生哉其心有所守也今秦王反戾天常虎狼其性行遇丹無禮為諸侯最丹每念之痛入骨髓計燕國之衆不能敵之曠年相守力固不足欲收天下之勇士集四海之英雄破國空藏以奉養之重幣甘辭以市于秦秦貪我賂而信我辭則一劍之任可當百萬之師須臾之間可解丹萬世之恥若其不然今丹生無面目于天下死懷恨于九泉必令諸侯無以為嘆易水之北未知誰有此蓋亦子大夫之恥也謹遣書願熟思之見燕丹子令軍中環畫邑三十里無入見史記田單傳燕之初入齊聞畫邑人王蠋賢令軍中獻書報燕王臣不佞不能奉承先王之教以順左右之心恐抵斧質之罪以傷先王之明而又害于足下之義故遁逃奔趙自負以不肖之罪故不敢為辭説今王使使者數之罪臣恐侍御者之不察先王之所以畜幸臣之理而又不白于臣之所以事先王之心故敢以書對臣聞賢聖之君不以祿私其親功多者授之不以官隨其愛能當之者處之故察能而授官者成功之君也論行而結交者立名之士也臣以所學者觀之先王之舉錯有高世之心故假節于魏王而以身察于燕先王過舉擢之乎賓客之中而立之乎群臣之上不謀于父兄而使臣為亞卿臣自以為奉令承教可以幸無罪矣故受命而不辭先王命之曰我有積怨深怒于齊不量輕羽而欲以齊為事臣對曰夫齊霸國之餘教也而驟勝之遺事也間于兵甲習于戰攻王若欲攻之則必舉天下而圖之舉天下而圖之莫徑于結趙矣且又淮北宋地楚魏之所同願也趙若許約楚魏宋盡力四國攻之齊可大破也先王曰善臣乃口受令具符節南使臣于趙上之軍奉令擊齊大勝之輕卒鋭兵長驅至國齊王逃遁走莒僅以身免珠玉財寶車甲珍器盡收入燕大呂陳于元英故鼎反于歷室齊器設于寧台薊丘之植植于汶皇自五伯以來功未有及先王者也先王以為愜其志以臣為不頓命故裂地而封之使之得比乎小國諸侯臣不佞自以為奉令承教可以幸無罪矣故受命而弗辭臣聞賢明之君功立而不廢故著于春秋蚤知之士名成而不毀故稱于後世若先王之報怨雪恥夷萬乘之強國收八百歲之蓄積及至棄群臣之日餘令詔後嗣之遺義執政任事之臣所以能循法令順庶孽者施及萌隸皆可以教于後世臣聞善作者不必善成善始者不必善終昔者五子胥説聽乎闔閭故吳王遠迹至于郢夫差弗是也賜之鴟夷而浮之江故吳王夫差不悟先論之可以立功故沉子胥而不悔子胥不蚤見主之不同量故入江而不改夫免身全功以明先王之迹者臣之上計也離毀辱之非墮先王之名者臣之所大恐也臨不測之罪以幸為利者義之所不敢出也臣聞古之君子交絶不出惡聲忠臣之去也不潔其名臣雖不佞數奉教于君子矣恐侍御者之親左右之説而不察疏遠之行也故敢以書報唯君之留意焉見戰國策三十又見史記又見新序雜事小異報燕太子書臣聞快于意者虧于行甘于心者傷于性今太子欲滅涓涓之恥除久久之根此實臣所當糜軀碎首而不避也私以為智者不冀僥幸以要功明者不苟從志以順心事必成然後舉身必安而後行故發無失舉之尤動無蹉跌之愧也太子貴匹夫之勇信一劍之任而欲望功臣以為疏臣願合從于楚并勢于趙連衡韓魏然後圖秦秦可破也且韓魏與秦外親內疏若有倡兵楚乃來應韓魏必從其勢可見令臣計從太子之恥除愚鄙之纍解矣太子慮之見燕丹子耄針自卿以下至于師長士苟在朝者無謂我老耄而舍我必恭恪于朝朝夕以交戒我聞一二之言必誦志而納之以訓導我楚語上昔衛武公年數九十有五矣猶針警于國戰禱曾孫蒯聵敢昭告皇祖文王烈祖康叔文祖襄公鄭勝亂從晉午在難不能治亂使鞅討之蒯聵不敢自佚備持矛焉敢告無絶筋無折骨無面傷以集大事無作三祖羞大命不敢請佩玉王敢愛見左傳哀二年曾孫蒯聵以諄趙鞅之故敢昭告于皇祖文王烈祖康叔文祖襄公昭考靈公夷請無筋無骨無面傷無敗用無隕懼死不敢請見晉語九以滅邢功為銘余掖殺國子莫余敢止見左傳僖二十五年衛侯燬滅邢同姓也故名禮至為銘案衛侯衛文公也邢周公后齊桓公存三亡國邢衛居其二禮至昆弟為衛偽往仕邢殺邢守國子而滅邢文公之狡詐如是後三年晉修不禮之怨衛幾亡其死後餘殃又如是儒者言文公有道然乎哉宛濮盟天禍衛國君臣不協以及此憂也今天誘其衷使皆降心以相從也不有居者誰守社稷不有行者誰扞牧圉不協之故用昭乞盟于爾大神以誘天衷自今日以往既盟之後行者無保其力居者無懼其罪有渝此盟以相及也明神先君是糾是殛見左傳僖二十八年晉人復衛侯寧武子與衛人盟于宛濮鼎銘六月丁亥公假于太廟公曰叔舅乃祖莊叔左右成公成公乃命莊叔隨難于漢陽即宮于宗周奔走無射啓右獻公獻公乃命成叔纘乃祖服乃考文叔興舊耆欲作率慶士躬恤衛國其勤公家夙夜不懈民咸曰休哉公曰叔舅豫女銘若纘乃考服悝拜稽首曰對揚以辟之勤大命施于蒸彝鼎見禮記祭統此衛孔悝之鼎銘也注莊公蒯瞶德孔悝立己故因至廟禘祭賜銘以褒顯其先世也案銘文悝拜稽首曰對揚以辟之勤大命必恐誤釋以鍾鼎詞例校之當是悝拜稽首敢對揚乃辟之勤大命鄭承舊誤未及是正耳為蒯聵告即位于周蒯聵得罪于君父君母逋竄于晉晉以王室之故不棄兄弟置諸河上天誘其衷獲嗣守封焉使下臣肸敢告執事見左傳哀十六年遺荊將衛君書兩軍相當兩旗相望唯毋一戰戰必不兩存此乃兩主之事也與子無有私怨善者相避也見韓非子內儲説下
