body:
  text: 晉惠公在梁遺里克書誠得立請遂封子于汾陽之邑見史記晉世家韓誓失次犯令死將止不面夷死偽言誤眾死見晉語三合諸侯盟吾聞國之昏不由聲色必由奸利好樂聲色者淫也貪奸者惑也夫淫惑之國不亡必殘自今以來無以美妾疑妻無以聲樂妨正無以奸情害公無以貨利示下其有之者是謂伐其根荄流于華葉若此者有患無憂有寇勿弭不如言者盟示之見說苑反質踐土盟凡我同盟各復舊職見左傳定元年薛宰引晉文公為踐土之盟又襄二十五年子產引城濮之役布命曰各復舊職踐土載書王若曰晉重魯申衛武蔡甲午鄭捷齊潘宋王臣莒期見左傳定四年祝佗引晉文公為踐土之盟其載書云云案踐土之盟尹氏王子虎在焉故稱王命令毋淫宮室以妨人宅板築以時無奪農功見說苑建本以殺三郤辭于欒書中行偃寡人有討于郤氏郤氏既伏其辜矣大夫無辱其復職位見左傳成十七年授鄭公孫段策子豐有勞于晉國余聞而弗忘賜女州田以胙乃舊勳見左傳昭三年逐欒盈下令國人自文公以來有力于先君而子孫不立者將授立之得之者賞見晉語八令國中欲有諫者為隱左右言及國吏罪見說苑善說上書獻公草茅臣東郭民祖朝願請聞國家之計見說苑善說懸書宮門龍欲上天五蛇為輔龍已升雲四蛇各入其宇一蛇獨怨終不見處所見史記晉世家文公反國賞從亡者介子推不言祿祿亦不及與其母偕隱從者憐之乃懸書宮門有龍矯矯頃失其所五蛇從之周遍天下龍飢無食一蛇割股龍反其淵安其壤土四蛇入穴皆有處所一蛇無穴號于中野見說苑復恩文公即位賞不及推至死不復見推從者憐之乃懸書宮門案呂氏春秋新序琴操并作歌其詞互異說苑復恩又載此為舟之僑陳辭蓋同一事而三說不同故于新序存一說于說苑并列兩說不能定斷其孰是也發命于軍歸老幼反孤疾二人役歸一人簡兵蒐乘秣馬蓐食師陳焚次明日將戰見左傳襄二十六年聲子曰彭城之役晉楚遇于靡角之谷雍子發命于軍案彭城之役在成十八年自晉遺楚子重子反書爾以讒慝貪惏事君而多殺不辜余必使爾罷于奔命以死見左傳成七年與楚盟宋西門外凡晉楚無相加戎好惡同之同恤菑危備救凶患若有害楚則晉伐之在晉楚亦如之交贄往來道路無壅謀其不協而討不庭有渝此盟明神殛之俾隊其師無克胙國見左傳成十二年同盟于亳載書凡我同盟毋蘊年毋壅利毋保奸毋留慝救災患恤禍亂同好惡獎王室或間茲命司慎司盟名山名山群神群祀先王先公七姓十二國之祖明神殛之俾失其民隊命亡氏踣其國家見左傳襄十一年同盟于戲載書自今日既盟之後鄭國而不唯晉命是聽而或有異志者有如此盟見左傳襄九年伐鄭令于諸侯修器備盛餱糧歸老幼居疾于虎牢肆眚圍鄭見左傳襄九年棫林令雞鳴而駕塞井夷灶唯余馬首是瞻見左傳襄十四年禱河齊環怙恃其險負其眾庶棄好背盟陵虐神主曾臣彪將率諸侯以討焉其官臣偃實先後之苟捷有功無作神羞官臣偃無敢復濟唯爾有神裁之見左傳襄十八年督揚盟大毋侵小見左傳襄十九年詒鄭子產書始吾有虞于子今則已矣昔先王議事以制不為刑辟懼民之有爭心也猶不可禁御是故閑之以義糾之以政行之以禮守之以信奉之以仁制為祿位以勸其從嚴斷刑罰以威甚淫懼其未也故海之以忠聳之以行教之以務使之以和臨之以敬涖之以強斷之以剛猶求聖哲之上明察之官忠信之長慈惠之師民于是乎可任使也而不生禍亂民知有辟則不忌于上并有爭心以征于書而徼幸以成之弗可為矣夏有亂政而禹刑商有亂政而作湯刑周有亂政而作九刑三辟之興皆叔世也今吾子相鄭國作封洫立謗政制參辟鑄刑書將以靖民不亦難乎詩曰儀式刑文王之德日靖四方又曰儀刑文王萬邦作孚如是何辟之有民知爭端矣將棄禮而征于書錐刀之末將盡爭之亂獄滋豐賄賂并行終子之世鄭其敗乎肸聞之國將亡必多制其此之謂乎見左傳昭六年鄭人鑄刑書叔向使詒子產書詐為萇弘賣周書萇弘謂叔向曰子為我謂晉君所與君期者時可矣何不亟以兵來見韓非子內儲說下叔向之讒萇弘也為書曰萇弘謂叔向云云因佯遺其書周以萇弘為賣周也乃殺之萇弘謂叔向曰子起晉國之兵以攻周吾廢劉氏而立單氏見說苑權謀案左傳載叔向事迄于昭十五年晉滅羊舌氏在昭二十八年周殺萇弘在哀三年詎是時叔向尚在乎諸子與經傳不必盡合奔楚過周辭于周行人天子陪臣盈得罪于王之守臣將逃罪罪重于郊甸無所伏竄敢布其死昔陪臣書能輸力于王室王施惠焉其子黶不能保任其父之勞大君若不棄書之力亡臣猶有所逃若棄書之力而思黶之罪臣戮餘也將歸死于尉氏不敢還矣敢布四體唯大君命焉見左傳襄二十一年欒盈過于周周西鄙掠之辭于行人王使司徒禁掠欒氏者對問大業之後為祟大業之後在晉絕祀者其趙氏乎夫自中衍者皆嬴姓也中衍人面鳥噣降佐殷帝大戊及周天子皆有明德下及幽厲無道而叔帶去周適晉事先君文侯至于成公世有立功未常絕祀今吾君獨滅趙宗國人哀之故見龜策唯君圖之見史記趙世家晉景公疾卜之大業之後不遂者為祟景公問韓厥厥知趙孤在乃曰君臣明君治國而晦晦而行行而止止三寸之機運而天下定方寸之基正而天下治故一言正而天下定一言倚而天下靡見藝文類聚十九意林二太平御覽三百九十又六百二十四大體夫一婦擅夫眾婦皆亂一臣專君群臣皆蔽故妬妻不難破家也而亂臣不難破國也是以明君使其臣并進輻湊莫得專君焉今人君之所以高為城郭而謹門閭之閉者為寇戎盜賊之至也今夫弒君而取國者非必踰城郭之險而犯門閭之閉也蔽君之明塞君之聽奪之政而專其令有其民而取其國矣見群書治要又見長短經大體又略見意林智均不相使力均不相勝見意林今使烏獲彭祖負千鈞之重而懷琬琰之美令孟賁成荊帶干將之劍衛之行乎幽道則盜猶偷之矣今人君之力非賢乎烏獲彭祖而勇非賢乎孟賁成荊也其所守者非特琬琰之美千鈞之重也而欲勿失其可得耶明君如身臣如手君若號臣如嚮君設其本臣操其末君治其要臣行其詳君操其柄臣事其常為人臣者操契以責其名名者天地之綱聖人之符張天地之綱用聖人之符則萬物之情無所逃之矣故善為主者倚于愚立于不盈設于不敢藏于無事竄端匿疏示天下無為是以近者親之遠者懷之示人有餘者人奪之示人不足者人與之剛者折危者覆動者搖靜者安名自正也事自定也是以有道者自名而正之隨事而定之也鼓不與于五音而為五音主有道者不為五官之事而為治主君知其道也臣知其事也十言十當百為百當者人臣之事也非君人之道也昔者堯之治天下也以名其名正則天下治桀之治天下也亦以名其名倚而天下亂是以聖人貴名之正也主處其大臣處其細以其名聽之以其名視之以其名命之鏡設精無為而美惡自備衡設平無為而輕重自得凡因之道身與公無事無事而天下自極也見群書治要又見長短經反經又略見意林初學記二十五已下篇名缺百世有聖人猶隨踵戰國策十此下有而至二字千里有賢者是比肩而立也見藝文類聚二十意林御覽四百二已上申子原次如此已下各書引見不得原次有天下而不恣睢命之曰以天下為桎梏見史記李斯傳長短經是非案此申子謂亡王如此耳魏志高堂隆上疏引之責李斯不正諫天道無私是以恆正天道常正是以清明北堂書鈔一百四十九藝文類聚一御覽一地道不作是以常靜地道常靜是以正方舉事為之乃有恆常之靜者符信受令必行也見北堂書鈔一百五十七君必有明法正義若懸權衡以稱輕重所以一群臣也見藝文類聚五十四文選顏延年讌華林詩注又鄒陽上書吳王注御覽六百三十八堯之治也蓋明法審令而已聖君任法而不任智任數而不任說黃帝之治天下置法而不變使民安樂其法也見藝文類聚五十四御覽六百三十八君之所以尊者令令不行是無君也故明君慎令見藝文類聚五十四昔七十九代之君法制不一號令不同然而俱王天下何也必當國富而粟多也見藝文類聚五十四御覽六百三十八四海之內六合之間曰奚貴曰貴土土食之本也見御覽三十七上書秦王韓事素三十餘年出則為扞蔽入則為席薦秦特出稅師耳韓地而隨之怨懸于天下功歸于強秦且夫韓入貢職與邵懸無異也今曰臣竊聞貴臣之計舉兵將伐韓夫趙氏聚士卒養從徒欲贅天下之兵明秦不弱則諸侯必滅宗廟欲西面行其意非一日之計也今釋趙之患而攘內臣之韓則天下明趙氏之計矣夫韓小國也而以應天下四擊主辱臣苦上下相與同憂久矣修守備戒強敵有蓄積築城池以守固今伐韓未可一年而滅拔一城而退則權輕于天下天下摧我兵矣韓叛則魏應之趙據齊以為原如此則以韓魏資趙假齊以固其從而以與爭強趙之福而秦之禍也夫進而擊趙不能取退而攻韓弗能拔則陷銳之卒懃于野戰負任之旅罷于內攻則合群苦弱以敵而共二萬乘非所以亡趙之心也均如貴人之計則秦必為天下兵質矣陛下雖以金石相弊則兼天下之日未也今賤臣之進愚計使人使荊重幣用事之臣明趙之所以欺秦者與魏質以安其心從韓而伐趙趙雖與齊為一不足患也二國事畢則韓可以移書定也是我一舉二國有亡形則荊魏又必自服矣故曰兵者凶器也不可不審用也以秦與趙敵衡加以齊今又背韓而未有以堅荊魏之心夫一戰而不勝則禍構矣夫一動而弱于諸侯危事也為計而使諸侯有意伐之心至殆也見二疏非所以強于諸侯也臣竊願陛下之幸熟圖之夫攻伐而使從者聞焉不可悔也見韓非子存韓案下文云詔以韓客之所上書書言韓之未可舉下臣斯明此篇是書韓非子佚文四千五百六十歲為一元元中有厄故聖人有九歲之畜以備之也見續漢律曆志下注補引授僕人書日君乏使使臣斯司馬臣聞師眾以順為武軍事有死無犯為敬君合諸侯臣敢不敬君師不武執事不敬罪莫大焉臣懼其死以及揚干無所逃罪不能致訓至于用鉞臣之罪重敢有不從以怒君心請歸死于司寇見左傳襄三年臣誅于揚干不忘其死日君乏使使臣狃中軍之司馬臣聞師眾以順為武軍事有死無犯為敬君合諸侯臣敢不敬君不說請死之見國語十三下令軍中父子俱在軍中父歸兄弟俱在軍中兄歸獨子無兄弟歸養見史記信陵君傳公子將晉鄙軍勒兵下令軍中習射令人之有孤疑之訟者令之射的中之者勝不中者負見韓非子內儲說上李悝為上地守欲人之善射也乃下令云云令下而人皆疾習射與秦人戰大敗之為魏文侯作盡地力之教地方百里提封九萬頃除山澤邑居參分去一為田六百萬畝治田勤謹則畝益三升不勤則損亦如之地方百里之增減輒為粟一百八十萬石矣糴甚貴傷民甚賤傷農民傷則離散農傷則國貧故甚貴與甚賤其傷一也善為國者使民毋傷而農益勸今一夫挾五口治田百畝歲收畝一石半為粟百五十石除十一之稅十五石餘百三十五石食人月一石半五人終歲為粟九十石餘有四十五石石三十為錢千三百五十除社閭嘗新春秋之祠用錢三百餘千五十衣人率用錢三百五人終歲用千五百不足四百五十不幸疾病死喪之費及上賦斂又未與此此農夫所以常困有不勸耕之心而令糴至于甚貴者也是故善平糴者必謹觀歲有上中下孰上孰其收自四餘四百石中孰自三餘三百石下孰自倍餘百石小飢則收百石中飢七十石大飢三十石故大孰則上糴三而舍一中孰則糴二下孰則糴一使民適足賈平則止小飢則發小孰之所斂中飢則發中孰之所斂大飢則發大孰之所斂而糴之故雖遇飢饉水旱糴不貴而民不散取有餘以補不足也見漢書食貨志獻書魏王臣聞趙王以百里之地請殺痤之身夫殺無罪范痤痤薄故也而得百里之地大利也臣竊為大王美之雖然而有一焉百里之地不可得而死者不可復生也則主必為天下笑矣臣竊以為與其以死人市不若以生人市便也見戰國策二十一趙王使人以百里之地請殺范痤于魏魏王許諾范痤獻書魏王又遺其後相信陵君書夫趙魏敵戰之國也趙以咫尺之書來而魏王輕為之殺無罪痤痤雖不肖故魏之免相望也嘗以魏之故得罪于趙夫國內無用臣外雖得地勢不能守然今能守魏者若如君矣王聽趙殺痤之後強秦襲趙之欲倍趙之割則君將何以止之也此君之累也見戰國策二十一又略見史記又略見說苑善說與商人盟誓爾無我叛我無強賈毋或匄奪爾有利市寶賄我勿與知見左傳昭十六年城潁誓不及黃泉無相見也見左傳隱元年令國中有能還吳軍者吾與分國而治見吳越春秋闔廬內傳四使執訊與趙盾書寡君即位三年召蔡侯而與之事君九月蔡侯入于敝邑以行敝邑以侯宣多之難寡君是以不得與蔡侯偕十一月克滅侯宣多而隨蔡侯以朝于執事十二年六月歸生佐寡君之嫡夷以請陳侯于楚而朝諸君十四年七月寡君又朝以蕆陳事十五年五月陳侯自敝邑往朝于君往年正月燭之武往朝夷也八月寡君又往朝以陳蔡之密邇于楚而不敢貳焉則敝邑之故也雖敝邑之事君何以不免在位之中一朝于襄而再見于君夷與孤之二三臣相及于絳雖我小國則蔑以過之矣今大國曰爾未逞吾志敝邑有亡無以加焉古人有言曰畏首畏尾身其餘幾又曰鹿死不擇音小國之事大國也德則其人也不德則其鹿也鋌而走險急何能擇命之罔極亦知亡矣將悉敝賦以待于鯈唯執事命之文公二年六月壬申朝于齊四年二月壬戌為齊侵蔡亦獲成于楚居大國之間而從于強令豈其罪也大國若弗圖無所逃命見左傳文十七年以從楚告于晉君命敝邑修而車賦儆而師徒以討亂略蔡人不從敝邑之人不敢寧處悉索敝賦以討于蔡獲司馬燮獻于邢丘今楚來討曰女何故稱兵于蔡焚我郊保馮陵我城郭敝邑之眾夫婦男女不遑啟處以相救也翦焉傾覆無所控告民死亡者非其父兄即其子弟夫人愁序不知所庇民佑窮困而受盟于楚孤也與其二三臣不能禁止不敢不告見左傳襄八年子駟曰請從楚騑也受其咎乃及楚平使王子伯駢告于晉案上文及九年盟戲載書知此為子駟之詞稱孤者假君命是時鄭簡公僅六歲子駟當國攝君事同盟于戲載書天禍鄭國使介居二大國之間大國不加德音而亂以要之使其鬼神不獲歆其禋祀其民人不獲享其土利夫婦辛苦墊隘無所底告自今日既盟之後鄭國而不唯有禮與強可庇民者是從而敢有異志者亦如之見左傳襄九年同盟于戲晉士莊子為載書公子騑趨進曰云云荀偃曰改載書注子駟亦以所言載于策故欲改之以服晉告于楚孤以社稷之故不能懷君君若能以玉帛綏晉不然則武震以攝威之孤之願也見左傳襄十一年鄭人使良霄太宰石㚟如楚告將服于晉案襄十年盜殺子駟而子孔當國攝君事服晉乃子展主謀此蓋子展之詞稱孤者假君命是時鄭簡公僅九歲寓書以告士匄子為晉國四鄰諸侯不聞令德而聞重幣僑也惑之僑聞君子長國家者非無賄之患而無令名之難夫諸侯之賄聚于公室則諸侯貳若吾子賴之則晉國貳諸侯貳則晉國壞晉國貳則子之家壞何沒沒也將焉用賄夫令名德之輿也德國家之基也有基無壞無亦是務乎有德則樂樂則能久詩云樂只君子邦家之基有令德也夫上帝臨女無貳爾心有令名也夫恕思以明德則令名載而行之是以遠至邇安毋寧使人謂子子實生我而謂子浚我以生乎象有齒以焚其身賄也見左傳襄二十四年范宣子為政諸侯之幣重子產寓書于子西以告宣子復叔向書若吾子之言僑不才不能及子孫吾以救世也既不承命敢忘大惠見左傳昭六年鄭人鑄刑書叔向使詒子產書復書
