body:
  text: 吳王闔廬作金鉤令能為善鉤者賞之百金見吳越春秋闔閭內傳四下令孫武寡人已知將軍能用兵矣寡人非此二姬食不甘味願勿斬也見史記孫武傳又吳越春秋闔閭內傳四禮越王令今日為越王陳北面之坐群臣以客禮事之見吳越春秋勾踐入臣外傳七吳王疾愈大縱酒于文臺出令輸越粟令寡人逆群臣之議而輪于越年豐而歸寡人見吳越春秋勾踐陰謀外傳九免衛君令比十日而衛君之禮不具者死見淮南子人間訓伐齊令寡人伐齊有敢諫者死見吳越春秋夫差內傳五告諸大夫孤將有大志于齊吾將許越成而無拂吾慮若越既改吾又何求若其不改反行吾振旅焉見吳語告勞于周昔者楚人為不道不承共王事以遠我一二兄弟之國吾先君闔閭不貰不忍被甲帶劍挻鈹搢鐸以與楚昭王毒逐于中原柏舉天舍其衷楚師敗績王去其國遂至于郢王總其百執事以奉其社稷之祭其父子昆弟不相能夫概王作亂是以復歸于吳今齊侯任不鑒于楚又不承共王命以遠我一二兄弟之國夫差不貰不忍被甲帶劍挻鈹搢鐸遵汶伐博簦笠相望于艾陵天舍其衷齊師還夫差豈敢自多文武實舍其衷歸不稔于歲余沿江溯淮闕溝深水出于商魯之間以徹于兄弟之國夫差克有成事敢使苟告于下執事見吳語矢書射文種蠡軍吾聞狡兔以死良犬就烹敵國如滅謀臣必亡今吳病矣大夫何慮乎見吳越春秋夫差內傳五江上丈人祝江上之丈人天地至大矣至衆矣將奚不有為也而無以為為矣而無以為之名不可得而聞身不可得而見其惟江上之丈人乎見呂氏春秋異寶水戰法大翼一艘廣一丈五尺二寸長十丈中翼一艘廣一丈三尺五寸長九丈六尺小翼一艘廣一丈二尺長九丈見文選顏延年車駕幸京口侍游曲阿後湖詩注大翼一艘長十丈中翼一艘長九丈六尺小翼一艘長九丈見文選張協七命注引越絶書伍子胥水戰兵法內經水戰法大翼一艘廣丈六尺長十二丈容戰士二十六人棹五十人舳艫三人操長鉤矛斧者四吏僕射長各一人凡九十一人當用長鉤矛長斧各四弩各三十二矢三千三百甲兜鍪各三十二見御覽三百十五引越絶書伍子胥水戰法令隊長一鼓皆振二鼓操進三鼓為戰形吳越春秋闔閭內傳四算經序孫子曰夫算者天地之經緯群生之元用五常之本末陰陽之父母星辰之建號三光之表裏五行之准平四時之終始萬物之祖宗六藝之綱紀稽群倫之聚散考二氣之降升推寒暑之迭運步遠近之殊同觀天道精微之兆基察地理從橫之長短采神祗之所在極成敗之符驗窮道德之理究性命之情立規矩准方員謹法度約尺丈立權衡平重輕剖豪氂折黍絫歷億載而不巧施八極而無疆散之不可輕究斂之不盈掌握向之者富有餘背之者貧且窶心開者幼冲而即悟意閉者皓首而難精夫欲學之者必務量能揆已志在所專如是則焉有不成者哉見孫子算經聚珍本案隋志孫子算經二卷今本三卷其書有長安洛陽及佛書二十九章等語蓋後人有增加也朱彝尊等皆謂是孫武書故録之案孫子兵法十三篇見存不録録其佚文兵法孫子曰地多陷曲曰天井見御覽一百八十九孫子曰故曰深草蓊穢者所以逃遁也深谷險阻者所以禦車騎也隘塞山林者所以少擊衆也沛澤杳冥者所以匿其形也見通典一百五十九案深草已下皆六韜奇兵篇文孫子引申之吳王問孫武曰散地士卒顧家不可與戰則必固守不出若敵攻吾小城掠吾田野禁吾樵采塞吾要道待吾空虛而急來攻則如之何武曰敵人深入吾都多背城邑士卒以軍為家專志輕鬥吾兵在國安土懷生以陳則不堅以鬥則不勝當集人合衆聚穀蓄帛保城備險遣輕兵絶其糧道彼挑戰不得轉輸不至野無所掠三軍困餒因而誘之可以有功若欲野戰則必因勢依險設伏無險則隱于天氣陰晦昏霧出其不意龔其懈怠可以有功見通典一百五十九孫子九地篇何延錫注吳王問孫武曰吾至輕地始入敵境士卒思還難進易退未背險阻三軍恐懼大將欲進士卒欲退上下異心敵守其城壘整其車騎或當吾前或擊吾後則如之何武曰軍至輕地士卒未專以入為務無以戰為故無近其名城無由其道路設疑佯惑示若將去乃選精騎銜枚先入掠其牛馬六畜三軍見得進乃不懼分吾良卒密有所伏敵人若來擊之勿疑若其不至舍之而去見通典一百五十九孫子九地篇何氏注又張預注又曰軍入敵境敵人固壘不戰士卒思歸欲退且難謂之輕地當選驍騎伏要路我退敵追來則擊之也見孫子何氏注吳王問孫武曰爭地敵若先至據要保利簡兵練卒或出或守以備我奇則如之何武曰爭地之法讓之者得求之者失此二句何注引作先據為利敵得其處慎勿攻之引而佯走建旗鳴鼓趣其所愛曳柴揚塵惑其耳目分吾良卒密有所伏敵必出救人欲我與人棄我取此爭先之道也若我先至而敵用此術則選吾鋭卒固守其所輕兵追之分伏險阻敵人還鬥伏兵旁起此全勝之道也見通典一百五十九孫子何氏注吳王問孫武曰交地吾將絶敵使不得來必全吾邊城修其守備深絶通路固其隘塞若不先圖之彼可得而來吾不得而往衆寡又均則如之何武曰既我不有以往彼可以來吾分卒匿之守而易怠示其不能敵人且至設伏隱廬出其不意可以有功也同上吳王問孫武曰衢地必先若吾道遠發後雖馳車驟馬至不能先則如之何武曰諸侯參屬其道四通我與敵相當而旁有他國所謂先者必重幣輕使約和旁國交親結恩兵雖後至衆已屬矣簡兵練卒阻利而處親吾軍士實吾資糧令吾車騎出入瞻候我有衆助彼失其黨諸國犄角震鼓齊攻敵人驚恐莫知所當同上吳王問孫武曰吾引兵深入重地多所踰越糧道絶塞設欲歸還勢不可過欲食于敵持兵不失則如之何武曰凡居重地士卒輕勇轉輸不通則掠以繼食下得粟帛皆貢于上多者有賞士無歸意若欲還出即為戒備深溝高壘示敵且久敵疑通途私除要害之道乃令輕車銜枚而行塵埃氣揚以牛馬為餌敵人若出鳴鼓隨之陰伏吾士與之中期內外相應其敗可知也同上吳王問孫武曰吾入圮地山川險阻難從之道行久卒勞敵在吾前而伏吾後營居吾左而守吾右良車驍騎要吾隘道則如之何武曰先進輕車去軍十里與敵相侯接期險阻或分而左或分而右大將四觀擇空而取皆會中道倦而乃止同上吳王問孫武曰吾入圍地前有強敵後有險難敵絶糧道利我走勢敵鼓噪不進以觀吾能則如之何武曰圍地之宜必塞其闕示無所往則以軍為家萬人同心三軍齊力并炊數日無見火烟故為毀亂寡弱之形敵人見我備之必輕告厲士卒令其奮怒陳伏良卒左右險阻擊鼓而出敵人若當疾擊務突前鬥後拓左右犄角又問曰敵在吾圍伏而深謀示我以利縈我以旗紛紛若亂不知所之奈何武曰千人操旍分塞要道輕兵進挑陳而勿搏交而勿去此敗謀之法同上吳王問孫武曰吾師出境軍于敵人之地敵人大至圍我數重欲突以出四塞不通欲勵士激衆使之投命潰圍則如之何武曰深溝高壘示為守備安靜勿動以隱吾能告令三軍示不得已殺牛燔車以饗吾士燒盡糧食填夷井灶割髮捐冠絶去生慮將無餘謀士有死志于是砥甲礪刃并氣一力或攻兩旁震鼓疾噪敵人亦懼莫知所當鋭卒分行疾攻其後此是失道而求生故曰困而不謀者窮窮而不戰者亡吳王曰若吾圍敵則如之何武曰山峻谷險難以踰越謂之窮寇擊之之法伏卒隱廬開其去道示其去路求生透出必無鬥志因而擊之雖衆必破又問曰吾在死地糧道已絶敵伏吾險進退不得則如之何武曰燔吾蓄積盡我餘財激士勵衆使無生慮鼓呼而衝進而勿顧決命爭強死而須鬥若敵在死地士卒氣勇欲擊之法順而勿抗陰守其利絶其糧道恐有奇兵隱而不睹使吾弓弩俱守其所見通典一百五十九孫子何氏注又張預注案此以上皆釋九地篇義吳王問孫武曰敵勇不懼騎而無慮兵衆而強圖之奈何武曰絀而待之以順其意無令省覺以益其懈怠因敵遷移潛伏侯待前行不瞻後往不顧中而擊之雖衆可取攻驕之道不可爭鋒見通典一百五十二吳王問孫武曰敵人保據山險擅利而處之糧食又足挑之則不出乘間則侵掠為之奈何武曰分兵守要謹備勿懈潛探其情密侯其怠以利誘之禁其樵牧御覽作禁其牧采久無所得自然變改待離其固御覽作故奪其所愛敵據險隘我能破之也見通典一百五十九御覽三百三十一孫子曰強弱長短雜用見通典一百二十孫子曰遠則用弩近則用兵兵弩相解也見通典孫子曰以步兵十人擊騎一匹通典孫子曰人效死而上能用之雖優游暇譽令猶行也見文選王元長三月三日曲水詩序注孫子曰其鎮如嶽其淳如淵見文選同上孫子曰長陳為甄見文選注孫子八陳有蘋車之陳見周禮車僕注賈疏云孫子兵法有此言也案隋志有孫子八陳圖一卷牝八陳圖一卷此二條是其遺文孫子占曰三軍將行其旌旗從容以向前是為天送必亟擊之得其大將三軍將行其旗旌墊然若雨是為天霑其師失三軍將行旍旗亂于上東西南北無所主方其軍不還三軍將陳雨甚是為浴師勿用陳戰三軍將戰有雲其上而赤勿用陳先陳戰者莫復其迹三軍方行大風飄起于軍前右以絶軍其將亡右周中其師得糧見御覽三百二十八案隋志有孫子兵法雜占四卷此其遺文移記公孫聖今日壬午左校司馬王孫駱受教告東掖門亭長公孫聖吳王晝臥覺寤而心中惆悵也如有悔記到車馳詣姑胥之臺見越絶書第十遺文種書狡兔盡則良犬烹敵國滅則謀臣亡大夫何不釋吳而患越乎見韓非子內儲說下乞糧于魯公孫有山氏佩玉繠兮余無所繫之旨酒一盛兮余與褐之父睨之見左傳哀十三年屬諸大夫告願一與吳徼天下之衷令吳越之國相與俱殘士大夫履肝肺同日而死孤與吳王接頸交臂而僨此孤之大願也若此而不可得也內量吾國不足以傷吳外事之諸侯不能害之則孤將棄國家釋群臣服劍臂刃變容貌易姓名執箕帚而臣事之以與吳王爭一旦之死孤雖知要領不屬首足異處四枝布裂為天下戮孤之志必將出焉見呂氏春秋順民越王勾踐致必死于吳于是屬諸大夫而告之號令三軍凡我父兄昆弟及國子姓有能助寡人謀而退吳者吾與之共知越國之政見越語上越王勾踐棲于會稽之上乃號令于三軍試下救火令人之救火者死比死敵之賞救火而不死者比勝敵之賞不救火者比北降之罪見韓非子內儲說上七術越王問于大夫文種曰吾欲伐吳可乎對曰何不試焚宮室乃下令伐吳令有敢諫伐吳者罪不赦見吳越春秋勾踐伐吳外傳十伐吳命令王乃命有司大令于國曰苟任戎者皆造于國門之外王乃命于國曰國人欲告者來告告孤不審將為戮不利及五日必審之過五日道將不行王乃入命夫人曰自今日以後內政無出外政無入內有辱是子也外有辱是我也吾見子于此止矣王命大夫曰食土不均土地之不修內有辱于國是子也軍士不死外有辱是我也自今日以後內政無出外政無入吾見子于此止矣至于軍斬有罪者以徇曰莫如此以環瑱通相問也明日徙舍斬有罪者以徇曰莫如此不從其伍之令明日徙舍斬有罪者以徇曰莫如此不從王命明日徙舍至于禦兒斬有罪者以徇曰莫如此淫逸不可禁也王乃命有司大徇于軍曰有父母耆老而無昆弟者以告王親命之曰我有大事子有父母耆老而子為我死子之父母將轉于溝壑子為我禮已重矣子歸歿而父母之世後若有事吾與子圖之明日徇于軍曰有兄弟四五人皆在此者以告王親命之曰我有大事子有昆弟四五人皆在此事若不捷則是盡也擇子之所欲歸者一人明日徇于軍曰有眩瞀之疾者以告王親命之曰我有大事子有眩瞀之疾其歸若已後若有事吾與子圖之明日徇于軍曰筋力不足以勝甲兵志行不足以聽命者歸莫告明日遷軍接和斬有罪者以徇曰莫如此志行不果王乃命有司大徇于軍曰謂二三子歸而不歸處而不處進而不進退而不退左而不左右而不右身斬妻子鬻已上并見吳語二十一年十月命國人曰吾將有不虞之議自近及遠無不聞者復命有司與國人曰承命有賞皆造國門之期有不從命者吾將有顯戮令國中曰五日之內則吾良人矣過五日之外則非吾之民也又將加之以誅命于夫人曰自今日之後內政無出外政無入各守其職以盡其信內中辱者則是子境外千里辱者則是子注云當作我案當作孤爛文也也吾見子于是以為明誡矣令大夫曰食土不均地壤不修使孤有辱于國是子之罪臨敵不戰軍士不死有辱于諸侯功隳于天下是孤之責自今以往內政無出外政無入吾固誡子軍行成陳即斬有罪者三人以徇于軍令曰不從吾令者如斯矣明日徙軍于郊斬有罪者三人徇之于軍令曰不從吾令者如斯矣乃令國中不行者與之訣而告之曰爾安土守職吾方往征討我宗廟之讎以謝于二三子明日復徙軍于境上斬有罪者三人徇之于軍曰有不從令者如此後三日復徙軍于檇李斬有罪者三人以徇于軍曰其淫心匿行不當敵者如斯矣乃命有司大徇軍曰其有父母無昆弟者來告我我有大事子離父母之養親老之愛赴國家之急子在軍寇之中父母昆弟有在疾病之地吾視之如吾父母昆弟之疾病也其有死亡者吾葬埋殯送之如吾父母昆弟之有死亡葬埋之矣明日又徇于軍曰士有疾病不能隨軍從兵者吾豫其醫藥給其糜粥與之同食明日又徇于軍曰筋力不以勝甲兵志行不足以聽王命者吾輕其重和其任明日旋軍于江南更陳嚴法復誅有罪者五人徇曰吾愛士也雖吾子不能過也及其犯誅自吾亦不能脫也有司將軍大徇軍中曰隊各自令其部部各自令其士歸而不歸處而不處進而不進退而不退左而不左右而不右不如令者斬已上并見吳越春秋勾踐伐吳外傳十案與吳語文多異與國人誓寡人聞古之賢君四方之民歸之若水之歸下也今寡人不能將帥二三子夫婦以蕃令壯者無取老婦令老者無取壯妻女子十七不嫁其父母有罪丈夫二十不娶其父母有罪將免者以告公令醫守之生丈夫二壼酒一犬生女子二壼酒一豚生三人公與之母生二人公與之餼當室者死三年釋其政支子死三月釋其政必哭泣葬埋之如其子令孤子寡婦疾疹貧病者納宦其子其達士潔其居美其服飽其食而摩厲之于義四方之士者來必廟禮之見越語上勾踐說于國人乃致其父母昆弟而誓之又見吳越春秋勾踐伐吳外傳十小異誓衆寡人聞古之賢君不患其衆之不足也而患其志行之少恥也今夫差衣水犀之甲者億有三千不患其志行之少恥也而患其衆之不足也今寡人將助天滅之吾不欲匹夫之勇也欲其旅進旅退也進則思賞退則思刑如此則有常賞進不用命退則無恥如此則有常刑見越語上又見吳越春秋勾踐伐吳外傳十與群臣盟寡人獲辱受恥上愧周王下慚晉楚幸蒙諸大夫之策得返國修政富民養士而五年未聞敢死之士雪仇之臣奈何而有功乎見吳越春秋勾踐陰謀外傳九越王反越五年鳴鐘驚檄而召群臣與之盟與越王為吳王壽下臣勾踐從小臣范蠡奉觴上千歲之壽辭曰皇在上令昭下四時并心察慈仁者大王躬親鴻恩立義行仁九德四塞威服群臣于乎休哉傳德無極上感太陽降瑞翼翼大王延壽萬歲長保吳國四海咸承諸侯賓服觴酒既升永受萬福見吳越春秋勾踐入臣外傳七為書辭勾踐臣聞主憂臣勞主辱臣死昔者君王辱于會稽所以不死為此事也今既以雪恥臣請從會稽之誅見史記越世家勾踐以霸而范蠡稱上將軍還反國為書辭勾踐臣聞主憂臣勞主辱臣死義一也今臣事大王前則無滅未萌之端後則無救已傾之禍雖然臣終欲成君霸圖故不辭一死一生臣竊自惟乃使于吳王之慚辱蠡所以不死者誠恐讒于太宰嚭成伍子胥之事故不敢前死且須臾而生夫恥辱之也不可以大流汗之愧不可以忍幸賴宗廟之神靈大王之威德以敗為成斯湯武克夏商而成王業者定功雪恥臣所以當席日久臣請從斯辭矣見吳越春秋勾踐伐吳外傳十案即史記文未可合録故別載之自齊遺文種書吾聞天有四時春生冬伐人有盛衰泰終必否知進退存亡而不失其正惟賢人乎蠡雖不才明知進退高鳥已散良弓將藏狡兔已盡良犬就烹夫越王為人長頸鳥喙鷹視狼步可與共患難而不可共處樂可與履危不可與安子若不去將害于子明矣見史記越世家范蠡既去自齊遺大夫種書吳越春秋勾踐伐吳外傳矢書答吳王上天蒼蒼若存若亡越王勾踐下臣種敢言之昔天以越賜吳吳不肯受是天所反勾踐敬天而功既得返國今上天報越之功敬而受之不敢忘也且吳有大過六以至于亡王知之乎有忠臣伍子胥忠諫而身死大過一也公孫聖直說而無功大過二也大宰嚭愚而佞言輕而讒諛妄語咨口聽而用之大過三也夫齊晉無反逆行無僭侈之過而吳伐二國辱君臣毀社稷大過四也且吳與越同音共律上合星宿下共一理而吳侵伐大過五也昔越親戕吳之前王罪莫大焉而幸代之不從天命而棄其仇後為大患大過六也越王謹上列青天敢不如命見吳越春秋夫差內傳五吳王書其矢而射種蠡之軍大夫種書矢射之曰固陵祖道祝詞皇天祐助前沉後揚禍為德根憂為福堂威人者滅服從者昌王雖牽致其後無殃君臣生離感動上皇衆夫哀悲莫不感傷臣請薦脯行酒二觴見吳越春秋勾踐入臣外傳七勾踐入臣于吳群臣皆送至浙江之上臨水祖道軍陳固陵大夫文種前為祝大王德壽無疆無極乾坤受靈神祇輔翼我王厚之祉祐在側德鎖百殃利受其福去彼吳庭來歸越國觴酒既升請稱萬歲同上越王仰天太息舉杯垂涕默無所言種復前祝文臺進祝酒辭皇天祐助我王受福良臣集謀我王之德宗廟輔政鬼神承翼君不忘臣臣盡其力上天蒼蒼不可掩塞觴酒二升萬福無極見吳越春秋勾踐伐吳外傳十越兵橫行于江淮之上還于吳置酒文台大夫種進祝酒我皇賢仁懷道抱德滅讎破吳不忘返國賞無所吝群邪杜塞君臣同和福祐千億觴酒二升萬歲難極同上于是越王默然無言大夫種云云
