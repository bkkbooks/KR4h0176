body:
  text: 齊太公政語師尚父曰吾聞之于政也曰天下壙壙一人有之萬民叢叢一人理之故天下者非一家之有也有道者之有也故夫天下者唯有道者理之唯有道者紀之唯有道者使之唯有道者宜處而久之故夫天下者難得而易失也難常而易亡也故守天下者非以道則弗得而長也故夫道者萬世之寶也周武王曰受命矣見賈誼新書修政語下武王問太公曰舉賢而以危亡者何也太公曰舉賢而不用是有舉賢之名而不得真賢之實也武王曰其失安在太公望曰其失在君好用小善而已不得真賢也武王曰好用小善者何如太公曰君好聽譽而不惡讒也以非賢為賢以非善為善以非忠為忠以非信為信其君以譽為功以毀為罪有功者不賞有罪者不罰多黨者進少黨者退是以群臣比周而蔽賢百吏群黨而多奸忠臣以誹死于無罪邪臣以譽賞于無功其國見于危亡武王曰善吾今日聞誹譽之情矣武王問太公曰得賢敬士或不能以為治者何也太公對曰不能獨斷以人言斷者殃也武王曰何為以人言斷太公對曰不能定所去以人言去不能定所取以人言取不能定所為以人言為不能定所罰以人言罰不能定所賞以人言賞賢者不必用不肖者不必退而士不必敬武王曰善其為國何如太公對曰其為人惡聞其情而喜聞人之情惡聞其惡而喜聞人之惡是以不必治也武王曰善四輔太公曰太師者心腹之臣所使是人之英故曰前疑常立于前決疑事也太史者耳目之臣所使視聽是人之後故曰後承常立于後承主之過取驗于天太傳者爪牙之臣所使守衛是人之傑故曰左輔輔人主缺事立于左拒君之難太保者羽翼之臣所使察伺是人之警故曰右弼常立于右弼人主之邪四輔既立王者安而無為百姓濟而無害若四輔不具猶格虎無備濟河無舟若王者不知古今之務遠方之緯不謀于諸侯不達言語動作不合于制太師爭之不知天變星曆之運天官動靜鐘律之音山川怪異不善災害太史陳天文以爭之發號令不應先王法度與大臣無禮枉道于民處刑不平獨信自專臨政不莊又不恤臣僕太傅爭之升車不應和鸞揖讓不中磬佩淫讌馳騁沈冒酒色宗廟不敬輿服失度朝廷無節太保爭之見五行大義第二十二篇論諸官案今所行六韜六卷是宋元豐間刪定凡六十篇見存不錄錄其佚文文韜文王問于太公曰賢君治國何如對曰賢君之治國其政平吏不苛其賦斂節其自奉薄不以私善害公法賞賜不加于無功刑罰不施于無罪不因喜以賞不因怒以誅害民者有罪進賢者有賞後宮不荒女謁不聽上無淫慝下無陰害不供宮室以費財不多游觀臺池以罷民不雕文刻鏤以逞耳目宮無腐蠹之藏國無流餓之民也文王曰善哉見群書治要三十一文王問太公曰願聞治國之所貴太公曰貴法令之必行法令必行則治道通治道通則民大利民大利則君德彰矣君不法天地而隨世俗之所善以為法故令出必亂亂則復更為法是以法令數變則群邪成俗而君沈于世是以國不免危亡矣文王曰法令必行大利人民奈何太公曰法令之必行則民俗利民俗利則利天下是法令利之必行大利人民也見群書治要三十一御覽六百三十八文王問太公曰願聞為國之大失太公曰為國之大失者為上作事而不法法國君不悟是為大失也文王曰願聞不法法國君不悟太公曰不法法則令不行令不行則主威傷不法法則邪不止邪不止則禍亂起矣不法法則刑妄行刑妄行則賞無功不法法則國昏亂國昏亂則臣為變不法法則水旱發水旱發則萬民病君不悟則兵革起兵革起則失天下也文王曰誠哉見群書治要三十一御覽六百三十八文王問太公曰人主動作舉事善惡有福殃之應鬼神之福無太公曰有之主動作舉事惡則天應之以刑善則天應之以德逆則人備之以力順則神授之以職故人主好重賦斂大宮室多游臺則民多病溫霜露殺五穀絲麻不成人主好田獵畢弋不避時禁則歲多大風飄牛馬發屋拔木民人飛揚數十里禾穀不實人主好破壞名山壅塞大川決通名水則歲多大水傷民五穀不滋人主好武事兵革不息則日月薄蝕太白失行故人主動作舉事善則天應之以德惡則人備之以力神奪之以職如響之應聲如影之應形文王曰誠哉見群書治要三十一續漢五行志三注又五注御覽九又二百六十六又八百三十九又八百七十六又八百七十九又五行大義第七篇引太公云人主舉事善則天應之以德惡則天應之以刑故義勝怠者王怠勝敬者亡見群書治要三十一引明傳篇末多此二語武王問太公曰桀紂之時獨無忠臣良士乎太公曰忠臣良士天地之所生何為無有武王曰為人臣而令其主殘虐為後世笑可謂忠臣良士乎太公曰是諫者不必聽賢者不必用武王曰諫不聽是不忠賢而不用是不賢也太公曰不然諫有六不聽強諫有四必亡賢者有七不用武王曰願聞六不聽四必亡七不用太公曰主好作宮室臺池諫者不聽主好忿怒妄誅殺人諫者不聽主好所愛無功德而富貴者諫者不聽主好財利巧奪萬民諫者不聽主好珠玉奇怪異物諫者不聽是謂六不聽案上言六不聽僅五事轉寫有脫四必亡一曰強諫不可止必亡二曰強諫知而不肯用必亡三曰以寡正強正眾邪必亡四曰以寡直強正眾曲必亡七不用一曰主弱親強賢者不用二曰主不明正者少邪者眾賢者不用三曰賊臣在外奸臣在內賢者不用四曰法政阿宗族賢者不用五曰以欺為忠賢者不用六曰忠諫者死賢者不用七曰財貨上流賢者不用見群書治要三十一武王伐殷得二丈夫文選注御覽作大夫而問之曰殷國之將亡亦有妖乎其一人對曰有殷國嘗雨血雨灰雨石小者如椎大者如箕常六月雨雪深尺餘武王曰大哉妖也其一人對曰是非殷國之大妖也殷國之大妖三十七章雨血雨灰雨石盛夏雨雪臣不為妖災武王踧然而問三十七章之妖對曰殷君喜射人喜以人喂虎喜割人心喜殺孕婦喜殺人之父寡人之婦孤人之子喜奪喜誣喜刑禍喜以信者為欺欺者為忠以忠為不忠忠諫者死阿諛者賞以君子為下小人為上以便佞為相以女子為政急令暴取萬民愁苦喜田獵畢弋走狗出入不時不避大風甚雨不避寒暑喜治宮室修臺池日夜無已宮七十有三所大宮百里宮中有九市陳玉杯象箸玉杯象箸不盛菽藿之羹必將熊蹯豹胎喜為酒池肉林糟丘酒池可迴船而牛飲者三千人飲之以金鼓坐起無長幼之序貴賤之禮喜聽讒用譽無功者賞無德者富所愛專制而擅令無禮義無忠信無聖人無賢士無法度無斗斛無尺丈無錙銖無秤衡有罪放無罪誅此殷國之大妖也其餘不可勝數臣言不能盡見群書治要三十一藝文類聚九又七十一北堂書鈔二十又二十一文選七發注七命注初學記二十四御覽二十一又五十一又八十三又一百七十三又七百六十八又八百七十四淵乎無端孰知其源見意林一案意林此條在六守後發啟前當是文韜武韜昔柏皇氏栗陸氏驪連氏軒轅氏赫胥氏尊盧氏祝融氏此古之王者也未使民民化未嘗民民勸此皆古之善為政者也至于伏羲氏神農氏教民而不誅黃帝堯舜誅而不怒古之不變者有苗有之堯化而取之堯德衰舜化而受之舜德衰禹化而取之見御覽七十六意林一聖人恭天靜地和人敬鬼見意林一案意林此二條在發啟後爭權前知是武韜文王在岐周召太公曰爭權于天下者何先太公曰先人人與地稱則萬物備矣今君之位尊矣待天下之賢士勿臣而友之則君以得天下矣文王曰吾地小而民寡將何以得之太公曰可天下有地賢者得之天下有粟賢者食之天下有民賢者收之意林作牧之天下者非一人之天下也莫常有之唯賢者取之夫以賢而為人下何人不與以貴從人曲直何人不得屈一人之下則申萬人之上唯聖人而後能為之文王曰善請著之金版于是文王所就而見者六人所求而見者七十人所呼而友者千人見群書治要三十一文選宣德皇后令注意林一崇侯虎曰今周伯昌懷仁而善謀冠雖獘禮加之于首履雖新法踐之于地可及其未成而圖之商王拘西伯昌于羑里太公與散宜生以金千鎰求天下珍怪物而獻之以免君之罪于是散宜生受命而行得犬戎氏文馬豪毛朱鬣目如黃金名雞斯之乘九江之浦得大貝百馮本注云詩作百朋宛懷條塗之山得黃熊玉女三人因費仲而獻之于商王紂紂大喜遂免西伯殺牛而賜之文王既出羑里召周公旦築為靈臺紂患刑輕乃更為銅柱以膏塗之加于然炭之上使有罪者緣焉滑跌墮火中紂與妲己笑以為樂名曰炮烙之刑見意林一漢書儒林轅固傳藝文類聚八十四又九十三又九十五文選南都賦注石闕銘注御覽四百六十七五百三十四六百八十四六百九十七八百七九百八九百四十一事類馬賦注凡十五條合錄之案意林此條在爭權後九差前知是武韜又案淮南子道應訓文王砥德修政三年而天下二垂歸之紂聞而患之曰余夙興夜寐與之竟行則苦心勞形縱而置之恐伐余一人崇侯虎曰周伯昌行仁義而善謀太子發勇敢而不疑中子旦恭儉而知時若與之從則不堪其殃縱而赦人身必危亡冠雖弊必加于頭及未成請圖之屈商乃拘文王于羑里于是散宜生乃以千金求天下之珍怪得騶虞雞斯之乘玄玉百工大貝百朋玄豹黃羆青豻白虎文皮千合以獻于紂因費仲而通紂見而悅之乃免其身殺牛而賜之文王歸乃為玉門築靈台相女童擊鐘鼓以待紂之失也紂聞之曰周伯昌改道易行吾無憂矣乃為炮烙剖比干剔孕婦殺諫者文王乃遂其謀蓋本六韜為說又尚書大傳亦載此事又案群書治要載論將選將二篇在武韜今本在龍韜與舊不同龍韜武王曰士高下豈有差乎太公曰人有九差武王曰願聞之太公曰人才參差大小猶斗不以盛石滿則棄矣非其人而使之安得不殆多言多語惡口惡舌終日言惡寢臥不絕為眾所憎為人所疾此可使要問閭里察奸伺猾權數好事夜臥早起雖遽御覽作劇不悔此妻子之將也先語察事實長希言御覽作長寶希言賦物平均此十人之將也切切截截不用諫言數行刑戮不避親戚此百人之將也訟辨好勝疾賊侵陵斥人以刑欲正一眾此千人之將也外貌咋咋言語切切知人飢飽習人劇易此萬人之將也戰戰慄慄日慎一日近賢進謀使人以節言語不慢忠心誠必此十萬之將也溫良實長用心無兩見賢進之行法不枉此百萬之將也動動紛紛鄰國皆聞出入居處百姓所親誠信緩大明于領世能教成事又能救敗上知天文下知地理四海之內皆如妻子此英雄之率乃天下之主也見群書治要三十一意林一御覽二百七十三案意林引此在立將前夫殺一人而三軍不聞殺一人而萬民不知殺一人而千萬人不恐雖多殺之其將不重封一人而三軍不悅爵一人而萬人不勸賞一人而萬人不欣是為賞無功貴無能也若此則三軍不為使是失眾之紀也見群書治要三十一將威篇末是將威之所行也下多此一段武王問太公曰凡用兵之極天道地利人事三者孰先太公曰天道難見地利人事易得天道在上地道在下人事以飢飽勞逸文武也故順天道不必有吉違之不必有害失地之利則士卒迷惑人事不和則不可以戰矣故戰不必任天道飢飽勞逸文武最急地利為寶武王曰天道鬼神順之者存逆之者亡何以獨不貴天道太公曰此聖人之所生也欲以止後世故作為譎書而寄勝于天道無益于兵勝而眾將所拘者九武王曰敢問九者奈何太公曰法令不行而任侵誅無德厚而用日月之數不順敵之強弱而幸于天道無智慮而候氛氣少勇力而望天福不知地形而歸過敵人怯弗敢擊而待龜筮士卒不募而法鬼神設伏不巧而任背向之道凡天道鬼神視之不見聽之不聞索之不得不可以治勝敗不能制死生故明將不法也見群書治要三十一太公曰天下有粟聖人食之天下有民聖人收之天下有物聖人裁之利天下者取天下安天下者有天下愛天下者久天下仁天下者化天下見群書治要三十一此二篇在軍勢後虎韜武王勝殷召太公問曰今殷民不安其處奈何使天下安乎太公曰夫民之所利譬之如冬日之陽夏日之陰冬日之從陽夏日之從陰不召自來故生民之道先定其所利而民自至民有三幾不可數動動之有凶明賞則不足不足則民怨生明罰則民懾畏民懾畏則變故出明察則民擾民擾則不安其處易以成變故明王之民不知所好不知所惡不知所從不知所去使民各安其所生而天下靜矣樂哉聖人與天下之人皆安樂也武王曰為之奈何太公曰聖人守無窮之府用無窮之財而天下仰之天下仰之而天下治矣神農之禁春夏之所生不傷不害謹修地利以成萬物無奪民之所利而農順其時矣任賢使能而官有材而賢者歸之矣故賞在于成民之生罰在于使人無罪是以賞罰施民而天下化矣見群書治要三十一藝文類聚二十初學記十七御覽四百一犬韜武王至殷將戰紂之卒握炭流湯者十八人以牛為禮以朝者三千人舉百重沙者二十四人趨行五百里而矯矛殺百步之外者五千人介士億有八萬武王懼曰夫天下以紂為大以周為細以紂為眾以周為寡以周為弱以紂為強以周為危以紂為安以周為諸侯以紂為天子今日之事以諸侯擊天子以細擊大以少擊多以弱擊強以危擊安以此五短擊此五長其可以濟功成事乎太公曰審天子不可擊審大不可擊審眾不可擊審強不可擊審安不可擊王大恐以懼太公曰王無恐且懼所謂大者盡得天下之民所謂眾者盡得天下之眾所謂強者盡得天下之力所謂安者能得天下之所欲所謂天子者天下相愛如父子此之謂天子今日之事為天下除殘去賊也周雖細曾殘賊一人之不當乎王大喜曰何謂殘賊太公曰所謂殘者收天下珠玉美女金錢綵帛狗馬穀粟藏之不休此謂殘也所謂賊者收暴虐之吏殺天下之民無貴無賤非以法度此謂賊也見群書治要三十一又略見北堂書鈔一百二十三御覽三百五十三三百八十六武王問太公曰欲與兵深謀進必斬敵退必克全其略云何太公曰主以禮使將將以忠受命國有難君召將而詔曰見其虛則進見其實則避勿以三軍為貴而輕敵勿以授命為重而苟進勿以貴而賤人勿以獨見而違眾勿以辯士為必然勿以謀簡于人勿以謀後于人士未坐勿坐士未食勿食寒暑必同敵可勝也見群書治要三十一辯言巧辭善毀善譽者名曰間諜飛言之士見意林一練士篇名曰必死之士下少此三語以明告吏士申三五之令教其操兵起居進止旌旗指麾陳而方之坐而起之行而止之左而右之列而合之絕御覽作繩而解之無犯進止之節無失飲食之宜無絕人馬之力見通典一百四十九御覽二百九十七案今本教戰篇僅云將必先明告吏士申之以三令以教操兵起居旌旗指麾之變法餘皆刪去故節錄之其上下文不具錄以上如六韜原次以下雜錄不得原次器滿則傾志滿則覆見禮記曲禮上疏世子為政見北堂書鈔二十一廿七大夫者為筋脈之臣見北堂書鈔五十六友之友謂之朋朋之朋謂之黨黨之黨謂之群見御覽一百五十七昔煩厚氏用兵無巳誅戰不休兼并無所止至于涿鹿之野諸侯叛之煩厚氏以亡也見北堂書鈔一百十三堯與有苗御覽作堯伐有扈戰于丹水之浦見文選沈休文樂游苑餞呂僧珍詩注北堂書鈔十三御覽六十三桀時有瞿山之地桀十月鑿山陵通之于河民有諫者曰冬鑿地穿山是發天之陰泄山之氣天子後必敗桀以妖言殺之見御覽八十二桀紂之時婦女坐以文綺之席衣以綾紈之衣常三百人見藝文類聚六十九又八十五北堂書鈔二十文選石闕銘注御覽三百九十三七百九八百十五紂作瓊室鹿臺飾以美玉見文選西京賦注太公曰桀紂王天下之時積糟為阜以酒為池脯肉為山林見文選西征賦注對文王曰禮者治之粉澤也見初學記二十一御覽五百二十六百十先塗民耳目見文選劇秦美新注利害相臻猶循環之無端見文選干寶晉紀總論注天下攘攘皆為利往天下熙熙皆為利來見御覽四百九十六天之為天遠矣地之為地久矣萬物在其間各自利何世莫之有乎夫使世俗皆能順其有是乃溟涬鴻濛之時為王故莫之能有七十六聖發起其所擊天下而有之豈一日哉見御覽一文王聞殺崇侯虎歸至酆令具湯沐見御覽三百九十五一本作湯僄文王祖父壽百二十而沒王季百年而沒文王壽九十七而沒見御覽三百八十三太公謂武王曰夫人皆有性趨舍不同喜怒不等見文選盧諶贈劉琨詩注司馬遷報任少卿書注太公謂武王曰聖人興兵為天下除患去賊非利之也故役不再籍一舉而畢見文選孫楚為石苞與孫皓書注欲伐大國行且有期王寢疾十日不行太公負之而起之曰行已有期君不發天子聞之國亡身死胡不勉之王允焉如無病者見御覽七百三十九武王寢疾十日太公負王乃駕騖冥之車北堂書鈔十三作之乘周旦為御至于孟津大黃參連弩大才扶胥車并戰具也飛鳧赤莖白羽以鐵為首電影青莖赤羽以銅為首副也晝則為光夜則為星方頭鐵槌重八斤亦軍備也大柯斧重八斤一名鐵鉞軍備也行馬廣二丈二十具渡溝飛橋廣五丈轉關鹿盧八具天船一名天潢以濟大水也鷹爪方匈鐵杷柄長七尺天陣日月斗柄杓一此為左右一仰一背天陣地陣丘陵水泉有左右前後之利人陣車馬文武積楹臨衝攻城國邑雲梯飛樓視城中心武衛大櫓三軍所須雲火万炬以防火也吹鳴箛作威萬具也威振萬里也見御覽三百六十七三百三十六案此所陳器具軍用篇有其半武王伐殷先出于河呂尚為後將以四十七艘船濟文選注作舫逾于河見藝文類聚七十一文選王粲從軍詩注御覽七百六十八太公曰夫紂無道流毒諸侯欺侮群臣失百姓之心秉明德以誅之誰曰弗克見北堂書鈔一百十三武王伐殷乘舟濟河兵車出壞船于河中太公曰太子為父報仇令死無生所過津梁皆悉燒之見御覽四百八十二武王伐紂諸侯已至未知士民何如太公曰天道無親今海內陸沈于殷久矣百姓可與樂成難與慮始伯夷叔齊曰殺一人而有天下北堂書鈔十三作殺一夫而利天下聖人不為太公曰師渡孟津六馬仰流赤烏降白魚外入此豈非天所命也師到坶野天暴風電前後不相見車蓋發越轅衝摧折旌旄三折旗幟飛揚者精銳感天也雨以洗吾兵雷電應天也見御覽三百六十九文王當作武王問散宜生卜伐殷吉乎曰不吉鑽龜龜不兆數蓍蓍不交而如折將行之日雨輜重車至軫行之日幟折為三散宜生曰此凶四不祥不可舉事太公進曰是非子之所知也祖行之日雨輜重車至軫是洗濯甲兵也見藝文類聚二御覽十事類雨賦注兵入殷郊見太公曰是我新君也而商容曰非也其人虎據而鷹峙威怒自副見利欲發進不顧前後見武王曰是新君也見敵不怒見御覽二百七十六紂為無道武王于是東伐紂至于河上雨甚雷疾武王之乘橫振而死旗旌折揚侯波周公進曰天不祐周矣意者君德行未盡而百姓疾惡故天降吾禍太公曰君秉德而受之不可如何也于是太公援罪人而戮之于河三鼓之率眾而先以造于殷天下從之甲子之日至于牧野舉師而討之紂城備設而不守親擒紂懸其首于白旗見御覽十三三百二十九三百四十武王伐紂師至氾水牛頭山風甚雷疾鼓旗毀折王之驂乘惶震而死太公曰用兵者順天之道未必吉逆之不必凶若失人事則三軍敗亡且天道鬼神視之不見聽之不聞智將不法而愚將拘之若乃好賢而能用舉事而得時則不看時日而事利不假小筮而事吉不禱祀而福從遂命驅之前進周公曰今時逆太歲龜灼言凶卜筮不吉星變為災請還師太公怒曰今紂刳比干囚箕子以飛廉為政伐之有何不可枯草朽骨安可知乎乃焚龜折蓍援枹而鼓率眾先涉河武王從之遂滅紂見通典一百六十二御覽三百二十八又泰誓中疏引作卜戰龜兆焦筮又不吉太公曰枯骨蓍不逾人矣蓋約文或在他篇未敢定之武王伐殷丁侯不朝太公乃畫丁侯于策三箭射之丁侯病困卜者占云祟在周恐懼乃請舉國為臣太公使人甲乙日拔丁侯著頭箭丙丁日拔著口箭戊已日拔著腹箭丁侯病稍愈四夷聞之各以其職來貢見御覽七百三十七武王伐紂雪深丈餘五車二馬行無轍跡詣營求謁武王怪而問焉太公對曰此必五方之神來受事耳遂以其名召入各以其職命焉既而克殷風調雨順見舊唐書禮儀志案五神事詳見太公金匱周書陰符丁侯事詳見金匱聖人以神道設教不必疑其不純也武王伐紂紂蒙寶衣投火而死見文選石闕銘注御覽八百八十九武王入殷發鉅橋之粟散鹿臺之金錢以與殷民見藝文類聚六十六八十五武王登夏臺以臨殷民周公旦曰臣聞之愛其人者愛其屋上烏憎其人者憎其餘胥見藝文類聚九十一御覽九百二十作除胥事類烏賦注作儲胥武王平殷還問太公曰今民吏未安賢者未定何以安之太公曰無故無新如天如地見御覽三百二十七冬冰可拆夏條可結見藝文類聚八十八御覽二十一軍處山之高者則曰棲見史記越世家索隱武王問太公曰敵人先至已據便地形勢又強則如之何對曰當示怯弱設伏佯走自投死地敵見之必疾速而赴擾亂失次必離故所入我伏兵齊起急擊前後衝其兩旁見通典一百五十三御覽二百九十四又問曰敵疏其陳又遠其後挑我流矢以弱我弓弩勞我士卒為之柰何太公曰發我銳士先擊其前車騎獵御覽作列其左右引而分隊以隨其後三軍疾戰凡以少擊眾避之于易要之于險避之于晝取之于夜故曰以一擊十莫善于阨以十擊百莫善于險以千擊萬莫善于阻用眾者務易用少者務阨也見通典一百五十九御覽三百十一案故曰以下蓋古兵家言而太公述之吳子應變篇亦有此文為將者受命忘家當敵忘身見文選西征賦注賞如高山罰如深溪見文選王粲從軍詩注大人之兵如狼如虎如雨如風如雷如電天下盡驚然後乃成見御覽二百七十一從孤擊虛萬人無餘一女子當百夫風鳴樹者賊在十里鳴條百里搖枝四百里雨霑衣裳者謂潤兵其不霑者謂泣兵金氣自鳴及焦氣者軍疲也見御覽三百二十八春以長予在前夏以大戟在前秋以弓弩在前冬以刀楯在前此四時應天之法也見御覽三百三十五三百三十九車騎之將軍馬不具鞍勒不備者誅見御覽三百五十八以死取人謂之勇見御覽四百三十七武王問太公曰夫貧富豈有命乎將治生不得其意太公曰為之不密密而不富者盜在其室武王曰何謂盜也太公曰計之不熟一盜也收種不時二盜也取婦無能三盜也養女太多四盜也棄事就酒五盜也衣服過度六盜也封藏不謹七盜也井灶不便八盜也舉息就禮初學記作利九盜也無事然鐙十盜也取之安得富哉武王曰善見藝文類聚三十五初學記十八御覽四百八十五
