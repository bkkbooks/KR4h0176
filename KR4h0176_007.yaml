body:
  text: 齊太公陰謀武王問太公曰願聞治亂之要太公曰其本在吏武王曰吏者治也所以為治其亂者何太公曰故吏重罪有十武王問吏之重罪太公曰一吏苛刻二吏不平三吏貪污四吏以威力迫脅于民五吏與史合姦六吏與人無情七吏作盜賊使人為耳目八吏賤買賣貴于民九吏增易于民十吏振懼于民夫治者有三罪則國亂而民愁盡有之則民流亡而君失其國武王曰民亦罪乎太公曰民有十大于此除者則國治而民安武王曰十大何如太公曰民勝吏厚大臣一大也民宗強侵陵群下二大也民甚富傾國家三大也民尊親其君天下歸慕四大也衆暴寡五大也民有百里之譽千里之交六大也民以吏威為權七大也恩行于吏八大也民服信疑當作民無信以少為多奪人田宅贅人妻子九大也民之基業畜産為人所苦十大也所謂一家害一里一里害諸侯諸侯害天下武王曰絶吏之罪塞民之大奈何太公曰察民之暴吏明其賞審其誅則吏不敢犯罪民不敢大也武王曰是民吏相伺上下不和而結其讎太公曰為君守成為吏守職為民守事如此各居其道則國治國治則都治都治則里治里治則家治家治則善惡分明善惡分明則國無事國無事則吏民外不懷怨內不徼事見續漢都國志五注武王問太公曰賢君治國教民其法何如太公對曰賢君治國不以私害公賞不加于無功罰不加于無罪法不廢于仇讎不避于所愛不因怒以誅不因喜以賞不高臺深池以役下不雕文刻畫以害農不極耳目之欲以亂政是賢君之治國也不好生而好殺不好成而好敗不好利而好害不好與而好奪不好賞而好罰妾孕疑作辛媵為政使內外相疑君臣不和拓人田宅以為臺觀發人丘墓以為苑囿僕媵衣文繡禽獸犬馬與人同食而萬民糟粳不厭裘褐不完其上不知而重斂奪民財物藏之府庫賢人逃隱于山林小人任大職無功而爵無德而貴專恣倡樂男女昏亂不恤萬民違陰陽之氣忠諫不聽信用邪佞此亡國之君治國也見群書治要三十一武王問太公曰吾欲輕罰而重威少其賞而勸善多簡其令而衆皆化為之何如太公曰殺一人千人懼者殺之殺二人而萬人懼者殺之殺三人三軍振者殺之賞一人而千人喜者賞之賞二人而萬人喜者賞之賞三人三軍喜者賞之令一人千人得者令之禁二人而萬人止者禁之教三人而三軍正者教之殺一以懲萬賞一而勸衆此明君之威福也同上武王問太公曰吾欲以一言與身相終再言與天地相永三言為諸侯雄四言為海內宗五言傳之天下無窮可得聞乎太公曰一言與身相終者內寬而外亡也再言與天地相永者是言行相副若天地無私也三言為諸侯雄者是敬賢用諫謙下于士也四言為海內宗者敬接不肖無貧富無貴賤無善惡無憎愛也五言傳之天下無窮者通于否泰順時容養也同上武王問尚父曰五帝之戒可得聞乎尚父曰黃帝之時戒曰吾之居民上也搖搖恐夕不至朝故為金人三封其口曰古之慎言人也堯之居民上也振振如臨深淵舜之居民上兢兢如履薄冰禹之居民上栗栗恐不滿日湯之居民上戰戰恐不見旦武王曰吾今新并殷居民上也翼翼懼不敢息尚父曰德盛者守之以謙守之以恭武王曰欲如尚父言吾因是為戒隨之身見群書治要三十一御覽五百九十金匱唐帝克有苗問人曰吾聞有苗時天雨血沾衣有此妖乎人曰非妖也有苗誅諫者尊無功退有能遇人如仇故亡耳見開元占經三三苗時有日鬥見開元占經六三苗之時三月不見日見御覽四夏桀之時有芩山之水桀常以十月發民鑿山穿陵通于河民諫曰孟冬鑿山穿陵是泄天氣發地之藏天子失道後必有敗桀以為妖言殺之期年芩山一旦崩為大澤水深九尺山覆于谷上反居下耋老諫而殺之湯率諸侯伐之見藝文類聚三御覽二十七又七十二路史後紀十四紂常以六月獵于西土發民逐禽民諫曰今六月天務覆施地務長養今盛夏發民逐禽而元元命懸于野君殘一日之苗而民百日不食天子失道後必無福紂以為妖言而誅之後數月天暴風雨發星折木見藝文類聚三御覽二十一又八百三十二事類賦注四文王問太公曰天下失道忠諫者死豫子伯邑考為王僕御無故烹之囚豫于羑里以其羹啜豫見御覽六百四十二武王問太公曰今民吏未安賢者未定何以安之太公曰不須兵器可以守國武王曰五帝之時無守戰之具國存者何太公曰守戰之具皆在民間耒耜者是其弓弩也鋤爬者是其矛戟也簦笠者是其兜鍪也鎌斧者是其攻戰之具也雞狗者是其鉦鼓也見御覽三百三十六又三百三十九武王問太公曰殷已亡其三人今可伐乎太公曰臣聞之知天者不怨天知己者不怨人先謀後事者昌先事後謀者亡且天與不取反受其咎時至不行反受其殃非時而生是為妄成故夏條可結冬冰可釋時難得而易失也見意林一天道無親常與善人今海內陸沈于殷久矣何乃急于元元哉見後漢袁紹傳注文選陳琳為袁紹檄豫州注武王伐紂至鳳皇陂襪系解見太平寰宇記二十五武王師到牧野陳未畢而暴風疾雨電雷幽冥前後不見太公曰善雷電者是吾軍動應天也見御覽十一武王伐殷丁侯不朝尚父乃畫丁侯三旬射之丁侯病大劇使人卜之崇在周恐懼乃遣使者請之于武王願舉國為臣虜武王許之尚父乃以甲乙日拔其頭箭丙丁日拔目箭戊己日拔腹箭庚辛日拔股箭壬癸日拔足箭謂使者曰歸矣吾已告諸神言丁侯前畔義今日遣人來歸勿復過之比使者歸子之君所息念矣使者辭歸至丁侯病乃愈四夷聞之皆懼各以其職貢越裳氏獻白雉重譯而至見藝文類聚五十九文選吳質答東阿王書注典引注御覽一百三十九又三百四十九又七百三十九事類賦注十三武王平殷還問太公曰今民吏未安賢者未定如何太公曰無故無新如天如地得殷之財與殷之民共之則商得其賈農得其田也一目視則不明一耳聽則不聰一足步則不行選賢自代上下各得其所見意林一御覽三百六十六武王伐紂都洛邑未成海內神相謂曰今周王聖人得民心乎當訪之隨四時而風雨陰寒雨雪十餘日深丈餘甲子平旦有五丈夫乘車馬從兩騎止門外欲謁武王武王將不出見太公曰不可雪深丈餘而車騎無迹恐是聖人王使太師尚父謝五丈夫曰賓幸臨之失不先問方修法服太師尚父乃使人持一器粥開門而進五車兩騎曰先王大夫在內方對天子未有出時天寒故進熱粥以御寒未知長幼從何起兩騎曰先進南海君次東海君次西海君次北海君次河伯雨師風伯粥既畢使者具以告尚父尚父謂武王曰客可見矣五車兩騎四海之神與河伯雨師風伯耳王曰不知有名乎曰南海之神曰祝融東海之神曰勾芒西海之神曰蓐收北海之神曰玄冥河伯名為馮夷史記封襌書正義引作馮修文選思玄賦舊注引作河伯姓馮名修雨師名咏風伯名姨請使謁者各以其名召之武王乃于殿下謁者于殿上門外引祝融進五神皆驚相視而歎祝融拜武王曰天陰乃遠來何以告之皆曰天伐殷立周謹來受命願敕風伯雨師各使奉其職見北堂書鈔一百四十四又一百五十二藝文類聚二初學記二文選雪賦注開元占經一百十三御覽十二又八百五十九又八百八十二太平廣記二百九十一事類賦注三武王問太公曰天下神來甚衆恐後復有試子者也何以待之太公曰請樹槐于王門內王路之右起西社築垣牆祭以酒脯食以犧牲尊之曰社客有非常先與之語乃命太公祝社曰客有益者入無益者距之歲告以水旱與其風雨澤流悉行除民所苦也見北堂書鈔八十七藝文類聚八十八御覽五百三十二事類賦注二十五賞一人而千人喜者賞之賞二人而萬人喜者賞之賞三人而三軍勸者賞之殺一人而千人恐者殺之殺二人而萬人動者殺之殺三人而三軍振者殺之見御覽六百三十三又六百四十七又書鈔三十引賞一人千萬喜六字屈一人之下伸萬人之上武王曰請著金版見文選廣絶交論注夫人可以樂成難以慮始見文選劉歆移書讓太常博上注明者見兆于未萌智者避危于未形見文選司馬相如上書諫獵注阮瑀為曹公作書與孫權注宰相不富國安主調陰陽和群臣樂萬民非吾宰相也見書鈔四十九武王問師尚父曰五帝之戒可得聞乎師尚父曰黃帝云豫在民上搖搖恐夕不至朝故金人三緘其口慎言語也堯居民上振振如臨深淵舜之居民上矜矜乎如履薄冰禹之居民上栗栗如不滿目湯之居民上翼翼乎懼不敢息吾聞道自微而生禍自微而成慎終與始完如金城敬勝怠則吉義勝欲則昌日慎一日壽終無殃見宋本後漢光武紀建武二年注意林一藝文類聚二十三文選張華女史針注御覽四百三十又四百五十九又五百九十三武王曰吾隨師尚父之言因為慎書銘隨身自誡其冠銘寵以著首將身不正遺為德咎書履曰行必慮正無懷僥幸書劍曰常以服兵而行道德行則福廢則覆書鏡曰以鏡自照則知吉凶書車曰自致者急載人者緩取欲無度自致而反見御覽四百三又五百九十武王曰吾欲造起居之誡隨之以身几之書曰安無忘危有無忘亡熟惟二者必後無凶杖之書曰輔人無苟扶人無咎見後漢崔駰傳注門之書曰敬遇賓客貴賤無二見御覽一百八十三戶之書曰出畏之入懼之見御覽一百八十四牖之書曰窺望端審且念所得可思所忘見御覽一百八十八鑰之書曰昏慎守深察訛見御覽一百八十四研之書曰石墨相著而黑邪心讒言無得污白見藝文類聚五十八初學記二十一御覽六百五事類賦注十五困學紀聞五書鋒忍之須臾乃全汝軀見意林一書刀刀利皚皚無為汝開見意林一書井源泉滑滑連旱則絶取事有常賦斂有節見意林一弩之戟為翼弩之書見奔遠行在才者與任武者也見書鈔一百二十五案此文衍誤春三月斗星為天關戰背天關向天梁敵不可當見初學記七冬月奎星為天關見初學記七金人銘曰周太廟右階之前有金人焉三緘其口而銘其背曰我古之慎言人也戒之哉毋多言毋多事多言多敗多事多害見御覽三百九十案御覽引注云皇覽云出太公金匱路史後紀五云世謂太公作金人太公金匱公對武王之言明黃帝所作日夜出者紀綱滅大臣專政作威奪權無救大臣戕其主奪其邦其救也親仁賢退驕佞順四時布恩惠赦天下則日夜出不為傷也見開元占經六引尚書金匱疑即太公金匱異名日還者君不秉其政舍法度用私意不任官職而將自治則日還日還者為日出而復下下而復高無救當為大亂不軌皆叛不從其救也正心固一修古道守正法無忒業則日還不為傷也見開元占經六引金匱日鬥者人君內無聰明邪臣爭權日鬥者無精衆人見烏其中無救期六十六日王者亡其土地其救闢四門來仁賢受爵分職循名責躬則鬥不為傷同上視不明聽不聰則雲氣五色蔽日月之明無救則群臣謀殺關梁不通其救闢四門求仁賢見開元占經十一引尚書金匱案陰符謂陰符之謀戰國策蘇秦得太公陰符之謀史記作周書陰符蓋即漢志之太公謀八十一篇矣云周書者周時史紀述猶六韜稱周史諸引周書陰符或但稱周書驗知非逸周書録附太公之末與六韜陰謀金匱互出入不嫌復見也文王昌曰吾聞之無變古無易常無陰謀無擅制無更創為此則不祥矣太公曰夫天下非常一人之天下也天下之國非常一人之國也莫常有之惟有道者取之古之王者未使民民化未賞民民勸不知怒不知喜愈愈然其如赤子此古善為政也見御覽八十四引周書陰符凡治國有三常一曰君以舉賢為常二曰官以任賢為常三曰士以敬賢為常夫然雖百代可知也見初學記十七又御覽四百二引周書陰符年飢上用輿曲輈不漆矛戟縷纏羽旄不擇焉見御覽三百五十二引周書年不登甲則纓縢宮室不容注云甲不以組也見御覽三百五十五引周書容容熙熙皆為利謀熙熙攘攘皆為利往見御覽四百四十九引周書武王不閉外門以示無懼去劍搢笏以示無仇見御覽六百九十二引周書太公曰知與衆同者非人師也大知似狂不癡不狂其名不彰不狂不癡不能成事見御覽七百三十九引周書陰符武王營洛邑未成四海之神皆會曰周王神聖當知我名若不知水旱敗之明年雨雪十餘旬深丈餘五丈夫乘車從兩騎止王門太公曰車騎無迹謂人之變乃使人持粥進之曰不知客尊卑何從騎曰先進南海御次東海御次北海御次西海御次河伯次風師次雨師武王問太公并何名太公曰南海神名祝融東海神名勾芒北海神名玄冥西海神名蓐收見五行大義第二十二篇引周書人感十而生天行五地行五合為十也見五行大義第二十三篇引周書春為牝陳弓為前行夏為方陳戟為前行季夏圓陳矛為前行秋為牡陳劍為前行冬為伏陳盾為前行是謂五陳見御覽三百一引周書太公曰步貴知變動車貴知地形騎貴知別徑奇道故三軍同名異用可往而無以還者車之死地越險絶阻乘敵遠行者車之竭地前易後險車之困地容車貫阻出而無返者車之患地左險右易上陵仰阪車之逆地深塹黏土車之勞地隱帶橫畝犯歷深澤者車之壞地日夜霖雨旬月不止泥淖難前車之陷地凡騎以陷敵而不能破敵敵人佯走以步騎反擊我後此騎之敗地也追北踰限長驅不止敵伏我兩旁又絶我後此騎之困地也往無以返入無以出陷于天井填于地牢此騎之死地也所由入者隘所由去者遠彼弱可以擊我強少可以擊我衆此騎之沒地大澗深谷蓊穢林草此騎之竭地左右有水前有大阜後有高山戰于兩水之間乘敵過邑是謂表裏相合左有深溝右有峭坑高下與地平睹之廣易進退相敵此并騎之陷地污下沮澤進退漸洳者騎之患地拙將之所以見擒明將之所以務避也見通典一百五十九引周書陰符案與六韜戰車戰騎二篇大同小異成王將加元服周公使人來零陵取文竹為冠見御覽六百八十四引周書兵法踐爾兵革審權矩應詐縱謀出無孔見詩大明疏引太公授兵鈴之法坎名大剛風乾名折風兌名小剛風艮名凶風坤名謀風巽名小弱風震名嬰兒風離名大弱風大剛風者大陰之氣好殺故剛折風者金強能摧折物也小剛風者亦金殺故也凶風者艮在鬼門凶害之所也謀風者坤為地大陰之本多陰謀也小弱風者巽為長女故稱弱也嬰兒風者震為長男愛之故曰兒大弱風者離為中女又弱于長女也大剛小剛客勝大弱小弱主人勝凶有凶害之事謀有謀逆之人折為將死嬰兒風主人強見五行大義第十七篇引太公兵書諸軍出行將令百官士卒曰某日出某門吏士不得刈稼穡伐樹木殺六畜掠取財物姦犯人婦女違令者斬見通典一百四十九引覆軍誡法凡行軍吏士有死亡者給其喪具使歸而葬此堅軍全國之道也軍人被創即給醫藥使謹視之醫不即治視鞭之軍夜驚吏士堅坐陳將持兵無歡譁動搖有起離陳者斬軍門當交戰謹出入者若近敵當譏呵出入者見通典一百四十九案通典引太公六韜太公兵法俱標太公曰不出書名今除六韜外録入太公兵法夫出軍征戰安營陳以六為法亦可方六百步亦可六十步量人地之宜表十二辰將軍自居九天之上竟一旬復徒開牙門常背建向破太歲太陰太陽大將軍凡三軍不欲飲死水不欲居死地不居地柱不居地獄注云死水者不流之水死地者丘暮之間地柱者四下中高地獄者四高中下是也見通典一百五十七日戴光主大凶期不出三年見開元占經五引太公兵法日未入兩竿而無光曜其月必主死一曰主憂同上日四背見軍在外有反者見開元占經七引太公兵法日暈始起前滅後匝而後成者後面勝日暈周匝東北偏厚厚為福東君在東北戰西南戰敗日暈而珥主有謀十日不雨兵起日暈冠三珥天子有喜或有大赦或拜大將軍日暈抱珥喜氣日暈黃者主人有喜見開元占經八日中蝕海內兵大起王公憂兩烏夾日名為天雞守日主人君妻家謀奪君處先數視君動靜欲行其志天先見變戒心見開元占經九弩之神名遠望見御覽三百四十八引太公兵法神后加四仲者以為明堂宮時天一出遊八極之外行窈冥之中日照其前月照其後當此之時天一自持玉弩執法承相劾不道者同上箭之神名續長見御覽三百四十九戟之神名大將見御覽三百五十二矛之神名趺蹌見御覽三百五十三決事占太白犯畢口大兵起一歲罷太白出東方入畢口車馬貴易政太白犯參左股戰大勝見開元占經四十九陰祕君不明臣不忠故日無光月不明見變不救殃禍生臣欲反主失名其救也安百姓用賢人弱者扶則無害見開元占經五又十一凡四時受王之日日月當清明五星順度潤澤有光此君臣和同或晝不見日夜不見月五星失度陰蔽日光亂風連日此國君迷荒不順時令疾病蟲霜忠臣受誅讒言者昌兵火欲起民人惶惶盜賊滿道死者不葬見開元占經五日中烏見者君咎雙烏見者將相逆入鬥者主出走烏動者大飢水旱不時人民流在他鄉救之法實倉庫舉賢士遠佞邪察後宮任有道赦不從則災消矣日中有黑氣若一若二至四五者此陽中伏陰君害臣上出者臣謀君旁出者君謀臣不出者宮女有憂昏見在臣晨見在君救之法輕刑罰赦無罪節威權安百姓貸不足則災消矣日中有黑氣若一若二至四五者教令不行三公為亂爵賞不平不救者臣圖君子謀父救之法任賢直信道德退貪邪省刑罰察奏諫思刑戮則無害日中有黑氣君之過大而臣不諫故日不明見變不救者主有憂救之法承順天地申用明堂則無害矣見開元占經六日暈明分中赤外青外人勝中青外赤中人勝中黃外青黑中人勝外黃中青黑外人勝外白內青外人勝內白外青中人勝中黃外青外人勝中青外黃內人勝日暈黃白不鬥兵未解青黑和解分地色黃土功動民不安色黑有水陰國勝色白有喪色青為疾色赤大旱流血千里日一暈一抱一珥為不和信者更逆不信者順日暈有背人臣有叛者或曰左右欲有走日暈有五色雲如杵貫日從外入外人勝從內出內人勝欲知姓名白者商赤者徵青者角黑者羽黃者宮日暈有衆雲在左右色黃白吉青白兵行黑白內亂青赤和解青黑流血俱明者未解兵不歸明者勝見開元占經八凡出軍擊賊見大流星所指者將之用兵順之行則勝流星下入軍營必空主將無功避之則吉見開元占經七十一令群臣寡人將立管仲為仲父善者入門而左不善者入門而右見韓非子外儲説左下桓公將立管仲令群臣嫁娶令丈夫二十而室婦人十五而嫁一作男子年二十而室女年十五而嫁見韓非子外儲説右下桓公微服以巡民家人有年老而自養者下令于民也禁厚葬令棺槨過度者戮其尸罪夫當喪者見韓非子內儲説上遇上令毋貯粟毋曲隄無擅廢適子無置妾以為妻見管子霸形遂興師而南存宋鄭與楚王遇于召陵之上而令于遇上與魯書子糾兄弟弗忍誅請魯自殺之召忽管仲讎也請得而甘心醢之不然將圍魯見史記齊太公世家葵丘盟凡我同盟之人既盟之後言歸于好見左傳僖九年初命曰誅不孝無易樹子無以妾為妻再命曰尊賢育才以彰有德三命曰敬老慈幼無忘賓旅四命曰士無世官官事無攝取士必得無專殺大夫五命曰無曲防無遏糴無有封而不告曰凡我同盟之人既盟之後言歸于好見孟子告子下毋雍泉毋訖糴毋易樹子毋以妾為妻毋使婦人與國事見穀梁傳僖九年令左右敢有先言歸者致死不赦見説苑正諫齊景公遊于海上而樂之六月不歸令左右立議吾不臣天子不友諸侯耕作而食之掘井而飲之吾無求于人也無上之名無君之祿不事仕而事力見韓非子外儲説右上案管子八十六篇今七十六篇見存不録録其佚文管子管子曰夫上懷耿介之心不蔭惡木之枝惡木尚能恥之況與惡人同處見文選陸機虎行注引江邃文釋塞道誓事之濟也聽我令事之不濟也免公子者為上死者為下吾以五乘之實距路見管子大匡鮑叔御小白乘而出于莒令車二十乘先十乘後曰事之未濟也老臣是以塞道鮑叔乃誓為桓公祝使臣無忘在莒時管子無忘在魯時寧子無忘車下時見御覽七百三十六引尸子釁社獻胙祝除君苛疾與若之多虛而少實見管子小問授酒祝又與君之若賢同上楹書布帛不可窮窮不可飾牛馬不可窮窮不可服士不可窮窮不可任國不可窮窮不可竊也見晏子春秋內篇雜下晏子病將死鑿楹納書焉謂其妻曰楹語也子壯而示之及壯發書之言又説苑反質作布帛不窮窮不可飾牛馬不窮窮不可服士不可窮窮不可仕窮乎窮乎窮也授趙簡子使者書主君之亡臣某不能束修越在諸侯以為主君憂臣聞之物扃于所甘士扃于所守主君之亡臣不佞而有四方之志其敢以為執事者之所辱夫丘陵崇而穴成于上狐狸藏矣溪谷深而淵成于下魚鱉安矣松柏茂而陰成于林塗之人則蔭矣主君之亡臣不佞實有隱衷惟執事者照明其所存如日月之升以光燭于晉國將四海之士重繭狎至以承主君之令聞夫豈唯亡臣亡臣雖復野死以置溝甽其敢忘主君之賜唯執事者財幸焉見子華子上案子華子偽書漢志隋唐志所不載姑録之至呂氏春秋引有五事則先秦古書也子華子子華子曰全生為上虧生次之死次之迫生為下見呂氏春秋貴生高誘注子華子古體道人子華子曰丘陵成而穴者安矣大水深淵成而魚鱉安矣松伯成而塗之人已蔭矣見呂氏春秋先己子華子曰王者樂其所以王亡者亦樂其所以亡故烹獸不足以盡獸嗜其脯則幾矣然則王者有嗜乎理義也亡者亦有嗜乎暴慢也所嗜不同故其禍福亦不同見呂氏春秋誣徒子華子曰厚而不博敬守一事正性是喜群衆不周而務成一能盡能既成四夷乃平惟彼天符不周而周此神農之所以長而堯舜之所以章也見呂氏春秋知度子華子見昭釐侯昭釐侯有憂色子華子曰今使天下書銘于君之前書之曰左手攫之則右手廢右手攫之則左手廢然而攫之必有天下君將攫之乎亡其不與昭釐侯曰寡人不攫也子華子曰甚善自是觀之兩臂重于天下也身又重于兩臂韓之輕于天下遠今之所爭者其輕于韓又遠君固愁身傷生以憂之戚不得也昭釐侯曰善教寡人者衆矣未嘗得聞此言也見呂氏春秋審為
