body:
  text: 田常遺令無攻越越猛虎也見呂氏春秋順民齊莊子請攻越問于和子和子曰先君有遺令云云莊子曰雖猛虎也而今已死矣案田常與勾踐同時知先君是田常也令殺人者死傷人者刑見呂氏春秋正名尹文曰王之令遺楚王書寡人患楚之不察于尊名也今秦惠王死武王立張儀走魏樗里疾公孫衍用而楚事秦夫樗里疾善乎韓而公孫衍善乎魏楚必事秦韓魏恐必因二人求合于秦則燕趙亦宜事秦四國爭事秦則楚為郡縣矣王何不與寡人并力收韓魏燕趙與為從而尊周室以案兵息民令于天下莫敢不樂聽則王名成矣王率諸侯并伐破秦必矣王取武關蜀漢之地私吳越之富而擅江海之利韓魏割上黨西薄函谷則楚之強百萬也且王欺于張儀亡地漢中丘銼藍田天下莫不代王懷怒今乃欲先事秦願大王熟計之見史記楚世家書謝孟嘗君寡人不祥被于宗廟之崇沈于諂諛之臣開罪于君寡人不足為也願君顧先王之宗廟姑反國統萬人乎見戰國策十一孟嘗君就國于薛梁王遺聘使三反孟嘗君固辭不往也齊王聞之書謝孟嘗君遺秦相穰侯魏冉書吾聞秦欲以呂禮收齊齊天下之強國也子必輕矣齊秦相取以臨三晉呂禮必并相矣是子通齊以重呂禮也若齊免于天下之兵其仇子必深矣子不如勸秦王伐齊齊破吾請以所得封子齊破秦畏晉之強秦必重子以取晉晉國弊于齊而畏秦晉必重子以取秦是子破齊以為功挾晉以為重是子破齊定封秦晉交重子若齊不破呂禮復用子必大窮見史記孟嘗君傳書門版有能揚文之名止文之過私得寶于外者疾入諫見戰國策十令城中當有神人為我師見史記田單傳遺書責蘇秦張儀若二君豈不見河邊之樹乎僕御折其枝波浪蕩其根上無徑尺之陰身被數千之痕此木豈與天地有仇怨所居然也子不見嵩岱之松柏華霍之檀桐乎上枝干于青雲下根通于三泉千秋萬歲不受斧斤之患此木豈與天地有骨肉哉蓋所居然也見藝文類聚三十六引袁淑真隱傳又見御覽五百十二君足下功名赫赫但春到秋不得久茂日既將盡時既將老君不見河邊之樹乎僕馭折其枝波浪激其根此木非天下人有仇怨所居者然也子不見嵩岱松柏華霍之樹上葉陵青雲下根通三泉上有玄狐黑猿下有豹隱龍潛千秋萬歲不逢斧斤之患此木非與天下人有骨血蓋所居然也今二子好雲路之榮慕長久之功輕喬松之永延貴一夕之浮爵痛焉悲夫二君痛焉悲夫二君見杜光庭録異記案此校真隱傳互有刪節而首尾多十飯語故并録之上書説秦惠王大王之國西有巴蜀漢中之利北有胡貉代馬之用南有巫山黔中之限東有肴函之固田肥美民殷富戰車萬乘奮擊百萬沃野千里蓄積饒多地勢形便此所謂天府天下之雄國也以大王之賢士民之衆車騎之用兵法之教可以并諸侯吞天下稱帝而治願大王少留意臣請奏其效臣固疑大王之不能用也昔者神農伐補遂黃帝伐涿鹿而禽蚩尤堯伐歡兜舜伐三苗禹伐共工湯伐有夏文王伐崇武王伐紂齊桓任戰而伯天下由此觀之惡有不戰者乎古者使車轂擊馳言語相結天下為一約從連橫兵革不藏文士并飾諸侯亂惑萬端俱起不可勝理科條既備民多偽態書策稠濁百姓不足上下相愁民無所聊明言章理兵甲愈起辨言偉服戰攻不息繁稱文辭天下不治舌弊耳聾不見成功行義約信天下不親于是乃廢文任武厚養死士綴甲厲兵效勝于戰場夫徒處而致利安坐而廣地雖古五帝三王五伯明主賢君常欲坐而致之其勢不能故以戰續之寬則兩軍相攻迫則杖戟相撞然後可建大功是故兵勝于外義強于內威立于上民服于下今欲并天下凌萬乘詘敵國制海內子元元臣諸侯非兵不可今之嗣主忽于至道皆惛于教亂于治迷于言惑于語沈于辨溺于辭以此論之王固不能行也見戰國策三蘇秦始將連橫説惠王云云案下文云説秦王書十上而説不行明此二首皆是上書為齊上書説趙王臣聞古之賢君德行非施于海內也教順慈愛非布于萬民也祭祀時享非當于鬼神也甘露降風雨時至農夫登年穀豐盈衆人喜之而賢主惡之今足下功力非數痛加于秦國而怨毒積惡非曾深凌于韓也臣竊外聞大臣及下吏之議皆言主前專據以秦為愛趙而憎韓臣竊以事觀之秦豈得愛趙而憎韓哉欲亡韓吞兩周之地故以韓為餌先出聲于天下欲鄰國聞而觀之也恐其事不成故出兵以佯示趙魏恐天下之驚覺故微韓而二之恐天下疑己故出質以為信聲德于與國而實伐空韓臣竊觀其圖之也議秦以謀計必出于是且夫説士之計皆曰韓亡三川魏滅晉國恃韓未窮而禍及于趙且物固有勢異而患同者又有勢同而患異者昔者楚人久伐而中山亡今燕盡韓之河南距沙丘而至巨鹿之界三百里距于扞關至于榆中千五百里秦盡韓魏之上黨則地與國都邦屬而壤挈者七百里秦以三軍強弩坐羊唐之上即地去邯鄲二十里且秦以三軍攻王之上黨而危其北則句注之西非王之有也今魯句注禁常山而守三百里通于燕之唐曲吾此代馬胡駒不東而崑山之玉不出也此三寶者又非王之有也今從于強秦國之伐齊臣恐其禍出于是矣昔者五國之王嘗合橫而謀伐趙參分趙國壤地著之盤盂屬之讎柞五國之兵有日矣韓乃西師以禁秦國使秦發令素服而聽反溫枳高平于魏反三公什清于趙此王之明知也夫韓事趙宜正為上交今乃以抵罪取伐臣恐其後事王者之不敢自必也今王收天下必以王為得韓危社稷以為王天下必重王然則韓義王以天下就之下至韓慕王以天下收之是一世之命制于王已臣願大王深與左右群臣卒計而重謀先事成慮而熟圖之也見戰國策十八又見史記趙世家作蘇厲為齊遺趙王書小同大異今別載于後從約秦攻楚齊魏各出鋭師以佐之韓絶食道史記作韓絶其糧道趙涉河漳燕守常山之北秦攻韓魏則楚絶其後齊出鋭師以佐之趙涉河漳燕守云中秦攻齊則楚絶其後韓守城皋魏塞午道趙涉河漳博關燕出鋭師以佐之秦攻燕則趙守常山楚軍武關齊涉渤海韓魏出鋭師以佐之秦攻趙則韓軍宜陽楚軍武關魏軍河外齊涉渤海史記作濟涉清河燕出鋭師以佐之諸侯有先背約者五國共伐之見戰國策十九史記蘇秦傳案此説趙王之詞而蘇秦傳下文言既約六國從親歸趙趙肅侯封為武安君乃投從約書于秦蓋即此文也故録之遺燕昭王書夫列在萬乘而寄質于齊名卑而權輕秦齊助之伐宋民勞而實費破宋殘楚淮北肥大齊仇強而國弱也此三者皆國之大敗也而足下行之將欲以除害居信于齊也而齊未加信于足下而忌燕也愈甚矣然則足下之事齊也失所為矣夫民勞而實費又無尺寸之功破宋肥仇而世負其禍矣足下以宋加淮北強萬乘之國也而齊并之是益一齊也北夷方七百里加之以魯衛此所謂強萬乘之國也而齊并之是益二齊也夫一齊之強而燕猶不能支也今乃以三齊臨燕其禍必大矣雖然臣聞知者之舉事也轉禍而為福因敗而成功者也齊人紫敗素也而賈十倍越王勾踐栖于會稽而後殘吳霸天下此皆轉禍而為福因敗而為功者也今王若欲轉禍而為福因敗而為功乎則莫如遙伯齊而厚尊之使使盟于周室盡焚天下之秦符約曰夫上計破其次長賓之秦秦挾賓客以待破秦王必患之秦五世以結諸侯今為齊下秦王之志苟得窮齊不憚以一國都為功然而王何不使布衣之人以窮齊之説説秦謂秦王曰燕趙破宋肥齊尊齊而為之下者燕趙非利之也弗利而勢為之者何也以不信秦王也今王何不使可以信者接收燕趙令涇陽君若高陵君先于燕趙秦有變因以為質則燕趙信秦矣秦為西帝趙為中帝燕為北帝立為三帝而以令諸侯韓魏不聽則秦伐之齊不聽則燕趙伐之天下孰敢不聽天下服聽因驅韓魏以攻齊曰必反宋地而歸楚之淮北夫反宋地歸楚之淮北燕趙之所同利也并立三帝燕趙之所同願也夫實得所利名得所願則燕趙之棄齊也猶釋弊烋今王之不收燕趙則齊伯必成矣諸侯戴齊而王獨弗從也是國伐也諸侯戴齊而王從之是名卑也王不收燕趙名卑而國危王收燕趙名尊而國寧夫去尊寧而就卑危知者不為也秦王聞若説也必如刺心然則王何不務使知士以若此言説秦秦伐齊必矣夫取秦上交也伐齊正利也尊上交務正利聖王之事也見戰國策二十九又見史記蘇秦傳自齊獻書燕王臣之行也固知將有口事故獻御書而行曰臣貴于齊燕大夫將不信臣臣賤將輕臣臣用將多望于臣齊有不善將歸罪于臣天下不攻齊將曰善為齊謀天下攻齊將與齊兼鄮臣臣之所重處重卵也王謂臣曰吾必不聽衆口與讒言吾信汝也猶剗刈者也上可以得用于齊次可以得信于下苟無死女無不為也以女自信可也與之言曰去燕之齊可也期于成事而也期于成事而已臣受令以任齊及五年齊數出兵未嘗謀燕齊趙之交一合一離燕王不與齊謀趙則與趙謀齊齊之信燕也至于虛北地行其兵今王信田伐與參去疾之言且攻齊使齊犬馬𩤊而不言燕今王又使慶今曰吾欲用所善王苟欲用之則臣請為王事之王欲醳臣鄟任所善則臣請歸醳事臣苟得見則盈願見戰國策三十約燕昭王楚得枳而國亡齊得宋而國亡齊楚不得以有枳宋事秦者何也是則有功者秦之深仇也秦取天下非行義也暴也秦之行暴于天下正告楚曰蜀地之甲輕舟浮于汶乘夏水而下江五日而至郢漢中之甲乘舟出于巴乘夏水而下漢四日而至五渚寡人積甲宛東下隨知者不及謀勇者不及怒寡人如射隼矣王乃待天下之攻函谷不亦遠乎楚王為是之故十七年事秦秦正告韓曰我起乎少曲一日而斷大行我起乎宜陽而觸平陽二日而莫不盡繇我離兩周而觸鄭五日而國舉韓氏以為然故事秦秦正告魏曰我舉安邑塞女戟韓氏太原卷我下枳道南陽封冀包兩周乘夏水浮輕舟強弩在前銛戈在後決滎口魏無大梁決白馬之口魏無濟陽決宿胥之口魏無虛頓丘陵攻則擊河內水攻則滅大梁魏氏以為然故事秦秦欲攻安邑恐齊救之則以宋委于齊曰宋王無道為木人以寫寡人射其面寡人地絶兵遠不能攻也王苟能破宋有之寡人如自得之已得安邑塞女戟因以破宋為齊罪秦欲攻齊恐天下救之則以齊委于天下曰齊王四與寡人約四斯寡人必率天下以攻寡人者三有齊無秦無齊有秦必伐之必亡之已得宜陽少曲致藺石因以破齊為天下罪秦欲攻魏重楚則以南陽委于楚曰寡人固與韓且絶矣殘均陵塞鄳益苟利于楚寡人如自有之魏棄與國而合于秦因以塞鄳兵困于林中重燕趙以膠東魏于燕以濟西委于趙趙得講于魏至公子延因犀首屬行而攻趙兵傷于離石史記作譙石遇敗于馬陵而重魏則以葉蔡魏于魏已得講于趙則劫魏魏不為割困則使太后穰侯為和嬴則兼斯舅與母適燕者曰以膠東適趙者曰以濟西適魏者曰以葉蔡適楚者曰以塞鄳隘適齊者曰以宋此必令其言如循環用兵如刺繡母不能制舅不能約龍賈之戰岸門之戰封陸之戰高商之戰趙莊之戰秦之所三晉之民數百萬今其生者皆死秦之孤也西河之外上雒之地三川晉國之禍三晉之半秦禍如此大而燕趙之秦者皆以爭事秦説其主此臣之所大患見戰國策三十秦召燕王燕王欲往蘇代約燕王燕昭王不行又見史記蘇秦傳為齊陰遺穰侯書臣聞往來者言曰秦將益趙甲四萬以伐齊臣竊必弊邑之王曰秦王明而熟于計穰侯智而習于事必不益趙甲四萬以伐齊是何也夫三晉之相與也秦之深仇也百相背也百相欺也不為不信不為無行今破齊以肥趙趙秦之深仇不利于秦此一也秦之謀者必曰破齊弊晉楚而後制晉楚之勝夫齊罷國也以天下攻齊如以千鈞之弩決潰癰也必死安能弊晉楚此二也秦少出兵則晉楚不信也多出兵則晉楚為制于秦齊恐不走秦必走晉楚此三也秦割齊以啖晉楚晉楚案之以兵秦反受敵此四也是晉楚以秦謀齊以齊謀秦以齊謀秦也何晉楚之智而秦齊之愚此五也故得安邑以善事之亦必無患矣秦有安吧韓氏必無上黨矣取天下之腸胃與出兵而懼其不反也孰利臣故曰秦王明而熟于計穰侯智而習于事必不益趙甲四萬以伐齊矣見史記穰侯傳又戰國策四穰侯傳十餘字稍有脫誤為齊遺趙王書臣聞古之賢君其德行非布于海內也教順非洽于民人也祭祀時享非數常于鬼神也甘露降時雨至年穀豐熟民不疾疫衆人善之然而賢主圖之今足下之賢行功力非數加于秦也怨毒積怒非素深于齊也秦趙與國以強征兵于韓秦誠愛趙乎其實憎齊乎物之甚者賢主察之秦非愛趙而憎齊也欲亡韓而吞二周故以齊餤天下恐事之不合故出兵以劫魏趙恐天下畏己也故出質以為信恐天下亟反也故征兵于韓以威之聲以德與國實而伐空韓臣以秦計為必出于此夫物固有勢異而患同者楚久伐而中山亡今齊久伐而韓必亡破齊王與六國分其利也亡韓秦獨擅之收二周西取祭器秦獨私之賦田計功王之獲利孰與秦多説士之計曰韓亡三川魏亡晉國市朝未變而禍已及矣燕盡齊之北地去沙丘巨鹿斂三百里韓之上黨去邯鄲百里燕秦謀王之河山間三百里而通矣秦之上郡近挺關至于榆中者千五百里秦以三郡攻王之上黨羊腸之西句注之南非王有已逾句注斬常山而守之三百里而通于燕伐馬胡犬不東下昆山之玉不出此三寶者亦非王有已王久伐齊從強秦攻韓其禍必至于此願王孰慮之且齊之所以伐者以事王也天下屬行以謀王也燕秦之約成而兵出有日矣五國三分王之地齊倍五國之約而殉王之患西兵以禁強秦秦廢帝請服反高平根柔徐廣曰根柔一作鹿柔一作平柔于魏反巠分徐廣曰一作王公先俞于趙齊之事王宜為上佼而今乃抵罪臣恐天下後事王者之不敢自必也願王孰計之也今王毋與天下攻齊天下必以王為義齊抱社稷而厚事王天下必盡重王義王以天下善秦秦暴王以天下禁之是一世之名寵制于王也史記趙世家趙與韓魏秦共擊齊齊王敗走燕獨深入取臨災十六年秦復與趙數擊齊齊人患之蘇厲為齊遺趙王書于是趙乃輟謝秦不擊齊案戰國策十八作蘇秦彼篇多誤當以史記為正十酒説羅襦排門翠笄窺牖見御覽七百十八引齊淳于髡十酒説遺燕將書吾聞之智者不倍時而棄利勇士不怯死而滅名忠臣不先身而後君今公行一朝之忿不顧燕王之無臣非忠也殺身亡聊城而威不信于齊非勇也功廢名滅後世無稱非知也故知者不再計勇士不怯死今死生榮辱尊卑貴賤此其一時也願公之詳計而無與俗同也且楚攻南陽魏攻平陸齊無南面之心以為亡南陽之害不若得濟北之利故定計而堅守之今秦人下兵魏不敢東面橫秦之勢合則楚國之形危且棄南陽斷右壤存濟北計必為之今楚魏交退燕救不至齊無天下之規與聊城共據期年之弊即臣見公之不能得也齊必快之于聊城公無再計彼燕國大亂君臣過計上下迷惑栗腹以百萬之衆五折于外萬乘之國被圍于趙壤削主困為天下戮公聞之乎今燕王方寒心獨立大臣不足恃國弊禍多民心無所歸今公又以弊聊之民距全齊之兵期年不解是墨翟之守也食人炊骨士無反北之心是孫臏吳起之兵也能以見于天下矣故為公計者不如罷兵休士全車甲歸報燕王燕王必喜士民見公如見父母交遊攘臂而議于世功業可明矣上輔孤主以制群臣下養百姓以資説士矯國革俗于天下功名可立也意者亦捐燕棄世東遊于齊乎請裂地定封富比陶衛世世稱孤寡與齊久存此亦一計也二者顯名厚實也願公熟計而審處一也且吾聞效小節者不能行大威惡小恥者不能立榮名昔管仲射桓公中鉤篡也遺公子糾而不能死怯也束縛桎梏辱身也此三行者鄉里不通也世主不臣也使管仲終窮抑幽囚而不出慚恥而不見窮年沒壽不免為辱人賤行矣然而管子并三行之過據齊國之政一匡天下九合諸侯為伍伯首名高天下光照鄰國曹沫為魯君將三戰三北而喪地千里使曹子之足不離陳計不顧後出必死而不生則不免為敗軍禽將曹子以敗軍禽將非勇也功廢名滅後世無稱非知也故去三北之恥退而與魯君也曹子以為遭齊桓公有天下朝諸侯曹子以一劍之任劫桓公于壇位之上顏色不變而辭氣不悖三戰之所喪一朝而反之天下震動驚駭威信吳楚傳名後世若此二公者非不能行小節死小恥也以為殺身絶世功名不立非知也故去忿恚之心而成終身之名除感忿之恥而立纍世之功故業與三王爭流名與天壤相敝也公其圖之見戰國策十三燕將保守聊城田單攻之歲餘不下魯仲連乃書約之矢以射城中遺燕將燕將曰敬聞命矣因罷兵到讀而去吾聞之智者不倍時而棄利勇士不怯死而滅名忠臣不先身而後君今公行一朝之忿不顧燕王之無臣非忠也殺身亡聊城而威不信于齊非勇也功敗名滅後世稱焉非智也三者世主不臣説士不載故智者不再計勇士不怯死今死生榮辱貴賤尊卑此時不再至願公詳計而無與俗同且楚攻齊之南陽魏攻平陸而齊無南面之心以為亡南陽之害小不如得濟北之利大故定計審處之今秦人下兵魏不敢東面衡秦之勢成楚國之形危齊棄南陽斷右壤定濟北計猶且為之也且夫齊之必決于聊城公勿再計今楚魏交退于齊而燕救不至以全齊之兵無天下之規與聊城共據期年之敝則臣見公之不能得也且燕國大亂君臣失計上下迷惑栗腹以十萬之衆五折于外以萬乘之國被圍于趙壤削主困為天下僇笑國敝而禍多民無所歸心今公又以敝聊之民距全齊之兵是墨翟之守也食人炊骨士無反外之心是孫臏之兵也能見于天下雖然為公計者不如全車甲以報于燕車甲全而歸燕燕王必喜身全而歸于國士民如見父母交遊攘臂而議于世功業可明上輔孤主以制群臣下養百姓以資説士矯國更俗功名可立也亡意亦捐燕棄世東遊于齊乎裂地定封富比乎陶衛世世稱孤與齊久存又一計也此兩計者顯名厚實也願公詳計而審處一焉且吾聞之規小節者不能成榮名惡小恥者不能立大功昔者管夷吾射桓公中其鉤篡也遺公子糾不能死怯也束縛桎梏辱也若此三行者世主不臣而鄉里不通鄉使管子幽囚而不出身死而不反于齊則亦名不免為辱人賤行矣臧獲且羞與之同名矣況世俗乎故管子不恥身在縲紲之中而恥天下之不治不恥不死公子糾而恥威之不信于諸侯故兼三行之過而為五霸首名高天下而光燭鄰國曹子為魯將三戰三北而亡地五百里鄉使曹子計不反顧議不還踵刎頸而死則亦名不免為敗軍禽將矣曹子棄三北之恥而退與魯君計桓公朝天下會諸侯曹子以一劍之任枝桓公之心于壇坫之上顏色不變辭氣不悖三戰之所亡一朝而復之天下震動諸侯驚駭威加吳越若此二士者非不能成小廉而行小節也以為殺身亡軀絶世滅後功名不立非智也故去感忿之怨立終身之名棄忿悁之節定纍世之功是以業與三王爭流而名與天壤相弊也願公擇一而行之見史記魯仲連傳校戰國策有刪節亦有多出字句據下文言燕將見書泣三日自殺知史記此書取之魯連子非本戰國策者也故并載之魯連子齊之辨士田巴辨于徂丘議于稷下毀五帝罪三王訾五伯離堅白合同異一日而服千人有徐劫者其弟子曰魯仲連連謂徐劫曰臣願得當田子使之必不復談可乎徐劫言之巴曰劫弟子年十二耳然千里之駒也願得侍議于前可乎田巴曰可魯連得見曰臣聞堂上之糞不除效草不藝白刃交前不救流矢何者急不暇緩也今楚軍南陽趙伐高唐燕人十萬之衆在聊城而不去國亡在旦暮耳先生將奈何田巴曰無奈何魯連曰夫危不能為安亡不能為存則無為貴學士矣今臣將罷南陽之師還高唐之兵卻聊城之衆所為貴談者其若此也先生之言有似梟鳴出聲而人皆惡之願先生勿復談也田巴曰謹受教明日復見徐劫曰先生之駒乃飛兔騕裊也豈特千里哉于是杜口終身不復談見史記魯仲連傳正義意林一文選曹植與楊德祖書注荀子疆國篇注御覽三百八十五四百六十四九百二十七陳無宇謂門客曰昔荊來伐無一人死何國之寡士也門客對曰君車衣文繡士不得以為緑鵝鴨有餘食士不足菽稗堂上有酒池士烈得一嘗財者君之所輕死者士之所重君不能以所輕與士欲得士之所重不亦難乎見藝文類聚九十一意林一文選別賦注又廣絶交論注御覽九百十九一井五瓶泄可立待一灶五突烹飪十倍分煙者衆也見藝文類聚八十白帖十一御覽一百八十六諺曰百足之蟲至斷不蹶者持之者衆也見文選曹冏六代論注意林一御覽九百四十四又九百四十八人心難知于天天有春夏秋冬以作時人皆深情厚貌以相欺見意林一人君所察者三不可以不知不知時與不時譬猶春不耕也不知行與不行譬以方為輪也不知宜與不宜譬以錦緑薦也見藝文類聚六十九意林一御覽七百九朝露之蒲工女不能治淄澠之沙計兒不能數見御覽七十四東山有松樅高十仞而無枝非憂正室之無柱也見水經汶水注藝文類聚八十九文選七發注齊竟陵文宣王行狀注御覽九百五十八南方有烏名為邽生而食其翼見御覽九百二十八北方有獸名為豚生而角當心俯厲其角潰心而死見御覽九百一十三市處者僕妾膾炙而食市饒也壅泉沃織屨之氓從兄弟室父往而不得粗糒焉非愛其僕妾惡其室父也此其饒羡之與不足也見御覽九百七十六舜耕歷山而交益陶河濱而交禹見御覽四百九路史後紀十二古善漁者宿沙瞿子使漁于山則雖十宿沙子不得一魚焉宿沙非暗于漁道也彼山者非魚之所生也見後漢馬融傳注御覽八百三十三九百三十五事類賦注二十九困學紀聞十宿沙瞿子善煮鹽使煮滔沙御覽作潰沙雖十宿不能得也見北堂書鈔一百四十六御覽八百六十五在太華之陽見水經丹水注路史國名紀三伊尹負鼎佩刀以干湯得意故尊宰舍見文選王褒聖主得賢臣頌注東方朔非有先生論注共伯名和好行仁義諸侯賢之周厲王無道國人作難王奔于彘諸侯奉和以行天子事號曰共和元年十四年年厲王死于彘共伯使諸侯奉王子靖為宣王而共伯復歸國于衛得意共山之首見史記周本紀正義莊子讓王釋文太平寰宇記五十六魯史發揮二案正義首云衛州共城縣本周共伯之國也是張守節語混入魯連子今刪楚王成章華之臺酌諸侯酒魯君先至楚王悅之與大曲之弓不琢之璧己而悔之薳啓疆見魯侯一作伍舉見魯公曰大曲之弓不琢之璧楚上寶也吳及齊求于楚楚不與弓三年乃成射不窮矢發之血流漂井今聞在魯必求之魯君懼乃歸之見左傳昭七年疏史記魯世家集解北堂書鈔一百二十五御覽三百四十七四百九十七八百二八百六弦銲相第而矰矢得高焉專諸刺僚王闔廬乃成名焉見御覽三百五十齊伐魯宋乘羽子謂齊將曰子羔為成大夫而善養天下士見北堂書鈔三十四所同食天下士至同上陸子謂齊湣王曰魯費之衆臣甲舍于襄賁見水經沂水注朐劇之人辨者也見水經巨洋水注孟子劇之辨者見太平寰宇記十八孟嘗君逐于齊談子曰富貴則就貧賤則去此物之必至而理之固然也願君勿怨請以市論市朝則盈夕則虛非朝愛而夕則憎之也勢使然也見藝文類聚六十五文選張協雜詩注女史針注展無所為魯君使遺齊襄君鴻至澠而浴鴻鴻失其裝在御者曰鴻之毛物可使若一能買鴻耳無所曰吾非不能買鴻也是上隱君下易幣無所不取見初學記二十又御覽九百十六作上隱君下蔽罪也無俱作毋魯連先生見孟嘗君于杏唐御覽作杏堂之門孟嘗君曰吾聞先生有勢數可得聞乎連曰勢數者若門關舉之而便則可以一指持中而舉之非便則兩手不起關非益加重兩手非罷也彼所起者非舉勢也彼可舉然後舉之所謂勢數見藝文類聚六十三御覽一百八十三一百八十四秦師圍趙邯鄲魏使將軍新垣衍入邯鄲令趙尊秦為帝魯連辨説罷之秦軍退平原君欲封之終不肯受平原君乃置酒酒酣起前以千金為壽先生笑曰所貴天下之士者為人排患釋難解人之締結即有取是商賈之事連不忍為也遂策杖去見藝文類聚六十九八十三文選左思招隱詩注御覽八百十八百二十九燕伐齊取七十餘城唯莒與即墨不下齊田單以即墨破燕軍殺燕將軍騎劫復齊城唯城不下燕將城守數月魯仲連乃為書著之于矢以射城中遺燕將燕將得書泣三日乃自殺見藝文類聚六十御覽三百五十又五百九十九事類賦注十三棄感忽之恥立纍世之功見荀子議兵篇注案此遺燕將書也有脫誤戰國策史記作感忿而上下忿字復見疑彼亦誤
