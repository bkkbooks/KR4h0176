body:
  text: 鬻熊案漢志道家鬻子二十二篇小說家鬻熊說一篇隋志僅道家一卷意林一卷六篇今本逢行珪注十四篇以群書治要校之實三篇見存不錄錄其佚文鬻子鬻熊曰運轉亡已天地密移疇覺之哉故物損于彼者盈于此成于此者虧于彼捐盈成虧隨世隨死往來相接間不可省疇覺之哉見列子天瑞鬻子曰欲剛必以柔守之欲強必以弱保之積于柔必剛積于弱必強觀其所積以知禍福之鄉強勝不若己至于若己者剛柔勝出于己者其力不可量見列子黃帝鬻熊語文王曰自長非所增自短非所損算之所亡若何見列子力命鬻子曰去名者無憂同上周文王問于鬻子曰敢問君子將入其職則于其民也何如鬻子對曰唯疑請以上世之政詔于君王政曰君子將入其職則于其民也旭旭然如日之始出也周文王曰受命矣曰君子既入其職則于其民也何若對曰君子既入其職則于其民也暵暵御覽引本注云音漢然如日之正中也周文王曰受命矣曰已入也故君子將入而旭旭者義先聞也既入而暵暵者民保其福也既去而暗暗者民失其教也周文王曰受命矣見胡維新本賈誼新書修政語下宋本御覽三周武王問于鬻子曰寡人願守而必存攻而必得戰而必勝則吾為此奈何鬻子對曰唯攻守而勝乎同道而和與嚴其備也故曰和可以守而嚴可以守而嚴不若和之固也和可以攻而嚴可以攻而嚴不若和之得也和可以戰而嚴可以戰而嚴不若和之勝也則唯由和而可也故諸侯發政施令政平于人者謂之文政矣諸侯接士而使吏禮恭于人者謂之文札矣諸侯聽獄斷刑治仁于人者謂之文誅矣故三文立于政行于禮陳于刑由此守而不存攻而不得戰而不勝者自古而至于今自天地之辟也未之嘗聞也今也君王欲守而必存攻而必得戰而必勝郥唯由此也而可也周武王曰受命矣見賈誼新書修政語下長短經政體周成王年六歲即位享國親以其身見于鬻子之家而問焉曰昔者先王與子修道而道修寡人之望也亦願以教敢問興國之道奈何鬻子對曰唯疑請以上世之政詔于君王政曰興國之道君思善則行之君聞善則行之君知善則行之位敬而常之行信而長之則興國之道也周成王曰受命矣見賈誼新書修政語下周成王曰敢問于道之要奈何鬻子對曰唯疑請以上世之政詔于君王政曰為人下者敬而肅為人上者恭而仁為人君者敬士愛民以終其身此道之要也周成王曰受命矣同上周成王曰敢問治國之道若何鬻子對曰唯疑請以上世之政詔于君王政曰治國之道上忠于主而中敬其士而下愛其民故上忠其主者非以道義則無以入忠也而中敬其士不以禮節則無以諭敬也而下愛其民非以忠信則無以諭愛也故忠信行于民而禮節諭于士道義入于上則治國之道也雖治天下者由此而已周成王曰受命矣同上周成王曰寡人聞之有上人者有下人者有賢人者有不肖人者有智人者有愚人者敢問上下之人何以為異鬻子對曰唯疑請以上世之政詔于君王政曰凡人者若賤若貴若幼若老聞道志而荿之知道善而行之上人矣聞道而弗取藏也知道而弗取行也則謂之下人也故夫行者善則謂之賢人矣行者惡則謂之不肖矣故夫言者善則謂之智矣言者不善則謂之愚矣故智愚之人有其辭矣賢不肖之人矣上下之人等其志矣周成王曰受命矣同上周成王問于鬻子曰寡人聞之聖王在上位使民富且壽云若夫富則可為也若夫壽則不在天乎鬻子對曰唯疑請以上世之政詔于君王政曰聖王在上位則天下不死軍兵之事故諸侯不私相攻而民不私相斗鬩不私相殺也故聖王在上位則民免于一死而得一生矣聖王在上則君積于道而吏積于德而民積于用力故婦人為其所衣丈夫為其所食則民無凍餒矣故聖王在上則民免于二死而得二生矣聖王在上則君積于仁而吏積于愛而民積于順則刑罰廢矣而民大過之誅故聖王在上則民免于三死而得三生矣聖王在上則使民有時而用之有節則民無癘疾矣故聖王在上則民免于四死而得四生矣故聖王在上則使盈境內興賢良以禁邪惡故賢人必用而不肖人不作則已得其命矣故夫富且壽者聖王之功也周成王曰受命矣見賈誼新書修政語下御覽八十四昔者黃帝年十歲知神農之非而改其政使四面從五聖見北堂書鈔十一御覽七十九此條當在今本昔者帝顓頊年十五之上昔文王見鬻子年九十御覽作鬻子年九十見文王文王曰嘻老矣鬻子曰若使臣捕虎逐麋則臣已老矣使臣坐策國事則臣年尚少因立為師見意林一御覽三百八十三武王率兵車以伐紂紂虎旅百萬陳于商郊起自黃鳥訖于赤斧走如疾風聲如振霆三軍之士靡不失色武王乃命太公把旄以麾之紂軍反走見文選任彥升宣德皇后令注史孝山出師頌注范蔚宗光武紀贊注御覽三百一僕區之法盜所隱器與盜同罪見左傳昭七年芊尹無宇引吾先君文王作僕區之法注僕區刑書名號令國中寡人之所明于人君者莫如桓公所賢于人臣者莫如管仲明其君而賢其臣寡人願事之誰能為交齊者寡人不愛封侯之君焉見管子霸形初即位令國中有敢諫者死無赦見史記楚世家又令寡人惡為人臣而遽諫其君者今寡人有國家立社稷有諫則死無赦見說苑正諫楚莊王立為君三年不聽朝乃令于國葬馬令有敢以馬諫者罪至死見史記滑稽傳勤箴民生在勤勤則不匱見左傳宣十二年與宋人盟我無爾詐爾無我虞見左傳宣十五年茅門法群臣大夫諸公子入朝馬蹄踐霤者廷理斬其輈戮其御見韓非子外儲說右上過鄭誓有犯命者君大廢小人降見左傳昭六年楚公子棄疾如晉過鄭禁芻牧采樵不入田不樵樹不采藝不抽屋不強匄誓曰云云下法死靈王有敢鑲王從王者罪及三族見史記楚世家靈王行遇故鋗人求食鋗人曰新王下法將死戒其子王數封我矣吾不受也為我死王則封汝必無受利地楚越之間有寢之丘者此其地不利而名甚惡史記正義引作其為地不利而前有妒谷後有戾丘其名惡案淮南子注寢丘今汝南固始地前有垢谷後有莊丘名惡荊人畏鬼而越人信可長有者甚唯此也見呂氏春秋異寶又史記稽傳正義後漢郭丹傳注并引呂氏春秋案此文亦見列子說符淮南人間訓祭典國君有牛享大夫有羊饋士有豚犬之奠庶人有魚炙之薦籩豆脯醢則上下共之不羞珍異不陳庶侈見楚語上令乾谿師眾國有王矣先歸復爵邑田室後者遷之見史記楚世家觀從此師于乾谿令楚眾云云楚眾皆潰去靈王而歸顧命毋以小謀敗大作毋以嬖御人疾莊后毋以嬖御士疾莊士大夫卿士見禮記緇衣引葉公之顧命云云注葉公楚縣公葉公子高也臨死亦書曰顧命案此文見逸周書祭公篇葉乃祭字之誤鄭望文為解非其實也今姑從鄭錄之南門令有能徙此于南門之外者賜之上田上宅見韓非子內儲說上吳起為西河守秦有小亭臨境起欲攻之不以征甲兵乃倚一車轅于北門之外而令之西門令有徒此于西門之外者賜之如初同上俄又置一石赤菽東門之外而令之攻秦亭令明日且攻亭有能先登者仕之國大夫賜之上田宅同上乃下令大夫又南門令明日有人僨南門之外表者仕長大夫見呂氏春秋慎小吳起治西河欲諭其信于民夜日置表于南門之外令于邑中上書說秦昭王天下莫強于秦楚今聞大王欲伐楚此猶兩虎相與鬥兩虎相與鬥而駑犬受其弊不如善楚臣請言其說臣聞物至則反冬夏是也致至徐廣曰至或作安則危累棋是也今大國之地遍天下有其二垂此從生民以來乃乘之地未嘗有也先帝文王莊王之身三世不忘接地于齊以絕從親之要今王使盛橋守事于韓盛橋以其地入秦是王不用甲不信威而得百里之地王可謂能矣王又舉甲而攻魏杜大梁之門舉河內拔燕酸棗虛桃入邢魏之兵云翔而不敢捄王之功亦多矣王休甲息眾二年而後復之又并蒲衍首垣以臨仁平丘黃濟陽嬰城而魏氏服王又割濮磨之北注齊秦之要絕楚趙之脊天下五合六聚而不敢救王之威亦單徐廣曰單亦作殫矣王若能持功守威絀攻取之心而肥仁義之地使無後患三王不足四五伯不足六也王若負人徒人眾仗兵革之強乘毀魏之威而欲以力臣天下之主臣恐其有後患也詩曰靡不有初鮮克有終易曰孤涉水濡其尾此言始之易終之難也何以知其然也昔智氏見伐趙之利而不知榆次之禍吳見伐齊之便而不知干隧之敗此二國者非無大功也沒利于前而易患于後也吳之信越也從而伐齊既勝齊人于艾陵還為越王禽三渚集解引戰國策渚作江之浦智氏之信韓魏也從而伐趙攻晉陽城勝有日矣韓魏叛之殺智伯瑤于鑿台之下今王妒楚之不毀也而忘毀楚之強韓魏也臣為王慮而不取也詩曰大武遠宅而不涉從此觀之楚援也鄰國敵也詩云趯趯毚兔遇犬獲之他人有心余忖度之今王中道而信韓魏之善王也此正吳之信越也臣聞之敵不可假時不可失臣恐韓卑辭除患而實欲欺大國也何則王無重世之德于韓魏而有累世之怨焉夫韓魏父子兄弟接踵而死于秦者將十世矣本國殘社稷壞宗廟毀刳腹絕腸析頸握頤徐廣曰一作顛首身分離暴骸骨于草澤頭顱僵僕相望于境父子老弱系脰束手為群虜者相及于路鬼神孤傷無所血食人民不聊生族類離流亡為僕妾者盈滿海內矣故韓魏之不亡秦社稷之憂也今王資之與攻楚不亦過乎且王攻楚將惡出兵王將借路于仇讎之韓魏乎兵出之日而王憂其不返也是王以兵資于仇讎之韓魏也王將借路于仇讎之韓魏必攻隨水右壤隨水右壤此皆廣川大水山林谿谷不食之地也王雖有之不為得地是王有毀楚之名而無得地之實也且王攻楚之日四國必悉起兵以應王秦楚之兵構而不離魏氏將出而攻留方與銍湖陵碭蕭相故宋必盡齊人南面攻楚泗上必舉此皆平原四達膏腴之地而使獨攻王破楚以肥韓魏于中國而勁齊韓魏之強足以校于秦齊南以泗水為境東負海北倚河而無後患天下之國莫強于齊魏齊魏得地葆利而詳事下吏一年之後為帝未能其于王之為帝有餘矣夫以王壤土之博人徒之眾兵革之強壹舉事而樹怨于楚遲徐廣曰遲一作還令韓魏歸帝重于齊是王失計也臣為王慮莫若善楚秦楚合而為一以臨韓韓必斂手王襟以東山之險帶以曲河之利韓必為關內之侯若是而王以十萬戍鄭梁氏寒心許鄢陵嬰城而上蔡召陵不往來也如此而魏亦關內侯矣王壹善楚而關內兩萬乘之主注地于齊齊右壤可拱手而取也王之地一經兩海要約天下是燕趙無齊楚齊楚無燕趙也然後危動燕趙直搖齊楚此四國者不而服矣見史記春申君傳禮賦爰有大物非絲非帛文理成章非日非月為天下明生者以壽死者以葬城郭以固三軍以強粹而王駁而伯無一焉而亡臣愚不識敢請之王王曰此夫文而不采者與簡然易知而致有理者與君子所敬而小人所不者與性不得則若禽獸性得之則甚雅似者與匹夫隆之則為聖人諸侯隆之則一四海者與致明而約甚順而體請歸之禮知賦皇天隆物以示施下民或厚或薄常不齊均桀紂以亂湯武以賢湣湣淑淑皇皇穆穆周流四海曾不崇日君子以修跖以穿室大參乎天精微而無形行義以正事業以成可以禁暴足窮百姓待之而後寧泰臣愚不識願問其名曰此夫安寬平而危險隘者邪修潔之為親而雜汙之為狄者邪甚深藏而外勝敵者邪法禹舜而能弇跡者邪行為動靜待之而後適者邪血氣之精也志意之榮也百姓待之而後寧也天下待之而後平也明達純粹而無疵也夫是之謂君子之知雲賦有物于此居則周靜致下動則綦高以鉅圓者中規方者中矩大參天地德厚堯禹精微乎毫毛而充盈乎大寓忽兮其極之遠也攭兮其相逐而反也卬卬兮天下之咸蹇也德厚而不捐五采備而成文往來惛憊通于大神出入甚極莫知其門天下失之則得之則存弟子不敏此之願陳君子設辭請測意之曰此夫大而不塞者與充盈大宇而不窕入郄穴而不偪者與行遠疾速而不可托訊者與往來惛憊而不可為固塞者與暴至殺傷而不億忌者與功被天下而不私置者與託地而游宇友風而子雨冬日作寒夏日作暑廣大精神請歸之雲蠶賦有物于此㒩㒩兮其狀屢化如神功被天下為萬世文禮樂以成貴賤以分養老長幼待之而後存名號不美與暴為鄰功立而身廢事成而家敗棄其耆老收其後世人屬所利飛鳥所害臣愚不識請占之五泰五泰占之曰此夫身女好而頭馬首者與屢化而不壽者與善壯而拙老者與有父母而無牝牡者與冬伏而夏游食桑而吐絲前亂而後治夏生而惡暑喜濕而惡雨蛹以為母蛾以為父三俯三起事乃大已夫是之謂蠶理箴賦有物于此生于山阜處于室堂無知無巧善治衣裳不盜不竊穿窬而行日夜合離以成文章以能合從又善連衡下覆百姓上飾帝王功業甚博不見賢良時用則存不用則亡臣愚不識敢請之王王曰此夫始生鉅其成功小者邪長其尾而銳其剽者邪頭銛達而尾趙繚者邪一往一來結尾以為事無羽無翼反覆甚極尾生而事起尾邅而事已簪以為父管以為母既以縫表又以連裡夫是之謂箴理見荀子賦篇為書謝春申君癘人憐王此不恭之語也雖然不可不審察也此為劫弒死亡之主言也夫人主年少而矜材無法術以知奸則大臣主斷國私禁誅于己也故弒賢長而立幼弱廢正適而立不義春秋戒之曰楚王子圍聘于鄭未出竟聞王病反問疾遂以冠纓絞王殺之因自立也齊崔杼之妻美莊公通之崔杼帥其君黨而攻莊公請與分國崔杼不許欲自刃于廟崔杼不許莊公走出逾于外墻射中其股遂殺之而立其弟景公近代所見李兌用趙餓主父于沙丘百日而殺之淖齒用齊握閔王之筋戀于其廟梁宿夕而死夫癘雖癰腫胞疾上比前世未至絞纓射股下比近代癘雖筋而餓死也夫劫弒死亡之主也心之憂勞形之困苦必甚于癘矣由此觀之癘雖憐王可也因為賦曰寶珍隋珠不知佩兮褘布與絲不知異矣閭妹子奢莫知媒兮嫫母求之又甚喜之兮以瞽為明以聾為聰以是為非以吉為凶鳴呼上天曷惟其同詩曰上天甚神無自瘵也見戰國策十七又韓詩外傳四小異又略見荀子賦篇案韓非子奸劫弒臣篇有此蓋承用師說唯篇末無賦耳
