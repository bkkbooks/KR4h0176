body:
  text: 宋玉風賦楚襄王游于蘭臺之宮宋玉景差侍有風颯然而至王乃披襟而當之曰快哉此風寡人所與庶人共者邪宋玉對曰此獨大王之風耳庶人安得而共之王曰夫風者天地之氣溥暢而至不擇貴賤高下而加焉今子獨以為寡人之風豈有說乎宋玉對曰臣聞于師枳句來巢空穴來風其所托者然則風氣殊焉王曰夫風始安生哉宋玉對曰夫風生于地起于青蘋之末侵淫溪谷盛怒于土囊之口緑泰山之阿舞于松柏之下飄忽淜滂激揚熛怒耾耾雷聲回穴錯忤蹶石伐木梢殺林莽至其將衰也被麗披離衝孔動楗眴煥粲爛離散轉移故其清涼雄風則飄舉升降乘陵高城入于深宮邸華葉而振氣徘徊于桂椒之閒翱翔于激水之上將擊芙蓉之精獵蕙草離秦蘅概新夷被荑楊回穴衝陵蕭條衆芳然後倘佯中庭北上玉堂躋于羅帷經于洞房乃得為大王之風也故其風中人狀直憯婪栗清涼增欷清清泠泠愈病析酲發明耳目寧體便人此所謂大王之雄風也王曰善哉論事夫庶人之風豈可聞乎宋玉對曰夫庶人之風塕然起于窮巷之間堀堁揚塵勃鬱煩冤衝孔襲門動沙堁吹死灰駭溷濁揚腐餘邪薄入甕牖至于室廬故其風中人狀直憞溷鬱邑毆溫致溼中心慘怛生病造熱中唇為疹得目為疹啖齰嗽獲死生不卒此所謂庶人之雌風也見文選大言賦楚襄王與唐勒景差宋玉遊于陽雲之臺王曰能為寡人大言者上座王因唏曰操是太阿剝一世流血沖天車不可以厲至唐勒曰壯士憤兮絶天維北斗戾兮出山夷至景差曰校士猛毅皋陶嘻大笑至兮摧覆思鋸牙雲晞甚大吐舌萬里唾一世至宋玉曰方地為車圓天為蓋長劍耿耿倚天外王曰未也玉曰并吞四夷飲枯河海跋越九州無所容止身大四塞愁不可長據地𧿚天迫不得仰見古文苑小言賦楚襄王既登陽雲之臺令諸大夫景差唐勒宋玉等并造大言賦賦畢而宋玉受賞王曰此賦之迂誕則極巨偉矣抑未備也且一陰一陽道之所貴小往大來剝復之類也是故卑高相配而天地位三光并照則大小備能大而不小能高而不下非兼通也能粗而不能細非妙工也然則上座者未足明賞賢人有能為小言賦者賜之雲夢之田景差曰載氛埃兮乘剽塵體輕蚊翼形微蚤鱗聿遑浮踊淩雲縱身經由針孔出入羅巾飄妙翩綿乍見乍泯唐勒曰析飛糠以為輿剖粃糟以為舟泛然投乎杯水中淡若巨海之洪流憑蚋眥以顧盼附蠛蠓而遨遊寧隱微以無淮原存亡而不憂又曰館于蠅鬚宴于亮端烹蝨脛切蟣肝會九族而同嚌猶委餘而不殫宋玉曰無內之中微物潛生比之無象言之無名蒙蒙滅景昧昧遺形超于大虛之域出于未兆之庭纖于毳末之微蔑陋于茸毛之方生視之則眇眇望之則冥冥離朱為之歎悶神明不能察其情二子之言磊磊皆不小何如此之為精王曰善賜以雲夢之田見古文苑諷賦楚襄王時宋玉休歸唐勒讒之于王曰玉為人身體容冶口多微詞出愛主人之女入事大王願王疏之玉休還王謂玉曰玉為人身體容冶口多微詞出愛主人之女入事寡人不亦薄乎玉曰臣身體容治受之二親口多微詞聞之聖人臣嘗出行僕飢馬疲正值主人門開主人翁出嫗又到市獨有主人女在女欲置臣堂上太高堂下太卑乃更于蘭房之室止臣其中中有鳴琴焉臣援而鼓之為幽蘭白雪之曲主人之女翳承白日之華披翠雲之裘更被白縠之單衫垂珠步搖來排臣戶曰上客日高無乃飢乎為臣炊雕胡之飯烹露葵之羹來勸臣食以其翡翠之叉挂臣冠纓臣不忍仰視為臣歌曰歲將暮兮日已寒中心亂兮勿多言臣復援琴而鼓之為秋竹積雪之曲主人之女又為臣歌曰內怵惕兮徂玉床橫自陳兮君之傍君不御兮妾誰怨日將至兮下黃泉玉曰吾寧殺人之父孤人之子誠不忍愛主人之女王曰止止寡人于此時亦何能已也見古文苑高唐賦昔者楚襄王與宋玉遊于雲夢之臺望高唐之觀其上獨有雲氣崒兮直上忽兮改容須臾之間變化無窮王問玉曰此何氣也玉對曰所謂朝雲者也王曰何謂朝雲玉曰昔者先王嘗遊高唐怠而晝寢夢見一婦人曰妾巫山之女也為高唐之容聞君遊高唐願薦枕席王因幸之去而辭曰妾在巫山之陽高丘之阻旦為朝雲暮為行雨朝朝暮暮陽臺之下旦朝視之如言故為立廟號曰朝雲王曰朝雲始出狀若何也玉對曰其始出也㬣兮若松榯其少進也晰兮若姣姬揚袂鄣日而望所思忽兮改容偈兮若駕駟馬建羽旗湫兮如風淒兮如雨風止雨霽雲無處所王曰寡人方今可以遊乎玉曰可王曰其何如矣玉曰高矣顯矣臨望遠矣廣矣普矣萬物祖矣上屬于天下見于淵珍怪奇偉不可稱論王曰試為寡人賦之玉曰唯唯惟高唐之大體兮殊無物類之可儀比巫山赫其疇兮道互折而層纍登巉巖而下望兮臨大阺之蓄水遇天雨之新霽兮觀百谷之俱集濞洶洶其無聲兮潰淡淡而并入滂洋洋而四施兮蓊湛湛而弗止長風至而波起兮若麗山之孤畝勢薄岸而相擊兮隘交引而卻會崒中怒而特高兮若浮海而望碣石礫磊磊而相摩兮巆震天之礚礚巨石溺溺之瀺灂兮沫潼潼而高厲水淡淡而盤紆兮洪波淫淫之溶㵝奔揚踊而相擊兮雲興聲之霈霈猛獸驚而跳駭兮妄奔走而馳邁虎豹豺兕失氣恐喙鵰鶚鷹鷂飛揚伏竄股戰脅息安敢忘摯于是水蟲盡暴乘渚之陽黿鼉鱣鮪交積縱橫振鱗奮翼蜲蜲蜿蜿中阪遙望玄木冬榮煌煌熒熒奪人目精爛兮若列星曾不可殫形榛林鬱盛葩華覆蓋雙椅垂房糾枝還會徙靡淡淡隨波暗藹東西施翼猗狔豐沛緑葉紫裹丹莖白蒂纖條悲鳴聲似竽籟清濁相和五變四會感心動耳回腸傷氣孤子寡婦寒心酸鼻長吏隳官賢士失志愁思無已嘆息垂淚登高遠望使人心瘁盤岸巑岏裖陳磑磑盤石險峻傾崎崖隤巖嶇參差從橫相追陬互橫忤背穴偃跖交加纍積重疊增益狀若砥柱在巫山下仰視山巔肅何芊芊炫耀虹霓俯視崝嶸窐寥窈冥不見其底虛聞松聲傾岸洋洋立而熊經久而不去足盡汗出悠悠忽忽怊悵自失使人心動無故自恐賁育之斷不能為勇卒愕異物不知所出縱縱莘莘若生于鬼若出于神狀似走獸或象飛禽譎詭奇偉不可究陳上至觀側地蓋底平箕踵漫衍芳草羅生秋蘭茝蕙江離載菁青荃射干揭車苞并薄草靡靡聯延夭夭越香掩掩衆雀嗷嗷雌雄相失哀鳴相號王睢鸝黃正冥楚鳩姊歸思婦垂雞高巢其鳴喈喈當年遨遊更唱迭和赴曲隨流有方之士羡門高溪上成鬱林公樂聚穀進純犧禱琁室醮諸神禮太一傳祝已具言辭已畢王乃乘玉輿駟倉螭垂旒旌旆合諧紬大絃而雅聲流洌風過而增悲哀于是調謳令人婪悷憯悽脅息增欷于是縱獵者基址如星傳言羽獵銜枚無聲弓弩不發罘罕不傾涉漭漭馳萃萃飛鳥未及起走獸未及發何節奄忽蹄足灑血舉功先得獲車已實王將欲往見之必先齊戒差時擇日簡輿玄服建雲旆霓為旌翠為蓋風起雨止千里而逝蓋發蒙往自會思萬方憂國害開賢聖輔不逮九竅通鬱精神察滯延年益壽千萬歲見文選神女賦楚襄王與宋玉遊于雲夢之浦使玉賦高唐之事其夜王寢果夢與神女遇其狀甚麗王異之明日以白玉玉曰其夢若何王曰晡夕之後精神恍忽若有所喜紛紛擾擾未知何意目色仿佛乍若有記見一婦人狀甚奇異寐而夢之寤不自識罔兮不樂悵然失志于是撫心定氣復見所夢玉曰狀如何也王曰茂矣美矣諸好備矣盛矣麗矣難測究矣上古既無世所未見瑰姿瑋態不可勝贊其始來也耀乎若白日初出照屋梁其少進也皎若明月舒其光須臾之間美貌橫生曄兮如華溫乎如瑩五色并馳不可殫形詳而視之奪人目精其盛飾也則羅紈綺繢盛文章極服妙采照萬方振繡衣被𧀬裳穠不短纖不長步裔裔兮曜殿堂忽兮改容婉若遊龍乘雲翔嫷被服侻薄裝沐蘭澤含若芳性和適宜侍旁順序卑調心腸王曰若此盛矣試為寡人賦之玉曰唯唯夫何神女之姣麗兮含陰陽之渥飾被華藻之可好兮若翡翠之奮翼其象無雙其美無極毛嬙鄣袂不足程式西施掩面比之無色近之既妖遠之有望骨法多奇應君之相視之盈目孰者克尚私心獨悅樂之無量交希恩疏不可盡暢他人莫睹王覽其狀其狀峨峨何可極言貌豐盈以莊姝兮苞溫潤之玉顏眸子炯其精朗兮暸多美而可觀眉聯以蛾揚兮朱唇的其若丹素質幹之醲實兮志解泰而體間既姽嫿于幽靜兮又婆娑乎人閒宜高殿以廣意兮翼放縱而綽寬動霧縠以徐步兮拂墀聲之珊珊望余帷而延視兮若流波之將瀾奮長袖以正衽兮立躑躅而不安淡清靜其愔嫕兮性沈詳而不煩時容與以微動兮志未可乎得原意似近而既遠兮若將來而復旋褰余幬而請御兮願盡心之惓惓懷貞亮之潔清兮卒與我兮相難陳嘉辭而云對兮吐芬芳其若蘭精交接以來往兮心凱康以樂歡神獨亨而未結兮魂煢煢以無端含然諾其不分兮喟揚音而哀歎頩薄怒以自持兮曾不可乎犯干于是搖珮飾鳴玉鸞整衣服斂容顏顧女師命太傅歡情未接將辭而去遷延引身不可親附似逝未行中若相首目略微眄精彩相授志態橫出不可勝記意離未絶神心怖覆禮不遑訖辭不及究願假須臾神女稱遽徊腸傷氣顛倒失據暗然而暝忽不知處情獨私懷誰者可語惆悵垂涕求之至曙見文選登徒子好色賦大夫登徒子侍于楚王短宋玉曰玉為人體貌間麗口多微詞又性好色願王勿與出入後宮王以登徒子之言問宋玉玉曰體貌間麗所受于天也口多微辭所學于師也至于好色臣無有也王曰子不好色亦有說乎有說則止無說則退玉曰天下之佳人莫若楚國楚國之麗者莫若臣里臣里之美者莫若臣東家之子東家之子增之一分則太長減之一分則太短著粉則太白施朱則太赤眉如翠羽肌如白雪腰如束素齒如含貝嫣然一笑惑陽城迷下蔡然此女登牆窺臣三年至今未許也登徒子則不然其妻蓬攣耳齞脣歷齒旁行踽僂又疥且痔登徒子悅之使有五子王孰察之誰為好色者矣是時秦章華大夫在側因進而稱曰今夫宋玉盛稱鄰之女以為美色愚亂之邪臣自以為守德謂不如彼矣且夫南楚窮巷之妾焉足為大王言乎若臣之陋目所曾覩者未敢云也王曰試為寡人說之大夫曰唯唯臣少曾遠遊周覽九土足歷五都出咸陽熙邯鄲從容鄭衛溱洧之間是時春之末迎夏之陽鶬鶊喈喈群女出桑此郊之姝華色含光體美容冶不侍飾裝臣觀其麗者因稱詩曰遵大路兮攬子袪贈以芳華辭甚妙于是處子恍若有望而不來忽若有來而不見意密體疏俯仰異觀含喜微笑竊視流眄復稱詩曰寤春風兮發鮮榮潔齊俟兮惠音聲贈我如此兮不如無生因遷延而辭避蓋徒以微辭相感動精神相依憑目欲其顏心顧其義揚詩守禮終不過差故足稱也于是楚王稱善宋玉遂不退見文選釣賦宋玉與登徒子偕受釣于玄洲止而并見于楚襄王登徒子曰夫玄洲天下之善釣者也願王觀焉王曰其善奈何登徒子對曰夫玄洲釣也以三尋之竿八絲之線餌若蛆蚓鉤如細針以出三赤之魚于數仞之水中豈可謂無術乎夫玄洲芳水餌挂繳鉤其意不可得退而牽行下觸清泥上則波揚玄洲因水勢而施之頡之頏之委縱收斂與魚沈浮及其解弛也因而獲之襄王曰善宋玉進曰今察玄洲之釣未可謂能持竿也又烏足為大王言乎王曰子之所謂善釣者何玉曰臣所謂善釣者其竿非竹其綸非絲其鉤非針其餌非蚓也王曰願遂聞之宋玉對曰昔堯舜湯禹之釣也以聖賢為竿道德為綸仁義為鉤祿利為餌四海為池萬民為魚釣道微矣非聖人其孰能察之王曰迅哉說乎其釣不可見也宋玉對曰其釣易見王不察爾昔殷湯以七十里周文以百里興利除害天下歸之其餌可謂芳矣南面而掌天下歷載數百到今不廢其綸可謂紉矣群生寖其澤民氓畏其罰其鉤可謂拘矣功成而不隳名立而不改其竿可謂強矣若夫竿折綸絶餌墜鉤決波涌魚失是則夏桀商紂不通夫釣術也今察玄洲之釣也左挾魚罶右執稿竿立于潢污之涯倚乎楊柳之間精不離乎魚喙思不出乎鮒袝形容枯槁神色憔悴樂不役勤獲不當費斯乃水濱之役夫也已君王不又何稱焉王若建堯舜之洪竿據禹湯之修綸投之于瀆視之于海漫漫群生孰非吾有其為大王之釣不亦樂乎見古文苑笛賦余嘗觀于衡山之陽見奇篠異干罕節間枝之叢生也其處磅磄千仞絶溪凌阜隆崛萬丈盤石雙起丹水涌其左醴泉流其右其陰則積雪凝霜霧露生焉其東則朱天皓日素朝明焉其南則盛夏清微春陽榮焉其西則涼風游旋吸逮存焉干枝洞長桀出有良名高有脫誤師曠將為陽春其北則鄙白雪之曲藝文類聚作師曠將為陽春北鄭白雪之曲假涂南國至于此出望其叢生見其異形因命陪乘取其雄焉宋意將送荊卿于易水之上得其雌焉于是乃使王爾公輸之徒合妙意角較手遂以為笛于是天旋少陰白日西靡命嚴春使午子文選洞簫賦注作使叔子案注又引毛詩傳昔顏叔子獨處于室鄰之嫠婦又獨處室云云午子即魯男子也延長頸奮玉手摛朱唇曜皓齒頳顏臻玉貌起吟清商追流徵歌代檀號孤子發久轉舒積郁其為幽也甚乎懷永抱絶喪夫天亡稚子纖悲微痛毒離肌腸腠理激叫入青云慷慨切窮土度曲口羊腸揆殃振奔逸游泆志列絃節武毅發沉憂結呵鷹揚叱太一聲淫淫以黯黮氣旁合而爭出歌壯士之必往悲猛勇乎飄疾麥秀漸兮鳥聲革翼招伯奇于源陰追申子于晉域夫奇曲雅樂所以禁淫也錦繡黼黻所以御寒也縟則泰過是以檀卿刺鄭聲周人傷北里也亂曰芳林皓干有奇寶兮博人通明樂斯道兮般衍瀾漫終不老兮雙枝間麗貌甚好兮八音和調成稟受兮善善不衰為世保兮絶鄭之遺離南楚兮美風洋洋而暢茂兮嘉樂悠長俊賢士兮鹿鳴萋萋思我友兮安心隱志可長久兮見古文苑北堂書鈔一百十一引七條藝文類聚四十四按此賦用宋意送荊卿事非宋玉作然隋唐已前本集有之誤收久矣不必刪耳九辨悲哉秋之為氣也蕭瑟兮草木搖落而變衰憭栗兮若在遠行登山臨水兮送將歸泬寥兮天高而氣清寂寥岩兮收潦而水清憯悽增欷兮薄寒之中人愴恍懭悢兮去故而就新坎廩兮貧士失職而志不平廓落兮羇旅而無友生惆悵兮而私自憐燕翩翩其辭歸兮蟬寂漠而無聲鴈雍雍而南遊兮鵾雞啁哳而悲鳴獨申旦而不寐兮哀蟋蟀之宵征時亹亹而過中兮蹇淹留而無成悲憂窮戚兮獨處廓有美一人兮心不繹去鄉離家兮徠遠客超逍遙兮今焉薄專思君兮不可化君不知兮可奈何蓄怨兮積思心煩憺兮忘食事願一見兮道余意君之心兮與余異車既駕兮朅而歸不得見兮心傷悲倚結軨兮長太息涕潺湲兮下霑軾慷慨絶兮不得中瞀亂兮迷惑私自憐兮何極心怦怦兮諒直皇天平分四時兮竊獨悲此廩秋白露既下百草兮奄離披此梧楸去白日之昭昭兮襲長夜之悠悠離芳藹之方壯兮余萎約而悲愁秋既先戒以白露兮冬又申之以嚴霜收恢台之孟夏兮然欿傺而沉藏葉烟邑而無色兮枝煩拿而交橫顏淫溢而將罷兮柯仿佛而萎黃萷櫹槮之可哀兮形銷鑠而瘀傷惟其紛糅而將落兮恨其失時而無當攬騑轡而下節兮聊逍遙以相佯歲忽忽而遒盡兮恐余壽之弗將悼余生之不時兮逢此世之俇攘淡容與而獨倚兮蟋蟀鳴此西堂心怵惕而震蕩兮何所憂之多方卬明月而太息兮步列星而極明竊悲夫蕙華之曾敷兮紛旖旎乎都房何曾華之無實兮從風雨而飛揚以為君獨服此蕙兮羌無以異于衆芳閔奇思之不通兮將去君而高翔心閔憐之慘凄兮願一見而有明重無怨而生離兮中結軫而增傷豈不鬱陶而思君兮君之門以九重猛犬狺狺而迎吠兮關梁閉而不通皇天淫溢而秋霖兮后土何時而得漧塊獨守此無澤兮仰浮雲而永嘆何時俗之工巧兮背繩墨而改錯卻騏驥而不乘兮策駑駘而取路當世豈無騏驥兮誠莫之能善御見執轡者非其人兮故駶跳而遠去鳧雁皆唼夫粱藻兮鳳愈飄翔而高舉圜鑿而方枘兮吾固知其鉏鋙而難入衆鳥皆有所登棲兮鳳獨遑遑而無所集願銜枚而無言兮嘗被君之渥洽太公九十乃顯榮兮誠未遇其匹合謂騏驥兮安歸謂鳳皇兮安棲變古易兮世衰今之相者兮舉肥騏驥伏匿而不見兮鳳皇高飛而不下鳥獸猶知懷德兮何云賢士之不處驥不驟進而求服兮鳳亦不貪餧而妄食君棄遠而不察兮雖願忠其焉得欲寂漠而絶端兮竊不敢忘初之厚德獨悲愁其傷人兮馮鬱鬱其何極霜露慘悽而交下兮心尚幸其弗濟霰雪氛糅其增加兮乃知遭命之將至願徼幸而有待兮泊莽莽與野草同死願自往而徑游兮路壅絶而不通欲循道而平驅兮又未知其所從然中路而迷惑兮自壓桉而學誦性愚陋以褊淺兮信未達乎從容竊美申包胥之氣盛兮恐時世之不固何時俗之工巧兮滅規矩而改鑿獨耿介而不隨兮願慕先聖之遺教處濁世而顯榮兮非余心之所樂與其無義而有名兮寧窮處而守高食不偷而為飽兮衣不苟而為溫竊慕詩人之遺風兮願託志乎素餐蹇充倔而無端兮泊莽莽而無垠無衣裘以御冬兮恐溘死不得見乎陽春靚杪秋之遙夜兮心繚悷而有哀春秋逴逴而日高兮然惆悵而自悲四時遞來而卒歲兮陰陽不可與儷偕白日晼晚其將入兮明月銷鑠而減毀歲忽忽而遒盡兮老冉冉而愈弛心搖悅而日幸兮然怊悵而無冀中憯惻之悽愴兮長太息而增欷年洋洋以日往兮老嵺廓而無處事亹亹而覬進兮蹇淹留而躊躇何泛濫之浮雲兮猋壅蔽此明月忠昭昭而願見兮然霠曀而莫達願皓日之顯行兮雲蒙蒙而蔽之竊不自聊而願忠兮或黕點而污之堯舜之抗行兮瞭冥冥而薄天何險巇之嫉妒兮被以不慈之僞名彼日月之照明兮尚黯黮而有瑕何況一國之事兮亦多端而膠加被荷裯之晏晏兮然潢洋而不可帶既驕美而伐武兮負左右之耿介憎慍惀之修美兮好夫人之慷慨衆踥蹀而日進兮美超遠而逾邁農夫輟耕而容與兮恐田野之蕪穢事綿綿而多私兮竊悼後之危敗世雷同而炫曜兮何毀譽之昧昧今修飾而窺鏡兮後尚可以竄藏願寄言夫流星兮羌倏忽而難當卒壅蔽此浮雲兮下暗漠而無光堯舜皆有所舉任兮故高枕而自適諒無怨于天下兮心焉取此怵惕乘騏驥之瀏瀏兮馭安用夫強策諒城郭之不足恃兮雖重介之何益邅翼翼而無終兮忳惛惛而愁約生天地之若過兮功不成而無效願沈滯而不見兮尚欲布名乎天下然潢洋而不遇兮直怐愗而自苦莽洋洋而無極兮忽翱翔之焉薄國有驥而不知乘兮焉皇皇而更索寧戚謳于車下兮桓公聞而知之無伯樂之善相兮今誰使乎譽之罔流涕以聊慮兮惟著意而得之紛純純之願忠兮妒被離而鄣之願賜不肖之軀而別離兮放游志乎雲中乘精氣之摶摶兮騖諸神之湛湛驂白霓之習習兮歷群靈之豐豐左朱雀之茇茇兮右蒼龍之躣躣屬雷師之闐闐兮通飛廉之衙衙前輊輬之鏘鏘兮後輜乘之從從載雲旗之委蛇兮扈屯騎之容容計專專之不可化兮願遂推而為臧賴皇天之厚德兮還及君之無恙見楚辭又文選有前五首招魂朕身服義而未沫主此盛德兮牽于俗而蕪穢上無所考此盛德兮長離殃而愁苦帝告巫陽曰有人在下我欲輔之魂魄離散汝筮豫之巫陽對曰掌㝱上帝其難從文選作其命難從若必筮豫之恐後之謝文選作謝之不能復用巫陽焉乃下招曰魂兮歸來去君之恆幹何為四方些舍君之樂處而離彼不祥些魂兮歸來東方不可目託些長人千仞惟魂是索些十日代出流金鑠石些彼皆習之魂往必釋些歸來兮不可目托些魂兮歸來南方不可以止些雕題黑齒得人肉以祀以其骨為醢些蝮蛇蓁蓁封狐千里些雄虺九首往來倏忽吞人以益其心些歸來兮不可目久淫些魂兮歸來西方之害流沙千里些旋入雷淵爢散而不可止些幸而得脫其名曠宇些赤蟻若象玄蜂若壺些五穀不生藂菅是食些其土爛人求水無所得些倣徉無所倚廣大無所極些歸來兮恐自遺賊些魂兮歸來北方不可以止些增冰峨峨飛雪千里些歸來兮不可以久些魂兮歸來君無上天些虎豹九關啄害下人些一夫九首拔木九千些豺狼從目往來侁侁些懸人目娭投之深淵些致命于帝然後得瞑些歸來歸來往恐危身些魂兮歸來君無下此幽都些土伯九約其角觺觺些敦脄血拇逐人駓駓些參目虎首其身若牛些此皆甘人歸來恐自遺災些魂兮歸來入修門些工招祝君背行先些秦篝齊縷鄭綿絡些招具該備永嘯呼些魂兮歸來反故居些天地四方多賊姦些像設君室靜閒安些高堂邃宇檻層軒些層臺纍榭臨高山些網戶朱綴刻方連些冬有穾廈夏室寒些川谷徑復流潺湲些光風轉蕙泛崇蘭些經堂入奧朱塵筵些砥室翠翹挂文選作絓曲瓊些翡翠珠被爛齊光些蒻阿拂壁羅幬張些纂組綺縞結琦文選作奇璜些室中之觀多珍怪些蘭膏明燭華容備些二八侍宿射遞代些九侯淑女多迅衆些盛鬋不同制實滿宮些容態好比順彌代些弱顏固植謇其有意些姱容修態絙洞房些蛾眉曼睩目騰光些靡顏膩理遺視矊些離榭修幕侍君之間些翡帷翠帳文選作幬飾高堂些紅壁沙版玄玉梁些仰觀刻桷畫龍蛇些坐堂伏檻臨曲池些芙蓉始發雜芰荷些紫莖屏風文緣波些文異豹飾侍陂陀些軒輬既低步騎羅些蘭薄戶樹瓊木籬些魂兮歸來何遠為些室家遂宗食多方些稻粢穱麥拿黃梁些大苦醎酸辛甘行些肥牛之腱臑若芳些和酸若苦陳吳羹些胹鱉炮羔有柘漿些鵠酸臇鳧煎鴻鶬些露鶪臛蠵厲而不爽些粔籹蜜餌有餦餭些瑤漿密勺實羽觴些挫糟凍飲酎清涼些華酌既陳有瓊漿些歸來反故室一云歸反故室無來字文選作歸來歸來敬而無妨些肴羞未通女樂羅些陳鐘按鼓造新歌些涉江采菱發揚荷些美人既醉朱顏酡些娭光眇視目曾波些被文服纖麗而不奇些長髮曼鬋艷陸離些二八齊容起鄭舞些衽若交竿撫案下些芋瑟狂會搷鳴鼓些宮庭震驚發激楚些吳歈蔡謳奏大呂些士女雜坐亂而不分些放陳組纓班其相紛些鄭衛妖玩來雜陳些激楚之結獨秀先些菎蔽象棋有六簙些分曹并進遒相迫些成梟而牟呼五白些晉制犀比費白日些鏗鍾搖簴揳梓瑟些娛酒不廢沈日夜些蘭膏明燭華鐙錯些結撰至思蘭芳假些人有所極同心賦些酎飲盡歡樂先故些魂兮歸來反故居些亂曰獻歲發春兮汩吾南征菉蘋齊葉兮白芷生路貫廬江兮左長薄倚沼畦瀛兮遙望博青驪結駟兮齊千乘懸火延起兮玄顏蒸步及驟處兮誘騁先抑騖若通兮引車右還與王趨夢兮課後先君王親發兮憚青兕朱明承夜兮時不可以淹皋蘭被徑兮斯路漸湛湛江水兮上有楓目極千里兮傷春心魂兮歸來哀江南見楚辭文選對楚王問楚襄王問于宋玉曰先生其有遺行與何士民衆庶不譽之甚也宋玉對曰唯然有之願大王寬其罪使得畢其辭客有歌于郢中者其始曰下里巴人國中屬而和者數千人其為陽阿薤露國中屬而和者數百人其為陽春白雪國中屬而和者不過數十人引商刻羽雜以流徵國中屬而和者不過數人而已是其曲彌高其和彌寡故鳥有鳳而魚有鯤鳳皇上擊九千里絶雲霓負蒼天足亂浮雲翱翔乎杳冥之上夫蕃籬之鷃豈能與之料天地之高哉鯤魚朝發崑崙之墟暴鬐于碣石暮宿于孟諸夫尺澤之鯢豈能與之量江海之大哉故非獨鳥有鳳而魚有鯤也士亦有之夫聖人瑰意琦行超然獨處夫世俗之民又安知臣之所為哉見文選高唐對楚襄王與宋玉遊于雲夢之野將使宋玉賦高唐之事望朝雲之館上有雲氣崒乎直上忽而改容須臾之閒變化無窮王問宋玉曰此何氣也對曰昔者先王遊于高唐怠而晝寢夢一婦人曖乎若雲煥乎若星將行未至如浮如停詳而視之西施之形王悅而問焉曰我帝之季女也名曰瑤姬未行而亡封巫山之臺精魂依草實為䔄芝媚而服焉則與夢期所謂巫山之女高唐之姬聞君遊于高唐願薦枕席王因而幸之見御覽三百九十九引襄陽耆舊記楚襄王與宋玉遊于雲夢之野望朝雲之館有氣焉須臾之閒變化無窮王問此是何氣也玉對曰昔先王遊于高唐怠而晝寢夢見一婦人自云我帝之季女名曰瑤姬未行而亡封于巫山之臺聞王來遊願薦枕席王因幸之去乃言妾在巫山之陽高丘之阻旦為朝雲暮為行雨朝朝暮暮陽臺之下旦而視之果如其言為之立館名曰朝雲見文選江淹雜體擬潘嶽述哀詩注引宋玉集按此與文選高唐賦御覽引襄陽耆舊記小異宋玉集序附宋玉事楚懷王友人言之王王以為小臣玉讓友人友曰薑桂因地而生不因地而辛女因媒而嫁不因媒而親也北堂書鈔原本三十三引宋玉集序陳禹謨本改引新序案韓詩外傳宋玉因其友見楚相楚相待之無以異讓其友其友曰夫薑桂云云新序宋玉因其友以見于襄王襄王待之無以異宋玉讓其友其友曰夫薑桂云云懷王楚相襄王互異而薑桂等語屬友人語無異也梅鼎祚文紀題作報友人書甚誤不知下文有宋玉辨語大招青春受謝白日昭只春氣奮發萬物遽只冥淩浹行魂無逃只魂魄歸徠無遠遙只魂乎歸徠無東無西無南無北只東有大海溺水浟浟只螭龍并流上下悠悠只霧雨淫淫白皓膠只魂乎無東湯谷寂只魂乎無南南有炎火千里蝮蛇蜒只山林險隘虎豹蜿只鰅鱅短狐王虺騫只魂乎無南蜮傷躬只魂乎無西西方流沙漭洋洋只豕首縱目被髮鬤只長爪踞牙誒笑狂只魂乎無西多害傷只魂乎無北北有寒山逴龍赩只代水不可涉深不可測只天白皓皓寒凝凝只魂乎無往盈北極只魂魄歸徠間以靜只自恣荊楚安以定只逞志究欲心意安只窮身永樂年壽延只魂乎歸徠樂不可言只五穀六仞設菰粱只鼎臑盈望和致芳只內鶬鴿鵠味豺羹只魂乎歸徠恣所嘗只鮮蠵甘雞和楚酪只醢豚苦狗膾苴蒪只吳酸蒿蔞不沾薄只魂兮歸徠恣所擇只炙鴰蒸鳧煔鶉敶只煎鰿藿雀遽爽存只魂乎歸徠麗以先只四酎并孰不澀嗌只清馨凍飲不啜役只吳醴白糱和楚瀝只魂乎歸徠不遽惕只代秦鄭衛鳴竽張只伏戲駕辨楚勞商只謳和揚阿趙簫倡只魂乎歸徠定空桑只二八接舞投詩賦只叩鍾調磬娛人亂只四上競氣極聲變只魂乎歸徠聽歌撰只朱唇皓齒嫭以姱只比德好間習以都只豐肉微骨調以娛只魂乎歸徠安以舒只嫮目宜笑娥眉曼只容則秀雅稚朱顏只魂乎歸徠靜以安只姱修滂浩麗以佳只曾頰倚耳曲眉規只滂心綽態姣麗施只小腰秀頸若鮮卑只魂乎歸徠思怨移只易中利心以動作只粉白黛黑施芳澤只長袂拂面善留客只魂乎歸徠以娛昔只青色直眉美目媔只靨輔奇牙宜笑嘕只豐肉微骨體便娟只魂乎歸徠恣所便只夏屋廣大沙堂秀只南房小壇觀絶霤只曲屋步壛宜擾畜只騰駕步遊獵春囿只瓊轂錯衡英華假只茝蘭桂樹鬱彌路只魂乎歸徠恣志慮只孔雀盈園畜鸞皇只鵾鴻群晨雜鶖鶬只鴻鵠代遊曼鷫鷞只魂乎歸徠鳳皇翔只曼澤怡面血氣盛只永宜厥身保壽命只室家盈廷爵祿盛只魂乎歸徠居室定只接徑千里出若雲只三圭重侯聽類神只察篤夭隱孤寡存只魂兮歸徠正始昆只田邑千畛人阜昌只美冒衆流德澤章只先威後文善美明只魂乎歸徠賞罰當只名聲若日照四海只德譽配天萬民理只北至幽陵南交址只西薄羊腸東窮海只魂乎歸徠尚賢士只發政獻仁禁苛暴只舉傑壓陛誅譏罷只直嬴在位近禹麾只豪傑執政流澤施只魂乎徠歸國家為只雄雄赫赫天德明只三公穆穆登降堂只諸侯畢極立九卿只昭質既設大侯張只執弓挾矢揖辭讓只魂乎徠歸尚三王只見楚辭王逸敘曰大招屈原之所作也或曰景差疑不能明也洪興祖以為非屈原作今按漢志屈原賦二十五篇謂離騷一篇九歌十一篇天問一篇九章九篇遠游卜居漁父各一篇凡二十五篇洪說是也奏土論我是楚也世霸南土自越以至葉垂弘境萬里故號曰萬城也見水經汝水注
