body:
  text: 趙鞅鐵誓范氏中行氏反易天明斬艾百姓欲擅晉政而滅其君寡君恃鄭而保焉今鄭為不道棄君助臣二三子順天明從君命經德義除詬恥在此行也克敵者上大夫受懸下大夫受郡士田十萬庶人工商遂人臣隸圉免志父無罪君圖之若其有罪絞縊以戮桐棺三寸不設屬辟素車樸馬無入于兆下卿之罰也見左傳哀二年自為二書牘與二子節用聽聰敬賢勿慢能能勿賤見御覽一百四十六引韓詩外傳命相國肥義傅少子毋變而度毋異而慮堅守一心以歿而世見史記趙世家肥義曰昔者主父以王屬我也曰云云義再拜受命而籍之潘吾勒石主父常游于此見韓非子外儲說左上趙主父令工施鉤梯而緣潘吾刻疏人迹其人廣三尺長五尺而勒之空雄約自今以來秦之所欲為趙助之趙之所欲為秦助之見呂氏春秋淫辭篇空雄之遇秦趙相與約遺燕王喜書秦所以尤追燕急者以太子丹故也今王誠殺丹獻之秦王秦王必解而社稷幸得血食見史記刺客傳秦拔薊城燕王喜太子丹等東保遼東秦將李追擊燕王急代王乃遺燕王喜書書趙簡子夢之帝所事趙簡子疾五日不知人大夫皆懼醫扁鵲視之出董安于問扁鵲曰血脈治也而何怪在昔秦穆公嘗如此七日而寤寤之日告公孫支與子與曰我之所甚樂吾所久者適有學也帝告我晉國將大亂五世不安其後將霸未老而死霸者之子且令而國男女無別公孫支書而藏之秦讖于是出矣獻公之亂文公之霸而襄公敗秦師于殽而歸縱淫此子之所聞今主君之疾與之同不出三日疾必間間必有言也居二日半簡子寤語大夫曰我之帝所甚樂與百神游于鈞天廣樂九秦萬舞不類三代之樂其聲動人心有一熊欲來援我帝命我射之中熊熊死又有一羆來我又射之中羆羆死帝甚喜賜我二笥皆有副吾見兒在帝側帝屬我一翟犬曰及而子之壯也以賜之帝告我晉國且世衰七世而亡嬴姓將大敗周人于范魁之西而亦不能有也今余思虞舜之勛適余將以其冑女孟姚配而七世之孫董安于受言而書藏之以扁鵲言告簡子簡子賜扁鵲田四方畝見史記趙世家又書子晰事他日簡子出有人當道辟之不去從者怒將刃之當道者曰吾欲有謁于主君從者以聞簡子召之曰嘻吾有所見子晰也當道者曰屏左右願有謁簡子屏人當道者曰主君之疾臣在帝側簡子曰然有之子之見我我何為當道者曰帝令主君射熊與羆皆死簡子曰是且何也當道者曰晉國且有大難主君首之帝令主君滅二卿夫熊與羆皆其祖也簡子曰帝賜我二笥皆有副何也當道者曰主君之子將克二國于翟皆子姓也簡子曰吾見兒在帝側帝屬我一翟犬曰及而子之長以賜之夫兒何謂以賜翟犬當道者曰兒主君之子也翟犬者代之先也主君之子必且有代及主君之後嗣且有革政而胡服并二國于翟簡子問其姓而延之以官當道者曰臣野人致帝命耳遂不見簡子書藏之府見史記趙世家案此與上文夢之帝所為一事未必簡子自書蓋亦董安于受言而書藏之府耳史蒙上文故省其辭議主賢明則悉心以事之不肖則飾奸而試之見韓非子外儲說左下上言舉中牟二士中牟有士曰中章胥己者其身甚修其學甚博君何不舉之見韓非子外儲說左上王登為中牟令上言于襄主主曰子見之我將為中大夫獻書秦王大王廣地寧邑諸侯皆賀敝邑寡君亦竊嘉之不敢寧居使下臣奉其幣物三至王廷而使不得通使若無罪願大王無絕其歡若使有罪願得請之見戰國策二十一備邊約匈奴即入盜急入收保有敢捕虜者斬見史記廉頗藺相如附傳下令國中昔我穆公自岐雍之間修德行武東平晉亂以河為界西霸戎翟廣地千里天子致伯諸侯畢賀為後世開業甚光美會往者厲躁簡公出子之不寧國家內憂未遑外事三晉攻奪我先君河西地諸侯卑秦丑莫大焉獻公即位鎮撫邊境徙治櫟陽且欲東伐復穆公之故也修穆公之政令寡人思念先君之意常痛于心賓客群臣有能出奇計強秦者吾且尊官與之分土見史記秦本紀有敢言鄭安平事者以其罪罪之見史記范睢傳遺楚懷王書始寡人與王約為弟兄盟于黃棘太子為質至歡也太子陵殺寡人之重臣不謝而亡去寡人誠不勝怒故兵侵君王之邊今聞君王乃令太子質于齊以求平寡人與楚接境壤界故為婚姻所從相親久矣而今秦楚不歡則無以令諸侯寡人願與君王會武關面相約結盟而去寡人之願也敢以聞下執事見史記楚世家遺楚頃襄王書楚倍秦秦且率諸侯伐楚爭一日之命願王之飭士卒得一樂戰見史記楚世家詳為好書遺平原君寡人聞君之高義願與君約為布衣之交君幸過寡人寡人願與君為十日之飲見史記范睢傳秦昭王聞魏齊在平原君所欲為范雎必報其仇乃詳為好書遺平原君遺趙孝成王書王之弟在秦范君之仇魏齊在平原君之家王使人疾持其頭來不然吾舉兵而伐趙又不出王之弟于關見史記范雎傳與夷人刻石為盟要秦犯夷輸黃龍一雙夷犯秦輸清酒一鍾見後漢南蠻傳又華陽國志一華山勒石昭王嘗與天神博于此矣見韓非子外儲說左上秦昭王令工施鉤梯而上華山以松柏之心為博箭長八尺棋長八寸而勒之將死出令為我葬必以魏子為殉見戰國策四秦宣太后愛魏丑夫太后病將死出令自鄭使告于秦鄭人使我掌其北門之管若潛師以來國可得也見左傳僖三十二年定變法之令令民為什伍而相收司連坐不告奸者腰斬告奸者與斬敵者同賞匿奸者與降敵同罰民有二男以上不分異者倍其賦有軍功者各以率受上爵為私鬥者各以輕重被刑大小僇力本業耕織致粟帛多者復其身事末利及怠而貧者舉以為收孥宗室非有軍功論不得為屬籍明尊卑爵秩等級各以差次名田宅臣妾衣服以家次有功者顯榮無功者雖富無所芬華見史記商君傳南門募徙木令有能徙置北門者予十金見史記商君傳令既具未布恐民之不信己乃立三丈之木于國都市南門募云云復募能徙者予五十金見史記商君傳民怪之莫敢徙復曰遺魏將公子卬書吾始與公子歡今俱為兩國將不忍相攻可與公子面相見盟樂飲而罷兵以安秦魏見史記商君傳當作立法案商君書二十九篇今二十四篇見存不錄錄其佚篇六法先王當時而立法度務而制事法宜其時則治事適其務故有功然則法有時而治事有當而功今時移而法不變務易而事以古是法與時詭而事與務易也故法立而亂益務為而事廢故聖王之治國也不法古不循今當時而立功在難而能免今民能變俗矣而法不易國形更勢矣而務以古夫法者民之治也務者事之用也國失法則危事失用則不成故法不當時而務不適用而不危者未之有也見群書治要三十六答鬼谷先生書先生秉德含弘飢必啖芝英渴必飲玉漿德與神靈齊明與三光同不忘賜書戒以貪味儀以不敏名聞不昭入秦匡霸欲翼時君刺以河邊喻以深山雖素空闇誠銜斯旨儀等曰偉哉先生方覽遐鑒興亡皎然二子不能抑志退身甘蓼蟲之樂棲竹葦之巢自掇泯滅悲夫痛哉見錄異記鬼谷先生遺儀秦書儀秦答為秦破從連橫獻書楚王秦地半天下兵敵四國被山帶河四塞以為固虎賁之士百餘萬車千乘騎萬匹粟如丘山法令既明士卒安難樂死主嚴以明將知以武雖無出兵甲席卷常山之險折天下之脊天下後服者先亡且夫為從者無以異于驅群而攻猛虎也夫虎之與羊不格明矣今大王不與猛虎而與群羊竊以為大王之計過矣凡天下強國非秦而楚非楚而秦兩國敵侔交爭其勢不兩立而大王不與秦秦下甲兵據宜陽韓之上地不通下河東取成皋韓必入臣于秦韓入臣魏則從風而動秦攻楚之西韓魏攻其北社稷豈得無危哉且夫約從者聚群弱而攻至強也夫以弱攻強不料敵而輕戰國貧而驟舉兵此危亡之術也臣聞之兵不如者勿與挑戰粟不如者必與持久夫從人者飾辯虛辭高主之節行言其利而不言其害卒有楚禍史記作秦禍無及為已是故願大王之熟計之也秦西有巴蜀方船史記作大船積粟起于汶山循江而下至郢三千餘里舫船載卒一舫載五十人與三月之糧下水而浮一日行三百餘里里數雖多不費馬汗之勞不至十日而拒扞關扞關驚則從竟陵已東盡城守矣黔中巫郡非王之有已秦舉甲出之武關南面而攻則北地絕秦兵之攻楚也危難在三月之內而楚恃諸侯之救在半歲之外此其勢不相及也夫恃弱國之救而忘強秦之禍此臣之所以為大王之患也且大王嘗與吳人五戰三勝而亡之陳卒盡矣有偏守新城而居民苦矣臣聞之攻大者易危而民弊者怨于上夫守易危之功而逆強秦之心臣竊為大王危之且夫秦之所以不出甲于函谷關十五年以攻諸侯者陰謀有吞天下之心也楚嘗與秦構難戰于漢中楚人不勝通侯執珪死者七十餘人遂亡漢中楚王大怒興師襲秦戰于藍田又却此所謂兩虎相搏者也夫秦楚相弊而韓魏以全制其後許無過史記作危于此者矣是故願大王熟計之也秦下兵攻衛陽晉必開扃天下之匈大王悉起兵以攻宋不至數月而宋可舉舉宋而東指則泗上十二諸侯盡王之有已凡天下所信約從親堅者蘇秦封為武安君而相燕即陰與燕王謀破齊共分其地乃佯有罪出走入齊齊王因受而相之居二年而覺齊王大怒車裂蘇秦于市夫以一詐偽反覆之蘇秦而欲經營天下混一諸侯其不可成也亦明矣今秦之與楚也接境壤界固形親之國也大王誠能聽臣臣請秦太子入質于楚楚太子入質于秦請以秦女為王箕帚之妾效萬家之都以湯沐之邑長為昆弟之國終無相攻擊臣以為計無便于此者故敝邑秦王使使臣獻書大王之從車下風須以決事見戰國策十四又史記張儀傳少末廿一字獻書韓王韓地險惡山居五穀所生非麥而豆民之所食大抵豆飯藿羹一歲不收民不饜糟糠地方不滿九百里無二歲之所食料大王之卒悉之不過三十萬而厮徒負養在其中矣為除守徼亭鄣塞見卒不過二十萬而已矣秦帶甲百餘萬車千乘騎萬匹虎摯之士跿跔科頭貫頤奮戟者至不可勝計也秦馬之良戎兵之眾探前趹後蹄間三尋者不可稱數也山東之卒被甲冒冑以會戰秦人捐甲徒裎以趨敵左挈人頭右挾生虜夫秦卒之與山東之卒也猶孟賁之與怯夫也以重力相壓猶鳥獲之與嬰兒也夫戰孟賁鳥獲之士以攻不服之弱國無以異于墮千鈞之重集于鳥卵之上必無幸矣諸侯史記作夫群臣諸侯不料兵之弱食之寡而聽從人之甘言好辭比周以相飾也皆言曰聽吾計則可以強霸天下夫不顧社稷之長利而聽須臾之說詿誤人主者無過于此者矣大王不事秦秦下甲據宜陽斷絕韓之上地東取成皋宜陽史記作滎陽則鴻台之宮桑林之菀非王之有已夫塞成皋絕上地則王之國分矣先事秦則安矣不事秦則危矣夫造禍而求福計淺而怨深逆秦而順楚雖欲無亡不可得也故為大王計莫如事秦秦之所欲莫如弱楚而能弱楚者莫如韓非以韓能強于楚也其地勢然也今主西面而事秦以攻楚為敝邑秦王必喜夫攻楚而私其地轉禍而說秦計無便于此者也是故秦王使使臣獻大王御史須以決事見戰國策二十六又史記張儀傳少末十七字為文檄告楚相始吾從若飲我不盜而璧若笞我若善守汝國我顧且盜而城見史記張儀傳嘗從楚相飲楚相亡璧門下意張儀共執儀掠笞數百不服儀既相秦為文檄告楚相白沙郵三石人刻要水竭不見足盛不沒肩見華陽國志李冰為蜀守于玉女房下白沙郵作三石人立三水中刻江神要云云北堂書鈔一百六十引同水經江水一注作水竭不至足盛設要今本華陽國志或作立三水中與江神要獻書昭王臣聞明主正有功者不得不賞有能者不得不官勞大者其祿厚功多者其爵尊能治眾者其官大故不能者不敢當其職焉能者亦不得蔽隱使以臣之言為可則行而益利其道若將弗行則久留臣無為也語曰人主後語作庸主賞所愛而罰所惡明主則不然賞必加于有功刑必斷于有罪今臣之胸不足以當椹質要不足以待斧鉞豈敢以疑事嘗試于王乎雖以臣為賤而輕辱臣獨不重任臣者後無反覆于王前邪臣聞周有砥厄宋有結綠梁有懸黎楚有和璞此四寶者工之所失也而為天下名器然則聖王之所棄者獨不足以厚國家乎臣聞善厚家者取之于國善厚國者取之于諸侯天下有明主則諸侯不得擅厚矣是何故也為其凋榮也良醫知病人之死生聖主明于成敗之事利則行之害則舍之疑則少嘗之雖堯舜禹湯復生弗能改已語之至者臣不敢載之于書其淺者又不足聽也意者臣愚而不闔于王心邪亡其言臣者將賤而不足聽邪非若是也則臣之志願少賜游觀之間望見足下而入之見戰國策五又見史記范雎傳史記將賤而不足聽邪已下作賤而不可用乎又有自非然者臣願得少賜游觀之間望見顏色一語無效請伏斧質等句餘文字亦有同異呂氏春秋序意維秦八年歲在涒灘秋甲子朔朔之日良人請問十二紀文信侯曰嘗得學黃帝之所以誨顓頊矣爰有大圜在上大矩在下汝能法之為民父母蓋聞古之清世是法天地凡十二紀者所以紀治亂存亡也所以知壽夭吉凶也上揆之天下驗之地中審之人若此則是非可不可無所遁矣天曰順順維生地曰固固維寧人曰信信維聽三者咸當無為而行行也者行其理也行數循其理平其私夫私視使目盲私聽使耳聾私慮使心狂三者皆私設精則智無由公智不公則福日衰災日隆以日倪而西望知之見呂氏春秋十二案此下尚有趙襄子一段非十二紀之總序也不錄柳下惠誄夫子之不伐兮夫子之不竭兮夫子之信誠而與人無害兮屈柔從俗不強察兮蒙恥救民德彌大兮雖遇三黜終不蔽兮愷悌君子永能厲兮嗟乎惜哉乃下世兮庶幾遐年今遂逝兮鳴呼哀哉魂神泄兮夫子之謚宜為惠兮見列女傳二柳下既死門人將誄之妻曰將誄夫子之德邪則二三子不如妾之知也乃誄云云門人從之以為誄莫能竄一字置兒絝中祝趙宗滅乎若號即不滅若無聲見史記趙世家款門上魏哀王書曲沃之老婦也心有所懷願以聞于王見列女傳三魏哀王為大子納妃而美將自納焉負因款王門而上書王召入遂與太子妃而賜負三十鍾密遺夫韓憑書其雨淫淫河大水深日出當心見搜神記十一宋康王奪韓憑妻何氏憑怨王囚之論為城旦妻密遺憑書繆其辭御覽五百五十九作河大水深遺書于帶王利其生妾利其死願以尸骨賜憑合葬見搜神記十一韓憑自殺妻遂自投台左右攬之衣不中手而死遺書于帶持幟見頃襄王言隱事大魚失水有龍無尾牆欲內崩而王不視見列女傳六上書趙王括不可使將始妾事其父時為將身所奉飯飲而進食者以十數所友者以百數大王及宗室所賞賜者盡以予軍吏士大夫受命之日不問家事今括一旦為將東向而朝軍吏無敢仰視之者王所賜金帛歸藏于家而日視便利田宅可買者買之王以為何如其父父子異心願王必遣王終遣之即有如不稱妾得無隨坐乎見史記趙奢傳趙孝成王七年秦與趙兵相距長平信秦之間以趙奢子括為將代廉頗及括將行其母上書云云括軍敗前後所亡四十五萬趙王以括母先言竟不誅也又略見御覽二百八十
