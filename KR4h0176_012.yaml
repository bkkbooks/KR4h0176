body:
  text: 闕名離別相去詞躒躁摧長恧兮擢戟馭殳所離不降兮以泄我王氣蘇三軍一飛降兮所向皆殂一士判死兮而當百夫道祐有德兮吳卒自屠雪我王宿恥兮威振八都軍伍難更兮勢如貔貙行行各努力兮於乎於乎見吳越春秋句踐伐吳外傳十軍士各與父兄昆弟取決國人悲哀皆作離別相去之詞案是篇起上古三代迄隋各家為集各集分類先賦次騷次詔冊今此離別相去之詞是騷賦體故編于闕名之首召將詔社稷安危一在將軍今某國不臣願將軍率師應之見六韜龍韜立將凡國有難君避正殿召將而詔之社稷之命在將軍即今國有難願請子將而應之見淮南子兵略訓本六韜而小異見其虛則進見其實則避勿以三軍為眾而輕敵勿以授命為重而苟進勿以貴而賤人勿以獨見而違眾勿以辯士為必然勿以謀簡于人勿以謀後于人士未坐勿坐士未食勿食寒暑必同敵可勝也見群書治要引六韜犬韜國有難君召將而詔今本無大始天文冊文大虛廖廓肇基化元萬物資始五運終天布氣真靈總統坤元九星懸朗七曜周旋曰陰曰陽曰柔曰剛幽顯既會寒暑弛張生生化化品物咸章見素問天元紀大論鬼區臾引丹天之氣經于牛女戊分黅天之氣經于心尾巳分蒼天之氣經于危室柳鬼素天之氣經于亢氐昴畢玄天之氣經于張翼婁會見素問五運行大論鬼區臾引昭命大命世罰小命罰身大戴禮本命篇注引無兩罰字福莫大于行義禍莫大于淫祭醜莫大于傷人賞莫大于信義讓莫大于案信義讓莫大于六字當為衍文賈上罰莫大于貪詐見周書命訓解明王是故昭命以命之投壼命弟子辭無荒無慠無倨立無踰言若是者有常爵見大戴禮投壼命射辭弓既平張四侯且良決拾有常既順乃讓乃揖乃讓乃隮其堂乃節其行既志乃張射夫命射射者之聲御車之旌既獲棄莫下闕見大戴禮投壼案困學紀聞云此命射之辭也夏令九月除道十月成梁見周語中單襄公引夏令韋昭曰夏令夏后氏之令周所因也明堂月朔令孟春之月朔令曰挺群禁開閉闔通窮窒達障塞待優游其禁毋伐林木仲春之月朔令曰棄怒惡解役罪免憂患休罰刑閉關梁其禁田獵不宿飲食不享出入不節奪民農時及有奸謀季春之月朔令曰宣庫財和外怨撫四方行柔惠止剛強九門磔攘出疫于郊以禳春氣孟夏之月朔令曰爵有德賞有功惠賢良舉力農其禁毋隳防仲夏之月朔令曰振貧窮惠孤寡慮囚疾出大祿行大賞其禁棄法律逐功臣殺太子以妾為妻季夏之月朔令曰起毀宗立無後封廢國立賢輔恤喪疾中央之極令民下闕其禁治宮室飾台榭內淫亂犯親戚侮父兄孟秋之月朔令曰審用法備盜賊禁奸邪飭群牧謹貯聚其禁毋弛戎備仲秋之月朔令曰謹功築遏溝瀆修囷倉決刑獄趣收斂其禁好攻戰輕百姓飾城郭侵邊竟乃令民畋醵庶甿畢入于室曰時殺將至毋罹其菑季秋之月朔令曰除道路守門閭陳兵甲戒百官誅不法除道成梁以利農夫孟冬之月朔令曰申群禁修障塞畢積聚系牛馬收澤賦其禁毋作淫巧仲冬之月朔令曰搜外徒止夜禁誅詐偽省醞釀謹閉關其禁簡宗廟不禱祠廢祭祀逆天時季冬之月朔令曰省牲牷修農器收秸薪築囹圄謹蓋藏見尚書大傳春令生而勿殺賞而勿罰罪獄勿斷以待期年夏令毋聚大眾毋行大火毋斷大木誅大臣毋斬大山毋戮大衍滅三大而國有害也秋令罰而勿賞奪而勿予罪獄誅而勿生終歲之罪毋有所赦作衍牛馬之實在野者王冬令毋行大火毋斬大山毋塞大水毋犯天之隆并見管子輕重己五位令五位東方之極太皞勾芒之所司其令曰挺群禁開閉闔通窮窒達障塞行優游棄怨惡解役罪免憂患休罰刑開關梁宣出財和外怨撫四方行柔惠止剛強南方之極赤帝祀融之所司其令曰爵有德賞有功惠賢良救飢渴舉力農賑貧窮惠孤寡憂罷疾出大祿行大賞起毀宗立無後封建侯立賢輔中央之極黃帝後土之所司其令曰平而不阿明而不苛包裏覆露無不囊懷溥泛無正靜以和行稃鬻養老衰吊死問疾以送萬物之歸西方之極少皞蓐收之所司甚令曰審用法誅必辜備盜賊禁奸邪飾群牧謹著聚修城郭補決竇塞蹊徑遏溝瀆止流水雝谿谷守門閭陳兵甲選百官誅不法北方之極顓頊玄冥之所司其令曰申群禁固閉藏修障塞繕關梁禁外徒斷罰刑殺當罪閉關閭大搜客止交游禁夜樂蚤閉晏開以塞奸人已得執之必固天節已幾刑殺無赦雖有盛尊之親斷以法度毋行水毋發藏毋釋罪見淮南子時則訓軍令某日出某門吏士不得刈稼穡伐樹木殺六畜掠取財物姦犯人婦人違令者斬見通典一百四十九引覆軍誡法諸軍出行將令百官士卒無伐樹木無掘墳墓無敗五穀無焚積聚無捕民虜無聚六畜見文子上義兵至其郊令軍帥義兵號令其國之君逆天地侮鬼神決獄不平殺戮無罪天之所誅民之所仇也兵之來也以廢不義而授有德也有敢逆天道亂民之賊者身死族滅以家聽者祿以家以里聽者賞以里以鄉聽者封以鄉以懸聽者侯以懸見文子上義乃發號施令兵之來也以救民之死子之在上無道倨傲荒怠貪戾虐眾恣雎自用也辟遠聖制謷丑先生排訾舊典上不順天不下惠民征斂無期求索無厭罪殺不辜慶賞不當若此者天之所誅也人之所仇也不當為君今兵之來也將以誅不當為君者也以除民之仇而順天之道也民有逆天之道衛人之仇者身死家戮不赦有能以家聽者祿之以家以里聽者祿之以里以鄉聽者祿之以鄉以邑聽者祿之以邑以國聽者祿之以國見呂氏春秋懷寵先發聲出號高誘注號令直幣令貲家假幣皆以穀準幣見管子山國軌秦攻齊令有敢去柳下季壟五十步而樵采者死不赦有能得齊王頭者封萬戶侯賜金千鎰并見戰國策十一先王之令天道賞善而罰淫見周語中先王之教雨畢而除道水涸而成梁草木節解而備藏隕霜而冬裘具清風至而修城郭宮室同上先王之法為善者賞為不善罰見呂氏春秋禁塞納書譖晏子廢置不周于君前謂之專出言不諱于君前謂之易專易之行存則君臣之道廢矣吾不知晏子之為忠臣也見晏子春秋外篇第七為齊獻書趙王臣一見而能令王坐而天下致名寶而臣竊怪王之不試見臣而竊臣也群臣必多以臣為不能者故王重見臣也以臣為不能者非他欲用王之兵成其私者也非然則交有所偏者也非然則知不足者也非然則欲以天下之重恐王而取行于王者也臣以齊循事王王能亡燕能亡韓魏能攻秦能孤秦臣以為齊致尊名于王天下孰敢不致尊名于王臣以齊致地于王天下孰敢不致地于王臣以齊為王求名于燕及韓魏孰敢辭之臣之能也其前可見已齊先重王故天下盡重王無齊天下必盡輕王也秦之強以無齊之故重王燕魏自以無齊故重王今王無齊獨安得無重天下故勸王無齊者非知不足也則不忠者也非然則欲用王之兵成其私者也非然則欲輕王以天下之重取行于王者也非然則位尊而能卑者也願王之熟慮無齊之利害也見戰國策二十一獻書秦王昔竊聞大王之謀出事于梁謀恐不出于計矣願大王之熟計之也梁者山東之要也有蛇于此擊其尾其首救擊其首其尾救擊其中身首尾皆救今梁王天下之中身也秦攻梁者是示天下要斷山東之脊也是山東首尾皆救中身之時也山東見亡必恐恐必大合山東尚強臣見秦之必不憂可立而待也臣竊為大王計不如南出事于南方其兵弱天下必能救地可廣大國可富兵可強主可尊王不聞湯之伐桀乎試之弱密須氏以為武教得密須氏而湯之服桀矣今秦國與山東為仇不先以弱為武教兵必大挫國必大憂見戰國策二十五獻書燕王王而不能自恃不惡卑名以事強事強可以令國安長久萬世之善計以事強而不可以為萬世則不如合弱將奈何合弱而不能如一此臣之所為山東苦也比目之魚不相得則不能行故古之人稱之以其合兩而如一也今山東合弱而不能如一是山東之知不如魚也又譬如車士之引車也三人不能行索二人五人而車因行矣今山東三國弱而不能敵秦索二國因能勝秦矣然而山東不知相索智固不如車士矣胡與越人言語不相知志意不相通同舟而凌波至其相救助如一也今山東之相與也如同舟而濟秦之兵至不能相救助如一智又不如胡越之人矣三物者人之所能為也山東之主遂不悟此臣之所為山東苦也願大王之熟慮之也山東相合之主者不卑名之國者可長存之卒者出士以戍韓梁之西邊此燕之上計也不急為此國必危矣王必大憂今韓梁趙三國以合矣秦見三晉之堅也必南伐楚趙見秦之伐楚也必北攻燕物固有勢異而患同者秦久伐韓故中山亡今久伐楚燕必亡臣竊為王計不如以兵南合三晉約戍韓梁之西邊山東不能堅為此此必皆亡見戰國策三十瞽史之紀唐叔之世將如商數見晉語四韋昭注瞽史知天道者嗣續其祖如穀之滋必有晉國同上背賂誦佞之見佞果喪其田詐之見詐果喪其賂得國而狃終逢其咎喪田不懲禍亂其興見晉語三惠公入而背外內之賂輿人誦人改葬共世子誦貞之無報也孰是人斯而有是臭也貞為不聽信為不誠國斯無刑偷居幸生不更厥貞大命其傾威兮懷兮各聚爾有以待斯歸兮倚兮違兮心之哀兮歲之二七其靡有徵兮若狄公子吾是之依兮鎮撫國家為王妃兮見晉語三惠公即位出共世子而改葬之臭達于外國人誦之城濮誦原田每每舍其舊而新是謀見左傳僖二十八年楚師背酅而舍晉侯患之聽輿人之誦臧紇誦臧之狐裘敗我于狐駘我君小子朱儒是使朱儒朱儒使我敗于邾見左傳襄四年臧紇救鄫侵邾敗于狐駘國人誦之子產誦取我衣冠而褚之取我田疇而伍之孰殺子產吾其與之見左傳襄三十年鄭子皮授子產政從政一年輿人誦之我有子弟子產誨之我有田疇子產殖之子產而死誰其嗣之同上及三年又誦之孔子誦麛裘而韠投之無戾韠而麛裘投之無郵見呂氏春秋樂成孔子始用于魯魯人鷖誦之袞衣章甫實獲我所章甫袞衣惠我無私同上及三月政成化既行又作誦亦見家語孔叢子商箴天降災布祥并有其職見呂氏春秋有始覽名類引商箴周箴夫自念斯學德未暮見呂氏春秋謹聽引周箴大正箴欽之哉諸正敬功爾頌審三節無思民因疑當作民困即閔轉寫誤耳順爾臨獄無頗正刑有掇夫疑作矢循乃德式監不遠以有此人保寧爾國克戒爾服世世是其不殆維公咸若見周書嘗麥解商銘嗛嗛之德不足就也不可以矜而只取憂也嗛嗛之食不足狃也不能為膏而只離咎也見晉語一郭偃曰商之衰也其銘有之嘉量銘時文思索允臻其極嘉量既成以觀四國永啟厥後茲器維則見考工記崑崙柱銘崑崙銅柱其高入天員周如削膚體美焉見水經河水注一引張華敘東方朔神異經曰故其柱銘曰云云今本神異經無希有鳥銘有鳥希有綠赤煌煌不鳴不食東覆東王公西覆西王母王母欲東登之自通陰陽相須惟會益工見水經河水注一引張華敘東方朔神異經曰其鳥銘曰云云今本神異經無希有鳥名許子將鐘銘隹正月初吉丁亥𨡰吉金自作鈴鐘中縣𠭯元鳴孔煌穆和鐘用匰以以喜用樂嘉賓大夫及我朋友𡻭越越萬季無諆壽母已子子孫孫永保鼓之見薛尚功鐘鼎款識齊鐘銘隹王五月唇才戊寅師于甾公曰女及余經乃先具余既尃乃心女小心忌女不彖夙夜宦𡠗而政事余弘乃心余命女政于朕三軍簫借為肅舊釋綴非成朕師旟之政德諫罰朕庶民左右母諱乃不敢弗憼戒虔卹乃事和三軍徒雩乃行師昚中乃罰公曰及女敬共辝命女雁鬲㽁同借為歷公家女恐朕行師女敏于戎攻余易女都霸借為伯舊釋胤非其縣二百余命女𤔲辝徒三千為女敵寮乃敢用拜𩒨首弗敢不對揚朕辟皇君之易休命公曰及女康能乃有事率乃敵寮余用登屯厚乃命女及母曰余小子女尃于恤虔恤不易左右余一人余命女𦀂織舊釋緘非差饗為大事疑靜舊釋繼非命于外內之事中尃盟借為明刑女台尃戒公家雁余于恤女台卹余朕身余易女車馬戎兵僕二百又五十家女台戒戎乃用或敢再拜𩒨首雁受君公之易光余弗敢法借為廢乃命及𥮏其先舊及其高具𩵎成唐又敢才帝所受天命伐𨂠同于靈師伊舊釋僅非小臣隹㭪咸又九州處禹之堵不顯穆公之孫其配㙗同㛱即威字公之𡛛出舊釋夔公之姂非而鋮公之女雩生尗及是辟于齊侯之所是小心龏靈力若虎堇其政事又共于公所吉金一鐘作又共于桓武靈公之所桓武靈公易乃吉金鈇鎬鋁用享𥃘其寶鎛用享于其皇具皇奼皇母皇考用𣥍壽靈命難老不顯皇具其乍福元孫其萬福屯魯和借為協而九事卑若鍾鼓外內剴辟都都橅這即誕舊釋造非而朋母或氶或釋異非頪女考壽萬年羕寶其身卑百斯男而斯字義政齊侯左右毋央毋已至于曰武靈成子孫羕寶用享見鐘鼎款識又考古圖秦鐘銘秦公曰不顯朕皇且受天命竈灶借為造舊釋奄非又下國十又二公不豕上帝嚴龏夤天命保業乃秦虩事䜌夏曰余雖小子穆穆帥秉明德叡尃明刑虔敬朕祀以受多福亦字借為協和萬民唬夙夕刺刺𧻚𧻚萬生是敕咸畜百辟胤士趫趫文武靜不廷舊釋西夏二字燮百邦于秦執事乍盄龢鐘乃名曰未詳邦其言銑銑雍雍孔煌以邵𩂣借為昭𢓜孝享以受屯魯借為純嘏多釐釁壽無彊畯惠才立高弘有虔匍借為溥及四方永寶㝖見鐘鼎款識遲父鐘銘遲父乍姬齊姜和鍾用邵乃穆不顯龍光乃用匄多福侯父眔齊萬季壽子子孫孫亡彊寶見鐘鼎款識楚鐘銘隹王五十又六祀疑赴舊釋徙非自鹵疑即昜漢志江夏有西陽楚王訡訡即吟借為熊章乍曾侯乙宗彝寘之于鹵其永用見鐘鼎款識又見王復齋鐘鼎款識宗周寶鐘銘王肇建相文武堇彊土南或𠬝要敢為虐我土王𦎫我其至伐乃都𠬝要遣閒來逆郡王南人東人具見廿又六邦隹皇上帝百神保余小子朕猷又成亡競我隹司配皇天王對乍宗周寶鐘倉倉它它䇓雝雝用邵各不顯且考先先王其嚴才上能能降余多福余余洎孫參壽隹㻝其萬年畯保四或見拓本虢叔大夾鐘銘虢尗旅曰不顯皇考叀尗穆秉元明德御于乃辟䙷屯亡旅敢啔師井皇考威義為御于天子天子多易旅休旅對天子魯休揚用戶朕皇考叀尗大和鐘皇考嚴才上異才下𠛱𠛱能能降旅多福旅其萬年子子孫孫永寶用享見拓本邾公華鐘銘隹王正月初吉乙亥公華乃吉金玄鏐赤錯用𥃘乃和鐘台乍其皇且皇考曰余異同翼龏威忌𢙤穆不㒸于乃身𥃘其和鐘台恤其祭祀盟祀台樂大夫台安士庶子昚為之元器其舊哉公壽邦是保其年無僵子子孫孫永保用享見拓本案此鐘大學士紀昀所藏邾公望鐘銘隹王九月初吉辰才乙亥公朢吉金玄鏐𦝙呂乍和鐘曰余龏威忌𥃘辝和鐘二鍺台其屯于和乍天台豈者士至于年分器是寺見拓本案此鐘巡撫阮元所藏楚義鐘銘隹王九月初吉丁亥曾孫未詳舊釋僕非或釋仙余𨒏斯于之子余𢆶未詳之元孫曰于乎敬哉余義之良臣而㣱之字父余𨖊䙷吉金鎛鋁台鑄鐘台追孝𢓠且樂𢦠父兄㱃飤訶𨖴孫孫用之𥼶民是見拓本楚卬仲嬭南和鐘銘隹正月初吉丁亥楚王賸卬仲嬭南和鐘其眉壽無疆子子孫孫永保用之見博古圖
