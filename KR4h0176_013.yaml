body:
  text: 闕名金華山鼎銘真金作鼎百神率服見虞荔鼎録金華山黃帝作一鼎高一丈三尺篆書三足案此鼎屬萬帝未審何據今編列闕名鼎銘之首讒鼎銘昧旦丕顯後世猶怠見左傳昭三年案韓非子亦作讒鼎蓋即明堂位之崇鼎呂氏春秋之岑鼎也古者讒崇岑聲近一云讒地名禹鑄九鼎于甘讒之地栒邑鼎銘王命尸臣官此栒邑賜爾旗鸞黼黻雕戈尸臣拜手稽首曰敢對揚天子丕顯休命見漢書郊祀志下美陽得鼎獻之張敝上議今鼎出于郊東中有刻書仲山甫鼎銘仲山甫鼎其萬年子子孫孫永寶用見後漢竇憲傳南單于于漠北遺憲古鼎容五鬥其旁銘楚鼎銘楚武王之鼎見續漢郡國志二汝南鮦陽侯國注引皇覽曰永平中葛陂城北祝里社下于土中得銅鼎而銘汾陽鼎銘壽考天地百祥臻侍山伏其靈海伏其異見鼎録大夫始鼎銘隹三月初吉甲寅王才和宮大夫易友王才華宮宅王才邦宮獻工易易章王才邦易友考曰攸大夫敢對揚天子休用作文考日已寶鼎孫孫子子永寶用見鐘鼎款識南宮鼎銘隹王令南宮伐反虎方之年王令中先㭗南或𤰶行王㡴杜二字未詳舊釋射圃不確貞山中歸生對刊王刊寶彝見鐘鼎款識又王復齊鐘鼎款識又拓本𣁋䜌鼎銘隹王草又三年九月王才宗周王令𣁋䜌疑靜舊釋繼非嗣九服䜌乍朕皇考彝鼎用享孝于朕皇考用易康和魯休屯右壽永令霝𠔾其萬年無疆䜌子子孫孫永寶用享見鐘鼎款識晉姜鼎銘隹王九月乙亥晉姜曰余隹司朕先姑君晉邦余不妬假談長說舊釋辱非妄寧巠雍明德宣邲我猷用召所辝辟妥瑒乃光刺虔不㒸𧭷覃克以我萬民嘉遣我易責魯績即魯縞舊釋虎賁非虎賁豈得云千乎千勿法借為廢文侯頵令𤰞𤰶𢓶弘征綏湯取乃吉金用乍寶鼎用康舊釋為西夏二字妥褱遠疑邦之殘字君子晉姜用繛綰壽乍為亟萬季無彊用享用德畯保其孫子三壽是利見鐘鼎款識又考古圖又有新出土鼎其銘陽文聯綿糾結人不能識謂之草篆謂之乙亥鼎審視拓本即晉姜鼎也鐘鼎款識作作姬鼎寰鼎銘隹草又八年五月既庚寅王才周康穆宮旦王各大室即立宰頵右寰入門立中廷北卿史受王令書王乎史淢冊易寰玄衣黹屯赤市朱黃䜌旗攸勒戈雕必彤矢寰拜𩒨首敢對揚天子不顯假休令用乍朕皇考奠白鼎寰其邁年子孫永寶用見鐘鼎款識案新出土有寰盤銘同惟銘末作奠白奠寶般寰其邁年子子孫孫永寶用為異師旦鼎銘隹元年八月丁亥師旦受命乍周王大姒寶尊彝敢拜𩒨首用眉壽無彊子孫其萬年永寶用享見拓本叔夜鼎銘叔夜𥃘其饒鼎以征以行用饘用羹用祈壽無彊見拓本頌鼎銘隹三年五月既死霸甲戍王才周唐邵宮旦王各大室即立宰弘右頌入門立中廷尹氏受王令書王乎史虢生冊命頌王曰頌令女官𤔲成周貯草家監𤔲新貯用宮御易女玄衣黹屯赤市朱黃䜌旗攸勒用事頌拜𩒨首受令冊佩以出反人堇𥩫頌敢對揚天子不𣊡魯休用乍朕皇考龏叔皇母龏寶鼎用追孝丐康虔屯右通彔永令頌其萬年壽畯臣天子霝終子子孫孫寶用見拓本案別有頌簋銘同唯鼎作簋為異仲稱父鼎銘唯王五月初吉丁亥周白邊中稱父伐南淮人孚金用乍寶鼎其萬年子子孫孫永寶用見拓本鬲攸比鼎銘隹世又一年三月初吉壬辰王才周康宮辟大室鬲比以攸衛牧告于王曰女我田牧弗許鬲比王令相史南以虢旅虢旅事攸衛牧誓曰弗具付鬲比其且射分田邑則攸衛牧則誓比乍朕皇且丁公皇考叀公鼎鬲攸比其年子子孫孫永寶用見拓本國諸鼎銘者乍旅鼎用丐稱魯䃾用妥眉彔用乍忞考宮白寶彝見拓本曶鼎銘隹王元年六月既望乙亥王才周穆王大若曰曶令女乃且考𤔲卜事易女赤用事王少遷㡴井叔易曶赤全璑曶受休王曶用絲金乍朕文考白牛鼎曶其萬用祀子孫其永寶隹王四月既生霸辰才丁酉井叔才異為事及小子𢿱以限訟于井叔我既賣女五父用匹馬束絲限詔曰斦則俾我賞馬效俾復乃絲質效父詔𢿱曰于王參門木柍用㣱𢓊賣𢆶五夫用百爰非之五夫罰斦又罰眔金井曰才王人賣不造付曶母俾越于斦曶則拜𩒨首受𢆶五曰曰恆曰曰彝曰相事爰以告斦俾以曶奠彶羊絲三爰用致𢆶人曶于斦舍𢿱大五秉曰才尚俾處及邑田田斦則俾復命曰若昔饉歲匡衆及臣草夫寇曶禾十牬以匡季告東宮曰尨乃及乃弗敗女匡罰大匡𩒨首于曶用五田用衆一夫曰嗌用臣曰敷曰𣍧曰奠曰用𢆶四夫𩒨首曰余無具寇足不余曶或以匡季告東宮曶曰𠦀唯朕賞東宮曰賞曶禾十牬遺十秭為草秭來歲弗賞則倍卌秭或即曶用田二又臣用即曶田十曰人五夫曶受匡世秭見拓本案此鼎在靈岩山館無叀鼎銘隹九月既望甲戍王各于周廟𤆆于圖室𤔲徒南中石無叀內門立中廷王乎史友冊令無叀曰官𤔲左王敗側弗乍易女玄衣黹屯戈雕縞必彤矢攸勒䜌旗無叀敢對揚天子不顯魯休用乍鼎用享于朕刺考用割眉壽萬年子孫永寶用見拓本案此鼎在焦山正考父鼎銘隹四月初吉正考父作文王寶鼎其萬年無彊子孫永寶用享見拓本一命而僂再命而傴三命而俯循牆而走亦莫余敢侮饘于是鬻于是以糊余口見左傳昭七年鐘鼎款識作季㜏鼎銘夌彝銘正月王才成周王于楚彔令小臣夌先相楚㡴王至于㡴無借為廡遣小臣夌易鼎易馬𠔿夌拜𩒨首對昜王休用乍季寶彝見鐘鼎款識又一拓本作易鼎馬𠔿不重易字當別是一器鐘鼎款識作尹卣銘隹十又二月王初旁唯還在周辰在庚申王西宮𧯦舊釋熹非咸釐尹易臣雉僰夕尹休高對乍父內寶彝尹𠀠萬年受乃永魯亡竟才服其長侯𠀠子子孫孫寶用見鐘鼎款識䅓彝銘䅓從師淮父戍于古堆蔑𤯍易貝卅寽䅓拜𩒨首對揚師淮父休用乍文考日乙寶彝其子孫永富借為寶未詳本亦作樂或作博古釋為立戈形或釋哉并非見復齊鐘鼎款識爪彝銘隹二月初吉丁卯公令爪𤔲田乃爪蔑𤯍易馬易裘對揚公𡜩休用乍寶彝見拓本凡二器皆同爪或釋邑非靜彝銘隹三月初吉丙寅王才京王易靜刀靜拜𩒨首敢對揚王休用乍宗彝其子子孫孫永寶用見拓本隹十又三月王宅京小臣靜即事王易貝五十朋天子休用乍父寶彝見拓本豦彝銘豦𩒨首休朕陶借為保君公白易乃臣弟豦井五易𠅿干戈豦弗敢望公白休對揚白休用乍且考寶彝見拓本吳彝銘隹二月初吉丁亥王才周成大室旦王各廟宰𣍧右乍冊吳入門立中延北卿借為向王乎史戊冊令吳𤔲者借為都眔叔金易鬯一玄袞衣赤舄金𨏖桑未詳或釋絭朱虢未詳或釋旗虎冟借為韔柬桑𨏖畫𩌏金甬馬三匹攸勒吳拜𩒨首敢對揚王休用乍青尹寶彝吳𠀠止子孫永寶用佳王二祀見拓本韋彝銘小子即韋衛從此以其友乍男王彝見拓本毛伯彝銘隹正月吉日乙又讀為毛伯二字舊釋拍非乍朕配平𦤘宮祀彝毋𠮵用祀永枼母出見拓本隹八月初吉王才宗周甲戍王令毛白虢公服𤲀王立乍四方未詳秉繁蜀未詳令易鈴咸王令毛公以邦冢君土𩣓或人我東或㾓戎咸王令吳白曰以乃堆𠮢從毛父王令呂白曰以乃堆𠮢從毛父遣令曰以乃族從父征造衛父身三年靜東或亡不成䙷天俾否里屯陟公告乃事于上佳民亡造才彝天令故亡允才顯佳苟德亡違班拜𩒨首曰佳余不㬎省即顯皇公受享宗彝釐敏文王王始為孫于大服廣成乃工文王孫亡弗褱井亡充乃刺班非時覓未詳舊釋𧠙佳乍郡考無曰大政子子孫孫多世其永寶見拓本散氏鬲銘用散邑即散用田未詳舊釋觀自未詳舊釋淄或釋慮涉以南至于大沽一奉或釋表以陟二至于邊涉𤩪陟雩𠭯𨺰以西于木于𦫿逨于𦫿內陟𦫿于廠源都或釋割𨺰陵陵剛于于原于周以東于未詳或釋游或耔東彊右還于以南于卻逨以西至于𨾊莫井邑田自木𠂇至于井邑以東一還以西一陟剛三降以南于同陟州剛降二大人有𤔲田羛且𣁋父西宮襄豆人虞丂貞師氏右相小門乃䌛原及虞𦮘淮𤔲工虎孝豐父𨾊及有𤔲㓝丂凡十又五夫正舍散田𤔲土未詳疑𣏾舊釋必或釋出未詳疑即陘舊釋周𤔲馬獸或單未詳舊釋率或釋衆未詳舊釋牧人𤔲工君宰父散人小子田戎父𤕝父即克之有𤔲㯱州京焂從凡散有𤔲十夫唯王九月辰才乙卯卑羛且綰也旅誓曰我兟付散氏田器有爽實余有散氏心則爰千罰千傳襄之羛且旅則誓卑宮襄戎父誓曰我既付散氏田牆田余又爽爰千罰千西宮襄戎父則誓乃為圖王于豆新宮東延乃𠂇執釁史正中䰜見拓本吉父簠銘吉父乍寶甫見拓本案甫借為簠陳逆簠銘隹王正月初吉丁亥少子陳曰余陳狟子之裔孫余未詳事齊侯宗家乃吉金台乍乃元配季姜之祥器𨯜𢆶寶笑台享台大宗未詳未詳未詳母乍未詳永命壽壽萬年子子孫孫羕保用見拓本叔朕簠銘隹十月初吉庚午叔朕叔吉金自乍薦𠤳䀇借為簠以稻粱萬季無彊叔朕㧊壽子子孫孫永寶用見拓本曾伯𪏯簠銘隹王九月初吉庚午曾白𩃲聖元元武孔業克人女讀為邑綏二字以邑字屬上句湯金衜讀為賜金二字行具既卑方余其吉金黃余用自乍𠤳以征以行用盛稻粱用用享于我皇且文考天賜之福曾白𩃲𠭊䜌假䜌即假樂讀為嘉樂考工記鳧氏兩欒注故書欒作樂黃耇年壽無子孫永寶用之享見拓本留君簠銘留君乍𩞳𠤳用享用借為賞用壽孫永寶用見拓本隹白𠀠父薦文乍祜䀇借為簠用易壽萬年子孫永寶用之見拓本隹正月初吉子癸子癸亥甲子二日王才成周格白受𠬝馬乘于朋生乃𡺋卅田則析梠白過殹𤣷彶似乃從格白彶旬殷乃系谷𡉿木禺丙谷菜東門乃書史識省武立成成土簋未詳舊釋征㫐用𠕐畫省舊釋期典格白田其年子孫永保用見拓本鍾鼎款識簋作敦非案簋借為簋簋簋字皆從皂也虢姜乍寶簋用禪追孝于皇考叀中丐康虔屯右通彔永令虢姜其萬年𥃘壽受福無彊子子孫孫永寶用享見鐘鼎款識隹正月乙子謂乙亥甲子二日王各于大室穆公入右立中廷北卿王曰令女乍𤔲土官𤔲藉田易女玄衣赤未詳舊釋環市䜌旗楚徒馬㣱五服用事拜𩒨首對揚王休用乍朕文考寶簋其子子孫孫永寶用見鐘鼎款識宰辟父簋銘隹三月初吉王才辟宮宰辟父右周立王冊命周曰易女朱芾玄衣黹純偃攸革易戈雕彤矢用舊釋饌乃且考事官𤔲卪僕小射砥𩵎周𩒨首對揚王休命用乍文考寶簋其子孫孫孫永寶用見鐘鼎款識尨既銘隹元年月既丁亥王才未詳舊釋雍㡴旦王各廟即立宰曶入右尨立中廷王乎史冊令尨王若曰尨昔先王既令女乍宰𤔲王家今余佳𤕌京乃令女衆曰未詳對各從𤔲王家外內毋敢又不未詳𤔲百工未詳入姜氏令乃又衆又即令乃非先告尨母敢侯又人告女女弗善效姜氏人勿事敢又侯止從獄易女玄袞衣赤舄敬夙夕勿法朕令尨拜手𩒨首敢對揚天子不顯魯休用乍寶簋尨其萬年壽子子孫孫永寶用見鐘鼎款識舊題𨚕敦誤案銘文從正䙴字籀辨字隹二年正月初吉王才周卲宮丁亥王各于射毛白內門立中廷右祝王孚內史冊命王曰㫺先王既命女乍邑疑龍舊釋繼非五邑祝今余隹𤕌乃令易女赤市坰网舊借為黃䜌旗用事拜𩒨首敢對瑒天子休命用乍朕皇考龏白簋𠀠壽邁年無彊子子孫孫永寶用享見鐘鼎款識師訇既銘王若曰師舊釋非即言不顯文武孚舊釋庶非受天令亦則于女乃聖且考克孚右先王乍乃𠃍攴二字未詳用夾寅乃辟亶大令籥借為和雩政未詳皇帝亡旲臨保我乃周雩亖即四方民亡不康靜王曰師訇哀才今日天夶央同殃卑降喪首德不克盡古亡氶于先王鄉女乃父恤周邦妥立余小子乃事隹王身厚未詳疑賴今余隹𤕌乃令女雍我邦小大猷邦弘潢苟明乃心䢦以乃友干王身谷女弗以乃辟于艱易女鬯一𠧴圭一卩邑三百人訇𩒨首敢對天子休用乍朕刺且乙白君姬寶簋訇其囟借為恖同斯年子子孫孫永寶用乍𠦃宮寶隹元年二月既望庚寅王各于大室艾內右廷見鐘鼎款識師𣫏既銘隹王元年正月初吉丁亥白和父若曰師𣫏乃且考又登成也舊釋婚非于我家女右隹小子余令女借為尸主也我家疑靜舊釋繼非𤔲我西扁東扁僕馭百工牧臣妾東栽內外母敢否善易女戈高借為縞必彤十五鎛鐘一殸五金敬乃夙夜用事毀拜𩒨首敢對揚皇君休用乍朕文考乙中將簋𣫏其萬年子子孫孫永寶用享見鐘鼎款識牧簋銘隹王十季十又三月既生霸甲寅王才周才師汓舊釋保非父宮各大室即立公為舊今非𥿗入右牧立中廷王乎內史吳冊令牧王曰牧昔先王既令女乍𤔲土今余隹或改令女辟百寮有坰事多𤔬不用先王乍井亦多虐庶民乃嗘庶右不井不中囟借為匆同斯侯之菑同烖今未詳疑既舊釋響司匐乃罪召故王曰牧女母敢先王乍明井用雩乃嗘庶右母敢不明不中不井乃申政事母敢不尹丌不中不井今余佳京乃命易女鬯一金車漆車畫車朱虢白未詳虎良借為韔裏旗余三所服孚敬夙夕勿法朕令牧拜𩒨首敢對揚王不顯休用乍朕文考益白寶簋牧𠀠萬年壽考子子孫孫永寶用見鐘鼎款識敔簋銘隹王十月王才成周南淮乃遷及內伐浪昴參泉䘱敏陽洛王令敔追御于上洛未詳舊釋谷至于伊班馬𢦏傷也即下禽馘百首百執嗘卌孚人三百于白之旗環即于張仲簠形相近于衣即誧復付乃君隹王十又一夕王各于成周大廟武公入右敔告禽馘百嗘卌王蔑敔𤯍事尹氏受敔圭鬲幣貝五十朋易田于五十田于早五十田敔敢對瑒天子休用乍簋敔𠀠年子子孫孫永寶用見鐘鼎款識伯虎簋銘隹六年亖月甲子王才白虎告曰余告慶曰公乃未詳貝用獄未詳為白九災即菑舊釋庸非九成𡗕我考幽白幽姜令余告慶余以邑未詳有𤔲余典勿敢對今余既有𤔲曰令今余既一名典白氏白氏則執壁雕主對揚朕宗君其休用乍朕刺且未詳公𡧰簋其萬年子孫寶用享于宗見拓本卯簋銘隹王十又一月既生霸丁亥季入右卯立中廷白乎令卯曰飼借為嗣乃先且考𤔲借為尸尸𤔲主治也公家昔乃且亦既令乃父𤔲人不寽我家窒借為室用器或釋喪今余非敢夢借為蔑先公又隹適或釋遠余懋𡆧借為寵或釋思先公官今余隹令女𤔲宮人女母敢不善易女未詳亖此字旁增章或釋龍宗一宗彝一未詳或釋將寶易女馬十匹牛十易于𠂈未詳或釋乍一田易于一田易于一田易于未詳或釋即𦀂一田卯拜手𩒨手敢對白休用乍寶簋卯其萬年子子孫孫永寶用見拓本師酉簋銘隹王元季正月王才吳各吳大廟公族䲨釐入右師酉立中廷王乎史未詳門冊命師酉𤔲乃且啻官邑及虎臣西門卪能卪奉秉卪京卪未詳卪新易女赤市朱黃中𣊡攸勒敬夜勿法朕令師酉拜𩒨首對天子不顯休令用乍朕忞考乙白簋酉其萬年子子孫孫永寶用見拓本從王伐辦借為梁孚借為俘用乍𩝃簋見拓本伯父簋銘白父乍周姜寶簋用夙夕享用壽見拓本陳侯簋銘陳侯乍嘉寶簋其邁年子子孫孫永寶用見拓本伯豦簋銘白豦虘𧦄乍皇考刺公簋用享用孝萬年壽畯才立子子孫孫永寶見拓本鄧公子簋銘公子白余曰薦新乍我姑孟㛱賸簋永壽用止見拓本室叔簋銘唯王五月辰才丙戍叔乍豐𡜩旅簋豐𡜩用享孝于公于叔未詳疑𪈘友𢆶簋未詳疑既皂亦壽人子孫其永寶用見拓本曼龏父乍寶案篆是盨字說文有之舊釋簋疑得借為簋用享孝宗室用壽子子孫孫永寶用見拓本遲盨銘乍姜浬盨用享孝于公用壽純魯子子孫永寶用見拓本單子伯盨銘單子白乍叔姜旅盨其子子孫孫萬年永寶用見拓本立盨銘立為旅須子子孫孫永寶用見拓本鬲叔興父乍旅頁頁即首借為盨此蓋銘其器銘作須與上立盨銘同其子子孫孫永寶用見拓本史燕盨銘史燕乍旅永寶用見拓本甲午盨銘隹甲午八月丙寅帝盥清廟乍禮盨吉蠲明神神鑒殸借為馨德畏借為威帝邁年永受命見拓本案此與下一銘皆稱帝當是戰國時齊湣王或秦昭王所作以干支紀歲又神字重文不作作亦為變例天錫盨銘帝受元命天易帝用于神祇網弗各隹邁𠦃無見拓本𠬢或釋鄂史賓三字非古有喪姓廣韻引楚大夫喪左自乍鈚用征用行用壽萬年無彊子子孫永寶是尚見拓本伯克尊銘隹十又六年十月既生雨乙未白太師易白克僕卅夫白克敢對㻛天右王白友用乍朕穆考後中享克用壽無僵克其子孫孫永寶用享見鐘鼎款識嘉禮尊銘帝爯嘉禮乍壼用薦神保是享佳休于永世見拓本案此戰國時齊秦稱帝所作周㗬壼銘周乍日乙壼𠀠用享于宗𠀠子孫邁年永寶用見拓本昧盉銘隹五月初吉王才周令乍冊內史易冗西百未詳或釋冗𥣫靜女王休用乍盉𠀠萬年寶用見拓本王子申箋𩰱銘王子申乍喜嬭蓋𠀠壽無永保用之見拓本弡中乍寶即臩尚書作求其同聲是盎字舊釋簠非之金其其玄其黃用成朮稷籾用饗大正歆王賓召飼弡中受無彊者友餐飼鼎飽弡中壽見鐘鼎款識又復齊鐘鼎款識國差𥣫銘國差立事歲咸丁亥攻市借為工師𥃘西寶𥣫四秉用實旨酉侯氏受福壽卑旨卑㴵侯氏母母齊邦靜安寧子子孫孫永用之見拓本劍銘吳季子之子逞之永用鐱見拓本吁或從口𢖳聲舊釋愕非乍距末用商案距末弩機之類戰國策蘇秦說韓王曰溪子少府時力距來皆射六百步之外荀子性惡篇曰繁弱巨黍古之良弓也潘嶽間居賦曰溪子巨黍異絭同機距來巨黍巨黍即距末也見拓本晉夷則鏡銘惟晉新公二年七月七日午時于首陽山前白龍潭鑄成此鏡千年萬一作後一作在世見博異記天寶中金陵陳仲躬住洛陽清化里宅有井善溺人一日水頓竭見一女子自敬元穎飾鉛粉衣緋緑令其淘井得古銅鏡夜復見元穎云某本師曠所鑄十二鏡之第七者其背有二十八字皆科斗書于鼻題曰夷則之鏡按唐人小說自不足據其銘與周時辭例不合且于鼻題曰夷則之鏡語尤可疑唐鏡始為大鼻前此未有也今姑録之
