body:
  text: 闕名時警收而場功㣥符而畚梮營室之中土功其始火之初見期于司里見周語中四方戒各修平乃守考乃職事無敢不敬戒國有大刑見周書職方解王巡狩則戒于四方穀城石人腹銘摩兜鞬摩兜鞬慎莫言見藝文類聚六十三引盛弘之荊州記曰樊城西北有鄾城西百餘里有穀城穀伯綏之國城門有石人焉刊其腹云云疑此亦周太廟金人緘口銘背之流也東都門外石銘佳城郁郁三千年見白日吁嗟滕公居此室見博物志八七又史記夏侯嬰傳索隱案漢初上推三千年此銘在上古時石棺銘帝令處父不與殷亂賜爾石棺以華氏見史記秦本紀又水經汾水注末句作賜汝石棺以葬沙丘石椁銘不馮其子靈公奪而里之見莊子則陽篇又博物志七作不逢箕子靈公奪我里閹里石椁銘四體不勤孰為作生不遭遇長附託賴得二人發吾宅見御覽五百九十引博物志魯閹里蔡伯公死求葬庭中有二人行頃還葬二人復出掘土得石椁有銘云云閭里祠之瑟琶圻古冢甓文筮吉龜凶八百年落江中見水經漸江水注江有琵琶圻圻有古冢墮水甓有隱起字云云謝靈運取甓詣京咸傳觀焉案晉宋之際上推八百年此冢當春秋之末孔子壙壁刊文秦始皇何僵梁開吾戶據吾床飲吾酒唾吾漿餐吾飰以為糧張吾弓射東牆前至沙丘當滅亡見異苑秦世有謠曰云云始皇既坑儒焚典乃發孔子墓壙既啓謠文刊在冢壁案孔子遺讖及春秋演孔圖與此略同別載于後陽翁伯碑文居于縣北六十里翁同之山後潞徙木西山之下陽公又遷居焉而受玉田之賜情不好寶王田自去今猶謂之玉田陽見水經鮑丘水注引陽氏譜敘言翁伯是周景王之孫食采陽樊春秋之末爰宅無終因陽樊而易氏焉愛人博施天祚玉田其碑文云小平津北岸古冢銘今卜高原千秋之後化為下泉當逢霸主必為改遷見御覽七百二十六引三國典路東魏相齊王澄以舟師還次于小平津北岸古冢崩骨見銘曰案從東魏末上推千年當戰國初比干墓銅盤銘右林左泉後岡前道萬世之寧于焉是保見嘯堂集古録案銘詞及篆文非周初物蓋秦漢間作姑編入三代士冠始加緇布冠服玄爵鞞令月吉日始加元服棄爾幼志順爾成德壽考惟祺介爾景福皮辨服素積素鞞吉月令辰乃申爾服敬爾威儀淑慎爾德眉壽萬年永受胡福爵辨服纁裳韎韐以歲之正以月之令咸加爾服兄弟具在以成厥德黃耇無疆受天之慶三加畢賓醴冠者甘醴惟厚嘉薦令芳拜受祭之以定爾祥承天之休壽考不忘若不醴則醮注醴注簡尚質也醮禮繁尚文也醮亦賓醴冠者冠有三加故三醮也始醮旨酒既清嘉薦亶時始加元服兄弟具來孝友時格永乃保之再醮旨酒既湑嘉薦伊脯乃申爾服禮儀有序祭此嘉爵承天之祜三醮旨酒令芳籩豆有楚咸加爾服肴升折俎承天之慶受福無疆既醴冠者見母出賓字之禮儀既備令月吉日昭告爾字爰字孔嘉髦士攸宜宜之于假永受保之曰作某父已上八首并見儀禮士冠禮父命子往迎爾相承我宗事勗率以敬先妣之嗣若則有常父命女戒之敬之夙夜無違命母命女勉之敬之夙夜無違宮事庶母命女敬恭聽宗爾父母之言夙夜無愆視諸袗鞶已上四首并見儀禮士昏禮少牢饋食祝嘏辭皇尸命工祝承致多福無疆于女孝孫來女孝孫使女受祿于天宜稼于田尾壽萬年勿替引之見儀禮少牢饋食禮主人酳尸尸酢主入佐食居黍授尸執以命祝祝受以東北面嘏主人救日食告天天子臣某謹承皇戒退避正居思行愆誤陽精有弊己政類棄正事去非釋苛禁不敢直命遣臣欽喻已絶國害之譴近以緒盡力宣文思維表道願得修政以奉宗祖追往翼今勉開嘉紀縱太陽精以興日寶見開元占經十引春秋感精符蠟祝土反其宅水歸其壑昆蟲無作豐年若上歲取千百見蔡雍獨斷案禮記郊特牲有伊耆氏蠟辭末句作草木歸其澤魯郊祝以斯鶾音赤羽去魯侯之咎見説文鳥部鶾引魯郊以丹雞祝祭侯辭惟若寧侯毋或若女不寧侯不屬于王所故抗而射女強飲強食詒女曾孫諸侯百福見考工記梓人嗟爾不寧侯為爾不朝于王所故亢而射女強食食爾曾孫侯氏百福見大戴禮投壼立社祝今某月日君為某立社社祭土而主陰氣也五穀用成萬民以生敢用肥豚嘉蔬清酒敬致大神自今日以來祈請雨止惟靈是聽子孫眉壽萬神含靈見御覽七百三十六引禮外篇立社祝請雨祝昊天生五穀以養人今五穀病旱恐不成敬進清酒膊脯再拜請雨雨幸大澍見古微書引春秋漢含孳請雨祝皇皇上天照臨下土集地之靈神降甘雨庶物群生咸得其所見博物志史補止雨祝天生五穀以養生民今天雨不止傷五穀如何神靈而行而止殺牲以賽神靈雨則不止鳴鼓攻之朱緣繩索而脅之見御覽七百三十六引禮外篇天生五穀以養人民今天雨不止用傷五穀如何如何靈而不幸殺牲以賽神靈雨則不止鳴鼓攻之朱緑繩縈而脅之見博物志史補又見御覽七百三十六禳田祝甌窶滿篝污邪滿車五穀蕃熟穰穰滿家見史記淳于髡傳下田汙邪得穀百車蟹堁者宜禾見説苑復恩蟹堁者宜禾汙邪者百車傳之後世洋洋有餘見説苑尊賢蟹螺者宜禾汙邪者滿車五穀蕃熟穰穰滿家見荀子注高得萬束下得千斛見藝文類聚九十六引説苑淳于髡對楚王曰臣來見道傍野民持一頭魚上田稅禁鼠祝付敕屋吏制斷鼠蟲三時言功鼠不敢行見齊民要術五引龍魚河圖冬以臘月鼠斷尾正月旦日未出時家長斬鼠著屋中祝龜祝今日吉謹以梁卵焍黃袚去玉靈之不祥玉靈必信以誠知萬事之情辨兆皆可占不信不誠則燒玉靈揚其灰以征後龜假之玉靈夫子夫子玉靈荊灼而心令而先知而上行于天下行于淵諸靈數莫如汝信今日良日行一作身一良貞假之靈龜五筮五靈不如神龜之靈知人死知人生某身良貞見褚先生補史記龜策列傳口誡勿謂何有積怨致咎勿曰不傳伏流成川蟻孔潰河溜穴傾山見藝文類聚十七案傅子擬金人銘作口銘有末二語疑此口誡即口銘未敢定之詛楚文又秦嗣王敢用吉玉宣璧使其宗祝邵鼛布愍告于不顯大神巫咸及大沉久湫以砥楚王熊相之多罪昔我先君穆公及楚成王是繆力同心兩邦有一絆以婚姻袗以齊盟曰枼萬子孫毋相為不利親卬不顯大神巫咸大沈久湫而質焉今楚王熊相康回無道淫失甚亂宣奓竟變輸盟制內之則虐不辜刑戮孕婦幽刺親戚拘圉其叔父置者冥室櫝棺之中外之則冒改久心不畏皇天上帝及不顯大神巫咸大沈久湫之光列威神而兼倍十八世之詛盟衛者侯之兵以臨加我却剗伐我社稷伐滅我百姓求蔑法皇天上帝及不顯大神巫咸大沉久湫之恤祠之以圭玉犧牲逑取吾邊城新𨜔及𣃶長吾不敢曰可今又悉興其衆張意怒飾甲底兵奮士盛師以逼吾邊競借竟將欲復其迹唯是秦邦之羸衆敝賦𩋻䩱棧輿禮使介老將之以自救殹亦應受皇天上帝及不顯大神巫咸大沉久湫之幾靈德賜克劑楚師且復略我邊城敢數楚王熊相之倍盟犯詛箸石章以盟大神之威神見絳帖又古文苑有釋文小異學記疏作瑞書敬勝怠者吉怠勝敬者滅義勝欲者從欲勝義者凶凡事不強則枉不敬則不正枉者廢滅敬者萬世以仁得之以仁守之其量百世以不仁得之以仁守之其量十世以不仁得之不仁守之不及其世見史記周本紀正義引書帝命驗云季秋之月甲子赤爵銜丹書入于酆止于昌戶其書云云又見大戴禮武王踐祚篇以敬者萬世已上為顓頊丹書以仁得之已下為師尚父述所聞紀國金壼丹書食魚無反勿乘駑馬見晏子春秋內篇雜上景公遊于紀得金壼中有丹書已下圖讖帝當樞百則禪虞見御覽八十一引論語撰考讖赤龍負玉苞舒圖出堯與大舜等共發玉牒文祝融司方發其英沐日浴月百寶生見續漢郡國志注補引湘中記衡山有玉牒禹案其文以治水遙望衡山如陳云玄圭刻文延喜之玉受德天賜之佩見初學記九引尚書璇璣鈐曰禹授啓握玄圭出刻黑玉赤勒玄精天乙受神福命之豫伐桀命克豫商滅夏天下服見詩商頌譜疏引尚書中候雒豫命云天乙在亳東觀于洛黃魚雙躍出濟于壇黑鳥以雒隋魚亦上化為黑玉赤勒曰又見藝文類聚十二御覽八十三赤爵銜書姬昌蒼帝子亡殷者紂王見宋書符瑞志赤爵銜書及豐置于昌戶昌拜稽首受之赤烏銜圭天命周文王伐殷有國泰顛來賓河出緑圖帝出乘黃見墨子非攻下赤烏銜圭降周之岐社鳳皇銜書殷帝無道虐亂天下皇命已移不得復久靈祇遠離百神吹去五星聚房昭理四海見宋書符瑞志鳳皇銜書遊文王之都玉璜刻文姬受命呂佐旌德合昌來提撰爾雒鈐報在齊見文選任昉勸進箋注引尚書中侯呂尚立變名答曰望鈞得玉璜刻曰云云又見宋書符瑞志麟吐玉書水精之子孫衰周而素王見拾遺記三夫子未生時有麟吐玉書于闕里人家魯端門血書趣作法孔聖沒周姬亡慧東出秦政起胡破術書紀散孔不絶見公羊哀十四年解詁藝文類聚九十八引春秋演孔圖得麟之後天下血書魯端門黃玉刻文寶文出劉季握卯金刀在軫北字禾子天下服見搜神記八宋書符瑞志初學記二御覽十四又八百五事類賦九赤虹自上而下化為黃玉長三尺有刻文孔子跪受而讀之孔提命作應法為赤制雀集見藝文類聚九十又九十九御覽九百二十二并春秋演孔圖赤爵集書上化為黃玉刻曰麟吐圖姬周亡赤氣起火曜興玄兵制命帝卯金見搜神記八宋書符瑞志五行大義五玉版璇璣一低一昂是七期見御覽六百六引春秋演孔圖天授演孔圖中有大玉刻一版素書後世修吾書董仲舒護吾車拭吾履發吾笥會稽鍾離意璧有七張伯藏其一見後漢鍾離意傳注引意別傳孔子床首有懸甕發之中有素書又水經泗水注續漢郡國志二注遣讖亡秦者胡也見易緯通卦驗孔子表洛書摘亡辟又論衡實知孔子將死遺讖書不知何一男子自謂秦始皇上我之堂踞我之床顛倒我衣裳至沙丘而亡見論衡實知孔子將死遺讖書又古微書引春秋演孔圖云驅除名政顛倒吾衣裳坐吾曲床濫長九州滅六王至于沙丘亡嘉林龜左脅書文甲子重光得我者匹夫為人君有土正諸侯得我為帝王見史記龜策傳萬畢石朱方傳
