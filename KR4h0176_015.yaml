body:
  text: 全上古三代文卷十五謹案杜子春注周禮云歸藏黃帝也御覽六百九引帝王世紀云殷人因黃帝曰歸藏禮運我得坤乾焉鄭云其書存者有歸藏疏引熊安生云殷易以坤為首故先坤后乾隋志舊新唐志歸藏十三卷隋志又云歸藏漢初已亡晉中經有之唯載卜筮不似聖人之旨以本卦尚存故取貫于周易之首以備殷易之缺案御覽六百八引桓談新論云歸藏四千三百言是西漢末已有此書漢志本七略偶失載耳文獻通考引崇文總目云今但存初經齊母本蓍三篇玉海引中興書目同文淵閣書目不著録蓋三篇又亡于元明之際今搜輯群書所載得八百四十六字視桓談所見本略存十二焉昔黃神與炎神爭鬥涿鹿之野將戰筮于巫咸曰果哉而有咎見御覽七十九路史前紀三後紀四歸藏昔者豐隆筮將雲氣而吉核之也見北堂書鈔一百五十案舊寫本每條刪下半段以之也字代之通部如此穆天子傳二注云豐隆筮御雲得大壯卦遂為云師疑歸藏之文陳禹謨本作雖有豐隆莖得雲氣而結核蓋臆改也不足據昔者河伯筮與洛戰而枚占昆吾占之不吉見初學記二十昔常娥以西王母不死之藥服之遂奔為月精見北堂書鈔一百五十文選月賦注宣貴妃誄注祭顏光祿文注御覽九百八十四羿請不死之藥于西王母姮娥竊之以奔月將往枚筮之于有黃有黃占之曰吉翩翩歸妹獨將西行逢天晦芒毋驚恐後且大昌見續漢天文志上注引張衡靈憲當是歸藏之文鯀筮之于歸藏得其大明曰不吉有初亡後見路史後紀十三昔者夏后啓筮享神于晉之墟作為璇臺于水之陽見藝文類聚六十二文選王元長曲水詩序注初學記二十四御覽一百七十七昔夏后啓筮享神于大陵而上鈞臺枚占皋陶曰不吉見北堂書鈔八十二初學記二十四御覽八十二啓筮徙九鼎啓果徙之見路史後紀十四十三昔者桀筮伐唐而枚占于熒惑曰不吉不利出征惟利安處彼為狸我為鼠勿用作事恐傷其父見御覽八十二又九百十二路史後紀十三武王伐商枚占耆老曰不吉見路史後紀五昔穆王天子筮出于西征不吉曰龍降于天而道里修遠飛而沖天蒼蒼其羽見御覽八十五穆王獵干戈之野見御覽八百三十一昔穆王子筮卦于禺彊見莊子大宗師釋文路史後紀五節卦殷王其國常母谷見周禮太卜疏路史發揮剝良人得其玉小人得其粟見御覽八百四十鼎有黃耳利得鱣鯉見藝文類聚九十九有鳧鴛鴦有雁鷫鷞見藝文類聚九十二御覽九百二十五乾者積石風穴之琴亭之者弗亭終身不瘳見北堂書鈔一百五十八君子戒車小人戒徒見文選顏延年秋胡詩注上有高臺下有雍池以此事君其貴若化若以賈市其富如河見御覽四百七十二有人將來遺我貨貝以正則徹以求則得有喜則至見藝文類聚八十四御覽八百七有人將來遺我錢財日夜望之見御覽八百三十五東君雲中見史記封禪書索隱云見歸藏易乾為天為君為父為大赤為辟為卿為馬為禾為血卦見路史發揮案此蓋說卦文殷易先有非始十翼已上二十五事引見不著篇名其云黃神至夏后啓占驗當在啓筮篇而并及武王穆王者蓋太卜增加北堂書鈔一百一引桓談新論歸藏藏于太卜故殷易有周事凡繇辭外皆傳說耳歸藏啓筮太昊之盛有白雲出自蒼梧入于大梁見藝文類聚一文選謝朓新亭渚別范零陵詩注初學記一白帖二御覽八又八百七十二昔女媧筮張雲幕而枚占神明占之曰吉昭昭九州日月代極平均土地和合萬國見北堂書鈔一百三十二初學記二十五御覽七十八共工人面蛇身朱髮見山海經大荒西經注藝文類聚十七御覽三百七十三路史後紀二蚩尤出自羊水八肱八趾疏首登九淖以伐空桑黃帝殺之于青丘見初學記九路史後紀四案路史又云蚩尤疏言虎腃八肱八趾見歸藏啓筮空桑之蒼蒼八極之既張乃有夫羲和是主日月職出入以為晦明見山海經大荒南經注瞻彼上天一明一晦乃有夫羲和之子出于陽谷見山海經大荒南經注帝堯降二女為舜妃見周禮太卜疏引歸藏坤開筮坤是其卦名滔滔洪水無所止極伯鯀乃以息石息壤以填洪水見山海經海內經注又見史記甘茂傳索隱北堂書鈔一百六十作以堙洪水鯀死三歲不腐剖之以吳刀化為黃龍見山海經海內經注鯀殛死三歲不腐副之以吳刀是用出禹見初學記二十二路史後紀十二麗山之子鼓青羽人面馬身見山海經西山經注路史後紀四案西山經又云鍾山其子曰鼓其狀如人面而龍身注云其類皆見歸藏啓筮金水之子其名曰羽蒙乃民是生百鳥見文選鸚鵡賦注御覽九百十四羽民之狀鳥喙赤目而白首見山海經海外南經注昔彼九冥是與帝辨同宮之序是為九歌見山海經大荒西經注不可竊辨與九歌以國于下見山海經大荒西經注歸藏鄭母經昔者羿善射彃十日果畢之見尚書引五子之歌疏左傳襄四年疏論語憲問疏孟子梁惠王疏山海經海外東經注案洪興祖補注天問引歸藏易云羿畢卜日即此約文夏后啓筮御飛龍登于天吉明啓亦仙也見山海經海外西經注案穆天子傳五注云嵩高山啓母在此山化為石而子啓亦登仙皆見歸藏明夷曰昔夏后啓上乘龍飛以登于天皋陶占之曰吉見御覽九百二十九案路史後紀十四引歸藏鄭母經明夷曰夏后啓筮御龍飛升于天與上文連一條歸藏初經初坤初乾初離初坎初兌初艮初釐初巽見路史後紀五又發揮案玉海三十五引作初乾初奭初艮初兌初犖初離初釐初巽卦皆六畫奭即坤犖即坎釐即震世有歸藏鏡亦作奭作犖作釐歸藏齊母經瞿有瞿有䱄宵梁為酒尊于雨壼兩羭飲之二日然後穌士有澤我取其魚見爾雅釋畜注釋畜疏云歸藏齊母經之文也瞿有卦名歸藏本蓍篇蓍末大于本為上吉蒿末大于本次吉荊末大于本次吉箭末大于本次吉竹末大于本次吉蓍一五神蒿二四神荊三三神箭四二神竹五一神筮五犯皆臧五筮之神明皆聚焉見御覽七百二十七引歸藏不著篇名崇文總目云今唯存初經齊母本蓍三篇知此為本蓍篇文左傳襄九年穆姜夢于東宮初往而筮之遇艮之八注連山歸藏皆以七八為占故言遇艮之八疏七為少陽八為少陰九為老陽六為老陰老變而少不變周易以變為占二易以不變為占此筮遇艮之八謂艮之第二爻不變者是八也謹案周禮太卜掌三易之法一曰連山二曰歸藏三曰周易其經卦皆八其別皆六十有四秦焚書唯易以卜筮存易蓋統三易言之漢專用周易而夏殷易若存若亡通儒不盡見之後竟佚失可惜也余編上古三代文既輯歸藏一篇如右而左氏所載或用周易傳必明明標出其不標出者實兼三易然亦有筮者臨時推測別撰韻語為象辭復以韻語下斷者今輯一篇題曰筮辭附歸藏後焉同復于父敬如君所見左傳閔二年成季之將生也筮之遇大有之乾云云注筮者之辭也筮辭涉河侯車敗見左傳僖十五年秦伯伐晉卜徒父筮之吉云云千乘三去三去之餘獲其雄狐同上詰之對曰乃大吉也三敗必獲晉君其卦遇蠱云云注蓋卜筮者雜辭以狐蠱為君其義欲以喻晉惠公其象未聞土刲羊亦無𥁃也女承筐亦無貺也西鄰責言不可償也歸妹之睽猶無相也震之離亦離之震為雷為火為嬴敗姬車說其輹火焚其旗不利行師敗于宗丘歸妹睽孤張之弧寇姪其從姑六年其逋逃歸其國而棄其家明年其死于高梁之虛見左傳僖十五年初晉獻公筮嫁伯姬于秦遇歸妹之睽史蘇占之曰不吉其繇曰云云注凡筮者用周易則其象可推非此而往則臨時占者或取于象或取于氣或取于時日王相以成其占南國䠞射其元王中厥目見左傳成十六年晉楚遇于鄢陵公筮之史曰吉其卦遇復云云注此卜者辭也謹案周禮太卜掌三兆之法一曰玉兆二曰瓦兆三曰原兆其經兆之體皆百有二十其頌皆千有二百蓋三兆頌合三千六百群書所載卜之遇兆曰其繇曰占曰者皆卜頌也卜以五行以兆左傳哀九年趙鞅卜救鄭遇水適火注水火之兆疏引服虔云兆南行適火卜法橫者為土立者為木邪向經者為金背經者為火囚光而細曲者為水自漢以來筮專行而卜微今輯卜頌一篇附三易之後焉鼎成三足而方不炊而自烹不舉而自臧不遷而自行以祭于昆吾之虛上鄉見墨子耕柱昔者夏后開使蜚廉采金于山川而陶鑄之于昆吾是使翁難乙卜于以若之龜龜曰卜頌逢逢白雲一南一北一西一東九鼎既成遷于三國見墨子耕柱乙又言兆之由曰享矣云云由同繇非龍非彲非虎非罷兆得公侯天遺汝師以之佐昌施及三王見六韜文王將田史編布卜曰田于渭陽將大得焉云云文王曰兆致是乎史編曰編之太祖史疇為禹占得皋陶兆比于此案史記齊世家載此小異蜉蝣之羽飛集于戶鴻之戾止弟弗克理重靈降誅尚復其所見文選思玄賦注引古文周書周穆王姜后晝寢而孕越姬嬖竊而育之斃以玄鳥二七塗以彘血置諸姜后遽以告王王恐發書而占之曰蟲飛集戶是曰失所惟彼小人弗克以育君子同上問左史氏史灼曰案灼本又作豹闕親將留其身歸于母氏而後獲寧冊而藏之厥休將振同上史良曰是謂云云鳳皇于飛和鳴鏘鏘有媯之後將育于姜五世其昌并于正卿八世之後莫之與京見左傳莊二十二年初懿氏卜妻敬仲其妻占之曰吉云云其名曰友在公之右間于雨社為公室輔見左傳閔二年成季之將生也桓公使卜楚丘之父卜之曰男也又見昭三十二年挾以銜骨齒牙為猾戎夏交狡見晉語一獻公卜伐驪戎史蘇卜之曰勝而不吉遇兆云云公不聽遂伐驪戎克之得驪姬以歸專之渝攘公之羭一薰一蕕十年尚猶有臭見左傳僖四年初晉獻公欲以驪姬為夫人卜之不吉筮之吉公曰從筮卜人曰筮短龜長不知從長且其繇曰云云必不可弗聽兆如山陵有夫出征而喪其雄見左傳襄十年鄭皇耳帥師侵衛孫文子卜追之獻兆于定姜姜氏問繇曰云云君子得黿小人遺冠見御覽六百八十四八百三十二九百三十二引古文瑣語范獻子卜臘其繇曰云云獻子臘無所得遺其豹冠沉陽可以興兵利以伐姜不利子商見左傳哀九年趙鞅卜救鄭遇水適火史龜曰是謂云云如魚窺尾銜流而方羊裔焉大國滅之將亡闔門塞竇乃自後踰見左傳哀十七年衛侯萬渾良夫叫天無辜衛侯貞卜其繇曰大橫庚庚余為天王夏啓以光見史記文帝紀陳平等遣人迎代王代王卜之兆得大橫占曰夏書昏墨賊殺見左傳昭十四年叔向引夏書云云皋陶之刑也注逸書夏訓有窮后羿見左傳襄四年引夏訓有之注夏訓夏書昔有夏之方衰也后羿自鉏遷于窮石因夏民以代夏政恃其射也不修民事而淫于原獸棄武羅伯因熊髡尨圉而用寒浞寒浞伯明氏之讒子弟也伯明后寒棄之夷羿收之信而使之以為己相浞行媚于內而施賂于外愚弄其民而虞羿于田樹之詐慝以取其國家外內咸服羿猶不悛將歸自田家衆殺而亨之以食其子其子不忍食諸死于窮門靡奔有鬲氏浞因羿室生澆及豷恃其讒慝詐僞而不德于民使澆用師滅斟灌及斟尋氏處澆于過處豷于戈靡自有鬲氏收二國之燼以滅浞而立少康少康滅澆于過后杼滅豷于戈有窮由是遂亡同上訓語夏之衰也褒人之神化為二龍以同于王庭而言曰余褒之二君也夏后卜殺之與去之與止之莫吉卜請其漦而藏之吉乃布幣焉而策告之龍亡而漦在櫝而藏之傳郊之及殷周莫之發也見鄭語史伯引訓語有之注訓語周書秩官敵國賓室關尹以告行理以節逆之候人為導卿出郊勞門尹除門宗祝執祀司里授館司徒具徒司空視塗司寇詰奸虞人入材甸人積薪火師監燎水師監濯膳宰致饔廩人獻餼司馬陳芻工人展車百官以物至賓人如歸是故大小莫不懷愛其貴國之賓至則以班加一等益虔至于王吏則皆官正蒞事上卿監之若王巡守則君親監之見周語中單襄公引周之秩官注秩官周常官篇名西方之書懷與安實疚大事見晉語四注西方謂周大度之書舉兵之日而境內不貧戰而必勝勝而不死得地而國不敗為此四者若何舉兵之日而境內不貧者計數得也戰而必勝者法度審也勝而不死者教器備利而敵不敢校也得地而國不敗者因其民也見管子兵法鄭書安定國家必大焉先見左傳襄三十年子産引鄭書有之注鄭國史書惡直醜正實蕃有徒見左傳昭二十八年晉司馬叔游引鄭書有之注鄭書古書名也太府之憲子弒父臣弒君有常不赦國雖大赦降臣亡子不得與焉見戰國策魏四安陵君言先君手受太府之憲憲之上篇曰注以城降人及亡人之子禮志將有請于人必先有入焉欲人之愛己也必先愛人欲人之從己也必先從人無德于人而求用于人罪也見晉語四前志敵惠敵怨不在后嗣見左傳文六年志言以足志文以足言見左傳襄二十五年高山峻原不生草木松柏之地其土不肥見晉語九軍志允當則歸見左傳僖二十八年注軍志兵書知難而退同上又見宣十二年隨武子曰見可而進知難而退軍之善政也有德不可敵同上先人有奪人之心見左傳宣十二年周志勇則害上不登于明堂見左傳文二年引周志有之注周志周書也案見周書大匡解文王夢天帝服玄穰以立于令狐之津帝曰昌賜汝望文王再拜稽首太公于後亦再拜稽首文王夢之夜太公夢之亦然其後文王見太公而訆之曰而名為望乎答曰唯為望文王曰吾如有所見于汝太公言其年月與其日且盡道其言臣此以得見也文王曰有之有之遂與之歸以為卿士見晉太康十年汲縣齊太公廟碑引周志謹案晉書束晢傳初太康二年汲郡人不准盜發魏襄王墓或言安釐王冢得竹書數十年其瑣語十一篇諸國卜夢妖妖怪相書也隋志古文瑣語四卷汲冢書舊新唐志同宋以後不著録今輯群書引見省并復重得二十五事匯為一篇至穆天下傳竹書紀年俱汲冢古文見存不録舜囚堯于平陽取之帝位今見有囚堯城見史通疑古篇廣宏明集十一案初學記八引竹書云舜囚堯偃蹇丹朱蓋此城也汲冢瑣語仲壬崩伊尹放太甲乃自立四年見御覽八十三周宣王夜臥而晏起后夫人不出于房姜后既出乃脫簪珥待罪于永巷使其傅母通言于宣王曰妾之淫心見矣至使君王失禮而晏起以見君王之樂色而忘德也亂之興從婢子起敢請罪王曰寡人不德實自生過非夫人之罪也遂復姜后而勤于政事早朝晏退卒成中興之名見藝文類聚十五宣王之元妃獻后生子不恆期月而生后弗敢舉天子召問群王之元史史皆答曰若男子也身體有不全諸骨節有不備者則可身體全骨節備不利于天子也將必喪邦天子曰若而不利余一人命棄之仲山甫曰天子年長矣而未有子或天將以是棄周雖棄之何益且卜筮言何必從天子乃弗棄之見御覽八十五又一百三十五幽王娶褒姒楚矢箕服是喪王國見北堂書鈔二十六又四十二周王欲殺王子宜咎立伯服釋虎將執之宜咎叱之虎弭耳而服見御覽八百九十一事類賦注二十晉冶氏女徒病棄之舞囂之馬僮飲馬而見之病徒曰吾良夢馬僮曰汝奚夢乎曰吾夢乘水如河汾三馬當以告舞僮舞囂自往視之曰尚可活吾買汝答曰棄之矣猶未死乎舞囂曰未遂買之至舞囂氏而疾有間而生荀林父見御覽六百四十二晉平公夢見赤熊窺屏惡之而有疾使問之産案左傳昭七年疏引以上同子産曰昔共工之卿曰浮游既敗于顓頊自沒沉淮之淵案路史後紀引作自沉于淵其色赤其言善笑其行善顧其狀如熊常為天王崇見之堂則王天下者死見之堂下則邦人駭見之門則近臣憂見之庭則無傷今窺君之屏病而無傷祭顓頊共工則瘳公如其言而病間見御覽九百八路史後紀二案史通云尋汲冢瑣語即乘之流耶其晉春秋篇云平公疾朱熊窺屏左氏亦載斯事而云夢黃熊入門晉平公與齊景公乘至于澮上見人乘白驂八駟以來平公之前公問師曠曰有犬狸身而狐尾者乎案水經注引作有犬狸身而孤尾隨平公之車公問師曠太平廣記引作去其車而隨公之車師曠有頃而答曰有之首陽神其名曰者來首陽之神飲酒霍太山而歸其居而于澮乎見之案水經注引對曰首陽之神有犬狸身孤尾其逢君者飲酒得福則徼之太平廣記引作狸身而孤尾其名曰首陽之神飲酒于霍太山而歸其君甚善君有喜焉見水經澮水注御覽四十太平廣記二百九十一師曠御晉平公案御覽三百六十九引作晉師曠晝侍平公鼓瑟輟而笑曰齊君與其嬖人戲墜于床而傷其臂平公命人書之曰某月某日案御覽三引作某年某月齊君戲而傷問之于齊侯齊侯笑曰然有之見藝文類聚十九御覽三百六十九又三百九十一案御覽三百六十九引作公晝記之使問齊侯果如其言有鳥飛從西方來白質五色皆備集平公之庭相見如讓公召叔嚮問之叔嚮曰吾聞師曠曰西方有白質鳥五色皆備其名曰翬南方赤質五色皆備其名曰搖其來為吾君臣其祥先至矣見御覽九百十七齊景公伐宋至曲陵夢見大君子甚長而大大下而小上其言甚怒好仰晏子曰若是則盤庚也夫盤庚之長九尺有餘大下小上白色而髯其言好仰而聲上公曰是也是怒君師不如違之遂不伐宋也見御覽三百七十七齊景公伐宋至曲陵夢見有短丈夫賓于前晏子曰君所夢何如哉公曰其賓者甚短大上而小下其言甚怒好俯晏子曰如是則伊尹也伊尹甚大而短大上小下赤色而髯其言好俯而下聲公曰是矣晏子曰是怒君師不如違之遂不果伐宋見御覽三百七十八范獻子卜獵命人占之曰其繇曰君子得黿小人遺冠范獻子獵而無得遺其豹冠見御覽六百八十四又八百三十二又九百三十二隕石于鑄三宋景公問于刑史子臣曰隕石于鑄三何也刑史子臣荷曰天下之望山三將崩見北堂書鈔一百六十初刑史子臣謂宋景公曰從今已往五祀案御覽引作五月五日臣死自臣死後五年五月丁亥案御覽作丁已吳亡已後五祀八月辛巳君薨刑史子臣至死日朝見景公夕而死後吳亡景公懼思刑史子臣之言將至死日乃逃于瓜圃案初學記二十四引瓜圃見瑣語遂死焉求得已蟲矣見藝文類聚八十七御覽九百七十八事類賦注二十七智伯既敗將出走夢火見于西方乃出奔秦又夢火見于南方遂奔楚也見御覽八百九十六八百六十九事類賦注八蒲且子見雙鳧過之其不被弋者亦下見文選勵志詩注齊東有二石高八尺博四尺而入于海見北堂書鈔一百六十汲冢瑣語記太丁時事以為夏殷春秋見史通六家篇瑣語又有晉春秋記獻公十七年事見史通六家篇瑣語春秋載魯國閔公時事言之最詳見史通惑經篇汲冢所得書尋亦亡逸今惟紀年瑣語師春在焉案紀年瑣語載春秋時事與左氏同見史通申左篇瓜圃見瑣語見初學記二十四汲冢瑣語乃載秦望碑見顏氏家訓書證篇謹案古文周書亦汲冢所得今僅文選注引有二條或以逸周書當之非也周穆王姜后晝寢而孕越姬嬖竊有育之斃以玄鳥二七塗以彘血置諸姜后遽以告王王恐發書而占之曰蜉蝣之羽飛集于戶鴻之戾止弟弗克理重靈降誅尚復其所問左史氏史豹曰蟲飛集戶是曰失所惟彼小人弗克以育君子史良曰是謂闕親將留其身歸于母氏而後獲寧冊而藏之厥休將振王與令尹冊而藏之于櫝居三月越姬死七日而復言其情曰先君怒豫甚曰爾夷隸也胡竊君之子不歸母氏將置而大戮及王子于治見文選思玄賦注引古文周書案梅鼎祚文紀引此作汲冢師春未詳所出古文周書穆王田有黑鳥若鳩翩飛而跱于衡御者斃之以策馬逸不克止之躓于乘傷帝左股見文選赭白馬賦注引古文周書桃左春秋人主之疾死者不能處半人主弗知則亂多資見韓非子備內
