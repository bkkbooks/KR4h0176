body:
  text: 迦葉佛遺釋迦牟尼佛書付伽梨衣我初成道時大梵天王施我彼絲是化出之非是繰繭梵天王施經絲堅牢地神王施緯絲由彼二施主共成一法衣由是義故今特施我我自成道以來常披此衣未曾損失今付悉達若得成佛取我僧伽梨安置祗洹中若轉毗尼時當為我著今留此衣汝涅槃後一百年初有無智比丘分毗尼藏遂為五部從百年後分汝修多羅當為無量部諍論由興令法速滅由彼愚僧不間三藏聞開著繒衣即謂殺繭汝若成道後彼絲自出諸國非是殺蠶故我將付樹神今轉付汝此函中并是我遺教亦將付汝住持遺法見法苑珠林致世尊父淨飯王書汝王太子悉達多證得無上法味法味于世出世間咸蒙濟度見佛說眾許摩訶帝經手書召世尊汝一切義成是我親子既厭煩惱棄國出家為求無上正等正覺已聞成道教化眾生思念之心日時相續令他人得樂惟我苦惱譬如大樹因地而生既有根苗終望果實汝心已遂宜憶往願昔者所言若不證無上菩提寂靜之道誓不再入迦毗羅城大行已成宜應愍我及眷屬等見佛說眾許摩訶帝經與世尊書是女端正甚好無比欲為佛娶之見金色女經波羅奈國王生一女身黃金色頭髮紺青時年十六父母欲為求婿女言若欲為我求婿者當令身黃金色頭發姏青如是可爾佛時在舍衛國有賈人到波羅奈國國王言我求婿賈人言我國中有人復勝是女王聞歡喜令賈人迎取佛賈人便作書與佛報波羅柰國金色女書人苦皆從恩愛生生當復老老當復病從病致死從死至憂哭天下苦者皆從恩愛生見金色女經女得書思惟即得五通達與父母辭訣飛到佛前佛微笑言迦葉佛時是金色女為貧家婦受佛經法壽終生世為國王女敕治師書昔育此子子入吾門疾疫相仍財耗當死太卜占云兒致此災書到極懾投之火中見六度集經又與邸閣書此兒到疾以石縛腰沉之深淵見六度集經菩薩生于貧家貧家不育夜置四衢有四姓富而無嗣取育數月婦妊產男父生凶念書敕冶師弟奪書之冶師所冶師承書投弟于火父又生毒念遣斯兒與邸閣書囊藏蜡封兒進半道有梵志女知占候裂書更之邸閣得書以女妻兒四姓聞之內塞而殞佛告比丘貧家兒吾身是妻者裘夷是四姓者調達是也下梨師跋陀國王敕令太子辛苦在于汝國云何默住不來表示書到其時象馬侍送事若有違吾當自往見賢愚因緣經上勒那跋彌王送太子表太子在此實所不知辛酸諸事伏想委曲太子今者已還得眼即娉鄙女為太子妻比嚴辦具臣自衛送見賢愚因綠經勒那跋彌王生太子名迦良那迦黎第二子名波婆伽梨太子往七寶城得天女所獻如意珠姏色名旃陀摩尼波婆伽梨乘太子眠取樹刺刺眼盜珠而去太子匍匐到梨師跋陀國值牧牛人為拔刺與梨師跋王守園王女願為其婦立誓一心尊奉無有他意太子亦誓于彼波婆伽梨無有微恨誓迄眼悉明凈勒那王知太子存勒令梨師跋王王即表送太子歸國佛告阿難彼太子者今我身是勒那跋彌我父凈飯王是爾時婦者今瞿夷是波婆伽梨者今婆達多是也與太子須大拏書汝是智慧之人去亦當忍來亦當忍云何恚不還須汝飲食耳見太子須大拏經太子恣意布施自致得佛佛告阿難我宿命所行布施如是太子須大拏者我身是見五願經作蓱比沙王與德差伊羅國弗迦沙王書我國中有金銀珍寶甚多我不用為寶今我國中生一人華字佛紫磨金色身有七十二相見弗迦沙王因緣經又報弗迦沙王佛教人棄家捐妻子斷愛欲當除鬚髮著法衣作沙門所以者何人愚癡故不當為者而為之便為癡從癡為行從為為識從識為名色從名色為六入何等為六入一者眼二者耳三者鼻四者口五者身六者心是為六入此六事皆外向眼向色耳向聲鼻向香口向味身向細耎心向欲是為六向從六向為合從合為痛樂從痛樂為愛從愛為受從受為有從有為生從生為老死憂悲苦不如意惱如是合大苦陰隨習凡合此勤苦合名人智者自去愚癡盡眾惡消除惡消除便行盡行盡識盡識盡名色盡名色盡六入盡六入盡合盡合盡痛樂盡痛樂盡愛盡愛盡受盡受盡有盡有盡生盡生盡老死盡老死盡己憂悲苦不如意惱如是合大苦陰隨習為盡便不復生不生即得泥洹道無為見佛迦沙王因緣經蓱沙王五願經又報弗迦沙王書卿以寶華見遺今以法事相上詳思其義果報深美到便誦習以同道味見法句譬諭經與瓶沙王書願具聞神佛所施行教戒當所奉行願具答意見弗迦沙王因緣經蓱沙王五願經與梵摩達哆王書長生童子彼作是語汝不畏後為子孫作患邪見中阿含經拘羅娑國王名長壽加赦國王名梵摩達哆常共戰爭拘娑羅國為加赦國所破長壽生長生童子猛毅聰明勸波羅奈諸豪貴族作書與梵摩達哆梵摩達哆歡喜令依彼住與長生出獵疲乏遂臥長生拔刀著頸欲行報怨夏舉刀還鞘以實白之梵摩達哆以女妻之還其本國佛告比丘汝等莫共鬥爭至竟不見止唯忍能止爭與兄佛大書大兄起居隨時安善二親在時以吾累兄兄不承之違廢親教以女色故骨肉相殘違親慈教為不孝也殘殺人命為不仁也殺一畜生其罪不小況殺應真吾不中止兄自招之今吾有形可得相殺善游寂寞徒復相害長別努力願從真道見佛說佛大僧大經又見經律異相載此書末作從此長別努力努力報某國王書惟別歷載不得言面每思舊好何日舍懷中間隔絕不及所致不見忽捐復遺賢臣美供綺璝以相謝矣克抱來意終始不忘願一同會及散久回今寄奇珍是身所有貴致微心言面乃敘見佛說生經佛說誨子經詐為王與太子法慧書爾有慢上之罪不忍面誅書到疾脫眼瞳子付使還國見六度集經昔菩薩為王太子名曰法慧朝王王之幸妾出援太子太子力爭獲免妾反譖于王王出太子為邊王妾懷怨謀除太子以蜡作印詐為王書太子曰愛身違親謂之大逆即出眼付使者王聞之收妾以棘笞之烊膠滴其瘡中熇即裂之為坑生埋佛告比丘太子宿命為童子賣白珠彼妾時為富姓女持珠不買淫視言調童子恚曰吾鑿目女曰棘笞膠滴裂肉生埋汝菩薩執志度無極行持戒如是按王子法益壞目因緣經事同更四姓與邸閣書吾年西垂重疾日困彼梵志吾之親友也厥女既賢且明今可任為兒匹極其寶帛娉禮預好小禮大娉納妻之日按此敕矣見六度集經以上從釋藏眾經錄出敕令書表十九首迦葉佛前乎佛者也勝軍王佛父行飯沙王佛之父舍衛國賈人等與佛并世四姓等果報因緣皆前乎佛者其餘勝光王等未詳時代似皆在佛後未敢入三代文攝生養性論神強者長生氣強者易滅柔弱畏威神強也鼓怒騁志氣強也凡人才所不至而極思之則志傷也力所不勝而極舉之則形傷也積憂不已則魂神傷矣積悲不已則魄神散矣喜怒過多神不歸室憎愛無定神不守形汲汲而慾神則煩切切所思神則敗久言笑則藏腑傷久坐立則筋骨傷寢寐失時則肝傷動息疲勞則脾傷挽弓引弩則筋傷沿高涉下則腎傷沉醉嘔吐則肺傷飽食偃臥則氣傷驟馬步走則胃傷喧呼詰罵則膽傷陰陽不交則瘡疿生房室不節則勞瘠發且人生一世久遠之期壽不過三萬日不能一日無損傷不能一日修補徒責神之不守體之不康豈不難乎足可悲矣是以養生之法不遠唾不驟行耳不極聽目不久視坐不至疲臥不及極先寒而後衣先熱而後解不欲甚飢飢則敗氣食誡過多勿極渴而飲飲誡過深食過則癥塊成疾飲過則痰癖結聚氣風不欲甚勞不欲甚逸勿出汗勿醉中奔驟勿飽食走馬勿多語勿生勿強食肥鮮勿沐髮後露頭冬不欲極溫夏不欲極涼冬極溫而春而有狂疫夏極涼而秋有瘧痢勿露臥星月之下勿飢臨屍骸之前勿睡中搖扇勿食次露頭勿衝熱而飲冰水勿淩甚寒而逼炎爐勿沐浴後而迎猛風勿汗出甚而便解衣勿衝熱而便入冷水淋身勿對日月及南北斗大小便勿于星辰下露體勿衝霜霧及嵐氣此皆損傷藏腑敗其神魂五味不得偏耽酸多傷脾苦多傷肺辛多傷肝甘多傷腎鹹多傷心此并應于五行潛稟四體可理可究矣志士君子深可慎焉犯之必不便損久乃積成衰敗是故心為五藏之主氣為百體之使動用以太和為馬通宣以玄寂為車關節煩勞即偃仰導引若不營攝養之術不順和平之道須臾氣衰于不竟之際形枯于聲色之前勞其渺渺之身憔其戚戚之思聞斯道養深可修慎是以真人常日淡泊不親狂蕩而愚者縱意未至損身已敗其神魂傷其魄矣悲夫見道藏臨字五號案此秦漢以後養生家言托之彭祖養壽養壽之道但莫傷之而已夫冬溫夏涼不失四時之和所以適身也美色淑姿安閑性樂不至思欲之感所以通神也車服威儀知足無求所以一志也八音五色以養視聽之歡所以導心也凡此皆以養壽而不能斟酌之者反以速患古之智人恐不才之子不識事宜流蕩不還故絕其源故經有上士別床中士異被服藥百過不如獨臥色使目盲聲使耳聾味使口爽言若能節宣其宜適抑揚其通塞者不減年算而得其益凡此之類譬猶水火可否失適反為害耳人不知其經脤損傷血氣不足肉理空疏髓腦不實體已先病故為外物所犯因風寒酒色以發之若本充實豈有病乎凡遠思強健傷人憂愁悲哀傷人喜樂過量傷人忿怒不解傷人汲汲所願傷人戚戚所患傷人寒煖失節傷人陰陽不交傷人人所傷者甚眾而獨責房室不亦惑哉男女相成猶天地相生也所以道養神氣使人不失其和天地得交接之道故無終竟之限人失交接之道故有殘折之期能避眾傷之事得陰陽之術則不死之道也天地晝離而夜合一歲三百六十交精氣和合者有四時故能生育萬物不知窮極人能則之可以長存次則有服氣得其道則邪氣不能入治身之本要也其餘歷藏導引之術及念體中萬神有含影守形之事不然于心志也人能愛精養體服氣鍊神則萬神自守其不然者營衛枯疲萬神自逝非思念所留者也見御覽七百二十引神仙傳彭祖云案此後世依托道藏盡字號有彭祖導引圖一篇不錄養生要憂恚悲哀傷人喜樂過差傷人見文選嵇叔夜養生論注養生要訣一人之身一國之象胸臆之設猶宮室也支體之位猶郊境也骨節之分猶百川也腠理之閒猶四衢也神猶君也血猶臣也氣猶民也故志人能理其身亦猶人君能治其國夫愛其民所以安其國愛其氣所以全其身民弊即國亡氣衰即身謝是以志人上士當施醫于未病之間不追修施于既敗之後故知國難保而易喪氣難清而易濁審機權可以安社稷制嗜慾可以保性命若能攝生者當先除六害然後可以延駐何名六害一曰薄名利二曰禁聲色三曰廉貨財四曰損滋味五曰屏虛妄六曰除疾妒六者若存則養生之道徒設耳蓋未見其有益也雖心希妙理口念真經咀嚼英華呼吸景象不能補其促矣誠知所以保和全真當須少思少念少笑少言少喜少怒少樂少愁少惡少好少事少機夫多思則神散多念則心勞多笑則藏腑上翻多言則氣海虛脫多喜則膀胱納客風多怒則腠理奔浮血多樂則心神邪蕩多愁則頭面燋枯多好則氣智潰溢多惡則神爽奔騰多事則筋脈乾急多機則智慮沉迷茲乃伐人之生甚于斤斧蝕人之性猛于豺狼無久行無久坐無久立無久臥無久視無久聽不飢強食則脾勞不渴強飲則胃脹體欲常勞食欲常少勞勿令過少勿令虛冬則朝勿虛夏則夜勿飽早起不在雞鳴前晚起不過日出後心內澄則真人守其位氣內定則邪物去其身行欺詐則神悲行爭競則神沮輕侮于人當減算殺害于物必傷年行一善則魂神歡搆一惡則魄神喜魂神欲人生魄神欲人死常欲寬泰自居恬淡自守則神形安靜災病不生仙錄必書其名死籍必消其咎養生之理盡在此矣至于鍊瓊丹而補腦化金液以留神此上真之妙道非食穀啗血越分而修之萬人之中得者殊少深可誡焉見御覽七百二十授黃帝符太一在前天一備後得兵契信戰則克矣見御覽七百三十六引黃帝出軍訣黃帝夢西王母遣人披玄狐之裘以符授之黃帝問玄女兵法黃帝與蚩尤九戰九不勝黃帝歸于太山三日三夜天霧冥有一婦人人首鳥形黃帝稽首再拜伏不敢起婦人曰吾玄女也子欲何問黃帝曰小子欲萬戰萬勝萬隱萬匿首當從何起遂得戰法焉見藝文類聚二御覽十五事類賦注二路史後紀四黃帝攻蚩尤三年城不下募求術士乃得伍胥與之言曰今曰余攻蚩尤三年城不下其咎安在伍胥曰此城中之將為人必白色商音始攻時得毋以秋之東方行乎今黃帝為人蒼色角音此雄軍也以戰為之黃帝曰善為之若何伍胥曰臣請攻蚩尤三日城必下黃帝大喜其中黃直曰帝積三年攻蚩尤而城不下今子欲以三日下之何以為明伍胥曰不如臣言請以軍法論黃帝曰子欲以何時此下當有伍胥曰三字臣請以朱雀之日日正中時立赤色徵音絳衣之軍于南方以輔角軍臣請以青龍之日平旦時立青色角音青衣之軍于東方以輔羽軍臣請以玄武之日人定時立黑色羽音黑衣之將于北方以輔商軍臣請以白虎之日日入時立白色商音白衣之將于西方以輔宮軍四時以立臣請為帝以黃龍之日日中建黃旗于中央以制四方五軍已具四面攻蚩尤三日其城果下黃帝即封胥世世不絕見御覽三百二十八路史後紀四凡行兵之道天地大寶得者全勝失者必負北斗之中禽有旬始狀像雄雞制百兵之母能得其術何神不使九地九天各有表裏三奇六合王威軍士見御覽三百二十八行兵之道天地之寶九天九地各有表裏九天之上六甲子也九地之下六癸酉也子能順之萬全可保見後漢皇甫嵩傳注引玄女三宮戰法戰鬥之法當從九天之上擊九地之下眾士默默人無所見九天者春在青龍夏在朱雀秋在白虎冬在玄武四神為九天其衝為九地見北堂書鈔未刪改本百十八御覽三百二十八戰鬥之法乘一破十百事不失都皆天一乘六神王齊士擊冠旅天下以上十五字有脫誤六神甲子旬在魁甲戍旬在勝光當作勝先陳禹謨本此下有甲申旬在弧一句不足信當云六神甲子旬在河魁甲戌旬在傳送甲申旬在勝先據五行大義第二十篇引玄武式經云神后主子大吉主丑功曹主寅大衝主卯天剛主辰太乙主巳勝先主午小吉主未傳送主申從魁主酉河魁主戌微明主亥午勝先者陽氣大威陰氣時動惟陽在先為勝也可以互証甲午旬在罡中甲辰旬在功曹甲寅旬在神后此六神為戰主也見書鈔一百十三敵人既陣必以其勝陣之敵人為直陣己以方陣攻之方陣者金陣也敵人為兌陣己以曲陣攻之曲陣者水陣也敵人為圓陣己以直陣攻之直陣者木陣也敵人為方陣己以兌陣攻之兌陣者火陣也敵人為曲陣己以圓陣攻之圓陣者土陣也見書鈔一百十三引兩條欲知敵人來時視之所從來上神欲以其勝應之假令敵人從大小吉魁罡下來應之以左部青旗從太一勝光下來應之以後部黑旗從功曹太衝下來應之以右部白旗從傳送從魁下來應之以前部赤旗從登明神后下來應之以中部黃旗此天道勝也見書鈔一百二十出軍行將屯守相與數鬥動作必擊鼓作聲聽其音以知己兵強弱也見書鈔一百二十七諸見舉烽火傳言虜且起欲知審來不以言者時所加之得陽者不得陰者為來法見藝文類聚八十御覽三百三十五六甲將及夫人姓名服色其將皆著赤幘小冠帶白綬紱夫人足皆各象其禽獸足凡欲招致神當于帛上書諸神名如法祭之齊事六日見形六十日一祭合諸神祭之祭法脯長一尺廣三寸白茅為藉編以青絲藉長二尺四寸廣六寸餅棗栗并脯置藉上杯皆黑中以丹砂九兩盛米囊九枚置北斗坐上中為九星六甲坐外西南十二坐坐前一杯受道者壇東北南面再拜祝見書鈔八十八又八十九御覽五百二十六禹問于風后曰吾聞黃帝有勝負之圖六甲陰陽之道今安在乎風后對曰其圖黃帝藏會稽之山下其坎深千丈廣千丈鎮以盤石求之者亡視之者見致難得也禹北見六子問海口所出禹乃決江口鳴角會稽龍神為見玉匱浮禹乃開而視之中有天下經十二卷禹未及持之其四卷飛上天禹不能得也其四卷復下陂池禹不能拯也禹得中四卷開而視之乃下缺見書鈔九十六御覽八十二竹中朱書趙毋恤余霍泰山山陽侯天使也三月丙戍余將使女反滅知氏女亦立我百邑余將賜女林胡之地至于後世且有伉王赤黑龍面而鳥噣鬢麋髭髯大膺大胸修下而馮左衽界乘奄有河宗至于休溷諸貉南伐晉別北滅黑姑見史記趙世家知伯攻趙趙襄子奔保晉陽原過從後至于王澤見三人自帶以上可見自帶以下不可見與原過竹二節莫通曰為我以是遺趙母恤原過既至以告襄子襄子齋三日親部竹有朱書云云襄子再拜受三神之令又見風俗通山陽侯天使作陽侯大吏無山字反滅作及滅百邑作三百邑亦黑作赤黑而馮作而馮下河宗作河室
