body:
  text: 始皇帝除諡法制制曰朕聞太古有號毋諡中古有號死而以行為諡如此則子議父臣議君也甚無謂朕弗取焉自今已來除諡法朕為始皇帝後世以計數二世三世至于萬世傳之無窮見史記秦始皇本紀詔丞相隗狀王綰詔丞相狀綰法度量則不一歉疑者皆明一之見秦權拓本秦量拓本秦平陽斤拓本令斷諫太后事敢以太后諫者戮而殺之從蒺藜其脊肉幹四肢而積之闕下見說苑正諫令丞相御史議帝號異日韓王納地效璽請為藩臣已而倍約與趙魏合從畔秦故興兵誅之虜其王寡人以為善庶幾息兵革趙王使其相李牧來約盟故歸其質子已而倍盟反我太原故興兵誅之得其王趙公子嘉乃自立為代王故舉兵擊滅之魏王始約服入秦已而與韓趙謀襲秦秦兵吏誅遂破之荊王獻青陽以西已而畔約擊我南郡故發兵誅得其王遂定其荊地燕王昏亂其太子丹乃陰令荊軻為賊兵吏誅滅其國齊王用后勝計絶秦使欲為亂兵吏誅虜其王平齊地寡人以眇眇之身興兵除暴亂賴宗廟之靈六王咸伏其辜天下大定今名號不更無以稱成功傳後世其議帝號見史記秦始皇本紀報王綰等議帝號去泰著皇采上古帝位號號曰皇帝他如議見史記秦始皇本紀報李斯議廢封建天下共苦戰鬥不休以有侯王賴宗廟天下初定又復立國是樹兵也而求其寧息豈不難哉廷尉議是見史記秦始皇本紀報李斯治驪山陵鑿之不入燒之不㸐其旁行三百丈乃止見淩義渠湘煙録一引蔡質漢儀賜文信侯書君何功於秦秦封君河南食十萬戶君何親於秦號稱仲父其與家屬徙處蜀見史記呂不韋傳璽書賜公子扶蘇以兵屬蒙恬與喪會咸陽而葬見史記秦始皇本紀又李斯傳詔李斯馮去疾制詔丞相斯去疾法度量盡始皇帝為之者有刻辭焉今襲號而刻辭不稱始皇帝其於久遠殹如後嗣為之者不稱成功盛德見秦平陽斤拓本又秦權秦量殹皆作也皇帝曰金石刻盡始皇帝所為也今襲號而金石刻辭不稱始皇帝其於久遠也如後嗣為之者不稱成功盛德見琅邪刻石拓本又泰山殘石絳帖泰山篆譜汝帖之罘刻石徐鉉重摹繹山刻石令蒙毅先主欲立太子而卿難之今丞相以卿為不忠罪及其宗朕不忍乃賜卿死亦甚幸矣卿其圖之見史記蒙恬傳令蒙恬君之過多矣而卿弟毅有大罪法及內史同上上書請從死先帝無恙時臣入則賜食出則乘輿御府之衣臣得賜之中廄之寶馬臣得賜之臣當從死而不能為人子不孝為人臣不忠不忠者無名以立於世臣請從死願葬酈山之足唯上幸哀憐之見史記李斯傳議帝號昔者五帝地方千里其外侯服夷服諸侯或朝或否天子不能制今陛下興義兵誅殘賊平定天下海內為郡縣法令由一統自上古以來未嘗有五帝所不及臣等謹與博士議曰古有天皇有地皇有泰皇泰皇最貴臣等昧死上尊號王為泰皇命為制令為詔天子自稱曰朕見史記秦始皇本紀丞相綰御史大夫劫廷尉斯等皆曰議封建諸侯初破燕齊荊地遠不為置王毋以填之請立諸子唯上幸許見史記秦始皇本紀丞相綰等言始皇下其議上書諫逐客臣聞吏議逐客竊以為過矣昔繆公求士西取由余於戎東得百里奚於宛迎蹇叔於宋求丕豹公孫支於晉此五子者不産於秦而繆公用之并國二十遂霸西戎孝公用商鞅之法移風易俗民以殷盛國以富彊百姓樂用諸侯親服獲楚魏之師舉地千里至今治彊惠王用張儀之計拔三川之地西并巴蜀北收上郡南取漢中包九夷制鄢郢東據成皋之險割膏腴之壤遂散六國之從使之西面事秦功施到今昭王得范睢廢穰侯逐華陽彊公室杜私門蠶食諸侯使秦成帝業此四君者皆以客之功由此觀之客何負於秦哉向使四君卻客而不內疏士而不用是使國無富利之實而秦無彊大之名也今陛下致昆山之玉有隨和之寶垂明月之珠服太阿之劍乘纖離之馬建翠鳳之旗樹靈鼉之鼓此數寶者秦不生一焉而陛下說之何也必秦國之所生然後可則是夜光之璧不飾朝廷犀象之器不為玩好鄭衛之女不充後宮而駿良駃騠不實外廄江南金錫不為用西蜀丹青不為采所以飾後宮充下陳娛心意說耳目者必出於秦然後可則是宛珠之簪傅璣之珥阿縞之衣錦繡之飾不進於前而隨俗雅化佳冶窈窕趙女不立於側也夫擊甕叩缶彈箏搏髀而歌呼嗚嗚快耳者真秦之聲也鄭衛桑間昭虞武象者異國之樂也今棄擊甕叩缶而就鄭衛退彈箏而取昭虞若是者何也快意當前適觀而已矣今取人則不然不問可否不論曲直非秦者去為客者逐然則是所重者在乎色樂珠玉而所輕者在乎人民也此非所以跨海內制諸侯之術也臣聞地廣者粟多國大者人衆兵彊則士勇是以太山不讓土壤故能成其大河海不擇細流故能就其深王者不卻衆庶故能明其德是以地無四方民無異國四時充美鬼神降福此五帝三王之所以無敵也今乃棄黔首以資敵國卻賓客以業諸侯使天下之士退而不敢西向裹足不入秦此所謂藉寇兵而齎盜糧者也夫物不産於秦可寶者多士不産於秦而願忠者衆今逐客以資敵國損民以益讎內自虛而外樹怨於諸侯求國無危不可得也見史記李斯傳上書韓王昔秦韓戮力一意以不相侵天下莫敢犯如此者數世矣前時五諸侯嘗相與共伐韓秦發兵以救之韓居中國地不能滿千里而所以得與諸侯班位于天下君臣相保者以世世相教事秦之力也先時五諸侯共伐秦韓反與諸侯先為雁行以嚮秦軍於闕下矣諸侯兵困力極無奈何諸侯兵罷杜倉相秦起兵發將以報天下之怨而先攻荊荊令尹患之曰夫韓以秦為不義而與秦兄弟共苦天下已又背秦先為雁行以攻關韓則居中國展轉不可知天下共割韓上地十城以謝秦解其兵夫韓嘗一背秦而國迫地侵兵弱至今所以然者聽姦臣之浮說不權事實故雖殺戮姦臣不能使韓復強今趙欲聚兵士卒以秦為事使人來借道言欲伐秦其勢必先韓而後秦且臣聞之脣亡則齒寒夫秦韓不得無同憂其形可見魏欲發兵以攻韓秦使人將使者於韓今秦王使臣斯來而不得見恐左右襲曩奸臣之計使韓復有亡地之患臣斯不得見請歸報秦韓之交必絶矣斯之來使以奉秦王之歡心願效便計豈陛下所以逆賤臣者耶臣斯願得一見前進道愚計退就葅戮願陛下有意焉今殺臣於韓則大王不足以強若不聽臣之計則禍必搆矣秦發兵不留行而韓之社稷憂矣臣斯暴身於韓之市則雖欲察賤臣愚忠之計不可得已邊鄙殘國固守鼓鐸之聲於耳而乃用臣斯之計晚矣且夫韓之兵於天下可知也今又背強秦夫棄城而敗軍則反掖之寇必襲城矣城盡則聚散聚散則無軍矣城固守則秦必興兵而圍王一都道不通則難必謀其勢不救左右計之者不用願陛下熟圖之若臣斯之所言有不應事實者願大王幸使得畢辭於前乃就吏誅不晚也秦王飲食不甘遊觀不樂意專在圖趙使臣斯來言願得身見因急與陛下有計也今使臣不通則韓之信未可知也夫秦必釋趙之患而移兵於韓願陛下幸復察圖之而賜臣報決見韓非子存韓上書言治驪山陵臣所將隸徒七十二萬人治驪山者已深已極鑿之不入燒之不㸐叩之空空如下天狀見凌義渠湘煙録一引蔡質漢儀李斯治驪山陵上書又段成式酉陽雜俎十五引李斯奏少前十四字上書對二世夫賢主者必且能全道而行督責之術者也督責之則臣不敢不竭能徇其主矣此臣主之分定上下之義明則天下賢不肖莫敢不盡力竭任以徇其君矣是故主獨制於天下而無所制也能窮樂之極矣賢明之主也可不察焉故申子曰有天下而不恣睢命之曰以天下為桎梏者無他焉不能督責而顧以其身勞於天下之民若堯禹然故謂之桎梏也夫不能修申韓之明術行督責之道專以天下自適也而徒務苦形勞神以身徇百姓則是黔首之役非畜天下者也何足貴哉夫以人徇己則己貴而人賤以己徇人則己賤而人貴故徇人者賤而人所徇者貴自古及今未有不然者也凡古之所為尊賢者為其貴也而所為惡不肖者為其賤也而堯禹以身徇天下者也因隨而尊之則亦失所為尊賢之心矣夫可謂大繆矣謂之為桎梏不亦宜乎不能督責之過也故韓子曰慈母有敗子而嚴家無格虜者何也則能罰之加焉必也故商君之法刑棄灰於道者夫棄灰薄罪也而被刑重罰也彼唯明主為能深督輕罪夫罪輕且督深而況有重罪乎故民不敢犯也是故韓子曰布帛尋常庸人不釋鑠金百鎰盜跖不搏者非庸人之心重尋常之利深而盜跖之欲淺也又不以盜跖之行為輕百鎰之重也搏必隨手刑則盜跖不搏百鎰而罰不必行也則庸人不釋尋常是故城高五丈而樓季不輕犯也泰山之高百仞而跛牂牧其上夫樓季也而難五丈之限豈跛牂也而易百仞之高哉峭塹之勢異也明主聖王之所以能久處尊位長執重勢而獨擅天下之利者非有異道也能獨斷而審督責必深罰故天下不敢犯也今不務所不犯而事慈母之所以敗子也則亦不察於聖人之論矣夫不能行聖人之術則捨為天下役何事哉可不哀哉且夫儉節仁義之人立於朝則荒肆之樂輟矣諫說論理之臣開於側則流漫之志詘矣烈士死節之行顯於世則淫康之虞廢矣故明主能外此三者而獨操主術以制聽從之臣而修其明法故身尊而勢重也凡賢主者必將能拂世摩俗而廢其所惡立其所欲故生則有尊重之勢死則有賢明之諡也是以明君獨斷故權不在臣也然後能滅仁義之塗掩馳說之口困烈士之行塞聰掩明內獨視聽故外不可傾以仁義烈士之行而內不可奪以諫說忿爭之辨故能犖然獨恣睢之心而莫之敢逆若此然後可謂能明申韓之術而修商君之法法修術明而天下亂者未之聞也故曰王道約而易操也唯明主為能行之若此則謂督責之誠則臣無邪臣無邪則天下安天下安則主嚴尊主嚴尊則督責必督責必則所求得所求得則國家富國家富則君樂豐故督責之術設則所欲無不得矣群臣百姓救過不給何變之敢圖若此則帝道備而可謂能明君臣之術矣雖申韓復生不能加也見史記李斯傳上書言趙高臣聞之臣疑其君無不危國妾疑其夫無不危家今有大臣於陛下擅利擅害與陛下無異此甚不便昔者司城子罕相宋身行刑罰以威行之期年遂劫其君田常為簡公臣爵列無敵於國私家之富與公家均布惠施德下得百姓上得群臣陰取齊國殺宰豫庭即弒簡公於朝遂有齊國此天下所明知也今高有邪佚之志危反之行如子罕相宋也私家之富若田氏之於齊也兼行田常子罕之逆道而劫陛下之威信其志若韓玘為韓安相也陛下不圖臣恐其為變也見史記李斯傳獄中上書臣為丞相治民三十餘年矣逮秦地之陝隘先王之時秦地不過千里兵數十萬臣盡薄材謹奉法令陰行謀臣資之金玉使游說諸侯陰備甲兵飾政教官鬥士尊功臣盛其爵祿故終以脅韓弱魏破燕趙夷齊楚卒兼六國虜其王立秦為天子罪一矣地非不廣又北逐胡貉南定百越以見秦之彊罪二矣尊大臣盛其爵位以固其親罪三矣立社稷修宗廟以明主之賢罪四矣更剋畫平斗斛度量文章布之天下以樹秦之名罪五矣治馳道興游觀以見主之得意罪六矣緩刑罰薄賦斂以遂主得衆之心萬民戴主死而不忘罪七矣若斯之為臣者罪足以死固久矣上幸盡其能力乃得至今願陛下察之見史記李斯傳議存韓詔以韓客之所上書書言韓子之未可舉下臣斯臣斯甚以為不然秦之有韓若人之有腹心之病也虛處則㤥然若居濕地著而不去以極走則發矣夫韓雖臣於秦未嘗不為秦病今若有卒報之事韓不可信也秦與趙為難荊蘇使齊未知何如以臣觀之則齊趙之交未必以荊蘇絶也若不絶是悉趙而應二萬乘也夫韓不服秦之義而服於強也今專於齊趙則韓必為腹心之病而發矣韓與荊有謀諸侯應之則秦必復見崤塞之患非之來也未必不以其能存韓也為重於韓也辨說屬辭飾非詐謀以釣利於秦而以韓利窺陛下夫秦韓之交親則非重矣此自便之計也臣視非之言文其淫說靡辨才甚臣恐陛下淫非之辨而聽其盜心因不詳察事情今以臣愚議秦發兵而未名所伐則韓之用事者以事秦為計矣臣斯請往見韓王使來入見大王見因內其身而勿遣稍召其社稷之臣以與韓人為市則韓可深割也因令象武發東郡之卒窺兵於境上而未名所之則齊人懼而從蘇之計是我兵未出而徑韓以威擒強齊以義從矣聞於諸侯也趙氏破膽荊人狐疑必有忠計荊人不動魏不足患也則諸侯可蠶食而盡趙氏可得與敵矣願陛下幸察愚臣之計無忽見韓非子存韓議廢封建周武王所封子弟同姓甚衆然後屬疏遠相攻擊如仇讎諸侯更相誅伐周天子弗能禁止今海內賴陛下神靈一統皆為郡縣諸子功臣以公賦稅重賞賜之甚足易制天下無異意則安寧之術也置諸侯不便見史記秦始皇本紀議刻金石維秦王兼有天下立名為皇帝乃撫東土至于琅邪列侯武城侯王離列侯通武侯王賁倫侯建成侯趙亥倫侯昌武侯成倫侯武信侯馮毋擇丞相隗林丞相王綰卿李斯卿王戊五大夫趙嬰五大夫楊樛從與議于海上曰古之帝者地不過千里諸侯各守其封域或朝或否相侵暴亂殘伐不止猶刻金石以自為紀古之五帝三王知教不同法度不明假威鬼神以欺遠方實不稱名故不久長其身未歿諸侯倍叛法令不行今皇帝并一海內以為郡縣天下和平昭明宗廟體道行德尊號大成群臣相與誦皇帝功德刻于金石以為表經見史記秦始皇本紀案史記以此議連屬琅邪刻石頌之下今頌碑見存五夫二楊樛後便刻二世詔書驗知此議當有別石不得與頌同碑故分録之議燒詩書百家語五帝不相復三代不相襲各以治非其相反時變異也今陛下創大業建萬世之功固非愚儒所知且越言乃三代之事何足法也異時諸侯竝爭厚招游學今天下已定法令出一百姓當家則力農工士則學習法令辟禁今諸生不師今而學古以非當世惑亂黔首丞相臣斯昧死言古者天下散亂莫之能一是以諸侯竝作語皆道古以害今飾虛言以亂實人善其所私學以非上之所建立今皇帝竝有天下別黑白而定一尊而私學乃相與非法教之制聞令下則各以其私學議之入則心非出則巷議夸主以為名異取以為高率群下以造謗如此弗禁則主勢降乎上黨與成乎下禁之便臣請史官非秦記皆燒之非博士官所職天下敢有藏詩書百家語者悉詣守尉雜燒之有敢偶語詩書棄市以古非今者族吏見知不舉者與同罪令下三十日不燒黥為城旦所不去者醫藥卜筮種樹之書若欲有學法令以吏為師見史記秦始皇本紀三十四年博士淳于越請封子弟功臣始皇下其議丞相李斯云云制曰可又見李斯傳金狄銘皇帝草六年初兼天下以為郡縣正法律同度量大人來見臨洮身長五丈足跡六尺見水經注河水四云李斯書也又見漢書項籍傳贊注引三輔黃圖玉璽文受天之命皇帝壽昌見宋書禮志五受命于天既壽永昌見後漢光武紀注引玉璽譜受命于天既壽永昌見御覽六百八十二引吳書繹山刻石皇帝立國維初在昔嗣世稱王討伐亂逆威動四極武義直方戎臣奉詔經時不久滅六暴強草有六年上薦高廟孝道顯明既獻泰成乃降專惠親𨊩遠方登于繹山群臣從者咸思攸長追念亂世分土建邦以開爭理功戰日作流血于野自泰古始世無萬數阤及五帝莫能禁止𠧟今皇帝一家天下兵不復起災害滅除黔首康定利澤長久群臣誦略刻此樂石以箸經紀見徐鉉重摹繹山碑拓本案秦刻石三句為韻唯琅邪台二句為韻皆李斯之辭張守節言會稽碑文及書皆李斯斯獄中上書言更刻畫平斗斛度量文章布之天下其顯據也此文史記不載泰山刻石皇帝臨立作制明法臣下修飭草有六年初并天下罔不賓服寴𨊩遠𪏯登茲泰山周覽東極從臣思𢄔本原事業祗誦功德治道運行諸産得宜皆有法式大義箸明陲于後嗣順承勿革皇帝躬聽既平天下不懈于治夙興夜寐建設長利專隆教誨訓經宣達遠近畢理咸承聖志貴賤分明男女體順慎遵職事昭隔內外靡不清淨施于昆嗣化及無窮遵奉遺詔永承重戒見劉跂泰山篆譜又史記秦始皇紀臨立作臨位躬聽作躬聖寴𨊩遠𪏯作親巡遠方黎民體順作禮順昆嗣作後嗣琅邪臺刻石維草八年皇帝作始端平法度萬物之紀以明人事合同父子聖智仁義顯白道理東撫東土以省卒士事已大畢乃臨于海皇帝之功勤勞本事上農除末黔首是富普天之下摶心揖志器械一量同書文字日月所照舟輿所載皆終其命莫不得意應時動事是維皇帝匡飭異俗陵水經地憂恤黔首朝夕不懈除疑定法咸知所辟方伯分職諸治經易舉錯必當莫不如畫皇帝之明臨察四方尊卑貴賤不逾次行姦邪不容皆務貞良細大盡力莫敢怠荒遠邇辟隱專務肅莊端直敦忠事業有常皇帝之德存定四極誅亂除害興利致福節事以時諸産繁殖黔首安寧不用兵革六親相保終無寇賊歡欣奉教盡知法式六合之內皇帝之土西涉流沙南盡北戶東有東海北過大夏人迹所至無不臣者功蓋五帝澤及牛馬莫不受德各安其宇見史記秦始皇紀列侯武城侯王離列侯通武侯王賁倫侯建成侯趙亥倫侯昌武侯成倫侯武信侯馮毋擇丞相隗林丞相王綰卿李斯卿王戊五大夫趙嬰五大夫楊樛見史記秦始皇紀又略見琅邪碑拓本案史記十一人上下文多不得與頌同石今頌碑見存五夫二楊樛後便刻二世詔書知始皇時所刻止此耳之罘刻石維草九年時在中春陽和方起皇帝東游巡登之罘臨照于海從臣嘉觀原念休烈追誦本始大聖作治建定法度顯著綱紀外教諸侯光施文惠明以義理六國回辟貪戾無厭虐殺不已皇帝哀衆遂發討師奮揚武德義誅信行威燀旁達莫不賓服烹滅彊暴振救黔首周定四極普施明法經緯天下永為儀則大矣哉宇縣之中承順聖意群臣誦功請刻于石表垂常式見史記秦始皇紀大矣下脫一字表垂下衍于字今校正之罘東觀刻石維草九年皇帝春游覽省遠方逮于海隅遂登之罘昭臨朝陽觀望廣麗從臣咸念原道至明聖法初興清理疆內外誅暴彊武威旁暢振動四極禽滅六王闡并天下菑害絶息永偃戎兵皇帝明德經理宇內視聽不怠作立大義昭設備器咸有章旗職臣遵分各知所行事無嫌疑黔首改化遠邇同度臨古絶尤常職既定後嗣循業長承聖治群臣嘉德祗誦聖烈請刻之罘見史記秦始皇紀碣石門刻石遂興師旅誅滅無道為逆滅息武殄暴逆文復無罪庶心咸服惠論功勞賞及牛馬恩肥土域皇帝奮威德并諸侯初一泰平墮壞城郭決通川防夷去險阻地勢既定黎庶無繇天下咸撫男樂其疇女修其業事各有序惠被諸産久竝來田莫不安所群臣誦烈請刻此石垂著儀矩見史記秦始皇紀會稽刻石皇帝休烈平一宇內德惠攸長卅有七年寴𨊩天下周覽遠方遂登會稽宣省習俗黔首齊莊群臣誦功本原事𢄔追道高明秦聖臨國始定刑名顯陳舊章初平法式審別職任以立恆常六王專倍貪戾慠猛率衆自強暴虐恣行負力而驕數動甲兵陰通間使以事合從行為辟方內飾詐謀外來侵邊遂起禍殃義威誅之殄熄暴悖亂賊滅亡聖德廣密六合之中被澤無彊皇帝并宇兼聽萬事遠近畢清運理群物考驗事實各載其名貴賤竝通善否陳前靡有隱情飾省宣義有子而嫁倍死不貞防隔內外禁止淫泆男女潔誠夫為寄豭殺之無罪男秉義程妻為逃嫁子不得母咸化廉清大治濯俗天下承風蒙被休經皆遵軌度和安敦勉莫不順令黔首修潔人樂同則嘉保泰平後敬奉法常治無極輿車不傾從臣誦烈請刻此石光陲休銘見申屠駉重刻會稽碑拓本又見史記秦始皇紀小異句曲山白璧刻文始皇聖德平章江山巡狩蒼川勒銘素璧張鉉至正金陵新志一茅山圖考注引茅山記曰秦始皇三十七年游會稽還登句曲北垂山埋白璧一雙深七尺李斯篆刻文又真誥引茅君內傳秦權文草六年皇帝盡并兼天下諸侯黔首大安立號為皇帝乃詔丞相狀綰法度量則不一歉疑者皆明一之元年制詔丞相斯去疾法度量盡始皇帝為之皆有刻辭焉今襲號而刻辭不稱始皇帝其于久遠也如後嗣為之者不稱成功盛德刻此詔故刻左使毋疑見秦權拓本又平陽斤拓本刻始皇所立刻石皇帝曰金石刻盡始皇帝所為也今襲號而金石刻辭不稱始皇帝其于久遠也如後嗣為之者不稱成功盛德丞相臣斯臣去疾御史大夫臣德昧死言臣請具刻詔書金石刻因明白矣臣昧死請制曰可見琅邪臺刻石拓本又泰山殘石徐鉉重摹繹山刻石降帖泰山篆譜汝帖之罘刻石又史記秦始皇紀二世東行邵懸李斯從到碣石竝海南至會稽而盡刻始皇所立刻石石旁著大臣從者名以章先帝成功盛德焉用筆法夫書之微妙道合自然篆籀以前不可得而聞矣自上古作大篆頗行于世但為古遠人多不詳今斯刪略繁者取其合理參為小篆凡書非但裹結流快終藉筆力輕健蒙將軍恬筆經猶自簡略斯更修改望益于用矣用筆法先急回後疾下鷹望鵬逝信之自然不得重改如游魚得水景山興雲或卷或舒乍輕乍重善思之此理可見矣斯善書自趙高以下或見推伏刻諸名山碑璽銅人並斯之筆斯書秦望紀功石云吾死後五百三十年間當有一人替吾跡焉見墨池編進頌他時秦地不過千里賴陛下神靈明聖平定海內放逐蠻夷日月所照莫不賓服以諸侯為群縣人人自安樂無戰爭之患傳之萬世自上古不及陛下威德見史記秦始皇紀三十四年始皇置酒咸陽宮博士七十人前為壽僕射周青臣進頌議封建臣聞殷周之王千餘歲封子弟功臣自為枝輔今陛下有海內而子弟為匹夫卒有田常六卿之臣無輔拂何以相救哉事不師古而能長久者非所聞也今青臣又面諛以重陛下之過非忠臣見史記秦始皇紀又李斯傳齊人淳于越進諫始皇下其議上始皇帝書荊軻挾匕首卒刺陛下陛下以神武扶揄長劍以自救見文選吳都賦劉淵林注引秦零陵令上始皇帝書案漢志從橫家有秦零陵令信一篇難秦相李斯即此諸儒生議封禪古者封禪為蒲車惡傷山之土石草木掃地而祭席用菹秸言其易遵也見史記封禪書始皇即帝位三年徵從齊魯之儒生博士七十人至乎泰山下諸儒生或議又見漢書郊祀志上群臣議尊始皇廟古者天子七廟諸侯五大夫三雖萬世世不軼毀今始皇為極廟四海之內皆獻貢職增犧牲禮咸備毋以加先王廟或在西雍或在咸陽天子儀當獨奉酌祠始皇廟自襄公以下軼毀所置凡七廟群臣以禮進祠以尊始皇廟為帝者祖廟見史記秦始皇紀二世元年令群臣議尊始皇廟群臣皆頓首言秦將詐稱二世使人與李良書良嘗事我得顯幸良誠能反趙為秦赦良罪貴良見史記張耳陳餘傳漢書張耳陳餘傳辨士隱姓名遺秦將章邯書李斯為秦王死廢十七兄而立今王也見史記李斯傳集解引杜預善文東郡隕石刻文始皇死而地分見漢書五行志中之上始皇帝三十六年石隕于東郡民或刻其石詐為始皇書賜公子扶蘇朕巡天下禱祠名山諸神以延壽命今扶蘇與將軍蒙恬將師數十萬以屯邊十有餘年矣不能進而前士卒多耗無尺寸之功乃反數上書直言誹謗我所為以不得罷歸為太子日夜怨望扶蘇為人子不孝其賜劍以自裁將軍蒙恬與扶蘇居外不匡正宜知其謀為人臣不忠其賜死以兵屬裨將王離見史記李斯傳留書報始皇後千歲求我于蓬萊山下見史記封禪書正義引列仙傳今本列仙傳作後數年無下字抱朴子極言篇作復數千載藝文類聚八十四引抱朴子作後數千載上書請求仙海中有三神山名曰蓬萊方丈瀛洲仙人居之請得齊戒與童男女求之見史記秦始皇紀
