body:
  text: 高帝重祠詔吾甚重祠而敬祭今上帝之祭及山川諸神當祠者各以其時禮祠之如故見漢書郊祀志上立吳芮為長沙王詔故衡山王吳芮與子二人兄子一人從百粵之兵以佐諸侯誅暴秦有大功諸侯立以為王項羽侵奪之地謂之番君其以長沙豫章象郡桂林南海立番君芮為長沙王見漢書高紀下制詔御史長沙王忠其定著令見漢書吳芮傳以亡諸為閩粵王詔故粵王亡諸世奉粵祀秦侵奪其地使其社稷不得血食諸侯伐秦亡諸身師閩中兵以佐滅秦項羽廢而弗立今以為閩粵王王閩中地勿使失職見漢書高紀下罷兵賜復詔諸侯子在關中者復之十二歲其歸者半之民前或相聚保山澤不書名數今天下已定令各歸其縣復故爵田宅吏以文法教訓辨告勿笞辱民以飢餓自賣為人奴婢者皆免為庶人軍吏卒會赦其亡罪而亡爵及不滿大夫者皆賜爵為大夫故大夫以上賜爵各一級其七大夫以上皆令食邑非七大夫以下皆復其身及戶勿事見漢書高紀下七大夫公乘以上皆高爵也諸侯子及從軍歸者甚多高爵吾數詔吏先與田宅及所當求於吏者亟與爵或人君上所尊禮久立吏前曾不為決其亡謂也異日泰民爵公大夫以上令丞與亢禮今吾於爵非輕也吏獨安取此且法以有功勞行田宅今小吏未嘗從軍者多滿而有功者顧不得背公立私守尉長吏教訓甚不善其令諸吏善遇高爵稱吾意且廉問有不如吾詔者以重論之同上詔衛尉酈商齊王田橫即至人馬從者敢搖動者致族夷見史記田儋傳漢書田儋傳赦詔天下既安豪傑有功者封侯新立未能盡圖其功身居軍九年或未習法令或以其故犯法大者死刑吾甚憐之其赦天下見漢書高紀下擇立齊王荊王詔齊古之建國也今為邵懸其復以為諸侯將軍劉賈數有大功及擇寬惠修潔者王齊荊地見漢書高紀下又見荊王劉賈傳上太公尊號詔人之至親莫親於父子故父有天下傳歸於子子有天下尊歸於父此人道之極也前日天下大亂兵革並起萬民苦殃朕親被堅執鋭自帥士卒犯危難平暴亂立諸侯偃兵息民天下大安此皆太公之教訓也諸王通侯將軍群卿大夫已尊朕為皇帝而太公未有號今上尊太公曰太上皇見漢書高紀下疑獄詔制詔御史獄之疑者吏或不敢決有罪者久而不論無罪者久繫不決自今以來懸道官獄疑者各讞所屬二千石官二千石官以其罪名當報之所不能決者皆移廷尉廷尉亦當報之廷尉所不能決謹具為奏傅所當比律令以聞見漢書刑法志立靈星祠詔制詔御史其令郡國懸立靈星祠常以歲時祠以牛見史記封禪書漢書郊祀志上捕趙王張敖詔趙有敢隨王者罪三族見史記田叔傳擇立代王詔代地居常山之北與夷狄邊趙乃從山南有之遠數有胡寇難以為國頗取山南太原之地益屬代代之雲中以西為雲中郡則代受邊寇益少矣王相國通侯吏二千石擇可立為代王者見漢書高紀下定口賦詔欲省賦甚今獻未有程吏或多賦以為獻而諸侯王猶多民疾之今諸侯王通侯常以十月朝獻柔郡各以其口數率人歲六十三錢以給獻費見漢書高紀下求賢詔蓋聞王者莫高於周文伯者莫高於齊桓皆待賢人而成名今天下賢者智能豈特古之人乎患在人主不交故也士奚由進今吾以天之靈賢士大夫定有天下以為一家欲其長久世世奉宗廟亡絶也賢人已與我共平之矣而不與吾共安利之可乎賢士大夫有肯從我遊者吾能尊顯之布告天下使明知朕意御史大夫昌下相國相國酇侯下諸侯王御史中執法下郡守其有意稱明德者必身勸為之駕遣詣相國府署義年有而弗言覺免年老癃病勿遣見漢書高紀下擇立梁王淮陽王詔擇可以為梁王淮陽王者見漢書高紀下立趙它為南粵王詔粵人之俗好相攻擊前時秦徙中懸之民南方三郡使與百粵雜處會天下誅秦南海尉它居南方長治之甚有文理中懸人以故不耗減粵人相攻擊之俗益止俱賴其力今立它為南粵王見漢書高紀下擇立吳王詔吳古之建國也日者荊王兼有其地今死亡後朕欲復立吳王其議可者見漢書高紀下置秦皇楚王陳勝等守冢詔秦皇帝楚隱王魏安釐王齊愍王趙悼襄王皆絶亡後其與秦始皇帝守冢二十家楚魏齊各十家趙及魏公子亡忌各五家令視其冢復亡與它事見漢書高紀下議立燕王詔燕王綰與吾有故愛之如子聞與陳豨有謀吾以為亡有故使人迎綰綰稱疾不來謀反明矣燕吏民非有罪也賜其吏六百石以上爵各一級與綰居去歸者赦之加爵亦一級詔諸侯王議可立為燕王者見漢書高紀下立南武侯織為南海王詔南武侯織亦粵之世也立以為南海王見漢書高紀下布告天下詔吾立為天子帝有天下十二年於今矣與天下之豪士賢大夫共定天下同安輯之其有功者上致之王次為列侯下乃食邑而重臣之親或為列侯皆令自置吏得賦斂女子公主為列侯食邑者皆佩之印賜大第室吏二千石徙之長安受小第室入蜀漢定三秦者皆世世復吾於天下賢士功臣可謂亡負矣其有不義背天子擅起兵者與天下共伐誅之布告天下使明知朕意見漢書高紀下手敕太子吾遭亂世當秦禁學自喜謂讀書無益洎踐祚以來時方省書乃使人知作者之意追思昔所行多不是見古文苑堯舜不以天子與子而與他人此非為不惜天下但子不中立耳人有好牛馬尚惜況天下耶吾以爾是元子早有立意群臣咸稱汝友四皓吾所不能致而為汝來為可任大事也今定汝為嗣同上吾生不學書但讀書問字而遂知耳以此故不大工然亦足自辭解今視汝書猶不如吾汝可勤學習每上疏宜自書勿使人也同上汝見蕭曹張陳諸公侯吾同時人倍年于汝者皆拜并語于汝諸弟同上吾得疾遂困以如意母子相纍其餘諸兒皆自足立哀此兒猶小也同上賜韓王信書專死不勇專生不任寇攻馬邑君王力不足以堅守乎安危存亡之地此二者朕所以責於君王見漢書韓王信傳上賜信書責讓之書帛射城上與沛父老天下同苦秦久矣今父老雖為沛令守諸侯並起今屠沛沛今共誅令擇可立立之以應諸侯即室家完不然父子俱屠無為也見漢書高紀上入關告諭父老苦秦苛法久矣誹謗者族耦語者棄市吾與諸侯約先入關者王之吾當王關中與父老約法三章耳殺人者死傷人及盜抵罪餘悉除去秦法吏民皆安堵如故凡吾所以來為父兄除害非有所侵暴毋恐且吾所以軍霸上待諸侯至而定要束耳見漢書高紀上發使告諸侯天下共立義帝北面事之今項羽放殺義帝江南大逆無道寡人親為發喪兵皆縞素愁發關中兵收三河士南浮江漢以下願從諸侯王擊楚之殺義帝者見漢書高紀上數項羽十罪吾始與羽俱受命懷王曰先定關中者王之羽負約王我於蜀漢罪一也羽矯殺卿子冠軍自尊罪二也羽當以救趙還報而擅劫諸侯兵入關罪三也懷王約入秦無暴掠羽燒秦宮室掘始皇帝冢收私其敗罪四也又強殺秦降王子嬰罪五也詐坑秦子弟新安二十萬王其將罪六也皆王諸將善地而徙逐故主令臣下爭逆罪七也出逐義帝彭城自都之奪韓王地並王梁楚多自與罪八也使人陰殺義帝江南罪九也夫為人臣而殺其主殺其已降為政不平主約不信天下所不容大逆無道罪十也吾以義兵從諸侯誅殘賊使刑餘罪人擊公何苦乃與公挑戰見漢書高紀上下令恤軍士死者軍士不幸死者吏為衣衾棺斂轉送其家見漢書高紀上下令立韓信為楚王彭越為梁王楚地已定義帝亡後欲存恤楚衆以定其主齊王信羽楚風俗更立為楚王王淮北都下邳魏相國建成侯彭越勤勞魏民卑下士卒常以少擊衆數破楚軍其以魏故地王之號曰梁王都定陶見漢書高紀下下令赦天下兵不得休八年萬民與苦甚今天下事畢其赦天下殊死已下見漢書高紀下復吏卒限制衣冠令吏卒從軍至平城及守城邑者皆復終身勿事爵非公乘以上毋得冠劉氏冠賈人毋得衣錦繡綺縠絺紵罽操兵乘騎馬見漢書高紀下夷三族令當三族者皆先黥劓斬左古止笞殺之梟其首菹其骨肉於市其誹謗詈詛者又先斷舌見漢書刑法志漢興約法三章然其大辟尚有夷三族之令故謂之具五刑彭越韓信之屬皆受此誅答諸侯王韓信等上尊號寡人聞帝者賢者有也虛言無實之名非所取也今諸侯王皆推高寡人將何以處之哉見漢書高紀下諸侯王幸以為便於天下之民則可矣同上封爵誓使黃河如帶泰山若厲國以永存爰及苗裔見漢書高惠高后文功臣表又三國志周瑜傳引作如礪餘皆同丹書鐵券使黃河如帶泰山如礪漢有宗廟爾無絶世見太平御覽五百九十八又六百三十三困學紀聞十二引陸賈楚漢春秋高帝初封侯者皆賜丹書鐵券曰又與群臣刑白馬而盟非劉氏不王若有亡功非上所置而侯者天下共誅之見非劉氏而王者天下共擊之見漢書王陵傳高皇帝刑白馬而盟云云又見史記呂后紀無者字又見漢書外戚傳非劉氏不得王非有功不得侯不如約天下共擊之見漢書周勃傳案書抄八十一引漢書云黃河如帶泰山如礪其國永存爰及苗裔申以丹書之信重以白馬之盟所述書天子所服第八案此即藝文志儒家所載高祖傳十三篇之一也大謁者臣章受詔長樂宮曰令群臣議天子所服以安治天下相國臣何御史大夫臣昌謹與將軍臣陵太子太傅臣通等議春夏秋冬天子所服當法天地之數中得人和故自天子王侯有土之君下及兆民能法天地順四時以治國家身亡禍殃年壽永究是奉宗廟安天下之大禮也臣請法之中謁者趙堯舉春李舜舉夏兒湯舉秋貢禹舉冬四人各職一時大謁者襄章奏制曰可見漢書魏相傳相表奏引高皇帝所述書天子所服第八重吏祿詔吏所以治民也能盡其治則民賴之故重其祿所以為民也今吏六百石以上父母妻子與同居及故吏嘗佩將軍都尉印將兵及佩二千石官印者家唯給軍賦他無有所與見漢書惠紀徙淮南王長制朕不忍致法于王其與列侯吏二千石議見史記淮南王傳漢書淮南王傳朕不忍致法於王其赦長死罪廢勿王同上計食長給肉日五斤酒二斗令故美人才得幸者十人從居他可同上增神祠制朕即位十三年於今賴宗廟之靈社稷之福方內艾安民人靡疾間者比歲登朕之不德何以饗此皆上帝諸神之賜也蓋聞古者饗其德必報其功欲有增諸神祠有司議增雍五畤路車各一乘駕被具西畤畦畤禺車各一乘禺馬四匹駕被具其河湫漢水加玉各二及諸祠各增廣壇場圭幣俎豆以差加之而祝釐者歸福於朕百姓不與焉自今祝致敬毋有所祈見史記封禪書又漢書文紀有詔與此小同即位赦詔制詔丞相太尉御史大夫間者諸呂用事擅權謀為大逆欲危劉氏宗廟賴將相列侯宗室大臣誅之皆伏其辜朕初即位其赦天下賜民爵一級女子百戶牛酒酺五日見漢書文紀封賜周勃等詔呂産自置為相國呂祿為上將軍擅矯遣灌將軍嬰將兵擊齊欲代劉氏嬰留滎陽弗擊與諸侯合謀以誅呂氏呂産欲為不善丞相陳平與太尉周勃謀奪呂産等軍朱虛侯劉章首先捕呂産等太尉身率襄平侯通持節承詔入北軍典客劉揭身奪趙王呂祿印益封太尉勃萬戶賜金五千斤丞相陳平灌將軍嬰邑各三千戶金二千斤朱虛侯劉章襄平侯通東牟侯劉興居邑各二千戶金千斤封典客揭為陽信侯賜金千斤見史記文紀又見漢書文紀首有前字答有司請建太子詔朕既不德上帝神明未饗也天下人民未有愜志今縱不能博求天下賢聖有德之人而嬗天下焉而曰豫建太子是重吾不德也謂天下何其安之見漢書文紀楚王季父也春秋高閲天下之義理多矣明於國家之大體吳王於朕兄也惠仁以好德淮南王弟也秉德以障朕豈為不豫哉諸侯王宗室昆弟有功臣多賢及有德義者若舉有以陪朕之不能終是社稷之靈天下之福也今不選舉焉而曰必子人其以朕為忘賢有德者而專於子非所以懮天下也朕甚不敢也見史記文紀漢書無惠仁句秉上有皆字振貸詔方春和時草木群生之物皆有以自樂而吾百姓鰥寡孤獨窮困之人或阽於死亡而莫之省懮為民父母將何如其議所以振貸之見漢書文紀養老詔老者非帛不曖非肉不飽今歲首不時使入存問長老又無布帛酒肉之賜將何以佐天下子孫孝養其親今聞吏稟當受鬻者或以陳粟豈稱養老之意哉具為令見漢書文紀修代來功詔方大臣誅諸呂迎朕朕狐疑皆止朕唯中尉宋昌勸朕朕已得保宗廟已尊昌為衛將軍其封昌為壯武侯諸從朕六人官皆至九卿見漢書文紀益封高帝從臣詔列侯從高帝入蜀漢者六十八人益戶各三百戶吏二千石已上從高帝潁川守尊等十人食邑六百戶淮陽守申屠嘉等十人五百戶叕尉足等十人四百戶封淮南王舅趙兼為周陽侯齊王舅駟鈞為靖郭侯見漢書文紀令列侯之國詔朕聞古者諸侯建國千餘各守其地以時入貢民不勞苦上下歡欣靡有違德今列侯多居長安邑遠吏卒給輸費苦而列侯亦無由教訓其民其令列侯之國為吏及詔所止者遣太子見漢書文紀日食求言詔朕聞之天生民為之置君以養治之人主不德布政不均則天示之災以戒不治乃十一月晦日有食之適見于天災孰大焉朕獲保宗廟以微眇之身託于士民君王之上天下治亂在豫一人唯二三執政猶吾股肱也朕下不能治育群生上以纍三光之明其不德大矣令至其悉思朕之過失及知見之所不及丐以啓告朕及舉賢良方正能直言極諫者以匡朕之不逮因各敕以職任務省繇費以便民朕既不能遠德故𢢀然念外人之有非是以設備未息今縱不能罷邊屯戍又飭兵厚衛其罷衛將軍軍太僕見馬遺財足餘皆以給傳置見漢書文紀開藉田詔夫農天下之本也其開藉田朕親率耕以給宗廟粢盛民謫作縣官及貸種食未入入未備者皆赦之見漢書文紀王辟強等詔前趙幽王幽死朕甚憐之已立其太子遂為趙王遂弟辟強及齊悼惠王子朱虛侯章東牟侯興居有功可王見漢書文紀除誹謗訞言法詔古之治天下朝有進善之旌誹謗之木所以通治道而來諫者也今法有誹謗訞言之罪是使衆臣不敢盡情而上無由聞過失也將何以來遠方之賢良其除之民或祝詛上以相約而後相謾吏以為大逆其有他言吏又以為誹謗此細民之愚無知抵死朕甚不取自今以來有犯此者勿聽治見漢書文紀議除連坐詔詔丞相太尉御史法者治之正所以禁暴而衛善人也今犯法者已論而使無罪之父母妻子同産坐之及收朕甚弗取其議見漢書刑法志紀作元年少首句朕聞之法正則民愨罪當則民從且夫牧民而道之以善者吏也既不能道又以不正之法罪之是法反害於民為暴者也朕未見其便宜孰計之同上周勃陳平奏以為如其故便文帝復曰勸農詔農天下之大本也民所恃以生也而民或不務本而事末故生不遂朕憂其然故今茲親率群臣農以勸之其賜天下民今年田租之半見漢書文紀卻獻千里馬詔鸞旗在前屬車在後吉行日五十里師行三十里朕乘千里之馬獨先安之見漢書賈捐之傳時有獻千里馬者詔云云朕不受獻也其令四方毋求來獻同上遣灌嬰擊胸奴詔漢與胸奴約為昆弟無侵害邊境所以輸遺胸奴甚厚今右賢王離其國將衆居河南地非常故往來入塞捕殺吏卒驅侵上郡保塞蠻夷令不得居其故陵轢邊吏入盜甚矝無道非約也其發邊吏車騎八萬詣高奴遣丞相灌嬰將擊右賢王見漢書胸奴傳復遣周勃率列侯之國詔前日朕遣列侯之國辭未行丞相朕之所重其為朕率列侯之國見漢書文紀又見周勃傳赦濟北吏民詔濟北王背德反上詿誤吏民為大逆濟北吏兵未至先自定及以軍城邑降者皆赦之復官爵與王興居去來者亦赦之見漢書文紀
