body:
  text: 文帝勸農詔道民之路在于務本朕親率天下農十年于今而野不加辟歲一不登民有飢色是從事焉尚寡而吏未加務也吾詔書數下歲勸民種樹而功未興是吏奉吾詔不勤而勸民不明也且吾農民甚苦而吏莫之省將何以勸焉其賜農民今年租稅之半見漢書文紀置三老孝悌力田常員詔孝悌天下之大順也力田為生之本也三老衆民之師也廉吏民之表也朕甚嘉此二三大夫之行今萬家之縣云無應令豈實人情是吏舉賢之道未備也其遣謁者勞賜三老孝者帛人五匹悌者力田二匹廉吏二百石以上率百石者三匹及問民所不便安而以戶口率置三老孝悌力田常員令各率其意以道民焉見漢書文紀耕桑詔朕親率天下農耕以供粢盛皇后親桑以奉祭服其具禮儀見漢書文紀除祕祝詔蓋聞天道禍自怨起而福繇德興百官之非宜由朕躬今祕祝之官移過于下以彰吾之不德朕甚不取其除之見史記文紀又見封禪書又見漢書郊祀志上皆刪節除肉刑詔制詔御史蓋聞有虞氏之時畫衣冠異章服以為戮而民弗犯何治之至也今法有肉刑三而奸不止其咎安在非乃朕德之薄而教不明與吾甚自愧故夫訓道不純而惠民陷焉詩曰悌弟君子民之父母今人有過教未施而刑已加焉或欲改行為善而道亡由至朕甚憐之夫刑至斷支體刻肌膚終身不息何甚刑之楚而不德也豈稱為民父母之意哉其除肉刑有以易之及今罪人各以輕重不亡逃有年而免具為令見漢書刑法志齊大倉令淳於公有罪當刑其少女緹縈上書天子憐其意遂下令勸農詔農天下之本務莫大焉今廑身從事而有租稅之賦是謂本末者無以異也其於勸農之道未備其除田之租稅賜天下孤寡布帛絮各有數見漢書文紀增祀無祈詔朕獲執犧牲圭幣以祀上帝宗廟十四年于今歷日彌長以不敏不明而久撫臨天下朕甚自愧其廣增諸祀壇場圭幣昔先王遠施不求其報望祀不祈其福右賢左戚先民後己至明之極也今吾聞祠官祝釐皆歸福於朕躬不為百姓朕甚愧之夫以朕之不德而專鄉獨美其福百姓不與焉是重吾不德也其令祠官致敬無有所祈見漢書文紀議郊祀詔有異物之神見於成紀毋害於民歲以有年朕幾郊祀上帝諸神禮官議毋諱以朕勞見漢書郊祀志上策賢良文學詔惟十有五年九月壬子皇帝曰昔者大禹勤求賢士施及方外四極之內舟車所至人迹所及靡不聞命以輔其不逮近者獻其明遠者通厥聰比善戮力以翼天子是以大禹能亡失德夏以長茂高皇帝親除大害去亂從並建豪英以為官師為諫爭輔天子之闕而翼戴漢宗也賴天之靈宗廟之福方內以安澤及四夷今朕獲執天下之正以承宗廟之祀朕既不德又不敏明弗能燭而智不能治此大夫之所著聞也故詔有司諸侯王王公九卿及主郡吏各帥其志以選賢良明於國家之大體通於人事之終始及能直言極諫者各有人數將以匡朕之不逮二三大夫之行當此三道朕其嘉之故登大夫於朝親諭朕志大夫其上三道之要及永惟朕之不德吏之不平政之不宣民之不寧四者之闕悉陳其志毋有所隱上以薦先帝之宗廟下以興愚民之休利著之於篇朕親覽焉觀大夫所以佐朕至與不至書之周之密之重之閉之興自朕躬大夫其正論毋枉執事烏乎戒之二三大夫其帥志毋怠見漢書朝錯傳求言詔間者數年比不登又有水旱疾疫之災朕甚憂之愚而不明未達其咎意者朕之政有所失而行有過與乃天道有不順地利或不得人事多失和鬼神廢不享與何以致此將百官之奉養或費無用之事或多與何其民食之寡乏也夫度田非益寡而計民未加益以口量地其於古猶有餘而食之甚不足者其咎安在無乃百姓之從事於末以害農者蕃為酒醪以靡穀者多六畜之食焉者衆與細大之義吾未能得其中其與丞相列侯吏二千石博士議之有可以佐百姓者率意遠思無有所隱見漢書文紀與胸奴和親詔朕既不明不能遠德使方外之國或不寧息夫四荒之外不安其生封圻之內勤勞不處二者之咎皆自於朕之德薄而不能達遠也間者纍年胸奴並暴邊境多殺吏民邊臣兵吏又不能諭其內志以重吾不德夫久結難連兵中外之國將何以自寧今朕夙興夜寐勤勞天下憂苦萬民為之惻怛不安未嘗一日忘於心故遣使者冠蓋相望結徹於道以諭朕志於單于今單于反古之道計社稷之安便萬民之利新與朕俱棄細過偕之大道結兄弟之義以全天下元元之民和親以定始于今年見漢書文紀與胸奴和親布告天下詔制詔御史胸奴大單于遺朕書和親已定亡人不足以益衆廣地胸奴無入塞漢無出塞犯今約者殺之可以久親後無咎俱便朕已許其布告天下使明知之見漢書胸奴傳遺詔朕聞之蓋天下萬物之萌生靡不有死死者天地之理物之自然奚可甚哀當今之時世咸嘉生而惡死厚葬以破業重服以傷生吾甚不取且朕既不德無以佐百姓今崩又使重服久臨以罹寒暑之數哀人父子傷長老之志損其飲食絶鬼神之祭祀以重吾不德謂天下何朕獲保宗廟以眇眇之身託于天下君王之上二十有餘年矣賴天之靈社稷之福方內安寧靡有兵革朕既不敏常畏過行以羞先帝之遺德惟年之久長懼于不終今乃幸以天年得復供養于高廟朕之不明與嘉之其奚哀念之有其令天下吏民令到出臨三日皆釋服無禁取婦嫁女祠祀飲酒食肉自當給喪事服臨者皆無踐絰帶無過三寸無布車及兵器無發民哭臨宮殿中殿中當臨者皆以旦夕各十五舉音禮畢罷非旦夕臨時禁無得擅哭以下服大紅十五日小紅十四日纖七日釋服它不在令中者皆以此令比類從事布告天下使明知朕意霸陵山川因其故無有所改歸夫人以下至少使見漢書文紀又見史記文紀宋書禮志二賜南粵王趙他書皇帝謹問南粵王甚苦心勞意朕高皇帝側室之子棄外奉北藩於代道里遼遠壅蔽朴愚未嘗致書高皇帝棄群臣孝惠皇帝即世高后自臨事不幸有疾日進不衰以故悖暴乎治諸呂為變故亂法不能獨制乃取它姓子為孝惠皇帝嗣賴宗廟之靈功臣之力誅之已畢朕以王侯吏不釋之故不得不立今即位乃者聞王遺將軍隆慮侯書求親昆弟請罷長沙兩將軍朕以王書罷將軍博陽親昆弟在真定者已遣人存問修治先人冢前日聞王發兵於邊為寇災不止當其時長沙苦之南郡尤甚雖王之國庸獨利乎必多殺士卒傷良將吏寡人之妻孤人之子獨人父母得一亡十朕不忍為也朕欲定地犬牙相入者以問吏吏曰高皇帝所以介長沙土也朕不能擅變焉吏曰得王之地不足以為大得王之財不足以為富服領以南王自治之雖然王之號為帝兩帝並立亡一乘之使以通其道是爭也爭而不讓仁者不為也願與王分棄前患終今以來通使如故故使賈馳諭告王朕意王亦受之毋為寇災矣上褚五十衣中褚三十衣下褚二十衣遺王願王聽樂娛憂存問鄰國見漢書兩粵傳遺胸奴書皇帝敬問胸奴大單于無恙使郎中系呼淺遺朕書曰右賢王不請聽後義盧侯難氏等計絶二主之約離兄弟之親漢以故不和鄰國不附今以小吏敗約故罰右賢王使西擊月氐盡定之願寢兵休士除前事復故約以安邊民世世平樂朕甚嘉之此古聖王之志也漢與胸奴約為兄弟所以遺單于甚厚背約離兄弟之親者常在胸奴然右賢王事已在赦前勿深誅單于若稱書意明告諸吏使無負約有信敬如單于書使者言單于自將伐國有功甚苦兵事服繡夾綺衣繡夾長襦錦夾袍各一比余一黃金飾具帶一黃金胥毗一繡十匹錦三十匹赤綈緑繒各四十匹使中大夫意謁者令肩遺單于見史記胸奴傳又見漢書胸奴傳少右賢王一段五十餘字餘亦小異璽書賜答朝錯皇帝問太子家令上書言兵體三章聞之書言狂夫之言而明主擇焉今則不然言者不狂而擇者不明國之大患故在於此使夫不明擇於不狂是以萬聽而萬不當也見漢書朝錯傳遺胸奴和親書皇帝敬聞胸奴大單于無恙使當戶且渠雕渠難郎中韓遼遺朕馬二匹已至敬受先帝制長城以北引弓之國受令單于長城以內冠帶之室朕亦制之使萬民耕織射獵衣食父子毋離臣主相安俱無暴虐今聞泄惡民貪降其趨背義絶約亡萬民之命離兩主之歡然其事已在前矣書云二國已和親兩主歡說寢兵休卒養馬世世昌樂翕然更始朕甚嘉之聖者日新改作更始使老者得息幼者得長各保其首領而終其天年朕與單于俱由此道順天恤民世世相傳施之苶窮天下莫不咸嘉漢與胸奴鄰敵之國胸奴處北地寒殺氣早降故詔吏遺單于秫蘗金帛綿絮它物歲有數今天下大安萬民熙熙獨朕與單于為之父母朕追念前事薄物細故謀臣計失皆不足以離昆弟之歡朕聞天不頗覆地不偏載朕與單于皆捐細故俱蹈大道墮壞前惡以圖長久使兩國之民若一家子元元萬民下及魚鱉上及飛鳥跂行喙息蠕動之類莫不就安利避危殆故來者不止天之道也俱去前事朕釋逃虜民單于毋言章尼等朕聞古之帝王約分明而不食言單于留志天下大安和親之後漢過不先單于其察之見史記胸奴傳漢書胸奴傳答陳武朕能任衣冠念不到此會呂氏之亂功臣宗室共不羞恥誤居焉位常戰戰栗栗恐事之不終且兵凶器雖克所願動亦耗病謂百姓遠方何又先帝知勞民不可煩故不以為意朕豈自謂能今胸奴內侵軍吏無功邊民父子荷兵日久朕常為動心傷痛無日忘之今未能銷距願且堅邊設候結和通使休寧北陲為功多矣且無議軍見史記律書孝文即位將軍陳武等議征南越朝鮮孝文曰云云按陳武即柴武史漢高帝紀秦二世三年遇剛武侯應劭曰武一姓柴韓王信傳漢使柴將軍擊之淮南王長傳與棘蒲侯柴武太子奇謀反是姓柴也而律書作陳武功臣侯表但有棘蒲侯陳武無柴武班固泗水亭碑十八侯銘亦然應劭漢人精通掌故謂武一姓柴得其實矣非諸注望文者所及也棘蒲十八侯銘作棘津當有一誤酎金律皇帝齊宿親師群臣承祠宗廟群臣宜分奉請諸侯列侯各以民口數率千口奉金四兩奇不滿十口至五百口亦四兩皆會酎少府受又大鴻臚食邑九真交址日南者用犀角長九寸以上若碡瑁甲一郁林用象牙長三尺以上若翡翠各二十准以當金見續漢禮儀志上注補引丁孚漢儀曰酎金律漢文所加以正月旦作酒八月成名酎酒因令諸侯助祭貢金引漢律金布令云云定孝文帝廟樂詔制詔御史蓋聞古者祖有功而宗有德制禮樂各有由聞歌者所以發德也舞者所以明功也高廟酎奏武德文始五行之舞孝惠廟酎奏文始五行之舞孝文皇帝臨天下通關梁不異遠方除誹謗去肉刑賞賜長老收恤孤獨以遂群生減耆欲不受獻罪人不帑不誅亡罪不私其利也除宮刑出美人重絶人之世也朕既不敏弗能勝識此皆上世之所不及而孝文皇帝親行之德厚侔天地利澤施四海靡不獲福明象乎日月而廟樂不稱朕甚懼焉其為孝文皇帝廟為昭德之舞以明休德然后祖宗之功德施于萬世永永無窮朕甚嘉之其與丞相列侯中二千石禮官具禮儀奏見史記文紀漢書景紀聽民徙寬大地詔間者歲比不登民多乏食夭絶天年朕甚痛之郡國或磽狹無所農桑系畜或地饒廣薦草莽水泉利而不得徙其議民欲徙寬大地者聽之見漢書景紀議著令詔吏受所監臨以飲食免重受財物賤買貴賣論輕廷尉與丞相更議著令見漢書景紀減笞詔加笞與重罪無異幸而不死不可為人其定律笞五百曰三百笞三百曰二百見漢書刑法志封蕭何孫嘉詔制詔御史故相國蕭何高皇帝大功臣所與為天下也今其祀絶朕甚憐之其以武陽縣戶二千封何孫嘉為列侯見漢書蕭何傳原襄平侯紀嘉詔襄平侯嘉子恢說不孝謀反欲以殺嘉大逆無道其赦嘉為襄平侯及妻子當坐者復故爵論恢說及妻子如法見漢書景紀擊七國詔制詔將軍蓋聞為善者天報以福為非者天報以殃高皇帝親垂功德建立諸侯幽王悼惠王絶無後孝文皇帝哀憐加惠王幽王子遂悼惠王子卬等令奉其先王宗廟為漢藩國德配天地明並日月而吳王濞背德反義誘受天下亡命罪人亂天下幣稱疾不朝二十餘年有司數請濞罪孝文皇帝寬之欲其改行為善今乃與楚王戊趙王遂膠西王卬濟南王辟光菑川王賢膠東王雄渠約從謀反為逆無道起兵以危宗廟賊殺大臣及漢使者迫劫萬民伐殺無罪燒殘民家掘其丘壟甚為虐暴而卬等又重逆無道燒宗廟鹵御物朕甚痛之朕素服避正殿將軍其勸士大夫擊反虜擊反虜者深入多殺為功斬首捕虜比三百石以上皆殺無有所置敢有議詔及不如詔者皆要斬見漢書吳王濞傳赦吳吏民詔乃者吳王濞等為逆起兵相脅詿誤吏民吏民不得已今濞等已滅吏民當坐濞等及逋逃亡軍者皆赦之楚元王子藝等與濞等為逆朕不忍加法除其籍毋令汙宗室見漢書景紀讞獄詔法令度量所以禁暴止邪也獄人之大命死者不可復生吏或不奉法令以貨賂為市朋黨比周以苛為察以刻為明令亡罪者失職朕甚憐之有罪者不伏罪奸法為暴甚亡謂也諸獄疑若雖文致於法而於人心不厭者輒讞之見漢書景紀又略見刑法志定長吏車服詔夫吏者民之師也車駕衣服宜稱吏六百石以上皆長吏也亡度者或不吏服出入閭里與民亡異令長吏二千石車朱兩轓千石至六百石朱左轓車騎從者不稱其官衣服下吏出入閭巷亡吏體者二千石上其官屬三輔舉不如法令者皆上丞相御史請之見漢書景紀減笞法詔加笞者或至死而笞未畢朕甚憐之其減笞三百曰二百笞二百曰一百見漢書刑法志詔定箠令笞者所以教之也其定箠令見漢書刑法志獻獄詔獄重事也人有智愚官有上下獄疑者讞有司有司所不能決移廷尉有令讞刑法志作獄疑者讞有令讞者已報讞而後不當讞者不為失欲令治獄者務先寬見漢書景紀令二千石修職詔雕文刻鏤傷農事者也錦繡纂組害女紅者也農事傷則飢之本也女紅害則寒之原也夫飢寒並至而能亡為非者寡矣朕親耕后親桑以奉宗廟粢盛祭服為天下先不受獻減太官省徭賦欲天下務農蠶素有畜積以備災害彊毋攘弱衆毋暴寡老耆以壽終幼孤得遂長今歲或不登民食頗寡其咎安在或詐僞為吏吏以貨賂為市漁奪百姓侵牟萬民縣丞長吏也奸法與盜盜甚無謂也其令二千石修其職不事官職耗亂者丞相以聞請其罪布告天下使明知朕意見漢書景紀重廉士詔人不患其不知患其為詐也不患其不勇患其為暴也不患其不富患其亡厭也其唯廉士寡欲易足今訾算十以上乃得宦一本官作宦下皆同廉士算不必衆有市籍不得宦無訾又不得宦朕甚愍之訾算四得宦亡令廉士久失職貪夫長利見漢書景紀頌擊老幼詔高年老長人所尊敬也鰥寡不屬逮者人所哀憐也其著令年八十以上八歲以下及孕者未乳師朱儒當鞠繫者頌繫之見漢書刑法志勸農桑詔農天下之本也黃金珠玉飢不可食寒不可衣以為幣用不識其終始間歲或不登意為末者衆農民寡也其令郡國務勸農桑益種樹可得衣食物吏發民若取庸采黃金珠玉者坐臧為盜二千石聽者與同罪見漢書景紀
