body:
  text: 武帝李夫人賦美連娟以修嫮兮命樔絶而不長飾新宮以延貯兮泯不歸乎故鄉慘鬱鬱其蕪穢兮隱處幽而懷傷釋輿馬於山椒兮奄修夜之不陽秋氣憯以淒淚兮桂枝落而銷亡神煢煢以遙思兮精浮游而出疆託沈陰以壙久兮惜蕃華之未央念窮極之不還兮惟幼眇之相羊函荾荴以俟風兮芳雜襲以彌章的容與以猗靡兮縹飄姚呼愈莊燕淫衍而撫楹兮連流視而娥揚既激感而心逐兮包紅顏而弗明歡接狎以離別兮宵寤夢之芒芒忽遷化而不反兮魄放逸以飛揚何靈魂之紛紛兮哀裴回以躊躇勢路日以遠兮遂荒忽而辭去超兮西征屑兮不見寖淫敞𦬺寂兮無音思若流波怛兮在心亂曰佳俠函光隕朱榮兮嫉妒闟茸將安程兮方時隆盛年夭傷兮弟子增欷汙沫悵兮悲愁於邑喧不可止兮嚮不虛應亦云已兮嫶妍太息嘆稚子兮懰栗不言倚所恃兮仁者不誓豈約親兮既往不來申以信兮去彼昭昭就冥冥兮既下新宮不復故庭兮鳴呼哀哉想魂靈兮見漢書外戚傳藝文類聚三十四秋風辭並序上行幸河東祠后土顧視帝京欣然中流與群臣飲燕上勸甚乃自作秋風辭曰秋風起兮白雲飛草木黃落兮雁南歸蘭有秀兮菊有芳攜佳人兮不能忘泛樓船兮濟汾河橫中流兮揚素波簫鼓鳴兮發棹歌歡樂極兮哀情多少壯幾時兮奈老何見文選詔封皇子制蓋聞周封八百姬姓並列或子男附庸禮支子不祭云並建諸侯所以重社稷朕無聞焉且天非為君生民也朕之不德海內未洽乃以未教成者彊君連城即股肱何勸其更議以列侯家之見史記三王世家封皇子制康叔親屬有十而獨尊者褒有德也周公祭天命郊故魯有白牡騂剛之牲群公不毛賢不肖差也高山仰之景行嚮之朕甚慕焉所以抑未成家以列侯可見史記三王世家立皇子閎為齊王旦為燕王胥為廣陵王見史記三王世家制書報胡建制曰司馬法曰國容不入軍軍容不入國何文吏也三王或誓於軍中欲民先成其慮也或誓於軍門之外欲民先意以待事也或將交刃而誓致民志也建又何疑焉見漢書胡建傳又略見說苑指武元光元年策賢良制制曰朕獲承至尊休德傳之亡窮而施之罔極任大而守重是以夙夜不皇康寧永惟萬事之統猶懼有闕故廣延四方之豪俊郡國諸侯公選賢良修潔博習之士欲聞大道之要至論之極今子大夫褎然為舉首朕甚嘉之子大夫其精心致思朕垂聽而問焉蓋聞五帝三王之道改制作樂而天下洽和百王同之當虞氏之樂莫盛於韶於周莫盛於勺聖王已沒鐘鼓管絃之聲未衰而大道微缺陵夷至呼桀紂之行王道大壞矣夫五百年之間守文之君當塗之士欲則先王之法以戴翼其世者甚衆然猶不能反日以仆滅至後王而後止豈其所持操或悖繆而失其統與固天降命不可復反必推之於大衰而後息與烏乎凡所為屑屑夙興夜寐務法上古者又將無補與三代受命其符安在災異之變何緣而起性命之情或夭或壽或仁或鄙習聞其號未燭厥理伊欲風流而令行刑輕而姦改百姓和樂政事宣昭何修何飭而膏露降百穀登德潤四海澤臻草木三光全寒暑平受天之祐享鬼神之靈德澤洋溢施呼方外延及群生子大夫明先聖之業習俗化之變終始之序講聞高誼之日久矣其明以諭朕科別其條勿猥勿并取之於術慎其所出乃其不正不直不忠不極枉于執事書之不泄興于朕躬毋悼後害子大夫其盡心靡有所隱朕將親覽焉見漢書董仲舒傳制曰蓋聞虞舜之時游於巖郎之上垂拱無為而天下太平周文王至於日昃不暇食而宇內亦治夫帝王之道豈不同條共貫與何逸勞之殊也蓋儉者不造玄黃旌旗之飾及至周室設兩觀乘大路朱干玉戚八佾陳於庭而頌聲興夫帝王之道豈異指哉或曰良玉不琢又曰非文無以輔德二端異焉殷人執五刑以督奸傷肌膚以懲惡成康不式四十餘年天下不犯囹圄空虛秦國用之死者甚衆刑者相望耗矣哀哉烏乎朕夙寤晨興惟前帝王之憲永思所以奉至尊章洪業皆在力本任賢今朕親耕藉田以為農先勸孝弟崇有德使者冠蓋相望問勤勞恤孤獨盡思極神功烈休德未始云獲也今陰陽錯繆氛氣充塞群生寡遂黎民未濟廉恥貿亂賢不肖渾殽未得其真故詳延特起之士庶幾乎今子大夫待詔百有餘人或道世務而未濟稽諸上古之不同考之于今而難行毋乃牽於文繫而不得騁與將所繇異術所聞殊方與各悉對著于篇毋諱有司明其指略切磋究之以稱朕意同上制曰蓋聞善言天者必有徵於人善言古者必有驗於今故朕垂問乎天人之應上嘉唐虞下悼桀紂寖微寖滅寖明寖昌之道虛心以改今子大夫明於陰陽所以造化習於先聖之道業然而文采未極豈惑呼當世之務哉條貫靡竟統紀未終意朕之不明與聽若眩與夫三王之教所祖不同而皆有失或謂久而不易者道也意豈異哉今子大夫既已著大道之極陳治亂之端矣其悉之究之孰之復之詩不云呼嗟爾君子毋常安息神之聽之介爾景福朕將親覽焉子大夫其茂明之同上元光五年策賢良制制曰蓋聞上古至治畫衣冠異章服而民不犯陰陽和五穀登六畜蕃甘露降風雨時嘉禾興朱草生山不童澤不涸麟鳳在郊藪龜龍游於沼河洛出圖書父不喪子兄不哭弟北發渠搜南撫交址舟車所至人迹所及跂行喙息咸得其宜朕其嘉之今何道而臻乎此子大夫修先聖之術明君臣之義講論洽聞有聲乎當世敢問子大夫天人之道何所本始吉凶之效安所期焉禹湯水旱厥咎何由仁義禮知四者之宜當安設施屬統垂業物鬼變化天命之符廢興何如天文地理人事之紀子大夫習焉其悉意正議詳具其對著之于篇朕將親覽焉靡有所隱漢書公孫弘傳復高年子孫詔古之立教鄉里以齒朝廷以爵扶世導民莫善於德然則於鄉里先耆艾奉高年古之道也今天下孝子順孫願自竭盡以承其親外迫公事內乏資財是以孝心闕焉朕甚哀之民年九十以上已有受鬻法為復子若孫令得身帥妻妾遂其供養之事見漢書武紀修山川祠詔河海潤千里其令祠官修山川之祠為歲事曲加禮見漢書武紀省衛士罷苑馬詔衛士轉置送迎二萬人其省萬人罷苑馬以賜貧民見漢書武紀案文館詞林題如此漢書不云詔皇帝問淮南王使中大夫玉上書言事聞之朕奉先帝之休德夙興夜寐明不能燭重以不德是以比年凶菑害衆夫以眇之身託于王侯之上內有飢寒之民南夷相攘使邊騷然不安朕甚懼焉今王深惟重慮明太平以弼朕失稱三代至盛際天接地人迹所及咸盡賓服藐然甚慚嘉王之意靡有所終使中大夫助諭朕意告王越事見漢書嚴助傳又見文館詞林六百六十二詔罷王恢韓安國兵郢等首惡獨無諸孫繇君丑不與謀焉見史記東越傳漢書兩粵傳詔賢良朕聞昔在唐虞畫象而民不犯日月所燭莫不率俾周之成康刑錯不用德及鳥獸教通四海海外肅慎北發渠搜氐羌徠服星辰不孛日月不蝕山陵不崩川谷不塞麟鳳在郊藪河洛出圖書嗚乎何施而臻此與今朕獲奉宗廟夙興以求夜寐以思若涉淵水未知所濟猗與偉與何行而可以章先帝之洪業休德上參堯舜下配三王朕之不敏不能遠德此子大夫之所睹聞也賢良明於古今王事之體受策察問咸以書對著之於篇朕親覽焉見漢書武紀于是董仲舒公孫弘等出焉案文館詞林題如此朕飾子女以配單于金幣文繡賂之甚厚單于待命加嫚侵盜亡已邊境被害朕甚閔之今欲舉兵攻之何如見漢書武紀詔問公卿又見文館詞林六百六十二篇首有制詔二字赦雁門代郡軍士詔夷狄無義所從來久間者胸奴數寇邊境故遣將撫師古者治兵振旅因遭虜之方入將吏新會上下未輯代郡將軍敖雁門將軍廣所任不肖校尉又背義妄行棄軍而北少吏犯禁用兵之法不勤不教將率之過也教令宣明不能盡力士率之罪也將軍已下廷尉使理正之而又加法於士卒二者並行非仁聖之心朕閔衆庶陷害欲刷恥改行復奉正義厥路亡由其赦雁門代郡軍士不循法者見漢書武紀議不舉孝廉者罪詔公卿大夫所使總方略一統類廣教化美風俗也夫本仁祖義褒德祿賢勸善刑暴五帝三王所由昌也朕夙興夜寐嘉與宇內之士臻於斯路故旅耆老復孝敬選豪俊講文學稽參政事祈進民心深詔執事興廉舉孝庶幾成風紹休聖緒夫十室之邑必有忠信三人並行厥有我師今或至闔郡而不薦一人是化不下究而積行之君子雍於上聞也二千石官長紀綱人倫將何以佐朕燭幽隱勸元元厲蒸庶崇鄉黨之訓哉且進賢受上賞蔽賢蒙顯戮古之道也其與中二千石禮官博士議不舉者罪見漢書武紀赦詔朕聞天地不變不成施化陰陽不變物不暢茂易曰通其變使民不倦詩云九變復貫知言之選朕嘉唐虞而樂殷周據舊以鑒新其赦天下與民更始諸逋貸及辭訟在孝景後三年已前皆勿聽治見漢書武紀許諸侯王分子弟邑詔梁王城陽王親慈同生願以邑分弟其許之諸侯王請與子弟邑者朕將親覽使有列位焉見漢書武紀制詔御史諸侯王或欲推私恩分子弟邑者令各條上朕且臨定其號名見赦詔夫刑罰所以防奸也內長文所以見愛也以百姓之未洽于教化朕嘉與士大夫日新厥業祗而不解其赦天下見漢書武紀封公孫弘為平津侯詔朕嘉先聖之道開廣門路宣招四方之士蓋古者任賢而序位量能以授官勞大者厥祿厚德盛者獲爵尊故武功以顯重而文德以行褒其以高成之平津鄉戶六百五十封丞相弘為平津侯見漢書公孫弘傳詔御史封公孫敖等護軍都尉公孫敖三從大將軍擊胸奴常護軍傅校獲王封敖為合騎侯都尉韓說從大軍出填渾至胸奴右賢王庭為戲下搏戰獲王封說為龍額侯騎將軍賀從大將軍獲王封賀為南窖侯輕車將軍李蔡再從大將軍獲王封蔡為樂安侯校尉李朔趙不虞公孫戎奴各三從大將軍獲王封朔為陟軹侯以千三百戶封不虞為隨成侯以千三百戶封戎奴為從平侯將軍李沮李息乃校尉豆如意中郎將綰皆有功賜爵關內侯食邑各三百戶見史記衛青傳漢書衛青傳勸學詔蓋聞導民以禮風之以樂婚姻者居室之大倫也今禮壞一作廢樂崩朕甚閔一作愍焉故詳延天下方聞之士咸薦一作登諸朝其令禮官勸學講議洽聞舉遺興禮以為天下先太常其議豫博士弟子崇鄉黨之化以厲賢材焉見漢書武紀又見儒林序傳議置武功馳賞官詔朕聞五帝不相復禮三代不同法所繇殊路而建德一也蓋孔子對定公以徠遠哀公以論臣景公以節用非期不同所急異務也今中國一統而北邊未安朕甚悼之日者大將軍巡朔方征胸奴斬首虜萬八千級諸禁錮及有過者咸蒙厚賞得免減罪今大將軍仍復克獲斬首虜萬九千級受爵賞而欲移賣者無所流貤其議為令見漢書武紀又見史記平準書有刪節而文多異今別載於後朕聞五帝之教不相復而治禹湯之法不同道而王所由殊路而建德一也北邊未安朕甚悼之日者大將軍攻胸奴斬首虜萬九千級留蹛無所食議令民得買爵及贖禁錮免減罪見史記平準書遣謁者巡行天下詔朕聞咎繇對禹曰在知人知人則哲惟帝難之蓋君者心也民猶支體支體傷則心憯怛日者淮南衡山修文學流貨賂兩國接壤怵于邪說而造篡弒此朕之不德詩云憂心慘慘念國之為虐已赦天下滌除與之更始朕嘉孝弟力田哀夫老眊孤寡鰥獨或匱于衣食甚憐愍焉其遣謁者巡行天下存問致賜曰皇帝使謁者賜縣三老孝者帛人五匹鄉三老弟者力田帛人三匹年九十以上及鰥寡孤獨帛人二匹絮三斤八十以上米人二石有冤失職使者以聞縣鄉即賜母贅聚見漢書武紀詔封蕭何曾孫詔御史以酇戶二千四百封何曾孫慶為酇侯布告天下令明知朕報蕭相國德也見漢書蕭何傳遣博士褚大等循行天下詔日者有司以幣輕多奸農傷而末衆又禁兼并之塗故改幣以約之稽諸往古制宜於今廢期有月而山澤之民未諭夫仁行而從善義立則俗易意奉憲者所以導之未明與將百姓所安殊路而嬌虔吏因乘勢以侵蒸庶邪何紛然其擾也今遣博士大等六人分循行天下存問鰥寡廢疾無以自振業者貸與之諭三老孝弟以為民師舉獨行之君子徵詣行在所朕嘉賢者樂知其人廣宣厥道士有特招使者之任也詳問隱處亡位及冤失職奸猾為害野荒治苛者舉奏郡國有所以為便者上丞相御史以聞見漢書武紀振流民詔江南火耕水耨令飢民得流就食江淮間欲留留處遣使冠蓋相屬于道護之下巴蜀粟以振之見遣博士循行振飢詔仁不異遠義不辭難今京師雖未為豐年山林池澤之饒與民共之今水潦移于江南迫隆冬至朕懼其飢寒不活江南之地火耕水耨方下巴蜀之粟致之江陵遣博士中等分循行諭告所抵無令重困吏民有振救飢民免其厄者具舉以聞見漢書武紀封周子南君詔三代邈絶遠矣難存其以三十里地封周後為周子南君以奉其先祀焉見史記封禪書祭地冀州瞻望河洛巡省豫州觀干周室邈而無祀詢問耆老乃得孽子嘉其封嘉為周子南君以奉周祀見漢書武紀封欒大為樂通侯詔制詔御史昔禹疏九河決四瀆間者河溢皋陸隄繇不息朕臨天下二十有八年天若遺朕士而大通焉乾稱飛龍鴻漸于般朕意庶幾與焉其以二千戶封地士將軍大為樂通侯賜列侯甲第僮千人乘輿斥車馬帷帳器物以充其家見史記封禪書漢書郊祀志上郊祠泰畤詔朕以眇身托于王侯之上德未能綏民民或飢寒故巡祭后土以祈豐年冀州脽壤乃顯文鼎獲薦於廟渥窪水出馬朕其御焉戰戰兢兢懼不克任思昭天地內惟自新詩云四牡翼翼以征不服親省邊垂用事所極望見泰一修天文禪辛卯夜若景光十有二明易曰先甲三日後甲三日朕甚念年歲未咸登飭躬齊戒丁酉拜況于郊見漢書武紀封常山王二子詔常山憲王早夭后妾不和適孽誣爭陷于不誼以滅國朕甚閔焉其封憲王子平三萬戶為真定王子商三萬戶為泗水王見史記五宗世家漢書景十三王常山王傳征南粵詔天子微弱諸侯力政譏臣不討賊呂嘉建德等反自立晏如令粵人及江淮以南樓船十萬師往討之見漢書南粵傳乃赦天下曰云云又史記南越王尉他傳無弱字呂喜上有今字粵人作罪人以石慶為丞相詔制詔御史萬石君先帝尊之子孫至孝其以御史大夫慶為丞相封牧丘侯見漢書石奮傳賜卜式爵詔朕聞報德以德報怨以直今天下不幸有事郡縣諸侯未有奮繇直道者也齊相雅行躬耕隨牧蓄番輒分昆弟更造不為利惑日者北邊有興上書助官往年西河歲惡率齊人入粟今又首奮雖未戰可謂義形於內矣其賜式爵關內侯黃金四百十斤田十頃布告天下使明知之見漢書卜式傳又略見史記平準書小異減內史稻田租挈詔農天下之本也泉流灌寖所以育五穀也左右內史地名山川原甚衆細民未知其利故為通溝瀆畜陂澤所以備旱也今內史稻田租挈重不與郡同其議減令吏民勉農盡地利平徭行水勿使失時見漢書溝洫志
