body:
  text: 武帝增太室祠詔朕用事華山至於中嶽獲駮麃見夏后啓母石翌日親登嵩高御史乘屬在廟旁吏卒咸聞呼萬歲者三登禮罔不答其令祠官加增太室祠禁無伐其草木以山下戶三百為之奉邑名曰崇高獨給祠復亡所與見漢書武紀改元大赦詔制詔御史朕以眇眇之身承至尊兢兢焉懼不任維德菲薄不明于禮樂修祠太一若有象景光㞕如有望此三語漢書作故用事八神遭天地況施著見景象然如有聞震於怪物欲止不敢遂登封太山至于梁父而後禪肅然自新嘉與士大夫更始此下漢書有其以十月為元封元年賜民百戶牛一酒十石加年八十孤寡布帛二匹復博奉高蛇丘歷城無出今年租稅其大赦天下如乙卯赦令行所過毋有復作事在二年前皆勿聽治見史記封禪書又褚補武紀作依依震於怪物又略見漢書武紀令諸侯治邸泰山下詔古者天子五載一巡狩用事泰山諸侯有朝宿地其令諸侯各治邸泰山下見漢書郊祀志上與奉車子侯家詔春時子侯於北館與家別見初學記十八離別門帝與子侯家語云道士皆言子侯仙去不足悲見史記封禪書索隱顧胤案武帝集巡邊詔南越東甌咸伏其辜西蠻北夷頗未輯睦朕將巡邊垂擇兵振旅躬秉武節置十二部將軍親帥師焉見漢書武紀遷東越民詔東越險阻反覆為後世患遷其民於江淮間見漢書武紀産芝赦詔泉宮內中産芝九莖連葉上帝博臨不異下房賜朕弘休其赦天下賜雲陽都百戶牛酒見漢書武紀尊祠靈星詔天旱意乾封乎其令天下尊祠靈星焉見漢書郊祀志下祠后土詔朕躬祭后土地祇見光集于靈壇一夜三燭幸中都宮殿上見光其赦汾陰夏陽中都死罪以下賜三縣及楊氏皆無出今年租賦見漢書武紀增封泰山詔朕巡荊揚輯江淮物會大海氣以合泰山上天見象增修封禪其赦天下所幸縣毋出今年租賦賜鰥寡孤獨帛貧窮者粟見漢書武紀求賢詔蓋有非常之功必待非常之人故馬或奔踶而致千里士或有負俗之纍而立功名夫泛駕之馬跅弛之士亦在御之而已其令州郡察吏民有茂材異等可為相及使絶國者見漢書武紀禮首山祠后土詔朕禮首山昆田出珍物化或為黃金祭后土神光三燭其赦汾陰殊死以下賜天下貧民布帛人一匹見漢書武紀定禮儀詔制詔御史曰蓋受命而王各有所由興殊路而同歸謂因民而作追俗為制也議者咸稱太古百姓何望漢亦一家之事典法不傳謂子孫何化隆者閎博治淺者褊狹可不勉與見史記禮書詔兒寬與博士共議今宜何以為正朔服色合上見漢書律曆志上定正朔改元太初詔乃者有司言星度之未定也廣延宣問以理星度未能詹也蓋聞昔者黃帝合而不死名察度驗定清濁起五部建氣物分數然蓋尚矣書缺樂弛朕甚閔焉朕唯未能循明也紬績日分率應水德之勝今日順夏至黃鐘為宮林鐘為徵太蔟為商南呂為羽姑洗為角自是以後氣復正羽聲復清名復正變以至子日當冬至則陰陽離合之道行焉十一月甲子朔旦冬至已詹其更以七年為太初元年年名焉逢攝提格月名畢聚日得甲子夜半朔旦冬至見史記曆書又略見漢書律歷志上幸河東詔朕用事介山祭后土皆有光應其赦汾陰安邑殊死以下見漢書武紀封李廣利為海西侯詔胸奴為害久矣今雖徙幕北與旁國謀共要絶大月氏使遮殺中郎將江故雁門守攘危須以西乃宛皆合約殺期門車令中郎將朝及身毒國使隔東西道二師將軍廣利征討厥罪伐勝大宛賴天之靈從泝河山涉流沙通西海山雪不積士大夫徑度獲王首虜珍怪之物畢陳於闕其封廣利為海西侯食邑八千戶見漢書李廣利傳擊胸奴詔高皇帝遺朕平城之憂高后時單于書絶悖逆昔齊襄公復九世之仇春秋大之見漢書胸奴傳詔路博德強弩都尉路博德將兵半道迎陵軍見漢書李陵傳吾欲豫李陵騎云欲以少擊衆今虜入西河其引兵走西河遮鉤營之道同上詔李陵以九月發出遮虜鄣至東浚稽山南龍勒水上徘徊觀虜即亡所見從浞野侯趙破奴故道抵受降城休士因騎置以聞所與博德言者云何具以書對見漢書李陵傳詔關都尉今豪傑多遠交依東方群盜其謹察出入者見漢書武紀改鑄黃金詔有司議曰往者朕郊見上帝西登隴首獲白麟以饋宗廟渥窪水出天馬泰山見黃金宜改故名今更黃金為麟趾裊蹄以協瑞焉見漢書武紀以劉屈氂為左丞相詔制詔御史故丞相賀倚舊故乘高劫而為邪興美田以利子弟賓客不顧元元無益邊穀貨賂上流朕忍之久矣終不自革柔以邊為援使內郡自省作車又令耕者自轉以困農煩擾畜者重馬傷耗武備衰減下吏妄賦百姓流亡又詐為詔書以姦傳朱安世獄已正於理其以涿郡太守屈氂為左丞相分丞相長史為兩府以待天下遠方之選夫親親任賢周唐之道也以澎戶二千二百封左丞相為澎侯見漢書劉屈氂傳封李壽張富昌詔蓋行疑賞所以申信也其封李壽為邘侯張富昌為題侯見漢書戾太子傳以劉去為廣川王詔廣川惠王於朕為兄朕不忍絶其宗廟其以惠王孫去為廣川王見漢書景十三王傳案後漢書注作元年非前有司奏欲益民賦三十助邊用是重困老弱孤獨也而今又請遣卒田輪臺輪臺西於車師千餘里前開陵侯擊車師時危須尉犁樓蘭六國子弟在京師者皆先歸發畜食迎漢軍又自發兵凡數萬人王各自將共圍車師降其王諸國兵便罷力不能復至道上食漢軍漢軍破城食至多然士自載不足以竟師彊者盡食畜産羸者道死數千人朕發酒泉驢橐駝負食出玉門迎軍吏卒起張掖不甚遠然尚廝留甚衆曩者朕之不明以軍侯弘上書言胸奴縛馬前後足置城下馳言秦人我丐若馬又漢使者久留不還故興遣二師將軍欲以為使者威重也古者卿大夫與謀參以蓍龜不吉不行乃者以縛馬書遍視丞相御史二千石諸大夫郎為文學者乃至郡屬國都尉成忠趙破奴等皆以虜自縛其馬不祥甚哉或以為欲以見彊夫不足者視人有餘易之卦得大過爻在九五胸奴困敗公車方士太史治星望氣及太卜龜蓍皆以為吉胸奴必破時不可再得也又曰北伐行將於釜山必克卦諸將二師最吉故朕親發二師下釜山詔之必毋深入今計謀卦兆皆反繆重合侯得虜侯者言聞漢軍當來胸奴使巫埋羊牛所出諸道及水上以詛軍單于遺天子馬裘常使巫祝之縛馬者詛軍事也又卜漢軍一將不吉胸奴常言漢極大然不能飢渴失一狼走千羊乃者二師敗軍士死略離散悲痛常在朕心今請遠田輪臺欲起亭隧是擾勞天下非所以優民也今朕不忍聞大鴻臚等又議欲募囚徒送胸奴使者明封侯之賞報忿五伯所弗能為也且胸奴得漢降者常提掖搜索問以所聞今邊塞未正闌出不禁障候長吏使卒獵獸以皮肉為利卒苦而烽火乏失亦上集不得後降者來若捕生口虜乃知之當今務在禁苛暴止擅賦力本農修馬復令以補缺毋乏武備而已郡國二丈石各上進畜馬方力略補邊狀與計對見漢書西域下渠犁城傳搜粟都尉桑弘羊與丞相御史奏田輪台上乃下詔深陳既往之悔由是不復出軍又略見後漢樊准傳注赦詔朕郊見上帝巡于北邊見群鶴留止以不羅罔靡所獲獻薦于泰畤光景並見其赦天下見漢書武紀力農詔方今之務在於力農以趙過為搜粟都尉見漢書食貨志以下十四首皆不云詔胸奴逆天理亂人倫暴長虐老以盜竊為務行詐諸蠻夷造謀籍兵數為邊害故興師遣將以征厥罪詩不云乎薄伐獫允至于太原出車彭彭城彼朔方今車騎將軍青度西河至高闕獲首二千三百級車輜畜産畢收為鹵已封為列侯遂西定河南地案榆溪舊塞絶梓領梁北河討蒲泥破符離斬輕鋭之卒捕伏聽者三千一十七級執訊獲醜驅馬牛羊百有餘萬全甲兵而還益封青三千八百戶見漢書衛青傳又益封衛青大將軍青躬率戎士師大捷獲胸奴王十有餘人益封青八千七百戶同上削梁王地首惡失道任后也朕置相吏不逮無以輔王故陷不誼不忍致法削梁王五縣奪王太后湯沐成陽邑梟任后首于市見漢書梁平王襄傳封霍去病等票姚校尉去病斬首捕虜二千二十八級得相國當戶斬單于大父行藉若侯産捕季父羅姑比再冠軍以二千五百戶封去病為冠軍侯上谷太守郝賢四從大將軍捕首虜千三百級封賢為終利侯騎士孟已有功賜爵關內侯邑二百戶見史記衛青霍去病傳漢書霍去病傳議后土祀今上帝朕親郊而后土無祀則禮不答也見史記封禪書漢書郊祀志上益封霍去病票騎將軍率戎士隃烏盩討遫濮涉狐奴歷五王國輜重人衆攝讋者弗取幾獲單于子轉戰六日過焉支山千有餘里合短兵鏖皋蘭下殺折蘭王斬盧侯王鋭悍者誅全甲獲醜執渾邪王子及相國都尉捷首虜八千九百六十級收休屠祭天金人師率減什七益封去病二千二百戶見漢書霍去病傳又史記衛霍傳少十餘字又益封霍去病票騎將軍涉鈞耆濟居延遂臻小月氏攻祁連山揚武乎鱳得得單于單桓酋涂王及相國都尉以衆降下者二千五百人可謂能舍服知成而止矣捷首虜三萬二百獲五王王母單于閼氏王子五十九人相國將軍當戶都尉六十三人師大率減什三益封去病五千四百戶賜校尉從至小月氏者爵左庶長鷹擊司馬破奴再從票騎將軍斬遫濮王捕稽且王右千騎將得王王母各一人王子以下四十一人捕虜三千三百三十人前行捕虜千四百人封破奴為從票侯校尉高不識從票騎將軍捕呼于耆王王子以下十一人捕虜千七百六十八人以千一百戶封不識為宜冠侯校尉僕多有功封為輝渠侯見漢書霍去病傳又略見史記衛霍傳渾邪王降益封霍去病票騎將軍去病率師征胸奴西域王渾邪王及厥衆萌咸相奔率以軍糧接食并將控弦萬有餘人誅獟悍捷首虜八千餘級降異國之王三十二人戰士不離傷十萬之衆畢懷集服仍興之勞爰及河塞庶幾亡患幸既永綏矣以千七百戶益封票騎將軍減隴西北地上郡戍卒之半以寬天下之徭見史記衛霍傳又漢書霍去傳少幸既永綏矣一語益封霍去病票騎將軍去病率師躬將所獲葷允之士約輕齎絶大幕涉獲單于章渠以誅北車耆轉擊左大將雙斬獲旗鼓歷度難侯見漢書作歷度難侯濟弓閭獲屯頭王韓王等三人將軍相國當戶都尉八十三人封狼居胥山襌於姑衍登臨翰海執訊獲醜七萬有四百四十三級師率減什三取食於敵卓行殊遠而糧不絶以五千八百戶益封票騎將軍右北平太守路博德屬票騎將軍會興城不失期從至檮余山斬首捕虜二千八百級封博德為邳離侯北地都尉邢山從票騎將軍獲王封山為義陽侯故歸義侯因淳王復陸支樓剸王伊即靬皆從票騎將軍有功封復陸支為杜侯伊即靬為衆利侯從票侯破奴昌武侯安稽從票騎有功益封各三百戶漁陽太守解校尉敢皆獲鼓旗賜爵關內侯解食邑三百戶敢二百戶校尉自為爵左庶長見史記衛霍傳漢書霍去病傳得寶鼎閒者河溢歲數不登故巡祭后土祈為百姓育穀今年豐楙未報鼎曷為出哉見漢書郊祀志上朕巡祭后土祈為百姓蒙豐年今穀嗛未報鼎焉為出哉博問耆老意舊臧與見漢書郊祀志下張敞上薦鼎議引封韓千秋子等韓千秋雖亡成功亦軍鋒之冠封其子延年為成安侯摎樂其姊為王太后首願屬漢封其子廣德為龍侯見漢書南粵傳議郊祀樂民間祠有鼓舞樂今郊祀而無樂豈稱乎見漢書郊祀志上其春既滅南越下公卿議使公孫遂往朝鮮將率不能前乃使衛山諭降右渠不能顓決與左將軍相誤卒沮約今兩將圍城又乖異以故久不決使故濟南太守公孫遂往正之有便宜得以從事見漢書朝鮮傳封莽通等待郎莽通獲反將如侯長安男子景建從通獲少傅石德可謂元功矣大鴻臚商丘成力戰獲反將張光其封通為重合侯建為德侯成為秺侯見漢書劉屈氂傳冊書答公孫弘問弘稱周公之治弘之材能自視孰與周公賢見漢書公孫弘傳策廢陳皇后皇后失序惑於巫祝不可以承天命其上璽綬罷退居長門宮見漢書外戚傳策封齊王閎維六年四月乙巳皇帝使御史大夫湯廟立子閎為齊王曰於戲小子閎受茲青社朕承祖考維稽古建爾國家封于東土世為漢藩輔於戲念哉恭朕之詔惟命不于常人之好德克明顯光義之不圖俾君子怠悉爾心允執其中天祿永終厥有不臧乃凶于而國害于爾躬於戲保國艾民可不敬與王其戒之見史記三王世家漢書武五子傳策封燕王旦維六年四月乙巳皇帝使御史大夫湯廟立子旦為燕王曰於戲小子旦受茲玄社朕承祖考維稽古建爾國家封于北土世為漢藩輔於戲葷粥氏虐老獸心侵犯寇盜加以姦巧邊萌於戲朕命將率徂征厥罪萬夫長千夫長三十有二君皆來降期奔師葷粥徙域北州以綏悉爾心毋作怨毋俷德毋乃廢備非教士不得從徵於戲保國艾民可不敬與王其戒之同上漢書武五子傳有刪節策封廣陵王胥維六年四月乙巳皇帝使御史大夫湯廟立子胥為廣陵王曰於戲小子胥受茲赤社朕承祖考維稽古建爾國家封于南土世為漢藩輔古人有言曰大江之南五湖之間其人輕心楊州保疆三代要服不及以政於戲悉爾心戰戰兢兢乃惠乃順毋侗好佚毋邇宵人維法維則書云臣不作威不作福靡有後羞於戲保國艾民可不敬與王其戒之同上漢書武五子傳有刪節敕責楊僕書將軍之功獨有先破石門尋狹非有斬將騫旗之實也烏足以驕人哉前破番禺捕降者以為虜掘死人以為獲是一過也建德呂嘉逆罪不容於天下將軍擁精兵不窮追超然以東越為援是二過也士卒暴露連歲為朝會不置酒將軍不念其勤勞而造佞巧請乘傳行塞因用歸家懷銀黃垂三組夸鄉里是三過也失期內顧以道惡為解失尊尊之序是四過也欲請蜀刀問君賈幾何對曰率數百武庫日出兵而陽不知挾僞干君是五過也受詔不至蘭池宮明日又不對假令將軍之吏問之不對令之不從其罪何如推此心以在外江海之間可得信乎今東越深入將軍能率衆以掩過不見漢書酷吏楊僕傳賜嚴助書制詔會稽太守君厭承明之廬勞侍從之事懷故土出為郡吏會稽東接於海南近諸越北枕大江間者闊焉久不聞問具以春秋對毋以蘇秦從橫見漢書嚴助傳詔賜吾丘壽王璽書子在朕前之時知略輻湊以為天下少雙海內寡二及至連十餘城之守任四千石之重職事並廢盜賊從橫甚不稱在前時何也見漢書吾丘壽王傳賜丞相劉屈氂璽書捕斬反者自有賞罰以牛車為櫓毋接短兵多殺傷士衆堅閉城門毋令反者得出見漢書劉屈氂傳案水經注作詔李廣將軍者國之爪牙也司馬法曰登車不式遭喪不服振旅撫師以征不服率三軍之心同戰士之力故怒形則千里竦威振則萬物伏是以名聲暴於夷貉威稜憺乎鄰國夫報忿除害捐殘去殺朕之所圖於將軍也若乃免冠徒跣稽顙請罪豈朕之指哉將軍其率師東轅彌節白檀以臨右北平盛秋見漢書李廣傳又略見水經濡水注報公孫弘古者賞有功褒有德守成上文遭遇右武未有易此者也朕夙夜庶幾獲承至尊懼不能寧惟所與共為治者君宜知之蓋君子善善及後世若茲行常在朕躬君不幸罹霜露之疾何恙不已乃上書歸侯乞骸骨是章朕之不德也今事少閒君其存精神止念慮輔助醫藥以自持見漢書公孫弘傳報石慶間者河水滔陸泛濫十餘郡隄防勤勞弗能堙塞朕甚憂之是故巡方州禮嵩嶽通八神以合宣房濟淮江歷山濱海問百年民所疾苦惟吏多私徵求無已去者便居者擾故為流民法以禁重賦乃者封泰山皇天嘉況神物並見朕方答氣應未能承意是以切比閭里知吏奸邪委任有司然則官曠民愁盜賊公行往年覲明堂赦殊死無禁錮咸自新與更始今流民愈多計文不改君不繩責長吏而請以興徙四十萬口搖蕩百姓孤兒幼年未滿十歲無罪而坐率朕失望焉今君上書言倉庫城郭不充實民多貧盜賊衆請入粟為庶人夫懷知民貧而請益賦動危之而辭位欲安歸難乎君其反室見漢書石奮傳報齊人延年延年計議甚深然河乃大禹所道也聖人作事為萬世功通於神明恐難改更見漢書溝洫志齊人延年上書言開大江河上領出之胡中東注之海書奏上壯之報云云報樓蘭國請立質子侍子天子愛之不能遣其更立其次當立者見漢書西域傳樓蘭王死國人來請質子在漢者欲立之質子常坐漢法下蠶室宮刑故不遣報云云報車千秋朕之不德自左丞相與二師陰謀逆亂巫蠱之禍流及士大夫朕日一食者纍月乃何樂之聽痛士大夫常在心既事不咎雖然巫蠱始發詔丞相御史督二千石求捕廷尉治未聞九卿廷尉有所鞫也曩者江充先治甘泉宮人輔至未央椒房以及敬聲之疇李禹之屬謀入胸奴有司無所發今丞相親掘蘭臺蠱驗所明知也至今餘巫頗脫不止陰賊侵身遠近為蠱朕愧之甚何壽之有敬不舉君之觴謹謝丞相二千石各就館書曰毋偏毋黨王道蕩蕩毋有復言見漢書車千秋傳臨北河遣使者告單于南越王頭已縣於漢北闕下單于即能前與漢戰天子自將兵待邊即不能亟南面而臣於漢何但遠走亡匿於幕北寒苦水草之地為見漢書胸奴傳又見武紀有刪節責問暴勝之司直縱反者丞相斬之法也大夫何以擅止之見漢書劉屈氂傳司直田仁部閉城門坐令太子得出丞相欲斬仁御史大夫暴勝之曰當先請丞相釋仁上聞而大怒下吏責問御史大夫勝之皇恐自殺沈命法群盜起不發覺發覺而弗捕滿品者二千石以下至小吏者皆死見漢書咸宣傳於是作沉命法應劭曰沉沒也敢蔽匿盜賊者沒其命也建元鼎文定天下萬物伏見鼎録祀太室牛鼎文有漢建元三年八月作八鼎祀太室銘曰惟甲午丙寅帝若稽古肇作宗器審厥象作牛鼎各於位室從用饗億寧神休惟帝時保萬世其永賴見西湖游覽志宋紹興二十年賜臨安寧壽觀古器其一漢鼎高尺有九寸兩耳帝出曲上三尺牛首識云泰山鼎文登於泰山萬壽無疆四海寧謐神鼎傳芳見鼎録泰山刻石文事天以禮立身以義事父以孝成民以仁四海之內莫不為郡懸四夷八蠻咸來貢職與天無極人民蕃息天祿永得見續漢祭祀志上注引風俗通
