body:
  text: 昭帝免田租詔往年災害多今年蠶麥傷所振貸種食勿收責毋令民出今年田租見漢書昭紀止出馬詔比歲不登民匱於食流庸未盡還往時令民共出馬其止勿出諸給中都官者且減之見漢書昭紀舉賢良文學詔朕以眇身獲保宗廟戰戰栗栗夙興夜寐修古帝王之事通保傅傳孝經論語尚書未云有明其令三輔太常舉賢良各二人郡國文學高第各一人賜中二千石以下至吏民爵各有差見漢書昭紀立母波為鉤町王詔鉤町侯毋波率其君長人民擊反者斬首捕虜有功其立毋波為鉤町王大鴻臚廣明將率有功賜爵關內侯食邑見漢書昭紀賜韓福等詔朕閔勞以官職之事其務修孝弟以教鄉里行道舍傳舍縣次具酒肉食從者及馬長吏以時存問常以歲八月賜羊一頭酒二斛不幸死者賜復衾一祠以中牢見漢書龔勝傳昭帝時涿郡韓福以德行征至京師賜策書束帛遣歸詔云云又見昭紀有刪節歲八月作正月復衾一作衣被一襲賞誅上官桀等功詔左將軍安陽侯桀栗騎將軍桑樂侯安御史大夫弘羊皆數以邪枉干輔政大將軍不聽而懷怨望與燕王通謀置驛往來相約結燕王遣壽西長孫縱之等賂遺長公主丁外人謁者杜延年大將軍長史公孫遺等交通私書共謀令長公主置酒伏兵殺大將軍光徵立燕王為天子大逆毋道故稻田使者燕倉先發覺以告大司農敞敞告諫大夫延年延年以聞丞相徵事任宮手捕斬桀丞相少史王壽誘將安入府門皆已伏誅吏民得以安封延年倉宮壽皆為列侯見漢書昭紀赦燕太子等詔燕王迷惑失道前與齊王子劉澤等為逆抑而不揚望王反道自新今乃與長公主及左將軍桀等謀危宗廟王及公主皆自伏辜其赦王太子建公主子文信及宗室子與燕王上官桀等謀反父母同産當坐者皆免為庶人其吏為桀等所詿誤未發覺在吏者除其罪見漢書昭紀免今年馬口錢詔朕閔百姓未贍前年減漕三百萬石頗省乘輿馬及苑馬以補邊郡三輔傳馬其令郡國毋斂今年馬口錢三輔太常郡得以叔粟當賦見漢書昭紀免明年漕詔乃者民被水災頗匱於食朕虛倉廩使使者振困乏其止四年毋漕三年以前所振貸非丞相御史所請邊郡受牛者勿收責見漢書昭紀封范明友為平陵侯詔度遼將軍明友前以羌騎校尉將羌王侯君長以下擊益州反虜後復率擊武都反氐今破烏桓斬虜獲生有功其封明友為平陵侯見漢書昭紀封傅介子為義陽侯詔樓蘭王安歸常為胸奴閒侯遮漢使者發兵殺略衛司馬安樂光祿大夫忠期門郎遂成等三輩及安息大宛使盜取節印獻物甚逆天理平樂監傅介子持節使誅斬樓蘭王安歸首縣之北闕以直報怨不煩師衆其封介子為義陽侯食邑七百戶士刺王者皆補侍郎見漢書傅介子傳以叔粟當賦詔夫穀賤傷農今三輔太常穀減賤其令以叔粟當今年賦見漢書昭紀封張安世為富平侯詔右將軍光祿勳安世輔政宿衛肅敬不怠十有三年咸以康寧夫親親任賢唐虞之道也其封安世為富平侯見漢書張安世傳減口賦錢詔天下以農桑為本日者省用罷不急官減外繇耕桑者益衆而百姓未能家給朕甚愍焉其減口賦錢見漢書昭紀賜燕王旦璽書昔高皇帝王天下建立子弟以藩屏社稷先日諸以陰謀大逆劉氏不絶若髮賴絳侯等誅討賊亂尊立孝文以安宗廟非以中外有人表裏相應故邪樊酈曹灌攜劍推鋒從高皇帝懇菑除害耘鉏海內當此之時頭如蓬葆勤苦至矣然其賞不過封侯今宗室子孫曾無暴衣露冠之勞裂地而王之分財而賜之父死子繼兄終弟及今王骨肉至親敵吾一體乃與他姓異族謀害社稷親其所疏疏其所親有逆悖之心無忠愛之義如使古人有知當何面目復奉齊酎見高祖之廟乎見漢書武五子傳藍田覆車山鼎文宜君王和四方調滋味去腥傷鼎録議罰廣州王去制朕不忍致王於法議其罰見漢書景十三王傳益封霍光詔夫褒有德賞有功古今通誼也大司馬大將軍光宿衛忠正宣德明思守節秉誼以安宗廟其以河北東武陽益封光萬七千戶見漢書霍光傳益封張安世詔夫褒有德賞有功古今之通誼也車騎將軍光祿勳富平侯安世宿衛忠正宣德明思勤勞國家守職秉義以安宗廟其益封萬六百戶功次大將軍光見漢書張安世傳案此與益封霍光只是一詔史家分載於兩傳互有刪節耳封賜功臣詔故丞相安平侯敞等居位守職與大將軍光車騎將軍安世建議定策以安宗廟功賞未加而薨其益封敞嗣子忠及丞相陽平侯義度遼將軍平陵侯明友前將軍龍雒侯增太僕建平侯延年太常蒲侯昌諫大夫直春侯談當塗侯平杜侯屠耆堂長信少府關內侯勝邑戶各有差封御史大夫廣明為昌水侯後將軍充國為營平侯大司農延年為陽城侯少府樂成為爰氏侯光祿大夫遷為平丘侯賜右扶風德典屬國武延尉光宗正德大鴻臚賢詹事畸光祿大夫吉京輔都尉廣漢爵皆關內侯德武食邑見漢書宣紀議戾太子廟諡詔故皇太子在湖未有號諡歲時祠其議諡置園邑見漢書宣紀又見武五子傳議武帝廟樂詔朕以眇身奉承祖宗夙夜惟念孝武皇帝躬履仁義選明將討不服胸奴遠遁平氐羌昆明南越百蠻鄉風款塞來享建太學修郊祀定正朔協音律封泰山塞宣房符瑞應寶鼎出白麟獲功德茂盛不能盡宣而廟樂未稱其議奏見漢書宣紀朕以眇身蒙遺德承聖業奉宗廟夙夜惟念孝武皇帝躬仁誼厲威武北征胸奴單于遠遁南平氐羌昆明甌駱兩越東定薉貉朝鮮廓地斥境立郡縣百蠻率服款塞自至珍貢陳於宗廟協音律造樂歌薦上帝封太山立明堂改正朔易服色明開聖緒尊賢顯功興滅繼絶褒周之後備天地之禮廣道術之路上天報況符瑞並應寶鼎出白麟獲海效巨魚神人並見山稱萬歲功德茂盛不能盡宣而廟樂未稱朕甚悼焉其與列侯二千石博士議見漢書夏侯勝傳宣帝初即位欲褒先帝詔丞相御史案此詔視本紀更詳而未可合並故兩載之振貸貧民詔蓋聞農者興德之本也今歲不登已遣使者振貸困乏其令太官損膳省宰樂府減樂人使歸就農業丞相以下至都官令丞上書入穀輸長安倉助貸貧民民以車船載穀入關者得毋用傳見漢書宣紀地震詔蓋災異者天地之戒也朕承洪業奉宗廟託于士民之上未能和群生乃者地震北海琅邪壞祖宗廟朕甚懼焉丞相御史其與列侯中二千石博問經學之士有以應變輔朕之不逮毋有所諱令三輔太常內郡國舉賢良方正各一人律令有可蠲除以安百姓條奏被地震壞敗甚者勿收租賦見漢書宣紀又見夏侯勝傳復宗室屬籍詔蓋聞堯親九族以和萬國朕蒙遺德奉承聖業惟念宗室屬未盡而以罪絶若有賢材改行勸善其復屬使得自新見漢書宣紀霍光薨下詔故司馬大將軍博陸侯宿衛孝武皇帝三十餘年輔孝昭皇帝十有餘年遭大難躬秉義率三公諸侯九卿大夫定萬世策以安宗廟天下蒸庶咸以康寧功德茂盛朕甚嘉之復其後世疇其爵邑世世毋有所與功如蕭相國見漢書宣紀又見霍光傳賜王成爵秩詔蓋聞有功不賞有罪不誅雖唐虞猶不能以化天下今膠東相成勞來不怠流民自占八萬餘口治有異等之效其秩成中二千石賜爵關內侯見漢書宣紀又見循吏王成傳詔二千石鰥寡孤獨高年貧困之民朕所憐也前下詔假公田貸種食其加賜鰥寡孤獨高年帛二千石嚴教吏謹視遇毋令失職令內郡國舉賢良方正可親民者見漢書宣紀封霍雲為冠陽侯宣成侯光宿衛忠正勤勞國家善善及後世其封光兄孫中郎將云為冠陽侯見漢書霍光傳地震詔乃者九月壬申地震朕甚懼焉有能針朕過失及賢良方正直言極諫之士以匡朕之不逮毋諱有司朕既不德不能附遠是以邊境屯戍未息今復飭兵重屯久勞百姓非所以綏天下也其罷車騎將軍右將軍屯兵見漢書宣紀池蘌未御幸者假與貧民郡國宮館勿復修治流民還歸者假公田貨種食且勿算事見漢書宣紀舉孝弟詔朕既不逮導民不明反側晨興念慮萬方不忘元元唯恐羞先帝聖德故並舉賢良方正以親萬姓歷載臻茲然而俗化闕焉傳曰孝弟也者其為仁之本與其令郡國舉孝弟有行義聞于鄉里者各一人見漢書宣紀置廷平詔間者吏用法巧文寖深是朕之不德也夫決獄不當使有罪興邪不辜蒙戮父子悲恨朕甚傷之今遣廷史與邵鞠獄任輕祿薄其為置廷平秩六百石員四人其務平之以稱朕意見漢書刑法志喪不繇詔導民以孝則天下順今百姓或遭衰絰凶災而吏徭事使不得葬傷孝子之心朕甚憐之自今諸有大父母父母喪者勿徭事使得收斂送終盡其子道見漢書宣紀宋書禮志二子匿父母等罪勿坐詔父子之親夫婦之道天性也雖有患禍猶蒙死而存之誠愛結于心仁厚之至也豈能違之哉自今子首匿父母妻匿夫孫匿大父母皆勿坐其父母匿子夫匿妻大父母匿孫罪殊死皆上請廷尉以聞見漢書宣紀誅霍禹等詔乃者東織室令史張赦使魏郡豪李竟報冠陽侯霍雲謀為大逆朕以大將軍故抑而不揚冀其自新今大司馬博陸侯禹與母宣成侯夫人顯及從昆弟冠陽侯雲樂平侯山諸姊妹壻度遼將軍范明友長信少府鄧廣漢中郎將任勝騎都尉趙平長安男子馮殷等謀為大逆顯前又使女侍醫淳于衍進藥殺共哀后謀毒太子欲危宗廟逆亂不道咸伏其辜諸為霍氏所詿誤未發覺在吏者皆赦除之見漢書宣紀乃者東織室令史張赦使魏郡豪李竟報冠陽侯雲謀為大逆朕以大將軍故抑而不揚冀其自新今大司馬博陵侯禹與母宣成侯夫人顯及從昆弟子冠陽侯雲樂平侯山諸姊妹壻謀為大逆欲詿誤百姓賴宗廟神靈先發得咸伏其辜朕甚悼之諸為霍氏所詿誤事在丙申前未發覺在吏者皆赦除之男子張章先發覺以語期門董忠忠告左曹楊惲惲告侍中金安上惲召見對狀後章上書以聞侍中史高與金安上建發其事言無入霍氏禁闥卒不得遂其謀皆讎有功封章為博成侯忠高昌侯惲平通侯安上都成侯高樂陵侯見漢書霍光傳案此與宣紀所載互有詳略故並録之減鹽賈詔朕惟百姓失職不贍遣使者循行郡國問民所疾苦吏或營私煩擾不顧厥咎朕甚閔之今年郡國頗被水災已振貸鹽民之食而賈咸貴衆庶重困其減天下鹽賈見漢書宣紀歲上繫囚詔令甲死者不可生刑者不可息此先帝之所重而吏未稱今繫者或以掠辜若飢寒瘐死獄中何用心逆人道也朕甚痛之其令郡國歲上繫囚以掠笞若瘐死者所坐名縣爵里丞相御史御史課殿最以聞見漢書宣紀
