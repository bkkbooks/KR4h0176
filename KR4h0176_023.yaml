body:
  text: 宣帝鳳皇集甘露降詔乃者鳳皇集泰山陳留甘露降未央宮朕未能章先帝休烈協寧百姓承天順地調序四時獲蒙嘉瑞賜茲祉福夙夜兢兢靡有驕色內省匪解永惟罔極書不云乎鳳皇來儀庶尹允諧其赦天下徒賜勤事吏中二千石以下至六百石爵自中郎吏至五大夫佐史以上二級民一級女子百戶牛酒加賜鰥寡孤獨三老孝弟力田帛所振貸勿收見漢書宣紀博舉詔朕不明六藝鬱于大道是以陰陽風雨未時其博舉吏民厥身修正通文學明於先王之術宣究其意者各二人中二千石各一人見漢書宣紀赦詔書云文王作罰刑茲無赦今吏修身奉法未有能稱朕意朕甚愍焉其赦天下與士大夫厲精更始見漢書宣紀平法詔獄者萬民之命所以禁暴止邪養育群生也能使生者不怨死者不恨則可謂文吏矣今則不然用法或持巧心析律二端深淺不平增辭飾非以成其罪奏不如實上亦亡繇知此朕之不明吏之不稱四方黎民將何仰哉二千石各察官屬勿用此人吏務平法或擅興徭役飾廚傳稱過使客越職踰法以取名譽譬猶踐薄冰以待白日豈不殆哉今天下頗被疾疫之災朕甚愍之其令郡國被災甚者毋出今年租賦見漢書宣紀更諱詔聞古天子之名難知而易諱也今百姓多上書觸諱以犯罪者朕甚憐之其更諱詢諸觸諱在令前者赦之見漢書宣紀又册府元龜三為張賀置守冢詔其為故掖庭令張賀置守冢三十家見漢書張安世傳以張敞守京兆尹詔制詔御史其以膠東相敞守京兆尹見漢書張敞傳封昌邑王賀為海昏侯詔蓋聞象有罪舜封之骨肉之親粲而不殊其封故昌邑王賀為海昏侯見漢書宣紀封丙吉等詔朕微眇時御史大夫丙吉中郎將史曾史玄長樂衛尉許舜侍中光祿大夫許延壽皆與朕有舊恩及故掖庭令張賀輔導朕躬修文學經術恩惠卓異厥功茂焉詩不云乎無德不報封賀所子弟子侍中中郎將彭祖張安世傳作詩云無言不讎無德不報其封賀子侍中關內侯彭祖為陽都侯追賜賀諡曰陽都哀侯吉曾玄舜延壽皆為列侯故人下至郡邸獄復作嘗有阿保之功皆受官祿田宅財物各以恩深淺報之見漢書宣紀又見張安世傳有刪節禁春夏彈射詔前年夏神爵集雍今春五色鳥以萬數飛過屬縣翱翔而舞欲集未下其令三輔毋得以春夏擲巢探卵彈射飛鳥具為令見漢書宣紀耆老勿坐罪詔朕惟耆老之人髮齒角落血氣衰微亦亡暴虐之心今或罹文法拘執囹圄不終天命朕甚憐之自今以來諸年八十以上非誣告殺傷人他皆勿坐見漢書宣紀朕念夫耆老之人髮齒角落血氣既衰亦無暴逆之心令或羅于文法執于囹圄不得終其年命朕甚憐之自今以來諸年八十非誣告殺傷人它皆勿坐見漢書刑法志神爵集宮苑詔乃者神爵五采以萬數集長樂未央北宮高寢甘泉泰畤殿中及上林苑朕之不逮寡于德厚屢獲嘉祥非朕之任其賜天下吏爵二級民一級女子百戶牛酒加賜三老孝弟力田帛人二匹鰥寡孤獨各一匹見漢書宣紀賜尹翁歸子黃金詔制詔御史朕夙興夜寐以求賢為右不異親疏近遠務在安民而已扶風翁歸廉平鄉正治民異等早夭不遂不得終其功業朕其憐之其賜翁歸子黃金百斤以奉其祭祠見漢書尹翁歸傳躬親郊祀詔蓋聞天子尊事天地修祀山川古令通禮也間者上帝之祠闕而不親十有餘年朕其懼焉朕親飭躬齋戒親奉祀為百姓蒙嘉氣獲豐年焉見漢書郊祀志下十二年乃下詔以黃霸為潁川太守詔制詔御史其以賢良高第揚州刺史霸為潁川太守秩比二千石居官賜車蓋特高一丈別駕主簿車緹油屏泥于軾前以章有德見漢書循吏黃霸傳改元神爵詔朕承宗廟戰戰栗栗惟萬事統未燭厥理乃元康四年嘉穀玄稷降于郡國神爵仍集金芝九莖産于函德殿銅池中九真獻奇獸南郡獲白虎威鳳為寶朕之不明震于珍物飭躬齋精祈為百姓東濟大河天氣清靜神魚舞河幸萬歲宮神爵翔集朕之不德懼不能任其以五年為神爵元年賜天下勤事吏爵二級民一級女子百戶牛酒鰥寡孤獨高年帛所振貸物勿收行所過毋出田租見漢書宣紀祠江海詔制詔太常夫江海百川之大者也今闕焉無祠其令祠官以禮為歲事以四時祠江海洛水祈為天下豐年焉見漢書郊祀志下止諸侯王入朝詔軍旅暴露轉輸煩勞其令諸侯王列侯蠻夷王侯君長當朝二年者皆毋朝見漢書宣紀賜朱邑子黃金詔大司農邑廉潔守節退食自公亡強外之交束修之餽可謂淑人君子遭離凶災朕甚閔之其賜邑子黃金百斤以奉祠祭祀見漢書循吏朱邑傳赦詔乃者正月乙丑鳳皇甘露降集京師群鳥從以萬數朕之不德屢獲天福祗事不怠其赦天下見漢書宣紀封鄭吉為安遠侯詔都護西域騎都尉鄭吉拊循外蠻宣明威信迎胸奴單于從兄日逐王衆擊破車師兜訾城功效茂著其封吉為安遠侯食邑千戶見漢書鄭吉傳又見御覽二百引會稽典録益吏奉詔吏不廉平則治道衰今小吏皆勤事而奉祿薄欲其毋侵漁百姓難矣其益吏百石以下奉十五見漢書宣紀赦詔乃者鳳皇甘露降集京師嘉瑞並見修興泰一五帝后土之祠祈為百姓蒙祉福鸞鳳萬舉蜚覽翱翔集止于旁齋戒之暮神光顯著薦鬯之夕神光交錯或降于天或登于地或從四方來集于壇上帝嘉嚮海內承福其赦天下賜民爵一級女子百戶牛酒鰥寡孤獨高年帛見漢書宣紀賜黃霸爵秩詔潁川太守霸宣布詔令百姓鄉化孝子弟弟貞婦順孫日以衆多田者讓畔道不拾遺養視鰥寡贍助貧窮獄或八年亡重罪囚吏民鄉于教化興於行誼可謂賢人君子矣書不云乎股肱良哉其賜爵關內侯黃金百斤秩中二千石而潁川孝弟有行義民三老力田皆以差賜爵及帛見漢書循吏黃霸傳天子以治行終長者下詔稱揚嫁娶不禁具酒食詔夫婚姻之禮人倫之大者也酒食之會所以行禮樂也今郡國二千石或擅為苛禁禁民嫁娶不得具酒食相賀召繇是廢鄉黨之禮令民亡所樂非所以導民也詩不云乎民之失德乾餱以愆勿行苛政見漢書宣紀胸奴來降赦詔往者胸奴數為邊寇百姓被其害朕承至尊未能綏安胸奴虛閭權渠單于請求和親病死右賢王屠耆堂代立骨肉大臣立虛閭權渠單于子為呼韓邪單于擊殺屠耆堂諸王並自立分為五單于更相攻擊死者以萬數畜産大耗什八九人民飢餓相燔燒以求食因大乖亂單于閼氏子孫昆弟及呼遬纍單于名王右伊秩訾且渠當戶以下將衆五萬餘人來降歸義單于稱臣使弟奉珍朝賀正月北邊晏然靡有兵革之事朕飭躬齊戒郊上帝祠后土神光並見或興于谷燭耀齊宮十有餘刻甘露降神爵集已詔有司告祠上帝宗廟三月辛丑鸞鳳又集長樂宮東闕中樹上飛下止地文章五色留十餘刻吏民並觀朕之不敏懼不能任婁蒙嘉瑞獲茲祉福書不云乎雖休勿休祗事不怠公卿大夫其勗焉減天下口錢赦殊死以下賜民爵一級女子百戶牛酒大酺五日加賜鰥寡孤獨高年帛見漢書宣紀日食詔皇天見異以戒朕躬是朕之不逮吏之不稱也以前使使者問民所疾苦復遣丞相御史掾一十四人循行天下舉冤獄察擅為苛禁深刻不改者見漢書宣紀詔免丙顯官故丞相吉有舊恩朕不忍絶免顯官奪四百戶見漢書丙吉傳吉子顯為太僕臧千餘萬司隸校尉昌奏請逮捕上曰云云赦詔乃者鳳皇甘露降集黃龍登興醴泉滂流枯稿榮茂神光並見咸受禎祥其赦天下減民算三十賜諸侯王丞相將軍列侯中二千石金錢各有差賜民爵一級女子百戶牛酒鰥寡孤獨高年帛見漢書宣紀以客禮待單于詔蓋聞五帝三王教化所不施不及以政今胸奴單于稱北蕃朝正朔朕之不逮德不能弘覆其以客禮待之令單于位在諸侯王上贊謁稱臣而不名見漢書蕭望之傳又見宣紀有刪節鳳皇集詔乃者鳳皇集新蔡群鳥四面行列皆鄉鳳皇立以萬數其賜汝南太守帛百匹新蔡長吏三老孝弟力田鰥寡孤獨各有差賜民爵二級毋出今年租見漢書宣紀察計簿詔蓋聞上古之治君臣同心舉措曲直各得其所是以上下和洽海內康平其德弗可及已朕既不明數申詔公卿大夫務行寬大順民所疾苦將欲配三王之隆明先帝之德也今吏或以不禁姦邪為寬大縱釋有罪為不苛或以酷惡為賢皆失其中奉詔宣化如此豈不謬哉方今天下少事徭役省減兵革不動而民多貧盜賊不止其咎安在上計簿具文而已務為欺謾以避其課三公不以為意朕將何任諸請詔省卒徒自給者皆止御史察計簿疑非實者按之使真偽毋相亂見漢書宣紀毋得舉六百石為廉吏詔舉廉吏誠欲得其真也吏六百石位大夫有罪先請秩祿上通足以效其賢材自今以來毋得舉見漢書宣紀嫁母不制服詔婦人不養舅姑不奉祭祀下不慈子是自絶也故聖人不為制服明子無出母之義玄成議是也見通典八十九引石渠議蔣滿父子同拜詔上黨太守滿經行篤著信行山東其以滿為淮陽王相誨導東蕃弘農股肱郡其以萬為弘農太守見御覽二百六十引漢雜事策廢霍皇后皇后熒惑失道懷不德挾毒與母博陸宣成侯夫人顯謀欲危太子無人母之恩不宜奉宗廟衣服不可以承天命鳴呼傷哉其退避宮上璽綬有司見漢書外戚傳上惟神爵三年十月甲子按宣紀是年三月丞相魏相薨百官表四月戊戌御史大夫丙吉為丞相今此作十月甲子當有一誤丞相受詔之官皇帝延登親詔之曰君其進虛受朕言朕鬱于大道獲保宗廟兢兢師師夙夜思過失不遑康寧晝思百官未能綏於戲丞相其帥意無怠以補朕闕於戲群卿大夫百官慎哉不勗於職厥有常刑往悉乃心和裕開賢俾之反本乂民廣風一俗靡諱朕躬天下之衆受制于朕丞相可不慎歟於戲君其誡之見漢舊儀聚珍板本策杜延年為御史大夫惟五鳳三年正月乙已御史大夫之官皇帝延登親詔之曰御史大夫其進虛受朕言朕鬱于大道獲保宗廟兢兢師師夙夜思已失不遑康寧晝思百姓未能綏於戲御史大夫其帥意盡心以補朕闕於戲九卿群大夫百官慎哉不勗于厥職厥有常辟往悉乃心和裕開賢俾賢能反本乂民靡諱朕躬天下之衆受制于朕以法為命可不慎歟於戲御史大夫其誡之見漢舊儀聚珍板本左遷蕭望之策有司奏君責使者禮遇丞相亡禮廉聲不聞敖慢不遜亡以扶政先百僚君不深思陷于茲穢朕不忍致君于理使光祿勳惲策詔左遷君為太子太傅授印其上故印使者便道之官君其秉道明孝正直是與帥意亡靡有後言見漢書蕭望之傳敕邊守尉胸奴大國多變詐交接得其情則卻敵折衝應對入其數則反為輕欺見後漢南胸奴傳司徒掾班彪奏賜陳遂璽書制詔太原太守官尊祿厚可以償博進矣妻君寧時在旁知狀見漢書遊俠陳遵傳賜張敞璽書制詔山陽太守其謹備盜賊察往來過客毋下所賜書見漢書武五子昌邑王傳報丙吉朕之封君非空名也而君上書歸侯印是顯朕之不德也方今天下少事君其專精神省思慮近醫藥以自持見漢書丙吉傳吉上書固辭不宜以空名受賞上報報張安世將軍年老被病朕甚閔之雖不能視事折衝萬里君先帝大臣明于治亂朕所不及得數問焉何感而上書歸衛將軍富平侯印薄朕忘故非所望也願將軍強餐食近醫藥專精神以輔天年見漢書張安世傳敕讓趙充國書皇帝問後將軍甚苦暴露將軍計欲至正月乃擊罕羌羌人當獲麥已遠其妻子精兵萬人欲為酒泉敦煌寇邊兵少民守保不得田作今張掖以東粟石百餘芻稿束數十轉輸並起百姓煩擾將軍將萬餘之衆不早及秋共水草之利爭其畜食欲至冬虜皆當畜食多藏匿山中依險阻將軍士寒手足皸瘃寧有利哉將軍不念中國之費欲以歲數而勝微將軍誰不樂此者今詔破羌將軍武賢將兵六千一百人敦煌太守快將二千人長水校尉富昌酒泉侯奉世將婼月氏兵四千人亡慮萬二千人齎三十日食以七月二十二日擊罕羌入鮮水北句廉上去酒泉八百里去將軍可千二百里將軍其引兵便道西並進雖不相及使虜聞東方北方兵並來分散其心意離其黨與雖不能殄滅當有瓦解者已詔中郎將卬將胡越佽飛射士步兵二校益將軍兵今五星出東方中國大利蠻夷大敗太白出高用兵深入敢戰者吉弗敢戰者凶將軍急裝因天時誅不義萬下必全勿復有疑見漢書趙充國傳賜趙充國書制詔後將軍聞苦腳脛寒泄將軍年老加疾一朝之變不可諱朕甚憂之今詔破羌將軍詣屯所為將軍副急因天時大利吏士鋭氣以十二月擊先零羌即疾劇留屯毋行獨遣破羌強弩將軍見漢書趙充國傳其秋充國病上賜書報趙充國皇帝問後將軍言欲罷騎兵萬人留田即如將軍之計虜當何時伏誅兵當何時得決孰計其便復奏見漢書趙充國傳復賜書報趙充國皇帝問後將軍言十二便聞之虜雖未伏誅兵決可期月而望期月而望者謂今冬邪謂何時也將軍獨不計虜聞兵頗罷且丁壯相衆攻擾田者及道上屯兵復殺略人民將何以止之又大幵小幵前言日我告漢軍先零所在兵不往擊久留得亡效五年時不分別人而并擊我其意常恐今兵不出得亡變生與先零為一將軍孰計復奏見漢書趙充國傳充國上狀留屯十二利上復賜報報趙充國聽留屯皇帝問後將軍上書言羌虜可勝之道今聽將軍將軍計善其上留屯田及當罷者人馬數將軍強食慎兵事自愛見漢書趙充國傳諭意蕭望之所用皆更治民以考功君前為平原太守日淺故復試之于三輔非有所聞也見漢書蕭望之傳望之從少府出為左馮翊即移病上使侍中金安上諭意使尚書召問黃霸太尉官罷久矣丞相兼之所以偃武興文也如國家不虞邊境有事左右之臣皆將率也夫宣明教化通達幽隱使獄亡冤刑邑亡盜賊君之職也將相之官朕之任焉侍中樂陵侯高帷幄近臣朕之所自親君何越職而舉之尚書令受丞相對見漢書黃霸傳樂陵侯史高以外屬舊恩侍中貴重霸薦高可太尉天子使尚書召問霸華山仙掌鼎文萬國伏貽長久鑄神鼎承天酒見鼎録
