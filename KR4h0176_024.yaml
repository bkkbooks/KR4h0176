body:
  text: 元帝封王禁制書其封婕妤父丞相少史王禁為陽平侯位特進見漢書五行志中之上申明毀廟制書孝宣皇帝尊孝武廟曰世宗損益之禮不敢有與焉他皆如舊制見漢書韋玄成傳初上定迭毀禮獨尊孝文廟為太宗而孝武廟親未盡故未毀上于是乃復申明之曰云云傳又載哀帝即位孔光何武奏言建昭五年制書與此同唯少末句議律令詔夫法令者所以抑暴扶弱欲其難犯而易避也今律令煩多而不約自典文者不能分明而欲羅元元之不逮斯豈刑中之意哉其議律令可蠲除輕減者條奏唯在便安萬姓而已見漢書刑法志元帝初立乃下詔遣使循行天下詔朕承先帝之聖緒獲奉宗廟戰戰兢兢間者地數動而未靜懼于天地之戒不知所繇方田作時朕憂蒸庶之失業臨遣光祿大夫裒等十二人循行天下存問耆老鰥寡孤獨困乏失職之民延登賢俊招顯側陋因覽風俗之化相守二千石誠能正躬勞力宣明教化以親萬姓則六合之內和親庶幾呼無憂矣書不云乎股肱良哉庶事康哉布告天下使明知朕意見漢書元紀免災民租賦詔關東今年穀不登民多困乏其令郡國被災害甚者毋出租賦江海陂湖園池屬少府者以假貧民勿租賦賜宗室有屬籍者馬一匹至二駟三老孝者帛五匹弟者力田三匹鰥寡孤獨二匹吏民五十戶牛酒見漢書元紀節省詔間者陰陽不調黎民饑寒無以保治惟德淺薄不足以充入舊貫之居其令諸宮館希御幸者勿繕治大僕減穀食馬水衡省肉食獸見漢書元紀令孔霸奉孔子祀詔其令師褒成君關內侯霸以所食邑八百戶祀孔子焉見漢書孔光傳災異求言詔蓋聞賢聖在位陰陽和風雨時日月光星辰靜黎庶康寧考終厥命今朕恭承天地託于公侯之上明不能燭德不能綏災異竝臻連年不息乃二月戊午地震于隴西郡毀落太上皇廟殿壁木飾壞敗豲道縣城郭官寺及民室屋壓殺人衆山崩地裂水泉湧出一年地再動天惟降災震驚朕師翼奉傳作躬治有大虧咎至於斯夙夜兢兢不通大變深惟鬱悼未知其序間者歲數不登元元困乏不勝饑寒以陷刑辟朕甚閔之已詔吏虛倉廩開府臧振救貧民郡國被地動災甚者無出租賦赦天下群司其找思天地之戒有可蠲除減省以便萬姓者各條奏悉意陳朕過失毋有所諱丞相御史中二千石舉茂材異等直言極諫之士朕將親覽焉見漢書元紀又見翼奉傳各有刪節今合録之又詔歲比災害民有菜色慘怛于心已詔吏虛倉廩開府庫振救賜寒者衣今秋禾麥頗傷一年中地再動北海水溢流殺人民陰陽不和其咎安在公卿將何以憂之其悉意陳朕過靡有所諱見漢書元紀原蕭望之詔制詔丞相御史前將軍望之傅朕八年亡它罪過今事久遠識忘難明其赦望之罪收前將軍光祿勳印綬見漢書蕭望之傳賜蕭望之爵邑詔制詔御史國之將興尊師而重傅故前將軍望之傅朕八年道以經書厥功茂焉其賜爵關內侯食邑八百戶給事中朝朔望坐次將軍見漢書元紀又蕭望之傳詔免諸葛豐制詔御史城門校尉豐前與光祿勳堪光祿大夫猛在朝之時數稱言堪猛之美豐前為司隸校尉不順四時修法度專作苛暴以獲虛威朕不忍下吏以為城門校尉不內省諸己而反怨堪猛以求報舉告案無證之辭暴揚難驗之罪毀譽恣意不顧前言不信之大者也朕憐豐之耆老不忍加刑其免為庶人見漢書諸葛豐傳左遷周堪張猛詔豐言堪猛貞信不立朕閔而不治又惜其材能未有所效其左遷堪為河東太守猛槐里令見漢書劉向傳罷珠崖郡詔珠崖虜殺吏民背叛為逆今廷議者或言可擊或言可守或欲棄之其指各殊朕日夜惟思議者之言羞威不行則欲誅之狐疑辟難則守屯田通于時變則憂萬民夫萬民之饑餓與遠蠻之不討危孰大焉且宗廟之祭凶年不備況乎辟不嫌之辱哉今關東大困倉庫空虛無以相贍又以動兵非特勞民凶年隨之其罷珠崖郡民有慕義欲內屬便處之不欲勿彊見漢書賈捐之傳又見後漢鮮卑傳赦詔乃者火災降于孝武園館朕戰栗恐懼不燭變異咎在朕躬群司又未肯極言朕過以至于斯將何以寤焉百姓仍遭凶厄無以相振加以煩擾呼苛吏拘牽乎微文不得永終性命朕甚閔焉其赦天下見漢書元紀求言詔蓋聞安民之道本繇陰陽間者陰陽錯謬風雨不時朕之不德庶幾群公有敢言朕之過者今則不然偷合苟從未肯極言朕甚閔焉永惟蒸庶之饑寒遠離父母妻子勞于非業之作衛偷不居之宮恐非所以佐陰陽之道也其罷甘泉建章宮衛令就農百官各省費條奏于毋有所諱有司勉之毋犯四時之禁丞相御史舉天下明陰陽災異者各三人見漢書元紀因災異改行新政詔朕之不逮序位不明衆僚久懬未得其人元元失望上感皇天陰陽為變咎流萬民朕甚懼之乃者關東連遭災害饑寒疾疫夭不終命詩不云乎凡民有喪匍匐救之其令太官毋日殺所具各減半乘輿秣馬無乏正事而已罷角抵上林宮館希御幸者齊三服官北假田官鹽鐵官常平倉博士弟子毋置員以廣學者賜宗室子有屬籍者馬一匹至二駟三老孝者帛人五匹弟者力田三匹鰥寡孤獨二匹吏民五十戶牛酒見漢書元紀詔條責丞相御史惡吏負賊妄意良民至亡辜死或盜賊發吏不亟追而反繫亡家後不敢復告以故浸廣民多冤結州郡不理連上書者交於闕廷二千石選舉不實是以在位多不任職民田有災害吏不肯除收趣其租以故重困關東流民飢寒疾疫已詔吏轉漕虛倉廩開府臧相振救賜寒者衣至春猶恐不贍今丞相御史將欲何施以塞此咎悉意條狀陳朕過失見漢書于定國傳復詔條責丞相御史郎有從東方來者言民父子相棄丞相御史案事之吏匿不言邪將從東方來者加增之也何以錯繆至是欲知其實方今年歲未可預知也即有水旱其憂不細公卿有可以防其未然救其已然者不各以誠對毋有所諱見漢書于定國傳赦詔五帝三王任賢使能以登至平而今不治者豈斯民異哉咎在朕之不明亡以知賢也是故壬人在位而吉士雍蔽重以周秦之弊民漸薄俗去禮義觸刑法豈不哀哉繇此觀之元元何辜其赦天下令厲精自新各務農畝無田者皆假之貸種食如貧民賜吏六百石以上爵五大夫勤事吏二級為父後者民一級女子百戶牛酒鰥寡孤獨高年帛見漢書元紀大赦詔蓋聞唐虞象刑而民不犯殷周法行而姦軌服今朕獲承高祖之洪業託位公侯之上夙夜戰栗永惟百姓之急未嘗有忘焉然而陰陽未調三光暗昧元元大困流散道路盜賊並興有司又長殘賊失牧民之術是皆朕之不明政有所虧咎至於此朕甚自恥為民父母若是之薄謂百姓何其大赦天下賜民爵一級女子百戶牛酒鰥寡孤獨高年三老孝弟力田帛又賜諸侯王公主列侯黃金中二千石以下至中都官長吏各有差吏六百石以上爵五大夫勤事吏各二級見漢書元紀日食詔朕戰戰栗栗夙夜思過失不敢荒寧惟陰陽不調未燭其咎婁敕公卿日望有效至今有司執政未得其中施與禁切未合民心暴猛之俗彌長和睦之道日衰百姓愁苦靡所錯躬是以氛邪歲增侵犯太陽正氣湛掩日久奪光乃壬戌日有蝕之天見大異以戒朕躬朕甚悼焉其令內郡國舉茂材異等賢良直言之士各一人見漢書元紀赦詔間者連年不收四方咸困元元之民勞于耕耘又亡成功困于饑饉亡以相救朕為民父母德不能覆而有其刑甚自傷焉其赦天下見漢書元紀封馮奉世闕內侯詔羌虜桀黠賊害吏民攻隴西府寺燔燒置亭絶道橋甚逆天道左將軍光祿勳奉世前將兵征討斬捕首虜八千餘級鹵馬牛羊以萬數賜奉世爵關內侯食邑五百戶黃金六十斤見漢書馮奉世傳留屯田羌虜破散創艾亡逃出塞其罷吏士頗留屯田備要害處見漢書馮奉世傳上曰責吏詔乃者己丑地動中冬雨水大霧盜賊竝起吏何不以時禁各悉意對見漢書元紀赦詔朕存至尊之重不能燭理百姓婁遭凶咎加以邊竟不安師旅在外賦斂轉輸元元騷動窮困亡聊犯法抵罪夫上失其道而繩下以深刑朕甚痛之其赦天下所貸貧民勿收責見漢書元紀日蝕求言詔蓋聞明王在上忠賢布職則群生和樂方外蒙澤今朕暗于王道夙夜憂勞不通其理靡瞻不眩靡聽不惑是以政令多還民心未得邪說空進事亡成功此天下所著聞也公卿大夫好惡不同或緣姦作邪侵削細民元元安所歸命哉乃六月晦日有蝕之詩不云乎今此下民亦孔之哀自今以來公卿大夫其勉思天戒慎身修永以輔朕之不逮直言盡意無有所諱見漢書元紀徵周堪詔河東太守堪先帝賢之命而傅朕資質淑茂道術通明論議正直秉心有常發憤悃愊信有憂國之心以不能阿尊事貴孤特寡助抑厭遂退卒不克明往者衆臣見異不務自修深惟其故而反暗昧說天託咎此人朕不得已出而試之以彰其材堪出之後大變仍臻衆亦默然堪治未期年而三老官屬有識之士詠頌其美使者過郡靡人不稱此固足以彰先帝之知人而朕有以自明也俗人乃造端作基非議詆欺或引幽隱非所宜明意疑以類欲以陷之朕亦不取也朕迫于俗不得專心乃者天著大異朕甚懼焉今堪年衰歲暮恐不得自信排于異人將安究之哉其徵堪詣行在所見漢書劉向傳議罷郡國廟詔朕聞明王之御世也遭時為法因事制宜往者天下初定遠方未賓因嘗所親以立宗廟蓋建威銷萌一民之至權也今賴天地之靈宗廟之福四方同軌蠻貊貢職久遵而不定令疏遠卑賤共承尊祀殆非皇天祖宗之意朕甚懼焉傳不云乎吾不與祭如不祭其與將軍列侯中二千石二千石諸大夫博士議郎議見漢書韋玄成傳初陵勿置縣邑詔安土重遷黎民之性骨肉相附人情所願也頃者有司緣臣子之義奏徙郡國民以奉園陵令百姓遠棄先祖墳墓破業失産親戚別離人懷思慕之心家有不安之意是以東垂被虛耗之害關中有無聊之民非久長之策也詩不云呼民亦勞止迄可小康惠此中國以綏四方今所為初陵者勿置縣邑使天下咸安土樂業亡有動搖之心布告天下令明知之見漢書元紀議毀廟詔蓋聞明王制禮立親廟四祖宗之廟萬世不毀所以明尊祖敬宗著親親也朕獲承祖宗之重惟大禮未備戰栗恐懼不敢自專其與將軍列侯中二千石二千石諸大夫博士議見漢書韋玄成傳正毀廟遷主禮儀詔蓋聞王者祖有功而宗有德尊尊之大義也存親廟四親親之至恩也高皇帝為天下誅暴除亂受命而帝功莫大焉孝文皇帝國為代王諸呂作亂海內搖動然群臣黎庶靡不一意北面而歸心猶謙辭固讓而後即位削亂秦之迹興三代之風是以百姓晏然咸獲嘉福德莫盛焉高皇帝為漢太祖孝文皇帝為太宗世世承祀傳之無窮朕甚樂之孝宣皇帝為孝昭皇帝後于義一體孝景皇帝廟及皇考廟皆親盡其正禮儀見漢書韋玄成傳赦甘延壽陳湯矯制罪詔胸奴郅支單于背畔禮義留殺漢使者吏士甚逆道理朕豈忘之哉所以優游而不征者重動師衆勞將帥故隱忍而未有云也今延壽湯睹便宜乘時利結城郭諸國擅興師矯制而征之賴天地宗廟之靈誅討郅支單于斬獲其首及閼氏貴人名王以下千數雖踰義干法內不煩一夫之役不開府庫之臧因敵之糧以膽軍用立功萬里之外威震百蠻名顯四海為國除殘兵革之原息邊竟得以安然猶不免死亡之患罪當在于奉憲朕甚閔之其赦延壽湯罪勿治見漢書陳湯傳遣使循行天下詔朕承先帝之休烈夙夜栗栗懼不克任間者陰陽不調五行失序百姓饑饉惟蒸庶之失業臨遣諫大夫博士賞等二十一人循行天下存問耆老鰥寡孤獨乏困失職之人舉茂材特立之士相將九卿其帥意毋怠使朕獲觀教化之流焉見漢書元紀赦詔蓋聞明王之治國也明好惡而定去就崇敬讓而民興行故法設而民不犯令施而民從今朕獲保宗廟兢兢業業匪敢解怠德薄明暗教化淺微傳不云呼百姓有過在豫一人其赦天下賜民爵一級女子百戶牛酒三老孝弟力田帛見漢書元紀禁妨農詔方春農桑興百姓戮力自盡之時也故是月勞農勸民無使後時今不良之吏覆案小罪徵召證案興不急之事以妨百姓使失一時之作亡終歲之功公卿其明察申敕之見漢書元紀改元竟寧詔胸奴郅支單于背叛禮義既伏其辜呼韓邪單于不忘恩德鄉慕禮義復修朝賀之禮願保塞傳之無窮邊垂長無兵革之事其改元為竟寧見漢書元紀以張談為御史大夫詔剛強堅固確然亡欲大鴻臚野王是也心辨善辭可使四方少府五鹿充宗是也廉潔節儉太子少傅張談是也其以少傅為御史大夫見漢書馮奉世附傳敕東平王傅相詔夫人之性皆有五常及其少長耳目牽于耆欲故五常銷而邪心作情亂其性利勝其義而不失厥家者未之有也今王富于春秋氣力勇武獲師傅之教淺加以少所聞見自今以來非五經之正術敢以游獵非禮道王者輒以名聞見漢書宣元六王傳璽書勞馮奉世且讓之皇帝問將兵右將軍甚苦暴露羌虜侵邊境殺吏民甚逆天道故遣將軍帥士大夫行天誅以將軍材質之美奮精兵誅不軌百下百全之道也今乃有畔敵之名大為中國羞以昔不間習之故邪以恩厚未洽信約不明也朕甚怪之上書言羌虜依深山多徑道不得不多分部遮要害須得後發營士足以決事部署已定藝不可復置大將聞之前為將軍兵少不足自守故發近所騎日夜詣非為擊也今發三輔河東弘農越騎迹射佽飛彀者羽林孤兒及呼速絫嗕種方急遣且兵凶器也必有成敗者患策不豫定料敵不審也故復遣奮武將軍兵法曰大將軍出必有偏裨所以揚威武參計策將軍又何疑焉夫愛吏士得衆心舉而無悔禽敵必全將軍之職也若乃轉輸之費則有司存將軍勿憂須奮武將軍兵到合擊羌虜見漢書馮奉世傳賜淮陽王欽璽書皇帝問淮陽王有司奏王王舅張博數遺王書非毀政治謗訕天子褒舉諸侯稱引周湯以讇惑王所言尤惡悖逆無道王不舉奏而多與金錢報以好言罪至不赦朕惻焉不忍聞為王傷之推原厥本不祥自博惟王之心匪同于凶巳詔有司勿治王事遣諫大夫駿申諭朕意詩不云乎靖恭爾位正直是與王其勉之見漢書宣元六王傳敕諭東平王宇璽書皇帝問東平王蓋聞親親之恩莫重于孝尊尊之義莫大于忠故諸侯在位不驕以致孝道制節謹度以翼天子然後富貴不離於身而社稷可保今聞王自修有闕本朝不和流言紛紛謗自內興朕甚憯焉為王懼之詩不云乎毋念爾祖述修厥德永言配命自求多福朕惟王之春秋方剛忽于道德意有所移忠言未納故臨遣太中大夫子蟜諭王朕意孔子曰過而不改是謂過矣王其深維孰思之無違朕意見漢書宣元六王傳賜東平王太后璽書皇帝使諸吏宦者令承問東平王太后朕有聞王太后少加意焉夫福善之門莫美于和睦患咎之首莫大于內離今東平王出繈褓之中而託于南面之位加以年齒方剛涉學日寡驁忽臣下不自它于太后以是之間能無失禮義者其唯聖人乎傳曰父為子隱直在其中矣王太后明察此意不可不詳閨門之內母子之間同氣異息骨肉之恩豈可忽哉豈可忽哉昔周公戒伯禽曰故舊無大故則不可棄也毋求備於一人夫以故舊之恩猶忍小惡而況此乎已遣使者諭王王既悔過服罪太后寬忍以貰之後宜不敢王太后強餐止思念慎疾自愛見漢書宣元六王傳賜諸葛豐書夫司隸者刺舉不法善善惡惡非得顓之也免處中和順經術意見漢書諸葛豐傳報貢禹朕以生有伯夷之廉史魚之直守經據古不阿當世孳孳于民俗之所寡故親近生幾參國政今未得久聞生之奇論也而云欲退意豈有所恨與將在位者與生殊乎往者嘗令金敞語生欲及生時祿生之子既已諭矣今復云子少夫以王命辨護生家雖百子何以加傳曰亡懷土何必思故鄉生其強飯慎疾以自輔見漢書貢禹傳報于定國君相朕躬不敢怠息萬方之事大録于君能無過者其唯聖人方今承周秦之敝俗化陵夷民寡禮誼陰陽不調災咎之發不為一端而作自聖人推類以記不敢專也況于非聖者乎日夜惟思所以未能盡明經曰萬方有罪罪在朕躬君雖任職何必顓焉其勉察郡國守相群牧非其人者毋令久賊民永執綱紀務悉聰明強食慎疾見漢書于定國傳定國上書自劾歸侯印乞骸骨上報詰問賈捐之珠崖內屬為郡久矣今背叛逆節而云不當擊長蠻夷之亂虧先帝功德經義何以處之見漢書賈捐之傳初元元年珠崖又反連年不定捐之建議以為不當擊上使侍中駙馬都尉樂昌侯王商詰問捐之使許嘉口諭呼韓邪單于單于上書願罷北邊吏士屯戍子孫世世保塞單于鄉慕禮義所以為民計者甚厚此長久之策也朕甚嘉之中國四方皆有關梁障塞非獨以備塞外也亦以防中國姦邪放縱出為寇害故明法度以專衆心也敬諭單于之意朕無疑焉為單于怪其不罷故使大司馬車騎將軍嘉曉單于見漢書胸奴傳下
