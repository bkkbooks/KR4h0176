body:
  text: 哀帝尊定陶傳太后等詔春秋母以子貴尊定陶太后曰恭皇太后丁姬曰恭皇后各置左右詹事食邑如長信宮中宮見漢書哀紀又見孝元傅昭儀傳罷樂府官詔惟世俗奢泰文巧而鄭衛之聲興夫奢泰則下不孫而國貧文巧則趍末背本者衆鄭衛之聲興則淫辟之化流而欲黎庶敦朴家給猶濁其源而求其清流豈不難哉孔子不云乎放鄭聲鄭聲淫其罷樂府官郊祭樂及古兵法武樂在經非鄭衛之樂者條奏別屬他官見漢書禮樂志按哀紀亦載此詔約文云鄭聲淫而亂樂聖王所放其罷樂府又見通典一百四十一詔王莽先帝委政於君而棄群臣朕得奉宗廟誠嘉與君同心合意今君移病求退以著朕之不能奉順先帝之意朕甚悲傷焉已詔尚書待君奏事見漢書王莽傳莽上書乞骸骨哀帝遣尚書令詔莽益封王根等詔曲陽侯根前在位建社稷策侍中太僕安陽侯舜往時護太子家導朕忠誠專一有舊恩新都侯莽憂勞國家執義堅固庶幾與為治太皇太后詔休就第朕甚閔焉其益封根二千戶舜五百戶莽三百五十戶以莽為特進朝朔望又還紅陽侯立京師見漢書元后傳益封河閒王良詔河間王良喪太后三年為宗室儀表益封萬戶見漢書哀紀又見河閒王德傳哀帝下詔褒揚議限列名田詔制節謹度以防奢淫為政所先百王不易之道也諸侯王列侯公主吏二千石及豪富民多畜奴婢田宅亡限與民爭利百姓失職重困不足其議限列見漢書哀紀遣使循行水災詔朕承宗廟之重戰戰兢兢懼失天心間者日月亡光五星失行郡國比比地動乃者河南潁川郡水出流殺人民壞敗廬舍朕之不德民反蒙辜朕甚懼焉已遣光祿大夫循行舉籍賜死者棺錢人三千其令水所傷縣邑及他郡國災害什四以上民資不滿十萬皆無出今年租賦見漢書哀紀遣王根就國詔先帝遇根況父子至厚也今乃背忘恩義以根嘗建社稷之策遣就國免況為庶人歸故郡根及況父商所薦舉為官者皆罷見漢書元后傳益封王莽詔新都侯莽憂勞國家執義堅固朕庶幾與為治太皇太后詔莽就第朕甚閔焉其以黃郵聚戶三百五十益封莽位特進給事中朝朔望見禮如三公車駕乘緑車從見漢書王莽傳舉賢詔蓋聞聖王之治以得賢為首其與大司馬列侯將軍中二千石州牧守相舉孝弟惇厚能直言通政事延于側陋可親民者各一人見漢書哀紀免孫寶詔制詔丞相大司空司隸寶奏故尚書僕射崇冤請獄治尚書令昌案崇近臣罪惡暴著而寶懷邪附下罔上以春月作詆欺遂其姦心蓋國之賊也傳不云乎惡利口之邦家其免寶為庶人見漢書孫寶傳尊恭皇太后詔漢家之制推親親以顯尊尊定陶恭皇之號不宜復稱定陶其尊恭皇太后曰帝太太后稱永信宮恭皇后曰帝太后稱中安宮立恭皇廟于京師赦天下徒見漢書哀紀葬丁太后朕聞夫婦一體詩云穀則異室死則同穴昔季武子成寢杜氏之殯在西階下請合葬而許之附葬之禮自周興焉郁郁乎文哉吾從周孝子事亡如事存帝太后宜起陵恭皇之園見漢書哀紀又見外戚定陶恭姬傳大赦改元詔制詔丞相御史蓋聞尚書五曰考終命言大運一終更紀天元人元考文正理推曆定紀數如甲子也朕以眇身入繼太祖承皇天總百僚子元元未有應天心之效即位出入三年災變數降日月失度星辰錯謬高下貿易大異連仍盜賊並起朕甚懼焉戰戰兢兢唯恐陵夷惟漢至今二百載曆紀開元皇天降非材之祐漢國再獲受命之符朕之不德曷敢不通夫受天之元命必與天下自新其大赦天下以建平二年為太初元年號曰陳聖劉太平皇帝漏刻以百二十為度布告天下使明知之見漢書李尋傳蠲除改元制書詔朕獲保宗廟為政不德變異屢仍恐懼戰栗未知所繇待詔夏賀良等建言改元易號增益漏刻可以永安國家朕信道不篤過聽賀良等言冀為海內獲福卒無嘉應久旱為災以問賀良等對當復改制度皆背經誼違聖制不合時宜夫過而不改是為過矣六月甲子制書非赦令也皆蠲除之賀良等反道惑衆姦態當窮竟皆下獄見漢書李尋傳又見哀紀有刪節策詔王崇朕以君有纍世之美故踰列次在位以來忠誠匡國未聞所繇反懷詐諼之辭欲以攀救舊姻之家大逆之辜舉錯專恣不遵法度亡以示百僚左遷為大司農見漢書王吉傳封傅商為汝昌侯詔朕幼而孤皇太太后躬自養育免于襁褓教道以禮至於成人惠澤茂焉欲報之德皞天罔極前追號皇太太后父為崇祖侯惟念德報未殊朕甚恧焉侍中光祿大夫商皇太太后父同産子小自保大恩義最親其封商為汝昌侯為崇祖侯後更號崇祖為汝昌哀侯見漢書鄭崇傳封董賢等詔朕居位以來寢疾未瘳反逆之謀相連不絶賊亂之臣近侍帷幄前東平王雲與后謁祝詛朕使侍醫伍宏等內侍案脈幾危社稷殆莫甚焉昔楚有子玉得臣晉文為之側席而坐近事汲黯折淮南之謀今雲等至有圖弒天子逆亂之謀者是公卿股肱莫能悉心務聰明以銷未萌之故賴宗廟之靈侍中駙馬都尉賢等發覺以聞咸伏其辜書不云乎用德章厥善其封賢為高安侯南陽太守寵為方陽侯左曹光祿大夫躬為宜陵侯見漢書王嘉傳又息夫躬傳舉明習兵法詔間者災變不息盜賊衆多兵革之徵或頗著見未聞將軍惻然深以為意簡練戎士繕修干戈器用盬惡孰當督之天下雖安忘戰必危將軍與中二千石舉明習兵法有大慮者各一人將軍二人詣公車見漢書息夫躬傳日蝕詔朕獲保宗廟不明不敏宿夜憂勞未皇寧息惟陰陽不調元元不贍未睹厥咎婁敕公卿庶幾有望至今有司執法未得其中或上暴虐假勢獲名溫良寬柔陷於亡滅是故殘賊彌長和睦日衰百姓愁怨靡所錯躬乃正月朔日有蝕之厥咎不遠在余一人公卿大夫其各悉心勉百寮敦任仁人黜遠殘賊期於安民陳朕之過失無有所諱其與將軍列侯中二千石舉賢良方正能直言者各一人大赦天下見漢書哀紀左遷毋將隆詔制詔丞相御史大夫交讓之禮興則虞芮之訟息隆位九卿既無以匡朝廷之不逮而反奏請與永信爭貴賤之賈程奏顯言衆莫不聞舉錯不聞舉錯不繇誼理爭求之名自此始無以示百寮傷化失俗以隆前有安國之言左遷為沛郡都尉見漢書毋將隆傳免傅嘉詔前為侍中毀譖仁賢誣訴大臣令俊艾者久失其位嘉傾覆巧僞挾姦以罔上崇黨以蔽朝傷善以肆意詩不云乎讒人罔極交亂四國其免嘉為庶人歸故郡見漢書孔光傳免息夫躬孫寵詔南陽太守方陽侯寵素亡廉聲有酷惡之資毒流百姓左曹光祿大夫宜陵侯躬虛造詐諼之策欲以詿誤朝廷皆交遊貴戚趨權門為名其免躬寵官遣就國見漢書息夫躬傳詔上計丞史歸告二千石詔書殿下禁吏無苛暴丞史歸告二千石順民所疾苦急去殘賊審擇良吏無任苛刻治獄決訟務得其中情詔憂百姓困於衣食二千石帥勸農桑思稱厚恩有以賑贍之無煩撓奪民時今日公卿以下務飭儉格奢侈過制度以益甚二千石身帥有以化之民冗食者請諭以法養視疾病致醫藥務治之詔書無飾廚養至今未變又更過度甚不稱歸告二千石務省約如法且案不改者長吏以聞宮寺鄉亭漏敗墻垣阤壞不治無辨護者不勝任先自劾不應法歸告二千石聽見續漢百官志注引漢舊儀御史大夫敕上計丞吏詔書殿下布告郡國臣下承宣無狀多不究百姓不蒙恩被化守長吏到郡與二千石同力為民興利除害務有以安之稱詔書郡國有茂才不皓者言上殘民貪污煩擾之吏百姓所苦務勿任用方察不稱者刑罰務於得中惡惡止其身選舉民侈過度務有以化之問今歲善惡孰與往年對上問今年盜賊孰與往年得無有群輩大賊對上見續漢百官志注引漢舊儀策免彭宣有司數奏言諸侯國人不得宿衛將軍不宜典兵馬處大位朕惟將軍任漢將之重而子又前取淮陽王女婚姻不絶非漢之制使光祿大夫曼賜將軍黃金五十斤安車駟馬其上左將軍印綬以關內侯歸家見漢書彭宣傳策免何武君舉錯煩苛不合衆心孝聲不聞惡名流行無以率示四方其上大司空印綬罷歸就國見漢書何武傳策免師丹夫三公者朕之腹心也輔善相過匡率百僚和合天下者也朕既不明委政於公閒者陰陽不調寒暑失常變異婁臻山崩地震河決泉涌流殺人民百姓流連無所歸心司空之職尤廢焉君在位出入三年未聞忠言嘉謀而反有朋黨相進不公之名乃者以挺力田議改幣章示君君內為朕建可改不疑以君之言博考朝臣乃希衆雷同外以為不便令觀者歸非於朕朕隱忍不宣為君受愆朕疾夫比周之徒虛僞壞化寖以成俗故屢以書飭君幾君省過求己而反不受退有後言及君奏封事傳於道路布聞朝市言事者以為大臣不忠辜陷重辟虛采名謗譏胸胸流於四方腹心如此謂疏者何殆謬於二人同心之利焉將何以率示群下附親遠方朕惟君位尊任重慮不周密懷諼迷國進退違命反覆異言甚為君恥之非所以共承天地永保國家之意以君嘗託傅位未忍考於理已詔有司赦君勿治其上大司空高樂侯印綬罷歸見漢書師丹傳策免傅喜君輔政出入三年未有昭然匡朕不逮而本朝大臣遂其姦心咎繇君焉其上大司馬印綬就第見漢書傅喜傳策免孔光丞相者朕之股肱所與共承宗廟統理海內輔朕之不逮以治天下也朕既不明災異重仍日月無光山崩河決五星失行是章朕之不德而股肱之不良也君前為御史大夫輔翼先帝出入八年卒無忠言嘉謀今相朕出入三年憂國之風復無聞焉陰陽錯謬歲比不登天下空虛百姓饑饉父子分散流離道路以十萬數而百官群職曠廢姦軌放縱盜賊並起或攻官寺殺長吏數以問君君無怵惕憂懼之意對毋能為是以群卿大夫咸惰哉莫以為意咎由君焉君秉社稷之重總百僚之任上無以匡朕之闕下不能綏安百姓書不云乎毋曠庶官天工人其代之於呼君其上丞相博山侯印綬罷歸見漢書孔光傳策蕭育南郡盜賊群輩為害朕甚憂之以太守威信素著故委南郡太守之官期於為民除害安元元而已亡拘於小文見漢書蕭望之附傳冊免丁明前東平王雲貪欲上位祠祭祝詛雲后舅伍宏以醫待詔與校祕書郎揚閎結謀反逆禍甚迫切賴宗廟神靈董賢等以聞咸伏其辜將軍從弟侍中奉車都尉吳族父左曹屯騎校尉宣皆知宏及栩丹諸侯王后親而宣除用丹為御屬吳與宏交通厚善數稱薦宏宏以附吳得興其惡心因醫技進幾危社稷朕以恭皇后故不忍有云將軍位尊任重既不能明威立義折消未萌又不深疾雲宏之惡而懷非君上阿為宣吳反痛恨雲等揚言為群下所冤又親見言伍宏善醫死可惜也賢等獲封極幸嫉妒忠良非毀有功於戲傷哉蓋君親無將將而誅之是以季友鳩叔牙春秋賢之趙質不討賊謂之弒君朕甚閔將軍陷于重刑故以書飭將軍遂非不改復與丞相嘉相比令嘉有依得以罔上有司致法將軍請獄治朕惟噬膚之恩未忍其上票騎將軍印綬罷歸就第見漢書董賢傳冊董賢為大司馬大將軍朕承天序惟稽古建爾于公以為漢輔往悉爾心統辟元戎折衝綏遠匡正庶事允執其中天下之衆受制于朕以將為命以兵為威烈可不慎與見漢書董賢傳白太后皇帝聞太后詔甚悲大司馬即不起皇帝即不敢聽政見漢書王莽傳報平當朕選于衆以君為相視事日寡輔政未久陰陽不調冬無大雪旱氣為災朕之不德何必君罪君何疑而上書乞骸骨歸關內侯爵邑使尚書令談賜君養牛一上尊酒十石君其勉致醫藥以自持見漢書平當傳責問王嘉相等前坐在位不盡忠誠外附諸侯操持兩心背人臣之義今所稱相等材美足以相計除罪君以道德位在三公以總方略一統萬類分明善惡為職知相等罪惡陳列著聞天下時輒以自劾今又稱譽相等云為朝廷惜之大臣舉錯恣心自在迷國罔上近由君始將謂遠者何對狀見漢書王嘉傳上書謝為皇太子臣幸得繼父守藩為諸侯王材質不足以假充太子之宮陛下聖德寬仁敬承祖宗奉順神祇宜蒙福祐子孫千億之報臣願且得留國邸旦夕奉問起居俟有聖嗣歸國守藩見漢書哀紀
