body:
  text: 呂后除重罪詔前日孝惠皇帝言欲除三族罪妖言令議未決而崩今除之見漢書呂后紀議定列侯功次詔高皇帝匡飭天下諸有功者皆受分地為列侯萬民大安莫不受休德朕思念至於久遠而功名不著亡以尊大誼施後世今欲差次列侯功以定朝位臧于高廟世世勿絶嗣子各襲其功位其與列侯議定奏之見漢書呂后紀廢少帝詔凡有天下治為萬民命者蓋之如天容之如地上有歡心以安百姓百姓欣然以事其上歡欣交通而天下治今皇帝疾久不已乃失惑惛亂不能繼嗣奉宗廟祭祀不可屬天下其代之見史記呂后紀議昭靈等尊號詔昭靈夫人太上皇妃也武哀侯宣夫人高皇帝兄姊也號諡不稱其議尊號見漢書呂后紀報胸奴冒頓書單于不忘弊邑賜之以書弊邑恐懼退日自圖年老氣衰髮齒墮落行步失度單于過聽不足以自污弊邑無罪宜在見赦竊有御車二乘馬二駟以奉常駕見漢書胸奴傳遺孫女徵臣書國中口語籍籍慎無復至江都見漢書江都王非傳璽書徵昌邑王制詔昌邑王使行大鴻臚事少府樂成宗正德光祿大夫吉中郎將利漢徵王乘七乘傳詣長安邸見漢書武五子傳奏免東平相王尊尊為相倨傲不臣王血氣未定不能忍愚誠恐母子俱死今妾不得使王復見尊陛下不留意妾願先自殺不忍見王之失義也見漢書王尊傳詔有司復甘泉泰畤等祠蓋聞王者承事天地文接泰一尊莫著於祭祀孝武皇帝大聖通明始建上下之祀營泰畤於甘泉定后土於汾陰而神祇安之饗國長久子孫蕃滋纍世遵業福流於今今皇帝寬仁孝順奉循聖緒靡有大愆而久無繼嗣思其咎職殆在徙南北郊違先帝之制改神祇舊位失天地之心以妨繼嗣之福春秋六十未見皇孫食不甘味寢不安席朕甚悼焉春秋大復古善順祀其復甘泉泰畤汾陰后土如故及雍五畤陳寶祠在陳倉者見漢書郊祀志下治問成帝發病狀詔皇帝暴崩群衆歡譁怪之掖庭令輔等在後庭左右侍燕迫近雜與御史丞相廷尉治問皇帝起居發病狀見漢書外戚傳下詔有司復長安南北郊皇帝即位思順天心遵經義定郊禮天下說喜懼未有皇孫故復甘泉泰畤汾陰后土庶幾獲福皇帝恨難之卒未得其祐其復南北郊長安如故以順皇帝之意也見漢書郊祀志下詔有司復甘泉泰畤汾陰后土祠皇帝孝順奉承聖業靡有解怠而久疾未瘳夙夜惟思殆繼體之君不宜改作其復甘泉泰畤汾陰后土祠如故見漢書郊祀志下明年復令太皇太后詔有司貶徙趙太后詔前皇太后與昭儀俱侍帷幄姊弟專寵錮寢執賊亂之謀殘滅繼嗣以危宗廟悖天犯祖無為天下母之義貶皇太后為孝成皇后徙居北宮見漢書外戚孝成趙皇后傳哀帝崩王莽白太后詔有司令傅皇后退居桂宮詔定陶共王太后與孔鄉侯晏同心合謀背恩忘本專恣不軌與至尊同稱號終沒至乃配食於左坐悖逆無道今令孝哀皇后退就桂宮見漢書外戚孝哀傅皇后傳廢趙皇后詔皇后自知罪惡深大朝請希闊失婦道無共養之禮而有狼虎之毒宗室所怨海內之讎也而尚在小君之位誠非皇天之心夫小不忍亂大謀恩之所不能已者義之所割也今廢皇后為庶人就其園見漢書外戚傳禁舉赦前事詔夫赦令者將與天下更始誠欲令百姓改行潔己全其性命也往者有司多舉奏赦前事纍增罪過誅陷亡辜殆非重信慎刑灑心自新之意也及選舉者其歷職更事有名之士則以為難保廢而弗舉甚謬於赦小過舉賢材之義諸有臧及內惡未發而薦舉者皆勿案驗令士厲精鄉進不以小疵妨大材自今以來有司無得陳赦前事置奏上有不如詔書為虧恩以不道論定著令布告天下使明知之見漢書平紀令王莽勿辭安漢公詔無偏無黨王道蕩蕩屬有親者義不得阿君有安宗廟之功不可以骨肉故蔽隱不揚君其勿辭見漢書王莽傳上君以選故而辭以疾君任重不可闕以時亟起見漢書王莽傳上益封孔光等四輔詔太傅博山侯光宿衛四世世為傅相忠孝仁篤行義顯著建議定策益封萬戶以光為太師與四輔之政車騎將軍安陽侯舜積纍仁孝使迎中山王折衝萬里功德茂著益封萬戶以舜為太保左將軍光祿勳豐宿衛三世忠信仁篤使迎中山王輔導共養以安宗廟封豐為廣陽侯食邑五千戶以豐為少傅皆授四輔之職疇其爵邑各賜第一區侍中奉車都尉邯宿衛勤勞建議定策封邯為承陽侯食邑二千四百戶見漢書王莽傳上以王莽為太傅詔大司馬新都侯莽三世為三公典周公之職建萬世策功德為忠臣宗化流海內遠人慕義越裳氏重譯獻白雉其以召陵新息二縣戶二萬八千益封莽復其後嗣疇其爵邑封功如蕭相國以莽為太傅幹四輔之事號曰安漢公以故蕭相國甲第為安漢公第定著於令傳之無窮見漢書王莽傳上聽王莽讓益封詔公自期百姓家給是以聽之其令公奉舍人賞賜皆倍故百姓家給人足大司徒大司空以聞見漢書王莽傳上拜平帝母衛姬為中山孝王后詔中山孝王后深分明為人後之義條陳故定陶傅太后丁姬悖天逆理上僭位號徙定陶王於信都為共王立廟於京師如天子制不畏天命侮聖人言壞亂法度居非其制稱非其號是以皇天震怒火燒其殿六年之間大命不遂禍殃仍重竟令孝哀帝受其餘災大失天心夭命暴崩又令共王祭祀絶廢精魂無所依歸朕惟孝王后深說經義明鏡聖法懼古人之禍敗近事之咎殃畏天命奉聖言是乃久保一國長獲天祿而令孝王永享無疆之祀福祥之大者也朕甚嘉之夫褒義賞善聖王之制其以中山故安戶七千益中山后湯沐邑加賜及中山王黃金各百斤增傅相以下秩見漢書外戚中山衛姬傳封王堅固為卭成侯詔孝宣王皇后朕之姑深念奉質共修之義恩結于心惟邛成共侯國廢祀絶朕甚閔焉其封共侯曾孫堅固為邛成侯見漢書外戚孝宣王皇后傳令王莽平決奏事詔皇帝幼年朕且統政比加元服今衆事煩碎朕春秋高精氣不堪殆非所以安躬體而育養皇帝者也故選忠賢立四輔群下勸職永以康寧孔子曰巍巍乎舜禹之有天下而不與焉自今以來惟封爵乃以聞他事安漢公四輔平決州牧二千石及茂材吏初除奏事者輒引入至近署對安漢公考故官問新職以知其稱否見漢書王莽傳上還傅喜詔高武侯喜姿性端愨論議忠直雖與故定陶太后有屬然終不順指從邪介然守節以故斥逐就國傳不云乎歲寒然後知松柏之後凋也其還喜長安以故高安侯莫府賜喜位特進奉朝請見漢書傅喜傳罷申屠剛詔剛所言僻經妄說違背大義其罷歸田里見後漢申屠剛傳平帝時舉賢良方正對策莽令太后下詔更名詔皇帝二名通于器物今更名合於古制使太師光奉太牢告祠高廟見漢書平紀賜公孫弘子孫當為後者爵詔太皇太后詔大司徒大司空蓋聞治國之道富民為始富民之要在於節儉孝經曰安上治民莫善於禮禮與奢也寧儉昔者管仲相齊桓霸諸侯有九合一匡之功而仲尼謂之不知禮以其奢泰侈擬於君故也夏禹卑宮室惡衣服後聖不循由此言之治之盛也德優矣莫高於儉儉化俗民則尊卑之序得而骨肉之恩親爭訟之原息斯乃家給人足刑錯之本也歟可不務哉夫三公者百寮之率萬民之表也未有樹直表而得曲影者也孔子不云乎子率以正孰敢不正舉善而教不能則勸維漢興以來股肱宰臣身行儉約輕財重義較然著明未有若故丞相平津侯公孫弘者也位在丞相而為布被脫粟之飯不過一肉故人所善賓客皆分奉祿以給之無有所餘誠內自克約而外從制汲黯詰之乃聞于朝此可謂減於制度而可施行者也德優則行否則止與內奢泰而外為詭服以釣虛譽者殊科以病乞骸骨孝武皇帝即制曰賞有功褒有德善善惡惡君宜知之其省思慮存精神輔以醫藥賜告治病牛酒雜帛居數月有瘳視事至元狩二年竟以善終于相位夫知臣莫若君此其效也弘子度嗣爵後為山陽太守坐法失侯夫表德章義所以率俗厲化聖王之制不易之道也其賜弘後子孫之次當為後者爵關內侯食邑三百戶徵詣公車上名尚書朕親臨拜焉見史記平津侯傳附録詔群臣蓋聞母后之義思不出乎門閾國不蒙佑皇帝年在襁褓未任親政戰戰兢兢懼於宗廟之不安國家之大綱微朕孰當統之是以孔子見南子周公居攝蓋權時也勤身極思憂勞未綏故國奢則視之以儉矯枉者過其正而朕不身帥將謂天下何夙夜夢想五穀豐孰百姓家給比皇帝加元服委政而授焉今誠未皇于輕靡而備味庶幾與百僚有成其勗之哉見漢書王莽傳上莽帥群臣奏願遵帝王之常服復太官之法膳又令太后下詔詔王莽聞公菜食憂民深矣今秋幸熟公勤於職以時食肉愛身為國見漢書王莽傳上勿采王莽女詔王氏女朕之外家其勿采見漢書王莽傳上為平帝納采王莽女詔遣大司徒大司空策告宗廟雜加卜筮皆曰兆遇金水王相卦遇父母得位所謂康強之占逢吉之符也見漢書王莽傳上詔王莽夫唐堯有丹朱周文王有管蔡此皆上聖亡奈下愚子何以其性不可移也公居周公之位輔成王之主而行管蔡之誅不以親親害尊尊朕甚喜之昔周公誅四國之後大化乃成至於刑錯公其專意翼國期於致平見漢書王莽傳上非坐不道無得繫婦女老弱詔蓋夫婦正則父子親人倫定矣前詔有司復貞婦歸女徒誠欲以防邪辟全貞信及眊悼之人刑罰所不加聖王之所制也惟苛暴吏多拘繫犯法者親屬婦女老弱搆怨傷化百姓苦之其明敕百寮婦女非身犯法及男子年八十以上七歲以下家非坐不道詔所名捕它皆無得繫其當驗者即驗問定著令見漢書平紀又見通典一百六十三詔孔光等公每見叩頭流涕固辭今移病固當聽其讓令眂事邪將當遂行其賞遣歸就第也見漢書王莽傳上許刻宰衡太傅大司馬印章詔可韍如相國朕親臨授焉見漢書王莽傳上答群臣請加王莽九錫詔可其議九錫之法見漢書王莽傳上詔孔光太師光聖人之後先師之子德行純淑道術通明居四輔職輔道于帝今年耆有疾俊艾大臣惟國之重其猶不可以闕焉書曰無遺耇老國之將興尊師而重傅其令太師毋朝十日一賜餐賜太師靈壽杖黃門令為太師省中坐置几太師入省中用杖賜餐十七物然後歸老于弟官屬按職如故見漢書孔光傳
