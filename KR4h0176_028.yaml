body:
  text: 元王皇后置宗師詔蓋聞帝王以德撫民其次親親以相及也昔堯睦九族舜惇敘之朕以皇帝幼年且統國政惟宗室子皆太祖高皇帝子孫及兄弟吳頃楚元之後漢元至今十有餘萬人雖有王侯之屬莫能相糾或陷入刑罪教訓不至之咎也傳不云乎君子篤於親則民興於仁其為宗室自太上皇以來族親各以世氏郡國置宗師以糾之致教訓焉二千石選有德義者以為宗師考察不從教令有冤失職者宗師得因郵亭書言宗伯請以聞常以歲正月賜宗師帛各十匹見漢書平紀議九錫禮儀詔可唯公功德光于天下是以諸侯王公列侯宗室諸生吏民翕然同辭連守闕庭故下其章諸侯宗室辭去之日復見前重陳雖曉喻罷遣猶不肯去告以孟夏將行厥賞莫不歡悅稱萬歲而退今公每見輒流涕叩頭言願不受賞賞即加不敢當位方制作未定事須公而決故且聽公制作畢成群公以聞究于前議其九錫禮儀亟奏見漢書王莽傳封劉歆王惲等列侯詔羲和劉歆等四人使治明堂辟雍令漢與文王靈臺周公作洛同符太僕王惲等八人使行風俗宣明德化萬國齊同皆封為列侯見漢書平紀改葬傅太后及丁姬詔因故棺為致椁作冢祠以太牢見漢書外戚定陶丁姬傳封師丹為義陽侯詔夫褒有德賞元功先聖之制百王不易之道也故定陶太后造稱僭號甚悖義理關內侯師丹端誠於國不顧患難執忠節據聖法分明尊卑之制確然有枉石之固臨大節而不可奪可謂社稷之臣矣有司條奏邪臣建定稱號者已放退而丹功賞未加殆繆乎先賞後罰之義非所以章有德報厥功也其以厚丘之中鄉戶二千一百封丹為義陽侯見漢書師丹傳詔賜免馬宮策太師大司徒扶德侯上書言前以光祿勳議故定陶共王母諡曰婦人以夫爵尊為號諡宜日孝元傅皇后稱渭陵東園臣知妾不得體君卑不得敵尊而希指雷同詭經辟説以惑誤上為臣不忠當伏斧鉞之誅幸蒙灑心自新又令得保首領伏自惟念入稱四輔出備三公爵為列侯誠無顏復望闕廷無心復居守府無宜復食國邑願上太師大司徒扶德侯印綬避賢者路下君章有司皆以為四輔之職為國維綱三公之任鼎足承君不有鮮明固守無以居位如君言至誠可聽惟君之惡在灑心前不敢文過朕甚多之不奪君之爵邑以著自古皆有死之義其上太師大司徒印綬使者以侯就弟見漢書馬宮傳出平帝媵妾詔皇帝仁惠無不顧哀每疾一發氣輒上逆害於言語故不及有遺詔其出媵妾皆歸家得嫁如孝文時故事見漢書平紀令安漢公居攝詔蓋聞天生衆民不能相治為之立君以統理之君年幼稚必有寄託而居攝焉然後能奉天施而成地化群生茂育書不云乎天工人其代之朕以孝平皇帝幼年且統國政幾加元服委政而屬之今短命而崩鳴呼哀哉已使有司徵孝宣皇帝玄孫二十三人差度宜者以嗣孝平皇帝之後玄孫年在繈褓不得至德君子孰能安之安漢公莽輔政三世比遭際會安光漢室遂同殊風至于制作與周公異世同符今前輝光囂武功長通上言丹石之符朕深思厥意云為皇帝者乃攝行皇帝之事也夫有法成易非聖人者亡法其令安漢公居攝踐祚如周公故事以武功縣為安漢公采地名曰漢光邑具禮儀奏見漢書王莽傳封劉嘉為師禮侯詔惟嘉父子兄弟雖與崇有屬不敢阿私或見萌芽相率告之及其禍成同共讎之應合古制忠孝著焉其以杜衍戶千封嘉為禮侯嘉子七人皆賜爵關內侯見漢書王莽傳上封孔光孫等詔故太師光雖前薨功效已列太保舜大司空豐輕車將軍邯步兵將軍建皆為誘進單于籌策又典靈臺明堂辟雍四郊定制度開子午道與宰衡同心説德合意并力功德茂著封舜子匡為同心侯林為説德侯光孫壽為合意侯豐孫匡為并力侯益邯建各三千戶見漢書王莽傳上進封莽二子及兄子詔進攝皇帝子褒新侯安為新舉公賞都侯臨為褒新公封光為衍功侯見漢書王莽傳上册罷董賢間者以來陰陽不調災害并臻元元蒙辜夫三公鼎足之輔也高安侯賢未更事理為大司馬不合衆心非所以折衝緩遠也其收大司馬印綬罷歸第見漢書董賢傳策免彭宣惟君視事日寡功德未效迫于老眊昏亂非所以輔國家綏海內也使光祿勳豐册詔君其上大司空印綬便就國見漢書彭宣傳策王莽為安漢公漢危無嗣而公定之四輔之職三公之任而公幹之群僚衆位而公宰之功德茂著宗廟以安蓋白雉之瑞周成象焉故賜嘉號曰安漢公輔翼於帝期於致平毋違朕意見漢書王莽傳上策遣龔勝邴漢惟元始二年六月庚寅光祿大夫太中大夫耆艾二人以老病罷太皇太后使謁者僕射策詔之曰蓋聞古者有司年至則致仕所以恭讓而不盡其力也今大夫年至矣朕愍以官職之事煩大夫其上子若孫若同産同産子一人大夫其修身守道以終高年賜帛及行道舍宿歲時羊酒衣衾皆如韓福故事見漢書兩龔傳策安漢公九錫文惟元始五年五月庚寅太皇太后臨于前殿延登詔之曰公進虛聽朕言前公宿衛孝成皇帝十有六年納策盡忠白誅故定陵侯淳于長以彌亂發姦登大司馬職在內輔孝哀皇帝即位驕妾窺欲姦臣萌動公手劾高昌侯董宏改正故定陶共王母之僭坐自是之後朝臣論議靡不據經以病辭位歸于第家為賊臣所陷就國之後孝哀皇帝覺寤復還公長安臨病加劇猶不忘公復特進位是夜倉卒國無儲主姦臣充朝危殆甚矣朕惟定國之計莫宜于公引納于朝即日罷退高安侯董賢轉漏之間忠策輒建綱紀咸張綏和元壽再遭大行萬事畢舉禍亂不作輔朕五年人倫之本正天地之位定欽承神祇經緯四時復千載之廢矯百世之失天下和會大衆方輯詩之靈臺書之作雒鎬京之制商邑之度於今復興昭章先帝之元功明著祖宗之令德推顯嚴父配天之義修立郊禘宗祀之禮以光大孝是以四海雍雍萬國慕義蠻夷殊俗不召自至漸化端冕奉珍助祭尋舊本道遵術重古動而有成事得厥中至德要道通于神明祖考嘉享光耀顯章天符仍臻元氣大同麟鳳龜龍衆祥之瑞七百有餘遂制禮作樂有綏靖宗廟社稷之大勳普天之下惟公是賴官在宰衡位上公今加九命之錫其以助祭共文武之職乃遂及厥祖於戲豈不休哉見漢書王莽傳上與成帝書前所道尚未效富平侯反復來其能默呼漢書敘傳詔丞相御史遣傅喜就國高武侯喜無功而封內懷不忠附下罔上與故大司空丹同心背畔放命圮族虧損德化罪惡雖在赦前不宜奉朝請其遣就國見漢書傅喜傳上疏言椒房用度妾誇布服糲食加以幼稚愚惑不明義理幸得免離茅屋之下備後宮掃除蒙過誤之寵居非命所當託汙穢不修曠職尸官數逆至法踰越制度當伏放流之誅不足以塞責乃壬寅日大長秋受詔椒房儀法御服輿駕所發諸官署及所造作遺賜外家群臣妾皆如竟寧以前故事妾伏自念入椒房以來遺賜外家未嘗踰故事每輒決上可覆問也今誠時世異制長短相補不出漢制而已纖微之間未必可同若竟寧前與黃龍前豈相放哉家吏不曉今一受詔如此且使妾搖手不得今言無得發取諸官殆謂未央宮不屬妾不宜獨取也言妾家府亦不當得妾竊惑焉幸得賜湯沐邑以自奉養亦小發取其中何害于誼而不可哉又詔書言服御所造皆如竟寧前吏誠不能揆其意即且令妾被服所為不得不如前設妾欲作某屏風張于某所曰故事無有或不能得則必繩妾以詔書矣此二事誠不可行唯陛下省察吏忮佷必欲自勝幸妾尚貴時猶以不急事操人況今日日益侵又獲此詔其操約人豈有所訴陛下見妾在椒房終不肯給妾纖微內邪若不私府小取將安所仰乎舊故中宮乃私奪左右之賤繒及發乘輿服繒言為待詔補已而貿易其中左右多竊怨者甚恥為之又故事以特牛祠大父母戴侯敬侯皆得蒙恩以太牢祠今當率如故事唯陛下哀之今吏甫受詔讀記直豫言使后知之非可復若私府有所取也其萌牙所以約制妾者恐失人理今但損車駕及毋若未央宮有所發遺賜衣服如故事則可矣其餘誠太迫急奈何妾薄命端遇竟寧前竟寧前於今世而比之豈可耶故時酒肉有所賜外家輒上表乃決又故杜陵梁美人歲時遺酒一石肉百斤耳妾甚少之遺田八子誠不可若是事率衆多不可勝以文陳俟自見索言之唯陛下深察焉見漢書外戚傳下自悼賦承祖考之遺德兮何性命之淑靈登薄軀於宮闕兮充下陳於後庭蒙聖皇之渥惠兮當日月之盛明揚光烈之翕赫兮奉隆寵於增成既過幸於非位兮竊庶幾乎嘉時每寤寐而絫息兮申佩離以自思陳女圖以鏡監兮顧女史而問詩悲晨婦之作戒兮哀褒閻之為郵美皇英之女虞兮榮任姒之母周雖愚陋其靡及兮敢舍心而忘茲歷年歲而悼懼兮閔蕃華之不滋痛陽祿與柘館兮仍繈褓而離災豈妾人之殃咎兮將天命之不可求白日忽已移光兮遂暗莫而昧幽猶被覆載之厚德兮不廢捐於罪郵奉共養於東宮兮託長信之末流共灑掃於帷幄兮永終死以為期願歸骨於山足兮依松柏之餘休重曰潛玄宮兮幽以清應門閉兮禁闥扃華殿塵兮玉階菭中庭萋兮緑草生廣室陰兮帷幄暗房櫳虛兮風泠泠感帷裳兮發紅羅紛綷縩兮紈素聲神眇眇兮密靚處君不御兮誰為榮俯視兮丹墀思君兮履綦仰視兮雲屋雙涕兮橫流顧左右兮和顏酌羽觴兮銷憂惟人生兮一世忽一過兮若浮已獨享兮高明處生民兮極休勉虞精兮極樂與福祿兮無期緑衣兮白華自古兮有之見漢書外戚傳列女傳八藝文類聚三十搗素賦測平分以知歲酌玉衡之初臨見禽華以麃色聽霜鶴之傳音佇風軒而結睇對愁雲之浮沈雖松梧之貞脆豈榮雕其異心若乃廣儲懸月暉水流清桂露朝滿涼襟夕輕燕薑含蘭而未吐趙女抽簧而絶聲改容飾而相命卷霜帛而下庭曳羅裙之綺靡振珠佩之精明若乃盼睞生姿動容多製弱態含羞妖風靡麗皎若明魄之升崖煥若荷華之昭晰調鉛無以玉其貌凝朱不能異其脣勝雲霞之邇日似桃李之向春紅黛相媚綺組流光笑笑移妍步步生芳兩靨如點雙眉如張穨肌柔液音性間良於是投香杵扣玫砧擇鸞聲爭鳳音梧因虛而調遠柱由貞而響沈散繁輕而浮楗節疏亮而清深含笙總築比玉兼金不塤不篪匪瑟匪琴或旅環而紓鬱或相參而不雜或將往而中還或已離而復合翔鴻為之徘徊落英為之颯沓調非常律聲無定本任落手之參差從風飆之遠近或連躍而更投或暫舒而長卷清寡鷥之命群哀離鶴之歸晚當是時也鍾期改聽伯牙弛琴桑間絶響濮上傳音蕭史編管以擬吹周王調笙以象吟若乃窈窕姝妙之年幽間貞專之性符皎日之心甘首疾之病歌采緑之章發東山之詠望明月而撫心對秋風而掩鏡閲絞練之初成擇玄黃之妙匹準華裁於昔時疑形異於今日想嬌奢之或至許椒蘭之多術勳陋製之無韻慮蛾眉之為愧懷百憂之盈抱空千里兮飲淚侈長袖於妍衭綴半月於蘭襟表纖手微縫庶見迹而知心訅沿路之遐敻怨芳菲之易泄書既封而重題笥已緘而更結慚行客而無言還空房而掩咽見古文苑又見藝文類聚八十五有刪節報諸姪書記言屬見所賜趙倢妤書以相比元帝被病無悰但鍛鍊後宮貴人書也類多華辭至如成帝則推誠寫實若家人夫婦相與書矣何可比也故略陳其長短今汝曹自評之見御覽引婦人集奏箋成帝臣妾久備掖庭先承幸御遣肆大號積有歲時近因始生之日復加善視之私特屈乘輿俯臨東掖久侍宴私再承幸御臣妾數月來內宮盈實月脈不流飲食美甘不異常日知聖躬之在體辨天日之入懷虹初貫日聽是珍符龍據妾胸茲為佳瑞更期蕃育神嗣抱日趨庭瞻望聖明踴躍臨賀謹此以聞見秦醇趙飛燕別傳奏上趙皇后書賀正位天地交畼貴人姊及此令吉光登正位為先人休不堪喜豫謹奏上二十六物以賀金屑組文茵一鋪沈水香蓮心碗一面五色同心大結一盤鴛央萬金錦一匹琉璃屏風一張枕前不夜珠一枚含香緑毛狸藉一鋪通香虎皮檀象一座龍香握魚二首獨搖寶蓮一鋪七出菱花鏡一簽精金彄環四指若亡絳綃單衣一襲香文羅手藉三幅七回光雄肪髮澤一盎紫金被褥香罏一枚文犀辟毒箸一雙碧玉膏簽一合見趙飛燕外傳今日嘉辰貴姊懋膺洪册謹上襚三十五條以陳踊躍之心金華紫輪帽金華紫羅面衣織成上襦織成下裳五色文綬鴛鴦襦鴛鴦被鴛鴦褥金錯繡襠七寶綦履五色文玉環同心七寶叉黃金步搖合歡圓璫琥珀枕龜文枕珊瑚玦馬瑙彄雲母扇孔雀扇翠羽扇九華扇五明扇雲母屏風琉璃屏風五層金博山香罏回風扇椰葉席同心梅合枝李青木香沈水香香螺卮九真雄麝香七枝鐙見西京雜記上與藉武詔記取牛宮令舍婦人新彥兒婢六人盡置暴室獄母問兒男女誰兒也今夜漏上五刻持兒與舜會東交掖門告武以篋中物書豫獄中婦人武自臨飲之赫蹄書告偉能努力飲此藥不可復入女自知之又與藉武詔記告武篋中有死兒埋屏處勿令人知以上並漢書孝成趙皇后傳
