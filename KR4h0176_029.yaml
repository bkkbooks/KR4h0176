body:
  text: 吳王濞下令國中寡人年六十二身自將少子年十四亦為士卒先諸年上與寡人比下與少子等者皆發見史記吳王濞傳漢書吳王濞傳發使遺諸侯王書吳王劉濞敬問膠西王膠東王災川王濟南王趙王楚王淮南王衡山王廬江王故長沙王子幸教寡人以漢有賊臣錯無功天下侵奪諸侯地使吏劾繫訊治以僇辱之為故不以諸侯人君禮遇劉氏骨肉絶先帝功臣進任姦宄詿亂天下欲危社稷陛下多病志失不能省察欲舉兵誅之謹聞教敝國雖狹地方三千里人雖少精兵可具五十萬寡人素事南越三十餘年其王君皆不辭分其卒以隨寡人又可得三十餘萬寡人雖不肖願以身從諸王南越直長沙者因王子定長沙以北西走蜀漢中告越楚王淮南三王與寡人西面齊諸王與趙王定河閒河內或入臨晉關或與寡人會雒陽燕王趙王固與胡王有約燕王北定代雲中摶胡衆入蕭關走長安匡正天子以安高廟願王勉之楚元王子淮南三王或不沐洗十餘年怨入骨髓欲一有所出之久矣寡人未得諸王之意未敢聽今諸王苟能存亡繼絶振弱伐暴以安劉氏社稷之所願也吳國雖貧寡人節衣食之用積金錢修兵革聚穀食夜以繼日三十餘年矣凡為此願諸王勉用之能斬捕大將者賜金五千斤封萬戶列將三千斤封五千戶裨將二千斤封二千戶二千石千斤封千戶皆為列侯其以軍若城邑降者卒萬人邑萬戶如得大將人戶五千如得列將人戶三千如得裨將人戶千如得二千石其小吏皆以差次受爵金他封賜皆倍常法其有故爵邑者更益勿因願諸王明以令士大夫弗敢欺也寡人金錢在天下者往往而有非必取於吳諸王日夜用之弗能盡有當賜者告寡人寡人且往遺之敬以聞見史記吳王濞傳漢書吳王濞傳遺諸侯王書高帝平定天下王諸子弟悼惠王王齊悼惠王薨孝惠帝使留侯良立臣為齊王孝惠崩高后用事春秋高聽諸呂擅廢帝更立又比殺三趙王滅梁趙燕以王諸呂分齊為四忠臣進諫上惑亂弗聽今高后崩而帝春秋富未能治天下固恃大臣諸侯而諸呂又擅自尊官聚兵嚴威劫列侯忠臣矯制以令天下宗廟所以危寡人率兵入誅不當為王者見史記呂后紀又見齊悼惠王世家漢書高五王傳皆小異屏風賦惟茲屏風出自幽谷根深枝茂號為喬木孤生陋弱畏金彊族移根易土委伏溝瀆飄飄危殆靡安措足思在蓬蒿林有朴樕然常無緣悲愁酸毒天啓我心遭遇微祿中郎繕理收拾捐朴大匠攻之刻雕削斫表雖剝裂心實貞愨等化器類庇蔭尊屋列在左右近君頭足賴蒙成濟其恩弘篤何惠施遇分好沾渥不逢仁人永為枯木見藝文類聚六十九初學記二十五御覽七百一上書諫伐南越陛下臨天下布德施惠緩刑罰薄賦斂哀鰥寡恤孤獨養耆老振匱乏盛德上隆和澤下洽近者親附遠者懷德天下攝然人安其生自以沒身不見兵革今聞有司舉兵將以誅越臣安竊為陛下重之越方外之地劗髮文身之民也不可以冠帶之國法度理也自三代之盛胡越不與受正朔非彊弗能服威弗能制也以為不居之地不牧之民不足以煩中國也故古者封內甸服封外侯服侯衛賓服蠻夷要服戎狄荒服遠近藝異也自漢初定已來七十二年吳越人相攻擊者不可勝數然天子未嘗舉兵而入其地也臣聞越非有城郭邑里也處溪谷之間篁竹之中習於水鬭便於用舟地深昧而多水險中國之人不知其藝阻而入其地雖百不當其一得其地不可郡縣也攻之不可暴取也以地圖察其山川要塞相去不過寸數而閒獨數百千里阻險林叢弗能盡著視之若易行之甚難天下賴宗廟之靈方內大寧戴白之老不見兵革民得夫婦相守父子相保陛下之德也越人名為藩臣貢酎之奉不輸大內一卒之用不給上事自相攻擊而陛下發兵救之是反以中國而勞蠻夷也且越人愚戇輕薄負約反覆其不用天子之法度非一日之積也一不奉詔舉兵誅之臣恐後兵革無時得息也閒者數年歲比不登民待賣爵贅子以接衣食賴陛下德澤振救之得母轉死溝壑四年不登五年復蝗民生未復今發兵行數千里資衣糧入越地輿轎而隃領拖舟而入水行數百千里夾以深林叢竹水道上下擊石林中多蝮蛇猛獸夏月暑時歐泄霍亂之病相隨屬也曾未施兵接刃死傷者必衆矣前時南海王反陛下先臣使將軍閒忌將兵擊之以其軍降處之上淦後復反會天暑多雨樓船卒水居擊櫂未戰而疾死者過半親老涕泣孤子謕號破家散業迎尸千里之外裹骸骨而歸悲哀之氣數年不息長老至今以為記曾未入其地而禍已至此矣臣聞軍旅之後必有凶年言民之各以其愁苦之氣薄陰陽之和感天地之精而災氣為之生也陛下德配天地明象日月恩至禽獸澤及草木一人有飢寒不終其天年而死者為之悽愴于心今方內無狗吠之警而使陛下甲卒死亡暴露中原霑漬山谷邊境之民為之早閉晏開鼂不及夕臣安竊為陛下重之不習南方地形者多以越為人衆兵彊能難邊城淮南全國之時多為邊吏臣竊聞之與中國異限以高山人迹所絶車道不通天地所以隔外內也其入中國必下領水領水之山峭峻漂石破舟不可以大船載食糧下也越人欲為變必先田餘干界中積食糧乃入伐材治船邊城守候誠謹越人有入伐材者輒收捕焚其積聚雖百越奈邊城何且越人綿力薄材不能陸戰又無車騎弓弩之用然而不可入者以保地險而中國之人不能其水土也臣聞越甲卒不下數十萬所以入之五倍乃足挽車奉餉者不在其中南方暑溼近夏疸熱暴露水居蝮蛇蠚生疾癘多作兵未血刃而病死者什二三雖舉越國而虜之不足以償所亡臣聞道路言閩越王弟甲弒而殺之甲以誅死其民未有所屬陛下若欲來內處之中國使重臣臨存施德垂賞以招致之此必攜幼扶老以歸聖德若陛下無所用之則繼其絶世存其亡國建其王侯以為畜越此必委質為藩臣世共貢職陛下以方寸之印丈二之組填撫方外不勞一卒不頓一戟而威德益行今以兵入其地此必震恐以有司為欲屠滅之也必雉兔逃入山林險阻背而去之則復相群聚留而守之歷歲經年則士卒罷倦食糧乏絶男子不得耕稼婦人不得紡績織紝丁壯從軍老弱轉餉居者無食行者無糧民苦兵事亡逃者必衆隨而誅之不可勝盡盜賊必起臣聞長老言秦之時嘗使尉屠睢擊越又使監祿鑿渠通道越人逃入深山林叢不可得攻留軍屯守空地曠日持久士卒勞倦越乃出擊之秦兵大破乃發適戍以備之當此之時外內騷動百姓靡敝行者不還往者莫反皆不聊生亡逃相從群為盜賊於是山東之難始興此老子所謂師之所處荊棘生之者也兵者凶事一方有急四面皆從臣恐變故之生姦邪之作由此始也周易曰高宗伐鬼方三年而克之鬼方小蠻夷高宗殷之盛天子也以盛天子伐小蠻夷三年而後克言用兵之不可不重也臣聞天子之兵有征而無戰言莫敢較也如使越人蒙死徼幸以逆執事之顏行廝輿之率有一不備而歸者雖得越王之首臣猶竊為大漢羞之陛下以四海為境九州為家八藪為囿江漢為池生民之屬皆為臣妾人徒之衆足以奉千官之共租稅之收足以給乘輿之御玩心神明秉執聖道負黼衣馮玉几南面而聽斷號令天下四海之內莫不嚮應陛下垂德惠以覆露之使元元之民安生樂業則澤被萬世傳之子孫施之無窮天下之安猶泰山而四維之也夷狄之地何足以為一日之閒而煩汗馬之勞乎詩云王猶允塞徐方既來言王道甚大而遠方懷之也臣聞之農夫勞而君子養焉愚者言而智者擇焉臣安得為陛下守藩以身為鄣蔽人臣之任也邊境有警愛身之死而不畢其愚非忠臣也臣安竊恐將吏之以十萬之師為一使之任也見漢書嚴助傳上書告張湯姦狀湯大臣也史謁居有病湯至為摩足疑與為大姦見史記張湯傳淮南王安罪議淮南王安甚大逆無道謀反明白當伏誅見史記淮南王長附傳訟太子丹充逋逃小臣苟為姦訛激怒聖朝欲取必於萬乘以復私怨後雖烹醢計猶不悔臣願選從趙國勇敢士從軍擊胸奴極盡死力以贖丹罪見漢書江充傳淮南王安罪議淮南王安廢法行邪懷詐僞心以亂天下熒惑百姓倍畔宗廟妄作妖言春秋曰臣無將將而誅安罪重於將謀反形已定臣端所見其書節印圖及他逆無道事驗明白甚大逆無道當伏其法而論國吏二百石以上及比者宗室近幸臣不在法中者不能相教當皆免官削爵為士伍母得宦為吏其非吏他贖死金二斤八兩以章臣安之罪使天下明知臣子之道母敢復有邪僻倍畔之意見史記淮南王長附傳又見漢書文木賦麗水離披生彼高崖拂天河而布葉橫日路而摧枝幼鵾羸鷇單雄寡雌紛紜翔集嘈嗷鳴啼載釐雪而梢徑風將等歲于二儀巧匠不識王子見知乃命斑爾載斧伐斯隱若天崩豁如地裂花葉分披條枝摧折既剝既刊見其文章或如龍盤虎踞復以鸞集鳳翔青緺紫綬環璧圭璋釐山纍嶂連波疊浪奔電屯雲薄霧濃氛麚宗驥旅雞族雉群蠋繡鴦錦蓮薄芰文色比金而有裕質參玉而無分裁為用器曲直舒卷修竹映池高松植巘制為樂器婉轉蟠行鳳將九子龍導五駒制為屏風鬱岪穹隆制為杖几極麗窮美制為枕案文章璀璨彪炳煥汗制為盤盂采玩蜘蛛猗歟君子其樂只且見西京雜記下聞樂對臣聞悲者不可為絫欷思者不可為歎息故高漸離擊筑易水之上荊軻為之低而不食雍門子一微吟孟嘗君為之於邑今臣心結日久每聞幼眇之聲不知涕泣之橫集也夫衆煦漂山聚蚊成靁朋黨執虎十夫橈椎是以文王拘于牖里孔子厄于陳蔡此乃蒸庶之成風增積之生害也臣身遠與寡莫為之先衆口鑠金積毀銷骨叢輕折軸羽翮飛肉紛驚逢羅潸然出涕臣聞白日曬光幽隱皆照明月曜夜蚊虻宵見然雲蒸列布杳冥晝昏塵埃抪覆昧不見泰山何則物有蔽之也今臣雍閼不得聞讒言之徒螽生道遼路遠曾莫為臣聞臣竊自悲也臣聞社鼷不灌屋鼠不熏何則所託者然也臣雖薄也得蒙肺附位雖卑也得為東藩屬又稱兄今群臣非有葭莩之親鴻毛之重群居黨議朋友相為使夫宗室擯卻骨肉冰釋斯伯奇所以流離比干所以橫分也詩云我心憂傷惄焉如搗假寐永歎唯憂用老心之憂矣疢如疾首臣之謂也見漢書景十三王傳為燕王旦命令群臣寡人賴先帝休德獲奉北藩親受明詔職吏事領庫兵飭武備任重職大夙夜兢兢子大夫將何以規佐寡人且燕國雖小成周之建國也上自召公下及昭襄于今千載豈可謂無賢哉寡人束帶聽朝三十餘年曾無聞焉其者寡人之不及與意亦子大夫之思有所不至乎其咎安在方今寡人欲嬌邪防非章聞揚和撫慰百姓移風易俗厥路何由子大夫其各悉心以對寡人將察焉見漢書武五子燕王旦傳上書請立武帝廟竊見孝武皇帝躬聖道孝宗廟慈愛骨肉和集兆民德配天地明並日月威武洋溢遠方執寶而朝增郡數十斥地且倍封泰山禪梁父巡狩天下遠方珍物陳于太廟德甚休盛請立廟郡國見漢書武五子傳上書為丁外人求侯子路喪姊期而不除孔子非之子路曰由不幸寡兄弟不忍除之故曰觀過知仁今臣與陛下獨有長公主為姊陛下幸使丁外人侍之外人宜蒙爵號見漢書外戚傳上上疏請入宿衛昔秦據南面之位制一世之命威服四夷輕弱骨肉顯重異族廢道任刑無恩宗室其後尉他入南夷陳涉呼楚澤近狎作亂內外俱發趙氏無炊火焉高皇帝覽蹤迹觀得失見秦建本非是故改其路規土連成布王子孫是以支葉扶疏異姓不得閒也今陛下承明繼成委任公卿群臣連與成朋非毀宗室膚受之訴日騁于廷惡吏廢法立威主恩不及下究臣聞武帝使中郎將蘇武使胸奴見留二十年不降還亶為典屬國今大將軍長史敞無勞為搜粟都尉又將軍都郎羽林道上移蹕太官先置臣旦願歸符璽入宿衛察奸臣之變見漢書武五子傳下令賜王吉寡人造行不能無惰中尉甚忠數輔吾過使謁者千秋賜中尉牛肉五百斤酒五石脯五束見漢書王吉傳報舅張博書子高乃幸左顧存恤發心惻隱顯至誠納以嘉謀語以至事雖亦不敏敢不諭意今遣有司為子高償責二百萬見漢書宣元六王傳乃者詔下止諸侯朝者寡人憯然不知所出子高素有顏冉之資臧武之智子貢之辨卞莊子之勇兼此四者世之所鮮既開端緒願卒成之求朝義事也奈何行金錢乎見漢書宣元六王傳遺廣陵王胥書願長耳目母後人有天下見漢書楚元王傳對訊立少失父母孤弱處深宮中獨與宦者婢妾居漸漬小國之俗加以質性下愚有不可移之姿往者傅相亦不純以仁誼輔翼立大臣皆尚苛刻刺求微密讒臣在其閒左右弄口積使上下不和更相伺宮殿之裏毛氂過失亡不暴陳當伏重誅以視海內數蒙聖恩得見貰赦今立自知賊殺中郎曹將冬月迫促貪生畏死即詐僵仆陽病徼幸得踰於須臾謹以實對伏須重誅見漢書梁懷王揖傳
