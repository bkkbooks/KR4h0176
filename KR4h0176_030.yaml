body:
  text: 義帝與諸將約先破秦入咸陽者王之見史記項羽本紀斬宋義出令軍中宋義與齊謀反楚楚王陰令羽誅之見史記項羽本紀請定箠令笞者箠長五尺其本大一寸其竹也末薄半寸皆平其節當笞者笞臀母得更人畢一罪乃更人見漢書刑法志遺章邯書白起為秦將南征鄢郢北坑馬服攻城略地不可勝計而竟賜死蒙恬為秦將北逐戎人開榆中地數千里竟斬陽周何者功多秦不能盡封因以法誅之今將軍為秦將三歲矣所亡失以十萬數而諸侯並起滋益多彼趙高素諛日久今事急亦恐二世誅之故欲以法誅將軍以塞責使人更代將軍以脫其禍夫將軍居外久多內卻有功亦誅無功亦誅且天之亡秦無愚智皆知之今將軍內不能直諫外為亡國將孤特獨立而欲常存豈不哀哉將軍何不還兵與諸侯為從約共攻秦分王其地南面稱孤此孰與身伏鈇質妻子為僇乎見史記項羽本紀下令軍中猛如虎很如羊貪如狼彊不可使者皆斬之見史記項羽本紀勸進代王議群臣之議皆非也夫秦失其政諸侯豪桀竝起人人自以為得之者以萬數然卒踐天子之位者劉氏也天下絶望一矣高帝封王子弟地犬牙相制此所謂磐石之宗也天下服其彊二矣漢興除秦苛政約法令施德惠人人自安難動搖三矣夫以呂太后之嚴立諸呂為三王擅權專制然而太尉以一節入北軍一呼士皆左袒為劉氏叛諸呂卒以滅之此乃天授非人力也今大臣雖欲為變百姓弗為使其黨寧能專一邪方今內有朱虛東牟之親外畏吳楚淮南琅邪齊代之彊方今高帝子獨淮南王與大王大王又長賢聖仁孝聞於天下故大臣因天下之心而欲迎立大王大王勿疑也見史記文紀將沒戒弟子魯天下有仁義之國也戰國之世講頌不衰且先君之廟在焉吾謂叔孫通處濁世而清其身學儒術而知權變是今師也宗于有道必有令圖歸必事焉見孔叢子答問篇諫格虎賦帝使亡諸大夫問乎下國下國之君方帥將士於中原車騎駢闐被行岡巒手格猛虎生縛貙犴昧爽而出見星而還國政不恤惟此為歡乃誇於大夫曰下國鄙固不知帝者之事敢問天子之格虎豈有異術哉大夫未之應因又言曰下國褊陋莫以虞心故乃闢四封以為藪圍境內以為林禽鳥育之驛驛淫淫晝則鳴嚾夜則嘷吟飛禽起而日翳走獸動而雷音犯之者其罪死驚之者其刑深虞候苑令是掌厥禁於是分幕將士營遮榛叢戴星入野列火求蹤見虎自來乃往尋從張罝網羅刃鋒驅檻車聽鼓鍾猛虎顛遽奔走西東怖駭內懷迷冒怔忪耳目喪精值網而衝局然自縛或隻或雙車徒抃讚咸稱曰工乃縛以絲組斬其爪牙支輪登較高載歸家孟賁被髮嗔目蹂猾紛華都邑百姓莫不于邁陳列路隅咸稱萬歲斯亦畋獵之至樂也大夫曰順君之心樂矣然非樂之至也樂至者與百姓同之之謂也夫兕虎之生與天地偕山林澤藪又其宅也被有德之君則不為害今君荒於遊獵莫恤國政驅民入山林格虎於其廷妨害農業殘夭民命國政其必亂民命其必散國亂民散君誰與處以此為至樂所未聞也於是下國之君乃頓首曰臣實不敏習之日久矣幸今承誨請遂改之見孔叢子連叢上楊柳賦嗟茲楊柳先生後傷蔚茂炎夏多陰可涼伐之原野樹之中塘溉浸以時日引月長巨本洪枝條修遠楊夭繞連枝猗那其旁或拳句以逮下土或擢迹而接穹蒼緑葉纍疊鬱茂翳沈蒙籠交錯應風悲吟鳴鵠集聚百變其音爾乃觀其四布運其所臨南垂大陽北被宏陰西奄梓園東覆果林規方冒乎半頃清室莫與比深於是朋友同好几筵列行論道飲燕流川浮觴殽核紛雜賦詩斷章各陳厥志考以先王賞恭罰慢事有紀綱洗觶酌樽兕觥並揚飲不至醉樂不及荒威儀抑抑動合典章退坐分別其樂難忘惟萬物之自然固神妙之不如意此楊樹依我以生未經一紀我賴以寧暑不御䈉淒而涼清內蔭我宗外及有生物有可貴云何不銘乃作斯賦以敘厥情見孔叢子連叢上梟賦季夏庚子思道靜居爰有飛鶚集我屋隅異物之來吉凶之符觀之歡然覽考經書在德為祥棄常為妖尋氣而應天道不渝昔在賈生有識之士忌茲服鳥卒用喪己咨我令考信道秉真變怪生家謂之天神修德滅邪化及其鄰禍福無門唯人所求聽天任命慎厥所修栖遲養志老氏之疇祿爵之來秪增我憂時去不索時來不逆庶幾中庸仁義之宅何思何慮自令勤劇見孔叢子連叢上又見藝文類聚九十二御覽九百二十七蓼蟲賦季夏既望暑往涼還逍遙諷誦遂歷東園周旋覽觀憩乎南藩覩茲茂蓼結葩吐榮猗那隨風緑葉紫莖爰有蠕蟲厥狀似螟群聚其間食之以生於是寤物託事推況乎人幼長斯蓼莫或知辛膏梁粱之子豈曰不人惟非德義不以為家安逸無心如禽獸何逸必致驕驕必致亡匪唯辛苦乃丁大殃見孔叢子連叢上又見藝文類聚八十二御覽九百四十八與侍中從弟安國書臧報侍中相知深忿俗儒淫辭冒義有意欲校亂反正由來久矣然雅達博通不世而出流學守株比肩皆是衆口非非正將焉立每獨念至此夙夜反側誠懼仁弟道未信於世而以獨知為愆也人之所欲天必從之舊章潛於壁室正於紛擾之際欻爾而見俗儒結舌古訓復申豈非聖祖之靈欲令仁弟讚明其道以闡其業者哉且曩雖為今學亦多所不信唯聞尚書二十八篇取象二十八宿謂為至然也何圖古文乃自百篇邪如堯典說者以為堯舜同道弟素常以為雜有舜典今果如所論及成王遇風雷周公見任俗儒群驅狗吠雷同不得其髣佛惡能明聖道之真乎知以今讎古之隸篆推科斗已定五十餘篇並為之傳云其餘錯亂文字摩滅不可分了欲垂待後賢誠合先君闕疑之義顧惟世移名制變改文體義類轉益難知以弟博洽溫敏既善推理又習其書而猶尚絶意莫肯垂留三思縱使來世亦有篤古碩儒其若斯何嗚呼惜哉先王遺典闕而不補聖祖之業分半而泯後之君子將焉取法假令顏閔不歿游夏更生其豈然乎其豈然乎不能已已貴復申之見孔叢子連叢上與子琳書告琳頃來聞汝與諸友生講肄書傳滋滋晝夜衎衎不怠善矣人之進道唯問其志取必以漸勤則得多山霤至柔石為之穿蝎蟲至弱木為之弊夫霤非石之鑿蝎非木之鑿然而能以微脆之形陷堅剛之體豈非積漸之致乎訓曰徒學知之未可多履而行之乃足佳故學者所以飾百行也侍中子國明達淵博雅好絶倫言不及利行不欺名動遵禮法少小長操故雖與群臣並居近侍頗見崇禮不供褻事獨得掌御唾壺朝廷之士莫不榮之此汝親所見詩不云乎無念爾祖聿修厥德又曰操斧伐柯其則不遠遠則尼父近則子國於以立身其庶矣乎見孔叢子連叢上又見藝文類聚五十五尚書序古者伏地氏之王天下也始畫八卦造書契以代結繩之政由是文籍生焉伏羲神農黃帝之書謂之三墳言大道也才昊顓頊高辛唐虞之書謂之五典言常道也至於夏商之書雖設教不倫雅誥奧義其一歸揆是故歷代寶之以為大訓八卦之說謂之八索求其義也九州之志謂之九丘丘聚也言九州所有土地所生風氣所宜皆聚此書也春秋左氏傳曰楚左史倚相能讀三墳五典八索九丘即謂上世帝王遺書也先君孔子生於周末覩史籍之煩懼覽之者不一遂乃定禮樂明舊章刪詩為三百篇約史記而修春秋讚易道以黜八索述職方以除九丘討論墳典斷自唐虞以下訖於周芟夷煩亂翦截浮辭舉其宏網撮其機要足以垂世立教典謨訓誥誓命之文凡百篇以恢弘至道示人主以軌範也帝王之制坦然明白可舉而行三千之徒並受其義及秦始皇滅先代典籍焚書坑儒天下學士逃難解散我先人用藏其家書於屋壁漢室龍興開設學校旁求儒雅以闡大猷濟南伏生年過九十失其本經日以傳授裁二十餘篇以其上古之書謂之尚書百篇之義世莫得聞至魯共王好治宮室壞孔子舊宅以廣其居於壁中得先人所藏古文虞夏商周之書及傳論語孝經皆科斗文字王又升孔子堂聞金后絲竹之音乃不壞宅悉以書還孔氏科斗書廢已久時人無能知者以所聞伏生之書考論義文義定其可知者為隸古定更以竹簡寫之增多伏生二十五篇伏生又以舜典合於堯典益稷合於皋陶謨盤庚三篇合為一康王之誥合於顧命復出此篇并序凡五十九篇為四十六卷其餘錯亂摩滅不可復知悉上送官藏之書府以待能者承詔為五十九篇作傳於是遂研精覃思博考經籍採托群言以立訓傳約文申義敷暘厥旨庶幾有補於將來書序序來所以為作者之意昭然義見宜相附近故引之各冠其篇首定五十八篇既畢會國有巫蠱事經籍道息用不復以聞傳之子孫以貽後世若好古博雅君子與我同志亦所不隱也見文選唐石經尚書宋板尚書注疏本宋巾箱板尚書仿嶽板尚書古文孝經訓傳序孝經者何也孝者人之高行經常也自有天地人民以來而孝道著矣上有明王則大化滂流充塞六合若其無也則斯道滅息當吾先君孔子之世周失其柄諸侯力爭道德既隱禮誼又廢至乃臣弒其君子弒其父亂逆無紀莫之能正是以夫子每於閒居而歎迷古之孝道也夫子敷先王之教於魯之洙泗門徒三千而達者七十有二也貫首弟子顏回閔子騫冉伯牛仲弓性也至孝之自然皆不待諭而寤者也其餘則悱悱憤憤若存若亡唯曾參躬行匹夫之孝而未達天子諸侯以下揚名顯親之事因侍坐而咨問焉故夫子告其誼於是曾子喟然知孝之為大也遂集而録之名曰孝經與五經並行於世逮乎六國學校衰廢及秦始皇焚書坑儒孝經由是絶而不傳也至漢興建元之初河間王得而獻之凡十八章文字多誤博士頗以教授後魯恭王使人壞夫子講堂壁中石函得古文孝經二十二章載在竹牒其長尺有二寸字科斗形魯三老孔子惠抱詣京師獻之天子天子使金馬門待詔學士與博士群儒從隸字寫之還子惠一通以一通賜所幸侍中霍光光甚好之言為口實時王公貴人咸神祕焉比於禁方天下競欲求學莫能得者每使者至魯輒以人事請索或好事者募以錢帛用相問遺魯吏有至帝都者無不齎持以為行路之資故古文孝經初出於孔氏而今文十八章諸儒各任意巧說分為數家之誼淺學者以當六經其大車載不勝反云孔氏無古文孝經欲矇時人度其為說誣亦甚矣吾愍其如此發憤精思為之訓傳悉載本文萬有餘言朱以發經墨以起傳庶後學者覩正誼之有在也今中祕書皆以魯三老所獻古文為正河閒王所上多誤然以先出之故諸國往往有之漢先帝發詔稱其辭者皆言傳曰其實今文孝經也昔吾逮從伏生論古文尚書誼時學士會云出叔孫氏之門自道知孝經有師法其說移風易俗莫善於樂謂為天子用樂省萬邦之風以知其盛衰衰則移之以貞盛之教淫則移之以貞固之風皆以樂聲知之知則移之故云移風易俗莫善於樂也又師曠云吾驟歌南風多死聲楚必無功即其類也且曰庶民之愚安能識音而可以樂移之乎當時衆人僉以為善吾嫌其說迂然無以難之後推尋其意殊不得爾也子游為武城宰作絃歌以化民武城之下邑而猶化之以樂故傳曰夫樂以關山川之風以曜德於廣遠風德以廣之風物以聽之修詩以詠之修禮以節之又曰用之邦國焉用之鄉人焉此非唯天子用樂明矣夫雲集而龍興虎嘯而風起物之相感有自然者不可謂毋也胡笳吟動馬蹀而悲黃老之彈嬰兒起舞庶民之愚愈於胡馬與嬰兒也何為不可以樂化之經又云敬其父則子說敬其君則臣說而說者以為各自敬其為君父之道臣子乃說也余謂不然君雖不君臣不可以不臣父雖不父子不可以不子若君父子敬其為君父之道則臣子便可以忿之邪此說不通矣吾為傳皆弗之從焉也見古文孝經日本國本家語序孔子家語者皆當時公卿士大夫及七十二弟子之所咨訪交相對問言語也既而諸弟子各記其所問焉與論語孝經並時弟子取其正實而切事者別出為論語其餘則都集録之名之曰孔子家語凡所論辨疏判較歸實自夫子本旨也屬文下辭往往頗有浮說煩而不要者亦繇七十二子共敘述首尾加之潤色其材或有優劣故使之然也孔子既沒而微言絶七十二弟子終而大義六國之世儒道分散遊說之士各以巧意而為枝葉孟軻荀卿守其所習當秦昭王時荀卿入秦昭王從之問儒術荀卿以孔子之語及諸國七十二弟子之言凡百餘篇與之繇此秦悉有焉始皇之世李斯焚書而孔子家語與諸子同列故不見滅高祖藏之其後被誅亡而孔子家語乃散在人間好事者或各意增損其言故使同是是事而輒異辭孝景皇帝末年募求天下遺書于京師大夫皆送官得呂氏之所傳孔子家語而與諸國事及七十子辭妄相錯雜不可得知以付掌書與典禮衆篇亂簡合而藏之祕府元封之時吾在仕京師竊懼先人之典辭將遂泯沒于是因諸公卿大夫私以人事募求其副悉得之乃以事類相次撰集為四十篇又有曾子問禮一篇自別屬曾子問故不復録其諸弟子書所稱引孔子之言本不存乎家語亦以自己自有所傳也是以皆不收也將來君子不可不鑑見元王廣謀明何孟春注家語皆載此序祕記良得黃石公不死之法不但兵法而已見抱朴子內篇至理雖為呂后所強飲食尋復修行仙道良本師四皓角里先生綺里季之徒皆仙人也良悉從其神方密自度世但世人不知故云其死耳同上上成帝書辨家語宜記録臣聞明王不掩人之功大聖不遺人小善所以能口其明聖也陛下發明詔咨群儒集天下書籍無言不悉命通才大夫校定其義使遐載之文以大著于今日立言之士垂於不朽此則蹈明王之軌遵大聖之風者也雖唐明帝之煥然周王之彧彧未若斯之極也故述作之士莫不樂測大倫焉臣祖故臨淮太守國逮仕於孝武皇帝之世以經學為名以儒雅為官讚明道義見稱前朝時魯恭王壞孔子故宅得古文科斗尚書孝經論語世人莫有能言者安國為之今文讀而訓傳其義又撰次孔子家語既畢會巫蠱事起遂廢不行于時然其典雅正實與世所傳者不可同日而論也光祿大夫向以為時所未施之故尚書則不記於別録論語則不使名家也臣竊惜之且百家章句無不畢記孔子家語古文正實而疑之哉又戴聖近世小儒以曲禮不足而乃取孔子家語雜亂者及子思孟軻孫卿之書以裨益之總名曰禮記今尚見其已在禮記者則便除家語之本篇是滅其原而存其末不亦難乎臣之愚以為宜如此為例皆記録見故敢冒眛以聞見家語後敘末附記上書對問日蝕事臣聞日者衆陽之宗人君之表至尊之象君德衰微陰道盛彊侵蔽陽明則日蝕應之書曰羞用五事建用皇極如貌言視聽思失大中之道不立則咎徵薦臻六極屢降皇之不極是為大中不立其傳曰時則有日月亂行謂朓側匿甚則薄蝕是也又曰六珍之作歲之朝曰三朝其應至重乃正月辛丑朔日有蝕之變見三朝之會上天聰明苟無其事變不虛生書曰惟先假王正厥事言異變之來起事有不正也臣聞師曰天右與王者故災異數見以譴告之欲其改更若不畏懼有以塞除而輕忽簡誣則凶罰加焉其至可必詩曰敬之敬之天惟顯思命不易哉又曰畏天之威于時保之皆謂不懼者凶懼之則吉也陛下聖德聰明兢兢業業承順天戒敬畏變異勤心虛己延見群臣思求其故然後敕躬自約總正萬事放遠讒說之黨援納斷斷之介退去貪殘之徒進用賢良之吏平刑罰薄賦斂恩澤加於百姓誠為政之大本應變之至務也天下幸甚書曰天既付命正厥德言正德以順天也又曰天棐諶辭言有誠道天輔之也明承順天道在於崇德博施加精致誠孳孳而已俗之祈禳小數終無益於應天塞異銷禍興福較然甚明無可疑惑見漢書孔光傳舉成公敞封事臣以朽材前比歷位典大職卒無尺寸之效幸免罪誅全保首領今復拔擢備內朝臣與聞政事臣光智謀淺短犬馬齒臷誠恐一旦顛仆無以報稱竊見國家故事尚書以久次轉遷非有踔絶之能不相踰越尚書僕射敝公正勤職通敏於事可尚書令謹封上見漢書孔光傳奏罷減樂人員郊祭樂人員六十二人給祠南北郊大樂鼓員文人嘉至鼓員十人邯鄲鼓員二人騎吹鼓員三人江南鼓員二人淮南鼓員四人巴俞鼓員三十六人歌鼓員二十四人楚嚴鼓員一人梁皇鼓員四人臨淮鼓員三十五人茲邡鼓員三人凡鼓十二員百二十八人朝賀置酒陳殿下應古兵法外郊祭員十三人諸族樂人兼雲招給祠南郊用六十七人兼給事雅樂用四人夜誦員五人剛別柎員二人給盛德主調箎員二人聽工以律知日冬夏至一人鐘工磬工簫工員各一人僕射二人主領諸樂人皆不可罷竽工員三人一人可罷琴工員五人三人可罷柱工員二人一人可罷繩弦工員六人四人可罷鄭四會員六十二人一人給事雅樂六十一人可罷張瑟員八人七人可罷安世樂鼓員二十人十九人可罷沛吹鼓員十二人族歌鼓員二十七人陳吹鼓員十三人商樂鼓員十四人東海鼓員十六人長樂鼓員十三人縵樂鼓員十三人凡鼓八員百二十八人朝賀置酒陳前殿房中不應經法治竽員五人楚鼓員六人常從倡三十人常從象人四人詔隨常從倡十六人秦倡員二十九人秦倡象人員三人詔隨秦倡一人雅大人員九人朝賀置酒為樂楚四會員十七人巴四會員十二人銚四會員十二人齊四會員十九人蔡謳員三人齊謳員六人竽瑟鐘磬員五人皆鄭聲可罷師學百四十二人其七十二人給大官挏馬酒其七十人可罷大凡八百二十九人其三百八十八人不可罷可領屬大樂其四百四十一人不應經法或鄭衛之聲皆可罷見漢書禮樂志條奏限名田奴婢諸王列侯得名田國中列侯在長安及公主名田縣道關內侯吏民名田皆無得過三十頃諸侯王奴婢二百人列侯公主百人關內侯吏民三十人年六十以上十歲以下不在數中賈人皆不得名田為吏犯者以律論諸名田畜奴婢過品皆沒入縣官見漢書哀紀奏請議毀廟永光五年制書高皇帝為漢太祖孝文皇帝為太宗建昭五年制書孝武皇帝為世宗損益之體不敢有與臣愚以為迭毀之次當以時定非令所為擅議宗廟之意也臣請與群臣雜議見漢書韋玄成傳奏諫復留傅遷詔書侍中駙馬都尉遷巧佞無義漏泄不忠國之賊也免歸故郡復有詔止天下疑惑無所取信虧損聖德誠不小愆陛下以變異連見避正殿見群臣思求其故至今未有所改臣請歸遷故郡以銷姦黨應天戒見漢書孔光傳奏劾王嘉嘉迷國罔上不道請與廷尉雜治見漢書王嘉傳奏徙毋將隆隆前為冀州牧治中山馮太后獄冤陷無辜不宜處位在中土見漢書母將隆傳奏徙張由史立由前誣告骨肉立陷人入大辟為國家結怨於天下以取秩遷獲爵邑幸蒙赦令請免為庶人徒合浦見漢書孝元馮昭儀傳奏徙董賢家屬賢質性巧佞翼姦以獲封侯父子專朝兄弟並寵多受賞賜治第宅造冢壙放效無極不異王制費以萬萬計國家為空虛父子驕蹇至不為使者禮受賜不拜罪惡暴著賢自殺伏辜死後父恭等不悔過乃復以沙畫棺四時之色左蒼龍右白虎上著金銀日月玉衣珠璧以棺至尊無以加恭等幸得免於誅不宜在中土臣請收沒入財物縣官諸以賢為官者皆免見漢書佞幸傳奏遣紅陽侯王立就國立舊惡前知定陵侯淳于長犯大逆罪多受其賂為言誤朝後白以官婢楊寄私子為皇子衆言曰呂氏少帝復出紛紛為天下所疑難以示來世成襁褓之功請遣立就國見漢書王莽傳上奏不聽王莽讓宰衡賞未足以直功謙約退讓公之常節終不可聽見漢書王莽傳上安臨親受印韍策號通天其義昭昭黃郵召陵新野之田為入尤多皆止於公公欲自損以成國化宜可聽許治平之化當以時成宰衡之官不可世及納徵錢乃以尊皇后非為公也功顯君戶止身不傳褒新賞都兩國合三千戶甚少矣忠臣之節亦宜自屈而信主上之義宜遣大司徒大司空持節承制詔公亟入眂事詔尚書勿復受公之讓奏見漢書王莽傳上立嗣議禮立嗣以親中山王先帝之子帝親弟也以尚書盤庚殷之及王為比中山王宜為嗣見漢書孔光傳淳于長小妻乃始等坐罪議大逆無道父母妻子同産無少長皆棄市欲懲後犯法者也夫婦之道有義則合無義則離長未自知當坐大逆之法而棄去乃始等或更嫁義已絶而欲以為長妻論殺之名不正不當坐見漢書孔光傳丞相遣郡國計吏敕元壽二年以丞相為大司徒郡國守丞長史上計事竟發遣君侯出坐庭上親問百姓所疾苦所計掾吏各一大音聲者上答又讀五條詔書敕讀畢罷遣敕曰詔書殿下禁吏無苛暴丞長史歸告二千石順民所疾苦急去殘賊審擇良吏無任苛刻治獄決訟務得其中明詔憂百姓困於衣食二千石帥勸農桑思稱厚恩有以賑贍之無煩擾奪民時公卿以下務飭儉恪今俗奢奓過制度日以益甚二千石務以身帥有以化之民𤕠食者請論以法養視疾病致醫藥務治之詔書無飾廚傳增養食至今未變或更尤過度甚不稱歸告二千石務省約如法且案不改者長吏以聞官寺鄉亭漏敗垣墻陀壞治所辦護者不稱任先自劾不應法歸告二千石勿聽見漢舊儀永樂大典本又引見續漢百官志一注北堂書抄七十九合訂成篇
