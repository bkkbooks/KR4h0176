body:
  text: 韓信上尊號疏楚王韓信韓王信淮南王英布梁王彭越故衡山王吳芮趙王張敖燕王臧荼昧死再拜言大王陛下先時秦為亡道天下誅之大王先得秦王定關中於天下功最多存亡定危救敗繼絕以安萬民功盛德厚又加惠於諸侯王有功者使得立社稷地分已定而位號比儗亡上下之分大王功德之著於後世不宣昧死再拜上皇帝尊號見漢書高紀下大王起於細微滅亂秦威動海內又以辟陋之地自漢中行威德誅不義立有功平定海內功臣皆受地食邑非私之也大王德施四海諸侯王不以道之居帝位甚實宜願大王以幸天下漢書高紀下令諸大夫進不滿千錢坐之堂下見史記高紀又見漢書高紀天子所服議丞相臣何御史大夫臣昌謹與將軍臣陵太子太傅臣通等議春夏秋冬天子所服當法天地之數中得人和故自天子王侯有土之君下及兆民能法天地順四時以治國家身亡禍殃年壽永究是奉宗廟安天下之大禮也臣請法之見漢書魏相傳遺項王書漢王失職欲得關中如約即止不敢復東見漢書張良傳又以齊反書遺項王齊與趙欲并滅楚見漢書張良傳奏議定列侯功次丞相臣平言謹與絳侯臣勃曲周侯臣商潁陰侯臣嬰安國侯臣陵等議列侯幸得賜餐錢奉邑陛下加惠以功次定朝位臣請臧高廟見漢書高后紀上代王即位議丞相臣平太尉臣勃大將軍臣武御史大夫臣蒼宗正臣郢朱虛侯臣章東牟侯臣興居典客臣揭再拜言大王足下子弘等皆非孝惠皇帝子不當奉宗廟臣謹請陰安侯頃王后琅邪王列侯吏二千石議大王高皇帝子宜為嗣願大王即天子位見漢書文紀奉詔除連坐法議陛下幸加大惠於天下使有罪不收無罪不相坐甚盛德臣等所不及也臣等謹奉詔盡除收律相坐法見漢書刑法志入北軍行令軍中為呂氏右襢為劉氏左襢見史記呂后紀奏仍用連坐法議父母妻子同產相坐及收所以累其心使重犯法也收之之道所由來久矣臣之愚計以為如其故便見漢書刑法志踵軍門上謁高陽賤民酈食其竊聞沛公暴露將兵助楚討不義敬勞從者願得望見口畫天下便事見史記請說齊王臣聞之知天之天者王事可成不知天之天者王事不可成王者以民為天而民以食為天夫敖倉天下轉輸久矣臣聞其下乃有臧粟甚多楚人拔滎陽不堅守敖倉乃引而東令適卒分守成皋此乃天所以資漢方今楚易取而漢反卻自奪便臣竊以為過矣且兩雄不俱立楚漢久相持不決百姓騷動海內搖蕩農夫釋耒紅女下機天下之心未有所定也願足下急復進兵收取滎陽據敖庾之粟塞成皋之險杜太行之道距飛狐之口守白馬之津以示諸侯形制之勢則天下知所歸矣方今燕趙已定唯齊未下今田廣據千里之齊田間將二十萬之眾軍於歷城諸田宗彊負海岱阻河濟南近楚齊人多變詐足下雖遣數十萬師未可以歲月破也臣請得奉明詔說齊王使為漢而稱東藩見漢書酈食其傳上書諫高祖陛下取天下不與成周同而欲比隆成周臣竊以為不侔見晉書段灼傳作丹書鐵券與匈奴分土界自海以南冠蓋之士處焉自海以北豐強之士處焉見北堂書鈔一百四引三輔故事婁敬為高車使者持節至匈奴與其分土界作丹書鐵券奏論淮南王長罪丞相臣張倉典客臣馮敬行御史大夫事宗正臣逸廷尉臣賀備盜賊中尉臣福昧死言淮南王長廢先帝法不聽天子詔居處無度為黃屋蓋乘輿出入擬於天子擅為法令不用漢法及所置吏以其郎中春為丞相聚收漢諸侯人及有罪亡者匿與居為治家室賜其財物爵祿田宅爵或至關內侯奉以二千石所不當得欲以有為大夫但士五開章等七十人與棘蒲侯太子奇謀反欲以危宗廟社稷使開章陰告長與謀使閩越及匈奴發其兵開章之淮南見長長數與坐語飲食為家室娶婦以二千石俸奉之開章使人告但已言之王春使使報但等吏覺知使長安尉奇等往捕開章長匿不予與故中尉蕑忌謀殺以閉口為棺槨衣衾葬之肥陵邑謾吏曰不知安在又佯聚土樹表其上曰開章死埋此下及長身自賊殺無罪者一人令吏論殺無罪者六人為亡命棄市罪詐捕命者以除罪擅罪人罪人無告劾繫治城旦舂以上十四人赦免罪人死罪十八人城旦舂以下五十八人賜人爵關內侯以下九十四人前日長病陛下憂苦之使使者賜書棗脯長不欲受賜不肯見拜使者南海民處廬江界中者反淮南吏卒擊之陛下以淮南民貧苦遣使者賜長帛五千匹以賜吏卒勞苦者長不欲受賜謾言曰無勞苦者南海民王織上書獻璧皇帝忌擅燔其書不以聞吏請召治忌長不遣謾言曰忌病春又請長願入見長怒曰女欲離我自附漢長當棄市臣請論如法見史記淮南王傳又見漢書淮南傳少百三十餘字臣蒼臣敬臣逸臣福臣賀昧死言臣謹與列侯吏二千石臣嬰等四十三人議皆曰長不奉法度不聽天子詔乃陰聚徒黨及謀反者厚養亡命欲以有為臣等議論如法見史記淮南王傳臣蒼等昧死言長有大死罪陛下不忍致法幸赦廢勿王臣請處蜀郡嚴道邛郵遣其子母從居縣為築篕家室皆廩食給薪菜鹽豉芡食器席蓐臣等昧死請請布告天下見史記淮南王傳奏駁公孫臣漢應土德議漢乃水德之始故河決金隄其符也年始冬十月色外黑內赤與德相應如公孫臣言非也見史記封禪書奏議除肉刑肉刑所以禁姦所由來者久矣陛下下明詔憐萬民之一有過被刑者終身不息及罪人欲改行為善而道亡繇至於盛德臣等所不及也臣謹議請定律曰諸當完者完為城旦舂當黥者髡鉗為城旦舂當劓者笞三百當斬左止者笞五百當斬右止及殺人先自告及吏坐受賕枉法守縣官財物而即盜之已論命復有笞罪者皆棄市罪人獄已決完為城旦舂滿三歲為鬼薪白粲鬼薪白粲一歲為隸臣妾隸臣妾一歲免為庶人隸臣妾滿二歲為司寇司寇一歲及作如司寇二歲皆免為庶人其亡逃及有罪耐以上不用此令前令之刑城旦舂歲而非禁錮者如完為城旦舂歲數以免臣昧死請見漢書刑法志上書高帝國被邊匈奴數入晉陽去塞遠請泊馬邑見漢書韓王信傳報柴武書陛下擢僕閭巷南面稱孤此僕之幸也滎陽之事僕不能死囚於項籍此一罪也寇攻馬邑僕不能堅守以城降之此二罪也今為反寇將兵與將軍爭一旦之命此三罪也夫種蠡無一罪身死亡僕有三罪而欲求活此伍子胥所以僨於吳世也今僕亡匿山谷間旦暮乞貣蠻夷僕之思歸如痿人不忘起盲者不忘視勢不可耳見史記韓王信傳漢書韓王信傳漢使柴將軍擊之遺信書信報遺膠西王書奉詔誅不義降者赦其罪復故不降者滅之王何處須以從事見漢書吳王濞傳寄書諫竇長君吾聞曹丘生非長者勿與通見史記季布傳遺韓王信書陛下寬仁諸侯雖有畔亡而復歸輒復故位號不誅也大王所知今王以敗亡走胡非有大罪急自歸見史記韓王信傳議征南越朝鮮南越朝鮮自全秦時內屬為臣子後且擁兵阻阸選蠕觀望高祖時天下新定人民小安未可復興兵今陛下仁惠撫百姓恩澤加海內宜及士民樂用征討逆黨以一封疆見史記律書奏議孝文為太宗廟丞相臣嘉等言陛下永思孝道立昭德之舞以明孝文皇帝之盛德皆臣嘉等愚所不及臣謹議世功莫大於高皇帝德莫盛於孝文皇帝高皇廟宜為帝者太祖之廟孝文皇帝廟宜為帝者太宗之廟天子宜世世獻祖宗之廟郡國諸侯宜各為孝文皇帝立太宗之廟諸侯王列侯使者侍祠天子歲獻祖宗之廟請著之竹帛宣布天下見史記文紀漢書景紀劾奏晁錯吳王反逆亡道欲危宗廟天下所當共誅今御史大夫錯議曰兵數百萬獨屬群臣不可信陛下不如自出臨兵使錯居守徐僮之旁吳所未下者可以予吳錯不稱陛下德信欲疏群臣百姓又欲以城邑予吳亡臣子禮大逆無道錯當要斬父母妻子同產無少長皆棄市臣請論如法見漢書晁錯傳與淮南王長書竊聞大王剛直而勇慈惠而厚貞信多斷是天以聖人之資奉大王也甚盛不可不察今大王所行不稱天資皇帝初即位易侯邑在淮南者大王不肯皇帝卒易之使大王得三縣之實甚厚大王以未嘗與皇帝相見求入朝見未畢昆弟之歡而殺列侯以自為名皇帝不使吏與其間赦大王甚厚法二千石缺輒言漢補大王逐漢所置而請自置相二千石皇帝骫天下正法而許大王甚厚大王欲屬國為布衣守冢真定皇帝不許使大王毋失南面之尊甚厚大王宜日夜奉法度修貢職以稱皇帝之厚德今乃輕言恣行以負謗於天下甚非計也夫大王以千里為宅居以萬民為臣妾此高皇帝之厚德也高帝蒙霜露沬風雨赴矢石野戰攻城身被創痍以為子孫成萬世之業艱難危苦甚矣大王不思先帝之艱苦日夜怵惕修身正行養犧牲豐潔粢盛奉祭祀以無忘先帝之功德而欲屬國為布衣甚過且夫貪讓國土之名輕廢先帝之業不可以言孝父為之基而不能守不賢不求守長陵而求之真定先母後父不誼數逆天子之令不順言節行以高兄無禮幸臣有罪大者立斷小者肉刑不仁貴布衣一劍之任賤王侯之位不知不好學問大道觸情妄行不詳此八者危亡之路也而大王行之棄南面之位奮諸賁之勇常出入危亡之路臣之所見高皇帝之神必不廟食於大王之手明白昔者周公誅管叔放蔡叔以安周齊桓殺其弟以反國秦始皇殺兩弟遷其母以安秦頃王亡代高帝奪之國以便事濟北舉兵皇帝誅之以安漢故周齊行之於古秦漢用之於今大王不察古今之所以安國便事而欲以親戚之意望於太上不可得也亡之諸侯游宦事人及舍匿者論皆有法其在王所吏主者坐今諸侯子為吏者御史主為軍吏者中尉主客出入殿門者衛尉大行主諸從蠻夷來歸誼及以亡名數自古者內史縣令主相欲委下吏無與其禍不可得也王若不改漢繫大王邸論相以下為之奈何夫墮父大業退為布衣所哀幸臣皆伏法而誅為天下笑以羞先帝之德甚為大王不取也宜急改操易行上書謝罪曰臣不幸早失先帝少孤呂氏之世未嘗忘死陛下即位臣怙恩德驕盈行多不軌追念辠過恐懼伏地待誅不敢起皇帝聞之必喜大王昆弟歡欣於上群臣皆得延壽於下上下得宜海內常安願孰計而疾行之行之有疑禍如發矢不可追已見漢書淮南厲王長傳議止代王入嗣漢大臣皆故高帝時大將習兵多謀詐此其屬意非止此也特畏高帝呂太后威耳今已誅諸呂新喋血京師此以迎大王為名實不可信願大王稱疾毋往以觀其變見史記文紀至言臣聞為人臣者盡忠竭愚以直諫主不避死亡之誅者臣山是也臣不敢以久遠諭願借秦以為諭唯陛下少加意焉夫布衣韋帶之士修身於內成名於外而使後世不絕息至秦則不然貴為天子富有天下賦斂重數百姓任罷赭衣半道群盜滿山使天下之人戴目而視傾耳而聽一夫大謼天下嚮應者陳勝是也秦非徒如此也起咸陽而西至雍離宮三百鐘鼓帷帳不移而具又為阿房之殿殿高數十仞東西五里南北千步從車羅騎四馬騖馳旌旗不橈為宮室之麗至於此使其後世曾不得聚廬而託處焉為馳道於天下東窮燕齊南極吳楚江湖之上瀕海之觀畢至道廣五十步三丈而樹厚築其外隱以金椎樹以青松為馳道之麗至於此使其後世曾不得邪徑而託足焉死葬乎驪山吏徒數十萬人曠日十年下徹三泉合采金石冶銅錮其內漆塗其外被以珠玉飾以翡翠中成觀游上成山林為葬薶之侈至於此使其後世曾不得蓬顆蔽冢而託葬焉秦以熊羆之力虎狼之心蠶食諸侯并吞海內而不篤禮義故天殃已加矣臣昧死以聞願陛下少留意而詳擇其中臣聞忠臣之事君也言切直則不用而身危不切直則不可以明道故切直之言明主所欲急聞忠臣之所以蒙死而竭知也地之磽者雖有善種不能生焉江皋河瀕雖有惡種無不猥大昔者夏商之季世雖關龍逢箕子比干之賢身死亡而道不用文王之時豪俊之士皆得竭其智芻蕘採薪之人皆得盡其力此周之所以興也故地之美者善養禾君之仁者善養士雷霆之所擊無不摧折者萬鈞之所壓無不糜滅者今人主之威非特雷霆也勢重非特萬鈞也開道而求諫和顏色而受之用其言而顯其身士猶恐懼而不敢自盡又乃況於縱欲恣行暴虐惡聞其過乎震之以威壓之以重則雖有堯舜之智孟賁之勇豈有不摧折者哉如此則人主不得聞其過失矣弗聞則社稷危矣古者聖王之制史在前書過失工誦箴諫瞽誦詩諫公卿比諫士傳言諫庶人謗於道商旅議於市然後君得聞其過失也聞其過失而改之見義而從之所以永有天下也天子之尊四海之內其義莫不為臣然而養三老於大學親執醬而餽執爵而酳祝䭇在前祝鯁在後公卿奉杖大夫進履舉賢以自輔弼求修正之士使直諫故以天子之尊尊養三老視孝也立輔弼之臣者恐驕也置直諫之士者恐不得聞其過也學問至於芻蕘者求善無饜也商人庶人誹謗己而改之從善無不聽也昔者秦政力并萬國富有天下破六國以為郡縣築長城以為關塞秦地之固大小之勢輕重之權其與一家之富一夫之彊胡可勝計也然而兵破於陳涉地奪於劉氏者何也秦王貪狼暴虐殘賊天下窮困萬民以適其欲也昔者周蓋千八百國以九州之民養千八百國之君用民之力不過歲三日什一而籍君有餘財民有餘力而頌聲作秦皇帝以千八百國之民自養力罷不能勝其役財盡不能勝其求一君之身耳所以自養者馳騁弋獵之娛天下弗能供也勞罷者不得休息飢寒者不得衣食亡罪而死刑者無所告訴人與之為怨家與之為讎故天下壞也秦皇帝身在之時天下已壞矣而弗自知也秦皇帝東巡狩至會稽琅邪刻石著其功自以為過堯舜統縣石鑄鐘虡篩土築阿房之宮自以為萬世有天下也古者聖王作諡三四十世耳雖堯舜禹湯文武絫世廣德以為子孫基業無過二三十世者也秦皇帝曰死而以諡法是父子名號有時相襲也以一至萬則世世不相復也故死而號曰始皇帝其次曰二世皇帝者欲以一至萬也秦皇帝計其功德度其後嗣世世無窮然身死纔數月耳天下四面而攻之宗廟滅絕矣秦皇帝居滅絕之中而不自知者何也天下莫敢告也其所以莫敢告者何也亡養老之義亡輔弼之臣亡進諫之士縱恣行誅退誹謗之人殺直諫之士是以道諛媮合苟容比其德則賢於堯舜課其功則賢於湯武天下已潰而莫之告也詩曰匪言不能胡此畏忌聽言則對譖言則退此之謂也又曰濟濟多士文王以寧天下未嘗亡士也然而文王獨言以寧者何也文王好仁則仁興得士而敬之則士用用之有禮義故不致其愛敬則不能盡其心不能盡其心則不能盡其力不能盡其力則不能成其功故古之賢君於其臣也尊其爵祿而親之疾則臨視之亡數死則往弔哭之臨其小斂大斂已棺塗而後為之服錫衰麻絰而三臨其喪未斂不飲酒食肉未葬不舉樂當宗廟之祭而死為之廢樂故古之君人者於其臣也可謂盡禮矣服法服端容貌正顏色然後見之故臣下莫敢不竭力盡死以報其上功德立於後世而令聞不忘也今陛下念思祖考術追厥功圖所以昭光洪業休德使天下舉賢良方正之士天下皆訢訢焉曰將興堯舜之道三王之功矣天下之士莫不精白以承休德今方正之士皆在朝廷矣又選其賢者使為常侍諸吏與之馳敺射獵一日再三出臣恐朝廷之解弛百官之墮於事也諸侯聞之又必怠於政矣陛下即位親自勉以厚天下損食膳不聽樂減外徭衛卒止歲貢省廄馬以賦縣傳去諸苑以賦農夫出帛十萬餘匹以振貧民禮高年九十者一子不事八十者二算不事賜天下男子爵大臣皆至公卿發御府金賜大臣宗族亡不被澤者赦罪人憐其亡髮賜之巾憐其衣赭書其背父子兄弟相見也而賜之衣平獄緩刑天下莫不說喜是以元年膏雨降五穀登此天之所以相陛下也刑輕於它時而犯法者寡衣食多於前年而盜賊少此天下之所以順陛下也臣聞山東吏布詔令民雖老羸癃疾扶杖而往聽之願少須臾毋死思見德化之成也今功業方就各聞方昭四方鄉風今從豪俊之臣方正之士直與之日日獵射擊兔伐狐以傷大業絕天下之望臣竊悼之詩曰靡不有初鮮克有終臣不勝大願願少衰射獵以夏歲二月定明堂造太學修先王之道風行俗成萬世之基定然後唯陛下所幸耳古者大臣不媟故君子不常見其齊嚴之色肅敬之容大臣不得與宴游方正修潔之士不得從射獵使皆務其方以高其節則群臣莫敢不正身修行盡心以稱大禮如此則陛下之道尊敬功業施於四海垂於萬世子孫矣誠不如此則行日壞而榮日滅矣夫士修之於家而壞之於天子之廷臣竊愍之陛下與眾臣宴游與大臣方正朝廷論議夫游不失樂朝不失禮議不失計軌事之大者也見漢書賈山傳對詰諫除盜鑄錢令錢者亡用器也而可以易富貴富貴者人主之操柄也令民為之是與人主共操柄不可長也見漢書賈山傳
