body:
  text: 賈誼上疏請封建子弟陛下即不定制如今之勢不過一傳再傳諸侯猶且人恣而不制豪植而大強漢法不得行矣陛下所以為蕃扞及皇太子之所恃者唯淮陽代二國耳代北邊胸奴與強敵為鄰能自完則足矣而淮陽之比大諸侯廑如黑子之著面適足以餌大國耳不足以有所禁禦方今制在陛下制國而令子適足以為餌豈可謂工哉人主之行異布衣布衣者飾小行競小廉以自託於鄉黨人主唯天下安社稷固不耳高皇帝瓜分天下以王功臣反者如蝟毛而起以為不可故蔪去不義諸侯而虛其國擇良日立諸子雒陽上東門之外畢以為王而天下安故大人者不牽小行以成大功今淮南地遠者或數千里越兩諸侯而縣屬於漢其吏民繇役往來長安者自悉而補中道衣敝錢用諸費稱此其苦屬漢而欲得王至甚逋逃而歸諸侯者已不少矣其勢不可久臣之愚計願舉淮南地以益淮陽而為梁王立後割淮陽北邊二三列城與東郡以益梁不可者可徙代王而都睢陽梁起于新郪以北著之河淮陽包陳以南揵之江則大諸侯之有異心者破膽而不敢謀梁足以扞齊趙淮陽足以禁吳楚陛下高枕終亡山東之憂矣此二世之利也當今恬然適遇諸侯之皆少數歲之後陛下且見之矣夫秦日夜苦心勞力以除六國之禍今陛下力制天下頤指如意高拱以成六國之禍難以言智苟身亡事畜亂宿禍孰視而不定萬年之後傳之老母弱子將使不寧不可謂仁臣聞聖主言問其臣而不自造事故使人臣得畢其愚忠唯陛下財幸見漢書賈誼傳上疏諫王淮南諸子竊恐陛下接王淮南諸子曾不與如臣者孰計之也淮南王之悖逆亡道天下孰不知其罪陛下幸而赦遷之自疾而死天下孰以王死之不當今奉尊罪人之子適足以負謗於天下耳此人少壯豈能忘其父哉白公勝所為父報仇者大父與伯父叔父也白公為亂非欲取國代主也發憤快志剡手以衝仇人之胸固為俱靡而已淮南雖小黥布嘗用之矣漢存特幸耳夫擅仇人足以危漢之資於策不便雖割而為四四子一心也豫之衆積之財此非有子胥白公報於廣都之中即疑有剸諸荊軻起於兩柱之間所謂假賊兵為虎翼者也願陛下少留計見漢書賈誼傳説積貯管子曰倉廩實而知禮節民不足而可治者自古及今未之嘗聞古之人曰一夫不耕或受之飢一女不織或受之寒生之有時而用之亡度則物力必屈古之治天下至孅至悉也故其畜積足恃今背本而趨末食者甚衆是天下之大殘也淫侈之俗日日以長是天下之大賊也殘賊公行莫之或止大命將泛莫之振救生之者甚少而靡之者甚多天下財産何得不蹶漢之為漢幾四十年矣公私之積猶可哀痛失時不雨民且狼顧歲惡不入請賣爵子既聞耳矣安有為天下阽危者若是而上不驚者世之有飢穰天之行也禹湯被之矣即不幸有方二三千里之旱國胡以相恤卒然邊境有急數千百萬之衆國胡以餽之兵旱相乘天下大屈有勇力者聚徒而衡擊罷夫羸老易子而咬其骨政治未畢通也遠方之能疑者並舉而爭起矣乃駭而圖之豈將有及乎夫積貯者天下之大命也苟粟多而財有餘何為而不成以攻則取以守則固以戰則勝懷敵附遠何招而不至今毆民而歸之農皆著於本使天下各食其力末技遊食之民轉而緣南畝則畜積足而人樂其所矣可以為富安天下而直為此廩廩也竊為陛下惜之見漢書食貨志賈誼説上諫除盜鑄錢令使民放鑄法使天下公得顧租鑄銅錫為錢敢雜以鉛鐵為它巧者其罪黥然鑄錢之情非殽雜為巧則不可得贏而殽之甚微為利甚厚夫事有召禍而法有起姦今令細民人操造幣之勢各隱屏而鑄作因欲禁其厚利微姦雖黥罪日報其勢不止乃者民人抵罪多者一縣百數及吏之所疑榜笞奔走者甚衆夫縣法以誘民使入陷阱孰積於此曩禁鑄錢死罪積下今公鑄錢黥罪積下為法若此上何賴焉又民用錢郡縣不同或用輕錢百加若干或用重錢平稱不受法錢不立吏急而一之呼則大為煩苛而力不能勝縱而弗呵呼則市肆異用錢文大亂苟非其術何鄉而可哉今農事棄捐而采銅者日蕃釋其耒耜冶鎔炊炭姦錢日多五穀不為多善人怵而為姦邪願民陷而之刑戮刑戮將甚不詳奈何而忽國知患此吏議必曰禁之禁之不得其術其傷必大令禁鑄錢則錢必重重則其利深盜鑄如雲而起棄市之罪又不足以禁矣姦數不勝而法禁數潰銅使之然也然銅布於天下其為禍博矣今博禍可除而七福可致也何謂七福上收銅勿令布則民不鑄錢黥罪不積一矣偽錢不蕃民不相疑二矣采銅鑄作者反於耕田三矣銅畢歸於上上挾銅積以御輕重錢輕則以術斂之重則以術散之貨物必平四矣以作兵器以假貴臣多少有制用別貴賤五矣以臨萬貨以調盈虛以收奇羡則官富實而末民困六矣制吾棄財以與胸奴逐爭其民則敵必懷七矣故善為天下者因禍而為福轉敗而為功今久退七福而行博禍臣誠傷之見漢書食貨志下過秦論秦并兼諸侯山東三十餘郡繕津關據險塞修甲兵而守之然陳涉以戍卒散亂之衆數百奮臂大呼不用弓戟之兵鉏耰白梃望屋而食橫行天下秦人阻險不守關梁不闔長戟不刺強弩不射楚師深入戰於鴻門曾無藩籬之艱于是山東大擾諸侯並起豪俊相立秦使章邯將而東征章邯因以三軍之衆要市於外以謀其上群臣之不信可見于此矣子嬰立遂不寤藉使子嬰有庸主之材僅得中佐山東雖亂秦之地可全而有宗廟之祀未當絶也秦地被山帶河以為固四塞之國也自繆公以來至于秦王二十餘君常為諸侯雄豈世世賢哉其勢居然也且天下嘗同心并力而攻秦矣當此之世賢智並列良將行其師賢相通其謀然困于阻險而不能進秦乃延入戰而為之開關百萬之徒逃北而遂壞豈勇力智慧不足哉形不利勢不便也秦小邑并大城守險塞而軍高壘毋戰閉關據厄荷戟而守之諸侯起於匹夫以利合非有素王之行也其交未親其下未附名為亡秦其實利之也彼見秦阻之難犯也必退師安土息民以待其敝收弱扶罷以令大國之君不患不得意於海內貴為天子富有天下而身為禽者其救敗非也秦王足己不問遂過而不變二世受之因而不改暴虐以重禍子嬰孤立無親危弱無輔三主惑而終身不悟亡不亦宜乎當此時也世非無深慮知化之士也然所以不敢盡忠拂過者秦俗多忌諱之禁忠言未卒於口而身為戮沒矣故使天下之士傾耳而聽重足而立拑口而不言是以三主失道忠臣不敢諫智士不敢謀天下已亂姦不上聞豈不哀哉先王知雍蔽之傷國也故置公卿大夫士以飾法設刑而天下治其強也禁暴誅亂而天下服其弱也五伯征而諸侯從其削也內守外附而社稷存故秦之盛也繁法嚴刑而天下振及其衰也百生怨望而海內畔矣故周五序得其道而千餘歲不絶秦本末並失故不長久由此觀之安危之統相去遠矣野諺曰前事之不忘後事之師也是以君子為國觀之上古驗之當世參以人事察盛衰之理審權勢之宜去就有序變化有時故曠日長久而社稷安矣秦孝公據殽函之固擁雍州之地君臣固守而窺周室有席卷天下包舉宇內囊括四海之意并吞八荒之心當是時商君佐之內立法度務耕織修守戰之備外連衡而鬭諸侯于是秦人拱手而取西河之外孝公既沒惠王武王蒙故業因遺册南兼漢中西舉巴蜀東割膏腴之地收要害之郡諸侯恐懼會盟而謀弱秦不愛珍器重寶肥美之地以致天下之士合從締交相與為一當是時齊有孟嘗趙有平原楚有春申魏有信陵此四君者皆明知而忠信寬厚而愛人尊賢重士約從離衡并韓魏燕楚齊趙宋衛中山之衆于是六國之士有寧越徐尚蘇秦杜赫之屬為之謀齊明周最陳軫昭滑樓緩翟景蘇厲樂毅之徒通其意吳起孫臏帶他兒良王廖田忌廉頗趙奢之朋制其兵常以十倍之地百萬之衆叩關而攻秦秦人開關延敵九國之師逡巡遁逃而不敢進秦無亡矢遺鏃之費而天下諸侯已困矣于是從散約解爭割地而奉秦秦有餘力而制其敝追亡逐北伏尸百萬流血漂鹵因利乘便宰割天下分裂河山強國請服弱國入朝延及孝文王莊襄王享國日淺國家無事及至秦王續六世之餘烈振長策而御宇內吞二周而亡諸侯履至尊而制六合執捶拊以鞭笞天下威振四海南取百越之地以為桂林象郡百越之君俯首係頸委命下吏乃使蒙恬北築長城而守藩籬卻胸奴七百餘里胡人不敢南下而牧馬士不敢彎弓而報怨于是廢先王之道焚百家之言以愚黔首墮名城殺豪俊收天下之兵聚之咸陽銷鋒鑄鐻以為金人十二以弱黔首之民然後斬華為城因河為津據億丈之城臨不測之溪以為固良將徑弩守要害之處信臣精卒陳利兵而誰何天下以定秦王之心自以為關中之固金城千里子孫帝王萬世之業也秦王既沒餘威振于殊俗陳涉甕牖繩樞之子氓隸之人而遷徙之徒才能不及中人非有仲尼墨翟之賢陶朱猗頓之富躡足行伍之間而倔起什伯之中率罷散之卒將數百之衆而轉攻秦斬木為兵揭竿為旗天下雲集響應贏糧而景從山東豪俊遂並起而亡秦族矣且夫天下非小弱也雍州之地殽函之固自若也陳涉之位非尊於齊楚燕趙韓魏宋衛中山之君鉏耰棘矜非錟於句戟長鎩也適戍之衆非抗於九國之師深謀遠慮行軍用兵之道非及鄉時之士也然而成敗異變功業相反也試使山東之國與陳涉度長潔大比權量力則不可同年而語矣然秦以區區之地千乘之權招八州而朝同列百有餘年矣然后以六合為家殽函為宮一夫作難而七廟墮身死人手為天下笑者何也仁義不施而攻守之勢異也秦并海內兼諸侯南面稱帝以養四海天下之士斐然鄉風若是者何也曰近古之無王者久矣周室卑微五霸既沒令不行於天下是以諸侯力政強侵弱衆暴寡兵革不休士民罷敝今秦南面而王天下是上有天子也既元元之民冀得安其性命莫不虛心而仰止當此之時守威定功安危之本在於此矣秦王懷貪鄙之心行自奮之智不信功臣不親士民廢王道立私權禁文書而酷刑法先詐力而後仁義以暴虐為天下始夫并兼者高詐力安定者貴順權此言取與守不同術也秦離戰國而王天下其道不易其政不改是其所以取之守之者無異也孤獨而有之故其亡可立而待借使秦王計上世之事並殷周之迹以制御其政後雖有淫驕之主而未有傾危之患也故三王之建天下名號顯美功業長久今秦二世立天下莫不引領而觀其政夫寒者利裋褐而飢者甘糟粳天下之嗷嗷新主之資也此言勞民之易為仁也鄉使二世有庸主之行而任忠賢臣主一心而憂海內之患縞素而正先帝之過裂地分民以封功臣之後建國立君以禮天子虛𡇞圄而免刑戮除去收帑汙穢之罪使各反其鄉里發倉廩散財幣以振孤獨窮困之士輕賦少事以佐百姓之急約法省刑以持其後使天下之人皆得自新更節修行各慎其身塞萬民之望而以威德與天下天下集矣即四海之內皆歡然各自安樂其處唯恐有變雖有狡猾之民無離上之心則不軌之臣無以飾其智而暴亂之姦止矣二世不行此術而重之以無道壞宗廟與民更始作阿房宮繁刑嚴誅吏治刻深賞罰不當賦斂無度天下多事吏弗能紀百姓困窮而主弗收恤然後姦偽並起而上下相遁蒙罪者衆刑戮相望於道而天下苦之自君卿以下至于衆庶人懷自危之心親處窮苦之實咸不安其位故易動也是以陳涉不用湯武之賢不藉公侯之尊奮臂於大澤而天下響應者其民危也故先王見始終之變知存亡之機是以牧民之道務在安之而已天下雖有逆行之臣必無響應之助矣故曰安民可與行義而危民易與為非此之謂也貴為天子富有天下身不免於戮殺者正傾非也是二世之過也已上見文選為中篇史記秦始皇紀弔屈原文誼為長沙王太傳既以謫去意不自得及度湘水為賦以吊屈原屈原楚賢臣也被讒放逐作離騷賦其終篇曰已矣哉國人兮莫知我也遂自投汨羅而死誼追傷之因以自喻其辭曰恭承嘉惠兮俟罪長沙側聞屈原兮自沉汨羅造托湘羅兮敬弔先生遭世罔極兮乃殞厥身鳴呼哀哉逢時不祥鸞鳳伏窟兮鴟梟翱翔闒茸尊顯兮颯諛得志賢聖逆曳兮方正倒植世謂隨夷為溷兮謂跖蹻為廉莫邪為鈍兮鉛刀為銛吁嗟默默兮生之無故兮斡棄周鼎寶康瓠兮騰駕罷牛驂暫驢兮驥垂兩耳服鹽車兮章甫薦履漸不可久兮嗟苦先生獨離此咎兮訊曰已矣國其莫我知兮獨一郁其誰語風漂漂其高逝兮夫固自引而遠去襲九淵之神龍兮沕深潛以自殄偭蟂獺以隱處兮夫豈從蝦與蛭蚓所貴聖人之神德兮遠濁世而自藏使騏驥可得系而羈兮豈云異夫犬羊般紛紛其離此而尤兮亦夫子之故也歷九州而相莫君兮何必懷此都也鳳鳥翔于千仞兮覽德輝而下之見細德之險征兮遙曾擊而去之彼尋常之污瀆兮豈能容夫吞舟之巨魚橫江湖之鱣鯨兮固將制于螻蟻見文選藝文類聚四十棄珠崖議臣幸得遭明盛之朝蒙危言之策無忌諱之患敢昧死竭卷卷臣聞堯舜聖之盛也禹入聖域而不優故孔子稱堯曰大哉韶曰盡善禹曰無間以三聖之德地方不過數千里西被流沙東漸于海朔南暨聲教迄于四海欲與聲教則治之不欲與者不強治也故君臣歌德含氣之物各德其宜武丁成王殷周之大仁也然地東不過江黃西不過氐羌南不過蠻荊北不過朔方是以頌聲並作視聽之類咸樂其生越裳氏重九譯而獻此非兵革之所能致及其衰也南征不還齊桓救其難孔子定其文以至乎秦興兵遠攻貪外虛內務欲廣地不慮其害然地南不過閩越北不過太原而天下潰畔禍卒在於二世之末長城之歌至今未絶賴聖漢初興為百姓請命平定天下至孝文皇帝閔中國未安偃武行文則斷獄數百民賦四十丁男三年而一事時有獻千里馬者詔曰鸞旗在前屬車在後吉行日五十里師行二十里朕乘千里之馬獨先安之于是還馬與道里費而下詔曰朕不受獻也其令四方毋求來獻當此之時逸遊之樂絶奇麗之賂塞鄭衛之倡微矣夫後官盛色則賢者隱處佞人用事則諍臣杜口而文帝不行故諡為孝文廟稱太宗至孝武皇帝元狩六年太倉之粟紅腐而不可食都內之錢貫朽而不可校乃探平城之事録冒頓以來數為邊害籍兵厲馬因富民以攘服之西連諸國至于安息東過碣石以玄菟樂浪為郡北卻胸奴萬里更起營塞制南海以為八郡則天下斷獄萬數民賦數百造鹽鐵酒榷之利以佐用度猶不能足當此之時寇賊並起軍旅數發父戰死于前子鬭傷於後女子乘亭鄣孤兒號于道老母寡婦飲泣巷哭遙設虛祭想魂乎萬里之外淮南王盜寫虎符陰聘名士關東公孫勇等詐為使者是皆廓地泰大征代不休之故也今天下獨有關東關東大者獨有齊楚民衆久困連年流離離其城郭相枕席于道路人情莫親父母莫樂夫婦至嫁妻賣子法不能禁義不能止此社稷之憂也今陛下不忍悁悁之忿欲驅士衆擠之大海之中快心幽冥之地非所以救助飢饉保全元元也詩云蠢爾蠻荊大邦為讎言聖人起則後服中國衰則先畔動為國家難自古而患之久矣何況乃復其南方萬里之蠻乎駱越之人父子同川而浴相習以鼻飲與禽獸無異本不足郡縣置也顓顓獨居一海之中霧露氣溼多毒屮蟲蛇水土之害人未見虜戰士自死又非獨珠崖有珠犀玳瑁也棄之不足惜不擊不損威其民譬猶魚鱉何足貪也臣竊以往者羌軍言之暴師曾未一年兵出不踰千里費四十餘萬萬大司農錢盡乃以少府禁錢續之夫一隅為不善費尚如此況于勞師遠攻亡士毋功乎求之往古則不合施之當今又不便臣愚以為非冠帶之國禹貢所及春秋所治皆可且無以為願遂棄珠崖專用恤關東為憂見漢書賈捐之傳與楊興共為薦石顯奏竊見石顯本山東名族有禮義之家也持正六年未嘗有過明習于事敏而疾見出公門入私門宜賜爵關內侯引其兄弟以為諸曹見漢書賈捐之傳又共為薦楊興奏竊見長安令興幸得以知名數召見興事父母有曾氏之孝事師有顏閔之材榮名聞於四方明詔舉茂材列侯以為首為長安令吏民敬鄉道路皆稱能觀其下筆屬文則董仲舒進談動辭則東方生置之爭臣則汲直用之介胄則冠軍侯施之治民則趙廣漢抱公絶私則尹翁歸興兼此六人而有之守道堅固執義不回臨大節而不可奪國之良臣也可試守京兆尹見漢書賈捐之傳上文帝書始秦得水德今漢受之推終始傳則漢當土德土德之應黃龍見宜改正朔易服色色上黃見史記封禪書漢書郊祀志上又張蒼傳上言設五廟長安東北有神氣成五采若人冠絻焉或曰東北神明之舍西方神明之墓也天瑞下宜立祠上帝以合符應見史記封禪書漢書郊祀志上又言日再中臣侯日再中居頃之日卻復中同上又言迎周鼎周鼎亡在泗水中今河溢通泗臣望東北汾陰直有金寶氣意周鼎其出乎兆見不迎則不至同上
