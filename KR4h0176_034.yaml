body:
  text: 淳于意對詔問所為治病死生驗者幾何人主名為誰詔問故太倉長臣意方伎所長及所能治病者有其書無有皆安受學受學幾何歲嘗有所驗何縣里人也何病醫藥已其病之狀皆何如具悉而對臣意對曰自意少時喜醫藥醫藥方試之多不驗者至高后八年得見師臨災元里公乘陽慶慶年七十餘意得見事之謂意曰盡去而方書非是也慶有古先道遺傳黃帝扁鵲之脈書五色診病知人生死決嫌疑定可治及藥論書甚精我家給富心愛公欲盡以我禁方書悉教公臣意即曰幸甚非意之所敢望也臣意即避席再拜謁受其脈書上下經五色診奇咳術揆度陰陽外變藥論石神接陰陽禁書受讀解驗之可一年所明歲即驗之有驗然尚未精也要事之三年所即嘗已為人治診病決死生有驗精良今慶已死十年所臣意年盡三年年三十九歲也齊侍御史成自言病頭痛臣意診其脈告曰君之病惡不可言也即出獨告成弟昌曰此病疽也內發于腸胃之間後五日當癰腫後八日嘔膿死成之病得之飲酒且內成即如期死所以知成之病者臣意切其脈得肝氣肝氣濁而靜此內關之病也脈法曰脈長而弦不得代四時者其病主在于肝和即經主病也代則絡脈有過經主病和者其病得之筋髓裏其代絶而脈賁者病得之酒且內所以知其後五日而癰腫八日嘔膿死者切其脈時少陽初代代者經病病去過人人則去絡脈主病當其時少陽初關一分故中熱而膿未發也及五分則至少陽之界及八日則嘔膿死故上二分而膿發至界而癰腫盡泄而死熱上則熏陽明爛流絡流絡動則脈結發脈結發則爛解故絡交熱氣已上行至頭而動故頭痛齊王中子諸嬰兒小子病召臣意診切其脈告曰氣鬲病病使人煩悶食不下時嘔沫病得之少憂數忔食飲臣意即為之作下氣湯以飲之一日氣下二日能食三日即病愈所以知小子之病者診其脈心氣也濁躁而經也此絡陽病也脈法曰脈來數病去難而不一者病主在心周身熱脈盛者為重陽重陽者蕩心主故煩悶食不下則絡脈有過絡脈有過則血上出血上出者死此悲心所生也病得之憂也齊郎中令循病衆醫皆以為蹶入中而刺之臣意診之曰湧疝也令人不得前後溲循曰不得前後溲三日矣臣意飲以火齊湯一飲得前溲再飲大溲三飲而疾愈病得之內所以知循病者切其脈時右口氣急脈無五藏氣右口脈大而數數者中下熱而湧左為下右為上皆無五藏應故曰湧疝中熱故溺赤也齊中御府長信病臣意入診其脈告曰熱病氣也然暑汗脈少衰不死曰此病得之當浴流水而寒甚已則熱信曰唯然往冬時為王使于楚至莒縣陽周水而莒橋梁頗壞信則攬車轅未欲渡也馬驚即墮信身入水中幾死吏即來救信出之水中衣盡濡有間而身寒已熱如火至今不可以見寒臣意即為之液湯火齊逐熱一飲汗盡再飲熱去三飲病已即使服藥出入二十日身無病者所以知信之病者切其脈時并陰脈法曰熱病陰陽交者死切之不交并陰并陰者脈順清而愈其熱雖未盡猶活也腎氣有時間濁在太陰脈口而希是水氣也腎固主水故以此知之失治一時即轉為寒熱齊王太后病召臣意入診脈曰風疸客脬難於大小溲溺赤臣意飲以火齊湯一飲即前後溲再飲病已溺如故病得之流汗出滫滫者去衣而汗晞也所以知齊王太后病者臣意診其脤切其太陰之口溼然風氣也脈法曰沈之而大堅浮之而大緊者病主在腎腎切之而相反也脈大而躁大者膀胱氣也躁者中有熱而溺赤齊章武里曹山跗病臣意診其脈曰肺消疸也加以寒熱即告其人曰死不治適其共養此不當醫治法曰後三日而當狂妄起行欲走後五日死即如期死山跗病得之盛怒而以接內所以知山跗之病者臣意切其脈肺氣熱也脈法曰不平不鼓形斃此五藏高之遠數以經病也故切之時不平而代不平者血不居其處代者時參擊並至乍躁乍大也此兩絡脈絶故死不治所以加寒熱者言其人尸奪尸奪形斃形斃者不當關灸鑱石及飲毒藥也臣意未往診時齊太醫先診山跗病灸其足少陽脈口而飲之半夏丸病者即泄注腹中虛又灸其少陰脈是壞肝剛絶深如是重損病者氣以故加寒熱所以後三日而當狂者肝一絡連屬結絶乳下陽明故絡絶開陽明脈陽明脈傷即當狂走後五日死者肝與心相去五分故曰五日盡盡即死矣齊中尉潘滿如病少腹痛臣意診其脈曰遺精瘕也臣意即謂齊太僕臣饒內史臣繇曰中尉不復自止於內則三十日死後二十餘日溲血死病得之酒且內所以知潘滿如病者臣意切其脈深小弱其卒然合合也是脾氣也右脈口氣緊小見瘕氣也以次相乘故三十日死三陰俱搏者如法不俱摶者決在急期一摶一代者近也故其三陰摶溲血如前止陽虛侯相趙章病召臣意衆醫皆以為寒中臣意診其脈曰迵風迵風者飲食下溢而輒出不留法曰五日死而後十日乃死病得之酒所以知趙章之病者臣意切其脈脈來滑是內風氣也飲食下嗌而輒出不留者法五日死皆為前分界法後十日乃死所以過期者其人嗜粥故中藏實中藏實故過期師言曰安穀者過期不安穀者不及期濟北王病召臣意診其脈曰風蹶胸滿即為藥酒盡三后病已得之汗出伏地所以知濟北王病者臣意切其脈時風氣也心脈濁病法過入其陽陽氣盡而陰氣入陰氣入張則寒氣上而熱氣下故胸滿汗出伏地者切其脈氣陰陰氣者病必入中出及瀺水也齊北宮司空命婦出于病衆醫皆以為風入中病主在肺刺其足少陽脈臣意診其脈曰病氣疝客于膀胱難于前後溲而溺赤病見寒氣則遺溺使人腹腫出于病得之欲溺不得因以接內所以知出于病者切其脈大而實其來難是蹶陰之動也脈來難者疝氣之客于膀胱也腹之所以腫者言蹶陰之絡結小腹也蹶陰有過則脈結動動則腹腫臣意即灸其足蹶陰之脈左右各一所即不遺溺而溲清小腹痛止即更為火齊湯以飲之三日而疝氣散即愈故濟北王阿母自言足熱而悶臣意告曰熱蹶也則刺其足心各三所案之無出血病旋已病得之飲酒大醉濟北王召意診脈諸女子侍者至女子豎豎無病臣意告永巷長曰豎傷脾不可勞法當春嘔血死臣意言王曰才人女子豎何能王曰是好為方多伎能為所是案法新往年巿之民所四百七十萬曹偶四人王曰得毋有病乎臣意對曰豎病重在死法中王召視之其顏色不變以為不然不賣諸侯所至春豎奉劍從王之廁王去豎後王令人召之即仆于廁嘔血死病得之流汗流汗者同法病內重毛髮而色澤脈不衰此亦關內之病也齊中大夫病齲齒臣意灸其左大陽明脈即為苦參湯日嗽三升出入五六日病已得之風及臥開口食而不嗽災川王美人懷子而不乳來召臣意臣意往飲以莨𦿆藥一撮以酒飲之旋乳臣意復診其脈而脈躁躁者有餘病即飲以消石一齊出血血如豆比五六杖齊丞相舍人奴從朝入宮臣意見之食閨門外望其色有病氣臣意即告宦者平平好為脈學臣意所臣意即示之舍人奴病告之曰此傷脾氣也當至春鬲塞不通不能食飲法至夏泄血死宦者平即往告相曰君之舍人奴有病病重死期有日相君曰卿何以知之曰君朝時入宮君之舍人奴盡食閨門外平與倉公立即示平曰病如是者死相即召舍人奴而謂之曰公奴有病不舍人曰奴無病身無痛者至春果病至四月泄血死所以知奴病者脾氣周乘五藏傷部而交故傷脾之色也望之殺然黃察之如死青之茲衆醫不知以為大蟲不知傷脾所以至春死病者胃氣黃黃者土氣也土不勝木故至春死所以至夏死者脈法曰病重而脈順清者曰內關內關之病人不知其所痛心急然無苦若加以一病死中春一愈順及一時其所以四月死者診其人時愈順愈順者人尚肥也奴之病得之流汗數出灸於火而以出見大風也災川王病召臣意診脈曰蹶上為重頭痛身熱使人煩悶臣意即以寒水拊其頭刺足陽明脈左右各三所病旋已病得之沐髮未乾而臥診如前所以蹶頭熱至肩齊王黃姬兄黃長卿家有酒召客召臣意諸客坐未上食臣意望見王后弟宋建告曰君有病往四五日君要脅痛不可俯仰又不得小溲不亟治病即入濡腎及其未舍五藏急治之病方今客腎濡此所謂腎痺也宋建曰然建故有要脊痛往四五日天雨黃氏諸倩見建家京下方石即弄之建亦欲效之效之不能起即復置之暮要脊痛不得溺至今不愈建病得之好持重所以知建病者臣意見其色太陽色乾腎部上及界要以下枯四分所故以往四五日知其發也臣意即為柔湯使服之十八日所而病愈濟北王侍者韓女病要背痛寒熱衆醫皆以為寒熱也臣意診脈曰內寒月事不下也即竄以藥旋下病已病得之欲男子而不可得也所以知韓女之病者診其脈時切之腎脈也嗇而不屬嗇而不屬者其來難堅故曰月不下肝脈弦出左口故曰欲男子不可得也臨災泛里女子薄吾病甚衆醫皆以為寒熱篤當死不治臣意診其脈曰蟯瘕蟯瘕為病腹大上膚黃粗循之戚戚然臣意飲以芫華一撮即出蟯可數升病已三十日如故病蟯得之於寒溼寒溼氣宛篤不發化為蟲臣意所以知薄吾病者切其脈循其尺其尺索刺粗而毛美奉髮是蟲氣也其色澤者中藏無邪氣及重病齊淳于司馬病臣意切其脈告曰當病迵風迵風之狀飲食下嗌輒後之病得之飽食而疾走淳于司馬曰我之王家食馬肝食飽甚見酒來即走去驅疾至舍即泄數十出臣意告曰為火齊米汁飲之七八日而當愈時醫秦信在旁臣意去信謂左右閣都尉曰意以淳于司馬病為何曰以為迵風可治信即笑曰是不知也淳于司馬病法當後九日死即後九日不死其家復召臣意臣意往問之盡如意診臣即為一火齊米汁使服之七八日病已所以知之者診其脈時切之盡如法其病順故不死齊中郎破石病臣意診其脈告曰肺傷不治當後十日丁亥溲血死即後十一日溲血而死破石之病得之墮馬僵石上所以知破石之病者切其脈得肺陰氣其來散數道至而不一也色又乘之所以知其墮馬者切之得番陰脈番陰脈入虛裏乘肺脈肺脈散者固色變也乘之所以不中期死者師言曰病者安穀即過期不安穀則不及期其人嗜黍黍主肺故過期所以溲血者診脈法曰病養喜陰處者順死養喜陽處者逆死其人喜自靜不躁又久安坐伏几而寐故血下泄齊王侍醫遂病自練五石服之臣意往過之遂謂意曰不肖有病幸診遂也臣意即診之告曰公病中熱論曰中熱不溲者不可服五石石之為藥精悍公服之不得數溲亟勿服色將發臃遂曰扁鵲曰陰石以治陰病陽石以治陽病夫藥石者有陰陽水火之齊故中熱即為陰石柔齊治之中寒即為陽石剛齊治之臣意曰公所論遠矣扁鵲雖言若是然必審診起度量立規矩稱權衡合色脈表裏有餘不足順逆之法參其人動靜與息相應乃可以論論曰陽疾處內陰形應外者不加悍藥及鑱石夫悍藥入中則邪氣辟矣而宛氣愈深診法曰二陰應外一陽接內者不可以剛藥剛藥入則動陽陰病益衰陽病益著邪氣流行為重困於俞忿發為疽意告之後百餘日果為疽發乳上入缺盆死此謂論之大體也必有經紀拙工有一不習文理陰陽失矣齊王故為陽虛侯時病甚衆醫皆以為蹶臣意診脈以為痺根在右脅下大如覆杯令人喘逆氣不能食臣意即以火齊粥且飲六日氣下即令更服丸藥出入六日病已病得之內診之時不能識其經解大識其病所在臣意嘗診安陽武都里成開方開方自言以為不病臣意謂之病苦沓風三歲四支不能自用使人瘖瘖即死今聞其四支不能用瘖而未死也病得之數飲酒以見大風氣所以知成開方病者診之其脈法奇咳言曰藏氣相反者死切之得腎反肺法曰三歲死也安陵阪里公乘項處病臣意診脈曰牡疝牡疝在鬲下上連肺病得之內臣意謂之慎毋為勞力事為勞力事則必嘔血死處後蹴踘要蹶寒汗出多即嘔血臣意復診之曰當旦日日夕死即死病得之內所以知項處病者切其脈得番陽番陽入虛裏處旦日死一番一絡者牡疝也臣意曰他所診期決死生及所治已病衆多久頗忘之不能盡識不敢以對問臣意所診治病病名多同而診異或死或不死何也對曰病名多相類不可知故古聖人為之脈法以起度量立規矩縣權衡案繩墨調陰陽別人之脈各名之與天地相應參合於人故乃別百病以異之有數者能異之無數者同之然脈法不可勝驗診疾人以度異之乃可別同名命病主在所居今臣意所診者皆有診籍所以別之者臣意所受師方適成師死以故表籍所診期決死生觀所失所得者合脈法以故至今知之問臣意曰所期病決死生或不應期何故對曰此皆飲食喜怒不節或不當飲藥或不當針灸以故不中期死也問臣意意方能知病死生論藥用所宜諸侯王大臣有嘗問意者不及文王病時不求意診治何故對曰趙王膠西王濟南王吳王皆使人來召臣意臣意不敢往文王病時臣意家貧欲為人治病誠恐吏以除拘臣意也故移名數左右不修家生出行遊國中問善為方數者事之久矣見事數師悉受其要事盡其方書意及解論之身居陽虛侯國因事侯侯入朝臣意從之長安以故得診安陵項處等病也問臣意知文王所以得病不起之狀臣意對曰不見文王病然竊聞文王病喘頭痛目不明臣意心論之以為非病也以為肥而蓄精身體不得搖骨肉不相任故喘不當醫治脈法曰年二十脈氣當趨年三十當疾步年四十當安坐年五十當安臥年六十已上氣當大董文王年未滿二十方脈氣之趨也而徐之不應天道四時後聞醫灸之即篤此論病之過也臣意論之以為神氣爭而邪氣入非年少所能復之也以故死所謂氣者當調飲食擇晏日車步廣志以適筋骨肉血脈以瀉氣故年二十是謂易貿法不當砭灸砭灸至氣逐問臣意師慶安受之聞于齊諸侯不對曰不知慶所師受慶家富善為醫不肯為人治病當以此故不聞慶又告臣意曰慎毋令我子孫知若學我方也問臣意師慶何見於意而愛意欲悉教意方對曰臣意不聞師慶為方善也意所以知慶者意少時好諸方事臣意試其方皆多驗精良臣意聞災川唐里公孫光善為古傳方臣意即往謁之得見事之受方化陰陽及傳語法臣意悉受書之臣意欲盡受他精方公孫光曰吾方盡矣不為愛公所吾身已衰無所復事之是吾年少所受妙方也悉與公毋以教人臣意曰得見事侍公前悉得禁方幸甚意死不敢妄傳人居有間公孫光間處臣意深論方見言百世為之精也師光喜曰公必為國工吾有所善者皆疏同産處臨災善為方吾不若其方甚奇非世之所聞也吾年中時嘗欲受其方楊中倩不肯曰若非其人也胥與公往見之當知公喜方也其人亦老矣其家給富時者未往會慶子男殷來獻馬因師光奏馬王所意以故得與殷善光又屬意于殷曰意好數公必謹遇之其人聖儒即為書以意屬陽慶以故知慶臣意事謹以故愛意也問臣意曰吏民嘗有事學意方及畢盡得意方不何縣里人對曰臨災人宋邑邑學臣意教以五診歲餘濟北王遣太醫高期王禹學臣意教以經脈高下及奇絡結當論俞所居及氣當上下出入邪正逆順以宜鑱石定砭灸處歲餘災川王時遣太倉馬長馮信正方臣意教以案法逆順論藥法定五味及和齊湯法高永侯家丞杜信喜脈來學臣意教以上下經脤診二歲餘臨災召里唐安來學臣意教以五診上下經脈奇咳四時應陰陽重未成除為齊王侍醫問臣意診病決死生能全無失乎臣意對曰意治病人必先切其脈乃治之敗逆者不可治其順者乃治之心不精脈所期死生視可治時時失之臣意不能全也見史記倉公傳
