body:
  text: 朝錯賢良文學對策平陽侯臣窋汝陰侯臣竈潁陰侯臣何廷尉臣宜昌隴西太守臣昆邪所選賢良太子家令臣錯昧死再拜言臣竊聞古之賢主莫不求賢以為輔翼故黃帝得力牧而為五帝先大禹得咎繇而為三王祖齊桓得管子而為五伯長今陛下講于大禹及高皇之建豪英也退託于不明以求賢良讓之至也臣竊觀上世之傳若高皇帝之建功業陛下之德厚而得賢佐皆有司之所覽刻于玉版藏于金匱歷之春秋紀之後世為帝者祖宗與天地相終今臣窋等乃以臣錯充賦甚不稱明詔求賢之意臣錯屮茅臣亡識知昧死上愚對曰詔策曰明于國家大體愚臣竊以古之五帝明之臣聞五帝神聖其臣莫能及故自親事處于法宮之中明堂之上動靜上配天下順地中得人故衆生之類亡不覆也根著之徒亡不載也燭以光明亡偏異也德上及飛鳥下至水蟲草木諸産皆被其澤然後陰陽調四時節日月光風雨時膏露降五穀熟祅孽滅賊氣息民不疾疫河出圖洛出書神龍至鳳鳥翔德澤滿天下靈光施四海此謂配天地治國大體之功也詔策曰通于人事終紿愚臣竊以古之三王明之臣聞三王臣主俱賢故合謀相輔計安天下莫不本于人情人情莫不欲壽三王生而不傷也人情莫不欲富三王厚而不困也人情莫不欲安三王扶而不危也人情莫不欲逸三王節其力而不盡也其為法令也合于人情而後行之其動衆使民也本于人事然後為之取人以己內恕及人情之所惡不以強人情之所欲不以禁民是以天下樂其政歸其德望之若父母從之若流水百姓和親國家安寧名位不失施及後世此明于人情終始之功也詔策曰直言極諫愚臣竊以五伯之臣明之臣聞五伯不及其臣故屬之以國任之以事五伯之佐之為人臣也察身而不敢誣奉法令不容私盡心力不敢矜遭患難不避死見賢不居其上受祿不過其量不以亡能居尊顯之位自行若此可謂方正之士矣其立法也非以苦民傷衆而為之機陷也以之興利除害尊主安民而救暴亂也其行賞也非虛取民財妄豫人也以勸天下之忠孝而明其功也故功多者賞厚功少者賞薄如此斂民財以顧其功而民不恨者知與而安己也其行罰也非以忿怒妄誅而從暴心也以禁天下不忠不孝而害國者也故罪大者罰重罪小者罰輕如此民雖伏罪至死而不怨者知罪罰之至自取之也立法若此可謂平正之吏矣法之逆者請而更之不以傷民主行之暴者逆而復之不以傷國救主之失補主之過揚主之美明主之功使主內亡邪辟之行外亡騫汙之名事君若此可謂直言極諫之士矣此五伯之所以德匡天下威正諸侯功業甚美名聲章明舉天下之賢主五伯與焉此身不及其臣而使得直言極諫補其不逮之功也今陛下人民之衆威武之重德惠之厚令行禁止之勢萬萬于五伯而賜愚臣策曰匡朕之不逮愚臣何足以識陛下之高明而奉承之詔策曰吏之不平政之不宣民之不寧愚臣竊以秦事明之臣聞秦始并天下之時其主不及三王而臣不及其佐然功力不遲者何也地形便山川利財用足民利戰其所與並者六國六國者臣主皆不肖謀不輯民不用故當此之時秦最富強夫國富強而鄰國亂者帝王之資也故秦能兼六國立為天子當此之時三王之功不能進焉及其末塗之衰也任不肖而信讒賊宮室過度耆欲亡極民力罷盡賦斂不節矜奮自賢群臣恐諛驕溢縱恣不顧患禍妄賞以隨善意妄誅以快怒心法令煩憯刑罰暴酷輕絶人命身自射殺天下寒心莫安其處姦邪之吏乘其亂法以成其威獄官主斷生殺自恣上下瓦解各自為制秦始亂之時吏之所先侵者貧人賤民也至其中節所侵者富人吏家也及其末塗所侵者宗室大臣也是故親疏皆危外內咸怨離散逋逃人有走心陳勝先倡天下大潰絶祀亡世為異姓福此吏不平政不宣民不寧之禍也今陛下配天象地覆露萬民絶秦之迹除其亂法躬親本事廢去淫末除苛解嬈寬大愛人肉刑不用罪人亡帑非謗不治鑄錢者除通關去塞不孽諸侯賓禮長老愛恤少孤罪人有期後宮出嫁尊賜孝悌農民不租明詔軍師愛士大夫求進方正廢退姦邪除去陰刑害民者誅憂勞百姓列侯就都親耕節用視民不奢所為天下興利除害變法易故以安海內者大功數十皆上世之所難及陛下行之道純德厚元元之民幸矣詔策曰永惟朕之不德愚臣不足以當之詔策曰悉陳其志幸毋有所隱愚臣竊以五帝之賢臣明之臣聞五帝其臣莫能及則自親之三王臣主俱賢則共憂之五伯不及其臣則任使之此所以神明不遺而聖賢不廢也故各當其世而立功德焉傳曰往者不可及來者猶可待能明其世者謂之天子此之謂也竊聞戰不勝者易其地民貧窮者變其業今以陛下神明德厚資財不下五帝臨制天下至今十有六年民不益富盜賊不衰邊竟未安其所以然意者陛下未之躬親而待群臣也今執事之臣皆天下之選已然莫能望陛下清光譬之猶五帝之佐也陛下不自躬親而待不望清光之臣臣竊恐神明之遺也日損一日歲亡一歲日月益暮盛德不及究于天下以傳萬世愚臣不自度量竊為陛下惜之昧死上狂惑屮茅之愚臣言唯陛下財擇見漢書朝錯傳上書言皇太子宜知術數人主所以尊顯功名揚于萬世之後者以知術數也故人主知所以臨制臣下而治其衆則群臣畏服矣知所以聽言受事則不欺蔽矣知所以安利萬民則海內必從矣知所以忠孝事上則臣子之行備矣此四者臣竊為皇太子急之人臣之議或曰皇太子亡以知事為也臣之愚誠以為不然竊觀上世之君不能奉其宗廟而劫殺于其臣者皆不知術數者也皇太子所讀書多矣而未深知術數者不問書説也夫多誦而不知其説所謂勞苦而不為功臣竊觀皇太子材智高奇馭射伎藝過人絶遠然于術數未有所守者以陛下為心也竊願陛下幸擇聖人之術可用今世者以賜皇太子因時使太子陳明于前唯陛下裁察見漢書朝錯傳上書言兵事臣聞漢興以來胡虜數入邊地小入則小利大入則大利高后時再入隴西攻城屠邑驅略畜産其後復入隴西殺吏卒大寇盜竊聞戰勝之威民氣百倍敗兵之卒沒世不復自高后以來隴西三困于胸奴矣民氣破傷亡有勝意今茲隴西之吏賴社稷之神靈奉陛下之明詔和輯士卒底厲其節起破傷之民以當乘勝之胸奴用少擊衆殺一王敗其衆而法曰大有利非隴西之民有勇怯乃將吏之制巧拙異也故兵法曰有必勝之將無必勝之民繇此觀之安邊境立功名在于良將不可不擇也臣又聞用兵臨戰合刃之急者三一曰得地形二曰卒服習三曰器用利兵法曰丈五之溝漸車之水山林積石經川丘阜屮木所在此步兵之地也車騎二不當一土山丘陵曼衍相屬平原廣野此車騎之地步兵十不當一平陵相遠川谷居間仰高臨下此弓弩之地也短兵百不當一兩陳相近平地淺草可前可後此長戟之地也劍楯三不當一萑葦竹蕭屮木蒙蘢支葉茂接此矛鋋之地也長戟二不當一曲道相伏險厄相薄此劍楯之地也弓弩三不當一士不選練卒不服習起居不精動靜不集趨利弗及避難不畢前擊後解與金鼓之音相失此不習勒卒之過也百不當十兵不完利與空手同甲不堅密與袒裼同弩不可以及遠與短兵同射不能中與亡矢同中不能入與亡鏃同此將不省兵之禍也五不當一故兵法曰器械不利以其卒豫敵也卒不可用以其將豫敵也將不知兵以其主豫敵也君不擇將以其國豫敵也四者國之至要也臣又聞小大異形強弱異勢險易異備夫卑身以事強小國之形也合小以攻大敵國之形也以蠻夷攻蠻夷中國之形也今胸奴地形技藝與中國異上下山阪出入溪澗中國之馬弗與也險道傾仄且馳且射中國之騎弗與也風雨罷勞飢渴不困中國之人弗與也此胸奴之長技也若夫平原易地輕車突騎則胸奴之衆易撓亂也徑弩長戟射疏及遠則胸奴之弓弗能格也堅甲利刃長短相雜遊弩往來什伍俱前則胸奴之兵弗能當也材官騶發矢道同的則胸奴之革笥木薦弗能支也下馬地鬭劍戟相接去就相薄則胸奴之足弗能給也此中國之長技也以此觀之胸奴之長技三中國之長技五陛下又興數十萬之衆以誅數萬之胸奴衆寡之計以一擊十之術也雖然兵凶器戰危事也以大為小以強為弱在俯卬之間耳夫以人之死爭勝跌而不振則悔之亡及也帝王之道出于萬全今降胡義渠蠻夷之屬來歸誼者其衆數千飲食長技與胸奴同可賜之堅甲絮衣徑弓利矢益以邊郡之良騎令明將能知其習俗和輯其心者以陛下之明約將之即有險阻以此當之平地通道則以輕車材官制之兩軍相為表裏各用其長技衡加之以衆此萬全之術也傳曰狂夫之言而明主擇焉臣錯愚陋昧死上狂言唯陛下財擇見漢書朝錯傳言守邊備塞務農力本當世急務二事臣聞秦時北攻胡貉築塞河上南攻楊粵置戍卒焉其起兵而攻胡粵者非以衛邊地而救民死也貪戾而欲廣大也故功未立而天下亂且夫起兵而不知其勢戰則為人禽屯則卒積死夫胡貉之地積陰之處也木皮三寸冰厚六尺食肉而飲酪其人密理鳥獸毳毛其性能寒楊粵之地少陰多陽其人疏理鳥獸希毛其性能暑秦之戍卒不能其水土戍者死于邊輸者僨于道秦民見行如往棄市因以謫發之名曰謫戍先發吏有謫及贅壻賈人後以嘗有市籍者又後以大父母父母嘗有市籍者後入閭取其左發之不順行者深怨有背畔之心凡民守戰至死而不降北者以計為之也故戰勝守固則有拜爵之賞攻城屠邑則得其財鹵以富家室故能使其衆蒙矢石赴湯火視死如生今秦之發卒也有萬死之害而亡銖兩之報死事之後不得一算之復天下明知禍烈及己也陳勝行戍至于大澤為天下先倡天下從之如流水者秦以威劫而行之之敝也胡人衣食之業不著于地其勢易以擾亂邊竟何以明之胡人食肉飲酪衣皮毛非有城郭田宅之歸居如飛鳥走獸于廣野美草甘水則止草盡水竭則入以是觀之往來轉徙時至時去此胡人之生業而中國之所以離南畝也今使胡人數處轉牧行獵于塞下或當燕代或當上郡北地隴西以候備塞之卒卒少則入陛下不救則邊民絶望而有降敵之心救之少發則不足多發遠縣才至則胡又已去聚而不罷為費甚大罷之則胡復入如此連年則中國貧苦而民不安矣陛下幸憂邊境遣將吏發卒以治塞甚大惠也然今遠方之卒守塞一歲而更不知胡人之能不如選常居者家室田作且以備之以便為之高城深塹具藺石布渠答復為一城其內城間百五十步要害之處通川之道調立城邑毋下千家為中周虎落先為室屋具田器乃募罪人及免徒復作令居之不足募以丁奴婢贖罪及輸奴婢欲以拜爵者不足乃募民之欲往者皆賜高爵復其家豫冬夏衣廩食能自給而止郡縣之民得買其爵以自增至卿其亡夫若妻者縣官買豫之人情非有匹敵不能久安其處塞下之民祿利不厚不可使久居危難之地胡人入驅而能止其所驅者以其半豫之縣官為贖其民如是則邑里相救助赴胡不避死非以德上也欲全親戚而利其財也此與東方之戎卒不習地勢而心畏胡者功相萬也以陛下之時徙民實邊使遠方亡屯戍之事塞下之民父子相保亡係虜之患利施後世名稱聖明其與秦之行怨民相去遠矣見漢書朝錯傳復言募民徙塞下陛下幸募民相徙以實塞下使屯戍之事益省輸將之費益寡甚大惠也下吏誠能稱厚惠奉明法存恤所徙之老弱善遇其壯士和輯其心而勿侵刻使先至者安樂而不思故鄉則貧民相募而勸往矣臣聞古之徙遠方以實廣虛也相其陰陽之和嘗其水泉之味審其土地之宜觀其屮木之饒然後營邑立城製里割宅通田作之道正阡陌之界先為築室家有一堂二內門戶之閉置器物焉民至有所居作有所用此民所以輕去故鄉而勸之新色也為置醫巫以救疾病以修祭祀男女有昏生死相恤墳墓相從種樹畜長室屋完安此所以使民樂其處而有長居之心也臣又聞古之制邊縣以備敵也使五家為伍伍有長十長一里里有假士四里一連連有假五百十連一邑邑有假候皆擇其邑之賢材有護習地形知民心者居則習民于射法出則教民于應敵故卒伍成于內則軍正定于外服習以成勿令遷徙幼則同遊長則共事夜戰聲相知則足以相救晝戰目相見則足以相識歡愛之心足以相死如此而勸以厚賞威以重罰則前死不還踵矣所徙之民非壯有材力但費衣糧不可用也雖有材力不得良吏猶亡功也陛下絶胸奴不與和親臣竊意其冬來南也一大治則終身創矣欲立威者始于折膠來而不能困使得氣去後未易服也愚臣亡識唯陛下財察見漢書朝錯傳説文帝令民入粟受爵聖王在上而民不凍飢者非能耕而食之織而衣之也為開其資財之道也故堯禹有九年之水湯有七年之旱而國亡捐瘠者以畜積多而備先具也今海內為一土地人民之衆不避湯禹加以亡天災數年之水旱而畜積未及者何也地有遺利民有餘力生穀之土未盡墾山澤之利未盡出也遊食之民未盡歸農也民貧則姦邪生貧生于不足不足生于不農不農則不地著不地著則離鄉輕家民如鳥獸雖有高城深池嚴法重刑猶不能禁也夫寒之于衣不待輕暖飢之于食不待甘旨飢寒至身不顧廉恥人情一日不再食則飢終歲不製衣則寒夫腹飢不得食膚寒不得衣雖慈母不能保其子君安能以有其民哉明主知其然也故務民于農桑薄賦斂廣畜積以實倉廩備水旱故民可得而有也民者在上所以牧之趨利如水走下四方亡擇也夫珠玉金銀飢不可食寒不可衣然而衆貴之者以上用之故也其為物輕微易藏在于把握可以周海內而亡飢寒之患此令臣輕背其主而民易去其鄉盜賊有所勸亡逃者得輕資也粟米布帛生于地長于時聚于力非可一日成也數石之重中人弗勝不為姦邪所利一日弗得而飢寒至是故明君貴五穀而賤金玉今農夫五口之家其服役者不下二人其能耕者不過百畝百畝之收不過百石春耕夏耘秋穫冬藏伐薪樵治官府給繇役春不得避風塵夏不得避暑熱秋不得避陰雨冬不得避寒凍四時之間亡日休息又私自送往迎來弔死問疾養孤長幼在其中勤苦如此尚復被水旱之災急政暴虐賦斂不時朝令而暮改當其有者半賈而賣亡者取倍稱之息于是有賣田宅鬻子孫以償責者矣而商賈大者積貯倍息小者坐列販賣操其奇贏日遊都市乘上之急所賣必倍故其男不耕耘女不蠶織衣必文采食必梁肉亡農夫之苦有阡伯之得因其富厚交通王侯力過吏勢以利相傾千里遊敖冠蓋相望乘堅策肥履絲曳縞此商人所以兼并農人農人所以流亡者也今法律賤商人商人已富貴矣尊農夫農夫已貧賤矣故俗之所貴主之所賤也吏之所卑法之所尊也上下相反好惡乖忤而欲國富法立不可得也方今之務莫若使民務農而已矣欲民務農在于貴粟貴粟之道在于使民以粟為賞罰今募天下入粟縣官得以拜爵得以除罪如此富人有爵農民有錢粟有所泄夫能入粟以受爵皆有餘者也取于有餘以供上用則貧民之富可損所謂損有餘補不足令出而民利者也順于民心所補者三一曰主用足二日民賦少三曰勸農功今令民有車騎馬一匹者復卒三人車騎者天下武備也故為復卒神農之教曰有石城十仞湯池百步帶甲百萬而亡粟弗能守也以是觀之粟者王者大用政之本務令民入粟受爵至五大夫以上乃復一人耳此其與騎馬之功相去遠矣爵者上之所擅出于口而亡窮粟者民之所種生于地而不乏夫得高爵與免罪人之所甚欲也使天下入粟於邊以受爵免罪不過三歲塞下之粟必多矣見漢書食貨志利民欲者莫如用爵致粟矣能以粟拜爵者皆民之有餘者也取有餘以給塞下之食則富人有爵而貧民損益于征賦矣此以有餘補不足而貧富之民各得其願也見藝文類聚八十五案此與食貨志小異故録附于後復奏勿收農民租陛下幸使天下入粟塞下以拜爵甚大惠也竊恐塞卒之食不足用大泄天下粟邊食足以支五歲可令入粟郡縣矣足支一歲以上可時赦勿收農民租如此德澤加于萬民民俞勤農時有軍役若遭水旱民不困乏天下安寧歲孰且美則民大富樂矣見漢書食貨志説景帝削吳昔高帝初定天下昆弟少諸子弱大封同姓故孽子悼惠王王齊七十二城庶弟元王王楚四十城兄子王吳五十餘城封三庶孽分天下半今吳王前有太子之隙詐稱病不朝于古法當誅文帝不忍因賜几杖德至厚也不改過自新乃益驕恣公即山鑄錢煮海為鹽誘天下亡人謀作亂逆今削之亦反不削亦反削之其反亟禍小不削之其反遲禍大見漢書吳王濞傳請誅楚王楚王戊往年為薄太后服私姦服舍請誅之見漢書吳王濞傳更議著令吏及諸有秩受其官屬所監所治所行所將其與飲食計償費勿論它物若買故賤賣故貴皆坐臧為盜沒入臧縣官吏遷徙免罷受其故官屬所將監治送財物奪爵為士伍免之無爵罰金二斤令沒入所受有能捕告畀其所受臧見漢書景紀元年七月廷尉信與丞相議
