body:
  text: 嚴青翟奏請立皇子為諸侯王御史臣光守尚書令丞非下御史書到言丞相臣青翟御史大夫臣湯太常臣充大行令臣息太子少傅臣安行宗正事昧死上言大司馬去病上疏曰陛下過聽使臣去病待罪行間宜專邊塞之思慮暴骸中野無以報乃敢惟他議以干用事者誠見陛下憂勞天下哀憐百姓以自忘虧膳貶樂損郎員皇子賴天能勝衣趨拜至今無號位師傅官陛下恭讓不恤群臣私望不敢越職而言臣竊不勝犬馬心昧死願陛下詔有司因盛夏吉時定皇子位唯願陛下幸察制曰下御史臣謹與中二千石二千石臣賀等議古者裂地立國並建諸侯以承天子所以尊宗廟重社稷也今臣去病上疏不忘其職因以宣恩乃道天子卑讓自貶以勞天下慮皇子未有號位臣青翟臣湯等宜奉義遵職愚憧而不逮事方今盛夏吉時臣青翟臣湯等昧死請立皇子臣閎臣旦臣胥為諸侯王昧死請所立國名見史記三王世家丞相臣青翟御史大夫臣湯昧死言臣謹與列侯臣嬰齊中二千石二千石臣賀諫大夫博士臣安等議曰伏聞周封八百姬姓並列奉承天子康叔以祖考顯而伯禽以周公立咸為建國諸侯以相傅為輔百官奉憲各遵其職而國統備矣竊以為並建諸侯所以重社稷者四海諸侯各以其職奉貢祭支子不得奉祭宗祖禮也封建使守藩國帝王所以扶德施化陛下奉承天統明開聖緒尊賢顯功興滅繼絶續蕭文終之後于酇褒厲群臣平津侯等昭六親之序明天施之屬使諸侯王封君得推私恩分子弟戶邑錫號尊建百有餘國而家皇子為列侯則尊卑相踰列位失序不可以垂統於萬世臣請立臣閎臣旦臣胥為諸侯王見史記三王世家丞相臣青翟御史大夫臣湯昧死言臣青翟等與列侯吏二千石諫大夫博士臣慶等議昧死奏請立皇子為諸侯王制曰康叔親屬有十而獨尊者褎有德也周公祭天命郊故魯有白牡騂剛之牲群公不毛賢不肖差也高山仰之景行嚮之朕甚慕焉所以抑未成家以列侯可臣青翟臣湯博士臣將行等伏聞康叔親屬有十武王繼體周公輔成王其八人皆以祖考之尊建為大國康叔之年幼周公在三公之位而伯禽據國于魯蓋爵命之時未至成人康叔後扞祿父之難伯禽殄淮夷之亂昔五帝異制周爵五等春秋三等皆因時而序尊卑高皇帝撥亂世反諸正昭至德定海內封建諸侯爵位二等皇子或在繈褓而立為諸侯王奉承天子為萬世法則不可易陛下躬親仁義體行聖德表裏文武顯慈孝之行廣賢能之路內褎有德外討強暴極臨北海西溱月氏胸奴西域舉國奉師輿械之費不賦於民虛御府之藏以賞元戎開禁倉以振貧窮減戍卒之半百蠻之君靡不鄉風承流稱意遠方殊俗重譯而朝澤及方外故珍獸至嘉穀興天應甚彰今諸侯支子封至諸侯王而家為列侯臣青翟臣湯等竊伏孰計之皆以為尊卑失序使天下失望不可臣請立臣閎臣旦臣胥為諸侯王見史記三王世家丞相臣青翟太僕臣賀行御史大夫事太常臣充太子少傅臣安行宗正事昧死言臣青翟等前奏大司馬臣去病上疏言皇子未有號位臣謹與御史大夫臣湯中二千石二千石諫大夫博士臣慶等昧死請立皇子臣閎等為諸侯王陛下讓文武躬自切及皇子未教群臣之議儒者稱其術或悖其心陛下固辭弗許家皇子為列侯臣青翟等竊與列侯臣壽成等二十七人議皆曰以為尊卑失序高皇帝建天下為漢太祖王子孫廣支輔先帝法則弗改所以宣至尊也臣請令史官擇吉日具禮儀上御史奏輿地圖他皆如前故事見史記三王世家哀時命哀時命之不及古人兮夫何豫生之不遘時往者不可扳援兮徠者不可與期志憾恨而不逞兮抒中情而屬詩夜炯炯而不寐兮懷隱憂而歷茲心鬱鬱而無告兮衆孰可與深謀欿愁悴而委惰兮老冉冉而逮之居處愁以隱約兮志沈抑而不揚道壅塞而不通兮江河廣而無梁願至崑崙之縣圃兮采鍾山之玉英攬瑤木之橝枝兮望閬風之板桐弱水汨其為難兮路中斷而不通勢不能淩波以徑度兮又無羽翼而高翔然隱憫而不達兮獨徙倚而而倣徉悵惝惘以永思兮心紆軫而增傷倚躊躇以淹留兮日飢饉而絶糧廓抱景而獨倚兮超永思乎故鄉廓落寂而無友兮誰可與玩此遺芳白日晼晚其將入兮哀余壽之弗將車既斃而馬罷兮蹇邅徊而不能行身既不容于濁世兮不知進退之宜當冠崔嵬而切雲兮劍淋離而從橫衣攝葉以儲與兮左袪挂于槫桑右衽拂于不周兮六合不足以肆行上同鑿枘于伏戲兮下合矩矱于虞唐願尊節而式高兮志猶卑夫禹湯雖知困其不改操終不以邪枉害方世並舉而好朋友兮一斗斛而相量衆比周以肩迫兮賢者遠而隱藏為鳳皇作鶉籠兮雖翕翅其不容靈皇其不寤知兮焉陳詞而效忠俗嫉妬而蔽賢兮孰知余之從容願舒志而抽馮兮庸詎知其吉凶璋圭雜于甑窐兮隴廉與孟娵同宮舉世以為恆俗兮固將愁而終窮幽獨轉而不寐兮惟煩悶而盈胸魂眇眇而馳騁兮心煩冤之忡忡志欿憾而不憺兮路幽昧而甚難塊獨守此曲隅兮然欿切而永歎愁修夜而宛轉兮氣涫沸其若波握剞劂而不用兮操規矩而無所施騁騏驥于中庭兮焉能極夫遠道置猿狖于櫺檻兮夫何以責其捷巧駟跛鱉而上山兮吾固知其不能升釋管晏而任臧獲兮何權衡之能稱箟簬雜于黀蒸兮機蓬矢以射革負擔荷以丈尺兮欲伸要而不可得外迫脅于機臂兮上牽聯于矰隿肩傾側而不容兮固狹腹而不得息務光自投于深淵兮不獲世之塵垢孰魁摧之可久兮願退身而窮處鑿山楹而為室兮下被衣于水渚霧露濛濛其晨降兮雲依斐而承宇虹霓紛其朝霞兮夕淫淫而淋雨怊茫茫而無歸兮悵遠望此曠野下垂釣于溪谷兮上要求于仙者與赤松而結友兮比王僑而為耦使梟楊先導兮白虎為之前後浮雲霧而入冥兮騎白鹿而容與魂眐眐以寄獨兮汨徂往而不歸處卓卓而日遠兮志浩蕩而傷懷鸞鳳翔于蒼雲兮故矰繳而不能加蛟龍潛于旋淵兮身不挂于罔羅知貪餌而近死兮不如下遊乎清波寧幽隱以遠禍兮孰侵辱之可為子胥死而成義兮屈原沈于汨羅雖體解其不變兮豈忠信之可化志怦怦而內直兮履繩墨而不頗執權衡而無私兮稱輕重而不差溉塵垢之枉攘兮除穢纍而反真形體白而質素兮中皎潔而淑清時厭飫而不用兮且隱伏而遠身聊竄端而匿迹兮嗼寂默而無聲獨便悁而煩毒兮焉發憤而抒情時曖曖其將罷兮遂悶歎而無名伯夷死于首陽兮卒夭隱而不榮太公不遇文王兮身至死而不得逞懷瑤象而佩瓊兮願陳列而無正生天墜之若過兮忽爛漫而無成邪氣襲余之形體兮疾憯怛而萌生願一見陽春之白日兮恐不終乎永年見楚辭諭意淮南王今者大王以發屯臨越事上書陛下故遣臣助告王其事王居遠事薄遽不與王同其計朝有闕政遺王之憂陛下甚恨之夫兵固凶器明主之所重出也然自五帝三王禁暴止亂非兵未之聞也漢為天下宗操殺生之柄以制海內之命危者望安亂者卬治今閩越王狼戾不仁殺其骨肉離其親戚所為甚多不義又數舉兵侵陵百越并兼鄰國以為暴強陰計奇策入燔尋陽樓船欲招會稽之地以踐句踐之迹今者邊又言閩王率兩國擊南越陛下為萬民安危久遠之計使人諭告之曰天下安寧各繼世撫民禁毋敢相并有司疑其以虎狼之心貪據百越之利或於逆順不奉明詔則會稽豫章必有長患且天子誅而不伐焉有勞百姓苦士卒乎故遣兩將屯於境上震威武揚聲鄉屯曾未會天誘其衷閩王隕命輒遣使者罷屯毋後農時南越王甚嘉被惠澤蒙休德願革心易行身從使者入謝有狗馬之病不能勝服故遣太子嬰齊入侍病有瘳願伏北闕望大廷以報盛德閩王以八月舉兵於冶南士卒罷倦三王之衆相與攻之因其弱弟餘善以成其誅至今國空虛遣使者上符節請所立不敢自立以待天子之明詔此一舉不挫一兵之鋒不用一卒之死而閩王伏辜南越被澤威震暴王義存危國此則陛下深計遠慮之所出也事效見前故使臣助來諭王意見漢書嚴助傳上書謝罪春秋天王出居于鄴鄭不能事母故絶之事君猶子事父母也臣助當伏誅願奉三年計最見漢書嚴助傳上書言罷屯方田作時請且罷軍屯見史記韓安國傳胸奴和親議千里而戰兵不獲利今胸奴負戎馬之足懷禽獸之心遷徙鳥舉難得而制也得其地不足以為廣有其衆不足以為強自上古不屬為人漢數千里爭利則人馬罷虜以全制其敝且強弩之極矢不能穿魯縞衝風之末力不能漂鴻毛非初不徑末力衰也擊之不便不如和親見史記韓安國傳又見漢書韓安國傳有刪節屏風賦屏風鞈匝蔽我君王重葩纍繡沓璧連璋飾以文錦映以流黃畫以古列顒顒昂昂藩后宜之壽考無疆見西京雜記上初學記二十五文鹿賦麀鹿濯濯來我槐庭食我槐葉懷我德聲質如湘縟文如素綦呦呦相召小雅之詩歎丘山之比歲逢梁王于一時見西京雜記上月賦月出皎兮君子之光鵾雞舞於蘭渚蟋蟀鳴於西堂君有禮樂我有衣裳猗嗟明月當心而出隱員巖而似鉤蔽修堞而分鏡既少進以增輝遂臨庭而高映匪明皓璧非淨躔度運行陰陽以正文林辨囿小臣不佞見西京雜記上又文選雪賦注曹植責躬詩注鮑照玩月城西門解中詩注引酒賦梁孝王遊于忘憂之館集諸遊士各使為賦鄒陽為酒賦其詞曰清者為酒濁者為醴清者聖明濁者頑騃皆麴湒丘之麥釀野田之米倉風莫預方金未啓嗟同物而異味歎殊才而共侍流光驛驛甘滋泥泥醪釀既成緑瓷既啓且筐且漉載莤載齊庶民以為歡君子以為禮其品類則洛淥酃程鄉若下高公之清關中白薄清渚縈停凝醳醇酎千日一醒哲王臨國綽矣多暇召皤皤之臣聚肅肅之賓安廣坐列雕屏綃綺為席犀為鎮曳長裾飛廣袖奮長纓英偉之士莞爾而即之君王憑玉几倚玉屏舉手一勞四座之士皆若哺梁焉乃縱酒作倡傾碗覆觴右以宮申旁徵揚樂只之深不吳不狂於是錫名餌袪夕醉遣朝醒吾君壽億萬歲常與日月爭光見西京雜記上初學記十又二十六几賦韓安國作几賦不成鄒陽代其詞曰高樹凌雲蟠紆煩冤旁生附枝王爾公舒之徒荷斧斤援葛藟攀喬枝上不測之絶頂伐之以歸眇者督直聾者磨礱齊貢金斧楚入名工乃成斯几離奇髣佛似龍盤馬回鳳去鸞歸君王憑之聖德日躋見西京雜記上上書吳王臣聞秦倚曲臺之宮懸衡天下畫地而人不犯兵加胡越至其晚節末路張耳陳勝連從兵之據以叩函谷咸陽遂危何則列郡不相親萬室不相救也今胡數涉北河之外上覆飛鳥下不見伏菟鬭城不休救兵不至死者相隨輦車相屬轉粟流輸千里不絶何則強趙責于河間六齊望于惠后城陽顧於盧博三淮南之心思墳墓大王不憂臣恐救兵之不專胡馬遂進窺於邯鄲越水長沙還舟青陽雖使梁并淮陽之兵下淮東越廣陵以遏越人之糧漢亦折西河而下北守漳水以輔大國胡亦益進越亦益深此臣之所為大王患也臣聞蛟龍驤首奮翼則浮雲北流霧雨咸集聖王底節修德則遊談之士歸義思名今臣盡智畢議易精極慮則無國不可姦飾固陋之心則何王之門不可曳長裾乎然臣所以歷數王之朝背淮千里而自致者非惡臣國而樂吳民也竊高下風之行尤悅大王之義故願大王之無忽察聽其至臣聞鷙鳥纍百不如一鶚夫全趙之時武力鼎士袨服叢臺之下者一旦成市而不能止幽王之湛患淮南連山東之俠死士盈朝不能還厲王之西也然則計議不得雖諸賁不能安其位亦明矣故願大王審畫而已始孝文皇帝據關入立寒心銷志不明求衣自立天子之後使東牟朱虛東褒儀父之後深割嬰兒王之壤子王梁代益以淮陽卒仆濟北囚弟于雍者豈非象新垣平等哉今天子新據先帝之遺業左規山東右制關中變權易勢大臣難知大王弗察臣恐周鼎復起于漢新垣過計于朝則我吳遺銅不可期於世矣高皇帝燒棧道水章邯兵不留行收斃民之倦東馳函谷西楚大破水攻則章邯以亡其城陸擊則荊王以失其地此皆國家之不幾者也願大王孰察之見漢書鄒陽傳文選藝文類聚二十四獄中上書自明臣聞忠無不報信不見疑臣常以為然徒虛語耳昔荊軻慕燕丹之義白虹貫日太子畏之衛先生為秦畫長平之事太白食昴昭王疑之夫精誠變天地而信不諭兩主豈不哀哉今臣盡忠竭誠畢議願知左右不明卒從吏訊為世所疑是使荊軻衛先生復起而燕秦不寤也願大王孰察之昔玉人獻寶楚王誅之李斯竭忠胡亥極刑是以箕子陽狂接輿避世恐遭此患也願大王察玉人李斯之意而後楚王胡亥之聽毋使臣為箕子接輿所笑臣聞比干剖心子胥鴟夷臣始不信乃今知之願大王孰察少加憐焉語曰有白頭如新傾蓋如故何則知與不知也故樊於期逃秦之燕藉荊軻首以奉丹事王奢去齊之魏臨城自剄以卻齊而存魏夫王奢樊於期非新於齊秦而故於燕魏也所以去二國死兩君者行合于志慕義無窮也是以蘇秦不信於天下為燕尾生白圭戰亡六城為魏取中山何則誠有以相知也蘇秦相燕人惡之燕王燕王案劍而怒食以駃騠白圭顯於中山人惡之於魏文侯文侯賜以夜光之璧何則兩主二臣剖心析肝相信豈移于浮辭哉故女無美惡入宮見妒士無賢不肖入朝見嫉昔司馬喜臏腳于宋卒相中山范睢摺脅折齒於魏卒為應侯此二人者皆信必然之畫捐朋黨之私挾孤獨之交故不能自免於嫉妒之人也是以申徒狄蹈雍之河徐衍負石入海不容于世義不苟取比周於朝以移主上之心故百里奚乞食于道路繆公委之以政寧戚飯牛車下而桓公任之以國此二人豈素官于朝借譽于左右然後二主用之哉感於心合於行堅如膠漆昆弟不能離豈惑於衆口哉故偏聽生姦獨任成亂昔魯聽季孫之説逐孔子宋信子冉之計囚墨翟夫以孔墨之辨不能自免于讒諛而二國以危何則衆口鑠金積毀銷骨也是以秦用戎人由余而伯中國齊用越人子臧而強威宣此二國豈係於俗牽于世繫奇偏之浮辭哉公聽並觀垂明當世故意合則胡越為兄弟由余子臧是矣不合則骨肉為讎敵朱象管蔡是矣今人主誠能用齊秦之明後宋魯之聽則五伯不足侔而三王易為也是以聖王覺寤捐子之之心而不悅田常之賢封比干之後修孕婦之墓故功業覆于天下何則欲善亡厭也夫晉文親其讎而強伯諸侯齊桓用其仇而一匡天下何則慈仁殷勤誠加于心不可以虛辭借也至夫秦用商鞅之法東弱韓魏立強天下卒車裂之越用大夫種之謀禽徑吳而霸中國遂誅其身是以孫叔敖三去相而不悔於陵子仲辭三公為人灌園今人主誠能去驕傲之心懷可報之意披心腹見情素隳肝膽施德厚終與之窮達無愛于士則桀之犬可使吠堯而跖之客可使刺由何況因萬乘之權假聖王之資乎然則荊軻湛七族要離燔妻子豈足為大王道哉臣聞明月之珠夜光之璧以暗投人于道衆莫不案劍相眄者何則無因而至前也蟠木根柢輪囷離奇而為萬乘器者何則以左右先為之容也故無因而至前雖出隨珠和璧祗怨結而不見德故有人先遊則枯木朽株樹功而不忘今天下布衣窮居之士身在貧羸雖蒙堯舜之術挾伊管之辨懷龍逢比干之意欲盡忠當世之君而素無根柢之容雖竭精神欲開忠於當世之君則人主必襲按劍相眄之迹矣是使布衣之士不得為枯木朽株之資也是以聖王制世御俗獨化於陶鈞之上而不牽乎卑辭之語不奪乎衆多之口故秦皇帝任中庶子蒙嘉之言以信荊軻之説而匕首竊發周文王獵涇渭載呂尚歸以王天下秦信左右而亡周用烏集而王何則以其能越攣拘之語馳域外之議獨觀乎昭曠之道也今人主沈諂諛之辭牽帷牆之制使不羈之士與牛驥同皂此鮑焦所以憤於世也而不留富貴之樂也臣聞盛飾入朝者不以私汙義底厲名號者不以利傷行故里名勝母曾子不入邑號朝歌墨子回車今欲使天下寥廓之士籠于威重之權脅于位勢之貴回面汙行以事諂諛之人而求親近于左右則士有伏死堀穴巖藪之中耳安有盡忠信而趨闕下者哉見史記漢書文選藝文類聚五十八
