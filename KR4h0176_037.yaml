body:
  text: 枚乘梁王菟園賦脩竹檀欒夾池水旋菟園竝馳道臨廣衍長𤕠板故徑于崑崙貇觀相物芴焉子有似乎西山西山隑隑卹焉嵬嵬巷路崣𡻣崟巖嵸巍𨝖焉暴熛激揚塵埃蛇龍奏林薄竹遊風踊焉秋風揚焉滿庶庶焉紛紛紜紜騰踊雲亂枝葉翬散摩來憣憣焉谿谷沙石涸波沸日湲浸疾東流連焉轔轔陰發緒菲菲誾誾讙擾昆雞蝭蛙倉庚密切別鳥相離哀鳴其中若乃附巢蹇𪆪之傳于列樹也欐欐若飛雪之重弗麗也西望西山山鵲野鳩白鷺鶻桐鸇鶚鷂鵰翡翠雊𨿜守狗戴勝巢枝穴藏被塘臨谷聲音相聞喙尾離屬翱翔群熙交頸接翼闒而未至徐飛翋䎓往來霞水離散而沒合疾疾紛紛若塵埃之閒白雲也予之幽冥究之乎無端于是晚春早夏邯鄲襄國易陽之容麗人及其燕飾子相與雜遝而往款焉車馬接軫相屬方輪錯轂接服何驂披銜跡蹶自奮增絕怵惕騰躍水意而未發因更陰逐心相秩奔隧林臨河怒氣未竭羽蓋繇起被以紅沬濛濛若雨委雪高冠扁焉長劍閉焉左挾彈焉右執鞭焉日移樂衰遊觀西園之芝芝成宮闕枝葉榮茂選擇純熟挈取含苴復取其次顧賜從者于是從容安步鬭雞走菟俛仰鈞射煎熬炮炙極樂到暮若乃夫郊采桑之婦人兮袿裼錯紆連袖方路摩胣長髮便娟數顧芳溫往來接神連未結已諾不分縹併進靖儐笑連便不可忍視也于是婦人先稱曰春陽生兮萋萋不才子兮心哀見嘉客兮不能歸桑萎蠶飢中人望柰何見古文苑蓺文類聚六十五柳賦忘憂之館垂條之木枝逶遲而含紫葉萋萋而吐綠出入風雲去來羽族既上下而好音亦黃衣而絳足蜩螗厲嚮蜘蛛吐絲階草漠漠白日遲遲于嗟細柳流亂輕絲君王淵穆其度御群英而翫之小臣瞽聵與此陳詞于嗟樂兮於是罇盈縹玉之酒爵獻金漿之醪庶羞千族盈滿六庖弱絲清管與風霜而共雕鎗鍠啾唧寂寥人英髦列襟聯袍小臣莫效于鴻毛空銜鮮而嗽醪雖復河清海竭終無增景于邊撩見西京雜記上又略見初學記二十八臨灞池遠訣賦見文選謝朓休沐重還道中詩注引枚乘集上書諫吳王臣聞得全者全昌失全者全亡舜無立錐之地以有天下禹無十戶之聚以王諸侯湯武之土不過百里上不絕三光之明下不傷百姓之心者有王術也故父子之道天性也忠臣不避重誅以直諫則事無遺策功流萬世臣乘願披腹心而效愚忠惟大王少加意念惻怛之心于臣乘言夫以一縷之任係千鈞之重上縣無極之高下垂不測之淵雖甚愚之人猶知哀其將絕也馬方駭鼓而驚之係方絕又重鎮之係絕於天不可復結隊入深淵難以復出其出不出間不容髮能聽忠臣之言百舉必脫必若所欲為危於累卵難于上天變所欲為易于反掌安於太山今欲極天命之上壽敝無窮之樂究萬乘之勢不出反掌之易以居泰山之安而欲乘累卵之危走上天之難此愚臣之所以為大王惑也人性有畏其景而惡其迹者卻背而走迹愈多景愈疾不知就陰而止景滅迹絕欲人勿聞莫若勿言欲人勿知莫若勿為欲湯之凔一人炊之百人揚之無益也不如絕薪止火而已不絕之於彼而救之於此譬猶抱薪而救火也養由基楚之善射者也去楊葉百步百發百中楊葉之大加百中焉可謂善射矣然其所止乃百步之內耳比於臣乘未知操弓持矢也福生有基禍生有胎納其基絕其胎禍何自來泰山之霤穿石單極之綆斷幹水非石之鑽索非木之鋸漸靡使之然也夫銖銖而稱之至石必差寸寸而度之至丈必過石稱丈量徑而寡失夫十圍之木始生而蘖足可搔而絕手可擢而㧓據其未生先其未形也礱砥礪不見其損有時而盡種樹畜養不見其益有時而大積德累行不知其善有時而用棄義背理不知其惡有時而亡臣願大王孰計而身行之此百世不易之道也見漢書枚乘傳文選蓺文類聚二十四又說苑正諫篇首作君之外臣乘竊聞云云餘亦小異上書重諫吳王昔者秦西舉胡戎之難北備榆中之關南距羌筰之塞東當六國之從六國乘信陵之藉明蘇秦之約厲荊軻之威并力一心以備秦然秦卒禽六國滅其社稷而并天下是何也則地利不同而民輕重不等也今漢據全秦之地兼六國之眾修戎狄之義而南朝羌筰此其與秦地相什而民相百大王之所明知也今夫讒諛之臣為大王計者不論骨肉之義民之輕重國之大小以為吳禍此臣所以為大王患也夫舉吳兵以訾于漢譬猶蠅蚋之附群牛腐肉之齒利劍鋒接必無事矣天子聞吳率失職諸侯願責先帝之遺約今漢親誅其三公以謝前過是大王之威加于天下而功越於湯武也夫吳有諸侯之位而實富于天子有隱匿之名而居過于中國夫漢并二十四郡十七諸侯方輸錯出軍行數千里不絕于道其珍怪不如東山之府轉粟西鄉陸行不絕水行滿河不如海陵之倉修治上林雜以離宮積聚玩好圈守禽獸不如長洲之苑游曲臺臨上路不如朝夕之池深壁高壘副以關城不如江淮之險此臣之所為大王樂也今大王還兵疾歸尚得十半不然漢知吳之有吞天下之心也赫然加怒遣羽林黃頭循江而下襲大王之都魯東海絕吳之饟道梁王飭車騎習戰射積粟固守以偪滎陽待吳之飢大王雖欲反都亦不得已夫三淮南之計不負其約齊王殺身以滅其跡四國不得出兵其郡趙囚邯鄲此不可掩亦已明矣今大王已去千里之國而制於十里之內矣張韓將北地弓高宿左右兵不得下壁軍不得大息臣竊哀之願大王孰察焉見漢書枚乘傳文選七發楚太子有疾而吳客往問之曰伏聞太子玉體不安亦少閒乎太子曰憊謹謝客客因稱曰今時天下安寍四宇和平太子富于年意者久耽安樂日夜無極邪氣襲逆中若結轖紛屯澹淡噓唏煩酲惕惕怵怵臥不得瞑虛中重聽惡聞人聲精神越渫百病咸生聰明眩曜悅怒不平久執不廢大命乃傾太子豈有是乎太子曰謹謝客賴君之力時時有之然未至于是也客曰今夫貴人之子必宮居而閨處內有保母外有傅父欲交無所飲食則溫淳甘膬脭醲肥厚衣裳則雜遝曼煖燂爍熱暑雖有金石之堅猶將銷鑠而挺解也況其在筋骨之閒乎哉故曰縱耳目之欲恣支體之安者傷血脈之和且夫出輿入輦命曰蹶痿之機洞房清宮命曰寒熱之媒皓齒娥眉命曰伐性之斧甘脆肥膿命曰腐腸之藥今太子膚色靡曼四支委隨筋骨挺解血脤淫濯足墮窳越女侍前齊姬奉後往來游醼縱恣于曲房隱閒之中此甘餐毒藥猛獸之爪牙也所從來者至深遠淹滯永久而不廢雖令扁鵲治內巫咸治外尚何及哉今如太子之病者獨宜世之君子博見強識承閒語事變度易意常無離側以為羽翼淹沈之樂浩唐之心遁佚之志其奚由至哉太子曰諾病已請事此言客曰今太子之病可無藥石針刺灸療而已可以要言妙道說而去也不欲聞之乎太子曰僕願聞之客曰龍門之桐高百尺而無枝中鬱結之輪菌根扶疏以分離上有干仞之峰下臨百丈之谿湍流遡波又澹淡之其根半死半生冬則烈風漂霰飛雪之所激也夏則雷霆霹靂之所感也朝則鸝黃鳱鴠鳴焉暮則羈雌迷鳥宿焉獨鵠晨號乎上鵾雞哀鳴翔乎其下于是背秋涉冬使琴摯斫斬以為琴野繭之絲以為絃孤子鉤以為隱九寡之珥以為約使師堂操畼伯子牙為之歌歌曰麥秀蔪兮雉朝飛向虛壑兮背槁槐依絕區兮臨迴溪飛鳥聞之翕翼而不能去野獸聞之垂目而不能行蚑蟜螻蟻聞之拄喙而不能前此亦天下之至悲也太子能強起聽之乎太子曰僕病未能也客曰犓牛之腴菜以筍蒲肥狗之和冒以山膚楚苗之食安胡之飯摶不解一啜而散于是使伊尹煎熬易牙調和熊蹯之臑勺藥之醬薄耆之炙鮮鯉之鱠秋黃之蘇白露之茹蘭英之酒酌以滌口山梁之餐豢豹之胎小飯大歠如湯沃雪此亦天下之至美也太子能強起嘗之乎太子曰僕病未能也客曰鍾岱之牡齒至之車前似飛鳥後類距虛穱麥服處躁中煩外羈堅轡附易路于是伯樂相其前後王良造父為之御秦缺樓季為之右此兩人者馬佚能止之車覆能起之于是使射千鎰之重爭千里之逐此亦天下之至駿也太子能強起乘之乎太子曰僕病未能也客曰既登景夷之臺南望荊山北望汝海左江右湖其樂無有于是使博辯之士原本山川極命草木比物屬事離辭連類浮遊覽觀乃下置酒于虞懷之宮連廊四注臺城層構紛紜玄綠輦道邪交黃池紆曲溷章白鷺孔鳥鶤鵠鵷雛鵁鶄翠鬣紫纓螭龍德牧邕邕群鳴陽魚騰躍奮翼振鱗漃漻薵蓼蔓草芳苓女桑河柳素葉紫莖苗松豫章條上造天梧桐并閭極望成林眾芳芬鬱亂于五風從容猗靡消息陽陰列坐縱酒蕩樂娛心景春佐酒杜連理音滋味雜陳肴糅錯該練色娛目流聲悅耳于是乃發激楚之結風揚鄭衛之皓樂使先施徵舒陽文段干吳娃閭娵傅予之徒雜裾垂髾目窕心與揄流波雜杜若蒙清塵被蘭澤嬿服而御此亦天下之靡麗皓侈廣博之樂也太子能強起游乎太子曰僕病未能也客曰將為太子馴騏驥之馬駕飛軨之輿乘牡駿之乘右夏服之勁箭左烏號之彫弓游涉乎雲林周馳乎蘭澤弭節乎江潯掩青蘋游清風陶陽氣蕩春心逐狡獸集輕禽于是極犬馬之才困野獸之足窮相御之智巧恐虎豹慴鷙鳥逐馬鳴鑣魚跨麋角履游麕兔蹈踐麖鹿汗流沬墜冤伏陵窘無創而死者固足充後乘矣此校獵之至壯也太子能強起游乎太子曰僕病未能也然陽氣見于眉宇之間侵淫而上幾滿大宅客見太子有悅色遂推而進之曰冥火薄天兵車雷運旍旗偃蹇羽毛肅紛馳騁角逐慕味爭先徼墨廣博觀望之有圻純粹全犧獻之公門太子曰善願復聞之客曰未既于是榛林澤煙雲闇莫兕虎竝作毅武孔猛袒裼身薄白刃磑磑矛戟交錯收獲掌功賞賜金帛掩蘋肆若為牧人席旨酒嘉肴羞炰膾炙以御賓客涌觸竝起動心驚耳誠必不悔㳏絕以諾貞信之色形于金石高歌陳唱萬歲無斁此太子之所喜也能強起而游乎太子曰僕甚願從直恐為諸大夫累耳然而有起色矣客曰將以八月之望與諸侯遠方交游兄弟竝往觀濤乎廣陵之曲江至則未濤之形也徒觀水力之所到則卹然足以駭矣觀其所駕軼者所擢拔者所揚汨者所溫汾者所滌汔者雖有心略辭給固未能縷形其所由然也怳兮忽兮聊兮慄兮混汨汨兮忽兮慌兮俶兮儻兮浩瀇瀁兮慌曠曠兮秉意乎南山通望乎東海虹洞兮蒼天極慮乎崖涘流攬無窮歸神日母汨乘流而下降兮或不知其所止或紛紜其流折兮忽繆往而不來臨朱氾而遠逝兮中虛煩而益怠莫離散而發曙兮內存心而自持于是澡概胸中灑練五藏澹澉手足頮濯髮齒揄棄恬怠輸寫淟濁分決狐疑發皇耳目當是之時雖有淹病滯疾猶將傴起躄發瞽披聾而觀望之也況直眇小煩懣酲醲病酒之徒哉故曰發蒙解惑不足以言也太子曰善然則濤何氣哉客曰不記也然聞于師曰似神而非者三疾雷聞百里江水逆流海水上潮山出內雲日夜不止衍溢漂疾波涌而濤起其始起也洪淋淋焉若白鷺之下翔其少進也浩浩溰溰如素車白馬帷蓋之張其波涌而雲亂擾擾焉如三軍之騰裝其旁作而奔起也飄飄焉如輕車之勒兵六駕蛟龍附從太白純馳浩蜺前後駱驛顒顒卬卬椐椐強強莘莘將將壁壘重堅沓雜似軍行訇隱匈蓋軋盤涌裔原不可當觀其雨傍則滂渤怫鬱闇漠感突上擊下律有似勇壯之卒突怒而無畏蹈壁衝津曲隨隈踰岸出追遇者死當有壞初發乎或圍之津涯荄軫谷分迴翔青篾銜枚檀桓弭節伍子之山通厲𦙃母之場淩赤岸篲扶桑橫奔似雷行誠奮厥武如振如怒沌沌渾渾狀如奔馬混混庉庉聲如雷鼓發怒庢沓清升踰跇侯波奮振合戰于藉藉之口鳥不及飛魚不及迴獸不及走紛紛翼翼波涌雲亂蕩取南山背擊北岸覆虧丘陵平夷西畔險險戲戲崩壞陂池決勝乃罷瀄汨潺湲披揚流灑橫暴之極魚鼈失勢顛倒偃側沋沋湲湲蒲伏連延神物怪疑不可勝言直使人踣焉洄闇悽愴焉此天下怪異詭觀也太子能強起觀之乎太子曰僕病未能也客曰將為太子奏方術之士有資略者若莊周魏牟楊朱墨翟便蜎詹何之倫使之論天下之精微理萬物之是非孔老覽觀孟子持籌而筭之萬不失一此亦天下要言妙道也太子豈欲聞之乎于是太子據几而起曰渙乎若一聽聖人辯士之言涊然汗出霍然病已見文選招隱士桂樹叢生兮山之幽偃蹇連蜷兮枝相繚山氣巃嵸兮石嵯峨谿谷嶄巖兮水曾波猨狖群嘯兮虎豹嗥攀援桂枝兮聊淹留王孫遊兮不歸春草生兮萋萋歲暮不自聊蟪蛄鳴兮啾啾坱兮軋山曲岪心淹留兮恫慌忽罔兮沕憭兮栗虎豹穴叢薄深林兮人上慄嶔岑碕礒兮硱磳磈硊樹輪相糾兮林木茷骫青莎雜樹兮薠草靃靡白鹿台麇麚兮或騰或倚狀兒崟崟兮峨峨淒淒兮漇漇獼猴兮熊羆慕類兮以悲攀援桂枝兮聊淹留虎豹鬭兮羆咆禽獸駭兮亡其曹王孫兮歸來山中兮不可以久留見楚辭文選鶴賦白鳥朱冠鼓翼池干舉脩距而躍躍奮皓翅之翼翼宛脩頸而顧步啄沙磧而相讙豈忘赤霄之上忽池籞而盤桓飲清流不舉食稻粱而未安故知野禽野性未脫籠樊賴吾王之廣愛雖禽鳥兮抱恩方騰驤而鳴舞憑朱檻而為歡見西京雜記上遺公孫弘書夫人無幽顯道在則為尊雖生芻之賤也不能脫落若子故贈君生芻一束詩人所謂生芻一束其人如玉五絲為䌰倍䌰為升倍升為緎倍緎為紀倍紀為緵倍緵為襚此自少之多自微至著也士之立功勳效名節亦復如之勿以小善不足脩而不為也故贈君素絲一襚撲滿者以土為器以蓄錢具其有入竅而無出竅滿則撲之土粗物也錢重貨也入而不出積而不散故撲之士有聚歛而不能散者將有撲滿之敗可不誡歟故贈君撲滿一枚猗嗟盛歟山川阻脩加以風露次卿足下勉作功名竊在下風以俟嘉譽見西京雜記下
