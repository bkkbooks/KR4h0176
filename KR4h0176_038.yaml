body:
  text: 司馬相如子虛賦楚使子虛使于齊齊王悉發境內之士車騎之衆與使者出田田罷子虛過詫有先生而無是公存焉坐定烏有先生問曰今日田樂乎子虛曰樂獲多乎曰少然則何樂對曰僕樂王之欲夸僕以車騎之衆而僕對以雲夢之事也曰可得聞乎子虛曰可王駕車千乘選徒萬騎田于海濱列卒滿澤罘網彌山掩菟轔鹿射麋腳麟騖于鹽浦割鮮染輪射中獲多矜而自功顧謂僕曰楚亦有平原廣澤遊獵之地饒樂若此者乎楚王之獵何與寡人僕下車對曰臣楚國之鄙人也幸得宿衛十有餘年時從出遊遊于後園覽於有無然猶未能遍覩也又惡足以言其外澤乎齊王曰雖然略以子之所聞見言之僕對曰唯唯臣聞楚有七澤嘗見其一未覩其餘也臣之所見蓋特其小小者耳名曰雲夢雲夢者方九百里其中有山焉其山則盤紆岪鬱隆崇律崒岑崟參差日月蔽虧交錯糾紛上干青雲罷池陂陀下屬江河其土則丹青赭堊雌黃白附錫碧金銀衆色炫耀照爛龍鱗其石則赤玉玫瑰琳珉昆吾瑊𤨕玄厲碝石碔砆其東則有蕙圃衡蘭芷若射干𦲄藭菖蒲茳蘺蘪蕪諸柘猼且其南則有平原廣澤登降陀靡案衍壇曼緣以大江限以巫山其高燥則生葴析苞荔薜莎青薠其埤溼則生藏莨蒹葭東牆雕胡蓮藕菰蘆菴閭軒芋衆物居之不可勝圖其西則有湧泉清池激水推移外發芙蓉菱華內隱巨石白沙其中則有神龜蛟鼉玳瑁鱉黿其北則有陰林巨樹楩楠豫章桂椒木蘭檗離朱楊樝梨梬栗橘柚芬芳其上則有赤猿蠗蝚鵷雛孔鸞騰遠射干其下則有白虎玄豹蟃蜒貙犴兕象野犀窮奇獌狿于是乎乃使專諸之倫手格此獸楚王乃駕馴駮之駟乘雕玉之輿靡魚須之橈旃曳明月之珠旗建干將之雄戟左烏號之雕弓右夏服之徑箭陽子驂乘孅阿為御案節未舒即陵狡獸轔蛩蛩蹴距虛軼野馬而轉陶駼乘遺風而射遊騏倏胂淒浰雷動熛至星流電擊弓不虛發中必決眥洞胸達掖絶乎心繫獲若雨獸掩草蔽地于是楚王乃弭節徘徊翱翔容與覽乎陰林觀壯士之暴怒與猛獸之恐懼徼𠙆受詘殫覩衆物之變態于是鄭女曼姬被阿錫揄紵縞雜纖羅垂霧縠襞積褰皺紆徐委曲鬱橈溪谷衯衯裶裶揚袘恤削蜚襳垂髾扶輿猗靡翕呷萃蔡下摩蘭蕙上拂羽蓋錯翡翠之葳蕤繆繞玉綏縹乎忽忽若神之仿佛于是乃群相與獠于蕙圃媻姍勃窣上金隄掩翡翠射鵔鸃微矰出孅繳施弋白鵠連鴐鵝雙鶬下玄鶴加怠而後發遊于清池浮文鷁揚旌枻張翠帷建羽蓋罔玳瑁釣紫貝摐金鼓吹鳴籟榜人歌聲流喝水蟲駭波鴻沸湧泉起奔揚會礧石相擊硠硠礚礚若雷霆之聲聞乎數百里之外將息獠者擊靈鼓起烽燧車案行騎就隊纚乎淫淫般乎裔裔於是楚王乃登陽雲之臺泊乎無為淡乎自持勺藥之和具而後御之不若大王終日馳騁曾不下輿脟割輪焠自以為娛臣竊觀之齊殆不如于是齊王默然無以應僕也烏有先生曰是何言之過也足下不遠千里來況齊國王悉境內之士備車騎之衆與出田乃欲戮力致獲以娛左右也何名為夸哉問楚地之有無者願聞大國之風烈先生之餘論也今足下不稱楚王之德厚而盛推雲夢以為高奢言淫樂而顯侈靡竊為足下不取也必若所言固非楚國之美也有而言之是章君之惡無而言之是害足下之信也章君惡傷私義二者無一可而先生行之必且輕于齊而纍于楚矣且齊東有巨海南有琅邪觀乎成山射乎之罘浮渤澥遊孟諸邪與肅慎為鄰右以湯谷為界秋田乎青丘仿偟乎海外吞若雲夢者八九其于胸中曾不蒂芥若乃俶儻瑰瑋異方殊類珍怪鳥獸萬端鱗崒充仞其中者不可勝記禹不能名契不能計然在諸侯之位不敢言遊戲之樂苑囿之大先生又見客是以王辭不復何為無以應哉無是公聽然而笑曰楚則失矣而齊亦未為得也夫使諸侯納貢者非為財幣所以述職也封強畫界者非為守禦所以禁淫也今齊列為東潘而外私肅慎捐國踰限越海而田其於義固未可也且二君之論不務明君臣之義正諸侯之禮徒事爭于遊戲之樂苑囿之大欲以奢侈相勝荒淫相越此不可以揚名發譽而適足以貶君自損也且夫齊楚之事又焉足道邪君未覩夫巨麗也獨不聞天子之上林乎左蒼梧右西極丹水更其南紫淵徑其北終始灞滻出入涇渭酆鎬潦潏紆餘委蛇經營乎其內蕩蕩兮八川分流相背而異態東西南北馳騖往來出乎椒丘之闕行乎洲淤之浦徑乎桂林之中過乎泱漭之野汩乎混流順阿而下赴隘陝之口觸穹石激堆崎沸乎暴怒洶涌滂沸滭浡滵汩逼側泌瀄橫流逆折轉騰潎洌澎濞沆瀣穹隆雲橈蜿灗膠盩踰波趨浥涖涖下瀨批巖衝壅奔揚滯沛臨坻注壑瀺灂霣墜湛湛隱隱砰磅訇礚潏潏淈淈湁潗鼎沸馳波跳沫汩潝漂疾悠遠長懷寂漻無聲肆乎永歸然後灝溔潢漾安翔徐回翯乎滈滈東注大湖衍溢陂池于是蛟龍赤螭𩶶螹離鰅鱅鱋魶禺禺魼鰨揵鰭掉尾振鱗奮翼潛處乎深巖魚鱉歡聲萬物衆夥明月珠子玓瓅江靡蜀石黃碝水玉磊砢磷磷爛爛采色澔汗藂積乎其中鴻鵠鷫鴇鴐鵝鸀鳿鵁鶄目煩鶩鷛𪆫䳄鵁鸕群浮乎其上泛淫泛濫隨風淡淡與波搖蕩奄薄草渚唼喋菁藻咀嚼菱藕于是乎崇山巃嵸崔巍嵯峨深林巨木嶄巖參差九嵕巀嶭南山峨峨巖陀阤甗錡摧崣崛崎振溪通谷蹇産溝瀆谽呀豁閜阜陵別塢崴磈嵔瘣丘虛堀礨隱轔鬱礧登降施靡陂池貏豸沇溶淫鬻散渙夷陸亭皋千里靡不被築掩以緑蕙被以江蘺糅以蘪蕪雜以留夷敷結縷攢戾莎揭車衡蘭稿本射干茈薑蘘荷葴橙若蓀鮮支黃礫蔣苧青薠布濩閎澤延曼太原離靡廣衍應風披靡吐芳揚烈郁郁斐斐衆香發越肸蠁布寫暗薆咇勃于是乎周覽泛觀縝盻軋芴芒芒恍忽視之無端察之無崖日出東沼入于西陂其南則隆冬生長涌水躍波獸則𤛑旄獏犛沈牛麈麋赤首圜題窮奇象犀其北則盛夏含凍裂地涉冰揭河其獸則麒麟角𧤗騊駼橐駝蛩蛩驒騱駃騠驢騾于是乎離宮別館彌山跨谷高廊四注重坐曲閣華榱璧璫輦道纚屬步櫩周流長途中宿夷嵕築堂纍臺增成巖窔洞房俯杳眇而無見仰攀橑而捫天奔星更于閨闥宛虹拖于楯軒青龍蚴蟉於東葙象輿婉蟬于西清靈圄燕于間館偓佺之倫暴于南榮醴泉涌于清室通川過于中庭磐石捱崖嶔巖倚傾嵯峨㠍嶪刻削崢嶸玫瑰碧琳珊瑚叢生珉玉旁唐璸斒文鱗赤瑕駮犖雜臿其間鼂采琬琰和氏出焉于是乎盧橘夏熟黃甘橙楱枇杷橪柿亭奈厚朴梬棗楊梅櫻桃蒲陶隱夫薁棣榙遝荔支羅乎後宮列乎北園貤丘陵下平原揚翠葉扤紫莖發紅華垂朱榮煌煌扈扈照曜巨野沙棠櫟櫧華汜枰櫨留落胥餘仁頻并閭欃檀木蘭豫章女貞長千仞大連抱夸條直暢實葉葰楙攢立叢倚連卷欐佹崔錯癹骫坑衡閜砢垂條扶疏落英幡纚紛溶萷蔘猗旎從風藰蒞卉歙蓋象金石之聲管籥之音偨池茈虒旋還乎後宮雜遝絫輯被山緣谷循阪下隰視之無端究之亡窮于是乎玄猿素雌蜼玃飛蛭蜩蠼猱獑胡豰蛫棲息乎其間長嘯哀鳴翩幡互經夭蟜枝格偃蹇杪顛于是乎隃絶梁騰殊榛捷垂條踔希間牢落陸離爛漫遠遷若此輩者數百千處嬉遊往來宮宿館舍庖廚不徙後宮不移百官備具于是乎背秋涉冬天子校獵乘鏤象六玉虯拖霓旌靡雲旗前皮軒後道遊孫叔奉轡衛公參乘扈從橫行出乎四校之中鼓嚴簿縱獵者河江為阹泰山為櫓車騎雷起殷天動地先後陸離離散別追淫淫裔裔緣陵流澤雲布雨施生貔豹搏豺狼手熊羆足羊蒙鶡蘇褲白虎被班文跨馬淩三嵕之危下磧歷之坻徑峻赴險越壑厲水椎蜚廉弄獬豸格蝦蛤鋌猛氏羂騕裊射封豕箭不苟害解脰陷腦弓不虛發應聲而倒于是乘輿弭節徘徊翱翔往來睨部曲之進退覽將帥之變態然後侵潭促節倏敻遠去流離輕禽蹴履狡獸䡺白鹿捷狡兔軼赤電遺光耀追怪物出宇宙彎蕃弱滿白羽射遊梟櫟蜚虡擇肉而后發先中而命處弦矢分藝殪仆然后揚節而上浮淩驚風歷駭猋乘虛無與神俱躪玄鶴亂昆雞遒孔鸞促鵕鸃拂翳鳥捎鳳凰捷鵷雛掩焦明道盡途殫回車而還消搖乎襄羊降集乎北紘率乎直指腌乎反鄉蹶石闕歷封巒過䧴鵲望露寒下堂梨息宜春西馳宣曲濯鷁牛首登龍臺掩細柳觀士大夫之勤略均獵者之所得獲徒車之所轥轢騎之所蹂若人之所蹈藉與其窮極倦𠙆驚憚讋伏不被創刃而死者他他籍籍填坑滿谷掩平彌澤于是乎遊戲懈怠置酒乎皓天之臺張樂乎轇葛之宇撞千石之鍾立萬石之虡建翠華之旗樹靈鼉之鼓奏陶唐氏之舞聽葛天氏之歌千人倡萬人和山陵為之震動川谷為之蕩波巴渝宋蔡淮南干遮文成顛歌族居遞奏金鼓迭起鏗鎗闛鞈洞心駭耳荊吳鄭衛之聲韶濩武象之樂陰淫案衍之音鄢郢繽紛繳楚結風俳優侏儒狄鞮之倡所以娛耳目樂心意者麗靡爛漫于前靡曼美色於後若夫青琴虙妃之徒絶殊離俗妖冶間都靚莊刻飾便嬛綽約柔橈嬽嬽嫵媢孅弱曳獨繭之褕袣眇閻易以恤削便姍嫳屑與世殊服芬芳漚鬱酷烈淑郁皓齒粲爛宜笑的皪長眉連娟微睇綿藐色授魂豫心愈於側于是酒中樂酣天子芒然而思似若有亡曰嗟乎此大奢侈朕以覽聽餘間無事棄日順天道以殺伐時休息於此恐後世靡麗遂往而不返非所以為繼嗣創業垂統也于是乎乃解酒罷獵而命有司曰地可墾闢悉為農郊以贍氓隸隤牆填塹使山澤之民得至焉實陂池而勿禁虛宮館而勿仞發倉廩以救貧窮補不足恤鰥寡存孤獨出德號省刑罰改制度易服色革正朔與天下為始于是歷吉日以齋戒襲朝服乘法駕建華旗鳴玉鸞遊于六藝之囿騖乎仁義之塗覽觀春秋之林射貍首兼騶虞弋玄鶴舞干戚載雲罕掩群雅悲伐檀樂樂胥修容乎禮園翱翔乎書圃述易道放怪獸登明堂坐清廟恣群臣奏得失四海之內靡不受獲于斯之時天下大説鄉風而聽隨流而化卉然興道而遷義刑錯而不用德隆于三皇功羡于五帝若此故獵乃可喜也若夫終日暴露馳騁勞神苦形罷車馬之用抏士卒之精費府庫之財而無德厚之恩務在獨樂不顧衆庶忘國家之政貪雉免之獲則仁者不繇也從此觀之齊楚之事豈不哀哉地方不過千里而囿居九百是草木不得墾辟而人無所食也夫以諸侯之細而樂萬乘之所侈僕恐百姓被其尤也于是二子愀然改容起若自失逡巡避席曰鄙人固陋不知忌諱乃今日見教謹受命矣見史記本傳漢書本傳文選藝文類聚六十六哀秦二世賦登陂陀之長阪兮坌入曾宮之嵯峨臨曲江之隑州兮望南山之參差巖巖深山之谾谾兮通谷𧯆乎谽𧯑汩淢吸習以永逝兮注平皋之廣衍觀衆樹之蓊薆兮覽竹林之榛榛東馳土山兮北揭石瀨弭節容與兮歷弔二世持身不謹兮亡國失勢信讒不寤兮宗廟滅絶嗚乎操行之不得兮墳墓蕪穢而不修兮魂亡歸而不食敻邈絶而不齊兮彌久遠而愈佅精罔聞而飛楊兮拾九天而永逝嗚呼哀哉見史記本傳漢書本傳藝文類聚四十大人賦相如拜為孝文園令見上好仙乃遂奏大人賦其辭曰世有大人兮在乎中州宅彌萬里兮曾不足以少留悲世俗之迫隘兮朅輕舉而遠遊乘絳幡之素霓兮載雲氣而上浮建格澤之修竿兮總光耀之采旄垂旬始以為幓兮曳彗星而為髾掉指橋以偃寋兮又猗抳以招搖攬攙搶以為旌兮靡屈虹而為綢紅杳眇以玄湣兮猋風湧而雲浮駕應龍象輿之蠖略委麗兮驂赤螭青虯之蚴蟉宛蜒低卬夭蟜裾以驕驁兮詘折隆窮躩以連卷沛艾赳螑仡以佁擬兮放散畔岸驤以孱顏跮踱輵螛容以骫麗兮蜩蟉偃寋怵㲋以梁倚糾蓼叫奡踏以朡路兮薎蒙踊躍騰而狂趭蒞颯卉歙焱至電過兮煥然霧除霍然雲消邪絶少陽而登太陰兮與真人乎相求互折窈窕以右轉兮橫厲飛泉以正東悉徵靈圉而選之兮部署衆神於搖光使五帝先導兮反大一而從陵陽左玄冥而右黔雷兮前長離而後矞皇廝征伯僑而役羡門兮詔岐伯使尚方祝融警而蹕御兮清氣氛而后行屯余車而萬乘兮綷雲蓋而樹華旗使句芒其將行兮吾欲往乎南娭歷唐堯於崇山兮過虞舜於九疑紛湛湛其差錯兮雜遝膠輵以方馳騷擾衝蓯其紛拿兮滂濞泱軋麗以林離攢羅列聚叢以蘢茸兮衍曼流爛痑以陸離徑入雷室之砰磷鬱律兮洞出鬼谷之堀礨崴魁遍覽八紘而觀四海兮朅度九江越五河經營炎火而浮弱水兮杭絶浮渚涉流沙奄息蔥極泛濫水娭兮使靈媧鼓琴而舞馮夷時若曖曖將混濁兮召屏翳誅風伯刑雨師西望崑崙之軋沕荒忽兮直徑馳乎三危排閶闔而入帝宮兮載玉女而與之歸登閬風而遙集兮亢鳥騰而一止低徊陰山翔以紆曲兮吾乃今日覩西王母皓然白首戴勝而穴處兮亦幸有三足烏為之使必長生若此而不死兮雖濟萬世不足以喜回車朅來兮絶道不周會食幽都呼吸沆瀣兮餐朝霞咀噍芝英兮嘰瓊華僸祲尋而高縱兮紛鴻溶而上厲貫列缺之倒景兮涉豐隆之滂濞騁遊道而修降兮騖遺霧而遠逝迫區中之隘陜兮舒節出乎北垠遺屯騎於玄闕兮軼先驅于寒門下崢嶸而無地兮上嵺廓而無天視眩泯而亡見兮聽敞恍而亡聞乘虛亡而上遐兮超無友而獨存見漢書本傳藝文類聚七十八
