body:
  text: 唐蒙上書請通夜郎南越王黃屋左纛地東西萬餘里名為外臣實一州主也今以長沙豫章往水道多絶難行竊聞夜郎所有精兵可得十萬浮船牂柯出其不意此制越一奇也誠以漢之強巴蜀之饒通夜郎道為置吏甚易見史記西南夷傳又見漢書西南夷傳具言西域地形大宛在胸奴西南在漢正西去漢可萬里其俗土著耕田田稻麥有蒲陶酒多善馬馬汗血其先天馬子也有城郭屋室其屬邑大小七十餘城衆可數十餘萬其兵弓矛騎射其北則康居西則大月氏西南則大夏東北則烏孫東則扜罙于填于填之西則水皆西流注西海其東水東流注鹽澤鹽澤潛行地下其南則河源出焉多玉石河注中國而樓蘭姑師邑有城郭臨鹽澤鹽澤去長安可五千里胸奴右方居鹽澤以東至隴西長城南接羌鬲漢道焉見史記大宛傳騫使西域還具為天子言之言通大夏宜從蜀臣在大夏時見邛竹杖蜀布問曰安得此大夏國人曰吾賈人往市之身毒身毒在大夏東南可數千里其俗土著大與大夏同而卑溼暑熱云其人民乘象以戰其國臨大水焉以騫度之大夏去漢萬二千里居漢西南今身毒國又居大夏東南數千里有蜀物此其去蜀不遠矣今使大夏從羌中險羌人惡之少北則為胸奴所得從蜀宜徑又無寇見史記大宛傳又見漢書張騫傳請招烏孫居渾邪故地臣居胸奴中聞烏孫王號昆莫昆莫父難兜靡本與大月氏俱在祁連敦煌間小國也大月氏攻殺難兜靡奪其地人民亡走胸奴子昆莫新生傅父布就翎侯抱亡置草中為求食還見狼乳之又烏銜肉翔其旁以為神遂持歸胸奴單于愛養之及壯以其父民衆與昆莫使將兵數有功時月氏已為胸奴所破西擊塞王塞王南走遠徙月氏居其地昆莫既健自請單于報父怨遂西攻破大月氏大月氏復西走徙大夏地昆莫略其衆因留居兵稍強會單于死不肯復朝事胸奴胸奴遣兵擊之不勝益以為神而遠之今單于新困於漢而昆莫地空蠻夷戀故地又貪漢物誠以此時厚賂烏孫招以東居故地漢遣公主為夫人結昆弟其勢宜聽則是斷胸奴右臂也既連烏孫自其西大夏之屬皆可招來而為外臣見漢書張騫傳諭指烏孫烏孫能東居渾邪地則漢遣翁主為昆莫夫人見史記大宛傳明堂議聖人之教制作之象所以法天地比類陰陽以成宮室本之太古以昭令德茅屋采椽土皆素輿越席皮辨蓋輿黃帝堯舜之世是以三代修之也見三輔黃圖漢明堂在長安西南七里孝武議立明堂于長安城南許裒等議又見初學記十三祠后士議天地牲角繭栗今陛下親祠后土后土宜於澤中圓丘為五壇壇一黃犢太牢具已祠盡瘞而從祠衣上黃見史記封禪書議立太畤壇神靈之休祐福兆祥宜因此地光域立太畤壇以明應令太祝領秋及臘間祠三歲天子一郊見見史記封禪書漢書郊祀志上論六家要指易大傳曰天下一致而百慮同歸而殊塗夫陰陽儒墨名法道德此務為治者也直所從言之異路有省不省耳嘗竊觀陰陽之術大詳而衆忌諱使人拘而多畏然其敘四時之大順不可失也儒者博而寡要勞而少功是以其事難盡從然其敘君臣父子之禮列夫婦長幼之別不可易也墨者儉而難遵是以其事不可遍循然其強本節用不可廢也法家嚴而少恩然其正君臣上下之分不可改也名家使人儉而善失真然其正名實不可不察也道家使人精神專一動合無形淡足萬物其為術也因陰陽之大順采儒墨之善撮名法之要與時遷徙應物變化立俗施事無所不宜指約而易操事少而功多儒者則不然以為人主天下之儀表也君唱臣和主先臣隨如此則主勞而臣佚至於大道之要去健羡黜聰明釋此而任術夫神大用則竭形大勞則敝神形蚤衰欲與天地長久非所聞也夫陰陽四時八位十二度二十四節各有教令曰順之者昌逆之者亡未必然也故曰使人拘而多畏夫春生夏長秋收冬臧此天道之大經也弗順則無以為天下紀綱故曰四時之大順不可失也夫儒者以六藝為法六藝經傳以千萬數纍世不能通其學當年不能究其禮故曰博而寡要勞而少功若夫列君臣父子之禮序夫婦長幼之別雖百家弗能易也墨者亦上堯舜言其德行曰堂高三尺土階三等茅茨不翦採椽不斫飯土簋啜土刑糲粱之食藜藿之羹夏日葛衣冬日鹿裘其送死桐棺三寸舉音不盡其哀教喪禮必以此為萬民率故天下共若此則尊卑無別也夫世異時移事業不必同故曰儉而難遵也要曰強本節用則人給家足之道也此墨子之所長雖百家不能廢也法家不別親疏不殊貴賤一斷于法則親親尊尊之恩絶矣可以行一時之計而不可長用也故曰嚴而少恩若尊主卑臣明分職不得相踰越雖百家不能改也名家苛察繳繞使人不得反其意剸決于名時失人情故曰使人儉而善失真若夫控名責實參伍不失此不可不察也道家無為又曰無不為其實易行其辭難知其術以虛無為本以因循為用無成勢無常形故能究萬物之情不為物先後故能為萬物主有法無法因時為業有度無度因物興舍故曰聖人不巧時變是守虛者道之常也因者君之綱也群臣並至使各自明也其實中其聲者謂之端實不中其聲者謂之款款言不聽姦乃不生賢不肖自分白黑乃形在所欲用耳何事不成乃合大道混混冥冥光耀天下復反無名凡人所生者神也所託者形也神大用則竭形大勞則敝形神離則死死者不可復生離者不可復合故聖人重之繇此觀之神者生之本形者生之具不先定其神形而曰我有以治天下何繇哉見漢書司馬遷傳悲士不遇賦悲夫士生之不辰愧顧影而獨存恆克己而復禮懼志行之無聞諒才韙而世戾將逮死而長勤雖有形而不彰徒有能而不陳何窮達之易惑信美惡之難分時悠悠而蕩蕩將遂屈而不伸便公于公者彼我同兮私于私者自相悲兮天道微哉吁嗟闊兮人理顯然相傾奪兮好生惡死才之鄙也好貴夷賤哲之亂也照照洞達胸中豁也昏昏罔覺內生毒也我之心矣哲已能忖我之言矣哲已能選沒世無聞古人惟恥朝間夕死孰云其否逆順還周乍沒乍起理不可據智不可恃無造福先無觸禍始委之自然終歸一矣見藝文類聚三十報任少卿書太史公牛馬走司馬遷再拜言卿少卿足下曩者辱賜書教以慎于接物推賢進士為務意氣勤勤懇懇若望僕不相師而用流俗人之言僕非敢如此也雖罷駑亦嘗側聞長者遺風矣顧自以為身殘處穢動而見尤欲益反損是以抑鬱而誰與語諺曰誰為為之孰令聽之蓋鍾子期死伯牙終身不復鼓琴何則士為知己者用女為説己容若僕大質已虧缺雖材懷隨和行若由夷終不可以為榮適足以發笑而自點耳書辭宜答會東從上來又迫賤事相見日淺卒卒無須臾之間得竭至意今少卿抱不測之罪涉旬月迫季冬僕又薄從上雍恐卒然不可諱是僕終已不得舒憤悶以曉左右則長逝者魂魄私恨無窮請略陳固陋闕然久不報幸勿過僕聞之修身者智之符也愛施者仁之端也取與者義之表也恥辱者勇之決也立名者行之極也士有此五者然後可以託於世列於君子之林矣故禍莫憯于欲利悲莫痛于傷心行莫醜于辱先詬莫大于宮刑刑餘之人無所比數非一世也所從來遠矣昔衛靈公與雍渠同載孔子適陳商鞅因景監見趙良寒心同子參乘袁絲變色自古而恥之夫以中材之人事有關于宦豎莫不傷氣況于慷慨之士乎如今朝雖乏人奈何令刀鋸之餘薦天下豪俊哉僕賴先人緒業得待罪輦轂下二十餘年矣所以自惟上之不能納忠效信有奇策才力之譽自結明主次之又不能拾遺補闕招賢進能顯巖穴之士外之又不能備行伍攻城野戰有斬將搴旗之功下之不能積日纍勞取尊官厚祿以為宗族交遊光寵四者無一遂苟合取容無所短長之效可見如此矣嚮者僕常廁下大夫之列陪外廷末議不以此時引綱維盡思慮今以虧形為掃除之隸在闒茸之中乃欲卬首伸眉論列是非不亦輕朝廷羞當世之士邪嗟乎嗟乎如僕尚何言哉尚何言哉且事本末未易明也僕少負不羈之行長無鄉曲之譽主上幸以先人之故使得奉薄伎出入周衛之中僕以為戴盆何以望天故絶賓客之知忘室家之業日夜思竭其不肖之才力務一心營職以求親媚于主上而事乃有大謬不然者夫僕與李陵俱居門下素非相善也趣舍異路未嘗銜杯酒接殷勤之歡然僕觀其為人自奇士事親孝與士信臨財廉取與義分別有讓恭儉下人常思奮不顧身以徇國家之急其素所畜積也僕以為有國士之風夫人臣出萬死不顧一生之計赴公家之難斯已奇矣今舉事一不當而全軀保妻子之臣隨而媒孽其短僕誠私心痛之且李陵提步卒不滿五千深踐戎馬之地足歷王庭垂餌虎口橫挑強胡仰億萬之師與單于連戰十有餘日所殺過半當虜救死扶傷不給旃裘之君長咸震怖乃悉徵其左右賢王舉引弓之人一國共攻而圍之轉鬭千里矢盡道窮救兵不至士卒死傷如積然李陵一呼勞軍士無不起躬自流涕沫血飲泣張空拳冒白刃北嚮爭死敵陵未沒時使有來報漢公卿王侯皆奉觴上壽後數日陵敗書聞主上為之食不甘味聽朝不怡大臣憂懼不知所出僕竊不自料其卑賤見主上慘悽怛悼誠欲效其款款之愚以為李陵素與士大夫絶甘分少能得人之死力雖古名將不能過也身雖陷敗彼觀其意且欲得其當而報于漢事已無可奈何其所摧敗功亦足以暴于天下矣僕懷欲陳之而未有路適會召問即以此指推言陵之功欲以廣主上之意塞睚眥之辭未能盡明明主不深曉以為僕沮二師而為李陵遊説遂下于理拳拳之忠終不能自列因為誣上卒從吏議家貧財賂不足以自贖交遊莫救左右親近不為一言身非木石獨與法吏為伍深幽囹圄之中誰可告訴者此真少卿所親見僕行事豈不然邪李陵既生降隤其家聲而僕又佴之蠶室重為天下觀笑悲夫悲夫事未易一二為俗人言也僕之先非有剖符丹書之功文史星曆近乎卜祝之間固主上所戲弄倡優畜流俗之所輕也假令僕伏法受誅若九牛亡一毛與螻蟻何以異而世又不與能死節者特以為智窮罪極不能自免卒就死耳何也素所自樹立使然也人固有一死死有重于太山或輕于鴻毛用之所趨異也太上不辱先其次不辱身其次不辱理色其次不辱辭令其次詘體受辱其次易服受辱其次關木索被箠楚受辱其次剔毛髮嬰金鐵受辱其次毀肌膚斷肢體受辱最下腐刑極矣傳曰刑不上大夫此言士節不可不勉勵也猛虎在深山百獸震恐及在穽檻之中搖尾而求食積威約之漸也故有畫地為牢勢不可入削木為吏議不可對定計于鮮也今交手足受木索暴肌膚受榜箠幽于圜牆之中當此之時見獄吏則頭槍地視徒隸則心惕息何者積威約之勢也及以至是言不辱者所謂強顏耳曷足貴乎且西伯伯也拘于羑里李斯相也具于五刑淮陰王也受械于陳彭越張敖南鄉稱孤繫獄抵罪絳侯誅諸呂權傾五伯囚於請室魏其大將也衣赭衣關三木季布為朱家鉗奴灌夫受辱于居室此人皆身至王侯將相聲聞鄰國及罪至罔加不能引決自裁在塵埃之中古今一體安在其不辱也由此言之勇怯勢也強弱形也審矣何足怪乎夫人不能早自裁繩墨之外以稍陵夷遲至於鞭箠之間乃欲引節斯不亦遠乎古人所以重施刑于大夫者殆為此也夫人情莫不貪生惡死念父母顧妻子至激于義理者不然乃有不得已也今僕不幸早失父母無兄弟之親獨身孤立少卿視僕于妻子何如哉且勇者不必死節怯夫慕義何處不免焉僕雖怯懦欲苟活亦頗識去就之分矣何至自沈溺嫘紲之辱哉且夫臧獲婢妾由能引決況若僕之不得已乎所以隱忍苟活于糞土之中而不辭者恨私心有所不盡鄙陋沒世而文彩不表於後也古者富貴而名摩滅不可勝記唯倜儻非常之人稱焉蓋文王拘而演周易仲尼厄而作春秋屈原放逐乃賦離騷左丘失明厥有國語孫子臏腳兵法修列不韋遷蜀世傳呂覽韓非囚秦説難孤憤詩三百篇大氐賢聖發憤之所為作也此人皆意有所鬱結不得通其道故述往事思來者及如左丘明無目孫子斷足終不可用退而論書策以舒其憤思垂空文以自見僕竊不遜近自託子無能之辭網羅天下放失舊聞略考其行事綜其終始稽其成敗興壞之紀上計軒轅下至于茲為十表本紀十二書八章世家三十列傳七十凡百三十篇亦欲以究天人之際通古今之變成一家之言草創未就會遭此禍惜其不成已就極刑而無慍色僕誠以著此書藏諸名山傳之其人通邑大都則僕償前辱之責雖萬被戮豈有悔哉然此可為智者道難為俗人言也且負下未易居下流多謗議僕以口語遇遭此禍重為鄉黨所笑以汙辱先人亦何面目復上父母丘墓乎雖纍百世垢彌甚耳是以腸一日而九回居則忽忽若有所亡出則不知其所往每念斯恥汗未嘗不發背沾衣也身直為閨閣之臣寧得自引深臧於巖穴邪故且從俗浮沈與時俯仰以通其狂惑今少卿乃教以推賢進士無乃與僕私心刺謬乎今雖欲自雕瑑曼辭以自飾無益于俗不信適足取辱耳要之死日然後是非乃定書不能悉意略陳固陋謹再拜見漢書本傳文選案本傳有刪節與摯伯陵書遷聞君子所貴乎道者三太上立德其次立功其次立言伏惟伯陵材能絶人高尚其志以善厥身冰清玉潔不以細行荷纍其名固已貴矣然未盡太上之所繇也願先生少致意焉見高士傳素王妙論計然者葵邱濮上人其先晉國公子也姓辛氏字文嘗南遊越范蠡師事之見御覽四百四諸稱富者非貴其身得志也乃貴恩覆子孫而澤及鄉里也黃帝設五法布之天下用之無窮蓋世有能知者莫不尊親如范子可謂曉之矣子貢呂不韋之徒頗預焉自是已後無其人曠絶三百有餘年管子設輕重九府行伊尹之術則桓公以霸九合諸侯一匡天下范蠡為越相三江五湖之間民富國強卒以擒吳功成而弗居變名易姓之陶自謂朱公行十術之計二十一年之間三致千萬再散與貧見御覽四百七十二困學紀聞二十報司馬子長書峻聞古之君子料能而行度德而處故悔吝去于身利不可以虛受名不可以苟得漢興以來帝王之道于斯始顯能者見利不肖者自屏亦其時也周易大君有命小人勿用徒欲偃仰從容以送餘齒耳見高士傳有能者見鋒穎之秋豪見文選潘嶽為賈長淵作贈陸機詩注案吳都賦注作有能見鋒穎之狀上武帝書言世務臣聞天下之患在于土崩不在瓦解古今一也何謂土崩秦之末世是也陳涉無千乘之尊尺土之地身非王公大人名族之後無鄉曲之譽非有孔墨曾子之賢陶朱猗頓之富也然起窮巷奮棘矜偏袒大呼而天下從風此其故何也由民困而主不恤下怨而上不知俗已亂而政不修此三者陳涉之所以為資也是之謂土崩故曰天下之患在土崩何謂瓦解吳楚齊趙之兵是也七國謀為大逆號皆稱萬乘之君帶甲數十萬威足以嚴其境內財足以勸其士民然不能西攘尺寸之地而身為禽于中原者此其故何也非權輕于匹夫而兵弱于陳涉也當是之時先帝之德澤未衰而安土樂俗之民衆故諸侯無竟外之助此之謂瓦解故曰天下之患不在瓦解由此觀之天下誠有土崩之勢雖布衣窮處之士或首惡而危海內陳涉是也況三晉之君或存乎天下雖未有大治也誠能無土崩之勢雖有強國徑兵不得還踵而身為禽矣吳楚齊趙是也況群臣百姓能為亂乎此二體者安危之明要也賢主之所留意而深察也間者關東五穀不登年歲未復民多窮困重之以邊境之事推數循理而觀之民且有不安其處者矣不安故易動易動者土崩之勢也故賢主獨觀萬化之原明於安危之機修之廟堂之上而銷未形之患其要期使天下無土崩之勢而已矣故雖有強國徑兵陛下逐走獸射蜚鳥弘遊燕之囿淫從恣之觀極馳騁之樂自若也金石絲竹之聲不絶於耳帷帳之私俳優侏儒之笑不乏于前而天下無宿憂名何必湯武俗何必成康雖然臣竊以為陛下天然之聖寬仁之資而誠以天下為務則湯武之名不難侔而成康之俗可復興也此二體者立然後處尊安之實揚廣譽于當世親天下而服四夷餘恩遺德為數世隆南面背扆攝袂而揖王公此陛下之所服也臣聞圖王不成其敝足以安安則陛下何求而不得何為而不成奚征而不服哉見史記主父偃傳漢書徐樂傳
