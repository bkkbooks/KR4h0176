body:
  text: 嚴安上書言世務臣聞鄒子曰政教文質者所以云救也當時則用過則舍之有易則易之故守一而不變者未睹治之至也今天下人民用財侈靡車馬衣裘宮室皆競修飾調五聲使有節族雜五色使有文章重五味方丈於前以觀欲天下彼民之情見美則願之是教民以侈也侈而無節則不可贍民離本而徼末矣末不可徒得故搢紳者不憚為詐帶劍者夸殺人以矯奪而世不知愧故姦軌浸長夫佳麗珍怪固順于耳目故養失而泰樂失而淫禮失而采教失而僞僞采淫泰非所以範民之道也是以天下人民逐利無已犯法者衆臣願為民制度以防其淫使貧富不相耀以和其心心既和平其性恬安恬安不營則盜賊銷盜賊銷則刑罰少刑罰少則陰陽和四時正風雨時草木畼茂五穀蕃孰六畜遂字民不夭厲和之至也臣聞周有天下其治三百餘歲成康其隆也刑錯四十餘年而不用及其衰亦三百餘年故五伯更起伯者常佐天子興利除害誅暴禁邪匡正海內以尊天子五伯既沒賢聖莫續天子孤弱號令不行諸侯恣行彊陵弱衆暴寡田常篡齊六卿分晉竝為戰國此民之始苦也于是彊國務攻弱國修守合從連衡馳車擊轂介胄生蟣蝨民無所告訴及至秦王蠶食天下并吞戰國稱號皇帝一海內之政壞諸侯之城銷其兵鑄以為鍾虡示不復用元元黎民得免于戰國逢明天子人人自以為更生鄉使秦綬刑罰薄賦斂省徭役貴仁義賤權利上篤厚下佞巧變風易俗化于海內則世世必安矣秦不行是風循其故俗為知巧權利者進篤厚忠正者退法嚴令苛讇諛者衆日聞其美意廣心逸欲威海外使蒙恬將兵以北攻彊胡辟地進境戍於北河飛芻挽粟以隨其後又使尉他屠睢將樓般之士攻越使監祿鑿渠運糧深入越地越人遁逃曠日持久糧食乏絶越人擊之秦兵大敗秦乃使尉他將卒以戍越當是時秦禍北構于胡南挂于越宿兵于無用之地進而不得退行十餘年丁男被甲丁女轉輸苦不聊生自經于道樹死者相望及秦皇帝崩天下大叛陳勝吳廣舉陳武臣張耳舉趙項梁舉吳田儋舉齊景駒舉郢周市舉魏韓廣舉燕窮山通谷豪士竝起不可勝載也然本皆非公侯之後非長官之吏無尺寸之勢起閭巷杖棘矜應時而動不謀而俱起不約而同會壤長地進至乎伯王時教使然也秦貴為天子富有天下滅世絶祀窮兵之禍也故周失之弱秦失之彊不變之患也今徇南夷朝夜郎降羌僰略薉州建城邑深入胸奴燔其龍城議者美之此人臣之利非天下之長策也今中國無狗吠之警而外纍于遠方之備靡敝國家非所以子民也行無窮之欲甘心快意結怨於胸奴非所以安邊也禍拿而不解兵休而復起近者愁苦遠者驚駭非所以持久也今天下鍛甲摩劍矯箭控弦輔輸軍糧未見休時此天下所共憂也夫兵久而變起事煩而慮生今外郡之地或幾千里列城數十形束壤制帶脅諸侯非宗室之利也上觀齊晉所以亡公室卑削六卿大盛也下覽秦之所以滅刑嚴文刻欲大無窮也今郡守之權非特六卿之重也地幾千里非特閭巷之資也甲兵器械非特棘矜之用也以逢萬世之變則不可勝諱也見漢書嚴安傳又史記主父偃傳少篇首二百七十七字白麟奇木對臣聞詩頌君德樂舞后功異經而同指明盛德之所隆也南越竄屏葭葦與鳥魚群正朔不及其俗有司臨境而東甌內附閩王伏辜南越賴救北胡隨畜薦居禽獸行虎狼心上古未能攝大將軍秉鉞單于奔幕票騎抗旌昆邪右衽是澤南洽而威北畼也若罰不阿近舉不遺遠設官俟賢縣賞待功能者進以保祿罷者退而勞力刑于宇內矣履衆美而不足懷聖明而不專建三宮之文質章厥職之所宜封禪之君無聞焉夫天命初定萬事草創及臻六合同風九州共貫必待明聖潤色祖業傳于無窮故周至成王然後制定而休徵之應見陛下盛日月之光垂聖思于勒成專神明之敬奉燔瘞於郊宮獻享之精交神積和之氣塞明而異獸來獲宜矣昔武王中流未濟白魚入于王舟俯取以燎群公咸曰休哉今郊祀未見于神祇而獲獸以饋此天之所以示饗而上通之符合也宜因昭時令日改定告元苴白茅于江淮發嘉號于營丘以應緝熙使著事者有紀焉蓋六鶂退飛逆也白魚登舟順也夫明暗之徵上亂飛鳥下動淵魚各以類推今野獸并角明同本也衆支內附示無外也若此之德殆將有解編髮削左衽襲冠帶要衣裳而蒙化者焉斯拱而俟之耳見漢書終軍傳奉詔詰徐偃矯制狀古者諸侯國異俗分百里不通時有聘會之事安危之勢呼吸成變故有不受辭造命顓己之宜今天下為一萬里同風故春秋王者無外偃巡封域之中稱以出疆何也且鹽鐵郡有餘臧正二國廢國家不足以為利害而以安社稷存萬民為辭何也膠東南近琅邪北接北海魯國西枕泰山東有東海受其鹽鐵偃度四郡口數田地率其用器食鹽不足以并給二郡邪將勢宜有餘而吏不能也何以言之偃矯制而鼓鑄者欲及春耕種贍民器也今魯國之鼓當先具其備至秋乃能舉火此言與實反者非偃已前三奏無詔不惟所為不許而直矯作威福以從民望干名采譽此明聖所必加誅也枉尺直尋孟子稱其不可今所犯罪重所就者小偃自豫必死而為之邪將幸誅不加欲以采名也見漢書終軍傳自請使胸奴軍無橫草之功得列宿衛食祿五年邊境時有風塵之警臣宜被堅執鋭當矢石啓前行駑下不習金革之事今聞將遣胸奴使者臣願盡精厲氣奉佐明使畫吉凶於單于之前臣年少材下孤于外官不足以亢一方之任竊不勝憤悶見漢書終軍傳自請使南越願受長纓必羈南越王而致之闕下見漢書終軍傳議禁民不得挾弓弩對臣聞古者作五兵非以相害以禁暴討邪也安居則以制猛獸而備非常有事則以設守衛而施行陳及至周室衰微上無明王諸侯力政彊侵弱衆暴寡海內抏敝巧詐並生是以知者陷愚勇者威怯苟以得勝為務不顧義理故機變械飾所以相賊害之具不不勝數于是秦兼天下廢王道立私議滅詩書而守法令去仁恩而任刑戮墮名城殺豪桀銷甲兵折鋒刃其後民以耰鉏箠梃相撻擊犯法滋衆盜賊不勝至于赭衣塞路群盜滿山卒以亂亡故聖王務教化而省禁防知其不足恃也今陛下昭明德建太平舉俊材興學官三公有司或由窮巷起白屋裂地而封宇內日化方外鄉風然而盜賊猶有者郡國二千石之罪非挾弓弩之過也禮曰男子生桑弧蓬矢以舉之明示有事也孔子曰吾何執執射乎大射之禮自天子降及庶人三代之道也詩云大侯既抗弓矢斯張射夫既同獻爾發功言貴中也愚聞聖王合射以明教矣未聞弓矢之為禁也且所為禁者為盜賊之以攻奪也攻奪之罪死然而不止者大姦之于重誅固不避也臣恐邪人挾之而吏不能止良民以自備而抵法禁是擅賊威而奪民救也竊以為無益于禁姦而廢先王之典使學者不得習行其禮大不便見漢書吾丘壽王傳驃騎論功論驃騎將軍霍去病征胸奴立克勝之功壽王作士大夫之論稱武帝之德曰士或問于大夫曰側聞強秦之用兵也南不踰五嶺北不渡大河海內愁怨以喪其國漢興六十餘載矣命將帥以抗憤用干戈于四荒南排朱崖北建朔方東越滄海西極河源拓地萬里海內晏然鄙人不識敢問其蹤大夫曰昔秦之得天下也以力而不以德以詐而不以誠內用商鞅李斯之謀外用白起王翦之兵窺閒伺隙既并海內之後以威力為至道以權詐為要術遂非唐笑虞絶滅舊章防禁文學行是古之戮嚴誹謗之謀十餘年遂滂沱而盈溢是故皇天疾滅更命大漢反秦政務在敦厚至今六世可謂富安天子文明四夷向風徒觀朝廷下僚門戶之士謀如湧泉動如駭機皆能安中國吞四夷君臣若茲何慮而不成何征而不剋雖拔泰山填滄海可也見藝文類聚五十九失題心如飢虎志若秋鷹見北堂書鈔十四上書諫伐胸奴臣聞明主不惡切諫以博觀忠臣不敢避重誅以直諫是故事無遺策而功流萬世今臣不敢隱忠避死以效愚計願陛下幸赦而少察之司馬法曰國雖大好戰必亡天下雖平忘戰必危天下既平天子大凱春搜秋獮諸侯春振旅秋治兵所以不忘戰也且夫怒者逆德也兵者凶器也爭者末節也古之人君一怒必伏尸流血故聖王重行之夫務戰勝窮武事者未有不悔者也昔秦皇帝任戰勝之威蠶食天下并吞戰國海內為一功齊三代務勝不休欲攻胸奴李斯諫曰不可夫胸奴無城郭之居委積之守遷徙鳥舉難得而制也輕兵深入糧食必絶踵糧以行重不及事得其地不足以為利也遇其民不可役而守也勝必殺之非民父母也靡斃中國快心胸奴非長策也秦皇帝不聽遂使蒙恬將兵攻胡辟地千里以河為境地固澤鹵不生五穀然後發天下丁男以守北河暴兵露師十有餘年死者不可勝數終不能踰河而北是豈人衆不足兵革不備哉其勢不可也又使天下蜚芻挽粟起于東腄琅邪負海之郡轉輸北河率三十鍾而致一石男子疾耕不足于糧餉女子紡績不足于帷幕百姓靡敝孤寡老弱不能相養道路死者相望蓋天下始畔秦也及至高皇帝定天下略地于邊聞胸奴聚于代谷之外欲擊之御史成進諫曰不可夫胸奴之性獸聚而鳥散從之知搏影今以陛下盛德攻胸奴臣竊危之高帝不聽遂至于代谷果有平城之圍高皇帝蓋悔之甚乃使劉敬往結和親之約然後天下忘干戈之事故兵法曰興師十萬日費千金夫秦常積衆暴兵數十萬人雖有覆軍殺將係虜單于之功亦適足以結怨深讎不足以償天下之費夫上虛府庫下敝百姓甘心於外國非完事也夫胸奴難得而制非一世也行盜侵驅所以為業也天性固然上及虞夏殷周固弗程督禽獸畜之不屬為人夫上不觀虞夏殷周之統而下循近世之失此臣之所大憂百姓之所疾苦也且夫兵久則變生事苦則慮易乃使邊境之民斃靡愁苦而有離心將吏相疑而外市故尉他章邯得以成其私也夫秦政之所以不行者權分乎二子此得失之效也故周書曰安危在出令存亡在所用願陛下詳察之少加意而熟慮焉見史記主父偃傳說武帝令諸侯得分封子弟古者諸侯不過百里彊弱之形易制今諸侯或連城數十地方千里緩則驕奢易為淫亂急則阻其彊而合從以逆京師今以法割削之則逆節萌起前日鼂錯是也今諸侯子弟或十數而適嗣代立餘雖骨肉無尺之地封則仁孝之道不宣願陛下令諸侯得推恩分子弟以地侯之彼人人喜得所願上以德施實分其國不削而稍弱矣見史記主父偃傳漢書主父偃傳說武帝徙豪桀茂陵茂陵初立天下豪桀并兼之家亂衆之民皆可徙茂陵內實京師外銷姦猾此所謂不誅而害除見史記主父偃傳漢書主父偃傳奏留李陵方秋胸奴馬肥未可與戰臣願留陵至春俱將酒泉張掖騎各五千人竝擊東西浚稽可必禽也見漢書李陵傳請立皇子為諸侯王疏大司馬臣去病昧死再拜上疏皇帝陛下陛下過聽使臣去病待罪行閒宜專邊塞之思慮暴骨中野無以報乃敢惟他議以幹用事者誠見陛下憂勞天下哀憐百姓以自忘虧膳貶樂損郎員皇子賴天能勝衣趨拜至今無號位師傅官陛下恭讓不恤群臣私望不敢越職而言臣竊不勝犬馬心昧死願陛下詔有司因盛夏吉時定皇子位唯陛下幸察臣去病昧死再拜以聞皇帝陛下見史記三王世家病篤上宣帝書謝恩願分國邑三千戶以封兄孫奉車都尉山為列侯奉兄驃騎將軍去病祀見漢書霍光傳責過魏相幼主新立以為函穀京師之固武庫精兵所聚故以丞相弟為關都尉子為武庫令今河南太守不深惟國家大策苟見丞相不在而斥逐其子何淺薄也見漢書魏相傳上書發淮南王陰事毒藥苦于口利于病忠言逆于耳利于行今淮南王孫建材能高淮南王后荼荼子遷常疾害建建父不害無罪擅數捕繫欲殺之今建在可徵問具知淮南王陰事見史記淮南王傳又見漢書淮南王傳奏祠太一方天神貴者太一太一佐曰五帝古者天子以春秋祭太一東南郊用太牢七日為壇開八通之鬼道見史記封禪書漢書郊祀志上上言穿商洛渠臨晉民願穿洛以溉重泉以東餘頃攻鹵地誠得水可令畝十石見史記河渠書漢書溝洫志
