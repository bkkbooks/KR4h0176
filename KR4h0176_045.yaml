body:
  text: 卜式上書請死節南越臣聞主愧臣死群臣宜盡死節其駑下者宜出財以佐軍如是則強國不犯之道也臣願與子男及臨菑習弩博昌習船者請行死之以盡臣節見漢書蔔式傳上言官求雨縣官當食租衣稅而已今弘羊令吏坐市列肆販物求利亨弘羊天乃雨見史記平準書議封禪對陛下躬發聖德統楫群元宗祀天地薦禮百神精神所鄉徵兆必報天地竝應符瑞昭明其封泰山禪梁父昭姓考瑞帝王之盛節也然享薦之義不著於經以為封禪告成合祛于天地神祇祇戒精專以接神明總百官之職各稱事宜而為之節文唯聖主所由制定其當非群臣之所能列今將舉大事優遊數年使群臣得人自盡終莫能成唯天子建中和之極兼總條貫金聲而玉振之以順成天慶垂萬世之基見漢書兒寬傳封泰山還登明堂上壽臣聞三代改制屬象相因閒者聖統廢絶陛下發憤合指天地祖立明堂辟雍宗祀泰一六律五聲幽贊聖意神樂四合各有方象以丞嘉祀為萬世則天下幸甚將建大元本瑞登告岱宗發祉闓門以候景至癸亥宗祀日宣重光上元甲子肅雍永享光輝充塞天文粲然見象日昭報降符應臣寬奉觴再拜上千萬歲壽見漢書兒寬傳改正朔議帝王必改正朔易服色所以明受命於天也創業變改制不相復推傳序文則今夏時也臣等閒學褊陋不能明陛下躬聖發憤昭配天地臣愚以為三統之制後聖復前聖者二代在前也今二代之統絶而不序矣惟陛下發聖德宣考天地四時之極則順陰陽以定大明之制為萬世則見漢書律曆志上上書請開大河上領出之胡中河出昆崙經中國注勃海是其地勢西北高而東南下也可案圖書觀地形令水工準高下開大河上領出之胡中東注之海如此關東長無水災北邊不憂胸奴可以省隄防備塞士卒轉輸胡寇侵盜覆軍殺將暴骨原野之患天下常備胸奴而不憂百越者以其水絶壤斷也此功一成萬世大利見漢書溝洫傳報李陵書曩以人乏奉使方外至使遐夷作逆封豕造悖豺狼出爪摧辱王命身幽於無人之處跡戢于胡塞之地歃朝露以為飲茹田鼠以為糧窮目極望不見所識側耳遠聽不聞人聲當此之時生不足甘死不足惡所以忍困強存徒念忠義雖誘僕以隆爵厚寵萬金之利不以滑其慮也迫以白刃在頸鐵鑕在喉不以動其心也何則志定於不回期誓於歿命幸賴聖明遠垂拯贖得使入湯之禽復假羽毛刖斷之足復蒙連續每念足下才為世英器為時出語曰夜行被繡不足為榮況於家室孤滅棄在絶域衣則異制食味不均棄捐功名雖尚視息與亡無異向使君服節死難書功竹帛傳名千代茅土之封永在不朽不亦休哉嗟乎李卿事已去矣失之毫釐差之千里將復何言所貺重遺義當順承本為一體今為異俗餘歸漢室子留彼國臣無境外之交故不當受乖離邈矣相見末期國別俗殊死生隔絶岱馬越鳥能不依依謹奉答報並還所贈見藝文類聚三十當子鋭氣深入之時朝發夕息數千萬裏雖乘雲附景不足以譬速晨鳧失群不足以喻疾豈可因歸雁以運糧託景風以餉軍哉見北堂書鈔一百十七文選海賦注禦覽九百十九其於學人皆如鳳如龍見文選韋昭博奕論注書越人衣文蛇代馬依北風君子于其國也悽愴傷於心見文選張協雜詩注從塞下上書言烏孫事願留少主敦煌郡惠至烏孫責以負約因立元貴靡還迎少主見漢書蕭望之傳奏請擊龜茲龜茲嘗殺校尉賴丹未伏誅請便道擊之見漢書常惠傳令聞鼓聲而縱聞金聲而止見漢書李廣附傳表臣以天漢二年到塞外尋被詔書責臣不進臣輒引師到浚稽山五將失道見與蘇武書子卿名聲冠於圖籍分義光於二國形影表于丹青爵祿傳於王室家獲無窮之寵永明白於千載夫行志志立求仁得仁雖遭困厄死而後已將何恨哉陵前提步卒五千深入胸奴右地三千餘裏雖身降名辱下計其功豈不足以免老母之命邪嗟乎子卿世事謬矣功者福主今為禍先忠者義本今為重患是以範蠡赴流屈原沈身子欲居九夷此不由感怨之志邪行矣子卿恩若一體分為二朝悠悠永絶何可為思人殊俗異死生斷絶何由復達見藝文類聚三十相競趨蹛林見史記胸奴傳索隱言為瑕穢動增泥滓見文選潘嶽西征賦注雷鼓動天朱旗翳日見文選曹植責躬詩注又班固燕然山銘注陵自有識以來士之立操未有如子卿者也見文選張華答何邵詩注又繁欽與魏文帝箋注陵前為子卿死之計所以然者冀其驅醜虜翻然南馳故且屈以求伸若將不死功成事立則將上報厚恩下顯祖考之明也見文選李陵答蘇武書注陵當單於循先將軍之令將飲馬河洛收珠南海見文選孫楚為石苞與孫皓書注策名於天衢見文選郭有道碑文注重報蘇武書子卿足下勤宣令德策名清時榮問休畼幸甚幸甚遠託異國昔人所悲望風懷想能不依依昔者不遺遠辱還答慰誨勤勤有踰骨肉陵雖不敏能不慨然自從初降以至今日身之窮困獨坐愁苦終日無覩但見異類韋韝毳幕以禦風雨羶肉酪漿以充飢渴舉目言笑誰與為歡胡地玄冰邊土慘裂但聞悲風蕭條之聲涼秋九月塞外草衰夜不能寐側耳遠聽胡笳互動牧馬悲鳴吟嘯成群邊聲四起晨坐聽之不覺淚下嗟乎子卿陵獨何心能不悲哉與子別後益復無聊上念老母臨年被戮妻子無辜竝為鯨鯢身負國恩為世所悲子歸受榮我留受辱命也如何身出禮義之鄉而入無知之俗違棄君親之恩長為蠻夷之域傷已令先君之嗣更成戎狄之族又自悲矣功大罪小不蒙明察孤負陵心區區之意每一念至忽然忘生陵不難刺心以自明刎頸以見志顧國家於我已矣殺身無益適足增羞故每攘臂忍辱輒復苟活左右之人見陵如此以為不入耳之歡來相勸勉異方之樂秪令人悲增忉怛耳嗟乎子卿人之相知貴相知心前書倉卒未盡所懷故復略而言之昔先帝授陵步卒五千出征絶域五將失道陵獨遇戰而裏萬裏之糧帥徒步之師出天漢之外入強胡之域以五千之衆對十萬之軍策疲乏之兵當新羈之馬然猶斬將搴旗追奔逐北滅跡掃塵斬其梟帥使三軍之士視死如歸陵也不才希當大任意謂此時功難堪矣胸奴既敗舉國興師更練精兵強踰十萬單於臨陳親自合圍客主之形既不相如步馬之勢又甚懸絶疲兵再戰一以當千然猶扶乘創痛決命爭首死傷積野餘不滿百而皆扶病不任干戈然陵振臂一呼創病皆起舉刃指虜胡馬奔走兵盡矢窮人無尺鐵猶復徒首奮呼爭為先登當此時也天地為陵震怒戰士為陵飲血單於謂陵不可復得便欲引還而賊臣教之遂便復戰故陵不免耳昔高皇帝以三十萬衆困于平城當此之時猛將如雲謀臣如雨然猶七日不食僅乃得免況當陵者豈易為力哉而執事者云云苟怨陵以不死然陵不死罪也子卿視陵豈偷生之士而惜死之人哉寧有背君親捐妻子而反為利者乎然陵不死有所為也故欲如前書之言報恩於國主耳誠以虛死不如立節滅名不如報德也昔範蠡不殉會稽之恥曹沫不死三敗之辱卒復句踐之讎報魯國之羞區區之心竊慕此耳何圖志未立而怨已成計未從而骨肉受刑此陵所以仰天椎心而泣血也足下又云漢與功臣不薄子為漢臣安得不云爾乎昔蕭樊囚縶韓彭葅醢朝錯受戮周魏見辜其餘佐命立功之士賈誼亞夫之徒皆信命世之才抱將相之具而受小人之讒竝受禍敗之辱卒使懷才受謗能不得展彼二子之遐舉誰不為之痛心哉陵先將軍功略蓋天地義勇冠三軍徒失貴臣之意剄身絶域之表此功臣義士所以負戟而長歎者也何謂不薄哉且足下昔以單車之使適萬之虜遭時不遇至於伏劍不顧流離辛苦幾死期朔北之野丁年奉使晧首而歸老母終堂生妻去帷此天下所希聞古今所未有也蠻貊之人尚猶嘉子之節況為天下之主乎陵謂足下當享茅土之薦受千乘之賞聞子之歸賜不過二百萬位不過典屬國無尺土之封加子之勤而妨功害能之臣盡為萬戶侯親戚貪佞之類悉為廊廟宰子尚如此陵復何望哉且漢厚誅陵以不死薄賞子以守節欲使遠聽之臣望風馳命此實難矣所以每顧而不悔者也陵雖孤恩漢亦負德昔人有言雖忠不烈視死如歸陵誠能安而主豈復能眷眷乎男兒生以不成名死則葬蠻夷中誰復能屈身稽顙還向北闕使刀筆之吏弄其文墨邪願足下勿復望陵嗟乎子卿夫復何言相去萬裏人絶路殊生為別世之人死為異域之鬼長與足下生死辭矣幸謝故人勉事聖君足下胤子無恙勿以為念努力自愛時因北風復惠德音李陵頓首見文選藝文類聚三十初征大宛還至燉煌上書道遠多乏食且士卒不患戰患饑人少不足以拔宛願且罷兵益發而復往見史記大宛傳漢書李廣利傳奏斬監軍禦史臣聞軍法立武以威衆誅惡以禁邪今監禦史公穿軍垣以求賈利私買賣以與士市不立剛毅之心勇猛之節亡以帥先士大夫尤失理不公用文吏議不至重法黃帝李法曰壁壘已定穿窬不繇路是謂姦人姦人者殺臣謹桉軍法曰正亡屬將軍將軍有罪以聞二千石以下行法焉丞於用法疑執事不諉上臣謹以斬昧死以聞見漢書胡建傳又見說苑指武奏屯田輪臺故輪臺以東捷枝渠犂皆故國地廣饒水草有溉田五千頃以上處溫和田美可益通溝渠種五穀與中國同時孰其旁國少錐刀貴黃金采繒可以易穀食宜給足不乏臣愚以為可遣屯田卒詣故輪臺以東置校尉三人分護各舉圖地形通利溝渠務使以時益種五穀張掖酒泉遣騎假司馬為斥侯屬校尉事有便宜因騎置以聞田一歲有積穀募民壯健有纍重敢徙者詣田所就畜積為本業益墾溉田稍築列亭連城而西以威西國輔烏孫為便臣謹遣徵事臣昌分部行邊嚴敕太守都尉明熢火選士馬謹斥候畜茭草願陛下遣使使西國以安其意臣昧死請見漢書西域傳下上言鹽鐵山海天地之藏也皆宜屬少府陛下不私以屬大農佐賦願募民自給費因官器作鬻鹽官與牢盆浮食奇民欲擅管山海之貨以致富羡役利細民其沮事之議不可勝聽敢私鑄鐵器鬻鹽者釱左趾沒人其器物郡不出鐵者置小鐵官便屬在所縣見史記平準書上言作河東渠田漕從山東西歲百餘萬石更砥柱之限敗亡甚多而亦煩費穿渠引汾溉皮氏汾陰下引河溉汾陰蒲坂下度可得五千頃五千頃故盡河堧棄地民茭牧其中耳今溉田之度可得穀二百萬石以上穀從渭上與關中無異而底柱之東可毋復漕見史記河渠書漢書溝洫志上書請刺舉三河天下郡太守多為姦利三河尤甚臣請先刺舉三河三河大守皆內倚中貴人與三公有親屬無所畏憚宜先正三河以警天下姦吏見史記褚補田仁任安傳
