body:
  text: 趙充國先零羌事對羌人所以易制者以其種自有豪數相攻擊勢不一也往三十餘歲西羌反時亦先解仇合約攻令居與漢相距五六年乃定至征和五年先零豪封煎等通使胸奴胸奴使人至小月氏傳告諸羌曰漢二師將軍衆十餘萬人降胸奴羌人為漢事苦張掖酒泉本我地地肥美可共擊居之以此觀胸奴欲與羌合非一世也間者胸奴困於西方聞烏桓來保塞恐兵復從東方起數使使尉黎危須諸國設以子女貂裘欲沮解之其計不合疑胸奴更遣使至羌中道從沙陰地出鹽澤過長坑入窮水塞南抵屬國與先零相直臣恐羌變未止此且復結聯他種宜及未然為之備見漢書趙充國傳擊罕幵議武賢欲輕引萬騎分為兩道出張掖回遠千里以一馬自他負三十日食為米二斛四鬥麥八斛又有衣裝兵器難以追逐勤勞而至虜必商軍進退稍引去逐水屮入山林隨而深入虜即據前險守後厄以絶糧道必有傷危之憂為夷狄笑千載不可復而武賢以為可奪其畜産虜其妻子此殆空言非至計也又武威縣張掖日勒皆當北塞有通穀水草臣恐胸奴與羌有謀且欲大入幸能要杜張掖酒泉以絶西域其郡兵尤不可發先零首為畔逆它種劫略故臣愚册欲捐罕幵暗昧之過隱而勿章先行先零之誅以震動之宜悔過反善因赦其罪選擇良吏知其俗者拊循和輯此全師保勝安邊之册見漢書趙充國傳上書謝罪因陳兵利害臣竊見騎都尉安國前幸賜書擇羌人可使使罕諭告以大軍當至漢不誅罕以解其謀恩澤甚厚非臣下所能及臣獨私美陛下盛德至計亡已故遣幵豪雕庫宣天子至德罕幵之屬皆聞知明詔今先零羌楊玉將騎四千及煎鞏騎五千阻石山木候便為寇罕羌未有所犯今置先零先擊罕釋有罪誅亡辜起一難就兩害誠非陛下本計也臣聞兵法攻不足者守有餘又曰善戰者致人不致於人今罕羌欲為敦煌酒泉寇飭兵馬練戰士以須其至坐得致敵之術以逸擊勞取勝之道也今恐二郡兵少不足以守而發之行攻釋致虜之術而從為虜所致之道臣愚以為不便先零羌虜欲為背畔故與罕幵解仇結約然其私心不能亡恐漢兵至而罕幵背之也臣愚以為其計常欲先赴罕幵之急以堅其約先擊罕羌先零必助之今虜馬肥糧食方饒擊之恐不能傷害適使先零得施德于罕羌堅其約合其黨虜交堅黨合精兵二萬餘人迫脅諸小種附著者稍衆莫須之屬不輕得離也如是虜兵寖多誅之用力數倍臣恐國家憂纍繇十年數不二三歲而已臣得蒙天子厚恩父子俱為顯列臣位至上卿爵為列侯犬馬之齒七十六為明詔填溝壑死骨不朽亡所顧念獨思惟兵利害至孰悉也于臣之計先誅先零已則罕幵之屬不煩兵而服矣先零已誅而罕幵不服涉正月擊之得計之理又其時也以今進兵誠不見其利唯陛下裁察見漢書趙充國傳上屯田奏臣聞兵者所以明德除害也故舉得于外則福生于內不可不慎臣所將吏士馬牛食月用糧穀十九萬九千六百三十斛鹽千六百九十三斛茭稿二十五萬二百八十六石難久不解繇役不息又恐它夷卒有不虞之變相因並起為明主憂誠非素定廟勝之册且羌虜易以計破難用兵碎也故臣愚以為擊之不便計度臨羌東至浩亹羌虜故田及公田民所未墾可二千頃以上其間郵亭多壞敗者臣前部士入山伐材木大小六萬餘枚皆在水次願罷騎兵留弛刑應募及淮陽汝南步兵與吏士私從者合凡萬二百八十一人用穀月二萬七千三百六十三斛鹽三百八斛分屯要害處冰解漕下繕鄉亭浚溝渠治湟狹以西道橋七十所令可至鮮水左右田事出賦人二十畝至四月草生發郡騎及屬國胡騎伉健各千倅馬什二就草為田者遊兵以充入金城郡益積畜省大費今大司農所轉穀至者足支萬人一歲食謹上田處及器用簿唯陛下裁許見漢書趙充國傳條上屯田便宜十二事狀臣聞帝王之兵以全取勝是以貴謀而賤戰戰而百勝非善之善者也故先為不可勝以待敵之可勝蠻夷習俗雖殊於禮義之國然其欲避害就利愛親戚畏死亡一也今虜亡其美地薦草愁于寄託遠遁骨肉離心人有畔志而明主般師罷兵萬人留田順天時因地利以待可勝之虜雖未即伏辜兵決可期月而望羌虜瓦解前後降者萬七百餘人及受言去者凡七十輩此坐支解羌虜之具也臣謹條不出兵留田便宜十二事步兵九校吏士萬人留屯以為武備因田致穀威德並行一也又因排折羌虜令不得歸肥饒之墬貧破其衆以成羌虜相畔之漸二也居民得並田作不失農業三也軍馬一月之食度支田士一歲罷騎兵以省大費四也至春省甲士卒循河湟漕穀至臨羌以視羌虜揚威武傳世折衝之具五也以間暇時下所伐材繕治郵亭充入金城六也兵出乘危徼幸不出令反畔之虜竄于風寒之地離霜露疾疫瘃墯之患坐得必勝之道七也亡經阻遠追死傷之害八也內不損威武之重外不令虜得乘間之勢九也又亡驚動河南大幵小幵使生他變之憂十也治湟狹中道橋令可至鮮水以制西域信威千里從枕席上過師十一也大費既省繇役豫息以戒不虞十二也留屯田得十二便出兵失十二利臣充國材下犬馬齒衰不識長册唯明詔博詳公卿議臣採擇見漢書趙充國傳臣聞兵以計為本故多算勝少算先零羌精兵今餘不過七八千人失地遠客分散飢凍罕幵莫須又頗暴略其羸弱畜産畔還者不絶皆聞天子明令相捕斬之賞臣愚以為虜破壞可日月冀遠在來春故曰兵決可期月而望竊見北邊自敦煌至遼東萬一千五百餘裏乘塞列隧有吏卒數千人虜數大衆攻之而不能害今留步士萬人屯田地勢平易多高山遠望之便部曲相保為漸壘木樵校聯不絶便兵弩飭鬭具熢火幸通勢及並力以逸待勞兵之利者也臣愚以為屯田內有亡費之利外有守禦之備騎兵雖罷虜見萬人留田為必禽之具其土崩歸德宜不久矣從今盡三月虜馬羸瘦必不敢捐其妻子于他種中遠涉河山而來為寇又見屯田之士精兵萬人終不敢復將其纍重還歸故地是臣之愚計所以度虜且必瓦解其處不戰而自破之策也至于虜小寇盜時殺人民其原未可卒禁臣聞戰不必勝不苟接刃攻不必取不苟勞衆誠令兵出雖不能滅先零亶能令虜絶不為小寇則出兵可也即今同是而釋坐勝之道從乘危之勢往終不見利空內自罷敝貶重而自損非所以視蠻夷也又大兵一出還不可復留湟中亦未可空如是繇役復發也且胸奴不可不備烏桓不可不憂今久轉運煩費傾我不虞之用以淡一隅臣愚以為不便校尉臨衆幸得承威德奉厚幣拊循衆羌諭以明詔宜皆鄉風雖其前辭嘗曰得亡效五年宜亡他心不足以故出兵臣竊自惟念奉詔出塞引軍遠擊窮天子之精兵散車甲于山野雖亡尺寸之功偷得避慊之便而亡後咎餘責此人臣不忠之利非明主社稷之福也臣幸得奮精兵討不義久留天誅罪當萬死陛下寬仁未忍加誅令臣數得孰計愚臣伏計孰甚不敢避斧鉞之誅昧死陳愚唯陛下省察見漢書趙充國傳奏罷屯田羌本可五萬人軍凡斬首七千六百級降者三萬一千二百人溺河湟飢餓死者五六千人定計遺脫與煎鞏黃羝俱亡者不過四千人羌靡忘等自詭必得請罷屯兵見漢書趙充國傳奏記霍光議立皇曾孫將軍事孝武皇帝受繈褓之屬任天下之寄孝昭皇帝早崩亡嗣海內憂懼欲亟聞嗣主發喪之日以大誼立後所立非其人復以大誼廢之天下莫不服焉方今社稷宗廟群生之命在將軍之一舉竊伏聽於衆庶察其所言諸侯宗室在位列者未有所聞於民間也而遺詔所養武帝曾孫名病已在掖庭外家者吉前使居郡邸時見其幼少至今十八九矣通經術有美材行安而節和願將軍詳大議參以蓍龜亟宜褒顯先使入侍令天下昭然知之然後決定大策天下幸甚見漢書丙吉傳與魏相書朝廷已深知弱翁治行方且大用矣願少慎事自重藏器於身不顯其能見漢書魏相傳賢良對策賞罰所以勸善禁惡政之本也日者燕王為無道韓義出身強諫為王所殺義無比幹之親而蹈比幹之節宜顯賞其子以示天下明為人臣之義見漢書韓延壽傳上封事薦張安世聖王褒有德以懷萬方顯有功以勸百寮是以朝廷尊榮天下鄉風國家承祖宗之業制諸侯之重新失大將軍宜宣章盛德以示天下顯明功臣以填藩國毋空大位以塞爭權所以安社稷絶未萌也車騎將軍安世事孝武皇帝三十餘年忠信謹厚勤勞政事夙夜不怠與大將軍定策天下受其福國家重臣也宜尊其位以為大將軍毋令領光祿勳事使專精神憂念天下思惟得失安世子延壽重厚可以為光祿勳領宿衛臣見漢書張湯附傳上封事奪霍氏權春秋譏世卿惡宋三世為大夫及魯季孫之專權皆危亂國家自後元以來祿去王室政繇冢宰今光死子復為大將軍兄子秉樞機昆弟諸壻據權勢在兵官光夫人顯及諸女皆通籍長信宮或夜詔門出入驕奢放縱恐寖不制宜有以損奪其權破散陰謀以固萬世之基全功臣之世見漢書魏相傳上書諫擊胸奴右地臣聞之救亂誅暴謂之義兵兵義者王敵加於己不得已而起者謂之應兵兵應者勝爭恨小故不忍憤怒者謂之忿兵兵忿者敗利人土地貨寶者謂之貪兵兵貪者破恃國家之大矜民人之衆欲見威於敵者謂之驕兵兵驕者滅此五者非但人事乃天道也間者胸奴嘗有善意所得漢民輒奉歸之未有犯於邊境雖爭屯田車師不足致意中今聞諸將軍欲興兵入其地臣愚不知此兵何名者也今邊郡困乏父子共犬羊之裘食草萊之實常恐不能自存難動兵軍旅之後必有凶年言民以其愁苦之氣傷陰陽之和也出兵雖勝猶有後憂恐災害之變因此以生今郡國守相多不實選風俗尤薄水旱不時案今年計子弟殺父兄妻殺夫者凡二百二十二人臣愚以為此非小變也今左右不憂此乃欲發兵報纖介之忿於遠夷殆孔子所謂吾恐季氏之憂不在顓臾而在蕭牆之內也願陛下與平昌侯樂昌侯平恩侯及有識者詳議乃可見漢書魏相傳上書自陳妻實不殺婢廣漢數犯罪法不伏辜以詐巧迫脅臣相幸臣相寬不奏願下明使者治廣漢所驗臣相家事見漢書趙廣漢傳條奏便宜臣聞明主在上賢輔在下則君安虞而民和睦臣相幸得備位不能奉明法廣教化理四方以宣聖德民多背本趨末或有飢寒之色為陛下之憂臣相罪當萬死臣相知能淺薄不明國家大體時用之宜惟民終始未得所繇竊伏觀先帝聖德仁恩之厚勤勞天下垂意黎庶憂水旱之災為民貧窮發倉廩振乏餧遣諫大夫博士巡行天下察風俗舉賢良平冤獄冠蓋交道省諸用寬租賦弛山澤波池禁秣馬酤酒貯積所以周急繼困慰安元元便利百姓之道甚備臣相不能悉陳昧死奏故事詔書凡二十三事臣謹案王法必本于農而務積聚量入制用以備凶災亡六年之畜尚謂之急元鼎二年平原勃海泰山東郡溥被災害民餓死於道路二千石不豫慮其難使至于此賴明詔振救乃得蒙更生今歲不登穀暴騰踴臨秋收斂猶有乏者至春恐甚亡以相恤西羌未平師旅在外兵革相乘臣竊寒心宜蚤圖其備唯陛下留神元元帥繇先帝盛德以撫海內見漢書魏相傳表湊采易陰陽明堂月令臣相幸得備員奉職不修不能宣廣教化陰陽未和災害未息咎在臣等臣聞易曰天地以順動故日月不過四時不忒聖王以順動故刑罰清而民服天地變化必繇陰陽陰陽之分以日為紀日冬夏至則八風之序立萬物之性成各有常職不得相干東方之神太昊乘震執規司春南方之神炎帝乘離執衡司夏西方之神少昊乘兌執矩司秋北方之神顓頊乘坎執權司冬中央之神黃帝乘坤艮執繩司下土茲五帝所司各有時也東方之卦不可以治西方南方之卦不可以治北方春興兌治則飢秋興震治則華冬興離治則泄夏興坎治則雹明王謹于尊天慎於養人故立羲和之官以乘四時節授民事君動靜以道奉順陰陽則日月光明風雨時節寒暑調和三者得敘則災害不生五穀熟絲麻遂屮木茂鳥獸蕃民不夭疾衣食有餘若是則君尊民説上下亡怨政教不違禮讓可興夫風雨不時則傷農桑農桑傷則民飢寒飢寒在身則亡廉恥寇賊姦宄所繇生也臣愚以為陰陽者王事之本群生之命自古賢聖未有不繇者也天子之義必純取法天地而觀于先聖高皇帝所述書天子所服第八曰大謁者臣章受詔長樂宮曰令群臣議天子所服以安治天下相國臣何御史大夫臣昌謹與將軍臣陵太子太傅臣通等議春夏秋冬天子所服當法天地之數中得人和故自天子王侯有土之君下及兆民能法天地順四時以治國家身亡禍殃年壽永究是奉宗廟安天下之大禮也臣請法之中謁者趙堯舉春李舜舉夏兒湯舉秋貢禹舉冬四人各職一時大謁者襄章奏制曰可孝文皇帝時以二月施恩惠於天下賜孝弟力田及罷軍卒祠死事者頗非時節御史大夫鼂錯為太子家令奏言其狀臣相伏念陛下恩澤甚厚然而災氣未息竊恐詔令有未合當時者也願陛下選明經通知陰陽者四人各主一時時至明言所職以和陰陽天下幸甚見漢書魏相傳上疏求召見臣山東草萊之人行能亡無所比容貌不及衆然而不棄人倫者竊以聞道于先師自託於經術也願賜清間之燕得盡精思於前見漢書蔡義傳上書理太子臣聞父者猶天母者猶地子猶萬物也故天平地安陰陽和調物乃茂成父慈母愛室家得中子乃孝順陰陽不和則萬物夭傷父子不和則室家喪亡故父不父則子不子君不君則臣不臣雖有粟吾豈得而食諸昔者虞舜孝之至也而不中于瞽叟孝己被謗伯奇放流骨肉至親父子相疑何者積毀之所生也由是觀之子無不孝而父有不察令皇太子為漢適嗣承萬世之業體祖宗之重親則皇帝之宗子也江充布衣之人閭閻之隸臣耳陛下顯而用之銜至尊之命以迫蹴皇太子造飾姦詐群邪錯謬是以親戚之路鬲塞而不通太子進則不得上見退則困于亂臣獨冤結而亡告不忍忿忿之心起而殺充恐懼逋逃子盜父兵以救難自免耳臣竊以為無邪心詩云營營青止于樊愷悌君子無信讒言讒言罔極交亂四國往者江充讒殺趙太子天下莫不聞其罪固宜陛下不省察深過太子發盛怒舉大兵而求之三公自將智者不敢言辨士不敢説臣竊痛之臣聞子胥盡忠而忘其號比幹盡仁而遺其身忠臣竭誠不顧鈇鉞之誅以陳其愚志在匡君安社稷也詩云取彼譖人投畀豺虎唯陛下寬心慰意少察所親毋患太子之非亟罷甲兵無令太子久亡臣不勝惓惓出一旦之命待衆建章闕下見漢書武五子傳上急變訟太子冤子弄父兵罪當笞天子之子過謀殺人當何罪哉臣嘗夢見一白頭翁救臣言見漢書車千秋傳單于朝儀議聖王之制施德行禮先京師而後諸夏先諸夏而後夷狄詩云率禮不越遂視既發相土烈烈海外有截陛下聖德充塞天地光被四表胸奴單於鄉風慕義舉國同心奉珍朝賀自古未之有也單于非正朔所加王者所客也禮儀宜如諸侯王稱臣昧死再拜位次諸侯王下見漢書宣紀上書請復丙吉後爵邑臣少時為郡邸小吏竊見孝宣皇帝以皇曾孫在郡邸獄是時治獄使者丙吉見皇曾孫遭離無辜吉仁心感動泣涕悽惻選擇復作胡組養視皇孫吉常從臣尊日再侍臥上後遭條獄之詔吉扞拒大難不避嚴刑峻法既遭大赦吉謂守丞誰如皇孫不當在官使誰如移書京兆尹遣興胡組俱送京兆尹不受復還及組日滿當去皇孫思慕吉以私錢顧組令留與郭徵卿並養數月乃遣組去後少內嗇夫白吉曰食皇孫亡詔令時吉得食米肉月月以給皇孫吉卿時病輒使臣尊朝夕請問皇孫視省席蓐燥濕侯伺組徵卿不得令晨夜去皇孫敖蕩數奏甘毳食物所以擁全神靈成育聖躬功德已亡量矣時豈豫知天下之福而徼其報哉誠其仁恩內轡于心也雖介子推割肌以君不足以比孝宣皇帝時臣上書言狀幸得下吉謙讓不自伐刪去臣辭專歸美于組徵卿組徵卿皆以受田宅賜錢吉封為博陽侯臣尊不得比組徵卿臣年老居貧死在旦暮欲終不言恐使有功不著吉子顯坐微文奪爵為闕內侯臣愚以為宜復其爵邑以報先人功德漢書丙吉傳元帝時長安士伍尊上書
