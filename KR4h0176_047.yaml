body:
  text: 張敞告絮舜教五日京兆竟何如冬月己盡延命乎見漢書張敞傳上書諫昌邑王孝昭皇帝觸蚤崩無嗣大臣憂懼選賢聖承宗廟東迎之日唯恐屬車之行遲今天子以盛年初即位天下莫不拭目傾耳觀此聽風國輔大臣未褒而昌邑小輦先遷此過之大者也見漢書張敞傳上書自請治膠東勃海盜賊臣聞忠考之道退家則盡心于親進宦則竭力于君夫小國中君猶有奮不顧身之臣況于明天子乎今陛下遊意于太平勞精于政事亹亹不舍晝夜群臣有司宜各竭力致身山陽郡戶九萬三千口五十萬以上訖計盜賊未得者七十七人他課諸事亦略如此臣敞愚駑既無以佐思慮久處間郡身逸樂而忘國事非忠孝之節也伏聞膠東勃海左右郡歲數不登盜賊並起至攻官寺篡囚徒搜市朝劫列侯吏失綱紀姦軌不禁臣敞不敢愛身避死唯明詔之所處願盡力摧挫其暴虐存撫其孤弱事即有業所至郡條奏其所由廢及所以興之狀見漢書張敞傳奏書諫膠東王太后數出遊獵臣聞秦王好淫聲葉陽後為不聽鄭衛之樂楚嚴好田獵樊姬為不食鳥獸之肉口非惡旨甘耳非憎絲竹也所以抑心意絶耆欲者將以率二君而全宗祀也禮君母出門則乘輜軿下堂則從傅母進退則鳴玉佩內飾則結綢繆此言尊貴所以自斂制不從恣之意也今太后資質淑美慈愛寬仁諸侯莫不聞而少以田獵縱欲為名於以上聞亦未宜也唯觀覽于往古全行乎來今令後姬得有所法則下臣有所稱誦臣敞幸甚見漢書張敞傳詣公車上書臣前幸得備位列卿待罪京兆坐殺賊捕掾絮舜舜本臣敞素所厚吏數蒙恩貸以臣有章劾當免受記考事便歸臥家謂臣五日京兆背恩忘義傷化薄俗臣竊以舜無狀枉法以誅之臣敞賊殺無辜鞠獄故不直雖伏明法死無所恨見漢書張敞傳上書請令人穀贖罪國兵在外軍以夏發隴西以北安定以西吏民並給轉輸田事頗廢素無餘積雖羌虜以破來春民食必乏窮辟之處買亡所得縣官穀度不足以振之願令諸有罪非盜受財殺人及犯法不得赦者皆得以差入穀此八郡贖罪務益致穀以豫備百姓之見漢書蕭望之傳又見藝文類聚五十四為霍氏上封事臣聞公子季友有功于魯大夫趙衰有功於晉大夫田完有功於齊皆疇其庸延及子孫終後田氏篡齊趙氏分晉季氏顓魯故仲尼作春秋迹盛衰譏世卿最甚乃者大將軍決大計安宗廟定天下功亦不細矣夫周公七年耳而大將軍二十歲海內之命斷於掌握方其隆時感動天地侵迫陰陽月朓日蝕晝冥宵光地大震裂火生地中天文失度祅祥變怪不可勝記皆陰類盛長臣下顓制之所生也朝臣宜有明言曰陛下褒寵故大將軍以報功德足矣間者輔臣顓政貴戚太盛君臣之分不明請罷霍氏三侯皆就弟及衛將軍張安世宜賜幾杖歸休時存問召見以列侯為天子師明詔以恩不聽群臣以義固爭而後許天下必以陛下為不忘功德而朝臣為知禮霍氏世世無所患苦今朝廷不聞直聲而令明詔自親其文非策之得者也今兩侯以出人情不相遠以臣心度之大司馬及其枝屬必有畏懼之心夫近臣自危非完計也臣敞願于廣朝白發其端直守遠郡其路無由夫心之精微口不能言也言之微眇書不能文也故伊尹五就桀五就湯蕭相國薦淮陰纍歲乃得通況乎千里之外因書文諭事指哉唯陛下省察見漢書張敞傳上疏諫用方術願明主時忘車馬之好斥遠方士之虛語遊心帝王之術太平庶幾可興也見漢書郊祀志下奏劾黃霸竊見丞相請與中二千石博士雜問郡國上計長吏守丞為民興利除害成大化條其對有耕者讓畔男女異路道不拾遺及舉孝子弟弟貞婦者為一輩先上殿舉而不知其人數者次之不為條教者在後叩頭謝丞相雖口不言而心欲其為之也長吏守丞對時臣敞舍有鶡雀飛止丞相府屋上丞相以下見者數百人邊吏多知鶡雀者問之皆陽不知丞相圖議上奏曰臣問上計長吏守丞以興化條皇天報下神雀後知從臣敞舍來乃止郡國吏竊笑丞相仁厚有知略微信奇怪也昔汲黯為淮陽守辭去之官謂大行李息曰禦史大夫張湯懷詐阿意以傾朝廷公不早白與俱受戮矣息畏湯終不敢言後湯誅敗上聞黯與息語乃抵息罪而秩黯諸侯相取其思竭忠也臣敞非敢毀丞相也誠恐群臣莫白而長吏守丞畏丞相指歸舍法令各為私教務相增加澆淳散朴並行偽貌有名亡實傾搖解怠甚者為妖假令京師先行讓畔異路道不拾遺其實亡益廉貪貞淫之行而以偽先天下固未可也即諸侯先行之偽聲軼于京師非細事也漢家承敝通變造起律令即以勸善禁姦條貫詳備不可復加宜令貴臣明飭長吏守丞歸告二千石舉三老孝弟力田孝廉吏務得其人郡事皆以義法令檢式毋得擅為條教敢挾詐偽以姦名譽者必先受戮以正明好惡見漢書循吏黃霸傳條奏故昌邑王居處狀臣敞地節三年五月視事故昌邑王居故宮奴婢在中者百八十三人閉大門開小門廉吏一人為領錢物市買朝內食物它不得出入督盜一人別主徼循察往來者以王家錢取卒迾宮清中備盜賊臣敞數遣丞吏行察四年九月中臣敞入視居處狀故王年二十六七為人青黑色小目鼻末鋭卑少須眉身體長大疾痿行步不便衣短衣大褲冠惠文冠佩玉環簪筆持牘趨謁臣敞與坐語中庭閲妻子奴婢臣敞欲動觀其意即以惡鳥感之曰昌邑多梟故王應曰然前賀西至長安殊無梟復來東至濟陽乃復聞梟聲臣敞閲至子女持轡故王跪曰持轡母嚴長孫女也臣敞故知執金吾嚴延年字長孫女羅紨前為故王妻察故王衣服言語跪起清狂不惠妻十六人子二十二人其十一人男十一人女昧死奏名籍及奴婢財物簿臣敞前書言昌邑哀王歌舞者張修等十人無子又非姬但良人無官名王薨當罷歸太傅豹等擅留以為哀王園中人所不當得為請罷歸故王聞之曰中人守園疾者當勿治相殺傷者當勿法欲令亟死太守奈何而欲罷之其天資喜由亂亡終不見仁義如此後丞相禦史以臣敞書聞奏可皆以遣見漢書武五子昌邑王傳美陽鼎不宜薦見議臣聞周祖始乎後稷後稷封于斄公劉發迹於豳大王建國于岐梁文武興于豐鎬由此言之則岐梁豐鎬之間周舊居也固宜有宗廟壇場祭祀之臧今鼎出于岐東中有刻書曰王命尸臣官此栒邑賜爾旗鸞黼黻雕戈尸臣拜手稽首曰敢對揚天子丕顯休命臣愚不足以迹古文竊以傳記言之此鼎殆周之所以褒賜大臣大臣子孫刻銘其先功臧之於宮廟也昔寶鼎之出於汾脽也河東太守以聞詔曰朕巡祭後土祗為百姓蒙豐年今穀嗛未報鼎焉為出哉博問耆老意舊臧與誠欲考得事實也有司驗脽上非舊臧處鼎大八尺一寸高三尺六寸殊異于衆鼎今此鼎細小又有款式不宜薦見于宗廟見漢書郊祀志下答兩府入穀贖罪難問少府左馮翊所言常人之所守耳昔先帝征四夷兵行三十餘年百姓猶不加賦而軍用給今羌虜一隅小夷跳梁于山谷間漢但令罪人出財減罪以誅之其名賢于煩擾良民橫興賦斂也又諸盜及殺人犯不道者百姓所疾苦也皆不得贖首匿見知縱所不當得為之屬議者或頗言其法可蠲除今因此令贖其便明甚何化之所亂甫刑之罰小過赦薄罪贖有金選之品所從來久矣何賊之所生敞備皂衣二十餘年嘗聞罪人贖矣未聞盜賊起也竊憐涼州被寇方秋饒時民尚有飢乏病死于道路況至來春將大困乎不早慮所以振救之策而引常經以難恐後為重責常人可與守經未可與權也敞幸得備列卿以輔兩府為職不敢不盡愚見漢書蕭望之傳為膠東相與朱邑書明主遊心太古廣廷茂士此誠忠臣竭思之時也直敞遠守劇郡馭於繩墨胸臆約結固亡奇也雖有亦安所施足下以清明之德掌周稷之業猶飢者甘糟粳穰歲餘梁肉何則有亡之勢異也昔陳平雖賢須魏倩而後進韓信雖奇賴蕭公而後信故事各達其時之英俊若必伊尹呂望而後薦之則此人不因足而進矣見漢書朱邑傳藝文類聚五十三書夫蒼龍非不神不能白日升天飄風雖疾不以霖雨不能揚塵故蒼蠅之飛不過十步自託騏驥之髮乃騰千里之路然無損於騏驥得使蒼蠅絶群也見梅鼎祚引書鈔案此疑即與朱邑書未敢定之與嚴延年書昔韓盧之取菟也上觀下獲不甚多殺願次卿緩誅罰思行此術見漢書酷吏嚴延年傳答朱登遺蟹醬書蘧伯玉受孔子之賜必以及其鄉人敞謹分斯貺於三老尊行者曷敢獨享之見禦覽四百七十八引張敞集為陳崇草奏稱莽功德竊見安漢公自初束修值世俗隆奢麗之時蒙兩宮厚骨肉之寵被諸父赫赫之光財饒勢足亡所忤意然而折節行仁克心履禮拂世矯俗確然特立惡衣惡食陋車駑馬妃匹無二閨門之內孝友之德衆莫不聞清靜樂道溫良下士惠于故舊篤于師友孔子曰未若貧而樂富而好禮公之謂矣及為侍中故定陵侯淳于長有大逆罪公不敢私建白誅討周公誅管蔡季子鴆叔牙公之謂矣是以孝成皇帝命公大司馬委以國統孝哀即位高昌侯董宏希指求美造作二統公手劾之以定大綱建白定陶太后不宜在乘輿幄坐以明國體詩曰柔亦不茹剛亦不吐不侮鰥寡不畏強圉公之謂矣深執謙退推誠讓位定陶太后欲立僭號憚彼面刺幄坐之義佞惑之雄朱博之疇懲此長宏手劾之事上下一心讒賊交亂詭辟制度遂成篡號斥逐仁賢誅殘戚屬而公被胥原之訴遠去就國朝政崩壞綱紀廢弛危亡之禍不隧如髮詩云人之雲亡邦國殄悴公之謂矣當此之時宮亡儲主董賢據重加以傅氏有女之援皆自知得罪天下結讎中山則必同憂斷金相翼藉假遺詔頻用賞誅先除所憚急引所附遂誣往冤更徵遠屬事勢張見其不難矣賴公立入即時退賢及其黨親當此之時公運獨見之明奮亡前之威盱衡厲色振揚武怒乘其未堅厭其未發震起機動敵人摧折雖有賁育不及持刺雖有樗裏不及回知雖有鬼穀不及造次是故董賢喪其魂魄遂自絞殺人不還踵日不移晷霍然四除更為寧朝非陛下莫引立公非公莫克此禍詩云惟師尚父時惟膺揚亮彼武王孔子曰敏則有功公之謂矣于是公乃白內故泗水相豐斄令邯與大司徒光車騎將軍舜建定社稷奉節東迎皆以功德受封益土為國名臣書曰知人則哲公之謂也公卿鹹歎公德同盛公勳皆以周公為比宜賜號安漢公益封二縣公皆不受傳曰申包胥不受存楚之報晏平仲不受輔齊之封孔子曰能以禮讓為國乎何有公之謂也將為皇帝定立妃後有司上名公女為首公深辭讓迫不得已然後受詔父子之親天性自然欲其榮貴甚於為身皇后之尊侔於天子當時之會千載希有然而公惟國家之統揖大福之恩事事謙退動而固辭書曰舜讓於德不嗣公之謂矣自公受策以至於今亹亹翼翼日修其德增修雅素以命下國俊儉隆約以矯世俗割財損家以帥群下彌躬執平以逮公卿教子尊學以隆國化僮奴衣布馬不秼穀食飲之用不過凡庶詩云溫溫恭人如集於木孔子曰食無求飽居無求安公之謂矣克身自約糴食逮給物物卬市日闋亡儲又上書歸孝哀皇帝所益封邑入錢獻田殫盡舊業為衆倡始于是小大鄉和承風從化外則王公列侯內則帷幄侍禦翕然同時各竭所有或入金錢或獻田畝以振貧窮收贍不足者昔令尹子文朝不及夕魯公儀子不茹園葵公之謂矣開門延士下及白屋婁省朝政綜管衆治親見牧守以下考迹雅素審知白黑詩云夙夜匪解以事一人易曰終日乾乾夕惕若厲公之謂矣比三世為三公再奉送大行秉冢宰職填安國家四海輻湊靡不得所書曰納於大麓列風雷雨不迷公之謂矣此皆上世之所鮮禹稷之所難而公包其終始一以貫之可謂備矣是以三年之間化行如神嘉瑞疊纍豈非陛下知人之效得賢之致哉故非獨君之受命也臣之生亦不虛矣是以伯禹錫玄圭周公受郊祀蓋以達天之使不敢擅天之功也揆公德行為天下紀觀公功勳為萬世基基成而賞不配紀立而褒不副誠非所以厚國家順天心也高皇帝褒賞元功相國蕭何邑戶既倍又蒙殊禮奏事不名入殿不趨封其親屬十有餘人樂善無厭班賞亡遴苟有一策即必爵之是故公孫戎位在充郎選由旄頭一明樊噲封二千戶孝文皇帝褒賞絳侯益封萬戶賜黃金五千斤孝武皇帝恤録軍功裂三萬戶以封衛青青子三人或在繈褓皆為通侯孝宣皇帝顯著霍光增戶命疇封者三人延及兄孫夫絳侯即因漢藩之固杖朱虛之鯁依諸將之遞據相扶之勢其事雖醜要不能遂霍光即席當任之重乘大勝之威未嘗遭時不行陷假離朝朝之執事亡非同類割斷歷久統政曠世雖曰有功所因亦易然猶有計策不審過徵之纍及至青戎摽末之功一言之勞然猶皆蒙丘山之賞課功絳霍造之與因也比于青戎地之與天也而公又有宰治之效乃當上與伯禹周公等盛齊隆兼其褒賞豈特與若雲者同日而論哉然曾不得蒙青等之厚臣誠惑之臣聞功亡原者賞不限德亡首者褒不檢是故成王之于周公也度百里之限越九錫之檢開七百里之宇兼商奄之民賜以附庸殷民六族大路大旗封父之繁弱夏後之璜祝宗卜史備物典策官司彝器白牡之牲效望之禮王曰叔父建爾元子子父俱延拜而受之可謂不檢亡原者矣非特止此六子皆封書曰亡言不讎亡德不報報當如之不如非報也近觀行事高祖之約非劉氏不王然而番君得王長沙下詔稱忠定著于令明有大信不拘于制也春秋晉悼公用魏絳之策諸侯服從鄭伯獻樂悼公于是以半賜之絳深辭讓晉侯曰微子寡人不能濟河夫賞國之典不可廢也子其受之魏絳于是有金石之樂春秋善之取其臣竭忠以辭功君知臣以遂賞也今陛下既知公有周公德不行成王之褒賞遂聽公之固辭不顧春秋之明義則民臣何稱萬世何述誠非所以為國也臣愚以為宜恢公國令如周公建立公子令如伯禽所賜之品亦皆如之諸子之封皆如六子即群下較然輸忠黎庶昭然感德臣誠輸忠民誠感德則于王事何有惟陛下深惟祖宗之重敬畏上天之戒儀形虞周之盛敕盡伯禽之賜無遴周公之報令天法有設後世有祖天下幸甚見漢書王莽傳上為劉嘉作奏稱莽功德建平元壽之間大統幾絶宗室幾棄賴蒙陛下聖德扶服振救遮扞匡衛國命復延宗室明目臨朝統政發號施令動以宗室為始登用九族為先並録支親建立王侯南面之孤計以百數收復絶屬存亡續廢得比肩首復為人者嬪然成行所以藩漢國輔漢宗也建辟雍立明堂班天法流聖化朝群後昭文德宗室諸侯鹹益土地天下喁喁引領而歎頌聲洋洋滿耳而入國家所以服此美膺此名饗此福受此榮者豈非太皇太后日昃之思陛下夕惕之念哉何謂亂則統其理危則致其安禍則引其福絶則繼其統幼則代其任晨夜屑屑寒暑勤勤無時休息孳孳不已者凡以為天下厚劉氏也臣無愚智民無男女皆諭至意而安衆侯崇乃獨懷悖惑之心操畔逆之慮興兵動衆欲危宗廟惡不忍聞罪不容誅誠臣子之仇宗室之讎國家之賊天下之害也是故親屬震落而告其罪民人潰畔而棄其兵進不跬步退伏其殃百歲之母孩提之子同時斷斬懸頭竿杪珠珥在耳首飾猶存為計若此豈不悖哉臣聞古者畔逆之國既以誅討則豬其宮室以為汙池納垢濁焉名曰凶虛雖生菜茹而人不食四牆其社覆上棧下示不得通辨社諸侯出門見之著以為戒方今天下聞崇之反也鹹欲騫衣手劍而叱之其先至者則拂其頸衡其胸刃其軀切其肌後至者欲撥其門仆其牆夷其屋焚其器應聲滌地則時成創而宗室尤甚言必切齒焉何則以其背畔恩義而不知重德之所在也宗室所居或遠嘉幸得先聞不勝憤憤之願願為宗室倡始父子兄弟負籠荷鍤馳之南陽豬崇宮室令如古制及崇社宜如亳社以賜諸侯用永監戒願下四輔公卿大夫議以明好惡視四方見漢書王莽傳上奏沒入諸下裏物商賈或豫收方上不祥器物冀其疾用欲以求利非民臣所當為請沒入縣官見漢書酷吏傳
