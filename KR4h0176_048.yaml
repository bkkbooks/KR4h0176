body:
  text: 杜延年奏記霍光爭侯史吳事吏縱罪人有常法今更詆吳為不道恐於法深又丞相素無所守持而為好言於下盡其素行也至擅召中二千石甚無狀延年愚以為丞相久故及先帝用事非有大故不可棄也間者民頗言獄深吏為峻詆今丞相所議又獄事也如是以及丞相恐不合眾心群下讙譁庶人私議流言四布延年竊重將軍失此名於天下也見漢書杜周附傳舉賢良方正對策陛下畏天命悼變異延見公卿舉直言之士將以求天心迹得失也臣欽愚戇經術淺薄不足以奉大對臣聞日蝕地震陽微陰盛也臣者君之陰也子者父之陰也妻者夫之陰也夷狄者中國之陰也春秋日蝕三十六地震五或夷狄侵中國或政權在臣下或婦乘夫或臣子背君父事雖不同其類一也臣竊觀人事以考變異則本朝大臣無不自安之人外戚親屬無乖剌之心關東諸侯無強大之國三垂蠻夷無逆理之節殆為後宮何以言之日以戊申蝕時加未戊未土也土者中宮之部也其夜地震未央宮殿中此必適妾將有爭寵相害而為患者唯陛下深戒之變感以類相應人事失於下變象見於上能應之以德則異咎消亡不能應之以善則禍敗至高宗遭雊雉之戒飭己正事享百年之壽殷道復興要在所以應之應之非誠不立非信不行宋景公小國之諸侯耳有不忍移禍之誠出人君之言三熒惑為之退舍以陛下聖明內推至誠深思天變何應而不感何搖而不動孔子曰仁遠乎哉唯陛下正後妾抑女寵防奢泰去佚遊躬節儉親萬事數禦安車由輦道親二宮之饔膳致晨昏之定省如此即堯舜不足與比隆咎異何足消滅如不留聽於庶事不論材而授位殫天下之財以奉淫侈匱萬姓之力以從耳目近諂諛之人而遠公方信讒賊之臣以誅忠良賢俊失在巖穴大臣怨於不以雖無變異社稷之憂也天下至大萬事至眾祖業至重誠不可以佚豫為不可以奢泰持也唯陛下忍無益之欲以全眾庶之命臣欽愚戇言不足采見漢書本傳又略見五行志下之下白虎殿對策其夏上盡召直言之士詣白虎殿對策策曰天地之道何貴王者之法何如六經之義何上人之行何先取人之術何以當世之治何務各以經對欽對曰臣聞天道貴信地道貴貞不信不貞萬物不生生天地之所貴也王者承天地之所生理而成之昆蟲草木靡不得其所王者法天地非仁無以廣施非義無以正身克己就義恕以及人六經之所上也不孝則事君不忠涖官不敬戰陳無勇朋友不信孔子曰孝無終始而患不及者未之有也孝人行之所先也觀本行於鄉黨考功能於官職達觀其所舉富觀其所予窮觀其所不為乏觀其所不取近觀其所為主遠觀其所主孔子曰視其所以觀其所由察其所安人焉廋哉取人之術也殷因於夏尚質周因於殷尚文今漢家承周秦之敝宜抑文尚質廢奢長儉表實去偽孔子曰惡紫之奪朱當世治之所務也臣竊有所憂言之則拂心逆指不言則漸日長為禍不細然小臣不敢廢道而求從違忠而耦意臣聞玩色無厭必生好憎之心好憎之心生則愛寵偏於一人愛寵偏於一人則繼嗣之路不廣而嫉妒之心興矣如此則匹婦之說不可勝也唯陛下純德普施無欲是從此則罪庶鹹說繼嗣日廣而海內長安萬事之是非何足備言見漢書本傳上疏追訟馮奉世前功前莎車王殺漢使者約諸國背畔左將軍奉世以衛侯便宜發兵誅莎車王策定城郭功施邊境議者以奉世奉使有指春秋之義亡遂事漢家之法有矯制故不得侯今匈奴郅支單于殺漢使者亡保康居都護延壽發城郭兵屯田吏士四萬餘人以誅斬之封為列侯臣愚以為比罪則郅支薄量敵則莎車眾用師則奉世寡計勝則奉世為功於邊境安慮敗則延壽為禍於國家深其違命而擅生事同延壽刮地封而奉世獨不錄臣聞功同賞異則勞臣疑罪均刑殊則百姓惑疑生無常惑生不知所從亡常則節趨不立不知所從則百姓無所錯手足奉世圖難忘死信命殊俗威功白著為世使表獨抑厭而不揚非聖主所以塞疑厲節之意也願下有司議見漢書馮奉世傳奏記王鳳理馮野王竊見令曰吏二千石告過長安謁不分別予賜今有司以為予告得歸賜告不得是一律兩科失省刑之意夫三最予告令也病滿三月賜告詔恩也令告則得詔恩則不得失輕重之差又二千石病賜告得歸有故事得去郡亡著令傳曰賞疑從予所以廣恩勸功也罰疑從去所以慎刑闕難知也今釋令與故事而假不敬之法甚違闕疑從去之意即以二千石守千里之地任兵馬之重不宜去郡將以制刑為後法者則野王之罪在未制令前也刑賞大信不可不慎見漢書馮奉世附傳又見蓺文類聚五十四說王鳳禮壹娶九女所以極陽數廣嗣重祖也必鄉舉求窈窕不問華色所以助德理內也娣姪雖缺不復補所以養壽塞爭也故後妃有貞淑之行則胤嗣有賢聖之君制度有威儀之節則人君有壽考之福廢而不由則女德不厭女德不厭則壽命不究於高年書云或四三年言失欲之生害也男子五十好色未衰婦人四十容貌改前以改前之容侍於未衰之年而不以禮為制則其原不可救而後徠異態後徠異態則正後自疑而支庶有間適之心是以晉獻被納讒之謗申生蒙無罪之辜今聖主富於春秋未有適嗣方鄉術入學未親後妃之議將軍輔政宜因始初之隆建九女之制詳擇有行義之家求淑女之質毋必有色聲音技能為萬世大法夫少戒之在色小卞之作可為寒心唯將軍常以為憂見漢書本傳復說王鳳詩云殷監不遠在夏后氏之世剌戒者至迫近而省聽者常怠忽可不慎哉前言九女略陳其禍福甚可悼懼竊恐將軍不深留意后妃之制夭壽治亂存亡之端也迹三代之季世覽宗宣之饗國察近屬之符驗禍敗曷常不由女德是以佩玉晏鳴關雎歎之知好色之伐性短年離制度之生無厭天下將蒙化陵夷而成俗也故詠淑女幾以配上忠孝之篤仁厚之作也夫君親壽尊國家治安誠臣子之至願所當勉之也易曰正其本萬物理凡事論有疑未可立行者求之往古則典刑無考之來今則吉凶同卒搖易之則民心惑若是者誠難施也今九女之制合於往古無害於今不逆於民心至易行也行之至有福也將軍輔政而不蚤定非天下之所望也唯將軍信臣子之願念關雎之思逮委政之隆及始初清明為漢家建無窮之基誠難以忽不可以遴見漢書本傳說王鳳重後父車騎將軍至貴將軍宜尊重之敬之無失其意蓋輕細微眇之漸必生乖懺之患不可不慎衛將軍之日盛於蓋侯近世之事語尚在於長者之耳唯將軍察焉見漢書外戚傳下說王鳳絕罽賓前罽賓王陰末赴本漢所立後卒畔逆夫德莫大於有國子民罪莫大於執殺使者所以不報恩不懼誅者自知絕遠兵不至也有求則卑辭無欲則嬌嫚終不可懷服凡中國所以為通厚蠻夷愜快其求者為壤比而為寇也今縣度之阸非罽賓所能越也其鄉募不足以安西域雖不附不能危城郭前親逆節惡暴西域故絕而不通今悔過來而無親屬貴人奉獻者皆行賈賤人欲通貨市買以獻為名故煩使者送至縣度恐失實見欺凡遣使送客者欲為防護寇害也起皮山南更不屬漢之國四五斥侯士百餘人五分夜擊刁斗自守尚時為所侵盜驢畜負糧須諸國稟食得以自贍國或貧小不能食或桀黠不肯給擁彊漢之節餒山谷之間乞匄無所得離一二旬則人畜乘捐曠野而不反又歷大頭痛小頭痛之山赤土身熱之阪令人身熱無色頭痛嘔吐驢畜盡然又有三池盤石阪道陿者尺六七寸長者徑三十里臨崢嶸不測之深行者騎步相持繩索相引二千餘里乃到縣度畜墮未半阬穀盡靡碎人墮勢不得相收視險阻危害不可勝言聖王分九州制五服務盛內不求外今遣使者承至尊之命送蠻夷之賈勞吏士之眾涉危難之路罷獘所恃以事無用非久長計也使者業已受節可至皮山而還見漢書西域傳說王鳳處置夜郎等國太中大夫匡使和解蠻夷王侯王侯受詔已復相攻輕易漢使不憚國威其效可見恐議者選耎復守和解太守察動靜有變乃以聞如此則復曠一時王侯得收獵其眾申固其謀黨助眾多各不勝忿必相殄滅自知罪成狂犯守尉遠臧溫暑毒草之地雖有孫吳將賁育士若入水火往必焦沒知勇亡所施屯田守之費不可勝量宜因其罪惡未成未疑漢家加誅陰敕旁郡守尉練士馬大司農豫調穀積害處選任職太守往以秋涼時入誅其王侯尤不軌者即以為不毛之地亡用之民聖王不以勞中國宜罷郡放棄其民絕其王侯勿復通如以先帝所立累世之功不可墮壞亦宜因其萌芽早斷絕之及已成形然後戰師則萬姓被害見漢書西南夷傳說王鳳治河前河決丞相史楊焉言延世受焉術以塞之蔽不肯見今獨任延世延世見前塞之易恐其慮害不深又審如焉言延世之巧反不如焉且水勢各異不博議利害而任一人如使不及今冬成來春桃華水盛必羨溢有填淤反壤之害如此數郡種不得下民人流散盜賊將生雖重誅延世無益于事宜遣焉及將作大匠許商諫大夫乘馬延年雜作延世與焉必相破壞深論便宜以相難極商延年皆明計算能商功利足以分別是非擇其善而從之必有成功見漢書溝洫志復說王鳳起就位將軍深悼輔政十年變異不已故乞骸骨歸咎於身刻己自責至誠動眾愚知莫不感傷雖然是無屬之臣執進退之分絜其去就之節者耳非主上所以待將軍非將軍所以報主上也昔周公雖老猶在京師明不離成周示不忘王室也仲山父異姓之臣無親於宣就封於齊猶歎息永懷宿夜徘徊不忍遠去況將軍之於主上主上之與將軍哉夫欲天下治安變異之意莫有將軍主上昭然知之故攀援不遣書稱公毋困我唯將軍不為四國流言自疑於成王以固至忠見漢書本傳復說王鳳舉直言極諫京兆尹章所坐事密吏民見章素好言事以為不坐官職疑其以日蝕見對有所言也假令章內有所犯雖陷正法事不暴揚自京師不曉況於遠方恐天下不知章實有罪而以為坐言事也如是塞爭引之原損寬明之德欽愚以為宜因章事舉直言極諫並見郎從官展盡其意加於往前以明示四方使天下鹹知主上聖明不以言罪下也若此則流言消釋疑惑著明見漢書本傳戒王鳳昔周公身有至聖之德屬有叔父之親而成王有獨見之明無信讒之聽然管蔡流言而周公懼穰侯昭王之舅也權重於秦威震鄰敵有旦莫偃伏之愛心不介然有間然範雎起徒步由異國無雅信開一朝之說而穰侯就封及近者武安侯之見退三事之跡相去各數百歲若合符節甚不可不察願將軍由周公之謙懼損穰侯之威放武安之欲毋使範雎之徒得間其說見漢書本傳上書追劾翟方進方進本與長深結厚更相稱薦長陷大惡獨得不坐苟欲障塞前過不為陛下廣持平例又無恐懼之心反因時信其邪辟報睚眥怨故事大逆朋友坐免官無歸故郡者今坐長者歸故郡已深一等紅陽侯立坐子受長貨賂故就國耳非大逆也而方進復奏立黨友後將軍朱博鉅鹿太守孫宏故少府陳鹹皆免官歸鹹故郡刑罰無平在方進之筆端眾庶莫不疑惑皆言孫宏不與紅陽侯相愛宏前為中丞時方進為禦史大夫舉掾隆可侍禦史宏奏隆前奉使欺謾不宜執法近侍方進以此怨宏又方進為京兆尹時陳鹹為少府在九卿高弟陛下所自知也方進素與司直師丹相善臨禦史大夫缺使丹奏咸為奸利請案驗卒不能有所得而方進果自得禦史大夫為丞相即時詆欺奏免鹹復因紅陽侯事歸鹹故郡眾人皆言國家假方進權太甚案師丹行能無異及光祿勳許商被病殘人皆但以附從方進嘗獲尊官丹前親薦邑子丞相史能使巫下神為國求福幾獲大利幸賴陛下至明遣使者毛莫如先考驗卒得其奸皆坐死假令丹知而白之此誣罔罪也不知而白之是背經術惑左道也二者皆在大辟重於朱博孫宏陳咸所坐方進終不舉白專作威福阿黨所厚排擠英俊託公報私橫厲無所畏忌欲以熏轑天下天下莫不望風而靡自尚書近臣皆結舌杜口骨肉親屬莫不股栗威權泰盛而不忠信非所以安國家也今聞方進卒病死不以尉示天下反復賞賜厚葬唯陛下深思往事以戒來今見漢書杜周附傳上書言王氏世權王氏世權日久朝無骨骾之臣宗室諸侯微弱與繫囚無異自佐史以上至於大吏皆權臣之黨曲陽侯根前為三公輔政知趙昭儀殺皇子不輒白奏反與趙氏比周恣意妄行譖愬故許後被加以非罪誅破諸許族敗元帝外家內嫉妒同產兄姊紅陽侯立及淳於氏皆老被放棄新喋血京師威權可畏高陽侯薛宣有不養母之名安昌侯張禹奸人之雄惑亂朝廷使先帝負謗於海內尤不可不慎陛下初即位謙讓未皇孤獨特立莫可據杖權臣易世意若探湯宜蚤以義割恩安百姓心竊見朱博忠信勇猛材略不世出誠國家雄俊之寶臣也宜徵博置左右以填天下此人在朝則陛下可高枕而臥矣昔諸呂欲危劉氏賴有高祖遺臣周勃陳平尚存不者幾為奸臣笑見漢書杜周附傳奏事伏聞東平國無鹽縣山中有大石無故一夕自起立臣業愚以為石者陰類殆有微人當超口者漢興以來今再見矣其一正以孝昭皇帝無繼嗣見今又復以陛下無繼嗣見甚可為寒心見北堂書鈔影宋本一百六十引漢名臣奏河閒獻王經術通明積德累行天下雄俊眾儒皆歸之孝武帝時獻王朝被服造次必於仁義問以五策獻王輒對無窮孝武帝艴然難之謂獻王曰湯以七十里文王以百里王其勉之王知其意歸即縱酒聽樂因以終見史記五宗世家集解禦覽一百五十一並引漢名臣奏說成帝紹封功臣昔唐以萬國致時雍之政虞夏以多群后饗共已之治湯法三聖殷氏太平周封八百重譯來賀是以內恕之君樂繼絕世隆名之主安立亡國至於不及下車德念深矣成王察牧野之克顧群后之勤知其恩結於民心功光於王府也故追述先父之志錄遺老之策高其位大其㝢愛敬飭盡命錫備厚大孝之隆於是為至及其沒也世主歎其功無民而不思所息之樹且猶不伐況其廟乎是以燕齊之祀與周竝傳子繼弟及歷載不墮豈無刑辟繇祖之竭力故支庶賴焉逮漢功臣亦皆剖符世爵受山河之誓存以著其號亡以顯其魂賞亦不細矣百餘年閒而襲封者盡或絕失姓或乏無主朽骨孤於墓曲裔流於道生為愍隸死為轉屍以往況今甚可悲傷聖朝憐閔詔求其後四方忻忻靡不歸心出入數年而不省察恐議者不思大義設言虛亡則厚德掩息遴柬布章非所以示化勸後也三人為眾雖難盡繼宜從尤功見漢書高惠高后文功臣表序
