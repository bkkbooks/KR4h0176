body:
  text: 楊敞奏廢昌邑王丞相臣敞大司馬大將軍臣光車騎將軍臣安世度遼將軍臣明友前將軍臣增後將軍臣充國禦史大夫臣誼宜春侯臣談當塗侯臣聖隨桃侯臣昌樂杜侯臣屠耆堂太僕臣延年太常臣昌大司農臣延年宗正臣德少府臣樂成廷尉臣光執金吾臣延壽大鴻臚臣賢左馮翊臣廣明右扶風臣德長信少府臣嘉典屬國臣武京輔都尉臣廣漢司隸校尉臣辟兵諸吏文學光祿大夫臣遷臣畸臣吉臣賜臣管臣勝臣梁臣長幸臣夏侯勝大中大夫臣德臣卬昧死言皇太后陛下臣敞等頓首死罪天子所以永保宗廟總一海內者以慈孝禮誼賞罰為本孝昭皇帝早棄天下亡嗣臣敞等議禮曰為人後者為之子也昌邑王宜嗣後遣宗正大鴻臚光祿大夫奉節使徵昌邑王典喪服斬縗亡悲哀之心廢禮誼居道上不素食使從官略女子載衣車內所居傳舍始至謁見立為皇太子常私買雞豚以食受皇帝信璽行璽大行前就次發璽不封從官更持節引內昌邑從官騶宰官奴二百餘人常與居禁闥內敖戲自之符璽取節十六朝暮臨令從官更持節從為書曰皇帝問侍中君卿使中禦府令高昌奉黃金千斤賜君卿取十妻大行在前殿發樂府樂器引內昌邑樂人擊鼓歌吹作俳倡會下還上前殿擊鐘磬召內泰一宗廟樂人輦道牟首鼓吹歌舞悉奏衆樂發長安廚三太牢具祠閣室中祀已與從官飲啖駕法駕皮軒鸞旗驅馳北宮桂宮弄彘鬭虎召皇太后禦小馬車使官奴騎乘遊戲掖庭中與孝昭皇帝宮人蒙等淫亂詔掖庭令敢泄言要斬取諸侯王列侯二千石綬及墨綬黃綬以並佩昌邑郎官者免奴變易節上黃旄以赤發禦府金錢刀劍玉器采繒賞賜所與遊戲者與從官官奴夜飲湛沔於酒詔太官上乘輿食如故食監奏未釋服未可禦故食復詔太官趣具無關食監太官不敢具即使從官出買雞豚詔殿門內以為常獨夜設九賓溫室延見姊夫昌邑關內侯祖宗廟祠未舉為璽書使使者持節以三太牢祠昌邑哀王園廟稱嗣子皇帝受璽以來二十七日使者旁午持節詔諸官署徵發凡千一百二十七事文學光祿大夫夏侯勝等及侍中傅嘉數進諫以過失使人簿責勝縛嘉繫獄荒淫迷惑失帝王禮誼亂漢制度臣敞等數進諫不變更日以益甚恐危社稷天下不安臣敞等謹與博士臣霸臣雋舍臣德臣虞舍臣射臣倉議皆曰高皇帝建功業為漢太祖孝文皇帝慈仁節儉為太宗今陛下嗣孝昭皇帝後行淫辟不軌詩云籍曰未知亦既抱子五辟之屬莫大不孝周襄王不能事母春秋曰天王出居於鄭繇不孝出之絶之於天下也宗廟重於君陛下未見命高廟不可以承天序奉祖宗廟子萬姓當廢臣請有司禦史大夫臣誼宗正臣德太常臣昌與太祝以一太牢具告祠高廟臣敞等昧死以聞見漢書霍光傳奏立皇曾孫禮曰人道親親故尊祖尊祖故敬宗大宗無嗣擇支子孫賢者為嗣孝武皇帝曾孫病已武帝時有詔掖庭養視至今年十八師受詩論語孝經躬行節儉慈仁愛人可以嗣孝昭皇帝後奉承祖宗廟子萬姓臣昧死以聞見漢書霍光傳報孫會宗書惲材朽行穢文質無所底幸賴先人餘業得備宿衛遭遇時變以獲爵位終非其任卒與禍會足下哀其愚蒙賜書教督以所不及殷勤甚厚然竊恨足下不深惟其終始而猥隨俗之毀譽也言鄙陋之愚心若逆指而文過默而息乎恐違孔氏各言爾志之義故敢略陳其愚唯君子察焉惲家方隆盛時乘朱輪者十人位在列卿爵為通侯總領從官與聞政事曾不能以此時有所建明以宣德化又不能與群僚同心並力陪輔朝廷之遺忘已負竊位素餐之責久矣懷祿貪勢不能自退遭遇變故橫被口語身幽北闕妻子滿獄當此之時自以夷滅不足以塞責豈意得全首領復奉先人之丘墓乎伏惟聖主之恩不可勝量君子遊道樂以忘憂小人全軀説以忘罪竊自思念過已大矣行已虧矣長為農夫以沒世矣是故身率妻子戮力耕桑灌園治産以給公上不意當復用此為譏議也夫人情所不能止者聖人弗禁故君父至尊親送其終也有時而既臣之得罪已三年矣田家作苦歲時伏臘亨羊炮羔鬥酒自勞家本秦也能為秦聲婦趙女也雅善鼓瑟奴婢歌者數人酒後耳熱仰天拊缶而呼烏烏其詩曰田彼南山蕪穢不治種一頃豆落而為萁人生行樂耳須富貴何時是日也拂衣而喜奮褎低卬頓足起舞誠淫荒無度不知其不可也惲幸有餘祿方糴賤販貴逐什一之利此賈豎之事汙辱之處惲親行之下流之人罪毀所歸不寒而栗雖雅知惲者猶隨風而靡尚何稱譽之有董生不云乎明明求仁義常恐不能化民者卿大夫之意也明明求財利常恐困乏者庶人之事也故道不同不相為謀今子尚安得以卿大夫之制而責僕哉夫西河魏土文侯所興有段幹木田子方之遺風漂然皆有節概知去就之分頃者足下離舊土臨安定安定山谷之間昆戎舊壤子弟貪鄙豈習俗之移人哉於今乃睹子之志矣方當盛漢之隆願勉旃毋多談見漢書楊敞傳文選間居養羊酤酪以供伏臘之費見禦覽三十一上書預推昌邑王宣帝事先師董仲舒有言雖有繼體守文之君不害聖人之受命漢家堯後有傳國之運漢帝宜誰差天下求索賢人袒以帝位而退自封百里如殷周二王後以承順天命見漢書眭弘傳上書言宜尚德緩刑臣聞齊有無知之禍而桓公以興晉有驪姬之難而文公用伯近世趙王不終諸呂作亂而孝文為太宗由是觀之禍亂之作將以開聖人也故桓文扶微興壞尊文武之業澤加百姓功潤諸侯雖不及三王天下歸仁焉文帝永思至德以承天心崇仁義省刑罰通關梁一遠近敬賢如大賓愛民如赤子內恕情之所安而施之於海內是以囹圄空虛天下太平夫繼變化之後必有異舊之恩此賢聖所以昭天命也往者昭帝即世而無嗣大臣憂戚焦心合謀皆以昌邑尊親援而立之然天不授命淫亂其心遂以自亡深察禍變之故乃皇天之所以開至聖也故大將軍受命武帝股肱漢國披肝膽決大計黜亡義立有德輔天而行然後宗廟以安天下鹹寧臣聞春秋正即位大一統而慎始也陛下初登至尊與天合符宜改前世之失正始受之統滌煩文除民疾存亡繼絶以應天意臣聞秦有十失其一尚存治獄之吏是也秦之時羞文學好武勇賤仁義之士貴治獄之吏正言者謂之誹謗遏過者謂之妖言故盛服先生不用於世忠良切言皆鬱於胸譽諛之聲日滿於耳虛美熏心實禍蔽塞此乃秦之所以亡天下也方今天下賴陛下恩厚亡金革之危飢寒之患父子夫妻戮力安家然太平未洽者獄亂之也夫獄者天下之大命也死者不可復生絶者不可復屬書曰與其殺不辜寧失不經今治獄吏則不然上下相驅以刻為明深者獲公名平者多後患故治獄之吏皆欲人死非憎人也自安之道在人之死是以死人之血流離於市被刑之徒比肩而立大辟之計歲以萬數此仁聖之所以傷也太平之未洽凡以此也夫人情安則樂生痛則思死捶楚之下何求而不得故囚人不勝痛則飾辭以視之吏治者利其然則指道以明之上奏畏卻則鍛練而周內之蓋奏當之成雖咎繇聽之猶以為死有餘辜何則成練者衆文致之罪明也是以獄吏專為深刻殘賊而亡極偷為一切不顧國患此世之大賊也故俗語曰畫地為獄議不入刻木為吏期不對此皆疾吏之風悲痛之辭也故天下之患莫深於獄敗法亂正離親塞道莫甚乎治獄之吏此所謂一尚存者也臣聞烏鳶之卵不毀而後鳳皇集誹謗之罪不誅而後良言進故古人有言山藪臧疾川澤納汙瑾瑜匿惡國君含詬唯陛下除誹謗以招切言開天下之口廣針諫之路掃亡秦之失尊文武之德省法制寬刑罰以廢治獄則太平之風可興於世永履和樂與天亡極天下幸甚見漢書路溫舒傳又見説苑貴德少篇首二百五十字奏平千王元不宜立嗣元前以刃賊殺奴婢子男殺謁者為刺史所舉奏罪名明白病先令令能為樂奴婢從死迫脅自殺者凡十六人暴虐不道故春秋之義誅君之子不宜立元雖未伏誅不宜立嗣見漢書景十三王傳上書言不宜更曆曆者天地之大紀上帝所為傳黃帝調曆漢元帝以來用之今陰陽不調宜更曆過也見漢書律曆志劾張壽王壽王吏八百古之大夫服儒衣誦不祥之辭作妖言欲亂制度不道見漢書律曆志上疏諫昌邑王臣聞古者師日行三十里吉行五十里詩云匪風發兮匪車揭兮顧瞻周道中心怛兮説曰是非古之風也發發者是非古之車也揭揭者蓋傷之也今者大王幸方與曾不半日而馳二百里百姓頗廢耕桑治道牽馬臣愚以為民不可數變也昔召公述職當民事時舍于棠下而聽斷焉是時人皆得其所後世思其仁恩至乎不伐甘棠甘棠之詩是也大王不好書術而樂逸遊馮式撙銜馳騁不止口倦乎叱吒手苦於箠轡身勞乎車輿朝則冒霧露晝則被塵埃夏則為大暑之所暴炙冬則為風寒之所匽薄數以耎脆之玉體犯勤勞之煩毒非所以全壽命之宗也又非所以進仁義之隆也夫廣夏之下細旃之上明師居前勤誦在後上論唐虞之際下及殷周之盛考仁聖之風習治國之道欣欣焉發憤忘食日新厥德其樂豈徒銜橛之間哉休則俯仰詘信以利形進退步趨以實下吸新吐故以練臧專意積精以適神於以間養生豈不長哉大王誠留意如此則心有堯舜之志體有喬松之壽美聲廣譽登而上聞則福祿其轃而社稷安矣皇帝仁聖至今思慕未怠於宮館囿池戈獵之樂未有所幸大王宜夙夜念此以承聖意諸侯骨肉莫親大王大王於屬則子也於位則臣也一身而二任之責加焉恩愛行義孅介有不具者於以上聞非享國之福也臣吉愚戇願大王察之見漢書王吉傳奏書戒昌邑王臣聞高宗諒暗三年不言今大王以喪事徵宜日夜哭泣悲哀而已慎毋有所發且何獨喪事凡南面之君何言哉天不言四時行焉百物生焉願大王察之大將軍仁愛勇智忠信之德天下莫不聞事孝武皇帝二十餘年未嘗有過先帝棄群臣屬以天下寄幼孤焉大將軍抱持幼君繈褓之中布政施教海內晏然雖周公伊尹亡以加也今帝崩亡嗣大將軍惟思可以奉宗廟者攀援而立大王其仁厚豈有量哉臣願大王事之敬之政事一聽之大王垂拱南面而已願留意常以為念見漢書王吉傳上宣帝疏言得失陛下躬聖質總萬方帝王圖籍日陳於前惟思世務將興太平詔書每下民欣然若更生臣伏而思之可謂至恩未可謂本務也欲治之主不世出公卿幸得遭遇其時言聽諫從然未有建萬世之長策舉明主於三代之隆者也其務在於期會簿書斷獄聽訟而已此非太平之基也臣聞聖王宣德流化必自近始朝廷不備難以言治左右不正難以化遠民者弱而不可勝愚而不可欺也聖主獨行於深宮得則天下稱誦之失則天下鹹言之行發於近必見於遠故謹選左右審擇所使左右所以正身也所使所以宣德也詩云濟濟多士文王以寧此其本也春秋所以大一統者六合同風九州共貫也今俗吏所以牧民者非有禮義科指可世世通行者也獨設刑法以守之其欲治者不知所繇以意穿鑿各取一切權譎自在故一變之後不可復修也是以百里不同風千里不同俗戶異政人殊服詐偽萌生刑罰亡極質朴日銷恩愛寖薄孔子曰安上治民莫善於禮非空言也王者未制禮之時引先王禮宜於今者而用之臣願陛下承天心發大業與公卿大臣延及儒生述舊禮明王制驅一世之民躋之仁壽之域則俗何以不若成康壽何以不若高宗竊見當世趨務不合於道者謹條奏唯陛下財擇焉見漢書王吉傳又略見禮樂志夫婦人倫大綱夭壽之萌也世俗嫁娶太早未知為人父母之道而有子是以教化不明而民多夭聘妻送女亡節則貧人不及故不舉子又漢家列侯尚公主諸侯則國人承翁主使男事女夫詘於婦逆陰陽之位故多女亂古者衣服車馬貴賤有章以褒有德而別尊卑今上下僭差人人自製是以貪財誅利不畏死亡周之所以能致治刑措而不用者以其禁邪於冥冥絶惡於未萌也舜湯不用三公九卿之世而舉皋陶伊尹不仁者遠今使俗吏得任子弟率多驕驁不通古今至於積功治人亡益於民此伐檀所為作也宜明選求賢除任子之令外家及故人可厚以財不宜居位去角抵減樂府省尚方明視天下以儉古者工不造雕瑑商不通侈靡非工商之獨賢政教使之然也民見儉則歸本本立而末成見漢書王吉傳諭指淮陽王欽禮為諸侯制相朝聘之義蓋以考禮一德尊事天子也且王不學詩乎詩云俾侯於魯為周室輔今王舅博數遺王書所言勃逆王幸受詔策通經術知諸侯名譽不當出竟天子普覆德布於朝而恬有博言多豫金錢與相報應不忠莫大焉故事諸侯王獲罪京師罪惡輕重縱不伏誅必蒙遷削貶黜之罪未有但己者也今聖主赦王之罪又憐王失計忘本為博所惑加賜璽書使諫大夫申諭至意殷勤之恩豈有量哉博等所犯罪惡大郡下之所共攻王法之所不赦也自今以來王毋復以博等纍心務與衆棄之春秋之義大能變改易曰藉用白茅無咎言臣子之道改過自新潔已以承上然後免於咎也王其留意慎戒惟思所以悔過易行塞重責稱厚恩者如此則長有富貴社稷安矣見漢書宣元六王淮陽王欽傳劾奏匡衡監臨盜所主守直千金以上春秋之義諸侯不得專地所以一統尊法制也衡位三公輔國政領計簿知郡實正國界計簿已定而背法制專地盜土以自益及賜明阿承衡意猥舉郡計亂減縣界附下罔上擅以地附益大臣皆不道見漢書匡衡傳奏考問楊惲罪惲不服罪而召戶將尊欲令戒飭富平侯延壽曰太僕定有死罪數事朝暮人也惲幸與富平侯婚姻今獨三人坐語侯言時不聞惲語自與大僕相觸也尊曰不可惲怒持大刀曰蒙富平侯力得族罪毋泄惲語令太僕聞之亂餘事惲幸得列九卿諸吏宿衛近臣上所信任與聞政事不竭忠愛盡臣子義而妄怨望稱引為訞惡言大逆不道請逮捕治見漢書楊敞傳奏劾代王年年為太子時與女弟則私通及年立為王後則懷年子其壻使勿舉則曰自來殺之壻怒曰為王生子自令王家養之則送兒頃太后所相聞知禁止則令不得入宮年使從季父往來送迎則連年不絶見漢書文三王傳地節中冀州刺史林奏蠅矢對陛下之詩不云乎營營青蠅至於藩愷悌君子毋信讒言陛下左側讒人衆多如是青蠅惡矣宜進先帝大臣子孫親近以為左右如不忍昌邑故人信用讒諛必有凶咎願詭禍為福皆放逐之臣當先逐矣見漢書武五子傳劾奏霍光光擅廢立亡人臣禮不道見漢書嚴延年傳報張敞書河南天下喉咽二周餘斃莠盛苗穢何可不鉏也見漢書嚴延年傳
