body:
  text: 蕭望之上疏請選諫官陛下哀湣百姓恐德化之不究悉出諫官以補郡吏所謂憂其末而忘其本者也朝無爭臣則不知過過無達士則不聞善願陛下選明經術溫故知新通於幾微謀慮之士以為內臣與參政事諸侯聞之則知國家納諫憂政亡有闕遺若此不怠成康之道其庶幾乎外郡不治豈足憂哉見漢書蕭望之傳建白宜罷中書宦官尚書百官之本國家樞機宜以通明公正處之武帝遊宴後庭故用宦者非古制也宜罷中書宦官應古不近刑人見漢書石顯傳劾奏趙廣漢廣漢摧辱大臣欲以劫持奉公逆節傷化不道見漢書趙廣漢傳奏駁耿壽昌增海租及近糴計故禦史屬徐宮家在東萊言往年加海租魚不出長老皆言武帝時縣官嘗自漁海魚不出後復豫民魚乃出夫陰陽之感物類相應萬事盡然今壽昌欲近糴漕關內之穀築倉治船費直二萬萬餘有動衆之功恐生旱氣民被其災壽昌習于商功分銖之事其深計遠慮誠未足任宜且如故見漢書食貨志奏言三公非其人百姓或乏困盜賊未止二千石多材下不任職三公非其人則三光為之不明今首歲日月少光咎在臣等見漢書蕭望之傳馮奉世封爵議奉世奉使有指而擅矯制違命發諸國兵雖有功效不可以為後法即封奉世開後奉使者利以奉世為比爭逐發兵要功萬里之外為國家生事於夷狄漸不可長奉世不宜受封見漢書馮奉世傳駁張敞入穀贖罪議民函陰陽之氣有好義欲利之心在教化之所助堯在上不能去民欲利之心而能令其欲利不勝其好義也雖桀在上不能去民好義之心而能令其好義不勝其欲利也故堯桀之分在於義利而已道民不可不慎也今欲令民量粟以贖罪如此則富者得生貧者獨死是貧富異刑而法不一也人情貧窮父兄囚執聞出財得以生活為人子弟者將不顧死亡之患敗亂之行以赴財利求救親戚一人得生十人以喪如此伯夷之行壞公綽之名滅政教一傾雖有周召之佐恐不能復古者藏財於民不足則取有餘則豫詩曰爰及矜人哀此鰥寡上惠下也又曰雨我公田遂及我私下急上也今有西邊之役民失作業雖戶賦口斂以贍其困乏古之通義百姓莫以為非以死救生恐未可也陛下布德施教教化既成堯舜亡以加也今議開利路以傷既成之化臣竊痛之見漢書蕭望之傳又見荀悅漢紀又見藝文類聚五十四對兩府難問入穀贖罪議先帝聖德賢良在位作憲垂法為無窮之規永惟邊竟之不贍故金布令甲曰邊郡數被兵離饑寒夭絶天年父子相失令天下共給其費固為軍旅卒暴之事也聞天漢四年常使死罪人入五十萬錢減死罪一等豪強吏民請奪假貣至為盜賊以贖罪其後姦邪橫暴群盜竝起至攻城邑殺郡守充滿山谷吏不能禁明詔遣繡衣使以興兵擊之誅者過半然後衰止愚以為此使死罪贖之敗也故曰不便見漢書蕭望之傳烏孫元貴靡尚少主議烏孫絶域信其美言萬裏結婚非長策也見漢書蕭望之傳又西域傳下烏孫持兩端亡堅約其效可見前少主在烏孫四十餘年恩愛不親密邊境未以安此已事之驗也今少主以元貴靡不得立而還信無負於四夷此中國之大福也少主不止繇役將興其原起此見漢書蕭望之傳又見西域傳下小異對詔問因亂滅胸奴議春秋晉士丐帥師侵齊聞齊侯卒引師而還君子大其不伐喪以為恩足以服孝子誼足以動諸侯前單於慕化鄉善稱弟遣使請求和親海內欣然夷狄莫不聞未終奉約不幸為賊臣所殺今而伐之是乘亂而幸災也彼必奔走遠遁不以義動兵恐勞而無功宜遣使者弔問輔其微弱救其災患四夷聞之鹹貴中國之仁義如遂蒙恩得復其位必稱臣服從此德之盛也見漢書蕭望之傳五鳳中胸奴大亂議者多日胸奴為害日久可因其壞亂舉兵滅之詔遣問望之計策望之對云云上從其議單于朝儀議單于非正朔所加故稱敵國宜待以不臣之禮位在諸侯王上外夷稽首稱藩中國讓而不臣此則羈縻之誼謙亨之福也書曰戎狄荒服言其來服荒忽亡常如使胸奴後嗣卒有鳥竄鼠伏闕於朝享不為畔臣信讓行乎蠻貉福祚流於亡窮萬世之長策也見漢書蕭望之傳戎狄荒服言其來服荒忽無常時至時去宜待以客禮讓而不臣如其後嗣𨔵逃竄伏使於中國不為叛臣見漢書胸奴傳贊案此約文與本傳小異故竝録之雨雹對春秋昭公三年大雨雹是時季氏專權卒逐昭公鄉使魯君察於天變宜亡此害今陛下以聖德居位思政求賢堯舜之用心也然而善祥未臻陰陽不和是大臣任政一姓擅勢之所致也附枝大者賊本心私家盛者公室危唯明主躬萬機選同姓舉賢材以為腹心與參政謀令公卿大臣朝見奏事明陳其職以考功能如是則庶事理公道立姦邪塞私權廢矣見漢書蕭望之傳奏封事薦馮野王野王行能高妙內足與圖身外足以慮化竊惜野王懷國之寶而不得陪朝廷與朝者竝野王前以王舅出以賢復入明國家樂進賢也見漢書馮奉世附傳上書言昌邑王賀賀天之所棄陛下至仁復封為列侯賀嚚頑放廢之人不宜得奉宗廟朝聘之禮見漢書武五子昌邑王傳待中衛尉金安上上書言奏可奏昌邑王賀罪賀與故太守卒史孫萬世交通萬世問賀前見廢時何不堅守毋出宮斬大將軍而聽人奪璽綬乎賀曰然失之萬世又以賀且王豫章不久為列侯賀曰且然非所宜言見漢書武五子昌邑王傳奏絶昌邑王後舜封象於有鼻死不為置後以為暴亂之人不宜為太祖海昏侯賀死上當為後者子充國充國死復上弟奉親奉親復死是天絶之也陛下聖仁於賀甚厚雖舜於象無以加也宜以禮絶賀以奉天意願下有司議見漢書武五子傳上書請益車師田卒車師去渠犂千餘里間以河山北近胸奴漢兵在渠犂者勢不能相救願益田卒見漢書西域傳下奏擊罕幵郡兵皆屯備南山北邊空虛勢不可久或曰至秋冬乃進兵此虜在竟外之冊今虜朝夕為寇土地寒苦漢馬不能冬屯兵在武威張掖酒泉萬騎以上皆多羸瘦可益馬食以七月上旬齎三十日糧分兵竝出張掖酒泉合擊罕幵在鮮水上者虜以畜産為命今皆離散兵即分出雖不能盡誅亶奪其畜産虜其妻子復引兵還冬復擊之大兵仍出虜必震壞見漢書趙充國傳上書理劉輔臣聞明主垂寬容之聽崇諫爭之官廣開忠直之路不罪狂狷之言然後百僚在位竭忠盡謀不懼後患朝廷無讇諛之士元首無失道之愆竊見諫大夫劉輔前以縣令求見擢為諫大夫此其言必有卓詭切至當聖心者故得拔至於此旬日之間收下祕獄臣等愚以為輔幸得託公族之親在諫臣之列新從下土來未知朝廷體獨觸忌諱不足深過小罪宜隱忍而已如有大惡宜暴治理官與衆共之昔趙簡子殺其大夫鳴犢孔子臨河而還今天心未豫災異屢降水旱疊臻方當隆寬廣問褒直盡下之時也而行慘急之誅於諫爭之臣震驚群下失忠直心假令輔不坐直言所坐不著天下不可戶曉同姓近臣本以言顯其於治親養忠之義誠不宜幽囚於掖庭獄公卿以下見陛下進用輔亟而折傷之暴人有懼心精鋭銷耎莫敢盡節正言非所以昭有虞之聽廣德美之風也臣等竊深傷之唯陛下留神省察見漢書劉輔傳劾劉更生更生前為九卿坐與望之堪謀排車騎將軍高許史氏侍中者毀離親戚欲退去之而獨專權為臣不忠幸不伏誅復蒙恩徵用不悔前過而教令人言變事誣罔不道見漢書楚元王交附傳奏發陳咸朱雲事鹹宿衛執法之臣幸得進見漏泄所聞以私語雲為定奏草欲令自下治後知雲亡命罪人而與交通雲以故不得上見漢書朱雲傳案顏師古以上字屬下文誤罷郡國廟議臣聞祭非自外至者也繇中出生於心也故唯聖人為能饗帝孝子為能饗親立廟京師之居躬親承事四海之內各以其職來助祭尊親之大義五帝三王所共不易之道也詩云有來雍雍至止肅肅相維辟公天子穆穆春秋之義父不祭於支庶之宅君不祭於臣僕之家王不祭於下土諸侯臣等愚以為宗廟在郡國宜無修臣請勿復修見漢書韋賢傳毀廟議禮王者始受命諸侯始封之君皆為太祖以下五廟而疊毀毀廟之主臧乎太祖五年而再殷祭言一禘一祫也祫祭者毀廟與未毀廟之主皆合食於太祖父為昭子為穆孫復為昭古之正禮也祭義曰王者禘其祖自出以其祖配之而立四廟言始受命而王祭天以其祖配而不為立廟親盡也立親廟四親親也親盡而疊毀親疏之殺示有終也周之所以七廟者以後稷始封文王武王受命而王是以三廟不毀與親廟四而七非有後稷始封文武受命之功者皆當親盡而毀成王成二聖之業制禮作樂功德茂盛廟猶不世以行為諡而已禮廟在大門之內不敢遠親也臣愚以為高帝受命定天下宜為帝者太祖之廟世世不毀承後屬盡者宜毀今宗廟異處昭穆不序宜入就太祖廟而序昭穆如禮太上皇孝惠孝文孝景廟皆親盡宜毀皇考廟親未盡如故見漢書韋賢傳毀廟遷主議祖宗之廟世世不毀繼祖以下五廟而迭毀今高皇帝為太祖孝文皇帝為太宗孝景皇帝為昭孝武皇帝為穆孝昭皇帝與孝宣皇帝俱為昭皇考廟親未盡太上孝惠廟皆親盡宜毀太上廟主宜瘞園孝惠皇帝為穆主遷於太祖廟寢園皆無復修見漢書韋賢傳復言罷文昭太后寢祠園古者制禮別尊卑貴賤國君之母非適不得配食則薦於寢身沒而已陛下躬至孝承天心建祖宗定迭毀序昭穆大禮既定孝文太后孝昭太后寢祠園宜如禮勿復修見漢書韋賢傳上疏言宜聽韋玄成讓襲爵聖王貴以禮讓為國宜優養玄成勿枉其志使得自安衡門之下見漢書韋賢傳上疏告楊惲罪高昌車奔入北掖門惲語富平侯張延壽曰聞前有奔車抵殿門門關折馬死而昭帝崩今復如此天時非人力也左馮翊韓延壽有罪下獄惲上書訟延壽郎中丘常謂惲曰聞君侯訟韓馮翊當得活乎惲曰事何容易脛脛者未必全也我不能自保真人所謂鼠不容穴銜窶數者也又中書謁者令宣持單于使者語視諸將軍中朝二千石惲曰冒頓單於得漢美食好物謂之殠惡單於不來明甚惲上觀西閣上畫人指桀紂畫謂樂昌侯王武曰天子過此一二問其過可以得師矣畫人有堯舜禹湯不稱而舉桀紂惲聞胸奴降者道單於見殺惲曰得不肖君大臣為畫善計不用自令身無處所若秦時但任小臣誅殺忠良竟以滅亡令親任大臣即至今耳古與今如一丘之貉惲妄引亡國以誹謗當世無人臣禮又語長樂曰正月以來天陰不雨此春秋所記夏侯君所言行必不至河東矣以主上為戲語尤悖逆絶理見漢書楊敞傳與蓋寬饒書明主知君潔白公正不畏彊禦故命君以司察之位擅君以奉使之權尊官厚祿已施於君矣君宜夙夜惟思當世之務奉法宣化憂勞天下雖日有益月有功猶未足以稱職而報恩也自古之治三王之術各有制度今君不務循職而已乃欲以太古久遠之事匡拂天子數進不用難聽之語以摩切左右非所以揚令名全壽命者也方今用事之人皆明習法令言足以飾君之辭文足以成君之過君不惟蘧氏之高蹤而慕子胥之末行用不訾之軀臨不測之險竊為君痛之夫君子直而不挺曲而不詘大雅云既明且哲以保其身狂夫之言聖人擇焉唯裁省覽見漢書蓋寬饒傳奏封事方今聖道浸廢儒術不行以刑餘為周召以法律為詩書韓氏易傳言五帝官天下三王家天下家以傳子官以傳賢若四時之運功成者去不得其人則不居其位見漢書蓋寬饒傳請刪定律令疏聖主置諫爭之臣者非以崇德防逸豫之生也立法明刑者非以為治救衰亂之起也今明主躬垂明聽雖不置廷平獄將自正若開後嗣不若刪定律令律令一定愚民知所避姦吏無所弄矣今不正其本而置廷平以理其末也政衰聽怠則廷平將招權而為亂首矣見漢書刑法志上書理蓋寬饒臣聞山有猛獸藜藿為之不采國有忠臣姦邪為之不起司隸校尉寬饒居不求安食不求飽進有憂國之心退有死節之義上無許史之屬下無金張之託職在司察直道而行多仇少與上書陳國事有司劾以大辟臣幸得從大夫之後官以諫為名不敢不言見漢書蓋寬饒傳上元帝書諫射獵竊見關東困極人民流離陛下日撞亡秦之鐘聽鄭衛之樂臣誠悼之今士卒暴露從官勢倦願陛下反亟宮思與百姓同憂樂天下幸甚見漢書辥廣德傳奏劾蕭望之侍中謁者良使承制詔望之望之再拜已良與望之言望之不起因故下手而謂禦史曰良禮不備故事丞相病明日禦史大夫輒問病朝奏事會廷中差居丞相後丞相謝大夫少進揖今丞相數病望之不問病會廷中與丞相均禮時議事不合意望之曰侯年寧能父我邪知禦史有令不得擅使望之多使守史自給車馬之杜陵護視家事少史冠法冠為妻先引又使買賣私取附益凡十萬三千案望之大臣通經術居九卿之右本朝所仰至不奉法自修踞慢不遜攘受所監臧二百五十以上請逮捕繫治見漢書蕭望之傳與楊惲書大臣廢退當闔門惶懼為可憐之意不當治産業通賓客有稱譽見漢書楊敞傳戒子我死官屬即送汝財物慎毋受汝九卿儒者子孫以廉潔著可以自成見漢書儒林傳上疏言霍氏霍氏太盛陛下即厚愛之宜以時抑制無使至亡見漢書霍光傳
