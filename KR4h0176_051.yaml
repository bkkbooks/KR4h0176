body:
  text: 貢禹上書乞骸骨臣禹年老貧窮訾不滿萬錢妻子粳豆不贍裋褐不完有田百三十畝陛下過意徵臣臣賣田百畝以供車馬至拜為諫大夫秩八百石奉錢月九千二百廩食太官又蒙賞賜四時雜繒綿絮衣服酒肉諸果物德厚甚深疾病侍醫臨治賴陛下神靈不死而活又拜為光祿大夫秩二千石奉錢月萬二千祿賜愈多家日以益富身日以益尊誠非草茅愚臣所當蒙也伏自念終亡以報厚德日夜慚愧而已臣禹犬馬之齒八十一血氣衰竭耳目不聰明非復能有補益所謂素餐尸祿汙朝之臣也自痛去家三千里凡有一子年十二非有在家為臣具棺椁者也誠恐一旦蹎仆氣竭不復自還汙席薦於宮室骸骨棄捐孤魂不歸不勝私願願乞骸骨及身生歸鄉裏死亡所恨見漢書貢禹傳口錢古者亡賦算口錢起武帝征伐四夷重賦於民民産子三歲則出口錢故民重困至於生子輒殺甚可悲痛宜令兒七歲去齒乃出口錢年二十乃算見漢書貢禹傳錢幣古者不以金錢為幣專意於農故一夫不耕必有受其飢者今漢家鑄錢及諸鐵官皆置吏卒徒攻山取銅鐵一歲功十萬人已上中農食七人是七十萬人常受其飢也鑿地數百丈銷陰氣之精地臧空虛不能含氣出雲斬伐林木亡有時禁水旱之災未必不繇此也自五銖錢起已來七十餘年民坐盜鑄錢被刑者衆富人積錢滿室猶亡厭足民心動搖商賈求利東西南北各用智巧好衣美食歲有十二之利而不出租稅農夫父子暴露中野不避寒暑捽草杷土手足胼胝已奉穀租又出稿稅鄉部私求不可勝供故民棄本逐末耕者不能半貧民雖賜之田猶賤賣以賈窮則起為盜賊何者末利深而惑於錢也是以姦邪不可禁其原皆起於錢也疾其末者絶其本宜罷採珠玉金銀鑄錢之官亡復以為幣市井勿得販賣除其租銖之律租稅祿賜皆以布帛及穀使百姓一歸於農復古道便見漢書貢禹傳又略見食貨志減宮衛免諸官奴婢諸離宮及長樂宮衛可減其大半以寬繇役又諸官奴婢十萬餘人戲遊亡事稅良民以給之歲費五六巨萬宜免為庶人廩食見漢書貢禹傳戍卒令代關東戍卒乘北邊亭塞侯望見漢書貢禹傳私販賣令近臣自諸曹侍中以上家亡得私販賣與民爭利犯者輒免官削爵不得仕宦見漢書貢禹傳贖罪孝文皇帝時貴廉潔賤貪汙賈人贅壻及吏坐贓者皆禁錮不得為吏賞善罰惡不阿親戚罪白者伏其誅疑者以與民亡贖罪之法故令行禁止海內大化天下斷獄四百與刑錯亡異武帝始臨天下尊賢用士闢地廣境數千里自見功大威行遂從耆欲用度不足乃行一切之變使犯法者贖罪入穀者補吏是以天下奢侈官亂民貧盜賊並起亡命者衆郡國恐伏其誅則擇便巧史書習於計簿能欺上府者以為右職姦軌不勝則取勇猛能操切百姓者以苛暴威服下者使居大位故亡義而有財者顯於世欺謾而善書者尊於朝悖逆而勇猛者貴於官故俗皆曰何以孝弟為財多而光榮何以禮義為史書而仕宦何以謹慎為勇猛而臨官故黥劓而髡鉗者猶復攘臂為政於世行雖犬彘家富勢足目指氣使是為賢耳故謂居官而置富者為雄桀處姦而得利者為壯士兄勸其弟父勉其子俗之壞敗乃至於是察其所以然者皆以犯法得贖罪求士不得真賢相守崇財利誅不行之所致也今欲興至治致太平宜除贖罪之法相守選舉不以實及有臧者輒行其誅亡但免官則爭盡力為善貴孝弟賤賈人進真賢舉實廉而天下治矣孔子匹夫之人耳以樂道正身不解之故四海之內天下之君微孔子之言亡所折中況乎以漢地之廣陛下之德處南面之尊秉萬乘之權因天地之助其於變世易俗調和陰陽陶冶萬物化正天下易於決流抑隊自成康以來幾且千歲欲為治者甚衆然而太平不復興者何也以其舍法度而任私意奢侈行而仁義廢也陛下誠深念高祖之苦醇法太宗之治正己以先下選賢以自輔開進忠正致誅姦臣遠放讇佞放出園陵之女罷倡樂絶鄭聲去甲乙之帳退偽薄之物修節儉之化驅天下之民皆歸於農如此不解則三王可侔五帝可及唯陛下留意省察天下幸甚見漢書貢禹傳又見藝文類聚五十四奏宜放古自節古者宮室有制宮女不過九人秣馬不過八匹牆塗而不雕木摩而不刻車輿器物皆不文畫苑囿不過數十里與民共之任賢使能什一而稅亡它賦斂繇戍之役使民歲不過三日千里之內自給千里之外各置貢職而已故天下家給人足頌聲並作至高祖孝文孝景皇帝循古節儉宮女不過十餘廄馬百餘匹孝文皇帝衣綈履革器亡雕文金銀之飾後世爭為奢侈轉轉益甚臣下亦相放效衣服履褲刀劍亂於主上主上時臨朝入廟衆人不能別異甚非其宜然非自知奢僭也猶魯昭公曰吾何僭矣今大夫僭諸侯諸侯僭天子天子過天道其日久矣承衰救亂矯復古化在於陛下臣愚以為盡如太古難宜少放古以自節焉論語曰君子樂節禮樂方今宮室已定亡可奈何矣其餘盡可減損故時齊三服官輸物不過十笥方今齊三服官作工各數千人一歲費數巨萬蜀廣漢主金銀器歲各用五百萬三工官官費五千萬東西織室亦然廄馬食粟將萬匹臣禹嘗從之東宮見賜杯案盡文畫金銀飾非當所以賜食臣下也東宮之費亦不可勝計天下之民所為大飢餓死者是也今民大飢而死死又不葬為犬豬食人至相食而廄馬食粟苦其大肥氣盛怒至乃日步作之王者受命於天為民父母固當若此乎天不見邪武帝時又多取好女至數十人以填後宮及棄天下昭帝幼弱霍光專事不知禮正妄多臧金錢財物鳥獸魚鱉牛馬虎豹生禽凡百九十物盡瘞臧之又皆以後宮女置於園陵大失禮逆天心又未必稱武帝意也昭帝晏駕光復行之至孝宣皇帝時陛下惡有所言群臣亦隨故事甚可痛也故使天下承化取女皆大過度諸侯妻妾或至數百人豪富吏民畜歌者至數十人是以內多怨女外多曠夫及衆庶葬埋皆虛地上以實地下其過自上生皆在大臣循故事之罪也唯陛下深察古道從其儉者大減損乘輿服禦器物三分去二子産多少有命審察後宮擇其賢者留二十人餘悉歸之及諸陵園女亡子者宜悉遣獨杜陵宮人數百誠可哀憐也廄馬可亡過數十匹獨舍長安城南苑地以為田獵之囿自城西南至山西至鄠皆復其田以與貧民方今天下飢饉可亡大自損減以救之稱天意乎天生聖人蓋為萬民非獨使自娛樂而已也故詩曰天難諶斯不易惟王上帝臨汝毋二爾心當仁不讓獨可以聖心參諸天地揆之往古不可與臣下議也若其阿意順指隨君上下臣禹不勝拳拳不敢不盡愚心見漢書貢禹傳奏請正定廟制古者天子七廟今孝惠孝景廟皆親盡宜毀及郡國廟不應古禮宜正定見漢書韋玄成傳送胸奴侍子議春秋之義許夷狄者不一而足今郅支單於鄉化未醇所在絶遠宜令使者送其子至塞而還見漢書陳湯傳上疏言政治得失臣聞五帝不同禮三王各異教民俗殊務所遇之時異也陛下躬聖德開太平之路閔愚吏民觸法抵禁比年大赦使百姓得改行自新天下幸甚臣竊見大赦之後姦邪不為衰止今日大赦明日犯法相隨入獄此殆導之未得其務也蓋保民者陳之以德義示之以好惡觀其失而制其宜故動之而和綏之而安今天下俗貪財賤義好聲色上侈靡廉恥之節薄淫辟之意縱綱紀失序疏者踰內親戚之恩薄婚姻之黨隆苟合徼幸以身設利不改其原雖歲赦之刑猶難使錯而不用也臣愚以為宜一曠然大變其俗孔子曰能以禮讓為國乎何有朝廷者天下之楨幹也公卿大夫相與循禮恭讓則民不爭好仁樂施則民不暴上義高節則民興行寬柔和惠則衆相愛四者明王之所以不嚴而成化也何者朝有變色之言則下有爭鬭之患上有自專之士則下有不讓之人上有克勝之佐則下有傷害之心上有好利之臣則下有盜竊之民此其本也今俗吏之治皆不本禮讓而上克暴或忮害好陷人於罪貪財而慕勢故犯法者衆姦邪不止雖嚴刑峻法猶不為變此非其天性有由然也臣竊考國風之詩周南召南被賢聖之化深故篤於行而廉於色鄭伯好勇而國人暴虎秦穆貴信而士多從死陳夫人好巫而民淫祀晉侯好儉而民畜聚太王躬仁邠國貴恕由此觀之治天下者審所上而已今之偽薄忮害不讓極矣臣聞教化之流非家至而人説之也賢者在位能者布職朝廷崇禮百僚敬讓道德之行由內及外自近者始然後民知所法遷善日進而不自知是以百姓安陰陽和神靈應而嘉祥見詩曰商邑翼翼四方之極壽考且寧以保我後生此成湯所以建至治保子孫化異俗而懷鬼方也今長安天子之都親承聖化然其習俗無以異於遠方郡國來者無所法則或見侈靡而放效之此教化之原本風俗之樞機宜先正者也臣聞天人之際精祲有以相蕩善惡有以相推事作乎下者象動乎上陰陽之理各應其感陰變則靜者動陽蔽則明者暗水旱之災隨類而至今關東連年飢饉百姓乏困或至相食此皆生於賦斂多民所共者大而吏安集之不稱之效也陛下祗畏天戒哀閔元元大自減損省甘泉建章宮衛罷珠崖偃武行文將欲度唐虞之隆絶殷周之衰也諸見罷珠崖詔書者莫不欣欣人自以將見太平也宜遂減宮室之度省靡麗之飾考制度修外內近忠正遠巧佞放鄭衛進雅頌舉異材開直言任溫良之人退刻薄之吏顯潔白之士昭無欲之路覽六藝之意察上世之務明自然之道博和睦之化以崇至仁匡失俗易民視令海內昭然鹹見本朝之所貴道德弘於京師淑問揚乎疆外然後大化可成禮讓可興也見漢書匡衡傳上疏言治性正家臣聞治亂安危之機在乎審所用心蓋受命之王務在創業垂統傳之無窮繼體之君心存於承宣先王之德而褒大其功昔者成王之嗣位思述文武之道以養其心休烈盛美皆歸之二後而不敢專其名是以上天歆享鬼神祐焉其詩曰念我皇祖陟降廷止言成王常思祖考之業而鬼神祐助其治也陛下聖德天覆子愛海內然陰陽未和姦邪未禁者殆論議者未丕揚先帝之盛功爭言制度不可用也務變更之所更或不可行而復復之是以群下更相是非吏民無所信臣竊恨國家釋樂成之業而虛為此紛紛也願陛下詳覽統業之事留神於遵制揚功以定群下之心大雅曰無念爾祖聿修厥德孔子著之孝經首章蓋至德之本也傳曰審好惡理情性而王道畢矣能盡其性然後能盡人物之性能盡人物之性可以贊天地之化治性之道必審己之所有餘而強其所不足蓋聰明疏通者戒於大察寡聞少見者戒於雍蔽勇猛剛強者戒於大暴仁愛溫良者戒於無斷湛靜安舒者戒於後時廣心浩大者戒於遺忘必審己之所當戒而齊之以義然後中和之化應而巧偽之徒不敢比周而望進唯陛下戒所以崇聖德臣又聞室家之道修則天下之理得故詩始國風禮本冠婚始乎國風原情性而明人倫也本乎冠婚正基兆而防未然也福之興莫不本乎室家道之衰莫不始乎梱內故聖王必慎妃後之際別適長之位禮之於內也卑不隃尊新不先故所以統人情而理陰氣也其尊適而卑庶也適子冠乎阼禮之用醴衆子不得與列所以貴正體而明嫌疑也非虛加其禮文而已乃中心與之殊異故禮探其情而見之外也聖人動靜遊燕所親物得其序得其序則海內自修百姓從化如當親者疏當尊者卑則佞巧之姦因時而動以亂國家故聖人慎防其端禁於未然不以私恩害公義陛下聖德純備莫不修正則天下無為而治詩云于以四方克定厥家傳曰正家而天下定矣見漢書匡衡傳上疏戒妃匹勸經學威儀之則陛下秉至孝哀傷思慕不絶於心未有遊虞弋射之宴誠隆於慎終追遠無窮已也竊願陛下雖聖性得之猶復加聖心焉詩云煢煢在疚言成王喪畢思慕意氣未能平也蓋所以就文武之業崇大化之本也臣又聞之師曰匹配之際生民之始萬福之原婚姻之禮正然後品物遂而天命全孔子論詩以關雎為始言太上者民之父母後夫人之行不侔乎天地則無以奉神靈之統而理萬物之宜故詩曰窈窕淑女君子好仇言能致其貞淑不二其操情欲之感無介乎容儀宴私之意不形乎動靜夫然後可以配至尊而為宗廟主此綱紀之首王教之端也自上世已來三代興廢未有不由此者也願陛下詳覽得失盛衰之效以定大基采有德戒聲色近嚴敬遠技能竊見聖德純茂專精詩書好樂無厭臣衡材駑無以輔相善義宣揚德音臣聞六經者聖人所以統天地之心著善惡之歸明吉凶之分通人道之正使不悖於其本性者也故審六藝之指則天人之理可得而和草木昆蟲可得而育此永永不易之道也及論語孝經聖人言行之要宜究其意臣又聞聖王之自為動靜周旋奉天承親臨朝享臣物有節文以章人倫蓋欽翼祗栗事天之容也溫恭敬遜承親之禮也正躬嚴恪臨衆之儀也嘉惠和説饗下之顏也舉錯動作物遵其儀故形為仁義動為法則孔子曰德義可尊容止可觀進退可度以臨其民是以其民畏而愛之則而象之大雅云敬慎威儀惟民之則諸侯正月朝覲天子天子惟道德昭穆穆以視之又觀以禮樂饗醴乃歸故萬國莫不獲賜祉福蒙化而成俗今正月初幸路寢臨朝賀置酒以饗萬方傳曰君子慎始願陛下留神動靜之節使群下得望盛德休光以立基楨天下幸甚見漢書匡衡傳奏免陳湯湯以吏二千石奉使顓命蠻夷中不正身以先下而盜所收康居財物戒官屬曰絶域事不覆校雖在赦前不宜處位見漢書匡衡傳奏徙南北郊帝王之事莫大乎承天之序承天之序莫重於郊祀故聖王盡心極慮以建其制祭天於南郊就陽之義也瘞地於北郊即陰之象也天之於天子也因其所都而各饗焉往者孝武皇帝居甘泉宮即於雲陽立泰畤祭於宮南今行常幸長安郊見皇天反北之泰陰祠後土反東之少陽事與古制殊又至雲陽行溪穀中厄陝且百里汾陰則渡大川有風波舟楫之危皆非聖主所宜數乘郡繇治道共張吏民困苦百官煩費勞所保之民行危險之地難以奉神靈而祈福祐殆未合於承天子民之意昔者周文武郊於豐鄗成王郊於雒邑繇此觀之天隨王者所居而饗之可見也甘泉泰畤河東後土之祠宜可徙置長安合於古帝王願與群臣議定見漢書郊祀志下陛下聖德匆明上通承天之大典覽群下使各悉心盡慮議郊祀之處天下幸甚臣聞廣謀從衆則合於天心故洪範曰三人占則從二人言言少從多之義也論當往古宜於萬民則依而從之違道寡與則廢而不行今議者五十八人其五十人言當徙之義皆著於經傳同於上世便於吏民八人不案經藝考古制而以為不宜無法之議難以定吉凶太誓曰正稽古建功立事可以永年丕天之大律詩曰毋曰高高在上陟降厥士日監在茲言天之日監王者之處也又曰乃眷西顧此維豫宅言天以文王之都為居也宜於長安定南北郊為萬世基見漢書郊祀志下上言罷郊壇偽飾甘泉泰畤紫壇八觚宣通象八方五帝壇周環其下又有群神之壇以尚書禋六宗望山川遍群神之義紫壇有文章采鏤黼黻之飾及玉女樂石壇仙人祠瘞鸞路騂駒寓龍馬不能得其象於古臣聞郊紫壇饗帝之義掃地而祭上質也歌大呂舞雲門以俟天神歌太蔟舞咸池以俟地祇其牲用犢其席藁秸其器陶匏皆因天地之性貴誠上質不敢修其文也以為神祇功德至大雖修精微而備庶物猶不足以報功唯至誠為可故上質不飾以章天德紫壇偽飾女樂鸞路騂駒龍馬石壇之屬宜皆勿修見漢書郊祀志下又言罷雍鄜密上下祠王者各以其禮制事天地非因異世所立而繼之今雍鄜密上下畤本秦侯各以其意所立非禮之所載術也漢興之初儀制未及定即且因秦故祠復立北畤今既稽古建定天地之大禮郊見上帝青赤白黃黑五方之帝皆畢陳各有位饌祭祀備具諸侯所妄造王者不當長遵及北畤未定時所立不宜復修見漢書郊祀志下復條奏罷群祠長安廚官縣官給祠郡國候神方士使者所祠凡六百八十三所其二百八所應禮及疑無明文可奉祠如故其餘四百七十五所不應禮或復重請皆罷見漢書郊祀志下奏罷諸毀廟前以上體不平故復諸所罷祠卒不蒙福案衛思後戾太子戾後園親未盡孝惠孝景廟親盡宜毀及太上皇孝文孝昭太后昭靈後昭哀後武哀王祠請悉罷勿奉見漢書韋玄成傳華陰守丞嘉封事對大臣者國家之股肱萬姓所瞻仰明王所慎擇也傳曰下輕其上爵賤人圖柄臣則國家搖動而民不靜矣今嘉從守丞而圖大臣之位欲以匹夫徒步之人而超九卿之右非所以重國家而尊社稷也自堯之用舜文王於太公猶試然後爵之又況朱雲者乎雲素好勇數犯法亡命受易頗有師道其行義未有以異今禦史大夫禹潔白廉正經術通明有伯夷史魚之風海內莫不聞知而嘉猥稱雲欲令為禦史大夫妄相稱舉疑有姦心漸不可長宜下有司案驗以明好惡見漢書朱雲傳以孔子世為殷後議王者存二王後所以尊其先王而通三統也其犯誅絶之罪者絶而更封他親為始封君上承其王者之始祖春秋之義諸侯不能守其社稷者絶今宋國已不守其統而失國矣則宜更立殷後為始封君而上承湯統非當繼宋之絶侯也宜明得殷後而已今之故宋推求其嫡久遠不可得雖得其嫡嫡之先已絶不當得立禮記孔子曰丘殷人也先師所共傳宜以孔子世為湯後見漢書梅福傳郅支縣頭稿街議郅支及名王首更歷諸國蠻夷莫不聞知月令春掩骼埋胔之時宜勿縣見漢書陳湯傳甘延壽陳湯封爵議郅支本亡逃失國竊號絶域非真單于見漢書陳湯傳禱高祖孝文孝武廟嗣曾孫皇帝恭承洪業夙夜不敢康寧思育休烈以章祖宗之盛功故動作接神必因古聖之經往者有司以為前因所幸而立廟將以繫海內之心非為尊祖嚴親也今賴宗廟之靈六合之內莫不附親廟宜一居京師天子親奉郡國廟可止毋修皇帝祗肅舊禮尊重神明即告於祖宗而不敢失今皇帝有疾不豫乃夢祖宗見戒以廟楚王夢亦有其序皇帝悼懼即詔臣衡復修立謹案上世帝王承祖禰之大義皆不敢不自親郡國吏卑賤不可使獨承又祭祀之義以民為本間者歲數不登百姓困乏郡國廟無以修立禮凶年則歲事不舉以祖禰之意為不樂是以不敢復如誠非禮義之中違祖宗之心咎盡在臣衡當受其殃大被其疾隊在溝瀆之中皇帝至孝肅慎宜蒙祐福唯高皇帝孝文皇帝孝武皇帝省察右饗皇帝之孝開賜皇帝眉壽亡疆令所疾日瘳平復反常永保宗廟天下幸甚見漢書韋玄成傳告謝毀廟往者大臣以為在昔帝王承祖宗之休典取象於天地天序五行人親五屬天子奉天故率其意而尊其制是以禘嘗之序靡有過五受命之君躬接于天萬世不墮繼烈以下五廟而遷上陳太祖間歲而祫其道應天故福祿永終太上皇非受命而屬盡義則當遷又以為孝莫大於嚴父故父之所尊子不敢不承父之所異子不敢同禮公子不得為母信為後則於子祭於孫止尊祖嚴父之義也寢日四上食園廟開祠皆可亡修皇帝思慕悼懼未敢盡從惟念高皇帝聖德茂盛受命溥將欽若稽古承順天心子孫本支陳錫無疆誠以為遷廟合祭久長之策高皇帝之意乃敢不聽即以今日遷太上孝惠廟孝文太后孝昭太后寢將以昭祖宗之德順天人之序定亡窮之業今皇帝未受茲福乃有不能共職之疾皇帝願復修承祀臣衡等咸以為禮不得如不合高皇帝孝惠皇帝孝文皇帝孝武皇帝孝昭皇帝孝宣皇帝太上皇孝文太后孝昭太后之意罪盡在臣衡等當受其咎今皇帝尚未平詔中朝臣具復毀廟之文臣衡中朝臣咸復以為天子之祀義有所斷禮有所承違統背制不可以奉先祖皇天不祐鬼神不饗六藝所載皆言不當無所依緣以作其文事如失指罪乃在臣衡當深受其殃皇帝宜厚蒙祉福嘉氣日興疾病平復永保宗廟與天亡極群生百神有所歸息見漢書韋玄成傳
