body:
  text: 劉向請雨華山賦崆巃巍崝嵔山清忽幽昧往曲勃林岑䒩崔竭離安連迎磈通谷曼服㦇奄草均阿阪殷紛聲沸路遼遠調修崒𡽢寒服嶼冥冥蘭蔓散峽崝崝㑣㑣溱溱路黍稷雲嵷忽傳天下為湥壑旅請今湥渥水谷密請宜令所出百鏳鏳清池涌泉淡州鳲鴦翔㘇㘇殊紹診賞懸若神悲哀徂往不可語人麀鹿𪊨㑣他他野牛勝握觸熊蛬蛬律怒佛特林旅象犀庸遊山林天陰且雨員日聆棠柘梓桐樛捎母猴木戲手相持眷陽𧽵棼若風時憚鴛飄陽鸞孔翠文章明蜸𪎼苑倉游山旁惃𧔣狐狢臨水凝渾兮不觸果必方𣦀格可為惃陵鯉難神龜春夏出游冬自根聖人親之誠虞哉虢拖何不可勝亦路臨何為華山見古文苑雅琴賦觀聽之所至乃知其美也見文選蜀都賦注潛坐蓬廬之中巖石之下見文選張衡歸田賦注又傅咸贈何劭王濟詩注游豫心以廣觀且德樂之愔愔見文選琴賦注末世鎖才兮知音寡見文選謝靈運七里瀨詩注窮音之至入於神見文選古詩十九首注彈少宮之際天授中徵以及泉見文選七命注葳蕤心而息訴兮伏雅操之循則見初學記十六圍棊賦略觀圍棊法於用兵怯者無功貪者先亡見文選博奕論注案藝文類聚七十四引馬融圍綦賦亦有此四語逢紛伊伯庸之末胄兮諒皇直之屈原云余肇祖於高陽兮惟楚懷之嬋連原生受命於貞節兮鴻永路有嘉名齊名字於天地兮竝光明於列星吸精粹而吐氛濁兮橫邪世而不取容行叩誠而不阿兮遂見排而逢讒后聽虛而黜實兮不吾理而順情腸憤悁而含怒兮志遷蹇而左傾心儻慌其不我與兮躬速速其不吾親辭靈修而隕志兮吟澤畔之江濱椒桂羅以顛覆兮有竭信而歸誠讒夫靄靄而漫著兮曷其不舒豫情始結言於廟堂兮信中塗而叛之懷蘭蕙與衡芷兮行中野而散之聲哀哀而懷高丘兮心愁愁而思舊邦願承閒而自恃兮徑淫曀而道壅顏黴黧以沮敗兮精越裂而衰耄裳襜襜而含風兮衣納納而掩露赴江湘之湍流兮順波湊而下降徐徘徊於山阿兮飄風來之洶洶馳余車兮玄石步余馬兮洞庭平明發兮蒼梧夕投宿兮石城芙蓉蓋而菱華車兮紫貝闕而玉堂薜荔飾而陸離薦兮魚鱗衣而白霓裳登逢龍而下隕兮違故都之漫漫思南郢之舊俗兮腸一夕而九運揚流波之潢潢兮體溶溶而東回心怊悵以永思兮意暗暗而日頽白露紛以塗塗兮秋風瀏以蕭蕭身永流而不還兮魂長逝而常愁歎曰譬彼流水紛揚礚兮波逢洶涌濆滂沛兮揄揚滌蕩漂流隕往觸崟石兮龍卭脟圈繚戾宛轉阻相薄兮遭紛逢凶蹇離尤兮垂文揚采遺將來兮離世靈懷其不吾知兮靈懷其不吾聞就靈懷之皇祖兮訴靈懷之鬼神靈懷曾不吾與兮即聽夫人之諛辭余辭上參於天墬兮旁引之於四時指日月使延照兮撫招搖以質正立師曠俾端詞兮命咎繇使竝聽兆出名曰正則兮卦發字曰靈均余幼既有此鴻節兮長愈固而彌純不從俗而詖行兮直躬指而信志不枉繩以追曲兮屈情素以從事端余行其如玉兮述皇輿之踵跡群阿容以晦光兮皇輿覆以幽辟輿中涂以回畔兮駟馬驚而橫奔執組者不能制兮必折軛而摧轅斷鑣銜以馳騖兮暮去而敢止路蕩蕩其無人兮遂不禦乎千里身衡陷而下沉兮不可獲復登不顧身之卑賤兮惜皇輿之不興出國門而端指兮冀一寤而錫還哀僕夫之坎毒兮屢離憂而逢患九年之中不吾反兮思彭咸之水游惜師延之浮渚兮赴汨羅之長流遵江曲之逶移兮觸石崎而衡游波澧澧而揚澆兮順長瀨之濁流凌黃沱而下低兮思還流而復反玄輿馳而井集兮身容與而日遠擢舟杭以橫濿兮亝湘流而南極立江界而長吟兮愁哀哀而纍息情慌忽以忘歸兮神浮游以高厲心蛩蛩而懷顧兮魂眷眷而獨逝歎曰余思舊邦心依違兮日暮黃昏羌幽悲兮去郢東遷余誰慕兮讒夫黨旅其以茲故兮河水淫淫情所願兮顧瞻郢路終不返兮怨思惟鬱鬱之憂毒兮志坎而不違身憔悴而考旦兮日黃昏而長悲閔空宇之孤子兮哀枯楊之冤雛孤雌吟於高墉兮鳴鳩棲於桑榆玄猿失潛於林兮獨偏棄而遠放征夫勞於周行兮處婦憤而長望申誠信而罔違兮情素潔於紐帛光明齊於日月兮文采耀於玉石傷壓次而不發兮思沈抑而不揚芳懿懿而終敗兮名摩散而不彰背玉門奔騖兮蹇離尤而干詬若龍逢之沈首兮王子比干之逢醢念社稷之幾危兮反為讎而見怨患國家之離沮兮躬獲愆而結難若青龍之僞質兮晉驪姬之反情恐登階之逢殆兮故伏於末庭孽臣子之號咷兮本朝蕪而不治犯顏色而觸諫兮反蒙辜而被疑菀蘼蕪與菌若兮漸藁本於汙瀆淹芳芷於腐井兮棄雞駭於皇筐簏執棠溪刜蓬兮秉干將割肉筐澤瀉豹鞹兮破荊和繼築時溷濁猶未清兮世殽亂猶未察欲容與俟時兮懼年歲之既晏顧屈節從流兮心鞏鞏而不夷寧浮沅而馳騁兮下江湘邅回歎曰山中檻檻余傷懷兮征夫皇皇其孰依兮經營原野杳冥冥兮乘騏騁驥舒吾情兮歸骸舊邦莫誰語兮長辭遠逝乘湘去兮遠逝志隱隱而鬱刜兮愁獨哀而冤結腸紛紜繚轉兮涕漸漸其若屑情慨慨而長懷兮信上皇而質正合五嶽與八靈兮訊九鬿與六神指列宿白情兮訴五帝置詞北斗為我折中兮太一為余聽之云服陰陽之正道兮御后土之中和偑蒼龍之蚴虯兮帶隱虹之逶蛇曳彗星皓旴兮撫朱爵與鵕鸃遊清靈之颯戾兮服雲衣之披披杖玉華與朱旗兮垂明月之玄珠舉霓旌之墆翳兮建黃纁之總旄躬純粹而罔愆兮承皇考之妙儀惜往事之不合兮橫汨羅而下濿乘隆波南渡兮逐江湘之順流赴陽侯之潢洋兮下石瀨而登洲陵魁堆蔽視兮雲冥冥而暗前山峻高無垠兮遂曾閎而迫身雪氛氛而薄木兮雲霏霏而隕集阜隘狹而幽險兮石嵾嵯翳日悲故鄉而發忿兮去余邦之彌久背龍門而入河兮登大墳而望夏首橫舟航而濟湘兮耳聊啾而戃慌波淫淫而周流兮鴻溶溢而滔蕩路曼曼其無端兮周容容而無識引日月指極兮少須臾而釋思水波遠冥冥兮眇不睹其東西順風波南北兮霧宵晦紛紛日杳杳西頽兮路長遠而窘迫欲酌醴娛憂兮蹇騷而不釋歎曰飄風蓬龍埃坲坲兮屮木搖落時槁悴兮遭傾遇禍不可救兮長吟永欷涕究究兮舒情敶詩冀以自免兮頽流下隕身日遠兮惜賢覽屈氏之離騷兮心哀哀而怫鬱聲嗷嗷寂寥兮顧僕夫之憔悴撥諂諛而匡邪兮切淟涊之流俗蕩偎涹之姦咎兮夷蠢蠢之溷濁懷芬香而挾蕙兮偑江蘺之婓婓握申椒與杜若兮冠浮雲之峨峨登長陵而四望兮覽芷圃之蠡蠡遊蘭皋與蕙林兮睨玉石之嵾嵯楊精華眩耀兮芳鬱渥而純美結桂樹之旖旎兮紉荃蕙與辛夷芳若茲而不御兮捐林薄而菀死驅子僑之奔走兮申徒狄之赴淵若由夷之純美兮介子推之隱山晉申山之離殃兮荊和氏之立血吳申胥之抉眼兮王子比干之橫廢欲卑身而下體兮心隱惻而不置方圜殊而不合兮鉤繩用而異態欲俟時於須臾兮日陰曀其暮時遲遲其日進兮年忽忽而日度妄周容而入世兮內距閉而不開俟時風之清激兮愈氛霧其如塺進雄鳩之耿耿兮讒介介而蔽之默順風偃仰兮尚由由而進之心懭悢冤結兮情舛錯曼憂搴薛荔於山野兮采撚支於中洲望高丘而歎涕兮悲吸吸而長懷孰契契而委棟兮日暗暗而下頽歎曰江湘油油長流汨兮挑揄揚汰蕩迅疾兮憂心展轉愁怫鬱兮冤結未舒長隱忿兮丁時逢殃可奈何兮勞心悁悁涕滂沱兮憂苦悲余心之悁悁兮哀故邦之逢殃辭九年而不復兮獨煢煢而南行思余俗之流風兮心紛錯而不受遵壄莽以呼風兮步從容於山廋巡陸夷之曲衍兮幽空虛寂寞倚石巖流涕兮憂憔悴而無樂登巑岏長企兮望南郢而窺之山修遠其遼遼兮塗漫漫其無時聽玄鶴之晨鳴兮干高岡之峨峨獨憤積而哀娛兮翔江洲而安歌三鳥飛自南兮覽其志而欲北願寄言於三鳥兮去飄疾而不可得欲遷志而改操兮心紛結其未離外倣徨而遊覽兮內惻隱而含哀聊須臾時忘兮心漸漸其煩錯願假簧舒憂兮志紆鬱甚難釋歎離騷揚意兮猶未殫於九章長噓吸於悒兮涕橫集而成行傷明珠之赴泥兮魚眼璣之堅藏同駑騾與乘駔兮雜班駁與闒茸葛藟虆於桂樹兮鴟梟集於木蘭偓促談於廊廟兮律魁放乎山閒惡虞氏之簫韶兮好遺風之激楚潛周鼎於江淮兮爨土鬵於中宇且人心之持舊兮而不可保長邅彼南道兮征夫宵行思念郢路兮還顧眷眷涕流交集兮泣下漣漣歎曰登山長望中心悲兮菀彼青青泣如頽兮留思北顧涕漸漸兮折鋭摧矜凝泛濫兮念我煢煢魂誰求兮僕夫慌悴散若流兮愍命昔皇考之嘉志兮喜登能而亮賢情純潔罔薉兮姿盛質而無愆放佞人與諂諛兮斥讒夫與便嬖親忠正之悃誠兮招貞良與明智心溶溶其不可量兮情淡淡其若淵回邪辟而不能入兮誠願藏而不可遷逐下柣於堂兮迎宓妃於伊雒刜讒賊於中廇兮選呂管於榛薄叢林之下無怨士兮江河之畔無隱夫三苗之徒於逐兮伊皋之倫充廬今反表為裏兮顛裳為衣戚宋萬於兩楹兮廢周邵於遐夷卻騏驥轉運兮騰驢騾馳逐蔡女黜而出帷兮戎婦入而綵繡服慶忌囚於阱室兮陳不占戰而赴圍破伯牙之號鍾兮挾人箏而彈緯藏𩶡石於金匱兮捐赤瑾於中庭韓信蒙於介胄兮行夫將而攻城莞芎棄於澤洲兮匏瓥蠹於筐簏麒麟奔於九皋兮熊羆群而逸囿折芳枝與瓊華兮樹枳棘與薪柴握荃蕙與射干兮耘藜藿與蘘荷惜今世其何殊兮遠近思而不同或沈淪其無所達兮或清激其無所通哀余生之不當兮獨蒙毒而逢尤雖謇謇申志兮君乖差而屏之誠惜芳之菲菲兮反茲為腐也懷椒聊之蔎蔎兮乃逢紛罹詬也歎曰嘉皇既歿終不反兮山中幽險郢路遠兮讒人諓諓孰可訴兮征夫罔極誰可語兮行狢纍欷聲喟喟兮懷憂含戚何侘傺兮思古冥冥深林兮樹木鬱鬱山參差嶄巖兮阜杳杳蔽日悲余心之悁悁兮目眇眇而遺泣風騷屑搖木兮雲吸吸湫戾悲余生之無觀兮愁倥偬於山陸旦徘徊於長阪兮夕倣徨而獨宿髮披披鬤鬤兮躬叩勞而瘏悴魂俇俇而南行兮泣霑襟而濡袂心嬋媛而無告兮口噤閉而不言違郢都之舊閭兮回湘沅而遠遷念余邦之橫陷兮宗鬼神之無次閔先嗣之中絶兮心惶惑而自悲聊浮遊於山狹兮步周流於江畔臨深水而長嘯兮且尚佯而泛觀興離騷之微文兮冀靈修之一悟還余車於南郢兮復往軌於初古道修遠其難遷兮傷余心之不能已背三五之典刑兮絶洪範之辟紀播規矩以背度兮錯權衡而任意操繩墨而放棄兮傾容幸而侍側甘棠枯於豐草兮藜棘樹於中庭西施斥於北宮兮仳倠倚於彌楹烏獲戚而驂乘兮燕公操於馬圉蒯聵登於清府兮咎繇棄而在蓋見茲以永歎兮欲登階而狐疑乘白水而高騖兮因徒弛而長詞歎曰倘佯壚阪沼水深兮容與漢渚涕淫淫兮鍾牙已死遳為聲兮纖阿不御焉舒情兮曾哀悽欷心離離兮還顧高丘泣如灑兮遠遊悲余性之不可改兮屢懲艾而不移服覺晧以殊俗兮貌揭揭以巍巍譬王僑之乘雲兮載赤霄而淩太清欲與天地參壽兮與日月而比榮登崑崙而北首兮悉靈圉而來謁選鬼神於太陰兮登閶闔於玄闕回朕車俾西引兮褰虹旗於玉門馳六龍於三危兮朝西靈於九濱結余軫於西山兮橫飛谷以南征絶都廣以直指兮歷祝融於朱冥枉玉衡於炎火兮委爾兩館於咸唐貫澒濛以東朅兮維六龍於扶桑周流覽於四海兮志升降以高馳徵九神於極兮建虹釆以招指駕鸞鳳以上遊兮從玄鶴與鷦明孔鳥飛回極而送迎兮騰群鶴於瑤光排帝宮與羅囿兮升縣圃以眩滅結瓊枝以雜偑兮立長庚以繼日淩靁以軼駭電兮綴鬼谷於北辰鞭風伯使先驅兮囚靈玄於虞淵遡高風以低佪兮覽周流於朔方就顓頊而敶詞兮考玄冥於空桑旋車逝於崇山兮奏虞舜於蒼梧濟楊舟於會稽兮就申胥於五湖見南郢之流風兮殞余躬於沅湘望舊邦之黯黮兮時溷濁其猶未央懷蘭茞之芬芳兮妬被離而析之張絳帷湘以襜襜兮風邑邑而敝之日暾暾其西舍兮陽焱焱而復顧聊假日以須臾兮何騷騷而自故歎曰譬彼蛟龍乘雲浮兮泛淫澒溶紛若霧兮潺湲轇轕雷動電發馺高舉兮升虛淩冥沛濁浮清入帝宮兮搖翹奮羽馳風騁雨遊無窮兮已上竝見楚詞
