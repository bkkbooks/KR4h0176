body:
  text: 劉向使外親上變事竊聞故前將軍蕭望之等皆忠正無私欲致大治忤於貴戚尚書今道路人聞望之等復進以為且復見毀讒必曰嘗有過之臣不宜復用是大不然臣聞春秋地震為在位執政太盛也不為三獨夫動亦已明矣且往者高皇帝時季布有罪至於夷滅後赦以為將軍高后孝文之間卒為名臣孝武帝時兒寬有重罪繫案道侯韓説諫曰前吾丘壽王死陛下至今恨之今殺寬後將復大恨矣上感其言遂貰寬復用之位至御史大夫御史大夫未有及寬者也又董仲舒私為災異書主父偃取奏之下吏罪至不道幸蒙不誅復為大中大夫膠西相以老病免歸漢有所欲興常有詔問仲舒為世儒宗定議有益天下孝宣皇帝時夏侯勝坐誹謗擊獄三年免為庶人宣帝復用勝至長信少府太子太傅名敢直言天下美之若乃群臣多此比類難一二記有過之臣無負國家有益天下此四臣者足以觀矣前弘恭奏望之等獄決三月地大震恭移病出後復視事天陰雨雪繇是言之地動殆為恭等臣愚以為宜退恭顯以章蔽善之罰進望之等以通賢者之路如此太平之門開災異之原塞矣見漢書楚元王交附傳條災異封事臣前幸得以骨肉備九卿奉法不謹乃復蒙恩竊見災異並起天地失常徵表為國欲終不言念忠臣雖在甽畝猶不忘君惓惓之義也況重以骨肉之親又加以舊恩未報乎欲竭愚誠又恐越職然惟二恩未報忠臣之義一杼愚意退就農畝死無所恨臣聞舜命九官濟濟相讓和之至也衆賢和於朝則萬物和於野故簫韶九成而鳳皇來儀擊石拊石百獸率舞四海之內靡不和寧及至周文開基西郊雜遝衆賢罔不肅和崇推讓之風以銷分爭之訟文王既沒周公思慕歌詠文王之德其詩曰於穆清廟肅雍顯相濟濟多士秉文之德當此之時武王周公繼政朝臣和於內萬國歡於外故盡得其歡心以事其先祖其詩曰有來雍雍至止肅肅相維辟公天子穆穆言四方皆以和來也諸侯和於下天應報於上故周頌曰降福穰穰又曰飴我釐牟釐牟麥也始自天降此皆以和致和獲天助也下至幽厲之際朝廷不和轉相非怨詩人疾而憂之曰民之無良相怨一方衆小在位而從邪議歙歙相是而背君子故其詩曰歙歙訿訿亦孔之哀謀之其臧則具是違謀之不臧則具是依君子獨處守正不撓衆枉勉強以從王事則反見憎毒讒訴故其詩曰密勿從事不敢告勞無罪無辜讒口嗸嗸當是之時日月薄蝕而無光其詩曰朔日辛卯日有蝕之亦孔之醜又曰彼月而微此日而微今此下民亦孔之哀又曰日月鞠凶不用其行四國無政不用其良天變見於上地變動於下水泉沸騰山谷易處其詩曰百川沸騰山冢卒崩高岸為谷深谷為陵哀今之人胡憯莫懲霜降失節不以其時其詩曰正月繁霜我心憂傷民之訛言亦孔之將言民以是為非甚衆大也此皆不和賢不肖易位之所致也自此之後天下大亂篡殺殃禍並作厲王奔彘幽王見殺至乎平王末年魯隱之始即位也周大夫祭伯乖離不和出奔於魯而春秋為諱不言來奔傷其禍殃自此始也是後尹氏世卿而專恣諸侯背畔而不朝周室卑微二百四十二年之間日食三十六地震五山陵崩阤二彗星三見夜常星不見夜中星隕如雨一火災十四長狄入三國五石隕墜六鶂退飛多麋有蜮蜚鸜鵒來巢者皆一見晝冥晦雨木冰李梅冬實七月霜降草木不死八月殺菽大雨雹雨雪靁霆失序相乘水旱飢蝝螽螟蜂午並起當是時禍亂輒應弒君三十六亡國五十二諸侯奔走不得保其社稷者不可勝數也周室多禍晉敗其師於貿戎伐其郊鄭傷桓王戎執其使衛侯朔召不往齊逆命而助朔五大夫爭權三君更立莫能正理遂至陵夷不能復興由此觀之和氣致祥乖氣致異祥多者其國安異衆者其國危天地之常經古今之通義也今陛下開三代之業招文學之士優遊寬容使得並進今賢不肖渾殽白黑不分邪正雜糅忠讒並進章交公車人滿北軍朝臣舛午膠戾乖剌更相讒訴轉相是非傳授增加文書紛糾前後錯繆毀譽渾亂所以營或耳目感移心意不可勝載分曹為黨往往群朋將同心以陷正臣正臣進者治之表也正臣陷者亂之機也乘治亂之機未知孰任而災異數見此臣所以寒心者也夫乘權藉勢之人子弟鱗集於朝羽翼陰附者衆輻湊於前毀譽將必用以終乖離之咎是以日月無光雪霜夏隕海水沸出陵谷易處列星失行皆怨氣之所致也夫遵衰周之軌迹循詩人之所刺而欲以成太平致雅頌猶卻行而求及前人也初元以來六年矣案春秋六年之中災異未有稠如今者也夫有春秋之異無孔子之救猶不能解紛況甚於春秋乎原其所以然者讒邪並進也讒邪之所以並進者由上多疑心既已用賢人而行善政如或譖之則賢人退而善政還夫執狐疑之心者來讒賊之口持不斷之意者開群枉之門讒邪進則衆賢退群枉盛則正士消故易有否泰小人道長君子道消君子道消則政日亂故為否否者閉而亂也君子道長小人道消小人道消則政日治故為泰泰者通而治也詩又云雨雪麃麃見晛聿消與易同義昔者鯀共工歡兜與舜禹雜處堯朝周公與管蔡並居周位當是時迭進相毀流言相謗豈可勝道哉帝堯成王能賢舜禹周公而消共工管蔡故以大治榮華至今孔子與季孟皆仕於魯李斯與叔孫俱宦於秦定公始皇賢季孟李斯而消孔子叔孫故以大亂汙辱至今故治亂榮辱之端在所信任信任既賢在於堅固而不移詩云我心匪石不可轉也言守善篤也易曰渙汗其大號言號令如汗汗出而不反者也今出善令未能踰時而反是反汗也用賢未能三旬而退是轉石也論語曰見不善如探湯今二府奏佞讇不當在位歷年而不去故出令則如反汗用賢則如轉石去佞則如拔山如此望陰陽之調不亦難乎是以群小窺見間隙緣飾文字巧言醜詆流言飛文譁於民間故詩云憂心悄悄慍于群小小人成群誠足慍也昔孔子與顏淵子貢更相稱譽不為朋黨禹稷與皋陶傳相汲引不為比周何則忠於為國無邪心也故賢人在上位則引其類而聚之於朝易曰飛龍在天大人聚也在下位則思與其類俱進易曰拔茅茹以其彙征吉在上則引其類在下則推其類故湯用伊尹不仁者遠而衆賢至類相致也今佞邪與賢臣並在交戟之內合黨共謀違善依惡歙歙訿訿數設危險之言欲以傾移主上如忽然用之此天地之所以先戒災異之所以重至者也自古明聖未有無誅而治者也故舜有四放之罰而孔子有兩觀之誅然後聖化可得而行也今以陛下明知誠深思天地之心迹察兩觀之誅覽否泰之卦觀雨雪之詩歷周唐之所進以為法原秦魯之所消以為戒考祥應之福省災異之禍以揆當世之變於遠佞邪之黨壞散險詖之聚杜閉群枉之門廣開衆正之路決斷狐疑分別猶豫使是非炳然可知則百異消滅而衆祥並至太平之基萬世之利也臣幸得託肺附誠見陰陽不調不敢不通所聞竊推春秋災異以效今事一二條其所以不宜宣泄臣謹重封昧死上見漢書楚元王交附傳極諫用外戚封事臣聞人君莫不欲安然而常危莫不欲存然而常亡失御臣之術也夫大臣操權柄持國政未有不為害者也昔晉有六卿齊有田崔衛有孫寧魯有季孟常掌國事世執朝柄終後田氏取齊六卿分晉崔子弒其君光孫林父寧殖出其君衎弒其君剽季氏八佾舞於庭三家者以雍徹並專國政卒逐昭公周大夫尹氏管朝事濁亂王室子朝子猛更立連年乃定故經曰正室亂又曰尹氏殺王子克甚之也春秋舉成敗録禍福如此類甚衆皆陰盛而陽微下失臣道之所致也故書曰臣之有作威作福害于而家凶于而國孔子曰祿去公室政逮大夫危亡之兆秦昭王舅穰侯及涇陽葉陽君專國擅勢上假太后之威三人者權重於昭王家富於秦國國甚危殆賴寤范睢之言而秦復存二世委任趙高專權自恣壅蔽大臣終有閰樂望夷之禍秦遂以亡近事不遠即漢所代也漢興諸呂無道擅相尊王呂産呂祿席太后之寵據將相之位兼南北軍之衆擁梁趙王之尊驕盈無厭欲危劉氏賴忠正大臣絳侯朱虛侯等竭誠盡節以誅滅之然後劉氏復安今王氏一姓乘朱輪華轂者二十三人青紫貂蟬充盈幄內魚鱗左右大將軍秉事用權五侯驕奢僭盛並作威福擊斷自恣行汙而寄治身私而託公依東宮之尊假甥舅之親以為威重尚書九卿州牧郡守皆出其門管執樞機朋黨比周稱譽者登進忤恨者誅傷遊談者助之説執政者為之言排擯宗室孤弱公族其有智能者尤非毀而不進遠絶宗室之任不令得給事朝省恐其與己分權數稱燕王蓋主以疑上心避諱呂霍而弗肯稱內有管蔡之萌外假周公之論兄弟據重宗族磐互歷上古至秦漢外戚僭貴未有如王氏者也雖周皇甫秦穰侯漢武安呂霍上官之屬皆不及也物盛必有非常之變先見為其人微象孝昭帝時冠石立於泰山仆柳起於上林而孝宣帝即位今王氏先祖墳墓在濟南者其梓柱生枝葉扶疏上出屋根臿地中雖立石起柳無以過此之明也事勢不兩大王氏與劉氏亦且不並立如下有泰山之安則上有纍卵之危陛下為人子孫守持宗廟而令國祚移於外親降為皂隸縱不為身奈宗廟何婦人內夫家外父母家此亦非皇太后之福也孝宣皇帝不與舅平昌樂昌侯權所以安全之也夫明者起福於無形銷患於未然宜發明詔吐德音援近宗室親而納信黜遠外戚毋授以政皆罷令就弟以則效先帝之所行厚安外戚全其宗族誠東宮之意外家之福也王氏永存保其爵祿劉氏長安不失社稷所以褒睦外內之姓子子孫孫無疆之計也如不行此策田氏復見於今六卿必起於漢為後嗣憂昭昭甚明不可不深圖不可不蚤慮易曰君不密則失臣臣不密則失身幾事不密則害成唯陛下深留聖思審固幾密覽往事之戒以折中取信居萬安之實用保宗廟久承皇太后天下幸甚見漢書楚元王交附傳理甘延壽陳湯疏郅支單于囚殺使者吏士以百數事暴揚外國傷威損重群臣皆閔焉陛下赫然欲誅之意未嘗有忘西域都護延壽副校尉湯承聖指倚神靈總百蠻之君攬城郭之兵出百死入絶域遂蹈康居屠五重城搴歙侯之旗斬郅支之首縣旌萬里之外揚威昆山之西掃谷吉之恥立昭明之功萬夷懾伏莫不懼震呼韓邪單于見郅支已誅且喜且懼鄉風馳義稽首來賓願守北藩纍世稱臣立千載之功建萬世之安群臣之勳莫大焉昔周大夫方叔吉甫為宣王誅獫狁而百蠻從其詩曰嘽嘽焞焞如霆如雷顯允方叔征伐獫狁蠻荊來威易曰有嘉折首獲非其醜言美誅首惡之人而諸不順者皆來從也今延壽湯所誅震雖易之折首詩之雷霆不能及也論大功者不録小過舉大美者不疵細瑕司馬法曰軍賞不踰月欲民速得為善之利也蓋急武功重用人也吉甫之歸周厚賜之其詩曰吉甫燕喜既多受祉來歸自鎬我行永久千里之鎬猶以為遠況萬里之外其勤至矣延壽湯既未獲受祉之報反屈捐命之功久挫於刀筆之前非所以勸有功厲戎士也昔齊桓公前有尊周之功後有滅項之罪君子以功覆過而為之諱行事二師將軍李廣利捐五萬之師靡億萬之費經四年之勞而廑獲駿馬三十匹雖斬宛王母鼓之首猶不足以復費其私罪惡甚多孝武以為萬里征伐不録其過遂封拜兩侯三卿二千石百有餘人今康居國強于大宛郅支之號重于宛王殺使者罪甚於留馬而延壽湯不煩漢士不費斗糧比於二師功德百之且常惠隨欲擊之烏孫鄭吉迎自來之日逐猶皆裂土受爵故言威武勤勞則大於方叔吉甫列功覆過則優於齊桓二師近事之功則高於安遠長羅而大功未著小惡數布臣竊痛之宜以時解縣通籍除過勿治尊寵爵位以勸有功見漢書陳湯傳諫營昌陵疏臣聞易曰安不忘危存不忘亡是以身安而國家可保也故賢聖之君博觀終始窮極事情而是非分明王者必通三統明天命所授者博非獨一姓也孔子論詩至於殷士膚敏祼將于京喟然歎曰大哉天命善不可不傳于子孫是以富貴無常不如是則王公其何以戒慎民萌何以勸勉蓋傷微子之事周而痛殷之亡也雖有堯舜之聖不能化丹朱之子雖有禹湯之德不能訓末孫之桀紂自古及今未有不亡之國也昔高皇帝既滅秦將都雒陽感寤劉敬之言自以德不及周而賢於秦遂徙都關中依周之德因秦之阻世之長短以德為效故常戰栗不敢諱亡孔子所謂富貴無常蓋謂此也孝文皇帝居霸陵北臨廁意悽愴悲懷顧謂群臣曰嗟乎以北山石為椁用紵絮斫陳漆其間豈可動哉張釋之進曰使其中有可欲雖錮南山猶有隙使其中無可欲雖無石椁又何戚焉夫死者無終極而國家有廢興故釋之之言為無窮計也孝文寤焉遂薄葬不起山墳易曰古之葬者厚衣之以薪臧之中野不封不樹後世聖人易之以棺槨棺槨之作自黃帝始黃帝葬於橋山堯葬濟陰丘壠皆小葬具甚微舜葬蒼梧二妃不從禹葬會稽不改其列殷湯無葬處文武周公葬於畢秦穆公葬於雍橐泉宮祈年館下樗里子葬於武庫皆無丘隴之處此聖帝明賢君智士遠覽獨慮無窮之計也其賢臣孝子亦承命順意而薄葬之此誠奉安君父忠孝之至也夫周公武王弟也葬兄甚微孔子葬母於防稱古墓而不墳曰丘東西南北之人也不可不識也為四尺墳遇雨而崩弟子修之以告孔子孔子流涕曰吾聞之古者不修墓蓋非之也延陵季子適齊而反其子死葬於嬴博之間穿不及泉斂以時服封墳掩坎其高可隱而號曰骨肉歸復於土命也魂氣則無不之也夫嬴博去吳千有餘里季子不歸葬孔子往觀曰延陵季子於禮合矣故仲尼孝子而延陵慈父舜禹忠臣周公弟弟其葬君親骨肉皆微薄矣非苟為儉誠便於體也宋桓司馬為石槨仲尼曰不如速朽秦相呂不韋集知略之士而造春秋亦言薄葬之義皆明於事情者也逮至吳王闔閭違禮厚葬十有餘年越人發之及秦惠文武昭嚴襄五王皆大作丘隴多其瘞臧咸盡發掘暴露甚足悲也秦始皇帝葬於驪山之阿下錮三泉上崇山墳其高五十餘丈周回五里有餘石槨為遊館人膏為燈燭水銀為江海黃金為鳧雁珍寶之臧機械之變棺槨之麗宮館之盛不可勝原又多殺宮人生薶工匠計以萬數天下苦其役而反之驪山之作未成而周章百萬之師至其下矣項籍燔其宮室營宇往者咸見發掘其後牧兒亡羊羊入其鑿牧者持火照求羊失火燒其臧槨自古至今葬未有盛如始皇者也數年之間外被項籍之災內離牧豎之禍豈不哀哉是故德彌厚者葬彌薄知愈深者葬愈微無德寡知其葬愈厚丘隴彌高宮廟甚麗發掘必速繇是觀之明暗之效葬之吉凶昭然可見矣周德既衰而奢侈宣王賢而中興更為儉宮室小寢廟詩人美之斯干之詩是也上章道宮室之如制下章言子孫之衆多也及魯嚴公刻飾宗廟多築臺囿後嗣再絶春秋刺焉周宣如彼而昌魯秦如此而絶是則奢儉之得失也陛下即位躬親節儉始營初陵其制約小天下莫不稱賢明及徙昌陵增埤為高積土為山發民墳墓積以萬數營起邑居期日迫卒功費大萬百餘死者恨於下生者愁於上怨氣感動陰陽因之以飢饉物故流離以十萬數臣甚惛焉以死者為有知發人之墓其害多矣若其無知又安用大謀之賢知則不説以示衆庶則苦之若苟以説愚夫淫侈之人又何為哉陛下慈仁篤美甚厚聰明疏達蓋世宜弘漢家之德崇劉氏之美光昭五帝三王而顧與暴秦亂君競為奢侈比方丘隴説愚夫之目隆一時之觀違賢知之心亡萬世之安臣竊為陛下羞之唯陛下上覽明聖黃帝堯舜禹湯文武周公仲尼之制下觀賢知穆公延陵樗里張釋之之意孝文皇帝去墳薄葬以儉安神可以為則秦昭始皇增山厚臧以侈生害足以為戒初陵之橅宜從公卿大臣之議以息衆庶見漢書楚元王交附傳復上奏災異臣聞帝舜戒伯禹毋若丹朱敖周公戒成王毋若殷王紂詩曰殷監不遠在夏后之世亦言湯以桀為戒也聖帝明王常以敗亂自戒不諱廢興故臣敢極陳其愚唯陛下留神察焉謹案春秋二百四十二年日蝕三十六襄公尤數率三歲五月有奇而一食漢興訖竟寧孝景帝尤數率三歲一月而一食臣向前數言日當食今連三年比食自建始以來二十歲間而八食率二歲六月而一發古今罕有異有小大希稠占有舒疾緩急而聖人所以斷疑也易曰觀乎天文以察時變昔孔子對魯哀公並言夏桀殷紂暴虐天下故曆失則攝提失方孟陬無紀此皆易姓之變也秦始皇之末至二世時日月薄食山陵淪亡辰星出於四孟太白經天而行無雲而雷枉矢夜光熒惑襲月孽火燒宮野禽戲廷都門內崩長人見臨洮石隕于東郡星孛大角大角以亡觀孔子之言考暴秦之異天命信可畏也及項籍之敗亦孛大角漢之入秦五星聚于東井得天下之象也孝惠時有雨血日食於衝滅光星見之異孝昭時有泰山臥石自立上林僵柳復起大星如月西行衆星隨之此為特異孝宣興起之表天狗夾漢而西久陰不雨者二十餘日昌邑不終之異也皆著於漢紀觀秦漢之易世覽惠昭之無後察昌邑之不終視孝宣之紹起天之去就豈不昭昭然哉高宗成王亦有雊雉拔木之變能思其故故高宗有百年之福成王有復風之報神明之應應若景嚮世所同聞也臣幸得託末屬誠見陛下有寬明之德冀銷大異而興高宗成王之聲以崇劉氏故狠狠數姦死亡之誅今日食尤屢星孛東井攝提炎及紫宮有識長老莫不震動此變之大者也其事難一二記故易曰書不盡言言不盡意是以設卦指爻而復説義書曰伻來以圖天文難以相曉臣雖圖上猶須口説然後可知願賜清燕之間指圖陳狀見漢書楚元王交附傳奏劾甘忠可忠可假鬼神罔上惑衆見漢書李尋傳對成帝甘泉泰畤問家人尚不欲絶種祠況於國之神寶舊畤且甘泉汾陰及雍五畤始立皆有神祇感應然後營之非苟而已也武宣之世奉此三神禮敬敕備神光尤著祖宗所立神祇舊位誠未易動及陳寶祠自秦文公至今七百餘歲矣漢興世世常來光色赤黃長四五丈直祠而息音聲砰隱野雞皆雊每見雍太祝祠以太牢遣候者乘傳馳詣行在所以為福祥高祖時五來文帝二十六來武帝七十五來宣帝二十五來初元元年以來亦二十來此陽氣舊祠也及漢宗廟之禮不得擅議皆祖宗之君與賢臣所共定古今異制經無明文至尊至重難以疑説正也前始納貢禹之議後人相因多所動搖易大傳曰誣神者殃及三世恐其咎不獨止禹等見漢書郊祀志日食對四月交於五月月同孝惠日同孝昭東井京師地且既其占恐害繼嗣見漢書五行志下之下説成帝定禮樂宜興辟雍設庠序陳禮樂隆雅頌之聲盛揖攘之容以風化天下如此而不治者未之有也或曰不能具禮禮以養人為本如有過差是過而養人也刑罰之過或至死傷今之刑非皋陶之法也而有司請定法削則削筆則筆救時務也至於禮樂則曰不敢是敢於殺人不敢於養人也為其俎豆管弦之間小不備因是絶而不為是去小不備而就大不備大不備或莫甚焉夫教化之比於刑法刑法輕是舍所重而急所輕也且教化所恃以為治也刑法所以助治也今廢所恃而獨立其所助非所以致太平也自京師有悖逆不順之子孫至於陷大辟受刑戮者不絶繇不習五常之道也夫承千歲之衰周繼暴秦之餘敝民漸漬惡俗貪叨險詖不間義理不示以大化而獨驅以刑罰終已不改故曰導之以禮樂而民和睦初叔孫通將制定禮儀見非於齊魯之士然卒為漢儒宗業垂後嗣斯成法也見漢書禮樂志誡子歆書告歆無忽若未有異德蒙恩甚厚將何以報董生有云弔者在門賀者在閭言有憂則恐懼敬事敬事則必有善功而福至也又曰賀者在門弔者在閭言受福則驕奢驕奢則禍至故弔隨而來齊頃公之始藉霸者之餘威輕侮諸侯虧跂蹇之容故被鞍之禍遁服而亡所謂賀者在門弔者在閭也兵敗師破人皆弔之恐懼自新百姓愛之諸侯皆歸其所奪邑所謂弔者在門賀者在閭今若年少得黃門侍郎要顯處也新拜皆謝貴人叩頭謹戰栗栗乃可必免見藝文類聚二十初學記一二御覽二百二十一引劉向集又四百五十九五百四十三
