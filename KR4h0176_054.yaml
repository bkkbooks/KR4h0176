body:
  text: 劉向戰國策書録護左都水使者光祿大夫臣向言所校中戰國策書中書餘卷錯亂相糅莒又有國別者八篇少不足臣向因國別者略以時次之分別不以序者以相補除復重得三十三篇本字多誤脫為半字以趙為肖以齊為立如此字者多中書本號或曰國策或曰國事或曰短長或曰事語或曰長書或曰修書臣向以為戰國時遊士輔所用之國為之策謀宜為戰國策其事繼春秋以後訖楚漢之起二百四十五年間之事皆定以殺青書可繕寫敘曰周室自文武始興崇道德隆禮義設辟雍泮宮庠序之教陳禮樂弦歌移風之化敘人倫正夫婦天下莫不曉然論孝弟之義惇篤之行故仁義之道滿乎天下卒致之刑錯四十餘年遠方慕義莫不賓服雅頌歌詠以思其德下及康昭之後雖有衰德其綱紀尚明及春秋時已四五百載矣然其餘業遺烈流而未滅五伯之起尊事周室五伯之後時君雖無德人臣輔其君者若鄭之子産晉之叔向齊之晏嬰挾君輔政以並立於中國猶以義相支持歌説以相感聘覲以相交期會以相一盟誓以相救天子之命猶有所行會享之國猶有所恥小國得有所依百姓得有所息故孔子曰能以禮讓為國乎何有周之流化豈不大哉及春秋之後衆賢輔國者既沒而禮義衰矣孔子雖論詩書定禮樂王道粲然分明以匹夫無勢化之者七十二人而已皆天下之俊也時君莫尚之是以王道遂用不興故曰非威不立非勢不行仲尼既沒之後田氏取齊六卿分晉道德大廢上下失序至秦孝公捐禮讓而貴戰爭棄仁義而用詐譎苟以取強而已矣夫篡盜之人列為侯王詐譎之國興立為強是以傳相放效後生師之遂相吞滅并大兼小暴師經歲流血滿野父子不相親兄弟不相安夫婦離散莫保其命涽然道德絶矣晚世益甚萬乘之國七千乘之國五敵侔爭權蓋為戰國貪叨無恥競進無厭國異政教各自制斷上無天子下無方伯力功爭強勝者為右兵革不休詐偽並起當此之時雖有道德不得施謀有設之強負阻而恃固連與交質重約結誓以守其國故孟子孫卿儒術之士棄捐於世而遊説權謀之徒見貴於俗是以蘇秦張儀公孫衍陳軫代厲之屬生從橫短長之説左右傾側蘇秦為從張儀為橫橫則秦帝從則楚王所在國重所去國輕然當此之時秦國最雄諸侯方弱蘇秦結之時六國為一以儐背秦秦人恐懼不敢窺兵於闕中天下不交兵者二十有九年然秦國勢便形利權謀之士咸先馳之蘇秦初欲橫秦弗用故東合從及蘇秦死後張儀連橫諸侯聽之西向事秦是故始皇因四塞之固據崤函之阻跨隴蜀之饒聽衆人之策乘六世之烈以蠶食六國兼諸侯并有天下杖於謀詐之弊終於信篤之誠無道德之教仁義之化以綴天下之心任刑罰以為治信小術以為道遂燔燒詩書坑殺儒士上小堯舜下邈三王二世愈甚惠不下施情不上達君臣相疑骨肉相疏化道淺薄綱紀壞敗民不見義而懸於不寧撫天下十四歲天下大潰詐偽之弊也其比王德豈不遠哉孔子曰道之以政齊之以刑民免而無恥道之以德齊之以禮有恥且格夫使天下有所恥故化可致也苟以詐偽偷活取容自上為之何以率下秦之敗也不亦宜乎戰國之時君德淺薄為之謀策者不得不因勢而為資據時而為口故其謀扶急持傾為一切之權雖不可以臨國教化兵革救急之勢也皆高才秀士度時君之所能行出奇策異智轉危為安運亡為存亦可喜皆可觀護左都水使者光祿大夫臣向所校戰國策書録見戰國策剡川姚氏宋刻本管子書録護左都水使者光祿大夫臣向言所校讎中管子書三百八十九篇大中大夫卜圭書二十七篇臣富參書四十一篇射聲校尉立書十一篇太史書九十六篇凡中外書五百六十四篇以校除復重四百八十四篇定著八十六篇殺青而書可繕寫也管子者潁上人也名夷吾號仲父少時嘗與鮑叔牙遊鮑叔知其賢管子貧困常欺叔牙叔牙終善之鮑叔事齊公子小白管子事公子糾及小白立為桓公子糾死管仲囚鮑叔薦管仲管仲既任政於齊齊桓公以霸九合諸侯一匡天下管仲之謀也故管仲曰吾始困時與鮑叔分財多自豫鮑叔不以我為貪知吾貧也嘗為鮑叔謀事而更窮困鮑叔不以我為愚知吾有利有不利也公子糾敗召忽死之吾幽囚受辱鮑叔不以我為無恥知吾不羞小節而恥功名不顯於天下也生我者父母知我者鮑叔鮑叔既進管仲而已下之子孫世祿於齊有封邑者十餘世常為名大夫管子既相以區區之齊在海濱通貨積財富國強兵與俗同好醜故其書稱曰倉廩實而知禮節衣食足而知榮辱上服度則六親固四維不張國乃滅亡下令猶流水之原令順人心故論卑而易行俗所欲因豫之俗所否因去之其為政也善因禍為福轉敗為功貴輕重慎權衡桓公怒少姬南襲蔡管仲因伐楚責包茅不入貢於周室桓公北征山戎管仲因而合燕修召公之政柯之會桓公背曹沫之盟管仲因而信之諸侯歸之管仲騁於周不敢受上卿之命以讓高國是時諸侯為管仲城穀以為之乘邑春秋書之褒賢也管仲富擬公室有三歸反坫齊人不以為侈管子卒齊國遵其政常強於諸侯孔子曰微管仲吾其被髮左衽矣太史公曰余讀管氏牧民山高乘馬輕重九府詳哉言之也又曰將順其美匡救其惡故上下能相親愛豈管仲之謂乎九府書民間無有山高一名形勢凡管子書務富國安民道約言要可以曉合經義向謹第録見管子明刻本晏子敘録護左都水使者光祿大夫臣向言所校中書晏子十一篇臣向謹與長社尉臣參校讎太史書五篇臣向書一篇參書十三篇凡中外書三十篇為八百三十八章除復重二十二篇六百三十八章定著八篇二百一十五章外書無有三十六章中書無有七十一章中外皆有以相定中書以夭為芳又為備先為牛章為長如此類者多謹頗略箋皆已定以殺青書可繕寫晏子名嬰諡平仲萊人萊者今東萊地也晏子博聞強記通於古今事齊靈公莊公景公以節儉力行盡忠極諫道齊國君得以正行百姓得以附親不用則退耕於野用則必不詘義不可脅以邪白刃雖交胸終不受崔杼之劫諫齊君懸而至順而刻及使諸侯莫能詘其辭其博通如此蓋次管仲內能親親外能厚賢居相國之位受萬鍾之祿故親戚待其祿而衣食五百餘家處士待而舉火者亦甚衆晏子衣苴布之衣麋鹿之裘駕敝車疲馬盡以祿給親戚朋友齊人以此重之晏子蓋短其書六篇皆忠諫其君文章可觀義理可法皆合六經之義又有復重文辭頗異不敢遺失復列以為一篇又有頗不合經術似非晏子言疑後世辨士所為者故亦不敢失復以為一篇凡八篇其六篇可常置旁御觀謹第録臣向昧死上見晏子宋刻本孫卿書録護左都水使者光祿大夫臣向言所校讎中孫卿書凡三百二十二篇以相校除復重二百九十篇定著三十二篇皆以定殺青簡書可繕寫孫卿趙人名況方齊宣王威王之時聚天下賢士於稷下尊寵之若鄒衍田駢淳于髡之屬甚衆號曰列大夫皆世所稱咸作書刺世是時孫卿有秀才年五十始來遊學諸子之事皆以為非先王之法也孫卿善為詩禮易春秋至齊襄王時孫卿最為老師齊向修列大夫之缺而孫卿三為祭酒焉齊人或讒孫卿乃適楚楚相春申君以為蘭陵令人或謂春申君曰湯以七十里文王以百里孫卿賢者也今與之百里地楚其危乎春申君謝之孫卿去之趙後客或謂春申君曰伊尹去夏入殷殷王而夏亡管仲去魯入齊魯弱而齊強故賢者所在君尊國安今孫卿天下賢人所去之國其不安乎春申君使人聘孫卿孫卿遺春申君書刺楚國因為歌賦以遺春申君春申君恨復固謝孫卿孫卿乃行復為蘭陵令春申君死而孫卿廢因家蘭陵李斯嘗為弟子已而相秦及韓非號韓子又浮丘伯皆受業為名儒孫卿之應聘於諸侯見秦昭王昭王方喜戰伐而孫卿以三王之法説之及秦相應侯皆不能用也至趙與孫臏議兵趙孝成王前孫臏為變詐之兵孫卿以王兵難之不能對也卒不能用孫卿道守禮義行應繩墨安貧賤孟子者亦大儒以人之性善孫卿後孟子百餘年以為人性惡故作性惡一篇以非孟子蘇秦張儀以邪道説諸侯以大貴顯孫卿退而笑之曰夫不以其道進者必不以其道亡至漢興江都相董仲舒亦大儒作書美孫卿孫卿卒不用於世老於蘭陵疾濁世之政亡國亂君相屬不遂大道而營乎巫祝信禨祥鄙儒小拘如莊周等又滑稽亂俗於是推儒墨道德之行事興壞序列箸數萬言而卒葬蘭陵而趙亦有公孫龍為堅白異同之辨處子之言魏有李悝盡地力之教楚有尸子長廬子芋子皆著書然非先王之法也皆不循孔氏之術唯孟軻孫卿為能尊仲尼蘭陵多善為學蓋以孫卿也長老至今稱之曰蘭陵人喜字為卿蓋以法孫卿也孟子孫卿董先生皆小五伯以為仲尼之門五尺童子皆羞稱五伯如人君能用孫卿庶幾於王然世終莫能用而六國之君殘滅秦國大亂卒以亡觀孫卿之書其陳王道甚易行疾世莫能用其言悽愴甚可痛也嗚呼使斯人卒終於閭巷而功業不得見於世哀哉可為霣涕其書比於記傳可以為法謹第録臣向昧死上言護左都水使者光祿大夫臣向言所校讎中孫卿書録見荀子宋刻本韓非子書録韓非者韓之諸公子也喜刑名法術之學而歸其本於黃老其為人吃口不能道説善著書與李斯俱事荀卿李斯自以為不如非見韓之削弱數以書干韓王韓王不能用於是韓非病治國不務求人任賢反舉浮淫之蠹而加之功實之上以為儒者用文亂法而俠者以武犯禁寬則寵名譽之人急則用介胄之士所用非所養所養非所用廉直不容於邪枉臣觀往者得失之變故作孤憤五蠹內外儲説難五十五篇十餘萬言人或傳其書至秦秦王見孤憤五蠹之書曰嗟乎寡人得見此人與遊死不恨矣李斯曰此韓非之所著書秦因急攻韓韓始不用及急乃遣韓非使秦秦王悅之未任用李斯害之秦王曰非韓之諸公子也今欲并諸侯非終為韓不為秦此人情也今王不用久留而歸之此自遺患也不如過法誅之秦王以為然下吏治非李斯使人遺藥令早自殺韓非欲自陳不見秦王後悔使人赦之非已死矣宋本不著名疑是劉向作列子書録右新書定著八章護左都水使者光祿大夫臣向言所校中書列子五篇臣向謹與長社尉臣參校讎太常書三篇太史書四篇臣向書六篇臣參書二篇內外書凡二十篇以校除復重十二篇定著八篇中書多外書少章亂布在諸篇中或字誤以盡為進以賢為形如此者衆及在新書有棧校讎從中書已定皆以殺青書可繕寫列子者鄭人也與鄭繆公同時蓋有道者也其學本於黃帝老子號曰道家道家者秉要執本清虛無為及其治身接物務崇不競合於六經而穆王湯問二篇迀誕恢詭非君子之言也至於力命篇一推分命楊子之篇唯貴放逸二義乖背不似一家之書然各有所明亦有可觀者孝景皇帝時貴黃老術此書頗行於世及後遺落散在民間未有傳者且多寓言與莊周相類故太史公司馬遷不為列傳謹第録臣向昧死上護左都水使者光祿大夫臣向所校列子書録永始三年八月壬寅上見列子宋刻本鄧析書録中鄧析書四篇臣敘書一篇凡中外書五篇以相校除復重為一篇皆定殺而書可繕寫也鄧析者鄭人也好刑名操兩可之説設無窮之辭當子産之世數難子産為政記或云子産執而戮之於春秋左氏傳昭公二十年而子産卒子太叔嗣為政定公八年太叔卒駟歂嗣為政明年乃殺鄧析而用其竹刑君子謂子然於是乎不忠苟有可以加於國家棄其邪可也靜女之三章取彤管焉竿旄何以告之取其忠也故用其道不棄其人詩之蔽芾甘棠勿翦勿伐召伯所茇思其人猶愛其樹也況用其道不恤其人乎子然無以勸能矣竹刑簡法也久遠世無其書子産卒後二十年而鄧析死傳説或稱子産誅鄧析非也其論無厚者言之異同與公孫龍同類謹第上見鄧析子明刻本案此敘意林荀子楊倞注高似孫子略皆作劉向或據書録解題改屬劉歆檢書録解題無此説關尹子書録右新書著定關尹子九篇護左都水使者光祿大夫臣劉向言所校中祕書關尹子九篇臣向校讎太常存七篇臣向本九篇臣向輒除錯不可考增闕斷續續者九篇成皆殺青可繕寫關尹子名喜號關尹子或曰關令子隱德行人易之嘗請老子著道德經上下篇列禦寇莊周皆稱道家書篇皆寓名有章章首皆有關尹子曰四字篇篇敘異章章義異其旨同辭與老列莊異其歸同渾質崖戾汪洋大肆然有式則使人泠泠輕輕不使人狂蓋公授曹相國參曹相國薨書葬至孝武皇帝時有方士來以七篇上上以仙處之淮南王安好道聚書有此不出臣向父德因治淮南王事得之臣向幼好焉寂士清人能重愛黃老清靜不可闕臣向昧死上永始二年八月庚子護左都水使者光祿大夫臣向謹進上此疑依託子華子書録護左都水使者光祿大夫臣向言所校讎中子華書凡二十有四篇以相校復重十有四篇定著十篇皆以殺青書可繕寫子華子程氏名本字子華晉人也晉自頃公失政政在六卿趙簡子始得志招徠賢俊之士為其家臣子華子生於是時博學能通墳典丘索及故府傳記之書性闓爽善持論不肯苟容於諸侯聚徒著書自號程子名稱藉甚聞於諸侯孔子遇諸郯歎曰天下之賢士也簡子欲仕諸朝而不能致乃遣使者奉纁幣聘以為爵執圭是時簡子殺竇犢及舜華孔子為作臨河之操子華子亦逡巡不肯起簡子大怒將脅之以兵子華去而之齊齊景公不能用也子華子館於晏氏更題其書曰子華子簡子卒襄子立子華子反於晉時已老矣遂不復仕以卒今其書編離簡斷以是門人弟子共相綴隨記其所聞而無次敘非子故所著之書也大抵子華子以道德為指歸而綱紀以仁義存誠養操不苟於售唯孔子然後知其賢齊大夫晏平仲與之為久要之交當時諸侯以勢相軋爭結怨連禍日以譎為事子華子之言如持水納石不相酬答卒以不遇可為酸鼻謹目録臣向昧死上此敘及關尹子敘疑皆宋人依託今姑録之於陵子敘明人作不録説苑敘録護左都水使者光祿大夫臣向言所校中書説苑雜事及臣向書民間書誣校讎其事類衆多章句相溷或上下謬亂難分別次序除去與新序復重者其餘者淺不中義理別集以為百家後令以類相從一一條別篇目更以造新事十萬言以上凡二十篇七百八十四章號曰新苑皆可觀臣向昧死見宋本説苑高祖頌漢帝本系出自唐帝降及于周在秦作劉涉魏而東遂為豐公見漢書高帝紀贊杖銘歷危乘險匪杖不行年耆力竭匪杖不強有杖不任顛跌誰怨有士不用害何足言都蔗雖甘殆不可杖佞人悅己亦不可相杖必取便不必用味士必任賢何必取貴見藝文類聚六十九案此銘亦作崔瑗御覽作馮植恐非熏爐銘嘉此正器嶄巖若山上貫太華承以銅盤中有蘭麝朱火青煙蔚術四塞上連青天雕鏤萬獸離婁相加見文選景福殿賦注五紀説夏曆以為列宿日月皆西移列宿疾而日次之月宿遲故日與列宿昏俱入西方後九十一日是宿在北方又九十一日是宿在東方九十一日在南方此明日行遲於列宿也月生三日日入而月見西方至十五日日入而月見東方將晦日未出乃見東方以此明月行之遲於日而皆西行也向難之以鴻範傳曰晦而月見西方謂之朓朓疾也朔而月見東方謂之側匿側匿遲不敢進也星辰西行史官謂之逆行此三説夏曆皆違之迹其意好異者之所作也見宋書天文志一五紀論太白少陰弱不得專行故以巳未為界不得經天而行經天則晝見其占為兵為喪為不臣為更王強國弱小國強見宋書天文志一乾象通鑑十六
