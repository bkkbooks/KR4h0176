body:
  text: 劉向別録子夏易傳見唐會要七十七服氏齊人號服光見漢書藝文志注釋文序録案釋文序録引作服先神輸者王道失則災害生得則四海輸之祥瑞見漢書藝文志注京房易説云日與星至陰也有形無光日照之乃有光喻如鏡照日即有影見月初光見西方望已後光見東皆日所照也見御覽四案引作劉向七略各書所引別録七略多同今以題劉向者俱入於別録易家有救民之法見史記淮南王列傳索隱所校讎中易傳淮南九師道訓除復重定著十二篇淮南王聘善為易者九人從之採獲故中書署曰九師書見初學記二十一御覽六百九案御覽引作劉向別傳九師書上有淮南二字所校讎中易傳古五子書除復重定著十八篇分六十四卦著之日辰自甲子至於壬子凡五十故號曰五子見初學記二十一段嘉即京房所從受易者也見儒林傳及劉向別録見漢書藝文志注五十八篇見尚書堯典正義虞夏書見尚書堯典正義武帝末民有得泰誓書於壁內者獻之與博士使讀説之數月皆起傳以教人見尚書序正義周書周時誥誓號令也蓋孔子所論百篇之餘也見漢書藝文志注引劉向云百篇次第於序孔鄭不同孔依壁內及序為文鄭依賈氏所奏別録為次見尚書堯典正義師之尚之父之故曰師尚父父亦男子之美稱也見毛詩大明正義論語泰伯疏史記齊世家集解古文記二百四篇見釋文序録王制文帝所造書有本制兵制服制篇見史記封禪書索隱明堂之制內有太室象紫宮南出明堂象太微見後漢書班固傳注案隋書牛宏傳云案劉向別録及馬宮蔡雍等所見當時有古文明堂禮王居明堂禮明堂圖明堂大圖陰陽太山通義魏文侯孝經傳等並説古明堂之事其書皆亡路寢在北堂之西社稷宗廟在路寢之西見周禮匠人疏左明堂辟雍右宗廟社稷見周禮匠人疏九主者有法君專君君授勞君等君寄君破君國君三歲社君凡九品圖畫其形見史記殷本紀集解王度記似齊宣王時淳于髡等所説也見禮記雜記正義王史氏六國時人也見漢書藝文志注士冠禮第一士昏禮第二士相見禮第三鄉飲酒禮第四鄉射禮第五燕禮第六大射儀第七聘禮第八公食大夫禮第九覲禮第十喪服第十一士喪禮第十二士喪禮下篇十三士虞禮第十四特牲饋食禮第十五少牢饋食禮第十六少牢下篇第十七見儀禮疏鄭目録曲禮屬制度檀弓屬通論王制屬制度月令屬明堂陰陽曾子問屬喪服文王世子屬世子法禮運屬通論禮器屬制度郊特牲屬祭祀內則屬子法玉藻屬通論明堂位屬明堂陰陽喪服小記屬喪服大傳屬通論少儀屬制度學記屬通論樂記屬樂記雜記屬喪服喪大記屬喪服祭法屬祭祀祭義屬祭祀祭統屬祭祀經解屬通論哀公問屬通論仲尼燕居屬通論孔子間居屬通論坊記屬通論中庸屬通論表記屬通論緇衣屬通論奔喪屬喪服問喪屬喪服服問屬喪服間傳屬喪服三年問屬喪服深衣屬制度投壼屬吉禮儒行屬通論大學屬通論冠義屬吉事昏義屬吉事鄉飲酒義屬吉事射義屬吉事燕義屬吉事聘義屬吉事喪服四制舊説屬喪服見禮記正義鄭目録雅琴之意事皆出龍德諸琴雜事中趙氏者勃海人趙定也宣帝時元康神爵間丞相奏能鼓琴者勃海趙定梁國龍德皆召入見溫室使鼓琴待詔定為人尚清靜少言語善鼓琴時間燕為散操多為之涕泣者見後漢書劉昆傳注藝文類聚四十四白帖六十二御覽五百七十九事類賦注十一師氏雅琴者名志東海下邳人傳云言師曠之後至今邳俗猶多好琴也見北堂書鈔一百九亦魏相所奏也與趙定俱召見待詔後拜為侍郎見漢書藝文志注樂歌詩四篇趙氏雅琴七篇師氏雅琴八篇龍氏雅琴百六篇見隋書音樂志君子因雅琴之適故從容以致思焉其道閉塞悲愁而作者名其曲曰操言遇災害不失其操也見後漢書曹褒傳注左丘明授曾申申授吳起起授其子期期授楚人鐸椒鐸椒作鈔撮八卷授虞卿虞卿作鈔撮九卷授荀卿荀卿授張蒼見春秋左氏傳序正義世本古史官明於古事者之所記也録黃帝已來帝王諸侯及卿大夫糸諡名號凡十五篇也見史記集解序索隱魯論語二十篇皆孔子弟子記諸善言也見論語序疏魯人所學謂之魯論齊人所學謂之齊論古壁所傳謂之古論見皇侃論語義疏序孔子見魯哀公問政比三朝退而為此記故曰三朝凡七篇並入大戴禮見史記五帝本紀索隱三國志秦宓傳注北堂書鈔九十九藝文類聚五十五案三國志注藝文類聚引作孔子三見哀公作三朝七篇今在大戴禮孝經古文字也庶人章分為二也曾子敢問章為三又多一章凡二十二章見漢書藝文志注引劉向云周宣王太史作大篆也見文選魏都賦注古文或誤以見為典以陶為陰如此類多見北堂書鈔一百一御覽六百一十八殺青者直治竹作簡書之耳新竹有汗善朽蠹凡作簡者皆於火上炙乾之陳楚間謂之汗汗者去其汗也見初學記二十八御覽六百六讎校一人讀書校其上下得繆誤為校一人持本一人讀書若怨家相對故曰讎也見文選魏都賦注御覽六百一十八晏平仲名嬰東萊夷維人事齊靈公莊公以節儉力行重於齊見世説新語言語篇注案史記管晏列傳集解引萊者今東萊地也稷齊城門名也談説之士期會於稷門下故曰稷下也見史記田敬仲世家集解水經淄水注太平寰宇記十八吁子芋子見史記荀卿列傳索隱徐子外黃人也見史記魏世家集解臣向與黃門侍郎歆所校列女傳種類相從為七篇以著禍福榮辱之效是非得失之分畫之於屏風四堵見初學記二十五御覽七百一楊雄經目有元首元衝元錯元測元舒元營元數元文元掜元圖元告元問合十二篇見蕭該漢書音義鬻子名熊封於楚辛甲故殷之臣事紂蓋七十五諫而不聽去至周召公與語賢之告文王文王親自迎之以為公卿封長子見史記周本紀集解九府書民間無有山高一名形勢見史記管晏列傳集解列子目録曰至於力命篇一推分命見文選王康琚反招隱詩注莊子宋之蒙人也見史記老莊列傳索隱又作人姓名使相與語是寄辭於其人故莊子有寓言篇見史記莊子列傳索隱老萊子古之壽者見文選遊天台山賦注鶡冠子常居深山以鶡為冠故號鶡冠子見藝文類聚六十七文選劉孝標辨命論注御覽六百八十五周訓人間小書其言俗薄見漢書藝文志注郎中嬰齊故待詔不知其姓數從遊觀名能為文見漢書藝文志注引劉向云鄭長者鄭人不知其名見漢書藝文志注騶衍之所言五德終始天地廣大其書言天事故曰談天見史記荀卿列傳集解後漢書西域傳注北堂書鈔九十九方士傳言鄒衍在燕燕有谷地美而寒不生五穀鄒子居之吹律而溫氣至而黍生今名黍谷見北堂書鈔一百十二藝文類聚九文選魏都賦劉注顏延年秋胡詩注阮嗣宗注白帖六太平御覽八百四十二齊使鄒衍過趙平原君見公孫龍及其徒綦母子之屬論白馬非馬之辨以問鄒子鄒子曰彼天下之辨有五勝三至而辭正為下辨者別殊類使不相害序異端使不相亂抒意通指明其所謂使人與知焉不務相迷也故勝者不失其所守不勝者得其所求若是故辨可為也及至煩文以相假飾辭以相惇巧譬以相移引人聲使不得及其意如此害大道夫繳紛爭言而競後息不能無害君子坐皆稱善見史記平原君列傳集解杜文公韓人也見漢書藝文志注黃帝泰素或言韓諸公孫之所作也言陰陽五行以為黃帝之道也故曰泰素見漢書藝文志注騶奭修衍之文飾若雕鏤龍文故曰雕龍見史記荀卿列傳集解後漢書崔駰傳注北堂書鈔一百案後漢書注引作鄒奭修衍飾之文若雕龍文御覽四百六十四引云鄒奭者頗采鄒衍之術迂大而閎辨文具難勝齊人美之頌曰談天鄒之頌曰談天鄒文與此異于長天下忠臣傳天下忠臣見漢書藝文志注申不害京人京今河南京縣也見史記申韓列傳索隱申子今民間所有上下二篇中書六篇皆合二篇已備過太史公所記也見史記申韓列傳索隱孝宣皇帝重申不害君臣篇使黃門郎張子喬正其字見御覽二百二十一申子學號曰刑名刑名者循名以責實其尊君卑臣崇上抑下合於六經也宣帝好觀其君臣篇見史記張叔列傳索隱漢書元帝紀注張歐傳注鄧析好刑名操兩可之説設無窮之辭數難子産為政子産執而戮之見荀子不苟篇注引劉向云尹文子與宋鈃俱遊稷下見漢書藝文志注引劉向云公孫龍持白馬之論以度關見初學記七成公生與李斯子由同時由為三川守成公生遊談不仕見漢書藝文志注引劉向云毛公論堅白同異以為可以治天下見漢書藝文志注名家者流出於禮官古者名位不同禮亦異數孔子曰必也正名乎見史記太史公自序索隱漢書司馬遷傳注我子為墨子之學漢書藝文志注墨子書有文子文子子夏之弟子問於墨子史記荀卿列傳索隱炙過髡過字作輠輠者車之盛膏器也炙之雖盡猶有餘流者言淳于髡智不盡如炙輠也見史記荀卿列傳集解尉繚繚為商君學見漢書藝文志注楚有尸子疑謂其在蜀今案尸子書晉人也名佼秦相衛鞅客也衛鞅商君謀事畫計立法理民未嘗不與佼規也商君被刑佼恐并誅乃亡逃入蜀自為造此二十篇凡六萬餘言卒因葬蜀見史記荀卿列傳集解督亢膏腴之地見史記荊軻列傳集解後漢郡國志補注丹燕王喜之太子見史記荊軻列傳索隱神農疑李悝及商君所説見漢書藝文志注尹都尉書有種瓜篇見御覽九百七十八尹都尉書有種蓼篇見御覽九百七十八尹都尉書有種芥葵蓼薤蔥諸篇見御覽九百八十都尉有種蔥書曹公與其先生言細人覘之見有拔蔥見藝文類聚八十二泛勝之使教田三輔有好田者師之徙為御史見漢書藝文志注邯鄲人見漢書藝文志注待詔臣饒心術饒齊人也不知其姓武帝時待詔作書名曰心術也見漢書藝文志注賈誼弔屈原賦因以自諭自恨也見史記賈誼列傳集解淮南王有薰籠賦見北堂書鈔一百三十五御覽七百十向有芳松枕賦見白帖十四御覽七百七向有合賦見御覽七百一十七有騏麟角杖賦見北堂書鈔一百三十三御覽七百十事類賦注一十四有行過江上弋雁賦行弋賦弋雌得雄賦見御覽八百三十二待詔馮商作燈賦見藝文類聚八十商字子高見漢書藝文志注臣向謹與長社尉杜參校中祕書見漢書藝文志注驃騎將軍史朱宇見漢書藝文志注隱書者疑其言以相問對者以慮思之何以無不諭見漢書藝文志注有麗人歌賦漢興以來善雅歌者魯人虞公發聲清哀遠動梁塵受學者莫能及也見藝文類聚四十三文選嘯賦注事類賦注十一案初學記十五魯人虞公見劉向別録孫子書以殺青簡編以縹絲繩見北堂書鈔一百三太平御覽六百六蹴鞠者傳言黃帝所作或曰起戰國之時蹴鞠兵勢也所以練武士知有材也皆因嬉戲而講習之今軍士無事得使蹴鞠有書二十五篇見史記蘇秦列傳集解衛霍列傳索隱後漢書梁冀傳注初學記四一切經音義二白帖四御覽二百九十七又七百五十四事類賦注四人民蚤蝨衆多則地癢也見北堂書鈔一百五十七鑿山鑽石則見地痛也見北堂書鈔一百五十七
