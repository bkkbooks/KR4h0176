body:
  text: 劉向新序齊王問墨子曰古之學者為己今之學者為人何如對曰古之學者得一善言以附其身今之學者得一善言務以悅人見北堂書鈔八十三太平御覽六百七臧孫行猛政子貢非之曰夫政猶張琴瑟也大絃急則小絃絶矣是以位尊者德不可以薄官大者治不可以小地廣者制不可以狹民衆者政不可以苛獨不聞子産相鄭乎其掄材惟賢抑惡而揚善故有大略者不問其所短有德厚者不非其小疵其牧民之道養之以仁教之以禮因其所欲而與之從其所好而勸之賞之疑者從重罰之疑者從輕見藝文類聚五十二子産相鄭七年而教宣風行國無刑人見北堂書鈔三十五風俗和平囹圄空虛注引李斯問荀卿曰當今之時為秦奈何孫卿曰力術止義術行秦之謂也見荀子強國篇楊倞注引子産決鄧析教民之難約大獄袍衣小獄襦袴民之獻袍衣襦袴者不可勝數以非為是以是為非鄭國大亂民口歡譁子産患之於是討鄧析而僇之民乃服是非乃定見荀子正名篇注引梁車新為鄴令其姊往見之值暮郭門閉遂逾郭而入梁車新因刖其足趙成以為不慈遂奪璽免官見御覽五百十七魯哀公為室而大公儀子諫曰室大衆與人處譁少與人處則悲願公適也曰聞命矣築室不輟明日又諫曰國小室大百姓必怨吾君諸侯聞之必輕吾國公曰聞命矣築室不輟明日又諫曰左昭右穆為室而大以臨二先君無乃害於孝乎於是哀公毀室而止見御覽百七十四齊景公遊於牛山之上而北望齊曰美哉國乎使古無死者則寡人將去期如之何乃泣沾襟高子曰然賴君之賜蔬菜食惡肉可得食也駑馬棧車可得乘也且不欲死而況吾君乎俯而垂泣晏子拊手而笑曰樂哉今日嬰之遊也見怯君一而諛臣二使古之無死者則太公丁公至今猶存吾君方為被蓑衣而立乎畎畝之中唯農事之恤何暇念死乎景公㘇焉見御覽四百草八今見韓詩外傳十齊有田巴先生者行修於內智明於外王聞其賢聘之將問政焉田巴先生改制新衣拂飾冠帶顧謂其妾妾曰姣將出門問其從者從者曰姣過於淄水自照視醜惡甚焉遂見齊王齊王問政對曰政在正身正身之本在於群臣大王召臣臣改制鬋飾問於臣妾曰奚若妾愛臣諛臣曰姣問從者從者畏臣諛臣曰姣臣據臨淄水而觀影然後自知醜惡也今齊之臣妾諛王者非特二人王如臨淄水見己之惡過而自改斯齊國治矣見御覽六十三又三百八十二孔子見宋榮啓期年老白首衣弊服鼓琴自樂孔子問曰先生老而窮何樂也啓期對曰吾有三樂天生萬物以人為貴吾得為人一樂也人生以男為貴吾得為男二樂也人生命有傷夭吾年九十歲是三樂也貧者士之常死者人之終居常以守終何不樂乎見御覽三百八十三崔杼弒莊公申蒯漁於海而後至將入死之其御止之曰君之無道聞於天下不可死也申蒯曰告我晚子不早告我吾安得食亂君之祿而死治君之事乎子免之無死其御曰子有亂主猶死之我有治長奈何勿死申蒯至門曰申蒯聞君死請入弔門者以告崔杼杼令勿內申蒯曰汝疑我乎吾與汝臂乃斷其左臂以與門者門者以示崔杼杼陳八列令其入申蒯拔劍呼天三踊乃鬭殺七例未及崔子一列而死其御亦死之門外君子聞之曰蒯可謂守節死義矣見御覽三百六十九又四百十七又四百三十八又有申鳴一條今見説苑疑誤作新序今不録孫武樂毅之徒皆前世之賢將也久遠深奧其事難知至於吳漢近時人耳起於販馬立為名將垂名竹帛天下歸德此可慕也見御覽二百七十六昔子奇年十八齊君使之治阿既行矣悔之使使追之曰未至阿及之還之已至勿還也使者及之而不還君問其故對曰臣見使與共載者白首也夫以老者之智以少者之決必能治阿矣是以不還見御覽二百六十八齊景公遊海上樂之六月不歸令左右敢言歸者死顏歜諫曰君樂治海上不樂治國儻有治國者君且安得樂出海也公據戟將斫之歜撫衣而待之曰君奚不斫也昔桀殺關龍逢紂殺王子比干君奚不斫以臣參此二人不亦可乎公遂歸見御覽三百五十三昌邑王治側鑄冠十枚以冠賜師友儒者後以冠冠奴龔遂免冠歸之曰王賜儒者冠下至臣今以餘冠冠奴是大王奴虜畜臣也見御覽五百昌邑王徵為天子到營陽置積竹刺杖二枚龔遂諫曰積竹杖者驕蹇少年杖也大王奉大喪當拄竹杖見御覽七百十昌邑王取侯王二千石墨綬黃綬與左右佩之龔遂諫曰高皇帝造花綬五等陛下取之而賤人臣以為不可願陛下收之見御覽六百八十二上古之時其民敦朴故三皇教而不誅無師而威故善為國者不師三皇之德也至於五帝有師旅之備而無用故善師者不陳五帝之謂也湯伐桀文王伐崇武王伐紂皆陳而不戰故善陳者不戰三王之謂也及夏后氏之伐有扈殷高宗之討鬼方周宣王之征熏鬻而不血刃皆仁聖之惠時化之風也至齊桓侵蔡而蔡潰伐楚而楚服而強楚以致苞茅之貢於周室北伐山戎使奉朝覲三存亡一斷絶九合諸侯一匡天下衣裳之會十有一嘗大戰亦不血刃至晉文公設虎皮之威陳曳柴之偽以破楚師而安中國故曰善戰者不死晉文公之謂也楚昭王遭闔閭之禍國滅昭王曰寡人不仁不能守社稷父老反何憂無君寡人從此入海矣父老曰有君若此其賢也及申包胥請救哭秦庭七日秦君憐而救之秦楚同心遂走吳師昭王反國故善死者不亡昭王之謂也是故自晉文公以下至戰國而暴兵始衆於是以強并弱以大吞小故強國務攻弱國備守合從連衡群相征伐故戰則稱孫吳守則稱墨翟至秦而以兵并天下窮兵極武而亡及項羽尚暴而滅漢以寬仁而興故能掃除秦之苛暴矣孝武皇帝攘服四夷其後天下安然故世之為兵者其行事略可睹也見御覽二百七十一湯居亳七十里地與葛伯為鄰葛伯放淫不祀湯使人問之曰何為不祀曰無以供犧牲也湯使人遺之牛羊葛伯食之又不以祀湯又使人問曰何為不祀曰無以共粢盛也湯又使毫衆往為之耕老弱饋食葛伯率其民要其有酒食黍稻者奪之不與者殺之有一童子以黍肉餉殺而奪之書曰葛伯仇餉此之謂也為其殺是童子而征之四海之內皆曰非富天下也為匹夫匹婦復仇也見御覽三百五公孫敖問伯象先生曰今先生收天下之術博觀四方之日久矣未能裨世主之治明君臣之義是則未有異於府庫之藏金玉筐篋之囊簡書也見御覽八百十一公孫敖曰夫玉石金鐵猶可琢磨以為器用而況於人見御覽八百十三紂王天下熊羹不熟而殺庖人見御覽八百六十一平公問叔向曰齊桓公九合諸侯一匡天下如是君不如臣力何也師曠侍曰臣請以喻五味管仲善斷割之隰朋善煎熬之賓須無善齊和之羹已熟矣奉而進之而君不食誰能強之亦君之力也同上趙簡子使使者聘孔子於魯以胖牛肉迎於河上使者謂船人曰孔子即上船中河安流而殺之孔子至使者致命進胖牛之肉孔子仰天而嘆曰美哉水乎洋洋也使丘不濟此水者命也夫見御覽八百六十三楚王使謁者徐光迎方與盲人能吹竽者龔遂乃去見御覽五百八十一禹南濟于江黃龍負舟舟中之人皆失色禹仰天而歎曰吾受命於天死生命也龍俯首而逝見御覽六十勇士一呼三軍皆辟易士之誠也夫勇士孟賁水行不避蛟龍陸行不避虎狼發怒吐氣聲向響動天至其死矣頭身斷絶夫不用仁而用武當時雖快身必無後是以孔子勤勤行仁見御覽四百三十七齊遺淳于髡到楚髡為人短小楚王甚薄之謂曰齊無人邪而使子來子何長也對曰臣無所長腰中七尺之劍欲斬無壯王王曰止吾但戲子耳與髡共飲同上秦王以五百里地易鄢陵鄢陵君辭不受使唐且謝秦王王忿然變色怒曰亦向見天子之怒乎且曰臣未嘗見王曰夫天子之怒伏尸百萬流血千里且曰大王亦嘗見布衣韋帶士之怒乎王曰布衣韋帶士之怒解冠徒跣以頭搶地耳何難知者且曰此乃庸夫庶人之怒耳非布衣韋帶士之怒也夫專諸刺王僚彗星襲日奔星晝出要離刺王子慶忌倉鷹擊於臺上聶政刺韓王白虹貫日此三者皆布衣之怒也與臣將四士無怒則已一怒伏尸二人流血五步即案其匕首起視秦王曰今將是矣王色變跪曰先生就坐寡人喻矣鄢陵獨以五十里在者徒用先生故乎同上林既衣韋衣而朝齊景公景公曰此君子之服邪小人之服邪林既作色曰夫服事何足以揣士行乎昔荊為長劍危冠令尹子西出焉齊桓短衣而遂之溝冠管仲隰朋出焉越文身翦發范蠡大夫種亦出焉西戎左衽而椎結由余亦出焉如君言衣犬裘者當犬號衣羊裘者當羊鳴今君衣狐裘而朝得無為變乎景公曰子自以為勇捍乎曰登高臨危而目不眴而足不凌者此工匠之勇捍也入深泉取蛟龍拘黿而出者此漁夫之勇捍也入深山刺虎豹抱熊而出者此獵夫之勇捍也夫不難斷頭裂腹暴骨流血中野者此武士之勇捍也今臣居廣廷作色而辨以犯君之怒前雖有乘軒之賞未為之動也後雖有斧鑕之威未為之恐也此既之所以為捍也同上周昌者沛人以軍功封汾陰侯御史大夫高帝欲廢惠帝立戚夫人子如意群臣固爭莫能得昌廷爭之強上問其説昌為人吃曰臣口不能言然臣期期知其不可也陛下欲廢太子臣期期不奉詔見御覽七百四十文王之葬枯骨無益衆庶衆庶悅之恩義動人也見御覽三百七十五挾泰山以超北海見御覽三十九諸侯墻有黑堊之色無丹青之彩見御覽一百八十七賤之如虺豕見楊倞注荀子王霸篇子奇年十八齊君使之化阿至阿鑄其庫兵以為耕器出倉廩以賑貧窮阿縣大化見後漢書順帝紀注桓公與管仲鮑叔寧戚飲桓公謂鮑叔曰姑為寡人祝乎鮑叔奉酒而起祝曰吾君無忘出莒也使管子無忘束縛從魯也使寧戚無忘其飯牛於車下也見隗囂傳注齊桓公與管仲飲酒酣管仲上壽曰願君無忘出奔於莒也臣亦無忘束縛於魯也見馮異傳注伊尹蒙恥辱負鼎俎以干湯見崔駰傳注臧孫魯大夫行猛政子貢非之曰夫政猶張琴瑟也大弦急則小弦絶矣故曰罰得則姦邪止賞得則下歡悅子之賊心見矣獨不聞子産之相鄭乎推賢舉能抑惡揚善有大略者不問其短有厚德者不非小疪家給人足囹圄空虛子産卒國人皆叩心流涕三月不聞竽琴之音其生也見愛死也可悲故曰德莫大於仁禍莫大於刻今子病而人賀子愈而人相懼曰嗟乎何命之不善臧孫子又不死臧孫㘇而避位終身不出見陳寵傳注已上皆見後漢書子貢曰子産死國人聞之皆叩心流涕曰子産已死吾將安歸皆巷哭見李善文選注三十七營度也見文選注三孫叔敖曰筐篋之橐簡書二十三案見御覽八百十一以此為公孫敖語楚王載繁弱之弓忘歸之矢以射兕於雲夢二十四公孫龍謂平原君曰臣居魯則聞下風高先生之知悅先生之行三十九孔子曰聖人雖生異世相襲若規矩四十三趙良謂商君曰君亡可翹足而待也四十四太王亶父止於岐下百姓扶老攜幼隨而歸之一年成邑二年成都三年五倍其初四十九及定王王室遂卑矣五十三劉向曰先生之所以指麾而四海賓服者誠德之至也五十六晉襄公之孫周為晉國休戚不倍本也五十六已上皆文選注攘服四夷天下安然見北堂書鈔十三説苑閔子騫兄弟二人母死其父更娶復有二子子騫為其父御車失轡父持其手衣甚單父則歸呼其後母兒持其手衣甚溫厚即謂其婦曰吾所以娶汝乃為吾子今汝欺我去無留子騫前曰母在一子單母去四子寒其父默然故曰孝哉閔子騫一言其母還再言三子溫見藝文類聚二十晉靈公驕奢造九層之臺費用千億謂左右曰敢有諫者斬孫息聞之求見靈公張弩操矢見之謂之曰子欲諫邪孫息曰臣不敢諫也公曰子何能孫息曰臣能纍十二博棊加九雞子於上公曰吾少學未嘗見也子為寡人作之孫息即正顏色定志意以棊子置於下而加九雞子於其上左右屏息靈公扶伏氣息不續公曰危哉危哉孫息曰臣謂是不危也復有危此者公曰願見之孫息曰公為九層之臺三年不成男不得耕女不得織國用空虛戶口減少吏民叛亡鄰國謀議將興兵社稷一滅君何所望靈公曰寡人之過乃至於此即壞九層之台見後漢書呂布傳注藝文類聚二十四又七十四御覽七百五十八孫息學悲歌引琴作鄭衛之音靈公大感故作衛公之曲歌而和之見北堂書鈔一百六齊王起九重之臺募國中有能畫者賜之錢有敬君居常飢寒其妻妙色敬君工畫貪賜畫臺去家日久思憶其妻遂畫其像向之熹笑旁人瞻見之以白王王召問之對曰有妻如此去家日久心常念之竊畫其像以慰離心不悟上聞王即設酒與敬君相樂謂敬君曰國中獻女無好者以錢百萬請妻可乎不者殺汝敬君慞惶聽許見藝文類聚三十三御覽三百八十一又七百五十呂望年七十釣於渭渚三日三夜魚無食者望即忿脫其衣冠上有農人者古之異人也謂望曰子姑復釣必細其綸芳其餌徐徐而投之無令魚駭望如其言初下得鮒次得鯉刳魚腹得書書文曰呂望封於齊望知其異一作當貴見藝文類聚六十六史記齊太公世家索隱齊遣淳于髡到楚髡為人短小楚王甚薄之謂曰齊無人邪而使子來子何長也對曰臣無所長腰中七尺之劍欲斬無狀王王曰止吾但戲子耳即與髡共飲酒謂髡曰吾有讎在吳國子寧能為吾報之乎對曰臣來見道傍野民持一頭魚上田祝曰高得萬束下得千斛臣竊笑之以為禮薄而望多也王今與吾半日之樂而委以吳王非其計楚王默然見藝文類聚九十六北堂書鈔四十御覽二百四十三又三百七十八又七百三十六前數句一引作新序晉文公伐楚歸國行賞狐偃為首或曰城濮之事先軫之謀文公曰城濮之事偃説我無失信不背三舍之約先軫所謀軍事吾用之以勝然此一時之説偃言萬世之功奈何以一時之利而加萬世功乎是以先之衆人悅服見御覽二百七十九與權謀篇不同中行獻子將伐鄭范文子曰不可得志於鄭諸侯讎我憂必滋長郤至又曰得鄭是兼國也則王者固多憂乎見御覽三百五秦急圍邯鄲邯鄲傳舍吏子李京談謂平原曰邯鄲之民炊骨易子而食之而君之後宮婢妾荷綺縠餘粱肉士民兵盡或剡木為矛戟而君之器物鐘磬自恣見御覽三百五十三粱君出獵見白雁群粱君下車彀弓欲射之道有行者觀粱君謂行者止行者不止雁群駭粱君怒欲殺行者其御公孫龍下車對曰昔者齊景公之時天旱三年卜之曰必以人祠乃雨景公曰吾所以求雨者為吾民也今以人祠乃雨寡人將自當之言未卒天大雨方千里今主君以白雁故而欲殺之無異於狼虎梁君援其手與上車歸入郭門呼萬歲曰樂哉今日獵也獨得善言見御覽三百九十見新序二作公孫襲齊遺兵攻魯見一婦人將兩小兒走抱小而挈大顧見大軍且至抱大而挈小使者甚怪問之婦人曰大者妾夫兄之子小者妾之子夫兄子者公義也妾之子私愛也寧濟公而廢私邪使者悵然賢其辭即罷軍還對齊王説之曰魯未可攻也四婦之義尚如此何況朝廷之臣乎見御覽四百二十二見列女傳節義篇同魯有賢女次室之子年適二十明曉經書常侍立而吟見列女傳作倚柱而嘯涕泣如雨有識謂之曰汝欲嫁邪何悲之甚對曰魯君年老太子尚小憂其姦臣起矣見御覽四百六十九趙襄子問王離曰國之所以亡者何也對曰君吝而能忍是以亡爾襄子曰何以為然也曰吝則不能賞賢忍則不能罰罪賢者不賞罪者不罰不亡何也見御覽六百三十三蘇秦至齊齊王厚待之諸大夫嫉之使人刺秦而不死齊王出珍寶賞募求賊不得蘇秦垂死謂齊王曰王誠能為臣求賊者臣死後請車裂臣尸於巿徇之曰蘇秦為燕欲亂齊今日其死寡人甚喜故裂之若得其殺主重封賞之如此刺臣者必出矣齊王從其言裂尸而徇之刺蘇秦者果出求賞見御覽六百三十三北塞上之人其馬亡入胡中人皆弔之其父曰此何詎知不為福居數月其馬將胡駿馬而歸人皆賀之其父曰此何詎知不為禍家富馬良其子好騎墮而折髀人皆弔之其父曰此何詎知不為福居一年胡夷大出丁壯者皆控弦而戰塞上之人死者十九此子獨以跛故父子相保見御覽八百九十六本淮南子文全同晉平公問趙武曰中牟三國之股肱邯鄲之肩髀也寡人欲其良令也其令空誰使而可趙武曰刑子可公曰刑子非子之讎邪對曰私仇不入公門又問曰中府之令空誰使而可趙武曰臣子可故外舉不避讎內舉不避子見藝文類聚五十龜千歲能與人言見藝文類聚九十六鼓法天鐘法地見北堂書鈔百八楚文侯曰邑中豪好蔽善而揚惡可親問之見文選注三勇士孟賁水行不避蛟龍陸行不避虎狼見文選注八又十八聲樂易良而合於歌情盡舞意見文選注十七蓬生枲中不扶自直也見後漢徐稚傳注子奇年十八齊君使主東阿東阿大化見胡廣傳注晉平公時赤地千里見臧宮傳注
