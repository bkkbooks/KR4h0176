body:
  text: 劉歆三統曆夫曆春秋者天時也列人事而目以天時傳曰民受天地之中以生所謂命也是故有禮誼動作威儀之則以定命也能者養之以福不能者敗以取禍故列十二公二百四十二年之事以陰陽之中制其禮故春為陽中萬物以生秋為陰中萬物以成是以事舉其中禮取其和曆數以閏正天地之中以作事厚生皆所以定命也易金火相革之卦曰湯武革命順乎天而應乎人又曰治曆明時所以和人道也周道既衰幽王既喪天子不能班朔魯曆不正以閏餘一之歲為蔀首故春秋刺十一月乙亥朔日有食之於是辰在申而司曆以為在建戌史書建亥哀十二年亦以建申流火之月為建亥而怪蟄蟲之不伏也自文公閏月不告朔至此百有餘年莫能正曆數故子貢欲去其餼羊孔子愛其禮而著其法於春秋經曰冬十月朔日有食之傳曰不書日官失之也天子有日官諸侯有日御日官居卿以底日禮也日御不失日以授百官於朝言告朔也元典曆始曰元傳曰元善之長也共養三德為善又曰元體之長也合三體而為之原故曰元於春三月每月書王元之三統也三統合於一元故因元一而九三之以為法十一三之以為實實如法得一黃鐘初九律之首陽之變也因而六之以九為法得林鐘初六呂之首陰之變也皆參天兩地之法也上生六而倍之下生六而損之皆以九為法九六陰陽夫婦子母之道也律娶妻而呂生子天地之情也六律六呂而十二辰立矣五聲清濁而十日行矣傳曰天六地五數之常也天有六氣降生五味夫五六者天地之中合而民所受以生也故日有六甲辰有五子十一而天地之道畢言終而復始太極中央元氣故為黃鐘其實一籥以其長自乘故八十一為日法所以生權衡度量禮樂之所繇出也經元一以統始易太極之首也春秋二以目歲易兩儀之中也於春每月書王易三極之統也於四時雖亡事必書時月易四象之節也時月以建分至啓閉之分易八卦之位也象事成敗易吉凶之效也朝聘會盟易大業之本也故易與春秋天人之道也傳曰龜象也筮數也物生而後有象象而後有滋滋而後有數是故元始有象一也春秋二也三統三也四時四也合而為十成五體以五乘十大衍之數也而道據其一其餘四十九所當用也故蓍以為數以象兩兩之又以象三三之又以象四四之又歸奇象閏十九及所據一加之困以再扐兩之是為月法之實如日法得一則一月之日數也而三辰之會交矣是以能生吉凶故易曰天一地二天三地四天五地六天七地八天九地十天數五地數五五位相得而各有合天數二十有五地數三十凡天地也之數五十有五此所以成變化而行鬼神也并終數為十九易窮則變故為閏法參天九兩地十是為會數參天數二十五兩地數三十是為朔望之會以會數乘之則周於朔旦冬至是為會月九會而復元黃鐘初九之數也經於四時雖亡事必書時月時所以記啓閉也月所以紀分至也啓閉者節也分至者中也節不必在其月故時中必在正數之月故傳曰先王之正時也履端於始舉正於中歸餘於終履端於始序則不愆舉正於中民則不惑歸餘於終事則不悖此聖王之重閏也以五位乘會數而朔旦冬至是為章月四分月法以其一乘章月是為中法參閏法為周至以乘月法以減中法而約之則六扐之數為一月之閏法其餘七分此中朔相求之術也朔不得中是謂閏月言陰陽雖交不得中不生故日法乘閏法是為統歲三統是為元歲元歲之閏陰陽災三統閏法易九厄曰初入元百六陽九次三百七十四陰九次四百八十陽九次七百二十陰七次七百二十陽七次六百陰五次六百陽五次四百八十陰三次四百八十陽三凡四千六百一十七歲與一元終經歲四千五百六十災歲五十七是以春秋曰舉正於中又曰閏月不告朔非禮也閏以正時時以作事事以厚生生民之道於是乎在矣不告閏朔棄時正也何以為民故善僖五年春王正月辛亥朔日南至公既視朔遂登觀臺以望而書禮也凡分至啓閉必書雲物為備故也至昭二十年二月己丑日南至失閏至在非其月梓慎望氛氣而弗正不履端於始也故傳不曰冬至而曰日南至極於牽牛之初日中之時景最長以此知其南至也斗綱之端連貫營室織女之紀指牽牛之初以紀日月故曰星紀五星起其初日月起其中凡十二次日至其初為節至其中斗建下為十二辰視其建而知其次故曰制禮上物不過十二天之大數也經曰春王正月傳曰周正月火出於夏為三月商為四月周為五月夏數得天得四時之正也三代各據一統明三統常合而迭為首登降三統之首周還五行之道也故三五相包而生天統之正始施於子半日萌色赤地統受之於丑初日肇化而黃至丑半日牙化而白人統受之於寅初日孽成而黑至寅半日生成而青天施復於子地化自丑畢於辰人生自寅成於申故曆數三統天以甲子地以甲辰人以甲申孟仲季迭用事為統首三微之統既著而五行自青始其序亦如之五行與三統相錯傳曰天有三辰地有五行然則三統五星可知也易曰參五以變錯綜其數通其變遂成天下之文極其數遂定天下之象太極運三辰五星於上而元氣轉三統五行於下其於人皇極統三德五事故三辰之合於三統也日合於天統月合於地統斗合於人統五星之合於五行水合於辰星火合於熒惑金合於太白木合於歲星土合於填星三辰五星而相經緯也天以一生水地以二生火天以三生木地以四生金天以五生土五勝相乘以生小周以乘乾坤之策而成大周陰陽比類交錯相成故九六之變登降於六體三微而成著三著而成象二象十有八變而成卦四營而成易為七十二參三統兩四時相乘之數也參之則得乾之策兩之則得坤之策以陽九九之為六百四十八以陰六六之為四百三十二凡一千八十陰陽各一卦之微算策也八之為八千六百四十而八卦小成引而信之又八之為六萬九千一百二十天地再之為十三萬八千二百四十然後大成五星會終觸類而長之以乘章歲為二百六十二萬六千五百六十而與日月會三會為七百八十七萬九千六百八十而與三統會三統二千三百六十三萬九千四十而復於太極上元九章歲而六之為法太極上元為實實如法得一陰陽各萬一千五百二十當萬物氣體之數天下之能事畢矣見漢書律曆志上向子歆作三統曆及譜以説春秋推法密要故述焉案律曆志下僅末一條係班固所補其全卷皆三統譜也文多不録褚少孫曆術以下放此七略孝武皇帝敕丞相公孫弘廣開獻書之路百年之間書積如丘山故外有太常太史博士之藏內有延閣廣內祕室之府見漢書藝文志如淳注北堂書鈔十二又一百一兩引初學記十二藝文類聚十二文選為范始興求立太宰碑表注御覽八十七又二百三十三又六百十九子夏易傳漢興韓嬰傳見釋文序録易傳淮南九師道訓者淮南王安所造也見文選齊竟陵文宣王行狀注書以決斷斷者義之證也見初學記二十一御覽六百九尚書直言也始歐陽氏先君名之大夏侯小夏侯復立於官三家之學於傳之見初學記二十一御覽六百九孝武皇帝末有人得泰誓於中者獻之與博士使讚説之因傳以教今泰誓篇是也見文選劉子駿移書讓太常博士注案尚書正義引作別録文選注引此作七略不題劉向今並入此尚書有青絲編目録見文選任昉為范始興求立太宰碑表注詩以言情情者性之符也見初學記二十一御覽六百九禮家先魯有桓生説經頗異見文選劉子駿移書讓太常博士注宣皇帝時行射禮博士后蒼為之辭至今記之曰曲臺記見文選齊竟陵文宣王行狀注王者師天地體天而行是以明堂之制內有太室象紫微宮南出明堂象太微見文選西都賦注雅琴琴之言禁也雅之言正也君子守正以自禁也見文選長門賦注雅畼第十七見文選琴賦注有莊春言琴見文選洞簫賦注漢興善歌者魯人虞公發聲動梁上塵見文選嘯賦注陸士衡擬古詩注曹子建七啓注白帖六十一春秋兩家文或具四時或不於古文無事不必具四時見初學記二十一馮商商陽明人治易事五鹿充宗後事劉向能屬文後與孟柳同待詔頗序列傳未卒會病死見漢書藝文志注張湯傳注論語家近琅邪王卿不審名及膠東庸生皆以教見文選劉子駿移書讓太常博士注晏子七篇在儒家見史記管晏列傳正義太公金版玉匱雖近世之文然多善者見文選王文憲集序注子夏西河燕趙之間見文選為范始興求立太宰碑表注管子十八篇在法家見史記管晏列傳正義蜎子名淵楚人也見文選七發注齊田駢好談論故齊人為語曰天口駢天口者言田駢子不可窮其口若事天見文選宣德皇后令注鄒子有終始五德言土德從所不勝木德繼之金德次之火德次之水德次之見文選魏都賦注應貞華林園集詩注方士傳言鄒子在燕其遊諸侯畏之皆郊迎而擁彗見文選阮嗣宗詣蔣公奏記注楊子雲解嘲注齊有稷城門也齊談説之士期會於稷下者甚衆見文選曹子建與楊德祖書注鄒赫子齊人齊為語曰雕龍赫赫言鄒衍之術文飾之若雕鏤龍文見文選宣德皇后令注案鄒衍當作鄒奭盤盂書者其傳言孔甲為之孔甲黃帝之史也書盤盂中為誡法或於鼎名曰銘見文選陸佐公新刻漏銘注孝宣皇帝詔徵被公見誦楚辭被公羊裘母老每一誦輒與粥見北堂書鈔一百四十四御覽八百五十九莊忽奇忽期者或言莊夫子子或言族家子莊助昆弟也從行至茂陵詔造賦見漢書藝文志注甘泉賦永始三年待詔臣雄上見文選甘泉賦注羽獵永始三年十二月上見文選羽獵賦注長楊賦注長楊賦綏和元年上見文選長楊賦注子雲家牒言以甘露元年生也見文選王文憲集序注楊雄卒弟子侯芭負土作墳號曰玄家見文選劉先生夫人墓志注御覽五百五十八杜參參杜陵人以陽朔元年病死時年二十餘見漢書藝文志注繇叔二篇由余見白帖五十五魏公子信陵君也見白帖五十五魏公子兵法二十一篇圖七卷見史記信陵君列傳集解蜂門射法見史記龜策列傳集解蹴鞠者傳言黃帝所作王者宮中必左墄而右平墄猶國也言有國當治之也蹴鞠亦有治國之象左墄而右平見文選西都賦注景福殿賦注踏鞠兵勢也見文選景福殿賦注踏鞠其法律多微意皆因嬉戲以講練士至今軍士羽林無事使得踏鞠見文選景福殿賦注甘公公一名德見史記陳餘列傳索隱風后孤虛十二卷見史記龜策列傳索隱論方技為四家有醫經家有方家有房中家有神仙家見初學記二十尚書有青絲編目録見文選為范始興求立太宰碑表注尚書郎中北海展隆見文選班孟堅典引注羽蓋棽麗紛循悠悠見文選東都賦注案以下不類七略齊安陸昭王碑文注引有左思七略或是其文今姑附此解紛釋結反之於平安見文選孔文舉薦禰衡表注位纍我躬見文選任彥升為齊明帝讓宣城郡公第一表注詩曰結搆野草起室廬見文選諸葛孔明出師表注引劉歆七言詩鍾律書春宮秋律百卉必凋秋宮春律萬物必榮夏宮冬律雨雹必降冬宮夏律雷必發聲見隋書牛弘傳北史七十二御覽二十五
