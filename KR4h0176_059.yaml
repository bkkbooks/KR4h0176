body:
  text: 王褎洞簫賦原夫簫幹之所生兮于江南之丘墟洞條畼而罕節兮標敷紛以扶疎徒覲其旁山側兮則嶇嶔巋崎倚巇迤㠧誠可悲乎其不安也彌望儻莽聯延曠盪又足樂乎其敞閑也託身區於后土兮經萬載而不遷吸至精之滋熙兮稟蒼色之潤堅感陰陽之變化兮附性命乎皇天翔風蕭蕭而逕其末兮迴江流川而溉其山揚素波而揮連珠兮聲礚礚而樹樹淵朝露清泠而隕其側兮玉液浸潤而承其根孤雌寡鶴娛優乎其下兮春禽群嬉翱翔乎其顛秋蜩不食抱樸而長吟兮玄猨悲嘯搜索乎其閒處幽隱而奧庰兮密漠泊以猭惟詳察其素體兮宜清靜而弗諠幸得謚為洞簫兮蒙聖主之渥恩可謂惠而不費兮因天性之自然於是盤匠施巧夔妃准法帶以象牙掍其會合鎪鏤離灑絳脣錯雜鄰菌繚糾羅鱗捷獵膠緻理比挹㩎於是乃使夫性昧之宕冥生不覩天地之體勢闇於白黑之貌形憤伊鬱而酷愍眸子之喪精寡所舒其思慮兮專發憤乎音聲故吻吮值夫宮商兮龢紛離其匹溢形旖旎以順吹兮瞋啘㗅以紆鬱氣旁迕以飛射兮馳散渙以律趣從容其勿述兮驚合遝以詭譎或渾沌而潺湲兮獵若枚折或漫衍而駱驛兮沛焉競溢惏慄密率掩以絕滅㘊霵曄踕跳然復出若乃徐聽其曲度兮廉察其賦歌啾咇㘉而將吟兮行鍖銋以龢囉風鴻洞而不絕兮優嬈嬈以婆娑翩緜連以牢落兮漂乍棄而為他要復遮其蹊徑兮與謳謠乎相龢故聽其巨音則周流氾濫并包吐含若慈父之畜子也其妙聲則清靜厭瘱順敘卑迖若孝子之事父也科條譬類誠應義理澎濞慷慨一何壯士優柔溫潤又似君子故其武聲則若雷霆輘輷佚豫以沸㥜其仁聲則若颽風紛披容與而施惠或離遝以聚斂兮或拔摋以奮棄悲愴怳以惻兮時恬淡以綏肆被淋灑其靡靡兮時橫潰以陽遂哀悁悁之可懷兮良醰醰而有味故貪饕者聽之而廉隅兮狼戾者聞之而不懟剛毅強虣反仁恩兮嘽唌逸豫戒其失鍾期牙曠悵然而愕兮杞梁之妻不能為其氣師襄嚴春不敢竄其巧兮浸淫叔子遠其類嚚頑朱均惕復惠兮桀鬻博儡以頓顇吹參差而入道德兮故永御而可貴時奏狡弄則彷徨翱翔或留而不行或行而不留愺恅瀾漫亡耦失疇薄索合沓罔象相求故知音者樂而悲之不知音者怪而偉之故聞其悲聲則莫不愴然累欷撇涕抆淚其奏歡娛則莫不憚漫衍凱阿那腲腇者已是以蟋蟀蚸蠖蚑行喘息螻蟻蝘蜒蠅蠅翊翊遷延徙迤魚瞰雞睨垂喙蜿轉瞪瞢忘食況感陰陽之龢而化風俗之倫哉亂曰狀若捷武超騰踰曳迅漂巧兮又似流波泡溲汎𣶏趨巇道兮哮呷喚躋躓連絕淈殄沌兮攪搜澩捎逍遙踴躍若壞頹兮優游流離躊躇稽詣亦足耽兮頹唐遂往長辭遠逝漂不還兮賴蒙聖化從容中道樂不淫兮條畼洞達中節操兮終詩卒曲尚餘音兮吟氣遺響聯緜漂撇生微風兮連延駱驛變無窮兮見文選蓺文類聚四十四九懷極運兮不中來將屈兮困窮余深慰兮慘怛願一列兮無從乘日月兮上征顧遊心兮鄗酆彌覽兮九隅彷徨兮蘭宮芷閭兮葯房奮搖兮眾芳菌閣兮蕙樓觀道兮從橫寶金兮委積美玉兮盈堂桂水兮潺湲揚流兮洋洋蓍蔡兮踊躍孔鶴兮回翔撫檻兮遠望念君兮不忘怫鬱兮莫陳永懷兮內傷匡機天門兮墜戶孰由兮賢者無正兮溷廁懷德兮何睹假寐兮愍斯誰可與兮寤語痛鳳兮遠逝畜鴳兮近處鯨鱏兮幽潛從蝦兮游陼乘此兮登陽載象兮上行朝發兮葱嶺夕至兮明光北飲兮飛泉南采兮芝英宣游兮列宿順極兮彷徉紅采兮騂衣翠嫖兮為裳舒佩兮綝孋竦余劍兮干將騰蛇兮後從飛駏兮步旁微觀兮玄圃覽察兮瑤光啟匱兮探筴悲命兮相當紉蕙兮永詞將離兮所思浮雲兮容與道余兮何之遠望兮仟眠聞雷兮闐闐陰憂而感余惆悵兮自怜通路林不容兮鳴蜩余何留兮中州陶嘉月兮總駕搴玉英兮自脩結榮茝兮逶逝將去烝兮遠游徑岱土兮魏闕歷九曲兮牽牛聊假日兮相佯遺光燿兮周流望太一兮淹息紆余轡兮自休晞白日兮皎皎彌遠路兮悠悠顧列孛兮縹縹觀幽雲兮陳浮鉅寶遷兮砏磤雉咸雊兮相求泱莽莽兮究志懼吾心兮懤懤余馬兮飛柱覽可與兮匹儔卒莫有兮纖介永余思兮怞怞危俊世溷兮冥昏違君兮歸真乘龍兮偃蹇高回翔兮上臻襲英衣兮緹䌌披華裳兮芳芬登羊角兮扶輿浮雲漠兮自娛握神精兮雍容與神人兮相胥流星墜兮成雨進瞵盻兮上丘墟覽舊邦兮滃鬱余安能兮八久居志懷逝兮心懰慄紆余轡兮躊躇聞素女兮微歌聽王后兮吹竽魂凄愴兮感哀腸回回兮盤紆撫余佩兮繽紛高太息兮自憐使祝融兮先行令昭昭兮開門馳六蛟兮上征竦余駕兮入冥歷九州兮索合誰可與兮終生忽反顧兮西囿睹軫兮崎傾橫垂涕兮泫流悲余後兮失靈昭世季春兮陽陽列草兮成行余悲兮蘭生委積兮從橫江離兮遺捐辛夷兮擠臧伊思兮往古亦多兮遭殃伍胥兮浮江屈子兮沉湘運余兮念茲心內兮懷傷望淮兮沛沛濱流兮則逝榜舫兮下流東往兮礚礚蛟龍兮導引文魚兮上瀨抽蒲兮陳坐援芙蕖兮為蓋水躍兮余旌繼以兮微蔡雲旗兮電鶩儵忽兮容裔河伯兮開門迎余兮歡欣顧念兮舊都懷恨兮艱難竊哀兮浮萍泛淫兮無根尊嘉秋風兮蕭蕭舒芳兮振條微霜兮眇眇病殀兮鳴蜩玄烏兮辭歸飛翔兮靈丘望谿兮滃鬱熊羆兮呴嗥唐虞兮不存何故兮久留臨淵兮汪洋顧臨兮忽荒修余兮袿衣騎霓兮南上乘雲兮回回亹亹兮自強將息兮蘭皋失志兮悠悠蒶蘊兮黴黧思君兮無聊身去兮意存愴恨兮懷愁蓄英登九靈兮游神靜女歌兮微晨悲皇丘兮積葛眾體錯兮交紛貞枝抑兮枯稿枉車登兮慶雲感余志兮慘栗心愴愴兮自憐駕玄螭北征曏吾路兮葱嶺連五宿兮建旄揚氛氣兮為旌歷廣漢兮馳騖覽中國兮冥冥玄武步兮水母與吾期兮南榮登華蓋兮乘陽聊逍謠兮播光抽庫婁兮酌醴援瓟兮接糧畢休息遠逝發玉軔兮西行惟時俗兮疾正弗可久兮此方寤辟摽兮永思心怫鬱兮內傷思忠覽杳杳兮世惟余惆悵兮何歸傷時俗兮溷亂將奮翼兮高飛駕八龍兮連蜷建虹旌兮威夷觀中宇兮浩浩紛翼翼兮上躋浮溺水兮舒光淹低回兮京沶屯塺余車兮索友觀王公兮問師道莫貴兮歸真羨余術兮可夷吾乃逝兮南娛道幽路兮九疑越塵炎火兮萬里過萬首兮嶷嶷濟光海兮蟬蛻絕北梁兮水辭浮雲鬱兮晝昏霾土忽兮塺塺息陽城兮廣夏衰色罔兮中怠意曉陽兮燎寤迺自稱兮在茲思堯舜兮襲興幸咎繇兮獲謀悲九州兮靡君撫軾嘆兮作詩陶壅悲哉吁嗟兮心內切磋款冬而生兮凋彼葉柯瓦礫進寶兮捐棄隨和鈆刀厲御兮頓棄太阿驥垂兩耳兮中坂蹉跎蹇驢服駕兮無用日多修潔處幽兮貴寵沙劘鳳皇不祥兮鶉鴳飛揚乘虹參蜺兮載雲變化鷦鵬開路兮後屬青蛇步驟桂林兮超驟卷阿丘陵翔儛兮谿谷悲歌神章靈篇兮赴曲相和余私娛茲兮孰哉復加還顧世俗兮壞敗罔羅倦佩將逝兮涕流滂沱株昭亂曰皇門開兮照下土株穢除兮蘭芷睹四佞放兮後得禹聖舜攝兮昭堯緒孰能若兮愿為輔見楚辭四子講德論褎既為益州刺史王襄作中和樂職宣布之詩又作傳名曰四子講德以明其意焉微斯文學問於虛儀夫子曰蓋聞國有道貧且賤焉恥也今夫子閉門距躍專精趨學有日矣幸遭聖主平世而久懷寶是伯牙去鍾期而舜禹遁帝堯也於是欲顯名號建功業不亦難乎夫子曰然有是言也夫蚊䖟終日經營不能越階序附驥尾則涉千里攀鴻翮則翔四海僕雖嚚頑願從足下雖然何由而自達哉文學曰陳懇誠於本朝之上行話談於公卿之門夫子曰無介紹之道安從行乎公卿文學曰何為其然也昔甯戚商歌以干齊桓越石負芻而寤晏嬰非有積素累舊之歡皆塗覯卒遇而以為親者也故毛嬙西施善毀者不能蔽其好嫫姆倭傀善譽者不能掩其醜苟有至道何必介紹夫子曰咨夫特達而相知者千載之一遇也招賢而處友者眾士之常路也是以空柯無刃公輸不能以斲但懸曼矰蒲苴不能以射故膺騰撇波而濟水不如乘舟之逸也衝蒙涉田而能致遠未若遵塗之疾也才蔽於無人行衰於寡黨此古今之患唯文學慮之文學曰唯唯敬聞命矣於是相與結侶攜手俱遊求賢索友歷于西州有二人焉乘輅而歌倚輗而聽之詠歎中雅轉運中律嘽緩舒繹曲折不失節問歌者為誰則所謂浮遊先生陳丘子者也於是以士相見之禮友焉禮文既集文學夫子降席而稱曰俚人不識寡見尠聞曩從末路望聽玉音竊動心焉敢問所歌何詩請聞其說浮遊先生陳丘子曰所謂中和樂職宣布之詩益州刺史之所作也刺史見太上聖明股肱竭力德澤洪茂黎庶和睦天人並應屢降瑞福故作三篇之詩以歌詠之也文學曰君子動作有應從容得度南容三復白珪孔子覩其慎戒太子擊誦晨風文侯諭其指意今吾子何樂此詩而詠之也先生曰夫樂者感人密深而風移俗易吾所以詠歌之者美其君術明而臣道得也君者中心臣者外體外體作然後知心之好惡臣下動然後知君之節趨好惡不形則是非不分節趨不立則功名不宣故美玉蘊於碔砆凡人視之怢焉良工砥之然後知其和寶也精練藏於鐮朴庸人視之忽焉巧治鑄之然後知其幹也況乎聖德巍巍蕩蕩民氓所不能命哉是以刺史推而詠之揚君德美深乎洋洋罔不覆載紛紜天地寂寥宇宙明君之惠顯忠臣之節究皇唐之世何以加茲是以每歌之不知老之將至也文學曰書云迪一人使四方若卜筮夫忠賢之臣導主志承君惠攄盛德而化洪天下安瀾比屋可封何必歌詩詠賦可以揚君哉愚竊惑焉浮遊先生色勃眥溢曰是何言與昔周公詠文王之德而作清廟建為頌首吉甫歎宣王穆如清風列于大雅夫世衰道微偽臣虛稱者殆也世平道明臣子不宣者鄙也鄙殆之累傷乎王道故自刺史之來也宣布詔書勞來不怠今百姓徧曉聖德莫不霑濡厖眉耆耇之老咸愛惜朝夕願濟須臾且觀大化之淳流於是皇澤豐沛主恩滿溢百姓歡欣中和感發是以作歌而詠之也傳曰詩人感而後思思而後積積而後滿滿而後作言之不足故嗟歎之嗟歎之不足故詠歌之詠歌之不厭不知手之舞之足之蹈之也此臣子於君父之常義古今一也今子執分寸而罔億度處把握而卻寥廓乃欲圖大人之樞機道方伯之失得不亦遠乎陳丘子見先生言切恐二客慚膝步而前曰先生詳之行潦暴集江海不以為多鰌鱓並逃九罭不以為虛是以許由匿堯而深隱唐氏不以衰夷齊恥周而遠餓文武不以卑夫青蠅不能穢垂棘邪論不能惑孔墨今刺史質敏以流惠舒化以揚名采詩以顯至德歌詠以董其文受命如絲明之如緍甘棠之風可倚而俟也二客雖窒計沮議何傷顧謂文學夫子曰先生微矜於談道又不讓乎當仁亦未巨過也願二子措意焉夫子曰否夫雷霆必發而潛底震動枹鼓鏗鏘而介士奮竦故物不震不發士不激不勇今文學之言欲以議愚感敵舒先生之憤願二生亦勿疑於是文繹復集乃始講德文學夫子曰昔成康之世君之德與臣之力也先生曰非有聖智之君惡有甘棠之臣故虎嘯而風寥戾龍起而致雲氣蟋蟀俟秋吟蜉蝣出以陰易曰飛龍在天利見大人鳴聲相應仇偶相從人由意合物以類同是以聖主不偏窺望而視以明不殫傾耳而聽以聰何則淑人君子人就者眾也故千金之裘非一狐之腋大廈之材非一丘之木太平之功非一人之略也蓋君為元首臣為股肱明其一體相待而成有君而無臣春秋刺焉三代以上皆有師傳五伯以下各自取友齊桓有管鮑隰甯九合諸侯一匡天下晉文公有咎犯趙衰取威定霸以尊天子秦穆有王由五羖攘卻西戎始開帝緒楚莊有叔孫子反兼定江淮威震諸夏句踐有種蠡渫庸剋燙彊吳雪會稽之恥魏文有段干田翟秦王寢兵折衝萬里燕昭有郭隗樂毅夷破彊齊困閔於莒夫以諸侯之細功名猶尚若此而況帝王選於四海羽翼百姓哉故有賢聖之君必有明智之臣欲以積德則天下不足平也欲目立威則百蠻不足攘也今聖主冠道德履純仁被六藝佩禮文屢下明詔舉賢良求術士招異倫拔俊茂是以海內歡慕莫不風馳雨集襲雜並至填庭溢闕含淳詠德之聲盈耳登降揖讓之禮極目進者樂其條畼怠者欲罷不能偃息匍匐乎詩書之門遊觀乎道德之域咸絜身修思吐情素而披心腹各悉精銳以貢忠誠允願推主上弘風俗而騁太平濟濟乎多士文王所以寍也若乃美政所施洪恩所潤不可究陳舉孝以篤行崇能以招賢去煩蠲苛以綏百姓祿勤增奉以厲貞廉減膳食卑宮觀省田官損諸苑疎繇役振乏困恤民災害不遑遊宴閔耄老之逢辜憐縗絰之服事惻隱身死之腐人悽愴子弟之縲匿恩及飛鳥惠加走獸胎卵得以成育草木遂其零茂愷悌君子民之父母豈不然哉先生獨不聞秦之時耶違三王背五帝滅詩書壞禮樂信任群小憎惡仁智詐偽者進達佞諂者容入宰相刻峭大理峻法處位而任政者皆短於仁義長於酷虐狼摯虎攫懷殘秉賊其所臨莅莫不肌粟慴伏吹毛求疵並施蟄毒百姓征彸無所措其手足嗷嗷愁怨遂亡秦族是以養雞者不畜貍牧獸者不育豺樹木者憂其蠹保民者除其賊大漢之為政也崇簡易尚寬柔進淳仁舉賢才上下無怨民用和睦今海內樂業朝廷淑清天符既章人瑞又明品物咸亨山川降靈神光燿暉洪洞朗天鳳皇來儀翼翼邕邕群鳥並從舞德垂容神雀仍集麒麟自至甘露滋液嘉禾櫛比大化隆洽男女條畼家給年豐咸則三壤豈不盛哉昔文王應九尾狐而東夷歸周武王獲白魚而諸侯同辭周公受秬鬯而鬼方臣宣王得白狼而夷狄賓夫名自正而事自定也今南郡獲白虎亦偃武興文之應也獲之者張武武張而猛服也是以北敵賓洽邊不恤寇甲士寢而旌旗仆也文學夫子曰天符既聞命矣敢問人瑞先生曰夫匈奴者百蠻之最彊者也天性憍蹇習俗傑暴賤老貴壯氣力相高業在攻伐事在獵射兒能騎羊走箭飛鏃逐水隨畜都無常處鳥集獸散往來馳騖周流曠野以濟嗜欲其耒耜則弓矢鞍馬播種則扜弦掌拊收秋則奔狐馳兔穫刈則顛倒殪仆追之則奔遁釋之則為寇是以三王不能懷五伯不能綏驚邊扤士屢犯芻蕘詩人所歌自古患之今聖德隆盛威靈外覆日逐舉國而歸德單于稱臣而朝賀乾坤之所開陰陽之所接編結沮顏燋齒梟瞷翦髮黥首文身裸袒之國靡不奔走貢獻懽忻來附婆娑嘔吟鼓掖而笑夫鴻均之世何物不樂飛鳥翕翼泉魚奮躍是以刺史感懣舒音而詠至德鄙人黭淺不能究識敬遵所聞未剋殫焉於是二客醉于仁義飽于盛德終日仰歎怡懌而悅服見文選聖主得賢臣頌夫荷旃被毳者難與道純綿之麗密羹藜唅糗者不足與論太牢之滋味今臣辟在西蜀生於窮巷之中長於蓬茨之下無有游觀廣覽之知顧有至愚極陋之累不足以塞厚望應明指雖然敢不略陳愚而抒情素記曰共惟春秋法五始之要在乎審己正統而已夫賢者國家之器用也所任賢則趨舍省而功施普器用利則用力少而就效眾故工人之用鈍器也勞筋苦骨終日矻矻及至巧冶鑄干將之樸清水焠其鋒越砥斂其咢水斷蛟龍陸剸犀革忽若彗氾畫塗如此則使離褸督繩公輸削墨雖崇臺五增延袤百丈而不溷者工用相得也庸人之御駑馬亦傷吻敝策而不進於行匈喘膚汗人極馬倦及至駕齧䣛驂乘旦王良執靶韓哀附輿縱馳騁騖忽如景靡過都越國蹶如歷塊追奔電逐遺風周流八極萬里壹息何其遼哉人馬相得也故服絺綌之涼者不苦盛暑之鬱燠襲狐裘之煗者不憂至寒之悽愴何則有其具者易其備賢人君子亦聖王之所以易海內也是以嘔喻受之開寬裕之路以延天下英俊也夫竭知附賢者必建仁策索人求士者必樹伯迹昔周公躬吐捉之勞故有圉空之隆齊桓設庭燎之禮故有匡合之功由此觀之君人者勤於求賢而逸於得人人臣亦然昔賢者之未遭遇也圖事揆策則君不用其謀陳見悃誠則上不然其信進仕不得施效斥逐又非其愆是故伊尹勤於鼎俎太公困於鼓刀百里自鬻甯子飯牛離此患也及其遇明君遭聖主也運籌合上意諫諍即見聽進退得關其忠任職得行其術去卑辱奧渫而升本朝離疏釋蹻而享膏粱剖符錫壤而光祖考傳之子孫以資說士故世必有聖知之君而後有賢明之臣故虎嘯而風冽龍興而致雲蟋蟀竢秋唫蜉蝣出以陰易曰飛龍在天利見大人詩曰思皇多士生此王國故世平主聖俊艾將自至若堯舜禹湯文武之君獲稷契皋陶伊尹呂望明明在朝穆穆列布聚精會神相得益章雖伯牙操遞鍾逢門子彎烏號猶未足以喻其意也故聖主必待賢臣而弘功業俊士亦俟明主以顯其德上下俱欲驩然交欣千載壹合論說無疑翼乎如鴻毛過順風沛乎如巨魚縱大壑其得意若此則胡禁不止曷令不行化溢四表橫被無窮遐夷貢獻萬祥畢溱是以聖主不徧窺望而視已明不單頃耳而聽已聰恩從祥風翱德與和氣游太平之責塞優游之望得遵遊自然之勢恬淡無為之場休徵自至壽考無疆雍容垂拱永永萬年何必偃卬詘信若彭祖呴噓呼吸如僑松眇然絕俗離世哉詩云濟濟多士文王以寧蓋信乎其以寧也見漢書王褎傳文選蓺文類聚二十甘泉宮頌甘泉山天下顯敞之名處也前接大荊後臨北極左撫仁鄉右望素域其宮室也仍𡽱嶭而為觀攘抗岸以為階壅波瀾而鱗坻馳道列以曲遠覽除閣之麗靡覺堂殿之巍巍徑落莫以差錯編玳瑁之文㮰鏤螭龍以造牖采雲氣以為楣神星羅於題鄂虹蜆往往而繞榱縵倏忽其無垠意能了之者誰竊想聖主之優遊時娛神而款縱坐鳳皇之堂聽和鸞之弄臨麒麟之域驗符瑞之貢詠中和之歌讀太平之頌見蓺文類聚六十二十分未升其一增惶懼而目眩若播岸而臨坑登木末以窺泉見文選魏都賦注引王褎甘泉賦疑賦乃頌之誤碧雞頌持節使者王褒謹拜南崖敬移金精神馬縹碧之雞處南之荒深谿回谷非土之鄉歸來歸來漢德無彊廉乎唐虞澤配三皇黃龍見兮白虎仁歸來可以為倫歸來翔兮何事南荒見後漢西南夷傳水經淹水注文選劉峻廣絕交論注僮約蜀郡王子淵以事到湔止寡婦楊惠舍惠有夫時奴名便了子淵倩奴行酤酒便了拽大杖上夫冢嶺曰大夫買便了時但要守家不要為他人男子酤酒子淵大怒曰奴寍欲賣耶惠曰奴大忤人人無欲者子淵即決買券云云奴復曰欲使皆上券不上券便了不能為也子淵曰諾券文曰神爵三年正月十五日資中男子王子淵從成都安志里女子楊惠買亡夫時戶下髯奴便了決賈萬五千奴當從百役使不得有二言晨起早掃食了洗滌居當穿臼縳箒截竿鑿斗浚渠縳落鉏園斫陌杜埤地刻大枷屈竹作杷削治鹿盧出入不得騎馬載車踑坐大呶下床振頭捶鉤刈芻結葦躐纑汲水絡佐䣯𨢢織履作麤黏雀張烏結網捕魚繳雁彈鳧登山射鹿入水捕龜後園縱養雁騖百餘驅逐鴟鳥持梢牧豬種薑養芋長育豚駒糞除堂廡餧食馬牛鼓四起坐夜半益芻二月春分被隄杜疆落桑皮椶種瓜作瓠別落披蔥焚槎發芋壟集破封日中早熭雞鳴起舂調治馬戶兼落三重舍中有客提壼行酤汲水作餔滌杯整桉園中拔蒜斷蘇切脯築肉臛芋膾魚炰鱉烹荼盡具已而蓋藏關門塞竇餧豬縱犬勿與鄰里爭鬭奴但當飯豆飲水不得嗜酒欲飲美酒唯得染脣潰口不得傾盂覆斗不得辰出夜入交關侔偶舍後有樹當裁作船上至江州下到湔主為府掾求用錢推訪堊販椶索緜亭買席往來都洛當為婦女求脂澤販於小市歸都擔枲轉出旁蹉牽犬販鵝武都買荼楊氏擔荷往市聚慎護奸偷入市不得夷蹲旁臥惡言醜罵多作刀矛持入益州貨易羊牛奴自教精慧不得癡愚持斧入山斷輮裁轅若有餘殘當作俎几木屐及犬彘盤焚薪作炭礨石薄岸治舍蓋屋削書代牘日暮欲歸當送乾柴雨三束四月當披九月當穫十月收豆麥窖芋南安拾栗採橘持車載輳多取蒲苧益作繩索雨墮無所為當編蔣織簿種植桃李棃柿柘桑三丈一樹八尺為行果類相從縱橫相當果熟收斂不得吮嘗犬吠當起驚告鄰里棖門柱戶上樓擊鼓荷盾曳矛還落三周勤心疾作不得遨遊奴老力索種莞織席事訖休息當舂一石夜半無事浣衣當白若有私錢主給賓客奴不得有奸私事事當關白奴不聽教當笞一百讀券文適訖詞窮咋索仡仡叩頭兩手自摶目淚下落鼻涕長一尺審如王大夫言不如早歸黃土陌丘蚓鑽額早知當爾為王大夫酤酒真不敢作惡見蓺文類聚三十五初學記十九御覽五百九十八九百九十六古文苑責鬚髥奴辭我觀人鬚長而復黑冉弱而調離離若緣坡之竹鬱鬱若春田之苗因風拂靡隨身飄颻爾乃附以豐頤表以蛾眉發以素顏呈以妍姿約之以絀綫潤之以芳脂莘莘翼翼靡靡綏綏振之發曜黝若元珪之垂於是搖鬢奮髭則論說虞唐鼓鬐動鬣則研覈否臧內育環形外闔宮商相如以之都雅顓孫以之堂堂豈若子髥既亂且赭枯槁禿瘁劬勞辛苦汗垢流離污穢泥土傖囁穰孺與塵為侶无素顏可依无豐頤可怙動則困於總滅靜則窘於囚虜薄命為髭正著子頤為身不能疵其四體為智不能御其形骸癩鬚瘦面常如死灰曾不如犬羊之毛尾狐貍之毫釐為子鬚者不亦難哉見初學記十九又見古文苑以為黃香作道德指歸說目莊子曰昔者老子之作也變化所由道德為母效經列首天地為象上經配天下經配地陰道八陽道九以陰行陽故七十有二首以陽行陰故分為上下以五行八故上經四十而更始以四行八故下經三十有二而終矣陽道奇陰道偶故上經先而下經後陽道大陰道小故上經眾而下經寡陽道左陰道右故上經覆來下經覆往反覆相過淪為一形冥冥混混道為中主重符列驗以見端緒下經為門上經為戶智者見其經效則通乎天地之數陰陽之紀夫婦之配父子之親君臣之義萬物敷矣見祕冊彙函本座右銘夫疾行不能遁影大音不能掩響默然託蔭則影響無因常體卑弱則禍患無萌口舌者禍福之門滅身之斧言語者天命之屬形骸之部出失則患入言失則亡身是以聖人當言而懷發言而憂如赴水火履危臨深有不得已當而後言嗜欲者潰腹之矛貨利者喪身之仇嫉妒者亡軀之害讒佞者刎頸之兵殘酷者絕世之殃陷害者滅嗣之場淫戲者殫家之塹嗜酒者窮餒之藪忠孝者富貴之門節儉者不竭之源吾日三省傳告後嗣萬世勿遺見
