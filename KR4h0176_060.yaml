body:
  text: 王尊劾奏匡衡丞相衡御史大夫談位三公典五常九德以總方略一統類廣教化美風俗為職知中書謁者令顯等專權擅勢大作威福縱恣不制無所畏忌為海內患害不以時白奏行罰而阿諛曲從附下罔上懷邪迷國無大臣輔政之義皆不道在赦令前赦後衡談舉奏顯不自陳不忠之罪而反揚著先帝任用傾覆之徒妄言百官畏之甚於主上卑君尊臣非所宜稱失大臣體又正月行幸曲臺臨饗罷衛士衡與中二千石大鴻臚賞等會坐殿門下衡南鄉賞等西鄉衡更為賞布東鄉席起立延賞坐私語如食頃衡知行臨百官共職萬衆會聚而設不正之席使下坐上相比為小惠於公門之下動不中禮亂朝廷爵秩之位衡又使官大奴入殿中問行起居還言漏上十四刻行臨到衡安坐不變色改容無怵惕肅敬之心驕慢不謹皆不敬見漢書王尊傳又略見匡衡傳行縣還上奏事強不陵弱各得其所寬大之政行和平之氣通見漢書王尊傳安定太守告屬縣教令長丞尉奉法守城為民父母抑強扶弱宣恩廣澤甚勞苦矣太守以今日至府願諸君卿勉力正身以率下故行貪鄙能變更者與為治明慎所職毋以身試法見漢書王尊傳又欶掾功曹教掾功曹各自底厲助太守為治其不中用趣自避退毋久妨賢夫羽翮不修則不可以致千里闑內不理無以整外府丞悉署吏行能分別白之賢為上毋以富賈人百萬不足與計事昔孔子治魯七日誅少正卯今太守視事已一月矣五官掾張輔懷虎狼之心貪汙不軌一郡之錢盡入輔家然適足以葬矣今將輔送獄直符史詣閣下從太守受其事丞戒之戒之相隨入獄矣見漢書王尊傳奏糴三輔等郡穀故事歲漕關東穀四百萬斛以給京師用卒六萬人宜糴三輔弘農河東上黨太原郡穀足供京師可以省關東漕卒過半見漢書食貨志上白築常平倉令邊郡皆築倉以穀賤時增其賈而糶以利農穀貴時減賈而糶名曰常平倉見漢書食貨志上徙南北郊議禮記曰燔柴於太壇祭天也瘞薶於大折祭地也兆於南郊所以定天位也祭地於大折在北郊就陰位也郊處各在聖王所都之南北書曰越三日丁巳用牲於郊牛二周公加牲告徙新邑定郊禮於雒明王聖主事天明祀地察天地明察神明章矣天地以王者為主故聖王制祭天地之禮必於國郊長安聖主之居皇天所觀視也甘泉河東之祠非神靈所饗宜徙就正陽大陰之處違俗復古循聖制定天位如禮便見漢書郊祀志下奏劾王商商位三公爵列侯親受詔策為天下師不遵法度以翼國家而回辟下媚以進其私執左道以亂政為臣不忠罔上不道甫刑之辟皆為上戮罪名明白臣請詔謁者召商詣若盧詔獄見漢書王商傳上封事召見對言王鳳不可任用天道聰明佑善而災惡以瑞異為符效今陛下以未有繼嗣引近定陶王所以承宗廟重社稷上順天心下安百姓此正義善事當有祥瑞何故致災異災異之發為大臣顓政者也今聞大將軍猥歸日蝕之咎於定陶王建遣之國苟欲使天子孤立於上顓擅朝事以便其私非忠臣也且日蝕陰侵陽臣顓君之咎今政事大小皆自鳳出天子曾不一舉手鳳不內省責反歸咎善人推遠定陶王且鳳誣罔不忠非一事也前丞相樂昌侯商本以先帝外屬內行篤有威重位歷將相國家柱石臣也其人守正不肯詘節隨鳳委曲卒用閨門之事為鳳所罷身以憂死衆庶愍之又鳳知其小婦弟張美人已嘗適人於禮不宜配御至尊託以為宜子內之後宮苟以私其妻弟聞張美人未嘗任身就館也且羌胡尚殺首子以蕩腸正世況於天子而近已出之女也此三者皆大事陛下所自見足以知其餘及它所不見者鳳不可令久典事宜退使就弟選忠賢以代之見漢書元后傳奏封事薦馮野王中山孝王舅琅邪太守馮野王先帝時歷二卿忠信質直知謀有餘野王以王舅出以賢復入明聖主樂進賢也見漢書元后傳楊興賈捐之獄議興捐之懷詐偽以上語相風更相薦譽欲得大位漏泄省中語罔上不道書曰讒説殄行震驚朕師王制順非而澤不聽而誅請論如法見漢書賈捐之傳因災異上書辭謝陛下即位思慕諒暗故詔臣鳳典領尚書事上無以明聖德下無以益政治今有茀星天地赤黃之異咎在臣鳳當伏顯戮以謝天下今諒暗己畢大義皆舉宜躬親萬機以承天心見漢書元后傳因日蝕上言宜遣定陶王之國日蝕陰盛之象為非常異定陶王雖親於禮當奉藩在國今留侍京師詭正非常故天見戒宜遣王之國見漢書元后傳上疏乞骸骨臣材駑愚戇得以外屬兄弟七人封為列侯宗族蒙恩賞賜無量輔政出入七年國家委任臣鳳所言輒聽薦士常用無一功善陰陽不調災異數見咎在臣鳳奉職無狀此臣一當退也五經傳記師所誦説咸以日蝕之咎在於大臣非其人易曰折其右肱此臣二當退也河平以來臣久病連年數出在外曠職素餐此臣三當退也陛下以皇太后故不忍誅廢臣猶自知當遠流放又重自念兄弟宗族所蒙不測當殺身靡骨死輦轂下不當以無益之故有離寢門之心誠歲餘以來所苦加侵日月益甚不勝大願願乞骸骨歸自治養冀賴陛下神靈未埋髮齒期月之間幸得瘳愈復望帷幄不然必置溝壑臣以非材見私天下知臣受恩深也以病得全骸骨歸天下知臣被恩見哀重巍巍也進退於國為厚萬無纖介之議唯陛下哀憐見漢書元后傳東平王求子史對臣聞諸侯朝聘考文章正法度非禮不言今東平王幸得來朝不思制節謹度以防危失而求諸書非朝聘之義也諸子書或反經術非聖人或明鬼神信物怪太史公書有戰國從橫權譎之謀漢興之初謀臣奇策天官災異地形厄塞皆不宜在諸侯王不可豫不許之辭宜曰五經聖人所制萬事靡不畢載王審樂道傅相皆儒者旦夕講誦足以正身虞意夫小辨破義小道不通致遠恐泥皆不足以留意諸益於經術者不愛於王見漢書宣元六王傳薦辛慶忌慶忌前在兩郡著功迹徵入歷位朝廷莫不信鄉質行正直仁勇得衆心通於兵事明略威重任國柱石父破羌將軍武賢顯名前世有威西夷臣鳳不宜久處慶忌之右見漢書辛慶忌傳上封事為淳于長求留陛下既託文以皇太后故誠不可更有它計見漢書翟方進傳與杜業書誠哀老姊垂白隨無狀子出關願勿復用前事相侵見漢書杜欽傳諫立趙皇后疏臣聞立後妃者王教之大端三綱之本理治道所由興廢也社稷所存亡也故夏之興也以塗山亡也以妹嬉殷之興也以有娀亡也以妲己周之興也以文母亡也以褒姒夫三代安危後主所觀是以聖王必審舉措察操行以計勝色者昌以色勝計者亡無鹽宿瘤天下之醜女也齊二君以計勝色立為后皆以折衝安國今許后以罪廢遂事已往於是欲立后妃宜得殊異於前上當奉宗廟下令萬民有所法則河魴河鯉齊薑宋子詩人所高萬乘之主當持久長非一切畢決目前者騼姬亂晉吳姬危趙夫滕妾非天下之母為玩弄可也昔薑后崇禮宣王中興樊姬正言楚莊成霸願留思察小臣惓惓之心見荀悅漢紀二十六上書諫尊寵董賢臣聞王者立三公法三光立九卿以法天明君臣之義當得賢人易曰鼎折足覆公餗喻三公非其人也書曰元首明哉股肱良哉以法天地昔孝文皇帝幸鄧通不過中大夫孝文皇帝幸韓嫣賞賜而已皆不在大位公孫弘以布被修德擢備宰相巧言令色君子不貴昔成湯拔伊尹于鼎俎文王招呂尚於釣濱武丁顯傅於版築桓公舉寧戚於擊角皆以立霸王之功騰茂績於無窮豈以利耳悅目為得意哉今大司馬衛將軍高安侯董賢纍世無功於漢朝又無肺腑之連復無名迹高行以矯世升擢數年列備鼎足曲衛禁兵主歷天文無功封爵父子兄弟橫蒙拔擢賞賜空竭帑藏萬物喧譁偶言道路誠不當天心也甘褒神蚖變化為人實生褒姒亂周國恐陛下有過失之譏賢有小人不識進退之禍非所以見卓爾垂法後世陛下采芻蕘賢負薪冀有益於毫釐見荀悅漢紀二十九因雉雊上言天地之氣以類相應譴告人君甚微而著雉者聽察先聞雷聲故月令以紀氣經載高宗雊雉之異以明轉禍為福之驗今雉以博士行禮之日大衆聚會飛集于庭歷階登堂萬衆睢睢驚怪連日徑歷三公之府太常宗正典宗廟骨肉之官然後入宮其宿留告曉人具備深切雖人道相戒何以過是見漢書五行志中之下復對詔陛下安得亡國之語不知誰主為佞讇之計誣亂聖德如此者左右阿諛甚衆不待臣音復讇而足公卿以下保位自守莫有正言如令陛下覺悟懼大禍且至身深責臣下繩以聖法臣音當先受誅豈有以自解哉今即位十五年繼嗣不立日日駕車而出泆行流聞海內傳之甚於京師外有微行之害內有疾病之憂皇天數見災異欲人變更終已不改天尚不能感動陛下臣子何望獨有極言待死命在朝暮而已如有不然老母安得處所尚何皇太后之有高祖天下當以誰屬乎宜謀於賢知克己復禮以求天意繼嗣可立災變尚可銷也見漢書五行志中之下毀廟議孝文皇帝除誹謗去肉刑躬節儉不受獻罪人不帑不私其利出美人重絶人類賓賜長老收恤孤獨德厚侔天地利澤施四海宜為帝者太宗之廟見漢書韋玄成傳郅支縣頭稿街議春秋夾谷之會優施笑君孔子誅之方盛夏首足異門而出宜縣十日乃埋之見漢書陳湯傳上疏斬送郅支首臣聞天下之大義當混為一昔有唐虞今有強漢胸奴呼韓邪單于已稱北藩唯郅支單于叛逆未伏其辜大夏之西以為強漢不能臣也郅支單于慘毒行於民大惡通于天臣延壽臣湯將義兵行天誅賴陛下神靈陰陽並應天氣精明陷陳克敵斬郅支首及名王以下宜縣頭稿街蠻夷邸間以示萬里明犯強漢者雖遠必誅見漢書陳湯傳上疏自理臣與吏士共誅郅支單于幸得禽滅萬里振旅宜有使者迎勞道路今司隸反逆收繫按驗是為郅支報仇也見漢書陳湯傳上封事請徙初陵初陵京師之地最為肥美可立一縣天下民不徙諸陵三十餘歲矣關東富人益衆多規良田役使貧民可徙初陵以強京師衰弱諸侯又使中家以下得均貧富湯願與妻子家屬徙初陵為天下先見漢書陳湯傳報謝淮陽王當今朝廷無賢臣災變數見足為寒心萬姓咸歸望於大王大王奈何恬然不求入朝見輔助主上乎見漢書宣元六王傳復遺淮陽王書博幸得肺腑數進愚策未見省察北遊燕趙欲循行郡國求幽隱之士聞齊有駟先生者善為司馬兵法大將之材也博得謁見承間進問五帝三王究竟要道卓爾非世俗之所知今邊境不安天下騷動微此人其莫能安也又聞北海之瀕有賢人焉纍世不可逮然難致也得此二人而薦之功亦不細矣博願馳西以此赴助漢急無財幣以通顯之趙王使謁者持牛酒黃金三十斤勞博博不受復使人願尚女聘金二百斤博未許會得光書云大王已遣光西與博并力求朝博自以棄捐不棄大王還意反義結以朱顏願殺身報德朝事何足言大王誠賜咳唾使得盡死湯禹所以成大功也駟先生蓄積道術書無不有願知大王所好請得輒上見漢書宣元六王傳已見中書令石君求朝許以金五百斤賢聖制事蓋慮功而不計費昔禹治鴻水百姓罷勞成功既立萬世賴之今聞陛下春秋未滿四十髮齒墮落太子幼弱佞人用事陰陽不調百姓疾疫飢饉死者且半鴻水之害殆不過此大王緒欲救世將比功德何可以忽博已與大儒知道者為大王為便宜奏陳安危指災異大王朝見先口陳其意而後奏之上必大悅事成功立大王即有周邵之名邪臣散亡公卿變節功德亡比而梁趙之寵必歸大王外家亦將富貴何復望大王之金錢漢書宣元六王傳報淮陽王已許石君須以成事見漢書宣元六王傳
