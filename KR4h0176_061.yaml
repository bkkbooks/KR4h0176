body:
  text: 翼奉上封事言邪正臣聞之於師治道要務在知下之邪正人誠鄉正雖愚為用若乃懷邪知益為害知下之術在於六情十二律而已北方之情好也好行貪狼申子主之東方之情怒也怒行陰賊亥卯主之貪狼必待陰賊而後動陰賊必待貪狼而後用二陰並行是以王者忌子卯也禮經避之春秋諱焉南方之情惡也惡行廉貞寅午主之西方之情喜也喜行寬大巳酉主之二陽並行是以王者吉午酉也詩曰吉日庚午上方之情樂也樂行姦邪辰未主之下方之情哀也哀行公正戌丑主之辰未屬陰戌丑屬陽萬物各以其類應今陛下明聖虛靜以待物至萬事雖衆何聞而不諭豈況乎執十二律而御六情於以知下參實亦甚優矣萬不失一自然之道也乃正月癸未日加申有暴風從西南來未主姦邪申主貪狼風以大陰下抵建前是人主左右邪臣之氣也平昌侯比三來見臣皆以正辰加邪時辰為客時為主人以律知人情王者之祕道也愚臣誠不敢以語邪人見漢書翼奉傳因災異應詔上封事臣聞之於師曰天地設位懸日月布星辰分陰陽定四時列五行以視聖人名之曰道聖人見道然後知王治之象故畫州土建君臣立律曆陳成敗以視賢者名之曰經賢者見經然後知人道之務則詩書易春秋禮樂是也易有陰陽詩有五際春秋有災異皆列終始推得失考天心以言王道之安危至秦乃不說傷之以法是以大道不通至於滅亡今陛下明聖深懷要道燭臨萬方布德流惠靡有闕遺罷省不急之用振救困貧賦醫藥賜棺錢恩澤甚厚又舉直言求過失盛德純備天下幸甚臣奉竊學齊詩聞五際之要十月之交篇知日蝕地震之效昭然可明猶巢居知風穴處知雨亦不足多適所習耳臣聞人氣內逆則感動天地天變見於星氣日蝕地變見於奇物震動所以然者陽用其精陰用其形猶人之有五臧六體五臧象天六體象地故臧病則氣色發於面體病則缺申動於貌今年太陰建於甲戌律以庚寅初用事曆以甲午從春曆中甲庚律得參陽性中仁義情得公正貞廉百年之精歲也正以精歲本首王位日臨中時接律而地大震其後連月久陰雖有大令猶不能復陰氣盛矣古者朝廷必有同姓以明親親必有異姓以明賢賢此聖王之所以大通天下也同姓親而易進異姓疏而難通故同姓一異姓五乃為平均今左右亡同姓獨以舅后之家為親異姓之臣又疏二后之黨滿朝非特處位勢尤奢僭過度呂霍上官足以卜之甚非愛人之道又非後嗣之長策也陰氣之甚不亦宜乎臣又聞未央建章甘泉宮才人各以百數皆不得天性若杜陵園其已御見者臣子不敢有言雖然太皇太后之事也及諸侯王園與其後宮宜為設員出其過制者此損陰氣應天救邪之道也今異至不應災將隨之其法大水極陰生陽反為大旱甚則有火災春秋宋伯姬是矣唯陛下裁察見漢書翼奉傳因災異上疏臣前上五際地震之效曰極陰生陽恐有火災不合明聽未見省答臣竊內不自信今白鶴館以四月乙未時加於卯月宿亢災與前地震同法臣奉乃深知道之可信也不勝拳拳願復賜閒卒其終始見漢書翼奉傳上疏請徙都洛陽臣聞昔者盤庚改邑以興殷道聖人美之竊聞漢德隆盛在於孝文皇帝躬行節儉外省繇役其時未有甘泉建章及上林中諸離宮館也未央宮又無高門武臺麒麟鳳皇白虎玉堂金華之殿獨有前殿曲臺漸臺宣室溫室承明耳孝文欲作一臺度用百金重民之財廢而不為其積土基至今猶存又下遺詔不起山墳故其時天下大和百姓給足德流後嗣如令處於當今因此制度必不能成功名天道有常王道亡常亡常者所以應有常也必有非常之主然後能立非常之功臣願陛下徙都於成周左據成皋右阻黽池前鄉嵩高後介大河建滎陽扶河東南北千里以為關而入敖倉地方百里者八九足以自娛東厭諸侯之權西遠羌胡之難陛下共己亡為按成周之居兼盤庚之德萬歲之後長為高宗漢家郊兆寢廟祭祀之禮多不應古臣奉誠難亶居而改作故願陛下遷都正本衆制皆定亡復繕治宮館不急之費歲可餘一年之畜臣聞三代之祖積德以王然皆不過數百年而絶周至成王有上賢之材因文武之業以周召為輔有司各敬其事在位莫非其人天下甫二世耳然周公猶作詩書深戒成王以恐失天下書則曰王毋若殷王紂其詩則曰殷之未喪師克配上帝宜監于殷駿命不易今漢初取天下起於豐沛以兵征伐德化未洽後世奢侈國家之費當數代之用非直費財又乃費士孝武之世暴骨四夷不可勝數有天下雖未久至於陛下八世九主矣雖有成王之明然亡周召之佐今東方連年饑饉加之以疾疫百姓菜色或至相食地比震動天氣溷濁日光侵奪繇此言之執國政者豈可以不懷怵惕而戒萬分之一乎故臣願陛下因天變而徙都所謂與天下更始者也天道終而復始窮則反本故能延長而亡窮也今漢道未終陛下本而始之於以永世延祚不亦優乎如因丙子之孟夏順太陰以東行到後七年之明歲必有五年之餘蓄然後大行考室之禮雖周之隆盛亡以加此唯陛下留神詳察萬世之策見漢書翼奉傳日辰時對師法用辰不用日辰為客時為主人見於明主侍者為主侍者為主人辰正時邪見者正侍者邪辰邪時正見者邪侍者正忠正之見侍者雖邪辰時俱正大邪之見侍者雖正辰時俱邪即以自知侍者之邪而時邪辰正見者反邪即以自知侍者之正而時正辰邪見者反正辰為常事時為一行辰疏而時精其效同功必參五觀之然後可知故曰察其所繇省其進退參之六合五行則可以見人性知人情難用外察從中甚明故詩之為學情性而已五性不相害六情更興廢觀性以曆觀情以律明主所宜獨用難與二人共也故曰顯諸仁臧諸用露之則不神獨行則自然矣唯奉能用之學者莫能行見漢書翼奉傳廟祀對昔成王徙洛般庚遷殷其所避就皆陛下所明知也非有聖明不能一變天下之道臣奉愚戇狂惑唯陛下裁赦見漢書翼奉傳拜魏郡太守上封事辛酉以來蒙氣衰去太陽精明臣獨欣然以為陛下有所定也然少陰倍力而乘消息臣疑陛下雖行此道猶不得如意臣竊悼懼守陽平侯鳳欲見未得至己卯臣拜為太守此言上雖明下猶勝之效也臣出之後恐必為用事所蔽身死而功不成故願歲盡乘傳奏事蒙哀見許乃辛巳蒙氣復乘卦太陽侵色此上大夫覆陽而上意疑也己卯庚辰之閒必有欲隔絶臣令不得乘傳奏事者見漢書京房傳因郵上封事臣以六月中言遁卦不效法曰道人始去寒涌水為災至其七月涌水出臣弟子姚平謂臣曰房可謂知道未可謂信道也房言災異未嘗不中今涌水已出道人當逐死尚復何言臣曰陛下至仁於臣尤厚雖言而死臣猶言也平又曰房可謂小忠未可謂大忠也昔秦時趙高用事有正先者非刺高而死高威自此成故秦之亂正先趣之今臣得出守郡自詭效功恐未效而死惟陛下無使臣塞涌水之異當正先之死為姚平所笑見漢書京房傳至陝復小封事乃丙戍小雨丁亥蒙氣去然少陰并力而乘消息戊子益甚到五十分蒙氣復起此陛下欲正消息雜卦之黨并力而爭消息之氣不勝彊弱安危之機不可不察己丑夜有還風盡辛卯太陽復侵色至癸巳日月相薄此邪陰同力而太陽為之疑也臣前白九年不改必有星亡之異臣願出任良試考功臣得居內星亡之異可去議者知如此者於身不利臣不可蔽故云使弟子不若試師臣為刺史又當奏事故復云為刺史恐太守不與同心不若以為太守此其所以隔絶臣也陛下不違其言而遂聽之此乃蒙氣所以不解太陽之色者也臣去朝稍遠太陽侵色益甚唯陛下毋難還臣而易逆天意邪說雖安于人天氣必變故人可欺天不可欺也願陛下察焉見漢書京房傳奏考功課吏法古帝王以功舉賢則萬化成瑞應著末世以毀譽取人故功業廢而致災異宜令百官各試其功災異可息見漢書京房傳別對災異地者大臣之位當載安萬民懷藏物類而動搖者此不欲為君載安萬民動搖思欲不安思欲篡逆也見開元占經四陰倍陽則地坼臣叛君則義廢此人君不親上下不厚致此災也不救則骨肉相殘父子分離氐羌叛去見開元占經四日行房乘三道太平日行上道升平日行次道霸世日行下道見隋書天文志上開元占經五引有刪節國有讒佞朝有殘臣則日無光暗冥不明易曰日中見斗日中星見明其冥也故貶之為暮也其救也遠佞諂近忠直修經典閉私道則日光明見開元占經六人君驕溢專明為陰所侵則有日蝕之災不救之必有篡臣之萌其救也君懷謙虛下賢受諫位有德祿有智日蝕災消也見開元占經十日月薄赤見日中烏將軍出旌舉此不祥必亡見開元占經六日鬭或赤或白或蒼或黃虎入邦此謂守邑破亡國君以此亡見開元占經六數日俱出若鬭天下兵大戰見開元占經六日蝕盡無光露者亡其邑見開元占經九人君好用佞邪朝無忠臣則月失其行見開元占經十一月晝明奸邪並作專明擅君之朝見開元占經十一月若晝明者月為臣日為君臣以明續君當其在時不可與君用力含穢以舒刑今晝明者奸邪並作專明擅君之朝不救則失其行而毀矣其救也出退強臣斷讒佞近直臣親賢良則月得其行不可專行矣見開元占經十一月三暈畢天下中外俱赦見開元占經十五月蝕者人君行適過時專受所致也不救則致水災壞城見開元占經十七人民不行仁恩破胎傷孕春殺無辜則歲星失度見御覽五營惑作變為華州人君之禍也出於東骨肉欲篡近北邊國謀入於西兵大起蠻貊戰入斗則大臣叛徑東西萬民病不救之則致日蝕既下謀上其救也設立政事正圖書修經術改惡為善也則國家安矣見開元占經三十火起災何人君貪財賦斂盡民貨即火為起不救必有日蝕之災矣其救之也舉廉直之士為首也見御覽六百二十七回風起何風者天之號令也當直而正普而不偏佞人衆君迷惑則回風起不救則致逆風起其救也用公直黜邪枉此災消矣見御覽八百七十六狂風發何人君政教無法為下所逆則致狂風發泄其救也修政教聘賢士狂風消矣見御覽八百七十六人君賦罰良善政教無常使命數變則致暴風折木發屋鳴瓦或害殺人其救也修舊典任忠臣思過自改則風災消同上人君擅私恩恣意重情不與臣下同謀即致偏雨夜墮也不救致苦雨降萬民愁潦水絶道其救也興公道無私黨此災消矣見御覽八百七十七無雲暴雨何人君封拜無功進無德則致不雲而雨暴過惡暴揚誅及無罪密雲而不雨其救也誅彊恤弱信及兆民雲雨時也見御覽八百七十七虹霓近日則姦臣謀貫日則客代主專君政大臣乘樞不救之則兵至宮殿戰其救也釋安樂誡非常正股肱入賢良見開元占經九十八引兩條御覽八百七十八雷鳴連而不絶者何夫雷鳴萬里今鳴不絶此謂人君行政事無常民不恐懼也故致遊雷之災雷當先電而鳴雷今與電俱出或鳴而後電者何此謂執法者貪苛見開元占經一百二引兩條御覽八百七十九久旱何曰人君無施澤惠利於下人則致旱也不救即蝗蟲害穀其救也宥謫罰行寬大惠兆民勞功吏賜鰥寡廩不足人君亢陽暴虐興師動衆下人悲怨陽氣盛陰氣沈故旱萬物枯死數有人災此金失其性若夏大旱則雩桐之以素車白馬布衣以身為牲或云誅讒佞之臣於市則三日之內雨降於天矣見藝文類聚一百御覽八百七十九山者三公之位台輔之德也乃興雲出雨漫溉萬物助天成功今崩去者此謂大臣懷叛不忠也見開元占經九十九江河沸者有聲無實此謂執政者懷姦不公衆邪並聚則致此災不救必有叛君謀其救也令百官舉公直選有德置於政見開元占經一百井水沸者謂人君好用讒邪所致也見開元占經一百水中火出何所謂陰氣溢亡陽施也女妃無陽則敵氣溢至水中火出不救有天殃陰害陽其救也正妃妾率後宮施命令詰四方嫁貞女賜鰥寡此災即消見開元占經一百五穀無實何君無仁德臣懷叛戾華飾虛舉薦賢名實不相副內為蘇秦之行外似夷齊之語故致五穀多無實朝廷無賢害氣傷穡不收國大饑其救也選明經舉茂才改往修來退去貪狼施恩行惠賞賜勞臣此災消矣見御覽八百七十四君贀臣職五榖滋豐北堂書鈔一百五十六律術對受學故小黃令焦延壽六十律相生之法以上生下皆三生二以下生上皆三生四陽下生陰陰上生陽終於中呂而十二律畢矣中呂上生執始執始下生去滅上下相生終於南事六十律畢矣夫十二律之變至於六十猶八卦之變至於六十四也宓犧作易紀陽氣之初以為律法建日冬至之聲以黃鍾為宮太簇為商姑洗為角林鍾為徵南呂為羽應鍾為變宮蕤賓為變徵此聲氣之元五音之正也故各統一日其餘以次運行當日者各自為宮而商徵以類從焉禮運篇曰五聲六律十二管還相為宮此之謂也以六十律分朞之日黃鍾自冬至始及冬至而復陰陽寒燠風雨之占生焉於以檢攝群音考其高下苟非革木之聲則無不有所合虞書曰律和聲此之謂也見續漢書律曆志上竹聲不可以度調故作準以定數準之狀如瑟長丈而十三弦隱閒九尺以應黃鍾之律九寸中央一弦下有畫分寸以為六十律清濁之節均中其弦使應黃鐘之聲案分寸以求諸律則皆如畫而應矣然則上古有鐘其次有律近古有準皆稍簡易之意其相生也黃鍾下生林鍾林鍾上生太簇太簇下生南呂南呂上生姑洗姑洗下生應鍾應鍾上生蕤賓蕤賓下生大呂大呂上生夷則夷則下生夾鍾夾鍾上生無射無射下生中呂中呂上生黃鍾上下相生終六十律執始以下四十八律文多不載孟春之月則太簇為宮姑洗為商蕤賓為角南呂為徵應鍾為羽大呂為變宮夷則為變徵他月效此也見續漢書律曆志上又見御覽十六有小異至治之世天地之氣合以生風天地之風氣定十二律見御覽十六引京房傳夫五音生於本性分為十二律轉生六十律皆所以紀斗氣效物類也天效以影地效以響即律也陰陽和則影至以律氣應則灰除是故天子常以冬夏至御前殿合八能之士陳八音聽樂韻度晷影候鍾律權土灰校陰陽冬至陽氣應則韻清影長極黃鍾通土灰輕而衡仰夏至陰氣應則韻濁影短極蕤賓通上灰重而衡低進退於先後五日之中八能各以候狀聞太史合封土效則和否則占侯氣之法為室三重戶閉塗膏必周密布緹幰室中以木為案每律各一內卑外高從其外加律其上以葭莩灰抑其內端案律而侯之氣至者灰去其為氣所動者灰散風所動者其灰聚殿中侯用玉律十二唯二至乃侯靈臺用竹律六十見御覽十六引京房傳又凡律度量衡用銅銅為物也精不為燥溼寒暑變其節不為風雨暴露改其形介然常似於君子之貞是以同銅也用竹為引者事之宜也見御覽十六引京房傳
