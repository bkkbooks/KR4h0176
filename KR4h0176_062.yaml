body:
  text: 楊興黃霧對陰盛侵陽之氣也高祖之約也非功臣不侯今太后諸弟皆以無功為侯非高祖之約外戚未曾有也故天為見異見漢書元后傳説史高將軍以親戚輔政貴重於天下無二然衆庶論議令問休譽不專在將軍者何也彼誠有所聞也以將軍之莫府海內莫不卬望而所舉不過私門賓客乳母子弟人情忽不自知然一夫竊議語流天下夫富貴在身而列士不譽是有狐白之裘而反衣之也古人病其若此故卑體勞心以求賢為務傳曰以賢難得之故因曰事不待賢以食難得之故而曰飽不待食惑之甚者也平原文學匡衡材智有餘經學絶倫但以無階朝廷故隨牒在遠方將軍誠召置莫府學士歙然歸仁與參事議觀其所有貢之朝廷必為國器以此顯示衆庶名流於世見漢書匡衡傳奏鎮撫星靡烏孫大吏大祿大監皆可以賜金印紫綬以尊輔大昆彌見漢書烏孫傳奏更立烏孫昆彌星靡怯弱可免更以季父左大將樂代為昆彌見漢書烏孫傳上書請送郅支侍子至庭中國與夷狄有羈縻不絶之義今既養全其子十年德澤甚厚空絶而不送近從塞還示棄捐不畜使無鄉從之心棄前恩立後怨不便議者見前江乃始無應敵之數知勇俱困以致恥辱即豫為臣憂臣幸得建強漢之節承明聖之詔宣諭厚恩不宜敢桀若懷禽獸加無道於臣則單于長嬰大罪必遁逃遠舍不敢近邊沒一使以安百姓國之計臣之願也願送至庭見漢書陳湯傳建始三年舉方正對策陛下秉至聖之純德懼天地之戒異飭身修政納問公卿又下明詔帥舉直言燕見紬繹以求咎愆使臣等得造明朝承聖問臣材朽學淺不通政事竊聞明王即位正五事建大中以承天心則庶徵序於下日月理於上如人君淫溺後宮般樂遊田五事失於躬大中之道不立則咎徵降而六極至凡災異之發各象過失以類告人乃十二月朔戊申日食婺女之分地震蕭牆之內二者同日俱發以丁寧陛下厥咎不遠宜厚求諸身意豈陛下志在閨門未恤政事不慎舉錯婁失中與內寵太盛女不遵道嫉妒專上妨繼嗣與古之王者廢五事之中失夫婦之紀妻妾得意謁行於內勢行於外至覆傾國家惑亂陰陽昔褒姒用國宗周以喪閻妻驕扇日以不臧此其效也經曰皇極皇建其有極傳曰皇之不極是謂不建時則有日月亂行陛下踐至尊之祚為天下主奉帝王之職以統群生方內之治亂在陛下所執誠留意於正身勉強於力行損燕私之間以勞天下放去淫溺之樂罷歸倡優之笑絶卻不享之義慎節遊田之虞起居有常循禮而動躬親政事致行無倦安服若性經曰繼自今嗣王其毋淫于酒毋逸于遊田惟正之共未有身治正而臣下邪者也夫妻之際王事綱紀安危之機聖王所致慎也昔舜飭正二女以崇至德楚莊忍絶丹姬以成伯功幽王惑於褒姒周德降亡魯桓脅於齊女社稷以傾誠修後宮之政明尊卑之序貴者不得嫉妬專寵以絶嬌嫚之端抑褒閻之亂賤者咸得秩進各得厥職以廣繼嗣之統息白華之怨後宮親屬饒之以財勿與政事以遠皇父之類損妻黨之權未有閨門治而天下亂者也治遠自近始習善在左右昔龍管納言而帝命惟允四輔既備成王靡有過事誠敕正左右齊栗之臣戴金貂之飭執常伯之職者皆使學先王之道知君臣之義濟濟謹孚無敖戲驕恣之過則左右肅艾群僚仰法化流四方經曰亦惟先正克左右未有左右正而百官枉者也治天下者尊賢考功則治簡賢違功則亂誠審思治人之術歡樂得賢之福論材選士必試於職明度量以程能考功實以定德無用比周之虛譽毋聽浸潤之譖訴則抱功修職之吏無蔽傷之憂比周邪偽之徒不得即工小人日銷俊乂日隆經曰三載考績三考黜陟幽明又曰九德咸事俊艾在官未有功賞得於前衆賢布於官而不治者也堯遭洪水之災天下分絶為十二州制遠之道微而無乖畔之難者德厚恩深無怨於下也秦居平土一夫大呼而海內崩析者刑罰深酷吏行殘賊也夫違天害德為上取怨於下莫甚乎殘賊之吏誠放退殘賊酷暴之吏錮廢勿用益選溫良上德之士以親萬姓平刑釋冤以理民命務省繇役毋奪民時薄收賦稅毋殫民財使天下黎元咸安家樂業不苦踰時之役不患苛暴之政不疾酷烈之吏雖有唐堯之大災民無離上之心經曰懷保小人惠于鰥寡未有德厚吏良而民畔者也臣聞災異皇天所以譴告人君過失猶嚴父之明誠畏懼敬改則禍銷福降忽然簡易則咎罰不除經曰饗用五福畏用六極傳曰六沴作見若不共御六罰既侵六極其下今三年之間災異鋒起小大畢具所行不享上帝上帝不豫炳然甚著不求之身無所改正疏舉廣謀又不用其言是循不享之迹無謝過之實也天責愈深此五者王事之綱紀南面之急務唯陛下留神見漢書谷永傳對策畢復言災異臣前幸得條對災異之效禍亂所極言關於聖聰書陳於前陛下委棄不納而更使方正對策背可懼之大異問不急之常論廢承天之至言角無用之虛文欲末殺災異滿讕誣天是故皇天勃然發怒甲己之間暴風三溱拔樹折木此天至明不可欺之效也見漢書谷永傳復對日食婺女九度占在皇后地震蕭牆之內咎在貴妾二者俱發明同事異人共掩制陽將害繼嗣也亶日食則妾不見亶地震則后不見異日而發則似殊事亡故動變則恐不知是月后妾當有失節之郵故天因此兩見其變若曰違失婦道隔遠衆妾妨絶繼嗣者此二人也見漢書五行志下之下方今四夷賓服皆為臣妾北無薰粥冒頓之患南無趙他呂嘉之難三垂晏然靡有兵革之警諸侯大者乃食數縣漢吏制其權柄不得有為亡吳楚燕梁之勢百官盤互親疏相錯骨肉大臣有申伯之忠洞洞屬屬小心畏忌無重合安陽博陸之亂三者無毛髮之辜不可歸咎諸舅此欲以政事過差丞相父子中尚書宦官檻塞大異皆瞽説欺天者也竊恐陛下舍昭昭之白過忽天地之明戒聽暗昧之瞽説歸咎乎無辜倚異乎政事重失天心不可之大者也陛下即位委任遵舊未有過政元年正月白氣較然起乎東方至其四月黃濁四塞覆冒京師申以大水著以震蝕各有占應相為表裏百官庶事無所歸倚陛下獨不怪與白氣起東方賤人將興之表也黃濁冒京師王道微絶之應也夫賤人當起而京師道微二者已醜陛下誠深察愚臣之言致懼天地之異長思宗廟之計改往返過抗湛溺之意解偏駮之愛奮乾剛之威平天覆之施使列妾得人人更進猶尚未足也急復益納宜子婦人毋擇好醜毋避嘗字毋論年齒推法言之陛下得繼嗣於微賤之間乃反為福得繼嗣而已母非有賤也後宮女史使令有直意者廣求于微賤之間以遇天所開右慰釋皇太后之憂慍解謝上帝之譴怒則繼嗣蕃滋災異訖息陛下則不深察愚臣之言忽於天地之戒咎根不除水雨之災山石之異將發不久發則災異已極天變成形臣雖欲捐身關策不及事已疏賤之臣至敢直陳天意斥譏帷幄之私欲間離貴后盛妾自知忤心逆耳必不免於湯鑊之誅此天保佑漢家使臣敢直言也三上封事然後得召待詔一旬然後得見夫由疏賤納至忠甚苦由至尊聞天意甚難語不可露願具書所言因侍中奏陛下以示腹心大臣腹心大臣以為非天意臣當伏妄言之誅即以為誠天意也奈何忘國家大本背天意而從欲唯陛下省察孰念厚為宗廟計見漢書谷永傳三月雨雪對皇后桑蠶以治祭服共事天地宗廟正以是日疾風自西北大寒雨雪壞敗其功以章不鄉宜齊戒辟寢以深自責請皇后就宮鬲閉門戶毋得擅上且令衆妾人人更進以時博施皇天説喜庶幾可以得賢明之嗣即不行臣言災異俞甚天變成形臣雖欲捐身關策不及事已見漢書五行志中之下黑龍見東萊對臣聞王天下有國家者患在上有危亡之事而危亡之言不得上聞如使危亡之言輒上聞則商周不易姓而迭興三正不變改而更用夏商之將亡也行道之人皆知之晏然自以若天有日莫能危是故惡日廣而不自知大命傾而不寤易曰危者有其安者也亡者保其存者也陛下誠垂寬明之聽無忌諱之誅使芻蕘之臣得盡所聞於前不懼於後患直言之路開則四方衆賢不遠千里輻湊陳忠群臣之上願社稷之長福也漢家行夏正夏正色黑黑龍同姓之象也龍陽德由小之大故為王者瑞應未知同姓有見本朝無繼嗣之慶多危殆之隙欲因擾亂舉兵而起者邪將動心冀為後者殘賊不仁若廣陵昌邑之類臣愚不能處也去年九月黑龍見其晦日有食之今年二月己未夜星隕乙酉日有食之六月之間大異四發二而同月三代之末春秋之亂未嘗有也臣聞三代所以隕社稷喪宗廟者皆由婦人與群惡沈湎於酒書曰乃用婦人之言自絶于天四方之逋逃多罪是宗是長是信是使詩云燎之方陽寧或滅之赫赫宗周褒姒滅之易曰濡其首有孚失是秦所以二世十六年而亡者養生泰奢奉終泰厚也二者陛下兼而有之臣請略陳其效易曰在中饋無攸遂言婦人不得與事也詩曰懿厥哲婦為梟為鴟匪降自天生自婦人建始河平之際許班之貴頃動前朝熏灼四方賞賜無量空虛內臧女寵至極不可上矣今之後起天所不饗什倍於前廢先帝法度聽用其言官秩不當縱釋王誅驕其親屬假之威權從橫亂政刺舉之吏莫敢奉憲又以掖庭獄大為亂阱榜箠慘於炮格絶滅人命主為趙李報德復怨反除白罪建治正吏多繫無辜掠立迫恐至為人起責分利受謝坐入死出者不可勝數是以日食再既以昭其辜王者必先自絶然后天絶之陛下棄萬乘之至貴樂家人之賤事厭高美之尊號好匹夫之卑字崇聚僄輕無義小人以為私客數離深宮之固挺身晨夜與群小相隨烏集雜會飲醉吏民之家亂服共坐流湎媟嫚溷殽無別閔免遁樂晝夜在路典門戶奉宿衛之臣執干戈而守空宮公卿百僚不知陛下所在積數年矣王者以民為基民以財為本財竭則下畔下畔則上亡是以明王愛養基本不敢窮極使民如承大祭今陛下輕奪民財不愛民力聽邪臣之計去高敞初陵捐十年功緒改作昌陵反天地之性因下為高積土為山發徒起邑並治宮館大興繇役重增賦斂微發如雨役百乾溪費疑驪山靡敝天下五年不成而後反故又廣盱營表發人冢墓斷截骸骨暴揚尸柩百姓財竭力盡愁恨感天災異婁降飢饉仍臻流散冗食餧死於道以百萬數公家無一年之畜百姓無旬日之儲上下俱匱無以相救詩云殷監不遠在夏后之世願陛下追觀夏商周秦所以失之以鏡考己行有不合者臣當伏妄言之誅漢興九世百九十餘載繼體之主七皆承天順道遵先祖法度或以中興或以治安至於陛下獨違道縱欲輕身妄行當盛壯之隆無繼嗣之福有危亡之憂積失君道不合天意亦已多矣為人後嗣守人功業如此豈不負哉方今社稷宗廟禍福安危之機在於陛下陛下誠肯發明聖之德昭然遠寤畏此上天之威怒深懼危亡之徵兆蕩滌邪辟之惡志厲精致政專心反道絶群小之私客免不正之詔除悉罷北宮私奴車馬媠出之具克己復禮毋二微行出飲之過以防迫切之禍深惟日食再既之意抑損椒房玉堂之盛寵毋聽後宮之請謁除掖庭之亂獄出炮烙之陷阱誅戮邪佞之臣及左右執左道以事上者以塞天下之望且寢初陵之作止諸繕治宮室闕更減賦盡休力役存恤振救困乏之人以弭遠方厲崇忠直放退殘賊無使素餐之吏久尸厚祿以次貫行固執無違夙夜孳孳屢省無怠舊愆畢改新德既章纖介之邪不復載心則赫赫大異庶幾可銷天命去就庶幾可復社稷宗廟庶幾可保唯陛下留神反覆熟省臣言臣幸得備邊部之吏不知本朝失得瞽言觸忌諱罪當萬死見漢書谷永傳日食對元年九月日食酒亡節之所致也獨使京師知之四國不見者若曰湛湎于酒君臣不別禍在內也見漢書五行志下之下星隕對日月星辰燭臨下土其有食隕之異則遐邇幽隱靡不咸睹星辰附離于天猶庶民附離王者也王者失道綱紀廢頓下將叛去故星叛天而隕以見其象春秋記異星隕最大自魯嚴以來至今再見臣聞三代所以喪亡者皆繇婦人群小湛湎于酒書云乃用其婦人之言四方之逋逃多罪是信是使詩曰赫赫宗周褒姒滅之顛覆厥德荒沈于酒及秦所以二世而亡者養生太奢奉終太厚方今國家兼而有之社稷宗廟之大憂也見漢書五行志下之下又日食對今年二月日食賦斂不得度民愁怨之所致也所以使四方皆見京師陰蔽者若曰人君好治宮室大營墳墓賦斂茲重而百姓屈竭禍在外也見漢書五行志下之下
