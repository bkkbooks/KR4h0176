body:
  text: 谷永災異對臣永幸得以愚朽之材為太中大夫備拾遺之臣從朝者之後進不能盡思納忠輔宣聖德退無被堅執鋭討不義之功猥蒙厚恩仍遷至北地太守絶命隕首身膏野草不足以報塞萬分陛下聖德寬仁不遺易忘之臣垂周文之聽下及芻蕘之愚有詔使衛尉受臣永所欲言臣聞事君之義有言責者盡其忠有官守者盡其職臣永幸得免於言責之辜有官守之任當畢力遵職養綏百姓而已不宜復關得失之辭忠臣之於上志在過厚是故遠不違君死不忘國昔史魚既沒餘忠未訖委柩後寢以尸達誠汲黯身外思內發憤舒憂遺言李息經曰雖爾身在外乃心無不在王室臣永幸得給事中出入三年雖執干戈守邊垂思慕之心常存於省闥是以敢越郡吏之職陳纍年之憂臣聞天生蒸民不能相治為立王者以統理之方制海內非為天子列土封疆非為諸侯皆以為民也垂三統列三正去無道開有德不私一姓明天下乃天下之天下非一人之天下也王者躬行道德承順天地博愛仁恕恩及行葦籍稅取民不過常法宮室車服不踰制度事節財足黎庶和睦則卦氣理效五徵時序百姓壽考庶草蕃滋符瑞並降以昭保右失道妄行逆天暴物窮奢極欲湛湎荒淫婦言是從誅逐仁賢離逖骨肉群小用事峻刑重賦百姓愁怨則卦氣悖亂咎徵著郵上天震怒災異屢降災異婁降日月薄蝕五星失行山崩川潰水泉踊出妖孽並見茀星耀光飢饉荐臻百姓短折萬物夭傷終不改寤惡洽變備不復譴告更命有德詩云乃眷西顧此惟豫宅夫去惡奪弱遷命賢聖天地之常經百王之所同也加以功德有厚薄期質有修短時世有中季天道有盛衰陛下承八世之功業當陽數之標季涉三七之節紀遭無妄之卦運直百六之災厄三難異科雜焉同會建始元年以來二十載間群災太異交錯鋒起多於春秋所書八世著記久不塞除重以今年正月己亥朔日有食之三朝之會四月丁酉四方衆星白晝流隕七月辛未彗星橫天乘三難之際會畜衆多之災異因之以飢饉接之以不贍彗星極異也土精所生流隕之應出於飢變之後兵亂作矣厥期不久隆德積善懼不克濟內則為深宮後庭將有驕臣悍妾醉酒狂悖卒起之敗北宮苑囿街巷之中臣妾之家幽間之處徵舒崔杼之亂外則為諸夏下土將有樊並蘇令陳勝項梁奮臂之禍內亂朝暮日戒諸夏舉兵以火角為期安危之分界宗廟之至憂臣永所以破膽寒心豫言之纍年下有其萌然後變見於上可不致慎禍起細微姦生所易願陛下正君臣之義無復與群小媟黷燕飲中黃門後庭素驕慢不謹嘗以醉酒失臣禮者悉出勿留勤三綱之嚴修後宮之政抑遠驕妒之寵崇近婉順之行加惠失志之人懷柔怨恨之心保至尊之重秉帝王之威朝覲法出而後駕陳兵清道而後行無復輕身獨出飲食臣妾之家三者既除內亂之路塞矣諸夏舉兵萌在民飢饉而吏不恤興於百姓困而賦斂重發於下怨離而上不知易曰屯其膏小貞吉大貞凶傳曰飢而不損茲謂泰厥災水厥咎亡訞辭曰關動牡飛辟為無道臣為非厥咎亂臣謀篡王者遭衰難之世有飢饉之災不損用而大自潤故凶百姓困貧無以共求愁悲怨恨故水城關守國之固固將去焉故牡飛往年郡國二十一傷於水災禾黍不入今年蠶麥咸惡百川沸騰江河溢決大水泛濫郡國十五有餘此年喪稼時過無宿麥百姓失業流散群輩守關大異較炳如彼水災浩浩黎庶窮困如此宜損常稅小自潤之時而有司奏請加賦甚繆經義逆於民心布怨趨禍之道也牡飛之狀殆為此發古者穀不登虧膳災婁至損服凶年不塈塗明王之制也詩云凡民有喪扶服救之論語曰百姓不足君孰豫足臣願陛下勿許加賦之奏益減大官導官中御府均官掌畜廩犧用度止尚方織室京師郡國工服官發輸造作以助大司農流恩廣施振贍困乏開關梁內流民恣所欲之以救其急立春遣使者循行風俗宣布聖德存恤孤寡問民所苦勞二千石敕勸耕桑毋奪農時以慰綏元元之心防塞大姦之隙諸夏之亂庶幾可息臣聞上主可與為善而不可與為惡下主可與為惡而不可與為善陛下天然之性疏通聰敏上主之姿也少省愚臣之言感寤三難深畏大異定心為善捐忘邪志毋二舊愆厲精致政至誠應天則積異塞於上禍亂伏於下何憂患之有竊恐陛下公志未專私好頗存尚愛群小不肯為耳見漢書谷永傳上古以來大亂之極所希有也察其馳騁驟步芒炎或長或短所歷姦犯內為後宮女妾之害外為諸夏叛逆之禍見漢書五行志下之下建始河平之際許班之貴傾動前朝熏灼四方賞賜無量空虛內臧女寵至極不可尚矣今之後起天所不饗什倍於前見漢書敘傳門牡自亡對章城門通路寢之路函欲關距山東之險城門關守國之固固將去焉故牡飛也見漢書五行志中之上日食上書飲酒無節君臣不別姦邪欲起見續漢五行志注補六賦斂滋重不顧黎民百姓虛竭則日食將有潰叛之變見續漢五行志注補六上疏訟陳湯聞楚有子玉得臣文公為之仄席而坐趙有廉頗馬服強秦不敢窺兵井陘近漢有郅都魏尚胸奴不敢南鄉沙幕由是言之戰克之將國之爪牙不可不重也蓋君子聞鼓鼙之聲則思將率之臣竊見關內侯陳湯前使副西域都護忿郅支之無道閔王誅之不加策慮愊億義勇奮發卒興師奔逝橫厲烏孫踰集都賴屠三重城斬郅支首報十年之逋誅雪邊吏之宿恥威震百蠻武暢西海漢元以來征伐方外之將未嘗有也今湯坐言事非是幽囚久繫歷時不決執憲之吏欲致之大辟昔白起為秦將南拔郢都北坑趙括以纖介之過賜死杜郵秦民憐之莫不隕涕今湯親秉鉞席卷喋血萬里之外薦功祖廟告類上帝介胄之士靡不慕義以言事為罪無赫赫之惡周書曰記人之功忘人之過宜為君者也夫犬馬有勞於人尚加帷蓋之報況國之功臣者哉竊恐陛下忽於鼓鼙之聲不察周書之意而忘帷蓋之施庸臣遇湯卒從吏議使百姓介然有秦民之恨非所以厲死難之臣也見漢書陳湯傳上疏薦嶭宣帝王之德莫大於知人知人則百僚任職天工不曠故皋陶曰知人則哲能官人御史大夫內承本朝之風化外佐丞相統理天下任重職大非庸材所能堪今當選於群卿以充其缺得其人則萬姓欣喜百僚説服不得其人則大職墮斁王功不興虞帝之明在茲一舉可不致詳竊見少府宣材茂行潔達於從政前為御史中丞執憲轂下不吐剛茹柔舉錯時當出守臨淮陳留二郡稱治為左馮翊崇教養善威德並行衆職修理姦軌絶息辭訟者歷年不至丞相府赦後餘盜賊什分三輔之一功效卓爾自左內史初置以來未嘗有也孔子曰如有所譽其有所試宣考績功課簡在兩府不敢過稱以姦欺誣之罪臣聞賢材莫大於治人宣已有效其法律任廷尉有餘經術文雅足以謀王體斷國論身兼數器有退食自公之節宣無私黨遊説之助臣恐陛下忽於羔羊之詩舍公實之臣任華虛之譽是用越職陳宣行能唯陛下留神考察見漢書薛宣傳聖王不以名譽加於實效考績用人之法薛宣政事已效見漢書王吉傳請賜諡鄭寬中疏臣聞聖王尊師傅褒賢俊顯有功生則致其爵祿死則異其禮諡昔周公薨成王葬以變禮而當天心公叔文子卒衛侯加以美諡著為後法近事大司空朱邑右扶風翁歸德茂夭年孝宣皇帝愍册厚賜贊命之臣靡不激揚關內侯鄭寬中有顏子之美質包商偃之文學嚴然總五經之眇論立師傅之顯位入則鄉唐虞之閎道王法納乎聖聽出則參冢宰之重職功列施乎政事退食自公私門不開散賜九族田畝不益德配周召忠合羔羊未得登司徒有家臣卒然早終尤可悼痛臣愚以為宜加其葬禮賜之令諡以章尊師褒顯功之德見漢書儒林張山拊傳上疏理梁王立臣聞禮天子外屏不欲見外也臣是故帝王之意不窺人閨門之私聽聞中冓之言春秋為親者諱詩云戚戚兄弟莫遠具爾今梁王年少頗有狂病始以惡言按驗既亡事實而發閨門之私非本章所指王辭又不服猥強劾立傅致難明之事獨以偏辭成罪斷獄亡益於治道汙衊宗室以內亂之惡披布宣揚於天下非所以為公族隱諱增朝廷之榮華昭聖德之風化也臣愚以為王少而父同産長年齒不倫梁國之富足以厚聘美女招致妖麗父同産亦有恥辱之心案事者乃驗問惡言何故猥自發舒以三者揆之殆非人情疑有所迫切過誤失言文吏躡尋不得轉移萌牙之時加恩勿治上也既已案驗舉憲宜及王辭不服詔廷尉選上德通理之吏更審考清問著不然之效定失誤之法而反命於下吏以廣公族附疏之德為宗室刷汙亂之恥甚得治親之誼見漢書梁懷王揖附傳受降議漢興胸奴數為邊害故設金爵之賞以待降者今單于詘體稱臣列為北藩遣使朝賀無有二心漢家接之宜異於往時今既享單于聘貢之質而更受其逋逃之臣是貪一夫之得而失一國之心擁有罪之臣而絶慕義之君也假令單于初立欲委身中國未知利害私使伊邪莫演詐降以卜吉凶受之虧德沮善令單于自疏不親邊吏或者設為反間欲因而生隙受之適合其策使得歸曲而直責此誠邊竟安危之原師旅動靜之首不可不詳也不如勿受以昭日月之信抑詐諼之謀懷附親之心便見漢書胸奴傳下塞河議河中國之經瀆聖王興則出圖書王道廢則竭絶今潰溢橫流漂沒陵阜異之大者也修政以應之災變自除見漢書溝洫志諫成帝微行易稱得臣無家言王者臣天下無私家也今陛下棄萬乘之至貴樂家人之賤事厭高美之尊稱好匹夫之卑字崇聚票輕無誼之人為私客置私田於民間畜私奴車馬於北宮數去南面之尊離深宮之固挺身獨與小人晨夜相隨烏集醉飽吏民之家亂服共坐溷肴亡別閔勉遁樂畫夜在路典門戶奉宿衛之臣執干戈守空宮公卿百僚不知陛下所在積數年矣昔虢公為無道有神降曰賜爾土田言將以庶人受土田也諸侯夢得土田為失國祥而況王者畜私田財物為庶人之事乎説成帝距絶祭祀方術臣聞明於天地之性不可或以神怪知萬物之情不可罔以非類諸背仁義之正道不遵五經之法言而盛稱奇怪鬼神廣崇祭祀之方求報無福之祠及言世有仙人服食不終之藥遙興輕舉登遐倒景覽觀縣圃浮遊蓬萊耕耘五德朝種暮穫與山石無極黃冶變化堅冰淖溺化色五倉之術者皆姦人惑衆挾左道懷詐偽以欺罔世主聽其言洋洋滿耳若將可遇求之蕩蕩如係風捕景終不可得是以明王距而不聽聖人絶而不語昔周史萇弘欲以鬼神之術輔尊靈王會朝諸侯而周室愈微諸侯愈叛楚懷王隆祭祀事鬼神欲以獲福助卻秦師而兵挫地削身辱國危秦始皇初并天下甘心於神仙之道遣徐福韓終之屬多齎童男童女入海求神采藥因逃不還天下怨恨漢興新垣平齊人少翁公孫卿欒大等皆以仙人黃冶祭祠事鬼使物入海求神采藥貴幸賞賜纍千金大尤尊盛至妻公主爵位重絫震動海內元鼎元封之際燕齊之間方士瞋目扼掔言有神仙祭祀致福之術者以萬數其後平等皆以術窮詐得誅夷伏辜至初元中有天淵玉女巨鹿神人轑陽侯師張宗之姦紛紛復起夫周秦之末三五之隆已嘗專意散財厚爵祿竦精神舉天下以求之矣曠日經年靡有毫氂之驗足以揆今經曰享多儀儀不及物惟曰不享論語説曰子不語怪神唯陛下距絶此類毋令姦人有以窺朝者見漢書郊祀志下説王音將軍履上將之位食膏腴之都任周召之職擁天下之樞可謂富貴之極人臣無二天下之責四面至矣將何以居之宜夙夜孳孳執伊尹之強德以守職匡上誅惡不避親愛舉善不避仇讎以章至公立信四方篤行三者乃可以長堪重任久享盛寵太伯出西方六十日法當參天今已過期尚在桑榆之間質弱而行遲形小而光微熒惑角怒明大逆行守尾其逆常也守尾變也意豈將軍忘湛漸之義委曲從順所執不強不廣用士尚有好惡之忌蕩蕩之德未純方與將相大臣乖離之萌也何故始襲司馬之號俄而金火並有此變上天至明不虛見異唯將軍畏之慎之深思其故改求其路以享天意見漢書谷永傳謝王鳳書永斗筲之材質薄學朽無一日之雅左右之介將軍説其狂言擢之皂衣之吏廁之爭臣之末不聽浸潤之譖不食膚受之訴雖齊桓晉文用士篤密察父哲兄覆育子弟誠無以加昔豫子吞炭壞形以奉見異齊客隕首公門以報恩施知氏孟嘗猶有死士何況將軍之門見漢書谷永傳藝文類聚三十三與王談書君侯躬周召之德執管晏之操敬賢下士樂善不倦宜在上將久矣以大將軍在故抑鬱於家不得舒憤今大將軍不幸蚤薨絫親疏宜在君侯拜吏之日京師士大夫悵然失望此皆永等愚劣不能褒揚萬分屬聞以特進領城門兵是則車騎將軍秉政雍容于內而至戚賢舅執管籥於外也愚竊不為君侯喜宜深辭職自陳淺薄不足以固城門之守收太伯之讓保謙謙之路闔門高枕為知者首願君侯與博覽者參之小子為君侯安此見漢書谷永傳與王音書夫上德厚則下愛深下愛深則其謀忠其言至昔善治國者不忘危善養生者不諱死以忠臣直友明史良醫靈著信龜咸得盡忠正言不蔽兆吉故能遷咎延譽轉禍為福見藝文類聚二十四戒段會宗書足下以柔遠之令德復典都護之重職甚休甚休若子之材可優遊都城而取卿相何必勒功昆山之仄總領百蠻懷柔殊俗子之所長愚無以喻雖然朋友以言贈行敢不略意方今漢德隆盛遠人賓服傅鄭甘陳之功沒齒不可復見願吾子因循舊貫毋求奇功終更亟還亦足以復雁門之踦萬里之外以身為本願詳思愚言見漢書段會宗傳與呼韓邪單于盟約自今以來漢與胸奴合為一家世世毋相詐相攻有竊盜者相報行其誅償其物有寇發兵相助漢與胸奴敢先背約者受天不祥令其世世孫盡如盟見漢書胸奴傳下上哀書請上傅太后及丁姬尊號秦莊襄王母本夏氏而為華陽夫人所子及即位後俱稱太后宜立定陶共王后為皇太后見漢書師丹傳宜立丁姬為帝太后見漢書孝元傅昭儀傳春秋之義母以子貴丁姬宜上尊號見漢書王莽傳上毀廟議孝武皇帝改正朔易服色攘四夷宜為世宗之廟見漢書韋玄成傳皇考廟上序於昭穆非正禮宜毀見漢書韋玄成傳奏免王尊尊暴虐不改外為大言倨嫚姍上威信日廢不宜備位九卿見漢書王尊傳
