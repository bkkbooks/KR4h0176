body:
  text: 王嘉上疏請養材臣聞聖王之功在於得人孔子曰材難不其然乎故繼世立諸侯象賢也雖不能盡賢天子為擇臣立命卿以輔之居是國也纍世尊重然後士民之衆附焉是以教化行而治功立今之郡守重於古諸侯往者致選賢材賢材難得拔擢可用者或起於囚徙昔魏尚坐事繫文帝感馮唐之言遣使持節赦其罪拜為雲中太守胸奴忌之武帝擢韓安國於徒中拜為梁內史骨肉以安張敞為京兆尹有罪當免黠吏知而犯敞敞收殺之其家自冤使者覆獄劾敞賊殺人上逮捕不下會免亡命數十日宣帝徵敞拜為冀州刺史卒獲其用前世非私此三人貪其材器有益於公家也孝文時吏居官者或長子孫以官為氏倉氏庫氏則倉庫吏之後也其二千石長吏亦安官樂職然後上下相望莫有苟且之意其後稍稍變易公卿以下傳相促急又數改更政事司隸部刺史察過悉劾發揚陰私吏或居官數月而退送故迎新交錯道路中材苟容求全下材懷危內顧一切營私者多二千石益輕賤吏民慢易之或持其微過增加成罪言於刺史司隸或至上書章下衆庶知其易危小失意則有離畔之心前山陽亡徒蘇令等從橫吏民臨難莫肯仗節死義以守相威權素奪也孝成皇帝悔之下詔書二千石不為縱遣使者賜金尉厚其意誠以為國家有急取辦於二千石二千石尊重難危乃能使下孝宣皇帝愛其良民吏有章劾事留中會赦一解故事尚書希下章為煩擾百姓證驗繫治或死獄中章文必有敢告之字乃下唯陛下留神於擇賢記善忘過容忍臣子勿責以備二千石部刺史三輔縣令有材任職者人情不能不有過差宜可闊略令盡力者有所勸此方今急務國家之利也前蘇令發欲遣大夫使逐問狀時見大夫無可使者召盩厔令尹逢為諫大夫遣之今諸大夫有材能者甚少宜豫畜養可成就者則士赴難不愛其死臨事倉卒乃求非所以明朝廷也見漢書王嘉傳諫封董賢等封事竊見董賢等三人始賜爵衆庶胸胸咸曰賢貴其餘并蒙恩至今流言未解陛下仁恩於賢等不已宜暴賢等本奏語言延問公卿大夫博士議郎考合古今明正其義然後乃加爵土不然恐大失衆心海內引領而議暴下其事必有言當封者在陛下所從天下雖不説咎有所分不獨在陛下前定陵侯淳于長初封其事亦議大司農谷永以長當封衆人歸咎於永先帝不獨蒙其譏臣嘉臣延材駑不稱死有餘責知順指不忤可得容身須臾所不敢者思報厚恩也見漢書王嘉傳因日食舉直言復奏封事臣聞咎繇戒帝舜曰亡敖佚欲有國兢兢業業一日二日萬機箕子戒武王曰臣無有作威作福亡有玉食臣之有作威作福玉食害于而家凶于而國人用側頗辟民用僭慝言如此則逆尊卑之序亂陰陽之統而害及王者其國極危國人傾仄不正民用僭差不一此君不由法度上下失序之敗也武王躬履此道隆至成康自是以後縱心恣欲法度陵遲至於臣弒君子弒父父子至親失禮患生何況異姓之臣孔子曰道千乘之國敬事而信節用而愛人使民以時孝文皇帝備行此道海內蒙恩為漢太宗孝宣皇帝賞罰信明施與有節記人之功忽於小過以致治平孝元皇帝奉大業溫恭少欲都內錢四十萬萬水衡錢二十五萬萬少府錢十八萬萬嘗幸上林後宮馮貴人從臨獸圈猛獸驚出貴人前當之元帝嘉美其義賜錢五萬掖庭見親有加賞賜屬其人勿衆謝示平惡偏重失人心賞賜節約是時外戚資千萬者少耳故少府水衡見錢多也雖遭初元永光凶年飢饉加有西羌之變外奉師旅內振貧民終無傾危之憂以府臧內充實也孝成皇帝時諫臣多言燕出之害及女寵專愛耽於酒色損德傷年其言甚切然終不怨怒也寵臣淳于長張放史育育數貶退家資不滿千萬放斥逐就國長榜死於獄不以私愛害公義故雖多內譏朝廷安平傳業陛下陛下在國之時好詩書上儉節徵來所過道上稱誦德美此天下所以回心也初即位易帷帳去錦繡乘輿席緣綈繒而已共皇寢廟比比當作憂閔元元惟用度不足以義割恩輒且止息今始作治而駙馬都尉董賢亦起官寺上林中又為賢治大第開門鄉北闕引王渠灌園池使者護作賞賜吏卒甚於治宗廟賢母病長安廚給祠具道中過者皆飲食為賢治器器成奏御乃行或物好特賜其工自貢獻宗廟三宮猶不至此賢家有賓婚及見親諸官並共賜及倉頭奴婢人十萬錢使者護視發取市物百賈震動道路歡譁群臣惶惑詔書罷菀而以賜賢二千餘頃均田之制從此墮壞奢僭放縱變亂陰陽災異衆多百姓訛言持籌相驚被髮徒跣而走乘馬者馳天惑其意不能自止或以為籌者策失之戒也陛下素仁智慎事今而有此大譏孔子曰危而不持顛而不扶則將安用彼相矣臣嘉幸得備位竊內悲傷不能通愚忠之信身死有益於國不敢自惜唯陛下慎己之所獨鄉察衆人之所共疑往者寵臣鄧通韓嫣驕貴失度逸豫無厭小人不勝情欲卒陷罪辜亂國亡軀不終其祿所謂愛之適足以害之者也宜深覽前世以節賢寵全安其命見漢書王嘉傳因大赦奏薦梁相鞫談宗伯鳳封事相等明習治獄相計謀深沈談頗知雅文鳳經明行修聖王有討功除過臣竊為朝廷惜此三人見漢書王嘉傳諫益封董賢等封事臣聞爵祿土地天之有也書云天命有德五服五章哉王者代天爵人尤宜慎之裂地而封不得其宜則衆庶不服感動陰陽其害疾自深今聖體久不平此臣嘉所內懼也高安侯賢佞幸之臣陛下傾爵位以貴之單貨財以富之損至尊以寵之主威已黜府臧已竭唯恐不足財皆民力所為孝文皇帝欲起露臺重百金之費克己不作今賢散公賦以施私惠一家至受千金往古以來貴臣未嘗有此流聞四方皆同怨之里諺曰千人所指無病而死臣常為之寒心今太皇太后以永信太后遺詔詔丞相御史益賢戶賜三侯國臣嘉竊惑山崩地動日食於三朝皆陰侵陽之戒也前賢已再封晏商再易邑業緣私橫求恩已過厚求索自恣不知厭足甚傷尊尊之義不可以示天下為害痛矣臣驕侵罔陰陽失節氣感相動害及身體陛下寢疾久不平繼嗣未立宜思正萬事順天人之心以求福祐奈何輕身肆意不念高祖之勤苦垂立制度欲傳之於無窮哉孝經曰天子有爭臣七人雖無道不失其天下臣謹封上詔書不敢露見非愛死而不自法恐天下聞之故不敢自效愚戇數犯忌諱唯陛下省察見漢書王嘉傳遣將行邊對臣聞動民以行不以言應天以實不以文下民微細猶不可詐況於上天神明而可欺哉天之見異所以敕戒人君欲令覺悟反正推誠行善民心説而天意得矣辨士見一端或妄以意傅著星曆虛造胸奴烏孫西羌之難謀動干戈設為權變非應天之道也守相有罪車馳詣闕交臂就死恐懼如此而談説者云動安之危辨口快耳其實未可從夫議政者苦其諂諛傾險辨慧深刻也諂諛則主德毀傾險則下怨恨辨慧則破正道深刻則傷恩惠昔秦繆公不從百里奚蹇叔之言以敗其師悔過自責疾詿誤之臣思黃髮之言名垂於後世唯陛下觀覽古戒反覆參考無以先入之語為主見漢書息夫躬傳下詔獄對詰案事者思得實竊見相等前治東平王獄不以雲為不當死欲關公卿示重慎置驛馬傳囚藝不得踰冬月誠不見其外內顧望阿附為雲驗復幸得蒙大赦相等皆良善吏臣竊為國惜賢不私此三人見漢書王嘉傳幸得充備宰相不能進賢退不肖以是負國死有餘責見漢書王嘉傳賢故丞相孔光故大司空何武不能進惡高安侯董賢父子佞邪亂朝而不能退罪當死死無所恨見漢書王嘉傳上書言封丁傅古者諒暗不言聽於冢宰三年無改於父之道前大行尸柩在堂而官爵臣等以及親屬赫然皆貴寵封舅為陽安侯皇后尊號未定豫封父為孔鄉侯出侍中王邑射聲校尉王邯等詔書比下變動政事卒暴無漸臣縱不能明陳大義復曾不能牢讓爵位相隨空受封侯增益陛下之過間者郡國多地動水出流殺人民日月不明五星失行此皆舉錯失中號令不定法度失理陰陽溷濁之應也臣伏惟人情無子年雖六七十猶博取而廣求孝成皇帝深見天命燭知至德以壯年克己立陛下為嗣先帝暴棄天下而陛下繼體四海安寧百姓不懼此先帝聖德當合天人之功也臣聞天威不違顏咫尺願陛下深思先帝所以建立陛下之意且克己躬行以觀群下之從化天下者陛下之家也肺附何患不富貴不宜倉卒先帝不量臣愚以為太傅陛下以臣託師傅故亡功德而備鼎足封大國加賜黃金位為三公職在左右不能盡忠補過而令庶人竊議災異數見此臣之大罪也臣不敢言乞骸骨歸於海濱恐嫌於偽誠慚負重責義不得不盡死見漢書師丹傳建言限民田奴婢古之聖王莫不設井田然後治乃可平孝文皇帝承亡周亂秦兵革之後天下空虛故務勸農桑帥以節儉民始充實未有并兼之害故不為民田及奴婢為限今纍世承平豪富吏民訾數巨萬而貧弱俞困蓋君子為政貴因循而重改作然所以有改者將以救急也亦未可詳宜略為限見漢書食貨志劾奏董宏宏知皇太后至尊之號天下一統而稱引亡秦以為比喻詿誤聖朝非所宜言大不道見漢書師丹傳共皇廟議聖王制禮取法於天地故尊卑之禮明則人倫之序正人倫之序正則乾坤得其位而陰陽順其節人主與萬民俱蒙祐福尊卑者所以正天地之位不可亂也今定陶共為皇太后共皇后以定陶共為號者母從子妻從夫之義也欲立官置吏車服與太皇太后並非所以明尊卑亡二上之義也定陶共皇號諡已前定義不得復改禮父為士子為天子祭以天子其尸服以士服子亡爵父之義尊父母也為人後者為之子故為所後服斬衰三年而降其父母期明尊本祖而重正統也孝成皇帝聖恩深遠故為共王立後奉承祭祀今共皇長為一國太祖萬世不毀恩義已備陛下既繼體先帝持重太宗承宗廟天地社稷之祀義不得復奉定陶共皇祭入其廟今欲立廟於京師而使臣下祭之是無主也又親盡當毀空去一國太祖不墮之祀而就無主當毀不正之禮非所以尊厚共皇也見漢書師丹傳上書理鄭崇臣聞疏不圖親外不慮內臣幸得銜命奉使職在刺舉不敢避貴幸之藝以塞視聽之明案尚書令昌奏僕射崇下獄覆治榜掠將死卒無一辭道路稱冤疑昌與崇內有纖介浸潤相陷自禁門內樞機近臣蒙受冤譖虧損國家為謗不小臣請治昌以解衆心見漢書孫寶傳移敕郡長吏書即各欲求索自快是一郡百太守也何得然哉見漢書陳萬年傳與陳湯書即蒙子公力得入帝城死不恨見漢書陳萬年傳奏記蕭望之將軍體周召之德秉公綽之質有卞莊之威至乎耳順之年履折衝之位號至將軍誠士之高致也窟穴黎庶莫不歡喜咸曰將軍其人也今將軍規橅云若管晏而休遂行日仄至周召乃留乎若管晏而休則下走將歸延陵之皋修農圃之疇畜雞種黍俟見二子沒齒而已矣如將軍昭然度行積思塞邪枉之險蹊宣中庸之常政興周召之遺業親日仄之兼聽則下走其庶幾願竭區區底厲鋒鍔奉萬分之一見漢書蕭望之傳與翟方進書竊聞政令甚明為京兆能則恐有所不宜見漢書翟方進傳上書請復太上皇寢廟園臣聞孔子曰如有王者必世而後仁三十年之間道德和洽制禮興樂災害不生禍亂不作今聖漢受命而王繼體承業二百餘年孜孜不怠政令清矣然風俗未和陰陽未調災害數見意者大本有不立與何德化休徵不應之久也禍福不虛必有因而至者焉宜深迹其道而務修其本昔者帝堯南面而治先克明俊德以親九族而化及萬國孝經曰天地之性人為貴人之行莫大於孝孝莫大於嚴父嚴父莫大於配天則周公其人也夫孝子善述人之志周公既成文武之業而制作禮樂修嚴父配天之事知文王不欲以子臨父故推而序之上極於后稷而以配天此聖人之德亡以加於孝也高皇帝聖德受命有天下尊太上皇猶周文武之追王太王王季也此漢之始祖後嗣所宜尊奉以廣盛德孝之至也書云正稽古建功立事可以永年傳於亡窮見漢書平當傳奏劾翟方進方進國之司直不自敕正以先群下前親犯令行馳道中司隸慶平心舉劾方進不自責悔而內挾私恨伺記慶之從容語言以詆欺成罪後丞相宣以一不道賊請遣掾督趣司隸校尉司隸校尉勳自奏暴於朝廷今方進復舉奏勳議者以為方進不以道德輔正丞相苟阿助大臣欲必勝立威宜抑絶其原勳素行公直姦人所惡可少寬假使遂其功名見漢書翟方進傳奏求治河策九河今皆置滅案經義治水有決河深川而無隄防雍塞之文河從魏郡以東北多溢決水迹難以分明四海之衆不可誣宜博求能浚川疏河者見漢書溝洫志樂議漢承秦滅道之後賴先帝聖德博受兼聽修廢官立太學河間獻王聘求幽隱修興雅樂以助化時大儒公孫弘董仲舒等皆以為音中正雅立之大樂春秋鄉射作於學宮希闊不講故自公卿大夫觀聽者但聞鏗鎗不曉其意而欲以風諭衆庶其道無由是以行之百有餘年德化至今未成今曄等守習孤學大指歸於興助教化衰微之學興廢在人宜領屬雅樂以繼絶表微孔子曰人能弘道非道弘人河間區區小國藩臣以好學修古能有所存民到於今稱之況於聖主廣被之資修起舊文放鄭近雅述而不作信而好古於以風示海內揚名後世誠非小功小美也見漢書禮樂志
