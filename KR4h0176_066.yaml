body:
  text: 翟方進劾陳慶案慶奉使刺舉大臣故為尚書知機事周密一統明主躬親不解慶有罪未伏誅無恐懼心豫自設不坐之比又暴揚尚書事言遲疾無所在虧損聖德之聰明奉詔不謹不敬臣謹以劾見漢書翟方進傳奏劾涓勳臣聞國家之興尊尊而敬長爵位上下之禮王道綱紀春秋之義尊上公謂之宰海內無不統焉丞相進見聖主御坐為起在輿為下群臣宜皆承順聖化以視四方勳吏二千石幸得奉使不遵禮儀輕謾宰相賤易上卿而又詘節失度邪讇無常色厲內荏墮國體亂朝廷之序不宜處位臣請下丞相免勳見漢書翟方進傳奏免陳咸逢信咸以逢信邪枉貪汙營私多欲皆知陳湯姦佞傾覆利口不軌而親交賂遺以求薦舉後為少府數饋遺湯信咸幸得備九卿不思進忠正身內自知行辟無功效而官媚邪臣欲以徼幸苟得亡恥孔子曰鄙夫可與事君也與哉咸信之謂也過惡暴見不宜處位臣請免以示天下見漢書翟方進傳咸前為郡守殘酷毒螫加於吏民主守盜受所監而官媚邪臣陳湯以求薦舉苟得無恥不宜處位見漢書陳萬年傳復奏免陳咸咸前為九卿坐為貪邪免自知罪惡暴陳依託紅陽侯立徼幸有司莫敢舉奏冒濁苟容不顧恥辱不當蒙方正舉備內朝臣并劾紅陽侯立選舉故不以實見漢書翟方進傳劾紅陽侯王立立懷姦姦邪亂朝政欲傾誤要主上狡猾不道請下獄見漢書翟方進傳復奏王立黨友立素行積為不善衆人所共知邪臣自結附託為黨庶幾立與政事欲獲其利今立斥逐就國所交結尤著者不宜備大臣為郡守案後將軍朱博巨鹿太守孫閎故光祿大夫陳咸與立交通厚善相與為腹心有背公死黨之信欲相攀援死而後已皆內有不仁之性而外有俊材過絶人倫勇猛果敢處事不疑所居皆尚殘賊酷虐苛刻慘毒以立威而亡纖介愛利之風天下所共知愚者猶惑孔子曰人而不仁如禮何人而不仁如樂何言不仁之人亡所施用不仁而多材國之患也此三人皆內懷姦猾國之所患而深相與結信於貴戚姦臣此國家大憂大臣所宜沒身而爭也昔季孫行父有言曰見有善於君者愛之若孝子之養父母也見不善者誅之若鷹鸇之逐鳥爵也翅翼雖傷不避也貴戚強黨之衆誠難犯犯之衆敵並怨善惡相冒臣幸得備宰相不敢不盡死請免博閎咸歸故郡以銷姦雄之黨絶群邪之望見漢書翟方進傳薦嶭宣宣明習文法練國制度前所坐過薄可復進用見漢書嶭宣傳立嗣議定陶王帝弟之子禮曰昆弟之子猶子也為其後者為之子也定陶王宜為嗣見漢書孔光傳淳于長小妻乃始等坐罪議令犯法者各以法時律令論之明有所訖也長犯大逆時乃始等見為長妻已有當坐之罪與身犯法無異後乃弄法於法無以解請論見漢書孔光傳移檄郡國莽鴆殺孝平皇帝矯稱尊號今天子已立共行天討見漢書翟方進傳莽毒殺平帝攝天子位欲絶漢室今共行天罰誅莽見漢書王莽傳上奏事禽獸生子逐母宜以四子還母尸三男子於市見意林傳子御覽三百六十又三百六十一致王章大逆罪比上夷狄欲絶繼嗣之端背畔天子私為定陶王見漢書元后傳上書訟王尊治京兆功效日著往者南山盜賊阻山橫行剽劫良民殺奉法吏道路不通城門至以警戒步兵校尉使逐捕暴師露衆曠日煩費不能禽制二卿坐黜群盜寖強吏氣傷沮流聞四方為國家憂當此之時有能捕斬不愛金爵重賞關內侯寬中使問所徵故司隸校尉王尊捕群盜方略拜為諫大夫守京輔都尉行京兆尹事尊盡節勞心夙夜思職卑體下士厲奔北之吏起沮傷之氣二旬之間大黨震壞渠率效首賊亂蠲除民反農業拊循貧弱鉏耘豪強長安宿豪大猾東市賈萬城西萬章箭張禁酒趙放杜陵楊章等皆通邪結黨挾養姦軌上干王法下亂吏治並兼役使侵漁小民為百姓豺狼更數二千石二十年莫能禽討尊以正法案誅皆伏其辜姦邪銷釋吏民説服尊撥劇整亂誅暴禁邪皆前所稀有名將所不及雖拜為真未有殊絶褒賞加於尊身今御史大夫奏尊傷害陰陽為國家憂無承用詔書之意靖言庸違象恭滔天原其所以出御史丞楊輔故為尊書佐素行陰賊惡口不信好以刀筆陷人於法輔常醉過尊大奴利家利家捽搏其頰兄子閎拔刀欲剄之輔以故深怨疾毒欲傷害尊疑輔內懷怨恨外依公事建畫為此議傳致奏文浸潤加誣以復私怨昔白起為秦將東破韓魏南拔郢都應侯譖之賜死杜郵吳起為魏守西河而秦韓不敢犯讒人間焉斥逐奔楚秦聽浸潤以誅良將魏信讒言以逐賢守此皆偏聽不聰失人之患也臣等竊痛傷尊修身潔己砥節首公刺譏不憚將相誅惡不避豪強誅不制之賊解國家之憂功著職修威信不廢誠國家爪牙之吏折衝之臣今一旦無辜制於仇人之手傷於詆欺之文上不得以功除罪下不得蒙棘木之聽獨掩怨讎之偏奏猥被共工之大惡無所陳怨訴罪尊以京師廢亂群盜並興選賢徵用起家為卿賊亂既除豪猾伏辜即以佞巧廢黜一尊之身三期之間乍賢乍佞豈不甚哉孔子曰愛之欲其生惡之欲其死是惑也浸潤之譖不行焉可謂明矣願下公卿大夫博士議即定尊素行夫人臣而傷害陰陽死誅之罪也靖言庸違放殛之刑也審如御史章尊乃當伏觀闕之誅放於無人之域不得苟免及任舉尊者當獲選舉之辜不可但已即不如章飾文深詆以訴無罪亦宜有誅以懲讒賊之口絶詐欺之路唯明主參詳使白黑分別見漢書王尊傳日蝕對竊見丞相商作威作福從外制中取必於上性殘賊不仁遣票輕吏微求人罪欲以立威天下患苦之前頻陽耿定上書言商與父傅通及女弟淫亂奴殺其私夫疑商教使章下有司商私怨懟商子俊欲上書告商俊妻左將軍丹女持其書以示丹丹惡其父子乖忤為女求去商不盡忠納善以輔至德知聖主崇孝遠別不親後庭之事皆受命皇太后太后前聞商有女欲以備後宮商言有固疾後有耿定事更詭道因李貴人家內女執左道以亂政誣罔悖大臣節故應是而日蝕周書曰以左道事君者誅易曰日中見昧則折其右肱往者丞相周勃再建大功及孝文時纖介怨恨而日為之蝕於是退勃使就國卒無怵惕憂今商無尺寸之功而有三世之寵身位三公宗族為列侯吏二千石侍中諸曹給事禁門內連昏諸侯王權寵至盛審有內亂殺人怨懟之端宜窮竟考問臣聞秦丞相呂不韋見王無子意欲有秦國即求好女以為妻陰知其有身而獻之王産始皇帝及楚相春申君亦見王無子心利楚國即獻有身妻而産懷王自漢興幾遭呂霍之患今商有不仁之性乃因怨以內女其姦謀未可測度前孝景世七國反將軍周亞夫以為即得雒陽劇孟關東非漢之有今商宗族權藝合資巨萬計私奴以千數非特劇孟匹夫之徒也且失道之至親戚畔之閨門內亂父子相訐而欲使之宣明聖化調和海內豈不謬哉商視事五年官職陵夷而大惡著於百姓甚虧損盛德有鼎折足之凶臣愚以為聖主富於春秋即位以來未有懲姦之威加以繼嗣未立大異並見尤宜誅討不忠以遏未然行之一人則海內震動百姦之路塞矣見漢書王商傳奏請浚屯氏河郡承河下流與兗州東郡分水為界城郭所居尤卑下土壤輕脆易傷頃所以闊無大害者以屯氏河通兩川分流也今屯氏河塞靈鳴犢口又益不利獨一川兼受數河之任雖高增隄防終不能泄如有霖雨旬日不霽必盈溢靈鳴犢口在清河東界所在處下雖令通利猶不能為魏郡清河減損水害禹非不愛民力以地形有藝故穿九河今既滅難明屯氏河不流行七十餘年新絶未久其處易浚又其口所居高於以分流殺水力道理便宜可復浚以助大河泄暴水備非常又地節時郭昌穿直渠後三歲河水更從故第二曲間北可六里復南合今其曲藝復邪直貝丘百姓寒心宜復穿渠東行不豫修治北決病四五郡南決病十餘郡然後憂之晚矣見漢書溝洫志治河方略今河溢之害數倍於前決平原時今可決平原金隄間開通大河令入故篤馬河至海五百餘里水道浚利又乾三郡水地得美田且二十餘萬頃足以償所開傷民田廬處又省吏卒治隄救水歲三萬以上見漢書溝洫志駁孫禁開篤馬河方略古説九河之名有徒駭胡蘇鬲津今見在成平東光鬲界中自鬲以北至徒駭間相去二百餘里今河雖數移徙不離此域孫禁所欲開者在九河南篤馬河失水之迹處藝平夷旱則淤絶水則為敗不可許見漢書溝洫志陳湯罪議不道無正法以所犯劇易為罪臣下承用失其中故移獄廷尉無比者先以聞所以正刑罰重人命也明主哀憫百姓下制書罷昌陵勿徙吏民已申布湯妄以意相謂且復發徙雖頗驚動所流行者少百姓不為變不可謂惑衆湯稱詐虛設不然之事非所宜言大不敬也見漢書陳湯傳又白解萬年故將作大匠萬年佞邪不忠妄為巧詐多賦斂煩繇役興卒暴之作卒徒蒙辜死者連屬毒流衆庶海內怨望雖蒙赦令不宜居京師見漢書陳湯傳奏劾嶭宣春秋之義王人微者序乎諸侯之上尊王命也臣幸得奉使以督察公卿以下為職今丞相宣請遣掾史以宰士督察天子奉使命大夫甚悖逆順之理宣本不師受經術因事以立姦威案浩商所犯一家之禍耳而宣欲專權作威乃害於乃國不可之大者願下中朝特進列侯將軍以下正國法度見漢書翟方進傳上書諫立趙后臣聞天之所與必先賜以符瑞天之所違必先降以災變此神明之徵應自然之占驗也昔武王周公承順天地以饗魚鳥之瑞然猶君臣祗懼動色相戒況於季世不蒙繼嗣之福屢受威怒之異者乎雖夙夜自責改過易行畏天命念祖業妙選有德之世考卜窈窕之女以承宗廟順神祇心塞天下望子孫之祥猶恐晚暮今乃觸情縱欲傾於卑賤之女欲以母天下不畏于天不愧于人惑莫大焉里語曰腐木不可以為柱卑人不可以為主天人之所不豫必有禍而無福市道皆共知之朝廷莫肯一言臣竊傷心自念得以同姓拔擢尸祿不忠污辱諫爭之官不敢不盡死唯陛下深察見漢書劉輔傳元壽元年舉方正直言對臣聞禽息憂國碎首不恨卞和獻寶刖足願之臣幸得奉直言之詔無二者之危敢不直陳臣聞陽尊陰卑卑者隨尊尊者兼卑天之道也是以男雖賤各為其家陽女雖貴猶為其國陰故禮明三從之義雖有文母之德必繫於子春秋不書紀侯之母陰義殺也昔鄭伯隨薑氏之欲終有叔段篡國之禍周襄王內迫惠后之難而遭居鄭之危漢興呂太后權私親屬又以外孫為孝惠后是時繼嗣不明凡事多暗晝昏冬雷之變不可勝載竊見陛下行不偏之政每事約儉非禮不動誠欲正身與天下更始也然嘉瑞未應而日食地震民訛言行籌傳相驚恐案春秋災異以指象為言語故在於得一類而達之也日蝕明陽為陰所臨坤卦乘離明夷之象也坤以法地為土為母以安靜為德震不陰之效也占象甚明臣敢不直言其事昔曾子問從令之義孔子曰是何言與善閔子騫守禮不苟從親所行無非理者故無可間也前大司馬新都侯莽退伏第家以詔策決復遣就國高昌侯宏去蕃自絶猶受封土制書侍中駙馬都尉遷不忠巧佞免歸故郡間未旬月則有詔還大臣奏正其罰卒不得遣而反兼官奉使顯寵過故及陽信侯業皆緣私君國非功義所止諸外家昆弟無賢不肖並侍帷幄布在列位或典兵衛或將軍屯寵意并於一家積貴之藝世所希見所希聞也至乃並置大司馬將軍之官皇甫雖盛三桓雖隆魯為作三軍無以甚此當拜之日暗然日食不在前後臨事而發者明陛下謙遜無專承指非一所言輒聽所欲輒隨有罪惡者不坐辜罰無功能者畢受官爵流漸積猥正尤在是欲令昭昭以覺聖朝昔詩人所刺春秋所譏指象如此殆不在它由後視前忿邑非之逮身所行不自鏡見則以為可計之過者疏賤獨偏見疑內亦有此類天變不空保右世主如此之至奈何不應臣聞野雞著怪高宗深動大風暴過成王怛然願陛下加致精誠思承始初事稽諸古以厭下心則黎庶群生無不説喜上帝百神收還威怒禎祥福祿何嫌不報見漢書杜鄴傳災異對春秋災異以指象為言語籌所以紀數民陰水類也水以東流為順走而西行反類逆上象數度放溢妄以相豫違忤民心之應也西王母婦人之稱博奕男子之事於街巷阡陌明離闑內與強外臨事盤樂炕陽之意白髮衰年之象體尊性弱難理易亂門人之所由樞其要也居人之所由制持其要也其明甚著今外家丁傅並侍帷幄布於列位有罪惡者不坐辜罰亡功能者畢受官爵皇甫三桓詩人所刺春秋所譏亡以甚此指象昭昭以覺聖朝奈何不應見漢書五行志下之上説王音鄴聞人情恩深者其養謹愛至者其求詳夫戚而不見殊孰能無怨此棠棣角弓之詩所為作也昔秦伯有千乘之國而不能容其母弟春秋亦書而譏焉周召則不然忠以相輔義以相匡同己之親等已之尊不以聖德獨兼國寵又不為長專受榮任分職於陝並為弼疑故內無感恨之隙外無侵侮之羞俱享天祐兩荷高名者蓋以此也竊見成都侯以特進領城門兵復有詔得舉吏如五府此明詔所欲寵也將軍宜承順聖意加異往時每事凡議必與及之指為誠發出於將軍則孰敢不説諭昔文侯寤大雁之獻而父子益親陳平共一飯之饌而將相加歡所接雖在楹階俎豆之間其於為國折衝厭難豈不遠哉竊慕倉唐陸子之義所白奧內唯深察焉見漢書杜鄴傳説王商東鄰殺牛不如西鄰之禴祭言奉天之道貴以誠質大得民心也行穢祀豐猶不蒙祐德修薦薄吉必大來古者壇場有常處尞禋有常用贊見有常禮犧牲玉帛雖備而財不匱車輿臣役雖動而用不勞是故每舉其禮助者歡説大路所歷黎元不知今甘泉河東天地郊祀咸失方位違陰陽之宜及雍五畤皆曠遠奉尊之役休而復起繕治共張無解已時皇天著象殆可略知前上甘泉先驅失道禮月之夕奉引復迷祠后土還臨河當渡疾風起波船不可御又雍大雨壞平陽宮垣及三月甲子震電災林光宮門祥瑞未著咎徵仍臻迹三郡所奏皆有變故不答不饗何以甚此詩曰率由舊章舊章先王法度文王以之交神于祀子孫千億宜如異時公卿之議復還長安南北郊見漢書郊祀志下臨終作墓石文魏郡杜鄴立志忠款犬馬未陳奄先草露骨肉歸於後土氣魂無所不之何必故丘然後即化封於長安北郭此焉宴息見西京雜記上
