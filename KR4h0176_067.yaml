body:
  text: 毋將隆奏徵定陶王封事古者選諸侯入為公卿以褒功德宜徵定陶王使在國邸以填萬方見漢書毋將隆傳奏請收還武庫兵器武庫兵器天下公用國家武備繕治造作皆度大司農錢大司農錢自乘輿不以給共養共養勞賜一出少府蓋不以本藏給末用不以民力共浮費別公私示正路也古者諸侯方伯得顓征伐乃賜斧鉞漢家邊吏職在距寇亦賜武庫兵皆任其事然後蒙之春秋之誼家不臧甲所以抑臣威損私力也今賢等便僻弄臣私恩微妾而以天下公用給其私門契國威器共其家備民力分於弄臣武兵設於微妾建立非宜以廣驕僭非所以示四方也孔子曰奚取於三家之堂臣請收還武庫見漢書毋將隆傳上書謝罪乞骸骨太師大司徒扶德侯上書言前以光祿勳議定陶共王母諡曰婦人以夫爵尊為號諡宜日孝元傅皇后稱渭陵東園臣知妾不得體君卑不得敵尊而希指雷同詭經辟說以惑誤上為臣不忠當伏斧鉞之誅幸蒙灑心自新又令得保首領伏自惟念入稱四輔出備三公爵為列侯誠無顏復望闕廷無心復居官守府無宜復食國邑願上太師大司徒扶德侯印綬避賢者路見漢書馬宮傳上書諫哀帝竊見孝成皇帝時外親持權人人牽引所私以充塞朝廷妨賢人路濁亂天下奢泰亡度窮困百姓是以日蝕且十彗星四起危亡之徵陛下所親見也今奈何反覆劇於前乎朝臣亡有大儒骨鯁白首耆艾魁壘之士論議通古今喟然動衆心憂國如飢渴者臣未見也敦外親小童及幸臣董賢等在公門省戶下陛下欲與此共承天地安海內甚難今世俗謂不智者為能謂智者為不能昔堯放四罪而天下服今除一吏而衆皆惑古刑人尚服今賞人反惑請寄為姦群小日進國家空虛用度不足民流亡去城郭盜賊竝起吏為殘賊歲增於前凡民有七亡陰陽不和水旱為災一亡也縣官重責更賦租稅二亡也貪吏竝公受取不已三亡也豪強大姓蠶食亡厭四亡也苛吏徭役失農桑時五亡也部落鼓鳴男女遮迣六亡也盜賊劫略取民財物七亡也七亡尚可又有七死酷吏毆殺一死也治獄深刻二死也冤陷亡辜三死也盜賊橫發四死也怨讎相殘五死也歲惡飢餓六死也時氣疾疫七死也民有七亡而無一得欲望國安誠難民有七死而無一生欲望刑措誠難此非公卿守相貪殘成化之所致邪群臣幸得居尊官食重祿豈有肯加惻隱於細民助陛下流教化者邪志但在營私家稱賓客為姦利而已以苟容曲從為賢以拱默尸祿為智謂如臣宣等為愚陛下擢臣巖穴誠冀有益豪毛豈徒欲使臣美食大官重高門之地哉天下乃皇天之天下也陛下上為皇天子下為黎庶父母為天牧養元元視之當如一合尸鳩之詩今貧民菜食不厭衣又穿空父子夫婦不能相保誠可為酸鼻陛下不救將安所歸命乎奈何獨私養外親與幸臣董賢多賞賜以大萬數使奴從賓客漿酒霍肉蒼頭廬兒皆用致富非天意也及汝昌侯傅商亡功而封夫官爵非陛下之官爵乃天下之官爵也陛下取非其官官非其人而望天說民服豈不難哉方陽侯孫寵宜陵侯息夫躬辨足以移衆彊可用獨立姦人之雄或世尤劇者也宜以時罷退及外親幼童未通經術者皆宜令休就師傅急徵故大司馬傅喜使領外親故大司空何武師丹故丞相孔光故左將軍彭宣經皆更博士位皆歷三公智謀威信可與建教化圖安危龔勝為司直郡國皆慎選舉三輔委輸官不敢為姦可大委任也陛下前以小不忍退武等海內失望陛下尚能容亡功德者甚衆曾不能忍武等邪治天下者當用天下之心為心不得自專快意而已也上之皇天見譴下之黎庶怨恨次有諫爭之臣陛下苟欲自薄而厚惡臣天下猶不聽也臣雖愚戇獨不知多受祿賜美食大官廣田宅厚妻子不與惡人結讎怨以安身邪誠迫大義官以諫爭為職不敢不竭愚惟陛下少留神明覽五經之文原聖人之至意深思天地之戒臣宣訥鈍於辭不勝惓惓盡死節而已見漢書鮑宣傳復上書陛下父事天母事地子養黎民即位已來父虧明母震動子訛言相驚恐今日蝕於三始誠可畏懼小民正月朔日尚恐毀敗器物何況於日虧乎陛下深內自責避正殿舉直言求過失罷退外親及旁仄素餐之人徵拜孔光為光祿大夫發覺孫寵息夫躬過惡免官遣就國衆庶歙然莫不說喜天人同心人心說則天意解矣乃二月丙戍白虹虷日連陰不雨此天有憂結未解民有怨望未塞者也侍中駙馬都尉董賢本無葭莩之親但以令色諛言自進賞賜亡度竭盡府臧并合三第尚以為小復壞暴室賢父子坐使天子使者將作治第行夜吏卒皆得賞賜上冢有會輒太官為供海內貢獻當養一君今反盡之賢家豈天意與民意邪天不可久負厚之如此反所以害之也誠欲哀賢宜為謝過天地解讎海內免遣就國收乘輿器物還之縣官如此可以父子終其性命不者海內之所讎未有得久安者也孫寵息夫躬不宜居國可皆免以視天下復徵何武師丹彭宣傅喜曠然使民易視以應天心建立大政以興大平之端高門去省戶數十步求見出入二年未省欲使海瀕仄陋自通遠矣願賜數刻之閒極竭毣毣之思退入三泉死亡所恨見漢書鮑宣傳上書言王鳳專擅臣聞箕子佯狂於殷而為周陳洪範叔孫通遁秦歸漢制作儀品夫叔孫先非不忠也箕子非疏其家而畔親也不可為言也昔高祖納善若不及從諫若轉圜聽言不求其能舉功不考其素陳平起於亡命而為謀主韓信拔於行陳而建上將故天下之士雲合歸漢爭進奇異知者竭其策愚者盡其慮勇士極其節怯夫勉其死合天下之知并天下之威是以舉秦如鴻毛取楚若拾遺此高祖所以亡敵於天下也孝文皇帝起於代谷非有周召之師伊呂之佐也循高祖之法加以恭儉當此之時天下幾平繇是言之循高祖之法則治不循則亂何者秦為亡道削仲尼之迹滅周公之軌壞井田除五等禮廢樂崩王道不通故欲行王道者莫能致其功也孝武皇帝好忠諫說至言出爵不待廉茂慶賜不須顯功是以天下布衣各厲志竭精以赴闕廷自衒鬻者不可勝數漢家得賢於此為盛使孝武皇帝聽用其計升平可致於是積尸暴骨快心胡越故淮南王安緣閒而起所以計慮不成而謀議泄者以衆賢聚於本朝故其大臣藝陵不敢和從也方今布衣乃窺國家之隙見閒而起者蜀郡是也及山陽亡徒蘇令之群蹈藉名都大郡求黨與索隨和而亡逃匿之意此皆輕量大臣亡所畏忌國家之權輕故匹夫欲與上爭衡也士者國之重器得士則重失士則輕詩云濟濟多士文王以寧廟堂之議非草茅所當言也臣誠恐身塗野草尸并卒伍故數上書求見輒報罷臣聞齊桓之時有以九九見者桓公不逆欲以致大也今臣所言非特九九也陛下距臣者三矣此天下士所以不至也昔秦武王好力任鄙叩關自鬻繆公行伯繇余歸德今欲致天下之士民有上書求見者輒使詣尚書問其所言言可采取者秩以升斗之祿賜以一束之帛若此則天下之士發憤悶吐忠言嘉謀日聞於上天下條貫國家表裏爛然可睹矣夫以四海之廣士民之數能言之類至衆多也然其俊桀指世陳政言成文章質之先聖而不繆施之當世合時務若此者亦亡幾人故爵祿束帛者天下之砥石高祖所以厲世摩鈍也孔子曰工欲善其事必先利其器至秦則不然張誹謗之罔以為漢驅除倒持泰阿授楚其柄故誠能勿失其柄天下雖有不順莫敢觸其鋒此孝武皇帝所以辟地建功為漢世宗也今不循伯者之道乃欲以三代選舉之法取當時之士猶察伯樂之圖求騏驥於市而不可得亦已明矣故高祖棄陳平之過而獲其謀晉文召天王齊桓用其讎有益於時不顧逆順此所謂伯道者也一色成體謂之醇白黑雜合謂之駮欲以承平之法治暴秦之緒猶以鄉飲酒之禮理軍市也今陛下既不納天下之言又加戮焉夫䳒鵲遭害則仁鳥增逝愚者蒙戮則知士深退閒者愚民上疏多觸不急之法或下廷尉而死者衆自陽朔以來天下以言為諱朝廷尤甚群臣皆承順上指莫有執正何以明其然也取民所上書陛下之所善試下之廷尉廷尉必曰非所宜言大不敬以此卜之一矣故京兆尹王章資質忠直敢面引廷爭孝元皇帝擢之以厲具臣而矯曲朝及至陛下戮及妻子且惡惡止其身王章非有反畔之辜而殃及家折直士之節結諫臣之舌群臣皆知其非然不敢爭天下以言為戒最國家之大患也願陛下循高祖之軌杜亡秦之路數御十月之歌留意亡逸之戒除不急之法下亡諱之詔博覽兼聽謀及疏賤令深者不隱遠者不塞所謂辟四門明四目也且不急之法誹謗之微者也往者不可及來者猶可追方今君命犯而主威奪外戚之權日以益隆陛下不見其形願察其景建始以來日食地震以率言之三倍春秋水災亡與比數陰盛陽微金鐵為飛此何景也漢興以來社稷三危呂霍上官皆母后之家也親親之道全之為右當與之賢師良傅教以忠孝之道今乃尊寵其位授以魁柄使之驕逆至於夷滅此失親親之大者也自霍光之賢不能為子孫慮故權臣易世則危書曰毋若火始庸庸藝陵於君權隆於主然後防之亦亡及已見漢書梅福傳上書請封孔子子孫為殷後臣聞不在其位不謀其政政者職也位卑而言高者罪也越職觸罪危言世患雖伏質橫分臣之願也守職不言沒齒身全死之日尸未腐而名滅雖有景公之位伏歷千駟臣不貪也故願一登文石之陛涉赤墀之塗當戶牖之法坐盡平生之愚慮亡益於時有遺於世此臣寢所以不安食所以忘味也願陛下深省臣言臣聞存人所以自立也壅人所以自塞也善惡之報各如其事昔者秦滅二周夷六國隱士不顯佚民不舉絶三統滅天道是以身危子殺厥孫不嗣所謂壅人以自塞者也故武王克殷未下車存五帝之後封殷於宋紹夏於杞明著三統示不獨有也是以姬姓半天下遷廟之主流出於戶所謂存人以自立者也今成湯不祀殷人亡後陛下繼嗣久微殆為此也春秋經曰宋殺其大夫穀梁傳曰其不稱名姓以其在祖位尊之也此言孔子故殷後也雖不正統封其子孫以為殷後禮亦宜之何者諸侯奪宗聖庶奪適傳曰賢者子孫宜有土而況聖人又殷之後哉昔成王以諸侯禮葬周公而皇天動威雷風著災今仲尼之廟不出闕里孔氏子孫不免編戶以聖人而歆匹夫之祀非皇天之意也今陛下誠能據仲尼之素功以封其子孫則國家必獲其福又陛下之名與天亡極何者追聖人素功封其子孫未有法也後聖必以為則不滅之名可不勉哉見漢書梅福傳上言宜絶康居本胸奴盛時非以兼有烏孫康居故也及其稱臣妾非以失二國也漢雖皆受其質子然三國內相輸遺交通如故亦相侯伺服見便則發合不能相親信離不能相臣役以今言之結配烏孫竟未有益反為中國生事然烏孫既結在前今與胸奴俱稱臣義不可距而康居驕黠訖不肯拜使者都護吏至其國坐之烏孫諸使下王及貴人先飲食已乃飲啖都護吏故為無所省以夸旁國以此度之何故遣子入侍其欲賈市為好辭之詐也胸奴百蠻大國今事漢甚備聞康居不拜且使單于有自下之意宜歸其侍子絶勿復使以章漢家不通無禮之國敦煌酒泉小郡及南道八國給使者往來人馬驢橐駝食皆苦之空罷耗所過送迎驕黠絶遠之國非至計也見漢書西域康居傳臨死戒諸子丈夫為吏正坐殘賊免追思其功效則復進用矣一坐軟弱不勝任免終身廢棄無有赦時其羞辱甚於貪汙坐臧慎毋然見漢書酷吏傳上書理師丹丹經行無比自近世大臣能若丹者少發憤悶奏封事不及深思遠慮使主簿書漏泄之過不在丹以此貶黜恐不厭衆心見漢書師丹傳朱博傅晏趙玄罪議春秋之義姦以事君常刑不舍魯大夫叔孫僑如欲顓公室譖其族兄季孫行父於晉晉執囚行父以亂魯國春秋重而書之今晏放命圮族干亂朝政要大臣以罔上本造計謀職為亂階宜與傅玄同罪罪皆不道見漢書朱博傳王嘉罪議嘉資性邪僻所舉多貪殘吏位列三公陰陽不和諸事並廢咎皆繇嘉迷國不疑今舉相等過微薄見漢書兩龔傳嘉備宰相諸事竝廢咎由嘉生嘉坐薦相等微薄以應迷國罔上不道恐不可以示天下見漢書王嘉傳案此與兩龔傳互有刪節故竝録之
