body:
  text: 揚雄蜀都賦蜀都之地古曰梁州禹治其江渟皋彌望鬱乎青蔥沃野千里上稽乾度則井絡儲精下案地紀則坤宮奠位東有巴賨綿互百濮銅梁金臺火井龍湫其中則有玉石嶜岑丹青玲瓏邛節桃枝石鰽水螭南則有楗牂潛夷昆明峨眉絶限峎嵣堪巖亶翔靈山揭其右離堆被其東于近則有瑕英菌芝玉石江珠于遠則有銀鉛錫碧馬犀象僰西有鹽泉鐵冶橘林銅陵邙連盧池淡漫波淪其旁則有期牛兕旄金馬碧雞北則有岷山外羌白馬獸則麙羊野麋罷犛貘貒麡𪋮鹿麝戶豹能黃獑胡蜼玃猿蠝貜猱猶穀畢方爾乃倉山隱天岎崟回叢增嶄重崒𡶑石崔𡾛嶵嵬霜雪終夏叩巖嶺嶙崇隆臨柴諸徼崼嵲五𥐸參差湔山巖巖觀上岑嵓龍陽纍峗漼粲交倚崔崒崛崎集嶮脅施形精出偈堪𡽊隱倚彭門嶋㟅岍嵃嵑岢方彼碑地𡸗𡶐輵𡽖礫乎嶽嶽北屬崑崙泰極涌泉醴凝水流津漉集成川于是乎則左沈犛右羌庭漆水浡其胸都江漂其脛乃溢乎通溝洪濤溶沈千湲萬谷合流逆折必瀄乎爭降湖潧排碣反波逆濞礫石洌巘紛𦭰周漙旋溺冤綏頽塹搏岸敵呷䘹瀨磴巖樘汾忽溶闛沛踰窘出限連混陀隧銍釘鐘涌聲歡薄泙龍歷豐隆潛延雷抶電擊鴻鴻康濭速遠乎長喻馳山下卒湍降疾流分川並注合乎江州于木則楩櫟豫章樹榜簷櫖樿押青稚雕梓枌梧橿櫪㯕楢木稷丫信揖叢俊幹湊集枇櫅㭈楬圠沈樘椅從風推參循崖撮捼淫淫溶溶繽紛幼靡泛閎野望芒芒菲菲其竹則鍾龍䇣𥯑野篠紛鬯宗生族攢俊茂豐美洪溶忿葦紛揚搔翕與風披拖夾江緣山尋卒而起結根才業填衍回野若此者方乎數千里于泛則注注漾漾積土崇隄其淺溼則生蒼葭蔣蒲藿芧青蘋草葉蓮蕅茱華菱根其中則有翡翠鴛鴦裊鸕鷁鷺雙鶤鷫鷞其深則有猵獺沈鱓水豹蛟蛇黿蟺鱉龜衆鱗鰨爾乃其都門二九四百餘閭兩江珥其前九橋帶其流武儋鎮都刻削成蘞王基既夷獨侯尚叢并石石屏岓岑倚從秦漢之徙充以山東是以隤山厥饒水貢其獲苴竹浮流龜鱉磧竹石蝎相救魚酌不收鵌鴝𪃫風胎雨鷇衆物駭目單不知所禦爾乃其裸羅諸圃緑畛黃甘諸柘柿桃杏李枇杷杜樼栗奈棠黎離支雜以梴橙被以櫻梅樹以木蘭扶林禽爚般關旁支何若英絡其間春機楊柳裊弱蟬杪扶施連卷駏貕糖蛦子呼焉爾乃五穀馮戎瓜瓠饒多卉以部麻往往薑桅附子巨蒜木艾椒蘺藹醬酴清衆獻儲斯盛冬育筍舊菜增伽百華投春隆隱分芳蔓茗熒翠藻芷青黃麗靡摛燭若揮錦布繡望芒芒兮無幅爾乃其人自造奇錦紌繏匪䋶縿緣盧中發文揚采轉代無窮其布則細絺弱折綿繭成衽阿麗纖靡避晏與陰蜘蛛作絲不可見風筒中黃潤一端數金雕鏤鉛器百伎千工東西鱗集南北並湊馳逐相逢周流往來方轅齊轂隱隱軫軫幽輵埃勃塵拂萬端異類崇戎總濃般旋闠齊誻楚而喉不感概萬物更湊四時迭代彼不折貨我罔乏械財用饒贍蓄積備具若夫慈孫孝子宗厥祖禰鬼神祭祀練時選日瀝豫齊戒龍明衣表玄縠儷吉日異清濁合疏明綏離旅乃使有伊之徒調夫五味甘甜之和勺藥之羹江東鮐鮑隴西牛羊糴米肥豬𪋇麀不行鴻𧴅𤢏乳獨竹孤鶬炮梟被紕之胎山麕髓腦水遊之腴蜂豚應鴈被鴳晨鳧戳鶂初乳山鶴既交春羔秋𪕋膾鮻龜肴粳田孺鷩形不及勞五肉七菜朦猒腥臊可以頤精神養血脤者莫不畢陳爾乃其俗迎春送冬百金之家千金之公乾池泄澳觀魚于江若其吉日嘉會期于倍口口春之陰迎夏之陽侯羅司馬郭范畾楊置酒乎滎川之間宅設坐乎華都之高堂延帷揚幕接帳連岡衆器雕琢早刻將皇朱緑之畫邠盼麗光龍蛇蜿蜷錯其中禽獸奇偉髦山林昔天地降生壯𨝘密促之君則荊上亡尸之相厥女作歌是以其聲呼靖領激呦喝啾戶音六成行夏低徊胥徒入冥及廟噆吟諸連單情舞曲轉節踃馺應聲其佚則接芬錯芳襜袩纖延踏淒秋發陽春羅儒吟吳公連眺朱顏離絳脣眇眇之態吡噉出焉若其遊怠漁弋卻公之徒相與如乎陽瀕巨野羅車百乘期會投宿觀者之隄行船競逐偃衍撇曳絺索恍惚羅畏彌澥蔓蔓沕沕蘢睢䁨兮罧布列枚孤施兮纖繳出驚雌落兮高雄蹶翔鵾挂兮奔縈畢俎飛膾沈單然後別見古文苑韓元吉本又章樵注本又略見藝文類聚六十甘泉賦並序孝成帝時客有薦雄文似相如者上方郊祠甘泉泰畤汾陰后土以求繼嗣召雄待詔承明之庭正月從上甘泉還奏甘泉賦以風其辭曰惟漢十世將郊上玄定泰畤雍神休尊明號同符三皇録功五帝恤胤錫羡拓迹開統於是乃命群僚歷吉日協靈辰星陳而天行詔招搖與泰陰兮伏鉤陳使當兵屬堪輿以壁壘兮梢夔魖而抶獝狂八神奔而警蹕兮振殷轔而軍裝蚩尤之倫帶干將而秉玉戚兮飛蒙葺而走陸梁齊總總撙撙其相膠葛兮猋駭雲訊奮以方攘駢羅列布鱗以雜沓兮柴虒參差魚頡而鳥𦐄翕赫曶霍霧集蒙合兮半散照爛粲以成章於是乘輿乃登夫鳳皇兮翳華芝駟蒼螭兮六素虯蠖略蕤綏灕呼幓纚帥爾陰閉霅然陽開騰清霄而軼浮景兮夫何旟旐郅偈之旖柅也流星旄以電燭兮咸翠蓋而鸞旗敦萬騎於中營兮方玉車之千乘聲駍隱以陸離兮輕先疾雷而馺遺風陵高衍之嵱嵷兮超紆譎之清澄登椽欒而羾天門兮馳閭闔而入凌兢是時未轃夫甘泉也乃望通天之繹繹陰潛以慘廩兮上洪紛而相錯直嶢嶢以造天兮厥高慶而不可呼疆度原唐其壇曼兮列新雉于林薄攢并閭與茇䒷兮紛被麗其亡鄂丘陵之駊騀兮深溝嶔巖而為谷往往離宮般以相燭兮封巒石關施靡呼延屬于是大夏雲譎波詭摧嗺而成觀仰嬌首以高視兮目冥眴而亡見濫以弘惝兮指東西之漫漫回回以徨徨兮魂固眇眇而昏亂軨軒而周流兮忽軮軋而亡垠玉樹之青蔥兮壁馬犀之瞵㻞金人仡仡其承鍾虡兮嵌巖巖其龍鱗揚光曜之燎燭兮乘景炎之炘炘配帝居之縣圃兮象泰一之威神洪臺掘其獨出兮㨖北極之嶟嶟列宿乃施于上榮兮日月才於柍桭雷鬱律于巖突兮電倏忽於牆藩鬼魅不能自還兮半長途而下顛歷倒景而絶飛梁兮浮蔑蠓而撇天左欃槍右玄冥兮前熛闕而後應門陰西海與幽都兮涌醴汩以生川蛟龍連蜷於東崖兮白虎敦圉呼昆侖覽樛流于高光兮溶方皇于西清前殿崔巍兮和氏瓏玲炕浮柱之飛榱兮神莫莫而扶傾閌閬閬其寥廓兮似紫宮之崢巆駢交錯而曼衍兮㟎嶵隗呼其相嬰乘雲閣而上下兮紛蒙籠以掍成曳紅采之流離兮揚翠氣之冤延襲琁室與傾宮兮若登高眇遠肅呼臨淵回猋肆其碭駭兮翍桂椒而鬱栘楊香芬茀以窮隆兮擊薄櫨而將榮薌呹肸以棍根兮聲駍隱而歷鍾排玉戶而揚金鋪兮發蘭惠與穹窮惟弸彋其拂汩兮稍暗暗而靚深陰陽清濁穆羽相和兮若夔牙之調琴般倕棄其剞劂兮王爾投其鉤繩雖方征僑與偓佺兮猶仿佛其若夢于是事變物化目駭耳回蓋天子穆然珍臺間館琁題玉英蜵蜎蠖濩之中惟夫所以澄心清魂儲精垂思感動天地逆釐三神者乃搜逑索耦皋伊之徒冠倫魁能函甘棠之惠挾東征之意相與齊呼陽靈之宮靡薜荔而為席兮折瓊枝以為芳吸清雲之流瑕兮飲若木之露英集呼禮神之囿登乎頌祇之堂建光耀之長旓兮昭華覆之威威攀琁璣而下視兮行遊目呼三危陳衆車於東坑兮肆玉釱而下馳漂龍淵而還有九垠兮窺地底而上回風傱傱而扶轄兮鸞鳳紛其御蕤梁弱水之濎濴兮躡不周之逶蛇想西王母欣然而上壽兮屏玉女而卻虙妃玉女無所眺其清盧兮虙妃曾不得施其蛾眉方攬道德之精剛兮侔神明與之為資于是欽祡宗祈燎熏皇天招繇泰一舉洪頤樹靈旗樵蒸焜上配藜四施東燭倉海西耀流沙北爌幽都南煬丹崖玄瓚觩䚧秬鬯泔淡肸嚮豐融懿懿芬芬炎感黃龍兮熛訛碩麟選巫咸兮叫帝閽開天庭兮延群神儐暗藹兮降清壇瑞穰穰兮委如山于是事畢功弘回車而歸度三巒兮偈棠梨天閫決兮地垠開八荒協兮萬國諧登長平兮雷鼓磕天聲起兮勇士厲雲飛揚兮雨滂沛于胥德兮麗萬世亂曰崇崇圜丘隆隱天兮登降峛崺單埢垣兮增宮嵾差駢嵯峨兮嶺巆嶙峋洞亡崖兮上天之縡杳旭卉兮聖皇穆穆信厥對兮徠祗郊禋神所依兮俳佪招搖靈遲遲兮輝光眩耀隆厥福兮子子孫孫長亡極兮見漢書楊雄傳文選藝文類聚三十九河東賦並序其三月將祭后土上乃帥群臣橫大河湊汾陰既祭行遊介山回安邑顧龍門覽鹽池登歷觀陟西嶽以望八荒迹殷周之虛眇然以思唐虞之風雄以為臨川羡魚不如歸而結網還上河東賦以勸其辭曰伊年暮春將瘞后土禮靈祇謁汾陰于東郊因茲以勒崇垂鴻發祥隤祉欽若神明者盛哉鑠乎越不可載已於是命群臣齊法服整靈輿乃撫翠鳳之駕六先景之乘掉奔星之流旃彏天狼之威弧張耀日之玄旄揚左纛被雲梢奮電鞭驂電輜鳴洪鍾建五旗羲和司日顏倫奉輿風發飆拂神騰鬼趡千乘霆亂萬騎屈橋嘻嘻旭旭天地稠嶅簸丘跳巒涌渭躍涇秦神下讋跖魂負沴河靈矍踢爪華蹈衰遂臻陰宮穆穆肅肅蹲蹲如也靈祇既鄉五位時敘絪縕玄黃將紹厥後于是靈輿安步周流容與以覽呼介山嗟文公而愍推兮勤大禹于龍門灑沈災于豁瀆兮播九河于東瀕登歷觀而遙望兮聊浮遊以經營樂往昔之遺風兮喜虞氏之所耕瞰帝唐之嵩高兮眽隆周之大寧汩低回而不能去兮行睨陔下與彭城濊南巢之坎坷兮易豳岐之夷平乘翠龍而超河兮陟西嶽之嶢崝雲仄霏霏而來迎兮澤滲灕而下降鬱蕭條其幽藹兮滃泛沛以豐隆叱風伯于南北兮呵雨師于西東參天地而獨立兮廓蕩蕩其亡雙遵逝呼歸來以函夏之大漢兮彼曾何足與比功建乾坤之貞兆兮將悉總之以群龍麗鉤芒與驂蓐收兮服玄冥及祝融敦衆神使式道兮奮六經以攄頌隃於穆之緝熙兮過清廟之雍雍軼五帝之遐迹兮躡三皇之高蹤既發軔于平盈兮誰謂路遠而不能從見漢書揚雄傳藝文類聚三十九羽獵賦並序孝成帝時羽獵雄從以為昔在二帝三王宮館臺榭沼池苑囿林麓藪澤財足以奉郊廟御賓客充庖廚而已不奪百姓膏腴穀土桑柘之地女有餘布男有餘粟國家殷富上下交足故甘露零其庭醴泉流其唐鳳皇巢其樹黃龍遊其沼麒麟臻其囿神爵棲其林昔者禹任益虞而上下和草木茂成湯好田而天下用足文王囿百里民以為尚小齊宣王囿四十里民以為大裕民之與奪民也武帝廣開上林東南至宜春鼎胡御宿昆吾旁南山而西至長楊五柞北繞黃山瀕渭而東周袤數百里穿昆明池象滇河營建章鳳闕神明馺娑漸臺泰液象海水周流方丈瀛洲蓬萊遊觀侈靡窮妙極麗雖頗割其三垂以贍齊民然至羽獵甲車戎馬器械儲偫禁禦所營尚泰奢麗誇詡非堯舜成湯文王三驅之意也又恐後世復修前好不折中以泉臺故聊因校獵賦以風之其辭曰或稱義農豈或帝王之彌文哉論者云否各亦並時而得宜奚必同條而共貫則泰山之封焉得七十而有二儀是以創業垂統者俱不見其爽遐邇五三孰知其是非遂作頌曰麗哉神聖處于玄宮富既與地乎侔訾貴正與天呼比崇齊桓曾不足使扶轂楚嚴未足以為驂乘狹三王之厄薜嶠高舉而大興歷五帝之寥廓涉三皇之登閎建道德以為師友仁義與之為朋于是玄冬季月天地隆烈萬物權輿于內徂落于外帝將惟田于靈之囿開北垠受不周之制以奉終始顓頊玄冥之統乃詔虞人典澤東延昆鄰西馳閶闔儲積共偫戍卒夾道斬叢棘夷野草御自汧渭經營酆鎬章皇周流出入日月天與地杳爾乃虎路三嵕以為司馬圍經百里為殿門外則正南極海邪界虞淵鴻濛沆茫揭以崇山營合圍會然后先置乎白楊之南昆明靈沼之東賁育之倫蒙盾負羽杖鏌邪而羅者以萬計其餘荷垂天之罼張竟之罘靡日月之朱竿曳彗星之飛旗青雲為紛紅霓為繯屬之乎昆侖之虛渙若天星之羅浩如濤水之波淫淫與與前後要遮欃槍為闉明月為候熒惑司命天弧發射鮮扁陸離駢衍佖路徽車輕武鴻絧緁獵殷殷軫軫被陵緣坂窮敻極遠者相與列乎高原之上羽騎營營昈分殊事繽紛往來轠轤不絶若光若滅者布乎青林之下于是天子乃以陽朝始出呼玄宮撞鴻鍾建九旒六白虎載靈輿蚩尤𧪻轂蒙公先驅立歷天之旗曳捎星之旃辟歷烈缺吐火施鞭萃傱沇溶淋離廓落戲八鎮而開關飛廉雲師吸濞潚率鱗羅布列攢以龍翰啾啾蹌蹌入西園切神光望平樂徑竹林蹂惠圃踐蘭唐舉烽烈火轡者施技方馳千駟狡騎萬帥虓虎之陳從橫膠輵猋拉雷厲驞駍駖磕洶洶旭旭天動地岋羡漫半散蕭條數千萬里外若夫壯士慷慨殊鄉別趣東西南北騁耆奔欲扡蒼豨跋犀犛蹶浮麋斫巨狿搏玄援騰空虛距連卷踔夭蟜娭澗門莫莫紛紛山谷為之風猋林叢為之生塵及至獲夷之徒蹶松柏掌蒺藜獵蒙蘢轔輕飛履般首帶修蛇鉤赤豹摼象犀跇巒坑超唐陂車騎雲會登降暗藹泰華為旒熊耳為綴木仆山還漫若天外儲與呼大浦聊浪乎宇內于是天清日晏逢蒙列眥羿氏控弦皇車幽輵光純天地望舒彌轡翼乎徐至于上蘭移圍徙陳浸淫蹴部曲隊堅重各案行伍璧壘天旋神抶電擊逢之則碎近之則破鳥不及飛獸不得過軍驚師駭刮野掃地及至罕車飛揚武騎聿皇蹈飛豹絹嘄陽追天寶出一方應駍聲擊流光盡山窮囊括其雌雄沇沇溶溶遙噱呼紘中三軍芒然窮冘閼與亶觀夫剽禽之紲隃犀兕之抵觸熊羆之拿攫虎豹之凌遽徒角槍題注蹙竦讋怖魂亡魄觸輻關脰妄發期中進退履獲創淫輪夷丘纍陵聚于是禽殫中衰相與集于靖冥之館以臨珍池灌以岐梁溢以江河東瞰目盡西畼亡崖隨珠和氏焯爍其陂玉石嶜崟眩耀青熒漢女水潛怪物暗冥不可殫形玄鸞孔雀翡翠垂榮王睢關關鴻雁嚶嚶群娛乎其中噍噍昆鳴鳧鷖振鷺上下砰礚聲若雷霆乃使文身之技水格鱗蟲凌堅冰犯嚴淵探巖排崎薄索蛟螭蹈獱獺據黿鼉抾靈蠵入洞穴出蒼梧乘巨鱗騎京魚浮彭蠡目有虞方椎夜光之流離剖明月之珠胎鞭洛水之虙妃餉屈原與彭胥于茲呼鴻生巨儒俄軒冕雜衣裳修唐典匡雅頌揖讓于前昭光振耀蠁曶如神仁聲惠于北狄武誼動於南鄰是以旃裘之王胡貉之長移珍來享抗手稱臣前入圍口後陳盧山群公常伯楊朱墨翟之徒喟然並稱曰崇哉乎德雖有唐虞大夏成周之隆何以侈茲夫古之覲東嶽禪梁基舍此世也其誰與哉上猶謙讓而未俞也方將上獵三靈之流下決醴泉之滋發黃龍之穴窺鳳皇之巢臨麒麟之囿幸神雀之林奢雲夢侈孟諸非章華是靈臺罕徂離宮而輟遊觀土事不飾木功不雕承民乎農桑勸之以弗怠儕男女使莫違恐貧窮者不遍被洋溢之饒開禁苑散公儲創道德之囿弘仁惠之虞馳弋乎神明之囿覽觀乎群臣之有亡放雉兔收罝罘麋鹿芻蕘與百姓共之蓋所以臻茲也于是醇洪鬯之德豐茂世之規加勞三皇勗勤五帝不亦至乎乃祇莊雍穆之徒立君臣之節崇賢聖之業未遑苑囿之麗遊獵之靡也因回軫還衡背阿房反未央見漢書揚雄傳文選藝文類聚六十六
