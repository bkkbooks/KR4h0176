body:
  text: 楊雄長楊賦並序明年上將大誇胡人以多禽獸秋命右扶風發民入南山西自褒斜東至弘農南驅漢中張羅罔罝罘捕熊羆豪豬虎豹狖玃狐菟麋鹿載以檻車輸長楊射熊館以罔為周阹縱禽獸其中令胡人手搏之自取其獲上親臨觀焉是時農民不得收斂雄從至射熊館還上長楊賦聊因筆墨之成文章故藉翰林以為主人子墨為客卿以風其辭曰子墨客卿問於翰林主人曰蓋聞聖主之養民也仁霑而恩洽動不為身今年獵長楊先命右扶風左太華而右褒斜椓巀嶭而為弋紆南山以為罝羅千乘于林莽列萬騎于山隅帥軍踤阹錫戎獲胡扼熊羆拖豪豬木雍槍纍以為儲胥此天下之窮覽極觀也雖然亦頗擾于農民三旬有餘其廑至矣而功不圖恐不識者外之則以為娛樂之遊內之則不以為乾豆之事豈為民乎哉且人君以玄默為神淡泊為德今樂遠出以露威靈數搖動以罷車甲本非人主之急務也蒙竊惑焉翰林主人曰吁客何謂之茲邪若客所謂知其一未睹其二見其外不識其內者也僕嘗倦談不能一二其詳請略舉其凡而客自覽其切焉客曰唯唯主人曰昔有強秦封豕其士窫窳其民鑿齒之徒相與摩牙而爭之豪俊麋沸雲擾群黎為之不康于是上帝眷顧高祖高祖奉命順斗極運天關橫巨海漂昆侖提劍而叱之所過麾城摲邑下將降旗一日之戰不可殫記當此之勤頭蓬不暇疏飢不及餐鞮鍪生蟣蝨介胄被霑汗以為萬姓請命呼皇天乃展民之所詘振民之所乏規億載恢帝業七年之閒而天下密如也逮至聖文隨風乘流方垂意于至寧躬服節儉綈衣不敝革鞜不穿大夏不居木器無文于是後宮賤玳瑁而疏珠璣卻翡翠之飾除雕琢之巧惡麗靡而不近斥芬芳而不御抑止絲竹晏衍之樂憎聞鄭衛幼眇之聲是以玉衡正而太階平也其後熏鬻作虐東夷橫畔羌戎睚眥閩越相亂遐為之不安中國蒙被其難于是聖武勃怒爰整其旅乃命驃衛汾沄沸渭雲合電發猋騰波流機駭蜂軼疾如奔星擊如震霆碎轒轀破穹廬腦沙幕髓余吾遂躐乎王庭驅橐它燒熐蠡分剺單于磔裂屬國夷坑谷拔鹵莽刊山石蹂尸輿廝係纍老弱兗鋌瘢耆金鏃淫夷者數十萬人皆稽顙樹頷扶服蛾伏二十餘年矣尚不敢惕息夫天兵四臨幽都先加回戈邪指南越相夷靡節西征羌僰東馳是以遐方疏俗殊鄰絶黨之域自上仁所不化茂德所不綏莫不蹻足抗首請獻厥珍使海內淡然永亡邊城之災金革之患今朝廷純仁遵道顯義并包書林聖風雲靡英華沈浮洋溢八區普天所覆莫不沾濡士有不談王道者則樵夫笑之意者以為事罔隆而不殺物靡盛而不虧故平不肆險安不忘危乃時以有年出兵整輿竦戎振師五柞習馬長楊簡力狡獸校武票禽乃萃然登南山瞰烏弋西厭月𩨳東震日域又恐後世迷于一時之事常以此為國家之大務淫荒田獵陵夷而不禦也是以車不安軔日未靡旃從者倣佛骫屬而還亦所以奉太宗之烈遵文武之度復三王之田反五帝之虞使農不輟耰工不下機婚姻以時男女莫違出愷弟行簡易矜劬勞休力役見百年存孤弱帥與之同苦樂然後陳鐘鼓之樂鳴鞀磬之和建碣磍之虡拮隔鳴球掉八列之舞酌允鑠肴樂胥聽廟中之雍雍受神人之福祜歌投頌吹合雅其勤若此故真神之所勞也方將俟元符以禪梁甫之基增泰山之高延光于將來比榮乎往號豈徒欲淫覽浮觀馳騁粳稻之地周流梨梨栗之林蹂踐芻蕘誇詡衆庶盛狖玃之收多麋鹿之獲哉且盲不見咫尺而離婁燭千里之隅客徒愛胡人之獲我禽獸曾不知我亦已獲其王侯言未卒墨客降席再拜稽首曰大哉體乎允非小人之所能及也乃今日發矇廓然已昭矣見漢書揚雄傳文選核靈賦自今推古至于元氣始化古不覽今名號迭毀請以詩春秋言之見御覽一太易之始太初之先馮馮沈沈奮搏無端見御覽一河出龍馬雒貢龜書見文選陸倕石闕銘注世有黃公者起于蒼州精神養性與道浮游見文選謝朓之宣城出新林浦詩注二子規游矩步見文選陸機君子有所思行注文王之始起浸仁漸義會賢僭智見文選江淹詣建平王書注枝附葉從表立景隨見文選陳琳檄吳將校部曲注又蔡雍郭有道碑文注太玄賦觀大易之損益兮覽老氏之倚伏省憂喜之共門兮察吉凶之同域曒曒著乎日月兮何俗聖之暗燭豈愒寵以冒災兮將噬臍之不及若飄風不終朝兮驟雨不終日雷隱隱輒息兮火猶熾而速滅自夫物有盛衰兮況人事之所極奚貪焚于富貴兮迄喪躬而危族豐盈禍所棲兮名譽怨所集薰以芳而致燒兮膏含肥而見焫翠羽媺而殃身兮蚌含珠而擘裂聖作典以濟時兮驅蒸民而入甲張仁義以為綱兮懷忠貞以矯俗指尊選以誘世兮疾身歿而名滅豈若師由聃兮執玄靜于中谷納傿祿于江淮兮揖松喬于華嶽升崑崙以散髮兮踞弱水而濯足朝發軔于流沙兮夕翱翔于碣石忽萬里而一頓兮過列仙以託宿役青要以承弋兮舞馮夷以作樂聽素女之清聲兮觀宓妃之妙曲茹芝英以禦飢兮飲玉醴以解渴排閶闔以窺天庭兮騎騂騩以踟蹰載羡門與麗游兮永覽周乎八極亂曰甘餌含毒難數嘗兮麟而可羈近犬羊兮鸞鳳高翔戾青雲兮不掛網羅固足珍兮斯錯位極離大戮兮屈子慕清葬魚腹兮伯姬曜名焚厥身兮孤竹二子餓首山兮斷跡屬婁何足稱兮辟斯數子智若淵兮我異于此執太玄兮蕩然肆志不拘攣兮見古文苑逐貧賦揚子遁居離俗獨處左鄰崇山右接曠野鄰垣乞兒終貧且窶禮薄義弊相與群聚惆悵失志呼貧與語汝在六極投棄荒遐好為庸卒刑戮相加匪惟幼稚嬉戲土砂居非近鄰接屋連家恩輕毛羽義薄輕羅進不由德退不受呵久為滯客其意謂何人皆文繡余褐不完人皆稻粱我獨藜飱貧無寶玩何以接歡宗室之燕為樂不槃徒行賃笈出處易衣身服百役手足胼胝或耘或耔霑體露肌朋友道絶進官凌遲厥咎安在職汝為之舍汝遠竄崑崙之顛爾復我隨翰飛戾天舍爾登山巖穴隱藏爾復我隨陟彼高岡捨爾入海泛彼柏舟爾復我隨載沈載浮我行爾動我靜爾休豈無他人從我何求今汝去矣勿復久留貧曰唯唯主人見逐多言益嗤心有所懷願得盡辭昔我乃祖宣其明德克佐帝堯誓為典則土階茅茨匪雕匪飾爰及季世縱其㗃惑叨餮之群貪富苟得鄙我先人乃傲乃驕瑤臺瓊榭室屋崇高流酒為池積肉為崤是用鵠逝不踐其朝三省吾身謂豫無愆處君之家福祿如山忘我大德思我小怨堪寒能暑少而習焉寒暑不忒等壽神仙桀跖不顧貪類不干人皆重蔽豫獨露居人皆怵惕豫獨無虞言辭既罄色厲目張攝齊而興降階下堂誓將去汝適彼首陽孤竹二子與我連行余乃避席辭謝不直請不二過聞義則服長與汝居終無厭極貧逐不去與我遊息見藝文類聚三十五初學記十八御覽四百八十五古文苑酒賦漢孝成皇帝好酒雄作酒賦以諷之見御覽八十九引酒賦序子猶瓶矣觀瓶之居居酒之眉處高臨深動常近危酒醪不入口臧水滿懷不得左右牽于纆徽一旦車礙為瓽所轠身提黃泉骨肉為泥自用如此不如鴟夷鴟夷滑稽腹如大壼盡日盛酒人復借酤常為國器託于屬車出入兩宮經營公家繇是言之酒何過乎見漢書游俠陳遵傳北堂書鈔一百四十八藝文類聚七十二初學記二十六御覽七百五十八又七百六十一反離騷雄怪屈原文過相如而主不容作離騷自投江而死悲其文讀之未嘗不流涕也以為君子得時則大行不得時則龍蛇遇不遇命也何必湛身哉乃作書往往托離騷文而反之自崏山投諸江流以弔屈原名曰反離騷見漢書揚雄傳初學記六有周氏之蟬嫣兮或鼻祖于汾隅靈宗初諜伯僑兮流于末之楊侯淑周楚之豐烈兮超既離呼皇波因江潭而往記兮欽弔楚之湘纍惟天軌之不辟兮何純潔而離紛紛纍以其淟涊兮暗纍以其繽紛漢十世之陽朔兮招搖紀于周正正皇天之清則兮度后土之方貞圖纍承彼洪族兮又覽纍之昌辭帶鉤矩而佩衡兮履欃槍以為綦素初貯厥麗服兮何文肆而質䪥資娵娃之珍髢兮鬻九戎而索賴鳳皇翔于蓬渚兮豈駕鵝之能捷騁驊騮以曲囏兮驢騾連蹇而齊足枳棘之榛榛兮猿貁擬而不敢下靈修既信椒蘭之唼佞兮吾纍忽焉而不蚤睹襟芰茄之緑衣兮被夫容之朱裳芳酷烈而莫聞兮不如襞而幽之離房閨中容競淖約兮相態以麗佳知衆嫭之嫉妒兮何必揚纍之蛾眉懿神龍之淵潛竣慶雲而將舉亡春風之被離兮孰焉知龍之所處愍吾纍之衆芬兮揚燁燁之芳苓遭季夏之凝霜兮慶夭悴而喪榮橫江湘以南往兮云走乎彼蒼吾馳江潭之泛溢兮將折衷呼重華舒中情之煩或兮恐重華之不纍與陵陽侯之素波兮豈吾纍之獨見許精瓊爢與秋菊兮將以延夫天年臨汨羅而自隕兮恐日薄于西山解扶桑之總轡兮縱令之遂奔馳鸞皇騰而不屬兮豈獨飛廉與雲師卷薛芷與若蕙兮臨湘淵而投之棍申椒與菌桂兮赴江湖而漚之費椒稰以要神兮又勤索彼瓊茅違靈氛而不從兮反湛身于江皋纍既夫傅說兮爰不信而遂行徒恐鷤䳏之將鳴兮顧先百草為不芳初纍棄彼虙妃兮更思瑤臺之逸女抨雄鴆以作媒兮何百離而曾不一耦乘雲霓之旖柅兮望昆侖以樛流覽四荒而顧懷兮奚必云女彼高丘既亡鸞車之幽藹兮駕八龍之委蛇臨江瀕而掩涕兮何有九招與九歌夫聖哲之遭兮固時命之所有雖增欷以於邑兮吾恐靈修之不纍改昔仲尼之去魯兮婓婓遲遲而周邁終回復于舊都兮何必湘淵與濤瀨溷漁父之餔啜兮潔沐浴之振衣棄由聃之所珍兮跖彭咸之所遺見漢書揚雄傳藝文類聚五十六廣騷旁離騷作重一篇名曰廣騷見漢書揚雄傳畔牢愁旁惜誦以下至懷沙一卷名曰畔牢愁見漢書揚雄傳上書諫勿許單于朝單于上書願朝哀帝以問公卿公卿以虛費府帑可且勿許單于使辭去未發雄上書諫見御覽八百十一引揚雄集臣聞六經之治貴于未亂兵家之勝貴于未戰二者皆微然而大事之本不可不察也今單于上書求朝國家不許而辭之臣愚以為漢與胸奴從此隙矣夫北地之狄五帝所不能臣三王所不能制其不可使隙甚明臣不敢遠稱請引秦以來明之以秦始皇之彊蒙恬之威帶甲四十餘萬然不敢窺西河乃築長城以界之會漢初興以高祖之威靈三十萬衆困于平城士或七日不食時奇譎之士石畫之臣甚衆卒其所以脫者世莫得而言也又高皇后嘗忿胸奴群臣庭議樊噲請以十萬衆橫行胸奴中季布曰噲可斬也妄阿順指旨于是大臣權書遺之然後胸奴之結解中國之憂平及孝文時胸奴侵暴北邊候騎至雍甘泉京師大駭發三將軍屯細柳棘門霸上以備之數月乃罷孝武即位設馬邑之權欲誘胸奴使韓安國將三十萬衆徼于便墬胸奴覺之而去徙費財勞師一虜不可得見況單于之面乎其後深惟社稷之計規恢萬載之策乃大興師數十萬使衛青霍去病操兵前後十餘年于是浮西河絶大幕破置顏襲王庭窮極其地追奔逐北封狼居胥山禪于姑衍以臨翰海虜名王貴人以百數自是之後胸奴震怖益求和親然而未肯稱臣也且夫前世豈樂傾無量之費役無罪之人快心于狼望之北哉以為不一勞者不久佚不暫費者不永寧是以忍百萬之師以摧餓虎之喙運府庫之財填盧山之壑而不悔也至本始之初胸奴有桀心欲掠烏孫侵公主乃發五將之師十五萬騎獵其南而長羅侯以烏孫五萬騎震其西皆至質而還時鮮有所獲徒奮揚威武明漢兵若雷風耳雖空行空反尚誅兩將軍故北狄不服中國未得高枕安寢也逮至元康神爵之閒大化神明鴻恩溥洽而胸奴內亂五單于爭立日逐呼韓邪攜國歸化扶伏稱臣然尚羈縻之計不顓制自此之後欲朝者不距不欲者不彊何者外國天性忿鷙形容魁健負力怙氣難化以善易隸以惡其彊難詘其和難得故未服之時勞師遠攻傾國殫貨伏尸流血破堅拔敵如彼之難也既服之後慰薦撫循交接賂遺威儀俯仰如此之備也往時嘗屠大宛之城踏烏桓之壘探姑繒之璧籍蕩姐之場艾朝鮮之旃拔兩越之旗近不過旬月之役遠不離二時之勞固已犁其庭掃其閭郡縣而置之雲徹席卷後無餘菑惟北狄為不然真中國之堅敵也三垂比之懸矣前世重之茲甚未易可輕也今單于歸義懷款誠之心欲離其庭陳見于前此乃上世之遺策神靈之所想望國家雖費不得已者也奈何距以來厭之辭疏以無日之期消往昔之恩開將來之隙夫款而隙之使有恨心負前言緣往辭歸怨于漢因以自絶終無北面之心威之不可諭之不能焉得不為大憂乎夫明者視于無形聰者聽于無聲誠先于未然即蒙恬樊噲不復施棘門細柳不復備馬邑之策安所設衛霍之功何得用五將之威安所震不然一有隙之後雖智者勞心于內辨者轂擊于外猶不若未然之時也且往者圖西域制車師置城郭都護三十六國費歲以大萬計者豈為康居烏孫能踰白龍堆而寇西邊哉乃以制胸奴也夫百年勞之一日失之費十而愛一臣竊為國不安也惟陛下少留意于未亂未戰以遏邊萌之禍見漢書胸奴傳書秦天子召還胸奴使者復報單于書而許之賜雄黃金十斤見御覽八百十一引揚雄集對詔問災異鼓妖聽失之象也朱博為人彊毅多權謀宜將不宜相恐有凶惡亟疾之怒見漢書五行志中答劉歆書雄叩頭賜命謹至又告以田儀事事窮竟白案顯出甚厚甚厚田儀與雄同鄉里幼稚為鄰長艾相更視覬動精采似不為非者故舉至日雄之任也不意淫迹暴于官朝令舉者懷赧而低眉任者含聲而宛舌知人之德堯猶病諸雄何慚焉叩頭叩頭又敕以殊言十五卷君何由知之謹歸誠底裏不敢違信雄少不師章句亦于五經之訓所不解嘗聞先代輶軒之使奏籍之書皆藏于周秦之室及其破也遺棄無見之者獨蜀人有嚴君平臨卭林閭翁孺者深好訓詁猶見輶軒之使所奏言翁孺與雄外家牽連之親又君平過誤有以私遇少而與雄也君平財有千言耳翁孺梗概之法略有翁孺往數歲死婦蜀郡掌氏子無子而去而雄始能草文先作縣邸銘玉佴頌階闥銘及成都城四隅銘蜀人有楊莊者為郎誦之于成帝成帝好之以為似相如雄遂以此得外見此數者皆都水君常見也故不復奏雄為郎之歲自奏少不得學而心好沈博絶麗之文願不受三歲之奉且休脫直事之繇得肆心廣意以自克就有詔可不奪奉令尚書賜筆墨錢六萬得觀書于石室如是後一歲作繡補靈節龍骨之銘詩三章成帝好之遂得盡意故天下上計孝廉及內郡衛會者雄常把三寸弱翰齎油素四尺以問其異語歸即以鉛摘次之于槧二十七歲于今矣而語言或交錯相反方覆論思詳悉集之燕其疑張伯松不好雄賦頌之文然亦有以奇之常為雄道言其父及其先君喜典訓屬雄以此篇目頗示其成者伯松曰是懸諸日月不刊之書也又言恐雄為太玄經由鼠坻之與牛場也如其用則實五稼飽邦民否則為抵糞棄之于道矣而雄般之伯松與雄獨何德慧而君與雄獨何譖隙而當匿乎哉其不勞戎馬高車令人君坐幃幕之中知絶遐異俗之語典流于昆嗣言列于漢籍誠雄心所絶極至精之所想遘也扶聖朝遠照之明使君求此如君之意誠雄散之之會死之日則今之榮也不敢有二不敢有愛少而不以行立子鄉里長而不以功顯于縣官著訓于帝籍但言詞博覽翰墨為事誠欲崇而就之不可以遺不可以怠即君必欲脅之以威陵之以武欲令入之于此此又未定未可以見今君又終之則縊死以從命也而可且寬假延期必不敢有愛雄之所為得使君輔貢于明朝則雄無恨何敢有匿唯執事圖之長監于規繡之就死以為小雄敢行之謹因還使雄叩頭叩頭見方言古文苑藝文類聚八十五與桓談書望風景附聲訓自結見文選任昉王文憲集序注答桓談書長卿賦不似從人閒來其神化所至邪大諦能讀千賦則能為之諺云伏習衆神巧者不過習者之門見楊慎赤牘清裁
