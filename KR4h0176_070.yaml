body:
  text: 楊雄難蓋天八事其一云日之東行循黃道晝中規牽牛距北極北百一十度東井距北極南七十度并百八十度周三徑一二十八宿周天當五百四十度今三百六十度何也其二曰春秋分之日正出在卯入在酉晝漏五十刻即天蓋轉夜當倍晝今夜亦五十刻何也其三曰日入而星見日出而不見即斗下見日六月不見日六月北斗亦當見六月不見六月今夜常見何也其四曰以蓋圖視天河起斗而東入狼弧閒曲如輪今視天河直如繩何也其五曰周天二十八宿以蓋圖視天星見者當少不見者當多今見與不見等何出入無冬夏而兩宿十四星當見不以日長短故見有多少何也其六曰天至高也地至卑也日託天而旋可謂至高矣縱人目可奪水與景不可奪也今從高山之上設水平以望日則日出水平下影上行何也若天體常高地體常卑日無出下之理于是蓋天無以對也其七曰視物近則大遠則小今日與北斗近我而小遠我而大何也其八曰視蓋橑與車輻閒近杠轂即密益遠益踈今北極為天杠轂二十八宿為天橑輻以星度度天南方次地星閒當數倍今交密何也見隋書天文志一又開元占經二解嘲哀帝時丁傅董賢用事諸附離之者或起家至二千石時雄方草太玄有以自守泊如也或嘲雄以玄尚白而雄解之號曰解嘲其辭曰客嘲揚子曰吾聞上世之士人綱人紀不生則已生則上尊人君下榮父母析人之圭儋人之爵懷人之符分人之祿紆青挓紫朱丹其轂今子幸得遭明盛之世處不諱之朝與群賢同行歷金門上玉堂有日矣曾不能畫一奇出一策上說人主下談公卿目如燿星舌如電光壹從壹衡論者莫當顧而作太玄五千文支葉扶疎獨說十餘萬言深者入黃泉高者出蒼天大者含元氣纖者入無倫然而位不過侍郎擢纔給事黃門意者玄得母尚白乎何為官之拓落也揚子笑而應之曰客徒欲朱丹吾轂不知一跌將赤吾之族也往者周罔解結群鹿爭逸離為十二合為六七四分五剖竝為戰國士亡常君國亡定臣得士者富失士者貧矯翼厲翮恣意所存故士或自盛以橐或鑿坏以遁是故騶衍以頡亢而取世資孟軻雖連蹇猶為萬乘師今大漢左東海右渠搜前番禺後陶塗東南一尉西北一侯徽以糾墨製以質鈇散以禮樂風以詩書曠以歲月結以倚廬天下之士雷動雲合魚鱗雜襲咸營于八區家家自以為稷契人人自以為咎繇戴縰垂纓而談者皆擬于阿衡五尺童子羞比晏嬰與夷吾當塗者入青雲失路者委溝渠旦握權則為卿相夕失勢則為匹夫譬若江湖之雀勃解之鳥乘雁集不為之多雙鳧飛不為之少昔三仁去而殷虛二老歸而周熾子胥死而吳亡種蠡存而粵伯五羖入而泰喜樂毅出而燕懼范睢以折擢而危穰侯蔡澤雖噤吟而笑唐舉故當其有事也非蕭曹子房平勃樊霍則不能安當其亡事也章句之徒相與坐而守之亦亡所患故世亂則聖哲馳騖而不足世治則庸夫高枕而有餘夫上世之士或解縛而相或釋褐而傅或倚夷門而笑或橫江潭而漁或七十說而不遇或立談間而封侯或枉千乘於陋巷或擁帚彗而先驅是以頗得信其舌奮其筆窒隙蹈瑕而無所詘也當今縣令不請士郡守不迎師群卿不揖客將相不俛眉言奇者見疑行殊者得辟是以欲談者宛舌而固聲欲行者擬足而投迹鄉使上世之士處虖今策非甲科行非孝廉舉非方正獨可抗疏時道是非高得待詔下觸聞罷又安得青紫且吾聞之炎炎者滅隆隆者絕觀雷觀火為盈為實天收其聲地藏其熱高明之家鬼瞰其室攫者亡默默者存位極者宗危自守者身全是故知玄知默守道之極爰清爰靜游神之廷惟寂惟寞守德之宅世異事變人道不殊彼我易時未知何如今子乃以鴟梟而笑鳳皇執蝘蜓而嘲龜龍不亦病乎子徒笑我玄之尚白吾亦笑子之病甚不遭臾跗扁鵲悲夫客曰然則靡玄無所成名乎范蔡以下何必玄哉揚子曰范睢魏之亡命也折脅拉髂免于徽索翕肩蹈背扶服入橐卬萬乘之主介涇陽抵穰侯而代之當也蔡澤山東之匹夫也顉頤折頞涕涶流沬西揖彊秦之相搤其咽炕其氣附其背而奪其位時也天下已定金革已平都于頟陽婁敬委輅脫輓掉三寸之舌建不拔之策舉中國徙之長安適也五帝垂典三王傳禮百世不易叔孫通起于枹鼓之間解甲投戈遂作君臣之儀得也甫刑靡敝秦法酷烈聖漢權制而蕭何造律宜也故有造蕭何律于唐虞之世則誖矣有作叔孫通儀於夏殷之時則惑矣有建婁敬之策于成周之世則繆矣有談范蔡之說于金張許史之閒則狂矣夫蕭規曹隨留侯畫策陳平出奇功若泰山嚮若阺隤唯其人之贍知哉亦會其時之可為也故為可為于可為之時則從為不可為于不可為之時則凶夫藺先生收功于章臺四皓采榮于南山公孫創業于金馬票騎發迹于祁連司馬長卿竊訾于卓氏東方朔割炙于細君僕誠不能與此數公者並故默然獨守吾太玄見漢書本傳文選蓺文類聚二十五解難雄以為經莫大于易故作太玄客有難玄太湥眾人之不好也雄解之號曰解難其辭曰客難揚子曰凡著書者為眾人之所好也美味期乎合口工聲調于比耳今吾子乃抗辭幽說閎意眇指獨馳騁于有亡之際而陶冶大罏旁薄群生歷覽者茲年矣而殊不寤亶費精神于此而煩學者于彼譬畫者畫于無形弦者放于無聲殆不可乎揚子曰俞若夫閎言崇議幽微之塗蓋難與覽者同也昔人有觀象于天視度于地察法于人者天麗且彌地普而湥昔人之辭迺玉迺金彼豈好為艱難哉勢不得已也獨不見翠虯絳螭之將登虖天必聳身于蒼梧之淵不階浮雲翼疾風虛舉而上升則不能撠膠葛騰九閎日月之經不千里則不能燭六合燿八絃泰山之高不嶕嶢則不能浡滃雲而散歊蒸是以宓犧氏之作易也緜絡天地經以八卦文王附六爻孔子錯其象而彖其辭然後發天地之臧定萬物之基典謨之篇雅頌之聲不溫純湥潤則不足以揚鴻烈而章緝熙蓋胥靡為宰寂寞為尸大味必淡大音必希大語叫叫大道低回是以聲之眇者不可同于眾人之耳形之美者不可混于世俗之目辭之衍者不可齊于庸人之聽今夫弦者高張急徽追趨逐耆則坐者不期而附矣試為之施咸池揄六莖發簫韶詠九成則莫有和也是故鍾期死伯牙絕絃破琴而不肯與眾鼓獿人亡則匠石輟斤而不敢妄斲師曠之調鍾竢知音者之在後也孔子作春秋幾君子之前睹也老聃有遺言貴知我者希此非其操與見梅鼎祚文紀蜀王本紀蜀之先稱王者有蠶叢柏濩魚鳧開明是時人萌椎髻左衽不曉文字未有禮樂從開明已上至蠶叢積三萬四千歲見文選蜀都賦劉注魏都賦注王長元三月三日曲水詩序注御覽一百六十六蜀王之先名蠶叢後代名曰柏濩後者名魚鳧此三代各數百歲皆神化不死其民亦頗隨王化去魚鳧田于湔山得仙今廟祀之于湔時蜀民稀少見御覽一百六十六又九百一十三後有一男子名曰杜宇從天墮止朱提有一女子名利從江源井中出為杜宇妻乃自立為蜀王號曰望帝治汶山下邑曰郫化民往往復出見文選思賦注御覽一百六十六又八百八十八望帝積百餘歲荊有一人名鼈靈其尸亡去荊人求之不得鼈靈尸隨江水上至郫遂活與望帝相見望帝以鼈靈為相時玉山出水若堯之洪水望帝不能治使鼈靈決玉山民得安處鼈靈治水去後望帝與其妻通慚媿自以德薄不如鼈靈乃委國授之而去如堯之禪舜鼈靈即位號曰開明帝帝生盧保亦號開明見後漢張衡傳注文選思賦注御覽八百八十八又九百二十三事類賦注六望帝去時子䳏鳴故蜀人悲子䳏鳴而思望帝望帝杜宇也後天墮見御覽九百二十三開明帝下至五代有開明尚始去帝號復稱王也見後漢張衡傳注天為蜀王生五丁力士能徙蜀山王无五丁輒立大石長三丈重千鈞號曰石牛千人不能動萬人不能移見埶文類聚七御覽八百八十八蜀王據有巴蜀之地本治廣都樊鄉徙居成都秦惠王遣張儀司馬錯定蜀因築成都而縣之成都在赤里街張若徙置少城內始造府縣寺舍今與長安同制見御覽八百八十八寰宇記七十二秦惠王時蜀王不降秦秦亦無道出于蜀蜀王從萬餘人東獵襃谷卒見秦惠王秦王以金一笥遺蜀王蜀王報以禮物禮物盡化為土秦王大怒臣下皆再拜賀曰土者地也秦當得蜀矣見御覽三十七又四百七十八又八百十一又八百七十二又八百八十八事類賦注九秦惠王本紀曰秦惠王欲伐蜀乃刻五石牛置金其後蜀人見之以為牛能大便金牛下有養卒以為此天牛也能便金蜀王以為然即發卒千人使五丁力士拖牛成道致三枚于成都秦道得通石牛之力也後遣丞相張儀等隨石牛道蜀焉見北堂書鈔一百十六埶文類聚九十四白帖九十六御覽三百五又八百八十八武都人有善知蜀王者將其妻女適蜀居蜀之後不習水土欲歸蜀王心愛其女留之乃作伊鳴之聲六曲以舞之見北堂書鈔一百六御覽八百八十八武都丈夫化為女子顏色美好蓋山之精也蜀王娶以為妻不習水土疾病欲歸蜀王留之無幾物故蜀王發卒之武都擔土于成都郭中葬之蓋地三畝高七丈號曰武擔以石作鏡一枚表其墓徑一丈高五尺見後漢書任文公傳注三國志蜀先主傳注北堂書鈔九十四又一百三十六初學記五埶文類聚六又七十開元占經一百十三御覽五十二又七百十七又八百八十八事類賦注七于是秦王知蜀王好色乃獻美女五人于蜀王蜀王愛之遺五丁迎女還至梓潼見一大虵入山穴中一丁引其尾不出五丁共引虵山乃崩壓五丁五丁踏地大呼秦王五女及迎送者皆上山化為石蜀王登臺望之不來因名五婦侯臺蜀王親埋作冢皆致萬石以誌其墓見初學記五埶文類聚七又九十六白帖五御覽五十二又三百八十六又八百八十八又九百三十四事類賦注二十八秦惠王遣張儀司馬錯伐蜀王開明拒戰不利退走武陽獲之見寰宇記七十二張儀伐蜀蜀王開明戰不勝為儀所滅見史記秦本紀索隱秦王誅蜀侯惲後迎葬咸陽天雨三月不通因葬成都蜀人求雨祠蜀侯必雨見御覽十一蜀王有鸚武舟見初學記二十五御覽一百三十七秦為太白船萬艘欲以攻楚見初學記二十五秦為舶舡萬艘欲攻楚見御覽七百六十九事類賦注十六秦襄王時宕渠郡獻長人長二十五丈六尺見法苑珠林八御覽三百七十七禹本汶山郡廣柔縣人生于石紐其地名痢兒畔禹母吞珠孕禹坼副而生于縣塗山娶妻生子名啟于今塗山有禹廟亦為其母立廟見史記夏本紀正義初學記九御覽八十三又五百三十一老子為關令尹喜著道德經臨別曰子行道千日後于成都青羊肆尋吾今為青年觀是也見御覽一百九十一寰宇記七十二江水為害蜀守李冰作石犀五枚二枚在府中一枚在市橋下二枚在水中以厭水精因曰石犀里也見北堂書鈔三十九埶文類聚九十五御覽八百九十李冰以秦為蜀守謂汶山為天彭闕號曰天彭門云亡者悉過其中鬼神精靈數見見寰宇記七十三湔氐道縣前有兩石對如闕號曰彭門見續漢郡國志補注宣帝地節中始穿鹽井數十所見御覽八百六十五趙充國頌明靈惟宣戎有先零先零昌狂侵漢西疆漢命虎臣惟后將軍整我六師是討是震既臨其域諭以威德有守矜功謂之弗克請奮其旅于罕之羌天子命我從之鮮陽營平守節婁奏封章料敵制勝威謀靡亢遂克西戎還師於京鬼方賓服罔有不庭昔周之宣有方有虎詩人歌功乃列于雅在漢中興充國作武赳赳桓桓亦紹厥後見漢書趙充國傳文選藝文類聚五十九劇秦美新諸吏中散大夫臣雄稽首再拜上封事皇帝陛下臣雄經術淺薄行能無異數蒙渥恩拔擢倫比與群賢竝媿無以稱職臣伏惟陛下以至聖之德龍興登庸欽明尚古作民父母為天下主執粹清之道鏡照四海聽聆風俗博覽廣包參天貳地兼竝神明配五帝冠三王開闢以來未之聞也臣誠樂昭著新德光之罔極往時司馬相如作封禪一篇以彰漢氏之休臣常有顛眴病恐一旦先犬馬填溝壑所懷不章長恨黃泉敢竭肝膽寫腹心作劇秦美新一篇雖未究萬分之一亦臣之極思也臣雄稽首再拜以聞曰權輿天地未袪雎雎盱盱或玄而萌或黃而牙玄黃剖判上下相嘔爰初生民帝王始存在乎混混茫茫之時舋聞罕漫而不昭察世莫得而云也厥有云者上罔顯于羲皇中莫盛于唐虞邇靡著于成周仲尼不遭用春秋因斯發言神明所祚兆民所託罔不云道德仁義禮智獨秦崛起西戎邠荒岐雍之疆因襄文宣靈之僭迹立基孝公茂惠文奮昭莊至政破縱擅衡并吞六國遂稱乎始皇盛從鞅儀韋斯之邪政馳騖起翦恬賁之用兵剗滅古文刮語燒書弛禮崩樂塗民耳目遂欲流唐漂虞滌殷蕩周㸐除仲尼之篇籍自勒功業改制度軌量咸稽之于秦紀是以耆儒碩老抱其書而遠遜禮官博士卷其舌而不談來儀之鳥肉角之獸狙獷而不臻甘露嘉醴景曜浸潭之瑞潛大茀經霣巨狄鬼信之妖發神歇靈繹海水群飛二世而亡何其劇與帝王之道兢兢乎不可離已夫能貞而明之者窮祥瑞回而昧之者極妖愆上覽古在昔有憑應而尚缺焉壤徹而能全故若古者稱堯舜威侮者陷桀紂況盡汛掃前聖千載功業專用已之私而能享祜者哉會漢祖龍騰豊沛奮迅宛葉自武關與項羽戮力咸陽創業蜀漢發迹三秦剋項山東而帝天下擿秦政慘酷尤煩者應時而蠲如儒林刑辟厤紀圖典之用稍增焉秦餘制度項氏爵號雖違古而猶襲之是以帝典闕而不補王綱弛而未張道極數殫闇忽不還逮至大新受命上帝還資后土顧懷玄符靈契黃瑞涌出滭浡沕潏川流海渟雲動風偃霧集雨散誕彌八圻上陳天庭震聲日景炎光飛響盈塞天淵之閒必有不可辭讓云爾于是乃奉若天命窮寵極崇與天剖神符地合靈契創億兆規萬世奇偉倜儻詭譎天祭地事其異物殊怪存乎五威將帥班乎天下者四十有八章登假皇穹鋪衍下土非新家其疇離之卓哉煌煌真天子之表也若夫白鳩丹烏素魚斷蛇方斯薎矣受命甚易格來甚勤昔帝纘皇王纘帝隨前踵古或無為而治或損益而亡豈知新室委心積意儲思垂務旁作穆穆明旦不寐勤勤懇懇者非秦之為與夫不勤勤則前人不當不懇懇則覺德不愷是以發秘府覽書林遙集乎文雅之囿翱翔乎禮樂之場胤殷周之失業紹唐虞之絕風懿律嘉量金科玉條神卦靈兆古文畢發煥炳照曜靡不宣臻式軡軒旂旗以示之揚和鸞肆夏以節之施黼黻袞冕以昭之正嫁娶送終以尊之親九族淑賢以穆之夫改定神祗上儀也欽脩百祀咸秩也明堂雍臺壯觀也九廟長壽極孝也制成六經洪業也北懷單于廣德也若復五爵度三壤經井田免人役匡馬法恢崇祗庸爍德懿和之風廣彼搢紳講習言諫箴誦之塗振鷺之聲充庭鴻鸞之黨漸階俾前聖之緒布濩流衍而不韞韣郁郁乎煥哉天人之事盛矣鬼神之望允塞群公先正莫不夷儀姦宄寇賊罔不振威紹少典之苗著黃虞之裔帝典闕者已補王綱弛者已張炳炳麟麟豈不懿哉厥被風濡化者京師沈潛甸內市洽侯衛厲揭要荒濯沐而術前典巡四民迄四嶽增封泰山禪梁父斯受命者之典業也蓋受命日不暇給或不受命然猶有事矣況堂堂有新正丁厥時崇嶽渟海通瀆之神咸設壇場望受命之臻焉海外遐方信延頸企踵回面內嚮喁喁如也帝者雖勤惡可以已乎宜命賢哲作帝典一篇奮三為一襲以示來人摛之罔極令萬世常戴巍巍履栗栗臭馨香含甘實鏡純粹之至精耹清和之正聲則百工伊凝庶績咸喜荷天衢提地釐斯天下之上則已庶可試哉見文選蓺文類聚十連珠臣聞明君取士貴拔眾之所遺忠臣薦善不廢格而所排是以巖穴無隱而側陋章顯也蓺文類聚五十七臣聞天下有三樂有三憂焉陰陽和調四時不忒年豐物遂無有夭折災害不生兵戎不作天下之樂也聖明在上祿不遺賢罰不偏罪君子小人各處其位眾人之樂也吏不苟暴役賦不重財力不傷安土樂業民之樂也亂則反焉故有三憂御覽四百六十八又四百六十九兼聽獨斷聖王之法也文選干寶晉紀總論注古之人主所以統天者不遠焉見文選陸機五等論注
