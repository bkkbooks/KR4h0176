body:
  text: 李尋對詔問災異陛下聖德尊天敬地畏命重民悼懼變異不忘疏賤之臣幸使重臣臨問愚臣不足以奉明詔竊見陛下新即位開大明除忌諱博廷名士靡不竝進臣尋位卑術淺過隨衆賢待詔食太官衣御府久汙玉堂之署比得召見亡以自效復特見廷問至誠自以逢不世出之命願竭愚心不敢有所避庶幾萬分有一可采唯棄須臾之閒宿留瞽言考之文理稽之五經揆之聖意以參天心夫變異之來各應象而至臣謹條陳所聞易曰縣象著明莫大乎日月夫日者衆陽之長輝光所燭萬里同晷人君之表也故日將旦清風發群陰伏君以臨朝不牽於色日初出炎以陽君登朝佞不行忠直進不蔽障日中輝光君德盛明大臣奉公日將入專以一君就房有常節君不修道則日失其度暗晦亡光各有云為其于東方作日初出時陰雲邪氣起者法為牽于女謁有所畏難日出後為近臣亂政日中為大臣欺誣日且入為妻妾役使所營閒者日尤不精光明侵奪失色邪氣珥霓數作本起于晨相連至昏其日出後至日中閒差愈小臣不知內事竊以日視陛下志操衰于始初多矣其咎恐有以守正直言而得罪者傷嗣害世不可不慎也唯陛下執乾剛之德彊志守度毋聽女謁邪臣之態諸保阿乳母甘言悲辭之託斷而勿聽勉強大誼絶小不忍良有不得已可賜以財貨不可私以官位誠皇天之禁也日失其光則星辰放流陽不能制陰陰桀得作閒者太白正晝經天宜降得克躬以執不軌臣聞月者衆陰之長消息見伏百里為品千里立表萬里連紀妃后大臣諸侯之象也朔晦正終始弦為繩墨望成君德春夏南秋冬北閒者月數以春夏與日同道過軒轅上后受氣入太微帝廷揚光輝犯上將近臣列星皆失色厭厭如滅此為母后與政亂朝陰陽俱傷兩不相便外臣不知朝事竊信天文即如此近臣已不足杖矣屋大柱小可為寒心唯陛下親求賢士無彊所惡以崇社稷尊彊本朝臣聞五星者五行之精五帝司命應王者號令為之節度歲星主歲事為統首號令所紀今失度而盛此君指意欲有所為未得其節也又填星不避歲星者后帝共政相留於奎婁當以義斷之熒惑往來亡常周歷兩宮作態低卬入天門上明堂貫尾亂宮太白發越犯庫兵寇之應也貫黃龍入帝庭當門而出隨熒惑入天門至房而分欲與熒惑為患不敢當明堂之精此陛下神靈故禍亂不成也熒惑厥弛佞巧依勢微言毀譽進類蔽善太白出端門臣有不臣者火入室金上堂不以時解其憂凶填歲相守又主內亂宜察蕭牆之內毋忽親疏之微誅放佞人防絶萌牙以蕩滌濁濊消散積惡毋使得成禍亂辰星主正四時當效于四仲四時失序則星辰作異今出于歲首之孟天所以譴告陛下也政急則出蚤政緩則出晚政絶不行則伏不見而為彗茀四孟皆出為易王命四季皆出星家所諱今幸獨出寅孟之月蓋皇天所以篤右陛下也宜深自改治國故不可以戚戚欲速則不達經曰三載考績三考黜陟加以號令不順四時既往不咎來事之師也閒者春三月治大獄時賊陰立逆恐歲小收季夏舉兵法時寒氣應恐後有霜雹之災秋月行封爵其月土濕奧恐後有雷雹之變夫以喜怒賞罰而不顧時禁雖有堯舜之心猶不能致和善言天者必有效於人設上農夫而欲冬田肉袒深耕汗出種之然猶不生者非人心不至天時不得也易曰時止則止時行則行動靜不失其時其道光明書曰敬授民時故古之王者尊天地重陰陽敬四時嚴月令順之以善政則和氣可立致猶枹鼓之相應也今朝廷忽于時月之令諸侍中尚書近臣宜皆令通知月令之意設群下請事若陛下出令有謬于時者當知爭之以順時氣臣聞五行以水為本其星玄武婺女天地所紀終始所生水為準平王道公正修明則百川理落脈通偏黨失綱則踊溢為敗書云水曰潤下陰動而卑不失其道天下有道則河出圖洛出書故河洛決溢所為最大今汝穎畎澮皆川水漂踊與雨水竝為民害此詩所謂燁燁震電不寧不令百川沸騰者也其咎在于是皇甫卿士之屬唯陛下留意詩人之言少抑外親大臣臣聞地道柔靜陰之常義也地有上中下其上位震應妃后不順中位應大臣作亂下位應庶民離畔震或于其國國君之咎也四方中央連國歷州俱動者其異最大閒者關東地數震五星作異亦未大逆宜務崇陽抑陰以救其咎固志建威閉絶私路拔進英雋退不任職以彊本朝夫本彊則精神折衝本弱則招殃致凶為邪謀所陵聞往者淮南王作謀之時其所難者獨有汲黯以為公孫弘等不足言也弘漢之名相于今亡比而尚見輕何況亡弘之屬乎故曰朝廷亡人則為賊亂所輕其道自然也天下未聞陛下奇策固守之臣也語曰何以知朝廷之衰人人自賢不務於通人故世陵夷馬不伏歷不可以趨道士不素養不可以重國詩曰濟濟多士文王以寧孔子曰十室之邑必有忠信非虛言也陛下秉四海之衆曾亡柱幹之固守聞于四境殆開之不廣取之不明勸之不篤傳曰士之美者善養禾君之明者善養士中人皆可使為君子詔書進賢良赦小過無求備以博聚英俊如近世貢禹以言事忠切蒙尊榮當此之時士厲身立名者多禹死之後日日以衰及京兆尹王章坐言事誅滅智者結舌邪僞並興外戚顓命君臣隔塞至絶繼嗣女宮作亂此行事之敗誠可畏而悲也本在積任母后之家非一日之漸往者不可及來者猶可追也先帝大聖深見天意昭然使陛下奉承天統欲矯正之也宜少抑外親選練左右舉有德行道術通明之士充備天官然後可以輔聖德保帝位承大宗下至郎吏從官行能亡以異又不通一藝及博士無文雅者宜皆使就南畝以視天下明朝廷皆賢材君子於以重朝尊君滅凶致安此其本也臣自知所言害身不辟死亡之誅唯財留神反覆覆愚臣之言見漢書李尋傳又對問災異洪範所謂鼓妖者也師法以為人君不聰為衆所惑空名得進則有聲無形不知所從生其傳曰歲月日之中則正卿受之今以四月日加辰巳有異是為中焉正卿謂執政大臣也宜退丞相御史以應天變然雖不退不出期年其人自蒙其咎見漢書五行志中之下塞河議陰氣盛則水為之長故一日之閒晝減夜增江河滿溢所謂水不潤下雖常于卑下之地猶日月變見於朔望明天道有因而作也衆庶見王延世蒙重賞競言便巧不可用議者常欲求索九河故迹而穿之今因其自決可且勿塞以觀水勢河欲居之當稍自成川跳出沙土然後順天心而圖之必有成功而用財力寡見漢書溝洫志奏記翟方進應變之權君侯所自明往者數白三光垂象變動見端山川水泉反理視患民人訛謠斥事感名三者既效可為寒心今提揚眉矢貫中狼奮角弓且張金歷庫土逆度輔湛沒火守舍萬歲之期近慎朝暮上無惻怛濟世之功下無推讓避賢之效欲當大位為具臣以全身難矣大責日加安得但保斥逐之勠闔府三百餘人唯君侯擇其中與盡節轉凶見漢書翟方進傳說王根書云天聰明蓋言紫宮極樞通位帝紀太微四門廣開大道五經六緯尊術顯士翼張舒布燭臨四海少微處士為比為輔故次帝廷女宮在後聖人承天賢賢易色取法于此天官上相上將皆顓面正朝憂責甚重要在得人得人之效成敗之機不可不勉也昔秦穆公說諓諓之言任仡仡之勇身受大辱社稷幾亡悔過自責思惟黃髮任用百里奚卒伯西域德列王道二者禍福如此可不慎哉夫士者國家之大寶功名之本也將軍一門九侯二十朱輪漢興以來臣子貴盛未嘗至此夫物盛必衰自然之理唯有賢友彊輔庶幾可以保身命全子孫安國家書曰曆象日月星辰此言仰視天文俯察地理觀日月消息候星辰行伍揆山川變動參民人繇俗以制法度考禍福舉錯悖逆咎敗將至徵兆為之先見明君恐懼修正側身博問轉禍為福不可救者即蓄備以待之故社稷亡憂竊見往者赤黃四塞地氣大發動土竭民天下擾亂之徵也彗星爭明庶雄為桀大寇之引也此二者已頗效矣城中訛言大水奔走上城朝廷驚駭女孽入宮此獨未效閒者重以水泉涌溢旁宮闕仍出月太白入東井犯積水缺天淵日數湛于極陽之色羽氣乘宮起風積雲又錯以山崩地動河不用其道盛冬雷電潛龍為孽繼以隕星流彗維填上見日蝕有背鄉此亦高下易居洪水之徵也不憂不改洪水乃欲蕩滌流彗乃欲掃除改之則有年亡期故屬者頗有變改小貶邪猾日月光精時雨氣應此皇天右漢亡已也何況致大改之宜急博求幽隱拔擢天士任以大職諸闒茸佞讇抱虛求進及用殘賊酷虐聞者若此之徒皆嫉善憎忠壞天文敗地理涌躍邪陰湛溺太陽為主結怨于民宜以時廢退不當得居位誠必行之凶災銷滅子孫之福不旋日而至政治感陰陽猶鐵炭之低卬見效可信者也及諸蓄水連泉務通利之修舊隄防省池澤稅以助損陰邪之盛案行事考變易訛言之效未嘗不至請徵韓放掾周敞王望可與圖之見漢書李尋傳奏約束梁王立立一日至十一犯法臣下愁苦莫敢親近不可諫止願令王非耕祠法駕毋得出宮盡出馬置外苑收兵杖藏私府毋得以金錢財物假賜人見漢書梁懷王揖傳上書求退三公鼎足承君一足不任則覆亂美實臣資性淺薄年齒老眊數伏疾病昏亂遺忘願上大司空長平侯印綬乞骸骨歸鄉里俟置溝壑見漢書彭宣傳劾奏朱博趙玄傅晏博宰相玄上卿晏以外親封位特進股肱大臣上所信任不思竭誠奉公務廣恩化為百寮先皆知喜武前已蒙恩詔決事更三赦博執左道虧損上恩以結信貴戚背君鄉臣傾亂政治姦人之雄附下罔上為臣不忠不道玄知博所言非法枉義附從大不敬晏與博議免喜失禮不敬臣請詔謁者召博玄晏詣廷尉詔獄見漢書朱博傳毀廟議繼祖宗以下五廟而迭毀後雖有賢君猶不得與祖宗並列子孫雖欲褒大顯揚而立之鬼神不饗也孝武皇帝雖有功烈親盡宜毀見漢書韋玄成傳諫封傅商孝成皇帝封親舅五侯天為赤黃晝昏日中有黑氣今祖母從昆弟二人已侯孔鄉侯皇后父高武侯以三公封尚有因緣今無故欲復封商壞亂制度逆天人心非傅氏之福也臣聞師曰逆陽者厥極弱逆陰者厥極凶短折犯人者有亂亡之患犯神者有疾夭之禍故周公著戒曰惟王不知艱難唯耽樂是從時亦罔有克壽故衰世之君夭折蚤沒此皆犯陰之害也臣願以身命當國咎見漢書鄭崇傳上書諫成帝臣聞王者承天繼宗統極保業延祚莫急胤嗣故易有幹蠱之義詩詠衆多之福今陛下聖嗣未立天下屬望而不惟社稷之計專念微行之事愛幸用於所惑曲意留于非正竊聞後宮皇子産而不育臣聞之怛然痛心傷剝竊懷憂國不忘須臾夫警衛不修則患生非常忽有醉酒狂夫分爭道路既無尊嚴之儀豈識上下之別此為胡狄起于轂下而賊亂發于左右也願陛下念天下之至重憂金玉之身均九女之施存無窮之福天下幸甚見後漢獨行譙玄傳署都亭下故侍中王林卿坐殺人埋冢舍使奴剝寺門鼓見漢書何竝傳臨潁川敕吏捕鍾威趙季李款三人非負太守乃負王法不得不治鍾威所犯多在赦前驅使入函谷關勿令汙民閒不入關乃收之趙李桀惡雖遠去當得其頭以謝百姓見漢書何竝傳先令書告子恢吾生素餐日久死雖當得法賻勿受葬為小槨亶容下棺見漢書何竝傳皇太子謝為所生立後議春秋不以父命廢王父命為人後之禮不得顧私親不當謝見漢書孝元傅昭儀傳移書梁傅相中尉王背策戒悖暴妄行連犯大辟毒流吏民比比蒙恩不復重誅不思改過復賊殺人幸得蒙恩丞相長史大鴻臚丞即問王陽病抵讕致辭驕嫚不守主令與背畔亡異丞相御史請收王璽綬送陳留獄明詔加恩復遣廷尉大鴻臚雜問今王當受詔置辭恐復不首實對書曰至于再三有不用我降爾命傅相中尉皆以輔正為職虎兕出于柙龜玉毀于櫝中是誰之過也書到明以誼曉王敢復懷詐罪過益深傅相以下不能輔導有正法見漢書梁懷王揖附傳戒子孫為人議法當依于輕雖有百金之利慎無與人重比見後漢陳寵傳教忠孝愛敬天下之至行也神中五徵帝王之要道也見華陽國志十下
