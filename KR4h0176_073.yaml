body:
  text: 解光奏劾王根王況曲陽侯根宗重身尊三世據權五將秉政天下輻湊自效根行貪邪臧纍巨萬縱橫恣意大治室第第中起土山立兩市殿上赤墀戶青瑣遊觀射獵使奴從者被甲持弓弩陳為步兵止宿離宮水衡共張發民治道百姓苦其役內懷姦邪欲管朝政推親近吏主簿張業以為尚書蔽上壅下內塞王路外交藩臣驕奢僭上壞亂制度案根骨肉至親社稷大臣先帝棄天下根不悲哀思慕山陵未成公聘取故掖庭女樂五官殷嚴王飛君等置酒歌舞捐忘先帝厚恩背臣子義及根兄子成都侯況幸得以外親繼父為列侯侍中不思報厚恩亦聘取故掖庭貴人以為妻皆無人臣禮大不敬不道見漢書元后傳奏劾趙皇后姊娣臣聞許美人及故中宮史曹宮皆御幸孝成皇帝産子子隱不見臣遣從事掾業史望驗問知狀者掖庭獄丞籍武故中黃門王舜吳恭靳嚴官婢曹曉道房張棄故趙昭儀御者于客子王偏臧兼等皆曰宮即曉子女前屬中宮為學事史通詩授皇后房與宮對食元延元年中宮語房曰陛下幸宮後數月曉入殿中見宮腹大問宮宮曰御幸有身其十月中宮乳掖庭牛官令舍有婢六人中黃門田客持詔記盛緑綈方底封御史中丞印豫武曰取牛官令舍婦人新産兒婢六人盡置暴室獄毋問兒男女誰兒也武迎置獄宮曰善臧我兒胞丞知是何等兒也後三日客持詔記與武問兒死未手書對牘背武即書對兒見在未死有頃客出曰上與昭儀大怒奈何不殺武叩頭啼曰不殺兒自知當死殺之亦死即因客奏封事曰陛下未有繼嗣子無貴賤惟留意奏入客復持詔記豫武曰今夜漏上五刻持兒與舜會東交掖門武因問客陛下得武書意何如曰憆也武以兒付舜舜受詔內兒殿中為擇乳母告善養兒且有賞毋令漏泄舜擇棄為乳母時兒生八九日後三日客復持詔記封如前豫武中有封小緑篋記曰告武以篋中物書豫獄中婦人武自臨飲之武發篋中有裹藥二枚赫蹄書曰告偉能努力飲此藥不可復入女自知之偉能即宮宮讀書已曰果也欲姊弟擅天下我兒男也額上有壯髮類孝元皇帝今兒安在危殺之矣奈何令長信得聞之宮飲藥死後宮婢六人召入出語武曰昭儀言女無過寧自殺邪若外家也我曹言願自殺即自繆死武皆表奏狀棄所養兒十一日宮長李南以詔書取兒去不知所置許美人前在上林涿沐館數召入飾室中若舍一歲再三召留數月或半歲御幸元延二年褱子其十一月乳詔使嚴持乳醫及五種和藥丸三送美人所後客子偏兼聞昭儀謂成帝曰常紿我言從中宮來即從中宮來許美人兒何從生中許氏竟當復立邪懟以手自搗以頭擊壁戶柱從床上自投地啼泣不肯食曰今當安置我欲歸耳帝曰今故告之反怒為殊不可曉也帝亦不食昭儀曰陛下自知是不食為何陛下常自言約不負女今美人有子竟負約謂何帝曰約以趙氏故不立許氏使天下無出趙氏上者毋憂也後詔使嚴持緑囊書豫許美人告嚴曰美人當有以豫女受來置飾室中簾南美人以葦篋一合盛所生兒緘封及緑囊報書豫嚴嚴持篋書置飾室簾南去帝與昭儀坐使客子解篋緘未已帝使客子偏兼皆出自閉戶獨與昭儀坐須臾開戶呼客子偏兼使緘封篋及緑綈方底推置屏風東恭受詔持篋方底豫武皆封以御史中丞印曰告武篋中有死兒埋屏處勿令人知武穿獄樓垣下為坎埋其中故長定許貴人及故成都平阿侯家婢王業任孋公孫習前免為庶人詔召人屬昭儀為私婢成帝崩未幸梓宮倉卒悲哀之時昭儀自知罪惡大知業等故許氏王氏婢恐事泄而以大婢羊子等賜豫業等各且十人以慰其意屬無道我家過失元延二年五月故掖庭令吾丘遵謂武曰掖庭丞吏以下皆與昭儀合通無可與語者獨欲與武有所言我無子武有子是家輕族人得無不敢乎掖庭中御幸生子者輒死又飲藥傷墮者無數欲與武共言之大臣驃騎將軍貪耆錢不足計事奈何令長信得聞之遵後病困謂武今我已死前所語事武不能獨為也慎語皆在今年四月丙辰赦令前臣謹案永光三年男子忠等發長陵傅夫人冢事更大赦孝元皇帝下詔曰此朕不當所得赦也窮治盡伏辜天下以為當魯嚴公夫人殺世子齊桓召而誅焉春秋豫之趙昭儀傾亂聖朝親滅繼嗣家屬當伏天誅前平安剛侯夫人謁坐大逆同産當坐以蒙赦令歸故郡今昭儀所犯尤悖逆罪重于謁而同産親屬怕在尊貴之位迫近幃幄群下寒心非所以懲惡崇誼示四方也請事窮竟丞相以下議正法見漢書外戚下孝成趙皇后傳奏劾豫州牧鮑宣宣舉錯煩苛代二千石署吏聽訟所察過詔條行部乘傳去法駕駕一馬舍宿鄉亭為衆所非見漢書鮑宣傳辥況罪議況朝臣父故宰相再封列侯不相敕丞化而骨肉相疑疑咸受修言以謗毀宣咸所言皆宣行迹衆人所共見公家所宜聞況知咸給事中恐為司隸舉奏宣而公令明等迫切宮闕要遮創戮近臣於大道人衆中欲以鬲塞聰明杜絶論議之端桀黠無所畏忌萬衆歡譁流聞四方不與凡民忿怒爭鬭者同臣聞敬近臣為近主也禮下公門式路馬君畜産且猶敬之春秋之義意惡功遂不免于誅上浸之源不可長也況首為惡明手傷人功意俱惡皆大不敬明當以重論及況皆棄市見漢書嶭宣傳上疏詆公卿大臣方今丞相王嘉健而蓄縮不可用御史大夫賈延墮弱不任職左將軍公孫祿司隸鮑宣皆外有直項之名內實騃不曉政事諸曹以下僕遬不足數卒有彊弩圍城長戟指闕陛下誰與備之如使狂夫嘄呼于東崖胸奴飲馬于渭水邊境雷動四野風起京師雖有武蜂精兵未有能窺左足而先應者也軍書交馳而輻湊羽檄重迹而押至小夫懦臣之徒憒眊不知所為其有犬馬之決者仰藥而伏刃雖加夷滅之誅何益禍敗之至哉見漢書息夫躬傳上言開言渠秦開鄭國渠以富國彊兵今為京師土地肥饒可度地勢水泉廣溉灌之利見漢書息夫躬傳奏閒胸奴烏孫單于當以十一月入塞後以病為解疑有他變烏孫兩昆彌弱卑爰疐強盛居彊煌之地擁十萬之衆東結單于遣子往侍如因素彊之威循烏孫就屠之跡舉兵南伐并烏孫之勢也烏孫并則胸奴盛而西域危矣可令降胡詐為卑爰疐使者來上書曰所以遣子侍單于者非親信之也實畏之耳惟天子哀告單于歸臣侍子願助戊己校尉保惡都奴之界因下其章諸將軍令胸奴客聞焉則是所謂上兵伐謀其次伐交者也見漢書息夫躬傳建言厭應變異往年熒惑守心太白高而芒光又角星茀于河鼓其法為有兵亂是後訛言行詔籌經歷郡國天下騷動恐必有非常之變可遣大將軍行邊兵敕武備斬一郡守以立威震四夷因以厭應變異見漢書息夫躬傳奏尊傅太后丁后定陶共皇太后共皇后皆不宜復引定陶蕃國之名以冠大號車馬衣服宜皆稱皇之意置吏二千石以下各供厥職又宜為共皇立廟京師見漢書師丹傳改元易號議漢曆中衰當更受命成帝不應天命故絶嗣今陛下久疾變異屢數天所以譴告人也宜急改元易號乃得延年益壽皇子生災異息矣得道不得行咎殃且亡不有洪水將出災火且起滌蕩人民見漢書李尋傳奏治河三策治河有上中下策古者立國居民疆理土地必遺川澤之分度水勢所不及大川無防小水得入陂障卑下以為汙澤使秋水多得有所休息左右游波寬緩而不迫夫土之有川猶人之有口也治土而防其川猶止兒啼而塞其口豈不遽止然其死可立而待也故曰善為川者決之使道善為民者宣之使言蓋隄防之作近起戰國雍防百川各以自利齊與趙魏以河為竟趙魏瀕山齊地卑下作隄去河二十五里河水東抵齊隄則西泛趙魏趙亦為隄去河二十五里雖非其正水尚有所游蕩時至而去則填淤肥美民耕田之或久無害稍築室宅遂成聚落大水時至漂沒則更起隄防以自救稍去其城郭排水澤而居之湛溺自其宜也今隄防狹者去水數百步遠者數里近黎隄南故大金隄從河西西北行至西山南頭乃折東與東山相屬民居金隄東為廬舍往十餘歲更起隄從東山南頭直南與故大隄會又內黃界中有澤方數十里環之有隄往十餘歲太守以賦民民今起廬舍其中此臣親所見者也東郡白馬故大隄亦復數重民皆居其閒從黎陽北盡魏界故大隄去河遠者數十里內亦數重此皆前世所排也河從河內北至黎陽為石隄激使東抵東郡平剛又為石隄使西北抵黎陽觀下又為石隄使東北抵東郡津北又為石隄使西北抵魏郡昭陽又為石隄激使東北百餘里閒河再西三東迫厄如此不得安息今行上策徙冀州之民當水衝者決黎陽遮害亭放河使北入海河西薄大山東薄金隄勢不能遠泛濫期月自定難者將曰若如此敗壞城郭田廬冢墓以萬數百姓怨恨昔大禹治水山陵當路者毀之故鑿龍門辟伊闕析底柱破碣石墮斷天地之性此乃人功所造何足言也今瀕河十郡治隄歲費且萬萬及其大決所殘無數如出數年治河之費以業所徙之民遵古聖之法定山川之位使神人各處其所而不相奸且以大漢方制萬里豈其與水爭咫尺之地哉此功一立河定民安千載無患故謂之上策若乃多穿漕渠于冀州地使民得以溉田分殺水怒雖非聖人法然亦救敗術也難者將曰河水高於平地歲增隄防猶尚決溢不可以開渠臣竊案視遮害亭西十八里至淇水口乃有金隄高一丈自是東地稍下隄稍高至遮害亭高四五丈往五六歲河水大盛增丈七尺壞黎陽南郭門入至隄下水未踰隄二尺所從隄上北望河高出民屋百姓皆走上山水留十三日隄潰吏民塞之臣循隄上行視水勢南七十餘里至淇口水適至隄半計出地上五尺所今可從淇口以東為石隄多張水門初元中遮害亭下河去隄足數十步至今四十餘歲適至隄足繇是言之其地堅矣恐議者疑河大川難禁制滎陽漕渠足以卜之其水門但用木與土耳今據堅地作石隄勢必完安冀州渠首盡當卬此水門治渠非穿地也但為東方一隄北行三百餘里入漳水中其西因山足高地諸渠皆往往股引取之旱則開東方下水門溉冀州水則開西方高門分河流通渠有三利不通有三害民常罷于救水半失作業水行地上湊潤上徹民則病溼氣木皆立枯鹵不生穀決溢有敗為魚鱉食此三害也若有渠溉則鹽鹵下隰填淤加肥故種禾麥更為粳稻高田五倍下田十倍轉漕舟船之便此三利也今瀕河隄吏卒郡數千人代買薪石之費歲數千萬足以通渠成水門又民利其溉灌相率治渠雖勞不罷民田適治河隄亦成此誠富國安民興利除害支數百歲故謂之中策若乃繕完故隄增卑倍薄勞費無已數逢其害此最下策也見漢書溝洫志上書言便宜因冤訟陳湯延壽湯為聖漢揚鉤深致遠之威雪國家纍年之恥討絶域不羈之君係萬里難制之虜豈有比哉先帝嘉之仍下明詔宣著其功改年垂曆傳之無窮應是南郡獻白虎邊陲無警備會先帝寢疾然猶垂意不亡數使尚書責問丞相趣立其功獨丞相匡衡排而不豫封延壽湯數百戶此功臣戰士所以失望也孝成皇帝承建業之基乘征伐之威兵革不動國家無事而大臣傾邪讒佞在朝曾不深惟本末之難以防未然之戒欲專主威排妒有功使湯塊然被冤拘囚不能自明卒以無罪老棄敦煌正當西域通道令威名折衝之臣旋踵及身復為郅支遺虜所笑誠可悲也至今奉使外蠻者未嘗不陳郅支之誅以揚漢國之盛夫援人之功以懼敵棄人之身以快讒豈不痛哉且安不忘危盛必慮衰今國家素無文帝纍年節儉富饒之畜又無武帝薦延梟俊禽敵之臣獨有一陳湯耳假使異世不及陛下尚望國家追録其功封表其墓以勸後進也湯幸得身當聖世功曾未久反聽邪臣鞭逐斥遠使亡逃分竄死無處所遠覽之士莫不計度以為湯功纍世不可及而湯過人情所有湯尚如此雖復破絶筋骨暴露形骸猶復制於脣舌為嫉妒之臣所係虜耳此臣所以為國家戚戚也見後漢陳湯傳上疏請寬趙氏臣聞繼嗣失統廢適立庶聖人法禁古今至戒然太伯見曆知適逡循固讓委身吳粵權變所設不計常法致位王季以崇聖嗣卒有天下子孫承業七八百載功冠三王道德最備是以尊號追及大王故世必有非常之變然後乃有非常之謀孝成皇帝自知繼嗣不以時立念雖末有皇子萬歲之後未能持國權柄之重制于女主女主驕盛則耆欲無極少主幼弱則大臣不使世無周公抱負之輔恐危社稷傾亂天下知陛下有賢聖通明之德仁孝子愛之恩懷獨見之明內斷于身故廢後宮就館之漸絶微嗣禍亂之根乃欲致位陛下以安宗廟愚臣既不能深援安危定金匱之計又不知推演聖德述先帝之志乃反覆校省內暴露私燕誣汙先帝傾惑之過成結寵妾妒媚之誅甚失賢聖遠見之明逆負先帝憂國之意夫論大德不拘俗立大功不合衆此乃孝成皇帝至思所以萬萬于衆臣陛下聖德盛茂所以符合于皇天也豈當世庸庸斗筲之臣所能及哉且褒廣將順君父之美匡救銷滅既往之過古今通義也事不當時固爭防禍於未然各隨指阿從以求容媚晏駕之後尊號已定萬事已訖乃探追不及之事訐揚幽昧之過此臣所深痛也願下有司議即如臣言宜宣布天下使咸曉知先帝聖意所起不然空使謗議上及山陵下流後世遠聞百蠻近布海內甚非先帝託後之意也蓋孝子善述父之志善成人之事唯陛下省察見漢書外戚下孝成趙皇后傳上封事理王氏孝成皇帝深惟宗廟之重稱述陛下至德以承天序聖策深遠恩德至厚惟念先帝之意豈不欲以陛下自代奉承東宮哉太皇太后春秋七十數更憂傷敕令親屬引領以避丁傅行道之人為之隕涕況于陛下時登高遠望獨不慚於延陵乎見漢書元皇后傳災異對五侯封日天氣赤黃丁傅復然此殆爵土過制傷亂土氣之祥也見漢書五行志下之上王嘉罪議嘉言事前後相違無所執守不任宰相之職宜奪爵土免為庶人見漢書王嘉傳聖王斷獄必先原心定罪探意立情故死者不抱恨而入地生者不銜怨而受罪明主躬聖德重大臣刑辟廣延有司議欲使海內咸服嘉罪名雖應法聖王之于大臣在輿為下御坐則起疾病視之無數死則臨弔之廢宗廟之祭進之以禮退之以義誄之以行案嘉本以相等為罪罪惡雖著大臣括髮關械裸躬就笞非所以重國褒宗廟也今春月寒氣錯繆霜露數降宜示天下以寬和臣等不知大義唯陛下察焉見漢書王嘉傳報桓談若夫嚴子者絶聖棄智修生保真清虛淡泊歸之自然獨師友造化而不為世俗所役者也漁釣于一壑則萬物不奸其志栖遲于一丘則天下不易其樂不絓聖人之罔不嗅驕君之餌蕩然肆志談者不得而名焉故可貴也今吾子已貫仁誼之羈絆繫名聲之韁鎖伏周孔之軌躅馳顏閔之極摯既繫攣于世教矣何用大道為自眩曜昔有學步于邯鄲者曾未得其髣佛又復失其故步遂匍匐而歸耳恐似此類故不進見漢書敘傳飛燕外傳自序伶玄字子于潞水人學無不通知音善屬文簡率尚真朴無所矜式揚雄獨知之然雄貪名矯激子于謝不與交雄深慊毀之子于由司空小吏歷三署刺守州郡為淮南相人有風情哀帝時子于老休買妾樊通德通德嫕之弟子不周之子也有才色知書慕司馬遷史記頗能言趙飛燕姊弟故事子于間居命言厭厭不倦子于語通德曰斯人俱灰滅矣當時疲精力馳騖嗜欲蠱惑之事寧知終歸荒田野草乎通德占袖顧視燭影以手擁髻淒然泣下不勝其悲子于亦然通德奏子于曰夫淫于色非慧男子不至也慧則通通則流流而不得其防則百物變態為溝為壑無所不往焉禮義成敗之說不能止其流惟感之以盛衰奄忽之變可以防其壤今婢子所道趙后姊弟事盛之至也主君愴然有荒田野草之悲衰之至也婢子拊形屬影識夫盛之不可留衰之不可推俄然相緣奄忽雖婕妤聞此不少遣乎幸主君著其傳使婢子執研削道所記于是撰趙后別傳子于為河東都尉班躅為決曹得幸太守多所取受子于召躅數其罪而捽辱之躅從兄子彪續司馬史記絀子于無所收録見漢魏叢書飛燕外傳本
