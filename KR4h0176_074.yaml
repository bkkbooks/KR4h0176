body:
  text: 弘恭奏收蕭望之等望之堪更生朋黨相稱舉數譖訴大臣毀離親戚欲以專擅權勢為臣不忠誣上不道請謁者召致延尉見漢書蕭望之傳建白下蕭望之獄望之前為將軍輔政欲排退許史專權擅朝幸得不坐復賜爵邑與聞政事不悔過服罪深懷怨望教子上書歸非于上自以託師傅懷終不坐非頗詘望之于牢獄塞其怏怏心則聖朝亡以施恩厚見漢書蕭望之傳上書求贖父刑妾父為吏齊中稱其廉平今坐法當刑妾切痛死者不可復生而刑者不可復續雖欲改過自新其道莫由終不可得妾願入身為官婢以贖父刑使得改行自新也見史記倉公傳又見漢書刑法志上武帝書某所有公田願得假倩之見史記褚補滑稽傳司馬相如誄嗟嗟夫子兮亶通儒少好學兮綜群書縱橫劍伎兮英敏有譽尚慕往哲兮更名相如落魄遠游兮賦子虛畢爾壯志兮駟馬高車憶昔初好兮雍容孔都憐才仰德兮琴心兩娛永託為妃兮不恥當壚生平淺促兮命也難扶長夜思君兮形影孤步中庭兮霜草枯雁鳴哀哀兮吾將安如仰天太息兮抑鬱不舒訴此悽側兮疇忍聽豫泉穴可從兮願殞其軀見梅鼎祚文紀上昭帝書胸奴發騎田車師車師與胸奴為一共侵烏孫惟天子救之見漢書常惠傳又見西域傳下上宣帝書胸奴復連發大兵侵擊烏孫取車延惡師地收人民去使使謂烏孫趣持公主來欲隔絶漢昆彌願發國半精兵自給人馬五萬騎盡力擊胸奴唯天子出兵以救公主昆彌見漢書西域傳下又見常惠傳小異又上宣帝書年老土思願得歸骸骨葬漢地見漢書西域傳下上元帝書願使烏孫鎮撫星彌見漢書烏孫傳上哀帝書願還宣葬延陵見漢書嶭宣傳搜田誓無干車無自後射見周禮夏官注賈疏與路中大夫盟若反言漢已破矣齊趣下三國不且見屠見史記齊悼惠王世家又見漢書高五王傳上書言樊他廣不當代後荒侯市人病不能為人令其夫人與其弟亂而生他廣他廣實非荒侯子不當代後見史記樊噲傳又見漢書樊噲傳上書言祠太一古者天子三年一用太牢祠神三一天一地一太一見史記封禪書又見漢書郊祀志上上書言春解祠古者天子常以春解祠祠黃帝用一梟破鏡冥羊用羊祠馬行用一青牡馬太一澤山君地長用牛武夷君用乾魚陰陽使者以一牛見史記封禪書又見漢書郊祀志上上書言宜立昌邑王周太王廢太伯立王季文王舍伯邑考立武王唯在所宜雖廢長立少可也廣陵王不可以承宗廟見漢書霍光傳上書言霍氏大將軍時主弱臣彊專制擅權今其子孫用事昆弟益驕恣恐危宗廟災異數見盡為是也見漢書霍光傳為徐福上書臣聞客有過主人者見竈直堗傍有積薪客謂主人曰曲其堗遠其積薪不者將有火患主人默然不應居無幾何家果失火鄉聚里中人哀而救之火幸息于是殺牛置酒燔髮灼爛者在上行餘各用功次坐而反不録言曲堗者向使主人聽客之言不費牛酒終無火患今茂陵徐福數上書言霍氏且有變宜防絶之向使福說得行則無裂地出爵之費而國安平自如今往事既已而福獨不得與其功惟陛下察客徙薪曲堗之策而使居燔髮灼爛之右見說苑權謀臣聞客有過主人者見其竈直突傍有積薪客謂主人更為曲突遠徙其薪不者且有火患主人默然不應俄而家果失火鄰里共救之幸而得息于是殺牛置酒謝其鄰人灼爛者在于上行餘各以功次坐而不録言曲突者人謂主人曰鄉使聽客之言不費牛酒終無火患今論功而請賓曲突徙薪亡恩澤燋頭爛額為上客邪主人乃寤而請之今茂陵徐福數上書言霍氏且有變宜防絶之鄉使福說得行則國亡裂土出爵之費臣亡逆亂誅滅之敗往事既已而福獨不蒙其功唯陛下察之貴徙薪曲突之策使居焦髮灼爛之右見漢書霍光傳案此與說苑互有刪節而加詳故分載之上書言宜改幣古者以龜貝為貨今已錢易之民以故貧宜可改幣見漢書師丹傳請臘祀社稷令縣常以春三月及時臘祀祠稷以羊豕民里社各自材以祠見史記封禪書又見漢書郊祀志上固請建太子古者殷周有國治安皆千餘歲古之有天下者莫不長焉用此道也立嗣必子所從來遠矣高帝親率士大夫始平天下建諸侯為帝者太祖諸侯王及列侯始受國者皆亦為其國祖子孫繼嗣世世弗絶天下之大義也故高帝設之以撫海內今釋宜建而更選于諸侯及宗室非高帝之志也更議不宜子啓最長純厚慈仁請建以為太子見史記文紀又見漢書文紀奏請立栗姬為皇后子以母貴母以子貴今太子母無號宜立為皇后見史記外戚世家奏議不舉孝廉者罪古者諸侯貢士一適謂之好德再適謂之賢賢三適謂之有功乃加九錫不貢士一則黜爵再則黜地三而黜爵地畢矣附下罔上者死附上罔下者刑與聞國政而無益于民者斥在上位而不能進賢者退此所以勸善黜惡也今詔書昭先帝聖緒令二千石舉孝廉所以化元元移風易俗也不舉孝不奉詔當以不敬論不察廉不勝任也當免見漢書武帝紀請造白金皮幣關東貧民徙隴西北地西河上郡會稽凡七十二萬五千口縣官衣食振業用度不足請收銀錫造白金及皮幣以足用見漢書武紀古者皮幣諸侯以聘享金有三等黃金為上白金為中赤金為下今半兩錢法重四銖而姦或盜摩錢裏取鎔錢益輕薄而物貴則遠方用幣煩費不省見史記平準書請算軺書賈人緡錢郡國頗被菑害貧民無産業者募徙廣饒之地陛下損膳省用出禁錢以振元元寬貸賦而民不齊出於南畝商賈滋衆貧者畜積無有皆仰縣官異時算軺車賈人緡錢皆有差請算如故諸賈人末作貰貸買居邑稽諸物及商以取利者雖無市籍各以其物自占率緡錢二千而一算諸作有租及鑄率緡錢四千一算非吏比者三老北邊騎士軺車以一算商賈人軺車二算船五丈以上一算匿不自占占不悉戍邊一歲沒入緡錢有能告者以其半畀之賈人有市籍者及其家屬皆無得籍名田以便農敢犯令者沒入田僮見史記平準書見漢書食貨志下奏故太子諡號園邑禮為人後者為之子也故降其父母不得祭尊祖之義也陛下為孝昭帝後承祖宗之祀制禮不踰間謹行視孝昭帝所為故皇太子起位在湖史良娣冢在博望苑北親史皇孫位在廣明郭北諡法曰諡者行之迹也愚以為親諡宜曰悼母曰悼后比諸侯王園置奉邑三百家故皇太子諡曰戾置奉邑二百家史良娣曰戾夫人置守冢三十家園置長丞周衛奉守如法以湖閿鄉邪里聚為戾園長安白亭東為戾后園廣明成鄉為悼園皆改葬焉見漢書武書五子傳復言悼園戾園號邑禮父為士子為天子祭以天子悼園宜稱尊號曰皇考立廟因園為寢以時薦享焉益奉園民滿千六百家以為奉明縣尊戾夫人曰戾后置園奉邑及益戾園各滿三百家見漢書武五子傳奏菑川王終古淫亂事終古使所愛奴與八子及諸御婢姦終古或參與被席或白晝使裸伏犬馬交接終古親臨視産子輒曰亂不可知使去其子見漢書齊悼惠王傳奏逮捕菑川王終古終古位諸侯王以令置八子秩比六百石所以廣嗣重祖也而終古禽獸行亂君臣夫婦之別悖逆人倫請逮捕見漢書齊悼惠王傳劾奏王尊尊妄詆歁非謗赦前事猥歷奏大臣無正法飾成小過以涂污宰相摧辱公卿輕薄國家奉使不敬見漢書王尊傳劾奏王章章知野王前以王舅出補吏而私薦之欲令在朝阿附諸侯又知張美人體御至尊而妄稱引羌胡殺子蕩腸非所宜言見漢書元后傳奏改徙陳湯湯前親誅郅支單于威行外國不宜近邊塞見漢書陳湯傳劾奏申咸炔欽咸欽幸得以儒官選擢備腹心上所折中定疑知丹社稷重臣議罪處罰國之所慎咸欽初傅經義以為當治事以暴列乃復上書妄稱譽丹前後相違不敬見漢書師丹傳奏遣王莽王仁就國新都侯莽前為大司馬貶抑尊號之議虧損孝道及平阿侯仁臧匿趙昭儀親屬皆就國見漢書元后傳劾奏王嘉嘉言事恣意迷國罔上不道見漢書兩龔傳奏劾龔勝夏侯常勝吏二千石常位大夫皆幸得給事中與論議不崇禮儀而居公門下相非恨疾言辨訟媠謾亡狀皆不敬見漢書王嘉傳奏天陰雨人之病為之先動是陰相應而起也天將陰雨又使人睡臥者陰氣也見御覽十引漢名臣奏漢得陰山胸奴長老過之未嘗不哭見藝文類聚七御覽四百八十七引漢名臣奏燕王定國罪議定國禽獸行亂人倫逆天道當誅見史記荊燕世家又見漢書燕澤傳江都王建罪議建失臣子道積久輒蒙不忍遂謀反逆所行無道雖桀紂惡不至于此天誅當不赦當以謀反法誅見漢書景十三王傳尊寶鼎議聞昔泰帝興神鼎一一者一統天地萬物所繫象也黃帝作寶鼎三象天地人禹收九牧之金鑄九鼎象九州皆嘗鬺享上帝鬼神其空足曰鬲以象三德饗承天祜夏德衰鼎遷于殷殷德衰鼎遷於周周德衰鼎遷於秦秦德衰宋之社亡鼎乃淪伏而不見周頌曰自堂徂基自羊徂牛鼐鼎及鼒不吳不敖胡考之休今鼎至甘泉以光潤龍變承休無疆合茲中山有黃白雲降蓋若獸為符路弓乘矢集獲壇下報祠大亨唯受命而帝者心知其意而合德焉鼎宜視宗禰廟臧于帝庭以合明應見漢書郊祀志上又見史記封禪書稍有刪節廣川王去罪議去悖虐聽后昭信讒言燔燒亨煮生割剝人距師之諫殺其父子凡殺無辜十六人至一家母子三人逆節絶理其十五人在赦前大惡仍重當伏顯戮以示衆見漢書景十三王傳韓昌張猛盟胸奴議單于保塞為藩雖欲北去猶不能為危害昌猛擅以漢國世世子孫與夷狄詛盟令單于得以惡言上告于天羞國家傷威重不可得行宜遣使往告祠天與解盟昌猛奉使無狀罪至不道見漢書胸奴傳下諸寢園祀議清廟之詩言交神之禮無不清靜今衣冠出游有車騎之象風雨之氣非所謂清靜也祭不欲數數則瀆瀆則不敬宜復古禮四時祭于廟諸寢園日月間祀皆可勿復修見漢書韋玄成傳昌陵議昌陵因卑為高積土為山度便房猶在平地上客土之中不保幽冥之靈淺外不固卒徒工庸以巨萬數至㸐脂火夜作取土東山且與穀同賈作治數年天下遍被其勞國家罷敝府臧空虛下至衆庶熬熬苦之故陵因天性據真土處勢高敞旁近祖考前又已有十年功緒宜還復故陵勿徙民見漢書陳湯傳罷三公官議古今異制漢自天子之號下至佐史皆不同于古而獨改三公職事雖分明無益於治亂見漢書朱博傳嶭況罪議律曰鬭以刃傷人完為城旦其賊加罪一等與謀者同罪詔書無以詆欺成罪傳曰遇人不以義而見疻者與痏人之罪鈞惡不直也咸厚善修而數稱宣惡流聞不誼不可謂直況以故傷咸計謀已定後聞置司隸因前謀而趣明非以恐咸為司隸故造謀也本爭私變雖于掖門外傷咸道中與凡民爭鬭無異殺人者死傷人者刑古今之通道三代所不易也孔子曰必也正名名不正則至于刑罰不中刑罰不中而民無所錯手足今以況為首惡明手傷為大不敬公私無差春秋之義原心定罪原況以父見謗發忿怒無它大惡加詆欺輯小過成大辟陷死刑違明詔恐非法意不可施行聖王不以怒增刑明當以賊傷人不直況與謀者皆爵減完為城旦見漢書嶭宣傳通褎斜道行船漕對抵蜀從故道故道多阪回遠今穿褒邪道少阪近四百里而褒水通沔斜水通渭皆可以行船漕漕從南陽上沔入褒褒之絶水至斜閒百餘里以車轉從斜下下渭如此漢中之穀可致山東從沔無限便于砥柱之漕且褒斜材木竹箭之饒擬于巴蜀見史記河渠書初置五經博士舉狀生事愛敬喪沒如禮通易尚書孝經論語兼綜載籍窮微闡奧隱居樂道不求聞達身無金痍痼疾世六屬不與妖惡交通王侯賞賜行應四科經任博士下言某官某甲保舉見後漢朱浮傳注引漢官儀與韋玄成書古之辭讓必有文義可觀故能垂榮于後今子獨壞容貌蒙恥辱光曜暗而不宣微哉子之所託名也僕素愚陋過為宰相執事願少聞風聲不然怨子傷高而僕為小人也見漢書韋賢附傳札書黃帝得寶鼎宛朐問于鬼臾區鬼臾區對曰帝得寶鼎神策是歲己酉朔旦冬至得天之紀終而復始于是黃帝迎日推策後率二十歲復朔旦冬至凡二十推三百八十年黃帝仙登于天見史記封禪書又見漢書郊祀志上宛朐作冕侯食鼎銘五熟是滋君王膳之見虞荔鼎録金革帶鉤文錫爾金鉤既公且侯見梁書夏侯詳傳剛卯文正月剛卯既央靈殳四方赤青白黃四色是當帝令祝融以教夔龍庶疫剛疸莫我敢當疾日剛卯帝令夔龍順爾固伏化茲靈殳既正既直既觚既方庶疫剛疸莫我敢當見漢書王莽傳中注寶劍銘直百金壽萬歲見西京雜記上琴銘璠璵之樂同上玉管銘昭華之管同上湓城井銘潁陰侯所開三百年當塞不滿百年為當運者所開見御覽一百八十九孝昭帝冠辭陛下離顯先帝之光耀以承皇天嘉祿欽順仲春之吉日遵竝大道邠或秉集萬福之休靈始加昭明之元服推遠稚免之幼志崇積文武之寵德肅勤高祖清廟六合之內靡不息陛下永永與天無極見大戴禮公冠篇陛下摛顯先帝之光耀以承皇天之嘉祿欽奉仲春之吉辰普尊大道之郊域秉率百福之休靈始加昭明之元服推遠沖孺之幼志蘊積文武之就德肅勤高祖之清廟六合之內靡不蒙福永永與天無極見續漢禮儀志上注引博物記與大戴禮小異祭天辭皇皇上天昭臨下土集地之靈降甘風雨庶物群生各得其所靡今靡古維豫一人某敬拜皇天之祜見大戴禮公冠篇祭地辭薄薄之土承天之神興甘風雨庶卉百穀莫不茂者既安且寧維豫一人某敬拜下土之靈見大戴禮公冠篇迎日辭維某年某月上日明光于上下勤施于四方旁作穆穆維豫一人某敬拜迎日于郊見宋書禮志一引尚書大傳又見大戴禮公冠篇龜祝今日吉謹以粱卵焍黃祓去玉靈之不祥玉靈必信以誠知萬事之情辨兆皆可占不信不誠則燒玉靈揚其灰以徵後龜假之玉露夫子夫子玉靈荊灼而心令而先知而上行于天下行于淵諸靈數刺莫如汝信今日良日行一良貞其欲卜某即得而喜不得而悔即得發鄉我身長大手足收人皆上偶不得發鄉我身挫折中外不相應手足滅去假之靈龜五筮五靈不如神龜之靈知人死知人生某身良貞某欲求某物即得也頭見足發內外相應即不得也頭仰足肣內外自隨可得占見史記龜策傳卜占病者祝今某病困死首上開內外交駭身節折不死首仰足肣見史記龜策傳卜病者崇今病有祟無呈無祟有呈兆有中祟有內外祟有外見史記龜策傳郊拜太一贊饗文天始以寶鼎神策授皇帝朔而又朔終而復始皇帝敬拜見焉拜祝祠太一贊饗文德星昭衍厥維休祥壽星仍出淵耀光明信星昭見皇帝敬拜太祝之享祠上帝明堂贊饗文天增授皇太元神策周而復始皇帝敬拜太一見史記封禪書倀子逐疫甲作食凶胇胃食虎雄伯食魅騰簡食不詳攬諸食咎伯奇食夢強梁祖門共食磔死寄生委隨食觀錯斷食巨窮奇騰根共食蠱凡使十二神追惡赫女軀拉女幹節解女肉抽女肺腸女不急去後者為糧見續漢禮儀志中王使威長葬銘明明哲士知存知亡崇隴原亹非寧非康不封不樹作靈乘光厥銘何依王使威長見博物志八
