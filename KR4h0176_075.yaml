body:
  text: 王莽上書讓定策功賞臣與孔光王舜甄豐甄邯共定策今願獨條光等功賞寢置臣莽勿隨輩列見漢書王莽傳上上書助給貧民願出錢百萬獻田三十頃付大司農助給貧民見漢書王莽傳上受宰衡上書臣以元壽二年六月戊午倉卒之夜以新都侯引入未央宮庚申拜為大司馬充三公位元始元年正月丙辰拜為太傅賜號安漢公備四輔官今年四月甲子復拜為宰衡位上公臣莽伏自惟爵為新都侯號為安漢公官為宰衡太傅大司馬爵貴號尊官重一身蒙大寵者五誠非鄙臣所能堪據元始三年天下歲已復官屬宜皆置穀梁傳曰天子之宰通于四海臣愚以為宰衡官以正百僚平海內為職而無印信名實不副臣莽無兼官之材今聖朝既過誤而用之臣請御史刻宰衡印章曰宰衡太傅大司馬印成授臣見漢書王莽傳上上書辭賞新野田臣以外屬越次備位未能奉稱伏念聖德純茂承天當古制禮以治民作樂以移風四海奔走百蠻並轃辭去之日莫不隕涕非有款誠豈可虛致自諸侯王已下至于吏民咸知臣莽上與陛下有葭莩之故又得典職每歸功列德者輒以臣莽為餘言臣見諸侯面言事于前者未嘗不流汗而慚愧也雖性愚鄙至誠自知德薄位尊力少任大夙夜悼栗常恐污辱聖朝今天下治平風俗齊同百蠻率服皆陛下聖德所自躬親太師光太保舜等輔政佐治群卿大夫莫不忠良故能以五年之間至致此焉臣莽實無奇策異謀奉承太后聖詔宣之于下不能得什一受群賢之籌畫而上以聞不能得什伍當被無益之辜所以敢且保首領須臾者誠上休陛下餘光而下依群公之故也陛下不忍衆言輒下其章于議者臣莽前欲立奏止恐其遂不肯止今大禮已行助祭者畢辭不勝至願願諸章下議者皆寢勿上使臣莽得盡力畢制禮作樂事事成以傳示天下與海內平之即有所間非則臣莽當被詿上誤朝之罪如無他譴得全命賜骸骨歸家避賢者路是臣之私願也惟陛下哀憐財幸見漢書王莽傳上白太后示儉親承前孝哀丁傅奢侈之後百姓未贍者多太后宜且衣繒練頗損膳以視天下見漢書王莽傳上白太后隔絶衛氏前哀帝立背恩義自貴外家丁傅撓亂國家幾危社稷今帝以幼年復奉大宗為成帝後宜明一統之義以戒前事為後代法見漢書王莽傳上奏請太后安養陛下春秋尊久衣重練減御膳誠非所以輔精氣育皇帝安宗廟也臣莽數叩頭省戶下白爭未見許今幸賴陛下德澤間者風雨時甘露降神芝生蓂莢朱草嘉禾休徵同時並至臣莽等不勝大願願陛下愛精休神闊略思慮遵帝王之常服復太官之法膳使臣子各得盡歡心備共養唯哀省察見漢書王莽傳上奏請為平帝納后皇帝即位三年長秋宮未建液廷媵未充乃者國家之難本從亡嗣配取不正請考論五經定取禮正十二女之義以廣繼嗣博采二王後及周公孔子世列侯在長安者適子女見漢書王莽傳上上言己女不與選身亡德子材下不宜與衆女並采見漢書王莽傳上謝益封國邑臣莽子女誠不足以配至尊復聽衆議益封臣莽伏自惟念得託肺腑獲爵土如使子女誠能奉稱聖德臣莽國邑足以共朝貢不須復加益地之寵願歸所益見漢書王莽傳上奏誅子宇宇為呂寬等詿誤流言惑衆與管蔡同罪臣不敢隱其誅見漢書王莽傳上奏罷悼園南陵雲陵園本始元年丞相義等議謐孝宣皇帝親曰悼園置邑三百家至元康元年丞相相等奏父為士子為天子祭以天子悼園宜稱尊號曰皇考立廟益故奉園民滿千六百家以為縣臣愚以為皇考廟本不當立纍世奉之非是又孝文太后南陵孝昭太后雲陵園雖前以禮不復修陵名未正謹與大司徒晏等百四十七人議皆曰孝宣皇帝以兄孫繼統為孝昭皇帝後以數故孝元世以孝景皇帝及皇考廟親未盡不毀此兩統二父違于禮制案義奏親諡曰悼裁置奉邑皆應經義相奏悼園稱皇考立廟益民為縣違離祖統乖繆本義父為士子為天子祭以天子者乃謂若虞舜夏禹殷湯周文漢之高祖受命而王者也非為繼祖統為後者也臣請皇高祖考廟奉明園毀勿修罷南陵雲陵為縣見漢書韋玄成傳奏定郊祀帝王之義莫大于承天承天之序莫重于郊祀祭天于南就陽位祀地于北主陰義圓丘象天方澤則地圓方因體南北從位燔燎升氣瘞埋就類牲欲繭栗味尚清玄器成匏勺貴誠因質天地神所統故類乎上帝禋于六宗望秩山川班于群臣皇天后土隨王所在而事祐焉甘泉太陰河東少陽咸失厥位不合禮制聖王之制必上當天心下合地意中考人事故曰愷悌君子求福不回回而求福厥路不通在易泰卦乾坤合體天地交通萬物聚出其律太簇天子親郊天地先祖配天先妣配地陰陽之別以日冬至祀天夏至祀后土君不省方而使有司六宗日月星山川海星則北辰川即河山岱宗三光衆明山阜百川衆流渟汙皋澤以類相屬各數秩望相序見續漢祭祀志上注補引黃圖元始儀元始四年宰衡莽奏奏復長安南北郊王者父事天故爵稱天子孔子曰人之行莫大于孝孝莫大于嚴父嚴父莫大于配天王者尊其考欲以配天緣考之意欲尊祖推而上之遂及始祖是以周公郊祀后稷以配天宗祀文王于明堂以配上帝禮記天子祭天地及山川歲遍春秋穀梁傳以十二月下辛卜正月上辛郊高皇帝受命因雍四畤起北畤而備五帝未共天地之祀孝文十六年用新垣平初起渭陽五帝廟祭泰一地祇以太祖高皇帝配日冬至祠泰一夏至祠地祇皆并祠五帝而共一牲上親郊拜後平伏誅乃不復自親而使有司行事孝武皇帝祠雍曰今上帝朕親郊而后土無祠則禮不答也于是元鼎四年十一月甲子始立后土祠于汾陰或曰五帝泰一之佐宜立泰一五年十一月癸未始立泰一祠于甘泉三歲一郊與雍更祠亦以高祖配不歲事天皆未應古制建始元年徙甘泉泰畤河東后土于長安南北郊永始元年三月以未有皇孫復甘泉河東祠綏和二年以卒不獲祐復長安南北郊建平三年懼孝哀皇帝之疾未廖復甘泉汾陰祠竟復無福臣謹與太師孔光長樂少府平晏大司農左咸中壘校尉劉歆大中大夫朱陽博士薛順議郎國由等六十七人議皆曰宜如建始時丞相衡等議復長安南北郊如故見漢書郊祀志下奏改郊祀禮周官天墜之祀樂有別有合其合樂曰以六律六鐘五聲八音六舞大合樂祀天神祭地祇祀四望祭山川享先妣先祖凡六樂奏六歌而天墜神祇之物皆至四望蓋謂日月星海也三光高而不可得親海廣大無限界故其樂同祀天則天文從祀地則地理同三光天文也山川地理也天地合祭先祖配天先妣配地其誼一也天地合精夫婦判合祭天南郊則以墬配一體之誼也天地位皆南鄉同席墜在東共牢而食高帝高后配于壇上西鄉后在北亦同席共牢牲用繭栗玄酒陶匏禮記曰天子籍田千畝以祀天地繇是言之宜有黍稷天地用牲一燔尞瘞薶用牲一高帝高后用牲一天用牲左及黍稷燔尞南郊墬用牲右及黍稷瘞於北郊其旦東鄉再拜朝日其夕西鄉再拜夕月然後孝弟之道備而神祇嘉享萬福降輯此天墬合祀以祖妣配者也其別樂曰冬日至于地上之圜丘奏樂六變則天人皆降夏日至于澤中之方丘奏樂八變則墜祇皆出天墜有常位不得常合此其各特祀者也陰陽之別于日冬夏至其會也以孟春正月上辛若丁天子親合祀天墜於南郊以高帝高后配陰陽有離合易曰分陰分陽迭用柔剛以日冬至使有司奉祠南郊高帝配而望群陽日夏至使有司奉祭北郊高后配而望群陰皆以助致微氣通道幽弱當此之時后不省方故天子不親而遣有司所以正承天順地復聖王之制顯太祖之功也渭陽祠勿復修群望未悉定定復奏見漢書郊祀志下又略見御覽五百二十九引三輔黃圖宰衡王莽奏奏分群神為五部兆書曰類于上帝禋于六宗歐陽大小夏侯三家説六宗皆曰上不及天下不及墜旁不及四方在六者之間助陰陽變化實一而名六名實不相應禮記祀典功施于民則祀之天文日月星辰所昭仰也地理山川海澤所生殖也易有八卦乾坤六子水火不相逮靁風不相悖山澤通氣然後能變化既成萬物也臣前奏徙甘泉泰畤汾陽后土皆復于南北郊謹案周官兆五帝於四郊山川各因其方今五帝兆居在雍五畤不合于古又日月靁風山澤易卦六子之尊氣所謂六宗也星辰水火溝瀆皆六宗之屬也今或未特祀或無兆居謹與太師光大司徒宮羲和歆等八十九人議皆曰天子父事天母事墜今稱天神曰皇天上帝泰一兆曰泰畤而稱墜祇曰后土與中央黃靈同又兆北郊未有尊稱宜令墜祇稱皇墜后祇兆曰廣畤易曰方以類聚物以群分分群神以類相從為五部兆天墜之別神中央帝黃靈后土畤及日廟北辰北斗填星中宿中宮于長安城之未墜兆東方帝太昊青靈勾芒畤及雷公風伯廟歲星東宿東宮于東郊兆南方炎帝赤靈祝融畤及熒惑星南宿南宮于南郊兆西方帝少皞白靈蓐收畤及太白星西宿西宮於西郊兆北方帝顓頊黑靈玄冥畤及月廟雨師廟辰星北宿北宮于北郊兆見漢書郊祀志下言立官稷帝王建立社稷百王不易社者土也宗廟王者所居稷者百穀之主所以奉宗廟共粢盛人所食以生活也王者莫不尊重親祭自為之主禮如宗廟詩曰乃立冢土又曰以御田祖以祈甘雨禮記曰唯祭宗廟社稷為越紼而行事聖漢興禮儀稍定已有官社未立官稷遂于官社後立官稷以夏禹配食官社后稷配食官稷稷種穀樹徐州牧歲貢五色土各一斗見漢書郊祀志下奏羌豪內附太后秉統數年恩澤洋溢和氣四塞絶域殊俗靡不慕義越裳氏重譯獻白雉黃支自三萬里貢生犀東夷王度大海奉國珍胸奴單于順制作去二名今西域良願等復舉地為臣妾昔唐堯橫被四表亦亡以加之今謹案已有東海南海北海郡未有西海郡請受良願等所獻地為西海郡臣又聞聖王序天文定地理因山川民俗以制州界漢家地廣二帝三王凡十二州州名及界多不應經堯典十有二州後定為九州漢家廓地遼遠州牧行部遠者三萬餘里不可為九謹以經義正十二州名分界以應正始見漢書王莽傳上復言發傅太后及丁姬家共王母丁姬前不臣妾至葬渭陵冢高與元帝山齊懷帝太后皇太太后璽綬以葬不應禮禮有改葬請發共王母及丁姬冢取其璽綬消滅徙共王母及丁姬歸定陶葬共王冢次而葬丁姬復其故見漢書外戚定陶丁姬傳奏更傅太后及丁姬梓宮珠玉衣前共王母生僭居桂宮皇天震怒災其正殿丁姬死葬踰制度今火焚其椁此天見變以告當改如媵妾也臣前奏請葬丁姬復故非是共王母及丁姬棺皆名梓宮珠玉之衣非藩妾服請更以木棺代去珠玉衣葬丁姬媵妾之次見漢書定陶丁姬傳奏請諸將帥封爵明聖之世國多賢人故唐虞之時可比屋而封至功成事就則加賞焉至于夏后塗山之會執玉帛者萬國諸侯執玉附庸執帛周武王孟津之上尚有八百諸侯周公居攝郊祀后稷以配天宗祀文王于明堂以配上帝是以四海之內各以其職來祭蓋諸侯千八百矣禮記王制千七百餘國是以孔子著孝經曰不敢遺小國之臣而況于公侯伯子男乎故得萬國之歡心以事其先王此天子之孝也秦為亡道殘滅諸侯以為郡縣欲擅天下之利故二世而亡高皇帝受命除殘考功施賞建國數百後稍衰微其餘僅存太皇太后躬統大綱廣封功德以勸善興滅繼絶以永世是以大化流通旦暮且成遭羌寇害西海郡反虜流言東郡逆賊惑衆西土忠臣孝子莫不奮怒所征殄滅盡備厥辜天下咸寧今制禮作樂實考周爵五等地四等有明文殷爵三等有其説無其文孔子曰周監於二代郁郁乎文哉吾從周臣請諸將帥當受爵邑者爵五等地四等見漢書王莽傳上上奏符命陛下至聖遭家不造遇漢十二世三七之厄承天威命詔臣莽居攝受孺子之託任天下之寄臣莽兢兢業業懼于不稱宗室廣饒侯劉京上書言七月中齊郡臨淄縣昌興亭長辛當一暮數夢曰吾天公使也天公使我告亭長曰攝皇帝當為真即不信我此亭中當有新井亭長晨起視亭中誠有新井入地且百尺十一月壬子直建冬至巴郡石牛戊午雍石文皆到于未央宮之前殿臣與太保安陽侯舜等視天風起塵冥風止得銅符帛圖於石前文曰天告帝符獻者封侯承天命用神令騎都尉崔發等眂説及前孝哀皇帝建平二年六月甲子下詔書更為太初元將元年案其本事甘忠可夏賀良讖書臧蘭臺臣莽以為元將元年者大將居攝改元之文也于今信矣尚書康誥王若曰孟侯朕其弟小子封此周公居攝稱王之文也春秋隱公不言即位攝也此二經周公孔子所定蓋為後法孔子曰畏天命畏大人畏聖人之言臣莽敢不承用臣請共祀神祇宗廟奏言太皇太后孝平皇后皆稱假皇帝其號令天下天下奏言事毋言攝以居攝三年為初始元年漏劾以百二十為度用應天命臣莽夙夜養育隆就孺子與周之成王比德宣明太皇太后威德于萬方期於富而教之孺子加元服復子明辟如周公故事見漢書王莽傳上為新遷王安作奏使上言興等母雖微賤屬猶皇子不可以棄見漢書王莽傳下
