body:
  text: 王莽大誥惟居攝二年十月甲子攝皇帝若曰大誥道諸侯王三公列侯于汝卿大夫元士御事不弔天降喪于趙傅丁董洪惟我幼沖孺子當承繼嗣無疆大歷服事豫未遭其明惁能道民于安況其能往知天命熙我念孺子若涉淵水豫惟往求朕所濟度奔走以傅近奉承高皇帝所受命豫豈敢自比于前人乎天降威明用寧帝室遺我居攝寶龜太皇太后以丹石之符乃紹天明意詔豫即命居攝踐祚如周公故事反虜故東郡太守翟義擅興師動衆曰有大難于西土西土人亦不靖于是動嚴鄉侯信誕敢犯祖亂宗之序天降威遺我寶龜固知我國有呰災使民不安是天反復右我漢國也粵其聞日宗室之俊有四百人民獻儀九萬夫豫敬以終于此謀繼嗣圖功我有大事休豫卜并吉故我出大將告郡太守諸侯相令長曰豫得吉卜豫惟以汝于伐東郡嚴鄉逋播臣爾國君或者無不反曰難大民亦不靜亦惟在帝宮諸侯宗室于小子族父敬不可征帝不違卜故豫為沖人長思厥難曰烏呼義信所犯誠動鰥寡哀哉豫遭天役遺大解難于豫身以為孺子不身自恤豫義彼國君泉陵侯上書曰成王幼弱周公踐天子位以治天下六年朝諸侯于明堂制禮樂班度量而天下大服太皇太后承順天心成居攝之義皇太子為孝平皇帝子年在襁褓宜且為子知為人子道令皇太后得加慈母恩畜養成就加元服然後復子明辟熙為我儒子之故豫惟趙傅丁董之亂遏絶繼嗣變剝適庶危亂漢朝以成三𨸷隊極厥命烏呼害其可不旅力同心戒之哉豫不敢僭上帝命天休于安帝室興我漢國惟卜用克綏受茲命今天其相民況亦惟卜用太皇太后肇有元城沙鹿之右陰精女主聖明之祥配元生成以興我天下之符遂獲西王母之應神靈之徵以祐我帝室以安我大宗以紹我後嗣以繼我漢功厥害適統不宗元緒者辟不違親辜不避戚夫豈不愛亦惟帝室是以廣立王侯竝建曾玄俾屏我京師綏撫宇內博徵儒生講道于廷論序乖繆制禮作樂同律度量混一風俗正天地之位昭郊宗之禮定五時廟祧咸秩亡文建靈臺立明堂設辟雍張太學尊中宗高宗之號昔我高宗崇德建武克綏西域以受白虎威勝之瑞天地判合乾坤序德太皇太后臨政有龜龍麟鳳之應五德嘉符相因而備河圖雒書遠自昆侖出于重野古讖著言肆今享實此乃皇天上帝所以安我帝室俾我成就洪烈也烏呼天明威輔漢始而大大矣爾有惟舊人泉陵侯之言爾不克遠省爾豈知太皇太后若此勤哉天毖勞我成功所豫不敢不極卒安皇帝之所圖事豫告我諸侯王公列侯卿大夫元士御事天輔誠辭天其纍我以民豫害敢不于祖宗安人圖功所終天亦惟勞我民若有疾豫害敢不于祖宗所受休輔豫聞孝子善繼人之意忠臣善成人之事豫思若考作室厥子堂而構之厥父菑厥子播而穫之豫害敢不于身撫祖宗之所受大命若祖宗乃有效湯武伐厥子民長其勸弗救烏呼肆哉諸侯王公列卿大夫元士御事其勉助國道明亦惟宗室之俊民之表儀迪知上帝命粵天輔誠爾不得易定況今天降定于漢國惟大囏人翟義劉信大逆欲相伐于厥室豈亦知命之不易乎豫永念曰天惟喪翟義劉信若嗇夫豫害敢不終豫畝天亦惟休于祖宗豫害其極卜害敢不于從率寧人有旨疆土況今卜并吉故豫大以爾東征命不僭差兆陳惟若此見漢書翟方進附傳破翟義下詔太皇太后遭家不造國統三絶絶輒復續恩莫厚焉信莫立焉孝平皇帝短命早崩幼嗣孺沖詔豫居攝豫承明詔奉社稷之任持大宗之重養六尺之託受天下之寄戰戰兢兢不敢安息伏念太皇太后惟經藝分析王道離散漢家制作之業獨未成就故博徵儒士大興典制備物致用立功成器以為天下利王道粲然基業既著千載之廢百世之遺于今乃成道德庶幾于唐虞功烈比齊于殷周今翟義劉信等謀反大逆流言惑衆欲以篡位賊害我孺子罪深于管蔡惡甚於禽獸信父故東平王雲不孝不謹親毒殺其父思王名曰巨鼠後雲竟坐大逆誅死義父故丞相方進險詖陰賊兄宣靜言令色外巧內嫉所殺鄉邑汝南者數十人今積惡二家迷惑相得此時命當殄天所滅也義始發兵上書言宇信等與東平相輔謀反執捕械繫欲以威民先自相被以反逆大惡轉相捕械此其破殄之明證也已捕斬斷信二子穀鄉侯章德廣侯鮪義母練兄宣親屬二十四人皆磔暴于長安都市四通之衢當其斬時觀者重疊天氣和清可謂當矣命遣大將軍共行皇天之罰討海內之讎功效著焉豫甚嘉之司馬法不云乎賞不踰時欲民速覩為善之利也今先封車騎都尉孫賢等五十五人皆為列侯戶邑之數別下見漢書翟方進附傳族誅翟義等下詔蓋聞古者伐不敬取其䲔鯢築武軍封以為大戮于是乎有京觀以懲淫慝乃者反虜劉信翟義悖逆作亂于東而芒竹群盜趙明霍鴻造逆西土遣武將征討咸伏其辜惟信義等始發自濮陽結姦無鹽殄滅于圉趙明依阻槐里環隄霍鴻負倚盩厔芒竹咸用破碎亡有餘類其取反虜逆賊之䲔鯢聚之通路之旁濮陽無鹽圉槐里盩厔凡五所各方六丈高六尺築為武軍封以為大戮薦樹之棘建表木高丈六尺書曰反虜逆賊䲔鯢在所長吏常以秋循行勿令壞敗以懲淫慝焉見漢書翟方進附傳下書議功顯君未周喪作樂遏密之義訖于季冬正月郊祀八音當奏王公卿士樂凡幾等五聲八音條各云何其與所部儒生各盡精思悉陳其義見漢書王莽傳下書即真豫以不德託于皇初祖考黃帝之後皇始祖考虞帝之苗裔而太皇太后之末屬皇天上帝隆顯大佑成命統序符契圖文金匱策書神明詔告屬豫以天下兆民赤帝漢氏高皇帝之靈承天命傳國金策之書豫甚祗畏敢不欽受以戊辰直定御王冠即真天子位定有天下之號曰新其改正朔易服色變犧牲殊徽幟異器制以十二月朔癸酉為建國元年正月之朔以雞鳴為時服色配德上黃犧牲應正用白使節之旄幡皆純黃其署曰新使五威節以承皇天上帝威命也見漢書王莽傳上下詔更太后為新室文母豫視群公咸曰休哉其文字非刻非畫厥性自然豫伏念皇天命豫為子更命太皇太后為新室文母太皇太后協于新故交代之際信于漢氏哀帝之代世傳行詔籌為西王母共具之祥當為歷代母昭然著明豫祗畏天命敢不欽承謹以令月吉日親率群公諸侯卿士奉上皇太后璽綬以當順天心光于四海焉見漢書元皇后傳改諸侯王號天無二日土無二王百王不易之道也漢世諸侯或稱王至于四夷亦如之遠于古典繆于一統其定諸侯王之號皆稱公及四夷僭號稱王者皆更為侯見漢書王莽傳中封古聖人後帝王之道相因而道盛德之祚百世享祀豫惟黃帝帝少昊帝顓頊帝嚳帝堯帝舜帝夏禹皋陶伊尹咸有聖德假于皇天功烈巍巍光施于遠豫甚嘉之營求其後將祚厥祀見漢書王莽傳中五姓名籍豫前在攝時建郊宮定祧廟立社稷神祇報況或光自上復于下流為烏或黃氣熏蒸昭耀章明以著黃虞之烈焉自黃帝至于濟南伯王而祖世氏姓有五矣黃帝二十五子分賜厥姓十有二氏虞帝之先受姓曰姚其在陶唐曰媯在周曰陳在齊曰田在濟南曰王豫伏念皇初祖考黃帝皇始祖考虞帝以宗祀于明堂宜序于祖宗之親廟其立祖廟五親廟四后夫人皆配食郊祀黃帝以配天黃后以配地以親都侯東第為大禖歲時以祀家之所尚種祀天下姚媯陳田王氏凡五姓者皆黃虞苗裔豫之同族也書不云乎惇序九族其令天下上此五姓名籍于秩宗皆以為宗室世世復無有所與其元城王氏勿令相嫁娶以別族理親焉見漢書王莽傳中祠漢廟豫之皇始祖考虞帝受嬗于唐漢氏初祖唐帝世有傳國之象復親受金策于漢高皇帝之靈惟思褒厚前代何有忘時漢氏祖宗有七以禮立廟于定安國其園寢廟在京師者勿罷祠薦如故豫以秋九月親入漢氏高元成平之廟諸劉更屬籍京兆大尹勿解其復各終厥身州牧數存問勿令有侵冤見漢書王莽傳中去剛卯除刀錢豫前在大麓至于攝假深惟漢氏三七之厄赤德氣盡思索廣求所以輔劉期延之術靡所不用以故作金刀之利幾以濟之然自孔子作春秋以為後王法至于哀之十四而一代畢協之于今亦哀之十四也赤世計盡終不可強濟皇天明威黃德當興隆顯大命屬豫以天下今百姓咸言皇天革漢而立新廢劉而興王夫劉之為字卯金刀也正月剛卯金刀之利皆不得行博謀卿士僉曰天人同應昭然著明其去剛卯莫以為佩除刀錢勿以為利承順天心快百姓意見漢書王莽傳中益封劉殷昔豫之祖濟南愍王困于燕寇自齊臨淄出保于莒宗人田單廣設奇謀獲殺燕將復定齊國今即墨士大夫復同心殄滅反虜豫甚嘉其忠者憐其無辜其赦殷等非快之妻子它親屬當坐者皆勿治弔問死傷賜亡者葬錢人五萬殷知大命深疾惡快以故輒伏厥辜其滿殷國戶萬地方百里見漢書王莽傳中限田禁奴婢古者設廬井八家一夫一婦田百畝休一而稅則國給民富而頌聲作此唐虞之道三代所遵行也秦為無道厚賦稅以自供奉罷民力以極欲壞聖制廢井田是以兼并起貪鄙生強者規田以千數弱者曾無立錐之居又置奴婢之市與牛馬同闌制于民臣顓斷其命姦虐之人因緣為利至略賣人妻子逆天心悖人倫繆于天地之性人為貴之義書曰豫則奴戮女唯不用命者然後被此罪矣漢氏減輕田租三十而稅一常有更賦罷癃咸出而豪民侵陵分田劫假厥名三十稅一實什稅五也父子夫婦終年耕藝所得不足以自存故富者犬馬餘菽粟驕而為邪貧者不厭糟糠窮而為姦俱陷于辜刑用不錯豫前在大麓始令天下公田口井時則有嘉禾之祥遭反虜逆賊且止今更名天下田曰王田奴婢曰私屬皆不得賣買其男口不盈八而田過一井者分餘田豫九族鄰里鄉黨故無田今當受田者如制度敢有非井田聖制無法惑衆者投諸四裔以禦魑魅如皇始祖考虞帝故事見漢書王莽傳中又見食貨志下書禁挾五銖錢諸挾五銖錢言大錢當罷者比非井田投諸四裔見漢書王莽傳中自說德祥事初元四年莽生之歲也當漢九世火德之厄而有此祥興于高祖考之門門為開通梓猶子也言王氏當有賢子開通祖統起于柱石大臣之位受命而王之符也見漢書五行志中之下總說符命帝王受命必有德祥之符瑞協成五命申以福應然後能立巍巍之功傳于子孫永享無窮之祚故新室之興也德祥發于漢三七九世之後肇命于新都受瑞于黃支開王于武功定命于子同成命于巴宕申福于十二應天所以保祐新室者深矣固矣武功丹石出于漢氏平帝末年火德銷盡土德當代皇天眷然去漢與新以丹石始命于皇帝皇帝謙讓以攝居之未當天意故其秋七月天重以三能文馬皇帝復謙讓未即位故三以鐵契四以石龜五以虞符六以文圭七以玄印八以茂陵石書九以玄龍石十以神井十一以大神石十二以銅符帛圖申命之瑞寖以顯著至于十二以昭告新皇帝皇帝深惟上天之威不可不畏故去攝號猶尚稱假改元為初始欲以承塞天命克厭上帝之心然非皇天所以鄭重降符命之意故是日天復決所以勉書又侍郎王盱見人衣白布單衣赤繢方領冠小冠立于王路殿前謂盱曰今日天同色以天下人民屬皇帝盱怪之行十餘步人忽不見至丙寅暮漢氏高廟有金匱圖策高帝承天命以國傳新皇帝明旦宗伯忠孝侯劉宏以聞乃召公卿議未決而大神石人談曰趣新皇帝之高廟受命毋留于是新皇帝立登車之漢氏高廟受命受命之日丁卯也丁火漢氏之德也卯劉姓所以為字也明漢劉火德盡而傳於新室也皇帝謙謙既備固讓十二符應迫著命不可辭懼然祗畏葦然閔漢氏之終不可濟斖斖在左右之不得從意為之三夜不御寢三日不御食延問公侯卿大夫僉曰宜奉如上天威命于是乃改元定號海內更始新室既定神祇歡喜申以福應吉瑞纍仍詩曰宜民宜人受祿于天保右命之自天申之此之謂也五威將奉符命齎印綬王侯以下及吏官名更者外及胸奴西域徼外蠻夷皆即授新室印綬因收故漢印綬賜吏爵人二級民爵人一級女子百戶牛酒蠻夷幣帛各有差大赦天下見漢書王莽傳中下詔立五均官夫周禮有賒貸樂語有五均傳記各有斡焉今開賒貸張五均設諸斡者所以齊衆庶抑并兼也見漢書食貨志報孫建奏廢劉民可嘉新公國師以符命為豫四輔明德侯劉龔率禮侯劉嘉等凡三十二人皆知天命或獻天符或貢昌言或捕告反虜厥功茂焉諸劉與三十二人同宗共祖者勿罷賜姓曰王見漢書王莽傳中伐胸奴降奴服于知威侮五行背畔四條侵犯西域延及邊垂為元元害罪當夷滅命遣立國軍孫建等凡十二將十道竝出共行皇天之威罰于知之身惟知先祖故呼韓邪單于稽侯狦纍世忠孝保塞守徼不忍以一知之罪滅稽侯狦之世今分胸奴國土人民以為十五立稽侯狦子孫十五人為單于遣中郎將藺苞戴級馳之塞下召拜當為單于者諸胸奴人當坐虜知之法者皆赦除之見漢書王莽傳中設五均科條詔夫鹽食肴之將酒百藥之長嘉會之好鐵田農之本名山大澤饒衍之臧五均賒貸百姓所取平卬以給淡鐵布銅冶通行有無備民用也此六者非編戶齊民所能家作必卬于市雖貴數倍不得不買豪民富賈即要平弱先聖知其然也故斡之每一斡為設科條防禁犯者罪至死見漢書食貨志莽置五均六斡百姓愈病莽知民苦之復下詔下書改錢幣民以食為命以貨為資是以八政以食為首寶貨皆重則小用不給皆輕則僦載煩費輕重大小各有差品則用便而民樂見漢書王莽傳中因漢律令儀法百官改更職事分移律令儀法未及悉定且因漢律令儀法以從事見漢書王莽傳中下書責司監虜知罪當夷滅故遣猛將分十二部將同時出一舉而決絶之矣內置司命軍正外設軍監十有二人誠欲以司不奉命令軍人咸正也今則不然各為權勢恐猲良民妄封人頸得錢者去毒蠚竝作農民離散司監若此可謂稱不自今以來敢犯此者輒捕繫以名聞見漢書王莽傳中封王舜二子昔齊太公以淑德纍世為周氏太師蓋豫之所監也其以舜子延襲父爵為安新公延弟裒新侯匡為太師將軍永為新室輔見漢書王莽傳中下書授諸侯茅土豫以不德襲于聖祖為萬國主思安黎元在于建侯分州正域以美風俗追監前代爰綱爰紀惟在堯典十有二州衛有五服詩國十五抪遍九州殷頌有奄有九有之言禹貢之九州無并幽周禮司馬則無徐梁帝王相改各有云為或昭其事或大其本厥義著明其務一矣昔周二后受命故有東都西都之居豫之受命蓋亦如之其以洛陽為新室東都常安為新室西都邦畿連體各有采任州從禹貢為九爵從周氏有五諸侯之員千有八百附城之數亦如之以俟有功諸公一同有衆萬戶土方百里侯伯一則衆戶五千土方七十里子男一則衆戶二千有五百土方五十里附城大者食邑九成衆戶九百土方三十里自九以下降殺以兩至於一成五差備具合當一則今已受茅土者公十四人侯九十三人伯二十一人子百七十一人男四百九十七人凡七百九十六人附城千五百一十一人九族之女為任者八十三人及漢氏女孫中山承禮君遵德君修義君更以為任十有一公九卿十二大夫二十四元士定諸國邑采之處使侍中講禮大夫孔秉等與州部衆郡曉知地理圖籍者共校治于壽成朱鳥堂豫數與郡公祭酒上卿親聽視咸已通矣夫褒德賞功所以顯仁賢也九族和睦所以褒親親也豫永惟匪解思稽前人將章黜陟以明好惡安元元焉見漢書王莽傳中下書改限田買賣奴婢諸名食王田皆得賣之勿拘以法犯私買賣庶人者且一切勿治見漢書王莽傳中下書更名高句驪為下句驪乃者命遣猛將共行天罰誅滅虜知分為十二部或斷其右臂或斬其左掖或潰其胸腹或紬其兩脅今年刑在東方誅貉之部先縱焉捕斬虜騶平定東域虜知殄滅在于漏刻此乃天地群神社稷宗廟佑助之福公卿大夫士民同心將率虓虎之力也豫甚嘉之其更名高句驪為下句驪布告天下令咸知焉見漢書王莽傳中下書東巡狩伏念豫之皇始祖考虞帝受終文祖在璇璣玉衡以齊七政遂類于上帝禋于六宗望秩于山川遍于群神巡狩五嶽群后四朝敷奏以言明試以功豫之受命即真到于建國五年已五載矣陽九之厄既度百六之會已過歲在壽星填在明堂倉龍癸酉德在中宮觀晉掌歲龜策告從其以此年二月建寅之節東巡狩具禮儀調度見漢書王莽傳中下書止巡狩文母太后體不安其且止巡狩見漢書王莽傳中禁徹長安室宅玄龍石文曰定帝德國雒陽符命著明敢不欽奉以始建國八年歲纏星紀在雒陽之都其謹繕修常安之都勿令壞敗敢有犯者輒以名聞請其罪見漢書王莽傳中
