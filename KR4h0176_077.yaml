body:
  text: 王莽巡狩予以二月建寅之節行巡狩之禮大官齎糒乾肉內者行張坐臥所過毋得有所給予之東巡必躬載耒每縣則耕以勸東作予之南巡必躬載耨每縣則薅以勸南譌予之西巡必躬載銍每縣則穫以勸西成予之北巡必躬載拂每縣則粟以勸蓋藏畢北巡狩之禮即于土中居雒陽之都焉敢有趨讙犯法輒以軍法從事見漢書王莽傳中止巡狩群公群牧群司諸侯庶尹願盡力相帥養牧兆民欲以稱予繇此敬聽其勗之哉毋食言焉更以天鳳七年歲在大梁倉龍庚辰行巡狩之禮厥明年歲在實沈倉龍辛巳即土之中雒陽之都見漢書王莽傳中下書改郡縣名常安西都曰六鄉眾縣曰六尉義陽東都日六州眾縣曰六隊粟米之內曰內郡其外曰近郡有鄣徼者曰邊郡合百二十有五郡九州之內縣二千二百有三公作甸服是為惟城諸在侯服是為惟寍在采任諸侯是為惟翰在賓服是為惟屏在揆文教奮武衛是為惟垣在九州之外是為惟藩各以其方為稱總為萬國焉見漢書王莽傳中報王邑夫地有動有震震者有害動者不害春秋記地震易繫坤動動靜辟脅萬物生焉災異之變各有云為天地動威以戒予躬公何辜焉而乞骸骨非所以助予者也使諸吏散騎司祿大衛修寍男遵諭予意焉見漢書王莽傳中下吏祿制度予遭陽九之阸百六之會國用不足民人騷動自公卿以下一月之祿十繌布二匹或帛一匹予每念之未嘗不戚焉今阸會已度府帑雖未能充略頗稍給其以六月朔庚寅始賦吏祿皆如制度見漢書王莽傳中損御膳吏祿普天之下莫非王土率土之賓莫非王臣蓋以天下養焉周禮膳羞百有二十品今諸侯各食其同國則辟任附城食其邑公卿大夫元士食其采多少之差咸有條品歲豐穰則充其禮有災害則有所損與百姓同憂喜也其用上計時通計天下幸無災害者太官膳羞備其品矣即災害以什率多少而損膳焉東嶽太師立國將軍保東方三州一部二十五郡南嶽太傅前將軍保南方二州一部二十五郡西嶽國師寧始將軍保西方一州一部二十五郡北嶽國將衛將軍保北方二州一部二十五郡大司馬保納卿言卿仕卿作卿京尉扶尉兆隊右隊中部左洎前七部大司徒保樂卿典卿宗卿秩卿翼尉光尉左隊前隊中部右部有五郡大司空保子卿虞卿共卿工卿師尉列尉祈隊後隊中部洎後十郡及六司六卿皆隨所屬之公保其災害亦以十率多少而損其祿郎從官中都官吏食祿都內之委者以大官膳羞備損而為節諸侯辟任附城群吏亦各保其災害幾上下同心勸進農業安元元焉見漢書王莽傳中封唐林紀逡保成師友祭酒唐林故諫議祭酒琅邪紀逡孝弟忠恕敬上愛下博通舊聞德行醇備至於黃髮靡有愆失其封林為建德侯逡為封德侯位皆特進見禮如三公賜第一區錢三百萬授几杖焉見漢書王莽傳下授諸侯茅土于明堂予制作地理建封五等考之經蓺合之傳記通于義理論之思之至于再三自始建國之元以來九年于茲迺今定矣予親設文石之乎陳菁茅四色之土欽告于岱宗泰社后土先祖先妣以班授之各就厥國養牧民人用成功業其在緣邊若江南非詔所召遣侍于帝城者納言掌貨大夫且調內故錢予其祿公歲八十萬侯伯四十萬子男二十萬見漢書王莽傳下下詔收軍吏財產詳考始建國二年胡虜猾夏以來諸軍吏及緣邊吏大夫以上為姦利增產致富者收其家所有財產五分之四以助邊急見漢書王莽傳下追貶孫宗宗屬為皇孫爵為上公知寬等叛遂族類水而與交通刻銅印三文意甚害不知厭足窺欲非望春秋之義君親毋將將而誅焉迷惑失道自取此辜烏呼哀哉宗本名會宗以制作去二名今復名會宗貶厥爵改厥號賜諡為功崇繆伯以諸侯之禮葬于故同穀城郡見漢書王莽傳下下書順符命紫閤圖曰太一黃帝皆僊上天張樂崑崙虔山之上後世聖主得瑞者當張樂秦終南山之上予之不敏奉行未明乃今諭矣復以寧始將軍為更始將軍以順符命易不云乎日新之謂盛德生生之謂易予其饗哉見漢書王莽傳下出軍下書方出軍行師敢有趨讙犯法者輒論斬毋須時盡歲止見漢書王莽傳下因天變下書迺者日中見昧陰薄陽黑氣為變百姓莫不驚怪兆域大將軍王匡遣吏考問上變事者欲蔽上之明是以適見于天以正于理塞大異焉見漢書王莽傳下下書厭盜賊予之皇初祖考黃帝定天下將兵為上將軍建華蓋立斗獻內設大將外置大司馬五人大將軍二十五人偏將軍百二十五人裨將軍千二百五十人校尉萬二千五百人司馬三萬七千五百人侯十一萬二千五百人當百二十二萬五千人士吏四十五萬人士千三百五十萬人應協於易弧矢之利以威天下予受符命之文稽前人將條備焉見漢書王莽傳下大風毀王路堂下書乃壬午脯時有列風雷雨發屋折木之變予甚弁焉予甚恐焉伏念一旬迷乃解矣昔符命文立安為新遷王臨國雒陽為統義陽王是時予在攝假謙不敢當而以為公其後金匱文至議者皆曰臨國雒陽為統謂據土中為新室統也宜為皇太子自此後臨久病雖瘳不平朝見挈茵輿行見王路堂者張于西廂及後閣更衣中又以皇后被疾臨且去本就捨妃妾在東永巷壬午列風毀王路西廂及後閣更衣中室昭寧堂池東南榆樹大十圍東僵繫東閣閣即東永巷之西垣也皆破折瓦壞發屋拔木予甚驚焉又侯官奏月犯心前星厥有占予甚憂之伏念紫閤圖文太一黃帝皆得瑞以僊後世襃主當登終南山所謂新遷王者乃太一新遷之後也統義陽王乃用五統以禮義登陽上遷之後也臨有兄而稱太子名不正宣尼公曰名不正則言不順至于刑罰不中民無錯手足惟即位以來陰陽未和風雨不時數遇枯旱蝗為災穀稼鮮耗百姓苦饑蠻夷猾夏寇賊奸宄人民正營無所措手足深惟厥咎在名不正焉其立安為新遷王臨為統義陽王幾以保全二子子孫千億外攘四夷內安中國焉見漢書王莽傳下下書令衣絳寶黃廝赤其令郎從官皆衣絳見漢書王莽傳下下書築明堂太廟予受命遭陽九之戹百六之會府帑空虛百姓匱乏宗廟未修且祫祭于明堂太廟夙夜永念非敢寍息深惟吉昌莫良於今年予乃卜波水之北郎池之南惟玉食予又卜金水之南明堂之西亦惟玉食予將親築焉見漢書王莽傳下大作下書惟設此壹切之法以來常安六鄉巨邑之都枹鼓稀鳴盜賊衰少百姓安土歲以有年此乃立權之力也今胡虜未滅誅蠻僰未絕焚江湖海澤麻沸盜賊未盡破殄又興奉宗廟社稷之大作民眾動搖今復一切行此令盡二年止之以安元元救愚姦見漢書王莽傳下又詔國師公臨本不知星事由愔起漢書王莽傳下下書責七公夫吏者理也宣德明恩以牧養民仁之道也抑強督姦捕誅盜賊義之節也今則不然盜發不輒得至成群黨遮略乘傳宰士士得脫者又妄自言我責數賊何故為是賊曰以貧窮故耳賊護出我今俗人議者率多若此惟貧困飢寒犯法為非大者群盜小者偷穴不過二科今乃結謀連黨以千百數是逆亂之大者豈飢寒之謂邪七公其嚴敕卿大夫率正連率庶尹謹牧養善民急捕殄盜賊有不同心并力疾惡黜賊而妄曰飢寒所為輒捕繫請其罪見漢書王莽傳下霸橋災下書夫三皇象春五帝象夏三王象秋五伯象冬皇王德運也伯者繼空續乏以成曆數故其道駁惟常安御道多以所近為名迺二月癸已之夜甲什之辰火燒霸橋從東方西行至甲午夕橋盡火滅大司空行視考問或云寒民舍居橋下疑以火自燎為此災也其明旦即乙未立春之日也予以神明聖祖黃虞遣統受命至于地皇四年為十五年正以三年終冬絕滅霸駁之橋欲以興成新室統壹長存之道也又戒此橋空東方之道今東方歲荒民飢道路不通東嶽太師亟科條開東方諸倉賑貸窮乏以施仁道其更名霸館為長存館霸橋為長存橋見漢書王莽傳下憂時下詔予遭陽九之阸百六之會枯旱霜蝗饑饉薦臻蠻夷猾夏寇賊姦宄百姓流離予甚悼之害氣將究矣見漢書食貨志遣太師賑貸惟陽九之阸與害氣會究于去年枯旱霜蝗饑饉薦瑧百姓困乏流離道路于春尤甚予甚悼之今使東嶽太師特進襃新侯開東方諸倉賑貸窮乏太師公所不過道分遣大夫謁者並開諸倉以全元元太師公因與廉丹大使五威司命位右大司馬更始將軍平均侯之兗州填撫所掌及青徐故不軌盜賊未盡解散後復屯聚者皆清潔之期於安兆黎矣見漢書王莽傳下恣聽采取山澤物惟民困乏雖溥開諸倉以賑贍之猶恐未足其且開天下山澤之防諸能采取山澤之物而順月令者其恣聽之勿令出稅至地皇三十年如故是王光上戊之六年也如令豪吏猾民辜而榷之小民弗蒙非予意也易不云乎損上益下民說無疆書云言之不從是謂不艾咨虖群公可不憂哉見漢書王莽傳下追詔廉丹倉廩盡矣府庫空矣可以怒矣可以戰矣將軍受國重任不捐身于中野無以報恩塞責見後漢馮衍傳下書賜廉丹諡惟公多擁選士精兵眾郡駿馬倉穀帑藏皆得自調忽于詔策離其威節騎馬呵譟為狂刃所害烏呼哀哉賜諡曰果公見漢書王莽傳下大赦天下復下書購捕劉伯升等故漢氏舂陵侯群子劉伯升與族人婚姻黨與妄流言惑眾悖畔天命及手害更始將軍廉丹前隊大夫甄阜屬正梁丘賜及北狄胡虜逆輿洎南僰虜若豆孟遷不用此書有能捕得此人者皆封為上公食邑萬戶賜寶貨五千萬見漢書王莽傳下詔王匡等太師王匡國將哀章司命孔仁兗州牧壽良卒正王閎揚州牧李聖亟進所部州郡兵凡三十萬眾迫措青徐盜賊納言將軍嚴尤秩宗將軍陳茂車騎將軍王巡左隊大夫王吳亟進所部州郡兵凡十萬眾迫措前隊醜虜明告以生活丹青之信復迷惑不解皆并力合擊殄滅之矣大司空隆新公宗室戚屬前以虎牙將軍東指則反虜破壞西擊則逆賊靡碎此迺新室威寶之臣也如黠賊不解散將遣大司空將百萬之師征伐劋絕之矣見漢書王莽傳下策命孺子咨爾嬰昔皇天右乃太祖歷世十二享國二百一十載厤數在于予躬詩不云乎侯服于周天命靡常封爾為定安公永為新室賓於戲敬天之休往踐乃位毋廢予命其以平原安德漯陰鬲重丘凡戶萬地方百里為定安公國立漢祖宗之廟於其國與周後竝行其正朔服色世世以事其祖宗永以命德茂功享歷代之祀焉以孝平皇后為定安太后見漢書王莽傳中策群司歲星司肅東嶽太師典致時雨青煒登平考景以晷熒惑司悊南嶽太傅典致時粵赤煒頌平考聲以律太白司艾西嶽國師典致時陽白煒象平考量以銓辰星司謀北嶽國將典致時寒玄煒和平考星以漏月刑元股左司馬典致武應考方法矩主司天文欽若昊天敬授民時力來農事以豐年穀日德元厷右司徒典致文瑞考圜合規主司人道五教是輔帥民承上宣美風俗五品乃訓斗平元心中司空典致物圖考度以繩主司地里平治水土掌名山川眾殖鳥獸蕃茂草木見漢書王莽傳中置司五事策予聞上聖欲昭厥德罔不慎修厥身用綏于遠是用建爾司于五事毋隱尢毋將虛好惡不愆立于厥中於戲勗哉令王路設進善之旌非謗之木敢諫之鼓諫大夫四人常坐王路門受言事者見漢書王莽傳中策命五威將普天之下迄于四表靡所不至其東出者至玄菟樂浪高句驪夫餘南出者隃徼外歷益州貶句町王為侯西出者至西域盡改其王為侯北出者至匈奴庭授單于印改漢印文去璽曰章見漢書王莽傳中策命統睦侯陳崇咨爾崇夫不用命者亂之原也大姦猾者賊之本也鑄偽金錢者妨寶貨之道也驕奢踰制者兇害之端也漏泄省中及尚書事者機事不密則害成也拜爵王庭謝恩私門者祿去公室政從亡矣凡此六條國之綱紀是用建爾作司命柔亦不茹剛亦不吐不侮鰥寡不畏強圉帝命師繇統睦于朝見漢書王莽傳中命說符侯崔發重門擊𣔳以待暴客女作五威中城將軍中德既成天下說符見漢書王莽傳中命明威侯王級繞霤之固南當荊楚女作五威前關將軍振武奮衛明威于前見漢書王莽傳中命尉睦侯王嘉羊頭之阸北當燕趙女作五威後關將軍壼口捶扼尉睦于後見漢書王莽傳中命堂威侯王奇肴黽之險東當鄭衛女作五威左關將軍函谷批難掌威于左見漢書王莽傳中命懷羌子王福洴隴之阻西當戎狄女作五威右關將軍成固據守懷羌于右見漢書王莽傳中策免逯竝日食無光干戈不戢其上大司馬印紱就侯氏朝位見漢書王莽傳中選置和叔敕非但保國將閨門當保親屬在西州者見漢書王莽傳中策免嚴尤視事四年蠻夷猾夏不能遏絕寇賊姦宄不能殄滅不畏天威不用詔命貌佷自臧持必不移懷執異心非沮軍議未忍致于理其上大司馬武建伯印韍歸故郡見漢書王莽傳下策書賜太子臨諡符命文立臨為統義陽王此言新室即位三萬六千歲後為臨之後者乃當龍陽而起前過聽議者以臨為太子有烈風之變輒順符命立為統義陽王在此之前自此之後不作信順弗蒙厥佑千年殞命鳴呼哀哉迹行賜諡諡曰繆王見漢書王莽傳下授兵誓有不為新室者社鬼記之見漢書王莽傳下權石銘律權石重四鈞同律度量衡有辛氏造見晉書律厤志上又載記五又隋書律厤志上引趙書是王莽時物銅權銘律權石重四鈞黃帝初祖德匝于虞虞帝始祖德帀於新歲在大梁龍集戊辰戊辰直定天命有人據士德受正號即真改正建丑長壽隆崇同律度量衡稽當前人龍在己巳歲次實沉初班天下萬國永遵子子孫孫享傳億年見隋書律厤志下劍銘神勝萬里伏見陶弘景刀劍錄奏請加莽宰衡春秋列功德之義太上有立德其次有立功其次有立名唯至德大賢然後能之其在人臣則生有大賞終為宗臣殷之伊尹周之周公是也及民上書者八千餘人咸曰伊尹為阿衡周公為太宰周公享七子之封有過上公之賞宜如陳崇言見漢書王莽傳上奏請宣莽德化天下聞公不受千乘之土辭萬金之幣散財施予千萬數莫不鄉化蜀郡男子路建等輟訟慚怍而退雖文王卻虞芮何以加宜報告天下見漢書王莽傳上太保王舜奏言奏可上書乞骸骨視事八年功業不效司空之職尤獨廢頓至迺有地震之變願乞骸骨見漢書王莽傳中上書請廢太皇太后皇天廢去漢而命立新室太皇太后不宜稱尊號當隨漢廢以奉天命見漢書元后傳與母書上于子產至嚴前長孫中孫年俱三十而死今臣臨復適三十誠恐一旦不保中室則不知死命所在見漢書王莽傳下刻印文維祉冠存已夏處南山臧薄冰見漢書王莽傳下肅聖寶繼同上二曰德封昌圖同上三曰
