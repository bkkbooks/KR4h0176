body:
  text: 關竝言治河河決率常于平原東郡左右其地形下而土疏惡聞禹治河時本空此地以為水猥盛則放溢少稍自索雖時易處猶不能離此上古難識近察秦漢以來河決曹衛之域其南北不過百八十里者可空此地勿以為官亭民舍而已見漢書溝洫志水性就下行疾則自刮除成空而稍深河水重濁號為一石水而六斗泥今西方諸郡以至京師東行民皆引河渭山川水溉田春夏乾燥少水時也故使河流遲貯淤而稍淺雨多水暴至則溢決而國家數隄塞之稍益高于平地猶築垣而居水也可各順從其性毋復灌溉則百川流行水道自利無溢決之害矣見漢書溝洫志可略於禹貢九河處穿之縱不能為九但為四五宜有益見漢書溝洫志河入勃海勃海地高于韓牧所欲穿處往者天嘗連雨東北風海水溢西南出濅數百里九河之地已為海所漸矣禹之行河水本隨西山下東北去周譜云定王五年河徙則今所行非禹之所穿也又秦攻魏決河灌其都決處遂大不可復補宜卻徙完平處更開空使緣西山足乘高地而東北入海乃無水災見漢書溝洫志上言令官作酒名山大澤鹽鐵錢布帛五均賒貸幹在縣官唯酒酤獨未斡酒者天之美祿帝王所以頤養天下享祀祈福扶衰養疾百禮之會非酒不行故詩曰無酒酤我而論語曰酤酒不食二者非相反也夫詩據承平之世酒酤在官和旨便人可以相御也論語孔子當周衰亂酒酤在民薄惡不誠是以疑而弗食今絶天下之酒則無以行禮相養放而亡限則費財傷民請法古令官作酒以二千五百石為一均率開一盧以賣讎五十釀為準一釀用粗米二斛麴一斛得成酒六斛六斗各以其市月朔米麴三斛并計其賈而參分之以其一為酒一斛之平除米麴本賈計其利而什分之以其七入官其三及糟酨灰炭給工器薪樵之費見漢書食貨志下上言廉丹史熊調發狀自越巂遂久仇牛同亭邪豆之屬反畔以來積且十年郡縣距擊不已續用馮茂苟施一切之政僰道以南山險高深茂多驅衆遠居費以億計吏士離毒氣死者什七今丹熊懼於自詭期會調發諸郡兵穀復訾民取其十四空破梁州功終不遂宜罷兵屯田明設購賞見漢書王莽傳中上言薦巨毋霸有奇士長丈大十圍來至臣府曰欲奮擊胡虜自謂巨毋霸出于蓬萊東南五城西北昭如海瀕軺車不能載三馬不能勝即日大車四馬建虎旗載霸詣闕霸臥則枕鼓以鐵箸食此皇天所以輔新室也願陛下作大甲高車賁育之衣遣大將一人與虎百人迎之于道京師門戶不容者開高大之以視百蠻鎮安天下見漢書王莽傳下上言平盜賊方略盜賊始發其原甚微非部吏伍人所能禽也咎在長吏不為意縣欺其郡郡欺朝廷實百言十實千言百朝廷忽略不輒督責遂至延曼連州乃遣將率多發使者傳相監趣郡縣力事上官應塞詰對共酒食具資用以救斷斬不給復憂盜賊治官事將率又不能躬率吏士戰則為賊所破吏氣濅傷徒費百姓前幸蒙赦令賊欲解散或反遮擊恐入山谷轉相告語故郡縣降賊皆更驚駭恐見詐滅因饑饉易動旬日之閒更十餘萬人此盜賊所以多之故也今雒陽以東米石二千竊見詔書欲遣太師更始將軍二人爪牙重臣多從人衆道上空竭少則亡以威視遠方宜急選牧尹以下明其賞罰收合離鄉小國無城郭者徙其老弱置大城中積藏穀食并力固守賊來攻城則不能下所過無食勢不得群聚如此招之必降擊之則滅今空復多出將率郡縣苦之反甚于賊宜盡徵還乘傳諸使者以休息郡縣委任臣況以二州盜賊必平定之見漢書王莽傳下對到部方略荊揚之民率依阻山澤以漁采為業閒者國張六管稅山澤妨奪民之利連年久旱百姓饑窮故為盜賊興到部欲令明曉告盜賊歸田里假貸犂牛種食闊其租賦幾可以解釋安集見漢書王莽傳下移書劉良老子不率宗族單褲騎牛哭且行何足賴哉見後漢趙孝王良傳注引續漢書為魏成大尹李焉作讖書文帝發忿居地下趣軍北告胸奴南告越人江中劉信執敵報怨復續古先四年當發軍江湖有盜自稱樊王姓為劉氏萬人成行不受赦令欲動秦雒陽十一年當相攻太白揚光歲星入東井其號當行見漢書王莽傳下荊楚當興李氏為輔見漢書王莽傳下奏益封莽爵邑太后委任大司馬莽定策安宗廟故大司馬霍光有安宗廟之功益封三萬戶疇其爵邑比蕭相國莽宜如光故事見漢書王莽傳上請賜莽號安漢公莽功德致周成白雉之瑞千載同符聖王之法臣有大功則生有美號故周公及身在而託號于周莽有定國安漢家之大功宜賜號曰安漢公益戶疇爵邑上應古制下準行事以順天心見漢書王莽傳上復上言益封莽莽雖克讓朝所宜章以時加賞明重元功無使百僚元元失望見漢書王莽傳上奏宜令莽平決事往者吏以功次遷至二千石及州郡所舉茂材異等吏率多不稱宜皆見安漢公又太后不宜親省小事見漢書王莽傳上言宜采莽女為后明詔聖德巍巍如彼安漢公盛勳堂堂若此今當立后獨奈何廢公女天下安所歸命願得公女為天下母見漢書王莽傳上見莽女還奏言公女漸漬德化有窈窕之容宜承天序奉祭祀見漢書王莽傳上請益封莽古者天子封后父百里尊而不臣以重宗廟孝之至也佟言應禮可許請以新野田二萬五千六百頃益封莽滿百里見漢書王莽傳上奏聘皇后故事故事聘皇后黃金二萬斤為錢二萬萬見漢書王莽傳上復言益聘今皇后受聘踰群妾亡幾見漢書王莽傳上奏加莽九錫昔周公奉繼體之嗣據上公之尊然猶七年制度乃定夫明堂辟雍墮廢千載莫能興公以八月載生魄庚子奉使朝用書臨賦營築越若翊辛丑諸生庶民大和會十萬衆並集平作二旬大功畢成唐虞發舉成周造業誠亡以加宰衡位宜在諸侯王上賜以束帛加璧大國乘車安車各一驪馬二駟見漢書王莽傳上奏請莽居攝太后聖德昭然深見天意詔令安漢公居攝臣聞周成王幼少周道未成成王不能共事天地修文武之烈周公權而居攝則周道成王室安不居攝則恐周隊失天命書曰我嗣事子孫大不克共上下遏失前人光在家不知命不易天應棐諶乃亡隊命說曰周公服天子之冕南面而朝群臣發號施令常稱王命召公賢人不知聖人之意故不說也禮明堂記曰周公朝諸侯于明堂天子負斧依南面而立謂周公踐天子位六年朝諸侯制禮作樂而天下大服也召公不說時武王崩縗粗未除由是言之周公始攝則居天子之位非乃六年而踐阼也書逸嘉禾篇曰周公奉鬯立于阼陛延登贊曰假王蒞政勤和天下此周公攝政贊者所稱成王加元服周公則致政書曰朕復子明辟周公常稱王命專行不報故言我復子明君也臣請安漢公居攝踐祚服天子韍冕背斧依于戶牖之閒南面朝群臣聽政事車服出入警蹕民臣稱臣妾皆如天子之制郊祀天地宗祀明堂共祀宗廟享祭群神贊曰假皇帝民臣謂之攝皇帝自稱曰豫平決朝事常以皇帝之詔稱制以奉順皇天之心輔翌漢室保安孝平皇帝之幼嗣遂寄託之義隆治平之化其朝見太皇太后帝皇后皆復臣節自施政教于其宮家國采如諸侯禮儀故事臣昧死請見漢書王莽傳上復白宜尊莽為假皇帝劉崇等謀逆者以莽權輕也宜尊重以填海內見漢書王莽傳下奏益莽殿省官屬請益安漢公宮及家吏置率更令廟廄廚長丞中庶子虎賁以下百餘人又置衛士三百人安漢公盧為攝省府為攝殿第為攝宮見漢書王莽傳下奏請進莽二子爵為公太后修功録德遠者千載近者當世或以文封或以武爵深淺大小靡不畢舉今攝皇帝背依踐祚宜異于宰國之時制作雖未畢已宜進二子爵皆為公春秋善善及子孫賢者之後宜有土地成王廣封周公庶子六人皆有茅土及漢家名相大將蕭霍之屬咸及支庶兄子光可先封為列侯諸孫制度畢已大司徒大司空上名如前詔書見漢書王莽傳上奏止莽巡狩皇帝至孝往年文母聖體不豫躬親供養衣冠稀解因遭棄群臣悲哀顏色未復飲食損少今一歲四巡道路萬里春秋尊非糒乾肉之所能堪且無巡狩須閲大服以安聖體臣等盡力養牧兆民奉稱明詔見漢書王莽傳中劾奏孔仁仁乘乾車駕川馬左蒼龍右白虎前朱雀前玄武右杖威節左負威斗號曰赤星非以驕仁乃以尊新室之威命也仁擅免天文冠大不敬見漢書王莽傳下平帝喪禮議禮臣不殤君皇帝年十有四歲宜以禮斂加元服見漢書平紀上壽乃庚子雨水灑道辛丑清靚無鹿其夕穀風迅疾從東北來辛丑巽之宮日也巽為風為順后誼明母道得溫和慈惠之化也易曰受茲介福于其王母禮曰承天之慶萬福無疆諸欲依廢漢火劉皆沃灌雪除殄滅無餘雜矣百穀豐茂庶草蕃殖元元歡喜兆民賴福天上幸甚見漢書王莽傳下銅符帛圖天告帝符獻者封侯承天命用神令見漢書王莽傳上
