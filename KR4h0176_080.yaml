body:
  text: 南越王趙他移檄告橫浦陽山湟溪關盜兵且至急絶道聚兵自守見史記南越王尉他傳漢書兩粵傳下令國中吾聞兩雄不俱立兩賢不并世皇帝賢天子也自今以後去帝制黃屋左纛見史記南越王尉他傳又見漢書兩粵傳以後作以來上文帝書蠻夷大長老夫臣他昧死再拜上書皇帝陛下老夫故粵吏也高皇帝幸賜臣他璽以為南粵王使為外臣時內貢職孝惠皇帝即位義不忍絶所以賜老夫者厚甚高后自臨用事近細士信讒臣別異蠻夷出令曰毋豫蠻夷外越金鐵田器馬牛羊即豫豫牡毋豫牝老夫處辟馬牛羊齒已長自以祭祀不入修有死罪使內史藩中尉高御史平凡三輩上書謝過皆不反又風聞老夫父母墳墓已壞削兄弟宗族已誅論吏相與議曰今內不得振于漢外無以自高異故更號為帝自帝其國非敢有害於天下也高皇后聞之大怒削去南粵之籍使使不通老夫竊疑長沙王讒臣故敢發兵以伐其邊且南方卑溼蠻夷中西有西甌其中半羸南面稱王東有閩越其衆數千人亦稱王西北有長沙其半蠻夷亦稱王老夫故敢妄竊帝號聊以自娛老夫身定百邑之地東西南北數千萬里帶甲百萬有餘然北面而臣事漢何也不敢背先人之故老夫處粵四十九年于今抱孫焉然夙興夜寐寢不安席食不甘味目不視靡曼之色耳不聽鍾鼓之音者以不得事漢也今陛下哀憐復故號通使漢如故老夫死骨不腐改號不敢為帝矣謹北面因使者獻白璧一雙翠鳥千犀角十紫貝五百桂蠹一器生翠四十雙孔雀二雙昧死再拜以聞皇帝陛下見漢書兩粵傳又史記南越王尉他傳載此書僅九十二字上武帝書兩越俱為藩臣毋得擅興兵相攻擊今閩越擅興兵侵臣臣不敢興兵唯天子詔之見史記南越王尉他傳漢書兩粵傳下令國中王年少太后中國人又與使者亂專欲內屬盡持先王寶器入獻天子以自媚多從人行至長安虜賣以為僮取自脫一時之利無顧趙氏社稷為萬世慮計之意見史記南越王尉他傳漢書兩粵傳上書擊南越請以卒八千人從樓船將軍擊呂嘉等見史記東越傳習射令鳴鏑所射而不悉射者斬之見史記胸奴傳遺高后謾書孤僨之君生于沮澤之中長于平野牛馬之域數至邊境願遊中國陛下獨立孤僨獨居兩主不樂無以自虞願以所有易其所無見漢書胸奴傳上遺文帝書天所立胸奴大單于敬問皇帝無恙前時皇帝言和親事稱書意合歡漢邊吏侵侮右賢王右賢王不請聽後義盧侯難支等計與漢吏相距絶二主之約離昆弟之親皇帝讓書再至發使以書報不來漢使不至漢以其故不和鄰國不附今以少吏之敗約故罰右賢王使至四方求月氏擊之以天之福吏卒良馬力強以滅夷月氏盡斬殺降下定之樓蘭烏孫呼揭及其旁二十六國皆已為胸奴諸引弓之民并為一家北州以定願寢兵休士養馬除前事復故約以安邊民以應古始使少者得成其長老者得安其處世世平樂未得皇帝之志故使郎中係呼淺奉書請獻橐他一騎馬二駕二駟皇帝即不欲胸奴近塞則且詔吏民遠舍使者至即遣之見漢書胸奴傳上史記同令軍中得李廣必生致之見史記李廣傳遺武帝書南有大漢北有強胡胡者天之驕子也不為小禮以自煩今欲與漢闓大關取漢女為妻歲給遣我蘖酒萬石稷米五千斛雜繒萬匹它如故約則邊不相盜矣見漢書胸奴傳上上元帝書請入朝常願謁見天子誠以郅支在西方恐其與烏孫俱來擊臣以故未得至漢今郅支已伏誅願入朝見見漢書胸奴傳下上書請罷邊備願保塞上谷以西至敦煌傳之無窮請罷邊備塞吏卒以休天下人民見漢書胸奴傳下因都護上元帝嫚書居困厄願歸計強漢遣子入侍見漢書陳湯傳上哀帝書請入朝蒙天子神靈人民盛壯願從五百人入朝以明天子盛德見漢書胸奴傳下上書改名幸得備藩臣竊樂太平聖制臣故名囊知牙斯今謹更名曰知見漢書胸奴傳下聞中國譏二名故名囊知牙斯今更名知慕從聖制見漢書王莽傳上請遣將屯田伊循城身在漢久今歸單弱而前王有子在恐為所殺國中有伊循城其地肥美願漢遣一將屯田積穀令臣得依其威重見漢書西域傳上上宣帝書連為胸奴所侵削昆彌願發國半精兵人馬五萬匹盡力擊胸奴唯天子出兵哀救公主見漢書胸奴傳上又上宣帝書願以漢外孫元貴靡為嗣得令復尚漢公主結婚重親畔絶胸奴願聘馬騾各千匹見漢書西域傳下上書求與烏孫女入朝得尚漢外孫為昆弟願與公主女俱入朝見漢書西域傳下化為白石羊題背修羊公謝天子見列仙傳茅君九錫玉冊文惟盈虛挺遠朗幽耽妙玄爰自童蒙散髮北山靜心林澤思求神登峻履谷艱尋師門擲形絶投𨈬万津丹誠率往肆其天然遂造明匠乃受靈篇翦髮祝䞈殘首截身帶索自樂不恥飢寒所適唯道所保以真情昭上帝感激太玄今敬授盈位為太元真人領東嶽上卿司命神君君平心格正秉操金石丹心矯衆柶神高今故報以玉鉞録旌八威之策使征伐邪源折衝萬神君寒凍林谷味玄仰真思激窮岫啓心精誠今故報以紫髦之節藕敷華冠使君招驅千靈封山召雲君棄家獨往離親樂仙契闊嶮試冬袒山川今故報以繡羽紫帔丹青飛裙使君從容霄階攜命玉真君步驟林藪足履危仞心恥志尚曾不愆憚今故報以斑龍之輿素虎之軿使以浮宴太空飛輪帝庭君披榛并景寒露霜雪心求明真不戰不栗今故報以曲晨寶蓋瓊闈緑室使游盼九宮靜神溫密君遠遁秀榮無疲于心潛形幽嶽精思万林今故報以執神流火雙珠月明可以上聞太極通音上清君貞心高靜淫纍不經素挺晧映內外坦平今故報以錦旌繡幡白羽玄竿可以呼召六陰玉女侍軒君慈向𧢻物陰德万生蠢動之毛皆念經營今故報以鳳鸞之嘯金鐘玉磬可以和神虛館樂真儛靈君飢渴養神艱辛求真万物不能致其惑千邪不能毀其淳今故報以紫琳之腴玉漿金罌可以壽同三光刻簡丹璚也君標領清玄紫緯八映心暉重離神躍太霞實真人之長者故以太元為號九德既備積感太微天人虛因不期同歸今酬九事以報往懷君心神方朗四靈所棲丹真啓煥秉直不回正任同固鑒無照微今屈宰上卿總括東嶽又加司命之主以領録圖籍給玉童玉女各四十人以出入太微受事太極也治宮赤城玉洞之府盈其蒞之動靜以聞見劉大彬茅山志傳書母告百姓佩此書者不死不信我言視門樞下當有白髮見漢書五行志下之上賜將作大匠丞札汝績克成賜汝金十斤見御覽六百六引漢武故事上表訟冤天地雖明詎悉無辜之老日月垂照必鑒有滯之人具臣早忝宦途頗彰清慎尋以論遷劇邑稍免瑕疵不謂刺史梁緯心縱貪婪勢連內戚欲臣亡父之馬戮臣冤枉之刑上欣皇天許臣明雪若不聞于陛下何以免此幽沈并刺史梁緯行事二十一條不依法令一一條奏別狀以聞伏願陛下聰明哀臣冤抑見搜神記
