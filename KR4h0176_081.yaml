body:
  text: 光武帝制書報耿純侯前奉公行法朱英久吏曉知義理何時當以公事相是非然受堯舜之罰者不能愛已也已更擇國土令侯無介然之憂見後漢耿純傳注引續漢書封更始為淮陽王詔更始破敗棄城逃走妻子裸袒流冗道路朕甚愍之今封更始為淮陽王吏人敢有賊害者罪同大逆見後漢光武紀以卓茂為太傅封褎德侯詔前密令卓茂束身自修執節淳固斷斷無他其心休休焉夫士誠能為人所不能為則名冠天下當受天下重賞故武王誅紂封比干之墓表商容之閭今以茂為太傅封褎德侯食邑二千戶賜几杖車馬衣一襲絮五百斤復以茂長子戎為大中大夫次子崇為中郎給事黃門見後漢卓茂傳藝文類聚四十六御覽二百十又書鈔五十二引漢官儀差録功臣詔人情得足苦于放縱快須臾之欲忘慎罰之義惟諸將業遠功大誠欲傳于無窮宜如臨深淵如履薄冰戰戰栗栗日慎一日其顯效未酬名籍未立者大鴻臚趣上朕將差而録之見後漢光武紀赦詔其赦天下惟殘賊用刑戮深刻獄多冤人朕甚愍之自今已後有犯者將正厥辜見藝文類聚五十二引續漢書惟酷吏殘賊用刑深刻獄多冤人朕甚愍之孔子不云乎刑罰不中則民無所措手足其與諸中二千石諸大夫議省刑罰見袁宏後漢紀四頃獄多冤人用刑深刻朕甚愍之孔子云刑罰不中則民所措所手足其與中二千石諸大夫博士議郎議省刑法見後漢光武紀禁拘執詔民有嫁妻賣子欲歸父母者恣聽之敢拘執論如律見後漢光武紀復宗室列侯子孫詔惟宗室列侯為王莽所廢先靈無所依歸朕甚愍之其竝復故國若侯身已歿屬所上其子孫見名尚書封拜見後漢光武紀惟列侯為王莽所廢先祖魂神無所依歸朕甚愍之列侯身廢者國如故身死若子孫見在令繼其先焉見袁宏後漢紀四得璽綬祠高廟詔群盜縱橫賊害元元盆子竊尊號亂惑天下朕奮兵討擊應時崩解十餘萬衆束手降服先帝璽綬歸之王府斯皆祖宗之靈士人之力朕曷足以享斯哉其擇吉日祠高廟賜天下長子當為父後者爵人一級見後漢光武紀寬吏罪詔吏不滿六百石下至墨綬長相有罪先請男子八十以上十歲以下及婦人從坐者自非不道詔所名捕皆不得繫當驗問者即就驗女徒雇山歸家見後漢光武紀報朱浮詔往年赤眉跋扈長安吾策其無穀必東果來歸降今度此反虜勢無久全其中必有內相斬者今軍資未充故須侯麥耳見後漢朱浮傳報耿弇詔將軍出身舉宗為國所向陷敵功效尤著何嫌何疑而欲求徵且與王常共屯涿郡勉思方略以成功業見袁宏後漢紀四後漢耿弇傳憂旱詔久旱傷麥秋種未下朕甚憂之將殘吏未勝獄多冤結元元悲恨感傷天地乎其令中都官三輔郡國出繫囚罪非犯殊死一切勿案見徒免為庶人務進柔良退貪酷各正厥事焉見後漢光武紀使樊宏迎耿況詔惟況功大不宜監察從事邊郡寒苦不足久居其詣行在所見後漢耿弇傳注引袁嵩書龐萌反下詔吾嘗于衆人中言萌可為社稷臣將軍等得無笑吾言老賊當族其各勵兵馬會雎陽見袁宏後漢紀五又見後漢龐萌傳作與諸將書與此小異詔書勞蓋延龐萌一夜反畔相去不遠營壁不堅始令人齒欲相擊而將軍聞之夜告臨淮楚國有不可動之節吾甚美之見後漢蓋延傳注引東觀記及續漢書勞耿弇昔韓信破歷下以開基今將軍攻祝阿以發迹此皆齊之西界功足相方而韓信襲擊已降將軍獨拔徑敵其功乃難于信也又田橫烹酈生及田橫降高帝詔尉不聽為仇張步前亦殺伏隆若步來歸命吾當詔大司徒釋其怨又事尤相類也將軍前在南陽建此大策常以為落落難合有志者事竟成也見後漢耿弇傳詔遣周黨許由不仕有唐帝德不衰夷齊不食周粟王道不虧不忍使黨久逡巡于汙君之朝其賜帛四十匹遣歸田里見袁宏後漢紀五以范升奏示公卿詔自古堯有許由巢父周有伯夷叔齊自朕高祖有南山四皓自古聖王皆有異士非獨今也太原周黨不食朕祿亦各有志焉見袁宏後漢紀五自古明王聖主必有不賓之士伯夷叔齊不食周粟太原周黨不食朕祿亦各有志焉其賜帛五十匹見後漢周黨傳給廩詔往歲水旱蝗蟲為災穀價騰躍人用困乏朕惟百姓無以自贍惻然愍之其命郡國有穀者給稟高年鰥寡孤獨及篤癃無家屬貧不能自存者如律二千石勉加循撫無令失職見後漢光武紀詔報馮異將軍之于國家義則君臣恩猶父子何嫌何疑而有懼意見袁宏後漢紀五後漢馮異傳赦隗囂所詿誤及遭赤眉難者詔惟天水隴西安定北地吏人為隗囂所詿誤者又三輔遭難赤眉有犯法不道者自殊死以下皆赦除之見後漢光武紀省減吏員詔夫張官置吏所以為人也今百姓遭難戶口耗少而縣官吏職所置尚繁其令司隸州牧各實所部省減吏員縣國不足置長吏可并合者上大司徒大司空二府見後漢光武紀因日食下詔吾德薄不明寇賊為害彊弱相淩元元失所詩云日月告凶不用其行永念厥咎內疚于心其敕公卿舉賢良方正各一人百僚竝上封事無有隱諱有司修職務遵法度見後漢光武紀田租三十稅一詔頃者師旅未解用度不足故行什一之稅今軍士屯田糧儲差積其令郡國收見田租三十稅一如舊制見後漢光武紀又見袁宏後漢紀五有刪節賜馮異詔倉卒蕪蔞亭豆粥呼沱河麥飯厚意久不報見後漢馮異傳又見袁宏後漢紀五少末句報竇融詔每追念外屬孝景皇帝出自竇氏定王景帝之子朕之所祖昔魏其一言繼統以正長君少君尊奉師傅修成淑德施及子孫此皇太后神靈上天祐漢也從天水來者寫將軍所讓隗囂書痛入骨髓畔臣見之當股栗慚愧忠臣則酸鼻流涕義士則曠若發矇非忠孝愨誠孰能如此豈其德薄者所能克堪囂自知失河西之助族禍將及欲設閒離之說亂惑真心轉相解搆以成其姦又京師百僚不曉國家及將軍本意多能採取虛僞誇誕妄談令忠孝失望傳言乖實毀譽之來皆不徒然不可不思今關東盜賊已定大兵今當悉西將軍其抗厲威武以應期會見後漢竇融傳詔右扶風右扶風修理融父墳塋祠以太牢見後漢竇融傳赦殊死以下詔中都官三輔郡國出繫囚非犯殊死皆一切勿案其罪見徒免為庶民耐罪亡命吏以文除之見後漢光武紀詔群臣群臣奏事無得言聖人見官輯聚珍本東觀漢記薄葬詔世以厚葬為德薄終為鄙至于富者奢僭貧者殫財法令不能禁禮義不能止倉卒乃知其咎其布告天下令知忠臣孝子慈兄悌弟薄葬送終之義見後漢光武紀罷輕車騎士等詔今國有衆軍竝多精勇宜且罷輕車騎士材官樓船士及軍假吏令還復民伍見後漢光武紀日食求言詔吾德薄致災謫見日月戰栗恐懼夫何言哉今方念愆庶消厥咎其令有司各修職任奉遵法度惠茲元元百僚各上封事無有所諱其上書者不得言聖見後漢光武紀舉賢良方正詔比陰陽錯謬日月薄食百姓有過在豫一人大赦天下公卿司隸州牧舉賢良方正各一人遣詣公車朕將覽試焉見後漢光武紀又袁宏後漢紀六禁拘制奴婢下妻詔吏人遭饑亂及為青徐賊所略為奴婢下妻欲去留者恣聽之敢拘制不還以賣人法從事見後漢光武紀詔三公議郊祀漢當郊堯其與卿大夫博士議見續漢祭祀志上詔告隗囂若束手自詣父子相見保無他也高皇帝云橫來大者王小者侯若遂欲為黥布者亦自任也見後漢隗囂傳以河南尹王梁為濟南太守詔梁前將兵征伐衆人稱賢故擢典京師建議開渠為人興利旅力既愆迄無成功百姓怨讟談者歡譁雖蒙寬宥猶執謙退君子成人之美其以梁為濟南太守見後漢王梁傳詔來歙桃花水出船槃皆至郁夷陳倉分部而進見水經渭水上注引東觀漢記詔賜祭遵吏士縑將軍連年距難衆兵即卻復獨按部功勞爛然兵退無宿戒糧食不豫具今乃調度恐力不堪國家知將軍不易亦不遺力今送縑千匹以賜吏士見後漢祭遵傳注引東觀記封竇融為安豐侯詔行河西五郡大將軍涼州牧張掖屬國都尉竇融執志忠孝扶微救危仇疾反虜隗囂率勵五郡精兵羌胡畢集兵不血刃而虜土崩瓦解功既大矣篤意分明斷之不疑吾甚嘉之其以安豐陽泉蓼安風凡四縣封融為安豐侯見官輯本東觀記又藝文類聚五十一引東觀記報竇融求代詔吾與將軍如左右手耳數報謙退何不曉人意勉循士民無擅離部曲見後漢竇融傳追爵諡陰貴人父弟詔吾微賤之時娶于陰氏因將兵征伐遂各別離幸得安全俱脫虎口以貴人有母儀之美宜立為后而固辭弗敢當列于媵妾朕嘉其義讓許封諸弟未及爵土而遭患逢禍母子同命愍傷于懷小雅曰將恐將懼惟豫與汝將安將樂汝轉棄豫風人之戒可不慎乎其追爵諡貴人父陸為宣恩哀侯弟欣為宣義恭侯以弟就嗣哀侯後及尸柩在堂使太中大夫拜授印綬如在國列侯禮魂而有靈嘉其寵榮見後漢光烈陰皇后紀禁殺奴婢詔天地之性人為貴其殺奴婢不得減罪見後漢光武紀敢灸灼奴婢論如律免所灸灼者為庶民見後漢光武紀詔報岑彭大司馬習用步騎不曉水戰荊門之事一由征南公為重而已見後漢岑彭傳又見袁宏後漢紀六原丁邯詔漢中太守妻乃系南鄭獄誰當搔其背垢者懸牛頭賣馬脯盜跖行孔子語以邯服罪且邯一妻冠履勿謝見續漢百官志三注補引決録注免隴蜀民為奴婢者詔隴蜀民被略為奴婢自訟者及獄官未報一切免為庶民見後漢光武紀詔書告吳漢直擁兵到成都據其心腹後城營自解散見官輯本東觀漢記詔書戒吳漢成都十萬餘衆不可輕也且堅據廣都城去之五十里待其即營攻城罷倦引去乃首尾擊之勿與爭鋒述兵不敢來轉營即之移徙輒自堅見官輯本東觀漢記廣都去成都五十里述若來攻待其困敝而攻之勿與爭鋒述若不來轉營逼之彼必堅壁見袁宏後漢紀六成都十餘萬衆不可輕也但堅據廣都待其來攻勿與爭鋒若不敢來公轉營迫之須其力疲乃可擊也見後漢吳漢傳喻公孫述詔往年詔書比下開示恩信勿以來歙岑彭受害自疑今以時自詣則家族完全若迷惑不喻委肉虎口痛哉奈何將帥疲倦吏士思歸不樂久相屯守詔書手記不可數得朕不食言見後漢公孫述傳察舉詔三公舉茂才各一人廉吏各二人光祿歲舉茂才四行各一人察廉吏三人中二千石歲察廉吏各一人廷尉大司農各二人將兵將軍歲察廉吏各二人監察御史司隸州牧歲舉茂才各一人見續漢百官志一注補引漢官目録下詔讓劉尚城降三日吏人從服孩兒老母口以萬數一旦放兵縱火聞之可為酸鼻家有敝帚享之千金尚宗室子孫故嘗更吏職何忍行此仰視天俯視地觀于放麑啜羹之義二者孰仁良失斬將弔人之義也見官輯本東觀漢記又見後漢公孫述傳詔邊吏邊吏力不足戰則守追虜料敵不拘以逗留法見後漢光武紀禁郡國獻異味詔往年敕郡國勿因計吏有所進獻今故未止非徒有勞役道途所過未免煩費已敕太官勿復受其遠方食物乘輿口實可以薦宗廟者即如舊制見袁宏後漢紀七往年已敕郡國異味不得有所獻御今猶未止非徒有豫養導擇之勞至乃煩擾道上疲費過所其令太官勿復受明敕下遠方口實所以薦宗廟自如舊制見後漢光武紀臨弔侯霸詔惟霸積善之德久而益彰清潔之操白首彌厲漢之舊制丞相拜日封為列侯頃以軍旅暴露功臣未受國邑緣忠臣之心不欲先饗其寵故未爵命其追爵諡霸使襲其後見袁宏後漢紀七惟霸積善清潔視事九年漢家舊制丞相拜日封為列侯朕以軍師暴露功臣未封緣忠臣之義不欲相踰未及爵命奄然而終嗚呼哀哉見後漢侯霸傳改長沙王等為侯詔長沙王興真定王得河間王邵中山王茂皆襲爵為王不應經義其以興為臨湘侯得為真定侯邵為樂成侯茂為單父侯見後漢光武紀免益州民為奴婢者詔益州民自八年以來被略為奴婢者皆一切免為庶民或依託為人下妻欲去者恣聽之敢拘留者比青徐二州以略人法從事見後漢光武紀檢核州郡墾田及戶口詔刺史太守多為詐巧不務實核苟以度田為名聚人田中并度廬屋里落聚人遮道啼呼見官輯本東觀漢紀又見後漢光武紀注廢郭后立陰后詔皇后懷執怨懟數違教令不能撫循它子訓長異室宮闈之內若見鷹鸇既無關睢之德而有呂霍之風豈可託以幼孤恭承明祀今遣大司徒涉宗正吉持節其上皇后璽綬陰貴人鄉里良家歸自微賤自我不見于今三年宜奉宗廟為天下母主者詳案舊典時尚尊號異常之事非國休福不得上壽稱慶見後漢光烈陰皇后紀不可以奉供養見續漢五行志六蠲邊郡盜穀罪詔今邊郡盜穀五十斛罪至于死開殘吏妄殺之路其蠲除此法同之內郡見後漢光武紀廟祭詔以宗廟處所未定甘祫祭高廟其成哀平且祠祭長安故高廟其南陽舂陵歲時各且因故園廟祭祀園廟去太守治所遠者在所令長行太守事侍祠惟孝宣帝有功德其上尊號曰中宗見續漢祭祀志下立皇太子詔春秋之義立子以貴東海王陽皇后之子宜承大統皇太子彊崇執謙退願備藩國父子之情重久違之其以彊為東海王立陽為皇太子改名莊見後漢光武紀迎詔竇融勿得讓職日者知公欲讓職還土故命公暑熱且自便今相見且宜論他事勿得復言見後漢書竇融傳又見藝文類聚五十一引東觀漢記又袁宏後漢紀六係此詔于十二年後
