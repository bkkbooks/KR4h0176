body:
  text: 光武帝制詔貰侍御史以陳留督郵虞廷故貰御史罪見後漢虞延傳地震詔制詔曰日者地震南陽尤甚夫地者任物至重靜而不動者也而今震裂咎在君上鬼神不順無德災殃將及吏人朕甚懼焉其令南陽勿輸今年田租芻藁遣謁者案行其死罪繫囚在戊辰以前減死罪一等徒皆弛解鉗衣絲絮賜郡中居人壓死者棺錢人三千其口賦逋稅而廬宅尤破壞者勿收責吏人死亡或在壞垣毀屋之下而家羸弱不能收拾者以見錢穀取傭為尋求之見後漢光武紀除杜喬為丹水長詔公侯子孫必復其始賢者之後宜宰城邑其以喬為丹水長見後漢杜林傳詔增百官俸前以用度不足吏祿薄少今益其俸自三公下至佐使各有差見官輯本東觀漢記營壽陵詔無為山陵陂池裁令流水而已迭興之後亦無丘壟使合古法今日月已逝當豫自作臣子奉承不得有加見官輯本東觀漢記臨平望平陰河水洋洋舟船泛泛善矣夫周公孔子猶不得存安得松喬與之而共遊乎文帝曉終始之義景帝所謂孝子也故遭反覆霸陵獨完非成法耶同上古者帝王之葬皆陶人瓦器木車茅馬使後世之人不知其處太宗識終始之義景帝能述遵孝道遭天下反覆而霸陵獨完受其福豈不美哉今所制地不過二三頃無為山陵陂池裁令流水而已見後漢光武紀下案此與東觀記互有刪節故並録之行禘祫祭詔禘祫之祭不行已久矣三年不為禮禮必壞三年不為樂樂必崩宜據經典詳為其制見後漢張純傳二府去大詔昔契作司徒禹作司空皆無大名其令二府去大見後漢光武紀報臧宮馬武請滅胸奴詔黃石公記曰柔能制剛弱能制強柔者德也剛者賊也弱者仁之助也強者怨之歸也故曰有德之君以所樂樂人無德之君以所樂樂身樂人者其樂長樂身者不久而亡舍近謀遠者勞而無功舍遠謀近者逸而有終逸政多忠臣勞政多亂人故曰務廣地者荒務廣德者強有其有者安貪人有者殘殘滅之政雖成必敗今國無善政災變不息百姓驚惶人不自保而復欲遠事邊外乎孔子曰吾恐季孫之憂不在顓臾且北狄尚強而屯田警備傳聞之事恆多失實誠能舉天下之半以滅大寇豈非至願苟非其時不如息人見後漢臧宮傳減死罪詔死罪繫囚皆一切募下蠶室其女子宮見後漢光武紀減罪詔令天下繫囚自殊死已下及徒各減本罪一等其餘贖罪輸作各有差見後漢光武紀下拒群臣請封禪詔災異連仍日月薄食百姓怨嘆而欲有事于泰山污七十二代編録以羊皮雜貂裘何強顏耶見官輯本東觀漢記即位三十年百姓怨氣滿腹吾誰欺欺夭乎曾謂泰山不如林放何污七十二代之編録桓公欲封管仲非之若郡縣遠遣吏上壽虛稱盛美必髡兼令屯田見續漢祭祀志上詔許梁松等封禪許昔小白欲封夷吾難之季氏欲旅仲尼非焉蓋齊諸侯季氏大夫皆無事于泰山今豫末小子巡祭封禪德薄而任重一則以喜一則以懼喜于得承鴻業帝堯善及子孫之餘賞蓋應圖籙當得是當懼于過差執德不弘信道不篤為議者所誘進後世知吾罪深矣見續漢祭祀志下注引東觀書遣詔朕無益百姓皆知孝文皇帝制度務從約省刺史二千石長吏皆無離城郭無遣吏及因郵奏見後漢光武紀以張況為常山關長詔家人居不足贍且以一縣自養見後漢張禹傳注引東觀記案此詔當在元二年間以王閎子補吏詔武王克殷表商容之閭閎修善謹敕兵起吏民獨不爭其頭首今以閎子補吏見漢書董賢傳賜張堪詔平陽丞李善稱故令范遷于張堪令人面熱汗出其賜堪新繒百匹以表廉吏見御覽三百八十七引東觀記四科取士詔方今選舉賢佞朱紫錯用丞相故事四科取士一曰德行高妙志節清白二曰學通行修經中博士三曰明達法令足以決疑能案章覆問文中御史四曰剛毅多略遭事不惑明足以決才任三輔令皆有孝悌廉公之行自今以後審四科辟召及刺史二千石察茂才尤異孝廉之吏務盡實核選擇英俊賢行廉潔平端于縣邑務授試以職有非其人臨計過署不便習官事書疏不端正不如詔書有司奏罪名並正舉者見續漢百官志一注引漢官儀賜侯將軍詔卿歸田里曷不令妻子從將軍老矣夜臥誰為搔背癢也詔褎牛牢朕幼交牛君真清高士也恆有疾州郡之官者常親到家致意焉見御覽五百八引皇甫謐高士傳拜鄧禹為大司徒策制詔前將軍鄧禹深執忠孝與朕謀謨帷幄決勝千里孔子曰自吾有回門人日親斬將破軍平定山西功效尤著百姓不親五品不訓汝作司徒敬敷五教五教在寬今遣奉車都尉授印綬封為酇侯食邑萬戶敬之哉見後漢鄧禹傳又見袁宏後漢紀三上璽書勞鄧禹云云有刪節封功臣策在上不驕高而不危制節謹度滿而不溢敬之戒之傳爾子孫長為漢藩見後漢光武紀贈來歙策中郎將來歙攻戰連年平定羌隴憂國忘家忠孝章著遭令遇害嗚呼哀哉使太中大夫贈歙中郎將征羌侯印綬諡曰節侯謁者護喪事見後漢來歙傳敕鄧禹司徒堯也亡賊桀也長安吏人遑遑無所依歸宜以時進討鎮慰西京繫百姓之心見後漢鄧禹傳敕諸將賊若東走可引宜陽兵會新安賊若南走可引新安兵會宜陽見後漢劉盆子傳密敕耿純劉揚若見因而收之見後漢耿純傳徵鄧禹還軍敕赤眉無穀自當來東吾折捶笞之非諸將憂也無得復妄進兵見後漢鄧禹傳勒兵堅守慎無與窮寇交鋒老賊疲弊必當束手事吾也以飽待飢以逸擊勞折捶而笞之耳見後漢紀敕馮異三輔遭王莽更始之亂又遇赤眉延岑之弊兵家縱橫百姓塗炭將軍今奉辭討諸不軌兵家降者遣其渠帥皆詣京師散其小民令就農桑壞其營壘無使復衆征伐非在遠戰掠地多得城邑要在平定安集之耳吾諸將非不健鬭然多好虜掠為小民害卿本能檢吏士勉自修整無為郡縣所苦見袁宏後漢光武紀四又見後漢馮異傳有刪節敕蓋延可直往搗郯則蘭陵必自解見後漢蓋延傳敕岑彭書兩城若下便可將兵南擊蜀虜人苦不知足既平隴復望蜀每一發兵頭鬚為白見後漢岑彭傳敕吳漢諸部甲卒俱坐費糧食若有逃亡則沮敗衆心宜悉罷之見後漢吳漢傳璽書勞馮異赤眉破平士吏勞苦始雖垂翅回溪終能奮翼黽池可謂失之東隅收之桑榆方論功賞以答大勳見後漢馮異傳璽書賜竇融制詔行河西五郡大將軍事屬國都尉勞鎮守邊五郡兵馬精強倉庫有蓄民庶殷富外則折挫羌胡內則百姓蒙福威德流聞虛心相望道路隔塞邑邑何已長史所奉書獻馬悉至深知厚意今益州有公孫子陽天水有隗將軍方蜀漢相攻權在將軍舉足左右便有輕重以此言之欲相厚豈有量哉諸事具長史所見將軍所知三者迭興千載一會欲遂立桓文輔微國當勉卒功業欲三分鼎足連衡合從亦宜以時定天下未并吾與爾絶域非相吞之國今之議者必有任囂效尉他制七郡之計王者有分土無分民自適己事而已今以黃金二百斤賜將軍便宜輒言見後漢竇融傳璽書勞馮異制詔大司馬虎牙建威漢中捕虜武威將軍虜兵狠下三輔驚恐栒邑危亡在于旦夕北地營保按兵觀望今偏城獲全虜兵挫折使耿定之屬復念君臣之義征西功若丘山猶自以為不足孟之反奔而殿亦何異哉今遣太中大夫賜征西吏士死傷者醫藥棺斂大司馬已下親弔死問疾以崇謙讓見後漢馮異傳栒邑孤危亡在旦夕諸將狐疑莫有先發將軍獨堅決奇算摧敵殄寇功如丘山猶若不足雖孟反後入無以過也今遣太中大夫齎醫藥殯殮之具以賜吏士其死傷者大司馬已下親弔死問之以崇謙讓見袁宏後漢紀六璽書賜陳俊將軍元勳大著威震青徐兩州有警得專征之見後漢陳俊傳注引華嶠書又見袁宏後漢紀三璽書賜馮異聞吏士精鋭水火不避搆賞之賜必不令將軍負丹青失斷金也見後漢馮異傳注引東觀記璽書賜侯霸崇山幽都何可偶黃鉞一下無處所欲以身試法邪將殺身以成仁邪見後漢馮勤傳報馮異季文多詐人不能得其要領今移其書告守尉當警備者見袁宏後漢紀三馮異奏季秩書王報異報鄧禹縛馮愔者必黃防也見後漢鄧禹傳與朱伯然書交鋒之日神星晝見太白清明見北堂書鈔百五十引東觀漢紀又見御覽五手書報隗囂慕樂德義思相結納昔文王三分猶服事殷但駑馬鉛刀不可強扶數蒙伯樂一顧之價而蒼蠅之飛不過數步即託驥尾得以絶群隔于盜賊聲問不數將軍操執款款扶傾救危南距公孫之兵北禦羌胡之亂是以馮異西征得以數千百人躑躅三輔微將軍之助則咸陽已為他人禽矣今關東寇賊往往屯聚志務廣遠多所不暇未能觀兵成都與子陽角力如令子陽到漢中三輔願因將軍兵馬鼓旗相當儻肯如言蒙天之福即智士計功割地之秋也管子曰生我者父母成我者鮑子自今以後手書相聞勿用傍人解搆之言見後漢隗囂傳讓蓋延間欲先赴郯者以不意故耳今既奔走賊計已立圍豈可解乎見後漢蓋延傳報劉興書欲復進兵恐失其頭首也見聚珍本東觀漢記賜隗囂書昔柴將軍與韓信書云陛下寬仁諸侯雖有亡叛而後歸輒復位號不誅也以囂文吏曉義理故復賜書深言則似不遜略言則事不決今若束手復遣恂弟歸闕庭者則爵祿獲全有浩大之福矣吾年垂四十在兵中十歲厭浮語虛辭即不欲勿報見後漢隗囂傳與公孫述書圖讖言公孫即宣帝也代漢者當塗高君豈高之身邪乃復以掌文為瑞王莽何足效乎君非吾賊臣亂子倉卒時人皆欲為君事耳何足數也君日月已逝妻子弱小當早為定計可以無憂天下神器不可力爭宜留三思見後漢公孫述傳西狩獲麟讖曰乙子卯金即乙未歲授劉氏非西方之守也光廢昌帝立子公孫即霍光廢昌邑王立孝宣帝也黃帝姓公孫自以土德君所知也漢家九百二十歲以蒙孫亡受以丞相其名當塗高高豈君身邪吾自繼祖而興不稱受命求漢之斷莫過王莽近張滿作惡兵圍得之嘆曰為天文所誤恐君復誤也見華陽國志報陳俊東州新平大將軍之功也負海猾夏盜賊之處國家以為重憂且勉鎮撫之見後漢陳俊傳又見袁宏後漢紀三讓吳漢比敕公千條萬端何意臨事勃亂既輕敵深入又與尚別營事有緩急不復相及賊若出兵綴公以大衆攻尚尚破公即敗矣幸無它者急引兵還廣都見後漢吳漢傳報吳漢公還廣都甚得其宜述必不敢略尚而擊公也若先攻尚公從廣都五十里悉步騎赴之適當值其危困破之必矣見後漢吳漢傳迎下鮑永書君晨夜冒犯霜露精神亦已勞矣以君幃幄近臣其以為兗州牧見後漢鮑永傳注引東觀記報鄯善王今使者大兵未能得出如諸國力不從心東西南北自在也見後漢西域莎車傳戒馮勤朱浮上不忠于君下陵轢同列竟以中傷至今死生吉凶未可知豈不惜哉人臣放逐受誅雖復追加賞賜賻祭不足以償不訾之身忠臣孝子覽照前世以為鏡戒能盡忠于國事君無二則爵賞光乎當世功名列于不朽可不勉哉見後漢馮勤傳即位祭告天地文皇天上帝后土神祇眷顧降命屬秀黎元為民父母秀不敢當群下百僚不謀同辭咸曰王莽篡弒竊位秀發憤興義兵破王尋王邑百萬衆于昆陽誅王郎銅馬于河北平定天下海內蒙恩上當天地之心下為元元所歸讖記曰劉秀發兵捕不道卯金修德為天子秀猶固辭至于再至于三群下僉曰皇天大命不可稽留敢不敬承見後漢光武紀續漢祭祀志上告祠高廟遷呂后主高皇帝與群臣約非劉氏不王呂太后賊害三趙專王呂氏賴社稷之靈祿産伏誅天命幾墜危朝更安呂太后不宜配食高廟同祧至尊薄太后母德慈仁孝文皇帝賢明臨國子孫賴福延祚至今其上薄太后尊號曰高皇后配食地祇遷呂太后廟主于園四時二祭見後漢光武紀
