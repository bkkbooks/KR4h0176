body:
  text: 明帝日食下三公制冠履勿劾災異屢見咎在朕躬憂懼遑遑未知其方將有司陳事多所隱諱使君上壅蔽下有不暢乎昔衛有忠臣靈公得守其位今何以和穆陰陽消伏災譴刺史太守詳刑理冤存恤鰥寡孤獨勉思職焉見後漢明紀壽陵制令流水而已石槨廣一丈二尺長二丈五尺無得起墳萬年之後掃地而祭杅水脯糒而已過百日唯四時設奠置吏卒數人供給灑掃勿開修道敢有所興作者以擅議宗廟法從事見後漢明紀告瑞宗廟制天生神物以應王者遠人慕化實由有德朕以虛薄何以享斯唯高祖光武聖德所被不敢有辭其敬舉觴太常擇吉日策告宗廟其賜天下男子爵人二級三老孝悌力田人三級流人無名數欲占者人一級鰥寡孤獨篤癃貧不能自存者粟人三斛郎從官視事十歲以上者帛十匹中二千石二千石下至黃綬貶秩奉贖在去年以來皆還贖見後漢明紀即位恩赦詔豫末小子奉承聖業夙夜震畏不敢荒寧先帝受命中興德侔帝王協和萬邦格于上下懷柔百神惠於鰥寡朕承大運繼體守文不知稼穡之艱難懼有廢失聖恩遺戒顧重天下以元元為首公卿百僚將何以輔朕不逮其賜天下男子爵人二級三老孝弟力田人三級爵過公乘得移與子若同産子及流人無名數欲自占者人一級鰥寡孤獨篤癃粟人十斛其施刑及郡國徒在中元元年四月己卯赦前所犯而後捕繫者悉免其刑又邊人遭亂為內郡人妻在己卯赦前一切遣還邊恣其所樂中二千石下至黃綬貶罪贖論者悉皆復秩還贖方今上無天子下無方伯若涉淵水而無舟楫夫萬乘至重而壯者慮輕實賴有德左右小子高密侯禹元功之首東平王蒼寬博有謀並可以受六尺之託臨大節而不橈其以禹為太傅蒼為驃騎將軍太尉熹告諡南郊司徒欣奉安梓宮司空魴將校復土其封熹為節鄉侯欣為安鄉侯魴為楊邑侯見後漢明紀又略見藝文類聚四十八引東觀漢記以東平王蒼為驃騎將軍詔東平王蒼寬博有謀可以託六尺之孤其以蒼為驃騎將軍見北堂書鈔六十四引續漢書東平王傳明帝詔藝文類聚四十八引東觀漢記六尺之孤下多臨大節而不可奪七字恤燒何豪詔昔桓公伐戎而無仁惠故春秋貶曰齊人今國家無德恩不及遠羸弱何辜而當并命夫長平之暴非帝者之功咎由太守長吏妄加殘戮比銅鉗尚生者所在致醫藥養視令招其種人若欲歸故地者厚遣送之其小種若束手自詣欲效功者皆除其罪若有逆謀為吏所捕而獄狀未斷悉以賜有功者見後漢西羌傳聽贖罪詔方春戒節人以耕桑其敕有司務順時氣使無煩擾天下亡命殊死以下聽得贖論死罪入縑二十匹右趾至髡鉗城旦舂十匹完城旦舂至司寇作三匹其未發覺詔書到先自告者半入贖今選舉不實邪佞未去權門請託殘吏放手百姓愁怨情無告訴有司明奏罪名並正舉者又郡縣每因徵發輕為姦利詭責羸弱先急下貧其務在均平無令枉刻見後漢明紀以吳良為議郎詔前以事見良鬚髮皓然衣冠甚偉夫薦賢助國宰相之職蕭何舉韓信設壇而拜不復考試今以良為議郎見後漢吳良傳又見北堂書鈔五十六引東觀漢記有蕭何已下四句封陰興子弟詔故侍中衛尉關內侯興典領禁兵從平天下當以軍功顯受封爵又諸舅比例應蒙恩澤興皆故讓安乎里巷輔導朕躬有周昌之直在家仁孝有曾閔之行不幸早卒朕甚傷之賢者子孫宜加優異其以汝南之鮦陽封興子慶為鮦陽侯慶弟博為濦強侯博弟員丹並為郎見後漢陰識傳附詔東海王傅相王恭謙好禮以德自終遣送之物務從約省衣足斂形茅車瓦器物減于制以彰王卓爾獨行之志將作大匠留起陵廟見後漢東海王強傳又略見袁宏後漢紀九詔驃騎將軍三公今令月吉日宗祀光武皇帝于明堂以配五帝禮備法物樂和八音詠祉福舞功德其班時令敕群后事畢升靈臺望元氣吹時律觀物變群僚藩輔宗室子孫衆郡奉計百蠻貢職烏桓濊貊咸來助祭單于侍子骨都侯亦皆陪位斯固聖祖功德之所致也朕以暗陋奉承大業親執圭璧恭祀天地仰惟先帝受命中興撥亂反正以寧天下封泰山建明堂立辟雍起靈臺恢弘大道被之八極而胤子無成康之質群臣無呂旦之謀盥洗進爵踧踖惟慚素性頑鄙臨事益懼故君子坦蕩蕩小人長戚戚其令天下自殊死已下謀反大逆皆赦除之百僚師尹其勉修厥職順行時令敬若昊天以綏兆人見後漢明紀幸辟雍行養老禮詔光武皇帝建三朝之禮而未及臨饗眇眇小子屬當聖業間暮春吉辰初行大射今月元日復踐辟雍尊事三老兄事五更安車軟輪供綏執授侯王設醬公卿饌珍朕親袒割執爵而酳祝哽在前祝噎在後升歌鹿鳴下管新宮八佾具修萬舞于庭朕固薄德何以克當易陳負乘詩刺彼己永念慚疚無忘厥心三老李躬年耆學明五更桓榮授朕尚書詩曰無德不報無言不酬其賜榮爵關內侯食邑五千戶三老五更皆以二千石祿養終厥身其賜天下三老酒人一石肉四十斤有司其存耆耋恤幼孤惠鰥寡稱朕意焉見後漢明紀又略見袁宏後漢紀又文選東京賦注引東觀漢記勸農詳刑詔朕奉郊祀登靈臺見史官正儀度夫春者歲之始也始得其正則三時有成比者水旱不節邊人食寡政失于上人受其咎有司其勉順時氣勸督農桑去其螟蜮以及蝥賊詳刑慎罰明察單辭夙夜匪懈以稱朕意見後漢明帝紀報鍾離意止作北宮詔湯引六事咎在一人其冠履勿謝比上天降旱密雲數會朕戚然慚懼思獲嘉應故分布禱請窺侯風雲北祈明堂南設雩場今又敕大匠止作諸宮減省不急庶消災譴見後漢鍾離意傳報東平王蒼議世祖廟樂舞詔驃騎將軍議可進武德之舞如故見續漢祭祀志下注補引東觀書下詔改樂名樂官尚書璇璣鈐曰有帝漢出德洽作樂名太豫今且改郊廟樂曰太豫樂太樂官曰太豫樂官以應圖纖樂詩曲操以俟君子見文選東都賦注引東觀漢記又見後漢曹褎傳合録之日食求言詔朕奉承祖業無有善政日月薄蝕彗孛見天水旱不節稼穡不成人無宿儲下生愁蟄雖夙夜勤思而智能不逮昔楚莊無災以致戒懼魯哀禍大天不降譴今之動變儻尚可救有司勉思厥職以匡無德古者卿士獻詩百工針諫其言事者靡有所諱見後漢明帝紀以薑詩為郎中詔大孝入朝凡諸舉者一聽平之見後漢列女羌詩妻傳得雨勞公卿詔朕親耕藉田以祈農事京師冬無宿雪春不燠沐煩勞群司積精禱求而比再得時雨宿麥潤澤其賜公卿半奉有司勉遵時政務平刑罰見後漢明帝紀聽東平王蒼歸藩詔東平王比上書願歸藩上將軍印綬謙讓日聞至誠懇惻蓋君子成人之美今其聽焉以驃騎長史為東平王太傅掾吏為中大夫令史為王家郎勿上將軍印綬見袁宏後漢紀九賜執金吾馮魴詔復道多風寒左右老人且病痱多取帷帳東西完塞窗皆令緻密見御覽七百四十二引東觀漢記復元氏縣田租詔豐沛濟陽受命所由加恩報德適其宜也今永平之政百姓怨結而吏人求復令人愧笑重逆此縣之拳拳其復元氏縣田租更賦六歲勞賜縣掾史及門闌走卒見後漢明帝紀獲寶鼎詔昔禹收九牧之金鑄鼎以象物使人知神姦不逢惡氣遭德則興遷于商周周德既衰鼎乃淪亡祥瑞之降以應有德方今政化多僻何以致茲易曰鼎象三公豈公卿奉職得其理邪太常其以礿祭之日陳鼎于廟以備器用賜三公帛五十匹九卿二千石半之先帝詔書禁人上事言聖而間者章奏頗多浮詞自今若有過稱虛譽尚書皆宜抑而不省示不為諂子蚩也見後漢明帝紀陰太后晏駕詔柩將發于殿群臣百官陪位黃門鼓吹三通鳴鐘鼓天子舉哀女侍史官三百人皆著素參以白素引棺挽歌下殿就車黃門宦者引以出宮省太后魂車鸞路青羽蓋駟馬龍旗九旒前有方相鳳凰車大將軍妻參乘太僕妻御悉道公卿百官如天子郊鹵簿儀見續漢禮儀志下注引丁孚漢儀臨雍禮畢詔三公募郡國中都官死罪繫囚減罪一等勿笞詣度遼將軍營屯朔方五原之邊縣妻子自隨便占著邊縣父母同産欲相代者恣聽之其大逆無道殊死者一切募下蠶室亡命者令贖罪各有差凡徙者賜弓弩衣糧見後漢明紀日食求言詔朕以無德奉承大業而下貽人怨上動三光日食之變其災尤大春秋圖讖所謂至譴永思厥咎在子一人群司勉修職事極言無諱見後漢明帝紀班示封事詔群僚所言皆朕之過人冤不能理吏黠不能禁而輕用人力繕修宮宇出入無節喜怒過差昔應門失守關睢刺世飛蓬隨風微子所嘆永覽前戒竦然競懼徒恐薄德久而怠致耳見後漢明帝紀報楚王英詔楚王誦黃老之微言尚浮屠之仁祠潔齋三月與神為誓何嫌何疑當有悔吝其還贖以助伊蒲塞桑門之盛饌見後漢楚王英傳又袁宏後漢紀十詔恤徙邊者妻子郡國死罪囚減罪與妻子詣五原朔方占著所在死者皆賜妻父若男同産一人復終身其妻無父兄獨有母者賜其母錢六萬又復其口算見後漢明紀詔恤貧民郡國以公田賜貧人各有差見後漢明紀赦廣陵王荊詔荊數年之間大罪二矣其赦荊罪不得臣其吏民見袁宏後漢紀十大赦詔昔歲五穀登衍今茲蠶麥善收其大赦天下方盛夏長養之時蕩滌宿惡以報農功百姓勉務桑稼以備災害吏敬厥職無令愆惰見後漢明紀手詔東平王國傅辭別之後獨坐不樂因就車歸伏軾而吟瞻望永懷實勞我心誦及采菽以增歎息日者問東平王處家何等最樂王言為善最樂其言甚大副是要腹矣今送列侯印十九枚諸王子年五歲已上能趨拜者皆令帶之見後漢東平憲王蒼傳申明科禁詔昔曾閔奉親竭歡致養仲尼葬子有棺無槨喪貴致哀禮存寧儉今百姓送終之制競為奢靡生者無擔石之儲而財力盡于墳土伏臘無糟粳而牲牢兼于一奠糜破積世之業以供終朝之費子孫飢寒絶命于此豈祖考之意哉又車服制度恣極耳目田荒不耕遊食者衆有司其申明科禁宜于今者宣下郡國見後漢明紀巡行汴渠詔自汴渠決敗六十餘歲加頃年以來雨水不時汴流東侵日月益甚水門故處皆在河中漭漾廣溢莫測圻岸蕩蕩極望不知綱紀今兗豫之人多被水患乃云縣官不先人急好興它役又或以為河流入汴幽冀蒙利故曰左隄強則右隄傷左右俱強則下方傷宜任水勢所之使人隨高而處公家息壅塞之費百姓無陷溺之患議者不同南北異論朕不知所從久而不決今既築隄理渠絶水立門河汴分流復其舊迹陶丘之北漸就壤墳故薦嘉玉潔牲以禮河神東過洛汭歎禹之績今五土之宜反其正色濱渠下田賦與貧人無令豪右得固其利庶繼世宗瓠子之作見後漢明紀還馮魴爵士詔執金吾魴侍衛歷年數進忠言其還爵土封為楊邑侯見袁宏後漢紀又玉海引東觀漢記制詔許太后國家始聞楚事幸其不然既知審實懷用悼灼庶欲宥全王身令保卒天年而王不念顧太后竟不自免此天命也無可奈何太后其保養幼弱免強飲食諸許願王富貴人情也已詔有司出其有謀者令安田宅見後漢楚王英傳贖罪詔亡命自殊死以下贖死罪縑四十匹右趾至髡鉗城旦舂十匹完城旦至司寇作五匹犯罪未發覺詔書到日自告者半入贖見後漢明紀按驗郰令詔朕自治京師尚不能攘蝗郰令何人而令消弭遣按驗之詔竇固吏如班超何故不遣而更選乎今以超為軍司馬令遂前功見後漢班超傳罪人徙邊詔令郡國中都官死罪繫囚減死罪一等勿笞詣軍營屯朔方敦煌妻子自隨父母同産欲求從者恣聽之女子嫁為人妻勿與俱謀反大逆無道不用此書見後漢明紀詔班固司馬遷著書成一家之言揚名後世至以身陷刑之故反微文刺譏貶損當世非誼士也司馬相如汙行無節但有浮華之詞不周于用至于疾病而遺忠主上求取其書竟得頌述功德言封禪事忠臣效也至是賢遷遠矣見文選典引序贖刑詔其令天下亡命自殊死已下贖死罪縑三十匹右趾至髡鉗城旦舂十匹完城旦至司寇作五匹吏人犯罪未發覺詔書到自告者半入贖見後漢明紀禱雨詔自春已來時雨不降宿麥傷旱秋種未下政失厥中憂懼而已其賜天下男子爵人二級及流民無名數欲占者人一級鰥寡孤獨篤癃貧不能自存者粟人三斛理冤獄録輕繫二千石分禱五嶽四瀆郡界有名山大川能興雲致雨者長吏各潔齋禱請冀蒙嘉澍見後漢明紀詔尚書蓋古之納言出納朕命機事不密則害成可不慎歟見御覽二百十二引漢官儀謁者乃堯之尊官所以試舜賓于四門四門穆穆者也昔燕太子使荊軻劫秦王變起兩楹之間其後謁者持匕首刺腋高祖偃武行文故易之以板見續漢百官志二注引荀綽晉百官表注遺詔遵儉無起寢廟藏主于世祖廟更衣見續漢祭祀志下無起寢廟藏主于光烈皇后更衣別室見後漢明紀以鄧禹為太傅策高密侯鄧禹元功之首其以禹為太傅見北堂書鈔五十二引漢官儀明帝甲辰策書計令司隸校尉部刺史歲上墨綬長吏視事三歲已上理狀尤異者各一人與計偕上及尤不政理者亦以聞見後漢明紀徙罪人令令武威張掖酒泉敦煌及張掖屬國繫囚右趾已下任兵者皆一切勿治其罪詣軍營見後漢明紀報少傅桓榮書陽以童蒙承訓九載不深達師意而猥見褒獎非其實也夫五經之道廣大非天下之至精其孰能與于此自宰豫之徒親事孔門間邪以度猶尚怠懈晝寢況于不才者乎苟非其人道不虛受冉求曰非不説子之道力不足者歸道受謝非所敢聞見袁宏後漢紀八莊以童蒙學道九載而典訓不明無所曉識夫五經廣大聖言幽遠非天下之至精豈能與于此況以不才敢承誨命昔之先師謝弟子者有矣上則通達經旨分明章句下則去家慕鄉求謝師門今蒙下列不敢有辭願君慎疾加餐重愛玉體見後漢桓榮傳案此與袁宏紀各有刪節報中山王焉凡諸侯出境必備左右故夾谷之會司馬以從今五國各官騎百人稱娖前行皆北軍胡騎便兵善射弓不空發中必決眥夫有文事必有武備所以重蕃職也王其勿辭見後漢中山簡王焉傳書版生非太公豫亦非文王也見聚珍本東觀漢記
