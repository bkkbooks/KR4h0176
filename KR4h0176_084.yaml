body:
  text: 章帝以趙熹為太傅牟融為太尉詔朕以眇身託于王侯之上統理萬機懼失厥中兢兢業業未知所濟深惟守文之主必建師傅之官詩不云乎不愆不忘率由舊章行太尉事節鄉侯熹五世在位為國元老司空融典職六年勤勞不怠其以熹為太傅融為太尉並録尚書事三事大夫莫肯夙夜小雅之所傷也豫違汝弼汝無面從股肱之正義也群后百僚勉思厥職各貢忠誠以輔不逮申敕四方稱朕意焉見後漢章紀又見藝文類聚四十六引東觀漢記又四十八御覽二百七二百十引漢官儀日蝕求言詔朕以眇年奉承宗祖不能聿修洪業以致災眚思惟厥咎在豫一人又群司百僚其勉修所職各言其上封事靡有所諱見袁宏後漢紀十下詔告平陵令丞告平陵令丞縣人故雲陽令朱勃建武中以伏波將軍爵土不傳上書陳狀不顧罪戾懷旌善之志有烈士之風詩云無言不讎無德不報其以縣見穀二千斛賜勃子若孫勿令遠詣闕謝見後漢馬援傳注引東觀記報張酺辭典郡詔經云身雖在外乃心不離王室典城臨民益所以報效也好醜必上不在遠近今賜裝錢三十萬其亟之官見後漢張酺傳實核受廩詔詔三州郡國方春東作恐人稍受廩往來煩劇或妨耕農其各實核尤貧者計所貸並與之流人欲歸本者郡縣其實廩令足還到聽過止官亭無雇舍宿長吏親躬無使貧弱遺脫小吏豪右得容姦妄詔書既下勿得稽留刺史明加督察尤無狀者見後漢章紀東作緩刑詔比年牛多疾疫墾田減少穀價頗貴人以流亡方春東作宜及時務二千石勉勸農桑弘致勞來群公庶尹各推精誠專急人事罪非殊死須立秋案驗有司明慎選舉進柔良退貪猾順時令理冤獄五教在寬帝典所美愷悌君子大雅所歎布告天下使明知朕意見後漢章紀又見袁宏後漢紀十一與此小異地震舉賢良方正詔朕以無德奉承大業夙夜栗栗不敢荒寧而災異仍見與政相應朕既不明涉道日寡又選舉乖實俗吏傷人官職耗亂刑罰不中可不憂與昔仲弓季氏之家臣子遊武城之小宰孔子猶誨以賢才問以得人明政無大小以得人為本夫鄉舉里選必纍功勞今刺史守相不明真偽茂才孝廉歲以百數既非能顯而當授之政事甚無謂也每尋前世舉人貢士或起甽畝不繫閥閲敷奏以言則文章可採明試以功則政有異迹文質彬彬朕甚嘉之其令太傅三公中二千石二千石郡國守相舉賢良方正能直言極諫之士各一人見後漢章紀封賈復子邯陰興子員詔蓋褒德賞功興亡繼絶所以昭孝事親以旌善人故仁不遺德義不遺勞先王之令典也故特進膠東侯賈復佐命河北列在元功衛尉陰興忠貞愛國先帝休之今興子博復孫敏頑凶失道自陷刑以喪爵土朕甚憐之其封復子邯為膠東侯興子員為濦強侯見袁宏後漢紀十一貶阜陵王延詔王前犯大逆罪惡尤深有同周之管蔡漢之淮南經有正義律有明刑先帝不忍親親之恩枉屈大法為王受愆群下莫不惑焉今王曾莫悔悟悖心不移逆謀內潰自子魴發誠非本朝之所樂聞朕惻然傷心不忍致王于理今貶爵為阜陵侯食一縣獲斯辜者侯自取焉於戲誡哉見後漢阜陵質王延傳舉察奢僭詔比年陰陽不調飢饉屢臻深惟先帝憂人之本詔書曰不傷財不害人誠欲元元去末歸本而今貴戚近親奢縱無度嫁娶送終尤為僭侈有司廢典莫肯舉察春秋之義以貴理賤今自三公並宜明糾非法宣振威風朕在弱冠未知稼穡之艱難區區管窺豈能照一隅哉其科條制度所宜施行在事者備為之禁先京師而後諸夏見後漢章紀切責竇憲詔深思前過奪主田園時何用愈趙高指鹿為馬久念使人驚怖昔永平中常令陰黨陰博鄧疊三人更相糾察故諸豪戚莫敢犯法者而詔書切切猶以舅氏田宅為言今貴主尚見枉奪何況小人哉國家棄憲如孤雛腐鼠耳見後漢竇憲傳又見袁宏後漢紀十一有刪節詔賜賈貴人賈貴人者奉侍先帝劬勞帷幄建初之後以至親供養長樂宮昏定晨省夙夜匪懈今賜貴人王赤綬安車一駟永巷宮人二百御府雜帛二萬匹大司農黃金千斤錢二千萬朕既早離皇太后幸復承子道中心依依昊天罔極見袁宏後漢紀十一使諸儒共正經義詔蓋三代導人教學為本漢承暴秦褎顯儒術建立五經為置博士其後學者精進雖曰承師亦別名家孝宣皇帝以為去聖久遠學不厭博故遂立大小夏侯尚書後又立京氏易至建武中復置顏氏嚴氏春秋大小戴禮博士此皆所以扶進微學尊廣道藝也中元元年詔書五經章句煩多議欲減省至永平元年長水校尉倏奏言先帝大業當以時施行欲使諸儒共正經義頗令學者得以自助孔子曰學之不講是吾憂也又曰博學而篤志切問而近思仁在其中矣於戲其勉之哉見後漢章紀日食舉直言極諫詔朕新離供養愆咎衆著上天降異大變隨之詩不云乎亦孔之醜又久旱傷麥憂心慘切公卿已下其舉直言極諫能指朕過失者各一人遣詣公車將親覽問焉其以巖穴為先勿取浮華見後漢章紀又見袁宏後漢紀十一禱雨詔春秋書無麥苗重之也去秋雨澤不適今時復旱如炎如焚凶年無時而為備未至朕之不德上纍三光震栗忉忉痛心疾首前代聖君博思咨諏雖降災咎輒有開匱反風之應令豫小子徒慘慘而已其令二千石理冤獄録輕繫禱五嶽四瀆及名山能興雲致雨者冀蒙不崇朝遍雨天下之報務加肅敬焉見後漢章紀糾舉獄吏詔孔子曰刑罰不中則人無所措手足今吏多不良擅行喜怒或案不以罪迫脅無辜致令自殺者一歲且多于斷獄甚非為人父母之意也有司其議糾舉之見後漢章紀以直士補任外官詔朕思遲直士側席異聞其先至者各以發憤吐悶略聞子大夫之志矣皆欲置于左右顧問省納建武詔書又曰堯試臣以職不直以言語筆札今外官多曠並可以補任見後漢章紀沛濟南等四王勿名詔禮云伯父歸寧乃國詩云叔父建爾元子敬之至也昔蕭相國加以不名優忠賢也況兼親尊者乎其沛濟南東平中山四王讚皆勿名見後漢東平憲王蒼傳廢太子慶立子肇詔皇太子有失惑無常之性爰自孩乳至今益章恐襲其母凶惡之風不可以奉宗廟為天下主大義滅親況降退乎今廢慶為清河王皇子肇保育皇后承訓懷衽導達善性將成其器蓋庶子慈母尚有終身之恩豈若嫡后事正義明哉今以肇為皇太子見後漢清河孝王慶傳賜公卿助祭錢詔書云祖考來假明哲之祀豫末小子質又菲薄仰惟先帝蒸蒸之情前修禘祭以盡孝敬朕得識昭穆之序寄遠祖之思今年大禮復舉加以先帝之坐悲傷感懷樂以迎來哀以送往雖祭亡如在而空虛不知所裁庶或饗之豈亡克慎肅雍之臣辟公之相皆助朕之依依今賜公錢四十萬卿半之及百官執事各有差見後漢章紀手詔賜東平王蒼骨肉天性誠不以遠近為親疏然數見顏色情重惜時念王久勞思得還休欲署大鴻臚奏不忍下筆顧授小黃門中心戀戀惻然不能言見後漢東平王蒼傳又見袁宏後漢紀十一有刪節行秋稼詔車駕行秋稼觀收穫因涉郡界皆精騎輕行無它輜重不得輒修橋道遠離城郭遣吏逢迎刺探起居出入前後以為煩擾動務省約但患不能脫粟瓢飲耳所過欲令貧弱有利無違詔書見後漢章紀減刑詔天下繫囚減死一等勿笞詣邊戍妻子自隨占著所在父母同産欲相從者恣聽之有不到者皆以乏軍興論及犯殊死一切募下蠶室其女子宮繫囚鬼薪白粲已上皆減本罪各一等輸司寇作亡命贖死罪入縑二十四匹右趾至髡鉗城旦舂十匹完城旦至司寇三匹吏人有罪未發覺詔書到自告者半入贖見後漢章紀詔敕荊州刺史謝夷吾敕荊州刺史入傳録見囚徒見長吏勿廢舊儀朕將覽焉見後漢謝夷吾傳注引謝承書御覽六百三十九引會稽典録得銅器又獲白鹿詔上無明天子下無賢方伯人之無良相怨一方斯器亦曷為來哉見後漢章紀令馬光就國詔舅氏一門俱就國封四時陵廟無助祭先后者朕甚傷之其令許侯思僭田廬有司勿復請以慰朕渭陽之情見後漢馬防傳切責李邑縱超擁愛妻抱愛子思歸之士千餘人何能盡與超同心乎見後漢班超傳詔班超若邑任在外者便留與從事見後漢班超傳東巡過災縣詔陳留災縣其名不善高祖鄙柏人之邑世宗休聞喜而顯獲嘉應亨吉元符嘉皇靈之顧賜越有光列考武皇其改災縣曰考城見水經汳水注令選高才生受古學詔五經剖判去聖彌遠章句遺辭乖疑難正恐先師微言將遂廢絶非所以重稽古求道真也其令群儒選高才生受學左氏穀梁春秋古文尚書毛詩以扶微學廣異義焉見後漢章紀又見袁宏後漢紀十二有小異四科取士詔辟士四科其一曰德行高妙志節清白二曰經明行修能任博士三曰明曉法律足以決疑能案章覆問才文任御史四曰剛毅多略遭事不惑明足照姦勇足決斷才任三輔令皆存孝悌清公之行自今以後審四科辟召及刺史二千石察舉茂才尤異孝廉吏務實校試以職有非其人不習曹事正舉者故不以實法也見後漢和帝紀注御覽六百二十八並引漢官儀勉勵邵訓詔陳留太守講授省中六年于茲經術明篤有匡生解頤之風賜錢三十萬及刀劍衣服居家之具見御覽二百六十二引邵氏家傳給流民公田詔王者八政以食為本故古者急耕稼之業致耒耜之勤節用儲蓄以備凶災是以歲雖不登而人無飢色自牛疫以來穀食連少良由吏教未至刺史二千石不以為負其令郡國募人無田欲徙它界就肥饒者恣聽之到在所賜給公田為雇耕傭賃種餉貰與田器勿收租五歲除算三年其後欲還本鄉者勿禁見後漢章紀禁酷刑詔律云掠者唯得榜笞立又令丙箠長短有數自往者大獄已來掠考多酷鉆鑽之屬慘苦無極念其痛毒怵然動心書曰鞭作官刑豈云若此宜及秋冬理獄明為其禁見後漢章紀改元元和詔朕道化不德吏政失和元元未諭抵罪于下寇賊爭心不息邊野邑屋不修永惟庶事思稽厥衷與凡百君子共弘斯道中心悠悠將何以寄其改建初九年為元和元年郡國中都官繫囚減死一等勿笞詣邊縣妻子自隨占著在所其犯殊死一切募下蠶室其女子宮繫囚鬼薪白粲以上皆減本罪一等輸司寇作亡命者贖各有差見後漢章紀蠲除禁錮詔書云父不慈子不祗兄不友弟不恭不相及也往者妖言大獄所及廣遠一人犯罪禁至三屬莫得垂纓士宦王朝如有賢才而沒齒無用朕甚憐之非所謂與之更始也諸以前妖惡禁錮者一皆蠲除之以明棄咎之路但不得在宿衛而已見後漢章紀審試嚴崇子宣詔崇子學審曉律別其族協其聲者審試不得依託父學以聾為聰聲微妙獨非莫知獨是莫曉以律錯吹能知命十二律其中不失一乃為能傳崇學耳見續漢律曆志上又晉律曆志六宋書曆志一召嚴宣補學官主調樂器詔嵩子學審曉律別其族協其聲者審試不得依託父學以聾為聰聲微妙獨非莫知獨是莫曉以律錯吹能知命十二律其二中不失一乃為能傳嵩學耳見晉律曆志六詔告廬江太守東平相議郎鄭均束修安貧恭儉節整前在機密以病致仕守善貞固黃髮不怠又前安邑令毛義躬履遜讓比徵辭病淳潔之風東州稱仁書不云乎章厥有常吉哉其賜均義穀各千斛常以八月長吏存問賜羊酒顯茲異行見後漢鄭均傳産子復勿算詔令云人有産子者復勿算三歲今諸懷妊者賜胎養穀人三斛復其夫勿算一歲著以為令見後漢章紀
