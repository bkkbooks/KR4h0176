body:
  text: 章帝詔三公方春生養萬物莩甲宜助萌陽以育時物其令有司罪非殊死且勿案驗及吏人條書相告不得聽受冀以息事寧人敬奉天氣立秋如故夫俗吏矯飾外貌似是而非揆之人事則悅耳論之陰陽則傷化朕甚饜之甚苦之安靜之吏悃愊無華日計不足月計有餘如襄城令劉方吏人同聲謂之不煩雖未有它異斯亦殆近之矣間敕二千石各尚寬明而今富姦行賂于下貪吏枉法于上使有罪不論而無過被刑甚大逆也夫以苛為察以刻為明以輕為德以重為威四者或興則下有怨心吾詔書數下冠蓋接道而吏不加理人或失職其咎安在勉思舊令稱朕意焉見後漢章紀改行四分曆詔朕聞古先聖王先天而天不違後天而奉天時河圖曰赤九會昌十世以光十一以興又曰九名之世帝行德封刻政朕以不德奉承大業夙夜祗畏不敢荒寧豫末小子託在于數終曷以纘興崇弘祖宗拯濟元元尚書琁璣鈐曰述堯理世平制禮樂放唐之文帝命驗曰順堯考德題期立象且三五步驟優劣殊軌況子頑陋無以克堪雖欲從之末由也已每見圖書中心恧焉間者以來政治不得陰陽不和災異不息癘疫之氣流傷于牛農本不播夫庶徵休咎五事之應咸在朕躬信有闕矣將何以補之書曰惟先假王正厥事又曰歲二月東巡狩至岱宗柴望秩于山川遂覲東后叶時月正日祖堯岱宗同律度量考在璣衡以正曆象庶乎有益春秋保乾圖曰三百年斗曆改憲史官用太初鄧平術有餘分一在三百年之域行度轉差浸以謬錯琁璣不正文象不稽冬至之日日在斗二十二度而曆以為牽牛中星先立春一日則四分數之立春日也而以折獄斷大刑于氣已忤用望平和隨時之義蓋亦遠矣今改行四分以遵于堯以順孔聖奉天之文冀百君子越有民同心敬授儻獲咸熙以明豫祖之遺功見續漢律曆志中又蔡雍曆議宋書曆志一又文選永明九年策秀才文注引續漢書增修群祀詔經稱秩元祀咸秩無文祭法功施于民則祀之以死勤事則祀之以勞定國則祀之能禦大災則祀之以日月星辰民所瞻仰也山林川谷丘陵民所取財用也非此族也不在祀典傳曰聖王先成民而後致力于神又曰山川之神則水旱癘疫之災于是乎禜之日月星辰之神則雪霜風雨之不時于是乎禜之孝文十二年令曰比年五穀不登欲有以增諸神之祀王制曰山川神祇有不舉者為不敬今恐山川百神應典禮者尚未盡秩其議增修郡祀宜享祀者以祈豐年以致嘉福以蕃兆民詩不云乎懷柔百神及河喬嶽有年報功不私幸望豈嫌同辭其義一焉見續漢祭祀志中注引東觀書又略見後漢章帝紀又蔡雍傳注賜三老等帛詔三老尊年也孝悌淑行也力田勤勞也國家甚休之其賜帛人一匹勉率農功見後漢章紀東巡大赦詔朕巡狩岱宗柴望山川告祠明堂以章先勳其二王之後先聖之胤東后蕃衛伯父伯兄仲叔季弟幼子童孫百僚從臣宗室衆子要荒四裔沙漠之北蔥領之西冒耐之類跋涉懸度陵踐阻絶駿奔郊畤咸來助祭祖宗功德延及朕躬豫一人空虛多疚纂承尊明盥洗享薦慚愧祗栗詩不云乎君子如祉亂庶遄已曆數既從靈耀著明亦欲與士大夫同心自新其大赦天下諸犯罪不當得赦者皆除之復博奉高嬴無出今年田租芻稿見後漢章紀巡幸詔惟巡狩之制以宣聲教考同遐邇解釋怨結見初學記十三東巡還告祠高廟下詔乃者鳳皇黃龍鸞鳥比集七郡或一郡再見及白烏神雀甘露屢臻祖宗舊事或班恩施其賜天下吏爵人三級高年鰥寡孤獨帛人一匹經曰無侮鰥寡惠此煢獨加賜河南女子百戶牛酒令天下大酺五日賜公卿已下錢帛各有差及雒陽人當酺者布戶一匹城外三戶共一匹賜博士員弟子見在太學者布人三匹令郡國上明經者口十萬以上五人不滿十萬三人見後漢章紀又略見袁宏後漢紀十二冬至後不報囚詔春秋于春每月書王者重三正慎三微也律十二月立春不以報囚月令冬至之後有順陽助生之文而無鞠獄斷刑之政朕咨訪儒雅稽之典籍以為王者生殺宜順時氣其定律無以十一月十二月報囚見後漢章紀鳳皇黃龍見下詔鳳皇黃龍所見亭部無出二年租賦加賜男子爵人二級先見者帛二十匹近者三匹太守三十匹令長十五匹丞尉半之詩云雖無德與汝式歌且舞它如賜爵故事見後漢章紀又略見袁宏後漢紀十二並于五月丙戍詔定禮樂詔余末小子托于君位曷以恢崇仁濟天下三代推益優劣殊軌況于頑陋無以易民視聽雖欲從之末由也已見袁宏後漢紀十二詔報袁安久議沈滯各有所志蓋事以議從策由衆定誾誾衎衎得禮之容寢默抑心更非朝廷之福君何尤而深謝其各冠履見後漢袁安傳還北單于南部生口詔昔玁狁獯粥之敵中國其所由來尚矣往者雖有和親之名終無絲發之效墝埆之人屢嬰塗炭父戰于前子死于後弱女乘于亭障孤兒號于道路老母寡妻設虛祭飲泣淚想望歸魂于沙漠之表豈不哀哉傳曰江海所以能長百川者以其下之也少加屈下尚何足病況今與胸奴君臣分定辭順約明貢獻纍至豈宜違信自受其曲其敕度遼及領中郎將龐奮倍雇南部所得生口以還北虜其南部斬首獲生計功受賞如常科見後漢南胸奴傳稟給幼孤詔蓋人君者視民如父母有憯怛之憂有中和之教匍匐之救其嬰兒無父母親屬及有子不能養食者稟給如律見後漢章紀北巡告常山等郡守相朕惟巡狩之制以宣聲教考同遐邇解釋結冤也今四國無政不用其良駕言出遊欲親知其劇易前祠園陵遂望祀華霍東祡岱宗為人祈福今將禮常山遂徂北土歷魏郡經平原升踐隄防詢訪耆老咸曰往者汴門未作深者成淵淺則泥塗追惟先帝勤人之德底績遠圖復禹弘業聖迹滂流至于海表不克堂構朕甚慚焉月令孟春善相丘陵土地所宜今肥田尚多未有墾闢其悉以賦貧民給與糧種務盡地力勿令遊手所過縣邑聽半入今年田租以勸農夫之勞見後漢章紀議定禮樂詔朕以不德膺祖宗弘烈乃者鸞鳳仍集麟龍並臻甘露宵降嘉穀滋生赤草之類紀于史官朕夙夜祗畏上無以彰于先功下無以克稱靈物漢遭秦餘禮壞樂崩且因循故事未可觀省有知其説者各盡所能見後漢曹褎傳又見袁宏後漢紀十二報朱暉詔補公家之闕不纍清白之素斯善美之士也俗吏苟合阿意面從進無謇謇之志卻無退思之念患之甚久惟今所言適我願也生其勉之見後漢朱暉傳制詔齊相諫議大夫江革前以病歸今起居何如何夫孝百行之本衆善之始也國家每惟忠孝之士未嘗不及革也縣以見穀千斛賜巨孝常以八月長吏存問致羊一頭酒二斛以終厥身以顯異行如有不幸祠以中牢見袁宏後漢紀十一後漢江革傳改元章和詔朕聞明君之德啓迪鴻化緝熙康乂光照六幽訖惟人面靡不率俾仁風翔于海表威霆行乎鬼區然後敬恭明祀膺五福之慶獲來儀之貺朕以不德受祖宗弘烈乃者鳳皇仍集麒麟並臻甘露宵降嘉穀滋生芝草之類歲月不絶朕夙夜祗畏上天無以彰于先功今改元和四年為章和元年秋令是月養衰老授几杖行糜粥飲食其賜高年二人共布帛各一匹以為醴酪死罪囚犯法在丙子赦前而後捕繫者皆減死勿笞詣金城戍見後漢章紀減刑詔郡國中都官繫囚減死罪一等詣金城戍犯殊死者一切募下蠶室其女子宮繫囚鬼薪白粲已上減罪一等輸司寇作亡命者贖罪死縑二十匹右趾至髡鉗城旦舂七匹完城旦至司寇三匹吏民犯罪未發覺詔書到自告者半入贖見後漢章紀復阜陵侯王爵詔昔周之爵封千有八百而姬姓居半者所以楨幹王室也朕南巡望淮海意在阜陵遂與侯相見侯志意衰落形體非故瞻省懷感以喜以悲今復侯為阜陵王增封四縣并前為五縣以阜陵下濕徙都壽春加賜錢千萬布萬匹安車一乘夫人諸子賞賜各有差見後漢阜陵王延傳又見袁宏後漢紀十二有刪節下詔貶削齊王晃等朕聞人君正屏有所不聽宗尊為小君宮衛周備出有輜軿之飾入有牖戶之固殆不至如譖者之言晃剛愆乎至行濁乎大倫甫刑三千莫大不孝朕不忍置之于理其貶晃爵為蕪湖侯削剛戶三千於戲小子不勗大道控于法理以墮宗緒其遣謁者收冕及太姬璽綬見後漢齊武王縯傳特詔責張鳴爾虎賁將軍蒙國厚恩位在中臣宿衛禁門當進人不避仇讎舉罰不避親戚今者反于殿中交通輕薄虎賁蘭內所使至欲相殺于殿下避門內畏懦恣縱姑不遂捕此皆生于不學之門所致也見聚珍本東觀漢記詔敕出朱暉國家樂聞駮議黃髮無愆詔書過耳何故自繫見後漢朱暉傳詔馬光朝延鹿脯寧用飯也見東觀漢記東平憲王哀策惟建初八年三月已卯皇帝曰咨王丕顯勤勞王室親受策命昭于前世出作蕃輔克慎明德率禮不越傅聞在下昊天不弔不報上仁俾屏余一人夙夜煢煢靡有所終今詔有司加賜鸞輅乘馬龍旗九旒虎賁百人奉送王行匪我憲王其孰離之魂而有靈保茲寵榮嗚呼哀哉見後漢東平王蒼傳又略見袁宏後漢紀十二賜策罷太尉鄧彪惟君以曾閔之行禮讓之高故慕君德禮以屬黎民貪與君意其上太尉印綬賜錢三十萬俸二千石祿終厥身君專精養和以輔天年詔太常四時致祭宗廟之胙河南尹常以八月旦奉羊酒見袁宏後漢紀十二敕侍御史司空方春所過無得有所伐殺車可以引避引避之騑馬可輟解輟解之詩云敦彼行葦牛羊勿踐履禮人君伐一草木不時謂之不孝俗知順人莫知順天其明稱朕意見後漢章紀敕曹褎條正漢儀此制散略多不合經今宜依禮條正使可施行于南宮東觀盡心集作見後漢曹褎傳賜東平王蒼書朕夙夜伏思念先帝躬履九德對于八政勞謙克己終始之度比放三宗誠有其美今迫遺詔誡不起寢廟臣子悲結僉以為雖於更衣猶宜有所宗之號以克配功德宗廟至重朕幼無知寤寐憂懼先帝每有著述典義之事未嘗不延問王以定厥中願王悉明處乃敢安之公卿議駁今皆并送及有可以持危扶顛宜勿隱思有所承公無困哉見續漢祭祀志下注補引東觀書復報東平王蒼有司奏上尊號曰顯宗藏主更衣不敢違詔祫食世祖廟樂皆如王議以正月十八日始祠仰見榱桷俯視几筵眇眇小子哀懼戰栗無所奉承愛而勞之所望于王也續漢祭祀志下注補引東觀書報東平王蒼書丙寅所上便宜三事朕親自覽讀反覆數周心開目明曠然發矇間吏人奏事亦有此言但明智淺短或謂儻是復為非何者災異之降緣政而見今改元之後年飢人流此朕之不德感應所致又冬春旱甚所被尤廣雖內用克責而不知所定得王深策快然意解詩不云乎未見君子憂心忡忡既見君子我心則降思惟嘉謀以次奉行冀蒙福應彰報至德特賜王錢五百萬見後漢東平憲王蒼傳賜東平王蒼及琅邪王京書中大夫奉使親聞動靜嘉之何已歲月騖過山陵浸遠孤心悽愴如何如何間饗衛士于南宮皇太后因過按行閲視舊時衣物聞于師曰其物存其人亡不言哀而哀自至信矣惟王孝友之德亦豈不然今送光烈皇后假紒帛巾各一枚及衣一篋遺王可時奉瞻視以慰凱風寒泉之思又欲令後生子孫得見先后衣服之製今魯國孔氏尚有仲尼車輿冠履明德盛者光靈遠也其光武皇帝器服中元二年已賦諸國故不復送並遺宛馬一匹血從前髆上小孔中出常聞武帝歌天馬霑赤汗今親見其然也頃反虜尚屯將帥在外憂念遑遑未有間寧願王寶精神加供養苦言至戒望之如渴見後漢東平憲王蒼傳又袁宏後漢紀十一又文選顏延之陶徵士誄注謝朓齊敬皇后哀册文注初學記二十並引東觀漢記
