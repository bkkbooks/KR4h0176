body:
  text: 和帝罷鹽鐵詔昔孝武皇帝致誅胡越故權收鹽鐵之利以奉師旅之費自中興以來胸奴未賓永平末年復修征伐先帝即位務休力役然猶深思遠慮安不忘危探觀舊典復收鹽鐵欲以防備不虞寧安邊境而吏多不良動失其便以違上意先帝恨之故遺戒郡國罷鹽鐵之禁縱民鑄煮入稅縣官如故事其申敕刺史二千石奉順聖旨勉弘德化布告天下使明知朕意見後漢和紀胸奴平告廟詔胸奴背叛為害久遠賴祖宗之靈師克有捷醜虜破碎遂掃厥庭役不再籍萬里清蕩非朕小子眇身所能克堪有司其案舊典告類薦功以章休烈見後漢和紀恤韋彪詔詔尚書故大鴻臚韋彪在位無愆方欲録用奄忽而卒其賜錢二十萬布百匹穀三千斛見後漢韋彪傳封竇憲等詔大將軍憲前歲出征克滅北狄朝加封賞固讓不受舅氏舊典竝蒙爵土其封憲冠軍侯邑二萬戶篤郾侯景汝陽侯瓌夏陽侯各六千戶見後漢竇憲傳詔北海王惠等勿讓虎賁官騎諸侯出境必有武備左右故夾谷之會司馬以從夫有文事必有武備所以重蕃職也王無辭焉見袁宏後漢紀十三行幸長安詔北狄破滅名王仍降西域諸國納質內附豈非祖宗迪哲重光之鴻烈歟寤寐歎息想望舊京其賜行所過二千石長吏以下及三老官屬錢帛各有差鰥寡孤獨篤癃貧不能自存者粟人三斛見後漢和紀求曹相國後詔高祖功臣蕭曹為首有傳世不絶之義曹相國後容城侯無嗣朕望長陵東門見二臣之壟循其遠節每有感焉忠義獲寵古今所同可遣使者以中牢祠大鴻臚求近親宜為嗣者須景風紹封以章厥功見後漢和紀旱蝗除田租詔今年郡國秋稼為旱蝗所傷其什四以上勿收田租芻稿有不滿者以實除之見後漢和紀詔有司有司省減內外廄及涼州諸苑馬自京師離宮果園上林廣成囿悉以假貧民恣得采捕不收其稅見後漢和紀實核貧民詔去年秋麥入少恐民食不足其上尤貧不能自給者戶口人數往者郡國上貧民以衣履釜鬵為資而豪右得其饒利詔書實核欲有以益之而長吏不能躬親反更徵召會聚令失農作愁擾百姓若復有犯者二千石先坐見後漢和紀選舉詔選舉良才為政之本科別行能必由鄉曲而郡國舉吏不加簡擇故先帝明敕在所令試之以職乃得充選又德行尤異不須經職者別署狀上而宣布以來出入九年二千石曾不承奉恣心從好司吏刺史訖無糾察今新蒙赦令且復申敕後有犯者顯明其罰在位不以選舉為憂督察不以發覺為負非獨州郡也是以庶官多非其人下民被姦邪之傷由法不行故也見後漢和紀報梁王畼詔朕惟王至親之屬淳淑之美傅相不良不能防邪至令有司紛紛有言彰于內外今王深思悔過端自克責朕惻然傷之志匪由子咎在彼小子一日克己復禮天下歸仁王其安心靜意茂率休德易不云乎一謙而四益小有言終吉強食自愛其何讓哉見袁宏後漢紀十四後漢梁王畼傳恤流民詔流民所過郡國皆實稟之其有販賣者勿出租稅又欲就賤還歸者復一歲田租更賦見後漢和紀舉賢良方正詔朕以眇末奉承鴻烈陰陽不和水旱違度濟河之域凶饉流亡而未獲忠言至謀所以匡救之策寤寐永歎用思孔疚惟官人不得于上黎民不安于下有司不念寬和而競為苛刻覆案不急以妨民事甚非所以上當天心下濟元元也思得忠良之士以輔朕之不逮其令三公中二千石二千石內郡守相舉賢良方正能直言極諫之士各一人昭巖穴披幽隱遣詣公車朕將悉聽焉見後漢和紀免遣官徒詔中都官徒各除半刑謫其未竟五月已下皆免遣見後漢和紀封班超詔往者胸奴獨擅西域寇盜河西永平之末城門晝閉先帝深愍邊氓嬰罹寇害乃命將帥擊右地破白山臨蒲類取車師城郭諸國震懾響應遂開西域置都護而焉耆王舜舜子忠獨謀悖逆恃其險隘覆沒都護并及吏士先帝重元元之命憚兵役之興故使軍司馬班超安集于填以西超遂踰葱領迄縣度出入二十二年莫不賓從改立其王而綏其人不動中國不煩戎士得遠夷之和同異俗之心而致天誅蠲宿恥以報將士之讎司馬法曰賞不踰月欲人速睹為善之利也其封超為定遠侯邑千戶見後漢班超傳日食選郎官詔元首不明化流無良政失于民謫見于天深惟庶事五教在寬是以舊典因孝廉之舉以求其人有司詳選郎官寬博有謀才任典城者三十人見後漢和紀減罪詔郡國中都官繫囚減死一等詣敦煌戍其犯大逆募下蠶室其女子宮自死罪已下至司寇作及亡命者入贖各有差見後漢和紀蝗災罪已詔蝗蟲之異殆不虛生萬方有罪在豫一人而言事者專咎自下非助我者也朕寤寐恫矜思弭憂釁昔楚嚴無災而懼成王出郊而反風將何以匡朕不逮以塞災變百僚師尹勉修厥職刺史二千石詳刑辟理冤虐恤鰥寡矜孤弱思惟致災興蝗之咎見後漢和紀蝗災免租詔今年秋稼為蝗蟲所傷皆勿收租更芻稿若有所損失以實除之餘當收租者亦半入其山林饒利陂池漁採以贍元元勿收假稅見後漢和紀手詔報張酺禮臣子無貶親之義今皇太后家雖不遵法度然常欲自減損奉事十年恩不忍虧案前世官太后亦奉終義從其勿復議見袁宏後漢紀十四竇氏雖不遵法度而太后常自減損朕奉事十年深惟大義禮臣子無貶尊上之文恩不忍離義不忍虧案前世上官太后亦無降黜其勿復議見後漢竇皇后紀與袁宏紀小異詔答張酺元首不明黎民困窮朕與君同其憂責豈可引退邪其勿復言見袁宏後漢紀十四詔追封梁竦制詔三公大鴻臚曰夫孝莫大於尊尊親親其義一也詩云父兮生我母兮鞠我撫我畜我長我育我顧我復我出入腹我欲報之德昊天罔極朕不敢興事覽于前世太宗中宗實有舊典追命外祖以篤親親其追封諡皇太后父竦為褒親愍侯比靈文順成侯魂而有靈嘉斯寵榮好爵顯服以慰母心見後漢梁竦傳疏導溝渠詔隄防溝渠所以順助地理通理壅塞今廢慢懈弛不以為負刺史二千石其隨宜疏導勿因緣妄發以為煩擾將顯行其罰見後漢和紀聽劉憲嗣爵詔故居巢侯劉般嗣子愷當襲般爵而稱父遺意致國弟憲遁亡七年所守彌篤蓋王法崇善成人之美其聽憲嗣爵遭事之宜後不得以為比見後漢劉愷傳免刑徒詔郡國中都官徒及篤癃老小女徒各除半刑其未竟三月者皆免歸見後漢和紀禁踰僭詔吏民踰僭厚死傷生是以舊令節之制度頃者貴戚近親百僚師尹莫肯率從有司不舉怠放日甚又商賈小民或忘法禁奇巧靡貨流積公行其在位犯者當先舉正市道小民但且申明憲綱勿因科令加虐羸弱見後漢和紀恤災民詔貨被災諸郡民種糧賜下貧鰥寡孤獨不能自存者及郡國流民聽入陂池漁采以助蔬食見後漢和紀擇良吏詔比年不登百姓虛匱京師去冬無宿雪今春無澍雨黎民流離困于道路朕痛心疾首靡知所濟瞻仰昊天何辜今人三公朕之腹心而未獲承天安民之策數詔有司務擇良吏今猶不改競惟苛暴侵愁小民以求虛名委任下吏假執行邪是以令下而姦生禁至而詐起巧法新律飾文增辭貨行于言罪成乎手朕甚病焉公卿不思助明好惡將何以救其咎罰咎罰既至復令災及小民若上下同心庶或有瘳其賜天下男子爵人二級三老孝悌力田三級民無名數及流民欲占者人一級鰥寡孤獨篤癃貧不能自存者粟人三斛見後漢和紀賑貸象林民詔象林民失農桑業者賑貸種糧稟賜下貧穀食見後漢和紀令天下半入田租詔荊州比歲不節今茲淫水為害餘雖頗登而多不均浹深惟四民農食之本慘然懷矜其令天下半入今年田租芻稿有宜以實除者如故事貧民假種食皆勿收責見後漢和紀又略見袁宏後漢紀十四緣邊舉孝廉詔幽并涼州戶口率少邊役衆劇束修良吏進仕路狹撫接夷狄以人為本其令緣邊郡口十萬以上歲舉孝廉一人不滿十萬二歲舉一人五萬以下三歲舉一人見後漢和紀復象林詔復象林縣更賦田租芻稿二歲見後漢和紀令兗豫荊州半入田租詔兗豫荊州今年水雨淫過多傷農功其令被害什四以上皆半入田租芻稿其不滿者以實除之見後漢和紀班刻漏箭詔告司徒司空漏所以節時分定昏明昏明長短起于日去極遠近日道周圜不可以計率分當據儀度下參晷景今官漏以計率分昏明九日增減一刻違失其實至為疏數以耦法太史待詔霍融上言不與天相應太常史官運儀下水官漏失天者至三刻以晷景為刻少所違失密近有驗今下晷景漏刻四十八箭立成斧官府當用者計吏到班豫四十八箭見續漢律曆志中宋書曆志二稟流民詔流民欲歸還本而無糧食者過所實稟之疾病加致醫藥其有不欲還鄉者勿強見後漢和紀留諸王侯詔甲子之異責由一人諸王幼稚早離顧復弱冠相育常有蓼莪凱風之哀選懦之恩知非國典且復須留見後漢清河孝王慶傳詔報張禹祠謁既訖當南禮大江會得君奏臨漢回輿而旋見後漢張禹傳貸種糧詔貧民有田業而以匱乏不能自農者貸種糧見後漢和紀因災禁沽酒詔兗豫徐冀四州比年雨多傷稼禁沽酒見後漢和紀察苛吏詔今秋稼方穗而旱雲雨不霑疑吏行慘刻不宣恩澤妄拘無罪幽閉良善所致其一切囚徒于法疑者勿決以奉秋令方察煩苛之吏顯明其罰見後漢和紀量除田租詔令天下半入今年田租芻稿其被災害者以實除之貧民受貸種糧及田租芻稿皆勿收責見後漢和紀賜鄭璩詔示官府璩盡節剛正亦何陵遲之有賜璩素六十匹引東觀漢記賜彭城王恭詔皇帝問彭城王始夏無恙蓋聞堯親九族萬國協和書典之所美也下邳王被病沈滯之疾昏亂不明家用不寧姬妾適庶諸子分爭紛紛至今前太子卬頑凶失道陷于大辟是後諸子更相誣告迄今適嗣未知所定朕甚傷之惟王與下邳王恩義至親正此國嗣非王而誰禮重適庶之序春秋之義大居正孔子曰惟仁者能好人能惡人貴仁者所好惡得其中也太子國之儲嗣可不慎歟王其差次下邳諸子可為太子者上名將及景風拜受印綬焉見後漢下邳惠王衍傳注引東觀記敕太官勿受獻詔遠國珍羞本以薦奉宗廟苟有傷害豈愛民之本其敕太官勿復受獻見後漢和紀敕張酺子蕃陰陽不和萬人失所朝廷望公思惟得失與國同心而託病自潔求去重任誰當與吾同憂責者非有望于斷金也司徒固疾司空年老公其傴僂勿露所敕見後漢張酺傳策鄧彪為太傅録尚書事故太尉鄧彪元功之族三讓彌高海內歸仁為群賢首其以彪為太傅録尚書事百官總已以聽庶得專位內之事見北堂書鈔五十九藝文類聚十初學記十一御覽二百十竝引應劭漢官儀策免韋彪彪以將相之裔勤身飭行出自州里在位歷載中被篤疾連上求退君年在耆艾不可復以加增恐職事煩碎重有損焉其上大鴻臚印綬其遣太子舍人詣中藏府受賜錢二十萬見後漢韋彪傳策免張酺詩云節彼南山惟石巖巖赫赫師尹民具爾瞻今君在位八年于茲康哉之歌既無聞焉而于兩觀之下有醜慢之音傷南山之體虧穆穆之風將何以宣示四方儀刑百僚履霜知冰朕甚懼焉君其上太尉印綬君自取之靡有后言見袁宏後漢紀十四禁長吏無故去職詔自今長吏被考竟未報自非父母喪無故輒去職者劇縣十歲平縣五歲以上乃得次用見後漢安紀求言詔昔在帝王承天理民莫不據琁機玉衡以齊七政朕以不德遵奉大業而陰陽差越變異竝見萬民饑流羌貊叛戾夙夜克己憂心京京閒令公卿郡國舉賢良方正遠求博選開不諱之路冀得至謀以鑒不逮而所對皆循尚浮言無卓爾異聞其百僚及郡國吏人有道術明習災異陰陽之度琁機之數者各使指變以聞二千石長吏明以詔書博衍幽隱朕將親覽待以不次冀獲嘉謀以承天誡見後漢安紀令王國官得外補詔王主官屬墨綬下至郎謁者其經明任博士居鄉里有廉清孝順之稱才任理人者國相歲移名與計偕上尚書公府通調令得外補見後漢安紀詔公卿朕以幼沖奉承鴻業不能宣流風化而感逆陰陽至令百姓饑荒更相噉食永懷悼歎若墜淵冰咎在朕躬非群司之責而過自貶引重朝廷之不德其務思變復以助不逮見後漢安紀詔種麥長吏案行在所皆令種宿麥蔬食務盡地力其貧者給種餉見後漢安紀除三輔逋租詔三輔比遭寇亂人庶流冗除三年逋租過更口算芻稿稟上郡貧民各有差見後漢安紀免徙邊及奴婢詔自建初以來諸祅言它過坐徙邊者各歸本郡其沒入官為奴婢者免為庶人見後漢安紀又略見袁宏後漢紀十六詔校定東觀書謁者劉珍及五經博士校定東觀五經諸子傳記百家藝術整齊脫誤是正文字見後漢安紀年饑詔比年饑加有軍旅嚮者衛且勿設戲作樂正旦無陳充庭車見北堂書鈔一百五十六引續漢書永初四年詔選舉詔朕以不德奉郊廟承大業不能興和降善為人祈福災異蜂起寇賊縱橫夷狄猾夏戎事不息百姓匱乏疲于徵發重以蝗蟲滋生害及成麥秋稼方收甚可悼也朕以不明統理失中亦未獲忠良以毗闕政傳曰顛而不扶危而不持則將焉用彼相矣公卿大夫將何以匡救濟斯艱厄承天誡哉蓋為政之本莫若得人褒賢顯善聖制所先濟濟多士文王以寧思得忠良正直之臣以輔不逮其令三公特進侯中二千石二千石郡守諸侯相舉賢良方正有道術達于政化能直言極諫之士各一人及至孝行與衆卓異者竝遣詣公車朕將親覽焉見後漢安紀紹封二十八將子孫詔夫仁不遺親義不忘勞興滅繼絶善善及子孫古之典也昔我光武受命中興恢弘聖緒橫被四表昭假上下光耀萬世祉祚流衍垂于罔極豫末小子夙夜永思追惟勳烈披圖案籍建武元功二十八將佐命虎臣讖記有徵蓋蕭曹紹封傳繼于今況此未遠而或至乏祀朕甚愍之其條二十八將無嗣絶世若犯罪奪國其子孫應當統後者分別署狀上將及景風章敘舊德顯茲遺功焉見後漢馮異傳蝗災詔朝廷不明庶事失中災異不息憂心惶懼被蝗以來七年于茲而州郡隱匿裁言頃畝今群飛蔽天為害廣遠所言所見寧相副邪三司之職內外是監既不奏聞又無舉正天災至重欺罔罪大今方盛夏且復假貸以觀厥後其務消救災眚安輯黎元見後漢安紀徙罪人詔郡國中都官繫囚減死一等勿笞詣馮翊扶風屯妻子自隨占著所在女子勿輸亡命死罪以下贖各有差其吏人聚為盜賊有悔過者除其罪見後漢安紀霖雨詔今年秋稼茂好垂可收穫而連雨未霽懼必淹傷夕惕惟憂思念厥咎夫霖雨者人怨之所致其武吏以威暴下文吏妄行苛刻鄉吏因公生姦為百姓所患苦者有司顯明其罰又月令仲秋養衰老授几杖行麋粥方今案比之時郡縣多不奉行雖有麋粥糠粃泥土相和半不可飲食長吏怠事莫有躬親甚違詔書養老之意其務崇仁恕賑護寡獨稱朕意焉見後漢安帝紀宋書禮志四又見通典六十七重申制度科品詔舊令制度各有科品欲令百姓務崇節約遭永初之際人離荒厄朝廷躬自菲薄去絶奢飾食不兼味衣無二綵比年雖獲豐穰尚乏儲積而小人無慮不圖久長嫁娶送終紛華靡麗至有走卒奴婢被綺縠著珠璣京師尚若斯何以示四遠設張法禁懇惻分明而有司惰任訖不奉行秋節既立鷙鳥將用且復重申以觀後效見後漢安紀賑貧民表貞婦詔夫政先京師後諸夏月令仲春養幼小存諸孤季春賜貧窮賑乏絶省婦使表貞女所以順陽氣崇生長也其賜人尤貧困孤弱單獨穀人三斛貞婦有節義十斛甄別門閭旌顯厥行見後漢安紀賜豫州刺史馮煥詔告豫州刺史馮煥今下缺常為效用邊將統御下缺內以威恩撫喻杜下缺去年鮮卑連犯鄣塞下缺過掩卒搗擊無距捍下缺率攝太守以下進退下缺曾不表罪誅多擁下缺麗王宮僄輕狡猾下缺纖下缺絶宮不自效楚下缺化頃屬樂浪久矣下缺當所謂設訖不定決下缺月左右欲來犯法下缺北顧傷心缺煥有下缺冀煥能竭心盡慮有下缺上如不從化督録部下缺惟前後詔書以前人下缺侍御史便宜數上下缺元初六年十二月見隸釋十五禁夜行詔鐘鳴漏盡洛陽城中不得有行者見文選鮑明遠放歌行注引崔實政論永寧詔詔貶樂成王萇萇有靦其面而放逸其心知陵廟至重承繼有禮不惟致敬之節肅穆之慎乃敢擅損犧牲不備苾芬出入顛覆風淫于家娉取人妻饋遺婢妾毆擊吏人專己凶暴愆罪莫大甚可恥也朕覽八辟之議不忍致之于理其貶萇爵為臨湖侯朕無則哲之明致簡統失序罔以尉承太姬增懷永歎見後漢樂成靖王黨傳詔高句驪遂成等桀逆無狀當斬斷菹醢以示百姓幸會赦令乞罪請降鮮卑濊貊連年寇鈔驅略小民動以千數而裁送數十百人非向化之心也自今以後不與縣官戰鬭而自以親附送生口者皆與贖直縑人四十匹小口半之見後漢東夷傳舉刺史以下詔三公中二千石舉刺史二千石令長相視事一歲以上至十歲清白愛利能敕身率下防姦理煩有益于人者無拘官簿刺史舉所部郡國太守相舉墨綬隱親悉心勿取浮華見後漢安紀脅群臣廢太子詔父子一體天性自然以義割恩為天下也歷諷等不識大典而與群小共為歡譁外見忠直而內希後福飾邪違義豈事君之禮朝廷廣開言事之路故且一切假貸若懷迷不反當顯用刑書策罷司空張敏今君所苦未瘳有司奏君年體衰羸郊廟禮儀仍有曠廢鼎足之任不可以缺重以職事留君其上司空印綬見後漢張敏傳注引東觀記策司徒夏勤維元初六年三月甲子制詔以大鴻臚勤為司徒曰朕承天序惟稽古建爾于位為漢輔往率舊職敬敷五教五教在寬左右朕躬宣力四表保乂皇家於戲實惟秉國之均旁祗厥緒時亮天工可不慎與勤其戒之見續漢禮儀志中注補引丁孚漢儀又見通典七十一策徵郎宗等郎宗李昺孔喬等前此徵命未肯降意恐主者玩弄禮意不備使難進易退之人龍潛不屈其身各致嘉禮遣詣公車將以補察國政輔朕之不逮見後漢樊英傳注引謝承書敕司隸校尉冀并二州刺史民訛言相驚棄捐舊居老弱相攜窮困道路其各敕所部長吏躬親曉諭若欲歸本郡在所為封長檄不欲勿強見後漢安紀
