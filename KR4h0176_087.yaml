body:
  text: 順帝封孫程等十九侯詔夫表功録善古今之通義也故中常侍長樂太僕江京黃門令劉安鉤盾令陳達與故車騎將軍閻顯兄弟謀議惡逆傾亂天下中黃門孫程王康長樂太官丞王國中黃門黃龍彭愷孟叔李建王成張賢史泛馬國王道李元楊他陳豫趙封李剛魏猛苗光等懷忠憤發戮力協謀遂掃滅元惡以定王室詩不云乎無言不讎無德不報程為謀首康國協同其封程為浮陽侯食邑萬戶康為華容侯國為酈侯各九千戶黃龍為湘南侯五千戶彭愷為西平昌侯孟叔為中廬侯李建為復陽侯各四千二百戶王成為廣宗侯張賢為祝阿侯史泛為臨沮侯馬國為廣平侯王道為范縣侯李元為褒信侯楊他為山都侯陳豫為下雋侯趙封為析縣侯李剛為枝江侯各四千戶魏猛為夷陵侯二千戶苗光為東阿侯千戶見後漢孫程傳舉賢良詔朕以不德纂承洪緒今陰陽不和疾疫為害思聞忠正以匡不逮其令三公卿士舉賢良方正能直言極諫之士各一人見後漢紀十七大赦詔先帝聖德享祚未永早棄鴻烈姦慝緣閒人庶怨讟上干和氣疫癘為災朕奉承大業未能寧濟蓋至理之本稽弘德惠蕩滌宿惡與人更始其大赦天下賜男子爵人二級為父後三老孝悌力田人三級流民欲自占者一級鰥寡孤獨篤癃貧不能自存者粟人五斛貞婦帛人三匹坐法當徙勿徒亡徒當傳勿傳宗室以罪絶皆復屬籍其與閻顯江京等交通者悉勿考勉修厥職以康我民見後漢順紀免租詔朕以不德統承大業虐氣流行厲疾為災重以水潦秋稼漂沒每州郡所出惻然自刻其令當輸今年租者一切勿責見後漢紀十八增封東海王臻詔東海王臻以近蕃之尊少襲王爵膺受多福未知艱難而能克己率禮孝敬自然親盡愛送終竭哀降儀從士寢苫三年和睦兄弟恤養孤弱至孝純備仁義兼弘朕甚嘉焉夫勸善厲俗為國所先曩者東平孝王敞兄弟行孝喪母如禮有增戶之封詩云永世克孝念茲皇祖今增臻封五千戶儉五百戶光啓土宇以酬厥德見後漢東海恭王彊傳詔南陽太守詔書告南陽太守五官中郎將樊英委榮辭祿不降其節志不可奪今以英為光祿大夫賜還家在所縣給穀千斛常以八月存問高年時致羊一頭酒三斛如前世故事如有不幸祠以中牢見後漢樊英傳後漢紀十八又見藝文類聚四十九御覽二百四十三引樊英別傳恤地震災民詔實核傷害者賜年七歲以上錢人二千一家被害郡縣為收斂見後漢順紀免漢陽田租詔京師地動漢陽尤甚加以比年民饑饉夙夜怟懍群公卿士其深思古典有以消災復異救此下民忠信嘉謀靡有所諱其勿收漢陽今年田租見後漢紀十八大赦詔朕託王公之上涉道日寡政失厥中陰陽氣隔寇盜肆暴庶獄彌繁憂悴永歎疢如疾首詩云君子如祉亂庶遄已三朝之會朔旦立春嘉與海內洗心自新其赦天下從甲寅赦令已來復秩屬籍三年正月已來還贖其閻顯江京等知識婚姻禁錮一原除之務崇寬和敬順時令遵典去苛以稱朕意見後漢順紀封還大珠詔海內頗有災異朝廷修政太官減膳珍玩不御而桂陽太守文礱不惟竭忠宣畼本朝而遠獻大珠以求幸媚今封以還之見後漢順紀令冀部勿收田租詔連年災潦冀部尤甚比蠲除實傷贍恤窮匱而百姓猶有棄業流亡不絶疑郡縣用心怠惰恩澤不宣易美損上益下書稱安民則惠其令冀部勿收今年田租芻稿見後漢順紀祈雨詔政失厥和陰陽隔并冬鮮宿雪春無澍雨分禱祈請靡神不禜深恐在所慢違如在之義今遣侍中王輔等持節分詣岱山東海滎陽河洛盡心祈焉見後漢順紀改元陽嘉恩詔宗室絶屬籍者一切復籍稟冀州尤貧民勿收今年更租口賦見後漢順紀太學新成詔試明經者補弟子增甲乙之科員各十人除京師及郡國耆儒年六十以上為郎舍人諸王國郎者百三十八人見後漢左雄傳減死贖罪詔郡國中都官繫囚皆減死一等亡命者贖各有差見後漢順紀狼災詔災暴緣類符驗不虛政失厥中狼災為應至乃殘食孩幼朝廷愍悼思維咎徵博訪其故山獄尊靈國所望秩而遂比不奉祠怠慢廢典不務懇惻淫刑放濫害加孕婦毒流未生感和致災其詳思改救追復所失有不遵憲舉正以聞見續漢五行志一注補後漢順紀注並引東觀書中山相朱遂到官不出奉祠北嶽詔云云簡核刺史二千石詔閒者以來吏政不勤故災咎屢臻盜賊多有退省所由皆以選舉不實官非其人是以天心未得人情多怨書歌股肱詩刺三事令刺史二千石之選歸任三司其簡序先後情核高下歲月之次文武之宜務存厥衷見後漢順紀貸災詔吳郡會稽饑荒貸人耕種見後漢順紀地震求直言詔朕以不德統奉鴻業無以奉順乾坤協序陰陽災眚屢見咎徵仍臻地動之異發自京師矜矜祗畏不知所裁群公卿士將何以匡輔不逮奉答戒異異不空設必有所應其各悉心直言厥咎靡有所諱見後漢順紀又略見袁宏後漢紀十八下詔徵楊倫詣廷尉倫出幽升喬寵以藩傅稽留王命擅止道路託疾自從苟肆狷志見後漢楊倫傳大赦詔昔我大宗丕顯之德假于上下儉以恤民政致康乂朕秉事不明政失厥道天地譴怒大變仍見春夏連旱寇賊彌繁元元被害朕甚愍之嘉與海內洗心更始其大赦天下自殊死以下謀反大逆諸犯不當得赦者皆除之賜民年八十以上米人一斛肉二十斤酒五斗九十以上加賜帛人二匹絮三斤見後漢順紀詔中官自今中官得以養子為後見袁宏後漢紀十八宦官養子悉聽得為後襲封爵定著乎令見後漢孫程傳日食詔朕以不德謫見于天零陵言日食京師不覺見後漢順紀注引東觀記詔問加諡北鄉侯言事者多云昔周公攝天子事及薨成王欲以公禮葬之天為變動及更葬以天子之禮即有反風之應北鄉侯親為天子而葬以王禮故數有災異宜加尊諡列于昭穆與木主否見後漢周舉傳袁宏後漢紀十八通典八十地震詔上封事朕秉政不明災眚屢臻典籍所忌震食為重今日變方遠地搖京師咎徵不虛必有所應群公百僚其各上封事指陳得失靡有所諱見後漢順帝紀封馬賢孫詔故將軍馬賢前伐西夷克敵深入父子三人同命其以漢中南鄭之武陽亭封賢孫承先為武陽亭侯食租稅見東觀漢記下詔告河南尹故長陵令張楷行慕原憲操擬夷齊輕貴樂賤竄跡幽藪高志確然獨拔群俗前此徵命盤桓未至將主者玩習于常優賢不足使其難進歟郡時以禮發遣見後漢張楷傳拜張綱子續為郎中詔故廣陵太守張綱大臣之苗剖符統務正身導下班宣德信降集劇賊張嬰萬人息干戈之役濟蒸庶之困未升顯爵不幸早卒嬰等縗杖若喪考妣朕甚愍焉拜綱子續為郎中賜錢百萬見後漢張綱傳贈沛王廣祖母周妃詔沛王祖母太夫人周秉心淑慎導王以仁使光祿大夫贈以妃印綬見後漢沛獻王輔傳桉行地震詔隴西漢陽張掖北地武威武都自去年九月已來地百八十震山谷坼裂壞敗城寺殺害民庶夷狄叛逆賦役重數內外怨曠惟咎歎息其遣光祿大夫案行宣畼恩澤惠此下民勿為煩擾見後漢順紀遺詔死則委尸原野見文選顏延之陽給事誄注引司馬彪續漢書無起寢廟斂以故服珠玉玩好皆不得下見後漢順紀又見袁宏後漢紀十九孝廉限年令郡國舉孝廉限年四十以上諸生通章句文史能箋奏乃得應選其有茂才異行若顏淵子奇不拘年齒見後漢順紀冊袁良為梁相頃者連遇運害災條備至陰陽不和寒暑不節昔孔子制義承奉則有興盛之福慢期即致來咎之變朕以眇身襲裘繼業二九之戒今直其際圖記占恆在藩國自先帝至德猶有七國之謀蓋治世者不諱其難朕追寤社稷之重恐有交會諸國王侯開導以驕滿之漸令姦邪因緣生慝相以顯選簡練內升昔掌符竟惠撫我民故連拔授不問勛次典郡職重親執經緯隱括在手往者王尊發縱于平陽清約藩輔其節衎然忠臣之義有獻善去否其加精微測切防𢇍朕疚心以戒今特賜錢十萬雜繪卅匹玉具劍佩書刀繡文印衣無極手巾各一往悉乃心勉崇協同便宜數上見隸釋六袁良碑策祠楊震故太尉震正直是與俾匡時政而青蠅點素同茲在藩上天降威災眚屢作爾卜爾筮惟震之故朕之不德用彰厥咎山崩棟折我其危哉今使太守丞以中牢具祠魂而有靈儻其歆享見後漢楊震傳會葬宋漢策太中大夫宋漢清修雪白正直無邪前在方外仍統軍實懷柔異類莫匪嘉績戎車載戢邊人用寧豫録乃勳引登九列因病退讓守約彌堅將授三事未剋而終朝廷愍悼恆其愴然詩不云乎肇敏戎功用錫爾祉其令將相大夫會葬加賜錢十萬及其在殯以全素絲羔羊之潔焉見後漢宋宏傳策問周舉朕以不德仰承三統夙興夜寐思協大中頃年以來旱災屢應稼穡焦枯民食乏困五品不訓王澤未流群司素餐據非其位審所貶黜變復之徵厥效何由分別具對勿有所諱見後漢周舉傳敕禱雨郡國二千石各禱名山嶽瀆遣大夫謁者詣嵩高首陽山并祠河洛請雨見後漢順帝紀制曰缺中常侍費亭侯曹騰騰見克缺先帝能自奮拔于險阻之中不陷乎群小害己之譖遂亦前後策謀進賢納踐阼之初受爵于東土厥功章然騰守足退居約身自持遭離母憂孝行純篤慎禮紀喪能過哀服祥有不忍遠離之恩情感病毀性早薨朕甚閔焉詩曰靡不有初鮮克有終騰能終之春秋之義旌采介以勸為善及其在殯使兼諫議大特進贈費亭侯印綬魂而有靈嘉其寵榮嗚呼哀哉見隸釋十五曹騰碑陰尊匽貴人為孝崇皇后詔博陵園匽貴人覆高明之懿德容美淑之嘉會與天合靈篤生朕躬欲報之德詩所感歎今以貴人為孝崇皇后見官輯本東觀漢記以胡憲等為太子舍人詔書生汝南胡憲陳留恭幸爽或六十以下常以月朔會辟雍垂白安貧童子潁川王通經拜太子舍人見通典五十三申明輿服制度詔比者星辰繆越坤靈震動災異之降必不空發敕己修政庶望有補其輿服制度有踰侈長飾者皆宜損省郡縣務存儉約申明舊令如永平故事見後漢桓紀令種蕪菁詔詔司隸校尉部刺史曰蝗災為害水變仍至五穀不登人無宿儲其令所傷郡國種蕪菁以助人食見後漢桓紀禁郡國賣酒詔朝政失中雲漢作旱川靈涌水蝗蟲孳蔓殘我百穀太陽虧光饑饉薦臻其不被害郡縣當為饑餒者儲天下一家趣不糜爛則為國寶其禁郡國不得賣酒祠祀裁足見後漢桓紀恤太山琅邪難民詔太山琅邪遇賊者勿收租賦復更算三年見後漢桓紀洛水溢下詔被水死流失尸骸者令郡縣鉤求收葬及所唐突壓溺物故七歲以上賜錢人二千壞敗廬舍亡失穀食尤貧者稟人二斛見後漢桓紀封諡樊重詔存善繼絶食藉德貞武騎都尉樊演高祖父重以光武皇帝元舅扶助中興追封壽張侯諡曰敬祖父茂封冠軍平望鄉侯五國竝建其二絶者嗣之見東觀漢記遣居車兒還單于詔春秋大居正居車兒一心向化何罪而黜其遣還單于見後漢南胸奴傳追贈中常侍樊安詔制詔中常侍樊安宿衛歷年恭恪淑慎嬰被疾病不幸蚤終今使湖陽邑長劉操追號安為騎都尉贈印綬魂而有靈嘉茲寵榮嗚呼哀哉見隸釋六樊安碑封單超等詔梁冀姦暴濁亂王室孝質皇帝聰敏早茂冀心懷忌畏私行殺毒永樂太后親尊莫二冀又遏絶禁還京師使朕離母子之愛隔顧復之恩禍害深大罪釁日滋賴宗廟之靈及中常侍單超徐璜具瑗左悺唐衡尚書令尹勳等激憤建策內外協同漏刻之閒桀逆梟夷斯誠社稷之祐臣下之力宜班慶賞以酬忠勳其封超等五人為縣侯勳等七人為亭侯見後漢桓紀封黃瓊伉鄉侯詔太尉黃瓊清儉不撓數有忠謇加以典謀深奧有師傅之義連在三司不阿權貴疾風知徑草朕甚嘉焉其封瓊伉鄉侯見袁宏後漢紀二十一封張彪鮑吉詔汝南太守張彪故河南尹鮑吉與朕有潛龍之歸皆封列侯見袁宏後漢紀二十一又見北堂書鈔四十八因水旱減奉詔減虎賁羽林住寺不任事者半奉勿與冬衣其公卿以下給冬衣之半見後漢桓紀詔策車騎將軍馮緄蠻夷猾夏久不討攝各焚都城蹈藉官人州郡將吏死職之臣相逐奔竄曾不反顧可愧言也將軍素有威猛是以擢授六師前代陳湯馮傅之徒以寡擊衆郅支夜郎樓蘭之戎頭懸都街衛霍北征功列金石是皆將軍所究覽也今非將軍誰與修復前迹進赴之宜權時之策將軍一之出郊之事不復內御已命有司祖于國門詩不云乎進厥虎臣闞如虓虎敷敦淮濆仍執醜虜將軍其勉之見後漢馮緄傳贈朱穆益州刺史詔制詔尚書朱穆立節忠亮世篤爾行虔恪機任守死善道不幸而卒朝廷閔焉今使權謁者中郎楊賁贈穆益州刺史印綬魂而有靈嘉其寵榮嗚呼哀哉見蔡中郎集朱公叔鼎銘旱災盜賊郡免租詔比歲不登人多饑窮又有水旱疾疫之困盜賊徵發南州尤甚災異日食譴告纍至政亂在豫仍獲咎徵其令大司農絶今歲調度徵求及前年所調未畢者勿復收責其災旱盜賊之郡勿收租餘郡悉半入見後漢桓紀詔從事中郎應奉蠻夷叛逆作難積惡放恣鑊中之魚火熾湯盡當悉燋爛以刷國恥朝廷以奉昔守南土威名播越故復式序重任奉之廢興期在于今賜奉錢十萬駮犀方具劍金錯把刀劍革帶各一奉其勉之見後漢應奉傳注引謝承書又御覽三百四十二引同問段熲東討詔先零東羌造惡反逆而皇甫規張奐各擁強衆不時輯定欲熲移兵東討未識其宜可參思術略見後漢段熲傳詔報喬玄邊榖不得妄動玄擅出于是玄有汲黯憂民之心後不以為常見蔡雍集太尉喬玄碑陰敕司隸冀州賑饑敕州郡賑給貧弱若王侯吏民有積穀者一切貣得十分之三以助稟貸其百姓吏民者以見錢雇直王侯須新租乃償見後漢桓紀祠恭懷皇后祝文孝曾孫皇帝志使有司臣太常撫夙興夜處小心畏忌不墮其身一不寧敢用潔牲一元大武柔毛剛鬣商祭明視薌萁嘉薦普淖鹹鹺豐本明粢醪用薦酎事于恭懷皇后尚饗見續漢祭祀志下注補引丁孚漢儀
