body:
  text: 靈帝下三司制制曰下太尉司徒司空夫瑞不虛至災必有緣朕以不德秉統未明以招妖偽將何以昭顯憲法哉三司任政者也所當夙夜而各拱默訖未有聞將何以奉答天意敉寧我人其各悉心思所崇改務消復之術稱朕意焉見後漢蔡雍傳注引漢名臣奏特詔問災變比災變互生未知厥咎朝廷焦心載懷恐懼每訪群公卿士庶聞忠言而各存括囊莫肯盡心以雍經學深奧故密特稽問宜披露失得指陳政要勿有依違自生疑諱具對經術以皂囊封上見後漢蔡雍傳封楊賜等詔大司馬楊賜敦德允元忠愛恭懿親以尚書侍講纍評張角始謀禍亹未彰賜陳便宜欲緩誅夷令德既光嘉謀怛然詩不云乎無德不報無言不讎故褒城君孔霸故太尉黃瓊侍講先帝並宜受茅土之封見袁宏後漢紀二十五徵處士荀爽等詔頃選舉失所多非其人儒法雜揉學道寖微處士荀爽陳紀鄭玄韓融李楷耽道樂古志行高潔清貧隱約為衆所歸其以爽等各補博士見袁宏後漢紀二十五手詔薑肱肱抗凌雲之志養浩然之氣以朕德薄未肯降志昔許由不屈王道為化夷齊不撓周德不虧州郡以禮優順勿失其意見後漢薑肱傳注引謝承書立宋貴人為皇后册文維建寧四年七月乙未制詔皇后之尊與帝齊體供奉天地祗承宗廟母臨天下故有莘興殷薑任母周二代之隆蓋有內德長秋宮闕中宮曠位宋貴人秉淑媛之懿體山河之儀威容昭曜德冠後庭群寮所咨人曰宜哉卜之蓍龜卦得承乾有司奏議宜稱紱組以母兆民今使太尉襲使持節奉璽綬宗正祖為副立貴人為皇后后其往踐爾位敬宗禮典肅慎中饋無替朕命永終天祿見續漢禮儀志中注補引蔡質典儀又見通典五十八追贈楊賜策故司空臨晉侯賜華嶽所挺九德純備三葉宰相輔國以忠朕昔初載授道帷幄遂階成勳以陟大猷師範之功昭于內外庶官之務勞亦勤止七在卿校殊位特進五登兗職弭難乂寧雖受茅土未答厥勳哲人其萎將誰咨度朕甚懼焉禮設殊等物有服章今使左中郎將郭儀持節追位特進贈司空驃騎將軍印綬見後漢楊賜傳又見後漢紀二十五有刪節文亦小異又敕驃騎將軍官屬司空法駕送至舊塋公卿已下會葬諡曰文烈侯見後漢楊賜傳又後漢紀但有末一語敕劉焉為益州牧前刺史劉雋卻儉皆貪殘放溢取受狼藉元元無聊呼嗟充野焉到便收攝行法以示萬姓勿令漏露使癰疽決潰為國生梗見蜀志劉焉傳注引漢靈帝紀以袁隗為太傅詔朕以眇身君主海內夙夜憂懼靡知所濟夫天地人道其用在三必須輔佐以昭其功後將軍袁隗德量寬重奕世忠恪今以隗為太傅録尚書事朕且諒暗委成群後各率其職稱朕意焉見後漢紀二十五詔答王允聞王者當修德爾不聞孔子制孝經有此而卻邪者也見袁宏後漢紀二十六詔答李傕儒前為弘農王郎中令迫殺我兄誠宜加罪見後漢紀二十七李榷舉博士李儒為侍中詔曰云云史官免罪詔天道幽遠事驗難明且災異應政而至雖探道知機焉能無失而欲歸咎史官益重朕之不德也見後漢紀二十七詔勿收裴茂之災異數降陰雨為害使者銜命宣布恩澤原解輕微庶合天心欲解冤結而復罪之乎一切勿問見後漢紀二十七試儒生詔孔子歎學之不講不講則所識日忘矣今耆儒年踰六十去離本土營求糧資不得專業結童入學白首空歸長委農野永絶榮望朕甚愍焉其依科罷者聽為太子舍人見後漢獻帝紀又見後漢紀二十七有小異令州郡罷兵詔今海內擾攘州郡起兵征夫勞瘁寇難未弭或將吏不良因緣討捕侵侮黎民離害者衆風聲流聞震蕩城邑丘牆懼于橫暴貞良化為群惡此何異乎抱薪救焚扇火止沸哉今四民流移託身他方攜白首於山野棄稚子於溝壑顧故鄉而哀歎向阡陌而流涕飢厄困苦亦曰甚矣雖悔往者之迷謬思奉教于今日然兵連衆結鋒鏑布野恐一朝解散夕見係虜是以阻兵屯據欲止而不敢散也詔書到其各罷遣甲士還親農桑惟留常員吏以供官署慰示遠近咸使聞知見魏志陶謙傳注引吳書報有司請建長秋宮詔朕稟受不弘遭值禍亂未能紹先以光故典皇母前薨未卜宅兆禮章有闕中心如結三歲之戚蓋不言吉朕雖不能終身思慕其何忍言後宮之選乎且須其後見後漢靈思何后附王美人紀又袁宏後漢紀二十七考實侯汶詔未忍致汶于理可杖五十見後漢獻帝紀祿田詔三輔地不滿千里而軍師用度非一公卿已下不得奏除其若公田以秩石為率賦與令各自收其租稅見續漢百官志五注補引獻帝起居注喻郭泛詔朕遭艱難越在西都感惟宗廟靈爽何日不嘆天下未定厥心不革武夫宜威儒德合謀今得東移望遠若近視險如夷弘農近郊廟勿有疑也見後漢紀二十八詔張濟濟有拔車駕之功何故無有表而私請邪一切勿問同上報楊定請侍中尹忠為長史詔侍中近侍就非其宜必為關東所笑前在長安李傕專政今朕秉萬機豈可復亂官爵邪同上告張濟詔朕惟宗廟之重社稷之靈乃心東都日夜以冀洛陽丘墟靡所庇蔭欲幸弘農以漸還舊諸軍不止其競遂成禍亂今不為定民在塗炭濟宿有忠亮乃心王室前者受命來和傕泛元功既建豈不惜乎濟其廩給百官遂究前勳昔晉文公為踐土之會垂勳周室可不勉哉同上詔董承等傕泛自知罪重將遂唐突為吏民害可復待韓融還乃議進退同上詔李樂千金之子坐不垂堂孔子慎馮河之危豈所謂安居之道乎同上詔敕曹操領兗州牧詔敕鎮東將軍領兗州牧費亭侯故特進顯授上將鐵鉞之任復食舊土雙金之寵董統一州委成之重榮曜昭示亦以優崇投節效命自白之秋也見藝文類聚五十一詔曹操襲費亭侯詔書拜鎮東將軍襲費亭侯曹操業履忠貞輔幹王室頃遭凶暴海內離析操執義討截黃巾為國出命夫祿以賞功罰以絀否今以操為鎮東將軍領兗州牧襲父費亭侯嵩爵并印綬符策見藝文類聚五十一封孫策詔書董卓逆亂凶國害民先將軍堅念在平討雅意未遂厥美著聞策遵善道求福不回今以策為騎都尉襲爵烏程侯領會稽太守見吳志孫破虜討逆傳曹公表策為討逆將軍封為吳侯注引江表傳詔孫策董卓逆亂凶國害民先將軍堅念在平討雅意未遂厥美著聞策遵善道求福不回今以策為騎都尉襲爵烏程侯領會稽太守見吳志孫討逆傳注引江表傳又詔敕孫策故左將軍袁術不顧朝恩坐創凶逆造合虛偽欲因兵亂詭詐百姓始聞其言以為不然定得使持節平東將軍領徐州牧溫侯布上術所造惑衆妖妄知術鴟梟之性遂其無道修治王宮署置公卿郊天祀地殘民害物為禍深酷布前後上策乃心本朝欲還討術為國效節乞加顯異夫縣賞俟功惟勤是與故便寵授承襲前邑重以大郡榮耀兼至是策輸力竭命之秋也其亟與布及行吳郡太守安東將軍陳瑀戮力一心同時赴討見吳志孫討逆傳注引江表傳命魏公得承制封拜詔夫軍之大事在茲賞罰勸善懲惡宜不旋時故司馬法曰賞不逾日者欲民速覩為善之利也昔在中興鄧禹入關承制拜軍祭酒李文為河東太守來歙又承制拜高峻為通路將軍察其本傳皆非先請明臨事刻印也斯則世祖神明權達損益蓋所用速示威懷而著鴻勳也其春秋之義大夫出疆有專命之事苟所以利社稷安國家而已況君秉任二伯師尹九有實征夷夏軍行藩甸之外失得在于斯須之間停賞俟詔以滯世務固非朕之所圖也自今已後臨事所甄當加寵號者其便刻印章假授咸使忠義得相獎勵勿有疑焉見魏志武帝紀注引孔衍漢魏春秋又見御覽六百三十三進魏公爵為魏王詔自古帝王雖號稱相變爵等不同至乎褒崇元勳建立功德光啓氏姓延于子孫庶姓之與親豈有殊焉昔我聖祖受命創業肇基造我區夏鑒古今之制通爵等之差盡封山川以立藩屏使異姓親戚並列土地據國而王所以保乂天命安固萬嗣歷世承平臣主無事世祖中興而時有難易是以曠年數百無異姓諸侯王之位朕以不德繼序弘業遭率土分崩群凶縱毒自西徂東辛苦卑約當此之際唯恐溺人于難以羞先帝之聖德賴皇天之靈俾君秉義奮身震迅神武捍朕于艱難獲保宗廟華夏遺民含氣之倫莫不蒙焉君勤過稷禹忠侔伊周而掩之以謙讓守之以彌恭是以往者初開魏國錫君土宇懼君之違命慮君之固辭故且懷志屈意封君為上公欲以欽順高義須俟勳績韓遂宋建南結巴蜀群逆合縱圖危社稷君復命將龍驤虎奮梟其元首屠其窟栖暨至西征陽平之役親擐甲胄深入險阻芟夷蝥賊殄其凶醜蕩定西陲懸旌萬里聲教遠振寧我區夏蓋唐虞之盛三后樹功文武之興旦奭作輔二祖成業英豪佐命夫以聖哲之君事為己任猶錫土班瑞以報功臣豈有如朕寡德仗君以濟而賞典不豐將何以答神祇慰萬民哉今進君爵為魏王使使持節行御史大夫宗正劉艾奉策璽元土之社苴以白茅金虎符第一至第五竹使符第一至第十君其正王位以丞相領冀州牧如故其上魏公璽綬符策敬服朕命簡恤爾衆克綏庶績以揚我祖宗之休命見魏志武帝紀注引獻帝傳又手詔大聖以功德為高美以忠和為典訓故創業垂名使百世可希行道制義使力行可效是以勳列無窮休光茂著稷契載元首之聰明周邵因文武之智用雖經營庶官仰嘆俯思其對豈有若君者哉朕惟古人之功美之如彼思君忠勤之績茂之如此是以每將鏤符析瑞陳禮命册寤寐慨然自忘守文之不德焉今君重違朕命固辭懇切非所以稱朕心而訓後世也其益志撙節勿復固辭見魏志武帝紀注引獻帝傳今以君為魏王白降皂黃白各二匹越葛一端往欽哉見御覽八百十九詔魏太子丕嗣位魏太子丕昔皇天授乃顯考以翼我皇家遂攘除群凶拓定九州弘功茂績光于宇宙朕用垂拱負扆三十有餘載天不憖遺一老永保豫一人早世潛神哀悼傷切丕奕世宣明宜秉文武紹熙前緒今使使持節御史大夫華歆奉策詔授丕丞相印綬魏王璽紱領冀州牧方今外有遺虜遐夷未賓旗鼓猶在邊境干戈不得韜刃斯乃播揚洪烈立功垂名之秋也豈得修諒暗之禮究曾閔之志哉其敬服朕命抑弭憂懷旁祗厥緒時亮庶功以稱朕意於戲可不勉乎見袁宏後漢紀三十又見魏志文紀注賜士燮璽書交州絶域南帶江海上恩不宣下義壅隔知逆賊劉表又遣賴恭窺看南土今以燮為綏南中郎將董督七郡領交址太守如故見吳志士燮傳
