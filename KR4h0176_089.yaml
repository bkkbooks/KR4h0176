body:
  text: 明德馬后辭封舅氏詔外戚橫恣為世所傳永平中常自簡練知舅氏不可恣不令在樞機之位今水旱連年民流滿道致有飢餓而施封拜失宜不可且先帝言諸王財令半楚淮陽王吾子不當與光武帝子等今奈何欲以馬氏比陰氏乎吾自束修冀欲上不負先帝下不虧先人之德身服大練縑裙食不求所甘左右旁人皆無香薰之飾但布帛耳如是者欲身師衆也以為外親見之當傷心自克但反共言太后素自喜儉前過濯龍門上見外家問起居車如流水馬如龍蒼頭衣緑直領領袖正白顧視旁御者遠不及也亦不遣怒但絶其歲用冀以默止歡耳知臣莫若君況親屬乎人之所以欲封侯者欲以祿食養其親奉修祭祀身溫飽耳今祭祀則受大官之牲郡國既珍司農黍稷身則衣御府之餘繒尚未足邪必當得一縣上令長樂宮有負言之責內亦不愧于世俗乎見續列女傳八有舊典舅氏一人封也吾非謙而不為誠昧所可耳今水旱連年民流滿道至有餓餒者而欲施封爵上行之為失政臣受之為喪軀不可明矣先帝嘗言諸王財令半楚淮陽吾子不當與光武帝子等今何以馬氏比陰氏乎且陰衛尉天下稱之省中御者出不及履而至門此蘧伯玉之敬也又有好賢下士吐握之名親陽侯雖剛強微失理然有方略據地談論一朝無雙原鹿貞侯勇猛誠信此三人者天下選臣豈可及哉馬氏不及陰氏遠矣吾不才夙夜纍息常恐虧先后之法有毛發之罪吾不釋也言之不舍晝夜而親屬犯之不止治喪起墳又不時覺是吾言之不立耳目之塞也吾萬乘主身服大練食不求甘左右旁人無香薰之飾衣但布帛如是者欲以身率服衆也以為外親見之當傷心自刻但發笑言太后素好儉前過濯龍門上見外家車如流水馬如龍吾亦不譴怒之但絶其歲用冀以默愧其心而猶駑怠無憂國忘家者知臣莫若君況親屬乎見袁宏後漢紀十一凡言事者皆欲媚朕以要福耳昔王氏五侯同日俱封其時黃霧四塞不聞澍雨之應又田蚡竇嬰寵貴橫恣傾覆之禍為世所傳故先帝防慎舅氏不令在樞機之位諸子之封裁令半楚淮陽諸國常謂我子不當與先帝子等今有司奈何欲以馬氏比陰氏乎吾為天下母而身服大練食不求甘左右但著帛布無香薰之飾者欲身率下也以為外親見之當傷心自敕但笑言大后素好儉前過濯龍門上見外家問起居者車如流水馬如遊龍倉頭衣緑褠領袖正白顧視御者不及遠矣故不加譴怒但絶歲用而已冀以默愧其心而猶懈怠無憂國忘家之慮知臣莫若君況親屬乎吾豈可上負先帝之旨下虧先人之德重襲西京敗亡之禍哉見後漢明德馬后紀報章帝重請封諸舅詔吾反覆念之欲令兩善豈徒欲獲謙虛之名而令帝受不外施之嫌哉竇太后欲封皇父曲周侯言高祖要無軍功非劉氏不封今馬氏無功于漢不得與陰郭中興之后等也今輦轂下民食不造歲湯火之憂也奈何欲以此時封爵舅氏令吾無面目于園陵而令帝不知稼穡之艱難不可明矣吾懼富貴重疊若再實木根必傷也且人所以欲封侯者欲以祿養親奉祭祀身溫飽也祭祀則受大官之賜其身則御府之餘尚未足邪而必當一縣封乎吾計之孰矣勿有疑至孝之行安親為上今遭變異穀價數倍憂惶晝夜坐起不安而欲違慈母之拳拳吾素剛急有胸中氣不可不慎子之未冠由于父母已冠成人則子之志念帝人君也吾以未逾三年之故自吾家族故得專之穰歲之後行子之志吾但當含飴弄孫不能復知政見袁宏後漢紀十一吾反覆念之思令兩善豈徒欲獲謙讓之名而使帝受不外施之嫌哉昔竇太后欲封王皇后之兄丞相條侯言受高祖約無軍功非劉氏不侯今馬氏無功于國豈得與陰郭中興之后等邪常觀富貴之家祿位重疊猶再實之木其根必傷且人所以願封侯者欲上奉祭祀下求溫飽耳今祭祀則受四方之珍衣食則蒙御府餘資斯豈不足而必當得一縣乎吾計之孰矣勿有疑也夫至孝之行安親為上今數遭變異穀價數倍憂惶晝夜不安坐臥而欲先營外封違慈母之拳拳乎吾素剛急有胸中氣不可不順也若陰陽調和邊境清靜然後行子之志吾但當含飴弄孫不能復關政矣見後漢明德馬后紀案此詔與袁宏紀亦互有刪節詔三輔諸馬婚親有囑托郡縣干亂吏治者以法聞見袁宏後漢紀十一下竇憲鄧彪等詔先帝以明聖奉承祖宗至德要道天下清靜庶事咸寧今皇帝以幼年煢煢在疚朕且佐助聽政外有大國賢王並為藩屏內有公卿大夫統理本朝恭己受成夫何憂哉然守文之際必有內輔以參聽斷侍中憲朕之元兄行能兼備忠孝尤篤先帝所器親受遺詔當以舊典輔斯職焉憲固執謙讓節不可奪今供養兩宮宿衛左右厥事已重亦不可復勞以政事故太尉鄧彪元功之族三讓彌高海內歸仁為群賢首先帝褎表欲以崇化今彪聰明康強可謂老成黃耇矣其以彪為太傅賜爵關內侯録尚書事百官總己以聽朕庶幾得專心內位於戲群公其勉率百僚各修厥職愛養元元綏以中和稱朕意焉見後漢和帝紀又略見袁宏後漢紀十二又見藝文類聚四十八御覽二百六二百十引漢官儀免馬融制融典校祕書不推忠盡節而羞薄詔除希望欲仕州郡免官勿罪見後漢馬融傳注引融集以張禹為太傅徐防為太尉詔昔唐虞之盛猶待四輔周文之寧實在多士漢興舊制咸宜保傅並建左右以參聽斷太傅禹三世在位黃髮罔僭司徒防以臺閣機密施政牧守竭力致身先帝嘉之其以禹為太傅防為太尉參録尚書事百官總己以聽政見袁宏後漢紀十四又見藝文類聚四十八引漢舊儀大赦詔皇帝幼沖承統鴻業朕且權禮佐助聽政兢兢寅畏不知所濟深惟至治之本道化在前刑罰在後將稽中和廣施慶惠與吏民更始其大赦天下自建武以來諸犯禁錮詔書雖解有司持重多不奉行其皆復為平民見後漢殤紀減服御詔自夏以來陰雨過節暖氣不效將有厥咎思惟僭失深自克責寤寐憂惶未知所由昔夏后惡衣服菲飲食孔子曰吾無間然今新遭大憂且歲節未和徹膳損服庶有補焉其減太官導官尚方內署諸服御珍膳靡麗難成之物見後漢殤紀又見袁宏後漢紀十五有刪節遣掖庭宮人詔詔司徒大司農長樂少府曰朕以無德佐助統政夙夜經營懼失厥衷思惟治道由近及遠先內後外自建武之初以至于今八十餘年宮人歲增房御彌廣又宗室坐事沒入者猶託名公族甚可愍焉今悉免遣及掖庭宮人皆為庶民以抒幽隔鬱滯之情諸宮府郡國王侯家奴婢姓劉及疲癃羸老皆上其名務令實悉見後漢殤紀舉隱逸大儒詔易稱天垂象聖人則之又云聖人之情見于辭然則文章之作將以幽贊神明變畼萬物秦燔詩書禮壞樂崩大漢之興拾而弘之至乎元康五風之間英豪四集文章煥炳六經之學于斯為盛自頃以來學者怠惰遂以陵遲宜令公卿中二千石各舉隱逸大儒碩德高操以勸後進見袁宏後漢紀十五立安帝詔先帝聖德淑茂早棄天下朕奉皇帝夙夜瞻仰日月冀望成就豈意卒然顛沛天年不遂悲痛斷心朕惟平原王素被痼疾念宗廟之重思繼嗣之統唯長安侯祜質性忠孝小心翼翼能通詩論篤學樂古仁惠愛下年已十三有成人之志親德係後莫宜于祜禮昆弟之子猶己子春秋之義為人後者為之子不以父命辭王父命其以祜為孝和皇帝嗣奉承祖宗案禮儀奏見後漢安紀又見袁宏後漢紀十五檢敕外戚詔每覽前代外戚賓客假借威權輕薄謥詷至有濁亂奉公為人患苦咎在執法怠懈不輒行其罰故也今車騎將軍騭等雖懷敬順之志而宗門廣大姻戚不少賓客姦猾多干禁憲其明加檢敕勿相容護見後漢和熹鄧后紀以王渙子石為郎中詔夫忠良之吏國家所以為理也求之甚勤得之至寡故孔子曰才難不其然乎昔大司農朱邑右扶風尹翁歸政迹茂異令名顯聞孝宣皇帝嘉歎愍惜而以黃金百斤策賜其子故洛陽令王渙秉清修之節蹈羔羊之義盡心奉公務在惠民功業未遂不幸早世百姓追思為之立祠自非忠愛之至孰能若斯者乎今以渙子石為郎中以勸勞勤見後漢王渙傳禁供薦新味詔凡供薦新味多非其節或鬱養強孰或穿掘萌牙味無所至而大折生長豈所以順時育物乎傳曰非其時不食自今當奉祠陵廟及給御者皆須時乃上見後漢和熹鄧后紀詔河南尹鄧豹等吾所以引納群子置之學官者實以方今承百王之敝時俗淺薄巧偽滋生五經衰缺不有化導將遂陵遲故欲褎崇聖道以匡失俗傳不云乎飽食終日無所用心難矣哉今末世貴戚食祿之家溫衣美飯乘堅驅良而面牆術學不識臧否斯故禍敗所從來也永平中四姓小侯皆令入學所以矯俗厲薄反之忠孝先公既以武功書之竹帛兼以文德教化子孫故能束修不觸羅網誠令兒曹上述祖考休烈下念詔書本意則足矣其勉之哉見後漢和熹鄧后紀遺詔朕以無德託母天下而薄祜不天早離大憂延平之際海內無主元元厄運危於纍卵勤勤苦心不敢以萬乘為樂上欲不欺天愧先帝下不違人負宿心誠在濟度百姓以安劉氏自謂感徹天地當蒙福祚而喪禍內外傷痛不絶頃以廢病沈滯久不待祠自力上原陵加咳逆唾血遂至不解存亡大分無可奈何公卿百官其勉盡忠恪以輔朝廷見後漢和熹鄧后紀敕司隸校尉部刺史實核水災夫天降災戾應政而至間者郡國或有水災妨害秋稼朝廷惟咎憂惶悼懼而郡國欲獲豐穰虛飾之譽遂覆蔽災害多張墾田不揣流亡競增戶口掩匿盜賊令姦惡無懲署用非次選舉乖宜貪苛慘毒延及平民刺史垂頭塞耳阿私下比不畏于天不愧于人假貸之恩不可數恃自今以後將糾其罰二千石長吏其各實核所傷害為除田租芻稿見後漢殤紀敕掖庭令何故有此不祥之言自今以後祀但謝過而已不得復有此言見袁宏後漢紀十六賜周馮貴人歸園策朕與貴人託配後庭共歡等列十有餘年上天不弔不獲福祐先帝早棄天下孤心煢煢靡所瞻仰夙夜永歎感愴發中今當以舊典分歸後園相戀之情慘結增歎燕燕之詩曷能喻焉其賜貴人王青蓋車采飾輅驂馬各一駟黃金三十斤雜帛三千匹白越四千端又賜馮貴人王赤綬以未有頭上步搖環佩加賜各一具見後漢和熹鄧后紀又略見袁宏後漢紀十五策命長安侯即皇帝位惟延平元年秋八月癸丑皇太后曰咨長安侯祜孝和皇帝懿德巍巍光于四海大行皇帝不永天年朕惟侯孝章帝世嫡皇孫謙恭慈順在孺而勤宜奉郊廟承統大業今以侯嗣孝和皇帝後其審君漢國允執其中一人有慶萬民賴之皇帝其勉之哉見後漢安紀報鄧閶長歸冥冥往而不反見東觀漢記恭陵次序詔孝殤皇帝雖不永休祚而即位踰年君臣禮成孝安皇帝承襲統業而前世遂令恭陵在康陵之上追覽前代位第之官先後相踰失其次序非所以奉宗廟之重垂無窮之制昔定公追正順祀春秋善之其令恭陵次康陵憲陵次恭陵以序親秩為萬世法見袁宏後漢紀二十又後漢質紀寬罰詔昔堯命四子以欽天道鴻範九疇休咎有象夫瑞以和降異因逆感禁微應大前聖所重頃者州郡輕慢憲防競逞殘暴造設科條陷入無罪或以喜怒驅逐長吏恩阿所私罰枉仇隙至令守闕訴訟前後不絶送故迎新人離其害怨氣傷和以致災眚書云明德慎罰方春東作育微敬始其敕有司罪非殊死且勿案驗以崇在寬見後漢質紀又略見袁宏後漢紀二十詔詰欒巴大行皇帝晏駕有日卜擇陵園務從省約塋域所極裁二十頃而已巴虛言主者壞人冢墓事既非實寢不報下巴猶固遂其愚復上誹謗苟肆狂瞽益不可長見後漢欒巴傳巴小子弄口鳴舌見北堂書鈔三十二引典略太后詔立質帝詔先帝早棄天下胤嗣幼沖何悟倉卒仍遭不造惟太后定之考人神之誠惟建平侯纘幼而岐嶷師傅不煩年已八歲克昌化之形于體貌春秋之義為人后者為之子其以纘為孝順皇帝嗣見袁宏後漢紀二十憂旱詔朕以不德託母天下布政不明每失厥中自春涉夏大旱炎赫憂心京京故得禱祈明祀冀蒙潤澤前雖得雨而宿麥頗傷比日陰雲還復開霽寤寐永歎重懷慘結將二千石令長不崇寬和暴刻之為乎其令中都官繫囚罪非殊死考未竟者一切任出以須立秋郡國有名山大澤能興雲雨者二千石長吏各潔齋請禱謁誠盡禮又兵役連年死亡流離或支骸不斂或停棺莫收朕甚愍焉昔文王葬枯骨人賴其德今遣使者案行若無家屬及貧無資者隨宜賜恤以慰孤魂見後漢質紀稟窮弱葬枯骸詔九江廣陵二郡數離寇害殘夷最甚生者失其資業死者委尸原野昔之為政一物不得其所若己為之況我元元嬰此困毒方春戒節賑濟乏厄掩骼埋胔之時其調比郡見穀出稟窮弱收葬枯骸務加埋恤以稱朕意見後漢質紀又見袁宏後漢紀二十有小異立桓帝詔孝質皇帝胤嗣不遂奄忽天昏以社稷之重考宗室之賢莫若蠡吾侯志年已十五嘉姿卓茂又近為孝順皇帝嗣見袁宏後漢紀二十嚴選舉詔孝廉廉吏皆當典城牧民禁姦舉善興化之本恆必由之詔書連下分明懇惻而在所玩習遂至怠慢選舉乖錯害及元元頃雖頗繩正猶未懲改方今淮夷未殄軍師屢出百姓疲悴困于徵發庶望群吏惠我勞民蠲滌貪穢以祈休祥其令秩滿百石十歲以上有殊才異行乃得參選臧吏子孫不得察舉杜絶邪偽請託之原令廉白守道者得信其操各明守所司將觀厥後見後漢桓紀遣子就學詔大將軍下至六百石悉遣子就學每歲輒于鄉射月一饗會之以此為常見後漢儒林傳序減死罪詔郡國繫囚減死罪一等勿笞唯謀反大逆不用此書見後漢桓紀減陵工刑徒詔比起陵塋彌歷時歲力役既廣徒隸尤勤頃雨澤不沾密雲復散儻或在茲其令徒作陵者減刑各六月見後漢桓紀增封濟北王次詔濟北王次以幼年守藩躬履孝道父沒哀慟焦毀過禮草廬土席衰杖在身頭不枇沐體生瘡腫諒暗已來二十八月自諸國有憂未之聞也朝廷甚嘉焉書不云乎用德章厥善詩云孝子不匱永錫爾類今增次封五千戶廣其土宇以慰孝子惻隱之勞見後漢濟北惠王壽傳册封中常侍州輔為葉吉成侯詔蓋聞春秋之采毫毛之善大漢典制有恩澤之封輔歷世守省恪恭位著建立之際處乎左右常伯之職同協意以亮天功往者鄭衆蔡倫行事科比其封輔為葉吉成侯見隸釋十七州輔碑詔告光祿勳汝南太守昔在前世求賢如渴封墓軾閭以光賢哲故公叔見誄翁歸蒙述所以昭忠厲俗作範後昆故光祿大夫周舉性侔夷魚忠踰隨管前授牧守及還納言出入京輦有欽哉之績在禁闈有密靜之風豫録乃勳用登九列方欲式序百官亮協三事不永夙終用乖遠圖朝廷愍悼良為愴然詩不云乎肇敏戎功用錫爾祉其令將大夫以下到喪發日復會弔加賜錢十萬以旌委蛇素絲之節焉見後漢周舉傳又略見袁宏後漢紀二十一遣中常侍曹騰之國詔惟建和元年七月二十二日己巳皇太后曰其遣費亭侯之國為漢藩輔臨君境內毋有出變卒百姓不可不愛不愛則不附大臣不親百姓不附可不慎下缺見隸釋十五曹騰碑陰日食寬禁徙詔蓋聞天生蒸民不能相理為之立君使司牧之君道得于下則休祥著乎上庶事失其序則咎徵見乎象間者日食毀缺陽光晦暗朕祗懼潛思匪遑啓處傳不云乎日食修德月食修刑昔孝章帝愍前世禁徙故建初之元並蒙恩澤流徙者使還故郡沒入者免為庶民先皇德政可不務乎其自永建元年迄于今歲凡諸妖惡支親從坐及吏民減死徙邊者悉歸本郡唯沒入者不從此令見後漢桓紀葬死者詔朕攝政失中災眚連仍三光不明陰陽錯序監寤寐歎疢如疾首今京師廝舍死者相枕郡縣阡陌處處有之甚違周文掩胔之義其有家屬而貧無以葬者給直人三千喪主布三匹若無親屬可于官壖地葬之表識姓名為設祠祭又徒在作部疾病致醫藥死亡厚埋藏民有不能自振及流移者稟穀如科州郡檢察務崇恩施以康我民見後漢桓紀歸政詔曩者遭家不造先帝早世永惟大宗之重深思嗣續之福詢謀台輔稽之兆占既建明哲克定統業天人協和萬國咸寧元服已加將即委付而四方竊頗有未靜故假延臨政以須安謐幸賴股肱御侮之助殘醜消蕩民和年稔普天率土遐邇洽同遠覽復子明辟之義近慕先姑歸授之法及今令辰皇帝稱制群公卿士虔恭爾位戮力一意勉同斷金展也大成則所望矣見後漢桓紀曩者遭家不造大禍薦臻欽惟宗廟之重社稷之大爰立明哲將即委授而東西南北醜類未賓故且總攝助理萬機今悉討除遠慕復子明辟之義其及今辰皇帝稱制見袁宏後漢紀二十一遺詔朕素有心下結氣從間以來加以浮腫逆害飲食寖以沈困比使內外勞心請禱私自忖度日夜虛劣不能復與群公卿士共相終竟援立聖嗣恨不久育養見其終始今以皇帝將軍兄弟委付股肱其各自勉焉見後漢順烈梁后傳册趙峻為太傳李固為太尉三公國之楨幹朝廷取正以成斷金太尉趙峻二掌樞衡有匪石不二之心大司農李固公族之苗忠直不回有史魚之風其以峻為大傅固為太尉參録尚書事見藝文類聚四十八御覽二百八又二百八又二百十並引漢官儀立靈帝詔大行皇帝德配天地光照上下不獲胤嗣之祚早棄萬國朕憂心摧傷追覽前代法王后無適即擇賢近親考德敘才莫若解犢亭侯宏年十有二嶷然有周成之質春秋之義為人後者為之子其以宏為大行皇帝嗣使光祿大夫劉倏持節之國奉迎見袁宏後漢紀二十二以陳蕃為太傅詔夫民生樹君使司牧之必須良佐以固王業前太尉陳蕃忠清直亮其以蕃為太傅録尚書事見後漢陳蕃傳復優詔封陳蕃蓋褎功以勸善表義以厲俗無德不報大雅所歎太輔陳蕃輔弼先帝出內纍年忠孝之美德冠本朝謇愕之操華首彌固今封蕃高陽侯食邑三百戶見後漢陳蕃傳下詔段熲先零東羌歷載為患熲前陳狀欲必掃滅涉履霜雪兼行晨夜身當矢石感厲吏士曾未浹日凶醜奔破連尸積俘掠獲無算洗雪百年之逋負以慰忠將之亡魂功用顯著朕甚嘉之須東羌盡定當並録功勤今且賜熲錢二十萬以家一人為郎中敕中藏府調金錢綵物增助軍費拜熲破羌將軍見後漢段熲傳册陳蕃為太傅故太尉陳蕃忠亮謇諤有不吐茹之節司徒廣敦德允元五世從政今以蕃為太傅與廣參録尚書事見藝文類聚四十八御覽二百十引漢官儀與父伏完書司空殺董承帝方為報怨見引獻帝春秋
