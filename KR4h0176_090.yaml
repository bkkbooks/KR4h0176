body:
  text: 臨邑侯復箋煩爾昨所作詩便附編末所謂坐嫫母于文茵而比枝于娵閭見北堂書鈔一百三十四臨命上疏臣蒙恩得備蕃輔特受二國宮室禮樂事事殊異巍巍無量訖無報稱而自修不謹連年被疾為朝廷憂念皇太后陛下哀憐臣強感動發中數遣使者太醫令丞方伎道術絡驛不絶臣伏惟厚恩不知所言臣內自省視氣力羸劣日夜浸困終不復望見闕庭奉承帷幄孤負重恩銜恨黃泉身既夭命孤弱復為皇太后陛下憂慮誠悲誠慚息政小人也猥當襲臣後必非所以全利之也誠願還東海郡天恩愍哀以臣無男之故處臣三女小國侯此臣宿昔常計今天下新罹大憂惟陛下加供養皇太后數進御餐臣強困劣言不能盡意願並謝諸王不意永不復相見也見後漢東海王強傳又見袁宏後漢紀九上書對易林占雨蹇艮下坎上艮為山坎為水山出云為雨蟻穴處知雨將至故以蟻為興見御覽十又七百二十七引東觀漢記沛獻王輔善京氏易薦西曹掾吳良疏臣聞為國所重必在得人報恩之義莫大薦士竊見臣府西曹掾齊國吳良資質敦固公方廉恪躬儉安貧白首一節又治尚書學通師法經任博士行中表儀宜備宿衛以輔聖政臣蒼榮寵絶矣憂責深大私慕公叔同升之義懼于臧文竊位之罪敢秉愚瞽犯冒嚴禁見後漢吳良傳上疏歸職臣蒼疲駑特為陛下慈恩覆護在家被教導之仁升朝蒙爵命之首制書褎美班之四海舉負薪之才升君子之器凡匹夫一介尚不忘簞食之惠況臣居宰相之位同氣之親哉宜當暴骸膏野為百僚先而愚頑之質加以固病誠羞負乘辱汙輔將之位將被詩人三百赤紱之刺今方域晏然要荒無警將遵上德無為之時文官猶可併省武職尤不宜建昔象封有鼻不任以政誠由愛深不忍揚其過惡前事之不忘來事之師也自漢興以來宗室子弟無得在公卿位者惟陛下審覽虞帝優養母弟遵承舊典終卒厚恩乞上驃騎將軍印綬退就蕃國願蒙哀憐見後漢東平憲王蒼傳又略見袁宏後漢紀八諫為原陵顯節陵起立郭邑疏伏聞當為二陵起立郭邑臣前頗謂道路之言疑不審實近令從官古霸問涅陽主疾使還乃知詔書已下竊見光武皇帝躬履儉約之行深睹始終之分勤勤懇懇以葬制為言故營建陵地具稱古典詔曰無為山陵陂池裁令流水而已孝明皇帝大孝無違奉承貫行至於自所營創尤為儉省謙德之美于斯為盛臣愚以園邑之興始自強秦古者丘隴且不欲其著明豈況築郭邑建都郛哉上違先帝聖心下造無益之功虛費國用動搖百姓非所以致和氣祈豐年也又以吉凶俗數言之亦不欲無故繕修丘墓有所興起考之古法則不合稽之時宜則違人求之吉凶復未見其福陛下履有虞之至性追祖禰之深思然懼左右過議以纍聖心臣蒼誠傷二帝純德之美不畼于無窮也惟蒙哀覽見後漢東平憲王蒼傳又略見袁宏後漢紀十一辭受恩過禮疏臣聞貴有常尊賤有等威卑高列序上下以理陛下至德廣施慈愛骨肉既賜奉朝請咫尺天儀而親屈至尊降禮下臣每賜宴見輒興席改容中宮親拜事過典故臣惶怖戰栗誠不自安每會見踧踖無所措置此非所以章示群下安臣子也見後漢東平憲王蒼傳上書諫獵臣聞時令盛春農事不聚衆興功傳曰田獵不宿食飲不享出入不節則木不曲直此失春令者也臣知車駕今出事從約省所過吏人諷誦甘棠之德雖然動不以禮非所以示四方也惟陛下因行田野循視稼穡經覽河山消搖仿佯弭節而旋至秋冬乃振威靈整法駕備周衛設羽旄詩云抑抑威儀惟德之隅敬慎威儀惟民之則臣愚不勝憤悶伏自手書乞詣行在所極陳至誠見後漢東平王蒼傳又見袁宏後漢紀九上言明德皇后在世祖廟坐位文武宣元祖祫食高廟皆以配先帝所制典法設張大雅曰昭哉來御慎其祖武又曰不愆不忘率由舊章明德皇后宜配孝明皇帝于世祖廟同席而供饌見續漢祭祀志下注補引謝沈書南北郊冕服議孔子曰行夏之時乘殷之輅服周之冕為漢制法高皇帝始受命創業制長冠以入宗廟光武受命中興建明堂立辟雍陛下以聖明奉遵以禮服龍袞祭五帝禮缺樂崩久無祭天地冕服之制案尊事神祇潔齋盛服敬之至也日月星辰山龍華藻天王袞冕十有二旒以則天數旗有龍章日月以備其文今祭明堂宗廟圓以法天方以則地服以華文象其物宜以降神明肅雍備思博其類也天地之禮冕冠裳衣宜如明堂之制見續漢輿服志下注補引東觀書又見通典六十一世祖廟樂舞議漢制舊典宗廟各奏其樂不皆相襲以明功德秦為無道殘賊百姓高皇帝受命誅暴元元各得其所萬國咸熙作武德之舞孝文皇帝躬行節儉除誹謗去肉刑澤施四海孝景皇帝制昭德之舞孝武皇帝功德茂盛威震海外開地置郡傳之無窮孝宣皇帝制盛德之舞光武皇帝受命中興撥亂反正武畼方外震服百蠻戎狄奉貢宇內治平登封告成修建三雍肅修典祀功德巍巍比隆前代以兵平亂武功盛大歌所以詠德舞所以象功世祖廟樂舞名宜曰大武之舞元命包曰緣天地之所雜樂為之文典文王之時民樂其與師征伐而詩人稱其武功樞機鈐曰有帝漢出德洽作樂各與虞韶禹夏湯濩周武無異不宜以名舞葉圖徵曰大樂必易詩傳曰頌言成也一章成篇宜列德故登歌清廟一章也漢書曰百官頌所登御者一章十四句依書文始五行武德昭真修之舞節損益前後之宜六十四節為舞曲副八佾之數十月蒸祭始御用其文始五行之舞如故勿進武德舞歌詩曰於穆世廟肅雍顯清俊乂翼翼秉文之成越序上帝駿奔來寧建立三雍封禪泰山章明圖讖放唐之文休矣惟德罔射協同本支百世永保厥功見續漢祭祀志下注補引東觀書明帝廟樂議昔者孝文廟樂曰昭德之舞孝武廟樂曰盛德之舞今皆祫食于高廟昭德盛德之舞不進與高廟同樂今孝明皇帝主在世祖廟當同樂盛德之樂無所施如自立廟當作舞樂者不當與世祖廟盛德之武同名即不改作舞樂當進武德之舞臣愚戇鄙陋廟堂之論誠非所當聞所宜言陛下體純德之妙奮至謙之意猥歸美于載列之臣故不敢隱蔽愚請披露腹心誠知愚鄙之言不可以仰四門賓于之議伏惟陛下以至德當成康之隆天下乂安刑措之時也百姓盛歌元首之德股肱貞良庶事寧康臣欽仰聖化嘉羡盛德危顛之備非所宜稱見續漢祭祀志下注引東觀書詐為郭況與東海王強書君王無罪猥被斥廢而兄弟至有束縛入牢獄者太后失職別守北宮及至年老遠斥居邊海內深痛觀者鼻酸及太后尸柩在堂洛陽吏以次捕斬賓客至有一家三尸伏堂者痛甚矣今天下有喪弓弩張設甚備間梁松敕虎賁中曰吏以便宜見非勿有所拘封侯難再得也郎官竊悲之為王寒心纍息今天下爭欲思刻賊王以求功寧有量邪若歸并二國之衆可聚百萬君王為之主鼓行無前功易于泰山破雞子輕于四馬載鴻毛此湯武兵也今年軒轅星有白氣星家及喜事者皆云白氣者喪軒轅女主之位又太白前出西方至午兵當起又太子星色黑至辰日輒變赤夫黑為病赤為兵王努力卒事高祖起亭長陛下興白水何況于王陛下長子故副主哉上以求天下事必舉下以雪除沈沒之恥報死母之讎精誠所加金石為開當為秋霜無為檻羊雖欲為檻羊又可得乎竊見諸相工言王貴天子法也人主崩亡閭閻之伍尚為盜賊欲有所望何況王邪夫受命之君天之所立不可謀也今新帝人之所置強者為右願君王為高祖陛下所志無為扶蘇將閭叫呼天也見後漢廣陵思王荊傳上疏辭謝和帝臣天性狂愚生在深宮長養傅母之手信惑左右之言及致歸國不知防禁從官侍史利臣財物熒惑臣畼臣畼無所昭見與相然諾不自知陷死罪以至考案肌栗心悸自悔無所復及自謂當即時伏顯誅魂魄去身分歸黃泉不意陛下聖德枉法曲平不聽有司橫貸赦臣戰栗連月未敢自安上念以負先帝而令陛下為臣收汙天下誠無氣以息筋骨不相連命在絲髮臣畼知大貸不可再得自誓束身約妻子不敢復出入失繩墨不敢復有所橫費租入有餘乞裁食雎陽穀孰虞蒙寧陵五縣還餘所食四縣臣畼小妻三十七人其無子者願還本家自選擇謹敕奴婢二百人其餘所受虎賁官騎及諸工技鼓吹倉頭奴婢兵弩廄馬皆上還本署臣暢以骨肉近親亂聖化汙清流既得生活誠無心面目以凶惡復居大宮食大國張官屬藏什物願陛下加大恩開臣自悔之門假臣遷善之路令天下知臣蒙恩得去死就生頗能自悔臣以公卿所奏臣罪惡詔書常置于前晝夜誦讀臣小人貪見明時不能即時自引惟陛下哀臣令得喘息漏刻若不聽許臣實無顏以久生下入黃泉無以見先帝此誠臣至心臣欲多還所受恐天恩不聽許節量所留于臣畼饒足見後漢梁王畼傳又略見袁宏後漢紀十四到國下令寡人生于深宮長于朝廷仰恃明主垂拱受成既以薄祐早離顧復屬遭大憂悲懷感傷蒙恩大國職惟藩輔新去京師憂心煢煢夙夜屏營未知所立蓋聞志不獨理必須明賢今官屬並居爵任失得是均庶望上遵策戒下免悔咎其糾督非枉明察典禁無令孤獲怠慢之罪焉見後漢清河孝王慶傳上太后書臣國士下溼願乞骸骨下從貴人于樊濯雖歿且不朽矣及今口目尚能言視冒昧干請命在呼吸願蒙哀憐見後漢清河孝王慶傳
