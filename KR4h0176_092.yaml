body:
  text: 侯霸立春下寬大詔制詔三公方春東作敬始慎微動作隨之罪非殊死且勿案驗皆須麥秋退貪殘進柔良下當用者如故事見續漢禮儀志上奏劾朱浮浮敗亂幽州構成寵罪徒勞軍師不能死節罪當伏誅見後漢朱浮傳李通辭位議王莽篡漢傾亂天下通懷伊呂蕭曹之謀建造大策扶助神靈輔成聖德破家為國忘身奉主有扶危存亡之義功德最高海內所聞通以天下平定謙讓辭位夫安不忘危宜令通居職療疾欲就諸侯不可聽見後漢李通傳上疏諫征彭寵臣聞文王受命而征伐五國必先詢之同姓然後謀于群臣加占蓍龜以定行事故謀則成卜則吉戰則勝其詩曰帝謂文王詢爾仇方同爾弟兄以爾鉤授與爾臨衝以伐崇庸崇國城守先退後伐所以重人命俟時而動故參分天下而有其二陛下承大亂之極受命而帝興明祖宗出入四年而滅檀鄉制五校降銅馬破赤眉誅鄭奉之屬不為無功今京師空匱資用不足未能服近而先事邊外且漁陽之地逼接北狄黠虜困迫必求其助又今所過縣邑尤為困乏種麥之家多在城郭聞官兵將至當已收之矣大軍遠涉二千餘里士馬罷勞轉糧艱阻今兗豫青冀中國之都而寇賊從橫未及從化漁陽以東本備邊塞地接外虜貢稅微薄安平之時尚資內郡況今荒耗豈足先圖而陛下捨近務遠棄易求難四方疑怪百姓怨懼誠臣之所惑也復願遠覽文王重兵博謀近思征伐前後之宜顧問有司使極愚誠采其所長擇之聖慮以中土為憂念見後漢伏湛傳移書屬縣屬縣不得相侵陵天生蒸民必為立君非久亂也且養老育幼以待真主見袁宏後漢紀四更始時湛為平原太守被執遣間使上書臣隆奉使無狀受執凶逆雖在困厄授命不顧又吏人知步反畔心不附之願以時進兵無以臣隆為念臣隆得生到闕廷受誅有司此其大願若令沒身寇手以父母昆弟長纍陛下陛下與皇后太子永享萬國與天無極見後漢伏隆傳移檄告郡國乃者猾臣王莽殺帝盜位宗室與兵除亂誅莽故群下推立聖公以主宗廟而任用賊臣殺戮賢良三王作亂盜賊縱橫忤逆天心卒為赤眉所害皇天祐漢聖哲應期陛下神武奮發以少制衆故尋邑以百萬之軍潰散于昆陽王郎以全越之師土崩于邯鄲大彤高胡望旗消靡鐵脛五校莫不摧破梁王劉永幸以宗室屬籍爵為侯王不知厭足自求禍棄遂封爵牧守造為詐逆今虎牙大將軍屯營十萬已拔睢陽劉永奔迸家已族矣此諸軍所聞也不先自圖後悔何及見後漢伏隆傳六宗表臣竊以十一家凡有六統而所據各異考之經禮大義不通臣謂禋于六宗祀祖考所尊者六宗則三昭三穆也見御覽五百二十八奏加王莽九錫聖帝明王招賢勸能德盛者位高功大者賞厚故宗臣有九命上公之尊則有九錫登等之寵今九族親睦百姓既章萬國和協黎民時雍聖瑞華溱太平已洽帝者之盛莫隆于唐虞而陛下任之忠臣茂功莫著于伊周而宰衡配之所謂異時而興如合符者也謹以六藝通義經文所見周官禮記宜于今者為九命之錫臣請命錫見漢書王莽傳上奏除親廟陛下興于四庶蕩滌天下誅鉏暴亂興繼祖宗竊以經義所紀人事衆心雖實同創革而名為中興宜奉先帝恭承祭祀者也元帝以來宗朝奉祠高皇帝為受命祖孝文皇帝為太宗孝武皇帝為世宗皆如舊制又立親廟四世推南頓君以上盡于舂陵節侯禮為人後者則為之子既事大宗則降其私親今禘祫高廟陳序昭穆而舂陵四世君臣並列以卑廁尊不合禮意設不遭王莽而國嗣無寄推求宗室以陛下繼統者安得復顧私親違禮制乎昔高帝以自受命不由太上宣帝以孫後祖不敢私親故為父立廟獨群臣侍祠臣愚謂宜除今親廟以則二帝舊典願下有司博采其議見後漢張純傳又略見續漢祭祀志下奏行禘祫祭禮三年一祫五年一禘春秋傳曰大祫者何合祭也毀廟及未毀廟之主皆登合食乎太祖五年而再殷漢舊制三年一祫毀廟主合食高廟存廟主未嘗合祭元始五年諸王公列侯廟會始為禘祭又前十八年親幸長安亦行此禮禮説三年一閏天氣小備五年再閏天氣大備故三年一祫五年一禘禘之為言諦諦定昭穆尊卑之義也禘祭以夏四月夏者陽氣在上陰氣在下故正尊卑之義也祫祭以冬十月冬者五穀成熟物備禮成故合聚飲食也斯典之廢於茲八年謂可如禮施行以時定議見後漢張純傳又見續漢祭祀志下各有刪節奏宜封禪自古受命而帝治世之隆必有封禪以告成功焉樂動聲儀曰以雅治人風成于頌有周之盛成康之間郊配封禪皆可見也書曰歲二月東巡狩至于岱宗柴則封禪之義也臣伏見陛下受中興之命平海內之亂修復祖宗撫存萬姓天下曠然咸蒙更生恩德雲行惠澤雨施黎元安寧夷狄慕義詩云受天之祜四方來賀今攝提之歲蒼龍甲寅德在東宮宜及嘉時遵唐帝之典繼孝武之業以二月東巡狩封于岱宗明中興勒功勳復祖統報天神禪梁父祀地祇傳祚子孫萬世之基也見後漢張純傳又袁宏後漢紀八臨終敕家丞歙司空無功于時猥蒙爵土身死之後勿議傳國見後漢張奮傳泰山刻石文維建武三十有二年二月皇帝東巡狩至于岱宗祡望秩于山川班于群神遂覲東后從臣太尉熹行司徒事特進高密侯禹等漢賓二王之後在位孔子之後褒成侯序在東后蕃王十二咸來助祭河圖赤伏符曰劉秀發兵捕不道四夷雲集龍鬭野四七之際火為主河圖會昌符曰赤帝九世巡省得中治平則封誠合帝道孔矩則天文靈出地祇瑞興帝劉之九會命岱宗誠善用之姦偽不萌赤漢德興九世會昌巡狩皆當天地扶九崇經之常漢大興之道在九世之王封于泰山刻石著記禪于梁父退省考五河圖合古篇曰帝劉之秀九名之世帝行德封刻政河圖提劉子曰九世之帝方明聖持衡拒九州平天下豫雒書甄曜度曰赤三德昌九世會修符合帝際勉刻封孝經鉤命決曰子誰行赤劉用帝三建孝九會修專茲竭行封岱青河雒命后經讖所傳昔在帝堯聰明密微讓與舜庶後裔握機王莽以舅后之家三司鼎足冢宰之權勢依托周公霍光輔幼歸政之義遂以篡叛僭號自立宗廟隳壞社稷喪亡不得血食十有八年揚徐青三州首亂兵革橫行延及荊州豪杰并兼百里屯聚往往僭號北夷作寇千里無煙無雞鳴犬吠之聲皇天眷顧皇帝以匹庶受命中興年二十八載興兵起是以中次誅討十有餘年罪人則斯得黎庶得居爾田安爾宅書同文車同軌人同倫舟輿所通人迹所至靡不貢職建明堂立辟雍起靈臺設庠序同律度量衡修五禮五玉三帛二牲一死贄吏各修職復于舊典在位三十有二年年六十二乾乾日昃不敢荒寧涉危歷險親巡黎元恭肅神祇惠恤耆老理庶遵古聰允明恕皇帝唯慎河圖雒書正文是月辛卯祡登封泰山甲午禪于梁陰以承靈瑞以為兆民永茲一宇垂于後昆百寮從臣郡守師尹咸蒙祉福永永無極秦相李斯燔詩書樂崩禮壞建武元年已前文書散亡舊典不具不能明經文以章句細微相況八十一卷明者為驗又其十卷皆不昭晰子貢欲去售告朔之餼羊子曰賜也爾愛其羊我愛其禮後有聖人正失誤刻石記見續漢祭祀志上上至奉高遣侍御史與蘭臺令吏將工先上山刻石文云云又略見通典五十四因災旱上疏歲比不登人食不足今復久旱秋稼未立陽氣垂盡日月迫促夫國以民為本民以縠為命政之急務憂之重者也臣蒙恩尤深厚受職過任夙夜憂惶章奏不能敘心願對中常侍口陳得失見袁宏後漢紀十三又見後漢張奮傳請定禮樂疏聖人所美政道至要本在禮樂五經同歸而禮樂之用尤急孔子曰安上治民莫善于禮移風易俗莫善于樂又曰揖讓而化天下者禮樂之謂也先王之道禮樂可謂盛矣孔子謂子夏曰禮以修外樂以制內丘已矣夫又曰禮樂不興則刑罰不中刑罰不中則民無所厝其手足臣以為漢當制作禮樂是以先帝聖德數下詔書愍傷崩缺而衆儒不達議多駁異臣纍世台輔而大典未定私竊惟憂不忘寢食臣犬馬齒盡誠冀先死見禮樂之定見後漢張奮傳復上疏條禮樂異議三事漢當改作禮樂圖書著明王者化定制禮功成作樂謹條禮樂異議三事願下有司以時考定昔者孝武皇帝光武皇帝封禪告成而禮樂不定事不相副先帝已詔曹褎今陛下但奉而成之猶周公斟酌文武之道非自為制誠無所疑久執謙謙令大漢之業不以時成非所以章顯祖宗功德建太平之基為後世法見後漢張奮傳又略見書鈔五十三引續漢書上書辭襲封根不病衰臣小稱疾令翕立後臣時在河南冢廬臣見純前告翕語自以兄弟不當蒙襲爵之恩願下有司見引東觀漢記仙賦並序余少時為郎從孝成帝出祠甘泉河東見部先置華陰集靈宮宮在華山下武帝所造欲以懷集仙者王喬赤松子故名殿為存仙端門南向山署曰望仙門余居此焉竊有樂高眇之志即書壁為小賦以頌美曰見書鈔一百二藝文類聚七十八夫王喬赤松呼則出故翕則納新大矯經引積氣關元精神周洽鬲塞流通乘凌虛無洞達幽明諸物皆見玉女在旁仙道既成神靈攸迎乃驂駕青龍赤騰為歷躇玄厲之嶊嶵有似乎鸞鳳之翔飛集于膠葛之宇泰山之臺吸玉液食華芝漱玉漿欽金醪出宇宙與雲浮灑輕霧濟傾崖觀滄川而升天門馳白鹿而從麒麟周覽八極還崦華壇泛泛乎濫濫乎隨天轉旋容容無為壽極乾坤見藝文類聚七十八陳時政疏臣聞國之廢興在于政事政事得失由乎輔佐輔佐賢明則俊士充朝而理合世務輔佐不明則論失時宜而舉多過事夫有國之君俱欲興化建善然而政道未理者其所謂賢者異也昔楚莊王問孫叔敖曰寡人未得所以為國是也叔敖曰國之有是衆所惡也恐王不能定也王曰不定獨在君亦在臣乎對曰君驕士曰士非我無從富貴士驕君曰君非士無從安存人君或至失國而不悟士或至飢寒而不進君臣不合則國是無從定矣莊王曰善願相國與諸大夫共定國是也蓋善政者視俗而施教察失而立防威德更興文武迭用然後政調于時而躁人可定昔董仲舒言理國譬若琴瑟其不調者則解而更張夫更張難行而拂衆者亡是故賈誼以才逐而鼂錯以智死世雖有殊能而終莫敢談者懼于前事也且設法禁者非能盡塞天下之姦皆合衆人之所欲也大抵取便國利事多者則可矣夫張官置吏以理萬人縣賞設罰以別善惡惡人誅傷則善人蒙福矣今人相殺傷雖已伏法而私結怨讎子孫相報後忿深前至于滅戶殄業而俗稱豪健故雖有怯弱猶勉而行之此為聽人自理而無復法禁者也今宜申明舊令若已伏官誅而私相傷殺者雖一身逃亡皆徙家屬于邊其相傷者加常二等不得雇山贖罪如此則仇怨自解盜賊息矣夫理國之道舉本業而抑末利是以先帝禁人二業錮商賈不得宦為吏此所以抑并兼長廉恥也今富商大賈多放田貨中家子弟為之保役趨走與臣僕等勤收稅與封君比入是以衆人慕效不耕而食至乃多通侈靡以淫耳目今可令諸商賈自相糾告若非身力所得皆以臧畀告者如此則專役一己不敢以貨與人事寡力弱必歸功田畝田畝修則穀入多而地力盡矣又見法令決事輕重不齊或一事殊法同罪異論姦吏得因緣為市所欲活則出生議所欲陷則與死比是為刑開二門也今可令通義理明習法律者校定科比一其法度班下郡國蠲除故條如此天下知方而獄無怨濫矣見後漢桓談傳抑讖重賞疏臣前獻瞽言未蒙詔報不勝憤悶冒死復陳愚夫策謀有益于政道者以合人心而得事理也凡人情忽于見事而貴于異聞觀先王之所記述咸以仁義正道為本非有奇怪虛誕之事蓋天道性命聖人所難言也自子貢以下不得而聞況後世淺儒能通之乎今諸巧慧小才伎數之人增益圖書矯稱讖記以欺惑貪邪詿誤人主焉可不抑遠之哉臣談伏聞陛下窮折方士黃白之術甚為明矣而乃欲聽納讖記又何誤也其事雖有時合譬猶卜數隻偶之類陛下宜垂明聽發聖意屏群小之曲説述五經之正義略雷同之俗語詳通人之雅謀又臣聞安平則尊道術之士有難則貴介胄之臣今聖朝興復祖統為人臣主而四方盜賊未盡歸伏者此權謀未得也臣談復觀陛下用兵諸所降下既無重賞以相恩誘或至虜掠奪其財物是以兵長渠率各生狐疑黨輩連結歲月不解古人有言曰天下皆知取之為取而莫知與之為取陛下誠能輕爵重賞與士共之則何招而不至何説而不釋何向而不開何征而不克如此則能以狹為廣以遲為速亡者復存失者復得矣見後漢桓談傳上便宜管仲桓公之指南見文選東京賦注陳便宜所謂霸功者法度明正百官修治威令流行者也見文選王仲宣誄注啓事官吏二千石布襦羊裘以白木杯飲食飾虛詐欲以求名干譽答揚雄書子雲勤味道腴見文選班固答賓戲注又任昉王文憲集序注又潘嶽楊荊州誄注
