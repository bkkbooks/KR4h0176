body:
  text: 桓子新論下離事第十一舉網以綱千目皆張振裘持領萬毛自整治大國者亦當如是見意林以賢代賢謂之順以不肖代不肖謂之亂見意林御覽四百二關竝字子陽材智通達見漢書溝洫志注大司馬張戎字仲功習溉灌事見漢書溝洫志注御覽六十一事類河賦注議曰見事類河賦注河水濁一石水六斗泥而民競引河溉田今河不通利至三月桃花水至則河決以其噎不泄也可以禁民勿復引河見御覽六十一事類河賦注韓牧字子台善水事見漢書溝洫志注王平仲云周譜言定王五年河徒故道今所行處非禹所穿見意林四瀆之源河最高而長從高注下水流激峻故其流急為平地災害見水經注河水一藝文類聚九通曆數家算法推考其紀從上古天元以來訖十一月甲子夜半朔冬至日月若連璧見初學記四歲華記麗四余前為郎典漏刻燥濕寒溫輒異度故有昏明晝夜晝日參以晷景夜分參以星宿則得其正見北堂書鈔未改本一百三十初學記二十五御覽二揚子雲好天文問之于黃門作渾天老工曰我少能作其事但隨尺寸法度殊不曉達其意然稍稍益愈至今七十乃甫適知己又老且死矣今我兒子愛學作之亦當復年如我乃曉知已又且復死焉其言可悲可笑也見北堂書鈔未改本一百三十御覽二通人揚子雲因衆儒之說天以天為如蓋轉常左旋日月星辰隨而東西乃圖畫形體行度參以四時曆數昏晝夜欲為世人立紀律以垂法後嗣余難之曰春秋晝夜欲等平旦日出于卯正東方暮日入于酉正西方今以天下人占視之此乃人之卯酉非天卯酉天之卯酉當北斗極北斗極天樞樞天軸也猶益有保斗矣蓋雖轉而保斗不移天亦轉周匝斗極常在知為天之中也仰視之又在北不正在人上而春秋分時日出入乃在斗南如蓋轉則北道近南道遠彼晝夜刻漏之數何從等平子雲無以解也後與子雲奏事待報坐白虎殿廊廡下以寒故背日曝背有頃日光去背不復曝焉因以示子云曰天即蓋轉而日西行其光影當照此廊下而稍東耳無乃是反應渾天家法焉子雲立壞其所作則儒家以為天左轉非也見晉書天文志一御覽二事類天賦注五藏言太山之上有刻石凡千八百餘處而可識知者七十有二見初學記九御覽五百三十六太史三世表旁行邪止并效周𧪻見梁書劉杳傳漢之三主內置黃門工倡見文選長笛賦注繁休伯與魏文帝箋注昔余在孝成帝時為樂府令凡所典領倡優伎樂蓋有千人見北堂書鈔未改本五十五聖賢之材不世而妙善之技不傳見文選王元長曲水詩序注揚子雲大才而不曉音余頗離雅樂而更為新弄子雲曰事淺易善深者難識卿不好雅頌而悅鄭聲宜也見御覽五百六十五惟人心之所獨曉父不能以禪子兄不能以教弟也見文選魏文帝典論論文注五聲各從其方春角夏徵秋商冬羽宮居中央而兼四季以五音須宮而成可以殿上五色錦屏風諭而示之望視則青赤白黃黑各各異類就視則皆以其色為地四色文飾之其欲為四時五行之樂亦當各以其聲為地而用四聲文飾之猶彼五色屏風矣見北堂書鈔未改本一百三十二御覽七百一余年七十為奉車郎衛殿中小苑西門見御覽二百十五譯謂揚子曰君之為黃門郎居殿中數見輿輦玉蚤華芝及鳳皇三蓋之屬皆元黃五色飾以金玉翠羽珠絡錦繡茵席者也見續漢輿服志上注又後漢班固傳上注北堂書鈔未刪改本一百四十一文選西都賦注寡婦賦注宋孝武宣貴妃誄注雖不見古路車亦數聞師之說但素輿而蒲茵也見北堂書鈔未刪改本一百四十一宓犧之制杵臼萬民以濟及後世加巧因延力借身重以踐確而利十倍杵舂又復設機關用驢騾牛馬及役水而舂其利乃且百倍見御覽七百六十二又八百二十九劉歆致雨具作土龍吹律及諸方術無不備設談問求雨所以為土龍何也曰龍見者輒有風雨興起以迎送之故緣其象類而為之見續漢禮儀志中注難以頓牟磁石不能真是何能掇針取芥子駿窮無以應見論衡亂龍篇扶風漆縣之邠亭部言本太王所處其民有會日以相與夜市如不為期則有重災咎見續漢郡國志一注初學記二十四御覽一百九十一又八百二十七太原郡民以隆冬不火食五日雖有疾病緩急猶不敢犯為介子推故也見北堂書鈔一百四十三藝文類聚三御覽二十七天下有鸛鳥郡國皆食之而三輔俗獨不敢取之取或雷霹靂起原夫天不獨左彼而右此其殺取時適與雷遇耳見御覽十三又九百二十五余小時聞閭巷言孔子東游見兩小兒辨鬭問其故一兒曰我以日始出時近日中時遠一兒以日初出遠日中時近長水校尉平陵關子陽以為日之去入上方遠而四方近何以知之星宿昏時出東方其閒甚疏相離丈餘及夜半在上方視之甚數相離為一二尺以準度望之逾益明白故知天上之遠于傍也日為天陽火為地陽地氣上升天氣下降今置火于地從旁與上診其熱遠近殊不同乃差半焉日中正在上覆蓋人人當天陽之衝故熱于始出時又新從太陰中來故復涼于其西在桑榆閒大小雖同氣猶不如清朝也桓君山曰子陽之言豈其然乎見隋書天文志上法苑珠林七公孫龍六國時辨士也為堅白之論假物取譬謂白馬為非馬非馬者言白所以名色馬所以名形也色非形形非色人不能屈後乘白馬無符傳欲出關關吏不聽此虛言難以奪實也見六帖九御覽四百六十四世俗咸曰漢文帝躬儉約修道德躬先天下天下化之故致充實殷富澤加黎庶穀至石數十錢上下饒羡見北堂書鈔一百五十六御覽三十五又八百三十七太史公造書書成示東方朔朔為平定因署其下太史公者皆朔所加之者也見史記孝武紀索隱雒陽李幼賓有小玉檢謁衛者史子伯素好玉器見而奇之使余報以三萬錢請買焉幼賓曰我與好事長者傳之己顧十萬非三萬錢主也余驚駭云我若于路見此千錢亦不市也故知之與不知相去甚遠見御覽八百五道賦第十二余少時好離騷博觀他書輒欲反學見北堂書鈔九十七揚子雲攻于賦王君大習兵器余欲從二子學子雲曰能讀千賦則善賦君大曰能觀千劍則曉劍諺曰伏習象神巧者不過習者之門見意林諺曰侏儒見一節而長短可知孔子言舉一隅足以三隅反觀吾小時二賦亦足以揆其能否見御覽四百九十六余少時為奉車郎孝成帝出祠甘泉河東部先置華陰集靈宮武帝所造門曰望仙殿曰存仙書壁為之賦以頌二仙之行見北堂書鈔一百二辨惑第十三五福壽富貴安樂子孫衆多見意林百足之蟲共舉一身安得不濟見意林無仙道好奇者為之見連江葉氏本博物志七今本五曲陽侯王根迎方士西門君惠從其學養生郤老之術君惠曰龜稱三千歲鶴稱千歲以人之材何乃不及蟲鳥邪余應曰誰當久與龜鶴同居而知其年歲耳見意林御覽七百二十聖人何不學仙而令死邪聖人皆形解仙去言死者示民有終也見意林文選顏延年五君咏注天下神人五一曰神仙二曰隱淪三曰使鬼物四曰先知五曰鑄凝見文選江賦注五君咏注謝元暉敬亭山詩注任彥升謝修下忠貞墓啓注淮南王之子嫂迎道人作金銀云鉛字金與公鉛則金之公而銀者金之昆弟也見御覽八百十二武帝有所愛幸姬王夫人窈窕好容質性嬛佞夫人死帝痛惜之方士李少君言能致其神魂乃夜設燭張幄置夫人神影令帝居于他帳中遙望見好女似夫人之狀還帳坐見史記武紀集解北堂書鈔一百三十二文選潘安悼亡詩注御覽六百九十九元帝被病廣求方士漢中送道士王仲都至詔問何所能為對曰但能忍寒暑耳乃以隆冬盛寒日令袒衣載以駟馬于上林昆明池上環冰而馳御者厚衣狐裘甚寒戰而仲都獨無變色臥于池臺上曛然自若因為待詔至夏犬暑日使曝坐又環以十爐火口不言熱而身不汗出見水經注渭水下三輔黃圖五藝文類聚五初學記三御覽二十二又三十四又七百五十七近哀平閒睢陵有董仲君好方道嘗犯事坐重罪繫獄佯病死數日目陷蟲出吏捐棄之既而復活故知幻術靡所不有又能鼻吹口歌吐舌齖聳眉動目荊州有鼻飲之蠻南城有飛頭之夷非為幻也見連江葉氏本博物志二今本四法苑珠林七十六御覽六百四十三又七百三十七又九百四十四哀帝時有才八范蘭言年三百歲初與人相見則喜而相應和再三則罵而逐人見御覽四百六十六史子心見署為丞相史官架屋發吏卒及官奴婢以給之作金不成丞相自以力不足又白傅太后太后不復利于金也聞金成可以作延年藥又甘心焉乃除之為郎舍之北宮中使者待遇見抱朴子內篇十六黃白余嘗與郎冷喜出見一老翁糞上拾食頭面垢醜不可忍視喜曰安知此非神仙余曰道必形體如此無以道焉見御覽三百八十二劉子駿信方士虛言謂神仙可學嘗問言人誠能抑嗜欲闔耳目可不衰竭乎余見其庭下有大榆樹久老剝折指謂曰彼樹無情欲可忍無耳目可闔然猶枯槁朽蠹人雖欲愛養何能使不衰見辨正論引陳思王辨道論藝文類聚八十八御覽九百五十六黃門郎程偉好黃白術娶妻得知方家女偉常從駕出而無時衣甚憂妻曰請致兩端縑縑即無故而至前偉按枕中鴻寶作金不成妻乃往視偉偉方扇炭燒筒筒中有水銀曰吾欲試相視一事乃出其囊中藥少少投之食頃發之已成銀偉大驚曰道近在汝處而不早告我何也妻曰得之須有命者于是偉日夜說誘之賣田宅以供美食衣服猶不肯告偉偉乃與伴謀撾笞伏之妻輒知之告偉言道必當傳其人口是而心非者雖寸斷支解而道猶不出也偉逼之不止妻乃發狂裸而走以泥自塗遂卒見抱朴子內篇黃白御覽八百十二呂仲子婢死有女兒年四歲葬後數來撫循之亦能為兒沐頭浣濯甚惡之以告方士云其家青狗為之殺之則止婢遂不復來揚仲文亦言所知家嫗死己斂未葬忽起飲酒食醉後而坐棺前祭床上如是三四家益厭苦其後醉行壞垣得老狗便打死殺之推問乃里頭沽家狗御覽八百八十五又九百五述策第十四或云陳平為高帝解平城之圍則言其事祕世莫得而聞也此以工妙踔善故藏隱不傳焉子能權知斯事否吾應之曰此策乃反薄陋拙惡故隱而不泄高帝見圍七日而陳平往說閼氏閼氏言于單于而出之以是知其所用說之事矣彼陳平必言漢有好麗美女為道其容貌天下無有今困急已馳使歸迎取欲進與單于單于見此人必大好愛之愛之則閼氏日以遠疏不如及其未到令漢得脫去去亦不持女來矣閼氏婦女有妒媔之性必憎惡而剚去之此說簡而要及得其用則欲使神怪故隱匿不泄也劉子駿聞吾言乃立稱善焉見史記陳丞相世家集解漢書高紀注藝文類聚十八白孔六帖二十一御覽三百八十一閔友第十五諺曰有白頭如新傾蓋如故言內有以相知與否不在新故也見史記鄒陽傳集解莊尢字伯石見後漢光武紀注高君孟頗知律令嘗自伏寫書著作郎署哀其老欲代之不肯云我躬自寫乃當十遍讀見北堂書鈔一百一御覽六百十四揚雄作玄書以為玄者天也道也言聖賢著法作事皆引天道以為本統而因附屬萬類王政人事法度故宓羲氏謂之易老子謂之道孔子謂之元而揚雄謂之玄玄經三篇以紀天地人之道立三體有上中下如禹貢之陳三品三三而九因以九九八十一故為八十一卦以四為數數從一至四重纍變易竟八十一而遍不可損益以三十五蓍揲之玄經五千餘言而傳一十三篇也見後漢張衡傳注通鑑三十注王公子問揚子雲何人邪答曰揚子雲才智開通能入聖道卓絶于衆漢興以來未有此人也國師子駿曰何以言之答曰才通著書以百數惟太史公廣大其餘皆藂殘小論不能比之子雲所造法言太玄經也玄經數百年其書必傳世咸尊古卑今貴所聞賤所見也故輕易之老子其心玄遠而與道合若遇上好事必以太玄次五經也見論衡超奇篇文選東京賦袁彥伯三國名臣贊注史通內篇自序御覽四百三十二又六百二時農見元和姓纂支韻通人如子禮見元和姓纂漁韻余同時佐郎官有梁子初揚子林好學所寫萬卷至于白首常有所不曉百許寄余余觀其事皆略可見見御覽六百十九茂陵周智孫胡不為賦訟酬應之文為大司徒掾見使典定文義兼領衆事見北堂書鈔未改本六十八琴道第十六昔神農氏繼宓羲而王天下上觀法于天下取法于地近取諸身遠取諸物于是始削桐為琴繩絲為絃以通神明之德合天地之和焉見意林藝文類聚四十四又八十八文選月賦注鮑明遠白頭吟注御覽五百七十九又八百十四又九百五十六琴長三尺六寸有六分象朞之數厚寸有八象三六數廣六寸象六律上圓而斂法天下方而平法地上廣下狹法尊卑之禮見意林琴隱長四寸五分隱以前長八分見文選七發注五弦第一弦為宮其次商角徵羽文王武王各加一弦以為少宮少商見通典一百四十四下徵七絃總會樞要見文選長笛賦注足以通萬物而考治亂也見文選思玄賦注初學記十六御覽五百七十九八音之中惟絲最密而琴為最首見初學記十六御覽五百七十九琴之言禁也君子守以自禁也見玉篇十六大聲不震譁而流漫細聲不湮滅而不聞見文選嘯賦注八音廣博琴德最優見文選琴賦注古者聖賢玩琴以養心見意林夫遭遇異時窮則獨善其身而不失其操故為之操見意林文選蕪城賦注長門賦注操似鴻雁之音見文選長笛賦注達則兼善天下無不通畼故謂之畼堯畼經逸不存見意林文選琴賦注七發注舜操者昔虞舜聖德玄遠遂升天子喟然念親巍巍上帝之位不足保援琴作操其聲清以微見意林文選琴賦注禹操者昔夏之時洪水襄陵沈山禹乃援琴作操其聲清以溢潺潺志在深河見北堂書鈔未改本一百九微子操微子傷殷之將亡終不可奈何見鴻鵠高飛援琴作操其聲清以淳見意林文選琴賦注御覽九百十六瑤臺藹雲文王操者文王之時紂無道爛金為格溢酒為池宮中相殘骨肉成泥璇室翳風鐘聲雷起疾動天地文王躬被法度陰行仁義援琴作操故其聲紛以擾駭角震商見北堂書鈔四十一御覽八十四伯夷操見文選舞賦注長笛賦注箕子操其聲淳以激見意林晉師曠善知音衛靈公將之晉宿于濮水之上夜聞新聲召師涓告之曰為我聽寫之曰臣得之矣遂之晉晉平公饗之酒酣靈公曰有新聲願奏之乃令師涓鼓琴未終師曠止之曰此亡國之聲也見後漢陳元傳注雍門周以琴見孟嘗君孟嘗君曰先生鼓琴亦能令文悲乎對曰臣之所以能令悲者先貴而後賤昔富而今貧擯壓窮巷不交四鄰不若身材高妙懷質抱真逢讒罹謗怨結而不得信不若交歡而結愛無怨而生離遠赴絶國無相見期不若幼無父母壯無妻兒出以野澤為鄰入用堀穴為家困于朝夕無所假貸若此人者但聞飛烏之號秋風鳴條則傷心矣臣一為之援琴而太息未有不悽惻而涕泣者也今若足下居則廣廈高堂連闥洞房下羅帷來清風倡優在前諂諛侍側揚激楚舞鄭妾流聲以娛耳練色以淫目水戲則舫龍舟建羽旗鼓吹乎不測之淵野游則登平原馳廣囿強弩下高鳥勇士格猛獸置酒娛樂沈醉忘歸方此之時視天地曾不若一指雖有善鼓琴未能動足下也孟嘗君曰固然雍門周曰然臣竊為足下有所常悲夫角帝而困秦者君也連五國而伐楚者又君也天下未嘗無事不從即衡從成則楚王衡成則秦帝夫以秦楚之強而報弱薛譬猶磨蕭斧而伐朝菌也有識之士莫不為足下寒心酸鼻天道不常盛寒暑更進退千秋萬歲之後宗廟必不血食高臺既以傾曲池又己平墳墓生荊棘狐兔穴其中游兒牧豎躑躅其足而歌其上行人見之悽愴曰孟嘗君之尊貴亦猶若是乎于是孟嘗君喟然太息涕淚承睫而未下雍門周引琴而鼓之徐動宮商叩角羽初終而成曲孟嘗君遂戲欷而就之曰先生鼓琴令文立若亡國之人也見三國志蜀郤正傳注宣帝元康神爵之閒丞相奏能鼓雅琴者渤海趙定梁國龍德召見溫室拜為侍郎見北堂書鈔七十一御覽二百四十八黃門工鼓琴者有任真卿虞長倩能傳其度數妙曲遺聲見文選司馬紹統贈山濤詩注成少伯工吹竽見安昌侯張子夏鼓琴謂曰音不通千曲以上不足以為知音見御覽五百八十一
