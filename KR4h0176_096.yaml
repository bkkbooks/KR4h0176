body:
  text: 蔡茂上書禁制貴戚臣聞興化致教必由進善康國寧人莫大理惡陛下聖德重興再隆大命即位以來四海晏然誠宜夙興夜寐雖休勿休然頃者貴戚椒房之家數因恩藝干犯吏禁殺人不死傷人不論臣恐繩墨棄而不用斧斤廢而不舉近湖陽公主奴殺人西市而與主共輿出入宮省逋罪積日冤魂不報洛陽令董宣直道不顧干主討姦陛下不先澄審召欲加箠當宣受怒之初京師側耳及其蒙宥天下拭目今者外戚憍逸賓客放濫宜敕有司案理姦罪使執平之吏永申其用以厭遠近不緝之情見後漢蔡茂傳舉賢良方正對策臣聞王事失則神祇怨怒姦邪亂正故陰陽謬錯此天所以譴告王者欲令失道之君曠然覺悟懷邪之臣懼然自刻者也今朝廷不考功校德而虛納毀譽數下詔書張設重法抑斷誹謗禁割論議罪之重者乃至腰斬傷忠臣之情挫直士之鋭殆乖建進善之旌縣敢諫之鼓闢四門之路明四目之義也臣聞成王幼少周公攝政聽言下賢均權布寵無舊無新唯仁是親動順天地舉措不失然近則召公不悅遠則四國流言夫子母之性天道至親今聖主幼小始免繈褓即位以來至親分離外戚杜隔恩不得通且漢家之制雖任英賢猶援姻戚親疏相錯杜塞間隙誠所以安宗廟重社稷也今馮衛無罪久廢不録或處窮僻不若民庶誠非忠愛慈孝承上之意夫為人後者自有正義至尊至卑其藝不嫌是以人無賢愚莫不為怨姦臣賊子以之為便不諱之變誠難其慮今之保傅非古之周公周公至聖猶尚有纍何況事失其衷不合天心者哉昔周公先遣伯禽守封於魯以義割恩寵不加後故配天郊祀三十餘世霍光秉政輔冀少主修善進士名為忠直而尊尊其宗黨摧抑外戚結貴據權至堅至固終沒之後受禍滅門方今師傅皆以伊周之位據賢保之任以此思化則功何不至不思其危則禍何不到損益之際孔父攸歎持滿之戒老氏所慍蓋功冠天下者不安威震人主者不全今承衰亂之後繼重敝之世公家屈竭賦斂重數苛吏奪其時貪夫侵其財百姓困乏疾疫夭命盜賊群輩且以萬數軍行衆止竊號自立攻犯京師燔燒縣邑至乃訛言積弩入宮宿衛驚懼自漢興以來誠未有也國家微弱姦謀不禁六極之效危於纍卵王者承天順地典爵主刑不敢以天官私其宗不敢以天罰輕其親陛下宜遂聖明之德昭然覺悟遠述帝王之迹近遵孝文之業差五品之屬納至親之序亟遣使者徵中山太后置之別宮令時朝見又召馮衛二族裁與冗職使得執戟親奉宿衛以防未然之符以抑患禍之端上安社稷下全保傅內和親戚外絶邪謀見後漢申屠剛傳説隗囂愚聞人所歸者天所與人所畔者天所去也伏念本朝躬聖德舉義兵龔行天罰所當必摧誠天之所福非人力也將軍本無尺土孤立一隅宜推誠奉順與朝并力上應天心下酬人望為國立功可以永年嫌疑之事聖人所絶以將軍之威重遠在千里動作舉措可不慎歟今璽書數到委國歸信欲與將軍共同吉凶布衣相與尚有沒身不負然諾之信況于萬乘者哉今何畏何利久疑如是卒有非常之變上負忠孝下愧當世夫未至豫言固常為虛及其已至又無所及是以忠言至諫希得為用誠願反覆愚老之言見後漢申屠剛傳隗囂據隴右欲背漢而附公孫述剛説之囂不納將歸與隗囂書愚聞專己者孤拒諫者塞孤塞之政亡國之風也雖有明聖之姿猶屈己從衆故慮無遺策舉無過事夫聖人不以獨見為明而以萬物為心順人者昌逆人者亡此古今之所共也將軍以布衣為鄉里所推廊廟之計既不豫定動軍發衆又不深料今東方政教日睦百姓平安而西州發兵人人懷憂騷動惶懼莫敢正言群衆疑惑人懷顧望非徒無精鋭之心其患無所不至夫物窮則變生事急則易計其藝然也夫離道德逆人情而能有國有家者古今未有也將軍素以忠孝顯聞是以士大夫不遠千里慕樂德義今苟欲決意徼幸此何如哉夫天所祐者順人所助者信如未蒙祐助令小人受塗地之禍毀壞終身之德敗亂君臣之節污傷父子之恩衆賢破膽可不慎哉見後漢申屠剛傳與劉龔書君執事無恙走昔以摩研編削之才與國師公從事出入校定祕書竊自依依未由自遠蓋聞君子愍同類而傷不遇人無愚智莫不先避害然後求利先定志而後求名昔智果見智伯窮兵必亡故變名遠逝陳平知項王為天所棄故歸心高祖皆智之至也聞君前權時屈節北面延牙乃後覺悟棲遲養德先世數子又何以加君處陰中土多賢士若以須臾之間研考異同揆之圖書測之人事則得失利害可陳于目何自負畔亂之困不移守惡之名乎與君子之道何其反也世之俗儒末學醒醉不分而稽論當世疑誤視聽或謂天下迭興未知誰是稱兵據土可圖非冀或曰聖王未啓宜觀時變倚強附大顧望自守二者之論豈其然乎夫孔丘祕經為漢赤制玄包幽室文隱事明且火德承堯雖昧必亮承積世之祚握無窮之符王氏雖乘間偷篡而終嬰大戮支分體解宗氏屠滅非其效歟皇天所以眷顧踟蹰憂漢子孫者也論者若不本之于天參之于聖猥以師曠雜事輕自眩惑説士作書亂夫大道焉可信哉諸儒或曰今五星失晷天時謬錯辰星久而不效太白出入過度熒惑進退見態鎮星繞帶天街歲星不舍氐房以為諸如此占歸之國家蓋災不徒設皆應之分野各有所主夫房心即宋之分東海是也尾為燕分漁陽是也東海董憲迷惑未降漁陽彭寵逆亂擁兵王赫斯怒命將並征故熒惑應此憲寵受殃太白辰星自亡新之末失行算度以至于今或守東井或沒羽林或裴回藩屏或躑躅帝宮或經天反明或潛藏久沈或衰微暗昧或煌煌北南或盈縮成鉤或偃蹇不禁皆大運蕩除之祥聖帝應符之兆也賊臣亂子往往錯互指麾妄説傳相壞誤由此論之天文安得遵度哉乃者五月甲申天有白虹自子加午廣可十丈長可萬丈正臨倚彌倚彌即黎丘秦豐之都也是時月入于畢畢為天網主綱羅無道之君故武王將伐紂上祭于畢求助天也夫仲夏甲申為八魁八魁上帝開塞之將也主退惡攘逆流星狀似蚩尤旗或曰營頭或曰天槍出奎而西北行至延牙營上散為數百而滅奎為毒螫主庫兵此二變郡中及延牙士衆所共見也是故延牙遂之武當託言發兵實避其殃今年比卦部歲坤主立冬坎主冬至水性滅火南方之兵受歲禍也德在中宮刑在木木勝土刑制德今年兵事畢已中國安寧之效也五七之家三十五姓彭秦延氏不得豫焉如何怪惑依而恃之葛纍之詩求福不回其若是乎圖讖之占衆變之驗皆君所明善惡之分去就之決不可不察無忽鄙言夫周公之善康叔以不從管蔡之亂也景帝之悅濟北以不從吳濞之畔也自更始以來孤恩背逆歸義向善臧否粲然可不察歟良醫不能救無命強梁不能與天爭故天之所壞人不得支宜密與太守劉君共謀降議仲尼棲棲墨子遑遑憂人之甚也屠羊救楚非要爵祿茅焦干秦豈求報利盡忠博愛之誠憤滿不能已耳見後漢蘇竟傳上疏讓爵土臣融年五十三有子年十五質性頑鈍臣融朝夕教導以經藝不得令觀天文見讖記誠欲令恭肅畏事恂恂循道不願其有才能何況乃當傳以連城廣土享故諸侯王國哉見後漢竇融傳又藝文類聚五十一引東觀漢記又袁宏後漢紀六復遣長史劉鈞上書歸誠臣融竊伏自惟幸得託先后末屬蒙恩為外戚纍世二千石至臣之身復備列位假歷將帥守持一隅以委質則易為辭以納忠則易為力書不足以深達至誠故遣劉鈞口陳肝膽自以底裏上露長無纖介而璽書盛稱蜀漢二主三分鼎足之權任囂尉他之謀竊自痛傷臣融雖無識猶知利害之際順逆之分豈可背真舊之主事姦偽之人廢忠貞之節為傾覆之事棄已成之基求無冀之利此三者雖問狂夫猶知去就而臣獨何以用心謹遣同産弟友詣闕口陳區區見後漢竇融傳上書請隗囂隗囂聞車駕當西臣融東下士衆騷動計且不戰囂將高峻之屬皆欲逢迎大軍後聞兵罷峻等復疑囂揚言東方有變西州豪傑遂復附從囂又引公孫述將令守突門臣融孤弱介在其間雖承威靈宜速救助國家當其前臣融促其後緩急迭用首尾相資囂勢排迮不得進退此必破也若兵不早進久生持疑則外長寇仇內示困弱復令讒邪得有因緣臣竊憂之惟陛下哀憐見後漢竇融傳封皇子議大司空融固始侯通膠東侯復高密侯禹太常登等奏議曰古者封建諸侯以藩屏京師周封八百同姓諸姬並為建國夾輔王室尊事天子享國永長為後世法故詩云大啓爾宇為周室輔高祖聖德光有天下亦務親親封立兄弟諸子不違舊章陛下德橫天地興復宗統褎德賞勳親睦九族功臣宗室咸蒙封爵多受廣地或連屬縣今皇子賴天能勝衣趨拜陛下恭謙克讓抑而未議群臣百姓莫不失望宜因盛夏吉時定號位以廣藩輔明親親尊宗廟重社稷應古合舊厭塞衆心臣請大司空上輿地圖太常擇吉日具禮儀見後漢光武紀與隗囂書伏惟將軍國富政修士兵懷附親遇厄會之際國家不利之時守節不回承事本朝後遣伯春委身于國無疑之誠于斯有效融等所以欣服高義願從役于將軍者良為此也而忿悁之間改節易圖君臣分爭上下接兵委成功造難就去從議為橫謀百年纍之一朝毀之豈不惜乎殆執事者貪功建謀以至于此融竊痛之當今西州地勢局迫人兵離散易以輔人難以自建計若失路不反聞道猶迷不南合子陽則北入文伯耳夫負虛交而易強禦恃遠救而輕近敵未見其利也融聞智者不危衆以舉事仁者不違義以要功今以小敵大于衆何如棄子徼功於義何如且初事本朝稽首北面忠臣節也及遣伯春垂涕相送慈父恩也俄而背之謂吏士何忍而棄之謂留子何自起兵以來轉相攻擊城郭皆為丘墟生人轉于溝壑今其存者非鋒刃之餘則流亡之孤迄今傷痍之恥未愈哭泣之聲尚聞幸賴天運少還而將軍復重于難是使積痾不得遂瘳幼孤將復流離其為悲痛尤足愍傷言之可為酸鼻庸人且猶不忍況仁者乎融聞為忠甚易得宜實難憂人大過以德取怨知且以言獲罪也區區所獻唯將軍省焉見後漢竇融傳上皇太后疏請以桓郁劉方入侍講禮記云天下之命懸于天子天子之善成乎所習習與智長則切而不勤化與心成則中道若性昔成王幼小越在襁保周公在前史佚在後太公在左召公在右中立聽朝四聖維之是以慮無遺計舉無過事孝昭皇帝八歲即位大臣輔政亦選名儒韋賢蔡義夏侯勝等入授于前平成聖德近建初元年張酺魏應召訓亦講禁中臣伏惟皇帝陛下躬天然之姿宜漸教學而獨對左右小臣未聞典義昔五更桓榮親為帝師子郁結髮敦尚繼傳父業故再以校尉入授先帝父子給事禁省更歷四世今白首好禮經行篤備又宗正劉方宗室之表善為詩經先帝所褒宜令郁方並入教授以崇本朝光示大化見後漢桓郁傳又見袁宏後漢紀十二移書勸葛龔過矯仲彥論升仙之道從蘇博文談超世之高適馬季常講墳典之妙所謂喬松可與馳騖何細疾之足患邪見汝南先賢傳上表諫宦官封侯陛下即位以來梁孫鄧亳貴戚專勢侵逼公卿略驅吏民惡熟罪深或誅滅相續以常侍黃門竊弄王命欺罔競行謗讟爭入如忠臣李固杜喬在朝必竭忠奉之節覺其姦萌因造妖言陷之禍門陛下不察加以大戮冤感皇天痛入后土賢愚悲悼小大傷摧固等既沒宦黨受封快凶慝之心張豺狼之口天下咸言直如弦死道邊曲如鉤封公侯謠言之作正為于此陛下違漢舊典謂必可行自造制度妄爵非人今朝廷日衰姦臣專政臣恐有胡亥之難在于不久趙高之變不朝則夕臣實懷愚不憚瞽言使身死名著碎體糞土薦肉狐鼠猶生之年雖尊官厚祿不以易之也謹冒死陳得失之要凡七十餘條伏惟陛下深思臣言束骸侯誅見袁宏後漢紀二十二延熹九年上表今冬大寒過節毒害鳥獸爰及池魚城傍松竹皆為傷絶見初學記三引謝承後漢書諫黨事疏臣聞明主不諱譏刺之言以探幽暗之實忠臣不恤諫爭之患以畼萬端之事是以君臣並熙名奮百世臣幸得遭盛明之世逢文武之化豈敢懷祿逃罪不竭其誠陛下初從藩國爰登聖祚天下逸豫謂當中興自即位以來未聞善政梁孫寇鄧雖或誅滅而常侍黃門續為禍虐欺罔陛下競行譎詐自造制度妄爵非人朝政日衰姦臣日強伏尋西京放恣王氏佞臣執政終喪天下今不慮前事之失復循覆車之軌臣恐二世之難必將復及趙高之變不朝則夕近者姦臣牢修造設黨議遂收前司隸校尉李膺太僕杜密御史中丞陳翔太尉掾范滂等逮考連及數百人曠年拘録事無效驗臣惟膺等建忠抗節志經王室此誠陛下稷禼伊呂之佐而虛為姦臣賊子之所誣枉天下寒心海內失望惟陛下留神澄省時見理出以厭人鬼喁喁之心臣聞古之明君必須賢佐以成政道今臺閣近臣尚書令陳蕃僕射胡廣尚書朱宇荀緄劉祐魏朗劉矩尹勳等皆國之貞士朝之良佐尚書郎張陵媯皓苑康楊喬邊韶戴恢等文質彬彬明達國典內外之職群才並列而陛下委任近習專樹叨餮外典州郡內幹心膂宜以次貶黜案罪糾罰抑奪宦官欺國之封案其無狀誣罔之罪信任忠良平決臧否使邪正毀譽各得其所寶愛天官唯善是授如此咎徵可消天應可待間者有嘉禾芝草黃龍之見夫瑞生必于嘉士福至則由善人在德為瑞無德為災陛下所行不合天意不宜稱慶見後漢竇武傳上疏奉承詔命精爽隕越見文選劉琨勸進表注屯都亭下令軍士黃門常侍反逆無道何盡隨之反乎先降有重賞見袁宏後漢紀二十三又後漢竇武傳
