body:
  text: 全後漢文卷十七鮑永今月二十七日今月二十七日車駕臨故中郎將來歙喪還車駕臨故中郎將來歙喪還車駕過須臾車駕過須臾趙王良從後到趙王良從後到與右中郎將張邯相逢城門中與右中郎將張邯相逢城門中道迫狹道迫狹叱邯旋車叱邯旋車又召候岑尊詰責又召候岑尊詰責使前走數十步使前走數十步按按良諸侯藩臣良諸侯藩臣蒙恩入侍蒙恩入侍知尊帝城門候吏六百石知尊帝城門候吏六百石而肆意加怒而肆意加怒令叩頭道令叩頭道奔走馬頭前奔走馬頭前無藩臣之禮無藩臣之禮大不敬也大不敬也見後漢鮑永傳注引東觀記見後漢鮑永傳注引東觀記對災眚問臣聞聖人理國三年有成今陛下始踐天位刑政未著如知失得何能致異但臣前在汝南典理楚事繫者千餘人恐未能盡當其罪先帝詔言大獄一起冤者過半又諸徙者骨肉分離孤魂不祀一人呼嗟王政為虧宜一切還諸徙家屬蠲除禁錮興滅繼絕生死獲所如此和氣可致見後漢鮑永附傳又見袁宏後漢紀十一有小異救耿恭關寵議今使人于危難之地急而棄之外則縱蠻夷之暴內則傷死難之臣誠令權時後無邊事可也匈奴如復犯塞為寇陛下將何以使將又二部兵人裁各數十匈奴圍之歷旬不下是其寡弱盡力之效也可令敦煌酒泉太守各將精騎二千多其幡幟倍道兼行以赴其急匈奴疲極之兵必不敢當四十日閒足還入塞見後漢耿恭傳又見袁宏後漢紀十與此小異說竇憲弟夏陽侯瓌陳寵奉事先帝深見納任故久留臺閣賞賜有殊今不蒙忠能之賞而計幾微之故誠傷輔政容貸之德見後漢陳寵傳下教論繇延功西部督郵繇延天資忠貞稟性公方典部折衝摧破姦雄書曰安民則惠黎民懷之蓋舉善以教則不能者勸今與眾儒共論延功顯之于朝太守敬嘉厥休牛酒以養德見袁宏後漢紀七又略見後漢郅惲傳風俗通竝刪節上書王莽臣聞天地重其人惜其物故運機衡垂日月含元包一甄陶品類顯表紀世圖錄豫設漢歷久長孔為赤制不使愚惑殘人亂時智者順以成德愚者逆以取害神器有命不可虛獲上天垂戒欲悟陛下令就臣位轉禍為福劉氏享天永命陛下順節盛衰取之以天還之以天可謂知命矣若不早圖是不免于竊位也且堯舜不以天顯自與故禪天下陛下何貪非天顯以自累也天為陛下嚴父臣為陛下孝子父教不可廢子諫不可拒惟陛下留神見後漢郅惲傳因廢郭后上書臣聞夫婦之間父不能得之于子君不能得之于臣況臣欲得之于君乎是臣所不敢也雖然願陛下念其不可勿亂大倫使天下有議社稷者見袁宏後漢紀七上書諫獵昔文王不敢盤游于田以萬民惟正陛下既游獵山林夜以繼晝其如社稷宗廟何暴虎馮河可為至戒小臣所竊憂也見袁宏後漢紀七又見後漢郅惲傳有小異說逯竝當今上天垂象智者以昌愚者以亡昔伊尹自鬻輔商立功全人惲竊不遜敢希伊尹之蹤應天人之變明府儻不疑逆俾承天德見後漢郅惲傳諫傅俊昔文王不忍露白骨武王不以天下易一人之命故能獲天地之應剋商如林之旅將軍如何不師法文王而犯逆天地之禁多傷人害物虐及枯尸取罪神明今不謝天改政無以全命願將軍親率士卒收傷葬死哭所殘暴以明非將軍本意也見後漢郅惲傳說太子久處疑位上違孝道下近危殆昔高宗明君吉甫賢臣及有纖介放逐孝子春秋之義母以子貴太子宜因左右及諸皇子引愆退身奉養母氏以明聖教不背所生見後漢郅惲傳誓眾無掩人不備窮人屈于戹不得斷人支體裸人形骸放淫婦女見後漢郅惲傳詣闕上書理馬援臣聞王德聖政不忘人之功採其一美不求備于眾故高祖赦蒯通而以王禮葬田橫大臣曠然咸不自疑夫大將在外讒言在內微過輒記大功不計誠為國之所慎也故章邯畏口而奔楚燕將據聊而不下豈其甘心末規哉悼巧言之傷類也竊見故伏波將軍新息侯馬援以四年終始歸正朔當此之時虜述矯號于益州隗囂擁兵于隴冀豪傑盱睢且自焉正援拔自西州欽慕聖義閒關險難觸冒萬死孤立群貴之間傍無一言之佐馳深淵入虎口豈顧計哉寍自知當要七郡之使徼封侯之福邪八年車駕西討隗囂國計狐疑眾營未集援建宜進之策卒破西州隗囂克定援有力焉及吳漢下隴冀路斷隔豪強叛城酋羌殺吏唯獨狄道為國堅守士民飢困乃噉弩煮履寄命漏刻援奉詔西使鎮慰邊眾乃奮不顧身閒關山谷之中揮戈先零之野招集豪傑曉誘羌戎謀如湧泉埶如轉規遂救倒懸之急存幾亡之城兵全師進因糧敵人隴冀略平而獨守空郡兵動有功師進輒克銖鋤先零緣入山谷猛怒力戰飛矢貫脛徵在虎賁則有忠第嘉謀于國又出征交阯土多瘴氣援與妻子生訣無悔吝之心遂斬滅徵側克平一州使王府納越裳之貢邊境無兵革之憂閒復南討立陷臨鄉師已有業未竟而死吏士離疫援不獨存夫戰或以久而立功或以速而致敗深入未必為得不進未必為非人情豈樂久屯絕地不生歸哉惟援得事朝廷二十二年北出塞漠南渡江海觸冒害氣僵死軍中名滅爵絕國土不傳海內不知其過眾庶未聞其罪卒遇三夫之言橫被誣罔之讒家屬杜門葬不歸墓怨隙並興宗親怖慄死者不能自明生者莫為之訟臣竊傷之夫明主醲于用賞約于用刑高祖嘗與陳平金四萬斤以間楚軍不問出入所為豈復疑以錢穀間哉夫操孔父之忠而不能自免于讒此鄒陽之所悲也詩云取彼讒人投畀豺虎豺虎不食投畀有北有北不受投畀有昊此言欲令上天而平其惡惟陛下留思豎儒之言無使功臣懷恨黃泉臣聞春秋之義罪以功除聖王之祀臣有五義若援所謂以死勤事者也願下公卿平援功罪宜絕宜續以厭海內之望臣年已六十常伏田里竊感欒布哭彭越之義冒陳悲憤戰慄闕庭見後漢馬援傳袁宏後漢紀八飛鳥跱衡馬驚觸虎物類相生亦無不有見文選赤者白馬賦注引東觀漢記上銅馬式表夫行天莫如龍行地莫如馬馬者甲兵之本國之大用安寍則以別尊卑之序有變則以濟遠近之難昔有騏驥一日千里伯樂見之昭然不惑近世有西河子輿亦明相法子輿傳西河儀長孺長孺傳茂陵丁君都君都傳成紀楊子阿臣援嘗師事子阿受相馬骨法考之于行事輒有驗效臣愚以為傳聞不如親見視景不如察形今欲行之于生馬則骨法難備具又不可傳之于後孝武皇帝時善相馬者東門京鑄作銅馬法獻之有詔立馬于魯班門外則更名魯班門曰金馬門臣謹依儀氏羈中帛氏口齒謝氏脣鬐丁氏身中備此數家骨相以為法馬高三尺五寸圍四尺四寸見後漢馬援傳銅馬相法水火欲分明上脣欲急而方口中欲紅而有光此馬千里頷下欲深下脣欲緩牙欲前向牙去齒一寸則四百里牙劍鋒則千里目欲滿而澤腹欲充膁欲小肋欲長懸薄欲而緩脇堂欲平滿汗溝欲深長而膝本欲起肘腋欲開膝欲方蹄欲厚三寸堅如石鬃欲戴中骨高三寸頰欲開而膺下欲廣一尺以上能久走欲方胸欲直而出鳧閒欲開望視之如雙鳧見後漢馬援傳注御覽八百九十六上疏言隗囂臣援自念歸身聖朝奉事陛下本無公輔一言之薦左右為容之助臣不自陳陛下何因聞之夫居前不能令人輊居後不能令人軒與人怨不能為人患臣所恥也故敢觸冒罪忌昧死陳誠臣與隗囂本實交友初囂遣臣東謂臣曰本欲為漢願足下往觀之于汝意可即專心矣及臣還反報以赤心實欲導之于善非敢譎以非義而囂自挾姦心盜憎主人怨毒之情遂歸于臣臣欲不言則無以上聞願聽詣行在所極陳滅囂之術得空匈腹申愚策退就隴畝死無所恨見後漢馬援傳又見袁宏後漢紀五各有刪節上疏言破羌以西不可棄亢吾以西數十里一城城皆完堅舊制置塞因山阻海其蹊徑輒有侯尉故虜不得妄動即棄亢吾以西北為殖養虜根內自迫促宜及兵威疾往除之金城諸縣皆田地肥美溉灌流通自有本民易還充實誠不宜有所斷棄若二郡平定流民還本業不復為國家憂見袁宏後漢紀六破羌以西城多完牢易可依固其田土肥壤灌溉流通如令羌在湟中則為害不休不可棄也見後漢馬援傳上書請復鑄五銖錢富國之本在于食貨宜如舊鑄五銖錢見晉書食貨志擊尋陽山賊上書除其竹木譬如嬰兒頭多蟣蝨而剃之蕩蕩然蟣蝨無所復依見御覽九百五十一引東觀漢記上書請正印文臣所假伏波將軍印書伏字犬外嚮成皋令印皋字為白下羊丞印四下羊尉印白下人人下羊即一縣長吏印文不同恐天下不正者多符印所以為信也所宜齊同薦曉古文字者事下大司空正郡國印章見後漢馬援傳注引東觀漢記至荔浦見冬筍名曰苞筍上言禹貢厥包橘柚疑謂是也其味美于春夏筍見聚珍本東觀漢記征交阯上言從𥹆泠出賁古擊益州臣所將駱越萬餘人便習戰鬭者二千兵以上弦毒矢利以數發矢注如雨所中輒死愚以行兵此道最便蓋承藉水利用為神捷也見水經葉榆水注將入九真上言臣謹與交阯精兵萬二千人與大兵合二萬人船車大小二千艘自入交阯今為盛見水經葉榆水注平交阯上言太守蘇定張眼視錢䁋眼討賊怯于戰功宜加切敕見東觀漢記聚珍本奏請分西于縣西于縣戶有三萬二千遠界去庭千餘里請分為封溪望海二縣見後漢馬援傳與隗囂將楊廣書春卿無恙前別冀南寂無音驛援還長安因留上林竊見四海已定兆民同情而季孟閉拒背畔為天下表的常懼海內切齒思相屠裂故遺書戀戀以致惻隱之計乃聞季孟歸罪于援而納王游翁諂邪之說自謂函谷以西舉足可定以今而觀竟何如邪援閒至河內過存伯春見其奴吉從西方還說伯春小弟仲舒望見吉欲問伯春無它否竟不能言曉夕號泣婉轉塵中又說其家悲愁之狀不可言也夫怨讎可刺不可毀援聞之不自知泣下也援素知季孟孝愛曾閔不過夫孝于其親豈不慈于其子可有子抱三木而跳梁妄作自同分羹之事乎季孟平生自言所以擁兵眾者欲以保全父母之國而完墳墓也又言苟厚士大夫而已而今所欲全者將破亡之所欲完者將毀傷之所欲厚者將反薄之季孟嘗折愧子陽而不受其爵今更共陸陸欲往附之將難為顏乎若復責以重質當安從得子主給是哉往時子陽獨欲以王相待而春卿拒之今者歸老更欲低頭與小兒曹共槽櫪而食併肩側身于怨家之朝乎男兒溺死何傷而拘游哉今國家待春卿意深宜使牛孺卿與諸耆老大人共說季孟若計畫不從真可引嶺去矣前披輿地圖見天下郡國百有六所奈何欲以區區二邦以當諸夏百有四乎春卿事季孟外有君臣之義內有朋友之道言君臣邪固當諫爭語朋友邪應有切磋豈有知其無成而但萎腇咋舌又手從族乎及今成計殊尚善也過是欲少味矣且來君叔天下信士朝廷重之其意依依常獨為西州言援商朝廷尤欲立信于此必不負約援不得久留願急賜報見後漢馬援傳東丞相高祖園寢郎一月九遷為丞相者知武帝恨誅衛太子上書訟之見文選注引東觀漢記誡兄子嚴敦書吾欲汝曹聞人過失如聞父母之名耳可得聞口不可得言也好論議人長短妄是非正法此吾所大惡也寍死不願聞子孫有此行也汝曹知吾惡之甚矣所以復言者施衿結褵申父母之戒欲使汝曹不忘之耳龍伯高敦厚周慎口無擇言謙約節儉廉公有威吾愛之重之願汝曹效之杜季良豪俠好義憂人之憂樂人之樂清濁無所失父喪致客數郡畢至吾愛之重之不願汝曹效也效伯高不得猶為謹敕之士所謂刻鵠不成尚類鶩者也效季良不得陷為天下輕薄子所謂畫虎不成反類狗者也訖今季良尚未可知郡將下車輒切齒州郡以為言吾常為寒心是以不願子孫效也見後漢馬援傳又見袁宏後漢紀七蓺文類聚二十三銅柱銘漢建武十八年平徵側于龍編樹銅柱于象浦其銘曰金人汗出鐵馬蹄堅子孫相連九九百年見馬希範溪州銅柱記上明德太后疏臣案前世詔令以百姓不足起于世尚奢靡故元帝罷服官成帝御浣衣哀帝去樂府然而侈費不息至于衰亂者百姓從行不從言也夫改政移風必有其本傳曰吳王好劍客百姓多創瘢楚王好細腰宮中多餓死長安語曰城中好高髻四方高一尺城中好廣眉四方且半額城中好大袖四方全匹帛斯言如戲有切事實前下制度未幾後稍不行雖或吏不奉法良由慢起京師今陛下躬服厚繒斥去華飾素簡所安發自聖性此誠上合天心下順民望浩大之福莫尚于此陛下既已得之自然猶宜加以勉勗法太宗之隆德戒成哀之不終易曰不恆其德或承之羞誠令斯事一竟則四海誦德聲薰天地神明可通金石可勒而況于行仁心乎況于行令乎願置章坐側以當瞽人夜誦之音見後漢馬廖傳奏上迎氣樂上以大常樂丞鮑鄴等上樂事下車騎將軍馬防防奏言建初二年七月鄴上言王者飲食必道須四時五味有食舉之樂所以順天地養神明求福應也移風易俗莫善于樂樂者天地之和不可久廢今官雅樂獨有黃鍾而食舉樂但有太蔟皆不應月律恐傷氣類可作十二月均各應其月氣公卿朝會得聞月律乃能感天地和氣宜應明帝始令靈臺六律侯而未設其門樂經曰十二月行之所以宣氣豐物也月開斗建之門而奏歌其律誠宜施行願與待詔嚴崇及能作樂器者共作治考工給所當詔下太常太常上言作樂器直錢百四十六萬請太僕作成上奏寢今明詔下臣防臣輒問鄴及待詔知音律者皆言聖人作樂所以宣氣致和順陰陽也臣愚以為可順上天之明時因歲令王正發太蔟之律奏雅頌之音以立太平以迎和氣其條貫甚備見續漢律厤志上注補引嶭瑩書後漢章紀注引東觀記又隋書音樂志下牛弘等議引東觀書馬防傳日食上封事臣聞日者眾陽之長食者陰侵之徵書曰無曠庶官天工人其代之言王者代天官人也故考績黜陟以明褒貶無功不黜則陰盛陵陽臣伏見方今刺史太守專州典郡不務奉事盡心為國而司察偏阿取與自己同則舉為尤異異則中以刑法不即垂頭塞耳採取財賂今益州刺史朱酺楊州刺史倪說涼州刺史尹業等每行考事輒有物故又選舉不實曾無貶坐是使臣下得作威福也故事州郡所舉上奏司直察能否以懲虛實今宜加防檢式遵前制舊丞相御史親治職事唯丙吉以年老優游不案吏罪于是宰府習為常俗更共罔養以崇虛名或未曉其職便復遷徙誠非建官賦祿之意宜敕正百司各責以事州郡所舉必得其人若不如言裁以法令傳曰上德以寬服民其次莫如猛故火烈則人望而畏之水懦則人狎而翫之為政者寬以濟猛猛以濟寬如此綏御有體災眚消矣見後漢馬嚴傳上書求進女掖庭臣叔父援孤恩不報而妻子特獲恩全戴仰陛下為天為父人情既得不死便欲求福竊聞太子諸王妃匹未備援有三女大者十五次者十四小者十三儀狀髮膚上中以上皆孝順小心婉靜有禮願下相工簡其可否如有萬一援不朽于黃泉矣又援姑姊妹竝為成帝婕妤葬于延陵臣嚴幸得蒙恩更生冀因緣先姑當充後宮見後漢明德馬皇后紀
