body:
  text: 馬融琴賦惟梧桐之所生在衡山之峻陂于是遨閒公子中道失志居無室廬罔所息置孤煢特行懷閔抱思昔師曠三奏而神物下降玄鶴二八軒舞于庭何琴德之湥哉見藝文類聚四十四文選司馬彪贈山濤詩注顏廷之曲水詩序注劉伶酒德頌注長笛賦并序融既博覽典雅精核數術又性好音律鼓琴吹笛而為督郵無留事獨臥郿平陽塢中有雒客舍逆旅吹笛為氣出精列相和融去京師踰年暫聞甚悲而樂之追慕王子淵枚乘劉伯康傅武仲等簫琴笙頌唯笛獨無故聊復備數作長笛頌其辭曰惟籦籠之奇生兮于終南之陰崖託九成之孤岑兮臨萬仞之石磎特箭槀而莖立兮獨聆風于極危秋潦漱其下趾兮冬雪揣封乎其枝巔根跱之槷刖兮感回飆而將頽夫其面旁則重巘增石簡積頵砡兀嶁狋𦡼傾吳倚伏庨窖巧老港洞坑谷嶰壑澮㟋𡸞窞巖𥨍運裛窏洝岡連嶺屬林簫蔓荊森槮柞朴于是山水猥至渟涔障潰顄淡滂流碓投瀺穴爭湍蘋縈汨活澎濞波瀾鱗淪窊隆詭戾𤀰瀑噴沫奔遁碭突搖演其山動杌其根者歲五六而至焉是以閒介無蹊人迹罕到猿蜼晝吟鼯鼠夜叫寒熊振頷特麚昏髟山雞晨群野雉朝雊求偶鳴子悲號長嘯由衍識道噍噍歡譟經涉其左右哤聒其前後者無晝夜而息焉夫固危殆險巇之所迫也衆哀集悲之所積也故其應清風也纖末奮蕱錚鐄謍嗃若絙瑟促柱號鐘高調于是放臣逐子棄妻離友彭胥伯奇哀姜孝己攢乎下風收精注耳靁歎頽息掐膺劈摽泣血泫流交橫而下通旦忘寐不能自禦于是乃使魯般宋翟搆雲梯抗浮柱蹉纖根跋縷膺峭阤腹陘阻逮乎其上匍匐伐取挑截本末規摹彠矩夔襄比律子協呂十二畢具黃鐘為主嬌楺斤械剸掞度擬鍯硐隤墜程表朱裏定名曰笛以觀賢士陳于東階八音俱起食舉雍徹勸侑君子然後退理乎黃門之高廊重丘宋灌名師郭張工人巧士肄業修聲于是遊閒公子暇豫王孫心樂五聲之和耳比八音之調乃相與集乎其庭詳觀夫曲胤之繁會叢雜何其富也紛葩爛漫誠可喜也波散廣衍實可異也牚距劫遌又足怪也啾咋嘈啐似華羽兮絞灼激以轉切震鬱怫以憑怒兮耾碭駭以奮肆氣噴勃以布覆兮乍跱跖以狼戾靁叩煆之岌峇兮正瀏溧以風冽薄湊會而凌節兮馳趣期而赴躓爾乃聽聲類形狀似流水又象飛鴻泛濫溥漠浩浩洋洋長矕遠引旋復回皇充屈鬱律瞋菌碨抰酆琅磊落駢田磅唐取豫時適去就有方洪殺衰序希數必當微風纖妙若存若亡藎滯抗絶中息更裝奄忽滅沒曄然復揚或乃聊慮固護專美擅工漂凌絲簧覆冒鼓鐘或乃植持縼纏佁擬寬容簫管備舉金石竝隆無相奪倫以宣八風律呂既和哀聲五降曲終闋盡餘絃更興繁手纍發密疊重踾踧攢仄蜂聚蟻同衆音猥積以送厥終然後少息暫怠雜弄閒奏易聽駭耳有所搖演安翔駘蕩從容闡緩惆悵怨懟窳圔填𧹞聿皇求索乍近乍遠臨危自放若頽復反蚡縕蟠紆緸冤蜿蟺笢笏抑隱行入諸變絞概汨湟五音代轉挼拏捘臧遞相乘邅反商下徵每各異善故聆曲引者觀法于節奏察變于句投以知禮制之不可踰越焉聽簉弄者遙思于古昔虞志于怛惕以知長戚之不能閒居焉故論記其義協比其象倣徨縱肆曠漾敞罔老莊之概也溫直擾毅孔孟之方也激朗清厲隨光之介也牢刺拂戾諸賁之氣也節解句斷管商之制也條決繽紛申韓之察也繁縟駱驛范蔡之說也櫟銚㦎晳龍之惠也上擬法于韶簫南籥中取度于白雪淥水下采制于延露巴人是以尊卑都鄙賢愚勇懼魚鱉禽獸聞之者莫不張耳鹿駭熊經鳥申鴟視狼顧拊譟踴躍各得其齊人盈所欲皆反中和以美風俗屈平適樂國介推還受祿淡臺載尸歸皋魚節其哭長萬輟逆謀渠彌不復惡蒯聵能退敵不占成節鄂王公保其位隱處安林薄宦夫樂其業士子世其宅鱏魚喁于水裔仰駟馬而舞玄鶴于時也綿駒吞聲伯牙毀絃瓠巴聑柱磬襄弛懸留視瞪眙纍稱屢讚失容墜席搏拊雷抃僬眇睢維涕洟流漫是故可以通靈感物寫神喻意致誠效志率作興事溉盥汙濊澡雪垢滓矣昔庖羲作琴神農造瑟女媧制簧暴辛為塤倕之和鐘叔之離磬或鑠金礱石華睆切錯丸挻雕琢刻鏤鑽笮窮妙極巧曠以日月然後成器其音如彼唯笛因其天姿不變其材伐而吹之其聲如此蓋亦簡易之義賢人之業也若然六器者猶以二皇聖哲黈益況笛生于大漢學者不識其可以裨助盛美忽而不讚悲夫有庶士丘仲言其所由出而不知其弘妙其辭曰近世雙笛從羌起羌人伐竹未及已龍鳴水中不見已截竹吹之聲相似剡其上孔通洞之裁以當簻便易持易京君明識音律故本四孔加以一君明所加孔後出是謂商聲五音畢見文選藝文類聚圍碁賦略觀圍碁兮法于用兵三尺之局兮為戰鬭場陳聚士卒兮兩敵相當拙者無功兮弱者先亡自有中和兮請說其方先據四道兮保角依旁緣邊遮列兮往往相望離離馬目兮連連鴈行踔度閒置兮徘徊中央違閣奮翼兮左右翱翔道狹敵衆兮情無遠行碁多無策兮如聚群羊駱驛自保兮先後來迎攻寬擊虛兮蹌跭內房利則為時兮便則為強厭于食兮壞決垣牆堤潰不塞兮泛濫遠長橫行陳亂兮敵心駭惶迫兼碁雞兮頗棄其裝已下險口兮鑿置清坑窮其中罫兮如鼠入囊收取死卒兮無使相迎當食不食兮反受其殃勝負之㩍兮于言如髮乍緩乍急兮上且未別白黑紛亂兮于約如葛雜亂交錯兮更相度越守規不固兮為所唐突湥入貪地兮殺亡士卒狂攘相救兮先後并沒上下雜遝兮四面隔閉圍合罕散兮所對哽咽韓信將兵兮難通絶自陷死地兮設見歡譎誘敵先行兮往往一室捐碁委食兮遺三將七遲逐爽問兮轉相伺密商度地道兮碁相連結蔓延連閣兮如火不滅扶疏布散兮左右流溢浸淫不振兮敵人懼栗迫促踧踖兮惆悵自失計功相除兮以時早訖事留變生兮拾碁欲疾營惑窘乏兮無令詐出湥念遠慮兮勝乃可必見藝文類聚七十四古文苑樗蒲賦昔有玄通先生遊于京都道德既備好此樗蒲伯陽入戎以斯消憂枰則素旃紫罽出乎西鄰緣以繢繡紩以綺文杯則榣木之幹出自昆山矢則藍田之石卞和所工含精玉潤不細不洪馬則元犀象牙是磋是礲杯為上將木為君副齒為號令馬為翼距籌為策動矢法卒數于是芬葩貴戚公侯之儔坐華榱之高殿臨激水之清流排五木散九齒勒良馬取道里是以戰無常勝時有逼逐臨敵攘圍事在將帥見利電發紛綸滂沸精誠一叫十盧九雉磊落踸踔并來猥至先名所射應聲紛潰勝貴歡悅負者沈悴見藝文類聚七十四龍虎賦勇怯見之莫不主臣見史記陳平世家集解注陽喜二年舉敦朴對策臣聞立天之道曰陰與陽立地之道曰柔與剛夫陰陽剛柔天地所以立也取仁于陽資義于陰柔以施德剛以行刑各順時月以厚群生帝王之法天地設位四時代序王者奉順則風雨時至嘉禾育植天失其度則咎徵竝至饑饉薦臻今科條品制禁令所以承天順民者備矣悉矣不可加矣然而不平之效猶有咨嗟之怨者百姓屢聞恩澤之聲而未見惠和之實也今從政者變忽法度以殺戮威刑為能賢問其國守相及令長何如其稱之也曰大急其毀之也曰大緩夫急致寒緩致燠二者罪同而論者許急此陰陽所以不和也復之之道審察緩急之謗譽鈞同寒燠之罪罰以崇王政則陰陽和也好惡既明則宰官之吏知所避就又正身以先之嚴以涖之不變則刑罰之夫知為善之必利為惡之必害孰能不化則官良矣臣聞洪範八政以食為首周禮九職以農為本民失耕桑饑寒竝至盜賊之原所由起也古之足民仰足以養父母俯足以畜妻子然後敦五教宣三德則休嘉之化可致也夫足者非能家給而人足量其財用為其制度故嫁娶之禮儉則昏姻以時矣喪制之禮約則終者掩藏矣不奪其時則農夫不失矣夫妻子以纍其心産業以重其志舍此而為非者雖有必不多矣今則不然此盜賊所以不息誠使制度必行禁令必止則仕者不濫法式之外百工不作無用之器商賈不通難得之貨農夫不失三時之務各安所業則盜賊消除災害不起矣見袁宏後漢紀十八大中之道在天為北辰在地為人君見續漢五行志五注補飛章虛誣李固臣聞君不稽古無以承天臣不述舊無以奉君昔堯殂之後舜仰慕三年坐則見堯于牆食則覩堯于羹斯所謂聿追來孝不失臣子之節者太尉李固因公假私依正行邪離間近戚自隆支黨至于表舉薦達例皆門徒及所辟召靡非先舊或富室財賂或子壻婚屬其列在官牒者凡四十九人又廣選賈豎以補令史募求好馬臨窗呈試出入踰侈輜軿曜日大行在殯路人掩涕固獨胡粉飾貌搔頭弄姿槃旋偃仰從容冶步曾無慘怛傷悴之心山陵未成違矯舊政善則稱己過則歸君斥逐近臣不得侍送作威作福莫固之甚臣聞台輔之位實和陰陽璇璣不平寇賊姦軌則責在太尉固受任之後東南跋扈兩州數郡千里蕭條兆人傷損大化陵遲而詆疵先主苟肆狂狷存無廷爭之忠沒有誹謗之說夫子罪莫大于纍父臣惡莫深于毀君固之過釁事合誅辟見後漢李固傳上疏乞自效今雜種諸羌轉相鈔盜宜及其未并亟遣深入破其支黨而馬賢等處處留滯羌胡百里望塵千里聽聲飲酒高會不以為慮坐食穀米未聞所擊臣竊惑之夫事不復校而可收名覆實斯乃征討者之私便非國之公利也臣聽輿人之頌云賢欲目前受降使譁聲東聞且懼士卒將不堪命有高克潰叛之變也臣又聞吳起為將暑不張蓋寒不披裘戎事不邇女器今賢野次垂幕珍肴雜遝兒子侍妾事與古反臣兄弟受恩誠私憤悒鉛錫之刀以效一割之用臣願請兵五千才加部隊之號庶自率勵與之齊勇昔毛遂願處囊中趙之厮養欲說燕初為衆笑後效其功臣託儒者不便武職猥陳此言訪之群司知當受虛誕之辜唯加裁省見袁宏後漢紀十九今雜種諸羌轉相鈔盜宜及其未并亟遣深入破其支黨而馬賢等處處留滯羌胡百里望塵千里聽聲今逃匿避回漏出其後則必侵寇三輔為民大害臣願請賢所不可用關東兵五千裁假部隊之號盡力率厲埋根行道以先吏士三旬之中必克破之臣少習學藝不更武職猥陳此言必受誣罔之辜昔毛遂廝養為衆所蚩終以一言克定從要臣懼賢等專守一城言攻于西而羌出于東且其將士必有高克潰叛之變見後漢馬融傳按此與袁宏紀各有刪節而語次不同上書請赦龐參梁慬伏見西戎反畔寇鈔五州陛下愍百姓之傷痍哀黎元之失業單竭府庫以奉軍師昔周宣獫狁侵鎬及方孝文胸奴亦略上郡而宣王立中興之功文帝建太宗之號非惟兩主有明睿之姿抑亦扞城有虓虎之助是以南仲赫赫列在周詩亞夫赳赳載于漢策竊見前護羌校尉龐參文武昭備智略弘遠既有義勇果毅之節兼以博雅深謀之姿又度遼將軍梁慬前統西域勤苦數年還留三輔功效克立閒在北邊單于降伏今皆幽囚陷于法網昔荀林父敗績于邲晉侯使復其位孟明視喪師于崤秦伯不替其官故晉景并赤狄之土秦穆遂霸西戎宜遠覽二君使參慬得在寬宥之科誠有益于折衝毗佐于聖化見後漢龐參傳延光四年日蝕上書伏讀詔書陛下深惟禹湯罪已之義歸咎自責寅畏天戒詳延百僚博問公卿知變所自審得厥故修復往術以答天命臣子遠近莫不延頸企踵苟有隙空一介之知事願自效貢納聖聽臣伏見日蝕之占自昔典籍十月之交春秋傳記漢注所載史官占侯群臣密對陛下所觀覽左右所諷誦可謂詳悉備矣雖復廣問陷在前志無以復加乃者茀氣于參臣前得敦朴之人後三年二月對策北宮端門以為參者西方之位其于分野并州是也殆謂西戎北狄其後種羌叛戾烏桓犯上郡并涼動兵驗略效矣今復見大異申誠重譴于此二城海內莫見三月一日合辰在婁婁又西方之宿衆古顯明者羌及烏桓有悔過之辭將吏策勳之名臣恐受仕典牧者苟脫目前皆粗圖身一時之權不顧為國百世之利論者美近功忽其遠則各相不大疢病伏為天象不虛老子曰圖難于其易也為大于其細也消災復異宜在于今詩曰日月告凶不用其行四國無政不用其良傳曰國無政不用善則自取謫于日月之災故政不可不慎也務三而已一曰擇人二曰安民三曰從時臣融伏惟方今有道之世漢典設張侯甸采衛司民之吏案三循墨雖有殿最所差無幾其陷罪辟身自取禍百姓未被其大傷至邊郡牧御失和吉之與凶敗之與成優劣相懸不誠不可審擇其人上以應天變下以安民隸竊見列將子孫生長京師食仰租奉不知稼穡之艱又希遭厄困故能果毅輕財施與孤弱以獲死生之用此其所長也不拘法禁奢泰無度功勞足以宣威踰濫足以傷化此其所短也州郡之士出自貧苦長于撿押雖專賞罰不敢越溢此其所長也拘文守法遭遇非常狐疑無斷畏首畏尾威恩纖薄外內離心士卒不附此其所短也必得將兼有二長之才無二短之纍參以吏事任以兵法有此數姿然後能折衝厭難致其功實轉災為福孔子曰十室之邑必有忠信如丘者焉以天下之大四海之衆云無若人臣以為誣矣宜特選詳譽審得其真鎮守二方以應用良擇人之義以塞大異也見續漢五行志六注引馬融集又陳星孛星孛參畢參西方之宿畢為邊兵至于分野并州是也西戎北狄殆將起乎宜備二方見後漢馬融傳奏馬賢事賢專于軍設重韋疊幕以油表上夷其山為誶翠設其中見書鈔一百三十二與竇伯向書孟陵奴來賜書見手跡歡喜何量次于面也書雖兩紙紙八行行七字七八五十六字百十二言耳見藝文類聚三十一與謝伯世書憒憒愁思猶不解懷思在竹閒放狗逐麋晚秋涉冬大蒼出籠黃棘下菟芼以乾葵以送餘日茲樂而已見藝文類聚九十一御覽九百三十六書序泰誓後得案其文似若淺露文云八百諸侯不召自來不期同時不謀同辭及火復于上至于王屋流為鵰至五以榖俱來舉火神怪得無在子所不語中乎又春秋引泰誓曰民之所欲天必從之國語引泰誓曰朕夢協朕卜襲于休祥戎商必克孟子引泰誓曰我武惟揚侵于之疆取彼凶殘我伐用張于湯有光孫卿引泰誓曰獨夫受禮記引泰誓曰豫克受非豫武惟朕文考無罪受克豫非朕文考有罪惟豫小子無良今文泰誓皆無此語吾見書傳多矣所引泰誓而不在泰誓者甚多弗復悉記略舉五事以明之亦可知矣見尚書泰誓序正義廣成頌鄧太后臨朝騭兄弟輔政而俗儒世士以為文德可興武功宜廢遂寢搜狩之禮息戰陳之法故猾賊從橫乘此無備融乃感激以為文武之道聖賢不墜五才之用無或可廢元初二年上廣成頌以諷諫其辭曰臣聞孔子曰奢則不遜儉則固奢儉之中以禮為界是以蟋蟀山樞之人竝刺國君諷以太康馳驅之節夫樂而不荒憂而不困先王所以平和府藏頤養精神致之無疆故戛擊鳴球載於虞謨吉日車攻序于周詩聖主賢君以增盛美豈徒為奢淫而已哉伏見元年已來遭值厄運陛下戒懼災異躬自菲薄荒棄禁苑廢弛樂懸勤憂潛思十有餘年以過禮數重以皇太后體唐堯親九族篤睦之德陛下履有虞蒸蒸之孝外舍諸家每有憂疾聖恩普勞遣使交錯稀有曠絶時時寧息又無以自娛樂殆非所以逢迎太和裨助萬福也臣愚以為雖尚頗有蝗蟲今年五月以來雨露時澍祥應將至方涉冬節農事閒隙宜幸廣成覽原隰觀宿麥勸收藏因講武校獵使寮庶百姓復覩羽旄之美聞鐘鼓之音歡欣喜樂鼓舞疆畔以迎和氣招致休慶小臣螻蟻不勝區區職在書籍謹依舊文重述搜狩之義作頌一篇并封上淺陋鄙薄不足觀省臣聞昔命師于鞬橐偃伯于靈臺或人嘉而稱焉彼固未識夫雷霆之為天常金革之作昏明也自黃炎之前傳道罔記三五以來越可略聞且區區之酆郊猶廓七十里之囿盛春秋之苗詩詠圃草樂奏騶虞是以大漢之初基也宅茲天邑總風雨之會交陰陽之和揆厥靈囿營于南郊徒觀其坰場區宇恢𣅿曠蕩藐敻勿罔寥豁鬱泱騁望千里天與地莽于是周阹環瀆右矕三塗左概嵩嶽面據衡陰箕背王屋浸以波溠夤以滎洛金山石林殷起乎其中峨峨磑磑鏘鏘崔崔隆穹槃回嵎峗錯崔神泉側出丹水涅池怪石浮磬耀焜于其陂其土毛則榷牧薦草芳茹甘荼茈萁藝蒩昌本深蒲芝荋堇荁蘘荷芊蕖桂荏鳧葵格韭菹于其植物則玄林包竹藩陵蔽京珍林嘉樹建木叢生椿梧栝柏櫃柳楓楊豐彤對蔚崟額槮爽翕習春風含津吐榮鋪于布濩蓶扈蘳熒惡可殫形至于陽月陰慝害作百草畢落林衡戒田焚萊柞木然後舉天網頓八紘揫斂九藪之動物繯橐四野之飛征鳩之乎茲囿之中山敦雲移群鳴膠膠鄙騃譟歡子野聽聳離朱目眩隸首策亂陳子籌昏于是營圍恢廓充斥川谷罦罝羅羉彌綸坑澤皋牢陵山校隊案部前後有屯甲乙相伍戊子為堅乘輿乃以吉月之陽朔登于疏鏤之金路六驌驦之玄龍建雄虹之旌夏揭鳴鳶之修橦曳長庚之飛髾載日月之太常棲招搖與玄弋注枉矢于天狼羽毛紛髟鼬揚金㚇而拖玉瓖屯田車于平原播同徒于高岡旃旝摻其如林錯五色以摛光清氛埃掃野場誓六師搜雋良司徒勒卒司馬平行車攻馬同教達戒通伐咎鼓撞華鐘獵徒縱赴榛叢徽嫿霍奕別騖分奔騷擾聿皇往來交舛紛紛回回南北東西風行雲轉胸磕隱訇黃塵勃滃暗若霧昏日月為之籠光列宿為之翳昧僄狡課才徑勇程氣狗馬角逐鷹鸇競鷙驍騎旁佐輕車橫厲相與陸梁聿皇于中原絹猑蹄鏦特肩脰完羝撝介鮮散毛族梏羽群然後飛鋋電激流矢雨墜各指所質不期俱殪竄伏扔輪發作梧轊祋殳狂擊頭陷顱倅獸不得猭禽不得瞥或夷由未殊顛狽頓躓蠕蠕蟫蟫充衢塞隧葩華䓑布不可勝計若夫鷙獸毅蟲倨牙黔口大胸哨後縕巡歐紆負隅依阻莫敢嬰禦乃使鄭叔晉婦之徒睽孤刲刺裸裎袒裼冒亘柘搓棘枳窮浚谷底幽嶰暴斥虎搏狂兕獄猘熊抾封狶或輕訬趬悍廋疏嶁領犯歷嵩巒陵喬松履修樠踔攳枝杪標端尾蒼蜼掎玄援木産盡寓屬單罕罔合部罾弋同曲類行竝驅星布麗屬曹伍相保各有分局矰碆飛流纖羅絡縸遊雉群驚晨鳧輩作翬然雲起霅爾雹落爾乃藐觀高蹈改乘回轅泝恢方撫馮夷策句芒超荒忽出重陽厲雲漢橫天潢導鬼區徑神場詔靈保召方相驅厲疫走蜮祥捎罔兩拂游光枷天狗緤墳羊然後緩節舒容裴回安步降集波禦川衡澤虞矢魚陳罟茲飛宿沙田開古蠱翬終葵揚關斧刊重冰撥蟄戶測潛鱗踵介旅逆獵湍瀨渀薄汾撓淪滅潭淵左挈夔龍右提蛟鼉春獻王鮪夏薦鱉黿于是流覽遍照殫變極態上下究竟山谷蕭條原野嵺愀上無飛鳥下無走獸虞人植旍獵者效具車弊田罷旋入禁囿棲遲乎昭明之觀休息乎高光之榭以臨乎宏池鎮以瑤臺純以金堤樹以蒲柳被以緑莎瀇漾沆漭錯紾槃委天地虹洞固無端涯大明生東月朔西陂乃命壺涿驅水蠱逐罔螭滅短狐簎鯨鯢然後方餘皇連舼舟張雲帆施霓幬靡颸風陵迅流發櫂歌縱水謳淫魚出蓍蔡浮湘靈下漢女游水禽鴻鵠鴛鴦鷗鷖鶬鴰鸕鷁鷺鴈鸊鷉乃安斯寢戢翮其涯魴鱮鱏鯿鰋鯉鱨鯊樂我純德騰踊相隨雖靈沼之白鳥孟津之躍魚方斯蔑矣然猶詠歌于伶蕭載陳于方策豈不哀哉于是宗廟既享庖廚既充車馬既簡器械既攻然後擺牲班禽淤賜犒功群師疊伍伯校千重山罍常滿房俎無空酒正案隊膳夫巡行清醪車湊燔炙騎將鼓駭舉爵鐘鳴既觴若乃陽阿衰斐之晉制闡蛙華羽之南音所以洞蕩胸臆發明耳目疏越蘊慉駭恫底伏鍠鍠鎗鎗奏于農郊大路之衢與百姓樂之是以明德耀乎中夏威靈畼乎四荒東鄰浮巨海而入享西旅越葱嶺而來王南徼因九譯而致貢朔狄屬象胥而來同蓋安不忘危治不忘亂道在乎茲斯固帝王之所以曜神武而折遐衝者也方今大漢收功于道德之林致平于仁義之淵忽搜狩之禮闕槃虞之佃暗昧不覩日月之光聾昏不聞雷霆之震于今十二年為日久矣亦方將刊禁臺之祕藏發天府之官常由質要之故業率典刑之舊章采清原嘉岐陽登俊桀命賢良舉淹滯拔幽荒察淫侈之華譽顧介特之實功聘畎畝之群雅宗重淵之潛龍乃儲精山藪歷思河澤目矖鼎俎耳聽康衢營傅說于胥靡求伊尹于庖廚索膠鬲於魚鹽聽寧戚于大車俾之昌言而宏議軼越三家馳騁五帝悉覽休祥總括群瑞遂棲鳳皇于高梧宿麒麟于西園納焦僥之珍羽受王母之白環永逍遙乎宇內與二儀乎無疆二造化于后土參神施于昊乾超特達而無儔煥巍巍而無原豐千億之子孫歷萬載而永延禮樂既闋北轅反斾至自新城背伊闕反洛京見後漢馬融傳東巡頌允迪在昔紹烈陶唐殷天衷克搖光若時則運瓊衡敷六典經八成燮和萬殊惣領神明肆類乎上帝燔柴乎後行曜四國而揚光展聖義于巡狩喜圻畤而詠八荒指宗嶽以為期固岱神之所望散齊既畢越異良辰棫槱三辰禋祀乎六宗祗燎乎群神遂發號群司申戒百工卜筮稱吉蓍龜襲從南征有時馮相告祥清夷道而增構烈火燔燃暉光四煬焱爛薄天蕭香肆升青煙習雲圭璋峨峨犧牲潔純鬱鬯宗彝明水玄樽空桑孤竹咸池雲門六八匝變神祇竝存見藝文類聚三十九初學記十三御覽五百三十七梁大將軍西第頌西北戍亥玄石承輸蝦蟆吐寫庚辛之域見南齊書禮志上引西第賦通典五十五黃果揚芳紫房潰漏見文選蜀都賦注又潘嶽間居賦注胡桃自零見文選蜀都賦注御覽九百七十一騰極受檐陽馬承阿見文選景福殿賦注又七命注遺令穿中除五時衣但得施逢絹單衣見御覽六百九十一冢中不得下銅唾壼見御覽七百三自敘融字季長右扶風茂陵人少而好問學無常師大將軍鄧騭召為舍人棄游武都會羌虜起自關以西道斷融以謂古人有言左手據天下之圖而右手刎其喉愚夫不為何則生貴于天下也豈以曲俗咫尺為羞滅無限之身哉因往應之為校書郎出為南郡太守見世說文學篇注引融自敘上疏讓博士臣與博士梁恭山陽太守呂羌俱修梁丘易二臣年竝耆艾經學深明而臣不以時退與恭竝立深知羌學又不能達慚負二老無顏于世誦而不行知而不言不可開口以為人師願推博士以避恭羌見後漢范升傳建武二年上疏請諡祭遵臣聞先王崇政尊美屏惡昔高祖大聖深見遠慮班爵割地與下分功著録勳臣頌其德美生則寵以殊禮奏事不名入門不趨死則疇其爵邑世無絶嗣丹書鐵券傳于無窮斯誠大漢厚下安人長久之德所以纍世十餘歷載數百廢而復興絶而復續者也陛下以至德受命先明漢道褒序輔佐封賞功臣同符祖宗征虜將軍潁陽侯遵不幸早薨陛下仁恩為之感傷遠迎河南惻怛之慟形于聖躬喪事用度仰給縣官重賜妻子不可勝數送死有以加生厚亡有以過存矯俗厲化卓如日月古者臣疾君視臣卒君弔德之厚者也陵遲已來久矣及至陛下復興斯禮群下感動莫不自勵臣竊見遵修行積善竭忠于國北平漁陽西拒隴蜀先登坻上深取略陽衆兵既退獨守衝難制御士心不越法度所在吏人不知有軍清名聞于海內廉白著于當世所得賞賜輒盡與吏士身無奇衣家無私財同産兄午以遵無子娶妾送之遵乃使人逆而不受自以身任于國不敢圖生慮繼嗣之計臨死遺誡牛車載喪薄葬洛陽問以家事終無所言任重道遠死而後已遵為將軍取士皆用儒術對酒設樂必雅歌投壺又建為孔子立後奏置五經大夫雖在軍旅不忘俎豆可謂好禮悅樂守死善道者也禮生有爵死有諡爵以殊尊卑諡以明善惡臣愚以為宜因遵薨論敘衆功詳案諡法以禮成之顯章國家篤古之制為後嗣法見後漢祭遵傳奏難費氏易左氏春秋立博士臣聞主不稽古無以承天臣不述舊無以奉君陛下愍學微缺勞心經藝情存博聞故異端競進近有司請置京氏易博士群下執事莫能據正京氏既立費氏怨望左氏春秋復以比類亦希置立京費已行次復高氏春秋之家又有騶夾如令左氏費氏得置博士高氏騶夾五經奇異竝復求立各有所執乖戾分爭從之則失道不從則失人將恐陛下必有厭倦之聽孔子曰博學約之弗叛矣夫夫學而不約必叛道也顏淵曰博我以文約我以禮孔子可謂知教顏淵可謂善學矣老子曰學道日損損猶約也又曰絶學無憂絶末學也今費左二學無有本師而多反異先帝前世有疑于此故京氏雖立輒復見廢疑道不可由疑事不可行詩書之作其來已久孔子尚周流遊觀至于知命自衛反魯乃正雅頌今陛下草創天下紀綱未定雖設學官無有弟子詩書不講禮樂不修奏立左費非政急務孔子曰攻乎異端斯害也已傳曰聞疑傳疑聞信傳信而堯舜之道存願陛下疑先帝之所疑信先帝之所信以示反本明不專己天下之事所以異者以不一本也易曰天下之動貞夫一也又曰正其本萬事理五經之本自孔子始謹奏左氏之失凡十四事見後漢范升傳奏毀周黨等臣聞堯不須許由巢父而建號天下周不待伯夷叔齊而王道以成伏見太原周黨東海王良山陽王成等蒙受厚恩使者三聘乃肯就車脫衣解履升于華轂及陛見帝廷黨不以禮屈伏而不謁偃塞敖慢逡巡進退同時俱逝黨等文不能演義武不能死君釣采華名庶幾三公之位臣願與竝坐雲臺之下考試圖國之道不如臣言伏虛妄之罪而敢私竊虛名誇上求高皆大不敬見後漢周黨傳又御覽四百九十八引東觀漢記奏記王邑升聞子以人不閒于其父母為孝臣以下不非其君上為忠今衆人咸稱朝聖皆曰公明蓋明者無不見聖者無不聞今天下之事昭昭于日月震震于雷霆而朝云不見公云不聞元元焉所呼天公以為是而不言則過小矣知而從令則過大矣二者于公無可以免宜乎天下歸怨于公矣朝以遠者不服為至念升以近者不服為重憂今動與時戾事與道反馳騖覆車之轍探湯敗事之後後出益可怪晚發愈可懼耳方春歲首而動發遠役藜藿不充田荒不耕穀價騰躍斛至數千吏人陷于湯火之中非國家之人也如此則胡貊守關青徐之寇在于帷帳矣升有一言可以解天下倒懸免元元之急不可書傳願蒙引見極陳所懷見後漢范升傳
