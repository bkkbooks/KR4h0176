body:
  text: 陳元上疏難范升奏左氏不宜立博士陛下撥亂反正文武並用深愍經藝謬雜真偽錯亂每臨朝日輒延群臣講論聖道知丘明至賢親受孔子而公羊穀梁傳聞于後世故詔立左氏博詢可否示不專己盡之群下也今論者沉溺所習玩守舊聞固執虛言傳受之辭以非親見實事之道左氏孤學少與遂為異家之所覆冒夫至音不合衆聽故伯牙絶弦至寶不同衆好故卞和泣血仲尼聖德而不容于世況于竹帛餘文其為雷同者所排固其宜也非陛下至明孰能察之臣元竊見博士范升等所議奏左氏春秋不可立及太史公違戾凡四十五事案升等所言前後相違皆斷截小文媟黷微辭以年數小差掇為巨謬遺脫纖微指為大尤抉瑕擲釁掩其弘美所謂小辨破言小言破道者也升等又曰先帝不以左氏為經故不置博士後主所宜因襲臣愚以為先帝所行而後主必行者則盤庾不當遷于殷周公不當營洛邑陛下不當都山東也往者孝武皇帝好公羊衛太子好穀梁有詔詔太子受公羊不得受穀梁孝宣皇帝在人間時聞衛太子好穀梁于是獨學之及即位為石渠論而穀梁氏興至今與公羊並存此先帝後帝各有所立不必其相因也孔子曰純儉吾從衆至于拜下則違之夫明者獨見不惑于朱紫聽者獨聞不謬于清濁故離朱不為巧眩移目師曠不為新聲易耳方今干戈少弭戎事略戢留思聖藝眷顧儒雅採孔子下拜之義卒淵聖獨見之旨分明黑白建立左氏解釋先聖之積結洮汰學者之纍惑使基業垂于萬世後進無復狐疑則天下幸甚臣元愚鄙嘗傳師言如得以褐衣召見俯伏庭下誦孔氏之正道理丘明之宿冤若辭不合經事不稽古退就重誅雖死之日生之年也見後漢陳元傳上疏駁江馮督察三公議臣聞師臣者帝賓臣者霸故武王以太公為師齊桓以夷吾為仲父古之道也近魏文侯友田子諸侯不敢入其境高皇帝令相國奏事不拜入殿不趨所以寵大臣也及新室王莽遭漢中衰獨操國柄以偷天下況己自喻不信群臣奪公輔之任損宰相之威以刺舉為明徼訐為直至乃陪僕告其君長子弟變其父兄罔密法峻大臣無所措手足然不能禁天下之謀身為世戮故人君患在自驕不患驕臣失在自任不在任人方今四方未集百姓未一觀聽者注耳目之時也陛下宜修文武之典襲祖宗之德屈節待賢以示將來不宜有司察公輔之名也見後漢陳元傳又見袁宏後漢紀七各有刪節請徙張步降兵疏臣聞先王無二道明聖用而治同也見惡如農夫之務去草焉芟夷蘊崇之絶其本根勿使能殖畏其易也古今通道傳其法于有漢狼子野心奔馬善驚成王深知其終卒之患故以殷民六族分伯禽七族分康叔懷姓九宗分唐叔撿押其姦宄又遷其餘于成周舊地雜俗旦夕拘録所以挫其強御之力詘其驕恣之節也及漢初興上稽舊章合符重規徙齊諸田楚昭屈景燕趙韓魏之後以稍弱六國強宗邑里無營利之家野澤無兼并之民萬里一統海內賴安後輒因衰粗之痛脅以送終之義故遂相率而陪園陵無反顧之心追觀往法政皆神道設教強幹弱枝本支百世之要也是以皆永享康寧之福無怵惕之憂繼嗣承業恭己而治蓋此助也其被災害民輕薄無纍重者兩府遣吏護送饒榖之郡或懼死亡卒為傭賃亦足以消散其口救贍全其性命也昔魯隱有賢行將致國于桓公乃流連貪位不能早退況草創兵長卒無德能直以憂亂乘時擅權作威玉食狃忕之意徼幸之望曼延無足張步之計是也小民負縣官不過身死負兵家滅門殄世陛下昭然獨見成敗之端或屬諸侯官府元元少得舉首仰視而尚遺脫二千石失制御之道令得復昌熾縱橫比年大雨水潦暴長涌泉盈溢災壞城郭官寺吏民廬舍潰徙離處潰成坑坎臣聞水陰類也易卦地上有水比言性不相害故曰樂也而猥相毀墊淪失常敗百姓安居殆陰下相為蠹賊有大小負勝不齊均不得其所侵陵之象也詩云畏天之威于時保之惟陛下留神明察往來懼思天下幸甚見續漢五行志三注補引東觀書又略見袁宏後漢紀七上疏議郊祀故事臣聞營河雒以為民刻肌膚以為刑封疆畫界以建諸侯井田什一以供國用三代之所同及至漢興因時宜趨世務省煩苛取實事不苟貪高亢之論是以去土中之京師就關內之遠都除肉刑之重律用髡鉗之輕法郡縣不置世祿之家農人三十而取一政卑易行禮簡易從民無愚智思仰漢德樂承漢紀基業特起不因緣堯堯遠于漢民不曉信言提其耳終不悅諭后稷近于周民戶知之世據以興基由其祚本與漢異郊祀高帝誠從民望得萬國之歡心天下福應莫大于此民奉種祀且猶世主不失先俗群臣僉薦鯀考績不成九載乃殛宗廟至重衆心難違不可卒改詩云不愆不忘率由舊章明當尊用祖宗之故文章也宜如舊制以解天下之惑合于易之所謂先天而天弗違後天而奉天時義方軍師在外祭可且如元年郊祭故事見續漢祭祀志上注補引東觀書又略見後漢杜林傳又杜林傳注引東觀記奏諫從梁統增科禁夫人情挫辱則節義之心損刑網繁密則苟免之行生聖帝明王知其如此故深識遠慮動居其厚故湯去三面之網易著三驅之義所以德刑參用而示民有恥漢德寬厚民無二心軍士左袒樂為劉氏多恩之所致也至其後世不能以德而勤于法故有吹毛求疵詆欺無限桃李之饋集以成事于是家無全行國無廉夫上下相遁法不能止而仁義之風替矣陛下覽得失之要深知其原故破觚為圓建斫為朴法簡易遵網疏易從海內頌政不勝其喜宜如舊制夫人情挫辱則義節之風損法防繁多則苟免之行興孔子曰導之以政齊之以刑民免而無恥導之以德齊之以禮有恥且格古之明王深識遠慮動居其厚不務多辟周之五刑不過三千大漢初興詳覽失得故破矩為圓斫雕為朴蠲除苛政更立疏網海內歡欣人懷寬德及至其後漸以滋章吹毛索疵詆欺無限果桃菜茹之饋集以成臧小事無妨于義以為大戮故國無廉士家無完行至于法不能禁令不能止上下相遁為敝彌深臣愚以為宜如舊制不合翻移見後漢杜林傳又見通典一百六十六上書薦鄭興竊見河南鄭興執義堅固敦悅詩書好古博物見疑不惑有公孫僑觀射父之德宜侍帷幄典職機密昔張仲在周燕翼宣王而詩人悅喜惟陛下留聽少察以助萬分見後漢鄭興傳又略見袁宏後漢紀六遣子奉書馬援將軍內施九族外有賓客望恩者多林父子兩人食列卿祿常有盈今送錢五萬後漢杜林傳注御覽八百三十五並引東觀紀薦伏湛疏臣聞唐虞以股肱康文王以多士寧是故詩稱濟濟書曰良哉臣詩竊見故大司徒陽都侯伏湛自行束修訖無毀玷篤信好學守死善道經為人師行為儀表前在河內朝歌及居平原吏人畏愛則而象之遭時反覆不離兵凶秉節持重有不可奪之志陛下深知其能顯以宰相之重衆賢百姓仰望德義微過斥退久不復用有識所惜儒士痛心臣竊傷之湛容貌堂堂國之光暉智略謀慮朝之淵藪髫髮厲志白首不衰實足以先後王室名足以光示遠人古者選擢諸侯以為公卿四方回首仰望京師柱石之臣宜居輔弼出入禁門補缺拾遺臣詩愚戇不足以知宰相之才竊懷區區敢不自竭臣前為侍御史上封事言湛公廉愛下好惡分明纍世儒學素持名信經明行修通達國政尤宜近侍納言左右舊制九州五尚書令一郡二人可以湛代頗為執事所非但臣詩蒙恩深渥所言誠有益于國雖死無恨故復越職觸冒以聞見後漢伏湛傳又御覽三百八十九六百三十一引東觀漢記迄退郡疏陛下亮成天工克濟大業偃兵修文群帥反旅海內合和萬世蒙福天下幸甚唯胸奴未譬聖德威侮二垂陵虐中國邊民虛耗不能自守臣恐武猛之將雖勤亦未得解甲櫜弓也夫勤而不息亦怨勞而不休亦怨怨恨之師難復責功臣伏覩將帥之情功臣之望冀一休足于內郡然後即戎出命不敢有恨臣愚以為師克在和不在衆陛下雖垂念北邊亦當頗泄用之昔湯武善御衆故無忿鷙之師陛下起兵十有三年將帥和睦士卒鳧薻今若使公卿郡守出于軍壘則將帥自厲士卒之復比于宿衛則戎士自百何者天下已安各重性命大臣以下咸懷樂土不讎其功而厲其用無以勸也陛下誠宜虛缺數郡以俟振旅之臣重復厚賞加于久役之士如此緣邊屯戍之師競而忘死乘城拒塞之吏不辭其勞則烽火精明守戰堅固聖王之政必因人心今猥用愚薄塞功臣之望誠非其宜臣詩伏自惟忖本以史吏一介之才遭陛下創制大業賢俊在外空乏之間超受大恩牧養不稱奉職無效久竊祿位令功臣懷慍誠惶誠恐八年上書乞避功德陛下殊恩未許放退臣詩蒙恩尤深義不敢苟冒虛請誠不勝至願願退大郡受小職及臣齒壯力能經營劇事如使臣詩必有補益復受大位雖析圭授爵所不辭也惟陛下哀矜見後漢杜詩傳請以虎符發兵疏臣聞兵者國之凶器聖人所慎舊制發兵皆以虎符其餘徵調竹使而已符策合會取為大信所以明著國命斂持威重也間者發兵但用璽書或以詔令如有姦人詐偽無由知覺愚以為軍旅尚興賊虜未殄徵兵郡國宜有重慎可立虎符以絶姦端昔魏之公子威傾鄰國猶假兵符以解趙圍若無如姬之仇則其功不顯事有煩而不可省費而不得已蓋謂此也見後漢杜詩傳上疏論馬防臣愚以為貴戚可封侯以富之不當職事以任之何者繩以法則傷恩私以親則違憲伏聞馬防今當西征臣以太后恩仁陛下至孝恐卒有纖介難為意愛聞防請杜篤為從事中郎多賜財帛篤為鄉里所廢客居美陽女弟為馬氏妻恃此交通在所縣令苦其不法收繫論之今來防所議者咸致疑怪況乃以為從事將恐議及朝廷今宜為選賢能以輔助之不可復令防自請人有損事望苟有所懷敢不自聞見後漢第五倫傳又略見袁宏後漢紀十一上疏褎稱盛美以勸成風德陛下即位躬天然之德體晏晏之姿以寬弘臨下出入四年前歲誅刺史二千石貪殘者六人斯皆明聖所鑒非群下所及然詔書每下寬和而政急不解務存節儉而奢侈不止者咎在俗敝群下不稱故也光武承王莽之餘頗以嚴猛為政後代因之遂成風化郡國所舉類多辨職俗吏殊未有寬博之選以應上求者也陳留令劉豫冠軍令駟協並以刻薄之姿臨人宰邑專念掠殺務為嚴苦吏民愁怨莫不疾之而今之議者反以為能違天心失經義誠不可不慎也非徒應坐豫協亦當宜譴舉者務進仁賢以任時政不過數人則風俗自化矣臣嘗讀書記知秦以酷急亡國又目見王莽亦以苛法自滅故勤勤懇懇實在于此又聞諸王主貴戚驕奢踰制京師尚然何以示遠故曰其身不正雖令不從以身教者從以言教者訟夫陰陽和歲乃豐君臣同心化乃成也其刺史太守以下拜除京師及道出洛陽者宜皆召見可因博問四方兼以觀察其人諸上書言事有不合者可但報歸田里不宜過加喜怒以明在寬臣愚不足採見後漢第五倫傳又見袁宏後漢紀十一有刪節亦有多出句上疏論竇憲臣得以空虛之質當輔弼之任素性駑怯位尊爵重拘迫大義思自策厲雖遭百死不敢擇地又況親遇危言之世哉今承百王之敝人尚文巧咸趨邪路莫能守正伏見虎賁中郎將竇憲椒房之親典司禁兵出入省闈年盛志美卑謙樂善此誠其好士交結之方然諸出入貴戚者類多瑕釁禁錮之人尤少守約安貧之節士大夫無志之徒更相販賣雲集其門衆喣飄山聚蚊成雷蓋驕逸所從生也三輔論議者至云以貴戚廢錮當復以貴戚浣濯之猶解酲當以酒也詖險趣勢之徒誠不可親近臣愚願陛下中宮嚴敕憲等閉門自守無妄交通士大夫防其未萌慮于無形令憲永保福祿君臣交歡無纖介之隙此臣之至所願也見後漢第五倫傳又略見袁宏後漢紀十一上書請抑損后族臣聞忠不隱諱直不避害不勝愚狷昧死自表書曰臣無作威作福其害于而家凶于而國傳曰大夫無境外之交束修之饋近代光烈皇后雖友愛天至而卒使陰就歸國徙廢陰興賓客其後梁竇之家互有非法明帝即位竟多誅之自是洛中無復權戚書記請託一皆斷絶又譬諸外戚曰苦身待士不如為國戴盆望天事不兩施臣嘗刻著五臧書諸紳帶而今之議者復以馬氏為言竊聞衛尉廖以布三千匹城門校尉防以錢三百萬私贍三輔衣冠知與不知莫不畢給又聞臘日亦遺其在洛中者錢各五千越騎校尉光臘用羊三百頭米四百斛肉五千斤臣愚以為不應經義惶恐不敢以不聞陛下情欲厚之亦宜所以安之臣今言此誠欲上忠陛下下全后家裁蒙省察見後漢第五倫傳封上吏民奏記臣任重憂深不能出奇策異謀吏民責讓臣者多謹並封土見袁宏後漢紀十一
