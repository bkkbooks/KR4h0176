body:
  text: 馮衍顯志賦馮子以為夫人之德不碌碌如玉落落如石風興雲蒸一龍一蛇與道翱翔與時變化夫豈守一節哉用之則行舍之則藏進退無主屈伸無常故曰有法無法因時為業有度無度與物趣舍常務道德之實而不求當世之名闊略杪小之禮蕩佚人間之事正身直行恬然肆志顧嘗好俶儻之策時莫能聽用其謀喟然長歎自傷不遭久棲遲于小官不得舒其所懷抑心折節意悽情悲夫伐冰之家不利雞豚之息委積之臣不操市井之利況歷位食祿二十餘年而財産益狹居處益貧惟夫君子之仕行其道也慮時務者不能興其德為身求者不能成其功去而歸家復羇旅于州郡身愈據職家彌窮困卒離飢寒之災有喪元子之禍先將軍葬渭陵哀帝之崩也營之以為園于是以新豐之東鴻門之上壽安之中地勢高敞四通廣大南望酈山北屬涇渭東瞰河華龍門之陽三晉之路西顧酆鄗周秦之丘宮觀之墟通視千里覽見舊都遂定塋焉退而幽居蓋忠臣過故墟而歔欷孝子入舊室而哀歎每念祖考著盛德于前垂鴻烈于後遭時之禍墳墓蕪穢春秋蒸嘗昭穆無列年衰歲暮悼無成功將西田牧肥饒之野殖生産修孝道營宗廟廣祭祀然後闔門講習道德觀覽乎孔老之論庶幾乎松喬之福上隴阪陟高岡遊精宇宙流目八紘歷觀九州山川之體追覽上古得失之風愍道陵遲傷德分崩夫覩其終必原其始故存其人而詠其道疆理九野經營五山眇然有思陵雲之意乃作賦自厲命其篇曰顯志顯志者言光明風化之情昭章玄妙之思也其辭曰開歲發春兮百卉含英甲子之朝兮汨吾西征發軔新豐兮裴回鎬京陵飛廉而太息兮登平陽而懷傷悲時俗之險厄兮哀好惡之無常棄衡石而意量兮隨風波而飛揚紛綸流于權利兮親雷同而妒異獨耿介而慕古兮豈時人之所喜沮先聖之成論兮邈名賢之高風忽道德之珍麗兮務富貴之樂耽遵大路而裴回兮履孔德之窈冥固衆夫之所眩兮孰能觀于無形行徑直以離尤兮羌前人之所有內自省而不慚兮遂定志而弗改欣吾黨之唐虞兮愍吾生之愁勤聊發憤而揚情兮將以蕩夫憂心往者不可攀援兮來者不可與期病沒世之不稱兮願橫逝而無由陟雍畤而消搖兮超略陽而不反念人生之不再兮悲六親之日遠陟九嵕而臨㟞嶭兮聽涇渭之波聲顧鴻門而歔欷兮哀吾孤之早零何天命之不純兮信吾罪之所生傷誠善之無辜兮齎此恨而入冥嗟我思之不遠兮豈敗事之可悔雖九死而不瞑兮恐餘殃之有再淚汍瀾而雨集兮氣滂浡而雲披心怫鬱而紆結兮意沈抑而內悲瞰太行之嵯峨兮觀壺口之崢嶸悼丘墓之蕪穢兮恨昭穆之不榮歲忽忽而日邁兮壽冉冉其不與恥功業之無成兮赴原野而窮處昔伊尹之干湯兮七十説而乃信皋陶釣于雷澤兮賴虞舜而後親無二士之遭遇兮抱忠貞而莫達率妻子而耕耘兮委厥美而不伐韓盧抑而不縱兮騏驥絆而不試獨慷慨而遠覽兮非庸庸之所識卑衛賜之阜貨兮高顏回之所慕重祖考之洪烈兮故收功于此路循四時之代謝兮分五土之刑德相林麓之所産兮嘗水泉之所殖修神農之本業兮採軒轅之奇策追周棄之遺教兮軼范蠡之絶迹陟隴山以隃望兮眇然覽于八荒風波飄其並興兮情惆悵而增傷覽河華之泱漭兮望秦晉之故國憤馮亭之不遂兮慍去疾之遭惑流山嶽而周覽兮徇碣石與洞庭浮江河而入海兮泝淮濟而上征瞻燕齊之舊居兮歷宋楚之名都哀群后之不祀兮痛列國之為墟馳中夏而升降兮路紆軫而多艱講聖哲之通論兮心愊憶而紛紜惟天路之同軌兮或帝王之異政堯舜煥其蕩蕩兮禹承平而革命并日夜而幽思兮終悇憛而洞疑高陽瞤其超遠兮世孰可與論茲訊夏啓于甘澤兮傷帝典之始傾頌成康之載德兮詠南風之高聲思唐虞之晏晏兮揖于稷契以為朋苗裔紛其條畼兮至武湯而勃興昔三后之純粹兮每季世而窮禍弔夏桀于南巢兮哭殷紂于牧野詔伊尹于亳郊兮享呂望于酆州功與日月齊光兮名與三王爭流楊朱號乎衢路兮墨子泣乎白絲知漸染之易性兮怨造作之弗思美關睢之識微兮愍王道之將崩拔周唐之盛德兮捃桓文之譎功忿戰國之遘禍兮憎權臣之擅強黜楚子于南郢兮執趙武于湨梁善忠信之救時兮惡詐謀之妄作聘申叔于陳蔡兮禽荀息于虞虢誅犂鋤之介聖兮討臧倉之訴知䔩子反于彭城兮爵管仲于夷儀疾兵革之浸滋兮苦攻伐之萌生沈孫武于五湖兮斬白起於長平惡叢巧之亂世兮毒縱橫之敗俗流蘇秦于洹水兮幽張儀于鬼谷澄德化之陵遲兮烈刑罰之峭峻燔商鞅之法術兮燒韓非之説論誚始皇之跋扈兮投李斯于四裔滅先王之法則兮禍浸淫而弘大援前聖以制中兮矯二主之驕奢饁女齊于絳臺兮饗椒舉于章華摛道德之光耀兮匡衰世之眇風褒宋襄于泓谷兮表季札于延陵托仁智之英華兮激亂國之末流觀鄭僑于溱洧兮訪晏嬰于營丘日曀曀其將暮兮獨於邑而煩惑夫何九州之博大兮迷不知路之南北駟素虯而馳騁兮乘翠雲而相佯就伯夷而折中兮得務光而愈明款子高于中野兮遇伯成而定慮欽真人之德美兮淹躊躇而弗去意斟愖而不淡兮俟回風而容與求善卷之所存兮遇許由于負黍軔吾車于箕陽兮秣吾馬於潁滸聞至言而曉領兮還吾反乎故宇覽天地之幽奧兮統萬物之維綱究陰陽之變化兮昭五德之精光躍青龍于滄海兮豢白虎于金山鑿巖石而為室兮託高陽以養仙神雀翔于鴻崖兮玄武潛于嬰冥伏朱樓而四望兮採三秀之華英纂前修之夸節兮曜往昔之光勳披綺季之麗服兮揚屈原之靈芬高吾冠之岌岌兮長吾佩之洋洋飲六醴之清液兮食五芝之茂英揵六枳而為蘺兮築蕙若而為室播蘭芷于中庭兮列杜衡于外術攢射干雜蘼蕪兮搆木蘭與新夷光扈扈而煬耀兮紛郁郁而畼美華芳曄其發越兮時恍忽而莫貴非惜身之坎軻兮憐衆美之憔悴遊精神于大宅兮抗玄妙之常操處清靜以養志兮實吾心之所樂山峨峨而造天兮林冥冥而畼茂鸞回翔索其群兮鹿哀鳴而求其友誦古今以散思兮覽聖賢以自鎮嘉孔丘之知命兮大老聃之貴玄德與道其孰寶兮名與身其孰親陂山谷而間處兮守寂寞而存神夫莊周之釣魚兮辭卿相之顯位於陵子之灌園兮似至人之髣佛蓋隱約而得道兮羌窮悟而入術離塵垢之窈冥兮配喬松之妙節惟吾志之所庶兮固與俗其不同既俶儻而高引兮願觀其從容見後漢馮衍傳又略見藝文類聚二十六楊節賦序馮子耕于驪山之阿渭水之陰廢弔問之禮絶遊宦之路眇然有超物之心無偶俗之志見文選潘嶽西征賦注初學記六上疏自陳臣伏念帝王大體古今通論常獨慨然夫以高祖之略而陳平之謀毀之則疏譽之則親以文帝之明而魏尚之忠繩之以法則為罪施之以德則為功逮至晚世董仲舒言道德見妒于公孫弘李廣奮節于胸奴見排於衛青此忠臣之常為流涕也臣衍自惟微賤之臣上無無知之薦下無馮唐之説乏董生之才寡李廣之勢而欲免讒口濟怨嫌豈不難哉臣之先祖以忠貞之故成私門之禍而臣衍復遭擾攘之時值兵革之際不敢回行苟容以求時之利事君無傾邪之謀將帥無虜掠之心衛尉陰陽興敬慎周密內自修敕外遠嫌疑故敢與交通興知臣之貧數欲本業之臣自惟無三益之才不敢處三損之地固讓而不受之昔在更始太原執貨財之柄居倉卒之間據伍食祿二十餘年而財産歲狹居處日貧家無布帛之積出無輿馬之飾于今遭清明之世飭躬力行之秋而怨讎叢興譏議橫世蓋富貴易為善貧賤難為工也疏遠隴畝之臣無望高闕之下惶恐自陳以救罪過見袁宏後漢紀八又見後漢馮衍傳上書陳事一曰顯文德二曰褒武烈三曰修舊功四曰招俊傑五曰明好惡六曰簡法令七曰差祿秩八曰撫邊境見袁宏後漢紀六後漢馮衍傳説廉丹衍聞順而成者道之所大也逆而功者權之所貴也是故期于有成不問所由論于大體不守小節昔逢丑父伏軾而使其君取飲稱于諸侯鄭祭仲立突而出忽終得復位美于春秋蓋以死易生以存易亡君子之道也詭于衆意寧國存身賢智之慮也故易曰窮則變變則通通則久是以自天祐之吉無不利若夫知其不可而必行之破軍殘衆無補于主身死之日負義于時知者不為勇者不行且衍聞之得時無怠張良以五世相韓椎秦始皇博浪之中勇冠乎賁育名高乎泰山將軍之先為漢信臣新室之興英俊不附今海內潰亂人懷漢德甚于詩人思召公也愛其甘棠而況子孫乎人所歌舞天必從之方今為將軍計莫若屯據大郡鎮撫吏士砥厲其節百里之內牛酒日賜納雄桀之士詢忠智之謀要將來之心待從橫之變興社稷之利除萬人之害則福祿流于無窮功烈著于不滅何與軍覆于中原身膏于草野功敗名喪恥及先祖哉聖人轉禍而為福智士因敗而為功願明公深計而無與俗同見後漢馮衍傳復説廉丹蓋聞明者見于無形智者慮于未萌況其昭晳者乎凡患生于所忽禍發于細微敗不可悔時不可失公孫鞅曰有高人之行負非于世有獨見之慮見贅于人故信庸庸之論破金石之策襲當世之操失高明之德夫決者智之君也疑者事之役也時不重至公勿再計見後漢馮衍傳計説鮑永衍聞明君不惡切愨之言以測幽冥之論忠臣不顧爭引之患以達萬機之變是故君臣兩興功名兼立銘勒金石令問不忘今衍幸逢寬明之日將值危言之時豈敢拱默避罪而不竭其誠哉伏念天下離王莽之害久矣始自東郡之師繼以西海之役巴蜀沒于南夷緣邊破于北狄遠征萬里暴兵纍年禍拿未解兵連不息刑法彌深賦斂愈重衆強之黨橫擊于外百僚之臣貪殘于內元元無聊飢寒並臻父子流亡夫婦離散廬落丘墟田疇蕪穢疾疫大興災異蜂起于是江湖之上海岱之濱風騰波涌更相駘藉四垂之人肝腦塗地死亡之數不啻太半殃咎之毒痛入骨髓匹夫僮婦咸懷怨怒皇帝以聖德靈威龍興鳳舉率宛葉之衆將散亂之兵喢血昆陽長驅武關破百萬之陳摧九虎之軍雷震四海席卷天下攘除禍亂誅滅無道一期之間海內大定繼高祖之休烈修文武之絶業社稷復存炎精更輝德冠往初功無與二天下自以去亡新就聖漢當蒙其福而賴其願樹恩布德易以周洽其猶順驚風而飛鴻毛也然而諸將虜掠逆倫絶理殺人父子妻人婦女燔其室屋略其財産飢者毛食寒者裸跣冤結失望無所歸命今大將軍以明淑之德秉大使之權統三軍之政存撫并州之人惠愛之誠加乎百姓高世之聲聞乎群士故其延頸企踵而望者非特一人也且大將軍之事豈得在于圭璧其行束修其心而已哉將定國家之大業成天地之元功也昔周宣中興之主齊桓霸強之君耳猶有申伯召虎夷吾吉甫攘其蝥賊安其疆宇況乎萬里之漢明帝復興而大將軍為之梁棟此誠不可以忽也且衍聞之兵久則力屈民愁則變生今邯鄲之賊未滅真定之際復擾而大將軍所部不過百里守城不休戰軍不息兵革雲翔百姓震駭奈何自怠不為深憂夫并州之地東帶名關北逼強胡年穀獨孰人庶多資斯四戰之地攻守之場也如其不虞何以待之故曰德不素積人不為用備不豫具難以應卒今生人之命縣於將軍將軍所杖必須良才宜改易非任更選賢能夫十室之邑必有忠信審得其人以承大將軍之明雖則山澤之人無不感德思樂為用矣然後簡精鋭之卒發屯守之士三軍既整甲兵已具相其土地之饒觀其水泉之利制屯田之術習戰射之教則威風遠畼人安其業矣若鎮太原撫上黨收百姓之歡心樹名賢之良佐天下無變則足以顯聲譽一朝有事則可以建大功惟大將軍開日月之明發深淵之慮監六經之論觀孫吳之策省群議之是非詳衆士之白黑以超周南之迹垂甘棠之風令夫功烈施于千載富貴傳于無窮伊望之策何以加茲見後漢馮衍傳又見藝文類聚二十五詣鄧禹箋今日裘與蓑孰急見雨則裘不用上堂則蓑不御此更為適者也今敬通逢堂蓑之不遇也見御覽七百六十五遺田邑書蓋聞晉文出奔而子犯宣其忠趙武逢難而程嬰明其賢二子之義當矣今三王背叛赤眉危國天下蟻動社稷顛隕是忠臣立功之日志士馳馬之秋也伯玉擢選剖符專宰大郡夫上黨之地有四塞之固東帶三關西為國蔽奈何舉之以資強敵開天下之胸假仇讎之刃豈不哀哉衍聞之委質為臣無有二心挈瓶之智守不假器是以晏嬰臨盟擬以曲戟不易其辭謝息守郕脅以晉魯不喪其邑由是言之內無鉤頸之禍外無桃萊之利而被畔人之聲蒙降城之恥竊為左右羞之且邾庶其竊邑畔君以要大利曰賤而必書莒牟夷以土地求食而名不滅是以大丈夫動則思禮行則思義未有背此而身名能全者也為伯玉深計莫若與鮑尚書同情戮力顯忠貞之節立超世之功如以尊親係纍之故能捐位投命歸之尚書大義既全敵人紓怨上不損剖符之責下足救老幼之命申眉高談無愧天下若乃貪上黨之權惜全邦之實衍恐伯玉必懷周趙之憂上黨復有前年之禍昔晏平仲納延陵之誨終免欒高之難孫林父違穆子之戒故陷終身之惡以為伯玉聞此至言必若刺心自非嬰城而堅守則策馬而不顧也聖人轉禍而為福智士因敗以成勝願自強于時無與俗同見後漢馮衍傳今以一節之任建三軍之威豈特寵其八尺之竹犛牛之尾也見御覽二百七十四左平山東右匡社稷見文選殷仲文解上書表注説鄧禹書衍聞昔者先王學大道以觀于政夫為君而不明于道上無以承天下無以化民為臣而不明于道進無以事君退無以修身聖朝天然之資將軍純茂之德誠少遊神乎經書之林馳情乎玄妙之中明照于日月而智溢于四海聖朝享堯舜之榮將軍荷稷契之烈自然理也見藝文類聚五十五夫虎豹愛大林蛟龍愛大水見御覽八百九十二與鄧禹書衍以為寫神輸意則聊城之説碧雞之辨不足難也見文選劉峻廣絶交論注與陰就書衍聞神龍驤首幽雲景蒸明聖修德志士思名是以意同情合聲比相應也伏見君侯忠孝之性慈仁殷勤論義周密思慮深遠顧以微賤數蒙聖恩被侯大惠衍年老被病恐一旦無祿命先犬馬懷抱不報齎恨入冥思剖肝膽有以塞責方今天下安定四海咸服蒙恩更生之臣無所效其死力側聞東平山陽王壯當之國擇除官屬衍不自量願侯白以衍備門衛鄙語曰水不激不能破舟矢不激不能飲羽不念舊惡名賢所高負責之臣欲言不敢惟侯哀憐深留聖心則闔棺之日魂復何恨見後漢馮衍傳注引衍集又與陰就書奏曹掾馮衍叩頭謝罪衍材素愚駑行義污穢外無鄉里之譽內無汗馬之勞猥蒙明府天覆之德華寵重疊間者掾史疑衍之罪衆熙飄山當為灰土賴蒙明察揆其素行復保首領倍知厚德篤于慈父浸淫肌膚滲漉骨髓德重嶽澤深河海前送妻子還淄縣遭逢暑雨以七月還至陽武聞詔捕諸王賓客惶怖詣闕冀先事自歸十一月到十二月上書報歸田里即日束手詣洛陽詔獄十五日夜詔書勿問得出遭雨又疾大困冀高世之德施以田子老馬之惠贈以秦穆駿馬之恩使長有依歸以效忠心見後漢馮衍傳注與婦弟任武達書天地之性人有喜怒夫婦之道義有離合先聖之禮士有妻妾雖宗之眇微尚欲踰制年衰歲暮恨入黃泉遭遇嫉妬家道崩壞五子之母足尚在門五年已來日甚歲劇以白為黑以非為是造作端末妄生首尾無罪無辜讒口嗷嗷亂匪降天生自婦人青蠅之心不重破國嫉妬之情不憚喪身牝雞之晨維家之索古之大患今始于衍醉飽過差輒為桀紂房中調戲布散海外張目抵掌以有為無痛徹蒼天毒流五臟愁令人不賴生忿令人不顧禍入門著床繼嗣不育紡績織紝子無女工家貧無僮賤為匹夫故舊見之莫不悽愴曾無憫惜之恩唯一婢武達所見頭無叉澤面無脂粉形骸不蔽手足抱土不原其窮不揆其情跳梁大叫呼若入冥販糖之妾不忍其態計婦當去久矣念兒曹小家無它使哀憐薑豹常為奴婢惻惻焦心事事腐腸訩訩籍籍不可聽聞暴虐此婢不死如髮半年之間膿血橫流婢病之後薑竟舂炊豹又觸冒泥塗心為愴然縑穀放歆冬衣不補端坐化亂一縷不貫既無婦道又無母儀忿見侵犯恨見狼籍依倚鄭令如居天上持質相劫詞語百車劍戟在門何暇有讓百弩環舍何可強復舉宗達人解説詞如循環口如布穀縣幡竟天擊鼓動地心不為惡身不為搖宜詳居錯且自為計無以上書告訴相恐狗吠不驚自信其情不去此婦則家不寧不去此婦則家不清不去此婦則福不生不去此婦則事不成自恨以華盛時不早自定至于垂白家貧身賤之日養癕長疽自生禍殃衍以室家紛然之故捐棄衣冠側身山野絶交遊之路杜仕宦之門闔門不出心專耕耘以求衣食何敢有功名之路哉見後漢馮衍傳注引衍集又見藝文類聚三十五答任武達書敢不露陳宿昔之意見文選鮑照白頭吟注與宣孟書居室之義人之大倫思厚歡和之節樂定金石之固又自傷前遭不良比有去兩婦之名事誠不得不然豈中心之所好哉見後漢馮衍傳注書百齡之期未有能至見文選頭陀寺碑文注問交見後漢馮衍傳注衍集有問交一篇德誥沈情幽思引六經之精微見文選蜀都賦注仲尼言語不習則子貢侍見文選顏延之皇太子釋奠會詩注慎情見後漢馮衍傳注衍集有慎情一篇刀陽銘修爾甲兵用戒不虞見危致命臨事而懼文不可匿武不可黷文武孔純荷天子祿見藝文類聚六十御覽三百四十六刀陰銘溫溫穆穆配天之威苗裔無強福報永綏見藝文類聚六十御覽三百四十六杖銘杖莫如信行莫如仁惠而無實怨及爾身趙武之珍子罕之寶二子之迹蓋近于道見藝文類聚六十九車銘乘車必護輪治國必愛民車無輪安處國無民誰與見藝文類聚七十一初學記二十五席前右銘修爾容貌飾爾衣服文之以辭實之以德見初學記二十五席後右銘冠帶之張從容有常威儀之華惟德之英見初學記二十五杯銘樂則思舊燕則思歡民之失德乾餱以愆見藝文類聚七十三御覽七百五十九爵銘福如江海壽配列真見文選魏都賦景福殿賦注江賦注銘元正上日百福孔靈見初學記四
