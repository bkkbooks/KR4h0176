body:
  text: 吳漢奏劾朱祐秦豐狡猾連年固守陛下親踰山川遠至黎丘開日月之信而豐悖逆天下所聞當伏誅滅以謝百姓祐不即斬截以示四方而廢詔命聽受豐降無將帥之任大不敬見袁宏後漢紀四建武四年令軍中賊衆雖多皆劫掠群盜勝不相讓敗不相救非有仗節死義者也今日封侯之秋諸君勉之見後漢吳漢傳說陳康蓋聞上智不處危以僥幸中智能因危以為功下愚安于危以自亡危亡之至在人所由不可不察今京師敗亂四方雲擾公所聞也蕭王兵強士附河北歸命公所見也謝躬內背蕭王外失衆心公所知也今公據孤危之城待滅亡之禍義無所立節無所成不若開門內軍轉禍為福免下愚之敗收中智之功此智之至者也見後漢吳漢傳上書自陳臣本諸生遭遇受命之會充備行伍過蒙恩私位大將爵通侯受任方面以立微功皆自國家謀慮愚臣無所能及臣伏自思惟以詔敕戰攻每輒如意時以私心斷決未嘗不有悔國家獨見之明久而益遠乃知性與天道不可得而聞也當兵革始起擾攘之時豪桀競逐迷惑于數臣以遭遇託身聖明在傾危溷殽之中尚不敢過差而況天下平定上尊下卑而臣爵位所蒙巍巍不測乎誠冀以謹敕遂自終始見所示臣章戰栗怖懼伏念明主知臣愚性固敢因緣自陳見後漢馮異傳又見袁宏後漢紀五有刪節又有小異遺李軼書愚聞明鏡所以照形往事所以知今昔微子去殷而入周項伯畔楚而歸漢周勃迎代王而黜少帝霍光尊孝宣而廢昌邑彼皆畏天知命重祖宗而憂萬民覩存亡之符效見廢興之必然故能成功于一時垂業于萬世也苟令長安尚可扶助延期歲月疏不閒親遠不踰近季文豈能居一隅哉今長安壞亂赤眉臨郊王侯搆難大臣乖離綱紀已絶四方分崩異姓竝起此劉氏之憂也是故蕭王跋涉霜雪躬當矢石經營河北方今英俊雲集百姓風靡雖邠岐慕周不足以喻今馬子張皆復親幸爵位如此謝躬違戾伏辜如彼又明效也季文誠能覺悟成敗亟定大計論功古人轉禍為福在此時矣如猛將長驅嚴兵圍城雖有悔恨亦無及已見袁宏後漢紀三又見後漢馮異傳各有刪節討王郎檄大司馬劉公將城頭子路刁子都兵百萬衆從東方來擊諸反虜見後漢任光傳下主簿鍾離意教龍丘先生清過夷齊志慕原憲都尉灑掃其門猶懼辱之何召之有見御覽五百二引謝承後漢書上疏辭誡輕敵臣幸得受干戈誅逆虜奉職未稱久留天誅常恐污辱名號不及等倫天下平定已後曾無尺寸可數不得預竹帛之編明詔深閔警戒備具每事奉循詔命必不敢為國之憂也見後漢蓋延傳帝以延輕敵湥入數以書誡之注引東觀記延上疏辭報父弟妻子事君者不得顧家彤親屬所以至今得安于信都者劉公之恩也公方爭國事彤不得復念私也見後漢邳彤傳上書自陳前在東郡案誅涿郡太守朱英親屬今國屬涿誠不自安見後漢耿純傳注引續漢書報真定王劉揚書奉使見王侯牧守不得先詣如欲面會宜出傳舍見後漢耿純傳與馬武上書請滅胸奴胸奴貪利無有禮信窮則稽首安則侵盜緣邊被其毒痛內國憂其抵突虜今人畜疫死旱蝗赤地疫困之力不當中國一郡萬里死命縣在陛下福不再來時或易失豈宜固守文德而墮武事乎今命將臨塞厚縣購賞喻告高句驪烏桓鮮卑攻其左發河西四郡天水隴西羌胡擊其右如此北虜之滅不過數年臣恐陛下仁恩不忍謀臣狐疑令萬世刻石之功不立于聖世見後漢臧宮傳說寇恂上新即位四方未定而君侯以此時據大郡內得人心外破蘇茂威震鄰敵功名發聞此讒人側目怨禍之時也昔蕭何守關中悟鮑生之言而高祖悅今君所將皆宗族昆弟也無乃當以前人為鏡戒見後漢寇恂傳又見袁宏後漢紀三有小異奏薦馬援隴西侵殘非馬援莫能定見後漢馬援傳上書言隴右事隗囂既死西州未平公孫述以隴西天水為蕃蔽故得延其軀命如二郡既平則述計窮矣昔趙以賈人為將高祖懸以重賞今隴右新破百姓饑饉可以利動時也宜益資軍實以誘未附今誠知國用未足民勞于內然天下未定不得休息見袁宏後漢紀六來歙說上又見後漢來歙傳歙因上書無首二語文亦小異公孫述以隴西天水為藩蔽故得延命假息今二郡平蕩則述智計窮矣宜益選兵馬儲積資糧昔趙之將帥多賈人高帝懸之以重賞今西州新破兵人疲饉若招以財穀則其衆可集臣知國家所給非一用度不足然有不得已也見後漢來歙傳被刺自書遺表臣夜入定後為何人所賊傷中臣要害臣不敢自惜誠恨奉職不稱以為朝廷羞夫理國以得賢為本太中大夫段襄骨鯁可任願陛下裁察又臣兄弟不肖終恐被罪陛下哀憐數賜教督見後漢來歙傳廢太子議經說年未滿十五過惡不在其身且男吉之謀皇太子容有不知宜選忠良保傅輔以禮義廢置事重此誠聖恩所宜宿留後漢來歷傳奏改諸王為公古者人臣受封不加王爵可改諸王為公見後漢朱祐傳奏三公去大宜令三公竝去大名以法經典同上上疏請徵大兵未會臣不能獨進且臣家屬皆在上谷京師無骨肉之親願得還洛陽見袁宏後漢紀四上書言討張步事狀臣據臨淄深塹高壘張步從劇縣來攻疲勞飢渴欲進誘而攻之欲去隨而擊之臣依營而戰精鋭百倍以逸待勞以實擊虛旨日之閒步首可獲見後漢耿弇傳注引袁嵩書與兄弇書前舒上書當先擊充糧雖難運而兵馬得用軍人數萬爭欲先奮今壺頭竟不得進大衆怫鬱行死誠可痛惜前到臨鄉賊無故自致若夜擊之即可殄滅伏波類西域賈胡到一處輒止以是失利今果疾疫皆如舒言見後漢馬援傳南胸奴稱藩議臣以為宜如孝宣故事受之令東扞鮮卑北拒胸奴率厲四夷完復邊郡使塞下無晏開之警萬世有安寧之策也見後漢耿弇附傳上書言胸奴事中國虛費邊陲不寧其患專在胸奴以戰去戰可也故君不可以怒而興師將不可以慍而合戰破之以仁義為國之寶矣見袁宏後漢紀十上言宜許南單于出兵昔武帝單極天下欲臣虜胸奴未遇天時事遂無成宣帝之世會呼韓來降故邊人獲安中外為一生人休息六十餘年及王莽篡位變更其號耗擾不止單于乃畔光武帝命復懷納之緣邊壞郡得以還復烏桓鮮卑咸脅歸義威鎮四夷其效如此今幸遭天授北虜分爭以夷伐夷國家之利宜可聽許見後漢南胸奴傳兵事議孝武時始事胸奴胸奴援引弓之類并左衽之屬故不可得而制也漢既得河西四郡及居延朔方徙民以充之根據未堅胸奴猶出為寇其後羌胡分離四郡堅固居延朔方不可傾拔虜遂失其肥饒畜兵之地惟有西域俄復內屬呼韓邪單于請款塞是故其勢易乘也今有南單于形勢相似然西域尚未內屬北虜未有亹作臣愚以為當先擊白山得伊吾破車師通使烏孫諸國以斷其右臂未可先擊胸奴也伊吾亦有胸奴南呼衍一部破此復為折其左角觀往者漢兵出胸奴輒為亂五單于爭未必不以五將出之故也今可先擊白山以觀其變擊胸奴未晚也見袁宏後漢紀十上言鎮撫西羌事故安豐侯竇融昔在西州甚得羌胡腹心今大鴻臚固即其子孫前擊白山功冠三軍宜奉大使鎮撫涼部令車騎將軍防屯軍漢陽以為威重見後漢耿弇附傳初恭出隴西上言上疏乞援師昔楚宋列國俱為諸侯莊王以宋執其使遂有投袂之師魏公子顧朋友之要觸冒強秦之鋒夫楚魏非有分職匡正之大義也莊王但為爭強而發忿公子以一言而立信耳今彭寵反叛張豐逆節以為陛下必棄捐它事以時滅之既歷時月寂寞無音從圍城而不救放逆虜而不討臣誠惑之昔高祖聖武天下既定猶身自征伐未嘗寧居陛下雖興大業海內未集而獨逸豫不顧北垂百姓遑遑無所繫心三河冀州曷足以傳後哉今秋稼已熟復為漁陽所掠張豐狂悖姦黨日增連年拒守吏士疲勞甲胄生蟣蝨弓弩不得弛上下燋心相望救護仰希陛下生活之恩見後漢朱浮傳因日食上疏言牧守換易宜𥳑臣聞日者衆陽之所宗君上之位也凡居官治民據郡典縣皆為陽為上為尊為長若陽上不明尊長不足則干動三光垂示王者五典紀國家之政鴻範別災異之文皆宣明天道以徵來事者也陛下哀愍海內新離禍毒保宥生人使得蘇息而今牧人之吏多未稱職小違理實輒見斥罷豈不粲然黑白分明哉然以堯舜之盛猶加三考大漢之興亦纍功效吏皆積久養老于官至名子孫因為氏姓當時吏職何能悉理論議之徒豈不喧譁蓋以為天地之功不可倉卒艱難之業當纍日月而閒者守宰數見換易迎新相代疲勞道路尋其視事日淺未足昭見其職既加嚴切人不自保各相顧望無自安之心有司或因睚眥以騁私怨苟求長短求媚上意二千石及長吏迫于舉劾懼于刺譏故爭飾詐僞以希虛譽斯皆群陽騷動日月失行之應夫物暴長者必夭折功卒成者必亟壞如摧長久之業而造速成之功非陛下之福也天下非一時之用也海內非一旦之功也願陛下游意于經年之外望化于一世之後天下幸甚見後漢朱浮傳上疏言州牧劾奏宜下三府覆案陛下清明履約率禮無違自宗室諸王外家后親皆奉遵繩墨無黨藝之名至或乘牛車齊于編人斯固法令整齊下無作威者也求之于事宜以和平而災異尤見者而豈徒然天道信誠不可不察竊見陛下疾往者上威不行下專國命即位以來不用舊典信刺舉之官黜鼎輔之任至于有所劾奏便加退免覆案不關三府罪譴不蒙澄察陛下以使者為腹心而使者以從事為耳目是為尚書之平決于百石之吏故群下苛刻各自為能兼以私情容長憎愛在職皆競張空虛以要時利故有罪者心不厭服無咎者坐被空文不可經盛衰貽後王也夫事積久則吏自重吏安則人自靜傳曰五年再閏天道乃備夫以天地之靈猶五載以成其化況人道哉臣浮愚戇不勝惓惓願陛下留心千里之任省察偏言之奏見後漢朱浮傳上書請廣選博士夫太學者禮義之宮教化所由興也陛下尊敬先聖垂意古典宮室未飾干戈未休而先建太學造立橫舍比日車駕親臨觀饗將以弘時雍之化顯勉進之功也尋博士之官為天下宗師使孔聖之言傳而不絶舊事策試博士必廣求詳選爰自畿夏延及四方是以博舉明經唯賢是登學者精勵遠近同慕伏聞詔書更試五人唯取見在洛陽城者臣恐自今以往將有所失求之密邇容或未盡而四方之學無所勸樂凡策試之本貴得其真非有期會不及遠方也又諸所徵試皆私自發遣非有傷費煩擾于事也語曰中國失禮求之于野臣浮幸得與講圖讖故敢越職見後漢朱浮傳上言織綬成詔書曰百官皆帶王莽時綬又不齊因前袁安故綬工李涉等六家所織綬不能具丙丁文能如組狀募能為丙丁文謹圖一綬丙丁制度賜縑五十四今王莽時六安都尉留應募能為丙丁文謹處武庫給食留晝夜思念諷誦狂癡三十日病愈今又以成請賜縑五十匹見御覽六百八十二引博物志奏更乘輿綬車府丞橫受詔乘輿綬五采何黃多也可更用赤絲為地見初學記二十六引漢名臣奏與彭寵書蓋聞智者順時而謀愚者逆理而動常竊悲京城太叔以不知足而無賢輔卒自棄于鄭也伯通以名字典郡有佐命之功臨人親職愛惜倉庫而浮秉征伐之任欲權時救急二者皆為國耳即疑浮相譖何不詣闕自陳而為族滅之計乎朝廷之于伯通恩亦厚矣委以大郡任以威武事有柱石之寄情同子孫之親匹夫媵母尚能致命一餐豈有身帶三綬職典大邦而不顧恩義生心外畔者乎伯通與吏民語何以為顏行步拜起何以為容坐臥念之何以為心引鏡窺影何以施眉目舉措建功何以為人惜乎棄休令之嘉名造梟之逆謀捐傳世之慶祚招破敗之重災高論堯舜之道不忍桀紂之性生為世笑死為愚鬼不亦哀乎伯通與耿俠遊俱起佐命同被國恩俠游謙讓屢有降挹之言而伯通自伐以為功高天下往時遼東有豕生子白頭異而獻之行至河東見群豕皆白懷慚而還若以子之功論于朝廷則為遼東豕也今乃愚妄自比六國六國之時其勢各盛廓土數千里勝兵將百萬故能據國相持多歷年世今天下幾里列郡幾城奈何以區區漁陽而結怨天子此猶河濱之人捧土以塞孟津多見其不知量也方今天下適定海內願安士無賢不肖皆樂立名于世而伯通獨中風狂走自捐盛時內聽驕婦之失計外信讒邪之諛言長為群后惡法永為功臣鑒戒豈不誤哉定海內者無私讎勿以前事自誤願留意顧老母幼弟凡舉事無為親厚者所痛而為見讎者所快見後漢朱浮傳又見藝文類聚二十五使彭寵作記告城門將軍今遣子密等至子后蘭卿所速開門出勿稽留之見後漢書彭寵傳又見御覽五百引東觀漢記
