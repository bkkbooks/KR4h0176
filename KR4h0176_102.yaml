body:
  text: 鄭興說更始西都長安陛下起自荊楚權政未施一朝建號而山西雄桀爭誅王莽開關郊迎者何也此天下同苦王氏虐政而思高祖之舊德也今久不撫之臣恐百姓離心盜賊復起矣春秋書齊小白入齊不稱侯未朝廟故也今議者欲先定赤眉而後入關是不識其本而爭其末恐國家之守轉在函谷雖臥洛陽庸得安枕乎見後漢鄭興傳說隗囂不稱王春秋傳云口不道忠信之言為嚚耳不聽五聲之和為聾閒者諸將集會無乃不道忠信之言大將軍之聽無乃阿而不察乎昔文王承積德之緒加之以睿聖三分天下尚服事殷及武王即位八百諸侯不謀同會皆曰紂可伐矣武王以未知天命還兵待時高祖征伐累年猶以沛公行師今令德雖明世無宗周之祚威略雖振未有高祖之功而欲舉未可之事昭速禍患無乃不可乎惟將軍察之見後漢鄭興傳日食上疏春秋以天反時為災地反物為妖人反德為亂亂則妖災生往年以來讁咎連見意者執事頗有闕焉案春秋昭公十七年夏六月甲戌朔日有食之傳曰日過分而未至三辰有災于是官降物君不舉避移時樂用鼓祝用幣史用辭今孟夏純乾用事陰氣未作其災尤重夫國無善政則讁見日月變咎之來不可不慎其要在因人之心擇人處位也堯知鯀不可用而用之者屈己之明因人之心也齊桓反政而相管仲晉文歸國而任郄縠者是不私其私擇人處位也今公卿大夫多舉漁陽太守郭伋可大司空者而不以時定道路流言咸曰朝廷欲用功臣功臣用則人位謬矣願陛下上師唐虞下覽齊晉以成屈己從眾之德以濟群臣讓善之功夫日月交會數應在朔而頃年日食每多在晦先時而合皆月行疾也日君象而月臣象君亢急則臣下促迫故行疾也今年正月繁霜自爾以來率多寒日此亦急咎之罰天于賢聖之君猶慈父之于孝子也丁寍申戒欲其反政故災變仍見此乃國之福也今陛下高明而群臣惶促宜留思柔剋之政垂意洪範之法博採廣謀納群下之策見後漢鄭興傳臣聞國無政不用善則取謫于日月之災故政不可不慎也其道務三而已一曰擇人二曰因民三曰從時此應變之要也昔在帝堯洪水滔天帝求俾乂嶽曰鯀哉帝知鯀不可然猶屈己之是從嶽之非重違眾也昔齊桓公避亂于莒鮑叔從焉既反國鮑叔舉管仲桓公從之遂立九合之功晉文公奔翟從者五人既得晉國將謀元帥趙衰以郄穀為閱禮樂敦詩書使將中軍而五子下之故能伏彊楚于城濮納天子于王城今兗職有闕朝論輒議功臣功臣用則鮑趙之舉息矣願陛下上師陶唐下覽齊晉以成屈己從眾之德以濟群臣舉善之美臣聞上竭聰明則下懼其罪故日者君象也月者臣象也君威亢急則臣道迫促願陛下留神寬恕以崇柔克之德見袁宏後漢紀六案此與本傳各有刪節上疏請爵耿恭耿恭以單兵固守孤城當匈奴之衝對數萬之眾連月踰年心力困盡鑿山為井煮弩為糧出于萬死無一生之望前後殺傷醜虜數千百計卒全忠勇不為大漢恥恭之節義古今未有宜蒙顯爵以厲將帥見後漢耿恭傳上疏諫遣使報單于臣伏料北單于所欲致漢使者欲以離南單于令西域諸國耳故汲汲以致漢使使既到偃蹇自若臣愚以為于今宜且勿答南單于本來歸義者望呼韓邪之助故歸心不二烏桓慕化並力保蕃今聞北單于不屈漢復通使不止恐南單于必懷疑而烏桓亦有二心單于久居漢地具知形勢萬分離析規為邊害其憂不輕今幸有度遼之眾揚威北垂雖勿答不敢為害臣伏聞北單于所以要致漢使者欲以離南單于之眾堅三十六國之心也又當揚漢和親誇示鄰敵令西域欲歸化者局促狐疑懷土之人絕望中國耳漢使既到便偃蹇自信若復遣之虜必自謂得謀其群臣駮議者不敢復言如是南庭動搖烏桓有離心矣南單于久居漢地具知形勢萬分離析旋為邊害今幸有度遼之眾揚威北垂雖勿報答不敢為患見後漢鄭興附傳上言辭使匈奴臣前奉使不為匈奴拜單于恚恨故遣兵圍臣今復銜命必見陵折臣誠不忍持大漢節對氈裘獨拜如令匈奴遂能服臣將有損大漢之強見後漢鄭眾傳又見袁宏後漢紀九有小異婚禮後漢鄭眾百官六禮辭大略同于周制而納采女家答辭末云奉酒肉若干再拜反命其所稱前人不云吾子皆云君六禮文皆封之先以紙封表又加以皁囊著篋中又以皁衣篋表訖以大囊表之題檢文言謁表某君門下其禮物凡三十種各有謁文外有贊文各一首封如禮文篋表訖蠟封題用皁帔蓋于箱中無囊表便題檢文言謁篋某君門下便書贊文通共在檢上見通典五十八案此約文禮物案以玄纁羊雁清酒白酒粳米稷米蒲葦卷柏嘉禾長命縷膠漆五色絲合歡鈴九子墨金錢祿得香草鳳皇舍利獸鴛鴦受福獸魚鹿烏九子婦陽燧總言物之所象者玄象天纁法地羊者祥也群而不黨雁則隨陽清酒降福白酒歡之由粳米養食稷米粢盛蒲眾多性柔葦柔之久卷柏屈卷附生嘉禾須祿長命縷縫衣延壽膠能合異類漆內外光好五色絲章采屈伸不窮合歡鈴音聲和諧九子墨長生子孫金錢和明不止祿得香草為吉祥鳳凰雌雄伉合儷舍利獸廉而謙鴛鴦飛止須匹鳴則相和受福獸體恭心慈魚處淵無射鹿者祿也烏知反哺孝于父母九子婦有四德陽燧成明安身又有丹為五色之榮青為色首東方始見通典五十八婚禮謁文納采始相與言語采擇可否之時問名謂問女名將歸卜之也納言謂歸卜吉往告之也納徵用束帛徵成也請期請吉日將迎親謂成禮也見蓺文類聚四十婚禮謁文贊雁侯陰陽待時乃舉冬南夏北貴有其所見蓺文類聚九十一秔米馥芬婚禮之珍見蓺文類聚八十五稷為天官見御覽八百四十卷柏藥草附生山顛屈卷成性終無自伸見御覽九百八十九嘉禾為穀班祿是宜吐秀五七乃名為嘉見初學記二十七長命之縷女工所為見御覽八百三十九子之墨藏于松煙本性長生子孫圖邊見初學記二十一御覽六百二金錢為質所歷長久金取和明錢用不止見御覽八百三十六舍利為獸廉而能謙禮義乃食口無譏諐見御覽九百十三雌雄相類飛止相匹見蓺文類聚九十二女貞之樹柯葉冬生寒涼守節險不能傾見蓺文類聚八十九上言宜封禪自古帝王每世之隆未嘗不封禪陛下聖德洋溢順天行誅撥亂中興作民父母修復宗廟救萬姓命黎庶賴福海內清平功成治定群司禮官咸以為宜登封告成為民報德百王所同當仁不讓宜登封岱宗正三雍之禮以明靈契望秩群神以承天心也見續漢祭祀志上注補引東觀書太尉趙熹上言奏上明帝尊號禮祖有功宗有德孝明皇帝功德茂盛宜上尊號曰顯宗四時祫食于世祖廟如孝文皇帝在高廟之禮奏武德文始五行之舞見續漢祭祀志下注補引東觀書刑罰務中疏臣竊見元帝初元五年輕殊刑三十四事哀帝建平元年盡四年輕殊死者刑八十一事其四十二事手殺人者皆減死罪一等著為常法自是以後人輕犯法吏易殺人吏民俱失至于不羈臣愚以為刑罰不苟務輕務其中也君人之道仁義為主仁者愛人義者政理愛人以除殘為務政理以去亂為心是以五帝有流殛放殺之誅三王有大辟刻肌之刑所以為除殘去亂也故孔子稱仁者必有勇又曰理財正辭禁民為非曰義高帝受命誅暴平蕩天下制約令定法律傳之後世誠得其宜可常施行文帝寬惠溫克遭世康平因時施恩省去肉刑除相坐之法他皆率由舊章天下幾致升平武帝值中國隆盛財力有餘出兵命將征伐遠方軍役數興百姓罷弊豪傑犯禁姦吏弄法故設首匿之科著知從之律以破朋黨以懲隱匿宣帝聰明正直履道握要以總御海內臣下奉憲不失繩墨因循先典天下稱理元帝法律少所改更天下稱安至孝成孝哀承平繼體即位日淺聽斷尚寡丞相王嘉等輕為穿鑿猥以數年之閒虧除先帝舊約成律凡百有餘事或不便于理或不厭民心臣謹表取其尤妨政體害善良者傅奏如左伏惟陛下苞五常履九德權時撥亂功逾文武德牟高皇誠宜博施濟時而反因循季世之末節衰微之軌迹誠非所以還初反本據元更始也願陛下回神明察考量得失宣昭有司悉舉初元建平之所穿鑿考其輕重察其化俗足以知政教所處擇其善者而從之其不善者而改之定不易之典施無窮之法天下幸甚見後漢梁統傳晉書刑法志通典一百六十三又袁宏後漢紀六與此小異復上言有司以臣今所言不可施行尋臣之所奏非曰嚴刑竊謂高帝以後至乎孝宣其所施行多合經傳宜比方今事驗之往古聿遵前典事無難改不勝至願願得召見若對尚書近臣口陳其狀見後漢梁統傳又見晉書刑法志對尚書問狀聞聖帝明王制立刑罰故雖堯舜之盛猶誅四凶經曰天討有罪五刑五庸哉又曰爰制百姓于刑之衷孔子曰刑罰不衷則人無所厝手足衷之為言不輕不重之謂也春秋之誅不避親戚所以防患救亂坐安眾庶豈無仁愛之恩貴絕殘賊之路也自高祖之興至于孝宣君明臣忠謀謨深博猶因循舊章不輕改革海內稱理斷獄益少至初元建平所減刑罰百有餘條而盜賊浸多歲以萬數閒者三輔從橫群輩竝起至燔燒茂陵火見未央其後隴西北地西河之賊越州度郡萬里交結攻取庫兵劫略吏人詔書討捕連年不獲是時以天下無難百姓安平而狂狡之勢猶至于此皆刑罰不衷愚人易犯之所致也由此觀之則刑輕之作反生大患惠加姦軌而害及良善也故臣統願陛下采擇賢臣孔光師丹等議見後漢梁統傳議上遂寢不報與杜林書君非隗囂不降志辱身至簪蒿席草不食其粟見文選任昉劉先生夫人墓誌注引東觀漢記上疏爭封石登封之禮告功皇天垂後無窮以為萬民也承天之敬尤宜章明奉圖書之瑞尤宜顯著今因舊封竄寄玉牒故石下恐非重命之義受命中興宜當特異以明天意見續漢祭祀志上又見通典五十四祭泰山議記曰齊將有事泰山先有事配林蓋諸侯之禮也河嶽視公侯王者祭焉宜無即事之漸不祭配林見續漢祭祀志上悼騷賦彼仲尼之佐魯兮先嚴斷而後弘衍雖離讒以鳴邑兮卒暴誅于兩觀殷伊尹之協德兮暨太甲而俱寍豈齊量其幾微兮徒信己以榮名雖吞刀以奉命兮抉目肶于門閭吳荒萌其已殖兮可信顏于王廬圖往鏡來兮闕北在篇君名既泯沒兮後辟亦然屈平濯德兮潔顯芬香句踐罪種兮越嗣不長重耳忽推兮六卿卒強趙隕鳴犢兮秦人入疆樂毅奔趙兮燕亦是喪武安賜命兮昭以不王蒙宗不幸兮長平顛荒范父乞身兮楚項不昌何爾生不先後兮惟洪勳以遐邁服荔裳如朱紱兮騁鸞路于犇瀨歷蒼梧之崇丘兮宗虞氏之俊乂臨眾瀆之神林兮東敕職于蓬碣祖聖道而垂典兮褒忠孝以為珍既匡救而不得兮必殞命而後仁惟賈傅其違指兮何楊生之欺真彼皇麟之高舉兮熙太清之悠悠臨岷川以愴恨兮指丹海以為期見後漢梁竦傳注引東觀記遣從兄䄠奏記三府春秋之義母以子貴漢家舊典崇貴母氏今梁貴人親育聖躬而不蒙尊號求得申議見袁宏後漢紀十四後漢梁松傳招降匈奴表匈奴寇畔自知罪極窮鳥困獸皆知救死況種類繁熾不可單盡今轉運日增三軍疲苦虛內給外非中國之利竊見度遼將軍馬續素有謀謨且典邊日久深曉兵要每得續書與臣策合宜令續深溝高壁以恩信招降宣示購賞明其期約如此則醜類可服國家無事矣見後漢南匈奴傳上書辭增國土祿命過厚受祖考多福又托日月末光以斗筲之材乘君子之器懼有負乘之累不守歷世之榮誠不如舊制與左賢同科見袁宏後漢紀十八陽嘉元年上書讓屯騎校尉臣托椒房被蒙榮寵兼官二職非材所堪受寵戰慄驚懼惶戚不遑寍處披露赤誠敢遂狂狷謹上屯騎校尉印綬見袁宏後漢紀十八上書辭少子不疑為步兵校尉不疑童孺猥處成人之位是以寢不安席食不甘味昔者晏平仲辭鄁殿以守其富公儀休不愛魚食以定其位臣雖不才亦願固福祿于聖世故敢布腹心觸罪歸誠見袁宏後漢紀十九上書猥復起超宿德見文選應璩與曹長思書注引東觀漢記止逮捕張逵獄疏春秋之義功在元帥罪止首惡故賞不僭溢刑不淫濫五帝三王所以同致康乂也竊聞考中常侍張逵等辭語多所牽及大獄一起無辜者眾死囚久繫纖微成大非所以順迎和氣平政成化也宜早訖竟以止逮捕之煩見後漢梁商傳又略見袁宏後漢紀十九移書馬續等中國安寍忘戰日久良騎野合交鋒接矢決勝當時戎狄之所長而中國之所短也強駑乘城堅營固守以待其衰中國之所長而戎狄之所短也宜務先所長以觀其變設購開賞宣示反悔勿貪小功以亂大謀見後漢南匈奴傳病篤敕子冀等吾以不德享受多福生無以輔益朝廷死必耗費帑藏衣衾飯唅玉匣珠貝之屬何益朽骨百僚勞擾紛華道路祗增塵垢雖云禮制亦有權時方今邊境不寍盜賊未息豈宜重為國損氣絕之後載至冢舍即時殯斂斂以時服皆以故衣無更裁制殯已開冢冢開即葬祭食如存無用三牲孝子善述父志不宜違我言也見後漢梁商傳又見袁宏後漢紀十九上書讓步兵校尉列校之職上應天工下厭群望實非愚臣所宣見北堂書鈔六十一引東觀漢記報朱穆書如此僕亦無一可邪見後漢書朱穆傳
