body:
  text: 田邑報馮衍書僕雖駑怯亦欲為人者也豈苟貪生而畏死哉曲戟在頸不易其心誠僕志也閒者老母諸弟見執于軍而邑安然不顧者豈非重其節乎若使人居天地壽如金石要長生而避死可也今百齡之期未有能至老壯之閒相去幾何誠使故朝尚在忠義可立雖老親受戮妻兒橫分邑之願也閒者上黨黠賊大眾圍城義兵兩輩入據井陘邑親潰敵圍拒擊宗正自試智勇非不能當誠知故朝為兵所害新帝司徒已定三輔隴西北地從風響應其事昭昭日月經天河海帶地不足以比死生有命富貴在天天下存亡誠云命也邑雖沒身能如命何夫人道之本有恩有義義有所宜恩有所施君臣大義母子至恩今故主已亡義其誰為老母拘執恩所當留而厲以貪權誘以策馬抑其利心必其不顧何其愚乎邑年三十歷位卿士性少嗜慾情厭事為況今位尊身危財多命殆鄙人知之何疑君子君長敬通揭節垂組自相署立蓋仲由使門人為臣孔子譏其欺天君長據位兩州加以一郡而河東畔國兵不入彘上黨見圍不窺太谷宗正臨境莫之能援兵威屈辱國權日損三王背畔赤眉害主未見兼行倍道之赴若墨翟累繭救宋申包胥重胝存楚衛女馳歸唁兄之志主亡一歲莫知定所虛冀妄言苟肆鄙塞未能事生安能事死未知為臣焉知為主豈厭為臣子思為君父乎欲搖泰山而蕩北海事敗身危要思邑言見後漢馮衍傳勸鮑永書愚聞丈夫不釋故而改圖哲士不徼幸而出危今君長故主敗不能死新帝立不肯降擁眾而據壁欲襲六國之從與邑同事一朝內為刎頸之盟興兵背畔攻取涅城破君長之國壞父母之鄉首難結怨輕弄兇器人心難知何意君長當為此計昔者韓信將兵無敵天下功不世出略不再見威執項羽名出高帝不知天時就烹於漢知伯分國既有三晉欲大無已身死地分頭為飲器君長銜命出征擁帶徒士上黨厄不能救河東畔不能取朝有顛沛之憂國有分崩之禍上無仇牧之節下無不占之志天之所壞人不能支君長將兵不與韓信同日而論威行得眾不及智伯萬分之半不見天時不知厭足欲明人臣之義當先知故主之未然欲貪天下之利宜及新主之未為今故主已敗新主既成四海為羅網天下為敵人舉足遇害動搖觸患履深淵之薄冰不為啼涉千鈞之發機不知懼何如其知也絕鮑氏之姓廢子都之業誦堯之言服桀之行悲夫命也張舒內行邪孽不遵孝友疏其父族外附妻黨已收三族將行其法能逃不自詣者舒也能夷舒宗者予也見後漢馮衍傳注引東觀記說隗囂昔更始西都四方響應天下喁喁謂之太平一旦敗壞大王幾無所厝今南有子陽北有文伯江湖海岱王公十數而欲牽儒生之說棄千乘之基羈旅危國以求萬全此循覆車之軌計之不可者也今天水完富士馬最彊北收西河上郡東收三輔之地案秦舊迹表裏山河元請以一丸泥為大王東封函谷關此萬世一時也若計不及此且畜養士馬據隘自守曠日持久以待四方之變圖王不成其弊猶足以霸要之魚不可脫于淵神龍失勢即還與蚯蚓同見後漢隗囂傳又見袁宏後漢紀以前半篇為後半其文亦小異諫隗囂謀殺來歙愚聞為國者慎器與名為家者畏怨重禍俱慎名器則下服其命輕用怨禍則家受其殃今將軍遣子質漢內懷它志名器逆矣外人有議欲謀漢使輕怨禍矣古者列國兵交使在其閒所以重兵貴和而不任戰也春秋傳曰交兵通使可也何況承王命藉重質而犯之哉上不合于正義內不周于長利苟行盜賊之短策又何是非之能識加以伯春委身已在闕庭而屠漢使此踐機試劍授刃于頸也君叔雖單車遠使而陛下之外兄也害之無損于漢而隨以族滅昔宋執楚使遂有析骸易子之禍小國猶不可辱況于萬乘之主重以伯春之命哉見袁宏後漢紀五後漢來歙傳喻牛邯書遵與隗王歃盟為漢自經歷虎口踐履死地已十數矣于時周洛以西無所統壹故為王策欲東收關中北取上郡進以奉天人之用退以懲外夷之亂數年之閒冀聖漢復存當挈河隴奉舊都以歸本朝生民以來臣人之勢未有便于此時者也而王之將吏群居穴處之徒人人扺掌欲為不善之計遵與孺卿日夜所爭害幾及身者豈一事哉前計抑絕後策不從所以吟嘯扼腕垂涕登車幸蒙封拜得延論議每及西州之事未嘗敢忘孺卿之言今車駕大眾已在道路吳耿驍將雲集四境而孺卿以奔離之卒拒要阸當軍衝視其形勢何如哉夫智者覩危思變賢者泥而不滓是以功名終申策畫復得故夷吾束縛而相齊黥布杖劍以歸漢去愚就義功名竝著今孺卿當成敗之際遇嚴兵之鋒可為怖慄宜斷之心胸參之有識見後漢隗囂傳覽海賦余有事于淮浦覽滄海之茫茫悟仲尼之乘桴聊從容而遂行馳鴻瀨以漂騖翼飛風而迴翔顧百川之分流煥爛熳以成章風波薄其邈浩浩以湯湯指日月以為表索方瀛與壼梁曜金璆以為闕次玉石而為堂蓂芝列于階路涌醴漸于中唐朱紫彩爛明珠夜光松喬坐于東序王母處于西箱命韓眾與岐伯講神篇而校靈章願結旅而自託因離世而高遊騁飛龍之驂駕歷八極而迴周遂竦節而響應勿輕舉以神浮遵霓霧之掩蕩登雲塗以淩厲乘虛風而體景超太清以增逝麾天閽以啟路闢閶闔而望余通王謁于紫宮拜太一而受符見蓺文類聚八北征賦余遭世之顛覆兮罹填塞之阨災舊室滅以丘墟兮曾不得乎少留遂奮袂以北征兮超絕迹而遠遊朝發軔于長都兮夕宿瓠谷之玄宮歷雲門而反顧望通天之崇崇乘陵崗以登降息郇邠之邑鄉慕公劉之遺德及行葦之不傷彼何生之優渥我獨罹此百殃故時會之變化兮非天命之靡常登赤須之長坂入義渠之舊城忿戎王之淫狡穢宣后之失貞嘉秦昭之討賊赫斯怒以北征紛吾去此舊都兮騑遲遲以歷茲遂舒節以遠逝兮指安定以為期涉長路之緜緜兮遠紆回以樛流過泥陽而太息兮悲祖廟之不脩釋余馬于彭陽兮且弭節而自思日晻晻其將暮兮覩牛羊之下來寤曠怨之傷情兮哀詩人之歎時越安定以容與兮遵長城之漫漫劇蒙公之疲民兮為強秦乎築怨舍高亥之切憂兮事蠻狄之遼患不耀德以綏遠兮顧厚固而繕藩首身分而不寤兮猶數功而辭諐何夫子之妄說兮孰云地脈而生殘登鄣隧而遙望兮聊須臾以婆娑閔獯鬻之猾夏兮弔尉卭于朝那從聖文之克讓兮不勞師而幣加惠父兄于南越兮黜帝號于尉佗降几杖于藩國兮折吳濞之逆邪惟太宗之蕩蕩兮豈曩秦之所圖隮高平而周覽望山谷之嵯峨野蕭條以莽蕩迴千里而無家風猋發以漂遙兮谷水灌以揚波飛雲霧之杳杳涉積雪之皚皚雁邕邕以群翔兮鵾鷄鳴以嚌嚌遊子悲其故鄉心愴愴以傷懷撫長劍而慨息泣漣落而霑衣攬余涕以於邑兮哀生民之多故夫何陰曀之不陽兮嗟久失其平度諒時運之所為兮永伊鬱其誰愬亂曰夫子固窮遊藝文兮樂以忘憂惟聖賢兮達人從事有儀則兮行止屈申與時息兮君子履信無不居兮雖之蠻貊何憂懼兮見文選蓺文類聚二十七冀州賦夫何事于冀州聊託公以遊居歷九土而觀風亦悊人之所虞遂發軫于京洛臨孟津而北厲想尚甫之威虞號蒼兕而明誓既中流而歎息美周武之知性謀人神以動作享烏魚之瑞命贍淇澳之園林善綠竹之猗猗望常山之峨峨登北嶽而高遊嘉孝武之乾乾親飾躬于伯姬建封禪于岱宗瘞玄玉于此丘徧五嶽與四瀆觀滄海以周流鄙臣恨不及事陪後乘之下僚今匹馬之獨征豈斯樂之足娛且休精于敝邑聊卒歲以須臾見蓺文類聚六又二十八初學記八漱余馬乎洹泉嗟西伯于牖城見續漢郡國志一注感鳧藻以進樂兮見文選顏延之秋胡詩注過蕩陰而弔晉鄙責公子之不臣見水經蕩水注悼離騷夫華植之有零茂故陰陽之度也聖哲之有窮達亦命之故也惟達人進止得時行以遂伸否則詘而坼蠖體龍虵以幽潛見蓺文類聚五十八復護羌校尉疏今涼州部皆有降羌羌胡被髮左袵而與漢人雜處習俗既異言語不通數為小吏黠人所見侵奪窮恚無聊故致反叛夫蠻夷寇亂皆為此也舊制益州部置蠻夷騎都尉幽州部置領烏桓校尉涼州部置護羌校尉皆持節領護理其怨結歲時循行問所疾苦又數遣使驛通動靜使塞外羌夷為吏耳目州郡因此可得儆備今宜復如舊以明威防見後漢西羌傳上言宜復置烏桓校尉烏桓天性輕黠好為寇賊若久放縱而無總領者必復侵掠居人但委主降掾史恐非所能制臣愚以為宜復置烏桓校尉誠有益于附集省國家之邊慮見後漢烏桓傳上言選置東宮及諸王國官屬孔子稱性相近習相遠也賈誼以為習與善人居不能無為善猶生長于齊不能無齊言也習與惡人居不能無惡猶生長于楚不能無楚言也是以聖人審所與居而戒慎所習昔成王之為孺子出則周公召公太史佚入則太顛閎夭南宮括散宜生左右前後禮無違者故成王一日即位天下曠然太平是以春秋愛子教以義方不納于邪驕奢淫佚所自邪也詩云貽厥孫謀以宴翼子言武王之謀遺子孫也漢興太宗使鼂錯導太子以法術賈誼教梁王以詩書及至中宗亦令劉向王褎蕭望之周堪之徒以文章儒學保訓東宮以下莫不崇𥳑其人就成德器今皇太子諸王雖結髮學問修習禮樂而傅相未置賢才官屬多闕舊典宜博選名儒有威重明通政事者以為太子太傅東宮及諸王國備置官屬又舊制太子食湯沐十縣設周衛交戟五日一朝因坐東箱省視膳食其非朝日使僕中允旦旦請問而已明不媟黷廣其敬也見後漢班彪傳奏事臣聞師曰太學明堂辟雍者禮樂之府詩書之林見北堂書鈔八十三引班彪奏上事賜竽瑟箜篌見書鈔十九元狩六年罷太尉置司馬時議以北軍中侯有千人司馬故加之大司馬所以別大小司馬之號見御覽二百九可選師傅將相子孫有口行好學者以備縫衣舍人見御覽六百九十官吏二千石布襦羊裘以白木杯飲食飾虛欲以求名于譽見御覽七百五十九吏民葬埋有馬被毛鬣角蹄玫瑰宜皆以法禁之見御覽八百九奏議答北匈奴臣聞孝宣皇帝敕邊守尉曰匈奴大國多變詐交接得其情則卻敵折沖應對入其數則反為輕欺今北奴見南單于來附懼謀其國故數乞和親又遠驅牛馬與漢合市重遣名王多所貢獻斯皆外示富強以相欺誕也臣見其獻益重知其國益虛歸親愈數為懼愈多然今既未獲助南則亦不宜絕北羈縻之義禮無不答謂可頗加賞賜略與所獻相當明加曉告以前世呼韓邪郅支行事報答之辭令必有適今立稾草並上曰單于不忘漢恩追念先祖舊約欲修和親以輔身安國計議甚高為單于嘉之往者匈奴數有乖亂呼韓邪郅支自相讎隙竝蒙孝宣皇帝垂恩救護故各遣侍子稱藩保塞其後郅支忿戾自絕皇澤而呼韓附親忠孝彌著及漢滅郅支遂保國傳嗣子孫相繼今南單于攜眾向南款塞歸命自以呼韓嫡長次第當立而侵奪失職猜疑相背數請兵將歸埽北庭策謀紛紜無所不至惟念斯言不可獨聽又以北單于比年貢獻欲修和親故拒而未許將以成單于忠孝之義漢秉威信總率萬國日月所照皆為臣妾殊俗百蠻義無親疏服順者褒賞畔逆者誅罰善惡之效呼韓郅支是也今單于欲修和親款誠已達何嫌而欲率西域諸國俱來獻見西域國屬匈奴與屬漢何異單于數連兵亂國內虛耗貢物裁以通禮何必獻馬裘今齎雜繒五百匹弓鞬韇丸一矢四發遣遺單于又賜獻馬左骨都侯右谷蠡王雜繒各四百匹斬馬劍各一單于前言先帝時所賜呼韓邪竽瑟空侯皆敗願復裁賜念單于國尚未安方厲武節以戰攻為務竽瑟之用不如良弓利劍故未以齎朕不愛小物于單于便宜所欲遣驛以聞見後漢南匈奴傳與京兆丞郭季通書劉孟公藏器于身用心篤固實瑚槤之器宗廟之寶也見後漢蘇竟傳注引三輔決錄注與金昭卿書遠在東垂吏道迫促見文選張華答何劭詩注王命論昔在帝堯之禪曰咨爾舜天之厤數在爾躬舜亦以命禹臮于稷契咸佐唐虞光濟四海奕世載德至于湯武而有天下雖其遭遇異時禪代不同至于應天順民其揆一也是故劉氏承堯之祚氏族之世著乎春秋唐據火德而漢紹之始起沛澤則神母夜號以章赤帝之符由是言之帝王之祚必有明聖顯懿之德豐功厚利積絫之業然後精誠通於神明流澤加于生民故能為鬼神所福饗天下所歸往未見運世無本功德不紀而得倔起在此位者也世俗見高祖興于布衣不達其故以為適遭暴亂得奮其劍游說之士至比天下于逐鹿幸捷而得之不知神器有命不可以智力求也悲夫此世所以多亂臣賊子者也若然者豈徒闇于天道哉又不覩之于人事矣夫餓饉流隸飢寒道路思有裋褐之襲儋石之畜所願不過一金然終于轉死溝壑何則貧窮亦有命也況虖天子之貴四海之富神明之祚可得而妄處哉故雖遭罹阸會竊其權柄勇如信布彊如梁籍成如王莽然卒潤鑊伏質亨醢分裂又況么䯢尚不及數子而欲闇奸天位者虖是故駑蹇之乘不聘千里之塗燕雀之疇不奮六翮之用楶梲之材不荷棟梁之任斗筲之子不秉帝王之重易曰鼎折足覆公餗不勝其任也當秦之末豪桀共推陳嬰而王之嬰母止之曰自吾為子家婦而世貧賤卒富貴不祥不如以兵屬人事成少受其利不成禍有所歸嬰從其言而陳氏以寧王陵之母亦見項氏之必亡而劉氏之將興也是時陵為漢將而母獲于楚有漢使來陵母見之謂曰願告吾子漢王長者必得天下子謹事之無有二心遂對漢使伏劍而死以固勉陵其後果定于漢陵為宰相封侯夫以匹婦之明猶能推事理之致探禍福之機而全宗祀于無窮垂策書于春秋而況大丈夫之事虖是故窮達有命吉凶由人嬰母知廢陵母知興審此四者帝王之分決矣蓋在高祖其興也有五一曰帝堯之苗裔二曰體貌多奇異三曰神武有徵應四曰寬明而仁恕五曰知人善任使加之以信誠好謀達于聽受見善如不及用人如由己從諫如順流趣時如嚮赴當食吐哺納子房之策拔足揮洗揖酈生之說寤戍卒之言斷懷土之情高四皓之名割肌膚之愛舉韓信于行陳收陳平于亡命英雄陳力群策畢舉此高祖之大略所以成帝業也若乃靈瑞符應又可略聞矣初劉媼妊高祖而夢與神遇震電晦冥有龍蛇之怪及其長而多靈有異于眾是以王武感物而折券呂公覩形而進女秦皇東游以厭其氣呂后望雲而知所處始受命則白蛇分西入關則五星聚故淮陰留侯謂之天授非人力也歷古今之得失驗行事之成敗稽帝王之世運攷五者之所謂取舍不厭斯位符瑞不同斯度而苟昧于權利越次妄據外不量力內不知命則必喪保家之主失天年之壽遇折足之凶伏鈇鉞之誅英雄誠知覺寤畏若禍戒超然遠覽淵然深識收陵嬰之明分絕信布之覬覦距逐鹿之瞽說審神器之有授毋貪不可幾為二母之所笑則福祚流于子孫天祿其永終矣見漢書敘傳上文選蓺文類聚十史記論唐虞三代詩書所及世有史官以司典籍暨于諸侯國自有史故孟子曰楚之檮杌晉之乘魯之春秋其事一也定哀之閒魯君子左丘明論集其文作左氏傳三十篇又撰異同號曰國語二十篇由是乘檮杌之事遂闇而左氏國語獨章又有記錄黃帝以來至春秋時帝王公侯卿大夫號曰世本一十五篇春秋之後七國竝爭秦并諸侯則有戰國策三十三篇漢興定天下太中大夫陸賈記錄時功作楚漢春秋九篇孝武之世太史令司馬遷採左氏國語刪世本戰國策據楚漢列國時事上自黃帝下訖獲麟作本紀世家列傳書表凡百三十篇而十篇缺焉遷之所記從漢元至武則以絕其功也至于採經摭傳分散百家之事甚多疏略不如其本務欲以多聞廣載為功論議淺而不篤其論術學則崇黃老而薄五經序貨殖則輕仁義而羞貧窮道游俠則賤守節而貴俗功此其大敝傷道所以遇極刑之咎也然善述序事理辯而不華質而不野文質相稱蓋良史之才也誠令遷依五經之法言同聖人之是非意亦庶幾矣夫百家之書猶可法也若左氏國語世本戰國策楚漢春秋太史公書今之所以知古後之所由觀前聖人之耳目也司馬遷序帝王則曰本紀公侯傳國則曰世家卿士特起則曰列傳又進項羽陳涉而黜淮南衡山細意委曲條例不經若遷之著作採獲古今貫穿經傳至廣博也一人之精文重思煩故其書刊落不盡尚有盈辭多不齊一若序司馬相如舉郡縣著其字至蕭曹陳平之屬及董仲舒竝時之人不記其字或縣而不郡者蓋不暇也今此後篇慎覈其事整齊其文不為世家唯紀傳而已傳曰殺史見極平易正直春秋之義也見後漢班彪傳又見袁宏後漢紀十三有刪節
