body:
  text: 班固終南山賦伊彼終南巋𡽱嶙囷概青宮觸紫辰嶔崟鬱律萃于霞氛曖㬣暗藹若鬼若神傍吐飛瀨上挺修竹玄泉落落密蔭沈沈榮期綺季此焉恬心三春之季孟夏之初天氣肅清周覽八隅皇鸞鸑鷟警乃前驅爾其珍怪碧玉挺其阿蜜房溜其巔翔鳳哀鳴集其上清水泌流注其前彭祖宅以蟬蛻安期饗以延年唯至德之為美我皇應福以來臻掃神壇以告誠薦珍馨以祈仙嗟茲介福永鍾億萬年見初學記五流澤遂而成水停積結而為山見文選魏都賦注又天台山賦注固仙靈之所遊集見文選頭陀寺碑注覽海賦運之修短不豫期也見文選潘嶽西征賦注兩都賦序或曰賦者古詩之流也昔成康沒而頌聲寢王澤竭而詩不作大漢初定日不暇給至于武宣之世乃崇禮官考文章內設金馬石渠之署外興樂府協律之事以興廢繼絶潤色鴻業是以衆庶悅豫福應尤盛白麟赤雁芝房寶鼎之歌荐于郊廟神雀五鳳甘露黃龍之瑞以為年紀故言語侍從之臣若司馬相如虞丘壽王東方朔枚皋王褒劉向之屬朝夕論思日月獻納而公卿大臣御史大夫兒寬太常孔臧太中大夫董仲舒宗正劉德太子太傅蕭望之等時時間作或以抒下情而通諷諭或以宣上德而盡忠孝雍容揄揚著于後嗣抑亦雅頌之亞也故孝成之世論而録之蓋奏御者千有餘篇而後大漢之文章炳焉與三代同風且夫道有夷隆學有粗密因時而建德者不以遠近易則故皋陶歌虞奚斯頌魯同見采于孔氏列于詩書其義一也稽之上古則如彼考之漢室又如此斯事雖細然先臣之舊式國家之遺美不可闕也臣竊見海內清平朝廷無事京師修宮室浚城隍起苑囿以備制度西土耆老咸懷怨思冀上之眷顧而盛稱長安舊制有陋雒邑之議故臣作兩都賦以極衆人之所眩曜折以今之法度其詞曰西都賦有西都賓問于東都主人曰蓋聞皇漢之初經營也嘗有意乎都河洛矣輟而弗康實用西遷作我上都主人聞其故而睹其制乎主人曰未也願賓攄懷舊之蓄念發思古之幽情博我以皇道弘我以漢京賓曰唯唯漢之西都在于雍州實曰長安左據函谷二崤之阻表以太華終南之山右界褒斜隴首之險帶以洪河涇渭之川衆流之隈汧涌其西華實之毛則九州之上腴焉防御之阻則天地之隩區焉是故橫被六合三成帝畿周以龍興秦以虎視及至大漢受命而都之也仰悟東井之精俯協河圖之靈奉春建策留侯演成天人合應以發皇明乃眷西顧實惟作京于是睎秦嶺睋北阜挾灃灞據龍首圖皇基于億載度宏規而大起肇自高而終平世增飾以崇麗歷十二之延祚故窮泰而極侈建金城而萬雉呀周池而成淵披三條之廣路立十二之通門內則街衢洞達閭閻且千九市開場貨別隧分人不得顧車不得旋闐城溢郭旁流百廛紅塵四合煙雲相連于是既庶且富娛樂無疆都人士女殊異乎五方遊士擬于公侯列肆侈于姬薑鄉曲豪舉遊俠之雄節慕原嘗名亞春陵連交合衆騁騖乎其中若乃觀其四郊浮遊近縣則南望杜霸北眺五陵名都對郭邑居相承英俊之域紱冕所興冠蓋如雲七相五公與乎州郡之豪傑五都之貨殖三選七遷充奉陵邑蓋以強幹弱枝隆上都而觀萬國也封畿之內厥土千里逴躒諸夏兼其所有其陽則崇山隱天幽林穹谷陸海珍藏藍田美玉商洛緣其隈鄠杜濱其足源泉灌注陂池交屬竹林果園芳草甘木郊野之富號為近蜀其陰則冠以九嵕陪以甘泉乃有靈宮起乎其中秦漢之所極觀淵雲之所頌嘆于是乎存焉下有鄭白之沃衣食之源提封五萬疆場綺分溝塍刻鏤原隰龍鱗決渠降雨荷臿成雲五穀垂穎桑麻鋪棻東郊則有通溝大漕潰渭洞河泛舟山東控引淮湖與海通波西郊則有上囿禁苑林麓藪澤陂池連乎蜀漢繚以周牆四百餘里離宮別館三十六所神池靈沼往往而在其中乃有九真之麟大宛之馬黃支之犀條支之鳥踰崑崙越巨海殊方異類至于三萬里其宮室也體象乎天地經緯乎陰陽據坤靈之正位倣太紫之圓方樹中天之華闕豐冠山之朱堂因瓌材而究奇抗應龍之虹梁列棼橑以布翼荷棟桴而高驤雕玉瑱以居楹裁金璧以飾璫發五色之渥彩光爓朗以景彰于是左墄右平重軒三階閨房周通門闥洞開列鐘虛于中庭立金人于端闈仍增崖而衡閾臨峻路而啓扉徇以離宮別寢承以崇臺間館煥若列宿紫宮是環清涼宣溫神仙長年金華玉堂白虎麒麟區宇若茲不可殫論增槃業峨登降照爛殊形詭制每各異觀乘茵步輦惟所息宴後宮則有掖庭椒房后妃之室合歡增城安處常寧茝若椒風披香發越蘭林蕙草鴛鸞飛翔之列昭陽特盛隆乎孝成屋不呈材牆不露形裛以藻繡絡以綸連隨侯明月錯落其間金缸銜璧是為列錢翡翠火齊流耀含英懸黎垂棘夜光在焉于是玄墀扣砌玉階彤庭碝磩綵緻琳珉青熒珊瑚碧樹周阿而生紅羅颯纚綺組繽紛精曜華燭俯仰如神後宮之號十有四位窈窕繁華更盛迭貴處乎斯列者蓋以百數左右庭中朝堂百寮之位蕭曹魏邴謀謨乎其上佐命則垂統輔翼則成化流大漢之愷悌蕩亡秦之毒螫故令斯人揚樂和之聲作畫一之歌功德著乎祖宗膏澤洽乎黎庶又有天祿石渠典籍之府命夫惇誨故老名儒師傅講論乎六藝稽合乎同異又有承明金馬著作之庭大雅宏達于茲為群元元本本殫見洽聞啓發篇章校理祕文周以鉤陳之位衛以嚴更之署總禮官之甲科群百郡之廉孝虎賁贅衣閹尹閽寺陛戟百重各有典司周廬千列徼道綺錯輦路經營修除飛閣自未央而連桂宮北彌明光而亘長樂淩隥道而超西墉掍建章而連外屬設璧門之鳳闕上觚稜而棲金爵內則別風之嶕嶢眇麗巧而聳擢張千門而立萬戶順陰陽以開闔爾乃正殿崔嵬層構厥高臨乎未央經駘蕩而出馺娑洞枍詣以與天梁上反宇以蓋戴激日景而納光神明鬱其特起遂偃蹇而上躋軼云雨於太半虹霓回帶于棼楣雖輕迅與僄狡猶愕眙而不能階攀井幹而未半目眴轉而意迷舍櫺檻而卻倚若顛墜而復稽魂恍恍以失度巡回塗而下低既懲懼于登望降周流以倣徨步甬道以縈紆又杳窱而不見陽排飛闥而上出若遊目于天表似無依而洋洋前唐中而後太液覽滄海之湯湯揚波濤于碣石激神嶽之嶈嶈濫瀛洲與方壺蓬萊起乎中央于是靈草冬榮神木業生巖峻崷崒金石崢嶸抗仙掌以承露擢雙立之金莖軼埃堨之混濁鮮皓氣之清英騁文成之丕誕馳五利之所刑庶松喬之群類時遊從乎斯庭實列仙之攸館非吾人之所寧爾乃盛娛遊之壯觀奮泰武乎上囿因茲以威戎夸狄耀威靈而講武事命荊州使起鳥詔梁野而驅獸毛群內闐飛羽上覆接翼側足集禁林而屯聚水衡虞人修其營表種別群分部曲有署罘網連紘籠山絡野列卒周匝星羅雲布于是乘鑾輿備法駕帥群臣披飛廉入苑門遂繞酆鄗歷上蘭六師發逐百獸駭殫震震爚爚雷奔電激草木塗地山淵反覆蹂躪其十二三乃拗怒而少息爾乃期門佽飛列刃鑽鍭要趹追蹤鳥驚觸絲獸駭值鋒機不虛掎弦不再控矢不單殺中必疊雙猋猋紛紛矰繳相纏風毛雨血灑野蔽天平原赤勇士厲猿狖失木豺狼懾竄爾乃移師趨險並蹈潛穢窮虎奔突狂兕觸蹶許少施巧秦成力折掎僄狡扼猛噬脫角挫脰徒搏獨殺挾師豹拖熊螭曳犀犛頓象羆超洞壑越峻崖蹶嶄巖巨石隤松柏仆叢林摧草木無餘禽獸殄夷于是天子乃登屬玉之館歷長楊之榭覽山川之體勢觀三軍之殺獲原野蕭條目極四裔禽相鎮壓獸相枕藉然後收禽會衆論功賜胙陳輕騎以行炮騰酒車以斟酌割鮮野食舉烽命釂饗賜畢勞逸齊大路鳴鑾容與徘徊集乎豫章之宇臨乎昆明之池左牽牛而右織女似雲漢之無涯茂樹蔭蔚芳草被隄蘭茝發色曄曄猗猗若摛錦布繡燭耀乎其陂鳥則玄鶴白鷺黃鵠鵁鸛鶬鴰鴇鶂鳧鷖鴻雁朝發河海夕宿江漢沈浮往來雲集霧散于是後宮乘輚輅登龍舟張鳳蓋建華旗祛黼帷鏡清流靡微風淡淡浮棹女謳鼓吹震聲激越謍厲天鳥群翔魚窺淵招白鷴下雙鵠揄文竿出比目撫鴻罿御繒繳方舟並騖俯仰極樂遂乃風舉雲搖浮遊溥覽前乘秦嶺后越九嵕東薄河華西涉岐雍宮館所歷百有餘區行所朝夕儲不改供禮上下而接山川究休祐之所用采遊童之歡謠第從臣之嘉頌于斯之時都都相望邑邑相屬國藉十世之基家承百年之業士食舊德之名氏農服先疇之畎畝商修族世之所鬻工用高曾之規矩粲乎隱隱各得其所若臣者徒觀迹于舊墟聞之乎故老十分而未得其一端故不能遍舉也東都賦東都主人喟然而歎曰痛乎風俗之移人也子實秦人矜夸館室保界河山信識昭襄而知始皇矣烏睹大漢之云為乎夫大漢之開元也奮布衣以登皇位由數期而創萬代蓋六籍所不能談前聖靡得言焉當此之時功有橫而當天討有逆而順民故婁敬度勢而獻其説蕭公權宜而拓其制時豈泰而安之哉計不得以已也吾子曾不是睹顧曜後嗣之末造不亦暗乎今將語子以建武之治永平之事監于太清以變子惑志往者王莽作逆漢祚中缺天人致誅六合相滅于時之亂生人幾亡鬼神泯絶壑無完柩郛罔遺室原野厭人之肉川谷流人之血秦項之災猶不克半書契以來未之或紀故下人號而上訴上帝懷而降監乃致命乎聖皇于是聖皇乃握乾符闡坤珍披皇圖稽帝文赫然發憤應若興雲霆擊昆陽憑怒雷震遂超大河跨北嶽立號高邑建都河洛紹百王之荒屯因造化之蕩滌體元立制繼天而作系唐統接漢緒茂育群生恢復疆宇勳兼乎在昔事勤乎三五豈特方軌並迹紛綸后辟治近古之所務蹈一聖之險易云爾哉且夫建武之元天地革命四海之內更造夫婦肇有父子君臣初建人倫實始斯乃伏犧氏之所以基皇德也分州土立市朝作舟輿造器械斯乃軒轅氏之所以開帝功也龔行天罰應天順人斯乃湯武之所以昭王業也遷都改邑有殷宗中興之則焉即土之中有周成隆平之制焉不階尺土一人之柄同符乎高祖克己復禮以奉終始允恭乎孝文憲章稽古封岱勒成儀炳乎世宗案六經而校德眇古昔而論功仁聖之事既該而帝王之道備矣至于永平之際重熙而纍洽盛三雍之上儀修袞龍之法服鋪鴻藻信景鑠揚世廟正雅樂人神之和允洽群臣之序既肅乃動大輅遵皇衢省方巡狩窮覽萬國之有無考聲教之所被散皇明以燭幽然後增周舊修洛邑扇巍巍顯翼翼光漢京于諸夏總八方而為之極是以皇城之內宮室光明闕庭神麗奢不可踰儉不能侈外則因原野以作苑填流泉而為沼發蘋藻以潛魚豐圃草以育獸制同乎梁鄒誼合乎靈囿若乃順時節而搜狩簡車徒以講武則必臨之以王制考之以風雅歷騶虞覽駟鐵嘉車攻采吉日禮官整儀乘輿乃出于是發鯨魚鏗華鐘登玉輅乘時龍鳳蓋棽麗和鑾玲瓏天官景從寢威盛容山靈護野屬御方神雨師泛灑風伯清塵千乘雷起萬騎紛紜元戎竟野戈鋋彗雲羽旄掃霓旌旗拂天焱焱炎炎揚光飛文吐爓生風欱野噴山日月為之奪明丘陵為之搖震遂集乎中囿陳師案屯駢部曲列校隊勒三軍誓將帥然後舉烽伐鼓申令三驅輶車霆激驍騎電騖由基發射范氏施御弦不睼禽轡不詭遇飛者未及翔走者未及去指顧倏忽獲車已實樂不極盤殺不盡物馬踠餘足士怒未泄先驅復路屬車案節于是荐三犧效五牲禮神祇懷百靈覲明堂臨辟雍揚緝熙宣皇風登靈臺考休徵俯仰乎乾坤參象乎聖躬目中夏而布德瞰四裔而抗稜西蕩河源東淡海漘北動幽崖南耀朱垠殊方別區界絶而不鄰自孝武之所不征孝宣之所未臣莫不陸讋水栗奔走而來賓遂綏哀牢開永昌春王三朝會同漢京是日也天子受四海之圖籍膺萬國之貢珍內撫諸夏外綏百蠻爾乃盛禮興樂供帳置乎雲龍之庭陳百寮而贊群后究皇儀而展帝容于是庭實千品旨酒萬鍾列金罍班玉觴嘉珍御太牢饗爾乃食舉雍徹太師奏樂陳金石布絲竹鐘鼓鏗鍧管弦燁煜抗五聲極六律歌九功舞八佾韶武備泰古畢四夷間奏德廣所及僸佅兜離罔不具集萬樂備百禮暨皇歡淶群臣醉降煙熅調元氣然後撞鐘告罷百寮遂退于是聖上親萬方之歡娛又沐浴于膏澤懼其侈心之將萌而怠于東作也乃申舊章下明詔命有司班憲度昭節儉示太素去後宮之麗飾損乘輿之服御抑工商之淫業興農桑之盛務遂令海內棄末而反本背偽而歸真女修織絍男務耕耘器用陶匏服尚素玄恥纖靡而不服賤奇麗而弗珍捐金于山沈珠于淵于是百姓滌瑕蕩穢而鏡至清形神寂漠耳目弗營嗜欲之源滅廉恥之心生莫不優遊而自得玉潤而金聲是以四海之內學校如林庠序盈門獻酬交錯俎豆莘莘下舞上歌蹈德詠仁登降飫宴之禮既畢因相與嗟歎玄德讜言弘説咸含和而吐氣頌曰盛哉乎斯世今論者但知誦虞夏之書詠殷周之詩講羲文之易論孔氏之春秋罕能精古今之清濁究漢德之所由唯子頗識舊典又徒馳騁乎末流溫故知新已難而知德者鮮矣且夫僻界西戎險阻四塞修其防禦孰與處乎土中平夷洞達萬方輻湊秦嶺九嵕涇渭之川曷若四瀆五嶽帶河泝洛圖書之淵建章甘泉館御列仙孰與靈臺明堂統和天人太液昆明鳥獸之囿曷若辟雍海流道德之富遊俠踰侈犯義侵禮孰與同履法度翼翼濟濟也子徒習秦阿房之造天而不知京洛之有制也識函谷之可關而不知王者之無外也主人之辭未終西都賓矍然失容逡巡降階惵然意下捧手欲辭主人曰復位今將授子以五篇之詩賓既卒業乃稱曰美哉乎斯詩義正乎揚雄事實乎相如匪唯主人之好學蓋乃遭遇乎斯時也小子狂簡不知所裁既聞正道請終身而誦之其詩曰明堂詩於昭明堂明堂孔陽聖皇蒞祀穆穆煌煌上帝宴饗五位時序誰其配之世祖光武普天率土各以其職猗歟緝熙允懷多福辟望詩乃流辟雍辟雍湯湯聖皇蒞止造舟為梁皤皤國老乃父乃兄抑抑威儀孝友光明於赫太上示我漢行洪化惟神永觀厥成靈臺詩乃經靈臺靈臺既崇帝勤時登爰考休徵三光宣精五行布序習習祥風祁祁甘雨百穀蓁蓁庶草蕃廡屢惟豐年於皇樂胥寶鼎詩嶽修貢兮川效珍吐金景兮歊浮雲寶鼎見兮色紛縕煥其炳兮被龍文登祖廟兮享聖神昭靈德兮彌億年白雉詩啓靈篇兮披瑞圖獲白雉兮效素烏嘉祥阜兮集皇都發皓羽兮奮翹英容潔朗兮於純精彰皇德兮侔周成永延長兮膺天慶見班固傳文選耿恭守疏勒城賦日兮月兮厄重圍見文選潘嶽關中詩注幽通賦衛靈公太子蒯瞶好帶劍長一丈公諫乃作短劍長一尺公知不可以傳國乃逐之見書鈔一百二十二引班固幽通賦序系高頊之玄胄兮氏中葉之炳靈颻颽風而蟬蛻兮雄朔野以揚聲皇十紀而鴻漸兮有羽儀于上京巨淹天而泯夏兮考遘愍以行謠終保己而貽則兮里上仁之所廬懿前烈之純淑兮窮與達其必濟咨孤蒙之眇眇兮將圮絶而罔階豈余身之足殉兮愇世業之可懷靖潛處以永思兮經日月而彌遠匪黨人之敢拾兮庶斯言之不玷魂煢煢與神交兮精誠發于宵寐夢登山而迥眺兮覿幽人之髣佛攬葛藟而授余兮眷峻谷曰勿墜曶昕寤而仰思兮心矇矇猶未察黃神邈而靡質兮儀遺讖以臆對曰乘高而遌神兮道遐通而不迷葛綿綿于樛木兮詠南風以為綏蓋惴惴之臨深兮乃二雅之所祇既誶爾以吉象兮又申之以炯戒盍孟晉以逮群兮辰條倏忽其不再承靈訓其虛徐兮佇盤桓而且俟惟天地之無窮兮鮮生民之晦在紛屯邅與蹇連兮何艱多而智寡上聖寤而後拔兮豈群黎之所禦昔衛叔之御昆兮昆為寇而喪子管彎弧欲斃讎兮讎作后而成己變化故而相詭兮孰云豫其終始雍造怨而先賞兮丁繇惠而被戮栗取弔于逌吉兮王膺慶于所戚叛回冗其若茲兮北叟頗識其倚伏單治裏而外凋兮張修襮而內逼聿中和為遮幾兮顏與冉又不得溺招路以從已兮謂孔氏猶未可安慆慆而不萉兮卒隕身乎世禍遊聖門而靡救兮雖覆醢其何補固行行其必凶兮免盜亂為賴道形氣發于根柢兮柯葉彙而靈茂恐魍魎之責景兮羌未得其云已黎淳耀于高辛兮𦍋強大于南汜嬴取威于伯儀兮薑本支乎三趾既仁得其信然兮仰天路而同軌東鄰虐而殲仁兮王合位乎三五戎女烈而喪孝兮伯徂歸于龍虎發還師以成性兮重醉行而自耦震鱗斄于夏庭兮匝三正而滅姬巽羽化于宣宮兮彌五辟而成災道修長而世短兮敻冥默而不周胥仍物而鬼諏兮乃窮宙而達幽媯巢薑于孺筮兮旦算祀于契龜宣曹興敗于下夢兮魯衛名諡于銘謠妣聆呱而勒石兮許相理而鞠條道混成而自然兮術同原而分流神先心以定命兮命隨行以消息斡流遷其不濟兮故遭罹而贏縮三欒同于一體兮雖移易而不忒洞參差其紛錯兮斯衆兆之所惑周賈蕩而貢憤兮齊死生與禍福抗爽言以矯情兮信畏犧而忌鵩所貴聖人之至論兮順天性而斷誼物有欲而不居兮亦有惡而不避守孔約而不二兮乃輶德而無纍三仁殊于一致兮夷惠舛而齊聲木偃息以蕃魏兮申重繭以存荊紀焚躬以衛上兮皓頤志而弗營俟草木之區別苟能實而必榮要沒世而不朽兮乃先民之所程觀天罔之紘覆兮實棐諶而相順謨先聖之大猷兮亦鄰德而助信虞韶美而儀鳳兮孔忘味于千載素文信而底麟兮漢賓祚于異代精通靈而感物兮神動氣而入微養遊睇而猿號兮李虎發而石開非精誠其焉通兮苟無實其孰信操末技猶必然兮矧湛躬于道真登孔昊而上下兮緯群龍之所經朝貞觀而夕化兮猶喧己而遺形若胤彭而僭老兮訴來哲而通情亂曰天造草昧立性命兮復心弘道惟賢聖兮渾元運物流不處兮保身遺名民之表兮舍生取誼以道用兮憂傷夭物忝莫痛兮皓爾太素曷渝色兮尚粵其幾淪神域兮見漢書敘傳上文選藝文類聚二十六竹扇賦青青之竹形兆直妙華長竿紛實翼杳篠叢生于水澤疾風時紛紛蕭颯削為扇翣成器美託御君王供時有度量異好有圓方來風辟暑致清涼安體定神達消息百王傳之賴功力壽考康寧纍萬億見古文苑白綺扇賦見初學記二十五引班孟堅集佚漢頌論功歌詩靈芝歌因露寢兮産靈芝象三德兮瑞應圖延壽命兮光此都配上帝兮象太微參日月兮揚光輝見初學記十五御覽五百七十
