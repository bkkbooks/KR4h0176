body:
  text: 全後漢文卷二十五班固臣聞臣聞堯登稷契堯登稷契治隆太平治隆太平舜用皋陶舜用皋陶政致雍熙政致雍熙殷周雖有高宗昌發之君殷周雖有高宗昌發之君猶賴傅說呂望之策猶賴傅說呂望之策故能克崇其業故能克崇其業允協大中允協大中竊見鉅鹿太守會稽謝夷吾竊見鉅鹿太守會稽謝夷吾出自東州出自東州厥士塗泥厥士塗泥而英資挺特而英資挺特奇偉秀出奇偉秀出才兼四科才兼四科行包九德行包九德仁足濟時仁足濟時知周萬物知周萬物加以少膺儒雅加以少膺儒雅韜含六籍韜含六籍推考星度推考星度綜校圖錄綜校圖錄探賾聖祕探賾聖祕觀變歷徵觀變歷徵占天知地占天知地與神合契與神合契據其道德據其道德以經王務以經王務昔為陪隸昔為陪隸與臣從事與臣從事奮忠毅之操奮忠毅之操躬史魚之節躬史魚之節董臣嚴綱董臣嚴綱勖臣懦弱勖臣懦弱得以免戾得以免戾實賴厥勳實賴厥勳及其應選作宰及其應選作宰惠敷百里惠敷百里降福彌異降福彌異流化若神流化若神爰牧荊州爰牧荊州威行邦國威行邦國奉法作政奉法作政有周召之風有周召之風居儉履約居儉履約紹公儀之操紹公儀之操尋功𥳑能尋功𥳑能為外臺之表為外臺之表聽聲察實聽聲察實為九伯之冠為九伯之冠遷守鉅鹿遷守鉅鹿政合時雍政合時雍德量績謀德量績謀有伊呂管晏之任有伊呂管晏之任闡弘道奧闡弘道奧同史蘇京房之倫同史蘇京房之倫雖密勿在公雖密勿在公而身出心隱而身出心隱不殉名以求譽不殉名以求譽不馳騖以要寵不馳騖以要寵念存遜遁念存遜遁演志箕山演志箕山方之古賢方之古賢實有倫序實有倫序採之于今採之于今超然絕俗超然絕俗誠社稷之著龜誠社稷之著龜大漢之棟甍大漢之棟甍宜當拔擢宜當拔擢使登鼎司使登鼎司上令三辰順軌于厤象上令三辰順軌于厤象下使五品咸訓于嘉時下使五品咸訓于嘉時必致休徵克昌之慶必致休徵克昌之慶非徒循法奉職而已非徒循法奉職而已臣以頑駑臣以頑駑器非其疇器非其疇尸祿負乘尸祿負乘夕惕若厲夕惕若厲願乞骸骨願乞骸骨更授夷吾更授夷吾上以光七曜之明上以光七曜之明下以厭率土之望下以厭率土之望庶令微臣塞咎免悔庶令微臣塞咎免悔見後漢謝夷吾傳見後漢謝夷吾傳蓺文類聚五十三蓺文類聚五十三匈奴和親議竊自惟思漢興已來曠世歷年兵纏夷狄尤事匈奴綏御之方其塗不一或修文以和之或用武以征之或卑下以就之或臣服而致之雖屈申無常所因時異然未有拒絕棄放不與交接者也故自建武之世復修舊典數出重使前後相繼至于其末始乃暫絕永平八年復議通之而廷爭連日異同紛回多執其難少言其易先帝聖德遠覽瞻前顧後遂復出使事同前世以此而推未有一世闕而不修者也今烏桓就闕稽首譯官康居月氏自遠而至匈奴離析名王來降三方歸服不以兵威此誠國家通于神明自然之徵也臣愚以為宜依故事復遣使者上可繼五鳳甘露致遠人之會下不失建武永平羈縻之義虜使再來然後一往既明中國主在忠信且知聖朝禮義有常豈可逆詐示猜孤其善意乎絕之未知其利通之不聞其害設後北虜稍彊能為風塵方復求為交通將何所及不若因今施惠為策近長見後漢班固傳與竇憲牋明將軍哀憐賜固手札告以軍中宜鮮明乃賜以玉躬所喜駭犀瑇瑁簪絳紗單衣以魯縞之質被服鸞鳳之飾見蓺文類聚八十四御覽六百八十八又六百九十又八百七昨上以寶刀賜臣曰此大將軍少小時所服今以賜卿固伏念大恩且喜且慚見書鈔一百二十三今月中舍以令賜固刀把曰此將軍少小時所服今賜固伏念大恩且喜且慚見御覽三百四十六固于張掖縣受賜所服物虎頭繡鞶囊一雙又遺身所服襪三具錯鏤鐵一見御覽四百七十八引班固集又八百十五復賜固犀毗金頭帶此將軍所自服也見書鈔一百二十九奏記東平王蒼將軍以周召之德立乎本朝承休明之策建威靈之號昔在周公今也將軍詩書所載未有三此者也傳曰必有非常之人然後有非常之事有非常之事然後有非常之功固幸得生于清明之世豫在視聽之末私以螻螘竊觀國政誠美將軍擁千載之任躡先聖之蹤體弘懿之姿據高明之勢博貫庶事服膺六蓺白黑簡心求善無厭採擇狂夫之言不逆負薪之議竊見幕府新開廣延群俊四方之士顛倒衣裳將軍宜詳唐殷之舉察伊皋之薦令遠近無偏幽隱必達期于總覽賢才收集明智為國得人以寍本朝則將軍養志和神優游廟堂光名宣于當世遺烈著于無窮竊見故司空掾桓梁宿儒盛名冠德州里七十從心行不踰矩蓋清廟之光輝當世之俊彥也京兆祭酒晉馮結髮修身白首無違好古樂道玄默自守古人之美行時俗所莫及扶風掾李育經明行著教授百人客居杜陵茅室土階京兆扶風二郡更請徒以家貧數辭病去溫故知新論議通明廉清修絜行能純備雖前世名儒國家所器韋平孔翟無以加焉宜令考績以參萬事京兆督郵郭基孝行著于州里經學稱于師門政務之績有絕異之效如得及明時秉事下僚進有羽翮奮翔之用退有杞梁一介之死涼州從事王雍躬卞嚴之節文之以術蓺涼州冠蓋未有宜先雍者也古者周公一舉則三方怨曰奚為而後已宜及府開以慰遠方弘農功曹史殷肅達學洽聞才能絕倫誦詩三百奉使專對此六子者皆有殊行絕才德隆當世如蒙徵納以輔高明此山梁之秋夫子所為歎也昔卞和獻寶以離斷趾靈均納忠終于沈身而和氏之璧千載垂光屈子之篇萬世歸善願將軍隆照微之明信日昃之聽少屈威神咨嗟下問令塵埃之中永無荊山汨羅之恨見後漢班固傳又見蓺文類聚五十八與陳文通書奉國威靈信志方外見文選陳琳為袁紹檄豫州注與弟超書得伯章書藁勢殊工知識讀之莫不歎息實亦蓺由己立名自人成見張懷瓘書斷傅武仲以能屬文為蘭臺令史下筆不能自休見文選吳質答魏太子牋注又典論論文竇侍中前寄人錢八十萬市得雜罽十餘張也見御覽八百十六竇侍中令載雜綵七百匹白素三百匹欲以市月氐馬蘇合香毾㲪見蓺文類聚八十五御覽八百十四九百八十二月氏毾㲪大小相雜但細好而已見北堂書鈔一百三十四御覽七百八今遺仲升瑇瑁黑犀簪虎頭金鞶囊金鉤見御覽六百八十八又六百九十一竇侍中遺仲升楚騰陵錯橫刀𤨟皁削一枚金錯半垂刀一枚見御覽一百四十五答賓戲永平中為郎典校祕書專篤志于博學以著述為業或譏以無功又感東方朔揚雄自諭以不遭蘇張范蔡之時曾不折之以正道明君子之所守故聊復應焉其辭曰賓戲主人曰蓋聞聖人有一定之論烈士有不易之分亦云名而已矣故太上有立德其次有立功夫德不得後身而特盛功不得背時而獨彰是以聖哲之治棲棲遑遑孔席不㬉墨突不黔由此言之取舍者昔人之上務著作者前列之餘事耳今吾子幸遊帝王之世躬帶紱冕之服浮英華湛道德矕虎之文舊矣卒不能攄首尾奮翼鱗振拔洿塗跨騰風雲使見之者影駭聞之者響震徒樂枕經籍書紆體衡門上無所蔕下無所根獨攄意乎宇宙之外銳思于毫芒之內潛神默記緪以年歲然而器不賈于當己用不效于一世雖馳辯如濤波摛藻如春華猶無益于殿最也意者且運朝夕之策定合會之計使存有顯號亡有美諡不亦優乎主人逌爾而笑曰若賓之言所謂見世利之華闇道德之實守窔奧之熒燭未仰天庭而覩白日也曩者王塗蕪穢周失其馭侯伯方軌戰國橫騖于是七雄虓闞分裂諸夏龍戰虎爭遊說之徒風颮電激竝起而救之其餘猋飛景附霅煜其閒者蓋不可勝載當此之時搦朽摩鈍鉛刀皆能一斷是故魯連飛一矢而蹶千金虞卿以顧眄而捐相印夫啾發投曲感耳之耳合之律度淫䵷而不可聽者非詔夏之樂也因勢合變遇時之容風移俗易乖忤而不可通者非君子之法也及至從人合之衡人散之亡命漂說羈旅騁辭商鞅挾三術以鑽孝公李斯奮時務而要始皇彼皆躡風塵之會履顛沛之勢據徼乘邪以求一日之富貴朝為榮華夕為顦顇福不盈眥禍溢于世凶人且以自悔況吉士而是賴乎且功不可以虛成名不可以偽立韓設辯以激君呂行詐以賈國說難既遒其身乃囚秦貨既貴厥宗亦墜是以仲尼抗浮雲之志孟軻養浩然之氣彼豈樂為迂闊哉道不可以貳也方今大漢酒埽群穢夷險芟荒廓帝紘恢皇綱基隆于羲農規廣于黃唐其君天下也炎之如日威之如神涵之如海養之如春是以六合之內莫不同源共流沐浴玄德稟仰太龢枝附葉著譬猶草木之植山林鳥魚之毓川澤得氣者蕃滋失時者零落參天地而施化豈云人事之厚薄哉今吾子處皇代而論戰國曜所聞而疑所覿欲從堥敦而度高乎泰山懷氿濫而測深乎重淵亦未至也賓曰若夫鞅斯之倫衰周之凶人既聞命矣敢問上古之士處身行道輔世成名可述于後者默而已乎主人曰何為其然也昔者咎繇謨虞箕子訪周言通帝王謀合神聖殷說夢發于傅巖周望兆動于渭濱齊甯激聲于康衢漢良受書于邳垠皆竢命而神交匪詞言之所信故能建必然之策展無窮之勳也近者陸子優游新語以興董生下帷發藻儒林劉向司籍辯章舊聞揚雄覃思法言太玄皆及時君之門闈究先聖之壼奧婆娑乎術蓺之場休息乎篇籍之囿以全其質而發其文用納乎聖聽烈炳乎後人斯非亞與若乃伯夷抗行于首陽柳惠降志于辱仕顏淵樂于簞瓢孔終篇于西狩聲盈塞于天淵真吾徒之師表也且吾聞之一陰一陽天地之方乃文乃質王道之綱有同有異聖哲之常故曰慎修所志守爾天符委命供己味道之腴神之聽之名其舍諸賓又不聞和氏之璧韞于荊石隋侯之珠藏于蚌蛤乎歷世莫眡不知其將含景曜吐英精曠千載而流光也應龍潛于潢汙魚黿媟之不覩其能奮靈德合風雲超忽荒而躆昊蒼也故夫泥蟠而天飛者應龍之神也先賤而後貴者和隋之珍也時暗而久章者君子之真也若乃牙曠清耳于管絃離婁眇目于毫分逢蒙絕技于弧矢般輸搉巧于斧斤良樂軼能于相馭烏獲抗力于千鈞和鵲發精于鍼石研桑心計于無垠走亦不任廁技于彼列故密爾自娛于斯文見漢書敘傳上文選蓺文類聚二十五難莊論太古之世不車不舟陸走以游不棟不宇巢穴而處見北堂書鈔一百五十八眾人之逐世利如青蠅之赴肉汁也青蠅嗜肉汁而忘溺死眾人貪世利而陷罪禍見蓺文類聚九十七功德論朱軒之使鳳舉于龍堆之表見文選陸機演連珠注今朝廷昭明海內寍靜空令朱輪之使風舉龍堆之表見北堂書鈔四十秦紀論孝明皇帝十七年十月十五日乙丑曰周曆已移仁不代母秦直其位呂政殘虐然以諸侯十三并兼天下極情縱欲養育宗親三十七年兵無所不加制作政令施于後王蓋得聖人之威河神授圖據狼狐蹈參伐佐攻驅除距之稱始皇始皇既歿胡亥極愚酈山未畢復作阿房以遂前策云凡所為貴有天下者肆意極欲大臣至欲罷先君所為誅斯去疾任用趙高痛哉言乎人頭畜鳴不威不伐惡不篤不虛亡距之不得留殘虐以促期雖居形便之國猶不得存子嬰度次得嗣冠玉冠佩華紱車黃屋從百司謁七廟小人乘非位莫不怳忽失守偷安日日獨能長念卻慮父子作權近取于戶牖之閒竟誅猾臣為君討賊高死之後賓婚未得盡相勞餐未及下咽酒未及濡脣楚兵已屠關中真人翔霸上素車嬰組奉其符璽以歸帝者鄭伯茅旗鸞刀嚴王退舍河決不可復壅魚爛不可復全賈誼司馬遷曰向使嬰有庸主之才僅得中佐山東雖亂秦之地可全而有宗廟之祀未當絕也秦之積衰天下土崩瓦解雖有周旦之材無所復陳其巧而以責一日之孤誤哉俗傳秦始皇起罪惡胡亥極得其理矣復責小子云秦地可全所謂不通時變者也紀季以酅春秋不名吾讀秦紀至于子嬰車裂趙高未嘗不健其決憐其志嬰死生之義備矣見史記秦始皇本紀離騷序昔在孝武博覽古文淮南王安敘離騷傳以國風好色而不淫小雅怨悱而不亂若離騷者可謂兼之蟬蛻濁穢之中浮游塵埃之外皭然泥而不滓推此志與日月爭光可也斯論似過其真又說五子以失家巷謂五子胥也及至羿澆少康貳姚有娀佚女皆各以所識有所增損然猶未得其正也故博采經書傳記本文以為之解且君子道窮命矣故潛龍不見是而無悶關睢哀周道而不傷甯瑗持可懷之智甯武保如愚之性咸以全命避害不受世患故大雅曰既明且哲以保其身斯為貴矣今若屈原露才揚己競乎危國群小之閒以離讒賊然責數懷王怨惡椒蘭愁神苦思非其人忿懟不容沈江而死亦貶絜狂狷景行之士多稱崑崙冥婚宓妃虛無之語皆非法度之政經義所載謂之兼詩風雅而與日月爭光過矣然其文弘博麗雅為辭賦宗後世莫不斟酌其英華則象其從容自宋玉唐勒景差之徒漢興枚乘司馬相如劉向揚雄騁極文辭好而悲之自謂不能及也雖非明智之器可謂妙才者也見楚辭王逸注本離騷贊序離騷者屈原之所作也屈原初事懷王甚見信任同列上官大夫妬害其寵讒之王王怒而疏屈原屈原以忠信見疑憂愁幽思而作離騷離猶遭也騷憂也明己遭憂作辭也是時周室已滅七國竝爭屈原痛君不明信用群小國將危亡忠誠之情懷不能已故作離騷上陳堯舜禹湯文王之法下言羿澆桀紂之失以風懷王終不覺寤信反閒之說西朝于秦秦人拘之客死不還至于襄王復用讒言逐屈原在野又作九章賦以風諫卒不見納不忍濁世自投汨羅原死之後秦果滅楚其辭為眾賢所悼悲故傳于後見楚辭王逸注本
