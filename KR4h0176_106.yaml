body:
  text: 班固高祖頌漢帝本系自出唐帝降及于周在秦作劉涉魏而東遂為豐公見漢書高帝紀贊是以頌高祖云東巡頌竊見巡狩岱宗祡望山虞宗祀明堂上稽帝堯中述世宗遵奉世祖禮儀備具動自聖心是以明神屢應休徵仍降事大而瑞盛非一小臣所任頌述不勝狂𥳑之情謹上岱宗頌一篇曰若稽古在漢迪哲聿修厥德憲章丕烈翿六龍較五輅齊百僚練質素命南重以司曆歷中月之六辰備天官之列衛盛輿服而東巡乘輿動色群后屏氣萬騎齊鑣千乘弭轡見藝文類聚三十九初學記十三又二十二御覽三百五十八又五百三十七南巡頌惟漢再受命系葉十一帝典協景和則天經郊高宗光六幽通神明既禘祖于西都又將祫于南庭是時聖上運天官之法駕建日月之旃旌憑列宿而贊元見藝文類聚三十九初學記十三引兩條御覽五百三十七安豐戴侯頌見御覽五百八十八文章流別論昔班固為安豐戴侯頌文心雕龍孟班之頌戴侯文今佚竇將軍北征頌車騎將軍應昭明之上德該文武之妙姿蹈佐歷握輔㩞翼肱聖上作主光輝資天心謨神明規卓遠圖幽冥親率戎士巡撫彊城勒邊御之永設奮𨎨櫓之遠徑閔遐黎之騷狄念荒服之不庭乃總三選𥳑虎校勒部隊明誓號援謀夫于末言察武毅于俎豆取可杖于品象拔所用于仄陋料資器使采用先務民儀響慕群英影附羌戎相率東胡爭騖不召而集未令而諭于是雷震九原電曜高闕金光鏡野武旗日雲黯長霓鹿走黃磧輕選四縱所從莫敵馳飆疾踵蹊迹探梗莽採嶰厄斷溫禺分尸逐電激私渠星流霰落名王交手稽顙請服乃收其鋒鏃干鹵甲胄積象如丘阜陳閲滿廣野戢載連百兩散數纍萬億放獲驅拏揣城拔邑擒馘之倡九谷謠謲響聒東夷埃塵戎域然而唱呼鬱憤未逞厥願甘平原之酣戰矜訊捷之纍算何則上將崇至仁行凱易弘濃恩降溫澤同庖廚之珍饌分裂室之纖帛勞不御輿寒不施襗行無偏勤止無兼役悂蒙識而愎戾順二者異而懦夫奮遂踰涿邪跨祁連籍口庭蹈就疆獦崝嵮轔幽山趨凶河臨安侯軼焉居與虞衍顧衛霍之遺迹賊伊袟之所邈師橫騖而庶御士怫㥜以爭先回萬里而風騰劉殘寇于沂根糧不賦而師贍役不重而備軍行戎醜以禮教炘鴻校而昭仁文武炳其竝隆威德兼而兩信清乾鈞之攸冒拓畿略之所順橐弓鏃而戢戈回雙麾以東運于是封燕然以降高䄠廣鞬以弘曠銘靈陶以勒崇欽皇祗之祐貺宣惠氣蕩殘風軻泰幽嘉凝陰飛雪瀼庶其雨酒淋榛枯一握興嘉卉始濃土膏含養四行分任于是三軍稱曰亹亹將軍克廣德心光光神武弘昭德音超兮首天潛眇兮與神參見古文苑藝文類聚六十九神雀頌見御覽五百八十八永平中神雀郡集孝明詔上神雀頌班固賈逵傅毅楊終侯諷五頌文比金玉今佚擬連珠臣聞公輸愛其斧故能妙其巧明主貴其士故能成其治臣聞良匠度其材而成大廈明主器其士而建功業臣聞聽決價而資玉者無楚和之名因近習而取士者無伯玉之功故璵璠之為寶非駔儈之術也伊呂之為佐非左右之舊臣聞鸞鳳養六翮以凌雲帝王乘英雄以濟民易曰鴻漸于陸其羽可為儀臣聞馬伏皂而不用則駑與良而為群士齊僚而不職則賢與愚而不分見藝文類聚五十七封燕然山銘並序惟永元元年秋七月有漢元舅曰車騎將軍竇憲寅亮聖皇登翼王室納于大麓惟清緝熙乃與執金吾耿秉述職巡御治兵于朔方鷹揚之校螭虎之士爰該六師暨南單于東胡烏桓西戎氐羌侯王君長之群驍騎十萬元戎輕武長轂四分雷輜蔽路萬有三千餘乘勒以八陳蒞以威神玄甲耀日朱旗絳天遂淩高闕下雞鹿經磧鹵絶大漠斬溫禺以釁鼓血尸逐以染鍔然後四校橫徂星流彗掃蕭條萬里野無遣寇于是域滅區殫反斾而旋考傳驗圖窮覽其山川遂踰涿邪跨安侯乘燕然躡冒頓之區落焚老上之龍庭上以攄高文之宿憤光祖宗之玄靈下以安固後嗣恢拓境宇振大漢之天聲茲所謂一勞而久逸暫費而永寧也乃遂封山刊石昭銘上德其辭曰鑠王師兮征荒裔剿凶虐兮截海外敻其邈兮亙地界封神丘兮建隆嵑熙帝載兮振萬世見後漢書竇憲傳文選藝文類聚七高祖泗水亭碑銘母溫氏史記高組紀索隱案此語在碑序中已下皆銘詞皇皇聖漢兆自沛豐乾降著符精感赤龍承魁流裔襲唐末風寸木尺土無俟斯亭建號宣基惟以沛公揚威斬蛇金精摧傷涉關凌霸係獲秦王應門造勢斗璧納忠天期乘祚受爵漢中勒陳東征剟擒三秦靈神威佑洪溝是乘漢軍改歌楚衆易心誅項討羽諸夏以康陳張畫策蕭勃翼終出爵褎賢裂土封功炎火之德彌光以明源清流潔本盛末榮敘時十八贊述股肱休勛顯祚永永無疆國寧家安我君是升根生葉茂舊邑是仍於皇舊亭苗嗣是承天之福祐萬年是興見古文苑藝文類聚十二酇侯蕭何耽耽相國弘策不追御國維綱秉統樞機文昌四友漢有蕭何序功第一受封于酇見通典一百七十七引下四句以為泗水亭高祖碑知此十八銘皆碑中語也將軍舞陽侯樊噲黆黆將軍威蓋不當操盾千鈞拔主項堂漢興破楚矯矯忠良卒為丞相帝室以康將軍留侯張良赫赫將軍受兵黃石規圖勝負不出帷幄命惠瞻仰安全正朔國師是封光榮舊宅太尉絳侯周勃懿懿太尉惇厚朴誠輔翼受命應節御營歷位卿相土國兼并見危致命社稷以寧將軍平陽侯曹參蹇蹇相國允忠克誠臨危處險安而匡傾興代之際濟主立名身履國土秉御乾楨丞相戶牖侯陳平洋洋丞相勢譎師旅擾攘楚魏為漢謀主六奇解厄揚名于後南宮侯張敖堂堂張敖耳之遺萌以誠佐國序迹建忠功成德立襲封南宮垂號萬春永保無疆衛尉曲陽侯酈商衍衍衛尉德行循規遭兵食骸隕歿于齊橫恥愧景刎頸自獻金紫褎表萬世不刊將軍潁陽侯灌嬰煌煌將軍輔漢久長威震呂氏姦惡不揚寇攘殄盡躬迎代王功顯帝室萬世益章將軍汝陰侯夏侯嬰斌斌將軍鷹武是揚內康王室外鎮四方諸夏乂安流及要荒聲騁海內苗嗣紀功將軍陽陵侯傅寬休休將軍如虎如羆御師勒陳破敵以威靈金曜楚火流烏飛將命伏節功績永垂將軍信武侯靳歙斤斤將軍忠信孔雅出身六師十二四旅折衝扞難遂寧天下金龜章德建號傳後丞相安國侯王陵明明丞相天德挺直剛德正行不枉不曲功業成著榮顯食邑距呂奉主昭然不惑將軍襄平侯韓信桓桓將軍輔主克征奉使口璧身泏項營序功差德履讓以平轉北而遊雲中以傾將軍棘津侯陳武巖巖將軍帶武佩威御雄乘險難困不違仇滅主定四海是桓功成食土德被遐邇曲成侯蟲達晏晏曲成輿從龍騰安危從主赤曜以升赫赫皇皇道彌光明惟德御國流及後萌御史大夫汾陰侯周昌肅肅御史以武以文相趙距呂志安君身徵詣行所如意不全天秩邑土勛乃永存將軍青陽侯王吸邑邑將軍育養蒸徒建謀正直行不匡邪入軍討敵項定天都佩雀雙印百里為家見古文苑典引臣固言永平十七年臣與賈逵傅毅杜矩展隆郗萌等召詣雲龍門小黃門趙宣持秦始皇帝本紀問臣等曰太史遷下贊語中寧有非耶臣對此贊賈誼過秦篇云向使子嬰有庸主之才僅得中佐秦之社稷未宜絶也此言非是即召臣入問本聞此論非邪將見問意開寤邪臣具對素聞知狀詔因曰司馬遷著書成一家之言揚名後世至以身陷刑之故反微文刺譏貶損當世非誼士也司馬相如汙行無節但有浮華之辭不周于用至于疾病而遺忠主上求取其書竟得頌述功德言封禪事忠臣效也至是賢遷遠矣臣固常伏刻誦聖論昭明好惡不遺微細緣事斷誼動有規矩雖仲尼之因史見意亦無以加臣固被學最舊受恩浸深誠思畢力竭情昊天罔極臣固頓首頓首伏惟相如封禪靡而不典揚雄美新典而亡實然皆游揚後世垂為舊式臣固才朽不及前人蓋詠雲門者難為音觀隋和者難為珍不勝區區竊作典引一篇雖不足雍容明盛萬分之一猶啓發憤悶覺悟童蒙光揚大漢軼聲前代然後退入溝壑死而不朽臣固愚戇頓首頓首曰太極之元兩儀始分烟烟熅熅有沈而奧有浮而清沈浮交錯庶類混成肇命民主五德初始同于草昧玄混之中踰繩越契寂寥而亡詔者系不得而綴也厥有氏號紹天闡繹莫不開元于太昊皇初之首上哉敻乎其書猶得而修也亞斯之代通變神化函光而未曜若夫上稽乾則降承龍翼而炳諸典謨以冠德卓絶者莫崇乎陶唐陶唐舍胤而禪有虞有虞亦命夏后稷契熙載越成湯武股肱既周天乃歸功元首將授漢劉俾其承三季之荒末值亢龍之災孽縣象暗而恆文乖彝倫斁而舊章缺故先命玄聖使綴學立制宏亮洪業表相祖宗贊揚迪哲備哉粲爛真神明之式也雖皋夔衡旦密勿之輔比茲褊矣是以高光二聖宸居其域時至氣動乃龍見淵躍拊翼而未舉則威靈紛紜海內雲蒸雷動電熛胡縊莽分尚不蒞其誅然後欽若上下恭揖群后正位度宗有于德不台淵穆之讓靡號師矢敦奮撝之容蓋以膺當天之正統受克讓之歸運蓄炎上之烈精蘊孔佐之弘陳云爾洋洋乎若德帝者之上儀誥誓所不及已鋪觀二代洪纖之度其賾可探也竝開迹于一匱同受侯甸之服奕世勤民以方伯統牧乘其命賜彤弧黃鉞之威用討韋顧黎崇之不恪至于參五華夏京遷鎬亳遂自北面虎螭其師革滅天邑是故誼士華而不敦武稱未盡護有慚德不其然歟然猶於穆猗𨙻翕純皎繹以崇嚴祖考殷薦宗配帝發祥流慶對越天地者舄奕乎千載豈不克自神明哉誕略有常審言行于篇籍光藻朗而不渝耳矧夫赫赫聖漢巍巍唐基泝測其源乃先孕虞育夏甄殷陶周然後宣二祖之重光襲四宗之緝熙神靈日照光被六幽仁風翔乎海表威靈行乎鬼區匿亡回而不泯微胡瑣而不頤故夫顯定三才昭登之績匪堯不興鋪聞遺策在下之訓匪漢不弘厥道至于經緯乾坤出入三光外運渾元內霑豪芒性類循理品物威亨其已久矣盛哉皇家帝世德臣列辟功君百王榮鏡宇宙尊亡與亢乃始虔鞏勞謙兢兢業業貶成抑定不敢論制作至于遷正黜色賓監之事渙揚寓內而禮官儒林屯朋篤論之士不傅祖宗之髣佛雖云優慎無乃葸與于是三事嶽牧之寮僉爾而進曰陛下抑監唐典中述祖則俯蹈宗軌躬奉天經惇睦辨章之化洽巡靖黎蒸懷保鰥寡之惠浹燔痤縣沈肅祗群神之禮備是以來儀集羽族于觀魏肉角馴毛宗于外囿擾緇文皓質于郊升黃輝采鱗于沼甘露宵零于豐草三足軒翥于茂樹若乃嘉穀靈草奇獸神禽應圖合牒窮祥極瑞者朝夕坰牧日月邦畿卓犖乎方州洋溢乎要荒昔姬有素雉朱烏玄秬黃𪍓之事耳君臣動色左右相趨濟濟翼翼峨峨如也蓋用昭明寅畏承聿懷之福亦以寵靈文武貽燕後昆覆以懿鑠豈其為身而有顓辭也若然受之亦宜勤恁旅力以充厥道啓恭館之金縢御東序之祕寶以流其占夫圖書亮章天哲也孔猷先命聖孚也體行德本正性也逢吉丁辰景命也順命以創制因定以和神答三靈之蕃祉展放唐之明文茲事體大而允寤寐次于聖心瞻前顧後豈蔑清廟憚敕天命也伊考自遂古乃降戾爰茲作者七十有四人有不俾而假素罔光度而遺章今其如台而獨闕也是時聖上固已垂精遊神苞舉藝文屢訪群儒諭咨故老與之斟酌道德之淵源肴核仁誼之林藪以望元符之臻焉既感群后之讜辭又悉經五繇之碩慮矣將絣萬嗣揚洪輝奮景炎扇遺風播芳烈久而愈新用而不竭汪汪乎丕天之大津其疇能亘之哉唐哉皇哉皇哉唐哉見文選藝文類聚十奕旨大冠言博既終或進而問之曰孔子稱有博奕今博行于世而奕獨絶博義既弘奕義不述問之論家師不既說其聲可問乎曰學不廣博無以應客北方之人謂棊為奕弘而說之舉其大略厥義深矣局必方正象地則也道必正直神明德也棊有白黑陰陽分也駢羅列布效天文也四象既陳行之在人蓋王政也成敗臧否為仁由己道之正也夫博懸于投不專在行優者有不遇劣者有僥幸踦拏相淩氣勢力爭雖有雄雌未足以為平也至于奕則不然高下相推人有等級若孔氏之門回賜相服循名責實謀以計策若唐虞之朝考功黜陟器用有常施設無析因敵為資應時屈伸續之不復變化日新或虛設豫置以自護衛蓋象庖義罔罟之制隄防周起障塞漏決有似夏后治水之勢一孔有闕壞頽不振有似瓠子泛濫之敗一棊破窐亡地復還曹子之威作伏設詐突圍橫行田單之奇要厄相劫割地取償蘇張之姿固本自廣敵人恐懼參分有二釋而不誅周文之德知者之慮也既有過失能量弱彊逡巡需行保角休旁卻自補續雖敗不亡繆公之智中庸之方上有天地之象次有帝王之治中有五霸之權下有戰國之事覽其得失古今略備及其晏也至于發憤忘食樂以忘憂推而高之仲尼概也樂而不淫哀而不傷質之詩書關睢類也紕專知柔陰陽代至施之養性彭祖氣也外若無為默而識淨泊自守以道意隱居放言遠咎悔行象虞仲信可喜感乎大冠論未備故因問者喻其事見藝文類聚七十四御覽七百五十三古文苑馬仲都哀辭車騎將軍順文侯馬仲都明帝舅也從車駕于洛水浮橋馬驚入水溺死帝顧謂侍御曰班固為馬上三十步哀辭見御覽五百九十六涿邪山祝文晃晃將軍大漢元輔仗節擁旄鉦人伐鼓見文選虞羲詠霍將北伐詩注又宣德皇后令注又丘遲與陳伯之書注請兵平定西域疏臣竊見先帝欲開西域置校尉計思慮十有餘年乃發大策北擊胸奴西使外國鄯善于填即時向化今拘彌莎車疏勒月氏烏孫康居復願歸附欲共并力破滅龜茲平通漢道若得龜茲則西域未服者百分之一耳臣伏自惟念卒伍小吏實願從谷吉效命絶域庶幾張騫棄身曠野昔魏絳列國大夫尚能和輯諸戎況臣奉大漢之威萬死之志而無鉛刀一割之用乎前世議者皆曰取三十六國號為斷胸奴右臂今西域諸國自日之所入莫不化向大小欣欣各奉國珍前後不絶唯焉耆龜茲獨未服從臣前與官屬三十六人奉使絶域備遭艱厄自孤守疏勒於今五載胡夷情數臣頗識之問其城郭小大皆言倚漢與依天等以是效臣之能則葱嶺可通葱嶺通則龜茲可伐今宜拜龜茲侍子白霸為其國王以步騎數百送之與諸國連兵歲月之閒龜茲可禽以夷狄攻夷狄計之善者也臣見莎車疏勒田地肥廣草木饒衍不比敦煌鄯善閒也兵可不費中國而糧食自足且姑墨溫宿二王特為龜茲所置既非其種更相厭苦其藝必有降反若二國來降則龜茲自破願下臣章參考行事誠有萬分死復何恨臣超區區特蒙神靈竊冀未便僵仆目見西域平定陛下舉萬年之觴薦勳祖廟布大喜於天下見後漢班超傳又見袁宏後漢紀十一有刪節亦有多出句今合録之上書求代臣聞太公封齊五世葬周故狐死首丘代馬依風夫周齊同在中土千里之閒爾況于遠處絶域小臣能無依風首丘之思哉蠻夷之俗畏壯侮老自其天性臣超犬馬齒殲常恐年衰奄忽僵仆孤魂棄捐昔蘇武留胸奴中尚十九年今臣幸得奉節帶金銀護西域如自以壽終屯部誠無所恨臣義不營私然恐後世或名臣為沒西域臣不敢望到酒泉郡但願生入玉門關以承邊境威外夷臣老病衰困冒死瞽言謹遣子勇隨獻物入塞及臣生在令勇目見中土見袁宏後漢紀十四又見後漢班超傳各有刪節今合録之上言宜招慰烏孫烏孫大國控弦十萬故武帝妻以公主至孝宣皇帝卒得其用今可遣使招慰與共合力見後漢班超傳敕吏田慮兜題本非疏勒種國人必不用命若不即降便可執之見後漢班超傳答任尚書任君數當大任豈班超所能及哉必不得已願進愚言塞外吏士本非孝子順孫皆以過補屯部蠻夷獸心難養易動今君性嚴急水清無大魚將軍宜寬小過總大綱而已見袁宏後漢和帝紀西域議愚以為邊境者中國之唇齒唇亡則齒寒其理然也昔孝武皇帝患胸奴強盛兼總百蠻以逼障塞于是開通西域離其黨與論者以為奪胸奴府藏斷其右臂遭王莽篡盜徵求無厭胡夷忿毒遂以背叛光武中興未遑外事故胸奴負彊驅率諸國及至永平再攻敦煌河西諸郡城門晝閉孝明皇帝深惟廟策乃命虎臣出征西役故胸奴遠遁邊境得安及至永元莫不內屬會閒者羌亂西域復絶北虜遂遣責諸國備其逋租高其價直嚴以期會鄯善車師皆懷憤怨思樂事漢其路無從前所以時有叛者皆由牧養失宜還為其害故也今曹宗徒恥于前負欲報雪胸奴而不尋出兵故事未度當時之宜也夫要功荒外萬無一成若兵連禍結悔無及已況今府藏未充師無後繼是示弱於遠夷暴短於海內臣愚以為不可許也舊敦煌郡有營兵三百人今宜復之復置護西域副校尉居於敦煌如永元故事又宜遣西域長史將五百人屯樓蘭西當焉耆龜茲徑路南彊鄯善于填心膽北扞胸奴東近敦煌如此誠便見後漢班勇傳答尚書問尚書問勇曰今立副校尉何以為便又置長史屯樓蘭利害云何勇對曰昔永平之末始通西域初遣中郎將居敦煌後置副校尉于車師既為胡虜節度又禁漢人不得有所侵擾故外夷歸心胸奴畏威今鄯善王尤還漢人外孫若胸奴得志則尤還必死此等雖同鳥獸亦知避害若出屯樓蘭足以招附其心愚以為便見後漢班勇傳對鐔顯等難長樂衛尉鐔顯綦母參司隸校尉崔據難曰朝廷前所以棄西域者以其無益于中國而費難供也今車師已屬胸奴鄯善不可保信一旦反覆班將能保北虜不為邊害乎勇對曰今中國置州牧者以禁郡縣姦猾盜賊也若州牧能保盜賊不起者臣亦願以要斬保胸奴之不為邊害也今通西域則虜勢必弱虜勢弱則為患微矣孰與歸其府藏續其斷臂哉今置校尉以扜撫西域設長史以招懷諸國若棄而不立則西域望絶望絶之後屈就北虜緣邊之郡將受困害恐河西城門必復有晝閉之警矣今不廓開朝廷之德而拘屯戍之費若北虜遂熾豈安邊久長之策哉見後漢班勇傳對毛軫難太尉屬毛軫難曰今若置校尉則西域駱驛遣使求索無厭與之則費難供不與則失其心一旦為胸奴所迫當復求救則為役大矣勇對曰今設以西域歸胸奴而使其恩德大漢不為鈔盜則可矣如其不然則因西域租入之饒兵馬之衆以擾動緣邊是為富仇讎之財贈暴夷之勢也置校尉者宣威布德以擊諸國內向之心以疑胸奴覬覦之情而無財費耗國之慮也且西域之人無它求索其來入者不過稟食而已今若拒絶勢北屬夷虜并力以寇并涼則中國之費不止千億置之誠便見後漢班勇傳
