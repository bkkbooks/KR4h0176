body:
  text: 全後漢文卷二十七丁恭古帝王封諸侯不過百里古帝王封諸侯不過百里故利以建侯故利以建侯取法于雷取法于雷強幹弱枝強幹弱枝所以為治也所以為治也今封諸侯四縣今封諸侯四縣不合法則不合法則見後漢光武紀見後漢光武紀上疏陳洪範消災之術六沴作見若是供御帝用不差神則大喜五福乃降用章于下若不供御六罰既侵六極其下明供御則天報之福不供御則禍災至欲尊六事之體則貌言視聽思心之用治六事之揆以致乎太平而消除轗軻孼害也見續漢五行志一注補弔續漢書建武二年尹敏上疏戒子富貴盈溢未有能終者吾非不喜榮勢也天道惡滿而好謙前世貴戚皆明戒也保身全已豈不樂哉見後漢樊宏傳遺枚薄葬棺柩一臧不宜復見如有腐敗傷孝子之心見後漢樊宏傳上言選舉郡國舉孝廉率取年少能報恩者耆宿大賢多見廢棄宜敕郡國簡用良俊見後漢樊宏附傳上言理朱浮唐堯大聖兆人獲所尚優游四凶之獄厭服海內之心使天下咸知然後誅罰浮事雖昭明而未達人聽宜下廷尉章著其事見後漢朱浮傳奏正經義先帝大業當以時施行欲使諸儒共正經義頗令學者得以自助見後漢章帝紀上疏請興儒學臣聞賈誼有言人君不可以不學故雖大舜聖德孳孳為善成王賢主崇明師傅及光武皇帝受命中興群雄崩擾旌旗亂野東西誅戰不遑啟處猶然投戈講藝息馬論道至孝明皇帝兼天地之姿用日月之明庶政萬機無不簡心而垂情古典游意經藝每饗射禮畢正坐自講諸儒竝聽四方欣欣雖闕里之化矍相之事誠不足言又多徵名儒以充禮官如沛國趙孝琅邪承宮或安車結駟告歸鄉里或豐衣博帶從見宗廟其餘以經術見優者布在廊廟故朝多皤皤之良華首之老每讌會則論難衎衎共求政化詳覽群言響如振玉朝者進而思政罷者退而備問小大隨化雍雍可嘉期門羽林介冑之士悉通孝經博士議郎一人開門徒眾百數化自聖躬流及蠻荒匈奴遣伊秩訾王大車且渠來入就學八方肅清上下無事是以議者每稱盛時咸言永平今學者蓋少遠方尤甚博士倚席不講儒者競論浮麗忘謇謇之忠習諓諓之辭文吏則去法律而學詆欺銳錐刀之鋒斷刑辟之重德陋俗薄以致苛刻昔孝文竇后性好黃老而清靜之化流景武之閒臣愚以為宜下明詔博求幽隱發揚巖穴寵進儒雅有如孝宮者徵詣公車以俟聖上講習之期公卿各舉明經及舊儒子孫進其爵位使纘其業復召郡國書佐使讀律令如此則延頸者日有所見傾耳者月有所聞伏願陛下推述先帝進業之道見後漢樊準傳因水旱災異上疏臣聞傳曰飢而不損茲曰太厥災水春秋穀梁傳曰五穀不登謂之大侵大侵之禮百官備而不製群臣禱而不祠由是言之調和陰陽實在儉節朝廷雖勞心元元事從省約而在職之吏尚未奉承夫建化致理由近及遠故詩曰京師翼翼四方是則今可先令太官尚方考功上林池籞諸官實減速無事之物五府調省中都官京師作者如此則化及四方人勞省息伏見被災之郡百姓凋殘恐非賑給所能勝贍雖有其名終無其實可依征和元年故事遣使持節慰安尤困乏者徙置荊揚孰郡既省轉運之費且令百姓名安其所今雖有西屯之役宜先東州之急如遣使者與二千石隨事消息悉留富人守其舊土轉尤貧者過所衣食誠父母之計也願以臣言下公卿平議見後漢樊宏附傳上疏薦龐參臣聞鷙鳥累百不如一鶚昔孝文皇帝悟馮唐之言而赦魏尚之罪使為邊守匈奴不敢南向夫以一人之身折方面之難者選用得也臣伏見故左校令河南龐參勇謀不測卓爾奇偉高才武略有魏尚之風前坐微法輸作經時今羌戎為患大軍西屯臣以為如參之人宜在行伍惟明詔採前世之舉觀魏尚之風免赦參刑以為軍鋒必有成效宣助國威見後漢龐參傳上言義士劉茂臣前為赤眉所攻吏民壞亂奔走趣山臣為賊所圍命如絲發賴茂負臣踰城出保孟縣茂與弟觸冒兵刃緣山負食臣及妻子得度死命節義尤高宜蒙表擢以厲義士見後漢獨行劉茂傳口授答侯霸君房足下位至鼎足甚善懷仁輔義天下悅阿諛順旨要領絕見皇甫謐高士傳後漢嚴光傳上書薦王望劉曠王扶臣竊見琅邪王望楚國劉曠東萊王扶皆年七十執性恬淡所居之處邑里化之修身行義應在朝次臣誠不足知人竊慕推士進賢之義見後漢劉平傳諫起北宮疏伏見陛下以天時小旱憂念元元降避正殿躬自克責而比日密雲遂無大潤豈政有未得應天心者邪昔成湯遭旱以六事自責曰政不節邪使人疾邪宮室榮邪女謁盛邪苞苴行邪讒夫昌邪竊見北宮大作人失農時此所謂宮室榮也自古非苦宮室小狹但患人不安寍宜且罷止以應天心臣意以匹夫之才無有行能久食重祿擢備近臣比受厚賜喜懼相半不勝愚戇征營罪當萬死見後漢鍾離意傳未數年豫章遭蝗穀不收民飢死縣數千百人見續漢五行志三注補引謝沈書鍾離意諫起北宮表因變異上疏伏惟陛下躬行孝道修明經術郊祀天地畏敬鬼神憂恤黎元勞心不怠而天氣未和日月不明水泉湧溢寒暑違節者咎在群臣不能宣化理職而以苛刻為俗吏殺良人繼踵不絕百官無相親之心吏人無雍雍之志至于骨肉相殘毒害彌深感逆和氣以致天災百姓可以德勝難以力服先王要道民用和睦故能致天下和平災害不生禍亂不作鹿鳴之詩必言宴樂者以人神之心洽然後天氣和也願陛下垂聖德揆萬機詔有司慎人命緩刑罰順時氣以調陰陽垂之無極見後漢鍾離意傳又略見袁宏後漢紀九王望罪議昔華元子反楚宋之良臣不稟君命擅平二國春秋之義以為美談今望懷義忘罪當仁不讓若繩之以法忽其本情將乖聖朝愛育之旨見後漢劉平附傳牒白周樹宜部職賊曹吏周樹結髮佐吏服勤不懈果于從政行如玉石折而不撓謂宜部職見書鈔三十七引鍾離意別傳答府記詩曰刑于寡妻至于兄弟以御于家邦明正化之本由近及遠今宜明府內以及諸外且闊略遠縣細微事見袁宏後漢紀解士祝興功役者令百姓無事如有禍祟令自當之見後漢鍾離意傳注引東觀記臨終敕其子逢參等吾奉使不稱微功不立身死慚恨義不可以受賞賜汝等齎兵馬詣邊乞效死前行以副吾心見袁宏後漢紀十在岑彭營與田戎書岑將軍已奏我封五千戶侯虛心相待願急來無拘前圖見袁宏後漢紀四建武五年旱災對策百姓口苦士卒煩碎責租稅失中暴師外營經歷三時內有怨女外有曠夫王者熟推其祥揆合于天圖之事情旱災可除夫旱者過日天王無意于百姓恩德不行萬民煩擾故天應以無澤見續漢五行志一注補又對民悲怨則陰類彊河決海澹地動土涌見續漢五行志三注補駮三老答天子拜議養三老所以教事父之道也若答拜是使天下答子拜也見續漢禮儀志上注補議置常平倉對常平倉外有利民之名而內實侵刻百姓豪右因緣為姦小民不能得其平置之不便見後漢劉般傳上言實覈田畝郡國以官禁二業至有田者不得漁捕今濱江湖郡率少蠶桑民資漁採以助口實且以冬春閒月不妨農事夫漁獵之利為田除害以助穀食無關二業也又郡國以牛疫水旱墾田多減故詔敕區種增進頃畝以為民也而吏舉度田欲令多前至于不種之處亦通為租可申敕刺史二千石務令實覈其有增加皆使與奪田同罪見後漢劉般傳牧守宜同服制議詔書所以為制服之科者蓋崇化厲俗以弘孝道也今刺史一州之表二千石千里之師職在辯章百姓宣美風俗尤宜尊重典禮以身先之而議者不尋其端至子牧守則云不宜是猶濁其源而望流清曲其形而欲景直不可得也見後漢劉愷傳臧吏不得禁錮子孫議春秋之義善善及子孫惡惡止其身所以進人于善也尚書曰上刑挾輕下刑挾重如今使臧吏禁錮子孫以輕從重懼及善人非先王詳刑之意也見後漢劉愷傳廟祭議宜以宣元成哀平五帝四世代今親廟宣元皇帝尊為祖父可親奉祠成帝以下有司行事別為南頓君立皇考廟其祭上至舂陵節侯群臣奉祠以明尊尊之敬親親之恩見後漢張純傳河決上言河決積久日月侵毀濟渠所漂數十許縣修理之費其功不難宜改修隄防以安百姓見後漢王景傳上言止營河功昔元光之閒人庶熾盛緣隄墾殖而瓠子河決尚二十餘年不即壅塞今居家稀少田地饒廣雖未修理其患猶可且新被兵革方興力役勞怨既多民不堪命宜須平靜更議其事見後漢王景傳詔定古文官書序秦既焚書月患苦天下不從所改更而諸生到者拜為郎前後七百人乃密令種瓜于驪山阬谷中溫處瓜實成詔博士諸生說之人人不同乃令就親為伏機諸生賢儒皆至焉方相難不決因發機從上填之以土皆壓之終乃無聲見史記儒林傳序正義後漢陳蕃傳注徵之老不能行遣太常掌故晁錯往讀之年九十餘不能正言言不可曉使其女傳言教錯齊人語多與穎川異錯所不知者凡十二三略以其意屬讀已見史記鼂錯傳到江夏界移書夏喜等朝廷以太守能禽姦賊故辱斯任今勒兵界首檄到幸思自安之宜見後漢酷吏董宣傳上書求代歐陽歙伏見臣師大司徒歐陽歙學為儒宗八世博士而以臧咎當伏重辜歙門單子幼未能傳學身死之後永為廢絕上令陛下獲殺賢之譏下使學者喪師資之益乞殺臣身以代歙命見後漢歐陽歙傳上疏謝皇太子臣幸得侍帷幄執經連年而智學淺短無以補益萬分今皇太子以聰叡之姿通明經義觀覽古今儲君副主莫能專精博學若此者也斯誠國家福祐天下幸甚臣斯道已盡皆在太子謹使掾臣汜再拜歸道見後漢桓榮傳又見袁宏後漢紀八與此小異上疏皇太子伏見太子體性自然包含今古謙讓允恭天下共見郁父子受恩無以明益夙夜㘇懼誠思自竭愚以為太子上當合聖心下當卓絕于眾宜思遠慮以光朝廷見後漢桓郁傳注引東觀記七說香萁為飯雜以稉菰散如細蚳摶似凝膚河黿之羹齊以蘭梅芳芬甘旨未咽先滋見北堂書鈔一百四十四飯篇羹篇各引一條蓺文類聚五十七御覽八百五十又八百六十一䐑一元之膚膾挺祭之鮮銘方徽割不理雜猶亂絲聚若委采見北堂書鈔一百四十五膾篇又䐑篇引首句蒸剛肥之豚同上蒸篇炰柔毛之羜同上炰篇調脠和粉糅以橙蒟同上生脠篇椅梧與梓生乎曾崖上仰貫天之山下臨洞地之谿飛霜厲其末飆風激其崖孤琴徑其根雜鳥集其枝見蓺文類聚五十七王良相其左造父驂其右揮沫揚鑣倏忽長驅輪不暇轉足不及驟騰虛踰浮瞥若飆霧追慌忽逐無形速疾影之超表捷飛響之應聲超絕壑踰懸阜馳猛禽射勁鳥騁不失蹤滿不空發彈輕翼于高冥窮疾足于方外同上戲譚以要譽見文選蜀都賦注引桓譚七說乃桓麟之誤太尉劉寬碑公諱寬字文饒弘農華陰人也其先聖漢王侯繼次有國有號列存家序公之考乃作司徒輔毗安順勳載二葉公託受純和之氣體有樂道寍儉之性疾雕飾尚樸素輕榮利重謙讓幼與同好鐫墳典于茅廬是以根經緯綜精微誨童冠而不倦伉浮雲之志三公莫能致之大將軍以禮脅命舉高第拜侍御史遷梁令垂康踰產豹喪舊君以棄官遵洙泗之業有悔仕思初之計三府竝招博士徵皆辭疾不就司隸舉茂材大尉舉有道公車徵拜議郎司徒長史入登侍中宣美顧問延熹八年地震有詔詢異公以演策沈漸對當帝心轉拜尚書齊密機喉王命惟允遷東海相以德興化澤臻民物復遷南陽太守壹行質省𥳑易之教推貞諒以示下顯眾善以厲否惻隱之誠通乎神人故能去鞭扑如獲其情弗用刑如弭其姦帝初即位開學稽古詶咨儒林僉曰公優徵拜大中大夫納用勸講復拜侍中屯騎校尉宗正光祿勳遂授大尉悉謨百揆四門之職懷夫三事如昭鼎實功成則退固疾遜位拜光祿大夫遷衛尉復作大尉每執盤桓成則三讓以交會精引咎折躬朝克忠讜思其良猶即召里巷拜永樂少府光祿勳先是時也狂寇張角妖逆公卬觀見像上遏其源未遝誅討亂作不旋帝乃追寶先謀錫之土田封逯鄉侯食邑六百戶年六十有六中平二年二月丁卯薨天子閔悼惻怛內發手筆為策涕咨嗟使右中郎將張良持節臨弔贈車騎將軍印綬位特進賜琀賵襚有加典禮復使五官中郎將何夔持節諡曰昭烈侯夏四月庚戍葬公卿百寮縉紳之徒其會如雲可謂其存也榮其亡也哀者焉于是故吏李謙等有感殷魯述德之頌以為洪懿休策宜著無窮故雜論攸行紀其大略鐫石立碑其辭曰於穆顯融惟予公侯纘我前烈克明厥繇熙精恬默潛庸底昭德以莅政俾民是其樂伊何匪誘匪威允丕禮讓實化玄為入口誨保訓導萬機作鎮上司御勸不迷溫溫其恭尹實秪秩秩其苞群儒實師奕奕其容𥈬裔刊眡萬祀孰嗣厥徽見隸釋十一又略見蓺文類聚四十六七設新城之秔雍丘之粱重穋代孰既滑且香精稗細麪芬糜異粻見北堂書鈔一百四十二酒食總篇又一百四十四飯篇三牲之供鯉魮之鱠飛刀徽整疊似蚋羽同上總篇又一百四十五膾篇引兩條口口大武牷犢栗梁剛巤奉豕肥腯云羊合以水火之齊和以五味之芳同上總篇菰粱雪累班臠錦文又一百四十五肉篇遺陳業書不因行李以係陰山白樓日從容養高動靜履直季世多艱爰適樂土側聞高風飢渴話言知迺深隱邈然終時求仁斯得勤而無憾齊蹤古賢何其優哉見蓺文類聚三十一引會稽典錄移記九江屬縣夫虎豹在山黿鼉在淵物性之所託故江淮之閒有猛獸猶江北之有雞豚今數為民害者咎在貪殘居職使然而返逐捕非政之本也壞檻穽勿復課錄退貪殘進忠良見風俗通二又見後漢宋均傳下書浚遵縣巫自今以後為山娶者皆娶巫家勿擾良民見後漢宋均傳諫留諸王不遣就國疏陛下至孝烝烝恩愛隆深以濟南王康中山王焉先帝昆弟特蒙禮寵聖情戀戀不忍遠離比年朝見久留京師崇以叔父之尊同之家人之禮車入殿門即席不拜分甘損膳賞賜優渥昔周公懷聖人之德有致太平之功然後王曰叔父加以賜幣今康焉幸以支庶享食大國陛下即位蠲除前過還所削黜衍食它縣男女少長竝受爵邑恩寵踰制禮敬過度春秋之義諸父昆弟無所不臣所以尊尊卑卑強幹弱枝者也陛下德業隆盛當為萬世典法不宜以私恩損上下之序失君臣之正又西平王羨等六王皆妻子成家官屬備具當早就蕃國為子孫基阯而室第相望久磐京邑婚姻之盛過于本朝僕馬之眾充塞城郭驕奢僭擬寵祿隆過今諸國之封竝皆膏腴風氣平調道路夷近朝聘有期行來不難宜割情不忍以義斷恩發遣康焉各歸蕃國令羨等速就便時以塞眾望見後漢宋意傳上疏請不許南單于北徙夫戎狄之隔遠中國幽處北極界以沙漠𥳑賤禮義無有上下強者為雄弱即屈服自漢興以來征伐數矣其所獲曾不補害光武皇帝躬服金革之難深昭天地之明故因其來降羈縻畜養邊人得生勞役休息于茲四十餘年矣今鮮卑奉順斬獲萬數中國坐享大功而百姓不知其勞漢興功烈于斯為盛所以然者夷虜相攻無損漢兵者也臣察鮮卑侵伐匈奴止是利其抄掠及歸功聖朝實出貪得重賞今若聽南虜還都北庭則不得不禁制鮮卑鮮卑外失暴掠之願內無功勞之賞豺狼貪婪必為邊患今北虜西遁請求和親宜因其歸附以為外扞巍巍之業無以過此若引兵費賦以順南虜則坐失上略去安即危矣誠不可許見後漢宋意傳匈奴處北種介以沙漠簡賤禮儀衣食殊俗此乃天一種民也自漢興以來數發兵攻之所得輒不足以復所害呼韓邪單于奉藩然中國亦疲于送迎之勞矣光武皇帝躬擐金甲之難深明天地之界故因其來降寵立以為單于羈縻畜養邊民得以休息迄今四十餘年今鮮卑奉順威靈斬獲北單于名王已下萬計中國坐享其功而百姓不知其勞漢興功烈于斯為盛今南單于還塞外所謂虎出于檻也必興兵要利內恃于漢其事得浸滋不息而設費不得已無故以萬全之計而徵不可必之功未見其聖也見袁宏後漢紀十二
