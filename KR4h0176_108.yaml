body:
  text: 杜篤祓禊賦巫咸之徒秉火祈福見續漢禮儀志上注補王侯公主暨乎富商用事伊雒帷幔玄黃于是旨酒嘉肴方丈盈前浮棘絳水酹酒醲川若乃窈窕淑女美媵豔姝戴翡翠珥明珠曳離袿立水涯微風掩壒纖縠低回蘭蘇肸蠁感動情魂若乃隱逸未用鴻生俊儒冠高冕曳長裾坐沙渚談詩書詠伊呂歌唐虞見蓺文類聚四首陽山賦嗟首陽之孤嶺形勢窟其槃曲面河源而抗巖隴塠隈而相屬長松落落卉木蒙蒙青羅落漠而上覆穴溜滴瀝而下通高岫帶乎巖側洞房隱于雲中忽吾覩兮二老時采薇以從容于是乎乃訊其所求問其所修州域鄉黨親戚匹儔何務何樂而並茲遊矣其二老乃答余曰吾殷遺民也厥胤孤竹作蕃北湄少名叔齊長曰伯夷聞西伯昌之善教育年艾胡耇遂相攜而隨之冀寄命乎餘壽而天命之不常伊事變而無方昌伏事而畢命子忽遘其不祥乃興師于牧野遂干戈以伐商乃棄之而來遊誓不步于其鄉余閉口而不食並卒命于山傍見蓺文類聚七九折崣㠑而多艱見文選天台山賦注論都賦臣聞知而復知是為重知臣所欲言陛下已知故略其梗概不敢具陳昔般庚去奢行儉于亳成周之隆迺即中洛遭時制都不常厥邑賢聖之慮蓋有優劣霸王之姿明知相絕守國之埶同歸異術或棄去阻阸務處平易或據山帶河并吞六國或富貴思歸不顧見襲或掩空擊虛自蜀漢出即日車駕策由一卒或知而不從久都墝埆臣不敢有所據竊見司馬相如楊子雲作辭賦以諷主上臣誠慕之伏作書一篇名曰論都謹并封奏如左皇帝以建武十八年二月甲辰升輿洛邑巡于西嶽推天時順斗極排閶闔入函谷觀阸于崤黽圖險于隴蜀其三月丁酉行至長安經營宮室傷愍舊京即詔京兆迺命扶風齋肅致敬告覲園陵悽然有懷祖之思喟乎以思諸夏之隆遂天旋雲游造舟于渭北斻涇流千乘方轂萬騎駢羅衍陳于岐梁東橫乎大河瘞后土禮邠郊其歲四月反于洛都明年有詔復函谷關作大駕宮六王邸高車廄于長安修理東都城門橋涇渭往往繕離觀東臨霸滻西望昆明北登長平規龍首撫未央覛平樂儀建章是時山東翕然狐疑意聖朝之西都懼關門之反拒也客有為篤言彼埳井之潢汙固不容夫吞舟且洛邑之渟瀯曷足以居乎萬乘哉咸陽守國利器不可久虛以示姦萌篤未甚然其言也故因為述大漢之崇世據廱州之利而今國家未暇之故以喻客意曰昔在強秦爰初開畔霸自岐廱國富人衍卒以并兼桀虐作亂天命有聖託之大漢大漢開基高祖有勳斬白蛇屯黑雲聚五星于東井提干將而呵暴秦蹈滄海跨崑崙奮彗光掃項軍遂濟人難蕩滌於泗沂劉敬建策初都長安太宗承流守之以文躬履節儉側身行仁食不二味衣無異采賑人以農桑率下以約己曼麗之容不悅于目鄭衛之聲不過于耳佞邪之臣不列於朝巧偽之物不鬻于市故能理升平而刑幾措富衍于孝景功傳于後嗣是時孝武因其餘財府帑之蓄始有鉤深圖遠之意探冒頓之罪校平城之讎遂命票騎勤任衛青勇惟鷹揚軍如流星深之匈奴割裂王庭席卷漠北叩勒祁連橫分單于屠裂百蠻燒罽帳繫閼氏燔康居灰珍奇椎鳴鏑釘鹿蠡馳阬岸獲昆彌虜䌰侲驅騾驢馭宛馬鞭駃騠拓地萬里威震八荒肇置四郡據守敦煌并域屬國一郡領方立候隅北建護西羌捶驅氐僰寥狼邛莋東攠烏桓蹂轔濊貊南羈鉤町水劍強越殘夷文身海波沫血郡縣日南漂概朱崖部尉東南兼有黃支連緩耳瑣雕題摧天督牽象犀椎蚌蛤碎瑠璃甲瑇瑁戕觜觿于是同穴裘褐之域共川鼻飲之國莫不袒跣稽顙失氣虜伏非夫大漢之盛世藉廱土之饒得御外理內之術孰能致功若斯故創業于高祖嗣傳于孝惠德隆于太宗財衍于孝景威盛于聖武政行于宣元侈極于成哀祚缺于孝平傳世十一歷載三百德衰而復盈道微而復章皆莫能遷於廱州而背于咸陽宮室寢廟山陵相望高顯弘麗可思可榮羲農已來無茲著明夫廱州本帝皇所以育業霸王所以衍功戰士角難之場也禹貢所載厥田惟上沃野千里原隰彌望保殖五穀桑麻條暢濱據南山帶以涇渭號曰陸海蠢生萬類楩枏檀柘蔬果成實畎瀆瀆潤淤水泉灌溉漸澤成川粳稻陶遂厥土之膏畝價一金田田相如鐇钁株林火耕流種功淺得深既有蓄積阸塞四臨西被隴蜀南通漢中北據谷口東阻嶔巖關函守嶢山東道窮置列汧隴廱偃西戎拒守褒斜嶺南不通杜口絕津朔方無從鴻渭之流徑入于河大船萬艘轉漕相過東綜滄海西綱流沙朔南暨聲諸夏是和城池百尺㡘塞要害關梁之險多所衿帶一卒舉礧千夫沈滯一人奮戟三軍沮敗地埶便利介冑剽悍可與守近利以攻遠士卒易保人不肉袒肇十有二是為贍腴用霸則兼并先據則功殊修文則財衍行武則士要為政則化上篡逆則難誅進攻則百剋退守則有餘斯固帝王之淵囿而守國之利器也逮及亡新時漢之衰偷忍淵囿篡器慢違徒以勢便莫能卒危假之十八誅自京師天畀更始不能引維慢藏招寇復致赤眉海內雲擾諸夏滅微群龍並戰未知是非于時聖帝赫然申威荷天人之符兼不世之姿受命於皇上獲助于靈祇立號高邑搴旗四麾首策之臣運籌出奇虓怒之旅如虎如螭師之攸向無不靡披蓋夫燔魚剸蛇莫之方斯大呼山東響動流沙要龍淵首鏌鋣命騰太白親發狼弧南禽公孫北背強胡西平隴冀東據洛都迺廓平帝宇濟蒸人于塗炭成兆庶之亹亹遂興復乎大漢今天下新定矢石之勤始瘳而主上方以邊垂為憂念葭萌之不柔未遑于論都而遺思廱州也方躬勞聖思以率海內厲撫名將略地疆外信威于征伐展武乎荒裔若夫文身鼻飲緩耳之主椎結左衽鐻鍝之君東南殊俗不羈之國西北絕域難制之鄰靡不重譯納貢請為藩臣上猶謙讓而不伐勤意以為獲無用之虜不如安有益之民略荒裔之地不如保殖五穀之淵遠救于已亡不若近而存存也今國家躬修道德吐惠含仁湛恩沾洽時風顯宣徒垂意于持平守實務在愛育元元苟有便于王政者聖主納焉何則物罔挹而不損道無隆而不移陽盛則運陰滿則虧故存不忘亡安不諱危雖有仁義猶設城池也客以利器不可久虛而國家亦不忘乎西都何必去洛邑之渟瀯與見後漢杜篤傳又略見蓺文類聚六十一書㨭賦惟書㨭之麗容象君子之淑德載方矩而履規加文藻之脩飾能屈伸以和禮體清淨而坐立承尊者之至意惟高下而消息雖轉旋而屈橈時傾斜而反側抱六蓺而卷舒敷六經之典式見蓺文類聚五十五御覽六百六眾瑞賦夫千金之裘非一狐之白雅頌之聲非一家之作也見北堂書鈔一百二十九猛將與虜交鋒見文選潘岳關中詩注千里遙思展轉反側見文選雪賦注通邊論匈奴請降毾㲪罽褥帳幔氈裘積如丘山見御覽七百八引杜篤邊論親錄譯導緩步四來見文選魏都賦注展武論文越水震鄉風仰流見文選王融曲水詩序注論天下殷富見北堂書鈔十五連珠能離光明之顯長吟永嘯見文選蜀都賦注又嵇康幽憤詩注贈秀才入軍詩注迎鍾之必令河伯戒道見文選赭白馬賦注禖祝懷季女使不餐見文選洛神賦注又曹植美女篇注作不餐大司馬吳漢誄篤以為堯隆稷契舜嘉皋陶伊尹佐殷呂尚翼周若此五臣功無與疇今漢吳公追而六之乃作誄曰朝失鯁臣國喪牙爪天子愍悼中宮咨嗟四方殘暴公不征茲征茲海內公其攸平泯泯群黎賴公以寍勳業既崇持盈守虛功成即退挹而損諸死而不朽名勒丹書功著金石與日月俱見蓺文類聚四十七弔比干文敬申弔于比干寄長懷于尺牘見文選謝譫王撫軍庾西陽集別詩注奏諫行均輸法王制天子不言有無諸侯不言多少食祿之家不與百姓爭利今均輸之法與賈販無異鹽利歸官則下人窮怨布帛為租則吏多姦盜誠非明主所當施行見後漢朱暉傳議布帛為租官自賣鹽王制天子不言有無諸侯不言多少食祿者不與百姓爭利均輸之法與賈販無異以布帛為祖則吏多姦官自賣鹽與下爭利非明主所宜行見晉食貨志卷十六鬱金賦歲朱明之首月兮步南園以迥眺覽草木之紛葩兮美斯華之英妙布綠葉而挺心吐芳榮而發曜眾華爛以俱發鬱金邈其無雙比光榮于秋菊齊英茂乎春松遠而望之粲若羅星出雲垂近而觀之曄若丹桂曜湘涯赫乎扈扈萋兮猗猗清風逍遙芳越景移上灼朝日下映蘭池覩茲榮之瑰異副歡情之所望折英華以飾首曜靜女之儀光瞻百草之青青羌朝榮而夕零美鬱金之純偉獨彌日而久停晨露未晞微風肅清增妙容之美麗發朱顏之熒熒作椒房之珍玩超眾葩之獨靈見蓺文類聚八十一丹桂植其東見文選吳都賦注又魯靈光殿賦注上疏請罷省宦官案漢故事中常侍參選士人建武以後乃悉用宦者自延平以來浸溢貴盛假貂璫之飾處常伯之任天朝政事一更其手權傾海內寵貴無極子弟親戚竝荷榮任故放濫驕溢莫能禁禦凶狡無行之徒媚以求官恃勢怙寵之輩漁食百姓窮破天下空竭小人愚臣以為可悉罷省遵復往初率由舊章更選海內清淳之士明達國體者以補其虛即陛下可為堯舜之君眾僚皆為稷契之臣兆庶黎民蒙被聖化矣見後漢朱穆傳又見袁宏後漢紀二十二有刪節上疏養魚沸鼎之中棲鳥烈火之上用之不時必見燋爛見文選丘遲與陳伯之書注又范蔚宗後漢皇后紀論注竝引袁崧後漢書奏劾馮緄臣聞出郊之事將軍制之所以崇威信合事宜也即緄有嫌不當荷任即緄無嫌義不見疑樂羊戰國陪臣猶賴見信之主以全其功況唐虞之朝而有猜嫌之事哉緄設虛端以自阻衛為臣不忠見袁宏後漢紀二十二奏記大將軍梁冀穆伏念明年丁亥之歲刑德合于乾位易經龍戰之會其文曰龍戰于野其道窮也謂陽道將勝而陰道負也今年九月天氣鬱冒五位四候連失正氣此互相明也夫天地大驗善道屬陽惡道屬陰若修正守陽摧折惡類則福從之矣穆每事不逮所好唯學傳受于師時有可試願將軍少察愚言申納諸儒而親其忠正絕其姑息專心公朝割除私欲廣求賢能斥遠佞惡夫人君不可不學當以天地順道漸漬其心宜為皇帝選置師傅及侍講者得小心忠篤敦禮之士將軍與之俱入參勸講授師賢法古此猶倚南山坐平原也誰能傾之今年夏月暈房星明年當有小戹宜急誅姦臣為天下所怨毒者以塞災咎議郎大夫之位本以式序儒術高行之士今多非其人九卿之中亦有乖其任者惟將軍察焉見後漢朱穆傳又見袁宏後漢紀二十有小異復奏記粱冀古之明君必有輔德之臣規諫之官下至器物銘書成敗以防遺失故君有正道臣有正路從之如升堂違之如赴壑今明將軍地有申伯之尊位為群公之首一日行善天下歸仁終朝為惡四海傾覆頃者官人俱匱加以水螽為害而京師諸官費用增多詔書發調或至十倍河內一郡常調縑素綺縠纔八萬餘匹今乃十五萬匹各言官無見財皆當出于民民多流亡皆虛張戶口戶口既少而無貲者多當復搒掠割剝彊令充足公賦既重私斂又深二千石牧守長吏多非德選貪聚無厭遇民如虜賣用田宅或絕命于箠楚之下或自賊於迫切之求大小無聊朝不保暮又有浮游之人稱矯買販不良長吏望為驅使令家人詐乘其勢又掠奪百姓此類交錯不可分別輒以託名尊府遂令將軍結怨天下吏民酸毒道路歎嗟昔秦政煩苛百姓土崩陳勝奮臂一呼天下鼎沸而面諛之臣猶言安耳諱惡不悛卒至亡滅近永和之末綱紀少弛頗失人望四五歲耳而財空戶散下有離心興徒發使不復應命懷糧廩兵云當向雜馬免之徒乘敝而起荊揚之間幾成大患幸賴順烈皇后初政清靜內外同力僅乃討定乃獲安寍今民心事勢復更戚戚困于永和內非仁愛之心可得容忍外非守國之計所宜久安也夫將相大臣均體元首共輿而馳同舟而濟輿傾舟覆患實共之豈可日去明即昧履危自安主孤時困而莫之恤乎撫安之急誠在大將軍先易二千石長史非其人者減省第宅園池之費拒絕郡國諸所奉送內以自明外解人惑使挾姦之吏無所依託司察之臣得盡耳目憲度既張遠邇清一則將軍身尊事顯德燿無窮天道明察無言不信今日行之則今日從矣惟垂省覽見袁宏後漢紀二十後漢朱穆傳各有刪節合錄成篇又奏記梁冀大將軍內有貴親之固外有功業之重誠不可復枉道散財以事左右近臣宦者選舉刑賞有干典制輒率公卿詣朝堂案其罪咎則改節從訓猶影響也今反越津逾序以大事小以明事闇從其過言隨其失行天下之事受其枉戾傷損財物壞亂綱紀左右近官竝以私情干擾天下雖大而民無所容足也餘尚可忍官位之事尤不可私毒害流布日夜廣遠願大將軍省廢他事十刻之閒考案古今官民之極廣數作趣較然可見如不早悟舟中之人皆敵國也若以穆輕愚不信其言可呼所親識古今者請徵核其實不可不誡懼有後恨見袁宏後漢紀二十與劉伯宗絕交書昔我為豐令足下不遭母憂乎親解縗絰來入豐寺及我為侍書御史足下親來入臺足下今為二千石我下為郎乃反因計吏以謁相與足下豈丞尉之徒我豈足下部民欲以此謁為榮寵乎咄劉伯宗于仁義道何其薄哉見後漢朱穆傳注引穆集留板與冀州從事書勿畫我形以為重負忠義之未顯何形像之足紀也見後漢朱穆傳注引謝承書崇厚論夫俗之薄也有自來矣故仲尼歎曰大道之行也而丘不與焉蓋傷之也夫道者以天下為一在彼猶在己也故行違于道則愧生于心非畏義也事違于理則負結于意非憚禮也故率性而行謂之道得其天性謂之德德性失然後貴仁義是以仁義起而道德遷禮法興而淳樸散故道德以仁義為薄淳樸以禮法為賊也夫中世之所敦已為上世之所薄況又薄于此乎故夫天不崇大則覆幬不廣地不深厚則載物不博人不敦龐則道數不遠昔在仲尼不失舊于原壤楚嚴不忍章于絕纓由此觀之聖賢之德敦矣老氏之經曰大丈夫處其厚不處其薄居其實不居其華故去彼取此夫時有薄而厚施行有失而惠用故覆人之過者敦之道也救人之失者厚之行也往者馬援深昭此道可以為德誡其兄子曰吾欲汝曹聞人之過如聞父母之名耳可得聞口不得言斯言要矣遠則聖賢履之上世近則邴吉張子孺行之漢廷故能振英聲于百世播不滅之遺風不亦美哉然而時俗或異風化不敦而尚相誹謗謂之臧否記短則兼折其長貶惡則并伐其善悠悠者皆是其可稱乎凡此之類豈徒乖為君子之道哉將有危身累家之禍焉悲夫行之者不知憂其然故害興而莫之及也斯既然矣又有異焉人皆見之而不能自遷何則務進者趨前而不顧後榮貴者矜己而不待人智不接愚富不賑貧貞士孤而不恤賢者戹而不存故田蚡以尊顯致安國之金淳于以貴勢引方進之言夫以韓翟之操為漢之名宰然猶不能振一貧賢薦一孤士又況其下者乎此禽息史魚所以專名于前而莫繼于後者也故時敦俗美則小人守正利不能誘也時否俗薄雖君子為邪義不能止也何則先進者既往而不反後來者復習俗而追之是以虛華盛而忠信微刻薄稠而純篤稀斯蓋谷風有棄予之歎伐木有鳥鳴之悲矣嗟乎世士誠躬師孔聖之崇則嘉楚嚴之美行希李老之雅誨思馬援之所尚鄙二宰之失度美韓稜之抗正貴丙張之弘裕賤時俗之誹謗則道豐績盛名顯身榮載不刊之德播不滅之聲然後知薄者之不足厚者之有餘也彼與草木俱朽此與金石相傾豈得同年而語竝日而談哉見後漢朱穆傳絕交論或曰子絕存問不見客亦不答也何故曰古者進退趨業無私遊之交相見以公朝享會以禮紀否則朋徒受習而已曰人將疾子如何曰寍受疾曰受疾可乎曰世之務交遊也久矣不敦于業不忌于君犯禮以追之背公以從之其愈者則孺子之愛也其甚者則求蔽過竊譽以贍其私利進義退公輕私重居勞于聽也或于道而求其私贍矣是故遂往不反而莫敢止焉是川瀆竝決而莫敢之塞游豶蹂稼而莫之禁也詩云威儀棣棣不可選也後生將復何述而吾不才焉能規此實悼無行子道多闕臣事多尤思復白圭重考古言以補往過時無孔堂思兼則滯匪有廢也則亦焉興是以敢受疾也不亦可乎見後漢朱穆傳注引穆集又略見蓺文類聚二十一御覽四百十
