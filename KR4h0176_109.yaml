body:
  text: 任末敕兄子造必致我尸于師門使死而有知魂靈不慚如其無知得土而已見後漢儒林任末傳上言宜制漢禮漢再受命仍有封禪之事而禮樂崩闕不可為後嗣法五帝不相沿樂三王不相襲禮大漢當自制禮以示百世見後漢曹褎傳又見袁宏後漢紀十二有小異封禪議殷統未絕黎庶繼命高宗久勞猶為中興武王因父受命之列據三代郊天因孔子甚美其功後世謂之聖王漢統中絕王莽盜位一民莫非其臣尺地靡不其有宗廟不祀十有八年陛下無十室之資奮振于匹夫除殘去賊興復祖宗集就天下海內治平夷狄慕義功德盛于高宗武王宜封禪為百姓祈福親定刻石紀號文太常奏儀制見續漢祭祀志上注引東觀書博士充等議奏上疏請定漢禮昔者聖人受命而王莫不制禮作樂以著功德功成作樂化定制禮所以救世俗致禎祥為萬姓獲福于皇天者也今皇天降祉嘉瑞竝臻制作之符甚于言語宜定文制著成漢禮丕顯祖宗盛德之美見後漢曹褎傳又見袁宏後漢紀十二元和二年原盜敕夫絕人命者天亦絕之皋陶不為盜制死刑管仲遇盜而升諸公今承旨而殺之是逆天心順府意也其罰重矣如得全此人命而身坐之吾所願也見後漢曹褎傳禮論漢初朝制無文叔孫通頗采禮經參酌秦法雖適物觀時有救崩弊先王之宏典蓋多闕文見初學記二十一上言理徐匡信陽侯就倚恃外戚干犯乘輿無人臣禮為大不敬匡執法守正反下于理臣恐聖化由是而弛見後漢吳良傳封禪儀記建武三十二年車駕東巡狩正月二十八日發雒陽宮二月九日到魯遣守謁者郭堅伯將徒五百人治泰山道十日魯遣宗室諸劉及孔氏瑕丘丁氏上壽受賜皆詣孔氏宅賜酒肉十一日發十二日宿奉高是日遣虎賁郎將先上山三案行還益治道徒一千人十五日始齋國家居太守府舍諸王居府中諸侯在縣庭中齋諸卿校尉將軍大夫黃門郎百官及宋公衛公褎城侯東方諸侯雒中小侯齋城外汶水上太尉太常齋山虞馬第伯自云某等七十人先之山虞觀祭山壇及故明堂宮郎官等郊肆處入其幕府觀治石石二枚狀博平圓九尺此壇上石也其一石武帝時石也時用五車不能上也因置山下為屋號五車石四維距石長丈二尺廣二尺厚尺半所四枚檢石長三尺廣六寸狀如封篋長檢十枚一紀號石高丈二尺廣三尺厚尺二寸名曰立石一枚刻文字紀功德是朝上山騎行往往道峻峭下騎步牽馬乍步乍騎且相半至中觀留馬去平地二十里南向極望無不覩仰望天關如從谷底仰觀抗峰其為高也如視浮雲其峻也石壁窅窱如無道徑遙望其人端端如杅升或以為小白石或以為冰雪久之白者移過樹乃知是人也殊不可上四布僵臥石上有頃復蘇亦賴齎酒脯處處有泉水目輒為之明復勉強相將行到天關自以已至也問道中人言尚十餘里其道旁山脅大者廣八九尺狹者五六尺仰視巖石松樹鬱鬱蒼蒼若在雲中俯視谿谷碌碌不可見丈尺遂至天門之下仰視天門窔遼如從穴中視天窗矣直上七里賴其羊腸逶迤名曰環道往往有絚索可得而登也兩從者扶掖前人相牽後人見前人履底前人見後人頂如畫重累人矣所謂磨胸𢱲石捫天之難也初上此道行十餘步一休稍疲咽脣焦五六步一休蹀蹀據頓地不避溼闇前有燥地目視而兩腳不隨早食上哺後到天門郭使者得銅物銅物形狀如鍾又方柄有孔莫能識疑封禪具也得之者汝南召陵人姓楊名通東上一里餘得木甲木甲者武帝時神也東北百餘步得封所始皇立石及闕在南方漢武在其北二十餘步得北垂圓臺高九尺方圓三丈所有兩陛人不得從上從東陛上臺上有壇方一丈二尺所上有方石四維有距石四面有闕鄉壇再拜謁人多置錢物壇上亦不掃除國家上壇見酢棃酸棗狼藉散錢數百幣帛具詔問其故主者曰是武帝封禪至泰山下未及上百官為先上跪拜置棃棗錢于道以求福即此也上曰封禪大禮千載一會衣冠士大夫何故爾也泰山東上七十里至天門東南山頂名曰日觀日觀者雞一鳴時見日始欲出長三尺所秦觀者望見長安吳觀者望見會稽周觀者望見齊黃河去泰山二百餘里于祠所瞻黃河如帶若在山址山南有廟悉種柏千株大者十五六圍相傳云漢武所種小天門有秦時五大夫松始皇封太山逢疾風暴雨賴得松樹因復其下封為五大夫西北有石室壇以南有玉盤中有玉龜山南脅神泉飲之極清美利人日入下去行數環日暮時頗雨不見其道一人居其前先知蹈有人乃舉足隨之比至天門下夜人定矣車駕十九日之山虞國家居亭百官布野此日山上雲氣成宮闕百官竝見之二十一日夕牲時白氣廣一丈東南極望致濃厚時天清和無雲瑞命篇岱嶽之瑞以日為應也二十二日辛卯晨燎祭天于泰山晨祭也日高二丈所燔燎烟正北鄉禮畢百官各以次上郡儲輦三百為貴臣諸公王侯卿大夫百官皆步上少用輦輦者國家御首輦人輓升山至中觀休止須臾復上日中到山須臾群臣畢就位國家臺上北面虎賁陛戟臺下尚書令奉玉牒檢南面跪太常曰請封皇帝親封畢退復位騶騎二千餘人發壇上方石即武帝封處累其石尚書令藏玉牒書復封石檢以金為繩以石為泥南方北方各二檢東方西方各三檢檢中石泥及壇土色青赤白黑各依如其方色大行禮畢太常曰請拜皇帝再拜群臣皆稱萬歲音動山谷有白氣一丈東南正直壇所有青氣上與天屬遙望不見山嶺山嶺人在氣中不知也封畢有頃詔百官以次下國家隨後數百人維持行相逢推百官連延二十餘里道多迫小深谿高岸數百丈步從匍匐邪上起近距火止赤駱驛步從觸擊大石石聲正讙但讙石見相應和者腸不能已口不能默夜半後到百官明日乃訖其中老者氣劣不能行臥巖石下明日早太醫令復遵問起居國家云昨上下山欲行迫前欲休則後人所蹈道峻危險恐不能度國家不勞百官以下露臥水飲無一人蹉跌無一人疾病豈非天邪泰山率多暴雨如今上直下柴祭封登清晏溫和功效如彼天應如此明日群臣上壽國家不聽賜百官省事事畢發暮宿奉高三十里二十四日發至梁甫九十里夕牲二十五日禪祭地于梁陰陽者祭天陰者祭地始元舊禮以高帝配天高后配地見續漢祭祀志上注引十二條水經汶水篇注舊寫本書鈔九十一引六條又一百四又一百四十又一百四十九一百五十一蓺文類聚一又六又三十九引三條又八十八初學記五引四條白孔六帖十三通典五十四御覽四又十五又三十九引兩條又五十二一百七十九一百八十八七百五十八八百五八百七十二九百五十三九百六十五九百六十九錦繡萬花谷十五通共四十九條合錄成篇上疏諫置官選職不以才臣聞政化之本必順陰陽伏見立夏以來當暑而寒殆以刑罰刻急郡國不奉時令之所致也農人急于務而苛吏奪其時賦發充常調而貪吏割其財此其巨患也夫欲急人所務當先除其所患天下樞要在于尚書尚書之選豈可不重而閒者多從郎官超升此位雖曉習文法長於應對然察察小慧類無大能宜簡嘗歷州宰素有名者雖進退舒遲時有不逮然端心向公奉職周密宜鑒嗇夫捷急之對深思絳侯木訥之功也往時楚獄大起故置令史以助郎職而類多小人好為姦利今者務簡可皆停省又諫議之職應用公直之士通才謇正有補益于朝者今或從徵試輩為大夫又御史外遷動據州郡竝宜清選其任責以言績其二千石視事雖久而為吏民所便安者宜增秩重賞勿妄遷徙維留聖心見後漢韋彪傳又略見御覽三十四引謝承後漢書又蓺文類聚四十八引華嶠後漢書建言封蕭何等後裔今西巡舊都宜追錄高祖中宗功臣襃顯先勳紀其子孫見後漢韋彪傳郡國貢舉議伏惟明詔憂勞百姓察察不舍晝夜垂恩選舉必務得其人夫國以簡賢為務賢以孝行為首孔子曰事親孝故忠可移于君是以求忠臣必于孝子之門夫人才行少能相兼是以孟公綽優于魏老不可以為滕薛大夫忠孝之人治心近厚鍛練之吏治心近薄三代之所以直道而行者在其所以磨之故也士宜以才行為先不可純以閥閱取然其要歸在于選二千石二千石賢則貢舉皆得其人矣後漢韋彪傳袁宏後漢記十一通典十六二千石皆已選出京師剖符典千里見文選嵇康襍詩注引東觀漢記韋彪上議上書薦王充充之天才非學所加雖前世孟軻孫卿近漢揚雄劉向司馬遷不能過也見後漢王充傳與張涼州書今致碧綾車中盾一見御覽三百五十七敕子漢末當有發冢露體之禍使縣棺下莽墓不起墳見御覽五百五十六引會稽典錄疾篤上書臣東野頑闇本無尺寸之功橫蒙大恩仍登上司中夜怵愓懼有折足之戒自揆愚薄無益國家之事雖有殺身焉可謝責是以不敢雷同指陳竇憲姦不慣漏露言出患入竇憲之姦惡貫天達地毒流八荒虐聞四極海內疑惑賢愚疾惡憲何術以迷主上流言噂𠴲深可歎息昔田氏篡齊六卿分晉漢事不遠炳然可見陛下處天子之尊自謂保萬世之𧙓無復累卵之危信讒佞之臣不計存亡之機臣雖弱疾命在移晷身沒之日死不忘忠願陛下為堯舜之君誅四凶之罪以素厭人鬼憤結之望見袁宏後漢紀十二元和三年奏議尚書郎令史開選臺職雖尊而酬賞甚薄至於于筵多無樂者請史郎補千石令史為長見後漢鄭弘傳薦劉般般在國口無擇言行無怨惡宜蒙旌顯以勸天下見袁宏後漢紀上言願發秦昭王呂不韋冢臣聞秦昭王與呂不韋好書皆以書葬王至尊不韋久貴冢皆以黃腸題湊處地高燥未壞臣願發昭王不韋冢視未燒詩書見御覽五百六十引皇覽冢墓記春秋左氏傳義詁序先生名奇字子異其先魯人即襃成君次孺第二子之後也家於茂陵以世學之門未嘗就遠方師也唯兄君魚少從劉子駿受春秋左氏傳其于講業最明精究其義子駿自以才學不若也其或訪經傳于子駿輒曰幸問孔君魚吾已還從之諮道矣由是大以春秋見稱當世王莽之末君魚避地至大河之西依大將竇融為家常為上賓從容以論道為事是時先生年二十一矣每與其兄議學其兄謝服焉及世祖即祚君魚乃仕官至武都太守關內侯以清儉聞海內先生雅好儒術淡忽榮祿不願從政遂刪撮左氏傳之難者集為義詁發伏闡幽讚明聖祖之道以祛後學著書未畢而早世不永宗人子通痛其不遂惜茲大訓不行于世乃校其篇目各如本第竝序答問凡三十一卷將來君子儻肯遊意幸詳錄之焉見孔叢子連叢上上書言丁鴻臣聞武王克殷封比干之墓表商容之閭二人無功下車先封之表善顯仁為國之砥礪也伏見丁鴻經明行修志節清妙見後漢丁鴻傳注引續漢書上白狼王唐菆等樂詩疏臣聞詩云彼徂者岐有夷之行傳曰岐道雖僻而人不遠詩人誦詠以為符險今白狼王唐菆等募化歸義作詩三章路經邛來大山零高阪峭危峻險百倍岐道繈負老幼若歸慈母遠夷之語辭意難正草木異種鳥獸殊類有犍為郡掾田恭與之習狎頗曉其言臣輒令訊其風俗譯其辭語今遣從事史李陵與恭護送詣闕并上其樂詩昔在聖帝舞四夷之樂今之所上庶備其一見後漢西南夷莋都夷傳
