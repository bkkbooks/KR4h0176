body:
  text: 袁安夜酣賦拊燕竽調齊笙引宮徵唱清平見初學記十五上書諫伐胸奴胸奴不犯邊塞而無故勞師遠涉費損國用徼功萬里非社稷之計見後漢袁安傳奏劾執金吾竇景景擅發邊兵驚惑吏人二千石不待符信而輒承景檄當伏顯誅見後漢袁宏傳奏劾司隸鄭據河南尹蔡嵩司隸校尉河南尹阿附貴戚無盡節之義請免官案罪見後漢袁安傳奏議立左鹿蠡王阿佟為北單于光武昭懷南虜非謂可永安內地正以權時之算可得扞禦北狄故也今朔漠既定宜令南單于反其北庭并領降衆無緣復更立阿佟以增國費見後漢袁安傳又上封事諫立北單于臣聞功有難圖不可豫見事有易斷較然不疑伏惟光武皇帝本所以立南單于者欲安南定北之策也恩德甚備故胸奴遂分邊境無患孝明皇帝奉承先意不敢失墜赫然命將爰伐塞北至于章和之初降者十萬餘人議者欲置之濱塞東至遼東太尉宋由光祿勳耿秉皆以為失南單于心不可先帝從之陛下奉承鴻業大開疆宇大將軍遠師討伐席卷北庭此誠宣明祖宗崇立鴻勳者也宜審其終以成厥初伏念南單于屯先父舉衆歸德自蒙恩以來四十餘年三帝積纍以遺陛下陛下深宜遵述先志成就其業況屯首唱大謀空盡北虜輟而弗圖更立新降以一朝之計違三世之規失信于所養建立于無功由秉實知舊議而欲背棄先恩夫言行君子之樞機賞罰理國之綱紀論語曰言忠信行篤敬雖蠻貊行焉今若失信于一屯則百蠻不敢復保誓矣又烏桓鮮卑新殺北單于凡人之情咸畏仇讎今立其弟則二虜懷怨兵食可廢信不可去且漢故事供給南單于費直歲一億九十餘萬西域歲七千四百八十萬今北庭彌遠其費過倍是乃空盡天下而非建策之要也見後漢袁安傳又見袁宏後漢紀十三有小異還北胸奴生口議北虜遣使奉獻和親有得邊生口者輒以歸漢此明其畏威而非先違約也雲以大臣典邊不宜負信于戎狄還之足示中國優貸而使邊人得安誠便見後漢袁安傳勞中牟令魯恭檄君以名德久屈中牟物産之化流行天降休瑞應行而生尹甚嘉之見後漢魯恭傳注引續漢書臨終遺令備位宰相當陪山陵不得歸骨舊葬若母先在祖考墳壟若鬼神有知當留供養也其無知不煩徙也見袁宏後漢紀十三臨卒敕其子勿設殯棺但著襌衫疏布單衣幅巾親尸于板床之上以五百墼為藏見後漢袁安附傳注引汝南先賢傳上書自訟臣聞昔有哀歎而霜隕悲哭而崩城者每讀其書謂為信然于今況之乃知妄作何者臣出身為國破家立事至于懷忠獲釁抱信見疑晝夜長吟剖肝泣血曾無崩城隕霜之應故鄒衍杞婦何能感徹臣以負薪之資拔于陪隸之中奉職憲臺擢授戎校常侍張讓等滔亂天常侵奪朝威賊害忠德扇動姦黨故大將軍何進忠國疾亂義心赫怒以臣頗有一介之節可責以鷹犬之功故授臣以督司咨臣以方略臣不敢畏憚強禦避禍求福與進合圖事無違異忠策未盡而元帥受敗太后被質宮室焚燒陛下聖德幼沖親遭厄困時進既被害師徒喪沮臣獨將家兵百餘人抽戈承明竦劍翼室虎叱群司奮擊凶醜曾不浹辰罪人斯殄此誠愚臣效命之一驗也會董卓乘虛所圖不軌臣父兄親從竝當大位不憚一室之禍苟惟寧國之義故遂解節出奔創謀河外時卓方貪結外援招悅英豪故即臣勃海申以軍號則臣之與卓未有纖芥之嫌若使苟欲滑泥揚波偷榮求利則進可以享竊祿位退無門戶之患然臣愚所守志無傾奪故遂引會英雄興師百萬飲馬孟津歃血漳河會故冀州牧韓馥懷挾逆謀欲專權勢絶臣軍糧不得踵係至使猾虜肆毒害及一門尊卑大小同日并戮鳥獸之情猶知號呼臣所以蕩然忘哀貌無隱戚者誠以忠孝之節道不兩立顧私懷己不能全功斯亦愚臣破家狥國之二驗也又黃巾十萬焚燒青兗黑山張揚蹈藉冀域臣乃旋師奉辭伐畔金鼓未震狡敵知亡故韓馥懷懼謝咎歸土張楊黑山同時乞降臣時輒承制竊比竇融以議郎曹操權令兗州牧會公孫瓚師旅南馳陸掠北境臣即星駕席卷與瓚交鋒假天之威每戰輒克臣備公族子弟生長京輦頗聞俎豆不習干戈加自乃祖先臣以來世作輔弼咸以文德盡忠得免罪戾臣非與瓚角戎馬之勢爭戰陳之功者也誠以賊臣不誅春秋所貶苟云利國專之不疑故冒踐霜雪不憚劬勤實庶一捷之福以立終身之功社稷未定臣誠恥之太僕趙岐御命來征宣明陛下含弘之施蠲除細故與下更新奉詔之日引師南轅是臣畏怖天威不敢怠慢之三驗也又臣所上將校率皆清英宿德令名顯達登鋒履刃死者過半勤恪之功不見書列而州郡牧守競渡聲名懷持二端優游顧望皆列土錫圭跨州連郡是以遠近狐疑議論紛錯者也臣聞守文之世德高者位尊倉卒之時功多者賞厚陛下播越非所洛邑乏祀海內傷心志士憤惋是以忠臣肝腦塗地肌膚橫分而無悔心者義之所感故也今賞加無勞以攜有德杜黜忠功以疑衆望斯豈腹心之遠圖將乃讒慝之邪說使之然也臣爵為通侯位二千石殊恩厚德臣既叨之豈敢窺覬重禮以希彤弓玈矢之命哉誠傷偏裨列校勤不見紀盡忠為國翻成重愆斯蒙恬所以悲號于邊獄白起歔欷于杜郵也太傅日磾位為師保任配東征而耗亂王命寵任非所凡所舉用皆衆所捐棄而容納其策以為謀主令臣骨肉兄弟還為讎敵交鋒接刃搆難滋甚臣雖欲釋甲投戈事不得已誠恐陛下日月之明有所不照四聰之聽有所不聞乞下臣章咨之群賢使三槐九棘議臣罪戾若以臣今行權為釁則桓文當有誅絶之刑若以衆不討賊為賢則趙盾可無書弒之貶矣臣雖小人志守一介若使得申明本心不愧先帝則伏首歐刀褰衣就鑊臣之願也惟陛下垂尸鳩之平絶邪諂之論無令愚臣結恨三泉見後漢袁紹傳拜烏丸三王為單于版文使持節大將軍督幽青并領冀州牧阮鄉侯紹承制詔遼東屬國率衆王頒下烏丸遼西率衆王踏頓右北平率衆王汗盧維乃祖慕義遷善隸塞內附北捍玁狁東拒濊世守北郵為百姓保障雖時侵犯王略命將徂征厥罪率不旋時悔愆變改方之外夷最又聰惠者也始有千夫長百夫長以相統領用能悉乃心克有勳力于國家稍受王侯之命自我王室多故公孫瓚作難殘夷厥士之君以侮天慢主是以四海之內竝執干戈以衛社稷三王奮氣裔士忿姦憂國控弦與漢兵為表裏誠甚忠孝朝所嘉焉然而虎兕長蛇相隨塞路王官爵命否而無聞夫有勳不賞俾勤者怠今遣行謁者楊林齎單于璽綬車服以對爾其各緩靜部落教以謹慎無使作凶作慝世爾祀位長為百蠻長厥有咎有臧者泯于爾祿而喪于乃庸可不勉乎烏桓單于都護部衆左右單于受其節度他如故事見魏志烏丸傳注引英雄記漳河盟辭賊臣董卓承漢室之微負甲兵之衆陵越帝城跨蹈王朝幽鴆太后戮殺弘農提挈幼主越遷秦地殘害朝臣斬刈忠良焚燒宮室蒸亂宮人發掘陵墓虐及鬼神過惡蒸皇天濁穢薰后土神祗怨恫無所憑恃兆人泣血無所控告仁賢之士痛心疾首義士奮發雲興霧合咸欲奉辭伐罪躬行天誅凡我同盟之後畢力致命以伐凶醜同獎王室翼戴天子有渝此盟神明是殛俾墜其師無克祚國見後漢袁紹傳注引獻帝春秋與曹操書可都甄城當有所立見魏志武帝紀注引獻帝起居注與袁術書前與韓文節共建永世之道欲海內見再興之主今西名有幼君無血脈之屬公卿以下皆媚事卓安可復信但當使兵往屯關要皆自蹙死于西東立聖君太平可冀如何有疑又室家見戮不念子胥可復北面乎違天不祥願詳思之見魏志袁術傳注引吳書答陳登劉玄德弘雅有信義今徐州樂戴之誠副所望也見蜀志先主傳注引獻帝春秋與公孫瓚書孤與足下既有前盟舊要申之以討亂之誓愛過夷叔分著丹青謂為旅力同仇足踵齊晉故解印釋紱以北帶南分割膏腴以奉執事此非孤赤情之明驗邪豈寤足下棄烈士之高義尋禍亡之險蹤輒而改慮以好易怨盜遣士馬犯暴豫州始聞甲卒在南親臨戰陳懼于飛矢迸流狂刃橫集以重足下之禍徒增孤子之咎釁也故為薦書懇惻冀可改悔而足下超然自逸矜其威詐謂天罔可吞豪雄可滅果令貴弟殞于鋒刃之端斯言猶在于耳而足下曾不尋討禍源克心罪已苟欲逞其無疆之怒不顧逆順之津慝怨害民騁于余躬遂躍馬控弦處我疆土毒遍生民辜延白骨孤辭不獲已以登界橋之役是時足下兵氣霆震駿馬電發僕師徒肇合機械不嚴強弱殊科衆寡異論假天之助小戰大克遂陵躡奔背因壘館穀此非天威棐諶福豐有禮之符表乎足下志猶未厭乃復糾合餘燼率我蛑賊以焚爇渤海孤又不獲寧用及龍河之師羸兵前誘大軍未濟而足下膽破衆散不鼓而敗兵衆擾亂君臣竝奔此又足下之為非孤之咎也自此以後禍隙彌深孤之師旅不勝其忿遂至積尸為京頭顱滿野愍彼無辜未嘗不慨然失涕也後比得足下書辭意婉約有改往修來之言僕既欣于舊好克復且愍兆民之不寧每輒引師南駕以順𥳑書弗盈一時而北邊羽檄之文未嘗不至孤是用痛心疾首靡所錯情夫處三車之帥當列將之任宜令怒如嚴霜喜如時雨臧否好惡坦然可觀而足下二三其德強弱易謀急則曲躬緩則放逸行無定端言無質要為壯士者固若此乎既乃殘殺老弱幽土憤怨衆叛親離了然無黨又烏丸濊貊皆與足下同州僕與之殊俗各奮迅激怒爭為鋒鋭又東西鮮卑舉踵來附此非孤德所能招乃足下驅而致之也夫當荒危之世處干戈之險內違同盟之誓外失戎狄之心兵興州壞禍發蕭牆將以定霸不亦難乎前以西山陸梁出兵平討會麴義餘殘畏誅逃命故遂住大軍分兵撲蕩此兵孤之前行乃界橋搴旗拔壘先登制敵者也始聞足下鐫金紆紫命以元帥謂當因茲奮發以報孟明之恥是以戰夫引領竦望旌旆怪遂含光匿影寂爾無聞卒臻屠滅相為惜之夫有平天下之怒希長世之功權御師徒帶養戎馬叛者無討服者不收威懷竝喪何以立名今舊京克復天罔云補罪人斯亡忠幹翼化華夏儼然望於穆之作將戢干戈於散牛馬足下獨何守區區之土保軍內之廣甘惡名以速朽亡令德之久長壯而籌之非良策也宜釋憾除嫌敦我舊好若斯言之玷皇天是聞見魏志公孫瓚傳注引漢晉春秋答袁紹書聖主聰睿有周成之質賊卓因危亂之際威服百寮此乃漢家小厄之會亂尚未厭復欲興之乃云今主無血脈之屬豈不誣乎先人以來奕世相承忠義為先太傅公仁慈惻隱雖知賊卓必為禍害以信徇義不忍去也門戶滅絶死亡流漫幸蒙遠近來相赴助不因此時上討國賊下刷家恥而圖于此非所聞也見魏志袁術傳注引吳書室家見戮可復北面此卓所為豈國家哉君命天也天不可讎況非君命乎慺慺赤心志在滅卓不識其他同上報呂布書昔董卓作亂破壞王室禍害術門戶術舉兵闕東未能屠裂卓將軍誅卓送其頭首為術掃滅讎恥使術明目于當世死生不愧其功一也昔將金元休向兗州甫詣封部為曹操逆所拒破流離迸走幾至滅亡將軍破兗州術復明目于遐邇其功二也術生年以來不聞天下有劉備備乃舉兵與術對戰術憑將軍威靈得以破備其功三也將軍有三大功在術術雖不敏奉以生死將軍連年攻戰軍糧苦少今送米二十萬斛逢迎道路非直此止當駱驛復致若兵器戰具他所乏少大小唯命見魏志呂布傳注引英雄記又後漢呂布傳與此小異與陳圭書昔秦失其政天下群雄爭而取之兼智勇者卒受其歸今世事紛擾復有瓦解之勢矣誠英又有為之時也與足下舊交豈肯左右之乎若集大事子實為吾心膂見魏志袁術傳又見袁宏後漢紀二十八歸帝號于袁紹書漢之失天下久矣天子提挈政在家門豪雄角逐分裂疆宇此與周之末年七國分勢無異卒強者兼之耳加袁氏受命當王符瑞炳然今君擁有四州民戶百萬以強則無與比大論德則無與比高曹操欲扶衰拯弱安能續絶命救已滅乎見魏志袁術傳注引魏書又後漢袁術傳有此書小異末多二語云謹歸大命君其興之與從兄紹書今海內喪敗天意實在我家神應有徵當在尊兄南兄臣下欲使即位南兄言以年則北兄長以位則北兄重便欲送璽會曹操斷道見魏志武帝紀注引獻帝起居注與主簿孫徽等教主簿以不請為罪此則然矣謂淵等罪不足死則非也夫師友之名古今有之然有君之師友有士大夫之師友夫君置師友之官者所以敬其臣也有罪加于刑焉國之法也今不論其罪而謂之戮師友斯失之矣主簿取弟子戮師之名而加君誅臣之實非其類也夫聖哲之治觀時而動故不必循常將有權也閒者世亂名陵其上雖務尊君卑臣猶或未也而反長世之過不亦謬乎見魏志袁渙傳注引魏書說曹公夫兵者凶器也不得已而用之鼓之以道德征之以仁義兼撫其民而除其害夫然故可與之死可與之生自大亂以來十數年矣民之欲安甚于倒懸然而暴亂未息者何也意者政失其道歟渙聞明君善于救世故世亂則齊之以義時僞則鎮之以朴世異事變治國不同不可不察也夫制度損益此古今之不必同者也若夫兼愛天下而反之於正雖以武平亂而濟之以德誠百王不易之道也公明哲超世古之所以得其民者公既勤之矣今之所以失其民者公既戒之矣海內賴公得免于危亡之禍然而民未知義唯公所訓之則天下幸甚見魏志袁渙傳又見袁宏後漢紀二十九與曹子建書召公與周公俱受分陝之任見文選王元長永明十一年策秀才文注沈約齊安陸王碑文注又見陶淵明集注與尚書令荀彧書許文休英才偉士智略足以計事自流宕已來與群士相隨每有患急常先人後己與九族中外同其飢寒其紀綱同類仁恕惻怛皆有效事不能復一二陳之耳見蜀志許靖傳交址士府君既學問優博又達于從政處大亂之中保全一郡二十餘年疆埸無事民不失業羈旅之徒皆蒙其慶雖竇融保河西曷以加之官事小闋輒玩習書傳春秋左氏傳尤簡練精微吾數以咨問傳中諸疑皆有師說意思甚密又尚書兼通古今大義詳備聞京師古今之學是非忿爭今欲條左氏尚書長義上之見吳志士燮傳
