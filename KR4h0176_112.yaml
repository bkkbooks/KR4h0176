body:
  text: 陳寵省刑疏臣聞先王之政賞不僭刑不濫與其不得已寧僭不濫故唐堯著典曰流宥五刑眚災肆赦帝舜命皋陶以五宅三居惟明克允文王重易六爻而列重棘之聽周公作立政戒成王勿誤乎庶獄伯夷之典惟敬五刑以成三德由此言之聖賢之政以刑罰為首往者斷獄嚴明所以威懲姦慝姦慝既平必宜濟之以寬陛下即位率由此義數詔群僚弘崇晏晏而有司執事未悉奉承典刑用法猶尚深刻斷獄者急于篣格酷烈之痛執憲者煩于詆欺放濫之文違本離實箠楚為姦或因公行私逞縱威福夫為政猶張琴瑟大弦急者小弦絕故子貢非臧孫之猛法而美鄭喬之仁政詩云不剛不柔布政優優方今聖德充塞假于上下宜因其時隆先王之道蕩滌煩苛之法輕薄箠楚以濟群生全廣至德以奉天心見後漢陳寵傳又見袁宏後漢紀十一晉書刑法志通典一百七十奏駁賈宗斷獄盡三冬議夫冬至之節陽氣始萌故十一月有蘭射于芸荔之應時令曰諸生蕩安形體天以為正周以為春十二月陽氣上通雉雊雞乳地以為正殷以為春十三月陽氣已至天地已交萬物皆出蟄蟲始振人以為正夏以為春三微成著以通三統周以天元殷以地元夏以人元若以此時行刑則殷周歲首皆當流血不合人心不稽天意月令曰孟冬之月趣獄刑無留罪明大刑畢在立冬也又仲冬之月身欲寧事欲靜若以降威怒不可謂寧若以行大刑不可謂靜議者咸曰旱之所由咎在改律臣以為殷周斷獄不以三微而化致康乎無有災害自元和以前皆用三冬而水旱之異往往為患由此言之災害自為它應不以改律秦為虐政四時行刑聖漢初興改從簡易蕭何草律季秋論囚俱避立春之月而不計天地之正三王之春實頗有違陛下探幽析微允執其中革百載之失建永年之功上有迎承之敬下有奉微之惠稽春秋之文當月令之意聖功美業不宜中疑見後漢陳寵傳通典一百六十六奏請刪除律令臣聞禮經三百威儀三千故甫刑大辟二百五刑之屬三千禮之所去刑之所取失禮則入刑相為表裏者也今律令犯罪應死刑六百一十耐罪千六百九十八贖罪以下二千六百八十一溢于甫刑者千九百八十九其四百一十大辟千五百耐罪七十九贖罪春秋保乾圖曰王者三百年一蠲法漢興以來三百二年憲令稍增科條無限又律有三家說各駁異刑法繁多宜令三公廷尉平定律令應經合義可施行者大辟二百耐罪贖罪二千八百合為三千與禮相應其餘千九百八十九事悉可刪除使萬民改易視聽以成大化致刑措之美俾傳之無窮見後漢陳寵傳晉書刑法志通典一百七十薦劉愷疏臣聞三公上則台階下象山岳股肱元首鼎足居職協和陰陽調訓五品考功量才以序庶僚遭烈風不迷遇迅雨不惑位莫重焉而今上司缺職未議其人臣竊差次諸卿考合眾議咸稱太常朱倀少府荀遷臣父寵前忝司空倀遷並為掾屬具知其能倀能說其經書而用心褊狹遷嚴毅剛直而薄于藝文伏見前司徒劉愷沈重淵懿道德博備克讓爵土致祚弱弟躬浮雲之志兼浩然之氣頻歷二司舉動得禮以疾致仕側身里巷處約思純進退有度百僚景式海內歸懷往者孔光師丹近世鄧彪張酺皆去宰相復序上司誠宜簡練卓異以厭眾見後漢劉愷傳清盜源疏臣聞輕者重之端小者大之源故隄潰蟻孔氣洩鍼芒是以明者慎微智者識幾書曰小不可不殺詩云無縱詭隨以謹無良蓋所以崇本絕末鉤深之慮也臣竊見元年以來盜賊連發攻亭劫掠多所傷殺夫穿窬不禁則致彊盜彊盜不斷則為攻盜攻盜成群必生大姦故亡逃之科憲令所急至于通行飲食罪致大辟而頃者以來莫以為憂州郡督錄怠慢長吏防禦不肅皆欲採獲虛名諱以盜賊為負雖有發覺不務清澄至有逞威濫怒無辜僵仆或有跼蹐比伍轉相賦斂或隨吏追赴周章道路是以盜發之家不敢申告鄰舍比里共相壓迮或出私財以償所亡其大章著不可掩者乃肯發露陵遲之漸遂且成俗寇攘誅咎皆由于此前年渤海張伯路可為至戒覆車之軌其𢄔不遠蓋失之末流求之本源宜糾增舊科以防來事自今彊盜為上官若它郡縣所糾覺一發部吏皆正法尉貶秩一等令長三月奉贖罪二發尉免官令長貶秩一等三發以上令長免官便可撰立科條處為詔文切敕刺史嚴加糾罰冀以猛濟寬驚懼姦慝頃季夏大暑而消息不協寒氣錯時水涌為變天之降異必有其故所舉有道之士可策問國典所務王事過差令處煖氣不效之意庶有讜言以承天誡見後漢陳忠傳薦周興疏臣伏惟古者帝王有所號令言必弘雅辭必溫麗垂于後世列于典經故仲尼嘉唐虞之文章從周室之郁郁臣竊見光祿郎周興孝友之行著于閨門清厲之志聞于州里蘊匵古今博物多聞三墳之篇五典之策無所不覽屬文著辭有可觀採尚書出納帝命為王喉舌臣等既愚闇而諸郎多文俗吏鮮有雅才每為詔文宣示內外轉相求請或以不能而專己自由辭多鄙固興抱奇懷能隨輩棲遲誠可歎惜見後漢周榮傳上疏豫通帝意臣聞仁君廣山藪之大納切直之謀忠臣盡謇諤之節不畏逆耳之害是以高祖舍周昌桀紂之譬孝文嘉爰盎人豕之譏武帝納東方朔宣室之正元帝容辥廣德自刎之切昔晉平公問于叔向曰國家之患孰為大對曰大臣重祿不極諫小臣畏罪不敢言下情不上通此患之大者公曰善于是下令曰吾欲進善有謁而不通者罪至死今明詔崇高宗之德推宋景之誠引咎克躬諮訪群吏言事者見杜根成翊世等新蒙表錄顯列二臺必承風響應爭為切直若嘉謀異策宜輒納用如其管穴妄有譏刺雖苦口逆耳不得事實且優游寬容以示聖朝無諱之美若有道之士對問高者宜垂省覽特遷一等以廣直言之路見後漢陳忠傳又略見袁宏後漢紀十七上疏請許大臣寍告終喪臣聞之孝經始于愛親終于哀戚上自天子下至庶人尊卑貴賤其義一也夫父母于子同氣異息一體而分三年乃免于懷抱先聖緣人情而著其節制服二十五月是以春秋臣有大喪君三年不呼其門閔子雖要絰服事以赴公難退而致位以究私恩故稱君使之非也臣行之禮也周室陵遲禮制不序蓼莪之人作詩自傷曰瓶之罄矣惟罍之恥言己不得終竟子道者亦上之始也高祖受命蕭何創制大臣有寧告之科合于致憂之義建武之初新承大亂凡諸國政多趣簡易大臣既不得告寧而群司營祿念私鮮循三年之喪以報顧復之恩者禮義之方實為彫損大漢之興雖承衰敝而先王之制稍以施行故藉田之耕起于孝文孝廉之貢發于孝武郊祀之禮定于元成三雍之序備于顯宗大臣終喪成乎陛下聖功美業靡以尚茲孟子有言老吾老以及人之老幼吾幼以及人之幼天下可運于掌臣願陛下登高北望以甘陵之思揆度臣子之心則海內咸得其所見後漢陳忠傳又見袁宏後漢紀十七有刪節因災異上疏劾中侍伯榮臣聞位非其人則庶事不敘庶事不敘則政有得失政有得失則感動陰陽妖變為應陛下每引災自厚不責臣司臣司狃恩莫以為負故天心未得隔并屢臻青冀之域淫雨漏河徐岱之濱海水盆溢兗豫蝗蝝滋生荊揚稻收儉薄并涼二州羌戎叛戾加以百姓不足府帑虛匱自西徂東杼柚將空臣聞洪範五事一曰貌貌以恭恭作肅貌傷則狂而致常雨春秋大水皆為君上威儀不穆臨蒞不嚴臣下輕慢貴倖擅權陰氣盛彊陽不能禁故為淫雨陛下以不得親奉孝德皇園廟比遣中使致敬甘陵朱軒軿馬相望道路可謂孝至矣然臣竊聞使者所過威權翕赫震動郡縣王侯二千石至為伯榮獨拜車下儀體上僭侔于人主長吏惶怖譴責或邪諂自媚發人修道繕理亭傳多設儲跱徵役無度老弱相隨動有萬計賂遺僕從人數百匹頓踣呼嗟莫不叩心河閒託叔父之屬清河有陵廟之尊及剖符大臣皆猥為伯榮屈節車下陛下不問必以陛下欲其然也伯榮之威重于陛下陛下之柄在于臣妾水災之發必起于此昔韓嫣託副車之乘受馳視之使江都誤為一拜而嫣受歐刀之誅臣願明主嚴天元之尊正乾剛之位職事巨細皆任賢能不宜復令女使干錯萬機重察左右得無石顯泄漏之姦尚書納言得無趙昌譖崇之詐公卿大臣得無朱博阿傅之援外屬近戚得無王鳳害商之謀若國政一由帝命王事每決于己則下不得偪上臣不得干君常雨大水必當霽止四方眾異不能為害見後漢陳忠傳上疏諫因災異免三公臣聞君使臣以禮臣事君以忠故三公稱曰冢宰王者待以殊敬在輿為下御坐為起入則參對而議政事出則監察而董是非漢典舊事丞相所請靡有不聽今之三公雖當其名而無其實選舉誅賞一由尚書尚書見任重于三公陵遲以來其漸久矣臣忠心常獨不安是故臨事戰懼不敢穴見有所興造又不敢希意同僚以謬乎典而謗讟日聞罪足萬死近以地震策免司空陳褒今者災異復欲切讓三公昔孝成皇帝以妖星守心移咎丞相使賁麗納說方進方進自引卒不蒙上天之福徒乖宋景之誠故知是非之分較然有歸矣又尚書決事多違故典罪法無例詆欺為先文慘言醜有乖章憲宜責求其意割而勿聽上順國典下防威福置方圓于規矩審輕重于衡石誠國家之典萬世之法也見後漢陳忠傳又見袁宏後漢紀十七有小異議救西域疏臣聞八蠻之寇莫甚北虜漢興高祖窘平城之圍太宗屈供奉之恥故孝武忿怒深為久長之計命遣虎臣浮河絕漠窮破虜庭當斯之時黔首隕于狼望之北中國弊于廬山之壑府庫殫竭杼軸空虛算至車船貲及六畜夫豈不懷慮久故也遂規酒泉敦煌四郡以隔南羌開三十六國妻以公主以斷其右臂是以單于孤持竄遁遠藏至于宣元之世遂備蕃臣關徼不閉羽檄不行由此察之戎狄可以威服難以化洽西城內附日久區區東望扣關者數矣此其不樂匈奴慕漢之效也今北虜已破車師勢必南攻鄯善棄而不救則諸國從矣若然則北虜財賄益增膽勢益殖威臨南羌與之交連如此河西四郡危矣河西既危不得不救則百倍之役興不貲之費發矣今議者但念西域絕遠䘏之煩費不見先世苦心勤勞之意也方今邊郡守禦之具不精內郡武衛之備不修敦煌孤危遠來告急復不輔助內無慰勞吏民外無以威示百蠻蹙國減土經有明誡臣以為敦煌宜置校尉案舊增四郡屯兵以西撫三十六國建屯益兵宣揚雷風冀以折衝萬里震怖匈奴見袁宏後漢紀十七又後漢匈奴傳上言令屯役者得歸葬送孝宣皇帝舊令人從軍屯及給事縣官者大父母死未滿三月皆勿徭令得葬送請依此制見後漢陳忠傳奏劾陳禪古者合歡之樂舞于堂四夷之樂陳于門故詩云以雅以南韎任朱離今撣國越流沙踰縣度萬里貢獻非鄭衛之聲佞人之比而禪廷訕朝政請劾下禪獄見後漢陳禪傳奏太官宜著兩梁冠令史質堪上言太官宜著兩梁尚書孟希奏太官職在鼎俎不列陛位堪欲令比大夫兩梁冠不宜許臣伏惟太官令職在典掌王饔統六清之飲列八珍之饌正百品之羞納四方之貢所奉尤重用思又勤明詔慎口實之御防有敗之姦增崇其選待御史主捕案太醫令奉方藥供養符節令掌幡信金虎故位從大夫車有韜沂冠有兩梁所以殊親疏別內外也太官令以供養言之為最親近以職事言之為最煩多令又高選又執法比太醫令科同服等而冠二人殊名實不副又博士秩卑以其傳先王之訓故尊而異之令服大夫之冕由此言之兩梁冠非必列于陛位也建初中太官令兩梁冠春秋之義大于復古如堪言合典可施行克厭帝心即聽用之見續漢輿服志下注引荀綽晉百官表注奏言太初厤不宜從諸從太初者皆無他效驗徒以世宗攘夷廓境享國久長為辭或云孝章改四分災異率甚未有善應臣伏惟聖王興起各異正朔以通三統漢祖受命因秦之紀十月為年首閏常在歲後不稽先代違于帝典太宗遵修三階以平黃龍以至刑犴以錯五者以備哀平之際同承太初而妖孽累仍痾禍非一議者不以成數相參考真求實而汎采妄說歸福太初致咎四分太初厤眾賢所立是非已定永平不審復革其弦望四分有謬不可施行元和鳳鳥不當應厤而翔集遠嘉前造則表其休近譏後改則隱其福漏見曲論未可為是臣輒復重難衡興以為五紀論推步行度當時比諸術為近然猶未稽于古及向子歆欲以合春秋橫斷卒數損夏益周考之表紀差謬數百兩厤相課六千一百五十六歲而太初多一日冬至日直斗而云在牽牛迂闊不可復用昭然如此史官所共見非獨衡興前以為九道密近今議者以為有闕及甲寅元復多違失皆未可取正昔仲尼順假馬之名以崇君之義況天之厤數不可任疑從虛以非易是見續漢律歷志中奏選尚書郎尚書為王喉舌而諸郎多文俗鮮有雅才每為詔文宣示內外轉相求請也見御覽引後漢書老子聖母碑老子者道也乃生于無形之先起于太初之前行于太素之元浮游六虛出入幽冥觀混合之未別窺清濁之未分見御覽一安丘嚴平頌無營無欲澹爾淵清見文選雪賦注補亡詩注奏免馬防等特進防光廖廖子豫兄弟父子竝受爵土榮顯冠世多賈京師膏腴美田作大盧舍近帶城郭妨困小民引東觀漢記司隸校尉梁松奏特進馬防兄廖廖子孫三家奴婢千人御覽五百引東觀漢記
