body:
  text: 魯恭上疏諫擊胸奴竊見竇憲耿秉銜使奉命暴師于外陛下親勞聖思日昃不食憂在軍役誠欲以安定北垂為人除患定萬世之計也臣伏獨思之未見其便社稷之計萬人之命在于一舉數年以來秋稼不熟人食不足倉庫空虛國無蓄積會新遭大憂人懷恐懼陛下躬大聖之德履至孝之行盡諒陰三年聽于冢宰百姓闕然三時不聞警蹕之音莫不懷思皇皇若有求而不得今乃以盛春之月興發軍役擾動天下以事戎狄誠非所以垂恩中國改元正時由內及外也萬民者天之所生天愛其所生猶父母愛其子一物有不得其所者則天氣為之舛錯況于人乎故愛人者必有天報昔太王重人命而去邠故獲上天之祐夫戎狄者四方之異氣也蹲夷踞肆與鳥獸無別若雜居中國則錯亂天氣汙辱善人是以聖王之制羈縻不絶而已不以傷害中國也今邊境幸無事宜當修仁行義尚于無為令家給人足安業樂産夫人道乂于下則陰陽和於上然後祥風時雨覆被遠方夷狄慕德重譯而至矣易曰有孚盈缶終來有它吉言甘雨滿我之缶誠來有我而吉已夫以德勝人者昌以力勝人者亡今胸奴為鮮卑所殺遠臧于史侯河西去塞數千里而欲乘其虛耗利其微弱是非義之所出也前太僕祭彤遠出塞外卒不見一胡而兵已困矣白山之難不絶如綖都護陷沒士卒死者如積迄今被其辜毒孤寡哀思之心未弭仁者念之以為纍息奈何復欲襲其迹不顧患難乎今始徵發而大司農調度不足使者在道分部督趣上下相迫民間之急亦已甚矣三輔并涼少雨麥根枯焦牛死日甚此其不合天心之效也群僚百姓咸曰不可陛下獨奈何以一人之計棄萬人之命不恤其言乎上觀天心下察人志足以知事之得矣臣恐中國不為中國豈徒胸奴而已哉惟陛下留聖恩徵還二將休罷士卒以順天心見後漢魯恭傳又略見袁宏後漢紀十二上疏舉無遺策動不失其中見文選王仲宣誄注上疏諫盛夏斷獄臣伏見詔書敬若天時憂念萬民為崇和氣罪非殊死且勿案驗進柔良退貪殘奉時令所以助仁德順昊天致和氣利黎民者也舊制至立秋乃行薄刑自永元十五年以來改用孟夏而刺史太守不深惟憂民息事之原進良退殘之化因以盛夏徵召農人拘對考驗連滯無已司隸典司京師四方是則而近于春月分行諸部託言勞來貧人而無隱惻之實煩擾郡縣廉考非急逮捕一人罪延十數上逆時氣下傷農業案易五月姤用事經曰后以施令誥四方言君以夏至之日施命令止四方行者所以助微陰也行者尚止之況于逮召考掠奪其時哉比年水旱傷稼人飢流冗今始夏百穀權輿陽氣胎養之時自三月以來陰寒不暖物當化變而不被和氣月令孟夏斷薄刑出輕繫行秋令則苦雨數來五穀不熟又曰仲夏挺重囚益其食行秋令則草木零落人傷于疫夫斷薄刑者謂其輕罪已正不欲令久繫故時斷之也臣愚以為今孟夏之制可從此令其決獄案考皆以立秋為斷以順時節育成萬物則天地以和刑罰以清矣見後漢魯恭傳又略見袁宏後漢紀十六議奏斷獄以冬至前夫陰陽之氣相扶而行發動用事各有時節若不當其時則物隨而傷王者雖質文不同而茲道無變四時之政行之若一月令周世所造而所據皆夏之時也其變者唯正朔服色犧牲徽號器械而已故曰殷因于夏禮周因于殷禮所損益可知也易曰潛龍勿用言十一月十二月陽氣潛藏未得用事雖照噓萬物養其根荄而猶盛陰在上地凍水冰陽氣否隔閉而成冬故曰履霜堅冰陰始凝也馴致其道至堅冰也言五月微陰始起至十一月堅冰至也夫王者之作因時為法孝章皇帝深惟古人之道助三正之微定律著令冀承天心順物性命以致時雍然從變改以來年歲不熟穀價常貴人不寧安小吏不與國同心者率入十一月得死罪賊不問曲直便即格殺雖有疑罪不復讞正一夫吁嗟王道為虧況于衆乎易十二月君子以議獄緩死可令疑罪使詳其法大辟之科盡冬月乃斷其立春在十二月中者勿以報囚如故事見後漢魯恭傳又略見袁宏後漢紀十六舉賢良方正對策政莫先于從民之所欲除民之所惡先教後刑先近後遠君為陽臣為陰君子為陽小人為陰京師為陽諸夏為陰男為陽女為陰樂和為陽憂苦為陰各得其所則和調精誠之所發無不感浹吏多不良在于賤德而貴功欲速莫能修長久之道古者貢士得其人者有慶不得其人者有讓是以舉者務力行選舉不實咎在刺史二千石書曰天工人其代之觀人之道幼則觀其孝順而好學長則觀其慈愛而能教設難以觀其謀煩事以觀其治窮則觀其所守達則觀其所施此所以核之也民多貧困者急急則致寒寒則萬物多不成去本就末奢所致也制度明則民用足刑罰不中則于名不正正名之道所以明上下之稱班爵號之制定卿大夫之位也獄訟不息在爭奪之心不絶法者民之儀表也法正則民愨吏民凋弊所從久矣不求其本浸以益甚吏政多欲速又州官秩卑而任重競為小功以求進取生凋弊之俗救弊莫若忠故孔子曰孝慈則忠治姦詭之道必明慎刑罰孔子曰導之以禮樂而民和睦說以犯難民忘其死死且忘之況使為禮義乎見袁宏後漢紀十六上疏論說經臣以愚頑顯備大位犬馬氣衰猥得進見論難于前無所甄明衣服之賜誠為優過臣聞說經者傳先師之言非從巳出不得相讓相讓則道不明若規矩權衡之不可枉也難者必明其據說者務立其義浮華無用之言不陳于前故精思不勞而道術愈章法異者各令自說師法博觀其義覽詩人之旨意察雅頌之終始明舜禹皋陶之相戒顯周公箕子之所陳觀乎人文化成天下陛下既廣納謇謇以開四聰無令芻蕘以言得罪既顯巖穴以求仁賢無使幽遠獨有遣失見後漢魯丕傳奏止趙王避疾學宮臣聞禮諸侯薨于路寢大夫卒於適室死生有命未有逃避之典也學官傳五帝之道修先王禮樂教化之處王欲廢塞以廣游宴事不可聽見後漢魯丕傳請比都官從事表天子無外乘輿所幸便為京師臣請荊州刺史比司隸臣比都官從事見御覽六百六引桂陽先賢畫讚胡滕部南陽從事遇大駕南巡求索揔猥滕表云云帝奇其才悉許之上書請著太后注紀臣聞易載羲農而皇德著書述唐虞而帝道崇故雖聖明必書功故竹帛流音於管弦伏為皇太后膺大聖之姿體乾坤之德齊蹤虞妃比跡任姒孝悌慈仁允恭節約杜絶奢盈之源防抑逸欲之兆正位內朝流化四海及元興延平之際國無儲副仰觀乾象參之人譽爰立陛下為天下主永安漢室綏靜四海又遭水潦東州饑荒垂恩元元冠蓋交路菲薄衣食躬率群下損膳解驂以贍黎苗惻隱之恩猶視赤子克己引愆顯揚仄陋崇晏晏之政敷在寬之教興滅國繼絶世録功臣復宗室追還徙人蠲除禁錮政非惠和不圖于心制非舊典不訪于朝弘德洋溢充塞宇宙洪澤豐沛漫衍八方華夏樂化戎狄混并丕功著于大漢碩惠加于生人巍巍之業可聞而不可及蕩蕩之勳可誦而不可名古之帝王左右置史漢之舊典世有注紀夫道有夷崇治有進退若善政不述細異輒書是為堯湯負洪水大旱之責而無咸熙假天之美高宗成王有雉雊迅風之變而無中興康寧之功也上考詩書有虞二妃周室三母修行佐德思不踰閾未有內遭家難外遇災害覽總大麓經營天物功德巍巍若茲者也宜令史官著長樂宮注聖德頌以敷宣景耀勒勳金石縣之日月攄之罔極以崇陛下蒸蒸之孝見後漢和熹鄧后紀玄根賦一足之夔九頭之鶬見文選江賦注戴金翠珥珠璣見文選洛神賦注前殿冬絺見文選七啓注引玄想頌致垂棘以為墀見文選顏延之元皇后哀冊文注芳林臻臻朱竹離離菱芡吐榮若攄錦而布繡見御覽九百七十五素雁蜿蟺感清羽玄鶴回翔應徵宮見北堂書鈔一百九引玄根頌上書諫鑄錢事夫食者乃有國之大寶生民之至貴也見比年已來良田盡于蝗螟之口杼軸空于公私之求野無青草室如懸鏧所急朝夕之飧所患靡鹽之事豈謂錢之鍥簿銖兩輕重哉就使當令土礫化為南金瓦鹵變為為和玉沙石悉成隨珠犬羊盡作狐白絳繡盈堂文綺縵野使百姓渴無所飲飢無所食雖羲皇之純德大禹之勤勞周文之不暇猶不能以保蕭牆之內見藝文類聚六十六與竇季瑋書君嚼茹墳典履公修行見北堂書鈔與李子堅書下車負乘劇賊未擒吏民彊獷比屋為賊又沈約齊安陸昭主碑注郡太守針有嬴駐除焚舊典紀蕩滅蕃畿罷侯置守奏發閭左陳涉奮威楚築乾溪靈王不歸征遐由近不可肅祗守臣司境敢告執機見藝文類聚六大漢遵周化洽九區見文選赭白馬賦注又陸機皇太子宴玄圃詩注又趙至與稽茂齊書注作遵因駮輕侮法議夫輕侮之法先帝一切之恩不有成科班之律令也夫死生之決宜從上下猶天之四時有生有殺若開相容恕著為定法者則是故設姦萌生長罪隙孔子曰民可使由之不可使知之春秋之義子不報讎非子也而法令不為之減者以相殺之路不可開故也今託義者得減妄殺者有差使執憲之吏得設巧詐非所以導在醜不爭之義又輕侮之比浸以繁滋至有四五百科轉相顧望彌復增甚難以垂之萬載臣聞師言救文莫如質故高帝去煩苛之法為三章之約建初詔書有改于古者可下三公廷尉蠲除其敝見後漢張敏傳復上疏議輕侮法臣敏蒙恩特見拔擢愚心所不曉迷意所不解誠不敢苟隨衆議臣伏見孔子垂經典皋陶造法律原其本意皆欲禁民為非也未曉輕侮之法將以何禁必不能使不相輕侮而更開相殺之路執憲之吏復容其姦枉議者或曰平法當先論生臣愚以為天地之性唯人為貴殺人者死三代通制今欲趣生反開殺路一人不死天下受敝記曰利一害百人去城郭夫春生秋殺天道之常春一物枯即為災秋一物華即為異王者承天地順四時法聖人從經律願陛下留意下民考尋利害廣令平議天下幸甚見後漢張敏傳又略見通典一百六十六御覽四百五十二上言宜給計吏舍館百郡計吏觀國之光而舍逆旅崎嶇私館直裝衣物弊朽暴露朝會邈遠事不肅給昔霸國盟主耳舍諸侯于隸人子産以為大譏況今四海之大而百無乎見續漢百官志二注補引漢官永元十年應順上言理李膺等疏昔秦人觀寶于楚昭奚恤蒞以群賢梁惠王瑋其昭乘之珠齊威王答以四臣夫忠賢武將國之心膂竊見左校施刑徒前廷尉馮緄大司農劉祐河南尹李膺等執法不撓誅舉邪臣肆之以法衆庶稱宜昔季孫行父親逆君命逐出莒僕于舜之功二十之一今膺等投身彊禦畢力致罪陛下既不聽察而猥受譖訴遂令忠臣同愆元惡自春迄冬不蒙降恕遐邇觀聽為之歎息夫立政之要記功忘失是以武帝捨安國于徒中宣帝徵張敞于亡命緄前討蠻荊均吉甫之功祐數臨督司有不吐茹之節膺著威幽并遺愛度遼今三垂蠢動王旅未振易稱雷雨作解君子以赦過宥罪乞原膺等以備不虞見後漢李膺傳上書諫立后臣聞周納狄女襄王出居于鄭漢立飛燕成帝胤嗣泯絶母后之重興廢所因宜思關睢之所求遠五禁之所忌見後漢應奉傳貢藥物表臣劭居郡舊因計吏獻藥闕而不修慚悖交集無辭日久今道少通謹遣五官孫艾貢茯苓十斤紫芝六枝鹿茸五斤五味一斗計吏發行輒復表貢見御覽九百八十四奏上刪定律令夫國之大事莫尚載籍也載籍也者決嫌疑明是非賞刑之宜允獲厥中俾後之人永為監焉故膠西相董仲舒老病致仕朝廷每有政議數遣廷尉張湯親至陋巷問其得失於是作春秋決獄二百三十二事動以經對言之詳矣逆臣董卓蕩覆王室典憲焚燎靡有孑遺開辟以來莫或茲酷今大駕東邁巡省許都拔出險難其命惟新臣纍世受恩榮祚豐衍竊不自揆貪少云補輒撰具律本章句尚書舊事廷尉板令決事比例司徒都目五曹詔書及春秋斷獄凡二百五十篇獨去復重為之節文又集駮議三十篇以類相從凡八十二事其見漢書二十五漢記四皆刪敘潤色以全本體其二十六博採古今瓌瑋之士文章煥炳德義可觀其二十七臣所創造豈繄自謂必合道衷心焉憤邑聊以藉手昔鄭人以乾鼠為璞鬻之于周宋愚夫亦寶燕石緹緁十重夫覩之者掩口盧胡而笑斯文之族無乃類旃左氏實云雖有姬姜絲麻不棄憔悴菅蒯蓋所以代匱也是用敢露頑才廁于明哲之末雖未足剛紀國體宣洽時雍庶幾觀察增闡聖聽惟因萬機之餘暇游意省覽焉見後漢應劭傳晉書刑法志駮韓卓募兵鮮卑議鮮卑隔在漠北犬羊為群無君長之帥廬落之居而天性貪暴不拘信義故數犯障塞且無寧歲吏民創禁不與交關唯至互市乃來靡服苟欲中國珍貨非為畏威懷德計獲事足旋踵為害是以朝家外而不內蓋為此也往者胸奴反叛度遼將軍馬續烏桓校尉王元發鮮卑五千餘騎又武威太守趙沖亦率鮮卑征討叛羌斬獲醜虜既不足言而鮮卑越溢多為不法裁以軍令則忿戾作亂制御小緩則陸掠殘害劫居人鈔商旅噉人牛羊略人兵馬得賞既多不肯去復欲以物買鐵邊將不聽便取縑帛聚欲燒之邊將恐怖畏其反叛辭謝撫順無故拒違今狡寇未殄而羌為巨害如或致悔其可追乎臣愚以為可募隴西羌胡守善不叛者𥳑其精勇多其牢賞太守李參沈靜有謀必能獎厲得其死力當思漸消之略不可倉卒望也見後漢應劭傳又略見藝文類聚六十六引漢名臣奏鮮卑胡市議太尉屬應劭等議以為鮮卑隔在漠北犬羊為群無君長帥廬落之居又其天性貪而無信故自漢興于茲數犯障塞且無寧歲吏民創禁不與交關唯至胡市乃成靡服非畏威懷德實玩中國珍異之故耳見藝文類聚六十五引漢名臣奏追駮尚書陳忠活尹次史玉議尚書稱天秩有禮五服五章哉天討有罪五刑五用哉而孫卿亦云凡制刑之本將以禁暴惡且懲其末也凡爵列官秩賞慶刑威皆以類相從使當其實也若德不副位能不稱官賞不酬功刑不應罪不祥莫大焉殺人者死傷人者刑此百王之定制有法之成科高祖入關雖尚約法然殺人者死亦無寬降夫時化則刑重時亂則刑輕書曰刑罰時輕時重此之謂也今次玉公以清時釋其私憾阻兵安忍僵尸道路朝恩在寬幸至冬獄而初軍愚狷妄自投斃昔召忽親死子糾之難而孔子曰經于溝瀆人莫之知朝氏之父非錯刻峻遂能自隕其命班固亦云不如趙母指括以全其宗傳曰僕妾感慨而致死者非能義勇顧無慮耳夫刑罰威獄以類天之震耀殺戮也溫慈和惠以放天之生殖長育也是故春一草枯則為災秋一木華亦為異今殺無罪之初軍而活當死之次玉其為枯華不亦然乎陳忠不詳制刑之本而信一時之仁遂廣引八議求生之端夫親故賢能功貴勤賓豈有次玉當罪之科哉若乃小大以情原心定罪此為求生非謂代死可以生也敗法亂政悔其可追見後漢應劭傳舊名諱議周穆王名滿晉厲公名州滿是同名不諱見春秋成十年正義營陵令到官移書申約吏民到聞此俗舊多淫祀靡財妨農長亂積惑其侈可忿其愚可愍昔仲尼不許子路之禱晉悼不解桑林之崇死生有命吉凶由人哀哉黔黎漸染迷謬豈樂也哉莫之徵耳今條不禁申約吏民為陳利害其有犯者便收朝廷若私遺脫彌彌不紀主者髡截歎無及已城陽景王縣甚尊之惟王弱冠內侍帷幄呂氏恣睢將危漢室獨見先識權發酒令抑雅扶正忠義洪毅其歆禋祀禮亦宜之至于駕乘烹殺倡優男女雜錯是何謂也三邊分拿師老器弊朝廷旴食百姓囂然禮興在有年饑則損自今聽歲再祀備物而已不得殺牛遠迎他倡賦會宗落造設紛華方廉察之明為身計而復儹失罰與上同明除見處勿後中覺見風谷通九風俗通義序昔仲尼沒而微言闕七十子喪而大義乖重遭戰國約從連橫好惡殊心真僞紛爭故春秋分為五詩分為四易有數家之傳竝以諸子百家之言紛然殽亂莫知所從漢興儒者競復比誼會意為之章句家有五六皆析文便辭彌以馳遠綴文之士雜襲龍鱗訓注說難轉相陵高積如丘山可謂繁富者矣而至于俗閒行語衆所共傳積非習貫莫能原察今王室大壞九州幅裂亂靡有定生民無幾私懼後進益以迷昧聊以不才舉爾所知方以類聚凡三十一卷謂之風俗通義言通于流俗之過謬而事該之于義理也風者天氣有寒暖地形有險易水泉有美惡草木有剛柔也俗者含血之類像之而生故言語歌謳異聲鼓舞動作殊形或直或邪或善或淫也聖人作而均齊之咸歸于正聖人廢則還其本俗尚書天子巡狩至于岱宗覲諸侯見百年命大師陳詩以觀民風俗孝經曰移風易俗莫善于樂傳曰百里不同風千里不同俗戶異政人殊服由此言之為政之要辨風正俗最其上也周秦常以歲八月遣輶軒之使釆異代方言還奏籍之藏于祕室及贏氏之亡遺脫漏棄無見之者蜀人嚴君平有千餘言林閭翁孺才有梗概之法揚雄好之天下孝廉衛卒交會周章質問以次注續二十七年爾乃至正凡九千字其所發明猶未若爾雅之閎麗也張竦以為懸諸日月不刊之書豫實頑暗無能述演豈敢比隆于斯人哉顧惟述作之功故聊光啓之耳昔客為齊王畫者王問畫孰最難孰最易曰犬馬最難鬼魅最易犬馬旦暮在人之前不類不可類之故難鬼魅無形無形者不見不見故易今俗語雖云浮淺然賢愚所共咨論有似犬馬其為難矣并綜事宜于今者孔子稱幸苟有過人必知之俾諸明哲幸詳覽焉見風俗通元刻本
