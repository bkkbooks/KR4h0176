body:
  text: 應邵漢官儀上太傅古官也周成王時康叔為之高后元年初用王陵金印紫綬八年省哀帝元壽二年復置位在三公上世祖中興特遣使者備禮徵故密令卓茂策曰前密令卓茂束身自修執節純固夫士誠能為人所不能為名冠天下當受天下重賞故武王誅紂封比干之墓表商容之閭令以茂為太傅封為宣德侯北堂書鈔設官部藝文類聚職官部太平御覽職官部傅者覆也見續漢百官志一補注明帝甲辰策書曰高密侯鄧禹元功之首其以禹為太傅見北堂書鈔設官部和帝丁酉策書曰太尉鄧彪元功之族三讓彌高海內歸仁為群賢首其以彪為太傅録尚書事百官總己以聽庶得專位內之事北堂書鈔設官部初學記職官部藝文類聚職官部太平御覽職官部兩引殤帝策曰張禹三世在位黃髮罔愆忠孝彌篤其以為太傅録尚書事百官總已以聽見北堂書鈔設官部兩引沖帝丁酉策書曰舅氏輔翼股肱三公國之楨幹朝廷取正以成斷金太尉趙峻三世掌典機衡有匪石不二之心大司農李固公族之苗忠直不回有史魚之風今以峻為太傅固為太尉與大將軍冀參録尚書事見北堂書鈔設官部兩引初學記職官部藝文類聚職官部兩引太平御覽職官部兩引靈帝策書曰故太尉陳蕃忠亮蹇諤有不吐茹之節司徒胡廣惇德允元五世從政今以蕃為太傅與廣參録尚書事見藝文類聚職官部太平御覽職官部太師太傅太保皆古官也見初學記職官部太師古官也平帝元年孔光以太傅見授詔太師無朝十日一賜餐賜靈壽杖省中施坐置几太師入省中用杖自是而口見續漢百官志補注孝平皇帝元始元年太后詔曰太師光今年老有疾俊乂大臣惟國之重書日無遺老成國之將興尊師重傅其令太師無朝十日一賜餐賜以靈壽杖黃門令為太師于省中施坐置几太師入省用杖焉見北堂書鈔設官部初學記職官部太平御覽職官部平帝元始元年孔光以太師見授太后詔曰太師先聖之後道術通明宜居四輔職訓導帝躬見北堂書鈔設官部初學記職官部太保古官也保養也見北堂書鈔設官部藝文類聚職官部太平御覽職官部太尉秦官也武帝更名大司馬見後漢書光武紀注武帝元狩四年置大司馬以冠軍之號而無印綬見北堂書鈔設官部元狩六年罷太尉法周制置司馬時議者以為漢軍有官侯千人司馬故加大為大司馬所以別異大小司馬之號見續漢百官志一補注三司之職司馬主兵漢承秦曰太尉武帝改曰大司馬無印綬官兼加而已世祖改曰太尉見太平御覽職官部張衡云明帝更司馬司空府欲復更太尉府時公南陽趙熹也西曹椽安衆鄭均素好名節以為朝廷新造北宮整飭官寺旱魃為虐民不堪命曾無殷湯六事周宣雲漢之辭今府本館陶公主第舍員職既少自足相容熹表陳之即聽許其冬辟雍歷二府見皆壯麗而太尉府獨卑陋顯宗東顧歎息曰椎牛縱酒勿令乞兒為宰時憲子世為侍中驂乘歸具白之熹以為恨頻譴責均均自劾去道發病亡見續漢百官志一補注太平御覽職官部章帝詔曰司空牟融典職六年勤勞不怠其以融為太尉録尚書事見北堂書鈔設官部藝文類聚職官部兩引太平御覽職官部兩引殤帝策書曰司徒徐防以臺閣機密施政牧守其以防為太尉録尚書事百官總已以聽見藝文類聚職官部太尉司徒司空長史秩千石號為毗佐三台助成鼎味見太平御覽職官部東西曹掾比四百石餘掾比三百石賊曹主盜賊之事見後漢書銚期傳注決曹主罪法事見後漢書王霸傳官騎二十二人見續漢百官志一補注王莽時議以漢無司徒官故定三公之號曰大司馬大司徒大司空世祖即位因而不改見續漢百官志一補注漢儀曰司徒府與蒼龍闕對厭于尊者不敢號府應劭曰此不然丞相舊位在長安時有四出門隨時聽事明帝東京本欲依之迫于太尉司空但為東西門耳每國有大議天子車駕親幸其殿見百官志一補注通典職官相國丞相皆六國時官通典職官丞相有疾御史大夫三日一問起居百官亦如之藝文類聚引作百僚亦然朝廷遣中使太醫高手膳羞絡繹及瘳視事尚書令若光祿大夫賜以養牛上尊酒見藝文類聚職官部太平御覽職官部丞相見免乘騩馬自府歸見說文繫傳十九武帝置丞相司直元壽二年改丞相為大司徒司直仍舊今省見後漢書光武紀注梁冀傳注司徒府掾屬三十一人秩千石令史及御屬三十六人見後漢書光武紀注綏和元年罷御史大夫官法周制初置司空議者又以縣道官獄司空故覆加大為大司空亦所以別大小之文見續漢百官志一補注御史大夫尚書令司隸校尉皆專席號三獨坐見後漢書王常傳注大司空朱博奏高皇帝置御史大夫位次丞相見北堂書鈔設官部司空騎吏以下皂袴因秦水行今漢家火行宜絳袴見太平御覽服章部三公聽採長史臧否人所疾苦還條奏之是為舉謠言也頃者舉謠言屬令史都會殿上主者大言州郡行狀云何善者同聲稱之不善者默爾銜枚見後漢書蔡雍傳注范滂傳注今司徒太尉下書州郡文皆稱公蓋倉頡作書自環者謂之私背私者謂之公春秋九命作宰天子御坐即起其興為下凡拜天子臨軒六百石以上悉會直事卿贊御史授公三讓然後乃受之漢禮儀曰天子稱尊號曰皇帝言曰制補制言曰詔稱民有言有辭曰陛下今皆施行詩云肅肅王命仲山甫將之邦國若不仲山甫明之詔令之義三公三人以承君蓋由鼎有足故易曰鼎象也見北堂書鈔設官部群臣上書公卿校尉諸將不言姓凡制書皆稱璽封尚書令重封惟赦贖令司徒印露布州郡也見後漢書鮑昱傳注世祖詔方令選舉賢侒朱紫錯用丞相故事四科取士一曰德行高妙志節清白二曰學通行修經中博士三曰明達法令足以決疑能案章覆問文中御史四曰剛毅多略遭事不惑明足以決才任三輔令皆有孝悌廉公之行自今以後審四科辟召及剌史二千石察茂才尢異孝廉之吏務盡實核選擇英俊賢行廉潔平端于縣邑務授試以職有非其人臨計過署不便習官事書疏不端正不如詔書有司奏罪名竝正舉者又舊河隄謁者世祖改以三府掾屬為謁者領之遷超御史中丞剌史或為小郡監察黎陽謁者世祖以幽并州驕定天下故于黎陽立營以謁者監之兵騎千人復除甚重謁者任輕多放情態順帝改用公解府掾有清名威重者遷起牧守焉見續漢百官志一補注北堂書鈔設官部三公府有長史一人見後漢書梁冀傳注將軍周官也趙王以李牧為將軍破秦始受大名王翦灌嬰竝為之見北堂書鈔設官部將軍周官也漢興置大將軍位丞相上見北堂書鈔設官部和帝以竇憲為大將軍乃冠三公見太平御覽職官部梁冀為大將軍以三世姻媾援立之功公卿希旨上比周霍舉高第茂才官屬皆倍餘府見太平御覽職官部鼓吹二十人非常員舍人十人見續漢百官志一補注通典職官鼓吹為國盤娛禦侮爪牙見北堂書鈔儀飾部漢興置驃騎將軍位次丞相是以漢百官志云驃騎將軍秩與大將軍同見北堂書鈔設官部太平御覽職官部章帝以元舅馬防為車騎將軍服銀印青綬位在卿上絶席見續漢輿服志下補注北堂書鈔設官部太平御覽職官部和帝以竇憲為車騎將軍賜金印紫綬位次司空見續漢輿服志下補注北堂書鈔設官部武帝西征西夷有前後左右將軍為國爪牙所以揚示威靈折衝萬里見北堂書鈔設官部度遼將軍孝武皇帝初用范明友明帝十八年行度遼將軍事安帝元初元年置真銀印青綬秩二千石長史司馬六百石見續漢百官志一補注度遼將軍屯五原曼柏縣見後漢書安帝紀注將軍掾屬二十九人中大夫無員令史四十一人見後漢書東平憲王傳注太常古官也書曰伯夷典朕三禮帝曰咨伯汝作秩宗百宗公卿表云太常古官云伯夷也見北堂書鈔設官部太常古官也書曰伯夷欲令國家盛大社稷常存故稱太常以列侯為之重宗廟也見後漢書光武紀注北堂書設官部北海周澤為太常齊有疾其妻憐其年老被病窺內問之澤大怒以為千齊掾吏叩頭爭之不聽遂取送詔獄竝自劾謝議者非其淚發不實諺曰居世不諧為太常妻一歲三百六十日三百五十九日齊一日不齊醉如泥既作事復低迷見初學記職官部藝文類聚職官部太平御覽職官部卿彰也明也言當背邪向正彰有道德見北堂書鈔設官部太史令屬太常秩六百石掌天時星曆凡歲奏新年曆凡國祭祀喪娶之事奏良日國有瑞應災異掌記之見後漢書張衡傳注太平御覽職官部太史令秩六百石望郎三十人掌故三十人昔在顓頊南正重司天火正黎司地唐虞之際分命羲和曆象日月星辰敬授民時至于夏后殷周世序其官皆精研術數窮神知化當春秋時魯有梓慎晉有卜偃宋有子章鄭有裨竈觀乎天文以察時變其言屢中有備無言漢興甘石唐都司馬父子抑亦次焉未途偷進苟忝茲階既暗侯望競飭邪僞凶為吉莫之懲糾見太平御覽職官部張溫字伯慎穰人也封元鄉侯太史奏言大臣誅死董卓取溫笞殺于市而厭之見後漢書竇武傳注博士秦官也博者通博古今士者辨于然否孝武建元五年初置五經博士秩六百石後增至十四人太常差次有聰明威重者一人為祭酒總領網紀其舉狀曰生事愛敬喪沒如禮通易尚書孝經論語兼綜載籍窮微闡奧隱居樂道不求聞達身無金痍痼疾世六屬不與妖惡交通王侯賞賜行應四科經任博士下言某官某甲保舉見後漢書朱浮傳注藝文類聚職官部太平御覽職官部光武中興恢宏稽古易有施孟梁邱賀京房書有歐陽和伯夏侯勝建詩有申公轅固韓嬰春秋有嚴彭祖顏安樂禮有戴德戴勝凡十四博士太常差選有聰明威重一人為祭酒總領綱紀也見後漢書徐防傳注漢置博士祭酒一人秩六百石見唐六典二十一文帝博士七十餘人為待詔博士朝服元端章甫冠見唐六典二十一博士入平尚書出部刺史諸侯相次轉諫大夫見北堂書鈔設官部博士限年五十以上見後漢書楊仁傳注祕書監一人秩六百石見後漢書桓帝紀注唐六典十大豫樂令一人秩六百石見後漢書明帝紀注置陵園令食監各一人秩皆六百石見後漢書皇后紀注憲陵園丞秩三百石陽陵令秩六百石見後漢書段熲傳注丞皆選孝廉郎年少薄伐者遷補府長史都官令侯司馬見續漢百官志二補注光明也祿爵也勳功也言光六典郎諸虎賁羽林舉不安得賞不失勞故曰光祿勳見太平御覽職官部光祿勳有南北盧主事三署主事案後漢書張霸傳注光祿勳主事見漢官儀于諸郎之中察茂才高第者為之秩四百石次補尚書郎出宰百里見唐六典六一光祿有主簿見唐六典十五光祿舉敦厚質朴遜讓節儉此為四行見後漢書吳佑傳注范滂傳注五官中郎將秦官也秩比二千石三署郎屬焉見太御御覽職官部五宮左右中郎將秦官也秩比二千石凡郎官皆主更直執戟宿衛見北堂書鈔設官部郎中令屬官有五官中郎將左右中郎將曰三署署中各有中郎議郎侍郎郎中皆無員外多至千人主執戟衛宮陛及諸虎賁羽林郎皆屬焉謂之郎中令者言領諸郎而為之長見初學記職官部三署謂五官署也左右署各置中郎將以司之郡國舉孝廉以補三署郎年五十人以上屬五官其次分在左右署凡有中郎議郎侍郎郎中四等無員見後漢書和帝紀注建武二十四年遣中郎將段郴迎單于于五原塞見後堂書鈔設官部虎賁中郎將古官也書稱武王伐紂戎車三百兩虎賁八百人擒紂于牧之野言其猛怒如虎之奔赴也孝武建元三年初置期門平帝元始元年更名虎賁郎古有勇者孟賁改奔為賁中