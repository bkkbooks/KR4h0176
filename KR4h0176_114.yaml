後漢書桓帝紀注苑令一人秩六百石見後漢書桓帝紀注案鴻德二字從桓帝紀注以小字別之下凡倣此侍中周官也侍中便蕃左右與帝升降卒卒思近對拾遺補闕百寮之中莫密于茲見北堂書鈔設官部初學記職官部藝文類聚職官部白帖七十一太平御覽職官部侍中金彈左貂金取堅剛百鍊不耗蟬居高食潔目在腋下貂內徑悍而外溫潤貂蟬不見傳記者因物論義豫覽戰國策乃知趙武靈王胡服也其後秦始皇破趙得其冠以賜侍中高祖滅秦亦復如之孝桓末侍中皇權參乘問貂蟬何法不知其說復問地震云不為災還宮左遷議郎見續漢志輿服下補注晉書輿服志北堂書鈔設官部初學記職官部器物部藝文類聚職官部太平御覽職官部服章部侍中冠武辨大冠亦曰惠文冠加金璫附蟬為文貂尾為飾謂之貂蟬見初學記職官部侍中左蟬右貂本秦丞相史往來殿中故謂之侍中分掌乘輿服物下至褻器虎子之屬武帝時孔安國為侍中以其儒者特聽掌御坐唾壺朝廷榮之至東京時屬少府亦無員駕出則一人負傳國璽操斬蛇劍乘輿中官俱止禁中案輿當作與見通典後漢書獻帝紀注太平御覽職官部侍中秩千石見初學記職官部太平御覽職官部侍中殿下稱制出則參乘佩璽抱劍見北堂書鈔設官部文選恩幸傳論注太平御覽職官部漢成帝取明經者充侍中使辟百官公卿參議可正為止殿行則負璽舊高取一人為僕射後改為祭酒見後堂書鈔設官部史丹為侍中元帝寢疾丹以親密近臣得侍疾侯上閒獨寢時丹直入臥內頓首伏青蒲上見初學記職官部太平御覽職官部桓帝時侍中乃存年老口臭上出雞舌香與含之雞舌香頗小辛螫不敢咀咽自嫌有過得賜毒藥歸舍辭決欲就便宜家人哀泣不知其故賴寮友諸賢聞其𤡃失求視其藥出在口香咸嗤笑之更為吞食其意遂解存鄙儒蔽于此耳見北堂書鈔設官部初學記職官部藝文類聚人部太平御覽人事部職官部香部侍中周官號曰常伯選于諸伯言其道德可常尊也見文選陳太邱碑注侍中周成王常伯任侍中殿下稱制出即陪乘佩璽抱劍見文選東京賦注藉田賦注安陸王碑注漢官表曰凡侍中左右曹諸吏散騎中常侍皆加官也見通典職官漢因秦置侍中舍人見北堂書鈔設官部中常侍秦官也漢興或用士人銀璫左貂光武以後專任宦者右貂金璫見後漢書朱穆傳注太平御覽服章部給事黃門侍郎六百石無員掌侍從左右給事中使關通中外後漢書獻帝紀注給事黃門侍郎位次侍中侍從左右關通內外給事于中故曰給事黃門侍郎獻帝置六員見北堂書鈔設官部文選恩幸傳論注太平御覽職官部黃門侍郎每日暮向青鎖門拜謂之夕郎見後漢書獻書帝紀注給事中秦官也漢因之無常員皆為加官見初學記職官部漢武元鼎三年初置散騎俱掌問應對世祖省之案漢有散騎侍郎掌侍省皆為騎郎資滿五萬為常侍郎張釋之以資為常侍蓋此官也見北堂書鈔設官部秦及前漢置散騎及中常侍各一人散騎騎馬竝乘輿車獻可替否見北堂書鈔設官部藝文類聚職官部白帖七十三太平御覽職官部初學記職官部秦置散騎又置中常侍漢因之兼用士人無員多以為加官見初學記職官部黃門令秩六百石見後漢書皇后紀注黃門有畫室署玉堂署各有長一人見初學記職官部太平御覽職官部黃門冗從僕射一人秩六百石見後漢書桓帝紀注黃門鼓吹百四十五人見後漢書安帝紀注暴室在掖庭內丞一人主宮中婦人疾病者其皇后貴人有罪亦就此室也見後漢書皇后紀注永巷令一人宦者為之秩六百石掌宮婢侍使見後漢書靈帝紀注濯龍監六百石見續漢志百官三補注案此條本引作應劭漢官秩中黃藏府掌中幣帛金銀諸貨物也見後漢書桓帝紀注案續漢志中藏府令一人六百石本注曰掌中幣帛金銀諸貨物此行黃字內者署名令一人秩六百石屬少府見後漢書梁商傳注內者主帷帳見後漢書皇后紀紀朔平署司馬一人見後漢書桓帝紀注案朔平署不見于續漢志尚書令主贊奏總典紀綱無所不統秩千石故公為之朝會不陛奏事增秩二千石天子所服五時衣賜尚書令其三公列卿將五營校尉行復道中遇尚書僕射左右丞皆回車豫避衛士傳不得紆臺官官過乃得去見唐六典一太平御覽職官部尚書令侍中上東西寺及侍中寺見初學記職官部尚書令秦官銅印墨綬每朝會與司隸校尉御史大夫中丞皆專席坐京師號曰三獨坐言其尊重如此見唐六典一初學記職官部兩引藝文類聚禮部太平御覽職官部漢舊置中書官領尚書事見北堂書鈔設官部僕射秩六百石公為之加至二千石見唐六典一獻帝建安四年始置左右僕射以執金吾營郃為左僕射衛臻為右僕射見文選王文憲集序注尚書唐虞官也書曰龍作納言朕命為允詩曰惟仲山甫王之喉舌宣王以中興秦改稱尚書漢亦尊此官典機密也見北堂書鈔設官部藝文類聚職官部太平御覽職官部漢明帝詔曰尚書蓋古之納言出納朕命機事不密則害成可不慎歟見北堂書鈔設官部藝文類聚職官部太平御覽職官部尚書四員武帝置成帝加一為五有侍曹尚書主丞相御史事二千石尚書主刺史二千石事戶曹尚書主人庶上書事主客尚書主外國四夷事成帝加三公尚書主斷獄事見後漢書光武紀注尚書秩五百石次補二千石見唐六典一初秦代少府遣吏四一在殿中主發書故號尚書尚猶主也漢因秦置之故尚書為中臺謁者為外臺御史為憲臺謂之三臺見初學記職官部文選潘正叔贈王元貺詩注袁紹檄豫州注尚書左丞右丞秩各四百遷剌史見太平御覽職官部尚書令左丞總領綱紀無所不統僕射右丞掌廩假錢穀見唐六典一左右丞久次郎補也見北堂書鈔設官部案引作侍臣上注左右曹受尚書事前世文士以中書在右因謂中書為右曹又稱西掖見初學記職官部兩引太平御覽職官部尚書郎四人一人主胸奴單于營部一人主羌夷吏民一人主天下戶口土田墾作一人主錢帛貢獻委輸見北堂書鈔設官部太平御覽職官部尚書郎初從三署郎選詣尚書臺試每一郎缺則試五人先試箋奏初入臺稱郎中滿歲稱侍郎見初學記職官部尚書郎初上詣臺稱守尚書郎滿歲稱尚書郎中三年稱侍郎見太平御覽職官部郎以孝廉年未五十先試箋奏初上稱郎中滿歲為侍郎見北堂書鈔設官部尚書郎初入臺為即中滿歲稱為侍郎五歲遷太尉也見北堂書鈔設官部能通蒼頡史篇補蘭臺令史滿歲補尚書令史滿歲為尚書郎出亦與郎同宰百里郎與令史分職受書令史見僕射尚書執書拜見丞郎執板揖見唐六典一通典職官太平御覽職官部尚書郎見左右丞對揖無敬見北堂書鈔禮儀部丞郎見令僕射執板拜朝賀對揖丞郎見尚書執板對揖稱曰明時郎見左右丞對揖呼曰左右君見唐六典一初學記職官部尚書郎主作文書起草夜更直五日于建禮門內見初學記職官部白帖七十二太平御覽職官部尚書郎給青縑白綾被以錦被帷帳氈褥通中枕太官供食湯官供䴵餌五熟果實下天子一等給尚書史二人女侍史二人皆選端正從直女侍執香爐燒從入臺護衣奏事明光殿省皆胡粉塗黃賢人烈女郎握蘭含香趨走丹墀秦事黃門郎與對揖天子五時賜服若郎處曹二年賜遷二千石剌史見北堂書鈔設官部初學記職官部太平御覽職官部尚書郎奏事明光殿省中皆胡粉塗壁其邊以丹漆地胡曰丹墀尚書郎含雞舌香伏其下奏事黃門侍郎對揖跪受見太平御覽職官部案引作漢官尚書令僕丞郎月給赤管大筆一雙篆題曰北工作楷千頭上象牙寸半著筆下見藝文類聚雜文部太平御覽覽文部尚書令僕丞郎月賜渝麋大墨一枚小墨一枚見初學記文部曹郎二人掌天下歲盡集課有尚書曹郎有考功郎中一人見唐六典二武帝時館陶公主為子乞郎不許賜錢千萬上曰夫郎上應列宿出居百里使非其人民受其傷故時稱明慎之至也見北堂書鈔設官部漢制八座丞郎初拜竝集都座交禮遷又解交見唐六典一初學記職官部太平御覽職官部周禮有典瑞掌節之士蓋所以宣命重威為國信者也見北堂書鈔設官部御史中丞二人本御史大夫之丞其一別在殿中兼典蘭臺祕書外督部剌史內領侍御史受公卿章奏糾察百寮見後漢書周紆傳注初學記職官部太平御覽職官部案周紆傳注所引寮作司御史秦官也案周有御史掌邦國都鄙及萬民之治令以贊冢宰見北堂書鈔設官部太平御覽職官部案引皆曰漢官儀侍臣下曰蓋其篇名也侍御史周官也為柱下史冠法冠一曰柱後以鐵為之或說古有獬豸獸觸邪佞故執憲者以其角形為冠耳余覽奏事云始皇滅楚以其君冠賜御史漢興襲秦因而不改見後漢書何敞傳注初學記職官部服食部太平御覽職官部服章部柱史以鐵為冠張武曰當以柱史惠文冠治之見錦繡萬花谷十一柱後冠左傳南冠而繫則楚冠也秦滅楚以其冠賜近臣御史服之即今獬豸冠也古有獬薦獸觸不直者故執憲以其形用為冠令觸人也見左氏正義成公九年柱下史老聃為之秦改為御史柱下史一名柱後史謂冠以鐵為柱言其審于橈也見北堂書鈔設官部侍御史出督州郡賦稅運漕軍糧侍御史至後漢復有護漕都尉官建武七年省見通典職官老子為周柱下史張蒼秦時為御史主柱下方書侍御史之任也見初學記職官部治書侍御史宣帝嘗幸宣室齊居而決獄事令御史二人治書後置秩六百石印綬與符璽郎共平治廷尉奏事見北堂書鈔設官部蘭臺令史六人秩百石掌書劾奏見後漢書班固傳注執金吾比二千石丞六百石見續漢志百官四補注案此四條引作漢官秩執金吾典執金革以禦非常見北堂書鈔設官部吾禦也掌執金革以禦非常緹騎二百五十人輿馬導從充滿于路世祖微時歎曰仕宦當作執金吾是也見續漢志百官四補注太平御覽職官部案引作漢官太平御覽又作宰尹下執金吾屬官府武庫令丞從騎二百人持戟五百二十人輿服導從光滿道路群僚之中斯最壯矣中興以來但專徼循不預國政見北堂書鈔設官部執金吾車駕出從六百騎走六千二百人也見北堂書鈔設官部靜室令式道侯秦官也靜宮令車駕出在前驅靜清所徼車逆日以示重慎也式道左右凡三惟車駕出迎式道持麾王宮行之乃閉見北堂書鈔設官部案續漢書志執金吾下本注云本有式道左右中侯三人六百石車駕出掌在前清道還持麾至宮門宮門乃開云云此所引多當依彼訂
