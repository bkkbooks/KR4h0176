body:
  text: 應邵漢官儀下太子太傅日就月將琢磨玉質言太子有玉之質琢磨以道也見文選陸士衡侍宴宣猷堂詩注劉越石勸進表注王元長曲水詩序注太平御覽職官部詹事秦官也詹省也給也秩二千石見廣韻二十四鹽注藝文類聚職官部白帖七十一太平御覽職官部帝祖母為太皇太后其所居者長信宮見文選齊敬皇后哀策文注帝祖母稱長信宮帝母稱長樂宮故有長樂少府長信少府長信少府及職吏皆宦者為之見後漢書皇后紀注永樂太僕用中人為之見後漢書皇后紀注太子舍人王家郎中並秩二百石無員見後漢書靈帝紀注侯霸傳注皇太子五日一至臺因坐東廂省視膳食以法制敕大官尚食宰秩吏非其朝日使僕中允請問明不媟黷所以廣敬也太子僕一人秩千石中允一人四百石主門衛徼巡見後漢書班彪傳注安帝時太子謁廟門大夫乘從兩梁冠見通典職官門大夫選囚府掾屬見通典職官將作大匠世祖中興以謁者領其官章帝建初元年及置真位次河南尹永元七年大匠應慎上言百郡計吏觀國之光而舍逆旅崎嶇私館貢篚之物朽溼曝露昔晉國霸之盟主耳舍諸侯于隸人鄭子産以為大譏況今四海之大而可無乎和帝嘉納之即創業焉見續漢志補注藝文類聚職官部太平御覽職官部左授署屬將作大匠見後漢書皇甫規傳注洛陽十二門東面三門最北名上東門次南日中東門每門校尉一人秩二千石司馬一人秩千石侯一人秩六百石見後漢書張湛注張奮傳注平城門為宮門不置侯置屯司馬秩二千石見續漢百官志四補注案此條引作漢官秩十二門皆有亭見後漢書皇后紀注上西門所以不純白者漢家厄于戊故以丹漆鏤之見續漢志補注太平寰宇記河南道案續漢志補注引故丹鏤之開陽門始成未有名夜有一柱來止樓上琅邪開陽縣上言縣南城門一柱飛去光武皇帝使來識視之良是遂堅縛之因刻記其年月以名門焉見後漢書循吏傳注續漢百官志四補注水經注穀水太平寰宇記河南道雨引文選懷舊賦注太平御覽居處部屯騎越騎步兵射聲各領士七百人長水領士七千三百六十七人見後漢書安帝紀注驍騎漢官也武帝以李廣為之後世祖建武九年始改屯騎見北堂書鈔設官部越騎司馬一人秩千石見後漢書鄭衆傳注比二千石掌宿衛兵屬北軍中侯見後漢書皇后紀注司隸校尉部河南內右扶風左馮詡京兆河東宏農七郡于河南洛陽故謂東京為司見後漢書光武紀注司隸校尉征和中陽石子孫敬聲巫蠱之獄乃依周禮置司隸校尉持節都督大姦猾事復置其司今董領京師三輔三河宏農者見北堂書鈔設官部司隸校尉糾皇太子三公以下及旁州郡國無不統陛下見諸卿皆獨席見太平御覽職官部司隸校尉初置唯實領王章鮑宣糾上檢下嚴刑必斷貴戚憚之京師政清見北堂書鈔設官部司隸都官從事主洛陽百官朝會與三府掾同見後漢書竇武傳注北堂書鈔設官部案北堂書鈔引作掌陽中百姓司隸功曹從事即治中也見後漢書傅燮傳注太平御覽職官部別駕秩百石同諸郡從事見北堂書鈔設官部河南尹所治周地也洛陽本周城周之衰微分為西周秦兼天下置三川守河雒伊也漢更名河南孝武皇帝增曰太守世祖中興徙都雒陽改號為尹尹正也詩曰赫赫師尹見藝文類聚職官太平御覽職官部尹正也郡府聽事壁尹畫贊肇自建武訖于陽嘉注其清濁進退所謂不隱過不虛譽甚得述事之實後人是瞻足以勸懼雖春秋采毫毛之善貶纖介之惡不避王公無以過此尢著明也見續漢郡國志一補注仁恕掾正獄屬河南尹見後漢書魯恭傳注周監二代曰伯漢興海內未定令刺史舉州事見北堂書鈔設官部孝武皇帝南平百越北攘夷灰置交址朔方之州復徐梁之志之地改雍曰梁改梁曰益凡十三州所以交朔獨不稱州明示帝王未必相襲始開北方遂交南方為子孫基址也見後漢書光武紀注太平御覽職官部孝武元封四年始御史丞相之遷部剌史十三人乘驛奏事見北堂書鈔設官部朱博言刺史督察郡國從來故事居九步歲為守相見北堂書鈔設官部翟方進奏剌史位下大夫而臨二千石輕重失次請罷署牧秩二千石者也見北堂書鈔設官部元帝時丞相于定國條州大小為設吏員治中別駕諸部從事秩皆百石同諸郡從事見北堂書鈔設官部太平御覽職官部秦用李斯議分天下為三十六郡凡郡或以列國陳魯齊吳是也或以舊邑長沙丹陽是也或以列國陳山山陽是也或以川源西河河東是也或以所出金城城下有金酒泉泉味如酒豫章章樹生庭中鴈門鴈之所育是也或以號令禹合諸侯大計東治之山會稽是也見水經注河水太平御覽州郡部京兆絶高曰京京大也十億曰兆欲令帝都殷盈也左輔右弼蕃翊承風也張掖始開垂張臂掖也見太平御覽州郡部馮輔蕃翊故以為名見太平御覽州郡部宏大也所以廣大農業也見太平御覽州郡部濟南樂安齊國東萊平原北海六郡青州所管也青州在齊國臨淄見後漢書史弼傳注荊州管長沙零陵桂陽南陽江陵武陵南郡章陵見後漢書劉表傳注大府秩二千石丞一人邊郡稱長史皆六百石丞者丞也長史衆史之長見北堂書鈔設官部都尉秦官也本名郡尉掌左太守典其武職秩比二千石孝景時更名都尉見後漢書彭修傳注秦郡有尉一人典兵禁補盜賊景帝更名都尉建武十年省惟邊郡置都尉及屬國都尉見後漢書桓帝紀注京兆虎牙扶風都尉以涼州近羌數犯三輔將兵衛護園陵扶風都尉居雍縣故俗人稱雍營焉見後漢書安帝紀注耿恭傳注竇憲傳注南胸奴傳注蓋天生五材民並用之廢一不可誰能去兵兵之設尚矣易稱弦木為弧剡木為矢弧矢之利以威天下春秋三時務農一時講武詩美公劉匪居匪康耕出戰乃裏餱糧干戈戚揚四方莫當自郡國罷材官騎士之後官無警備實啓寇心一方有難三面救之發興雷震煙蒸電激一切取辨黔首囂然不及講其射御用其戒誓一旦驅之以即強敵猶鳩鵲捕鷹鸇豚羊弋豺虎是以每戰常負王旅張角懷挾妖偽遐邇搖蕩八州並發煙炎緯天牧守梟裂流血成川爾乃遠徵三邊殊俗之兵非我族類忿騺縱橫多僵良善以為已功財貨糞土哀夫民氓遷流之咎見出在茲不教而戰是謂棄之迹其禍敗豈虛也哉春秋家不藏甲所以一國威抑私力也今雖四海殘壞王命未洽折衝壓難若指于掌故置右扶風見續漢志百官五補注世祖中興海內人民可得而數裁十二三邊陲蕭條靡有孑遺鄣塞破壞亭隊絶滅建武二十一年始遣中郎將馬援謁者分築烽侯堡壁稍興立郡縣十餘萬戶或空置太守令長招還人民上笑曰今邊無人而設長吏治之難如春秋素王矣乃建立三營屯田殖穀弛刑謫徒以充實之見續漢郡國志五補注高祖命天下郡國選能引關蹶張材力武猛者以為輕車騎士材官樓船常以立秋後講詣課試各有員數平地用車騎山阻用材官水泉用樓船見後漢書光武紀注民年二十三為正一歲以為衛士一歲為材官騎士習射御騎馳戰陳八月太守都尉令長相丞尉會都試課殿最水家為樓船亦習戰射行船過郡太守各將萬騎行鄣塞烽火追虜置長史一人丞二人治兵民當兵行長領置部尉千人司馬侯農都尉皆不治兵不給衛士材官樓船年五十六老衰乃得免為民就田應合選為亭長亭長課徼巡尉皆習設備五兵五兵弓弩戟楯刀劍甲鎧鼓吏赤幘行縢帶劍佩刀持楯被甲設矛戟習射設十里一亭亭長亭侯五里一郵郵間相去二里半司姦盜亭長持二尺版以劾賊索繩以收執賊見續漢百官志五補注督郵功曹郡之極位見後漢書張酺傳注孝廉古之貢士者儒甲科之謂也見北堂書鈔設官部孝廉年未五十先試箋奏初上試之以事非試之以誦也見北堂書鈔設官部孝武元封四年詔曰上士貢名茂才是也見北堂書鈔設官部元朔元年詔二千石舉孝廉以化風俗也見北堂書鈔設官部元朔元年詔曰深詔執事興孝廉成風俗紹聖緒見北堂書鈔設官部和帝詔曰大郡口五十萬舉孝廉二人見北堂書鈔設官部前書百官表云萬戶以上為令喁戶以下為長三邊始孝武皇帝所開縣戶數百而或為令荊揚江南七郡惟有臨湘南昌吳三令爾及南陽穰中土沃民稠四五萬戶而為長桓帝時以江南陽安為女公主邑改號為令主薨復復其故若此為繫其本俗説令長以水土為之及秩高下皆無明文班固通儒述一代之書斯近其真見續漢百官志五補注明帝臨觀見洛陽令車騎意河南尹及至而非尤其太盛敕去軒綏時偃師治有能名以事詣臺因取賜之下縣遂以為故事見通典職官太平御覽職官部大縣丞左右尉所謂命卿三人小縣一尉一丞命卿二人見續漢百官志五補注通典職官太平御覽職官部北邊郡庫官之兵器所藏故置令見漢書成帝注注河間獻王傳如淳注使胸奴中郎將擁節秩比二千石見後漢書光武紀注使胸奴中郎將屯西河美稷縣見後漢書光武紀注擁節屯中步南設官府掾史單于歲遣侍子來朝謁者常送迎焉得賂弓馬氈罽他物百餘萬謁者事訖還具表付帑藏詔書敕自受見續漢百官志五補注護烏桓校尉孝武帝時烏桓屬漢始于幽州置之擁節監領秩比二千石見太平御覽職官部烏桓校尉屯上谷密縣見後漢書張奐傳注擁節長史一人司馬二人皆六百石並領鮮卑客賜質子歲時胡市馬見後漢百官志五補注護羌校尉武帝置秩比二千石持節以護西羌王莽亂遂罷時班彪議宜復其官以理冤結帝從之以牛邯為護羌校都尉于隴西令居縣見後漢書光武紀注擁節長史司馬二人皆六百石見續漢百官志五補注戊已中央鎮撫四方又開渠播種以為厭勝故稱戊己焉見後漢書明帝紀注西域傳注西域都護武皇帝始開通西域三十六國其後稍分至五十餘國置使者校尉以領護之宣帝神雀三年改曰都護秩二千石平帝時省都護令戊己都護領之見太平御覽職官部馬曰羈牛曰縻言制四夷如牛馬之受羈縻見史記司馬相如列傳索隱文選難蜀父老注諸侯功德優盛朝廷所敬異者賜位特進在三公下其次朝廷在九卿下其次侍祠侯其次下士小國侯以肺腑親公主子孫奉墳墓于京師亦隨時朝見是為隈諸侯見後漢書和帝紀注鄧禹傳注皇后父兄率為特進侯朝會位次三公故章帝啓馬太后曰漢典舅氏之封侯猶皇子之為王其功臣四姓為朝侯侍祠侯皆在卿校下見通典職官天子建侯上法四七見後漢書劉瑜傳注伯使主為諸侯官驅使避路于道陌中故言伯使見通典職官引云漢官中有伯使云云太保俸月三百五十斛見唐六典一中二千石俸月百八十斛見史記外戚世家索隱二千石其俸月百三十斛見史記外戚世家索隱斗食月俸一十斛佐史月俸八斛見漢書百官公卿表注通典職官張敞蕭望之言曰夫倉廩實而知禮節衣食足而知榮辱今小吏俸率不足常有憂父母妻子之心雖欲潔身為廉其勢不能請以什率增天下吏俸宣帝乃益天下吏俸什二見通典職官范遷字子閭沛人也見後漢書明帝紀注牟融傳注王敏字叔公并州隰城人也見後漢書明帝紀注尹睦字伯師河南鞏州人也見後漢書殤帝紀注魯恭傳注梁鮪字伯元河東平陽人也見後漢書和帝紀注張酺傳注周章字次叔荊州隨縣人也見後漢書安帝紀注李修字伯遊豫州襄城人也見後漢書安帝紀注虞詡傳注李膺傳注劉授字孟春徐州武原人也見後漢書安帝紀注楊震傳注呂蓋字君上范陵人也見後漢書恭傳注許訓字季師平輿人也見後漢書劉寬傳注宋俱字伯儷見後漢書宗均傳注陶敦字文理京兆人也見後漢書虞詡傳注劉矩字叔方見後漢書皇甫規傳注尹訟字公孫鞏人也見後漢書段熲傳注樊陵字德雲見後漢書李膺傳注劉宏字子高安衆人也見後漢書董卓傳注
