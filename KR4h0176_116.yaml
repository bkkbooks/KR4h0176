body:
  text: 應邵風俗通義易說天先春而後秋地先生而後凋日月先光而後幽是以王者則之亦先教而後刑三皇結繩五帝畫象三王肉刑五霸黠巧此言步驟稍有優劣也見御覽七十七傳曰后稷冬墾田流汗而種田不生者人力非不至天時不與見御覽三百八十七俗說天地開闢未有人民女媧摶黃土作人務劇力不暇供乃引繩于泥中舉以為人故富貴者黃土人貧賤凡庸者絚人也見御覽七十八又三百六十上古之時艸居露宿冬則山南夏則山北見意林大禹闕百品之羞而菲庖廚殷湯寐黃屋駕而乘露輿見御覽四百三十一孝文身履革舄而衣弋綈見御覽六百九十七秦政并吞六國苞宇宙之宏敞見文選齊敬皇后哀策文注秦相趙高指鹿為馬束蒲為脯二世不覺見文選西征賦注不舉併生三子俗說生子至于三似六畜言其妨父母故不舉之也謹案春秋國語越王句踐令民生二子者與之餼生三子者與之乳母三子力不能獨養故與乳母所以人民繁息卒滅強吳雪會稽之恥行霸于中國也古陸終氏娶于鬼方謂之女嬇是生六子皆為諸侯今人多生三子子悉成長父母完安豈有天所孕育而害其父母兄弟者哉見意林御覽三百六十一不舉寤生子俗說兒墮地便能開目視者謂之寤生舉寤生子妨父母謹案春秋左氏傳鄭武公娶于申曰武姜生莊公及共叔段莊公寤生驚姜氏因名寤生武公老終天年姜氏亦然安有妨其父母乎見御覽三百六十一不舉父同月子俗云妨父也謹案左氏傳桓公之子與父同月生因名子同漢明帝亦與光武同月生見意林御覽三百六十一不舉生鬢鬚子俗說人十四五乃當生鬢鬚今生而有之妨害父母也謹案周書靈王生而有髭王甚神聖亦克修其職諸侯服享二世休和安在其有害乎見御覽三百七十四不宜歸生俗云令人衰案婦人好以女易他男故不許歸見意林宅不西益俗說西者為上上益宅者妨家長也原其所以西上者禮記南向北向西方為上爾雅曰西南隅謂之隩尊長之處也不西益者難動搖之耳審西益有害增廣三面豈能獨吉乎見蓺文類聚六十四御覽一百八十無恙俗說恙病也凡人相見及通書問皆曰無恙謹案易傳上古之世艸居露宿恙噬人蟲也善食人心故俗相勞問者云無恙非為病也見匡謬正俗八蓺文類聚七十五史記刺客傳索隱意林御覽三百七十六又七百三十九菟髕俗說臘正旦食得菟髕者名之曰幸賞以寒酒幸者善祥令人吉利也或說食菟髕者令人面免生髕露見醜惡今覺得之嘉不為已疾也謹案尚書夏禹始作肉刑則天象而慎其過故穿窬盜竊者髕髕者去膝蓋骨也逮至暴秦亂獄糺紛烹俎車裂黔首窮愁飲泣永歎凡人食得菟髕以為佳瑞物類相感冀全已之髕也見蓺文類聚五初學記二十九御覽三十三又六百四十八又九百七十俗說臨日月薄蝕而飲令人蝕口謹案日太陽之精君之象也日有蝕之天子不舉樂里語不救蝕者出行遇雨恐有安坐飲食重慎也見御覽八百四十九俗說雷不作醬雷聲發不作醬何也令人腹內雷鳴也謹案子路感雷精而生尚剛好勇死衛人醢之孔子覆醢每聞雷心惻怛耳見北堂書鈔百四十六御覽八百六十五堪輿書云上朔會客必鬭爭案劉君陽為南陽牧嘗上朔設盛饌了無鬭者見御覽八百四十九俗云五月到官至免不遷今年有茂才除蕭令五月到官破日入舍視事五月四府所表遷武陵令余為營陵令正觸大歲主簿令余東北上余不從在事五月遷太山守見意林俗說二人共澡手令人鬭爭良無異器共當澡者其祝曰人相愛狗相齧言狗鬭時洒之以水便自解也見御覽四百九十六坐不移罇俗說凡宴飲者移轉罇酒令人鬭爭一作訟諍見御覽四百九十六又七百六十一俗說帷帳不可作衣令人病癘見書鈔百三十二御覽七百俗說臥枕戶砌鬼陷其頭令人病顛見御覽七百三十九五月蓋屋令人頭禿見初學記四御覽三十一諸郭皆諱禿見顏氏家訓書證篇下云當是前代人有姓郭而病禿者雞伏鴨卵雛成入水雞母隨岸呼之雛出而隨母鴨雞異類能相隨也見御覽九百十八呼雞曰朱朱俗說雞本朱公化而為之今呼雞皆朱朱也謹案說文解字喌二口為讙州其聲也讀若祝祝者誘致禽畜和順之意喌與朱音相似耳見初學記三十御覽九百十八呼虎為李耳俗說虎本南郡中廬李氏公所化為呼李耳因喜呼班便怒見御覽八百九十一肅肅蝦蟆掉尾俗說蝦蟆一跳八尺再跳丈六從春至冬袒裸相逐無它所作掉尾肅肅謹案蟆既處水中其尾又短正使能掉之豈能肅肅乎原其所以當言夏馬夏馬患蠅蚋掉尾振擊常肅肅也蝦蟆夏馬音相似見蓺文類聚九十三御覽九百四十九戶律漢中巴蜀廣漢自擇伏日俗說漢中巴蜀廣漢土地溫暑艸木早生晚枯氣異中國夷狄畜之故令自擇伏日也謹案漢書高帝分四郡之眾用良平之策還定三秦席卷天下蓋君子所因者本也諸公定封加以金帛重復寵異令自擇伏日不同于風俗也見蓺文類聚五御覽三十一赤春俗說赤春從人假貸皆自乏之時謹案詩曰春日載陽有鳴鶬鶊月令衣青衣服蒼玉又爾雅春曰青陽凡三春時不得服赤也今里語曰相斥角牛原其所以言牛不當斥角春不當從人求索也斥與赤音相似見御覽二十夏至著五綵辟兵題曰游光厲鬼知其名者無溫疾五綵辟五兵也案人取新斷織繫戶亦此類也謹案織取新斷二三寸帛綴著衣衿以己織維告成于諸姑也後世彌文易以五綵又永建中京師大疫云厲鬼字野重游光亦但流言無指見之者其後歲歲有病人情愁怖復增題之冀以脫禍今家人織新縑皆取著後縑絹二寸許繫戶上此其驗也見御覽二十三又八百十四五月五日賜五色續命絲俗說以益人命見蓺文類聚四初學記四御覽八百十四五月五日以五綵絲繫臂者辟兵及鬼令人不病溫又曰亦因屈原見蓺文類聚四初學記四御覽三十一五月五日集五色繒辟兵余問服君服君曰青赤白黑以為四方黃為中央襞方綴于胸前以示婦人蠶功也織麥䅌懸于門以示農工成傳聲以襞為辟兵耳見御覽三十一注云䅌麥莖也織女七夕當渡河使鵲為橋見歲華紀麗俗說高祖與項羽戰敗于京索閒遁叢薄中羽追求之時鳩正鳴其上追者以為必無人遂得脫及即位異此鳥故作鳩杖以賜老人也謹案少皞五鳩鳩民者聚民也周禮羅氏獻鳩養老漢無羅氏故作鳩杖以扶老見水經注七蓺文類聚九十二御覽七百十又九百二十一太平寰宇記五十二禹入裸國欣起而解裳俗說禹治洪水乃播入裸國君子入俗不改其恆于是欣然而解裳也原其所以當言皆裳裸國今吳郡是也被髮文身裸以為飾蓋正朔所不及也猥見大聖之君悅禹文德欣然皆著衣裳矣見御覽六百九十六眾口鑠金俗說有美金于此眾人咸共詆訾言其不純賣金者欲其售因取鍛燒以見真此所謂眾口鑠金見御覽八百十一眾心成城俗說眾人同心者可共築起一城同心共飲雒陽酒可盡也見蓺文類聚六十三錢刀俗說害中有利利旁有刀言人治下率多得錢財者必有刀劍之禍也見御覽八百三十六燒穰殺瓠俗說家人燒黍穰則使田中瓠枯死也見御覽九百七十九城門失火禍及池中魚俗說池中魚人姓字居近城城門失火延及其家仲魚燒死謹案百家書宋城門失火因汲取池中水以沃灌之池中空竭魚悉露見但就取之喻惡之滋并中傷良謹也見蓺文類聚八十又九十六意林御覽八百七十又九百三十五通鑑注梁紀十六兩怛俗說齊人有女二人求之東家子醜而富西家子好而貧父母疑不能決問其女定所欲適難指斥言者偏袒令我知之女便兩袒問其故云欲東家食西家宿此為兩怛者也見蓺文類聚四十御覽三百八十二引云齊有一女二家求之其家語其女曰汝欲東家則左袒欲西家則右袒其女兩怛父母問其故對曰願東家食而西家息以東家富而醜西家貧而美也夜糴俗說市買者當清旦而行日中交易所有夕時便罷今乃夜糴穀明其癡騃不足也凡靳不施惠者曰夜糴見御覽四百九十又七百三十九又八百二十八多末一句徒不上墓俗說新遭刑罪原解者不可以上墓祠祀令人死亡謹案孝經身體髮膚受之父母曾子病困啟手足以歸全也遭刑者髡首剔髮身被加笞新出狴犴臭穢不潔凡祭祀者孝子致齋貴馨香如親存時也見子被刑心有惻愴綠生事死恐神明不歆家當不上墓耳見御覽六百四十二俗說亡人魂氣飛揚故作魌頭以存之言頭體魌魌然盛大也或謂魌頭為觸壙殊方語也見御覽五百五十二墓上樹柏路頭石虎周禮方相氏入壙敺魍象魍象好食亡者肝腦人家不能常令方相立于墓側以禁禦之而魍象畏虎與柏見御覽九百五十四俗說齊人有空車行魯人有負釜者便持釜置車中行三百里臨別取釜各不相問為誰亦不謝後車者繫獄當死釜主竟往篡之穿壁未達曰極哉車者怒不肯出釜主慚欲與俱死明日主者以事白齊君齊君義而原之見御覽四百二十一又七百五十七案劉向別錄讎校一人讀書校其上下得謬誤為校一人持本一人讀書若怨家相對為讎見文選魏都賦注殺青書可繕寫謹案劉向別錄曰殺青者直治竹作𥳑書之耳新竹有汗善朽蠹凡作簡者皆于火上炙乾之陳楚閒謂之汗汗者去其汗也吳越曰殺殺亦治也劉向為孝成皇帝典校書籍二十餘年皆先書竹為易刊定可繕寫者以上素也由是言之殺青者竹斯為明矣今東觀書竹素也見初學記二十八御覽六百六文選張景陽雜詩注光武中興以來五曹詔書題鄉亭壁歲補正多有闕誤永建中兗州刺史過翔箋撰卷別改著板上一勞而久逸見御覽五百九十三俗說有功德賜金者皆黃金也謹案孫子兵書日費千金千金百萬錢也陳平諫楚千金贈二疏五十斤竝黃金也或云一金亦是一萬錢也見意林御覽六百三十三鹹如炭俗說鹹亦與熱正等炭火不可以入口人食得大鹹亦吐之謹案東海朐人曉知鹽法者云欖鹽木多日每燋黑如炭非謂竈中火炭也見御覽八百六十五酢如蓂莢謹案孝經說古太平蓂莢生階其味酸王者取之以調味後以醯醢代之見御覽八百六十六又八百七十三俗說𩥄馬啖賓客宴食已闕主意未盡欲復飲酒餘無施㪅出脯鮓椒薑鹽豉言其速疾如𩥄馬之傳命見書鈔百四十二御覽八百四十九案方言豚豬子也今人相罵曰孤豚之子是也見文選荅客難注馬一匹俗說相馬比君子與人相匹或曰馬夜行且明照前四丈故曰一匹俗說度馬縱橫適得一匹或說馬死賣得一匹帛或云春秋左氏說諸侯相贈乘馬束帛束帛為匹與馬相匹耳見蓺文類聚九十三御覽八百九十七車一兩謂兩兩相與為體也原其所以言兩者箱轅及輪兩兩而耦故稱兩耳見蓺文類聚七十一御覽七百七十三又七百七十六通鑑注漢紀三十三鹿車窄小裁容一鹿也或云樂車乘牛馬者剉斬飲飼達曙今乘此雖為勞極然入傳舍偃臥無憂故曰樂車無牛馬而能行者獨一人致耳見御覽七百七十五後漢書趙熹傳注通鑑注晉紀二十俗說大餓不在車飯謂正得一車飯不復活也或曰輔車上飯小小不足濟也案吳郡名酒杯為𥂸言大餓人得一𥂸飯無所益也寍相六不守熟案蒸飯㪅泥謂之餾音與六相似也見御覽四百八十六又八百五十疲馬不能度繩俗說馬羸不能度繩索或云不能度種菜畦塍也謹案齊有繩水裁廣三四步言馬之疲乃不能度此水耳見蓺文類聚九十三御覽八百九十七殺君馬者路旁兒也俗說長吏食重祿芻稾豐美馬肥希出路旁小兒觀之卻驚致死案長吏馬肥觀者快之乘者喜其言馳驅不已至于瘠死見蓺文類聚九十三御覽八百九十七賣牛勿握角令不售案恐觸人人不敢取也見御覽八百九十七
