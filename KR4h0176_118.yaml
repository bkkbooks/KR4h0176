body:
  text: 應邵風俗通義易噬嗑為獄十月之卦從犬言聲二犬亦所以守也廷者陽也陽尚生長獄者陰也陰主刑殺故獄皆在廷北順其位詩云宜犴宜獄犴司空也周禮凡萬民之有罪過未離于法者桎梏以上坐諸嘉石役諸司空令平易道路也見御覽六百四十三周禮三王始作獄夏曰夏臺言不害人若游觀之臺桀拘湯是也殷曰羑里言不害人若于閭里紂拘文王是也周曰囹圄囹令圄舉也言令人幽閉思愆改惡為善因原之也今縣官錄囚皆舉也見意林御覽六百四十三自辛為辠令其辛苦憂之也秦皇謂辠字似皇故改為罪見意林御覽六百四十一囚遒也言辭窮情得以罪誅遒也禮罪人寘諸圜土故囚罪人置諸圓士故囚字為口中人此其象也見意林初學記二十御覽六百四十二械戒也所以警戒使為善也桎實也言其下垂至地然後吐情首實見御覽六百四十四頃者廷尉多牆面而苟充茲位治書侍御史不復平議讞當糺紛豈一事哉里語曰縣官漫漫冤死者半昔在清平之世使明恕君子哀矜折獄尚有怨言況在今時耶見意林上承里語三句百里奚為秦相堂上作樂所賃澣婦自言知音呼之摶髀援琴撫絃而歌者三其一曰百里奚五羊皮憶別時烹伏雌炊扊扅今日富貴忘我為其二曰百里奚初娶我時五羊皮臨當別時烹乳雞今適富貴忘我為其三曰百里奚百里奚母已死葬南谿墳以瓦覆以柴舂黃藜搤伏雞西入秦五羖皮今日富貴捐我為問之乃其故妻還為夫婦也見樂府解題書鈔百二十八御覽五百七十二司農黃昌為蜀郡太守得所失婦便為正室使後婦下之見通典禮四十九虞眕議引又八十九河南平陰龐儉本魏郡鄴人遭倉卒之世失亡其父時儉三歲弟纔繈抱耳流轉客居廬里中鑿井得錢千餘萬遂溫富儉作府吏躬親家事行求老蒼頭謹信屬任者年六十餘置二萬錢使主牛馬耕種有賓婚大會母在堂上酒酣陳樂歌笑奴在竈下助廚竊言堂上母我婦也客罷婢語次說老奴無狀為妄語所說不可道也窮詰其由母謂婢試問其形狀奴曰家居鄴時在富樂里宛西婦艾氏女字阿橫大兒字阿嶷小兒曰越子時為縣吏為人所略賣阿橫右足下有黑子右腋下赤誌如半櫛母曰是汝公也因下堂相對啼泣兒婦前為汝公拜即洗浴身見衣被遂為夫婦如初儉子歷二千石刺史七八人時人為之語曰廬里諸龐鑿井得銅買奴得公子孫羞之言我先人初居廬里者兄弟二人家買奴得公爾見蓺文類聚三十五御覽百八十九又四百七十二又五百又八百三十六蜀郡任嘉年三四歲時父騰為諸生于漢中就師有盜賊道路斷絕蜀亦覆沒轉客長沙為州郡吏後嘉為長沙太守騰為奏曹掾默知嘉實其子也嘉母語次謂嘉曰奏曹任掾則汝父也但差老耳嘉曰天下豈獨蜀有一任夫人何以老更生邪意母曰咄我守養汝數十年無嫌譏豈以垂沒更失計哉顧實真父不可棄捐後嘉問掾聲音何類太守何州里邪掾曰本犍為武陽人蓬轉流宕到此母察審諦又識左車前贅因出抱持對之流涕嘉自拔榻歔欷哽咽見御覽二百五十九陳留太守泰山吳文章少孤遭憂衰之世與兄伯武相失別二十年後相會下邳市中爭計共鬭伯武毆文章文章欲報擊之心中悽愴手不能舉大自怪也因投杖于地觀者咸笑之更相借問乃親兄也相持涕泣觀者復曰兄校弟不得報兄向者所笑乃其義也見御覽五百十六又八百二十七汝南周霸字翁仲為太尉掾婦于乳舍生女自毒無男時屠婦比臥得男因相與私貨易裨錢數萬後翁仲為北海相吏周光能見鬼署為主簿使還致敬于本郡縣因告光曰事訖臘日可與小兒俱上冢去家經十三年不躬烝嘗主簿微察知相先君寍息會同飲食忻娛否往到于冢上郎君沃酹主簿俛伏在後但見屠者弊衣蠡結踞神坐持刀割肉有五時衣帶青墨綬數人彷徨陰堂東西廂不敢來前光怪其故還至引見問之乞屏左右起造于膝前白事狀如此翁仲曰主簿出勿言因持劍上堂問嫗女何以養此子嫗大怒曰君常言兒體質聲氣喜學似我老公欲死為作狂語翁仲具告之曰祀祭如此不具服子母立截嫗辭窮情竭泣涕具陳其故時子年已十八呼與辭決曰凡有子者欲以承先祖先祖不享血食無可奈何自以衣裘僮僕車馬迎取其女女嫁為賣餅子婦後適安平李文思文思官至南陽太守翁仲便養從弟子熙為高邑令神不歆非類明矣安得養他人子乎見意林御覽三百六十一又八百八十三將作大匠陳國公孫志節有蒼頭地餘年十七情性聰慧儀狀端正工書疏志節為戶曹史令地餘歸取資用因持車馬亡去到丹陽自云姓王名斌字文高遂留為諸曹史志節拜揚州刺史郡選曹衣冠子弟皆出斌下乃用之斌乞屏左右叩頭涕洟曰斌即明使君地餘也斌後為蒼梧太守見蓺文類聚三十五初學記十九御覽五百楊範字文瑞齊人齊宋之亂母在賊中採椹藏于地夜取之進母如是非一忽于地中得米十斛上有字云米十斛賜孝子楊範以資給母見御覽四百十一汝南王叔漢父子方出游二十餘年不還叔漢作尚書郎有人告子方死于汝南即遣兄伯三往迎喪叔漢即發哀詔書賻錢二十萬既而子方從蒼梧還叔漢詣闕乞納賻錢受虛妄罪靈帝詔將相大夫會議之博士任敏議云凡人中壽七十視父同儕亡可製服也子方在遠人指其處不可驗也罪不可加焉詔書還錢復本官見意林濟北李登為從事史病得假歸家延期後被召登自嫌不甚羸瘦謂雙生弟寍曰我兄相似人不能別汝差類病者代我至府寍曰府君太嚴得毋不可登曰我新吏耳無能識者我自行見主必死寍詣府主不辨後為人所言事發覺遂殺登見御覽六百三十四陳留張伯喈弟仲喈婦炊于竈下至井上謂伯喈曰我今日妝寍好不伯喈曰我伯喈也婦大慚愧其夕時伯喈到更衣婦復牽伯喈曰今旦大誤謂伯喈為卿荅曰我故伯喈也蓋親密莫過夫婦然尚如此況于初未相見而責先識之乎見御覽三百九十六又四百九十二陳留有富室公年九十無子取田家女為妾一交接即氣絕後生得男其女誣其淫泆有兒曰我父死時年尊何一夕便有子爭財數年不能決丞相邴吉出上殿決獄云吾聞老公子不耐寒又無影時歲八月取同歲小兒俱解衣裸之此兒獨言寒復令竝行日中獨無影大小歎息因以財與兒一作因與其財見意林御覽三百八十八又八百三十六沛郡有富家公資二千餘萬小婦子年裁數歲頃失其母又無親近其大婦女甚不賢公病困思念惡𦕓爭其財兒判不全因呼族人為遺令云悉以財屬女但遺一劍與兒年十五以還付之其後兒大姊不肯與劍男乃詣郡自言求劍謹案時太守大司空何武也得其辭因錄女及𦕓省其手書顧謂掾史曰女性強梁𦕓復貪鄙其父畏賊害其兒又計小兒正得此財不能全護故且俾與女內實寄之耳不當以劍與之乎夫劍者亦所以決斷也限年十五者智力足以自活度此女𦕓必不復還其劍當聞縣官縣官或能證察得以見伸展也凡庸何能思慮強遠如是哉悉奪取財以與子曰弊女惡𦕓溫飽十五歲亦以幸矣于是論者乃服謂武原情度事得其理見御覽六百三十九又八百三十六南郡讞女子何侍為許遠妻侍父何陽素酗酒從遠假求不悉如意陽數罵詈遠謂侍汝公復罵者吾必揣之侍曰類作夫妻奈何相辱揣我公者摶若母矣其後陽復罵遠遠遂揣之侍因上搏姑耳再三下司徒鮑宣決事曰夫妻所以養姑者也今遠自辱其父非姑所使君子之于凡庸尚不遷怒況所尊重乎當減死論見御覽六百四十陳留有趙祐者酒後自相署或稱亭長督郵祐復于外騎馬將絳幡云我使者也司徒鮑宣決獄云騎馬將幡起于戲耳無它惡意見御覽八百四十六汝南張妙會杜士士家娶婦酒後相戲張妙縛杜士捶二十下又懸足指士遂至死鮑昱決事云酒後相戲原其本心無賊害之意宜減死見意林御覽八百四十六臨淮有一人持一匹縑到市賣之道遇雨被戴後人求共庇蔭因與一頭之地雨霽當別因共爭鬭各云我縑詣府自言太守丞相薛宣劾實兩人莫肯首服宣曰縑直數百錢耳何足紛紛自致縣官呼騎吏中斷縑各與半使追聽之後人曰受恩前撮之縑主稱怨不已宣曰然固知當爾也因詰責之具服俾悉還本主見意林御覽四百九十六又六百三十九又八百十八汝南陳公思為五官掾王子祐為兵曹行會食下亭子祐會以縣官事考殺公思叔父斌斌無子公思欲為報仇不能得卒見子祐不勝憤怒便格殺之還府歸死時太守太傅胡廣以為陳公思追念叔父仁勇憤發手刃仇敵自歸司敗便原遣之見御覽四百八十二潁川有富室兄弟同居兩婦皆懷任數月長婦胎傷因閉匿之產期至同到乳舍弟婦生男夜因盜取之爭訟三年州郡不能決丞相黃霸出坐殿前令卒抱兒去兩婦各十餘步叱婦曰自往取之長婦抱兒甚急兒大啼叫弟婦恐相害之因乃放與而心甚自悽愴長婦甚喜霸曰此弟婦子也責問大婦乃伏見意林御覽三百六十一又六百三十九平原郡讞胡譚取周碧為妻譚陰陽不屬令碧與李芳張少姦通冀得其子見蓺文類聚三十五巴郡宋遷母名靜往阿奴家飲酒遷母坐上失氣奴謂遷曰汝母在坐上何無宜適遷曰腸痛誤耳人各有氣豈止我母遷罵奴奴乃持木枕擊遷遂死見御覽八百四十六扶風蘇不韋父為司隸李暠所逮暠遷遷司農不韋穿府北垣徑上聽事斫暠臥具暠一宿數遷見御覽七百八王制云東方曰夷夷者柢也言仁而好生萬物柢地而出見後漢東夷傳文注云見風俗通羌本西戎卑賤者也主牧羊故羌字從羊人因以為號無君臣上下健者為豪不能相一種別部分強者陵弱轉相抄盜男子戰死以為吉病終者送之凶見御覽七百九十四氐言抵冒貪饕至死好利樂在谿本西南夷又別種號曰白馬孝武帝遣中郎將郭昌等引兵征之降復以為武都郡見御覽七百九十四貊者謹案春秋傳大貊小貊貊略也薄也不知送往勞來無宗廟粢盛賦斂薄也見御覽七百八十胡者謹案漢書山戎之別種又胡者互也言其被髮左衽言語贄幣事殊互也殷時曰獯粥改曰匈奴見史記匈奴傳索隱昔高辛氏有犬戎之寇帝患其侵暴而征伐不剋乃訪募天下有能得犬戎之將吳將軍頭者購黃金千鎰邑萬家又妻以少女時帝有畜狗其毛五采名曰槃瓠下令之後槃瓠遂銜人頭造闕下群臣怪而診之乃吳將軍首也帝大喜而計槃瓠不可妻之以女又無封爵之道議欲有報而未知所宜女聞之以為帝皇下令不可違信因請行帝不得已乃以女配槃瓠槃瓠得女負而走入南山止石室中所處險絕人跡不至于是女解去衣裳為僕鑒之結著獨力之衣帝悲思之遣使尋求輒遇風雨震晦使者不得進經三年生子一十二人六男六女槃瓠死後因自相夫妻織績木皮染以草實好五色衣服製裁皆有尾形其母後歸以狀白帝于是使迎致諸子衣服斑蘭語言侏離好入山壑不樂平曠帝順其意賜以名山廣澤其後滋蔓號曰蠻夷外癡內黠安土樂舊以先父有功母帝之女田作賈販無關梁符傳租稅之賦有邑君長皆賜印綬冠用獺皮名渠帥曰精夫相呼為姎徒見後漢南蠻傳文注云以上竝見風俗通哀牢夷者其先有婦人名沙壹居于牢山嘗捕魚水中觸沈木若有感因懷妊十月產子男十人後沈木化為龍出水上沙壹忽聞龍語曰若為我生子今悉何在九子見龍驚走獨小子不能去背龍而坐龍因舐之其母鳥語謂背為九謂坐為隆因名子曰九隆及後長大諸兄以九隆能為父所舐而黠遂共推以為王後牢山下有一夫一婦復生十女子九隆兄弟皆娶以為妻後漸相滋長種人皆刻畫其身象龍文衣背著尾見後漢西南夷傳文注云已上竝見風俗通巴有賨人剽勇高帝為漢王時閬中人范目說高祖募取賨人定三秦封目為閬中慈鳧鄉侯并復除目所發賨人盧朴沓鄂度夕襲七姓不供租賦閬中有渝水賨人左右居銳氣善舞高祖樂其猛銳數觀其舞後令樂府習之見文選蜀都賦注槃瓠之後輸布一匹二丈是謂賨布廩君之巴氏出幏布八丈見文選魏都賦注廩君乘土船下至夷城石岸曲水亦曲廩君望之如穴狀曰我既道穴中又入此奈何石岸為崩廣三丈餘陛級之廩君行至上岸上岸有平石廣長五丈休其上投算計算處皆有石因立城其旁見北堂書鈔一百五十八秦始皇遣蒙恬築長城徒士犯罪止依鮮卑山後遂䋣息今皆髡頭衣赭亡徒之明效也見御覽六百四十九東方曰夷東方仁好生萬物觝觸地而出夷者觗也其類有九南方曰蠻君臣同川而浴極為簡慢蠻者慢也其類有八西方曰戎斬伐殺生不得其中戎者兇也其類有六北方曰狄父子嫂叔同穴無別狄者辟也其行邪辟其類有五見通鑑注漢紀二十五聲音相拊也所以輔相于樂奏樂之時先擊相見御覽五百八十四雅形如漆筩有椎禮云訊疾以雅是也同上論數十十謂之百十百謂之千十千謂之萬十萬謂之億十億謂之兆十兆謂之經十經謂之垓十垓謂之秭十秭謂之選十選謂之載十載謂之極有物有事者紀于此矣過此往者則其數可紀其名未之或聞也夫數一為特侯奇隻二為再偶兩雙三為參四為乘見御覽七百五十千生万万生億億生兆兆生京京生秭秭生垓垓生壤壤生溝溝生㵎㵎生正正生載載地不能載也見廣韻五旨步始于足足率長十寸十寸則尺一躍三尺法天地人再躍則步見文選四子講德論注踦者奇也履舄之一也見御覽六百九十七斛者角也庾三斛四斗秉二十四斛見御覽八百三十
