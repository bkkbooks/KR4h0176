body:
  text: 風俗通義氏姓上萬類之中惟人為貴春秋左氏傳官有世功則有官族邑亦如之公羊譏衛滅邢論語貶昭公娶于吳諱同姓也蓋姓有九或氏于號或氏于諡或氏于爵或氏于國或氏于官或氏于字或氏于居或氏于事或氏于職以號唐虞夏殷也以諡戴武宣穆也以爵王公侯伯也以國齊魯宋衛也以官司馬司徒司寇司空司城也以字伯仲叔季也以居城郭園池也以事巫卜陶匠也以職三烏五鹿青牛白馬也見御覽三百六十二廣韻引氏姓篇序云凡氏之興九事一氏于號唐虞夏殷是也四氏于國齊魯宋衛是也又云凡氏于諡戴武宣穆是也凡氏于字伯仲叔季是也又云氏于事巫卜陶匠是也氏于居者城郭園池是也僮氏漢有交址刺史僮尹見廣韻一東通鑑注漢紀五十四中氏漢有少府卿中京見廣韻一東蒙氏東蒙主以蒙山為氏秦有將軍蒙驁驁生武武生恬皆仕秦見通志氏族略農氏神農之後見廣韻二冬重氏顓帝重黎之後少昊時重為南正司天之事黎為北正司地之事見通志氏族略為氏漢有南郡太守為昆見廣韻五支容齊五筆隨氏隨侯之後漢有博士隨何見廣韻五支羲氏堯卿羲仲之後池氏漢有中矣令池瑗俱同上移氏齊公子雍食采于移其後氏焉見後漢楊震傳注路史國名紀通鑑注漢紀四十二漢有恆農太守移良見廣韻五支容齊五筆卑氏鄭大夫卑諶之後漢有北平太守卑躬見後漢皇后紀虞美人注容齊五筆離氏離婁孟子門人漢有中庶子離常之見通志氏族略訾氏帝嚳妃訾娵氏女皮氏周卿士樊仲皮之後漢有皮尚俱同上邳氏奚仲為夏車正自嶭封邳其後為氏漢有信都邳彤見廣韻六脂通志氏族略通鑑注漢紀三十一纍氏纍祖之後見通志氏族略資氏資成陳留人師氏師樂人瞽者之稱晉有師曠魯有師乙鄭有師悝師觸師蠲師成尸氏其先封尸鄉因以為氏齊相有尸臣旗氏齊卿公孫竈之孫欒施字子旗子孫以王父字為氏俱同上非氏非子伯益之後見廣韻八微威氏齊威王之後以田氏始王故其後以為氏見廣韻八微通志氏族略肥氏漢有肥韶英布將肥赫見通志氏族略案肥赫即下條之賁赫賁氏秦非子之後漢有賁赫見晉書音義魚氏宋桓公子目夷字子魚賢而有謀子孫以字為族見廣韻九魚通志氏族略通鑑注晉紀二十云宋公子魚之後以王父字為氏余氏秦由余之後見廣韻九魚通志氏族略通鑑注唐紀七十三諸氏漢有雒陽令諸於見廣韻九魚容齊五筆儲氏齊大夫儲子之後見後漢鮑永傳注沮氏黃帝時史官沮誦之後見後漢獻帝紀注巫氏商有巫咸巫賢漢有冀州刺史巫捷見廣韻十虞通志氏族略須氏太昊之後史記魏有須賈見廣韻十虞通鑑注周紀五蒲氏漢有詹事蒲昌見廣韻十一模壼氏漢有諫議大壼遂同上塗氏塗山氏之後漢有諫議大夫塗惲見後漢賈逵傳注廣韻十一模通志氏族略黎氏九黎之後見通志氏族略鞮氏晉銅鞮伯華之後稽氏稽黃秦賢人也俱同上窪氏漢有大鴻臚窪丹窪音圭見後漢儒林傳注廣韻十二齊枚氏六國有賢人枚被見通鑑注漢紀九裴氏伯益之後見後漢桓帝紀注臺氏金天氏裔孫曰臺駘其後氏焉見後漢獻帝紀注哀氏魯哀公之後因諡以為姓見後漢劉聖公傳注來氏楚有來英見通志氏族略真氏漢有太尉真祐見廣韻十七真通志氏族略神氏神農之後漢有騎都尉神曜見廣韻十七真頻氏漢有酒泉太守頻畼見廣韻十七真容齊五筆通志氏族略倫氏黃帝樂人伶倫氏之後見廣韻十八諄通志氏族略鈞氏楚大夫元鈞之後漢有侍中鈞喜見廣韻十八諄通志氏族略作御史鈞喜春氏楚相黃歇春申君之後見通志氏族略文氏周文王支庶以諡為氏越大夫文種芬氏晉大夫芬賢勤氏魯有大夫勤成俱同上垣秦邑也因以為姓秦始皇有將垣齮見後漢公孫述傳注案今本史記作桓齮尊氏尊盧氏之後見廣韻二十三魂賁氏魯有賁浦見通志氏族略通鑑注漢紀四恩氏陳大夫成仲不恩之後見廣韻二十四痕丹氏晉有大夫丹木見廣韻二十五寒安氏漢有安成為太守見廣韻二十五寒通志氏族略通鑑注晉紀二十八莞蘇楚大夫見呂氏春秋漢有莞路為御史中丞見宋景文公筆記冠氏古賢者鶡冠氏之後見廣韻二十六桓通志氏族略暪氏荊蠻之後本姓蠻其枝裔隨音變改為瞞氏見廣韻二十六桓關氏關令尹喜之後見廣韻二十七刪通志氏族略通鑑注漢紀二十八班氏楚令尹鬭班之後見廣韻二十七刪山氏列山氏之後晉有大夫山祈漢有武都太守山昱見通志氏族略弦氏弦子後見廣韻一先玄氏玄都古諸侯國也子孫以國為氏見通志氏族略通鑑注晉紀二十二縣氏縣成父孔子門人漢有甘陵相縣芝見通志氏族略虔氏黃帝之後莊子有虞天根同上見路史云虔氏出黃帝宣氏宋宣公之後見通志氏族略圈氏楚鬻熊之後同上騫氏仲尼弟子閔子騫之後見廣韻二仙通志氏族略蕭氏宋樂叔以討南宮萬立御說之功受封于蕭列附庸之國漢相國蕭何即其後氏也見廣韻三蕭刁氏齊大夫豎刁之後戰國時有刁勃漢有刁閒齊人以富聞子孫居勃海見廣韻三蕭通志氏族略毛氏毛伯文王子也見左傳漢有毛樗之為壽張令見宋景文公筆記聊氏聊蒼為漢侍中著子書見廣韻三蕭通志氏族略云漢侍中聊蒼著書號聊子鼂氏衛大夫史鼂之後漢有鼂錯見廣韻四宵通鑑注漢紀七饒氏漢有饒斌為漁陽太守見廣韻四宵苗氏楚大夫伯棼之後賁皇奔晉食采于苗因而氏焉見廣韻四宵通鑑注漢紀二十九徭氏東越王徭句錢之後其後以徭為姓見後漢岑彭傳注僑氏黃帝孫僑極之後見通志氏族略皋氏漢有司徒長史皋誨同上阿氏阿衡伊尹號其後氏焉見廣韻七歌通志氏族略朝𨙻東夷也其後單姓𨙻氏見通志氏族略過國夏諸侯後因為氏漢有兗州刺史過栩見廣韻八戈麻氏齊大夫麻嬰之後漢有麻達注論語又有麻光為御史大夫見通志氏族略家氏漢有家羡為劇令見廣韻九麻牙氏周大司徒君牙之後見廣韻九麻通志氏族略嘗氏齊孟嘗君之後見廣韻十陽匡魯邑也句須為之宰其後氏焉漢有匡衡見廣韻十陽通鑑注漢紀二十芳氏漢有幽州刺史芳乘乘一作垂見廣韻十陽通志氏族略通鑑注漢紀三十三方氏方雷氏之後見通志氏族略穰氏田穰苴諸田之族穰所食之邑因以氏焉同上襄氏楚大夫襄老之後見後漢襄楷傳注疆氏晉有大夫疆劍漢有疆華見通鑑注漢紀三十二昌氏黃帝子昌意之後見通志氏族略堂楚邑大夫五尚為之其後氏焉見廣韻十一唐蒼氏八凱蒼舒之後漢有江夏太守蒼英子孫遂為江夏人見通志氏族略皇氏三皇之後因氏焉左傳鄭大夫皇頡皇辰宋有皇氏為上卿本皇父充石之後以字為氏漢有琅邪相皇運同上橫氏韓王子成號橫陽君其後為氏見廣韻十二庚通志氏族略京氏鄭武公子段封于京號京城大叔其後氏焉漢有京房見廣韻十二庚通鑑注漢紀二十卿氏趙相虞卿之後戰國有卿秦為魏將或云項羽將卿子冠軍宋義之後見通志氏族略甥氏晉大夫呂甥之後見廣韻十二庚行氏漢有行祐為趙相見後漢光武紀注衡氏伊尹為為湯阿衡子孫以衡為氏一云魯公子衛之後以王父字為氏見通志氏族略廣韻十二庚引云阿衡伊尹之後又公衡魯公子後乃氏焉荊氏漢有九江太守荊修見容齊五筆營氏周成王卿士營伯之後漢有京兆尹營郃見廣韻十四清通志氏族略嬰氏晉大夫季嬰之後見廣韻十四清通志作趙嬰齊靈氏齊靈公之後或云宋公子靈圍龜之後晉有餓者靈輒見廣韻十五青冥氏漢有冥都為丞相史同上本脫史字今考增瓶氏漢有太子少傅瓶守同上泠氏黃帝時典樂泠倫之後見通志氏族略恆氏楚大夫恆思公之後漢有東安長恆裴子孫因居之弘氏衛大夫弘演之後漢有宦者弘恭為中書令乘氏楚大夫子乘之後以王父字為氏俱同上牛氏漢有牛崇為隴西主簿馬文淵為太守羊喜為功曹涼部云三牲備具見廣韻十八尢犨氏晉大夫卻犨之後同上丘氏魯丘明之後又齊太公封于營丘支孫以地為氏世居扶風漢未丘俊持節江淮屬王莽篡位遂留江左居吳興也見廣韻十八尢通鑑注魏紀十又隋紀四謀氏周卿士祭公謀父之後見廣韻十八尢通志氏族略牟子國祝融之後後因氏焉漢有太尉牟融見廣韻十八尢通志氏族略通鑑注漢紀三十七州氏晉有州綽州賓其先食采于州因以為氏見通志氏族略通鑑注魏紀七疇氏摯疇古之諸侯後有摯疇氏摯氏疇氏見路史國名紀由余秦相也見史記漢有由章至長沙太傅見宋景文公筆記猷氏衛有猷康見通志氏族略區氏歐治子之後轉為區氏王莽時有郎中區博婁氏邾婁之國子孫或以婁為氏或以邾婁為氏俱同上林氏林放之後見廣韻二十一侵針氏衛大夫針莊子同上陰氏陰康氏之後周有陰不佞管修自齊適楚為陰大夫其後氏焉見廣韻二十一侵通鑑注漢紀三十二岑氏古岑子國之後漢有岑彭見廣韻二十一侵堪氏八元仲堪之後見廣韻二十二覃聃氏周文王第十子聃季載之後見通志氏族略奄氏奄國號即商奄也魯地衛祝他曰因商奄之民以命伯禽今兗州有奄城秦大夫奄息其後也兼氏衛公子兼之後俱同上委氏漢太原太守委進見廣韻四紙李氏李伯陽之後見廣韻六止俟氏有俟子古賢人著書同上通志云六國賢人幾氏宋大夫仲幾之後以王父字為氏見通志氏族略禹氏禹支庶以為氏見路史夏后紀下處氏史記趙有辨士處子故有處姓也漢有北海相處興見廣韻八語容齊五筆作北海太守案李章傳注作太守處興旅氏周大夫子旅之後漢高功臣昌平侯旅卿傳封六代見通志氏族略所氏宋大夫華所事之後漢有諫議大夫所忠見史記司馬相如傳正義後漢獨行劉茂傳注甫氏甫侯之後見廣韻九麌府氏漢有司徒掾府悝同上見通志氏族略武氏宋武公之後漢有武臣見廣韻九麌虎氏漢有合浦太守虎旗其先八元伯虎之後見廣韻十姥容齊五筆扈氏趙有扈輒見廣韻十姥古氏周有古公亶父其後氏焉見後漢東平王蒼傳注通志氏族略邸氏漢有上郡太守邸杜見廣韻十一薺容齊五筆通志杜作社采氏漢有度遼將軍采晧見廣韻十五海蹇氏漢有蹇蘭為交趾刺史見通志氏族略滿氏荊蠻有瞞氏音舛變為滿滿有滿昌見廣韻二十四緩通志氏族略通鑑注漢紀二十六管夷吾齊桓佐也見論語漢有管虢為西河太守見宋景文公筆記顯氏顯甫為周卿見廣韻二十七銑典氏漢有校尉典韋見通志氏族略衍氏宋微仲衍之後同上矯氏晉大夫矯父之後見後漢逸民矯慎傳注昊氏昊英氏之後一云少昊之後見通志氏族略老氏顓帝子老童之後同上蔣氏周公之裔見廣韻三十六養廣氏廣成子之後見通志氏族略丙氏齊有大夫丙歜見廣韻三十八梗靖氏單靖公之後以諡為氏一云齊田氏之族靖郭君之後見廣韻四十靜通志氏族略有氏有巢氏之後仲尼弟子有若魯人漢有有祿見通志氏族略糗氏漢有糗宗為嬴長見廣韻四十四有通志氏族略壽氏吳王壽夢之後壽于姚吳大夫見後漢方術傳注通志氏族略通鑑注宋紀十二云又有大夫壽越耦氏宋卿華耦之後漢有侍中耦嘉見廣韻四十五厚通志氏族略
