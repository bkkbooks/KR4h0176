body:
  text: 風俗通義氏姓下仲氏湯左相有仲虺見廣韻一送上文見前用氏古有用國見毛詩在高唐乃用地故有用姓漢有高唐令用虯見路史國名紀容齋五筆通志氏族略雍氏文王子雍伯之後見廣韻三用被氏漢有牂柯太守被條見通志氏族略備氏宋封人備之後見廣韻六至利氏漢有利乾為中山相同上摯氏摯疇古諸侯國也周有摯荒或言帝嚳之後見通志氏族略遂虞後商人寘之遂見路史國名紀懿氏齊懿公之後見通志氏族略肆氏宋大夫肆臣之後同上食我韓公子也見戰國策漢有食子公為博士食音嗣見宋景文公筆記廣韻二十四職嗣氏衛嗣君後見廣韻七志忌氏周公忌父之後見廣韻七志通志氏族略貴氏陸終之後漢有貴遷為廬江太守見廣韻八未容齋五筆通志氏族略既氏吳夫概王之後因避仇改為既氏漢有長安長既良見通志氏族略遇氏漢有遇沖為河內太守見廣韻十遇容齋五筆通志氏族略鑄氏鑄國堯後見通志氏族略露氏漢有上黨郡尉露平見廣韻十一暮通志氏族略庫氏古守庫大夫之後以官為氏漢有輔義侯庫鈞見廣韻十一暮布氏趙有布子善相馬見通志氏族略桂氏漢有揚州刺史桂襃同上昋氏彭城昋景以為計掾見晉書謝玄傳音義世氏戰國時有秦大夫世鈞見廣韻十三祭厲氏齊厲公之後漢有魏郡太守美陽侯厲溫見通志氏族略艾氏龐儉母艾氏見廣韻十四泰通鑑注晉紀二十四賴氏漢有交阯太守賴光見廣韻十四泰容齋五筆通鑑注漢紀五十八大氏大庭氏之後見通志氏族略蒯氏晉大夫蒯得之後同上載氏姬姓之後見廣韻十九代路史國名紀信氏魏公子信陵君之後見通志氏族略胤氏夏時侯國子孫氏焉見路史國名紀通志氏族略慎氏慎到為韓大夫著慎子三十篇見通志氏族略獻氏晉獻公之後戰國時有秦大夫獻則見廣韻二十五願通志氏族略建氏楚太子建之後見通志氏族略段氏段干木之後姓段名干木見路史國名紀齊東野語云恐或失之灌氏斟灌氏之後見通鑑注漢紀一諫氏周禮有司諫氏因以為氏漢有治書侍史諫忠見廣韻三十諫通志氏族略賤氏漢有右北平太守賤瓊見廣韻三十三線容齋五筆通志氏族略孝氏齊孝公之後見通志氏族略豹氏八元叔豹之後同上到氏漢有東平太守到質見容齊五筆暴氏暴辛公周諸侯也秦有將軍暴鳶漢御史大夫暴勝之見通志氏族略播氏播鞉武商末賢人𦔯氏新鄭人揚𦔯邨在縣西二十五里匠氏古有匠石望氏齊太公望之後俱同上伉氏漢有伉喜為漢中大夫見廣韻四十二宕後漢桓帝紀注引云抗氏衛大夫三抗之後漢有抗喜為漢中太守則字當從手旁大夫亦當為太守也曠氏師曠之後見通志氏族略敬氏陳敬仲之後見廣韻四十三映通鑑注隋紀六令氏楚令尹子文之後見通鑑注漢紀七史記孝文本紀索隱救氏漢有諫議大夫救仁見廣韻四十九宥通志仁作乂晝氏齊大夫食邑于晝後因氏焉見路史國名紀通志氏族略廣韻云晝邑大夫之後廖氏古有廖叔安左傳作飂蓋其後也漢有廖覲為鉅鹿太守見通志氏族略通鑑注漢紀三十竇氏夏后相遭有窮氏之難其妃方娠逃出自竇而生少康其後氏焉見廣韻五十侯通鑑注漢紀五監氏衛康叔為連屬之監其後氏焉見廣韻五十九鑑通志氏族略鹿氏漢有巴郡太守鹿旗見廣韻一屋容齋五筆通鑑注晉紀二十沐氏漢有東平太守沐寵見廣韻一屋容齋五筆通鑑注漢紀四十六鞠氏漢有尚書令平原鞠譚或為麴氏音之譌也見通志氏族略宿氏漢有雁門太守宿詳見廣韻一屋容齋五筆通鑑注魏紀四牧氏漢有越巂太守牧稂見廣韻一屋鄐氏漢有東海太守鄐熙見容齋五筆祿氏紂子武庚字祿父其後以字為氏見通志氏族略沃氏太甲子沃丁之後見廣韻二沃通志氏族略督氏宋大夫華父督之後晉有督戎漢有五原太守督瓚瓚一作廣韻二沃容齋五筆通志氏族略僕氏漢有渾梁侯僕多見廣韻二沃蓐氏蓐收之後見路史國名紀通志氏族略逯秦邑也其大夫氏焉漢有大司空逯竝見廣韻三燭通志空作馬濯氏濯輯之後見廣韻四覺郅氏郅商時侯國也見毛詩漢有濟南太守郅都見路史國名紀通志氏族略通鑑注漢紀八述氏魯大夫仲述之後見廣韻六術謁氏古有謁者官因以為氏漢有汝南太守謁渙又張湯小吏謁居見廣韻十月容齋五筆通志氏族略闕氏承闕黨童子之後縱橫家有闕子著書漢有荊州刺史闕翊見通志氏族略勃氏宋左師勃之後也晉有寺人勃鞮見通志氏族略葛氏葛天氏之裔同上滑氏漢有詹事滑典見廣韻十四黠頡氏蒼頡古之賢人頡衛古之賢者見廣韻十六屑鐸氏漢有廷尉鐸政見通志氏旅略幕氏舜祖幕之後落氏皋落氐翟國也此赤翟別種俱同上作氏周公之子胙侯子孫因避地改焉漢有涿郡太守作顯見通志氏族略容齋五筆博氏漢有博子勞善相馬見通志氏族略廣韻云古有博勞薄氏衛賢臣薄疑漢高帝薄夫人生文帝夫人弟昭封軹侯官至車騎將軍子戎奴嗣見通志氏族略通鑑注周紀四柏氏柏皇氏之裔見通志氏族略笮氏楚有笮倫見通鑑注漢紀六十一獲氏宋大夫猛獲之後見通志氏族略昔氏周大夫封昔因氏焉漢有昔登為烏傷令見路史國名紀容齋五筆通志氏族略赤氏帝嚳師赤松子之後見通志氏族略析氏齊大夫析歸父見廣韻十三錫職氏漢有山陽令職洪見廣韻二十四職容齋五筆嗇氏古嗇氏子孫因氏焉見通志氏族略即氏漢有單父令即賣其先食采即墨因以命氏見通志氏族略習氏習國名漢有習響為陳相見通志氏族略通鑑注魏紀四集氏漢有外黃令集一見廣韻二十六緝容齋五筆通鑑注魏紀九集作習疑彼誤汲氏衛宣公太子伋之後居汲因以為氏見通志氏族略葉氏楚沈尹戍生諸梁食采于葉因氏焉捷氏邾公子捷菑之後漢蓺文志有捷子二篇六國時人輒氏衛出公輒之後漢有輒終古莢氏莢成僖子晉大夫見世本甲氏大甲之後一云鄭大夫石甲之後俱同上鄴氏漢有梁令鄴風見廣韻三十三業東郭氏東郭牙齊大夫咸陽其後也見史記平準書索隱東陵氏東陵侯邵平子孫氏焉見通志氏族略東方氏伏羲之後帝出于震位東方子孫因氏焉平原厭次漢太中大夫東方朔見能改齋漫錄公乘姓也見晉書音義公賓姓也魯大夫公賓庚之後見後漢劉聖公傳注通鑑注漢紀三十一公族氏晉成公立嫡子為公族大夫韓無忌號公族穆于見後漢黨錮傳注公玉氏齊涽王臣有公玉冉其後也見史記封禪書索隱中壘氏劉向為中壘校尉支孫氏焉見通志氏族略終黎氏見史記秦本紀集解終古氏終古紂內史也因氏焉見通志氏族略龍丘氏漢有高士龍丘萇同上司寇氏蘇忿生為武王司寇後以官為氏禮記司寇惠子魯大夫見廣韻五十侯通志氏族略司鴻氏古有司鴻苟著書漢中大夫司鴻儀見通志氏族略鴟夷氏本范蠡也綦母氏漢有廷尉綦母參俱同上期思氏有期思國見廣韻七之威王氏漢有中郎威王弼出自楚威王後見廣韻十陽諸葛氏葛嬰為陳涉將軍有功而誅孝文帝追錄封其孫諸縣侯因並氏焉見吳志諸葛瑾傳注通志氏族略通鑑注漢紀二十渠丘氏晉有渠丘公見路史國名紀晉疑莒之譌於陵氏陳仲子齊世家辭爵灌園于於陵因氏焉見通志氏族略夫餘氏吳公子夫概奔楚餘子在吳以夫餘為氏見廣韻九魚通志氏族略母車氏樂安母車伯奇為下邳相有主簿步邵南時人稱母車府君步主簿見廣韻十虞胡母氏本陳胡公之後也公子完奔齊遂有齊國齊宣王母弟別分母鄉遠本胡公近取母邑故曰胡母氏也見後漢獻帝紀注通鑑注漢紀四十八西鄉氏宋大夫西鄉錯之後見通志氏族略路史高辛紀下注申徒氏隨音改為申屠氏申徒狄夏賢人也湯以天下授之恥以不義聞已自投于河莊子申徒兀者鄭人也漢有平西將軍申徒建勝屠即申徒也見史記酷吏傳索隱新垣氏魏將新垣衍畢公高之後漢書文帝時新垣平善望氣見通志氏族略淳于小國也桓五年不復其國子孫以國為氏同上聞人氏少正卯魯之聞人也其後氏焉見後漢靈帝紀注通志氏族略通鑑注漢紀四十八軒轅氏軒轅即黃帝也姓公孫或言姓姬見通志氏族略盆成氏盆成括仕齊孟軻知其必死其子逃難改氏成焉見廣韻二十三魂棍牟子古賢者著書見廣韻二十四痕邯鄲氏因國為姓漢有衛尉邯鄲義見廣韻二十五寒鮮于氏武王封箕子于朝鮮其子食采于朝鮮因氏焉見後漢第五倫傳注案通鑑注引姓譜云武王封箕子于朝鮮支子仲食采于于因以鮮于為氏此稱食采朝鮮疑譌高堂氏齊卿高敬仲食采于高堂因氏焉見通志氏族略通鑑注魏紀五陽成氏陽成胥渠晉隱士也漢有諫議大夫陽成公衡見通志氏族略將作氏漢官有將作少府因官為氏王人氏王人子突之後因氏焉漢有安平太守王人宰公王史氏周先王太史號王史氏俱同上棠谿氏吳夫概王奔楚封棠谿因以為氏見後漢延篤傳注青烏氏漢有青烏子善數術見廣韻十五青青陽氏青陽黃帝子也始得姓焉見通志氏族略丁若氏齊丁公子懿伯食采于若因氏焉同上周生姓也見後漢馮衍傳注投壼氏晉中行穆子相投壼因以氏焉見廣韻十九侯侯史氏董狐為晉侯史官因氏焉見通志氏族略斟灌氏夏諸侯也子孫氏焉三烏氏有三烏大夫因氏焉澹臺氏澹臺滅明字子羽武城人漢有博士澹臺恭子仲氏魯宣公子仲之後子獻氏齊大夫子獻之後也楚文王時子獻遼為大夫俱同上鬼谷氏鬼谷先生六國時縱橫家見通鑑注周紀二武強氏漢武強侯王梁其後因封為氏見廣韻九麌武成氏趙平原君勝封武成君因氏焉見通志氏族略五鹿氏五鹿衛邑也晉公子重耳封舅犯于五鹿支孫氏焉漢有少府五鹿充宗五王氏齊自威宣湣襄至建五王因以為氏古成氏苦成之後後隨音改焉漢有廣漢都尉古成雲俱同上混沌氏少昊之良佐漢有屯莫如為常山太守見宋景文公筆記引蕭該漢書音義困學紀聞十二浩羊氏齊大夫浩羊嘉見通志氏族略社南氏其先齊倡徙居社南因以為氏見廣韻三十五馬社北氏與社南皆齊倡見通志氏族略義渠氏狄國為秦所滅因氏焉御龍氏陶唐氏之後有劉累學擾龍事夏孔甲賜氏曰御龍氏庫成氏本苦成方言音變為庫城俱同上帝疇氏見路史四第八氏亦齊諸田之後田廣弟田英為第八門因氏焉王莽時有講學大夫第八矯見通志氏族略內史氏周內史叔興之後也周又有內史過見通志氏族略信都氏張敖尚漢魯元公主封于信都因氏焉謝丘氏周宣王支子食采謝丘祝其氏宋戴公之子公子祝其為大司寇因氏焉漢有清河都尉祝其承先俱同上牧師氏見廣韻六脂窒中姓見史記高祖功臣表索隱屈侯氏魏賢人屈侯鮒漢有郎中令屈侯豫見通志氏族略路史注褐冠氏賨人以褐冠為姓褐冠子著書見通志氏族略列僊氏見路史四櫟陽氏漢景丹封櫟陽侯丹曾孫分避亂櫟陽因封為氏焉見通志氏族略白馬氏微子乘白馬朝周因氏焉白象氏白象先生古隱者白鹿氏白鹿先生古賢人著書柏成氏柏成子高堯時諸侯也百里氏秦大夫百里奚之後其先虞人家于百里因氏焉息夫氏息公子邊為大夫因氏焉漢有光祿大夫息夫躬墨夷氏宋大夫有墨夷須黑夷皋俱同上
