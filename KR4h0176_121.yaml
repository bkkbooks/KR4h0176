body:
  text: 風俗通義災異順帝之末京師謠曰直如弦死道邊曲如鉤反封侯見文選袁淑白馬篇注御覽七百六十七桓帝元嘉中京師婦人作愁眉啼妝墮馬髻折腰步齲齒笑愁眉者細而曲折啼妝者薄拭目下若啼痕墮馬髻者側在一邊折腰步者足不任體齲齒笑者若齒痛不欣欣始自梁冀家所為京師翕然皆放效之天戒若曰將收捕冀婦女憂愁踧眉將啼也見後漢梁冀傳注御覽三百六十五又四百八十八延熹中京師長者皆著木屐婦女始嫁至作漆畫屐五采為系謹案黨事始發傳詣黃門北寺臨時惶恐不能信天任命多有逃亡不就考者九族拘擊及所過歷長幼婦女皆被桎梏應木屐像矣見御覽六百四十四又六百九十八桓帝初京師童謠曰車班班入河閒言徵靈帝者輪班擁節入河閒也見續漢書五行志注京師童謠曰嚼復嚼今年尚可後年譊京師謠歌曰烏臘烏臘案逆臣董卓滔天虐民窮凶極惡關東舉兵欲共誅之轉相顧望莫肯先進處處停兵數十萬若烏臘蟲相隨橫取之矣中平中京師歌董逃董卓以董逃之歌主為已發大禁絶之死者千數俱同上孝靈帝建寧中京師長者皆以葦辟方笥為妝其時有識者竊言葦方笥郡國讞篋也今珍用之天下皆當有罪讞于理官也後黨錮皆讞廷尉人名悉入葦方笥中斯為驗矣見書鈔百三十五御覽七百十一靈帝時京師賓婚嘉會皆作魁𣠠酒酣之後續以挽歌魁𣠠喪家之樂挽歌執紼相偶和之者天戒若曰國家當急殄悴諸貴樂皆死亡也自靈帝崩後京師壞滅戶有兼尸蟲而相食魁𣠠挽歌斯之效乎見續漢書五行志注靈帝數以車騎將軍過拜孽臣內孽又贈亡人顯號加于頑凶印綬汙于腐尸昔辛有睹被髮之祥知其為戎今假號雲集不亦宜乎同上靈帝于西園宮中駕四白驢躬自操轡馳驅周旋以為大樂于是公卿貴戚轉相倣至乘軒以為騎從價與馬齊凡人相罵曰死驢醜惡之稱也董卓陵虐王室執政皆死驢者服重致遠上下山谷野人之所用耳何有帝王君子而驂駕之者乎天意若曰國有大亂賢愚倒植凡執政者皆如驢也見御覽九百一靈帝好胡服胡帳胡床京師皆競為之後董卓擁胡兵掠宮掖見御覽六百九十九又七百六光和元年司徒長史馮巡馬生胡子問養馬胡蒼頭乃姦此馬以生子見續漢書五行志注光和中雒陽男子夜龍從兄陽求臘錢龍假取䋣數頗厭患之陽與錢千龍意不滿欲破陽家因持弓矢射玄武東闕三發吏士呵縛首服因是遣中常侍尚書御史中丞直事御史謁者衛尉司隸河南尹雒陽令悉會發所劭時為太尉議曹掾白公鄧盛夫禮設闕觀所以飾門章于至尊縣諸象魏示民禮法也故車過者下步過者趨今龍乃敢射闕意慢事醜次于大逆宜遣主者參問變狀公曰府不主盜賊當與諸府相侯劭曰丞相邴吉以道路死傷既往之事京兆長安職所窮逐而住車問牛喘吐舌者豈輕人而貴畜哉頗念陰陽不和必有所害掾史爾乃悅服漢書嘉其達大體今龍所犯然中外奔波邴吉防患太豫況于已形昭晰者哉明公既處宰相大任加掌兵戎之職凡在荒裔謂之大事何有近日下而致逆節之萌者孔子攝魯司寇非常卿也折僭溢之端消纖介之漸從政三月惡人走境邑門不闔外收強齊侵地內虧三桓之威區區小國尚于趣舍大漢之朝焉可無乎明公恬然謂非已詩云儀刑文王萬國作孚當為人制法何必取法于人于是公意大悟遣令史謝申以鈴下規應掾自行之還其條奏時靈帝詔報惡惡止其身龍以重論之陽不坐其後車騎將軍何苗與兄大將軍進部兵相攻擊戰于闕下苗死兵敗殺數千人龍者陽類君之象也夜者不明之應也此其象也同上熹平二年六月雒陽民訛言虎賁寺東壁中有黃人形容鬚眉良是觀者數萬省內悉出劭時為郎故往視之何在其有人也走漏汙處膩赭流漉壁有他剝數寸曲折耳謹案季夏土黃中行用事又在壁中壁亦土也以見于虎賁寺者虎賁國之祕兵扞難禦侮必示于東東者動也言當出師行將天下搖動也天之以類告人甚于影響也同上光和四年四月南宮中黃門寺有一男子長九尺服白衣中黃門解步呵問汝何等人白衣妄入宮掖曰我梁伯夏後天使我為天子步欲前收取因忽不見謹案尚書春秋左傳曰伯益佐禹治水封于梁飂叔安有裔子曰董父實甚好龍龍多歸之帝舜嘉之賜姓董氏董氏之祖與梁同焉到光熹元年董卓自外入因閒乘釁廢帝殺后百官總己號令自由殺戮決前威重于主梁本安定而卓隴西人俱涼州也天戒若曰卓不當專制奪矯如白衣無宜蘭入宮也白衣見黃門寺及卓之末中黃門誅滅之際事類如此可謂無乎同上靈帝之末禮樂崩壞賞刑失中毀譽無驗競飾僞服以蕩典制遠近翕然威名後生放聲者為時人有識者竊言舊曰世人次曰俗人今更曰時人此天促其期也其閒無幾天下大壞也同上熹平中有兩樗一宿長丈餘作人狀頭目宛然見御覽九百五十九夏禹廟中有梅梁忽一春生枝葉見御覽九百七十靈帝光和七年陳留濟陰諸郡西及成皋陽武城郭路邊草生作人狀操持矛弩牛馬萬狀備具後關東義兵先起于宋衛之郊東郡太守橋瑁負衆怙亂陵蔑同盟忿嫉同類以殞厥命陳留濟陰迎助謂為離德棄好即戎吏民殲殘草𡝩之異豈不或信見續漢書五行志注御覽九百九十四中平中懷陵上有雀萬餘亂鬭殺頭懸著樹也見御覽九百二十二
