body:
  text: 應瑒愁霖賦聽屯雷之恆音兮聞左右之歎聲情慘憒而含欷兮起披衣而遊庭三辰幽而重關蒼曜隱而無形雲曖曖而周馳雨濛濛而霧零排房帳而北入振蓋服之沾衣還空床而寢息夢白日之餘暉惕中寤而不效兮意悽悷而增悲見藝文類聚二靈河賦咨靈川之遐原兮于崙崑之神丘凌增城之陰隅兮賴后土之潛流銜積石之重險兮披山麓而溢浮蹶龍黃而南邁兮紆鴻體而因流涉津洛之阪泉兮播九道乎中州汾澒涌而騰騖兮恆亹亹而徂征肇乘高而迅逝兮陽侯怖而振驚有漢中葉金隄隤而瓠子傾興萬乘而親務董群后而來營下淇園之豐篠投玉璧而沈星若夫長杉峻檟茂栝芬橿扶流灌列映水蔭防隆條動而畼清風白日顯而曜殊光見水經河水注五藝文類聚八初學記六龍艘白鯉越艇蜀舲泝遊覆水帆柁如林見北堂書鈔未改本一百三十七一百三十八正情賦夫何媛女之殊麗兮咨溫惠而明哲應靈和以挺質體蘭茂而瓊潔方往載其鮮雙曜來今而無列發朝陽之鴻暉流精睇而傾泄既榮麗而冠時援申女而比節余心嘉夫淑美願結歡而靡因承窈窕之芳美情踊躍乎若人魂翩翩而夕遊甘同夢而交神畫倣徨于路側宵耿耿而達晨清風厲于玄序涼颷逝于中唐聽雲鴈之翰鳴察列宿之華輝南星晃而電隕偏雄肅而特飛冀騰言以俯首嗟激迅而難追傷往禽之無隅悼流光之不歸愍伏辰之方逝哀吾願之多違步便旋以永思情憀栗而傷悲還幽室以假寐固展轉而不安神眇眇以潛翔恆存遊乎所觀仰崇夏而長息動哀響而餘歎氣浮踊而雲館腸一夕而九煩見藝文類聚十八思在前為明鏡哀既往于替口見北堂書鈔一百三十六撰征賦奮皇佐之豐烈將親戎乎幽鄰飛龍旗以雲曜披廣路而北巡崇殿鬱其嵯峨華宇爛而舒光摛雲藻之雕飾流輝采之渾黃辭曰烈烈征師尋遐庭兮悠悠萬里臨長城兮周覽郡邑思既盈兮嘉想前哲遺風聲兮見藝文類聚五十九西征賦鸞衡東指弭節蓬澤見水經二十二渠水注西狩賦伊炎漢之建安飛龍躍乎天衢皇宰奕而陶運樹匡翼而大摹蕩無妄之氛穢揚威靈乎八區開九土之舊迹暨聲教于海隅時霜凄而淹野寒風肅而川逝草木紛而搖蕩鷙鳥別而高厲既乃揀吉日練嘉辰清風矢戒屏翳收塵于是魏公乃乘雕輅駟飛黃擁簫鉦建九幢按轡清途颯沓風翔屬車轇轕羽騎騰驤于是圍網周合雷鼓天震千乘長羅萬表星陳雙翼伉旌八校祖分長燧電舉高煙蔽雲爾乃徒輿並興方軌連質驚颷四駭衝禽驚溢騁獸塞野飛鳥蔽日爾乃赴玄谷陵崇巒俯掣奔猴仰捷飛猿雲幕被于廣野京燎照乎平原醴炮充給洪施普宣見藝文類聚六十六馳射賦于是陽春嘉日講肆餘暇將逍遙于郊野聊娛遊于騁射延賓鞠旅星言夙駕樹應鞞于路左建丹旗于表路群駿籠茸于衡首咸皆腰裊與飛菟隴修勒而容與並軒翥而厲怒爾乃結翻侔齊倫匹良樂授馬孫臏調駟籌算克明班次均一左攬繁弱右接湛衛控滿流睇應弦飛碎旝動鼓震譟聲雷潰重破纍𥗋流景倏忽紛紜絡驛次授二八放鞚長騁神足奔越終節三驅矢不虛發進截飛鳥顧摧月支須紆六釣口彎七規觀者并氣息而傾竦咸側企而騰移爾乃縈回盤厲按節和旋翩翩神厲體若飛仙奕奕騂牡既佶且間揚驪沛艾蠖略相連見藝文類聚六十八御覽三百五十八引兩條節飾齊明見文選赭白馬賦注校獵賦乃命有司巡士周尋二虞萊野三扈表禽北彌大陸南厲黃涔見初學記二十二兩引神女賦騰玄眸而睋青陽離朱脣而耀雙輔紅顏曄而和妍時調聲以笑語見御覽三百八十一車渠碗賦惟茲碗之珍瑋誕靈嶽而奇生扇不周之芳烈浸瓊露以潤形蔭碧條以納曜吸朝霞而發榮紛元黃以肜裔曄豹變而龍華象蜿虹之輔體中含曜乎雲波若其衆色鱗聚卓度詭常絪縕雜錯乍圓乍方蔚術繁興散列成章揚丹流縹碧玉飛黃華氣承朗內外齊光見藝文類聚七十三竦迷迭賦列中堂之嚴宇跨階序而駢羅建茂莖以竦立擢修幹而成阿燭白日之炎陰承翠碧之繁柯朝敷條以誕節夕結秀而垂華振纖枝之翠粲動採葉之莓莓舒芳香之酷烈乘清風以徘徊見藝文類聚八十一御覽九百八十二楊柳賦赴陽春之和節植纖柳以承涼攄豐節而廣布紛鬱勃以敷陽三春倏其奄過景日赫其垂光振鴻條而遠壽回雲蓋于中唐見藝文類聚八十九鸚鵡賦何翩翩之麗鳥表衆豔之殊色被光耀之鮮羽流玄黃之華飾苞明哲之弘慮從陰陽之消息秋風厲而潛形蒼神發而動翼見藝文類聚九十一慜驥賦慜良驥之不遇兮何屯否之弘多抱天飛之神號兮悲當世之莫知赴玄谷之漸塗兮陟高岡之峻崖懼僕夫之嚴策兮載悚栗而奔馳懷殊姿而困遇兮願遠迹而自舒思奮行而驤首兮叩韁紲之紛拏牽繁轡而增制兮心慉結而槃紆涉通逵而方舉兮迫輿僕之我拘抱精誠而不畼兮鬱神足而不攄思蒒翁于西土兮望伯氏于東隅願浮軒于千里兮曜華軛乎天衢瞻前軌而促節兮顧後乘而踟蹰展心力于知己兮甘邁遠而忘劬哀二哲之殊世兮時不遘乎良造制銜轡于常御兮安獲騁于遐道見藝文類聚九十三表長戟百萬胡馬千群見御覽三百五十三報龐惠恭書夫蕭艾之歌發于信宿子襟之思起于嗣音況實三載能不有懷雖萱草樹背皋蘇在側悒憤不逞秖以增毒朝隱之官賓不往來喬木之下曠無休息抱勞而已足下剖符南面振威千里行人子羽朝夕相繼曾不枉咫尺之路問蓬室之舊過意賜書辭不半紙慰藉輕于繒縞譏望重于丘山是角弓之詩所以為刺也值鷺羽于苑丘騁駿足于株林發明月之輝光照妖人之窈窕斯亦所以眩耳目之觀聽亡身命于知友者也見藝文類聚二十二釋賓聖人不違時而遁迹賢者不背俗而遺功見文選七命注九有威夷始失其政見文選袁宏三國名臣序贊注子猶不能騰雲閣攀天衢見文選劉峻廣絶交論注文質論蓋皇穹肇載陰陽初分日月運其光列宿曜于文百穀麗于土芬華茂于春是以聖人合德天地稟氣淳靈仰觀象于玄表俯察式于群形窮神知化萬物是經故否泰易趍道無攸一二政代序有文有質若乃陶唐建國成周革命九官咸乂濟濟休令火龍黼黻暐鞾于廊廟袞冕旗旒舄奕乎朝廷冠德百王莫參其政是以仲尼歎煥乎之文從郁郁之盛也夫質者端一玄靜儉嗇潛化利用承清泰御平業循軌量守成法至乎應天順民撥亂夷世摛藻奮權赫奕丕烈紀禪協律禮儀煥別覽墳丘于皇代建不刊之洪制顯宣尼之典教探微言之所弊若乃和氏之明璧輕縠之袿裳必將遊玩于左右振飾于宮房豈爭牢偽之勢金布之剛乎且少言辭者孟僖所以答郊勞也寡智見者慶氏所以困相鼠也今子棄五典之文暗禮智之大信管望之小尋老氏之蔽所謂循軌常趍未能釋連環之結也且高帝龍飛豐沛虎據秦楚唯德是建唯賢是與陸酈摛其文辨良平奮其權諝蕭何創其章律叔孫定其庠序周樊展其忠教韓彭列其威武明達天下者非一士之術營宮廟者非一匠之矩也逮自高后亂德損我宗劉朱虛軫其慮辟強釋其憂曲逆規其模酈友詐其遊龔據北軍實賴其疇冢嗣之不替實四老之由也夫諫則無議以陳問則服汗沾濡豈若陳平敏對叔孫據書言辨國典辭定皇居然後知質者之不足文者之有餘見藝文類聚二十二奕勢蓋棊奕之制所由來尚矣有像軍戎戰陳之紀旌旗既列權慮蜂起絡繹雨集魚鱗鴈峙奮維闡翼固衛邊鄙寇動北疊備在南尾或飾遁偽旋卓轢軿列羸師延敵一乘虛絶歸不得合兩見擒滅淮陰之謨拔旗之勢也或匡設無常尋變應危寇動北壘備在南麾中棊既捷四表自虧亞夫之智耿弇之奇也或假道四布周爰繁昌雲合星羅侵逼郊場師弱衆寡臨據孤亡披掃強禦廣略土疆昆陽之威官渡之方也挑誘既戰見欺敵對紛拏相救不量進退群聚俱隕力行唐突瞋目恚憤覆局崩潰項將之咎楚懷之悖也時或失謬收奔攝北還自保固完聚補塞見可而進先負後剋燕昭之賢齊項之德也長驅馳逐見利忘害輕敵寡備所喪彌大臨疑猶豫算慮不詳苟貪少獲不知所亡當斷不斷還為所謀項羽之失吳王之尢也持棊相守莫敢先動由楚漢之兵相拒索鞏也見藝文類聚七十四御覽七百五十三九宮賦伊黃靈之典度存乎文昌之會宮翳華蓋之葳蕤依上帝以隆崇握璇璣而布政總四七而持綱和日月之光曜均節度以運行序列宿之煥爛咸垂景以煌煌歷天陰之晦暗陽玉石以炳明鏡大道之浩廣泑沈漭以扎坱眄旭歷而鋭鋃廓𡶋喊以閲閬即蹴縮以檽坎烻援以渞楊衛𩦮騮騔以差羸磋磊晧皓以駿樂銀拂律以順遊徑閨闥而出玉房謁五嶽而朝六宗對祝融而督勾芒蕩翊翊而敝降聊優遊以尚陽跖崑崙而蹈碣石跪砥柱而跨大行肘熊耳而據桐柏介嶓冢而持外方浣彭蠡而洗北海淬五湖而漱華池粉白沙而饞定容卷南越以騰歷連明月以為懸剝駭雞以為叉繞績組而攝雲鬱垂獨繭而服離袿戴㠍岌而帶繚繞曳陶匏以委蛇乘根車而駕神馬驂䮡駽而俠窮奇使織女驂乘王良為之御三台執兵而奉引軒轅乘駏驉而先驅招搖豐隆騎師子而俠轂各先後以為雲車左青龍而右觜觿前七星而後騰蛇徵太一而聚群神趣熒惑而叱太白東井輟𨍕而播灑慧勃佛仿以捎擊四徼塵于于道絶引者而驚鞸𧈪尤之倫玢璘而要班懶垂金干而揵雄戟操巨𥼅之礉弩齊佩機而鳴廓狼狐彀張而外饗枉矢持芒以岝迅衝風而突飛電振雲嵱岫而土崆山巃狡猾而蹴踐蛚走札揭而獠桔梗櫟略玃而突列蛸橋律屈而卻梁黨巷溏而觸螟蜓抶礕礰而撲雷公摽缺而拂勃決奮雲旗而椎鴻鐘聲淳淪以純侖四海淡而袥地梁碎太山而刺嵩吸江河而嘬九江登嶕嶢之釐臺窺天門而閃帝宮享嘉命而延壽樂斯宮之無窮見古文苑藝文類聚七十八讓東郡太守疏臣江淮孤賤愚矇小生經學行能無可算録遭值太平先人餘福得以弱冠特蒙徵用連階纍任遂極臺閣訖無纖介稱報恩效死誠不意悟卒被非望顯拜近郡尊位千里臣聞量能授官則職無廢事因勞施爵則賢愚得宜臣香小醜少為諸生典郡從政固非所堪誠恐矇頓孤忝聖恩又惟機密端首至為尊要復非臣香所當久奉承詔驚惶不知所裁臣香年在方剛適可驅使願乞餘恩留備冗官賜以督責小職任之宮臺煩事以畢臣香螻蟻小志誠瞑目至願土灰極榮見後漢黃香傳留為尚書令上疏以錐刀小用蒙見宿留見文選曹植求通親親表注引東觀漢記樂承王萇罪議自非聖人不能無過故王太子生為立賢師傅以訓導之是以目不見惡耳不聞非能保其社稷高明令終萇少長藩國內無過庭之訓外無師傅之道血氣方剛卒受榮爵幾微生過遂陷不義臣聞周官議親蠢愚見赦萇不殺無辜以譴呵為非無赫赫大惡可裁削奪損其租賦令得改過自新革心向道見後漢樂成王黨傳注引袁宏紀尚書侍郎冷宏議云云又引黃香集香與宏共奏此香之辭也天子冠頌惟永元之盛代聖皇德之茂純躬蒸蒸之至孝崇敬順以奉天以三載之孟春建寅月之上旬皇帝將加玄冕簡甲子之元辰厥日王于太皞厥時叶于百神皇輿幸夫金根六玄虬之連蜷建螭龍以為旗鳴節路之和鑾既臻廟以成禮乃回軫而反宮正朝服以享燕撞大蔟之庭鐘祚蕃屏而鼎輔暨夷蠻之君王威進酌于金罍獻萬壽之玉觴見通典五十六初學記十四御覽五百四十屏風銘古典務農刻鏤傷民忠在竭節義在修身見書鈔一百三十二御覽五百九十七因災異上疏薦黃錯任棠間者以來卦位錯謬寒燠相干蒙氣數興日暗月散原之天意殆不虛然陛下宜開石室案河洛外命史官悉條上永建以前至漢初災異與永建以後訖于今日孰為多少又使近臣儒者參考政事數見公卿察問得失諸無功德者宜皆斥黜臣前頗陳災眚并薦光祿大夫樊英太中大夫薛包及會稽賀純廣漢楊厚朱蒙御省伏見處士巴郡黃錯漢陽任棠年皆耆耋有作者七人之志宜更見引致助崇大化見後漢黃瓊傳因六旱復上疏昔魯僖遇旱以六事自讓躬節儉閉女謁放讒佞者十三人誅稅民受貨者九人退舍南郊天立大雨今亦宜顧省政事有所損闕務存質儉以易民聽尚方御府息除煩費明敕近臣使遵法度如有不移示以好惡數見公卿引納儒士訪以政化使陳得失又囚徒尚積多致死亡亦足以感傷和氣招降災旱若改敝從善擇用嘉謀則災消福至矣見後漢黃瓊傳上疏請行藉田禮自古聖帝哲王莫不敬恭明祀增致福祥故必躬郊廟之禮親藉田之勤以先群萌率勸農功昔周宣王不藉千畝虢文公以為大譏卒有羌戎之難終損中興之名竊見陛下遵稽古之鴻業體虔肅以應天順時奉元懷柔百神朝夕觸塵埃于道路晝暮聆庶政以恤人雖詩詠成湯之不怠遑書美文王之不暇食誠不能加今廟祀適闋而祈穀潔齋之事近在明日臣恐左右之心不欲屢動聖躬以為親耕之禮可得而廢臣聞先王制典藉田有日司徒咸戒司空除壇先時五日有協風之應王即齋宮饗醴載耒誠重之也自癸巳以來仍西北風甘澤不集寒涼尚結迎春東郊既不躬親先農之禮所宜自勉以逆和氣以致時風易曰君子自強不息斯其道也伏願陛下率群后冕旒三推則和澤滂流蒼生有賴見後漢黃瓊傳又見袁宏後漢紀十九又御覽五百三十二引漢名臣奏又五百三十七疾篤上疏臣聞天者務剛其氣君者務強其政是以王者處高自持不可不安履危任力不可不據夫自持不安則顛任力不據則危故聖人升高據上則以德義為首涉危蹈傾則以賢者為力唐堯以德化為冠冕以稷契為筋力高而益崇動而愈據此先聖所以長守萬國保其社稷者也昔高皇帝應天順民奮劍而王掃除秦項革命創制降德流祚至於哀平而帝道不剛秕政日亂遂使姦佞擅朝外戚專恣所冠不以仁義為冕所蹈不以賢佐為力終至顛蹶滅絶漢祚天維陵弛民鬼慘愴賴皇乾眷命炎德復輝光武以聖武天挺繼統興業創基冰泮之上立足枳棘之林擢賢于衆愚之中畫功于無形之世崇禮義于交爭循道化于亂離是自歷高而不傾任力危而不跌興復洪祚開建中興光被八極垂名無窮至于中葉盛業漸衰陛下初從藩國爰升帝位天下拭目謂見太平而即位以來未有勝政諸梁秉權豎宦充朝重封纍職傾動朝廷卿校牧守之選皆出其門羽毛齒革明珠南金之寶殷滿其室富擬王府勢回天地言之者必族附之者必榮忠臣懼死而杜中萬夫怖禍而木舌塞陛下耳目之明更為聾瞽之主故太尉李固杜喬忠以直言德以輔政念國亡身隕歿為報而坐陳國議遂見殘滅賢愚切痛海內傷懼又前白馬令李雲指言宦官罪穢宜誅皆因衆人之心以救積薪之敝弘農杜衆知雲所言宜行懼雲以忠獲罪故上書陳理之乞同日而死所以感悟國家庶雲獲免而雲既不辜衆又并坐天下尤痛益以怨結故朝野之人以忠為諱昔趙殺鳴犢孔子臨河而反夫覆巢破卵則鳳皇不翔刳牲夭胎則麒麟不臻誠物類相感理使其然尚書周永昔為沛令素事梁冀幸其威勢坐事當罪越拜令職見冀將衰乃陽毀示忠遂因姦計亦取封侯又黃門協邪群輩相黨自冀興盛腹背相親朝夕圖謀共搆姦軌臨冀當誅無可設巧復記其惡以要爵賞陛下不加清澄審別真偽復與忠臣尚書令尹勳等並時顯封使朱紫共色粉墨雜蹂所謂扺金玉於沙礫碎圭璧于泥塗四方聞之莫不憤歎傷陛下失賞于見誣虧爵于姦臣昔曾子大孝慈母投杼伯奇至賢終于流放夫讒諛所舉無高而不可升阿黨相抑無深而不可淪可不察歟陛下年在方剛聖慮未衰願還既誤之封折后族之勢夫懷寶者須世抱璞者待時陛下誠能行臣所陳則懷寶抱璞之徒特將竭力致身以趨盛世臣至頑駑世荷國恩身輕位重勤不補過然懼于永歿負釁益深敢以垂絶之日陳不諱之言庶有萬分無恨三泉見後漢黃瓊傳又見袁宏後漢紀二十二有刪節亦有多出語上言舉吏宜覆試覆試之作將以澄洗清濁覆實虛濫不宜改革見後漢黃瓊傳封梁冀議冀前以親迎之勞增邑三千又其子胤亦加封賞昔周公輔相成王制禮作樂化致太平是以大啓土宇錫以山川開地七百郊祀天地行天子禮此百世未有唯周公宜之耳今諸侯以戶邑為制不以里數為限蕭何識高祖于泗水霍光定傾危以興國皆益戶增封以顯其功冀可比鄧禹合食四縣賞賜之差同于霍光使天下知賞必當功爵不越德見袁宏後漢紀二十一又後漢黃瓊傳少五語奏論樊稜許相太尉樊稜司徒許相皆竊位懷祿苟進無恥終無匡救之益必有覆公折足之患宜皆罷遣以清治路軍費雖急禮義廉恥國之大本也苟非其選飛隼在墉為國生事此猶負石救溺不可不察見袁宏後漢紀二十七初平三年又見北堂書鈔影宋本二百六十引張方楚國先賢傳駮遷都長安議昔周公營洛邑以寧姬光武卜東都以隆漢天之所啓神之所安大業既定豈宜妄有遷動以虧四海之望見後漢黃琬傳
