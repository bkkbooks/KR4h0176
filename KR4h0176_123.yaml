body:
  text: 傅毅洛都賦惟漢元之運會世祖受命而弭亂體神武之聖姿握天人之契贊揮電旗于四野拂宇宙之殘難受皇號于高邑修茲都之城館尋歷代之規兆仍險塞之自然被崑崙之洪流據伊洛之雙川挾成皋之巖阻扶二崤之崇山砥柱回波綴于後三塗太室結于前鎮以嵩高喬嶽峻極于天分畫經緯開正塗軌序立廟祧面朝後市歎息起氛霧奮袂生風雨覽正殿之體制承日月之晧精騁流星于突陋追歸鴈于軒軨帶螭龍之疏鏤垂菡萏之敷榮顧濯龍之臺觀望永安之園藪渟清沼以泛舟浮翠虯與玄武桑宮繭館區制有規后帥九嬪躬敕工女近則明堂辟雍靈臺之列宗祀揚化雲物是察其後則有長岡芒阜屬以首山通谷岋岢石瀨寒泉于是乘興鳴和按節發軔列翠蓋方龍輈被五路之時副攬三辰之旗斿傅說作僕羲和奉時千乘雷駭萬騎星鋪絡繹相屬揮沫揚鑣群仙列于中庭發魚龍之巨偉羡門拊鼓偓佺操麾講武農隙掖獵因田弋高冥之獨鵠連軒翥之雙鵾搜幽林以集禽激通川以篽獸跨乘黃射遊麋弦不虛控目不徒睎解腋分心應箭殪夷然後弭節容與淥水之濱垂芳餌于清流出漩瀨之潛鱗見藝文類聚六十一又初學記二十四引三條反都賦因龍門以暢化開伊闕以達聰見水經伊水注舞賦楚襄王既遊雲夢使宋玉賦高唐之事將置酒宴飲謂宋玉曰寡人欲觴群臣何以娛之玉曰臣聞歌以詠言舞以盡意是以論其詩不如聽其聲聽其聲不如察其形激楚結風陽阿之舞材人之窮觀天下之至妙噫可以進乎王曰如其鄭何玉曰小大殊用鄭野異宜弛張之度聖哲所施是以樂記干戚之容雅美蹲蹲之舞禮設三爵之制頌有醉歸之歌夫咸池六英所以陳清廟協神人也鄭衛之樂所以娛密坐接歡欣也餘日怡蕩非以風民也其何害哉王曰試為寡人賦之玉曰唯唯夫何皎皎之閒夜兮明月爛以施光朱火曄其延起兮耀華屋而熺洞房黻帳袪而結組兮鋪首炳以焜煌陳茵席而設坐兮溢金罍而列玉觴騰觚爵之斟酌兮漫既醉其樂康嚴顏和而怡懌兮幽情形而外揚文人不能懷其藻兮武毅不能隱其剛簡惰跳踃般紛拿兮淵塞沈蕩改恆常兮于是鄭女出進二八徐侍姣服極麗姁偷致態貌嫽妙以妖蠱兮紅顏曄其揚華眉連娟以增繞兮目流睇而橫波珠翠的礫而照耀兮華袿飛髾而雜纖羅顧形影自整裝順微風揮若芳動朱脣紆清陽亢音高歌為樂之方歌曰攄豫意以弘觀兮繹精靈之所束弛緊急之絃張兮慢末事之骩曲舒恢炱之廣度兮闊細體之苛縟喜關睢之不淫兮哀蟋蟀之局促啓泰貞之否隔兮超遺物而度俗揚激徵騁清角贊舞操奏均曲形態和神意協從容得志不劫于是躡節鼓陳舒意自廣遊心無垠遠思長想其始興也若俯若仰若來若往雍容惆悵不可為象其少進也若𦒡若行若竦若傾兀動赴度指顧應聲羅衣從風長袖交橫駱驛飛散颯擖合并鶣𪅃燕居拉㧺鵠驚綽約閒靡機迅體輕姿絶倫之妙態懷愨素之潔清修儀操以顯志兮獨馳思乎杳冥在山峨峨在水湯湯與志遷化容不虛生明詩表指嘳息激昂氣若浮雲志若秋霜觀者增歎諸工莫當于是合場遞進按次而俟埒材角妙夸容乃理軼態橫出瑰姿譎起眄般鼓則騰清眸吐哇咬則發晧齒摘齊行列經營切擬倣佛神動回翔竦峙擊不致策蹈不頓趾翼爾悠往暗復輟已及至回身還入迫于急節浮騰纍跪跗踏摩跌紆形赴遠漼似摧折纖縠蛾飛紛猋若絶超𧼯鳥集縱弛殟歿蜲蛇姌嫋雲轉飄曶體如遊龍袖如素霓黎收而拜曲度究畢遷延微笑退復次列觀者稱麗莫不怡悅于是歡洽宴夜命遣諸客擾躟就駕僕夫正策車騎竝狎巃嵸逼迫良駿逸足蹌捍陵越龍驤橫舉揚鑣飛沫馬材不同各相傾奪或有踰埃赴轍霆駭電滅跖地遠群暗跳獨絶或有宛足鬱怒般桓不發後往先至遂為逐末或有矜容愛儀洋洋習習遲速承意控御緩急車音若雷騖驟相及駱漠而歸雲散城邑天王燕胥樂而不泆娛神遺老永年之術優哉游哉聊以永日見文選藝文類聚四十三初學記十五古文苑以為宋玉作雅琴賦歷嵩岑而將降睹鴻梧于幽阻高百仞而不枉對修條以特處蹈通涯而將圖遊茲梧之所宜蓋雅琴之麗朴乃升伐其孫枝命離婁使布繩施公輸之剞劂遂雕琢而成器揆神農之初制盡聲變之奧妙抒心志之鬱滯見藝文類聚四十四初學記十六案喬世寧汪士賢等以此賦入蔡雍集誤也絶激哇之淫見文選東京賦注時促均而增徽接角徵而控商見文選琴賦注明仁義以厲已故永御而密親見文選琴賦注扇賦背和曖于青春踐朱夏之赫戲搖輕箑以致涼爰自尊以暨卑纖竹廓素或規或矩見書鈔一百三十四與荊文姜書雖死之日猶生之年見文選曹植求自試表注七激徒華公子託病幽處游心于玄妙清思乎黃老于是玄通子聞而往屬曰僕聞君子當世而光迹因時以舒志必將銘勒功勳懸著隆高今公子削迹藏體當年陸沈變度易趣違拂雅心挾六經之指守偏塞之術意亦有所蔽與何圖身之謬也僕將為公子論天下之至妙列耳目之通好原情心之性理綜道德之彌奧豈欲聞之乎公子曰僕雖不敏固願聞之玄通子曰洪梧幽生生于遐荒陽春後榮涉秋先雕晨颷飛躒孫禽相求積雪涐涐中夏不流于是乃使夫遊官失勢窮擯之士泳溺水越炎火窮林薄歷隱深三秋乃獲斷之高岑梓匠摹度擬以斧斤然後背洞壑臨絶溪聽迅波望層崖太師奏操榮期清歌歌曰陟景山兮採芳苓哀不慘傷樂不流聲彈羽躍水叩角奮榮沈微玄穆感物悟靈此亦天下之妙音也子能強起而聽之乎玄通子曰單極滋味嘉旨之膳芻豢常珍庶羞異饌鳧鴻之羹粉梁之飯涔養之魚膾其鯉魴分毫之割纖如髮芒散如絶穀積如委紅芳甘百品竝仰纍重異珍殊味厥和不同既食日晏乃進夫雍州之梨出于麗陰下生芷隰上託桂林甘露潤其葉醴泉漸其根脆不抗齒在口流液握之摧沮批之離坼可以解煩悁悅心意子能起而食之乎玄通子曰驥騄之乘龍驤超攄騰虛鳥踊莫能執御于是乃使王良理轡操以術教踐路促節機登飆驅前不可先後不可追踰埃絶影倏忽若飛日不轉曜窮遠旋歸此蓋天下之駿馬子能強起而乘之乎玄通子曰三時既逝季冬暮歲玄冥終統庶卉零悴王在靈囿講戎𥳑旅于是駟驥騄乘輕軒麾旄旗鳴八鸞陳衆車于廣隰散列騎乎平原屬罘網以彌野連罻羅以營山部曲周匝風動雲旋合圍促陳禽獸駭殫什不暇起窮不及旋擊不待刀骨解肉離摧牙碎首分其文皮流血丹野羽毛翳日于是下蘭皋臨流泉觀通谷望景山酌旨酒割芳鮮此天下之至娛也子能強起而觀之乎玄通子曰當館侈飾洞房華屋楹桷雕藻文以朱緑曾臺百仞臨望博見俯視雲霧騁目窮觀園藪平夷沼池漫衍禽獸群交芳草華蔓于是賓友所歡近覽從容詹公沈餌蒲且飛紅綸不虛出矢不徒降投鉤必獲控弦加雙俯盡深潛仰殫輕翼日移怠倦然後宴息列觴酌醴妖靡侍側被華文曳綾縠弭隨珠珮琚玉紅顏呈素峨眉不畫脣不施朱髮不加澤升龍舟浮華池紆帷翳而永望鏡形影于玄流偏滔滔以南北似漢女之神遊笑比目之雙躍樂偏禽之匹嬉此亦天下之歡也子能強起而與之遊乎玄通子曰漢之盛世存乎永平太和協畼萬機穆清于是群俊學士雲集辟雍含詠聖術文質發曚達羲農之妙旨照虞夏之典墳遵孔氏之憲則投顏閔之高迹推義窮類靡不博觀光潤嘉美世宗其言公子瞿然而興曰至乎主得聖道天基允臧明哲用思君子所常自知沈溺久蔽不悟請誦斯語仰子法度見藝文類聚五十七迎歸雲遡游風見文選思玄賦注潘嶽懷舊賦注潘正叔迎大駕詩注無物可樂顧望懷愁見文選洛神賦注暗君逐臣頑父放子見文選陸機君子行注排挫禮學譏譴世僞見文選鷦鷯賦注顯宗頌體天統物濟寧兆民見文選曹植責躬詩注引傅毅上明帝頌表蕩蕩川瀆既瀾且清見文選張華勵志詩注引傅毅顯宗頌竇將軍北征頌逮漢祖之龍興荷天符而用師曜神武于幽冀遇白登之重闈何獯鬻之桀虐自弛放而不羈哀昏戾之習性阻廣漢之荒垂命竇侯之征討躡衛霍之遺風奉聖皇之明策奮無前之嚴鋒採伊吾之城壁蹈天山而遙降曝名烈于禹跡奉旗鼓而來旋聖上嘉而褎寵典禁旅之戎兵內雍容以詢謨外折衝于無形惟倜儻以弘遠委精慮于朝廷見藝文類聚五十九西征頌慍昆夷之匪協咸矯于戎事干戈動而復戢天將祚而隆化見御覽三百五十一扇銘翩翩素圓清風載揚君子玉體賴以寧康冬則龍潛夏則鳳舉知進能退隨時出處見北堂書鈔一百三十四明帝誄惟此永平其德不回恢廓鴻績遐方是懷明明肅肅四國順威赫赫盛漢功德巍巍躬履聖德以臨萬國仁風弘惠雲布雨集武伏蚩尢文騰孔墨下制九州上係皇極豐美中世垂華億載冠堯佩舜踐履五代三雍既洽帝道繼備七經宣畼孔業淑著明德慎罰尊上師傅薄刑厚賞惠茲仁恕明竝日月無有偏照譬如北辰與天同曜發號施合萬國震懼庠序設陳禮樂宣布璇璣所建靡不奄有貢篚納賦如歸父母正朔永昌冠帶儋耳四方共貫八極同軌見藝文類聚十二北海王誄永平六年北海靜王薨于是境內市不交易塗無征旅農不修畝室無女工感相慘怛若喪厥親府哭后土仰訴皇旻于是群英列俊靜思勒銘惟王德是昭是明存隆其實光曜其聲終始之際于斯為榮乃作誄曰覽視昔初若論往代有國有家篇籍攸載貴鮮不驕滿罔不溢莫能履道聲色已卒惟王建國作此蕃弼撫綏方域承翼京室對揚休嘉光昭其則溫恭朝夕敦循伊德見藝文類聚四十五作傅龍誤古文苑作傅毅七興子康子有疾王先生往焉曰駿駔之馬慉不征路其荷衡也曜似驚禽其即行也翬若游鷹飆駭風逝電發波騰影不及形塵不暇興見藝文類聚五十七文選七命注季南碑棲景曜于衡門見文選謝希逸宣貴妃誄注遺敕諸子昔延州使齊子死嬴博因坎路側遂以葬焉今蜀道阻遠不宜歸塋可止此葬足藏髮齒而已務遵速朽副我本心人生一世但當畏敬于人若不善加己直為受之見後漢張霸傳上言召嚴崇子宣官無曉六十律以準調音者故待詔嚴崇具以準法教子男宣宣通習願召宣補學官主調樂器見續漢律曆志上又宋書曆志一崇作嵩上言與北虜互市北單于復願與吏人合市見後漢南胸奴傳上言宜還北虜生口北虜以前既和親而南部復往鈔掠北單于謂漢欺之謀欲犯塞謂宜還南所掠生口以慰安其意見後漢南胸奴傳又見袁安傳有刪節因災旱上言斷獄不盡三冬故陰氣微弱陽氣發泄招致災旱事在于此見後漢陳寵傳又通典一百六十六上言宜均輸穀所以貴由錢賤故也可盡封錢一取布帛為租以通天下之用又鹽食之急者雖貴人不得不須官可自鬻又宜因征交址益州上計吏往來市珍貨收采其利武帝時所謂均輸者也見後漢朱暉傳族斬龔壽表壽常律殺人不至族然壽為惡隱密經年王法自所不免令鬼神訴者千載一請皆斬之以明鬼靈以助陰教見搜神記上封事言諸竇夫忠臣憂世犯主嚴顏譏剌貴臣至以殺身滅家而猶為之者何邪君臣義重有不得已也臣伏見往事國之危亂家之將凶皆有所由較然易知昔鄭武公之幸叔段衛莊公之寵州吁愛而不教終至凶戾由是觀之愛子若此猶飢而食之以毒適所以害之也伏見大將軍竇憲始遭大憂公卿比奏欲令典幹國事憲深執謙退固辭盛位懇懇勤勤言以深至天下聞之莫不悅喜今踰年無幾大禮未終卒然中改兄弟專朝憲秉三軍之重篤景總宮衛之權而虐用百姓奢侈僭逼誅戮無罪肆心自快今者論議洶洶咸謂叔段州吁復生于漢臣觀公卿懷持兩端不肯極言者以為憲等若有匪懈之志則已受吉甫褎申伯之功如憲等陷于罪辜則自取陳平周勃順呂后之權終不以憲等吉凶為憂也臣敞區區誠欲計策兩安絶其綿綿塞其涓涓上不欲令皇太后損文母之號陛下有誓泉之譏下使憲得長保其福祐然臧獲之謀上安主父下存主母猶不免于嚴怒臣伏惟纍祖蒙恩至臣八世復以愚陋旬年之閒歷顯位備機近每念厚德忽然忘生雖知言必夷滅而冒死自盡者誠不忍目見其禍而懷默苟全駙馬都尉瓌雖在弱冠有不隱之忠比請退身願抑家權可與參謀聽順其意誠宗廟至計竇氏之福見袁宏紀上疏諫為竇篤竇景起邸第臣聞胸奴之為桀逆久矣平城之圍嫚書之恥此二辱者臣子所為捐軀而必死高祖呂后忍辱還忿舍而不誅伏惟皇太后秉文母之操陛下履晏晏之姿胸奴無逆節之罪漢朝無可慚之恥而盛春東作興動大役元元怨恨感懷不悅而猥復為衛尉篤奉車都尉景繕修館第彌街絶里臣雖斗筲之人誠竊懷怪以為篤景親近貴臣當為百僚表儀今衆軍在道朝廷焦脣百姓愁苦縣官無用而據起大第崇飾玩好非所以垂令德示無窮也宜且罷工匠專憂北邊恤人之困見後漢何敞傳理郅壽疏臣聞聖王闢四門開四聰延直言之路下不諱之詔立敢諫之旗聽歌謠于路爭臣七人以自鑒照考知政理違失人心輒改更之故天人竝應傳福無窮臣伏見尚書僕射郅壽坐于臺上與諸尚書論擊胸奴言議過差及上書請買公田遂繫獄考劾大不敬臣愚以為壽機密近臣匡救為職若懷默不言其罪當誅今壽違衆正議以安宗廟豈其私邪又臺閣平事分爭可否雖唐虞之隆三代之盛猶謂諤諤以昌不以誹謗為罪請買公田人情細過可裁隱忍壽若被誅臣恐天下國家以為橫罪忠直賊傷和氣忤逆陰陽臣所以敢犯嚴威不避夷滅觸死瞽言非為壽也忠臣盡節以死為歸臣雖不知壽度其甘心安之誠不欲聖朝行誹謗之誅以傷塞晏之化杜塞忠直垂譏無窮臣敞謬豫機密言所不宜罪名明白當填牢獄先壽僵仆萬死有餘見後漢郅惲附傳又略見袁宏後漢紀十二上疏諫濟南王康蓋聞諸侯之義以制節謹度為忠然後能保其社稷和其民昔管仲相齊九合之功而孔子譏其器小以奢侈逼上不知禮也今大王以骨肉之親享蕃國之尊當率先天下以為化首施張政令明其典法出入進止宜有期度輿馬臺隸應為科品今國家制度王侯車馬服章事有其科不可越也而今奴婢廄馬皆有千餘增無用之口以自蠶食宮婢閉隔失其天性感亂和氣又多起內第觸犯防禁費以巨萬而功猶未半夫文繁者質荒木勝者人亡經傳所載皆非所以奉禮承上傳福無窮者也且君國者以道德仁義為營豈飾宮室充實虦廄馬為尊哉楚作章華以凶吳興姑蘇而滅景公千駟民無稱焉其效也如大王數游諸第出入無節或涉晨夜又非所以遠防未然臨深履薄之法也願大王修恭儉遵古制以法自治以禮率下省奴婢之口減乘馬之數斥私田之富節游觀之宴以禮起居則敞乃敢安心自保藥酒苦于口而利于病至言逆于耳便于行惟大王深察愚言見袁宏後漢紀十四又見後漢濟南王康傳奏記宋由敞聞事君之義進思盡忠退思補過歷觀世主時臣無不各欲為化垂之無窮然而平和之政萬無一者蓋以聖主賢臣不能相遭故也今國家秉聰明之弘道明公履晏晏之純德君臣相合天下翕然治平之化有望于今孔子曰如有用我者三年有成今明公視事出入再期宜當克己以酬四海之心禮一穀不升則損服徹膳天下不足若己使然而比年水旱人不收穫涼州緣邊家被凶害男子疲于戰陳妻女勞于轉運老幼孤寡歎息相依又中州內郡公私屈竭此實損膳節用之時國恩覆載賞賚過度但聞臘賜自郎官以上公卿王侯以下至于空竭帑藏損耗國資尋公家之用皆百姓之力明君賜賚宜有品制忠臣受賞亦應有度是以夏禹玄圭周公束帛今明公位尊任重責深負大上當匡正綱紀下當濟安元元豈但空空無違而已哉宜先正己以率群下還所得賜因陳得失奏王侯就國除苑囿之禁節省浮費賑恤窮孤則恩澤下畼黎庶悅豫上天聰明必有立應使百姓歌誦史官紀德豈但子文逃祿公儀退食之比哉見後漢何敞傳又說宋由劉畼宗室肺腑茅土藩臣來弔大憂上書須報親在武衛致此殘酷奉憲之吏莫適討捕蹤迹不顯主名不立敞備數股肱職典賊曹故欲親至發所以糾其變而二府以為故事三公不與賊盜昔陳平生于征戰之世猶知宰相之分云外鎮四夷內撫諸侯使卿大夫各得其宜今二府執事不深惟大義惑于所聞公縱姦匿莫以為咎惟明公運獨見之明昭然勿疑敞不勝所見請獨奏案見後漢何敞傳與班超書君侯在外國三十餘年而小人猥承君後任重慮淺宜有以誨之見袁宏後漢紀
