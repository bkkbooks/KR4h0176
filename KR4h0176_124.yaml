body:
  text: 崔駰大將軍西征賦序主簿駰言愚聞昔在上世義兵所克工歌其詩具陳其頌書之庸器列在明堂所以顯武功也于是襲孟秋而西征跨雍梁而遠蹤陟隴阻之峻城升天梯以高翔旗旐翼如遊風羽毛紛其覆雲金光晧以奪日武鼓鏗而雷震見藝文類聚五十九反都賦並序漢曆中絶京師為墟光武受命始遷洛都客有陳西土之富云洛邑褊小故略陳禍敗之機不在險也建武龍興奮旅西驅虜赤眉計高胡斬銅馬破骨都收翡翠之駕據天下之圖上帝受命將昭其烈潛龍初九真人乃發上貫紫宮徘徊天闕握狼狐蹈參伐陶以乾坤始分日月觀三代之餘烈察殷夏之遺風昔崤函之固即周洛之中興四郊建三雍禪梁父封岱宗見藝文類聚六十一大將軍臨洛觀賦濱曲洛而立觀營高壤而作廬處崇顯以間敞超絶鄰而特居列阿閣以環匝表高臺而起樓步輦道以周流臨軒檻以觀魚于是迎夏之首末春之垂桃枝夭夭楊柳猗猗既乃日垂西陽中曜內光弛銜縱策逸如奔揚見藝文類聚六十三御覽二十武賦假皇天兮簡帝心見文選赭白馬賦注又褚淵碑注章帝諡議臣聞號者功之表諡者行之迹據德録功各當其實孝經曰天地明察神明章矣虞書數堯之德曰平章百姓言天之常德也詩曰雕琢其章金玉其相亹亹文王綱紀四方又曰倬彼雲漢為章于天喻文王聖德有金玉之質猶雲漢之在天也舉表折義四方德附矣易曰先天而天不違後天而奉天時臣愚以為宜上尊號曰章見御覽五百六十二奏記竇憲珥筆持牘拜謁曹下見文選潘嶽為賈長淵贈陸機詩注與竇憲箋主簿崔駰言今旦漢陽太守稜率吏卒數十人皆臂鷹牽狗陳于道側云欲上幕府駰聞傳曰禽獸之皮不足以備器用其肉不可以將獻養則公不舉焉禮公侯非糜兕射且以服猛為民除害因以登臨器械也故晉唐叔射兕于徒林以為大甲夫鷹犬所獲不過雉兔而有歷險阻之難斯乃細人匹夫之事非王公大人所為要資也駰幸得充下館序在衆賢後乘是以竭其惓惓敢進一言又見御覽九百二十六引後漢書君侯以野幕為府前世封青故事也見書鈔一百三十二將軍窮絶天阻萬里長途見書鈔一百一十四獻書誡竇憲駰聞交淺而言深者愚也在賤而望貴者惑也未信而納忠者謗也三者皆所不宜而或蹈之者效其區區憤盈而不能已也窮見足下體淳淑之姿躬高明之量意美志厲有上賢之風駰幸得充下館列後陳是以竭其拳拳進一言傳曰生而富者驕生而貴者傲生富貴而能不驕傲者未之有也今寵祿初隆百僚觀行當堯舜之盛世處光華之顯時豈可不庶幾夙夜以永衆譽弘申伯之美致周邵之事乎語曰不患無位患所以立昔馮野王以外戚居位稱為賢臣近陰衛尉克己復禮終受多福郯氏之宗非不尊也陽侯之族非不盛也重侯纍將建天樞執斗柄其所以獲譏于時垂愆于後者何也蓋在滿而不挹位有餘而仁不足也漢興以後迄于哀平外家二十保族全身四人而已書曰鑒于有殷可不慎哉竇氏之興肇自孝文二君以淳淑守道成名先日安豐以佐命著德顯自中興內忠誠自固外以法度自守卒享祚國垂社于今夫謙德之光周易所美滿溢之位道家所戒故君子福大而愈懼爵隆而愈恭遠察近覽俯仰有則銘諸几杖刻諸盤杅矜矜業業無殆無荒如此則百福是荷慶流無窮矣達旨往者楊雄設言客有雄玄之尚白應以戰國之士若范蔡鄒衍乘釁相傾誑曜諸侯以于濁世之寵或人亦有睹我之淡泊故比方昔問以難余余略依前訓報焉見藝文類聚二十五或説己曰易稱備物致用可觀而有所合故能扶陽而出順陰而入春發其華秋收其實有始有極爰登其質今子韞櫝六經服膺道術歷世而遊高談有日俯鉤深于重淵仰探遠乎九乾窮至頤於幽微測潛隱之無源然下不步卿相之廷上不登王公之門進不黨以讚己退不黷於庸人獨師友道德合符曩真抱景特立與士不群蓋高樹靡陰獨木不林隨時之宜道貴從凡于時太上運天德以君世憲王僚而布官臨雍泮以恢儒疏軒冕以崇賢率惇德以厲忠孝揚茂化以砥仁義選利器于良材求鏌鋣以明智不以此時攀台階窺紫闥據高軒望朱闕夫欲千里而咫尺未發猶逸禽之赴深林虻蚋之趣大沛胡為默默而久沈滯也答曰有是言乎子苟欲勉我以世路不知其跌而失吾之度也古者陰陽始分天地初制皇綱云緒帝紀乃設傳序曆數三代興滅昔大庭尚矣赫胥罔識淳朴散離人物錯乖高辛攸降厥趣各違道無常稽與時張弛失仁為非得義為是君子通變各審所履故士或掩目而淵潛或盥耳而山棲或草耕而僅飽或木茹而長飢或重聘而不來或屢黜而不去或冒詬以干進或望色而斯舉或以役夫發夢于王公或以漁父見兆于元龜若夫紛繷塞路凶虐播流人有昏墊之厄主有疇咨之憂條垂藟蔓上下相求于是乎賢人授手援世之災跋涉赴俗急斯時也昔堯含戚而皋陶謨高祖歎而子房慮禍不散而曹絳奮結不解而陳平權及其策合道從克亂弭衝乃將鏤玄圭册顯功銘昆吾之冶勒景襄之鍾與其有事則褰裳濡足冠挂不顧人溺不拯則非仁也當其無事則躐纓整襟規矩其步德讓不修則非忠也是以險則救俗平則守禮舉以公心不私其體今聖上之育斯人也朴以皇質雕以唐文六合怡怡比屋為仁一天下之衆異齊品類之萬殊參差同量壞冶一陶群生得理庶績其凝家家有以樂和人人有以自優威械藏而俎豆布六典陳而九刑厝濟茲兆庶出于平易之路雖有力牧之略尚父之厲伊皋不論奚事范蔡夫廣廈成而茂木畼遠求存而良馬縶陰事終而水宿藏場功畢而大火入方斯之際處士山積學者川流衣裳被宇冠蓋雲浮譬猶衡陽之林岱陰之麓伐尋抱不為之稀藝拱把不為之數悠悠罔極亦各有得彼採其華我收其實舍之則藏己所學也故進動以道則不辭執圭而秉柱國復靜以理則甘糟粳而安藜藿夫君子非不欲仕也恥夸毗以求舉非不欲室也惡登牆而摟處叫呼衒鬻縣旌自表非隨和之寶也暴智耀世因以干祿非仲尼之道也遊不倫黨苟以徇己汗血競時利合而友子笑我之沈滯吾亦病子屑屑而不已也先人有則而我弗虧行有枉徑而我弗隨臧否在豫唯世所議固將因天質之自然誦上哲之高訓詠太平之清風行天下之至順懼吾躬之穢德勤百畝之不耘縶余馬以安行俟性命之所存昔孔子起威于夾谷晏嬰發勇于崔杼曹劌舉節于柯盟卞嚴克捷于強禦范蠡錯勢于會稽伍員樹功于柏舉魯連辨言以退燕包胥單辭而存楚唐且華顛以悟秦甘羅童牙而報趙原衰見廉于壺飱宣孟收德于束脯吳札結信于丘木展季效貞于門女顏回明仁于度轂程嬰顯義于趙武僕誠不能編德于數者竊慕古人之所序見後漢崔駟傳又略見藝文類聚二十五博徒論博徒見農夫戴笠持耨以藝蓼荼面色驪黑手足胼胝膚如桑朴足如熊蹄蒲望隴畝汗出調泥乃謂曰子觸熱耕藝背上生鹽脛如燒椽皮如領革不能穿行步狼跋蹄戾脛酸謂子草木支體屈伸謂子禽獸形容似人何受命之薄稟性不純見御覽三百八十二紫脣素齒雪白玉暉見御覽三百六十八燕臛羊殘炙雁煮鳧雞寒狗熱重案滿俎見書鈔一百四十二適逢長吏膏衛東顯撫綬下車但到酒罏爛燂同上江陽之鹽見書鈔一百四十六明帝頌帝乃負執胄覆圭運斗杓以酬酢酌酒旗之玉卮見藝文類聚七十三四巡頌上表臣聞陽氣發而鶬庚鳴秋風厲而蟋蟀吟氣之動也唐虞之世樵夫牧豎擊轅中韶感于和也臣不知手足之動音聲敢獻頌云西巡頌惟永平三年八月已丑行幸河東志曰君舉必書是故工歌其詩史立春秋若夫聲管不發雅頌罔記見御覽五百三十七惟秋稼既登上將省斂平秩西成巡畿于西郊因斯萬物凝德綏俗昔既春遊今乃秋豫見初學記十三南巡頌建初九年秋穀始登猶期加時舉先王之大禮假于章陵遂南巡楚路臨江川以望衡山顧九疑歎虞舜之風是時庶績咸熙罔可黜陟見御覽五百三十七惟林蒸之鴻德允天覆而無遺壯雲行之博惠淑雨施于庶黎見初學記十三東巡頌伊漢中興三葉於皇維烈允迪厥倫纘王命徹漢勳矩坤度以範物規乾則以陶鈞于是考上帝以質中總列宿于北辰開太微敞紫庭延儒林以咨詢岱嶽之事于是典司耆耇載華抱實逌爾而造曰盛乎大漢既重雍而襲熙世增其德唯斯嶽禮久而不修此神人之所慶幸海內之所想思頌有喬山之征典有徂嶽之巡時邁其邦民斯攸勤不亦宜哉乃命太僕訓六騶間路馬戒師徒于是乘輿登天靈之威路駕太一之象車升九龍之華旗建翠霓之旌旄三軍霆激羽騎火烈天動雷震隱隱轔轔躬東作之上務始八正于南行褎胡耇之元老賞孝行之畯農見初學記十三引兩條藝文類聚三十九御覽三百四十又五百三十七北巡頌元和二年正月上既畢郊祀之事乃東巡出于河內納青兗之郊回冀州禮北嶽登中山天帝觀神農將省陽穀相天功巡東作聖澤流浹黎元被德嘉瑞並集乃作頌見初學記十三御覽五百三十七禋潔享祈歆嘗百神爰始賦政授務于人見初學記十三雍容清廟謐爾無虞垂拱穆穆神行化馳見初學記十三四晧墟頌駟馬高蓋其憂方大見書鈔一百三十二北征頌人事協兮皇恩得金精揚兮水靈伏順天機兮把刑德戈所指兮罔不剋見御覽三百四十一杖頌植根荄于湘浦承雷夏之洪澤寓流雲而詒我合天生乎裁剝用以為杖飾以犀角玉母扶持永保百福壽如西老子孫千億見書鈔一百三十一七依客曰乃導玄山之梁不周之稻萬𥽿百陶精細如蟻礱以絺綌砥以柔韋雍人調膳展選百味駕夫遺風之乘遊騏之騑適靡四海摝珍洞庭之鮒灌水之鰩丹山鳳卵粵澤龍胎炊以口棫之薪滋以陽撲之薑蔌以壽木之華鹺以大夏之鹽酢以越裳之梅口中黿口膳史信羹甘酸得適齊和有方木酪昌葅鬯酒蘇漿成湯不及見桓公所未嘗見藝文類聚五十七書鈔一百四十二引七條一百四十四引三條夏屋籧籧見文選魯靈光殿賦注反宇垂阿洞門金鋪丹柱雕楹飛閣層樓于是置酒乎宴遊之堂張樂乎長娛之臺酒酣樂中美人進以承宴調歡欣以解容回顧百萬一笑千金振飛縠以舞長袖裊細腰以務抑揚紛屑屑以曖曖昭灼爍而復明當此之時孔子傾于阿谷柳下忽而更婚老呥遺其虛靜揚雄失其太玄此天下之逸豫宴樂之至盤也公子豈能興乎見藝文類聚五十七客曰彭蠡之鳥萬萬而群荊山之獸億億而屯雲合風散隱隱震震乃命長狄使驅獸夷羿作虞人服飛兔之中乘騁華騠之驂輪跖虛騰雲乘風度津騰句喙以追飛騁韓盧以逐奔弓彈交錯把弧控弦彎繁弱鼓千鈞死獸藉藉聚胔如山選取上鮮獻之庖人見藝文類聚五十七爰有洞庭之椅桐依峻岸而旁生見初學記二十八絃以山柘之絲飾以和氏之璧見書鈔一百九升龍于天者雲也見文選七啓注霈若膏雨之潤良苗見文選王粲從軍詩注駰既作七依而假非有先生之言曰鳴呼揚雄有言童子雕蟲篆刻俄而曰壯夫不為也孔子疾小言破道斯文之族豈不謂義不足而辨有餘者乎賦者將以諷吾恐其不免于勸也見藝文類聚五十七太尉針天官冢宰庶寮之率師錫有帝命虞作尉爰叶台極爰平國域制軍詰禁王旅惟式九州用綏群公咸治干戈載戢宿纏其紀上之云據下之云戴苟非其人斁我帝載昔周人思文公而召南詠甘棠昆夷隆夏伊摯盛商季世頗僻禮用不匡無曰我強莫余敢喪無曰我大輕戰好殺紂師百萬卒以不艾宰臣司馬敢告在際見藝文類聚四十六初學記十一古文苑司徒針天鑒在下仁德是興乃立司徒亂茲黎蒸芒芒庶域率土祁祁人具爾瞻四方是維乾乾夕陽靡怠靡違恪恭爾職以勤王機敬敷五教九德咸事嗇民用章黔氓是富無曰余悖忘于爾輔無曰余聖以忽執政匪用其良乃荒厥命庶績不怡疚于爾祿豐有折肱而鼎覆其餗書歌股肱詩刺南山尹氏不堪國度斯𤡃徒臣司衆敢告執藩見藝文類聚四十七初學記十一司空針替彼坤靈侔天作則分制五服畫為萬國乃立地官空惟是職茫茫九州都鄙盈區綱以群牧綴以方侯列列雋乂翼翼王臣臣當其官官宜其人九一之政七賦以均昔在季葉班祿遺賢掊克充朝而象恭滔天匪力斯人匪政斯敕流貨市寵而苞苴是鬻王路斯荒孰不傾覆空臣斯土敢告在側見初學記十一案藝文類聚四十七以為揚雄作尚書針龍作納言帝命惟允山甫翼周實司喉吻赫赫禁臺萬邦所庭無曰我平而慢爾衡無曰我審而怠爾明四嶽阿鯀績用不成虞登八凱五教聿清舉以無私乃忝服榮正直是與伊道之經先人匪懈永世流聲君子下問敢告侍庭見古文苑案初學記十一以為繁欽作太常針翼翼太常實為宗伯穆穆靈祗寢廟奕奕稱秩元祀班于群神我祀既祗我粢孔蠲匪愆匪忒公尸攸宜弗祈弗求惟德之報不矯不誣庶無罪悔昔在成湯葛為不弔棄禮慢祖夔子不祀楚師是虜魯人躋僖臧文不悟文隳太室桓納郜賂災降二宮用誥不祧故聖人在位無曰我貴慢行繁祭無曰我材輕身恃筮東鄰之犧牛不如西鄰之麥魚秦殞望夷隱斃鍾巫常臣司宗敢告執事見初學記十二案藝文類聚四十九以為揚雄古文苑作崔駰注云一作揚雄大理針邈矣皋陶翊唐作士設為犴狴九州允理如石之平如淵之清三槐九棘以賢以德罪人斯殛凶族斯迸熙乂帝載旁施作明昔在仲尼哀矜聖人子罕禮刑衛人釋艱釋之其忠勳亮孝文于公哀寡定國廣門敻哉邈矣舊訓不遵主慢臣驕虐用其民賞以崇欲刑以肆忿紂作炮烙周人滅殷商用淫刑湯誓其軍衛鞅酷烈卒殞于秦不疑知害禍不及身嗟茲大理慎于爾官賞不可不思斷不可不虔或有忠而被害或有孝而見殘吳沈伍胥殷剖比干莫遂爾情是截是刑無遂爾志以速以亟天鑒在顏無細不録福善禍惡其效甚速理臣司律敢告執獄見初學記十二引漢崔德正大理針未詳德正為誰古文苑作崔駰今據之河南尹針茫茫天區畫冀為京商邑翼翼四方是營爰作卿士以尹皇州風化攸興萬國承流唐虞商周河洛是居或三郟鄏以處鶉墟諸夏徑強是從是橫徹我牆屋而師尹不匡霸奪其權宗器以分圖籍遷齊九鼎入秦見藝文類聚六又御覽二百五十二作揚雄誤西漢無河南尹酒針豐侯沈酒荷罌負缶自戮于世圖形戒後見御覽七百六十二案北堂書鈔一百四十八作崔實酒針與此小異車左銘虞夏作車取象機衡君子建左法天之陽正位受綬車不內顧塵不出軌鸞以節步彼言不疾彼指不躬元覽于道永思厥中見藝文類聚七十一文選張衡東京賦注御覽七百七十三車右銘擇御卜右采德用良詢納耆老于我是匡惟賢是師惟道是式針闕旅賁內顧自敕匪望其度匪愆其則越戒敦儉禮以華國見藝文類聚七十一初學記二十五御覽七百七十三車後銘敬其在路體貌斯恭望衡顧轂允慎茲容無或好失匪盤于遊顧省厥遺虎尾斯求昭德塞違迎盈以無雖有三晉咸然若虛見藝文類聚七十一御覽七百七十四仲山父鼎銘鼎耳革其行塞雉膏不食方雨虧悔終吉有福足勝其任公餗乃珍于高斯危在滿戒溢可以永年天之大律見藝文類聚七十三樽銘惟歲之元朝賀奉樽金罍犧象嘉禮具存獻酬交錯萬國咸歡見藝文類聚七十三冬至襪銘機衡建子萬物含滋黃鍾育化以養元基陽升于下日永于天長履景福至于億年皇靈既祐祉祿來臻本枝百世子子孫孫見藝文類聚七十初學記四案初學記又云崔駰襪銘有建子之月助養元氣之事六安枕銘枕有規矩恭一其德永元寧躬終始不忒六安在床匪邪匪仄見北堂書鈔一百三十四又御覽七百七少未二語載本注云六安言六面也刀劍銘歐冶運巧鑄鋒成鍔麟角鳳體玉飾金錯龍淵太阿干將莫邪帶以自禦燁燁吐花刻漏銘大德順動人以立信乃作斯策以咸渥潤封傳今覽爰暨四極縫銘惟歲之始承天嘉德皇靈願國絲綏充贄以朝迪見御覽八百三十扇銘翾翾此扇輔相君子屈伸施張時至時否動搖清風以禦炎暑見書鈔一百三十四有圓者扇誕此秀儀晞露散霾擬日定規朗姿玉畼惠風時披婚禮結言乾坤其德恆久不已爰定天綱夫婦作始乃降英媛有淑其儀姬薑是侔比則姚媯見藝文類聚載納嘉摯內結鞶褵委禽奠雁配以鹿皮見初學記十四
