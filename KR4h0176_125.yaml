body:
  text: 崔瑗上言察舉孝廉臣聞孝廉皆限年三十乃得察舉恐失賢才之士也引崔氏家傳與葛元甫書今遣奉書錢千為贄并送許子十卷貧不及素但以紙耳見北堂書鈔一百四蓺文類聚三十一僕在河北少他負罰以盜賊少見書鈔三十六雜帖賢女委頓積治此為憂懸燋心今已極佳足下勿復憂念其信來數附書知聞以解其憂見淳化閣帖二敕妻子吾并日而食以供賓客而反以獲譏士大夫不足養如此後勿過菜具無為諸子所蚩見後漢崔瑗傳注引華嶠後漢書遺令子實夫人稟天地之氣以生及其終也歸精于天還骨于地何地不可藏形骸勿歸鄉里其賵贈之物羊豕之奠一不得受見後漢崔瑗傳七蘇加以脂粉潤以滋澤見書鈔一百三十五南陽文學頌昔聖人制禮作樂也將以統天理物經國序民立均出度因其利而利之俾不失其性也故觀禮則體敬聽樂則心和然後知反其性而正其身焉取律于天以和聲采言于聖以成謀以和邦國以諧萬民以序賓旅以悅遠人其觀威儀省禍福也出言視聽于是乎取之民生如何導以禮樂乃修禮官奮其羽籥我國既淳我俗既敦神樂民則嘉生乃繁無言不酬其德宜光先民既沒賴茲舊章我禮既經我樂既馨三事不敘莫識其形見蓺文類聚三十八御覽五百三十四敘箴昔揚子雲讀春秋傳虞人箴而善之于是作為九州及二十五官箴規匡救言君德之所宜斯乃體國之宗也見御覽五百八十八引崔漢敘箴當是崔瑗之誤尚書箴皇皇聖哲允敕百工命作齋慄龍為納言是機是密出入朕命王之喉舌獻善宣美而讒說是折我視云明我聽云聰載夙載夜惟允惟恭故君子在室出言如風動于民人渙其大號而萬國平信春秋譏漏言易稱不密則失臣兌吉其和巽吝其頻書稱其明申申其鄰昔秦尚權詐官非其人符璽竊發而扶蘇隕身一姦愆命七廟為墟威福同門床上為辜書臣司命敢告侍隅見古文苑案蓺文類聚四十八作揚雄博士箴洋洋三代典禮是修畫為辟雍國有學校侯有泮宮各有攸教德用不陵昔在文王經啟其軌勖于德音而思皇多士多士作楨惟周以寍國人興讓虞芮質成公劉挹行潦而濁亂斯清官操其業士執其經昔聖人之綏俗莫美于施化故孔子觀夫太學而知為王之易易大舜南面無為而衽席平還師階級之閒三苗以懷秦作無道斬決天紀漫彼王迹而坑夫術士詩書是泯家言是守俎豆不陳而顛其社稷故仲尼不對問陳而胡簋是遵原伯非學而閔子知周之不振儒臣司典敢告在賓見古文苑案蓺文類聚四十六作揚雄東觀箴洋洋東觀古之史官三墳五典靡義不貫左書君行右記其言辛尹顧訪文武明宣倚相見寶荊國以安何以季代咆哮不虔在強奮矯戮彼逢干衛巫蠱謗國莫敢言狐突見斥淖齒見殘焚文坑儒嬴反為漢巫蠱之毒殘者數萬吁嗟後王曷不斯鑒是以明哲先識擇木而處夏終殷摯周聃晉黍或笑或泣抱籍遁走三葉靖公果喪厥緒宗廟隨夷遠之荊楚麥秀之歌億載不腐史臣司蓺敢告侍後見初學記十二古文苑關都尉箴茫茫九州據為關津唐堯積德三代修仁越季不執爰失厥人聖賢不用頑嚚是親漢潰武關項破函谷秦王子嬰縊為禽僕尉臣司關敢告竝轂見初學記七古文苑河隄謁者箴伊昔鴻泉浩浩滔天有夏作空爰奠山川導河積石鑿于龍門疏為砥柱率彼河滸大陸既礙播于北野濟漯咸順沂泗從流江淮湯湯而冀宅乃州澹菑濺濺東歸于海九野孔安四隩不殆爰及周衰夏績陵遲導非其導堙非其堙八野填淤水高民居湓溢滂汨屢決金隄瓠子潺湲宣房作歌使臣司水敢告執河見古文苑郡太守箴有嬴驅除焚典紀舊蕩滅蕃畿罷侯置守秦發閭左陳涉奮威楚築乾谿靈王不歸征遐由近可不肅祗守臣司境敢告執機見古文苑北軍中侯箴赫赫將帥典總虎臣鷹揚旅武闞然奮震贅衣近侍常伯之人怒如熊力角焉任口操兵左右百夫衛賓昔在高祖草創伊神鴻門之會職多未陳或有劍舞賴有傾身孔丘歷階文武定申以人士拜齊無其臣秦政東遊大盜輩群期門不設施巧銳騎在不脩員故圖遠秉機事有殷勤殷勤在親親無常人忽情懈怠禍慢及君憲臣司武敢告執軍見古文苑司隸校尉箴煌煌古制分劃五服翼翼封畿四方之極牧監匡設是謂王國大漢通變崇弘簡易吞舟之網以濟難阸自時厥後或慢或遲繡衣四出禍起宮闈江充作亂辱干戾園率隸掘蠱以詰其姦既定既寍爰遂其官俾督京甸時惟鷹鸇必正必式國之司直乃回乃邪實為讒慝毀于貞賢悔其何及昔唐虞晏晏庶績以熙嬴氏慘慘怨毒用滋是故履上位者無云我貴苟任激訐平陽玄默以式百辟畫一之歌豈猶遐逖使臣司隸敢告執役見古文苑中壘校尉箴堂堂皇帝設為壘壁見後漢光武紀上注侍中箴見古文苑今據初學記十二以為胡廣作故不復錄座右銘無道人之短無說己之長施人慎勿念受施慎勿忘世譽不足慕唯仁為紀綱隱身而後動謗議庸何傷無使名過實守愚聖所臧柔弱生之徒老氏誡剛強在涅貴不緇曖曖內含光硜硜鄙夫介悠悠故難量慎言節飲食知足勝不祥行之苟有恆久久自芬芳見文選蓺文類聚二十三竇大將軍鼎銘大禹鑄鼎象物百神饗帝養賢命錫宗臣三距金鉉公德配焉雉膏之美咸在擇人惟王建國分之彝器鼎為元寶君臣享位足勝其任鬻保寶器持盈若沖滿而不溢黃耳不革玉鉉終吉禹鏤其鼎湯刻其盤紀功申戒貽則後人見蓺文類聚七十三遺葛龔珮銘禹湯罪己仲尼多誨盤盂有銘几杖有誡天為剛德猶不干時君子妄怒厥亦生災晉厲好虐欒書作亂荀瑤峻戾韓魏致難慷慨憤激動腸傷氣久生百疾歷年不遂俯覽斯珮柔韋是貴見蓺文類聚六十七三珠釵銘元正上日百福孔靈鬢髮如雲乃象眾星三珠橫釵攝髮鑽瑩見北堂書鈔一百三十六蓺文類聚七十御覽七百十八杖銘乘危履險非杖不行年老力竭非杖不彊諸蔗雖美殆不可杖佞人悅己亦不可相見書鈔一百三十三御覽七百十柏枕銘元首之尊為乾之精詒我良材玄冬再榮是用為枕爰勒直銘見北堂書鈔一百三十四和帝誄玄景寑曜雲物見徵馮相考妖遂當帝躬三載四海遏密八音如喪考妣擗踴號吟大隧既啟乃徂玄宮永背神器升遐皇穹長夜冥冥曷云其窮見蓺文類聚十二竇貴人誄若夫貴人天地之所留神造化之所慇懃華光曜乎日月才志出乎浮雲然猶退讓未嘗專寵樂慶雲之普覆悼時雨之不廣憂國念主不敢怠遑嗚呼哀哉惟以永傷重曰積善之家福慶長修以壽道之常聖人之言義不虛修身獲報效莫疏令問不忘身猶存貴人雖沒遺德尊著于金石垂後昆見蓺文類聚十五司農卿鮑德誄迺司大事掌是六府三事九功迺修迺聚見初學記十二汲縣太公廟碑太公望者河內汲人也縣民故會稽太守杜宣白令崔瑗曰太公本生于汲舊居猶存君與高國同宗太公載在經傳今臨此國宜正其位以明尊祖之義于是國老王喜廷椽鄭篤功曹卻勤等咸曰宜之遂立壇祀為之位主見水經清水注河間相張平子碑河間相張君南陽西鄂人諱衡字平子其先出自張老為晉大夫納規趙武而反其侈書傳美之君天姿濬哲敏而好學如川之逝不舍晝夜是以道德漫流文章雲浮數術窮天地制作侔造化瓌辭麗說奇技偉藝磊落煥炳與神合契然而體性溫良聲氣芬芳仁愛篤密與世無傷可謂淑人君子者矣初舉孝廉為尚書侍郎遷太史令實掌重黎厤紀之度亦能焞燿敦大天明地德光照有漢遷公車司馬令侍中遂相河閒政以禮成民是用思遭命不永闇忽遷徂朝失良臣民隕令君天泯斯道世喪斯文凡百君子靡不傷焉乃銘斯表以旌厥問其辭曰于惟張君資質懿豐德茂材羨高明顯融焉所不學亦何不師盈科而逝成章乃達一物不知實以為恥聞一善言不勝其喜包羅品類稟授無形酌焉不竭沖而復盈廩廩其庶亹亹其幾膺數命世紹聖作師苟華必實令德惟恭柔嘉伊則孝友祗容允出在茲維帝念功往才女諧化洽民雝愍天不弔降此咎兇哲人其萎罔不時恫紀于銘勒永終譽兮死而不朽芳烈著兮見古文苑胡公碑唯我末臣頑蔽無聞見文選赭白馬賦注草書勢書契之興始有頡皇寫彼鳥跡以定文章爰暨末葉典籍彌繁人之多僻政之多權官事荒蕪勦其墨翰惟作佐隸舊字是刪草書之法蓋先簡略應時諭旨周于卒迫兼功并用愛日省力純儉之變豈必古式觀其法象俯仰有儀方不中矩圓不副規抑左揚右望之若欹竦企鳥跱志在飛移狡獸暴駭將奔未馳或黜點染狀似連珠絕而不離蓄怒怫鬱放逸生奇或浚遽而惴慄若據槁而臨危傍點邪附似螳蜋而抱枝絕筆收勢餘綎虬結若山蜂施毒看隙緣巇騰蛇赴穴頭沒尾垂是故遠而望之漼焉若注岸崩涯就而察之即一畫不可移纖微要妙臨事從宜略舉大較彷彿若斯見晉書衛恆傳又初學記二十一引兩條白鵠賦見後漢崔琦傳亡七蠲寒門邱子有疾玄野子謂之曰藍沼清池素波朱瀾金鉤芳餌纖繳華竿緍沈魚浮薦以香蘭幽室洞房絕檻垂軒紫閣青臺綺錯相連結實布葉與波邪傾從風離合澹淡交并紫蔕黃葩翳水吐榮紅顏溢坐美目盈堂姿喻春華操越秋霜從容微眄流曜吐芳巧笑在側顧盼傾城玄野子曰爰有梧桐產乎玄谿傳根朽壤託陰生危淚水澡其下孤鳥集其枝罔雙偶而特立獨飄颻而單離匠石摧肩公輸折首目眩肌戰制以為琴子野調操鍾期聽音子能聽之乎見蓺文類聚五十七暫唱郤轉時吟齊謳窮樂極懽濡首相煦見初學記十五再奏致哀風見文選王康琚反招隱詩注三王行化夷叔隱己見文選劉峻辨命論翻然鳳舉軒爾龍騰見文選曹植王仲宣誄注于斯江睪實產橘柚紫葉玄實綠朱莖孟冬之月于時可食撫以玉手永用華飾見御覽九百六十六又九百七十三四皓頌序昔有南山四皓者蓋里先生綺里季夏黃公東園公是也秦世道滅德消坑黜儒術于是乃退而作歌曰漠漠商洛湥谷逶迤曄曄紫芝可以療飢皇虞邈遠吾將安歸駟馬高蓋其憂甚大富貴而畏人不如貧賤而輕世見梅鼎祚東漢文紀引書鈔檢書鈔無外戚箴赫赫外戚華寵煌煌昔在帝舜德隆英皇周興三母有莘崇湯宣王晏起姜后脫簪齊桓好樂衛姬不音皆輔主以禮扶君以仁達才進善以義濟身爰暨末葉漸已頹虧貫魚不敘九御差池晉國之難禍起于麗惟家之索牝雞之晨專權擅愛顯己蔽人陵長間舊圮剝至親竝后匹嫡淫女斃陳匪賢是上番為司徒荷爵負乘采食名都詩人是刺德用不憮暴辛惑婦拒諫自孤蝠蛇其心縱毒不辜諸父是殺孕子是刳天怒地忿人謀鬼圖甲子昧爽身首分離初為天子後為人螭非但耽色母后尤然不相率以禮而競獎以權先笑後號卒以辱殘家國泯絕宗廟燒燔末嬉喪夏褎姒斃周妲己亡殷趙靈沙丘戚姬人豕呂宗以敗陳后作巫卒死于外霍欲鴆子身乃罹廢故曰無謂我貴天將爾摧無恃常好色有歇微無怙常幸爰有陵遲無曰我能天人爾違患生不德福有慎機日不常中月盈有虧履道者固杖勢者危微臣司戚敢告在斯見後漢崔琦傳大赦賦惟漢之十一年四月大赦滌惡棄穢與海內更始亹亹乎恩隆平之進也寔就而賦焉以為五帝異制三王殊事然其承天據地興設法制一也陛下以苞天之大承前聖之迹朝乾乾于萬機夕虔敬以厲惕然猶痛刑之未錯厥將大赦所以創太平之迹旌頌聲之期新邦家而更始垂祉美乎將來此誠不可奪也方將披玄雲照景星獲嘉禾于疆畝數蓂莢于階庭捫麒麟之肉角聆鳳皇之和鳴農夫歡于時雨女工樂于機聲雖皇羲之神化尚何斯之太寍見蓺文類聚五十二初學記二十答譏客有譏夫人之享天爵而應睿哲也必將振民毓德弭難濟時故或階媵以納說或桎梏而不辭或擊角以自銜或養老以待期及其規合策從勳績克章撥亂夷險九合一匡聖人大寶唯斯為光今子遊精太清潛思九玄勵節縹霄抗志浮雲口願甘而嘗苦身樂逸而長勤志求貴而永卑情好富而困貧慕容名而失厚思慮勞乎形神答曰子徒休彼繡衣不知嘉遁之獨肥也且麟隱于遐荒不紆機穽之路鳳凰翔于寥廓故節高而可慕李斯奮激果失其度胥種遂功身乃無處觀夫人之進趨也不揣己而干祿不揆時而要會或遭否而不遇或智小而謀大纖芒毫末禍亟無外榮速激電辱必彌世故曰愛餌銜鉤悔在鸞刀披文食豢乃啟其毛若夫守恬履靜澹爾無求沈緍濬壑淒息高丘雖無炎炎之樂亦無灼灼之憂余竊嘉茲庶遵厥猷見蓺文類聚二十五諫議大夫箴於昭上帝迪茲既哲匪于水鑒惟人是察處有誦訓出則旅賁木鐸之求爰納遒人各有攸訊政以不紛昔在大禹拜承昌言癸辛暴戾虐及于天逮于周厲慢德不蠲煦煦胥讒人謗乃作不顧厥愆是討是格庶類不堪流之彘宅防人之口譬諸防川豈不速止潰乃潺湲潺湲尚塞言擁為賊默默之患用顛厥國諫臣司議敢告執翼見初學記十二古文苑太醫令箴動不肆勤靜不實逸有疾歸太醫無能恤晉平好內四時是一非鬼非食惑以自失雖有秦和焉所施術太上防疾其疾萌芽腠理不觸骨髓奈何見御覽二百二十九
