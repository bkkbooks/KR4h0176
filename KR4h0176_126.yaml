body:
  text: 崔實政論自堯舜之帝湯武之王皆賴明哲之佐博物之臣故皋陶陳謨而唐虞以興伊箕作訓而殷周用隆及繼體之君欲立中興之功者曷嘗不賴賢哲之謀乎凡天下之所以不治者常由世主承平日久俗漸弊而不寤政寖衰而不改習亂安危逸不自覩或荒耽嗜欲不恤萬機或耳蔽針誨厭僞忽真或猶豫岐路莫適所從或見信之佐括囊守祿或疏遠之臣言以賤廢是以王綱縱弛于上智士鬱伊于下悲夫且守文之君繼陵遲之緒譬諸乘弊車矣當求巧工使輯治之折則接之緩則楔之補琢換易可復為新新新不已用之無窮若遂不治因而乘之摧拉捌裂亦無可奈何矣若武丁之獲傳說宣王之得申甫是則其巧工也今朝廷以聖哲之姿龍飛天衢大臣輔政將成斷金誠宜有以滿天下之望稱兆民之心年穀豐稔風俗未乂夫風俗者國之脈診也年穀如其肥膚肥膚雖和而脈診不和誠未足為休書曰雖休勿休況不休而可休乎自漢興以來三百五十餘歲矣政令垢玩上下怠懈風俗雕敝人庶巧僞百姓囂然咸復思中興之救矣且濟時拯世之術豈必體堯蹈舜然後乃治哉期于補綻決壞枝柱邪傾隨形裁割取時君所能行要措斯世于安寧之域而已故聖人執權遭時定制步驟之差各有云施不強人以不能背所急而慕所聞也昔孝武皇帝策書曰三代不同法所由殊路而建德一也蓋孔子對葉公以來遠哀公以臨民景公以節禮非其不同所急異務也是以受命之君每輒創制中興之主亦匡時失昔盤庚愍殷遷都易民周穆有闕甫侯正刑然疾俗人拘文牽古不達權制奇瑋所聞𥳑忽所見策不見珍計不見信夫人既不知善之為善又將不知不善之為不善烏足與論國家之大事哉故每有言事頗合聖聽者或下群臣令集議之雖有可采輒見掎奪何者其頑士暗于時權安習所見殆不知樂成況可與慮始乎心閃意舛不知所云則苟云率由舊章而已其達者或矜名嫉能恥善策不從已出則舞筆奮辭以破其義寡不勝衆遂見屏棄雖稷契復存由將困焉斯賈生之所以排于絳灌弔屈子以攄其幽憤者也夫以文帝之明賈生之賢絳灌之忠而有此患況其餘哉況其餘哉且世主莫不願得尼軻之倫以為輔佐卒然獲之未必珍也自非題榜其面曰魯孔丘鄒孟軻殆必不見敬信何以其然也此二者善已存于上矣當時皆見薄賤而莫能任用困厄削逐待放不追勞辱勤瘁為豎子所議笑其故獲也夫淳淑之士固不曲道以媚時不詭行以邀名恥鄉原之譽絶比周之黨必待題其面曰魯仲尼鄒孟軻不可得也而世主凡君明不能別異量之士而適足受譖潤之訴前君既失之于古後君蹈又于今是以命世之士常抑于當時而見思于後人以往揆來亦何容易向使賢不肖相去如泰山之與蟻垤策謀得失相覺如日月之與螢火雖頑嚚之人猶能察焉常患賢佞難別是非倒紛始相去如毫氂而禍福差以千里故聖君明主其猶慎之見群書治要圖王不成弊猶足霸圖霸不成弊將如何見意林故宜量力度德春秋之義今既不能純法八世故宜參以霸政則宜重賞深罰以御之明著法術以檢之自非上德嚴之則理寬之則亂何以明其然也近孝宣皇帝明于君人之道審于為政之理故嚴刑峻法破姦軌之膽海內肅清天下密如嘉瑞竝集屢獲豐年薦勳祖廟享號中宗算計見效優于孝文元帝即位多行寬政卒以墮損威權始奪遂為漢室基禍之主治國之道得失之理于是可以鑒矣昔孔子作春秋褎齊桓懿晉文歎管仲之功夫豈不美文武之道哉誠達權救弊之理也故聖人能與世推移而俗士苦不知變以為結繩之約可復理亂秦之緒干戚之舞足以解平城之圍夫熊經鳥伸雖延曆之術非傷寒之理呼吸吐納雖度紀之道非續骨之膏蓋為國之道有似理身平則致養疾則攻焉夫刑罰者治亂之藥石也德教者興平之粱肉也夫以德教除殘是以粱肉理疾也以刑罰理平是以藥石供養也方今承百王之敝值厄運之會自數世以來政多恩貸馭委其轡馬駘其銜四牡橫奔皇路險傾方將拑勒鞬以救之豈暇鳴和鑾清節奏從容平路哉昔高祖令蕭何作九章之律有夷三族之令黥劓斬趾斷舌梟首故謂之具五刑文帝雖除肉刑當劓者笞三百當斬左趾者笞五百當斬右趾者棄市右趾者既損其命鞭撻者往往至死雖有輕刑之名其實殺也當此之時民皆思復肉刑至景帝元年乃下詔曰加笞與重罪無異幸而不死不可為民乃定減笞輕捶自是之後笞者得全以此言之文帝乃重刑非輕之也以嚴致平非以寬致平也世有所變何獨拘前必欲行若言當大定其本使人主師五帝而式三王蕩亡秦之俗遵先聖之風棄苟全之政蹈稽古之蹤復五等之爵立井田之制然後選稷契為佐伊呂為輔樂作而鳳皇儀擊石而百獸舞若不然則多為纍而已見本傳夫人之情莫不樂富貴榮華美服麗飾鏗鏘眩耀芬芳嘉味者也晝則思之夜則夢焉唯斯之務無須臾不存于心猶急水之歸下川之赴壑不厚為之制度則皆侯服王食僭至尊踰天制矣是故先王之御世也必明法度以閉民欲崇隄防以禦水害法度替而民散亂隄防墮而水泛溢頃者法度頗不稽古而舊號網漏吞舟故庸夫設藻梲之飾匹豎享方丈之饌下僭其上尊卑無別如使雞鶩蛇頸龜身五色紛麗亦可貴放鳳乎禮壞而莫救法墮而不恆斯蓋有識之士所為於邑而增歎者也律令雖有輿服制度然斷之不自其源禁之又不密而欲絶之為實璘璣玩飾匿于懷袖文繡弊于簾幃也今使列肆賣侈功商賈鬻僭服百工作淫器民見可欲不能不買賈人之列戶蹈僭侈矣故王政一傾普天率土莫不奢僭者非家至人告乃時勢驅之使然此則天下之患一也且世奢服僭則無用之器貴本務之業賤矣農桑勤而利薄工商逸而入厚故農夫輟耒而雕鏤工女投杼而刺繡躬耕者少末作者衆生土雖皆墾乂而地功不致苟無力穡焉得有年財鬱蓄而不盡出百姓窮匱而為姦寇是以倉廩空而囹圉實一穀不登則饑餒流死上下相匱無以相濟國以民為根民以穀為命命盡則根拔根拔則本顛此最國家之毒憂可為熱心者也斯則天下之患二也法度既墮輿服無限婢妾皆戴瑱揥之飾而被織文之衣乃送終之家亦大無法度至用轜梓黃腸多藏寶貨饗牛作倡高墳大寢是可忍也孰不可忍而俗人多之咸日健子天下跂慕恥不相逮念親將終無以奉遣乃約其供養豫修亡歿之備老親之飢寒以事淫法之華稱竭家盡業甘心而不恨窮厄既迫起為盜賊拘執陷罪為世大戮痛乎此俗之刑陷愚民也且橘柚之貢堯舜所不常御山龍華蟲帝王不以為褻服今之臣妾皆餘黃甘而厭文繡者蓋以萬數矣其餘稱此不可勝記古者墓而不墳文武之兆與平地齊今豪民之墳已千坊矣欲民不匱誠亦難矣是以天戚戚人汲汲外溺奢風內憂窮竭故在位者則犯王法以聚斂愚民則冒罪戮以為健俗之壞敗乃至于斯此天下之患三也承三患之弊繼荒頓之緒而徒欲修舊修故而無匡改雖唐虞復存無益于治亂也昔聖王遠慮深思患民情之難防憂奢淫之害政乃塞其源以絶其末深其刑而重其罰夫善堙川者必杜其源善防姦者必絶其萌昔子産相鄭殊尊卑異章服而國用治豈大漢之明主曾不如小藩之陪臣在修之與不耳見群書治要易曰言行君子所以動天地也仲尼曰人而無信不知其可今官之接民甚多違理苟解面前不顧先哲作使百工及從民市輒設計加以誘來之器成之後更不與直老弱凍餓痛號道路守關告哀終不見省歷年纍歲乃才給之又云逋直請十與三此逋直豈物主之罪邪不自咎責反復滅之冤抑酷痛足感和氣既爾明復平弊敗之物與之至有車輿故謁者冠賣之則莫取復之則不可其餘雜物略皆此輩是以百姓創艾咸以官為忌諱遁逃鼠竄莫肯應募因乃捕之劫以威勢心苟不樂則器械行沽虛費財用不周于事故曰上為下效然後謂之教上下相效殆如此將何以防之罰則不恕不罰則不治是以風移于詐俗易于欺獄訟繁多民好殘僞為政如此未覩其利斯皆起于典藏之吏不明為國之體苟割脛以肥頭不知脛弱亦將顛仆也禮譏聚斂之臣詩曰貪人敗類蓋傷之也見群書治要陳兵策于安平之世譬令未病者服藥見意林傳曰工欲善其事必先利其器舊時永平建初之際去戰攻未久朝廷留意于武備財用優饒主者躬親故官兵常牢徑精利有蔡太僕之弩及龍亭九年之劍至今擅名天下頃主者既不敕慎而詔書又誤進入之賓貪叨之吏競約其財用狡猾之工復盜竊之至以麻枲被弓弩米粥雜漆燒鎧鐵焠醯中令脆易治鎧孔又褊小不足容人刀牟悉鈍故邊民敢鬭健士皆自作私兵不肯用官器凡漢所以能制胡者徒擅鎧弩之利也今鎧則不堅弩則不徑永失所恃矣且夫士之身苟兵鈍甲耎不可依怙雖孟賁卞莊由有猶豫推此論之以小況大使三軍器械皆可依阻則膽勇勢盛各有赴敵不旋之慮若皆弊敗不定任用亦競奮皆不避水火矣三軍皆奮則何敵不克誠宜復申明巧工舊令除進入之課復故財用雖頗為吏工所中尚勝于自中也苟以牢利任用為故無問其他月令曰物刻工名以覆其誠功有不當必行其罪以窮其情今雖刻名之而賞罰不能又數有赦贖主者輕玩無所懲畏夫兵革國之大事宜特留意重其治罰敢有巧詐輒行之輩罪勿以赦贖除則吏敬其職工慎其業矣見群書治要昔聖王之治天下咸建諸侯以臨其民國有常君君有定臣上下相安政如一家秦兼天下罷侯置縣于是君臣始有不親之舋矣我文景患其如此故令長視事至十餘年居位或長子孫永久則相習上下無所竄情加以心堅意專安官樂職圖纍久長而無苟且之政吏民供奉亦竭忠盡節而無臺切之計故能君臣和睦百姓康樂苟有康樂之心充于中則和氣應于外是以災害不生禍亂不作自頃以來政教稍改重刑闕于大臣而密網刻于下職鼎輔不思在寬之德牧牧守守逐之各競摘微短吹毛求疵重案深詆以中傷貞良長吏或實清廉心平行潔內省不疚不肯媚竈曲禮不行于所屬私敬無廢于府州郡側目以為負折乃選巧文猾吏向壁作條誣覆闔門攝捕妻子人情恥令妻子就逮則不迫自去且人主莫不欲豹産之臣然西門豹治鄴一年民欲殺之子産相鄭初亦見詛三載之後德化乃洽今長吏下車百日無他異觀則州郡睥睨待以惡意滿歲寂漠便見驅逐正使豹産復在方見怨詛應時奔馳何緣得成易歌之勛垂不朽之名者哉猶馮唐評文帝之不能用李牧矣近漢世所謂良吏黃侯召父之治都視事皆且十年然後功業乃著且以仲尼之聖由曰三年有成況凡庸之士而責以造次之效哉故夫卒成之政必有橫暴酷烈之失而世俗歸稱謂之辨治故絀已復進棄已復用橫遷超取不由次第是以殘猛之人遂奮其毒仁賢之士劫俗為虐本操雖異驅出一揆故朝廷不獲溫良之用兆民不蒙寬惠之德則百姓之命委于酷吏之手嗷嗷之怨咎歸于上夫民善之則畜惡之則讎讎滿天下可不懼哉是以有國有家者甚畏其民既畏其怨又畏其罰故養之如傷病愛之如赤子兢兢業業懼以終始恐失群臣之和以墮先王之軌也今朝廷雖屢下恩澤之詔垂恤民之言而法度制令甚失養民之道勞思而無功華繁而實寡必欲求利民之術則宜沛然改法有以安固長吏原其小罪闊纍微過取其大較惠下而已昔唐虞之制三載考績三考黜陟所以表善而簡惡盡臣力也漢法亦三年一察治狀舉孝廉尢異宣帝時王成為膠東相黃霸為潁川太守皆且十年但就增秩賜金封關內侯以次入為公卿然後政化大行勛垂竹帛皆先帝舊法所宜因循及中興後上官象為并州刺史祭彤為遼東太守視事各十八年皆增秩中二千石建初中南陽陰意以詔除郎為饒陽令視事二十三年遷壽陽令又十八年近日所見或一期之中郡主易數二千石雲擾波轉潰潰紛紛吏民疑惑不知所謂及公卿尚書亦復如此且臺閣之職尤宜𥳑習帝時尚書但厚加賞賜希得外補是以機事周密莫有漏泄昔舜命九官自受終于文祖以至陟方五十年不聞復有改易也聖人行之于古以致時雍文宣擬式亦至隆平若不克從是羞效唐虞而恥遵先帝也見群書治要昔明王之統黎元蓋濟其欲而為之節度者也凡人情之所通好則恕己而足之因民有樂生之性故分祿以頤其士制廬井以養其萌然後上下交足厥心乃靜人非食不活衣食足然後可教以禮義威以刑罰苟其不足慈親不能畜其子況君能撿其臣乎故古記曰倉廩實而知禮節衣食足而知榮辱今所使分威權御民人理獄訟幹府庫者皆群臣之所為而其奉祿甚薄仰不足以養父母俯不足以活妻子父母者性所愛也妻子者性所親也所愛所親方將凍餒雖冒刃求利尚猶不避況可令臨財御衆乎是所謂渴馬守水餓犬護肉欲其不侵亦不幾矣夫事有不疑勢有不然蓋此之類雖時有素富骨清者未能百一不可為天下通率聖王知其如此故重其祿以防其貪欲使之取足于奉不與百姓爭利故其為土者習推讓之風恥言十五之計而拔葵去織之義形矣故三代之賦也足以代其耕故晏平仲諸侯之大夫耳祿足贍五百斯非優衍之故耶昔在暴秦反道違聖厚自封寵而虜遇臣下漢興因循未改其制夫百里長吏荷諸侯之任而食監門之祿請舉一隅以率其餘一月之祿得粟二十斛錢二千長吏雖欲崇約猶當有從者一人假令無奴當復取客客庸一月千芻膏肉五百薪炭鹽菜又五百二人食粟六斛其餘足給馬豈能供冬夏衣被四時祠祀賓客斗酒之費乎況復迎父母致妻子哉不迎父母則違定省不致妻子則繼嗣絶迎之不足相贍自非夷齊孰能餓死于是則有賣官鬻獄盜賊主守之奸生矣孝宣皇帝悼其如此乃詔曰吏不廉平則治道衰今小吏皆勤事而奉祿薄欲其不侵漁百姓難矣其益吏奉百石以下什五然尚險隘又不上逮古賦祿雖不可悉遵宜少增益以賙其匱使足代耕自供以絶其內顧念奸之心然後重其受取之罰則吏內足于財外憚嚴刑人懷羔羊之潔民無侵枉之性矣昔周之衰也大夫無祿詩人刺之暴秦之政始建薄奉亡新之亂不與吏除三亡之失異世同術我無所鑒夏后及商覆車之軌宜以為戒見群書治要大赦之造乃聖王受命而興討亂除殘誅其鯨鯢赦其臣民漸染化者耳及戰國之時犯罪者輒亡奔鄰國遂赦之以誘還其逋逃之民漢承秦制遵而不越孝文皇帝即位二十三年乃赦示不廢舊章而已近永平建初之際亦六七年乃一赦亡命之子皆老于草野窮困懲艾比之于死頃閒以來歲且一赦百姓忸忕輕為奸非每迫春節徼幸之會犯惡尤多近前年一期之中大小四赦諺曰一歲再赦奴兒喑噁況不軌之民孰不肆意遂以赦為常俗初期望之過期不至亡命蓄積群輩屯聚為朝廷憂如是則劫不得不赦赦以趣姦姦以趣赦赫轉相驅踧兩不得息雖日赦之亂甫繁耳由坐飲多發消渴而水更不得去口其歸亦無終矣又踐作改元際未嘗不赦每其令曰蕩滌舊惡將與士大夫更始是褎己薄先且違無改之義非所以明孝抑邪之道也昔莞子有云赦者奔馬之委轡不赦者痤疽之砭石及匡衡吳漢將相之雋而皆建言不當數赦今如欲尊先王之制宜曠然更下大赦令因明諭使知永不復赦則群下震栗莫輕犯罪縱不能然宜十歲以上乃時一赦見群治要昔者聖王立井田之制分口耕耦地各相副適使人飢飽不遍勞逸齊均富者不足僭差貧者無所企慕始暴秦隳壞法度制人之財既無紀綱而乃尊獎并兼之人烏氏以牧豎致財寵比諸侯寡婦清以攻丹殖業禮以國賓于是巧猾之萌遂肆其意上家纍巨億之資戶地侔封君之士行苞苴以亂執政養劍客以威黔首專殺不辜號無市死之子生死之奉多擬人主故下戶踦𨄅無所跱足乃父子低首奴事富人躬帥妻孥為之服役故富者席餘而日織貧者躡短而歲踧歷代為虜猶不贍不衣食生有終身之勤死有暴骨之憂歲小不登流離溝壑嫁妻賣子其所以傷心腐藏失生人之樂者蓋不可勝陳故古有移人通財以贍蒸黎今青徐兗冀人稠土狹不足相供而三輔左右及涼幽州內附近郡皆土曠人稀厥田宜稼悉不肯墾發小人之情安土重遷寧就飢餒無適樂土之慮故人之為言暝也謂暝暝無所知猶群羊聚畜須主者牧養處置置之茂草則肥澤繁息置之磽鹵則零丁耗減是以景帝六年詔郡國令人得去磽狹就寬肥至武帝遂徙關東貧人于隴西北地西河上郡會稽凡七十二萬五千口後加徙猾吏于關內今宜復遵故事徙貧人不能自業者于寬地此亦開草闢土振人之術也見通典一戰國海內十二分魏州有史起引漳水灌鄴民以興歌蜀郡李水鑿離堆通三江益部至今賴之泰開鄭國漢作白溝而關中號為陸海見御覽七十五武帝以趙過為搜粟都尉教民耕殖其法三犁共一牛一人將之下種挽耬皆取備焉日種一頃至今三輔猶賴其利今遼東耕犁轅長四尺回轉相妨既用兩牛兩人牽之一人將耕一人下種二人挽耬凡用二牛六人一日才種二十五畝其懸絶如此見齊民要術一御覽八百二十二又八百二十三夏扈趣耘鋤見事類夏賦注僕前為五原大守土地不知緝績冬至積草伏臥其中若見吏以草纏身令人酸鼻吾乃賣儲峙得二十餘萬詣鴈門廣武迎織師使巧手作機及紡以教民織具以上聞御覽亞十七又八百二十六昔人有慕讓財之名推田業與弟俄而貧乏反以威力就弟強貸此不當也見意林舉彌天之網以羅海內之士同類翕集而蟻附計士頻踧而脅從黨成于下君孤于上見意林馬不素養難以追遠士不素簡難以趨急見意林葉公之好攘羊雖可發姦君子不貴也見意林國不信道工不信度亡可待也見意林御覽四百三無賞罰之君而欲世之治是猶不蓄梳櫛而欲髮之治不可得也見意林御覽七百十四術家曰冬榮者春必殺見意林今典州郡者自違詔書縱意出入每詔書所欲禁絶雖重懇惻罵詈極筆由復廢舍終無悛意故里語曰州郡記如霹曆得詔書但挂壁永平中詔禁吏卒不得擊馬宮外樹為傷害其枝葉又詔令雒陽幘工作幘皆二尺五寸圍人頭有大小不可同度此詔不可不從也見初學記二十四意林御覽十三又四百九十六又五百九十三洗濯民心湔浣浮俗見意林永寧詔曰鐘鳴漏盡洛陽城中不得有行者見文選鮑明遠放歌行注詔書故事三公辟召以四科取士一曰德行高妙志節清白二曰學通行修經中博士三曰明曉法令足以決疑能案章覆問四曰剛毅多略遭事不惑才任三輔劇縣令見文選永明九年策秀才文注且三公天子之股肱掾屬則三公之喉舌天子當恭已南面于三公亦委策掾屬以答天子見北堂書鈔六十八御覽二百九三府掾屬位卑職重及其取官又多超卓或期月而長州郡或數年而至公卿誠不假非其人其負牒而亡也見北堂書鈔六十八秦兼天下罷侯置縣見北堂書鈔七十八舊制萬戶以上置大縣令以表其能字人之力也見北堂書鈔七十八孝宣帝方外安靜單于稽顙來朝百世不羈之虜也見文選孫楚為石苞與孫皓書注引崔實本論秦割六國之君劓殺其民于是赭衣塞路有鼻者醜故百姓鳥驚獸駭不知所歸命見文選廣絶交論注御覽三百六十七且觀世人之相論也徒以一面之交定臧否之決見文選三國名臣贊注引崔實本論及其出也足以濟世寧民見文選褚淵碑注又陸機弔魏武文注秋風厲而賞武臣見御覽二十五大昊之世設九庖之官見御覽七十八搔癬之疾先笑而後愁見御覽三百九十一君以審令為明臣以奉令為忠故背制而行賞謂之作福背令而行罪謂之作威作威則人畏之作福則人歸之夫威福者人主之神器也譬之操莫邪執其柄則人莫敢抗失其柄則還見害也見御覽六百三十八師曠曰人骨發猶木有曲直曲者為榆直者為檀檀宜作輻榆宜作轂見御覽九百五十二小民髮如韭剪復生頭如雞割復鳴吏不必可畏從來必可輕奈何欲望乎見御覽九百七十六理世不得真賢猶治病無真藥當用人參反得蘆服根見御覽九百八十
