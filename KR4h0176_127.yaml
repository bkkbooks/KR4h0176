body:
  text: 崔實四民月令正月之朔是謂正旦躬率妻孥潔祀祖禰及祀日進酒降神畢乃室家尊卑無大無小以次列于先祖之前子婦曾孫各上椒柏酒于家長稱觴舉壽欣欣如也上辛曰掃除韭畦中枯葉上除若十五日合諸膏小草續命丸散法藥農事未起命成童已上入大學學五經硯冰釋命幼童入小學學篇章命女工趣織布典饋釀春酒雨水中地氣上騰土長冒橛陳根可拔急災強土黑壚之田糞疇可種瓜可種瓠可種葵可種韭芥大小蔥蒜苜宿及雜蒜可種蓼可葅芋可作諸醬肉醬清醬正月自朔暨晦可移諸樹竹漆桐梓松柏雜木唯有果實者及望而止過十五日則果少實正月盡二月可種春麥豍豆可剝樹枝自正月以終季夏不可伐木必生蠹蟲見齊民要術五二月祠大社之日薦韭卵干祖禰陰凍畢澤可災美田緩土及河渚水處順陽習射以備不虞春分中雷乃發聲先後各五日寢別內外蠶事未起命縫人浣冬衣徹復為夾其有贏帛遂供秋服可糶粟黍大小豆麻麥子等收薪炭榆莢成及青收乾以為旨蓄色變白將落可作𨡭䤅隨節早晚勿失其適榆莢落時可種藍別小蔥采朮昏參夕杏華盛桑椹赤可種大豆可種胡麻謂之上時可種稹禾美田欲稠薄田欲稀可種苴麻可種瓜二月盡三月可采土苽根可掩樹枝見齊民要術四三月三日以及上除可采艾及柳絮清明節令蠶妾治蠶室塗隙穴具槌㭙箔籠清明節後十日封生薑至四月立夏後蠶大食芽生可種之是月也杏華盛可災白沙輕土之田可種稹禾可種苴麻可種瓜可種胡麻可種黍穄布谷鳴收小蒜桃華盛農人侯時而種是月也冬穀或盡椹麥未熟乃順陽布德振贍窮乏務施九族自親者始無或蘊財忍人之窮無或利名罄家繼富度入為出處厥中焉蠶晨尚間可利溝瀆葺治牆屋修門戶警設守備以禦春飢草竊之寇是月盡夏至暖氣將盛日烈暵燥利用漆油作諸煎藥可糶黍買布可采烏頭可種粳稻美田欲稀薄田欲稠見齊民要術二四月立夏後作鮦魚醬蠶入簇時雨降可種黍禾謂之上時可種胡麻可種大小豆美田欲稀薄田欲稠可收蕪菁及芥葶藶冬葵子可作酢繭既入簇趣繅剖線具機杼敬經絡草茂可燒灰是月也可作棗糒以御賓客可糴穬及大麥敝絮見齊民要術三五月一日可作醢芒種節後陽氣始虧陰慝將萌暖氣始盛蟲蠹並興乃弛角弓弩解其徽弦張竹木弓弩弛其弦以灰藏旃裘毛毳之物及箭羽以竿挂油衣勿辟藏是月五日合止痢黃連圓霍亂圓采葸耳取蟾蜍取東行螻蛄亦可作酢食粔籹霖雨將降儲米穀薪炭以備道路陷滯不通可為醬上旬炒豆中庾煮之以碎豆作末都至六七月之交分以藏瓜可作魚醬可種胡麻可多作糒以供家出入之糧以待賓位可災麥田夏至先後各二日可種黍蟲食李者黍貴也先後各五日可種牡麻是月也陰陽爭血氣散夏至先後各十五日薄滋味勿多食肥醲距立秋無食煮餅及水引餅可刈藍可糶大小豆胡麻糴穬大小麥收敝絮及布帛至後糴牟糏置罌中密封可別種稻及藍盡夏至後二十日止見齊民要術三六月可災麥田六日可收葵可作麴初伏薦麥瓜于祖禰命女工織縑練可種小蒜別大蔥種冬藍可蓄瓠中伏後可種冬葵可收芥子可種蕪菁大暑後六曰可藏瓜見齊民要術九七月四日命置麴室具箔槌取淨艾六日饌治五穀磨具七日遂作麴合藍丸及蜀漆丸暴經書及衣裳作乾糗采葸耳設酒脯時果散香粉于莚上祈請于河鼓織女藏韭菁別種可種蕪菁可種大小蔥可種小蒜可種芥可種苜宿處暑中向秋節浣故製新作捨薄以備始涼糶大小麥豆收縑練收柏實見初學記二十八御覽九百五十四八月暑退命幼童入小學如正月焉清風戒寒趣織縑帛染綵色河東染御黃法碓搗地黃根令孰灰汁和之攬令勻搯取汁別器盛更搗滓使板孰又以灰汁和之如薄粥為入不渝釜中煮生絹數回轉使勻舉看有盛水袋子便是絹孰抒出著盆中尋繹舒張少時拔出浮振去滓曬極乾以別絹濾白淳汁和孰抒出更就盆染之急舒展令均汁冷拔之出暴乾則成矣治釜不渝法在醴酪條中大率三升地黃染得一匹御黃多則好作柴桑薪蒿灰等物皆得用之擘絲治絮製新浣故及韋履賤好豫買以備冬寒刈萑葦芻茭涼燥可上弩繕治檠鋤正縛鎧弦遂以習射弛竹木弓弧糶種麥糴黍凡種大小麥得白露節可種薄田秋分種中田後十日種美田唯穬早晚無常可種大蒜可種芥可種苜宿可種乾葵可斷瓠作災瓠瓠中白膚實以養豬致肥其瓣則作燭致明采王不留行收韭菁作搗齏見齊民要術八收作取御覽八百五十五九月九日可采菊華收枳實是月也治場圃塗囷倉修竇窖繕五兵習戰射以備寒凍窮厄之寇存問九族孤寡老病不能自存者分厚徹重以救其寒藏茈薑蘘荷作葵葅乾葵其歲若溫皆待十月見齊民要術二又三又九十月培築垣牆塞向墐戶上辛命典饋漬麴釀冬酒作脯臘以供臘祀農事畢命成童入大學如正月焉五穀既登家備儲蓄乃順時令敕喪紀同宗有貧窶久喪不堪葬者則糾合宗人共與舉之以親疏貧富為差正心平斂無相踰越先自竭以率不隨先冰凍作涼餳煮暴飴可析麻緝績布縷作帛履不惜農語曰河射角堪夜作犂星沒水生骨賣縑帛敝絮糴粟豆麻子平量五穀各一升小罌盛埋垣北牆陰下冬至後五十日發取量之息最多者歲所宜也見齊民要術一冬至下十八字本作餘法同上據上文泛勝之書補冬十一月陰陽爭血氣散冬至日先後各五日寢別內外買白大養之以供祖禰見齊民要術三初學記三冬至之日薦黍羔先薦玄冥以及祖禰其進酒肴及謁賀君師耆老如正旦硯冰凍命幼童入小學讀孝經論語篇章可釀醢糴粳稻粟豆麻子伐竹木見齊民要術五十二月請召宗族婚姻賓旅講好和禮以篤恩紀農息役惠必下浹遂合耦田器養耕牛選任田者以俟農事之起去豬盍車骨及臘日祀祖炙箑東門磔白雞頭臘明日更新謂之小歲進酒尊長修賀君師見御覽二十九以為正文今依正月定為注附録王謨本六事俟考齊人呼寒食為冷節以麯為蒸餅樣團棗附之名曰棗糕五月五日取蠅虎杵碎拌豆豆自踴躍可以擊蠅見者便拜而願乞富乞壽乞子唯得乞一不得兼求京師立秋滿街賣楸葉婦女兒童皆翦成花樣戴之形製不一農語曰蜻蛉鳴衣裘成蟋蟀鳴懶婦驚近古婦人常以冬至日獻履襪于舅姑踐長至之義也附録唐孫思邈齊人月令四事免與崔實書混凡立春日食生菜不可過多取迎新之意而已乃進醬粥以導和氣見御覽二十事類賦春春分不殺生不弔疾君子齋戒衣夾衣導引不食生冷御覽二十四月八日不宜殺草木始服生衣宜進溫酒服溫藥是月也無壞麛卵無伐大樹是月也宜以夙興御覽二十二重陽之日必以糕酒登高眺迥為時宴之遊賞以畼秋志酒必采茱萸甘菊以泛之既醉而還見御覽三十二事類賦秋
