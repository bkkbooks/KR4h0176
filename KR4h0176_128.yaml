body:
  text: 李郃因天變上順帝書臣聞天下言縣象以示吉凶挺災變異以為譴誡昔齊桓公遭虹貫牛斗之變納管仲之謀令齊去婦無近妃宮桓公聽用齊以大安趙有尹史見月生齒齕畢大星占有兵變趙君曰天下共一畢知為何國也下史于獄其後公子牙謀弒君血書端門如史所言乃月十三日有客星氣象彗孛歷天市梗河招搖搶棓十六日入紫宮迫北辰十七日復過文昌泰陵至天船積水閒稍微不見客星一占日魯星歷天市者為穀貴梗河三星備非常泰陵八星為凶喪紫宮北辰為至尊如占恐宮盧之內有兵喪之變千里之外有非常暴逆之憂魯星不過歷尊宿行度從疾應非一端恐復有如王門母母子賤妾之欲居帝旁耗亂政事者誠令有之宜當抑遠饒足以財王者權柄及爵祿人天所重慎誠非阿妾所宜千豫天故挺變明以示人如不承慎禍至變成悔之靡及也見續漢天文志中注補引李氏家書因日蝕地震上安帝書陛下祗畏天威懼天變克己責躬博訪群下咎皆在臣力小任重招致咎徵去年二月京師地震今月戊午日蝕夫至尊莫過乎天天之變莫大乎日蝕地之戒莫重乎震動今一歲之中大異兩見日蝕之變既為尤深地震之戒搖宮最醜日者陽精君之象也戊者土主任在中宮午者火德漢之所承地道安靜法當由陽今乃專恣搖動宮闕禍在蕭牆之內臣恐宮中必有陰謀其陽下圖其上造為逆也災變終不虛生推原二異日辰行度甚為較明譬猶指掌宜察宮闕之內如有所疑急摧破其謀無令得成修政恐懼以答天意十月辛卯日有蝕之周家所忌乃為亡徵是時妃后用事七子朝令戊午之災近相似類宜貶退諸后兄弟群從內外之寵求賢良徵逸士下德令施恩惠澤及山海見續漢五行志六注補引李氏家書奏宜復祭六宗案尚書肆類于上帝禋于六宗六宗者上不及天下不及地傍不反四方在六合之中助陰陽化成萬物漢初于甘泉汾陰祭天地亦禋六宗至孝成帝之時匡衡奏立南北郊祀復祠六宗及王莽謂六宗易六子也建武都雒陽制祀不道祭六宗由是廢不血食今宜舊制度見續漢祭祀志中注補引李氏家書又見御覽五百二十八引李郃別傳舉敦樸士對策京房易傳曰君將無道害將及人去之深山全身厥災狼食人陛下覺寤比求隱滯故狼災息見續漢五行志一對策後復對詔又特問當世之敝為政所宜固對曰臣聞王者父天母地寶有山川王道得則陰陽和穆政化乖則崩震為災斯皆關之天心效於成事者也夫化以職成官由能理古之進者有德有命今之進者唯財與力伏聞詔書務求寬博疾惡嚴暴而今長吏多殺伐致聲名者必加遷賞其存寬和無黨援者輒見斥逐是以淳厚之風不宣彫薄之俗未革雖繁刑重禁何能有益前孝安皇帝變亂舊典封爵阿母因造妖孽使樊豐之徒乘權放恣侵奪主威改亂嫡嗣至令聖躬狼狽親遇其艱既拔自困殆龍興即位天下喁喁屬望風政積敝之後易致中興誠當沛然思惟善道而論者猶云方今之事復同於前臣伏從山草痛心傷臆實以漢興以來三百餘年賢聖相繼十有八主豈無阿乳之恩豈忘爵賞之寵然上畏天威俯案經典知義不可故不封也今宋阿母雖有大功勤謹之德但加賞賜足以酬其勞苦至於裂土開國實乖舊典聞阿母體性謙虛必有遜讓陛下宜許其辭國之高使成萬安之福夫妃后之家所以少完全者豈天性當然但以爵位尊顯專總權柄天道惡盈不知自損故至顛仆先帝寵遇閻氏位號太疾故其受禍曾不旋時老子曰其進銳其退速也今梁氏戚為椒房禮所不臣尊以高爵尚可然也而子弟群從榮顯兼加永平建初故事殆不如此宜令步兵校尉冀及諸侍中還居黃門之官使權去外戚政歸國家豈不休乎又詔書所以禁侍中尚書中臣子弟不得為吏察孝廉者以其秉威權容請託故也而中常侍在日月之側聲勢振天下子弟祿任曾無限極雖外託謙默不干州郡而諂偽之徒望風進舉今可為設常禁同之中臣昔館陶公主為子求郎明帝不許賜錢千萬所以輕厚賜重薄位者為官人失才害及百姓也竊聞長水司馬武宣開陽城門候羊迪等無他功德初拜便真此雖小失而漸壞舊章先聖法度所宜堅守政教一跌百年不復詩云上帝板板下民卒癉刺周王變祖法度故使下民將盡病也今陛下之有尚書猶天之有北斗也斗為天喉舌尚書亦為陛下喉舌斗斟酌元氣運平四時尚書出納王命賦政四海權尊勢重責之所歸若不平心災眚必至誠宜審擇其人以毗聖政今與陛下共理天下者外則公卿尚書內則常侍黃門譬猶一門之內一家之事安則共其福慶危則通其禍敗刺史二千石外統職事內受法則夫表曲者景必邪源清者流必絜猶叩樹本百枝皆動也周頌曰薄言振之莫不震疊此言動之於內而應於外者也由此言之本朝號令豈可蹉跌間隙一開則邪人動心利競暫啟則仁義道塞刑罰不能復禁化導以之寖壞此天下之紀綱當今之急務陛下宜開石室陳圖書招會群儒引問得失指擿變象以求天意其言有中理即時施行顯拔其人以表能者則聖聽日有所聞忠臣盡其所知又宜罷退宦官去其權重裁置常侍二人方置有德者省事左右小黃門五人才智閑雅者給事殿中如此則論者厭塞升平可致也臣所以敢陳愚瞽冒昧自聞者儻或皇天欲令微臣覺悟陛下陛下宜熟察臣言憐赦臣死見後漢李固傳愚以為天不言以災異為譴告政之治亂主之得失皆上帝所伺而應以災祥者也王者父天母地體具山川今日蝕地動山崩晝晦主將安立物將安寄昔江京之姦禍及骨肉至令陛下幽廢親履艱難天誘其衷陛下龍興海內莫不忻悅實有沛然改圖抑退權臣詢求善政以順天意夜而得之坐而待旦今則不然政令紛紜以復倣蹈前軌矣臣伏在草澤痛心疾首誠以陛下聖德應期實當嘉會反衰弊之政弘中興之美其功甚易譬猶指掌臣聞善罰不如善政善賞不如善教善教之道宜從內起昔周宣孝文中興之主也皆改華服霈然易規乃能移風易俗反之於古今封阿母恩賞太過常侍近臣威權太重臣案圖書災異之發亦以為然今宜斥退邪佞投之四裔引納方直令在左右陛下親發德音以招群俊臨御座見公卿言有稱意即時施行顯拔其人以旌忠善則陛下日有所聞忠臣日有所獻君臣相體上下交泰阿保雖有大功勤勞之恩可賜以貨賄傳之子孫列土分爵實非天意漢興以來賢君相繼豈無保乳之養非不寵貴之然上畏天威俯察經典不可故不封也梁氏子弟群從徵為列侯永平建初故事殆不如此妃后之家所以少有存全者非天性皆然但坐權寵太過天道惡盈也天有北斗所以斟酌元氣帝有尚書所以出納王命若賦役平均則百姓以安萬機不治則天下以亂今陛下所共治天下者外則公卿尚書內則常侍黃門譬猶一門之內一家之事安則共其福危則同其禍由是觀之權柄不可不慎號令不可不詳夫人君之有政猶水之有隄防隄防完全雖遭雨水霖潦不能為變政教一立暫遭凶年不足為憂誠令隄防穿漏萬夫同力不復能救政教一壞賢智馳騖不能復還今隄防雖堅漸有孔穴譬之一人之身本朝者心腹也州郡者四支也心腹痛則四支不舉故臣所憂在心腹之疾非四支之患臣以為堅隄防務政教先安心腹釐理本朝雖有寇賊水旱之變不足介意也臣令隄防壞陋心腹有疾雖無水旱之災天下固不可不憂矣臣父故司徒臣郃受先帝厚恩子孫不敢自比於餘隸故敢依圖書悉心以對不敢虛造見袁宏後漢紀十八發喪對帝雖幼少猶天下之父今日崩亡人神感動豈有臣子反共掩匿乎昔秦皇亡於沙丘胡亥趙高隱而不發卒害扶蘇以至亡國近北鄉侯薨閻后兄弟及江京等亦共掩祕遂有孫程手刃之事此天下大忌不可之甚者也見後漢李固傳上疏陳事臣聞氣之清者為神人之清者為賢養身者以練神為寶安國者以積賢為道昔秦欲謀楚王孫圉設壇西門陳列名臣秦使戄然遂為寢兵魏文侯師卜子夏友田子方軾段干木故群俊競至名過齊桓秦人不敢闚兵於西河斯蓋積賢人之符也陛下撥亂龍飛初登大位聘南陽樊英江夏黃瓊廣漢楊厚會稽賀純策書嗟歎待以大夫之位是以巖穴幽人智術之士彈冠振衣樂欲為用四海欣然歸服聖德厚等在職雖無奇卓然夕惕孳孳志在憂國臣前在荊州聞厚純等以病免歸誠以悵然為時惜之一日朝會見諸侍中竝皆年少無一宿儒大人可顧問者誠可歎息宜徵還厚等以副群望瓊久處議郎已且十年眾人皆怪始隆崇今更滯也光祿大夫周舉才謨高正宜在常伯訪以言議侍中杜喬學深行直當世良臣久託疾病可敕令起見後漢李固傳又見袁宏後漢紀十九有小異與吳雄上疏八使所糾宜急誅罰選舉署置可歸有司見後漢李固傳理种暠應承疏臣伏聞討捕所傷本非暠承之意實由縣吏懼法畏罪迫逐深苦致此不詳比盜賊群起處處未絕暠承以首舉大姦而相隨受罪臣恐沮傷州縣糾發之意更共飾匿莫復盡心見後漢种暠傳與劉宣上言自頃選舉牧守多非其人至行無道侵害百姓又宜止槃遊專心庶政見後漢李固傳薦楊淮楊淮累世服事臺閣既閑練舊典且有幹用宜在機密見引益部耆舊傳固為太尉薦淮特拜尚書駮發荊揚兗豫卒赴日南議若荊揚安穩無事發其史救之可也今荊揚盜賊槃結不散武陵南郡蠻夷未輯長沙桂陽數被徵發如復擾動必更生患其不可一也又兗豫之人卒被徵發遠赴萬里無有還期恐十五萬戶不得一士詔書迫促必致叛亡其不可二也南州水土溫暑加有瘴氣致死亡者十四五必道路奔散不能禁其不可三也遠涉萬里士卒疲勞比至嶺南不復堪鬭其不可四也軍行三十里為程而去日南九千餘里三百日乃到計人稟五升用米六十萬斛尚不計將吏驢馬之食但負甲自致費便若此其不可五也設軍到所在死亡必眾既不足禦敵當復更發此為刻割心腹以補四支其不可六也九真日南相去千里發其吏民猶尚不堪何況乃苦四州之卒以赴萬里之艱哉其不可七也前中郎將尹就討益州叛羌益州諺曰虜來尚可尹來殺我後就徵還以兵付刺史張喬喬因其將吏旬月之閒破殄寇虜此發將無益之效州郡可任之驗也宜更選有勇略仁惠任將帥者以為刺史太守悉使其住交阯今日南兵單無穀守既不足戰又不能可一切徙其吏民北依交阯事靜之後乃命歸本還募蠻夷使自相攻轉輸金帛以為其資有能反閒致頭首者許以封侯列土之賞故并州刺史長沙祝良性多勇決又南陽張喬前在益州有破虜之功皆可任用昔太宗就加魏尚為雲中守哀帝即拜龔舍為太山太守宜即拜良等便道之官見袁宏後漢紀十八後漢南蠻傳沖帝山陵議今處處寇賊軍興用費加倍新創憲陵賦發非一帝尚幼小可起陵於憲陵塋內依康陵制度其於役費三分減一見後漢李固傳臨荊州辟文學教欲釆名珠求之于蚌欲得名士求之文學或割百蚌不得一珠不可舍蚌求之于魚或百文學不出奇士不可舍文學求之于斗筲也由是言之蚌乃珠之所藏文學亦士之場矣見引長沙耆舊傳助展允婚教告文學師議曹史展允篤學貧苦慈孝推讓年將知命配匹未定聞之愴然甚閔哀之夫冠娶仕進非所以已允親兄弟無意亦朋友不好事之罪也前遣師輔為允娶云譚處士等各欲佐助迄今未定出錢千率先大夫天府內史守助佐幹及譚掾等其欲議朋友少徵條名目允貧也禮宜從約二三萬錢足以成婚見御覽五百四十一奏記梁商春秋褎儀父以開義路貶無駭以閉利門夫義路閉則利門開利門開則義路閉也前孝安皇帝內任伯榮樊豐之屬外委周廣謝惲之徒開門受賂署用非次天下紛然怨聲滿道朝廷初立頗存清靜未能數年稍復墮損左右黨進者日有遷拜守死善道者滯涸窮路而未有改敝立德之方又即位以來十月餘年聖嗣未立群下繼望可令中宮博𥳑嬪媵兼釆微賤宜子之人進御至尊順助天意若有皇子母自乳養無委保委醫巫以致飛燕之禍明將軍望重位顯當以天下為憂崇尚謙省垂則萬方而新營祠堂費功億計非以昭明令德崇示清儉自數年以來災怪屢見比無雨潤而沈陰鬱泱宮省之內容有陰謀孔子曰智者見變思刑愚者覩怪諱名天道無親可為祇畏加近者月食既于端門之側月者大臣之體也夫窮高則危大滿則溢月盈則缺日中則移凡此四者自然之數也天地之心福謙忌盛是以賢達功遂身退全名養壽無有怵迫之憂誠令王綱一整道行忠立明公踵伯成之高全不朽之譽豈與此外威凡輩耽榮好位者同日而論哉固狂夫下愚不達大體竊感古人一飯之報況受顧遇而容不盡乎見後漢李固傳今四海雲擾背義趨利父勸其子兄勉其弟皆先論價而後定位夫致一賢則國賴其功招一惡則天下被其害年以來妖怪屢起宮省之中必有陰謀將軍位尊勢重誠令王政一整必享不朽之福見袁宏後漢紀十八奏記梁商理王龔今旦聞下太尉王公敕令自實未審其事深淺何如王公束修厲節敦樂蓺文不求苟得不為苟行但以堅貞之操違俗失眾橫為讒佞所構毀眾人聞知莫不歎慄夫三公尊重承天象極未有詣理訴冤之義纖微感概輒引分決是以舊典不有大罪不至重問王公沈靜內明不可以加非理卒有他變則朝廷獲害賢之名群臣無救護之節矣昔絳侯得罪袁盎解其過魏尚獲戾馮唐訢其冤時君善之列在書傳今將軍內倚至尊外典國柄言重信著指撝無違宜加表救濟王公之艱難語曰善人在患飢不及餐斯其時也見後漢王龔傳湯問伊尹公卿大夫其相何如伊尹對曰三公智通大道應變不窮者也其言足以調陰陽正四時節風雨非大罪不遜位見御覽二百六議立嗣先與梁冀書天下不幸仍遭大憂皇太后聖德當朝攝統萬機明將軍體履忠孝憂存社稷而頻年之間國祚三絕今當立帝天下重器誠知太后垂心將軍勞慮議擇其人務存聖明然愚情眷眷竊獨有懷遠尋先世廢立舊儀近見國家踐祚前事未嘗不詢訪公卿廣求群議令上應天心下合眾望且永初以來政事多謬地震宮廟彗星竟天誠是將軍用情之日傳曰以天下與人易為天下得人難昔昌邑之立昏亂日滋霍光憂愧發憤悔之折骨自非博陸忠勇延年奮發大漢之祀幾將傾矣至憂至重可不熟慮悠悠萬事唯此為大國之興衰在此一舉見後漢李固傳遺黃瓊書聞已度伊洛近在萬歲亭豈即事有漸將順王命乎蓋君子謂伯夷隘柳下惠不恭故傳曰不夷不惠可否之間蓋聖賢居身之所珍也誠遂欲枕山棲谷擬跡巢由斯則可矣若當輔政濟民今其時也自生民以來善政少而亂俗多必待堯舜之君此為志士終無時矣嘗聞語曰嶢嶢者易缺皦皦者易汙陽春之曲和者必寡盛名之下其實難副近魯陽樊君被徵初至朝廷設壇席猶待神明雖無大異而言行所守亦無所缺而毀謗布流應時折減者豈非觀聽望深聲名太盛乎自頃徵聘之士胡元安薛孟嘗朱仲昭顧季鴻等其功業皆無所採是故俗論皆言處士純盜虛聲願先生弘此遠謨令眾人歎服一雪此言耳見後漢黃瓊傳與賓卿書開廓大分繆綢恩信見文選盧子諒答魏子悌詩注臨終與胡廣趙戒書固受國厚恩是以竭其股肱不顧死亡志欲扶持王室比隆文宣何圖一朝梁氏迷謬公等曲從以吉為凶成事為敗乎漢家衰微從此始矣公等受主厚祿顛而不扶傾覆大事後之良史豈有所私固身已矣于義得矣夫復何言見後漢李固傳臨終敕子孫素棺三寸幅巾殯殮于本郡墝埆之地不得還墓塋汙先公兆域見後漢李固傳注引謝承書士書求加禮种岱臣聞仁義興則道德昌道德昌則政化明政化明而萬姓寧伏見故處士种岱淳和達理耽悅詩書富貴不能回其慮萬物不能擾其心稟命不永奄然殂殞若不槃桓難進等輩皆已公卿矣昔先賢既沒有加贈之典周禮盛德有銘誄之文而岱生無印綬之榮卒無官諡之號雖未建忠效用而為聖恩所拔遐邇具瞻宜有異賞見後漢种暠附傳安平王續復國議續在國無政為妖賊所虜守藩不稱損辱聖朝不宜復國見後漢李固傳書甄邵背帛諂貴賣友貪官埋母同上令二子吾日者夢見先師東里先生與我講于陰堂之奧既而長歎豈吾齒之盡乎若命終之日桐棺足以周身外槨足以周棺斂形懸封濯衣幅巾編二尺四寸簡寫堯典一篇并刀筆各一以置棺前示不忘聖道見後漢周磐傳上言備南單于南單于安國疏遠故胡親近新降欲殺左賢王師子及左臺且渠劉利等又右部降者謀共迫脇安國起兵背畔請西河上郡安定為之儆備見後漢南匈奴傳又見袁宏後漢紀十三有小異使子俊上安帝書方今西州流民擾動而徵發不絕水潦不休地力不復重之以大軍疲之以遠戍農功消於轉運資財竭于徵發田疇不得墾闢禾稼不得收入搏手困窮無望來秋百姓力屈不復堪命臣愚以為萬里運糧遠就羌戌不若總兵養眾以待其疲車騎將軍騭宜且振旅留征西校尉任尚使督涼州士民轉居三輔休徭役以助其時止煩賦以益其財令男得耕種女得織紝然後畜精銳乘懈沮出其不意攻其不備則邊人之仇報奔北之恥雪矣見後漢龐參傳奏記鄧騭比年羌寇特困隴右供徭賦役為損日滋官負人責數十億萬今復募發百姓調取穀帛衒賣什物以應吏求外傷羌虜內困徵賦遂乃千里轉糧遠給武都西郡塗路傾阻難勞百端疾行則鈔暴為害遲進則穀食稍損運糧散于曠野牛馬死于山澤縣官不足取貸于民民已窮矣將從誰求名救金城而實困三輔三輔既困還復為金城之禍矣參前數言宜棄西域乃為西州士大夫所笑今苟貪不毛之地營恤不使之民暴軍伊吾之野以慮三族之外果破涼州禍亂至今夫拓境不寧無益于疆多田不耕何救饑敝故善為國者務懷其內不求外務務富其民不貪廣土三輔山原曠遠民庶稀疏故縣丘城可居者多今宜徙邊郡不能自存者入居諸陵田戍故縣孤城絕郡以權徙之轉運遠費聚而近之徭役煩數休而息之此善之善者也見後漢龐參傳汝南太守教掾吏古人勞于求賢逸于任使故能化清于上事緝于下其憲章朝右𥳑覈才職委功曹陳蕃匡政理務拾遺補闕任主簿應嗣庶循名責實察言觀效焉見後漢王堂傳簡覈眾職委功曹拾遺補闕主簿仰恃明俊古人有言勞于求賢逸于得士太守不敢妄有符教見御覽一百六十二引鍾岏良吏傳
