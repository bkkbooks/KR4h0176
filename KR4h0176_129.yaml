body:
  text: 呂蓋奏劾張酺酺位居三司知公門有儀不屏氣鞠躬以須詔命反作色大言怨讓使臣不可以示四遠見後漢張酺傳上疏自陳臣兄弟汙穢無分可採過以外戚遭值明時託日月之末光被雲雨之渥澤竝統列位光昭當世不能宣贊風美補助清化誠慚誠懼無以處心陛下躬天然之姿體仁聖之德遭國不造仍離大憂開日月之明運獨斷之慮援立皇統奉承大宗聖策定於神心休烈垂於不朽本非臣等所能萬一而猥推嘉美竝享大封伏聞詔書驚惶慚怖追觀前世傾覆之誡退自惟念不寒而慄臣等雖無逮及遠見之慮猶有庶幾戒懼之情常母子兄弟內相敕厲冀以端愨畏慎一心奉戴上全天恩下完性命刻骨定分有死無二終不敢橫受爵土以增罪累惶窘征營昧死陳乞見後漢鄧禹附傳郊祀賦咨改元正誕章厥新豐恩羨溢含唐孕殷承皇極稽天文舒優遊展弘仁揚明光宥罪人群公卿尹侯伯武臣文林華省奉贄厥珍夷髦盧巴來貢來賓玉璧既卒于斯萬年穆穆皇王克明厥德應符蹈運旅章厥福昭假烈祖以孝以仁自天降康保定我民見初學記十三伊皇母以延慈見文選褚淵碑注說文解字敘古者庖犧氏之王天下也仰則觀象于天俯則觀法于地視鳥獸之文與地之宜近取諸身遠取諸物于是始作易八卦以垂憲象及神農氏結繩為治而統其事庶業其繁飾偽萌生黃帝之史倉頡見鳥獸𨂜迒之迹知分理之可相別異也初造書契百工以乂萬品以察蓋取諸夬夬揚于王庭言文者宣㪍明化于王者朝廷君子所以施祿及下居德則忌也倉頡之初作書蓋依類象形故謂之文其後形聲相益即謂之字文者象物之本也字者言孳乳而浸多也著于竹帛謂之書書者如也以迄五帝三王之世改易殊體封于泰山者七十有二代靡有同焉周禮八歲入小學保氏教國子先以六書一曰指事指事者視而可識察而見意上下是也二曰象形象形者畫成其物隨體詰詘日月是也三曰形聲形聲者以事為名取譬相成江河是也四曰會意會意者比類合誼以見指撝武信是也五曰轉注轉注者建類一首同意相受考老是也六曰假借假借者本無其字依聲託事令長是也及宣王太史籀箸大篆十五篇與古文或異至孔子書六經左丘明述春秋傳皆以古文厥意可得而說也其後諸侯力政不統于王惡禮樂之害己而皆去其典籍分為七國田異畮車涂異軌律令異法衣冠異制言語異聲文字異形秦始皇帝初兼天下丞相李斯乃奏同之罷其不與奏文合者斯作倉頡篇中車府令趙高作爰歷篇太史令胡母敬作博學篇皆取史籀大篆或頗省改所謂小篆者也是時秦燒滅經書滌除舊典大發隸卒興役戍官獄職務繁初有隸書以趣約易而古文由此絕矣自爾奏書有八體一曰大篆二曰小篆三曰刻符四曰蟲書五曰摹印六曰署書七曰殳書八曰隸書漢興有艸書尉律學僮十七已上始試諷書九千字乃得為史又以八體試之群移太史并課最者以為尚書史書或不正輒舉劾之今雖有尉律不課小學不修莫達其說久矣孝宣皇帝時召通倉頡讀者張敞從受之涼州刺史杜業沛人爰禮講學大夫秦近亦能言之孝平皇帝時徵禮等百餘人令說文字未央廷中以禮為小學元士黃門侍郎楊雄采以作訓纂篇凡倉頡已下十四篇凡五千三百四十字群書所載略存之矣及亡新居攝使大司空甄豐等校文書之部自以為應制作頗改定古文時有六書一曰古文孔子壁中書也二曰奇字即古文而異者也三曰篆書即小篆秦始皇帝使下杜人程邈之所作也四曰左書即秦隸書五曰繆篆所以摹印也六曰鳥蟲書所以書幡信也壁中書者魯恭王壞孔子宅而得禮記尚書春秋論語孝經又北平侯張倉獻春秋左氏傳郡國亦往往于山川得鼎彝其銘即前代之古文皆自相似雖頗復見遠流其詳可得略說也而世人非訾以為好奇者也故詭更正文鄉壁虛造不可如之書變亂常行以燿于世諸生競逐說子解經誼稱秦之隸書為倉頡時書云父子相傳何可改易乃猥曰馬頭人為長人持十為斗虫者屈中也廷尉說律至以字斷法苛人受錢苛之字止句也若此者甚眾皆不合孔氏古文謬于史籀俗儒啚夫翫其所習蔽所希聞不見通學未嘗覩字例之條怪舊勢而善野言以其所知為祕妙究洞聖人之微恉又見倉頡篇中幼子承詔因號古帝之所作也其辭有神仙之術焉其迷悟不諭豈不悖哉書曰予欲觀古人之象言必遵修舊文而不穿鑿孔子曰吾猶及史之闕文今亡也夫蓋非其不知而不問人用已私是非無正巧說辭使天下學者疑蓋文字者經蓺之本王政之始前人所以垂後後人所以識古故曰本立而道生佑天下之至嘖而不可亂也今敘篆文合以古籀博采通人至于小大信而有證稽譔其說將以理群類解謬誤曉學者達神恉分別部居不相雜廁萬物咸覩靡不兼載厥誼不昭爰明以諭其偁易孟氏書孔氏詩毛氏禮周官春秋左氏論語孝經皆古文也其于所不知蓋闕如也見宋本說文說文解字後敘後敘曰此十四篇五百四十部九千三百五十三文重一千一百六十三解說凡十三萬三千四百四十一字其建首也立一為耑方以類聚物以群分同條牽屬共理相貫雜而不越據形系聯引而申之以究萬原畢終干亥知化窮冥于時大漢聖德熙明承天稽唐𢾭崇殷中遐邇被澤渥衍沛滂廣業甄微學士知方𢲘嘖索隱厥誼可傳粵在永元困頓之年孟陬之月朔日甲申曾曾小子祖自炎神縉雲相黃共承高辛太岳佐夏呂叔作藩俾侯于許世祚遺靈自彼徂召宅此汝瀕竊卬景行敢涉聖門其弘如何節彼南山欲罷不能既竭愚才惜道之味聞疑載疑演贊其志次列微辭知此者稀儻昭所尤庶有達者理而董之見宋本說文上書進說文召陵萬歲里公乘草莽臣沖稽首再拜上書皇帝陛下臣伏見陛下神明盛德承遵聖業上考度于天下流化于民先天而天不違後天而奉天時萬國咸寍神人以和猶復湥惟五經之妙皆為漢制博采幽遠窮理盡性以至于命先帝詔侍中騎都尉賈逵修理舊文殊蓺異術王教一耑苟有可以加于國者靡不悉集易曰窮神知化德之盛也書曰人之有能有為使羞其行而國其昌臣父故太尉南閣祭酒慎本從逵受古學蓋聖人不空作皆有依據今五經之道昭炳光明而文字者其本所由生自周禮漢律皆當學六書貫通其意恐巧說衺辭使學者疑慎博問通人考之于逵作說文解字六蓺群言之詁皆通其意而天地鬼神山川艸木鳥獸䖵蟲雜物奇怪王制禮儀世閒人事莫不畢載凡十五卷十三萬三千四百四十一字慎前以詔書校書東觀教小黃門孟生李喜等以文字未定未奏上今慎已病遣臣齎詣闕慎又學孝經孔氏古文說古文孝經者孝昭帝時魯國三老所獻建武時給事中議郎衛宏所校皆口傳官無其說謹撰具一篇并上臣沖誠惶誠恐頓首頓首死辠死辠臣稽首再拜以聞皇帝陛下建光元年九月已卯朔二十日戊戍上見說文本作已亥朔二十日戊午上今依四分術推改天度遠近對案官所施漏法令甲第六常符漏品孝宣皇帝三年十二月乙酉下建武十年二月壬詔書施行漏刻以日長短為數率日南北二度四分增減一刻一氣俱十五日日去極各有多少今官漏率九日移一刻不隨日進退夏厤漏隨日南北為長短密近于官漏分明可施行見續漢律厤志中賢良方正對策策問陰陽不和或水或旱方旱方正鬱林布衣養奮對曰天有陰陽陰陽有四時四時有政令春夏則子惠布施寬仁秋冬則剛猛盛威行刑賞罰殺生各應其時則陰陽和四時調風雨時五穀升今則不然長吏多不奉行時令為政舉事干逆天氣上不䘏下下不忠上百姓困乏而不䘏哀眾怨鬱積故陰陽不和風雨不時災害緣類水者陰盛小人居位依公營私讒言誦上雨漫溢者五穀有不升而賦稅不為減百姓虛竭家有愁心也見續漢五行志三注補引廣州先賢傳佞邪以不正食祿饗所致見續漢五行志三注補引養奮對策當溫而寒刑罰慘也見續漢五行志三注補引袁山松書拜內史上疏臣斗筲之小吏擢在察視之官職任過分當糾邪矯枉見東觀漢紀上疏諫廢皇太子昔賊臣江充造構讒逆至令戾園興兵終及禍難後壺關三老一言上乃覺悟雖追前失悔之何逮今皇太子春秋方始十歲未見保傅九德之義宜簡賢輔就成聖質見後漢張皓傳上疏諫誅趙騰臣聞堯舜立敢諫之鼓三王樹誹謗之木春秋採善書惡聖主不罪芻蕘騰等雖干上犯法所言本欲盡忠正諫如當誅戮天下杜口塞諫爭之源非所以昭德示後也見後漢張皓傳上書諫縱宦官詩曰不愆不忘率由舊章尋大漢初隆及中興之世文明二帝德化尢盛觀其理為易循易見但恭儉守節約身尚德而已中官常侍不過兩人近倖賞賜裁滿數金惜費人故家給人足夷狄聞中國優富任信道德所以姦謀自消而和氣感應而頃者以來不遵舊典無功小人皆有官爵富之驕之而復害之非愛人重器承天順道者也伏願下少留聖思割損左右以奉天心見後漢張綱傳上書刻梁冀大將軍梁冀河南尹不疑蒙外戚之援荷國厚恩以芻蕘之安居阿保不能敷揚五教翼贊日月而專為封豕長蛇肆其貪饕甘心好貨縱恣無猒多樹諂以害忠良誠天威所不赦大辟所宜加也謹條其無君之心十五事于左皆忠臣之所切齒也見蜀志張翼傳注引續漢書袁宏後漢紀十九後漢張綱傳諫國相諸侯射豕天子射熊八彝六樽禮數不同昔季氏設朱干玉戚以舞大夏左傳曰唯名與器不可以假人奢僭之漸不可聽也見後漢陳敬王羨傳注引謝承書上言改定官漏刻官漏刻率九日增減一刻不與天相應或時差至二刻半不如夏厤漏刻隨日南北為短見續漢律厤志宋書厤志二隋書天文志刻漏上言建復西海郡縣西戎為害前世所患臣不能紀古且以近事言之自建武以來其犯法者常從燒當種起所以然者以其居大小榆谷土地肥美又近塞內諸種易于為非難以攻伐南得鍾存以廣其眾北阻大河因以為固又有西海魚鹽之利緣山濱水以廣田蓄故能彊大常雄諸種恃其權勇招誘羌胡今者衰困黨援壞沮親屬離叛餘勝兵者不過數百逃亡棲竄遠依發羌臣愚以為宜及此時建復西海郡縣規固二榆廣設屯田隔塞羌胡交關之路遏絕狂狡窺欲之源又殖穀富邊省委輸之役國家可以無西方之憂見後漢西羌傳移書南郡屬縣凡虎狼之在山林猶人之居城市古者至化之世猛獸不擾皆由恩信寬澤仁及飛走太守雖不德敢忘斯義記到其毀壞檻穽不得妄捕山林見後漢法雄傳上書陳交阯獻龍眼荔支事狀臣聞上不以滋味為德下不以貢膳為功故天子食太牢為尊不以果實為珍伏見交阯七郡獻生龍眼等鳥驚風發南州土地惡蟲猛獸不絕于路至于觸犯死亡之害死者不可復生來者猶可救也此二物升殿未必延年益壽見後漢和紀注引謝承書陳興廣學校疏臣聞五經所以治學為人五經不修世道陵遲學校不弘則人名行不廣故秦以坑儒而滅漢以崇學而興所以罔羅天下統理陰陽彌綸治道而視民軌則也光武中興修繕太學博士得具五人五經各敘其義故能化澤沾洽天下和平自頃以來五經頗廢後進之士趣於文俗宿儒舊學無與傳業由是俗吏繁熾儒生寡少其在京師不務經學競于人事爭于貨賄太學之中不聞談論之聲從橫之下不覩講說之士臣恐五經六蓻浸以陵遲儒林學肆於是廢失所以制御四夷者以有道德仁義也傳曰王者之臣其實師也言其道德可師也今百官伐閱皆以通經為名無一人能稱孔子曰無而為有虛而為盈難乎有恒矣自今官人宜令取經學者公府孝廉皆應詔則人心專一風化可淳也見袁宏後漢殤帝紀歎懷賦悲終風之隕籜條枝梢以摧傷桂敷榮而方盛遭暮冬之隆霜華霏霏之將實中夭零而消亡童烏濬其明哲悲何壽之不將嗟劉生之若茲奄彌留而永喪見蓺文類聚三十四和帝誄天王徂登率土奄傷如何昊穹奪我聖皇恩德累代乃作銘章其辭曰參惟大行配天建德陶元二化風流萬國立我蒸民宜此儀則厥初生民三五作剛載籍之盛著于虞唐恭惟大行爰同其光自昔何為欽明允塞恭惟大行天覆地載無為而治冠斯往代往代崎嶇諸夏擅命爰茲發號民樂其政奄有萬國民臣咸秩大孝備矣閟宮有侐由昔姜嫄祖妣之室本枝百世神契惟一彌留不豫道揚末命勞謙有終實惟其性衣不制新犀玉遠屏履和而行威稜上古洪澤滂流茂化沾溥不憖少留民斯何怙歔欷成雲泣涕成雨昊天不弔喪我慈父見蓺文類聚十二陳公誄化侔春風澤配甘雨見文選曹植上責躬詩表注賈逵誄惟天生君繼孔之迹光明克哲果論至賾見初學記二十一出師頌茫茫上天降祚有漢兆基開業人神攸贊五曜霄映素靈夜歎皇運來授萬寶增煥歷紀十二天命中易西零不順東夷遘逆乃命上將授以雄戟桓桓上將實天所啟允文允武明詩悅禮憲章百揆為世作楷昔在孟津惟師尚父素旄一麾渾一區宇蒼生更始朔風變楚薄伐獫狁至于太原詩人歌之猶歎其艱况我將軍窮城極邊鼓無停響旗不蹔褰澤霑遐荒功銘鼎鉉我出我師于彼西疆天子餞我路車乘黃言念伯舅恩深渭陽介珪既削列壤酬勳今我將軍啟土上郡傳子傳孫顯顯令問見文選蓺文類聚五十九上書案坐任嘉舉主罪臣聞春秋誅惡及本本誅則惡消振裘持領領正則毛理今任嘉所坐狼籍未受辜戮猥以垢臭改典大郡自非案坐舉者無以禁絕姦萌往者湖陸令張疊蕭令駟賢徐州刺史劉福等釁穢既章咸伏其誅而豺狼之吏至今不絕者豈非本舉之主不加之罪乎昔齊威之霸殺姦臣五人并及舉者以弭謗讟當斷不斷黃石所戒夫聖王所以聽僮夫匹婦之言者猶塵加嵩岱露集淮海雖未有益不為損也惟陛下留神省察見後漢楊倫傳辭補常山王傅有留死一尺無北行一寸刎頸不易九裂不恨匹夫所執彊於三軍固敢有辭見後漢楊倫傳
