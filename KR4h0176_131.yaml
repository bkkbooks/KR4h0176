body:
  text: 楊震上疏請出乳母王聖臣聞政以得賢為本理以去穢為務是以唐虞俊乂在官四凶流放天下咸服以致雍熙方今九德未事嬖幸充庭阿母王聖出自賤微得遭千載奉養聖躬雖有推燥居濕之勤前後賞惠過報勞苦而無厭之心不知紀極外交屬託擾亂天下損辱清朝塵點日月書誡牝雞牡鳴詩刺哲婦喪國昔鄭嚴公從母氏之欲恣驕弟之情幾至危國然後加討春秋貶之以為失教夫女子小人近之喜遠之怨實為難養易曰無攸遂在中饋言婦人不得與於政事也宜速出阿母令居外舍斷絶伯榮莫使往來令恩德兩隆上下俱美惟陛下絶婉孌之私割不忍之心留神萬機誡慎拜爵減省獻御損節徵發令野無鶴鳴之嘆朝無小明之誨大東不興於今勞止不怨於下擬蹤往古比德哲王豈不休哉見後漢楊震傳復詣闕上疏諫劉瓌襲爵臣聞高祖與群臣約非功臣不得封攻城戰野棄身沙漠降服百蠻不羈之虜然後得受茅土故經制父死子繼兄亡弟及所以別親疏殊適庶尊國體重繼嗣防淫篡絶姦謀百王不易之道也伏見詔書封故朝陽侯劉護再從兄弟瓌襲爵為侯護同産弟威今猶見在臣聞天子不專封封有功諸侯不守爵爵有德今瓌無他功德但以配阿母女既忝位侍中一時之閒超至封侯不稽舊制不合經義行人喧譁百寮不安臣誠知言與罪俱辭與辜會忝當台翰之任故不敢不盡言之陛下宜覽既往順帝之則見袁宏後漢紀十七又後漢楊震傳諫為王聖修第疏臣聞古者三年耕必有一年之儲九年耕必有三年之儲故堯之遭洪水民無菜色傳曰國無三年之儲非其國也故豐年知禮凶年減除臣伏念方今災害發起彌彌滋甚百姓空虛不能自贍重以螟蝗羌虜鈔掠二邊震擾戰鬭之役至今未息兵甲軍糧不能復給大司農帑藏匱乏殊非社稷安寧之時伏見詔書為阿母興起津城門內第舍合兩為一連里竟街雕修繕飾窮極巧伎今盛夏土王而攻山釆石百姓布野農民廢業其大匠左校別部將作合數十處轉相迫促為費巨億周廣謝惲兄弟與國無肺腑枝葉之屬依倚近幸姦佞之人與樊豐王永等分威共權屬託州郡傾動大臣宰司辟召承望旨意招來海內貪汙之人受其貨賂至有臧錮棄世之徒復得顯用白黑溷淆清濁同源天下歡譁咸曰財貨上流為朝結譏臣聞師言上之所取財盡則怨力盡則叛怨叛之人不可復使故曰百姓不足君誰與足惟陛下度之見袁宏後漢紀十七後漢楊震傳合録成文因地震復上疏臣蒙恩備台輔不能奉宣政化調和陰陽去年十二月四日京師地動臣聞師言地者陰精當安靜承陽而今動搖者陰道盛也其日戊辰三者皆土位在中宮此中臣近官盛于持權用事之象也臣伏惟陛下以邊境未寧躬自菲薄宮殿垣屋傾倚枝柱而已無所興造欲令遠近咸知政化之清流商邑之翼翼也而親近幸臣未崇斷金驕溢踰法多請徒士盛修第舍賣弄威福道路歡譁衆所聞見地動之變近在城郭殆為此發又冬無宿雪春節未雨百僚燋心而繕修不止誠致旱之徵也書曰僭恆陽若臣無作威作福玉食唯陛下奮乾剛之德棄驕奢之臣以掩訞言之口奉承皇天之戒無令威福久移于下見後漢楊震傳救趙騰疏臣聞堯舜之世諫鼓謗木立之于朝殷周哲王小人怨詈則還自敬德所以達聰明開不諱博採負薪盡極下情也今趙騰所坐激訐謗語為罪與手刃犯法有差乞為虧除全騰之命以誘芻蕘輿人之言見後漢楊震傳又見袁宏後漢紀十七有刪節因風災上疏諫微行臣聞瑞由德至災應事生傳曰禍福無門唯人自召天不言語以災異譴告是以孔子迅雷風烈必有變動詩云敬天之威不敢驅馳王者至尊出入有常警蹕而行靜室而止自非郊廟之事則鑾旗不駕故詩稱自郊徂宮易曰王假有廟致孝享也諸侯如臣之家春秋尚列其誡況以先王法服而私出槃游降亂尊卑等威無序侍衛守空宮紱璽委女妾設有非常之變任章之謀上負先帝下悔靡及臣奕世受恩得備納言又以薄學充在講勸特蒙哀識見照日月恩重命輕義使士死敢憚摧折略陳其愚見後漢楊震傳又見袁宏後漢紀二十一有小異上疏諫任左右除拜臣聞先王建國順天制官太微積星名為郎位入奉宿衛出牧百姓皋陶誡虞在于官人頃者道路拜除恩加豎隸爵以貨成化由此敗所以俗夫巷議白駒遠逝穆穆清朝遠近莫觀宜割不忍之恩以斷求欲之路見後漢楊震傳上言吏職內外吏職多非其人自頃所徵皆特拜不試致盜竊縱恣怨訟紛錯舊典中臣子弟不得居位秉勢而今枝葉賓客布列職署或年少庸人典據守宰上下忿患四方愁毒可遵用舊章退貪殘塞災謗請下司隸校尉中二千石二千石城門五營校尉北軍中候各實核所部應當斥罷自以狀言三府廉察有遺漏續上見後漢楊震傳上言計吏宜絶橫拜三署見郎七百餘人帑藏空虛浮食者衆而不良守相欲因國為池澆濯釁穢宜絶橫拜以塞覬覦之端見後漢楊震傳奏劾侯參參取受罪臧纍億牂柯男子張攸居為富室參橫加非罪云造訛言殺攸家八人沒入廬宅又與同郡諸生李元之官共飲酒醉飽之後戲故相犯誣言有淫慝之罪應時捶殺以人臣之勢行桀紂之態傷和逆理痛感天地宜當糾持以謝一州見後漢楊震傳注引謝承書京蠍尹袁逢于長安客舍中得重車三百餘乘金銀珍玩不可稱紀見後漢楊震傳注引謝承書奏劾侯覽臣案國舊典宦豎之官本在給使省闥司昏守夜而今猥受過寵執政操權其阿諛取容者則因公褎舉以報私惠有忤逆于心者必求事中傷肆其凶忿居法王公富擬國家飲食極肴膳僕妾盈紈素雖季氏專魯穰侯擅秦何以尚茲案中常侍侯覽弟參貪殘元惡自取禍滅覽固知釁重必有自疑之意臣愚以為不宜復見親近昔懿公刑邴歜之父奪閻職之妻而使二人參乘卒有竹中之難春秋書之以為至戒蓋鄭詹來而國亂四佞放而衆服以此觀之容可近乎覽宜急屏斥投畀豺虎若斯之人非恩所宥請免官送歸本郡見後漢楊震傳對尚書詰責任方突獄事春秋不誅黎比而魯多盜方等無狀釁由單匡刺執法之吏害奉公之臣復令得逃竄寬縱罪身元惡大憝終為國害乞檻車徵匡考核其事則姦慝蹤緒必可立得見後漢楊震傳使掾屬對尚書詰劾侯覽事春秋趙鞅以晉陽之甲逐君側之惡傳曰除君之惡唯力是視鄧通懈慢申屠嘉召通詰責文帝從而請之漢世故事三公之職無所不統見後漢楊震傳又略見袁宏後漢紀二十二蛇變上封事臣聞和氣致祥乖氣致災休徵則五福應咎徵則六極至夫善不妄來災不空發必應行而至王者心有所惟意有所想雖未形顏色而五星以之推移陰陽為其變度以此而觀天之與人豈不符哉尚書曰天齊乎人假我一日是其明徵也夫皇極不建則有蛇龍之孽詩云惟虺惟蛇女子之祥故春秋書鄭昭公時兩蛇鬭于南門之外其後昭公殆以女敗昔周康王承文王之盛一朝晏起夫人不鳴璜宮門不擊析關睢之人見幾而作夫女謁行則讒夫昌讒夫昌則苞苴通故殷湯以之自戒終濟亢旱之災惟陛下思乾剛之道別內外之宜崇帝乙之制受元吉之祉抑皇甫之權割豔妻之愛則蛇變可消禎祥立應殷戊宋景其事甚明見後漢楊震附傳又見袁宏後漢紀二十三上疏諫封爵過差游觀無度臣聞天生蒸民不能自理故立君長使司牧之是以唐虞兢兢業業周文日昃不暇明慎庶官俊乂在職以立雍熙之化頃聞拜爵過多每被尚書劾非衆所歸或不知何人昔堯用舜猶尚先試三載考績以觀厥成而今所序用無他名德有形勢者旬日之間纍遷高位守道之徒歷載不轉勞逸無別善惡同流北山之詩所為訓作又聞字要微行數出幸諸苑囿觀鷹犬之勢極般遊之荒政事日墮大化陵遲忘乾乾之不息忽屢省之欽哉陛下不顧二祖之勤止追慕五宗之美蹤殆非所謂光昭之美而欲以望太平是由曲表而求直景卻行而求及前人也惟陛下絶慢游之戲念官人之重割超越之恩慎貫魚之次無令醜女有四殆之歎遐邇有憤怨之聲臣受恩偏厚特忝師傅之任不敢自問凡臣括囊避咎謹自手書皂囊密上見袁宏後漢紀二十四又後漢楊震附傳上書諫作林泉畢圭苑臣聞使者竝出規度城南民田欲以為苑者昔先王制囿裁足取牲以備三驅薪採芻牧者往焉故詩曰王在靈囿麀鹿攸伏傳曰吾王不游吾何以休皆被其德政而樂所為如此至六國之際取獸者有罪傷槐者將誅孟軻為梁惠王極陳其事先帝之制左開洪池右作上林不儉不泰以合禮中今猥規都城之側以為苑囿壞沃野廢田園驅居人以畜禽獸之物非所以保養民庶赤子之義築郎不時春秋有譏盤于游田周公作戒其城外之苑已有五六足用逞情意順四時何必變革舊制以罷民力楚興章華郢人乖叛秦作阿房黎氓憤怨宜思夏后卑室之意太宗露臺之費慰此下民勞止之歌見袁宏後漢紀二十四又略見後漢楊震附傳上言願減賜戶以封劉寬張濟臣前與故太尉劉寬司徒張濟竝被侍講俱受三事張角謀亂又共陳便宜而獨蒙師傅之澤茅土之祚而寬濟不蒙雲雨之潤乞減賜戶以封寬濟見袁宏後漢紀二十五虹霓對臣聞經傳所載或得神以興或得神以亡國家休明則降鑒其德邪辟昏亂則示其禍今嘉德殿所見黑氣考之經傳應為虹霓皆妖邪所生不正之象詩人所謂蝃蝀者也于中孚經曰霓之比無德已色親方今內多嬖幸外任小臣上下竝怨喧譁盈路是以災異屢見前後丁寧今復投霓可謂孰矣案春秋讖曰天投霓天下怨海內亂加四百里之期亦復垂及昔虹貫牛山管仲諫桓公無近妃宮易曰天垂象見吉凶聖人則之疑妾媵之中有因愛放縱左右嬖人閹尹之徒共專國朝欺罔日月又鴻都門下招會群小造作賦說以蟲篆小枝見寵于時如歡兜共工更相薦說旬月之間竝各拔擢樂松處常伯任芒居納言郤儉梁鵠俱以便辟之性佞辨之心各受豐爵不次之寵而令縉紳之徒委伏畎畝口誦堯舜之言身蹈絶俗之行棄捐溝壑不見逮及冠履倒易陵谷代處從小人之邪意順無知之私欲不念板蕩之作虺蜴之誡殆哉之危莫過于今幸賴皇天垂象譴告周書曰天子見怪則修德諸侯見怪則修政卿大夫怪則修職士庶人見則修身唯陛下慎經典之誡圖變復之道斥遠佞巧之臣速徵鶴鳴之士內親張仲外任山甫斷絶尺一抑止槃游留思庶政無敢怠遑冀上天還威衆變可弭老臣過受師傅之任數蒙寵異之恩豈敢愛惜垂沒之年而不盡其慺慺之心哉見袁宏後漢紀二十四後漢楊震附傳虎見平樂觀又見憲陵對虎者金行參伐之精很戾之獸也今在位率多奢暴貪殘酷虐乎見袁宏後漢紀二十四與王允書若以張讓事百日再徵宜深思之見袁宏後漢紀二十七上封事傕邊鄙之人習于夷風今又自知所犯悖逆常有怏怏之色欲輔車駕幸黃白城以舒其憤臣願陛下忍之未可顯其罪也見魏志董卓傳注引獻帝起居注又見袁宏後漢紀二十八答曹公書彪白雅顧隆篤每蒙接納私自光慰小兒頑鹵謬見采録不能期效以報所愛方今軍征未暇其備位匡政當與戮力一心而寬玩自稽將違法制相子之行莫若其父恆慮小兒必致傾敗足下恩恕延罪迄今近聞問之日心腸酷裂凡人情誰能不爾深惟其失用以自釋所惠馬及雜物自非親舊孰能至斯省覽衆賜益以悲懼見古文苑節遊賦爾乃息偃暇豫攜手同征遊乎北園以娛以逞欽太皞之統氣樂乾坤之布靈誕烟熅之純和百卉挺而滋生谷風習以順時橈百物而有成行中林以倣徨玩奇樹之抽英或素華而雪朗或紅彩而發頳緑葉白蒂紫柯朱莖楊柳依依鍾龍蔚青紛灼灼以舒葩芳馥馥以播馨嗟珍果之叢生每異類而絶形稟沖和以固植信能實而先榮于是回旋詳觀目周意倦御于方舟載笑載言仰沂涼風俯濯織腕極歡欣以從容乃升車而來反見藝文類聚二十八出征賦嗟夫吳之小夷負川阻而不廷肇天子之命公總九伯而是征整三軍而飭戒殄征夫而叛驚舫翼華以鱗集蒼鷹雜以星陳塞川原而上下蔽城隍而無垠于是州牧覆舟水衡戒事飭師就部乃講乃試信大海之可橫焉江湖之足忌公命臨淄守于鄴都侯懷大舜乃號乃謨茂國事之是勉兮歎經時而離居企歡愛之偏處兮獨搔首于城隅見藝文類聚五十九泛從風而回艫徐日轉而月移旆已人乎河口殿尚集于園池處者口垂拱而基安觀者若結駟見北堂書鈔未改本一百三十七御覽七百七十許昌宮賦于是儀北極以搆橑希形乎太微結雲閣之崔嵬植神木與靈草紛蓊蔚以參差爾乃置天臺于扆角列執法于西南築舊章之兩觀綴長廊之步欄重閨禁之窈窕造華蓋之幽深儉則不陋奢則不盈黎民子來不督自成于是天子乃具法服戒群僚鐘鼓隱而雷鳴警蹕嘈而響起暗藹低徊天行地止以入乎新宮臨南軒而向春方負黼黻之屏風憑玉几而按圖書想往昔之興隆見藝文類聚六十二華殿炳而嶽立見文選潘嶽藉田賦注神女賦惟玄媛之逸女育明曜乎皇庭吸朝霞之芬液淡浮遊乎太清余執義而潛厲乃感夢而通靈盛容飾之本豔奐龍采而鳳榮翠黼翬裳纖穀文袿順風揄揚乍合乍離飄若興動玉趾未移詳觀玄妙與世無雙華面玉粲韡若芙蓉膚凝理而瓊潔體鮮弱而柔鴻回肩襟而動合何俯仰之妍工嘉今夜之幸遇獲帷嘗乎期同情沸踊而思進彼嚴厲而靜恭微諷說而宣諭色歡懌而我從見藝文類聚七十九孔雀賦魏王園中有孔雀久在池沼與衆鳥同列其初至也甚見奇偉而今行者莫眂臨淄侯感世人之待士亦咸如此故興志而作賦并見命及遂作賦曰有南夏之孔雀同號稱于火精寓鶉虛以挺體含正陽之淑靈首戴冠以飭貌爰龜背而鸞頸徐軒翥以俯仰動止步而有程見藝文類聚九十一答臨淄侯箋修死罪死罪不侍數日若彌年載豈由愛顧之隆使係仰之情深邪損辱嘉命蔚矣其文誦讀反覆雖諷雅頌不復過此若仲宣之擅漢表陳氏之跨冀域徐劉之顯青豫應生之發魏國斯皆然矣至于修者聽釆風聲仰德不暇自周章于省覽何遑高視哉伏惟君侯少長貴盛體發旦之資有聖善之教遠近觀者徒謂能宣昭懿德光贊大業而已不復謂能兼覽傳記留思文章今乃含王超陳度越數子矣觀者駭視而拭目聽者傾首而竦耳非夫體通性達受之自然其孰能至于乎又嘗親見執事握牘持筆有所造作若成誦在心借書于手曾不斯須少留思慮仲尼日月無得踰焉修之仰望殆如此矣是以對鶡而辭作暑賦彌日而不獻見西施之容歸增其貌者也伏想執事不知其然猥受顧錫教使刊定春秋之成莫能損益呂氏淮南字直千金然而弟子箝口市人拱手者聖賢卓犖固所以殊絶凡庸也今之賦頌古詩之流不更孔公風雅無別耳修家子雲老不曉事強著一書悔其少作若此仲山周旦之儔為皆有愆邪君侯忘聖賢之顯跡述鄙宗之過言竊以為未之思也若乃不忘經國之大美流千載之英聲銘功景鍾書名竹帛斯自雅量素所畜也豈與文章相妨害哉輒受所惠竊備矇瞍誦詠而已敢望惠施以忝莊氏季緒璅璅何足以云反答造次不能宣備修死罪死罪見魏志曹植傳注引典略又見文選司空荀爽述贊生應正性體含中和篤誠宣于初言明允朗于始察是以在童齓而顯奇漸一紀則布名須幼之可師甘羅之少者何以踰公之性量乎砥心六經探索道奧瞻乾坤而知陰陽之極載而集之獨說十萬餘言士林景附群英式慕由毛羽之宗鵬鸞衆山之仰五嶽也昔楚思叔敖而作歌鄭謳子産而興歎瞻望弗及作詞告思詞曰爰在大漢挺荀作貞其德允明誕發幼齡行蠲體潔如玉之瑩確乎其志乃勵乃清遂陟司空天子是毗惟君之德朋僚所容清水平土茂哉是力將混六合繩以正直散以禮樂風以道德見藝文類聚四十七
