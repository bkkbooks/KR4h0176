body:
  text: 張衡溫泉賦並序陽春之月百草萋萋余在遠行顧望有懷遂適驪山觀溫泉浴神井風中巒壯厥類之獨美思在化之所原美洪澤之𤾕施乃為賦云覽中域之珍怪兮無斯水之神靈控湯谷于瀛洲兮濯日月乎中營蔭高山之北延處幽屏以間清于是殊方踄涉駿奔來臻士女曄其鱗萃兮紛雜遝其如煙亂曰天地之德莫若生兮帝育蒸人懿厥成兮六氣淫錯有疾癘兮溫泉汨焉以流穢兮蠲除苛慝服中正兮熙哉帝載保性命兮見水經渭水注下藝文類聚九文選雪賦注又見初學記七引六條思玄賦並序衡常思圖身之事以為吉凶倚伏幽微難明乃作思玄賦以宣寄情志其辭曰仰先哲之玄訓兮雖彌高其弗違匪仁里其焉宅兮匪義迹其焉追潛服膺以永靚兮綿日月而不衰伊中情之信修兮慕古人之貞節竦余身而順止兮遵繩墨而不跌志團團以應懸兮誠心固其如結旌性行以制佩兮佩夜光與瓊枝纗幽蘭之秋華兮又綴之以江蘺美襞積以酷裂兮允塵邈而難虧既姱麗而鮮雙兮非是時之攸珍奮余榮而莫見兮播余香而莫聞幽獨守此仄陋兮敢怠皇而舍勤幸二八之遻虞兮喜傅說之生殷尚前良之遺風兮恫後辰而無及何孤行之煢煢兮孑不群而介立感鸞鷖之特棲兮悲淑人之稀合彼無合其何傷兮患衆僞之冒真旦獲讟于群弟兮啓金滕而乃信覽蒸民之多僻兮畏立辟以危身曾煩毒以迷或兮羌孰可與言己私湛憂而深懷兮思繽紛而不理願竭力以守義兮雖貧窮而不改執雕虎而試象兮阽焦原而跟止庶斯奉以周旋兮要既死而後已俗遷渝而事化兮泯規矩之圜方珍蕭艾于重笥兮謂蕙芷之不香斥西施而弗御兮羈要梟以服箱行陂僻而獲志兮循法度而離殃惟天地之無窮兮何遭遇之無常不抑操而苟容兮譬臨河而無航欲巧笑以干媚兮非余心之所嘗襲溫恭之黻衣兮披禮義之繡裳辮貞亮以為鞶兮雜技藝以為珩昭綵藻與雕琢兮璜聲遠而彌長淹棲遲以恣欲兮耀靈忽其西藏恃己知而華豫兮鶗鳺鳴而不芳冀一年之三秀兮遒白露之為霜時亹亹而代序兮疇可與乎比伉咨妒嫮之難竝兮想依韓以流亡恐漸冉而無成兮留則蔽而不章心猶與而狐疑兮即岐址而攄情文君為我端蓍兮利飛遁以保名歷衆山以周流兮翼迅風以揚聲二女感于崇嶽兮或冰折而不營天蓋高而為澤兮誰云路之不平勔自強而不息兮蹈玉階之嶢崢懼筮氏之長短兮鑽東龜以觀禎遇九皋之介鳥兮怨素意之不逞遊塵外而瞥天兮據冥翳而哀鳴鵰鶚競于貪婪兮我修潔以益榮子有故于玄鳥兮歸母氏而後寧占既吉而無悔兮簡元辰而俶裝旦余沐于清原兮晞余髮于朝陽漱飛泉之瀝液兮咀石菌之流英翾鳥舉而魚躍兮將往走乎八荒過少皞之窮野兮問三丘乎句芒何道真之淳粹兮去穢纍而票輕登蓬萊而容與兮鰲雖抃而不傾留瀛洲而採芝兮聊且已乎長生憑歸雲而遐逝兮夕余宿乎扶桑吸青岑之玉醴兮餐沆瀣以為糧發昔夢于木禾兮穀崑崙之高岡朝吾行于暘谷兮從伯禹于稽山集群神之執玉兮疾防風之食言指長沙以邪徑兮存重華乎南鄰哀二妃之未從兮翩儐處彼湘瀕流目俯夫衡阿兮睹有黎之圮墳痛火正之無懷兮託山陂以孤魂愁蔚蔚以慕遠兮越卬州而愈敖躋日中于昆吾兮憩炎天之所陶揚芒熛而絳天兮水沙沄而涌濤溫風翕其增熱兮惄鬱邑其難聊顝羈旅而無友兮余安能乎留茲顧金天而歎息兮吾欲往乎西嬉前祝融使舉麾兮纚朱鳥以承旗躔建木千廣都兮拓若華而躊躇超軒轅于西海兮跨汪氏之龍魚聞此國之千歲兮曾焉足以娛余思九土之殊風兮從蓐收而遂徂欲神化而蟬蛻兮朋精粹而為徒蹶白門而東馳兮云台行乎中野亂弱水之潺湲兮逗華陰之湍渚號馮夷俾清津兮櫂龍舟以濟豫會帝軒之未歸兮悵相佯而延佇呬河林之蓁蓁兮偉關睢之戒女黃靈詹而訪命兮摎天道其焉如曰近信而遠疑兮六籍闕而不書神逵昧其難覆兮疇克謨而從諸牛哀病而成虎兮雖逢昆其必噬鱉令殪而尸亡兮取蜀禪而引世死生錯而不齊兮雖司命其不晰竇號行于代路兮後膺祚而繁廡王肆侈于漢庭兮卒御恤而絶緒尉尨眉而郎潛兮逮三葉而遘武董弱冠而司袞兮設王隧而弗處夫吉凶之相仍兮恆反側而靡所穆負天以悅牛兮豎亂叔而幽主文斷祛而忌伯兮閹謁賊而寧后通人暗于好惡兮豈愛惑之能剖嬴擲讖而介胡兮備諸外而發內或輦賄而違車兮孕行産而為對慎竈顯于言天兮占水火而妄誶梁叟患夫黎丘兮丁厥子而事刃親所弟而弗識兮矧幽冥之可信毋綿攣以涬己兮思百憂以自疢彼天監之孔明兮用棐忱而佑仁湯蠲體以禱祈兮蒙厖禠以拯人景三慮以營國兮熒惑次于它辰魏顆亮以從理兮鬼亢回以敝秦咎繇邁而種德兮德樹茂乎英六桑末寄夫根生兮卉既雕而已育有無言而不讎兮又何往而不復盍遠迹以飛聲兮孰謂時之可蓄仰矯首以遙望兮魂惝惘而無疇逼區中之隘陋兮將北度而宣遊行積冰之磑磑兮清泉沍而不流寒風淒而永至兮拂穹岫之騷騷玄武縮于殼中兮螣蛇蜿而自糾魚矜鱗而并凌兮鳥登木而失條坐太陰之屏室兮慨含欷而增愁怨高陽之相寓兮㑋顓頊之宅幽庸織絡於四裔兮斯與彼其何瘳望寒門之絶垠兮縱余緤乎不周迅飆潚其媵我兮騖翩飄而不禁趨谽㗿之洞穴兮摽通淵之碄碄經重陰乎寂寞兮愍墳羊之潛深追慌忽于地底兮軼無形而上浮出右密之暗野兮不識蹊之所由速燭龍令執炬兮過鍾山而中休瞰瑤溪之赤岸兮弔祖江之見劉聘王母于銀臺兮羞玉芝以療飢戴勝憖其既歡兮又誚余之行遲載太華之玉女兮召洛浦之宓妃咸姣麗以蠱媚兮增嫮眼而蛾眉舒妙婧之纖腰兮揚雜錯之袿徽離朱脣而微笑兮顏的礰以遺光獻環琨與璵縭兮申厥好以玄黃雖色豔而賂美兮志浩蕩而不嘉雙材悲于不納兮竝詠詩而清歌歌曰天地煙熅百卉含花鳴鶴交頸睢鳩相和處子懷春精魂回移如何淑明忘我實多將答賦而不暇兮爰整駕而亟行瞻崑崙之巍巍兮臨縈河之洋洋伏靈龜以負坻兮互螭龍之飛梁登閬風之曾城兮搆不死而為床屑瑤繠以為糇兮㪺白水以為漿抨巫咸以占夢兮乃貞吉之元符滋令德于正中兮含嘉秀以為敷既垂穎而顧本兮爾要思乎故居安和靜而隨時兮姑純懿之所廬戒庶寮以夙會兮僉恭職而竝迓豐隆軯其震霆兮列缺曄其照夜雲師𩅾以交集兮凍雨沛其灑塗轙雕輿而樹葩兮擾應龍以服輅百神森其備從兮屯騎羅而星布振余袂而就車兮修劍揭以低昂冠咢咢其映蓋兮佩綝纚以輝煌僕夫儼其正策兮八乘攄而超驤氛旄溶以天旋兮霓旌飄而飛揚撫軨軹而還睨兮心灼藥其如湯羡上都之赫戲兮何迷故而不忘左青雕以揵芝兮右素威以司鉦前長離使拂羽兮委水衡乎玄冥屬箕伯以函風兮澄淟涊而為清曳雲旗之離離兮鳴玉鸞之譻譻涉清霄而升遐兮浮蔑蒙而上征紛翼翼以徐戾兮焱回回其揚靈叫帝閽使闢扉兮覿天皇于瓊宮聆廣樂之九奏兮展泄泄以肜肜考理亂于律鈞兮意建始而思終惟盤逸之無斁兮懼樂往而哀來素撫弦而餘音兮大容吟曰念哉既防溢而靜志兮逮我暇以翱翔出紫宮之肅肅兮集太微之閬閬命王良掌策駟兮踰高閣之鏘鏘建罔車之幕幕兮獵青林之芒芒彎威弧之撥刺兮射嶓冢之封狼觀壁壘于北落兮伐河鼓之磅硠乘天潢之泛泛兮浮雲漢之湯湯倚招搖攝提以低回戮流兮察二紀五緯之綢繆遹皇偃蹇夭矯以連卷兮雜沓叢悴颯以方驤𢒰汨飂戾沛以罔象兮爛漫麗靡藐以迭湯凌驚雷之砊礚兮弄狂電之淫裔踰厖澒于宕冥兮貫倒景而高厲廓蕩蕩其無涯兮乃今窮乎天外據開陽而俯盼兮臨舊鄉之暗藹悲離居之勞心兮情悁悁而思歸魂眷眷而屢顧兮馬倚輈而俳回雖遨遊以偷樂兮豈愁慕之可懷出閶闔兮降天塗乘飆忽兮馳虛無雲霏霏兮繞余輪風眇眇兮震余旟繽聯翩兮紛暗曖倏眩眃兮反常閭收疇昔之逸豫兮卷淫放之遐心修初服之娑娑兮長余佩之參參文章煥以粲爛兮美紛紜以從風御六藝之珍駕兮遊道德之平林結典籍而為罟兮歐儒墨而為禽玩陰陽之變化兮詠雅頌之徽音嘉曾氏之歸耕兮慕歷陵之欽崟共夙昔而不二兮固終始之所服也夕惕若厲以省愆兮懼余身之未敕也苟中情之端直兮莫吾知而不恧墨無為以凝志兮與仁義乎消搖不出戶而知天下兮何必歷遠以劬勞系曰天長地久歲不留俟河之清祗懷憂願得遠度以自娛上下無常窮六區超踰騰躍絶世俗飄颻神舉逞所欲天不可階仙夫希柏舟悄悄吝不飛松喬高跱孰能離結精遠遊使心攜回志朅來從玄諆獲我所求夫何思見後漢張衡傳又見文選西京賦有憑虛公子者心奓體忲雅好博古學乎舊史氏是以多識前代之載言于安處先生曰夫人在陽時則舒在陰時則慘此牽乎天者也處沃土則逸處瘠土則勞此擊乎地者也慘則鮮于歡勞則褊于惠能違之者寡矣小必有之大亦宜然故帝者因天地以致化兆人承上教以成俗化俗之本有與推移何以核諸秦據雍而強周即豫而弱高祖都西而泰光武處東而約政之興衰恆由此作先生獨不見西京之事歟請為吾子陳之漢氏初都在渭之涘秦里其朔實為咸陽左有崤函重險桃林之塞綴以二華巨靈贔䃒高掌遠跖以流河曲厥跡猶存右有隴坻之隘隔閡華戎岐梁汧雍陳寶鳴雞在焉于前則終南太一隆崛崔崒隱轔鬱律連岡乎嶓冢抱杜含鄠欱灃吐鎬爰有藍田珍玉是之自出于後則高陵平原據渭踞涇澶漫靡迤作鎮于近其遠則九嵕甘泉涸陰沍寒日北至而含凍此焉清暑爾乃廣衍沃野厥田上上實惟地之奧區神皋昔者大帝說秦繆公而覲之饗以鈞天廣樂帝有醉焉乃為金策錫用此土而翦諸鶉首是時也竝為強國者有六然而四海同宅西秦豈不詭哉自我高祖之始入也五緯相汁以旅于東井婁敬委輅幹非其議天啓其心人惎之謀及帝圖時意亦有慮乎神祗宜其可定以為天邑豈伊不虔思于天衢豈伊不懷歸于枌榆天命不滔疇敢以渝于是量徑輪考廣袤經城洫營郭郛取殊裁于八都豈啓度于往舊乃覽秦制跨周法狹百堵之側陋增九筵之迫脅正紫宮于未央表嶢闕于閶闔疏龍首以抗殿狀巍峨以岌嶪互雄虹之長梁結棼橑以相接蒂倒茄于藻井披紅葩之狎獵飾華榱與璧璫流景曜之韡曄雕楹玉磶繡栭雲楣三階重軒鏤檻文㮰右平左墄青瑣丹墀刊層平堂設切崖隒坻崿鱗眴棧齴巉嶮襄岸夷塗修路陖險重門襲固姦宄是防仰福帝居陽曜陰藏洪鐘萬鈞猛虡趪趪負筍業而餘怒乃奮翅而騰驤朝堂承東溫調延北西有玉臺聯以昆德嵯峨崨嶪罔識所則若夫長年神仙宣室玉堂麒麟朱鳥龍興含章譬衆星之環極叛赫戲以輝煌正殿路寢用朝群辟大夏耽耽九戶開闢嘉木樹庭芳草如積高門有閌列坐金狄內有常侍謁者奉命當御闌臺金馬遞宿迭居次有天祿石渠校文之處重以虎威章溝嚴更之署徼道外周千廬內附衛尉八屯警夜巡晝植鎩懸瞂用戒不虞後宮則昭陽飛翔增成合歡蘭林披香鳳皇鴛鸞群窈窕之華麗嗟內顧之所觀故其館室次舍采飾纖縟裛以藻繡文以朱緑翡翠火齊絡以美玉流懸黎之夜光綴隨珠以為燭金戺玉階彤庭輝輝珊瑚琳碧瓀珉璘彬珍物羅生煥若崑崙雖厥裁之不廣侈靡踰乎至尊于是鉤陳之外閣道穹隆屬長樂與明光徑北通乎桂宮命般爾之巧匠盡變態乎其中後宮不移樂不徙懸門衛供帳官以物辨恣意所幸下輦成燕窮年忘歸猶弗能遍瑰異日新殫所未見惟帝王之神麗懼尊卑之不殊雖斯宇之既坦心猶憑而未攄思比象于紫微恨阿房之不可廬覛往昔之遺館獲林光于秦餘處甘泉之爽塏乃隆崇而弘敷既新作于迎風增露寒與儲胥託喬基于山岡直墆霓以高居通天訬以竦峙徑百常而莖擢上辨華以交紛下刻峭其若削翔鶤仰而不逮況青鳥與黃雀伏櫺檻而俯聽聞雷霆之相激柏梁既災越巫陳方建章是經用厭火禕營宇之制事兼未央圜闕竦以造天若雙碣之相望鳳騫翥于標咸遡風而欲翔閶闔之內別風嶕嶢何工巧之瑰瑋交綺豁以疏寮干雲霧而上達狀亭亭以苕苕神明崛其特起井幹疊而百增跱遊極于浮柱結重欒以相承纍層構而遂隮望北辰而高興消氛埃于中宸集重陽之清澄瞰宛之長鬐察雲師之所憑上飛闥而仰眺正睹瑤光與玉繩將乍往而未半怵悼栗而慫兢非都盧之輕趫孰能超而究升馺娑駘蕩燾奡桔桀枍詣承光睽罛庨𧯆橧桴重棼鍔鍔列列反宇業業飛檐䡾䡾流景內照引曜日月天梁之宮實開高闈旗不脫扃結駟方蘄轢輻輕騖容于一扉長廊廣廡途閣雲蔓閈庭詭異門千戶萬重閨幽闥轉相踰延望䆗窱以徑廷眇不知其所返既乃珍臺蹇産以極壯墱道邐倚以正東似閬風之遐坂橫西洫而絶金墉城尉不𧿶柝而內外潛通前開唐中彌望廣潒顧臨太液滄池漭沆漸臺立于中央赫昈昈以弘敞清淵洋洋神山峨峨列瀛洲與方丈夾蓬萊而駢羅上林岑以壘㠑下嶄巖以巖齬長風激于別島起洪濤而揚波浸石菌于重涯濯靈芝以朱柯海若游于玄渚鯨魚失流而蹉𧿶于是采少君之端信庶欒大之貞固立修莖之仙掌承雲表之清露屑瓊蘂以朝飱必性命之可度美往昔之松喬要羡門乎天路想升龍于鼎湖豈時俗之足慕若歷世而長存何遽營乎陵墓徒觀其城郭之制則旁開三門參塗夷庭方軌十二街衢相經廛里端直甍宇齊平北闕甲第當道直啓程巧致功期不陀陊木衣綈錦土被朱紫武庫禁兵設在蘭錡匪石匪董疇能宅此爾乃廓開九市通闤帶闠旗亭五重俯察百隧周制大胥今也惟尉瓌貨方至鳥集鱗萃鬻者兼贏求者不匱爾乃商賈百族裨販夫婦鬻良雜苦蚩眩邊鄙何必昏于作勞邪贏優而足恃彼肆人之男女麗美奢乎許史若夫翁伯濁質張里之家擊鐘鼎食連騎相過東京公侯壯何能加都邑游俠張趙之倫齊志無忌擬跡田文輕死重氣結黨連群實蕃有徒其從如雲茂陵之原陽陵之朱趫悍虓豁如虎如貙睚眥蠆芥尸僵路隅丞相欲以贖子罪陽石汙而公孫誅若其五縣遊麗辨論之士街談巷議彈射臧否剖析毫釐擘肌分理所好生毛羽所惡成創痏郊甸之內鄉邑殷賑五都貨殖既遷既引商旅聯槅隱隱展展冠帶交錯方轅接軫封畿千里統以京尹郡國宮館百四十五右極盩厔并卷酆鄠左暨河華遂至虢土上林禁苑跨谷彌阜東至鼎湖邪界細柳掩長楊而聯五柞繞黃山而款牛首繚垣綿聯四百餘里植物斯生動物斯止衆鳥翩翻群獸𩣚騃散似驚波聚以京峙伯益不能名隸首不能紀林麓之饒于何不有木則樅栝棕楠梓棫梗楓嘉卉灌叢蔚若鄧林鬱蓊薆薱橚爽櫹參吐葩揚榮布葉垂陰草則葴莎菅蒯薇蕨荔苀王芻莔臺戎葵懷羊苯蓬茸彌皋被岡篠簜敷衍編町成篁山谷原隰泱漭無疆乃有昆明靈沼黑水玄址周以金堤樹以柳杞豫章珍館揭焉中峙牽牛立其左織女處其右日月于是乎出入象扶桑與濛泛其中則有黿鼉巨鱉鱣鯉鱮鮦鮪鯢鱨鯊修額短項大口折鼻詭類殊種鳥則鷫鷞鴰鴇鴐鵝鴻鶤上春侯來季秋就溫南翔衡陽北棲雁門奮隼歸鳧沸卉軿訇衆形殊聲不可勝論于是孟冬作陰寒風肅殺雨雪飄飄冰霜慘烈百卉具零剛蟲搏摯爾乃振天維衍地絡蕩川瀆簸林薄鳥畢駭獸咸作草伏木棲寓居穴託起彼集此霍繹紛泊在彼靈囿之中前後無有垠鍔虞人掌焉為之營域焚萊平場柞木翦棘結百里迒杜蹊塞麀鹿麌麌駢田逼仄天子乃駕雕軫六駿駮戴翠帽倚金較璿辨玉纓遺光鯈爚建玄弋樹昭搖棲鳴鳶曳雲梢弧旌柱矢虹旃霓旄華蓋承辰天畢前驅千乘雷動萬騎龍趨屬車之簉載獫揭獢匪唯玩好乃有祕書小說九百本自虞初從容之求實俟實儲于是蚩尤秉鉞奮鬣被般禁禦不若以知神姦螭魅魍魎莫能逢旃陳虎旅于飛廉正壘壁乎上蘭結部曲整行伍燎京薪駴雷鼓縱獵徒赴長莽迾卒清侯武士赫怒緹衣𩎟韐睢盱拔扈光炎燭天庭囂聲震海浦河渭為之波蕩吳嶽為之陀堵百禽㥄遽騤瞿奔觸喪精亡魂失歸忘趨投輪關輻不邀自遇飛罕潚簫流鏑𢶉㩧矢不虛舍鋋不苟躍當足見蹍值輪被轢僵禽弊獸爛右磧礫但觀罝羅之所羂結竽殳之所揘畢叉蔟之所攙捔徒搏之撞㧙白日未及移其晷已獮其什七八若夫游鷮高翬絶坑踰斥毚兔聯猭陵巒超壑比諸東郭莫之能獲乃有迅羽輕足尋景追括鳥不暇舉獸不得發青骹摯于韝下韓盧噬于𦁛末及其猛毅髬髵隅目高匡威懾兕虎莫之敢伉乃使中黃之士育獲之儔朱鬕𩰁髽植髮如竿袒裼戟手奎盤桓鼻赤象圈巨狿摣狒猬批窳狻揩枳落突棘藩梗林為之靡拉朴叢為之摧殘輕鋭僄狡趫捷之徒赴洞穴探封狐陵重巘獵昆駼杪木末擭獑猢超殊榛摕飛鼯是時後宮嬖人昭儀之倫常亞于乘輿慕賈氏之如皋樂北風之同車盤于游畋其樂只且于是鳥獸殫目觀窮遷延邪睨集乎長楊之宮息行夫展車馬收禽舉胔數課衆寡置互擺牲頒賜獲鹵割鮮野饗犒勤賞功五軍六師千列百重酒車酌醲方駕授饔升觴舉燧既釂鳴鐘膳夫馳騎察二廉空炙炮夥清酤㩼皇恩溥洪德施徒御悅士忘罷巾車命駕回旆右移相羊乎五柞之館旋憩乎昆明之池登豫章𥳑矰紅蒲且發弋高鴻挂白鵠聯飛龍磻不特絓往必加雙于是命舟牧為水嬉浮鷁首翳雲芝垂翟葆建羽旗齊栧女縱櫂歌發引和校鳴葭奏淮南度陽阿感河馮懷湘娥驚蝄蜽蟬蛟蛇然後鈞魴鱧纚鰋鮋托紫貝搏耆龜扼水豹馽潛牛澤虞是濫何有春秋擲漻澥搜川瀆布九罭設摷昆鮞殄水族蘧藕拔蜃蛤剝逞欲畋漁效獲麑䴠摎蓼浶浪乾池滌藪上無逸飛下無遺走獲胎拾卵蚳蝝盡取取樂今日遑恤我後既定且寧焉知傾陀大駕幸乎平樂張甲乙而襲翠被攢珍寶之玩好紛瑰麗以奓靡臨回望之廣場程角抵之妙戲烏獲扛鼎都盧尋橦衝狹燕濯胸突銛鋒跳丸劍之揮霍走索上而相逢華嶽峨峨岡巒參差神木靈草朱實離離總會仙倡戲豹舞羆白虎鼓瑟蒼龍吹篪女蛾坐而長歌聲清畼而蜲蛇洪涯立而指麾被毛羽之襳襹度曲未終雲起雪飛初若飄飄後遂霏霏復陸重閣轉石成雷礔礰激而增響磅礚象乎天威巨獸百尋是為曼延神山崔巍欻從背見熊虎升而拿攫猿狖超而高援怪獸陸梁大雀踆踆白象行孕垂鼻轔囷海鱗變而成龍狀蜿蜿以蝹蝹含利颬颬化為仙車驪駕四鹿芝蓋九葩蟾蜍與龜水人弄蛇奇幻鯈忽易貌分形吞刀吐火雲霧杳冥畫地成川流渭通涇東海黃公赤刀粵祝冀厭白虎卒不能救挾邪作蠱于是不售爾乃建戲車樹修旃侲僮程材上下翩翻突倒投而跟絓譬隕絶而復聯百馬同轡騁足竝馳橦末之伎態不可彌彎弓射乎西羌又顧發乎鮮卑于是衆變盡心酲醉盤樂極悵懷萃陰戒期門微行要屈降尊就卑懷璽藏紱便旅閭閰周觀郊遂若神龍之變化章后皇之為貴然後歷掖庭適歡館捐衰色從嬿婉促中堂之狹坐羽觴行而無算祕舞更奏妙材騁伎妖蠱豔夫夏姬美聲畼于虞氏始徐進而羸形似不任乎羅綺嚼清商而卻轉增嬋娟以此豸紛縱體而迅赴若驚鶴之群罷振朱屣于盤樽奮長袖之颯纚要紹修態麗服揚菁昭藐流眄一顧傾城展季桑門誰能不營列爵十四競媚取榮盛衰無常唯愛所丁衛后興于鬒髮飛燕寵于體輕爾乃逞志究欲窮身極娛鑒戒唐詩他人是偷自君作故何禮之拘增昭儀于婕妤賢既公而又侯許趙氏以無上思致董于有虞王閎爭于坐側漢載安而不渝高祖創業繼體承基暫勞永逸無為而治耽樂是從何慮何思多歷年所二百餘朞徒以地沃野豐百物殷阜巖險周固襟帶易守得之者強據之者久流長則難竭柢深則難朽故奢泰肆情馨烈彌茂鄙生生乎三百之外傳聞于未聞之者曾髣佛其若夢未一隅之能睹此何與于殷人屢遷前八而後五居相圮耿不常厥土盤庚作誥帥人以苦方今聖上同天號于帝皇掩四海而為家富有之業莫我大也徒恨不能以靡麗為國華獨儉嗇以齷齪忘蟋蟀之謂何豈欲之而不能將能之而不欲歟蒙竊惑焉願聞所以辨之之說也見文選
