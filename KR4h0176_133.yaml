body:
  text: 張衡東京賦安處先生于是似不能言憮然有閒乃莞爾而笑曰若客所謂末學膚受貴耳而賤目者也苟有胸而無心不能節之以禮宜其陋今而榮古矣由余以西戎孤臣而悝繆公于宮室如之何其以溫故而知新研覈是非近于此惑周姬之末不能厥政政用多僻始于宮鄰卒于金虎嬴氏搏翼擇肉西邑是時也七雄竝爭競相高以奢麗楚築章華于前趙建叢臺于後秦政利觜長距終得擅場思專其侈以莫已若迺搆阿房起甘泉結雲閣冠南山征稅盡人力殫然後收以太半之賦威以參夷之刑其遇民也若薙氏之芟草既蘊崇之又行火焉惵惵黔首豈徒跼高天蹐厚地而已哉乃救死于其頸敺以就役唯力是視百姓弗能忍是用息肩干大漢而欣戴高祖高祖膺籙受圖順天行誅杖朱旗而建大號所推必亡所存必固埽項軍于垓下紲子嬰于軹塗因秦宮室據其府庫作洛之制我則未暇是以西匠營宮目翫阿房規摹踰溢不度不臧損之又損之然尚過于周堂觀者狹而謂之陋帝已譏其泰而弗康且高既受命建家造我區夏矣文又躬自菲薄治致升平之德武有大啟土宇紀禪肅然之功宣重威以撫和戎狄呼韓來享咸用紀宗存主饗祀不輟銘勳彝器歷世彌光今捨純懿而論爽德以春秋所諱而為美談宜無嫌于往初故蔽善而揚惡祗吾子之不知言也必以肆奢為賢則是黃帝合宮有虞總期固不如夏癸之瑤臺殷辛之瓊室也湯武誰革而用師哉盍亦覽東京之事以自寤乎且天子有道守在海外守位以仁不恃隘害苟民志之不諒何云巖險與襟帶秦負阻于二關卒開項而受沛彼偏據而規小豈如宅中而圖大昔先王之經邑也掩觀九隩靡地不營土圭測景不縮不盈總風雨之所交然後以建王城審曲面勢泝洛背河左伊右瀍西阻九阿東門于旋盟津達其後太谷通其前迴行道乎伊闕邪徑捷乎轘轅太室作鎮揭以熊耳底柱輟流鐔以大岯溫液湯泉黑丹石輜王鮪岫居能鼈三趾宓妃攸館神用挺紀龍圖授羲龜書畀姒召伯相宅卜惟洛食周公初基其繩則直萇弘魏舒是廓是極經途九軌城隅九雉度堂以筵度室以几京邑翼翼四方所視漢初弗之宅故宗緒中圮巨猾閒舋竊弄神器歷載三六偷安天位于時蒸民罔敢或貳其取威也重矣我世祖忿之乃龍飛白水鳳翔參墟授鉞四七共工是除欃槍旬始群凶靡餘區宇乂寍思和求中睿哲玄覽都茲洛宮曰止曰時昭明有融既光厥武仁洽道豐登岱勒封與黃比崇逮至顯宗六合殷昌乃新崇德遂作德陽啟南端之特闈立應門之將將昭仁惠于崇賢抗義聲于金商飛雲龍于春路屯神虎于秋方建象魏之兩觀旌六典之舊章其內則含德章臺天祿宣明溫飭迎春壽安永寍飛閣神行莫我能形濯龍芳林九谷八溪芙蓉覆水秋蘭被涯渚戲躍魚淵游龜𧓈永安離宮修竹冬青陰池幽流玄泉洌清鵯鶋秋棲鶻鵃春鳴瞗鳩麗黃關關嚶嚶于南則前殿靈臺龢驩安福謻門曲榭邪阻城洫奇樹珍果鉤盾所職西登少華亭侯修敕九龍之內實曰嘉德西南其戶匪雕匪刻我后好約乃宴斯息于東則洪池清蘌淥水澹澹內阜川禽外豐葭菼獻鱉蜃與龜魚供蝸蠯與菱芡其西則有平樂都場示遠之觀龍雀蟠蜿天馬半漢瑰異譎詭燦爛炳煥奢未及侈儉而不陋規遵王度動中得趣于是觀禮禮舉儀具經始勿亟成之不日猶謂為之者勞居之者逸慕唐虞之茅茨思夏后之卑室乃營三宮布教頒常複廟重屋八達九房規天矩地授時順鄉造舟清池惟水泱泱左制辟雍右立靈臺因進距衰表賢簡能馮相觀祲祈禠禳災于是孟春元日群后旁戾百僚師師于斯胥洎藩國奉聘要荒來質具惟帝臣獻琛執贄當覲乎殿下者蓋數萬以二爾乃九賓重臚人列崇牙張鏞鼓設郎將司階虎戟交鎩龍輅充庭雲旗拂霓夏正三朝庭燎晢折撞洪鐘伐靈鼓旁震八鄙軯礚隱訇若疾霆轉雷而激迅風也是時稱警蹕已下雕輦于東廂冠通天佩玉璽紆皇組要干將負斧扆次席紛純左右玉几而南面以聽矣然後百辟乃入司儀辨等尊卑以班璧羔皮帛之贄既奠天子乃以三揖之禮禮之穆穆焉皇皇焉濟濟焉將將焉信天下之壯觀也乃羨公侯卿士登自東除訪萬機詢朝政勤恤民隱而除其眚人或不得其所若已納之于隍荷天下之重任匪怠皇以寍靜發京倉散禁財賚皇寮逮輿臺命膳夫以大饗饔餼浹乎家陪春醴惟醇燔炙芬芬君臣歡康具醉熏熏千品萬官已事而踆勤屢省懋乾乾清風協于玄德淳化通于自然憲先靈而齊軌必三思以顧愆招有道于側陋開敢諫之直言聘丘園之耿絜旅束帛之戔戔上下通情式宴且盤及將祀天郊報地功祈福乎上玄思所以為虔肅肅之儀盡穆穆之禮殫然後以獻精誠奉禋祀曰允矣天子者也乃整法服正冕帶珩紞紘綖玉笄綦會火龍黼黻藻繂鞶厲結飛雲之袷輅樹翠羽之高蓋建辰旒之太常紛焱悠以容裔六玄虬之奕奕齊騰驤而沛艾龍輈華轙金錟鏤鍚方釳左纛鉤膺玉瓖鑾聲噦噦和鈴鉠鉠重輪貳轄疏轂飛軨羽蓋威蕤葩瑵曲莖順時服而設副咸龍旂而繁纓立戈迤戛農輿輅本屬車九九乘軒竝轂𨌥弩重旃朱旄青屋奉引既畢先輅乃發鸞旗皮軒通帛綪斾雲罕九斿闟戟轇轕髶髦被繡虎夫戴鶡駙承華之蒲梢飛流蘇之騷殺總輕武于後陳奏嚴鼓之嘈囐戎土介而揚揮戴金鉦而建黃鉞清道案列天行星陳肅肅習習隱隱轔轔殿未出乎城闕斾已反乎郊畛盛夏后之致美爰敬恭于明神爾乃孤竹之管雲和之瑟雷鼓鼘鼘六變既畢冠華秉翟列舞八佾元祀惟稱群望咸秩颺槱燎之炎煬致高煙乎太一神歆馨而顧德祚靈主以元吉然後宗上帝于明堂推光武以作配辯方位而正則五精帥而來摧尊赤氏之朱光四靈懋而允懷于是春秋改節四時迭代蒸蒸之心感物曾思躬追養于廟祧奉蒸嘗與禴祠物牲辯省設其楅衡毛炰豚胉亦有和羹滌濯靜嘉禮儀孔明萬舞奕奕鍾鼓喤喤靈祖皇考來顧來饗神具醉止降福穰穰及至農祥晨正土膏脈起乘鑾輅而駕蒼龍介馭閒以剡耜躬三推于天田脩帝籍之千畝供禘郊之粢盛必致思乎勤已兆民勸于疆場感懋力以耘耔春日載陽合射辟雍設業設虡宮懸金鏞鼖鼓路鼗樹羽幢幢于是備物物有其容伯夷起而梠儀后夔坐而為工張大侯制五正設三乏厞司旌并夾既設儲乎廣庭于是皇輿夙駕𨌅于東階以須消啟明埽朝霞登天光于扶桑天子乃撫玉輅時乘六龍發鯨魚鏗華鍾大丙弭節風后陪乘攝提運衡徐至于射宮禮事展樂物具王夏闋騶虞奏決拾既次彫弓斯彀達餘萌于暮春昭誠心以遠喻進明德而崇業滌饕餮之貪欲仁風衍而外流誼方激而遐騖日月會于龍狵恤民事之勞疚因休力以息勤致歡忻于春酒執鑾刀以袒割奉觴豆于國叟降至尊以訓恭送迎拜乎三壽敬慎威儀示民不偷我有嘉賓其樂愉愉聲教布濩盈溢天區文德既昭武節是宣三農之隙曜威中原歲惟仲冬大閱西園虞人掌焉先期戒事悉率百禽鳩諸靈囿獸之所同是謂告備乃御小戎撫輕軒中畋四牡既佶且閑戈矛若林牙旗繽紛迄上林結徒營次和樹表司鐸受鉦坐作進退節以軍聲三令五申示戮斬牲陳師鞠旅教達禁成火列具舉武士星敷鵝鸛魚麗箕張翼舒軌塵掩迒匪疾匪徐馭不詭遇射不翦毛升獻六禽時膳四膏馬足未極輿徒不勞成禮三毆解罘放麟不窮樂以訓儉不殫物以昭仁慕天乙之弛罟因教祝以懷民儀姬伯之渭陽失熊羆而獲人澤浸昆蟲威振八寓好樂無荒允文允武薄狩于敖既璅璅焉岐陽之蒐又何足數爾乃卒歲大儺毆除群厲方相秉鉞巫覡操茢振子萬童丹首玄製桃弧棘矢所發無臬飛礫雨散剛癉必獘煌火馳而星流逐赤疫于四裔然後淩天池絕飛梁捎魑魅獝狂斬蜲蛇腦方良囚耕父于清泠溺女魃于神潢殘夔魖與罔像殪野仲而殲游光八靈為之震慴況鬾蜮與畢方度朔作梗守以鬱壘神荼副焉對操索葦目察區陬司執遺鬼京室密清罔有不韙于是陰陽交和庶物時育卜征考祥終然允淑乘輿巡乎岱嶽勸稼穡于原陸同衡律而壹軌量齊急舒于寒燠省幽明以黜陟乃反斾而迴復望先帝之舊墟慨長思而懷古俟閶風而西遐致恭祀乎高祖既春游以發生啟諸蟄于潛戶度秋豫以收成觀豐年之多稌嘉田畯之匪懈行致賚于九扈左瞰暘谷右睨玄圃眇天末以遠期規萬世而大摹且歸來以釋勞膺多福以安悆總集瑞命備致嘉祥圉林氏之騶虞擾澤馬與騰黃鳴女床之鸞鳥舞丹穴之鳳皇植華平于春圃豐朱草于中唐惠風廣被澤洎幽荒北燮丁令南諧越裳西包大秦東過樂浪重舌之人九譯僉稽首而來王是以論其遷邑易京則同規乎殷盤改奢即儉則合美乎斯干登封降禪則齊德乎黃軒為無為事無事永有民以孔安遵節儉尚素樸思仲尼之克已履老氏之常足將使心不亂其所在目不見其可欲賤犀象簡珠玉藏金于山抵壁于谷翡翠不裂瑇瑁不蔟所貴惟賢所寶惟穀民去末而反本感懷忠而抱愨于斯之時海內同悅曰吁漢帝之德侯其褘而蓋蓂莢為難蒔也故曠世而不覿惟我后能殖之以至和平方將數諸朝階然則道胡不懷化胡不柔聲與風翔澤從雲游萬物我賴亦又何求德㝢天覆輝烈光燭狹三王之趢趗軼五帝之長驅踵二皇之遐武誰謂駕遲而不能屬束京之懿未罄值余有犬馬之疾不能究其精詳故粗為賓言其梗概如此若乃流遁忘反放心不覺樂而無節後離其戚一言幾干喪國我未之學也且夫挈缾之智守不假器況纂帝業而輕天位瞻仰二祖厥庸孔肆常翹翹以危懼若乘奔而無轡白龍魚服見困豫且雖萬乘之無懼猶怵惕于一夫終日不離其輜重獨微行其焉如夫君人者黈纊塞耳車中不內顧珮以制容鑾以節塗行不變玉駕不亂步卻走馬以糞車何惜騕䮍與飛兔方其用財取物常畏生類之殄也賦政任役常畏人力之盡也取之以道用之以時山無槎枿畋不䴠胎草木蕃廡鳥獸阜滋民忘其勞樂輸其財百姓同于饒衍上下共其雍熙洪恩素蓄民心固結執誼顧主夫懷貞節忿姦慝之干命怨皇統之見替玄謀設而陰行合二九而成譎登聖皇于天階章漢祚之有秩若此故王業可樂焉今公子苟好勦民以媮樂忘民怨之為仇也好殫物以窮寵忽下叛而生憂也夫水所以載舟亦所以覆舟堅冰作于履霜尋木起于櫱栽昧旦丕顯後世猶怠況初制于甚泰服者焉能改裁故相如壯上林之觀揚雄聘羽獵之辭雖糸以隤牆填壍亂以收罝解罘卒無補于風規祗以昭其愆尢臣濟奓以陵君忘經國之長基故函谷擊析于東西朝顛覆而莫持凡人心是所學體安所習鮑肆不知其臭翫其所以先入咸池不齊度于䵷咬而眾聽或疑能不惑者其唯子野乎客既醉于大道飽于文義勸德畏戒喜懼交爭罔然若酲朝罷夕倦奪氣褫魄之為者忘其所以為談失其所以為夸良久乃言曰鄙哉予乎習非而遂迷也幸見指南于吾子若僕所聞華而不實先生之言信而有徵鄙夫寡識而今而後乃知大漢之德馨咸在于此昔常恨三墳五典既泯仰不睹炎帝帝魁之美得聞先生之餘論則大庭氏何以尚茲走雖不敏庶斯達矣見文選南都賦於顯樂都既麗且康陪京之南居漢之陽割周楚之豐壤跨荊豫而為疆體爽塏以閑敞紛郁郁其難詳爾其地勢則武闕關其西桐柏揭其東流滄浪而為隍廓方城而為墉湯谷涌其後淯水盪其胸推淮引湍三方是通其寶利珍怪則金彩玉璞隨珠夜光銅錫鈆鍇赭堊流黃綠碧紫英青雘丹粟太一餘糧中黃瑴玉松子神陂赤靈解角耕父揚光于清泠之淵游女弄珠于漢皋之曲其山則崆嶱嵑嵣㟐嶚刺岝㟯㠑嵬嶔巇屹𡿖幽谷嶜岑夏含霜雪或峮嶙而纚連或豁爾而中絕鞠巍巍其隱天俯而觀乎雲霓若夫天封大狐列仙之陬上平衍而曠蕩下蒙籠而崎嶇坂坻𡽱𡾲而成甗谿壑錯繆而盤紆芝房菌蠢生其隈玉膏滵溢流其隅崑崙無以奓閬風不能踰其木則檉松楔㮨槾柏杻橿楓柙櫨櫪帝女之桑楈枒栟櫚柍柘檍檀結根竦本垂條嬋媛布綠葉之萋萋敷華蘂之蓑蓑玄雲合而重陰谷風起而增哀攢立叢駢青冥盰瞑杳藹蓊鬱于谷底森䔿䔿而刺天虎豹黃熊游其下豰玃猱㹶戲其巔鸞鸑鵷鶵翔其上騰猨飛蠝棲其閒其竹則籦籠䈽篾篠簳箛箠緣延坻阪澶漫陸離阿𨙻蓊茸風靡雲披爾其川瀆則滍澧𤄶濜發源巖穴潛㕎洞出沒滑瀎潏布濩漫汗漭沆洋溢摠括趨欱箭馳風疾流湍投濈砏汃輣軋長輸遠逝漻淚淢汨其水蟲則有蠳龜鳴蛇潛龍伏螭鱏鱣鰅鱅黿鼉鮫𩽨巨蜯函珠駮瑕委蛇于其陂澤則有鉗盧玉池赭陽東陂貯水渟洿互望無涯其草則藨苧薠莞蔣蒲蒹葭藻茆菱芡芙蓉含華從風發榮裴披芬葩其鳥則有鴛鴦鵠鷖鴻鴇鴐鵝𪃈鶂鷿鶙鷫鷞鵾鸕嚶嚶和鳴澹淡隨波其水則開竇灑流浸彼稻田溝澮脈連隄塍相輑朝雲不興而潢潦獨臻決渫則暵為溉為陸冬稌夏穱隨時代熟其原野則有桑漆麻苧菽麥稷黍百穀蕃廡翼翼與與若其園圃則有蓼蕺蘘荷藷蔗薑䪤菥蓂芋瓜乃有櫻梅山柿侯桃梨栗梬棗若留穰橙鄧橘其香草則有薜荔蕙若薇蕪蓀萇晻曖蓊蔚含芬吐芳若其廚膳則有華薌重秬滍皋香秔歸雁鳴鵽黃稻鱻魚以為芍藥酸甜滋味百種千名春卵夏筍秋韭冬菁蘇蔱紫薑拂徹羶腥酒則九醞甘醴十旬兼清醪敷徑寸浮蟻若蓱其甘不爽醉而不酲及其糺宗綏族禴祠蒸嘗以速遠朋嘉賓是將揖讓而升宴于蘭堂珍羞琅玕充溢圓方琢琱狎獵金銀琳琅侍者蠱媚巾㡚鮮明被服雜錯履躡華英儇才齊敏受爵傳𨢩獻酬既交率禮無違彈琴擫籥流風徘徊清角發徵聽者增哀客賦醉言歸主稱露未晞接歡宴于日夜終愷樂之令儀于是暮春之禊元已之辰方軌齊軫祓于陽瀕朱帷連網曜野映雲男女姣服駱驛繽紛致飾程蠱偠紹便娟微眺流睇蛾眉連卷于是齊僮唱兮列趙女坐南歌兮起鄭儛白鶴飛兮繭曳緒修袖繚繞而滿庭羅韤躡蹀而容與翩緜緜其若絕眩將墜而復舉翹遙遷延蹩𨇨蹁躚結九秋之增傷怨西荊之折盤彈箏吹笙更為新聲寡婦悲吟鵾雞哀鳴坐者悽欷蕩魂傷精于是群士放逐馳乎沙場騄驥齊鑣黃閒機張足逸驚飆鏃析毫芒俯貫魴鱮仰落雙鶬魚不及竄鳥不暇翔爾乃撫輕舟兮浮清池亂北渚兮揭南涯汰瀺灂兮船容裔陽侯澆兮掩鳧鷖追水豹兮鞭蝄蜽憚夔龍兮怖蛟螭于是日將逮昏樂者未荒收驩命駕分背迴塘車雷震而風厲馬鹿超而龍驤夕暮言歸其樂難忘此乃游觀之好耳目之娛未睹其美者焉足稱舉夫南陽者真所謂漢之舊都者也遠世則劉后甘厥龍醢視魯縣而來遷奉先帝而追孝立唐祀乎堯山固靈根于夏葉終三代而始蕃非純德之宏圖孰能揆而處旃近則考侯思故匪居匪寍穢長沙之無樂歷江湘而北征曜朱光于白水會九世而飛榮察茲邦之神偉啟天心而寤靈于其宮室則有園廬舊宅隆崇崔嵬御房穆以華麗連閣煥其相徽聖皇之所逍遙靈祗之所保綏章陵鬱以青蔥清廟肅以微微皇祖歆而降福彌萬祀而無衰帝王臧其擅美詠南音以顧懷且其君子弘懿明叡允恭溫良容止可則出言有章進退屈伸與時抑揚方今天地之睢刺帝亂其政豺虎肆虐真人革命之秋也爾其則有謀臣武將皆能攫戾執猛破堅摧剛排揵陷扃蹴蹈咸陽高祖階其塗光武攬其英是以關門反距漢德久長及其去危乘安視人用遷周召之儔據鼎足焉以庀王職縉紳之倫經綸訓典賦納以言是以朝無闕政風烈昭宣也于是乎鯢齒眉壽鮐背之叟皤皤然被黃髮者喟然相與歌曰望翠華兮葳蕤建太常兮裶裶駟飛龍兮騤騤振和鸞兮京師總萬乘兮徘徊按平路兮來歸豈不思天子南巡之辭者哉遂作頌曰皇祖止焉光武起焉據彼河洛統四海焉本枝百世位天子焉永世克孝懷桑梓焉真人南巡覩舊里焉見文選定情賦夫何妖女之淑麗光華豔而秀容斷當時而呈美冠朋匹而無雙歎曰大火流兮草蟲鳴繁霜降兮草木零秋為期兮時已征思美人兮愁屏營見蓺文類聚十八思在面為鉛華兮患離塵而無光見文選洛神賦注歸田賦遊都邑以永久無明略以佐時徒臨川以羨魚俟河清乎未期感蔡子之慷慨從唐生以決疑諒天道之微昧追漁父以同嬉超埃塵以遐逝與世事乎長辭于是仲春令月時和氣清原隰鬱茂百草滋榮王睢鼓翼鶬鶊哀鳴交頸頡頏關關嚶嚶于焉逍遙聊以娛情爾乃龍吟方澤虎嘯山丘仰飛纖繳俯鈞長流觸矢而獘貪餌吞鉤落雲閒之逸禽懸淵沈之魦鰡于時曜靈俄景係以望舒極般遊之至樂雖日夕而忘劬感老氏之遺誡將迴駕乎蓬廬彈五弦之妙指詠周孔之圖書揮翰墨以奮藻陳三皇之軌模苟縱心于物外安知榮辱之所如見文選蓺文類聚三十六舞賦並序昔客有觀舞于淮南者美而賦之曰音樂陳兮旨酒施擊鼉鼓兮吹參差叛淫衍兮漫陸離于是飲者皆醉日亦既吳美人興而將舞乃修容而改服襲羅縠而雜錯申綢繆以自飾拊者啾其齊列般鼓煥以駢羅抗修袖以翳面兮展清聲而長歌歌曰驚雄逝兮孤雌翔臨歸風兮思故鄉搦纖腰而互折嬛傾倚兮低昂增芙蓉之紅華兮光的皪以發揚騰嫮目以顧眄眸爛爛以流光連翩駱驛乍續乍絕裾似飛燕袖如迴雪徘徊相侔提若霆震閃若電滅蹇兮宕往彳兮中輒于是粉黛施兮玉質粲珠簪挻兮緇髮亂然后整笄攬髮被纖垂縈同服駢奏合體齊聲進退無差若影追形見蓺文類聚四十初學記十五御覽三百八十五又略見文選潘岳射雉賦注陸機為顧彥先贈婦詩注歷七盤而蹝躡見後漢邊讓傳注文選舞賦注陸機日出東南隅行注鮑照數詩注御覽五百七十四含清哇而吟詠若離鴻鳴姑邪見文選琴賦注七命注既娛心以悅目見文選陸機演連珠注且夫九德之歌九詔之舞化如凱風澤譬時雨移風易俗混一齊楚以祀則神祇來格以饗則賓主樂胥方之于此孰者為優見初學記十五又略見文選笙賦注
