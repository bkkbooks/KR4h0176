body:
  text: 葛龔遂初賦承豢龍之洪族貺高陽之休基見文選陶徵士誄注考天文于蘭閣覽群言于石渠見御覽一百八十四引此題作反遂初賦與梁相張府君箋悠悠夢想願飛無翼見文選魏文帝雜詩注曹褎寢懷鉛筆行誦文書見文選任昉為范雲作求立太宰碑表注閒賜龔印衣繡囊細布皆珍重纖麗見北堂書鈔一百三十六復惠善墨下士所無摧骸骨碎肝膽不足明報見初學記二十一御覽六百一竝引與梁相書龔以毛羽之身戴丘山之施未審何與薦黃鳳文君垂日月之末光流萬里之恩見文選謝靈運初發石首城詩注薦郝彥文雪白冰折皎然曜世見文選廣絶交綸注薦戴昱昱年六十二兄弟同居二十餘年及為宗老所分昱將妻子逃舊業入虞澤結茅為室捃穫野豆拾掇螺蚌以自賑給見御覽八百四十一又九百四十一讓州辟文恩重山嶽見文選陸機謝平原內史表注與張略書夜從劉伯宣舍西垂過龔家無飯噉𧎷蝦見御覽九百四十三頑暗沈泥見文選顏延之和謝靈運詩注答竇章書見斯衆賢足以忘疾釋愁見引汝南先賢傳喪伯父還傳記烏鳥之情誠竊傷痛見文選李密陳情表注上言鄧太后宜獻廟竊見永平初虎賁中郎將梁松言皇太后宜入廟與陛下交獻以彰至教之心孝明皇帝務遵經典使公卿博士議時太傅鄧禹奏宜如松言光烈皇后于是入廟惟皇太后聖德通靈與神合契宜入宗廟如光烈皇后故事率禮復古垂示萬代見袁宏後漢紀十六永初五年東觀漢紀光武敘帝既有仁賢之明氣勢形體天然之姿固非人之敵翕然龍舉雲興淋雨而濟天下蕩蕩人無能名焉見御覽九十章帝敘孝乎惟孝友于兄弟聖之至要也乾乾夕惕寅畏皇天帝王之上行也明德慎法湯武所務也密靜天下容于小大高宗之極致也肅宗兼茲四德以繼祖考臣下百僚力誦聖德紀述明詔不能辨章豈敢言增廣以纍日月之光見御覽九十一和帝敘穆宗之嗣世正身履道以奉大業賓禮耆艾動式舊典宮無嬪嬙鄭衛之宴囿無槃樂遊畋之豫躬履元德虛靜自損是以屢獲豐年遠近承風云爾見御覽九十一殤帝敘孝殤襁褓承統寢疾不豫天命早崩國祚中絶社稷無主天下熬然政賴皇后孔子稱有婦人焉信哉見御覽九十一上書自訟法禁者俗之隄防刑罰者人之御轡今州曰任郡郡曰任縣更相委遠百姓怨窮以苟容為賢盡節為愚臣所發舉臧罪非一二府恐為臣所奏遂加誣罪臣將從史魚死即以尸諫耳見後漢虞詡傳請復三郡疏臣聞子孫以奉祖為孝君上以安民為明此高宗周宣所以上配湯武也禹貢雍州之域厥田惟上上且沃野千里穀稼殷積又有龜茲鹽池以為民利水草豐美土宜産牧牛馬銜尾群羊塞道北阻山河乘厄據險因渠以溉水舂河漕用功省少而軍糧饒足故孝武皇帝及光武築朔方開西河置上郡皆為此也而遭元元無妄之災衆羌內潰郡縣兵荒二十餘年夫棄沃壤之饒損自然之財不可謂利離河山之阻守無險之處難以為固今三郡未復園陵單外而公卿選懦容頭過身張解設難但計所費不圖其安宜開聖德考行所長見後漢西羌傳通典一百八十九薦左雄疏臣見方今公卿以下類多拱默以樹恩為賢盡節為愚至相戒曰白璧不可為容容多後福伏見議郎左雄數上封事至引陛下身遭危厄以為警戒實有王臣蹇蹇之節周公謨成王之風宜擢在喉舌之官必有匡弼之益見後漢左雄傳又御覽六百三十引續漢書上疏諫輸義錢元年以來貧百姓章言長吏受取百萬以上者胸胸不絶謫罰吏人至數千萬而三公刺史少所舉奏尋永平章和中州郡以走卒錢給貸貧人司空劾案州及郡縣皆坐免黜今宜遵前典蠲除權制見後漢虞詡傳上言臺郎宜均選臺郎顯職仕之通階今或一郡七八或一州無人宜令均平以厭天下之望見後漢虞詡傳自繫尉奏言昔孝安皇帝任用樊豐遂交亂嫡統幾亡社稷今者張防復弄威柄國家之禍將重至矣臣不忍與防同朝謹自繫以聞無令臣襲楊震之跡見後漢虞詡傳奏諫增蠻夷租稅自古聖王不臣異俗非德不能及威不能加知其獸心貪婪難率以禮是故羇縻而綏撫之附則受而不逆叛則棄而不追先帝舊典貢稅多少所由來久矣今猥增之必有怨叛計其所得不償所費必有後悔見後漢南蠻傳又見袁宏後漢紀十八駁尚書劾寧陽主簿事主簿所訟乃君父之怨百上不達是有司之過愚蠢之人不足多誅見後漢虞詡傳上疏追訟鄧騭伏惟和熹皇后聖善之德為漢文母兄弟忠孝同心憂國宗廟有主王室是賴功成身退讓國遜位歷世外戚無與為比當享積善履謙之祐而橫為宮人單辭所陷利口傾險反亂國家罪無申證獄不訊鞠遂令騭等罹此酷濫一門七人竝不以命尸骸流離怨魂不反逆天感人率土喪氣宜收還冢次寵樹遺孤奉承血祀以謝亡靈見後漢鄧禹附傳又見袁宏後漢紀十七有刪節遺令吾本寒賤諸生才非周幹橫受朝恩位過其任不能竭身報國負責深重身沒之後百僚所賻贈一無所受素棺殯斂疏布單衣無設紱冕斂畢便以所有牛車夜載喪還鄉里勿告群僚以密靜為務見袁宏後漢紀十八上書駁左雄察舉議臣聞君以兼覽博照為德臣以獻可替否為忠書載稽疑謀及卿士詩美先人詢于芻蕘國有大政必議之于前訓咨之于故老是以慮無失策舉無過事竊見尚書令左雄議郡舉孝廉皆限年四十以上諸生試章句文吏試箋奏明詔既許復令臣等得與相參竊惟王命之重載在篇典當令縣于日月固於金石遺則百王施之萬世詩云難諶斯不易惟王不慎與蓋選舉因才無拘定制六奇之策不出經學鄭阿之政非必章奏甘奇顯用年垂彊仕終賈揚聲亦在弱冠漢承周秦兼覽殷夏祖德師經參雜霸軌聖主賢臣世以致理貢舉之制莫或回革今以一臣之言剗戾舊章便利未明衆心不厭矯枉變常政之所重而不訪台司不謀卿士若事下之後議者剝異異之則朝失其便同之則王言已行臣愚以為可宣下百官參其同異然後覽擇勝否詳採厥衷敢以瞽言冒干天禁惟陛下納焉見後漢胡廣傳尚書令左雄議改察舉之制廣復舉敞虔上書駁之諫探策立后疏竊見詔書以立后事大謙不自專欲假之籌策決疑靈神篇籍所記祖宗典故未嘗有也恃神任筮既不必當賢就值其人猶非德選夫岐嶷形于自然俔天必有異表宜參良家簡求有德德同以年年鈞以貌稽之典經斷之聖慮政令猶汗往而不反詔文一下形之四方臣職在拾遺憂深責重是以焦心冒昧陳聞見後漢胡廣傳書建鴻德流清風見文選張協詠史詩注王隆漢官篇解詁敘前安帝時越騎校尉劉千秋書東觀好事者樊長孫與書曰漢家禮儀叔孫通等所草創皆隨律令在理官藏于几閣無紀録者久令二代之業暗而不彰誠宜撰次依擬周禮定位分職各有條序令人愚智入朝不惑君以公族元老正丁其任焉可以已劉君甚然其言與邑子通人郎中張平子參議未定而劉君遷為宗正衛尉平子為尚書郎太史令各務其職未暇恤也至順帝時平子為侍中典校書方作周官解說乃欲以漢次述漢事會復河間相遂莫能立也述作之功獨不易矣既感斯言顧見故新汲令王文山小學為漢官篇略道公卿內外之職旁及四夷博物條畼多所發明足以知舊制儀品蓋有成易而道有困革是以聊集所宜為作解詁各隨其下綴續後事令世施行庶明厥旨廣前憤盈之念增助來哲多聞之覽焉見續漢百官志一注百官針敘針諫之興所由尚矣聖君求之于下忠臣納之于上故虞書曰違汝弼汝無面從退有後言子著書稱夏針之辭見御覽五百八十八給事中掌侍從左右無員位次侍中常侍或名儒或國親見御覽二百二十一引胡廣集侍中針皇矣聖上神君天處勤求俊良是弼是輔匪懈于位庶工以序昔在周文創德西鄰勗聞上帝賴茲四臣辛尹是訪八虞是詢濟濟多士乂用有勳文公欽若越興周道亦惟先正克慎左右常伯常任實為政首降及厲王不祗不恪眤彼宗夷用肆其虐惟敗天命寇戎竝作圮墜宗緒寢廟靡託無曰我賢不選至親無曰我仁妄用嬖人籍閎飾顏穢我神武鄧通擅鑄不終厥後中書竊命石弘作禍高安斷袂哀用無主侍中司中敢告執矩見初學記十二案古文苑以為崔瑗作邊都尉針巍巍上聖光被八垠矧惟內外罔不來賓季末陵遲王澤壅隔戎狄作難鬼方騷逖桓桓猛將是攘是闢殷周是宣用顯其績大漢龍興念存洽平蕩蕩率上來同門并守撫其民尉典其戎伍才竝用文武程功見御覽二百四十一陵令針昔在黃葉葬野衣薪禮極哀不樹不封瓦棺堲聚周聚夏攸謂壤不毀膚賄不害生是謂皇極百王此經故厚不可始皇薄不可王乃眷西顧爰短孝文陵臣司墓敢告守人見御覽二百二十九案此針有衍誤印衣銘明明上皇旌以命服紆朱懷金為光為飾邁種其澤撫寧四國宣慈惠和柔嘉維則克常厥心膺茲多福登位歷壽子孫千億見初學記二十六綬笥銘休矣斯笥凡器為式受相君子承此印綬帝命所啓用褎令德佩以自修所以自敕忠肅恭懿鮮不為則靡悔靡吝神人致福見初學記二十六徵士法高卿碑言滿天下發成篇章行充宇宙動為儀表四海英儒履義君子企望來臻者不可勝紀也翻然鳳舉匿耀遠遁名不可得而聞身難可得而覩為堯舜所知不飲洗耳之水超越青雲之上德踰巢許之右所謂逃名而名我隨避聲而聲我追者已揆君分量輕寵傲俗乃百世之師也其辭曰邈玄德膺懿資弘聖典研道機彪童蒙作世師辭皇命確不移亞洪崖超由夷垂英聲揚景暉見藝文類聚三十七弔夷齊文遭亡辛之昏虐時繽紛以蕪穢恥降志于汗君溷雷同于榮勢抗浮雲之妙志遂蟬蛻以偕逝徼六軍于河渚叩王馬而慮計雖忠情而指尤匪天命之所謂賴尚父之戒慎鎮左右而不害見藝文類聚三十七援翰録弔以舒懷兮見文選向秀思舊賦注
