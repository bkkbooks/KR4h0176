body:
  text: 王逸機婦賦舟車棟寓麤工也杵臼碓磑直巧也盤杅縷針小用也至于織機功用大矣素樸醇一野處穴藏上自太始下訖羲皇帝軒龍躍庶業是昌俯覃聖思仰覽三光悟彼織女終日七襄爰制布帛始垂衣裳于是取衡山之孤桐南岳之洪樟結靈根于盤石託九層于巖旁性條畼以端直貫雲表而剴良儀鳳晨鳴翔其上怪獸群萃而陸梁于是乃命匠人潛江奮驤踰五嶺越九岡斬伐剖析擬度短長勝復迴轉剋像乾形大匡淡泊擬則川平光為日月蓋取昭明三軸列布上法台星兩驥齊首儼若將征方員綺錯極妙窮奇蟲禽品獸物有其宜免耳跧伏若安若危猛犬相守竄身匿蹄高樓雙峙下臨清池游魚銜餌瀺灂其陂鹿盧竝起纖繳俱垂宛若星圖屈伸推移一往一來匪勞匪疲于是暮春代謝朱明達時蠶人告訖舍罷獻絲或黃或白蜜蠟凝脂纖纖靜女經之絡之爾乃窈窕淑緩美色貞怡解鳴佩釋羅衣披華幕登神機乘輕杼攬床帷動搖多容俯仰生姿見蓺文類聚六十五北堂書鈔一百五十八御覽八百二十五荔支賦大哉聖皇處乎中州東野貢落疏之文瓜南浦上黃甘之華橘西旅獻崑山之蒲桃北燕薦朔濱之巨栗見蓺文類聚八十七初學記二十八御覽九百六十四魏土送西山之杏見蓺文類聚八十七御覽九百六十八宛中朱柿房陵縹李酒泉白柰見文選蜀都賦注乃觀荔支之樹其形也曖若朝雲之興森如橫天之彗湛若大廈之容鬱如峻嶽之勢修幹紛錯綠葉臻臻角亢興而靈華大火中而朱實繁灼灼若朝霞之映日離離如繁星之著天皮似丹罽膚若明璫潤侔和壁奇喻五璜仰歎麗表俯嘗嘉味口含丹液心受芳氣兼五滋而無常主不知百和之所出卓絕類而無儔超眾果而獨貴見蓺文類聚八十七御覽九百七十一宛洛少年邯鄲遊士裝不及解飛匡上下電往景還見文選江賦注九思九思者王逸之所作也逸南陽人博雅多覽讀楚辭而傷愍屈原故為之作解又以自屈原終沒之後忠臣介士遊覽學者讀離騷九章之文莫不愴然心為悲感高其節行妙其麗雅至劉向王褎之徒咸嘉其義作賦騁辭以讚其志則皆列于譜錄世世相傳逸與屈原同土共國悼傷之情與凡有異竊摹向褎之風作頌一篇號曰九思以裨其辭未有解說故聊敘訓誼焉辭曰悲兮愁哀兮憂天生我兮當闇時被諑譖兮虛獲尤心煩憒兮意無聊嚴載駕兮出戲遊周八極兮歷九州求軒轅兮索重華世既卓兮遠眇眇握佩玖兮中路躇羨咎繇兮建典謨懿風后兮受瑞圖愍余命兮遭六極委玉質兮于泥塗遽傽遑兮驅林澤步屏營兮行丘阿車軏折兮馬虺頹惷悵立兮涕滂沱思丁文兮聖明哲哀平差兮迷謬愚呂傅舉兮殷周興忌專兮郢吳虛仰長歎兮氣䭇結悒殟絕兮咶復蘇虎兕爭兮于延中豺狼鬭兮我之隅雲霧會兮日冥晦飄風起兮揚塵埃走鬯罔兮乍東西欲竄伏兮其焉如念靈閨兮隩重深願竭節兮隔無由望舊邦兮路透隨憂心悄兮志勤劬魂煢煢兮不遑寐目眽眽兮寤終朝逢尤令尹兮謷謷群司兮譨譨哀哉兮淈淈上下兮同流菽藟兮蔓衍芳虈兮挫枯朱紫兮雜亂曾莫兮別諸倚此兮巖穴永思兮窈悠嗟懷兮眩惑用志兮不昭將喪兮玉斗遺失兮鈕樞我心兮煎熬惟是兮用憂進惡兮九旬復顧兮彭務擬斯兮二蹤未知兮所投謠吟兮中壄上察兮璇璣大火兮西睨攝提兮運低雷霆兮硠礚雹霰兮霏霏奔電兮光晃涼風兮愴悽鳥獸兮驚駭相從兮宿棲鴛鴦兮噰噰狐狸兮徾徾哀吾兮介特獨處兮罔依螻蛄兮鳴東蟊𧕾兮號西蛓緣兮我裳蠋入兮我懷蟲豸兮夾余惆悵兮自悲佇立兮忉怛心結縎兮折摧怨上周徘徊兮漢渚求水神兮靈女嗟此國兮無良媒女詘兮謰謱鴳列兮譁讙鴝鵒鳴兮聒余抱昭華兮寶璋欲衒鬻兮莫取言旋邁兮北徂叫我友兮配耦日陰曀兮未光𨶑睄窕兮靡睹紛載驅兮高馳將諮詢兮皇羲遵河皋兮周流路變易兮時乖濿滄海兮東遊沐盥浴兮天池訪太昊兮道要云靡貴兮仁義志欣樂兮反征就周文兮邠岐秉玉英兮結誓日欲暮兮心悲惟天祿兮不再背我信兮自違踰隴堆兮渡漠過桂車兮合黎赴崑山兮馽騄從梁邛遨兮棲遲允玉液兮止渴齧芝華兮療飢居嵺廓兮尠疇遠梁昌兮幾迷望江漢兮濩渃心緊絭兮傷懷時昢昢兮旦旦塵莫莫兮未晞憂不暇兮寢食吒增歎兮如雷疾世哀世兮睩睩諓諓兮嗌喔眾多兮阿媚骫靡兮成俗貪枉兮黨比貞良兮煢獨鵠竄兮枳棘鵜集兮帷幄蘮兮青䓗稾本兮萎落覩斯兮偽惑心為兮隔錯逡巡兮圃藪率彼畛陌川谷淵淵山峊兮㟯㟯叢林兮崟崟株榛兮岳岳霜雪兮漼溰冰凍兮洛澤東西兮南北罔所兮歸薄庇廕兮枯樹匍匐兮巖石踡跼兮寒局數獨處兮志不申年齒盡兮命迫促魁壘摧兮常困辱含憂強老兮愁不樂鬚髮薴顇兮顠鬢白思靈澤兮一膏沐懷蘭英兮挹瓊若待天明兮立躑躅雲蒙蒙兮電鯈爍孤雌驚兮鳴呴呴思怫鬱兮肝切剝忿悁悒兮孰訴告憫上悼屈子兮遭厄沈玉躬兮湘汨何楚國兮難化迄于今兮不易士莫志兮羔裘競佞諛兮讒鬩指正義兮為曲訿玉壁兮為石殦鵰遊兮華屋鵕鸃棲兮柴蔟起奮迅奔走違群小兮謑訽載青雲兮上昇適昭明兮所處躡天衢兮長驅踵九陽兮戲蕩越漢兮南濟秣余馬兮河鼓雲霓紛晻翳參辰回兮顛倒逢流星兮問路顧我指兮從左徑娵觜兮直馳御者迷兮失軌遂踢達兮邪造與日月兮殊道志閼絕兮安如哀所求兮不耦攀天階兮下視見鄢郢兮舊宇意逍遙兮欲歸眾穢盛兮杳杳思哽饐兮詰詘涕流瀾兮如雨遭厄嗟嗟兮悲夫殽亂兮紛挐茅絲兮同綜冠屨兮共絇督萬兮侍宴周邵兮負蒭白龍兮見射靈龜兮執拘仲尼兮困戹鄒衍兮幽囚伊余兮念茲奔遁兮隱居將升兮高山上有兮猴猿欲入兮深谷下有兮虺蛇左見兮鳴鵙右睹兮呼梟惶悸兮失氣踊躍兮距跳便旋兮中原仰天兮增歎菅蒯兮壄莽雚葦兮仟眠鹿蹊兮𨇰𨇰貒貉兮蟫蟫鸇鷂兮軒軒鶉鵪兮甄甄哀我兮寡獨靡有兮齊倫意欲兮沈吟迫日兮黃昏玄鶴兮高飛曾逝兮青冥鶬鶊兮喈喈山鵲兮嚶嚶鴻鸕兮振翅歸雁兮于征吾志兮覺悟懷我兮聖京垂兮將起跓誒兮碩明悼亂惟昊天兮昭靈陽氣發兮清明風習習兮龢煖百草萌兮華榮堇茶茂兮扶疏蘅芷彫兮瑩嫇愍貞良兮遇害將大折兮碎糜時混混兮澆饡哀當世兮莫知覽往昔兮俊彥亦詘辱兮係纍管束縛兮桎梏百貨易兮傅賣遭桓繆兮識舉才德用兮列施且從容兮自慰玩琴書兮遊戲迫中國兮迮陿吾欲之兮九夷超五嶺兮嵯峨觀浮石兮崔嵬陟丹山兮炎野屯余車兮黃支就祝融兮稽疑嘉己行兮無為乃回朅兮北逝遇神孈兮宴娭欲靜居兮自娛心愁慼兮不能放余轡兮策駟忽飆騰兮浮雲蹠飛杭兮越海從安期兮蓬萊緣天梯兮北上登太一兮王臺使素女兮鼓簧乘戈龢兮謳謠聲噭誂兮清和音晏衍兮要婬咸欣欣兮酣樂余眷眷兮獨悲顧章華兮太息志戀戀兮依依傷時昊天兮清涼玄氣兮高朗北風兮水潦洌草木兮蒼唐𧉅蚗兮噍噍蝍蛆兮穰穰歲忽忽兮惟暮余感時兮悽愴傷俗兮泥濁曚蔽兮不章寶彼兮沙礫損此兮夜光椒瑛兮涅汙葈耳兮充房攝衣兮緩帶操我兮墨陽昇車兮命僕將馳兮四荒下堂兮見蠆出門兮觸𧒒巷有兮蚰蜓邑多兮螳螂睹斯兮嫉賊心為兮切傷俛念兮子胥仰憐兮比干投劍兮脫冕龍屈兮蜿蟤潛藏兮山澤匍匐兮叢攢窺見兮溪澗流水兮沄沄黿鼉兮欣欣鱣鮕兮延延群行兮上下駢羅兮列陳自恨兮無友特處兮煢煢冬夜兮陶陶雨雪兮冥冥神光兮熲熲鬼火兮熒熒修德兮困控愁不聊兮遑生憂紆兮鬱鬱惡所兮寫情哀歲陟玉巒兮逍遙覽高岡兮嶢嶢桂樹列兮紛敷吐紫華兮布條實孔鷥兮所居今其集兮惟鴞烏鵲驚兮啞啞余顧瞻兮怊怊彼日月兮闇昧障覆天兮祲氛伊我后兮不聰焉陳誠兮効忠攄羽翮兮超俗遊陶遨兮養神乘六蛟兮蜿蟬遂馳騁兮陞雲揚彗光兮為旗秉電策兮鞭朝晨發兮鄢郢食時至兮增泉繞曲阿兮北次造我車兮南端謁玄黃兮納贄崇忠貞彌堅歷九宮兮徧觀睹祕藏兮寶珍就傳說兮騎龍與織女兮合婚舉天罼兮掩邪彀天弧兮射姦隨真人兮翱翔食元氣兮長存望太微兮穆穆睨三階兮炳分相輔政兮成化建烈業兮垂勳目瞥瞥兮西沒道遐迴兮阻歎志蓄積兮未通悵敞罔兮自憐守志亂曰天庭明兮雲霓藏三光朗兮鏡萬方斥蜥蜴兮進龜龍策謀從兮翼機衡配稷契兮恢唐功嗟英俊兮未為雙見楚辭楚辭章句敘敘曰昔者孔子叡聖明喆天生不群定經術刪詩書正禮樂制作春秋以為後王法門人三千罔不昭達臨終之日則大義乖而微言絕其後周室衰微戰國竝爭道德陵遲譎詐萌生于是楊墨鄒孟孫韓之徒各以所知著造傳記或以述古或以明世而屈原履忠被譖憂悲愁思獨依詩人之義而作離騷上以諷諫下以自慰遭時闇亂不見省納不勝憤懣遂復作九歌以下凡二十五篇楚人高其行義瑋其文采以相教傳至于孝武帝恢廓道訓使淮南王安作離騷經章句則大義粲然後世雄俊莫不瞻慕舒肆妙慮纘述其詞逮至劉向典校經書分為十六卷孝章即位深弘道蓺而班固賈逵復以所見改易前疑各作離騷經章句其餘十五闕而不說又以壯為狀義多乖異事不要括今臣復以所識所知稽之舊章合之經傳作十六卷章句雖未能究其微妙然大指之趣略可見矣且人臣之義以忠正為高以伏節為賢故有危言以存國殺身以成仁是以伍子胥不恨于浮江比干不悔于剖心然後忠立而行成榮顯而名著若夫懷道以迷國詳愚而不言顛則不能扶危則不能安婉娩以順上逡巡以避患雖保黃耇終壽百年蓋志士之所恥愚夫之所賤也今若屈原膺忠貞之質體清潔之性直若砥矢言若丹青進不隱其謀退不顧其命此誠絕世之行俊彥之英也而班固謂之露才揚已競于群小之中怨恨懷王譏刺椒蘭苟欲求進強非其人不見容納忿恚自沈是虧其高明而損其清潔者也昔伯夷叔齊讓國守分不食周粟遂餓而死豈可復謂有求于世而怨望哉且詩人怨主刺上曰嗚呼小子未知臧否匪面命之言提其耳風諫之語于斯為切然仲尼論之以為大雅引此比彼屈原之詞優游婉順寍以其君不智之故欲提攜其耳乎而論者以為露才揚已怨刺其上強非其人殆失厥中矣夫離騷之文依託五經以立義焉帝高陽之苗裔則厥初生民時惟姜嫄也紉秋蘭以為佩則將翱將翔佩玉瓊琚也夕攬洲之宿莽則易潛龍勿用也駟玉虬而乘鷖則時乘六龍以御天也就重華而敶詞則尚書咎繇之謀謨也登崑崙而涉流沙則禹貢之敷土也故智彌盛者其言博才益多者其識遠屈原之詞誠博遠矣自終沒以來名儒博達之士著造詞賦莫不擬則其儀表祖式其模範取其要妙竊其華藻所謂金相玉質百世無匹名垂罔極永不刊滅者矣離騷經離騷經者屈原之所作也屈原與楚同姓仕于懷王為三閭大夫三閭之職掌王族三姓日昭屈景屈原序其譜屬率其賢良以厲國士入則與王圖議政事決定嫌疑出則監察群下應對諸侯謀行職脩王甚珍之同列大夫上官靳尚妒害其能共譖毀之王乃疏屈原屈原執履忠貞而被讒哀憂心煩亂不知所愬乃作離騷經離別也騷愁也經徑也言已放逐離別忠心愁思獨依道徑以風諫君也故上述唐虞三后之制下序桀紂羿澆之敗冀君覺悟反于正道而還已也是時秦昭王使張儀譎詐懷王令絕齊交又使誘楚請與俱會武關遂脅與歸拘留不遣卒客死于秦其子襄王復用讒言遷屈原于江南屈原放在草野復作九章援天引聖以自證明終不見省不忍以清白久居濁世遂赴汩淵自沈而死離騷之文依詩取興引類譬諭故善鳥香草以配忠貞惡禽臭物以比讒佞靈脩美人以媲于君宓妃佚女以譬賢臣虬龍鸞鳳以託君子飄風雲霓以為小人其詞溫而雅其義皎而朗凡百君子莫不慕其清高嘉其文釆哀其不遇而愍其志焉九歌九歌者屈原之所作也昔楚國南郢之邑沅湘之閒其俗信鬼而好祠其祠必作歌樂舞以樂諸神屈原放逐竄伏其域懷憂苦毒愁思沸鬱出見俗人祭祀之禮歌舞之樂其詞鄙陋因為作九歌之曲上陳事神之敬下見已冤結託之以風諫故以其文意不同章句雜錯而廣異義焉天問天問者屈原之所作也何不言問天天尊不可問故曰天問也屈原放逐憂心愁悴彷徨山澤經歷陵陸嗟號昊旻仰天歎息楚有先天之廟及公卿祠堂圖畫天地山川神靈琦瑋僪佹及古賢聖怪物行事周流罷倦休息其下仰見圖畫因書其壁何而問之以渫憤懣舒瀉愁思楚人哀惜屈原因共論述故其文義不次序云爾敘曰昔屈原之所作凡二十五篇世相教傳而莫能說天問以其文義不次又多奇怪之事自太史公口論道之多所不逮至于劉向楊雄援引傳記以解說之亦不能詳悉所闕者眾日無聞焉既有口詞乃復多連蹇其文濛澒其說故厥義不昭微指不晳自游覽者靡不苦之而不能照也今則稽之舊章合之經傳以相發明為之符驗章決句斷事事可曉俾後學者永無疑焉九章九章者屈原之所作也屈原放于江南之壄思君念國憂心罔極故復作九章章者著也明也言已所陳忠信之道甚著明也卒不見納委命自沈楚人惜而哀之世論其詞以相傳焉遠遊遠遊者屈原之所作也屈原履方直之行不容于世上為讒佞所譖毀下為俗人所困極章皇山澤無所告訴乃深惟元一修執恬漠思欲濟世則意中憤然文釆鋪發遂敘妙思託配仙人與俱遊戲周歷天地無所不到然猶懷念楚國思慕舊故忠信之篤仁義之厚也是以君子珍重其志而瑋其辭焉卜居卜居者屈原之所作也屈原體忠貞之性而見嫉妒念讒佞之臣承君順非而蒙富貴已執忠直而身放棄心迷意惑不知所為乃往至大卜之家稽問神明決之著龜卜已居世何所宜行冀聞異策以定嫌疑故曰卜居也漁父漁父者屈原之所作也屈原放逐在江湘之閒憂愁嘆吟儀容變易而漁父避世隱身釣魚江濱欣然自樂時遇屈原川澤之域怪而問之遂相應荅楚人思念屈原因敘其辭以相傳焉九辯九辯者楚大夫宋玉之所作也辯者變也謂敶道德以變說君也九者陽之數道之綱紀也故天有九星以正機衡地有九州以成萬邦人有九竅以通精明屈原懷忠貞之性而被讒邪傷君闇蔽國將危亡乃援天地之數列人形之要而作九歌九章之頌以諷諫懷王明已所言與天地合度可履而行也宋玉者屈原弟子也閔惜其師忠而放逐故作九辯以述其志至于漢興劉向王褎之徒咸悲其文依而作詞故號為楚詞亦采其九以立義焉招魂招魂者宋玉之所作也招者召也手曰招以言日召魂者身之精也宋玉憐哀屈原忠而斥棄愁懣山澤魂魄放佚厥命將落故作招魂欲以復其精神延其年壽外陳四方之惡內崇楚國之美以諷諫懷王冀其覺悟而還之也大招大招者屈原之所作也或曰景差疑不能明也屈放流九年憂悤煩亂精神越散與形離別恐命將終所行不遂故憤然大招其魂盛楚國之樂崇懷襄之德以比三王能任用賢公卿明察能薦舉人宜輔佐之以興至治因以諷諫達己之志也惜誓惜誓者不知誰所作也或曰賈誼疑不能明也惜者哀也誓者信也約也言哀惜懷王與已信約而復背之也古者君臣將共為治必以信誓相約然後言乃從而身以親也蓋刺懷王有始而無終也招隱士招隱士者淮南小山之所作也昔淮南王安博雅好古招懷天下俊偉之士自八公之徒咸慕其德而歸其仁各竭才智著作篇章分造辭賦以類相從故或稱小山或稱大山其義猶詩有小雅大雅也小山之徒閔傷屈原又怪其文昇天乘雲役使百神似若仙者雖身沈沒名德顯聞與隱處山澤無異故作隱士之賦以章其志也七諫七諫者東方朔之所作也諫者正也謂陳法度以諫正君也古者人臣三諫不從退而待放屈原與楚同姓無相去之義故加為七諫慇懃之意忠厚之節也或曰七諫者法天子有爭臣七人也東方朔追憫屈原故作此辭以述其志所以昭忠信矯曲朝也哀時命哀時命者嚴夫子之所作也夫子名忌與司馬相如俱好辭賦客遊于梁孝王甚奇重之忌哀屈原受性忠貞不遭明君而遭暗世斐然作辭歎而述之故曰哀帝時命也九懷九懷者諫議大夫王褎之所作也懷者思也言屈原雖見放逐猶思念其君憂國傾危而不能忘也褎讀屈原之文嘉其溫雅藻釆敷衍執握金玉委之污瀆遭世溷濁莫之能識追而愍之故作九懷以裨其詞史官錄第遂列于篇九歎九歎者護左都水使者光祿大夫劉向所作也向以博古敏達典校經書辯章舊文追念屈原忠信之節故作九歎歎者傷也息也言屈原放在山澤猶傷念君歎息無已所謂讚賢以輔志騁詞以曜德者也折武論苞含六蓺游覽百家用道德為弓弩仁義為鎧甲見書鈔
