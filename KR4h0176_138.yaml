body:
  text: 王延壽魯靈光殿賦魯靈光殿者蓋景帝程姬之恭王餘之所立也初恭王始都下國好治宮室遂因魯僖基兆而營焉遭漢中微盜賊奔突自西京未央建章之殿皆見隳壞而靈光巋然獨存意者豈非神明依憑支持以保漢室者也然其規矩制度上應星宿亦所以永安也豫客自南鄙觀藝于魯覩斯而眙曰嗟乎詩人之興感物而作故奚斯頌僖歌其路寢而功績存乎辭德音昭乎聲物以賦顯事以頌宣匪賦匪頌將何述焉遂作賦曰粵若稽古帝漢祖宗濬哲欽明殷五代之純熙紹伊唐之炎精荷天衢以元亨廓宇宙而作京敷皇極以創業協神道而大寧于是百姓昭明九族敦序乃命孝孫俾侯于魯錫介圭以作瑞宅附庸而開宇乃立靈光之祕殿配紫微而為輔承明堂于少陽昭列顯于奎之分野瞻彼靈光之為狀也則嵯峨㠑嵬峗巍㠥磈吁可畏乎其駭人也迢嶢倜儻豐麗博敞洞轇轕乎其無垠也邈希世而特出羌瓌譎而鴻紛屹山峙以紆鬱隆崛岉乎青雲鬱坱圠以嶒𡵓崱繒綾而龍鱗汨磑磑以璀璨赫燡燡而燭坤狀若積石之鏘鏘又似乎帝室之威神崇墉岡連以嶺屬朱闕巖巖而雙立高門擬于閶闔方二軌而竝入于是乎乃歷夫太階以造其堂俯仰顧眄東西周章彤彩之飾徒何為乎澔澔涆涆流離爛漫晧壁皓曜以月照丹柱歙赩而電烻霞駮雲蔚若陰若陽瀖濩燐亂煒煒煌煌隱陰夏以中處霐寥窲以崢嶸鴻爌炾以爣閬飋蕭條而清泠動滴瀝以成響殷雷應其若驚耳嘈嘈以失聽目矎矎而喪精駢密石與琅玕齊玉璫與璧英遂排金扉而北入霄靄靄而暗曖旋室㛹娟以窈窕洞房叫窱而幽邃西廂踟蹰以間宴東序重深而奧祕屹鏗瞑以勿罔屑黶翳以懿濞魂悚悚其驚斯心𤟧𤟧而發悸于是詳察其棟宇觀其結構規矩應天上憲觜陬倔佹雲起嶔崟離摟三閒四表八維九隅萬楹叢倚磊砢相扶浮柱岧嵽星懸漂嶢𡸣而枝拄飛梁偃蹇以虹指揭蘧蘧而騰湊層櫨磊以岌峨曲枅要紹而環句芝栭攢羅以戢孴枝牚丫而斜據傍夭蟜以橫出互黝糾而摶負下岪蔚以璀錯上崎嶬而重注捷獵鱗集支離分赴縱橫駱驛各有所趣爾乃懸棟結阿天窗綺疏圓淵方井反植荷蕖發秀吐榮菡萏披敷緑房紫菂窋咤垂珠雲楶藻梲龍桶雕鏤飛禽走獸因木生姿奔虎攫拏以梁倚仡奮舋而軒鬐虯龍騰驤以蜿蟺頷若動而躨跜朱鳥舒翼以峙衡騰蛇蟉虯而繞榱白鹿子霓于欂櫨蟠螭宛轉而承楣狡兔跧伏于柎側猿狖攀椽相追玄熊舑舕以齗齗卻負載而蹲跠齊首目以瞪眄徒眽眽而狋狋胡人遙集于上楹儼雅跽而相對仡欺𤟧以鵰𥄴𪃨顤顟而睽睢狀若悲愁于危處憯嚬蹙而含悴神仙嶽嶽于棟閒玉女窺窗而下視忽瞟眇以響像若鬼神之髣佛圖畫天地品類群生雜物奇怪山神海靈寫載其狀託之丹青千變萬化事各繆形隨色象類曲得其情上紀開闢遂古之初五龍比翼人皇九頭伏羲鱗身女媧蛇軀鴻荒朴略厥狀睢盱煥炳可觀黃帝唐虞軒冕以庸衣裳有殊下及三后媱妃亂主忠臣孝子烈士貞女賢愚成敗靡不載敘惡以誡世善以示後于是乎連閣承宮馳道周環陽榭外望高樓飛觀長途升降軒檻曼延漸臺臨池層曲九成屹然特立的爾殊形高徑華蓋仰看天庭飛陛揭蘗緣雲上征中坐垂景俯視流星千門相似萬戶如一巖突洞出逶迤詰屈周行數里仰不見日何宏麗之靡靡咨用力之妙勤非夫通神之俊才誰能剋成乎此勳據坤靈之寶勢子蒼昊之純殷包陰陽之變化含元氣之烟熅玄醴騰涌于陰溝甘露被宇而下臻朱桂黝鯈于南北蘭芝阿𨙻于東西祥風翕習以颯灑激芳香而常芬神靈扶其棟宇歷千載而彌堅永安寧以祉福長與大漢而久存實至尊之所御保延壽而宜子孫苟可貴其若斯孰亦有云而不珍亂曰彤彤靈宮巋㠑穹崇紛厖鴻兮崱屴嵫釐岑崟崰嶷駢巃嵸兮連拳偃蹇崙菌踡嵼傍欹傾兮歇欻幽藹雲覆霮䨴洞杳冥兮葱翠紫蔚礧碨瓌瑋含光晷兮窮奇極妙棟宇已來未之有兮神之營之瑞我漢室永不朽兮見文選夢賦余夜寢息乃有非恆之夢其為夢也悉覩鬼神之變怪則蛇頭而四角魚首而鳥身三足而六眼龍形而似人群行而奮搖忽來到吾前申臂而舞手意欲相引牽于是夢中驚怒腷臆紛紜曰吾含天地之純和何妖孽之敢臻乃揮手振拳雷發電舒斫遊光斬猛豬批鱟毅斫魅虛捎魍魎拂諸渠撞縱目打三顱撲苕蕘抶夔𩴹搏睍睆蹴睢盱爾乃三三四四相隨踉嗙而歷僻礲礲礚礚精氣充布輷輷㺒㺒鬼驚魅怖或盤跚而欲走或拘攣而不能步或中創而婉轉或捧痛而號呼奄霧消而光蔽寂不知其何故嗟妖邪之怪物豈干真人之正度耳聊嘈而外即忽屈伸而覺悟亂曰齊桓夢物而亦以霸兮武丁夜感而得賢佐兮周夢九齡年克百兮晉文盬腦國以競兮老子役鬼為神將兮轉禍為福永無恙兮見藝文類聚七十九王孫賦原天地之造化實神偉之屈奇道玄微以密妙信無物而弗為有王孫之狡獸形陋觀而醜儀顏狀類乎老公軀體似乎小兒眼睚𥈬以𥄴恤視職睫以䀗睳高匡而曲頞䁵歷而隳離鼻𪖢齁以䶋耳聿役以嘀知口嗛𣅧以䶨齺脣㗩以𤿐齒崖崖以齴齴嚼𠲏𠱞而囁唲儲糧食于兩頰稍委輸于胃脾踡菟蹲而狗踞聲歷鹿而喔咿或嗝嗝而又嘀嗅其若啼姿僭傔而總贛豁肝鬩以頊醯眙睕朡而𥊋睗盶𥊶愞而踧𣥨生深山之茂林處嶄巖之嶔崎性僄猜之㺕疾態峰出而橫施緣百仞之高木攀窈裊之長枝背牢落之峻壑臨不測之幽溪尋柯條以宛轉或捉腐而登危若將頽而復著紛絀絀以陸離或群跳而電透或瓜懸而瓠垂上觸手而拏攫下對足而登跂至攀攬以狂椄覆縮臂而電走時遼落以蕭索乍睥睨以容與或蹂趹以踐遊又咨噉而攢聚扶嶔崟以𢴟椽躡危臬而騰舞忽涌逸而輕迅羌難得而覼縷同甘苦于人類好哺糟啜醨乃設酒于其側竟爭飲而𨀮馳頊陋䣱以迷醉矇眠睡而無知暫拏鬃以縛遂纓絡以縻羈歸鎖繫于庭廄觀者吸呷而忘疲見藝文類聚九十五初學記二十九御覽九百十桐柏淮源廟碑延熹六年正月八日乙酉南陽太守中凶盧奴君正好禮尊神敬祀以淮出平氏始于大復潛行地中見于陽立廟桐柏春秋宗奉災異告訴水旱請求位比諸侯聖漢所尊受圭上帝大常定申郡守奉祀齊潔沈祭從郭君以來草餘年不復身至遣丞行事簡略不敬明神弗歆災害以生五嶽四瀆與天合德仲尼慎祭常若神在君準則大聖親之桐柏奉見廟祠崎嶇逼狹開祏神門立闕四達增廣壇場餝治華蓋高大殿宇齊傳館石獸表道靈龜十四衢廷弘敞宮廟嵩峻祗慎慶祀一年再至躬進三牲執玉以沈為民祈福靈祗報祐天地清和嘉祥昭格禽獸碩茂草木芬芳黎庶賴祉民用作頌其辭曰泫泫淮源聖禹所導湯湯其逝惟海是造疏穢濟遠柔順其道弱而能強仁而能武晝夜明哲所取實為四瀆與河合矩烈烈明府好古之則虔恭禮祀不愆其德惟前廢弛匪躬匪力災眚以興陰陽以忒陟彼高岡臻茲廟側肅肅其敬靈祗降福雍雍其和民用悅服穰穰其慶年穀豐殖望君輿駕扶老攜息慕君塵軌奔走忘食懷君惠賜思君罔極于胥樂兮傳于萬億春侍祠官屬五官掾章陵劉欣功曹史安衆劉瑗主薄蔡陽樂茂戶曹史宛任巽秋五官掾新梁懿功曹史酈周謙主薄安衆鄧嶷主記史宛趙旻戶曹史宛謝綜見隸釋二案古文苑以此碑為王延壽撰上安帝疏諫寵外戚臣聞微子佯狂而去殷叔孫通背秦而歸漢彼非自疏其君時不可也臣荷殊絶之恩蒙值不諱之政豈敢雷同受寵而以戴天履地伏惟陛下應天履祚歷值中興當建太平之功而未聞致化之道蓋遠者難明請以近事徵之昔竇鄧之寵傾動四方兼官重紱盈金積貨至使議弄神器改更社稷豈不以勢尊威廣以致斯患乎及其破壞頭顙墯地願為孤豚豈可得哉夫致貴無漸失必暴受爵非道殃必疾今外戚寵幸功均造化漢元以來未有等比陛下誠仁恩周洽以親九族然祿去公室政移私門覆車重尋寧無摧折而朝臣在位莫肯正議翕翕訾訾更相佐附臣恐威權外假歸之良難虎翼一奮卒不可制故孔子曰吐珠于澤誰能不含老子稱國之利器不可以示人此最安危之極戒社稷之深計也夫儉德之恭政存約節故文帝愛百金于露臺飾帷帳於皂囊或有譏其儉者上曰朕為天下守財耳豈得妄用之哉至倉穀腐而不可食錢貫朽而不可校今自初政已來日月未久費用賞賜已不可算斂天下之財積無功之家帑藏單盡民物雕傷卒有不虞復當重賦百姓怨叛既生危亂可待也昔成王之政周公在前邵公在後畢公在左史佚在右四子挾而維之目見正容耳聞正言一日即位天下曠然言其法度素定也今陛下有成王之尊而無數子之佐雖欲崇雍熙致太平其可得乎自去年已來災譴頻數地坼天崩高岸為谷修身恐懼則轉禍為福輕慢天戒則其害彌深願陛下親自勞恤研精致思勉求忠貞之臣誅遠佞諂之黨捐玉堂之盛尊天爵之重割情欲之歡罷宴私之好帝王圖籍陳列左右心存亡國所以失之鑒觀興王所以得之庶災害可息豐年可招矣見後漢翟酺傳又上事孝文帝連上書囊以為帳惡聞紈素之聲也見北堂書鈔一百三十二引益部耆舊傳又見御覽六百九十九上奏陳圖書之意漢四百年將有弱主閉門聽難之禍數在三百年之閒宜升曆改憲行先王至德要道奉率時禁抑損奢侈宣明質朴以延四百年之難見後漢翟酺傳注引益部耆舊傳上言宜修繕太學孝文皇帝始置一經博士武帝大合天下之書而孝宣論六經于石渠學者滋盛弟子萬數光武初興愍其荒廢起太學博士舍內外講堂諸生橫巷為海內所集明帝時辟雍始成欲毀太學太尉趙熹以為太學辟雍皆宜兼存故竝傳至今而頃者頽廢至為園採芻牧之處宜更修繕誘進後學見後漢翟酺傳假名上鄧太后書謝減死臣孤恩負義自陷重刑情斷意訖無所復望廷尉鞠遣歐刀在前棺絮在後魂魄飛揚形容已枯陛下聖澤以臣嘗在近密識臣狀貌傷臣眼目留心曲慮特加遍覆喪車復還白骨更肉披棺發椁起見白日天地父母能生臣俊不能使臣俊當死復生陛下德過天地恩重父母誠非臣俊破碎骸骨舉宗腐爛所報萬一臣俊徒也不得上書不勝去死就生驚喜踊躍觸冒拜章見後漢袁安附傳又見藝文類聚五十四上書諫封梁冀子弟及中常侍等古之明君皆以用賢賞罰為務失國之主其朝豈無貞幹之臣典誥之篇哉患得賢不用其謀韜書不施其教聞善不信其義聽讒不詳其理也昔桀紂之時非無先王之書折中之臣然下愚難移卒以亡國已然之鑒也陛下越從蕃王龍飛即位應天順人萬夫側望不急忠賢之賞而先左右之封傷善害德讒諛暴興大將軍梁冀兄弟姦邪傾動天下皆有正卯之惡未被兩觀之誅而橫見式敘各受封爵天下惆悵人神共憤非所為賞必當功罰必有罪也夫有功而不賞則為善失其望姦回而不詰則為惡肆其凶故陳斧鉞而民不畏刑班爵位而人不樂善苟遂斯道非徒傷治殄民為亂而已至于喪身滅國可不慎哉見袁宏後漢紀二十一又略見後漢杜喬傳樂成王萇罪議非聖人不能無過故王侯世子生為立賢師傅以訓導之所以目不見惡耳不聞非能保其社稷高明令終萇少長藩國內無過庭之訓外無師傅之導血氣方剛卒受榮爵幾微生過遂陷不義臣聞周官議親蠢愚見赦萇不殺無辜以譴訶為非無赫赫大惡可裁削奪損其租賦令得改過自新革心向道見袁宏後漢紀十六用甲寅元議太初過天日一度弦望失正月以晦見西方食不與天相應元和改從四分四分雖密于太初復不正皆不可用甲寅元與天相應合圖讖可施行見續漢律曆志中奏駁陳忠言屯役者得歸葬送孝文皇帝約禮之制光武帝絶告寧之典貽則萬世誠不可改宜復建武故事見後漢陳忠傳奏駁質堪言太官宜兩梁冠太官職在鼎俎不列陛位堪欲令比大夫兩梁冠不宜許見續漢輿服志下注補引荀綽晉百官表注仍用四分曆議即用甲寅元當除元命苞天地開闢獲麟中百一十四歲推閏月六直其日或朔晦弦望二十四氣宿度不相應者非一用九道為朔月有比三大二小皆疏遠元和變曆以應保乾圖三百歲斗曆改憲之文四分曆本起圖讖最得其正不宜易見續漢律曆志中上書陳西域三策臣在京師亦以為西域宜棄今親踐其土地乃知棄西域則河西不能自存謹陳西域三策今北虜呼衍王等展轉蒲類秦海左右可發張掖酒泉屬國之吏士義從合三千五百人集崑崙塞先擊呼衍王絶其根本因發鄯善兵五千人脅車師後部此上計也若不能出兵可置軍司馬將士五百人四郡供其穀食山據柳中此中計也如亦不能則棄交河城收鄯善等悉使入塞此下計也見袁宏後漢紀十七延光二年又見後漢西域傳少篇首三十六字請監軍疏夫勢得容姦伯夷可疑不得容姦盜跖可信樂羊伐中山反而語功文侯示以謗書一篋願請中常侍一人監軍財費見袁宏後漢紀二十二又見後漢馮緄傳轉河南尹上言舊典中官子弟不得為牧人職見後漢馮緄傳嵩高山開母廟石闕銘潁川郡陽城縣開母廟興治神道闕時太守杜陵朱寵丞零陵泉陵嶭政五官掾陰林戶曹史夏效監掾陳修長西河圜陽馮寶丞漢陽冀祕俊廷掾趙穆戶曹史張詩將作掾嚴壽佐左福範防百川柏鯀稱遂其原洪泉浩浩下民震驚禹功疏河寫玄九山甄旅絑文爰納塗山辛癸之閒三過匪人實勤斯民同心濟溢胥建三正杞繒派替又遭亂秦聖漢禋享于茲馮神翩彼飛雉其庭貞祥符瑞靈支梃生出化陰陽穆清興雲降雨寧守一不歇比性乾坤福祿來返相宥我君千秋萬祀子子孫孫表碣銘功昭視後昆延光二年重曰而作𠪮德洋溢而漙優政則文耀以消㨱雍皇極正而降休潁芬滋楙于圃疇蘭木連理于芋條盛昨日新而纍熹而慕化咸來王而會朝清靜九域尐其修治祈福祀聖母呼山隅神來享而飴格釐我后以萬祺于胥樂而罔極永歷載而保之見碑舊拓本開母廟石闕敘漢侍中五官中郎將𨻳陵堂溪典伯并熹平四年來請雨嵩高廟典大君諱協字季度自為郡主簿作闕銘文後舉孝廉西鄂長早終敘曰于惟我君明允廣淵學兼游夏德配臧文歿而不巧實有立言其言惟何見碑舊拓本又略見趙明誠金石録
