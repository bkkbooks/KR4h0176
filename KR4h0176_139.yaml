body:
  text: 左雄上封事諫封山陽君及襄邑侯夫裂土封侯王制所重高皇帝約非劉氏不王非有功不侯孝安皇帝封江京王聖等遂致地震之異永建二年封陰謀之功又有日食之變數術之士咸歸咎于封爵今青州飢虛盜賊未息民有乏絶上求稟貸陛下乾乾勞思以濟民為務宜循古法寧靜無為以求天意以消災異誠不宜追録小恩虧失大典見後漢左雄傳又略見袁宏後漢紀十八復諫臣聞人君莫不好忠正而惡讒諛然而歷世之患莫不以忠正得罪讒諛蒙幸者蓋聽忠難從諛易也夫刑罪人情之所甚惡貴寵人情之所甚欲是以時俗為忠者少而習諛者多故令人主數聞其美稀知其過迷而不悟至于危亡臣伏見詔書顧念阿母舊德宿恩欲特加顯賞案尚書故事無乳母爵邑之制唯先帝時阿母王聖為野王君聖造生讒賊廢立之禍生為天下所咀嚼死為海內所歡快桀紂貴為天子而庸僕羞與為比者以其無義也夷齊賤為匹夫而王侯爭與為伍者以其有德也今阿母躬蹈約儉以身率下群僚蒸庶莫不向風而與王聖竝同爵號懼違本操失其常願臣愚以為凡人之心理不相遠其所不安古今一也百姓深懲王聖傾覆之禍民萌之命危于纍卵常懼時世復有此類怵惕之念未離于心恐懼之言未絶於口乞如前議歲以千萬給奉阿母內足以盡恩愛之歡外可不為吏民所怪梁冀之封事非機急宜過災厄之運然後平議可否見後漢左雄傳又見袁宏後漢紀十九復上疏諫先帝封野王君漢陽地震今封山陽君而京城復震專政在陰其災尤大臣前後瞽言封爵至重王者可私人以財不可以官宜還阿母之封以塞災異今冀已高讓山陽君亦宜崇其本節見後漢左雄傳上疏陳事臣聞柔遠和邇莫大寧人寧人之務莫重用賢用賢之道必存考黜是以皋陶對禹貴在知人安人則惠黎民懷之昔三代垂統分伯建侯代位親民民用和穆禮讓以興故詩云有淹淒淒興雨祁祁雨我公田遂及我私及幽厲昏亂不自為政褒豔用權七子黨進賢愚錯緒深谷為陵故其詩云四國無政不用其良又曰哀今之人胡為虺蜴言人畏吏如虺蜴也宗周既滅六國并秦坑儒泯典剗革五等更立郡縣縣設令長郡置守尉什伍相司封豕其民大漢受命雖未復古然克慎庶官蠲苛救敝悅以濟難撫而循之至于文景天下康乂誠由玄靖寬柔克慎官人故也降及宣帝興于仄陋綜核名實知時所病刺史守相輒親引見考察言行信賞必罰帝乃歎曰民所以安而無怨者政平吏良也與我共此者其唯良二千石乎以為吏數變易則下不安業久于其事則民服教化其有政理者輒以璽書勉勵增秩賜金或爵至關內侯公卿缺則以次用之是以吏稱其職人安其業漢世良吏于茲為盛故能降來儀之瑞建中興之功漢初至今三百餘載俗浸雕敝巧僞滋萌下飾其詐上肆其殘典城百里轉動無常各懷一切莫慮長久謂殺害不辜為威風聚斂整辨為賢能以理己安民為劣弱以奉法循理為不化髡鉗之戮生于睚眥覆尸之禍成于喜怒視民如寇讎稅之如豺虎監司項背相望與同疾疢見非不舉聞惡不察觀政于亭傳責成于期月言善不稱德論功不據實虛誕者獲譽拘檢者離毀或因罪而引高或色斯以求名州宰不覆競共辟召踴躍升騰超等踰匹或考奏捕案而亡不受罪會赦行賂復見洗滌朱紫同色清濁不分故使姦猾枉濫輕忽去就拜除如流缺動百數鄉官部吏職斯祿薄車馬衣服一出于民廉者取足貪者充家特選橫調紛紛不絶送迎煩費損政傷民和氣未洽災眚不消咎皆在此今之墨綬猶古之諸侯拜爵王庭輿服有庸而齊于匹豎叛命避負非所以崇憲明理惠育元元也臣愚以為守相長吏惠和有顯效者可就增秩勿使移徙非父母喪不得去官其不從法禁不式王命錮之終身雖會赦令不得齒列若被劾奏亡不就法者徙家邊郡以懲其後鄉部親民之吏皆用儒生清白任從政者寬其負算增其秩祿吏職滿歲宰府州郡乃得辟舉如此威福之路塞虛僞之端絶送迎之役損賦斂之源息循理之吏得成其化率土之民各寧其所追配文宣中興之軌流光垂祚永世不刊見後漢左雄傳又袁宏後漢紀十八與此小異上疏言寇賊寇賊連年死亡大半一人犯法舉宗群亡宜及其尚微開令改悔若告黨與者聽除其罪能誅斬者明加其賞見後漢左雄傳雄與僕射郭虔其上疏云云書奏不省上言察舉孝廉郡國孝廉古之貢七出則宰民宣協風教若其面牆則無以施化招災致禍為害不細孔子曰四十不惑禮四十彊而仕請自今孝廉年不滿四十不得察舉皆先詣公府諸生試家法文吏試箋奏覆之端門練其虛實以觀異能以美風俗有不承科令者正其罪法若有茂才異行自可不拘年齒見袁宏後漢紀十八又見後漢左雄傳上言諫捶撲九卿九卿位亞三事班在大臣行有佩玉之節動有庠序之儀加以鞭杖誠非古典見袁宏後漢紀十八又後漢左雄傳作孝明皇帝始有撲罰皆非古典對策問旱災臣聞易稱天尊地卑乾坤定矣二儀交構乃生萬物萬物之中以人為貴故聖人養之以君成之以化順四節之宜適陰陽之和使男女婚娶不過其時包之以仁恩導之以德教示之以災異訓之以嘉祥此先聖承乾養物之始也夫陰陽閉隔則二氣否塞二氣否塞則人物不昌人物不昌則風雨不時風雨不時則水旱成災陛下處唐虞之位未行堯舜之政近廢文帝光武之法而循亡秦奢侈之欲內積怨女外有曠夫今皇嗣不興東宮未立傷和逆理斷絶人倫之所致也非但陛下行此而已豎宦之人亦復虛以形藝威侮良家取女閉之至有白首歿無配偶逆于天心昔武王入殷出傾宮之女成湯遭災以六事剋己魯僖遇旱而自責祈雨皆以精誠轉禍為福自枯旱以來彌歷年歲未聞陛下改過之效徒勞至尊暴露風塵誠無益也又下州郡祈神致請昔齊有大旱景公欲祀河伯晏子諫曰不可夫河伯以水為城國魚鱉為民庶水盡魚枯豈不欲雨自是不能致也陛下所行但務其華不尋其實猶緣木求魚卻行求前誠宜推信革政崇道變惑出後宮不御之女理天下冤枉之獄除大官重膳之費夫五品不訓責在司徒有非其位宜急黜斥臣自藩外擢典納言學薄智淺不足以對易傳曰陽感天不旋日惟陛下留神裁察見後漢周舉傳又對問得失宜慎官人去斥貪汙離遠佞邪循文帝之儉尊孝明之教則時雨必應見後漢周舉傳召見舉及尚書令成翊世僕射黃瓊問以得失舉等竝對又獨對臣從下州超備機密不足以別群臣然公卿大臣數有直言者忠貞也阿諛苟容者佞邪也司徒視事六年未聞有忠言異謀愚心在此見後漢周傳對詔問加諡北鄉侯昔周公有請命之應隆太平之功故皇天動威以章聖德北鄉侯本非正統姦臣所立立不踰歲年號未改皇天不祐大命夭昏春秋王子猛不書崩魯子野不書葬今北鄉侯無它功德以王禮葬之于事已崇不宜稱諡災眚之來弗由此也見後漢周舉傳北鄉本非正統奸臣所擾立未踰載年號未改孔子作春秋王子猛不稱崩魯子野不書葬昔周公有請命之功太平之勳故薨之日天勳威以彰其德故成王以王者禮葬之以應天命北鄉侯無他功德恐非所以應天消災北鄉本侯也已加王禮于禮已崇不宜追加尊諡見通典八十多出本傳四語對詔問變眚陛下初即位遵修舊典興化致政遠近肅然頃年以來稍違于前朝多寵幸祿不原德府藏空匱有瓦解之心觀天察人方古準今誠可危懼書曰僣恆暘若夫僣差無度則言不從而下不治陽無以制則上擾下竭宜密嚴敕州郡察強豪大姦以時擒討見袁宏後漢紀十九漢安元年又見後漢周舉傳少二語為司徒朱倀創草變異表臣聞易曰天垂象見吉凶觀乎天文以察時變臣竊見九月庚辰今月丙辰過熒惑于東井辟金光輝合并移時乃出經術淺末不曉天官見其非常昭昭再見臣切怪之誠悶憤夫月者太陰熒惑火星不宜相干臣聞盛德之主不能無異但當變改有以供御孔子曰雖明天子熒惑必謀禍福之徵慎察用之孝宣皇帝地節元年月蝕熒惑明年有霍氏亂孔子曰火上不可握熒惑班變不可息志帝應其修無極此言熒惑火精尢史家所宜察也楚莊曰災異不見寡人其亡今變異屢臻此天以佑助漢室覺悟國家也臣誠懼史官畏忌不敢極言惟陛下深留聖思按圖書之文鑒古今之戒召見方直極言而靡諱親賢納忠推誠應人猶影響也宋景公有善言熒惑徙舍延年益壽況乎至尊感不旋日書曰天威棐諶言天德輔誠也周公將沒戒成王以左右常任準人綴衣虎賁言此五官存亡之機不可不謹也臣願陛下思周旦之言詳左右清禁之內謹供養之官嚴宿衛之身申敕屢省務知戒慎以退未萌以此無疆謹匍匐自力手書密上見風俗通五殤帝順帝昭穆議春秋魯閔公無子庶兄僖公代立其子文公遂躋僖于閔公上孔子譏之經書曰有事于太廟躋僖公傳曰逆祀也及定公正其序而下之孔子是之經曰從祀先公為萬世法也今殤帝在先于親為父順帝在後于親為子先後之義不可改昭穆之序不可亂呂勃議是也見袁宏後漢紀十九又後漢周舉傳移書介子推廟春中去火寒食一月老小不堪殘損民命非賢者之意今則三日而已見引汝南先賢傳奏請條案禮儀孝安皇帝聖德明茂早棄天下陛下正統當奉宗廟而姦臣交構遂令陛下龍潛蕃國群僚遠近莫不失望天命有常北鄉不永漢德盛明福祚孔章近臣建策左右扶翼內外同心稽合神明陛下踐祚奉遵鴻緒為郊廟主承續祖宗無窮之烈上當天心下厭民望而即位倉卒典章多缺請條案禮儀分別具奏見後漢順紀與越騎校尉劉千秋書漢家禮儀叔孫通等所草創皆隨律令在理官藏于几閣無紀録者久令二代之業暗而不彰誠宜撰次依擬周禮定位分職各有條序令人無愚智入朝不惑君以公族元老正丁其任焉可以已見續漢百官志一注引胡廣注漢官篇遣矯仲彥書仲彥足下勤處隱約雖乘雲行泥棲宿不同每有西風何嘗不歎蓋聞黃老之言乘虛入冥藏身遠遁亦有理國養人施于為政至如登山絶跡神不著其證人不睹其驗吾欲先生從其可者于意何如昔伊尹不懷道以待堯舜之君方今明明四海開闢巢許無為箕山夷齊悔入首陽足下審能騎龍弄鳳翔嬉雲閒者亦非狐兔燕雀所敢謀也見後漢矯慎傳又見高士傳下辭郡守召明府欲臣欣邪友欣邪師欣邪明府所以尊寵人者極于功曹所以榮祿人者已于孝廉一極一已皆欣所不用也見御覽五百八引皇甫謐高士傳
