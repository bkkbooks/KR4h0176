body:
  text: 陳龜上表仁恩廣被化流殊方使老者以壽終孤幼得保長年猶臨河轉石易于反掌見初學記七引謝承後漢書拜度遼將軍臨行上疏臣龜蒙恩纍世馳騁邊垂雖展鷹犬之用頓斃胡虜之庭魂骸不返薦享狐狸猶無以塞厚責答萬分也臣至頑駑器無鉛刀一割之用過受國恩榮秩兼優生年死日永懼不報臣聞三辰不軌擢士為相蠻夷不恭拔卒為將臣無文武之才而忝鷹揚之任上慚聖明下懼素餐雖歿軀體無所云補今西州邊鄙土地塉埆鞍馬為居射獵為業男寡耕稼之利女乏機杼之饒守塞候望懸命鋒鏑聞急長驅去不圖反自頃年以來胸奴數攻營郡殘殺長吏侮略良細戰夫身膏沙漠居人首係馬鞍或舉國掩戶盡種灰滅孤兒寡婦號哭空城野無青草室如懸磬雖含生氣實同枯朽往歲并州水雨災螟互生稼穡荒耗租更空闕老者慮不終年少壯懼於困厄陛下以百姓為子品庶以陛下為父焉可不日昃勞神垂撫循之恩哉唐堯親捨其子以禪虞舜者是欲民遭聖君不令遇惡主也故古公杖策其民五倍文王西伯天下歸之豈復輿金輦寶以為民惠乎近孝文皇帝感一女子之言除肉刑之法體德行仁為漢賢主陛下繼中興之統承光武之業臨朝聽政而未留聖意且牧守不良或出中官懼逆上旨取過目前呼嗟之聲招致災害胡虜凶悍因衰緣隙而令倉庫單于豺狼之口功業無銖兩之效皆由將帥不忠聚姦所致前涼州刺史祝良初除到州多所糾罰太守令長貶黜將半政未踰時功效卓然實應賞異以勸功能改任牧守去斥姦殘又宜更選胸奴烏桓護羌中郎將校尉簡練文武授之法令除并涼二州今年租更寬赦罪隸掃除更始則善吏知奉公之祐惡者覺營私之禍胡馬可不窺長城塞下無候望之患矣見後漢陳龜傳詣闕拜章臣聞天垂妖象地見災符所以譴告人主責躬修德使正機平衡流化興政也易內傳曰凡異所生各以其政變之則徐消之亦除伏惟陛下躬日昃之聽溫三省之勤思過念咎務消祇悔方今時俗奢佚淺恩夫救奢必于儉約拯薄無若敦厚安上理人莫善于禮修禮遵約蓋惟上興革文變薄事不在下故周南之德關睢政本本立道生風行草從澄其源者流清溷其本者未濁天地之道其猶鼓蘥以虛為德自近及遠者也伏見往年以來園陵數災炎光熾猛驚動神靈易天人應曰君子不思遵利茲謂無澤厥災孽火燒其宮又曰君高臺府犯陰侵厥災火又曰上不儉下不節炎火竝作燒君室自頃繕理西苑修復太學宮殿官府多所搆飾昔盤庾遷殷去奢即儉夏后卑室盡力玫美又魯人為長府閔子騫曰仍舊貫何必改作臣愚以為諸所繕修事可省減稟恤貧人賑膽孤寡此天之意也人之慶也人之本也儉之要也焉有應天養人為仁為儉而不降福者哉土者地祇陰性澄靜宜以施化之時敬而勿擾竊見正月以來陰暗連日易內傳曰久陰不雨亂氣也蒙之比也蒙者君臣上下相冒亂也又曰賢德不用厥異常陰夫賢者化之本雲者雨之具也得賢而不用猶久陰而不雨也又頃前數日寒過其節水既解釋還復凝合夫寒往則暑來暑往則寒來此言日月相推寒暑相避以成物也今立春之後火卦用事當溫而寒違反時節由功賞不至而刑罰必加也宜須占秋順氣行罰臣伏案飛侯參察衆政以為立夏之後當有震裂涌水害之又比熒惑失度盈縮往來涉歷輿鬼環繞軒轅火精南方夏之政也政有失禮不從夏令則熒惑失行正月三日至乎九日三公卦也三公上應台階下同元首政失其道則寒陰反節節彼南山詠自周詩股肱良哉著于虞典而今之在位競託高虛納纍鍾之奉忘天下之憂棲遲偃仰寢疾自逸被策文得賜錢即復起矣何疾之易而愈之速以此消伏災眚興致升平其可得乎今選舉牧守委任三府長吏不良既咎州郡州郡有失豈得不歸責舉者而陛下崇之彌優自下慢事愈甚所謂大網疏小綱數三公非臣之仇臣非狂夫之作所謂發憤忘食懇懇不已者誠念朝廷欲致興平非不能面譽也臣生長草野不曉禁忌披露肝膽書不擇言伏鑕鼎鑊死不敢恨謹詣闕奉章伏待重誅見後漢郎顗傳臣聞天垂誡地見災異所以譴告人主克己修德也故應天以誠而不以言導下以躬而不以刑頃者宮殿官府多所治飾昔盤庚遷殷去奢即儉夏后卑宮盡力以致美愚以為諸所繕治事可滅省以恤貧民以賑孤寡天之意也人之願也陛下躬親庶事詔書每下廣開不諱之路以天下為憂百姓為念而不數見公卿責以政事誠優游養德之道也然三公者調和陰陽儀刑百寮今水旱連年五穀不登不能憂也官失其序庶事不治不能正也但遲回偃仰稱病自逸忘天下之憂甘宴安之樂豈不謬哉見袁宏後漢紀十八對狀尚書條便宜七事臣聞明王聖主好聞其過忠臣孝子言無隱情臣備生人倫視聽之類而稟性愚愨不識忌諱故出死忘命懇懇重言誠欲陛下修乾坤之德開日月之明披圖籍案經典覽帝王之務識先後之政如有闕遺退而自改本文武之業擬堯舜之道攘災延慶號令天下此誠臣顗區區之願夙夜夢寐盡心所計謹條序前章畼其上趣條便宜七事具如狀對一事陵園至重聖神攸馮而災火炎赫迫近寢殿魂如有靈猶將驚動尋宮殿官府近始永平歲時未積便更修造又西苑之設禽畜是處離房別觀本不常居而皆務精土木營建無已消功單賄巨億為計易內傳曰人君奢侈多飾宮室其時旱其災火是故魯僖遭旱修政自敕下鐘鼓之縣休繕治之官雖則不寧而時雨自降由此言之天之應人敏于影響今月十七日戊午徵日也日加申風從寅來丑時而止丑寅申皆徵也不有火災必當為旱願陛下校計繕修之費永念百姓之勞罷將作之官減雕文之飾損庖廚之饌退宴私之樂易中孚傳曰陽感天不旋日如是則景雲降集眚沴息矣二事去年以來兌卦用事類多不效易傳曰有貌無實佞人也有實無貌道人也寒溫為實清濁為貌今三公皆令色足恭外厲內荏以虛事上無佐國之實故清濁效而寒溫不效也是以陰寒侵犯消息占曰日乘則有妖風日蒙則有地裂如是三年則致日食陰侵其陽漸積所致立春前後溫氣應節者詔令寬也其後復寒者無寬之實也夫十室之邑必有忠信率土之人豈無貞賢未聞朝廷有所賞拔非所以求善贊務弘濟元元宜採納良臣以助聖化三事臣聞天道不遠三五復反今年少陽之歲法當乘起恐後年已往將遂驚動涉歷天門災成戊己今春當旱夏必有水臣以六日七分候之可知夫災眚之來緣類而應行有玷缺則氣逆于天精感變出以戒人君王者之義時有不登則損滋徹膳數年以來穀收稍減家貧戶饉歲不如昔百姓不足君誰與足水旱之災雖尚未至然君子遠覽防微慮萌老子曰人之飢也以其上食稅之多也故孝文皇帝綈袍革舄木器無文約身薄賦時致升平今陛下聖德中興宜遵前典惟節惟約天下幸甚易曰天道無親常與善人是故高宗以享福宋景以延年四事臣竊見皇子未立儲宮無主仰觀天文太子不明熒惑以去年春分後十六日在婁五度推步三統熒惑今當在翼九度今反在柳三度則不及五十餘度去年八月二十四日戊辰熒惑歷輿鬼東入軒轅出后星北東去四度北旋復還軒轅者後宮也熒惑者至陽之精也天之使也而出入軒轅繞還往來易曰天垂象見吉凶其意昭然可見矣禮天子一娶九女嫡媵畢具今宮人侍御動以千計或生而幽隔人道不通鬱積之氣上感皇天故遣熒惑入軒轅理人倫垂象見異以悟主上昔武王下車出傾宮之女表商容之閭以理人倫以表賢德故天授以聖子成王是也今陛下多積宮人以違天意故皇胤多夭嗣體莫寄詩云敬天之怒不敢戲豫方今之福莫若廣嗣廣嗣之術可不深思宜簡出宮女恣其姻嫁則天自降福子孫千億惟陛下丁寧再三留神于此左右貴幸亦宜惟臣之言以悟陛下蓋善言古者合于今善言天者合于人願訪問百僚有違臣言者臣當受苟言之罪五事臣竊見去年閏月十七日己丑夜有白氣從西方天苑趨左足入玉井數日乃滅春秋曰有星孛于大辰大辰者何大火也大火為大辰罰又為大辰北極亦為大辰所以孛一宿而連三宿者言北辰王者之宮也凡宮中無節政教亂逆威武衰微則此三星以應之也罰者白虎其宿主兵其國趙魏變見西方亦應三輔凡金氣為變發在秋節臣恐立秋以後趙魏關西將有羌寇畔戾之患宜豫宣告諸郡使敬授人時輕徭役薄賦斂勿妄繕起堅倉獄備守衛回選賢能以鎮撫之金精之變責歸上司宜以五月丙午遣大尉服干戚建井旟書玉板之策引白氣之異于西郊責躬求愆謝咎皇天消滅妖氣蓋以火勝金轉禍為福也六事臣竊見今月十四日乙卯巳時白虹貫日凡日傍氣色白而純者名為虹貫日中者侵太陽也見於春者政變常也方今中官外司各各考事其所考者或非急務又恭陵火災主名未立多所收捕備經考毒尋火為天戒以悟人君可順而不可違可敬而不可慢陛下宜恭己內省以備後災凡諸考案並須立秋又易傳曰公能其事序賢進士後必有喜反之則白虹貫日以甲乙見者則譴在中台自司徒居位陰陽多謬久無虛己進賢之策天下興議異人同咨且立春以來金氣再見金能勝木必有兵氣宜黜司徒以應天意陛下不早攘之將負臣言遺患百姓七事臣伏惟漢興以來三百三十九歲于詩三基高祖起亥仲二年今在戌仲十年詩泛歷樞曰卯酉為革政午亥為革命神在天門出入候聽言神在戌亥司候帝王興衰得失厥善則昌厥惡則亡于易雄雌祕曆今值困乏凡九二困者衆小人欲共困害君子也經曰困而不失其所其唯君子乎唯獨賢聖之君遭困遇險能致命遂志不去其道陛下乃者潛龍養德幽隱屈厄即位之元紫宮驚動曆運之會時氣已應然猶恐妖祥未盡君子思患而豫防之臣以為戌仲已竟來年入季文帝改法除肉刑之罪至今適三百載宜因斯際大蠲法令官名稱號輿服器械事有所更變大為小去奢就儉機衡之政除煩為簡改元更始招求幽隱舉方正徵有道博採異謀開不諱之路臣陳引際會恐犯忌諱書不盡言未敢究暢見後漢郎顗傳臺詰對臺詰顗曰對云白虹貫日政變常也朝廷率由舊章何所變易而言變常又言當大蠲法令革易官號或云變常以致災或改舊以除異何也又陽嘉初建復欲改元據何經典其以實對顗對曰方春東作布德之元氣陽開發養導萬物王者因天視聽奉順時氣宜務崇溫柔遵其行令而今立春之後考事不息秋冬之政行乎春夏故白虹春見掩蔽日曜凡邪氣乘陽則虹霓在日斯皆臣下執事刻急所致殆非朝廷優寬之本此其變常之咎也又今選舉皆歸三司非有周召之才而當則哲之重每有選用輒參之掾屬公府門巷賓客填集送去迎來財貨無已其當遷者競相薦謁各遣子弟充塞道路開長姦門興致浮僞非所謂率由舊章也尚書職在機衡宮禁嚴密私曲之意羌不得通偏黨之恩或無所用選舉之任不如還在機密臣誠愚戇不知折中斯固遠近之論當今之宜又孔子曰漢三百載斗曆改憲三百四歲為一德五德千五百歲五行更用王者隨天譬猶自春徂夏改青服絳者也自文帝省刑適三百年而輕微之禁漸已殷積王者之法譬猶江河當使易避而難犯也故易曰易則易知簡則易從易簡而天下之理得矣今去奢即儉以先天下改易名號隨事稱謂易曰君子之道或出或入同歸殊塗一致百慮易變常而善可以除災變常而惡必致于異今年仲竟來年入季仲終季始曆運變改故可改元所以順天道也臣顗愚蔽不足以答聖問見後漢郎顗傳上書薦黃瓊李固復條便宜四事臣前對七事要政急務宜于今者所當施用誠知愚淺不合聖聽人賤言廢當受誅罰怔營惶怖靡知厝身臣聞刳舟剡楫將欲濟江海也聘賢選佐將以安天下也昔唐堯在上群龍為用文武創德周召作輔是以能建天地之功增日月之耀者也詩云赫赫王命仲山甫將之邦國若否仲山甫明之宣王是賴以致雍熙陛下踐祚以來勤心政而三九之位未見其人是以災害屢臻四國未寧臣考之國典驗之聞見莫不以得賢為功失士為敗且賢者出處翔而後集爵以進德則其情不苟然後使君子恥貧賤而樂富貴矣若有德不報有言不酬來無所樂進無所趨則皆懷歸藪澤修其故志矣夫求賢者上以承天下以為人不用之則逆天統違人望逆天統則災眚降違人望則化不行災眚降則下呼嗟化不行則君道虧四始之缺五際之厄其咎由此豈可不剛健篤實矜矜栗栗以守天功盛德大業乎臣伏見光祿大夫江夏黃瓊耽道樂術清亮自然被褐懷寶含味經籍又果于從政明達變復朝廷前加優寵賓于上位瓊入朝日淺謨謀未就因以喪病致命遂志老子曰大音希聲大器晚成善人為國三年乃立天下莫不嘉朝廷有此良人而復怪其不時還任陛下宜加隆崇之恩極養賢之禮徵反京師以慰天下又處士漢中李固年四十通游夏之藝履顏閔之仁潔白之節情同皎日忠貞之操好是正直卓冠古人當世莫及元精所生王之佐臣天之生固必為聖漢宜蒙特徵以示四方夫有出倫之才不應限以官次昔顏子十八天下歸仁子奇稚齒化阿有聲若還瓊徵固任以時政伊尹傅說不足為比則可垂景光致休祥矣臣顗明不知人伏聽衆言百姓所歸臧否共歎願問百僚核其名行有一不合則臣為欺國惟留聖神不以人廢言謹復條便宜四事附奏于左一事孔子作春秋書正月者敬歲之始也王者則天之象因時之序宜開發德號爵賢命士流寬大之澤垂仁厚之德順助元氣含養庶類如此則天文昭爛星辰顯列五緯循軌四時和睦不則太陽不光天地溷濁時氣錯逆霾霧蔽日自立春以來纍經旬朔未見仁德有所施布但聞罪罰考掠之聲夫天之應人疾於影響而自從入歲常有蒙氣月不舒光日不宣曜日者太陽以象人君政變於下日應于天清濁之占隨政抑揚天之見異事無虛作豈獨陛下倦於萬機帷幄之政有所闕歟何天戒之數見也臣願陛下發揚乾剛援引賢能勤求機衡之寄以獲斷金之利臣之所陳輒以太陽為先者明其不可久暗急當改正其異雖微其事甚重臣言雖約其旨甚廣惟陛下乃眷臣章深留明思二事孔子曰靁之始發大壯始君弱臣彊從解起今月九日至十四日大壯用事消息之卦也于此六日之中雷當發聲發聲則歲氣和王道興也易曰雷出地奮豫先王以作樂崇德殷薦之上帝靁者所以開發萌牙辟陰除害萬物須雷而解資雨而潤故經曰靁以動之雨以潤之王者崇寬大順春令則靁應節不則發動于冬當震反潛故易傳曰當雷不雷太陽弱也今蒙氣不除日月變色則其效也天網恢恢疏而不失隨時進退應政得失大人者與天地合其德與日月合其明璇璣動作與天相應雷者號令其德生養號令始廢當生而殺則靁反作其時無歲陛下若欲除災昭祉順天致和宜察臣下尢酷害者亟加斥黜以安黎元則太皓悅和雷聲乃發三事去年十月二十日癸亥太白與歲星合于房心太白在北歲星在南相離數寸光芒交接房心者天地明堂布政之宮孝經鉤命決曰歲星守心年穀豐登尚書洪範記曰月行中道移節應期德厚受福重華留之重華者謂歲星在心也今太白從之交合明堂金木相賊而反同合此以陰陵陽臣下專權之異也房心東方其國主宋石氏經曰歲星出左有年出右無年今金木居東歲星在南是為出右恐年穀不成宋人飢也陛下宜審詳明堂布政之務然後妖異可消五緯順序矣四事易傳曰陽無德則旱陰僭陽亦旱陽無德者人君恩澤不施于人也陰僭陽者祿去公室臣下專權也自冬涉春訖無嘉澤數有西風反逆時節朝廷勞心廣為禱祈薦祭山川暴龍移市臣聞皇天感物不為僞動災變應人要在責己若令雨可請降水可攘止則歲無隔并太平可待然而災害不息者患不在此也立春以來未見朝廷賞録有功表顯有德存問孤寡賑恤貧弱而但見洛陽都官奔車東西收繫纖介牢獄充盈臣聞恭陵火處比有光曜明此天災非人之咎丁丑大風掩蔽天地風者號令天之威怒皆所以感悟人君忠厚之戒又連月無雨將害粟麥若一穀不登則飢者十三四矣陛下誠宜廣被恩澤貸贍元元昔堯遭九年之水人有十載之蓄者簡稅防災為其方也願陛下早宣德澤以應天功若臣言不用朝政不改者立夏之後乃有澍雨于今之際未可望也若政變于朝而天不雨則臣為誣上愚不知量分當鼎鑊見後漢郎顗傳
