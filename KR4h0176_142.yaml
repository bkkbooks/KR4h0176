body:
  text: 邊韶塞賦並序豫離群索居無講誦之事欲學無友欲農無耒欲奕無局欲博無楮問何以代博奕者乎曰塞其次也試習其術以驚睡救寐免晝寢之譏而已然而徐核其因通之習乃亦精妙而足美也故書其較略舉其指歸以明博奕無以尚焉曰始作塞者其明哲乎故其用物也約其為樂也大猶土鼓塊枹空桑之瑟質朴之化上古所耽也然本其規模制作有式四道交正時之則也棋有十二律呂極也人操厥半六爻列也赤白色者分陰陽也乍亡乍存像日月也行必正直合道中也趨隅方折禮之容也迭往迭來剛柔通也周則復始乾行健也局平以正坤德順也然則塞之為義盛矣大矣廣矣博矣質象于天陰陽在焉取則于地剛柔分焉施之于人仁義載焉考之古今王霸備焉覽其成敗為法式焉見藝文類聚七十四御覽七百五十四上言四分曆之失世微于數虧道盛于得常數虧則物衰得常則國昌孝武皇帝攄發聖思因元封七年十一月甲子朔旦冬至乃詔太史令司馬遷治曆鄧平等更建太初改元易朔行夏之正乾鑿度八十一分之四十三為日法設清臺之候驗六異課效粗密太初為最其後劉歆研幾極深驗之春秋參以易道以河圖帝覽嬉雒書乾曜度推廣九道百七十一歲進退六十三分百四十四歲一超次與天相應少有闕謬從太初至永平十一年百七十一歲進退餘分六十三治曆者不知處之推得十二度弦望不效挾廢術者得竄其說至元和二年小終之數浸過餘分稍增月不用晦朔而先見孝章皇帝以保乾圖三百年斗曆改憲就用四分以太白復樞甲子為癸亥引天從算耦之目前更以庚申為元既無明文託之于獲麟之歲又不與感精符單閼之歲同史官相代因成習疑少能鉤深致遠按弦望足以知之見續漢律曆志中對嘲弟子私嘲之曰邊孝先腹便便懶讀書但欲眠韶潛聞之應時對曰邊為姓孝為字腹便便五經笥但欲眠思經事寐與周公通夢靜與孔子同意師而可嘲出何典記見後漢邊韶傳河激頌惟陽嘉三年二月丁丑使河隄謁者王誨疏達河川遹荒庶土往大河衝塞侵齧金隄以竹籠石葺土而為堨壞隤無已功消億萬請以濱河郡徒疏山釆石壘以為障功業既就徭役用息辛未詔書許誨立功府卿規基經始詔策加命遷在沇州乃簡朱軒授使司馬登令纘茂前緒稱遂休功登以伊洛合注大河南則緣山東過大伾回流北岸其勢鬱懞濤怒湍急淚疾一有決溢彌原淹野蟻孔之變害起不測蓋自姬氏之所常蹙昔崇鯀所不能治我二宗之所劬勞于是乃跋涉躬親經之營之比率百姓議之于臣伐石三谷水匠致治立激岸側以捍鴻波隨時慶賜說以勸之山川無滯越水土通演役未踰年而功程有畢斯乃元勳之嘉課上德之宏表也昔禹修九道書録其功后稷躬稼詩列于雅夫不憚勞謙之勤夙興厥職充國惠民安得淹湮沒而不章焉故遂刊石記功垂示于後其辭云云使河隄謁者山陽東緡司馬登字伯志代東萊曲成王誨字孟堅河內太守宋城向豹字伯尹丞汝南鄧方字德山懷令劉丞字季意河隄掾匠等造陳留浚儀邊詔字孝先頌見水經七濟水注老子銘老子姓李字伯陽楚相縣人也春秋之後周分為二稱東西君晉六卿專征與齊楚竝僭號為王以大并小相縣虛荒今屬苦故城猶在在賴鄉之東濄水處其陽其土地鬱塕高敞宜生有德君子焉老子周守臧室史當幽王時三川實震以夏殷之季陰陽之事鑒喻時王孔子以周靈王二十年生到景王十年年十有七學禮于老聃計其年紀聃時已二百餘歲聃然老旄之貌也孔子卒後百二十九年或謂周大史儋為老子莫知其所終其二篇之書稱天地所以能長且久者以不自生也厥初生民遺體相續其死生之義可知也或有浴神不死是謂玄牝之言由是世之好道者觸類而長之以老子離合于混沌之氣與三光為終始觀天作讖降什星隨日九變與時消息規矩三光四靈在旁存想丹田大一紫房道成身化蟬蛻渡世自羲農以來為聖者作師班固以老子絶聖棄知禮為亂首與仲尼道違述漢書古今人表檢以法度抑而下之老子與楚子而同科材不及孫卿孟軻二者之論殊矣所謂道不同不相為謀也延熹八年八月甲子皇上尚德弘道含閎光大存神養性意在淩雲是以潛心黃軒同符高宗夢見老子尊而祀之于時陳相邊韶典國之禮薄思淺不能測度至人辨是與非案據書籍以為老子生于周之末世玄虛守靜樂無名守不德危高官安下位遺孔子以仁言辟世而隱居變易姓名唯恐見知夫日以幽明為節月以虧盈自成損益衰之原倚伏禍福之門人道惡盈而好謙蓋老子勞不定國功不加民所以見隆崇于今為時人所享祀乃昔日逃祿處微損之又損之之餘胙也顯虛無之清家云先天地而生乃守真養壽獲五福之所致也敢演而銘之其辭曰于惟德抱虛守清樂居下位祿藝弗營為繩能直屈之可縈三川之對舒憤散逞陰不填陽孰能滯并見機而作需郊出垌肥遁之吉辟世隱聲見迫遺言道德之經譏時微喻尋顯推冥守一不失為天下正取厚不薄居時舍榮稽式為重金玉是輕絶嗜去欲還歸于嬰皓然歷載莫知其情頗違法言先民之程要以無為大用成進退無恆錯綜其貞以知為愚沖而不盈大人之度非凡所訂九等之敘何足纍名同光日月合之星出入丹廬上下黃庭背棄流俗舍景匿形苞元神化呼吸至精世不能原卬其永生天人秩祭以昭厥靈羡彼延期勒石是旌見隸釋三薦尚書僕射胡廣臣聞德以旌賢爵以建事明試以功典謨所美五服五章天秩所作是以臣竭其忠君豐其寵舉不失德下忘其死竊見尚書僕射胡廣體真履規謙虛溫雅博物洽聞探賾窮理六經典奧舊章憲式無所不覽柔而不犯文而有禮忠貞之性憂公如家不矜其能不伐其勞翼翼周慎行靡玷漏密勿夙夜十有餘年心不外顧志不苟進臣等竊以為廣在尚書劬勞日久後母年老既蒙簡照宜試職千里匡寧方國陳留近郡今太守任缺廣才略深茂堪能撥煩願以參選紀綱頽俗使束修守善有所勸仰見後漢胡廣傳慮渤海王為亂上封事臣聞帝王之于親戚愛雖隆必示之以威體雖貴必禁之以度如是和睦之道興骨肉之恩遂昔周襄王恣甘昭公孝景皇帝驕梁孝王而二弟階寵終用勃慢卒周有播蕩之禍漢有爰盎之變竊聞勃海王悝憑至親之屬恃偏私之愛失奉上之節有僭慢之心外聚剽輕不逞之徒內荒酒樂出入無常所與群居皆有口無行或家之棄子或朝之斥臣必有羊勝伍被之變州司不敢彈糾傅相不能匡輔陛下隆于友于不忍遏絶恐遂滋蔓為害彌大乞露臣奏宣示百僚使臣得于清朝明言其失然後詔公卿平處其法法決罪定乃下不忍之詔臣下固執然後少有所許如是則聖朝無傷親之譏勃海有享國之慶不然懼大獄將興使者相望于路矣臣職典禁兵備禦非常而妄知藩國干犯至戚罪不容誅不勝憤悶謹冒死以聞見後漢史弼傳又見袁宏後漢紀二十二無末後七語藍賦並序余就醫偃師道經陳留此境人皆以種藍染紺為業藍田彌望黍稷不植慨其遺本念末遂作賦曰見藝文類聚八十一御覽九百九十六大觀本草七同丘中之有麻似麥秀之油油見藝文類聚八十一與友書馬季長雖有名當世而不持士節三輔高士未曾以衣裾撇其門也見後漢趙岐傳注引三輔決録注遺令敕兄子大丈夫生世遁無箕山之操仕無伊呂之勳天不我與復何言哉可立一員石於吾墓前刻之曰漢有逸人姓趙名嘉有志無時命也奈何見後漢趙岐傳臨終敕其子我死之日墓中聚沙為床布簟白衣散髮其上覆以單被即日便下下便掩見御覽五百五十八引趙岐別傳三輔決録序三輔者本雍州之地世世徙公卿吏二千石及高資皆以陪諸陵五方之俗雜會非一國之風不但繫于詩秦豳也其士好高尚義貴于名行其俗失則趣勢進權唯利是視余以不才生于西土耳能聽而聞故老之言目能視而見衣冠之疇心能識而觀其賢愚常以玄冬夢黃髮之士姓玄名明子真與余寤言言必有中善否之閒無所依違命操筆者書之近從建武以來暨于斯今其人既亡行乃可書玉石朱紫由此定矣故謂之決録矣見後漢趙岐傳注孟子題辭孟子題辭者所以題號孟子之書本末指義文辭之表也孟姓也子者男子之通稱也此書孟子之所作也故總謂之孟子其篇目則各自有名孟子鄒人也名軻字則未聞也鄒本春秋邾子之國至孟子時改曰鄒矣國近魯後為魯所并又言邾為楚所并非魯也今鄒縣是也或曰孟子魯公族孟孫之後故孟子仕于齊喪母而歸葬于魯也三桓子孫既以衰微分適他國孟子生有淑質夙喪其父幼被慈母三遷之教長師孔子之孫子思治儒術之道通五經尤長于詩書周衰之未戰國縱橫用兵爭強以相侵奪當世取士務先權謀以為上賢先王大道陵遲隳廢異端竝起若楊朱墨翟放蕩之言以干時惑衆者非一孟子閔悼堯舜湯文周孔之業將遂湮微正塗壅底仁義荒怠佞僞馳騁紅紫亂朱于是則慕仲尼周流憂世遂以儒道遊于諸侯思濟斯民然由不肯枉尺直尋時君咸謂之迂闊于事終莫能聽納其說孟子亦自知遭蒼姬之訖録值炎劉之未奮進不得佐興唐虞雍熙之和退不能信三代之餘風恥沒世而無聞焉是故垂憲言以詒後人仲尼有云我欲託之空言不如載之行事之深切著明也于是退而論集所與高弟弟子公孫丑萬章之徒難疑答問又自撰其法度之言著書七篇二百六十一章三萬四千六百八十五字包羅天地揆敘萬類仁義道德性命禍福粲然靡所不載帝王公侯遵之則可以致隆平頌清廟卿大夫士蹈之則可以尊君父立忠信守志厲操者儀之則可以崇高節抗浮雲有風人之託物二雅之正言可謂直而不倨曲而不屈命世亞聖之大才者也孔子自衛反魯然後樂正雅頌各得其所乃刪詩定書擊周易作春秋孟子退自齊梁述堯舜之道而著作焉此大賢擬聖而作者也七十子之疇會集夫子所言以為論語論語者五經之錧六藝之喉襟也孟子之書則而象之衛靈公問陳于孔子孔子答以俎豆梁惠王問利國孟子對以仁義宋桓魋欲害孔子孔子稱天生德于豫魯臧倉毀鬲孟子孟子曰氏之子焉能使豫不遇哉旨意合同若此者衆又有外書四篇性善辨文說孝經為政其文不能弘深不與內篇相似似非孟子本真後世依放而託之者也孟子既沒之後大道遂絀逮至亡秦焚滅經術坑戮儒生孟子徒黨盡矣其書號為諸子故篇籍得不泯絶漢興除秦虐禁開延道德孝文皇帝欲廣遊學之路論語孝經孟子爾雅皆置博士後罷傳記博士獨立五經而已訖今諸經通義得引孟子以明事謂之博文孟子長于譬喻辭不迫切而意已獨至其言曰說詩者不以文害辭不以辭害志以意逆志為得之矣斯言殆欲使後人深求其意以解其文不但施于說詩也今諸解者往往托取而說之其說文又多乖異不同孟子以來五百餘載傳之者亦已衆多余生西京世尋丕祚有自來矣少蒙義方訓涉典文知命之際嬰戚于天遘屯離蹇詭姓遁身經營八紘之內十有餘年心勦形瘵何勤如焉嘗息肩弛擔于濟岱之閒或有溫故知新雅德君子矜我劬瘁眷我皓首訪論稽古慰以大道余困吝之中精神遐漂靡所濟集聊欲係志于翰墨得以亂思遺老也惟六籍之學先覺之士釋而辨之者既已詳矣儒家惟有孟子閎遠微妙縕奧難見宜在條理之科于是乃述已所聞證以經傳為之章句具載本文章別其指分為上下凡十四卷究而言之不敢以當達者施于新學可以寤疑辨惑愚亦未能審于是非後之明者見其違闕儻改而正諸不亦宜乎見孟子趙注宋本孟子篇敘孟子篇敘者言孟子七篇所以相次敘之意也孟子以為聖王之盛惟有堯舜堯舜之道仁義為上故以梁惠王問利國對以仁義為首篇也仁義根心然後可以大行其政故次之以公孫丑問管晏之政答以曾西之所羞也政莫美于反古之道滕文公樂反古故次以文公為世子始有從善思禮之心也奉禮之謂明明莫甚于離婁故次以離婁之明也明者當明其行行莫大于孝故次以萬章問舜往于田號泣也孝道之本在于情性故次以告子論情性也情性在內而主于心故次以盡心也盡己之心與天道通道之極者也是以終于盡心也篇所以七者天以七紀璿璣運度七政分離聖以布曜故法之也章所以二百六十有九者三時之日數也不敢比易當期之數故取其三時三時者成歲之要時故法之也三萬四千六百八十五字者可以行五常之道施七政之紀故法五七之數而不敢盈也文章多少擬其大數不必適等猶詩三百五篇論曰詩三百也章有大小分章賦篇篇趣五千以卒其文無所取法猶論四百八十六章章次大小各當其事亦無所法也蓋所以佐明六藝之文義崇宣先聖之指務王制拂邪之隱括立德立言之程式也洋洋浩浩具存乎斯文矣見曲阜孔氏刊本啓京兆尹左悺子弟來為虎牙非德選不足為特酤買宜隨中舍菜食而已見魏志閻溫傳注引魏略勇俠傳周髀算經序夫高而大者莫大于天厚而廣者莫廣于地體恢洪而廓落形修廣而幽清可以玄象課其進退然而宏達不可指掌也可以晷儀驗其長短然其巨闊不可度量也雖窮神知化不能極其妙探賾索隱不能盡其微是以詭異之說出則兩端之理生遂有渾天蓋天兼而竝之故能彌綸天地之道有以見天地之賾則渾天有靈憲之文蓋天有周髀之法纍代存之官司是掌所以欽若昊天恭授民時爽以暗蔽才學淺昧鄰高山之仰止慕景行之軌轍負薪餘日聊觀周髀其旨約而遠其言曲而中將恐廢替濡滯不通使談天者無所取則輒依經為圖誠冀頽毀重仞之牆披露堂室之奧庶博物君子時迥思焉見宋本周髀
