body:
  text: 田羽薦法真處士法真體兼四業學窮典奧幽居恬泊樂以忘憂將蹈老氏之高蹤不為玄纁屈也臣願聖朝就加袞職必能唱清廟之歌致來儀之鳳矣見後漢法真傳法真頌法真名可得聞身難得而見逃名而名我隨避名而名我追可謂百世之師者矣見後漢法真傳駁討零陵桂陽山賊及州郡一切得舉孝廉茂才疏昔高祖創業萬邦息肩撫養百姓同之赤子今二郡之民亦陛下赤子也致令赤子為害豈非所在貪虐使其然乎宜嚴敕三府隱核牧守令長其有在政失和侵暴百姓者即便舉奏更選清賢奉公之人能班宣法令情在愛惠者可不勞王師而群賊弭息矣又三署郎吏二千餘人三府掾屬過限未除但當擇善而授之簡惡而去之豈煩一切之詔以長請屬之路乎見後漢陳蕃傳薦徐稚等疏臣聞善人天地之紀政之所由也詩云思皇多士生此王國天挺俊乂為陛下出當輔弼明時左右大業者也伏見處士豫章徐稚彭城姜肱汝南袁閎京兆韋著潁川李曇德行純備著于民聽若使擢登三事協亮天工必能翼宣盛美增光日月矣見後漢徐稚傳又袁宏後漢紀二十二又御覽六百三十引續漢書救李雲疏李雲所言雖不識禁忌干上逆旨其意歸于憂國但違將順之禮禮譏暴諫然亦有狂狷愚忠不顧誅族之禍者古今有之是以高祖忍周昌不諱之言孝成皇帝赦朱雲腰領之誅二主非不忿此二臣以忠不思難皆不罪之今日殺李雲天下猶言陛下誅諫臣所以臣敢敢觸龍麟也見袁宏後漢紀二十一又後漢李雲傳諫封賞內寵疏臣聞有事社稷者社稷是為有事人君者容悅是為今臣蒙恩聖朝備位九列見非不諫則容悅也夫諸侯上象四七垂耀在天下應分土藩屏上國高祖之約非功臣不侯而聞追録河南尹鄧萬世父遵之微功更爵尚書令黃雋先人之絶封近習以非義授邑左右以無功傳賞授位不料其任裂土莫紀其功至乃一門之內侯者數人故緯象失度陰陽謬序稼用不成民用不康臣知封事已行言之無及誠欲陛下從是而止又比年收斂十傷五六萬人飢寒不聊生活而采女數千食肉衣綺脂油粉黛不可資計鄙諺言盜不過五女門以女貧家也今後宮之女豈不貧國乎是以傾宮嫁而天下化楚女悲而西宮災且聚而不御必生憂悲之感以致并隔水旱之困夫獄以禁止姦違官以稱才理物若法虧于平官失其人則王道有缺而令天下之論皆謂獄由怨起爵以賄成夫不有臭穢則蒼蠅不飛陛下宜採求失得擇從忠善尺一選舉委尚書三公使褒責誅賞各有所歸豈不幸甚見後漢陳蕃傳諫幸廣城校獵疏臣聞人君有事于苑囿唯仲秋西郊順時講武殺禽助祭以敦孝敬如或違此則為肆縱故皋陶戒舜無教逸遊周公戒成王無槃于遊田虞舜成王猶有此戒況德不及二主者乎夫安平之時尚宜有節況當今之世有三空之厄哉田野空朝廷空倉庫空是謂三空加兵戎未戢四方離散是陛下焦心毀顏坐以待旦之時也豈宜揚旗曜武騁心輿馬之觀乎又秋前多雨民始種麥今失其勸種之時而令給驅禽除路之役非賢聖恤民之意也齊景公欲觀于海放乎琅邪晏子為陳百姓惡聞旌旗輿馬之音舉首嚬眉之感景公為之不行周穆王欲肆車轍馬跡祭公謀父為誦祈招之詩以止其心誠惡逸遊之害也見後漢陳蕃傳因火災上疏古之火皆君弱臣強極陰之變也前始春而獄刑慘故火不炎上前入春節連寒水冰暴風折樹又八九州郡竝言隕霜殺菽春秋晉執季孫行父水為之冰夫氣弘則景星見化錯則五星開日月蝕災為已然異為方來恐卒有變必于三朝唯善政可以已之願察臣前言不棄愚忠則元元幸甚見續漢五行志二注補引袁山松書理劉瓚等疏臣聞齊桓修霸務為內政春秋于魯小惡必書宜先自整敕後以及人今寇賊在外四支之疾內政不理心腹之患臣寢不能寐食不能飽實憂左右日親忠言以疏內患漸積外難方深陛下超從列侯繼承天位小家畜産百萬之資子孫尚恥愧失其先業況乃産兼天下受之先帝而欲懈怠以自輕忽乎誠不愛己不當念先帝得之勤苦邪前梁氏五侯毒遍海內天啓聖意收而戮之天下之議冀當小平明鑒未遠覆車如昨而近習之權復相扇結小黃門趙津大猾張泛等肆行貪虐姦媚左右前太原太守劉瓆南陽太守成瑨糾而戮之雖言赦後不當誅殺原其誠心在乎去惡至于陛下有何悁悁而小人道長營惑聖聽遂使天威為之發怒如加刑謫已為過甚況乃重罰令伏歐刃乎又前山陽太守翟超東海相黃浮奉公不撓疾惡如超沒侯覽財物浮誅徐宣之罪竝蒙刑坐不逢赦恕覽之縱橫沒財已幸宣犯釁過死有餘辜昔丞相申屠嘉召責鄧通洛陽令董宣折辱公主而文帝從而請之光武加以重賞未聞二臣有專命之誅而今左右群豎惡傷黨類妄相交搆致此刑譴聞臣是言當復啼訴陛下深宜割塞近習豫政之源引納尚書朝省之事公卿大官五日一朝簡練清高斥黜佞邪如是天和于上地洽于下休禎符瑞豈遠乎哉陛下雖厭毒臣言凡人主有自勉強敢以死陳見後漢陳蕃傳臣聞昔齊桓公任管仲將正諸侯先為政令今寇賊在外四肢之疾耳臣竊寢不能寐食不能飽憂陛下內政未治忠言日疏前梁冀五侯弄權天啓陛下收而戮之當時天下號為小清其前鑒未遠旋起覆車之軌矣往年地動日蝕火災皆陰盛之應願陛下割塞左右豫政之原引納尚書朝省之事節練高潔斥退佞邪如此則天和于上地洽于下矣從陛下踐祚已來大臣誰敢舉左右之罪往者申屠嘉召鄧通文帝遣詣嘉府乃從而請之三公之職何所不統但今左右驕忿欲令三公不得舉筆臣蕃今握自閭閻特為陛下日月所照奈何受恩如臣而當避難苟生不敢正言陛下雖厭毒臣言人主有自勉彊見袁宏後漢紀二十二校本傳語次不同多出十三句理李膺等疏臣聞賢明之君委心輔佐亡國之主諱聞直辭故湯武雖聖而興于伊呂桀紂迷惑亡在失人由此言之君為元首臣為股肱同體相須共成美惡者也伏見前司隸校尉李膺太僕杜密太尉掾范滂等正身無玷死心社稷以忠忤旨橫加考案或禁錮閉隔或死徙非所杜塞天下之口聾盲一世之人與秦焚書坑儒何以為異昔武王克殷表閭封墓今陛下臨政先誅忠賢遇善何薄待惡何優夫讒人似實巧言如簧使聽之者惑視之者昏夫吉凶之效存乎識善成敗之機在于察言人君者攝天地之政秉四海之維舉動不可以違聖法進退不可以離道規謬言出口則亂及八方何況髡無罪于獄殺無辜於市乎昔禹巡狩蒼梧見市殺人下車而哭之曰萬方有罪在豫一人故其興也勃焉又青徐炎旱五穀損傷民物流遷茹菽不足而宮女積于房掖國用盡于羅紈外戚私門貪財受賂所謂祿去公室政在大夫昔春秋之末周德衰微數十年間無復災眚者天所棄也天之于漢悢悢無已故殷勤示變以悟陛下除妖去孽實在修德臣位列台司憂責深重不敢尸祿惜生坐觀成敗如蒙採録使身首分裂異門而出所不恨也見後漢陳蕃傳讓封高陽侯疏使者即臣廬授高陽鄉侯印綬臣誠悼心不知所裁臣聞讓身之文德之昭也然不敢盜以為名竊惟割地之封功德是為臣孰自思省前後歷職無它異能合亦食祿不合亦食祿臣雖無素潔之行竊慕君子不以其道得之不居也若受爵不讓掩面就之使皇天震怒災流下民于臣之身亦何所寄顧惟陛下哀臣朽老戒之在得見後漢陳蕃傳上竇太后疏臣聞言不直而行不正則為欺乎天而負乎人危言極意則群凶側目禍不旋踵鈞此二者臣寧得禍不敢欺天也今京師囂囂道路喧譁言侯覽曹節公乘昕王甫鄭颯等與趙夫人諸女尚書竝亂天下附從者升進忤逆者中傷方今一朝群臣如河中木耳泛泛東西耽祿畏害陛下前始攝位順天行誅蘇康管霸竝伏其辜是時天地清明人鬼歡喜奈何數月復縱左右元惡大姦莫此之甚今不急誅必生變亂傾危社稷其禍難量願出臣章宣示左右並令天下諸姦知臣疾之見後漢陳蕃傳上書昔明帝時公主為子求郎不許賜錢千萬左右問之帝曰郎天官也以當敘德何可妄與人邪今陛下以郎比一把菜臣以為反側也見御覽二百十五引汝南先賢傳責諸尚書書古人立節事亡如存今帝祚未立政事日蹙諸君奈何委荼蓼之苦息偃在床於義不足焉得仁乎見後漢陳蕃傳與尚書邊韶議奏楊秉韋著秉儒學侍講常在謙虛著隱居行義以退讓為節俱徵不至誠違側席之望然逶迤退食足抑苟進之風夫明王之世必有不召之臣聖朝弘養宜用優游之禮可告在所屬喻以朝廷恩義如遂不至詳議其罰見後漢楊附傳張公神道石闕銘於穆張公含和泰清受符皇極乾綱川靈何天之休元亨利貞無貴神耀洞度泉殷商北坰嶽朝綦陽厥土敞平芝草茂木潚潚滋榮群萌勳炃激川通懷廟克儉損盈詔命有司祭以中牲歲聿再薦公其饗零興來億載歷數萬君太顯猶招拂英勳錫介福惠此吏民國無災寇屢獲豐年皇帝眉壽干祿于天牧守皆升握台輔辰長與丞尉超遷相因休烈烈無見隸釋三張公神碑星變上封事臣聞天子尊無為上故天以為子位臨臣庶威重四海動靜以理則星辰順序意有邪僻則晷度錯違陛下以河南尹鄧萬有龍潛之舊封為通侯恩重公卿惠豐宗室加頃引見與之對博上下媟黷有虧尊嚴臣聞之帝左右者所以咨政德也故周公戒成王曰其朋其朋言慎所與也昔宋閔公與彊臣共博列婦人于側積此無禮以致大災武帝與幸臣李延年韓嫣同臥起尊爵重賜情欲無厭遂生驕淫之心行不義之事卒延年被戮嫣伏其辜夫愛之則不覺其過惡之則不知其善所以事多放濫物情生怨故王者賞人必酬其功爵人必甄其德善人同處則日聞嘉訓惡人從游則日生邪情孔子曰益者三友損者三友邪臣惑君亂妾危主以非所言則悅于耳以非所行則玩于目故令人君不能遠之仲尼曰唯女子與小人為難養近之則不遜遠之則怨蓋聖人之明戒也昔光武皇帝與嚴光俱寢上天之異其夕即見夫以光武之聖德嚴光之高賢君臣合道尚降此變豈況陛下今所親幸以賤為貴以卑為尊哉惟陛下遠讒諛之人納謇謇之士除左右之權寤宦官之敝使積善日熙佞惡消殄則乾災可除見後漢爰延傳異聞記郡人張廣定者遭亂常避地有一女年四歲不能步涉又不可擔負計棄之固當餓死不欲令其骸骨之露村口有古大冢上巔先有穴乃器盛縋之下此女于冢中以數月許乾飯及水槳與之而舍去侯世平定其間三年廣定乃得還鄉里欲收冢中所棄女骨更殯埋之廣定往視女故坐冢中見其父母猶識之甚喜而父母猶初恐其鬼也入就之乃知其不死問之從何得女言糧初盡時甚飢見冢角有一物伸頸吞氣誠效之轉不復飢日月為之以至于今父母去時所留衣被自在冢中不行往來衣服不敗故不寒凍廣定乃索女所言物乃是一大龜耳女出食殼初小腹痛嘔逆久許乃習見抱朴子內篇對俗肉刑論漢除肉刑而增加笞本興仁惻而死更衆所謂名輕而實者也名輕則易犯實重則傷民書曰惟敬五刑以成三德易著劓刖滅趾之法所以輔政助教懲惡息殺也且殺人償死合于古制至于傷人或殘毀其體而才翦毛髮非其理也若用古刑使淫者下蠶室盜者刖其足永無淫放穿窬之姦矣見魏志陳群傳又見袁宏後漢紀三十
