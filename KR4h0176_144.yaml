body:
  text: 張奐扶蕖賦緑房翠蒂紫飾紅敷黃螺圓出垂蕤散舒纓以金牙點以素珠見初學記二十七御覽九百九十九應詔上書言災應臣聞風為號令動物通氣木者火之本相須乃明蛇者屈伸隱顯似龍順至為休徵逆來為災殃故大將軍竇武忠肅恭儉有援立之功太傅陳蕃敦方抗直風夜匪懈一旦被誅天下驚怛海內默默莫不哀心昔周公既薨成王葬不具禮天乃大風偃木折樹成王發書感悟備禮改葬天乃立反風其木樹盡起今宜改葬蕃武選其家屬諸被禁錮一宜蠲除則災變可消升平可致也見袁宏後漢紀二十三臣聞風為號令動物通氣木生于火相須乃明蛇能屈申配龍騰蟄順至為休徵逆來為殃咎陰氣專用則凝精為雹故大將軍竇武太傅陳蕃或志寧社稷或方直不回前以讒勝並伏誅戮海內默默人懷震憤昔周公葬不如禮天乃動威今武蕃忠貞未被明宥𡚻眚之來皆為此也宜急為改葬徙還家屬其從坐禁錮一切蠲除又皇太后雖居南宮而恩禮不接朝臣莫言遠近失望宜思大義顧復之報見後漢張奐傳又略見續漢五行志四注補引張奐傳多出袁宏紀十三語上言東羌事東羌雖破餘種難盡熲性輕果慮負敗難常宜且以恩降可無後悔見後漢段熲傳纍見折衄同上羌一氣所生不可誅盡山谷廣大不可空靜血流汙野傷和致災同上奏記謝段熲小人不明得過州將千里委命以情相歸足下仁篤照其辛苦使人未反復獲郵書恩詔分明前以寫白而州期切促郡縣惶懼屏營延企側待歸命父母朽骨孤魂相託若蒙矜憐一惠咳唾則澤流黃泉施及冥寞非奐生死所能報塞夫無毛髮之勞而欲求人丘山之用此淳于髡所以拍髀仰天而笑者也誠知言必見譏然猶未能無望何者朽骨無益于人而文王葬之死馬無所復用而燕昭寶之黨同文昭之德豈不大哉凡人之情冤則呼天窮則叩心今呼天不聞叩心無益誠自傷痛俱生聖世獨為匪人孤微之人無所告訴如不哀憐便為魚肉企心東望無所復言見後漢張奐傳與延篤書唯別三年無一日之忘京師禁急不敢相聞豈不懷歸畏此簡書年老氣衰智盡謀索每有所處違宜失便北為兒車所讎中為馬循所困真欲入三泉之下復鎮之以大石厄乎此時也且太陰之地冰厚三尺木皮五寸風寒慘冽剝脫傷骨但此自非老憊者所堪而復加之以師旅因之以饑饉衆艱罄集不可一二而言也聾盲日甚氣力寖衰神邪當復相見從此辭矣見北堂書鈔一百五十六藝文類聚三十御覽三十四吾與叔堅剖心相知豈以流言相猜邪見初學記十八交友御覽四百十與陰氏書篤念既密文章燦爛名實相副奉讀周旋紙弊墨渝不離于手見藝文類聚三十一御覽五百九十五與宋季文書覽手迹知遂遵南山之志繼四賢之蹤時止則止時行則行其道光明奐以鄙固少復道訓于今五十載矣見藝文類聚三十七與許季師書不面之闊悠悠曠久飢渴之念豈當有忘見文選曹植責躬詩注報崔子玉書今月三日舉家來居此本非所規貪突賊陳見藝文類聚八十與崔子貞書僕以元年到任有見兵二百馬如羖羊矛如錐鐵盾如榆葉見御覽三百五十三又三百五十七人生實難所務非此見文選王粲贈蔡子篤詩注引與崔子書各本子下脫一字依文疑當是子貞也胸奴若非其罪何肯吞聲見文選與公超書下筆愴恨泣先言流見御覽四百八十八與孟季衛書素若悸逆頃者益甚百病所歸月衰日損見御覽七百四十一與屯留君書氣厲流行傷賢害善見文選陳琳為袁紹檄豫州注誡兄子書汝曹薄祐早失賢父財單藝盡今適喘息聞仲祉輕傲耆老侮狎同年極口恣意當崇長以禮自持聞敦煌有人來同聲相道皆稱叔時寬仁聞之喜而且悲喜叔時得美稱悲汝得惡論經言孔于鄉黨恂恂如也恂恂者恭謙之貌也經難知且自以汝資父為師汝父寧輕鄉里邪年少多失改之為貴蘧迫玉年五十四十九年非但能改之不可不思吾言不自克責反云張甲謗我李乙怨我我無是過爾亦已矣見藝文類聚二十三遺命諸子吾前後仕進十要銀艾不能和光同塵為讒邪所忌通塞命也始終常也但地底冥冥長無曉期而復纏以纊綿牢以釘密為不喜耳幸有前窀朝殞夕下措尸靈床幅巾而已奢非晉文儉非王孫推情從意庶無咎吝見後漢張奐傳與朱賜書上比崔杜不下方羅趙有餘見後漢趙岐傳注藝文類聚七十四御覽七百四十九竝引三輔決録注與李幼才書弭仲叔高德美名命世之才非弭氏小族所當有新豐瘠土所當出也見引三輔決録注與朱仲君書正氣可以消邪人無其亹妖不自作見趙一非草書與府君書八月九日芝白府君足下不日秋涼平善廣闊彌邁相思無違前比得書不遂西行望遠懸想何日不勤損棄漂沒不當行李又去春送舉喪到美陽須待伴比故遂間絶有緣復相聞飱食自愛張芝幸甚幸甚見淳化閣帖二西嶽華山堂闕碑銘易曰天地定位山澤通氣然山莫遵于嶽澤莫盛于瀆山嶽有五而華處其一瀆有四而河在其數其靈也至矣聖人廢興必有其應故岱山石立中宗繼統太華授璧秦胡絶緒白魚入舟姬武建業寶圭出水子朝喪位布五方則處其西列三條則居其中若廣獸奇蟲山經有紀矣是以帝皇巡狩親五嶽而告至覲方后而考禮故經有望秩之禋典有生殖之祀蓋所以崇山川而報功也四海一統天子秉其禮諸侯力政彊國攝其祭其奉邑曰華陰也久矣乃紀于禹貢而分秦晉之境秦鄙晉之西則日陰晉邊秦之東則曰寧秦邑既遷徙禮亦如之二國力爭以奉以祭其城險固基趾猶存故老之言未殞于民也逮至大漢受命克亂不愆不忘舊名是復率禮不越故祀是尊歷葉增修虔恭又備一禱三祀終歲而四以迄于今而世宗又經集靈之宮于其下想喬松之疇是遊是憩郡國方士自遠而至者充巖塞崖鄉邑巫覡宗祀乎其中者盈谷溢溪咸有浮飄之志愈悅之色必雲霄之路可升而越果繁昌之福可降而致也故殖財之寶黃玉自出令德之珍卿相是育匪惟嵩高降生申甫此亦有焉天有所興必先廢之故殷宗周宣以衰致盛是時也王業中缺大化陵遲郡縣既毀財匱禮乏庭廟傾壞壇場蕪穢祭祀之禮頗有缺焉于是鎮遠將軍領北地太守閿鄉亭侯段君諱煨字忠明自武威占此土憑託何華二靈是與故能以昭烈之德享上將之尊銜命持重屯斯寄國討叛柔服威懷是示群凶既除郡縣集寧家給人足戶有樂生之歡朝釋西顧之慮而懷關中之雖昔蕭相輔佐之功功冠群后弗以加也遂解甲休士陳而不戰以逸其力修飾享廟壇場之位荒而後辟禮廢而復興又造祠堂表以參闕建神路之端首觀壯麗乎孔徹然後旅祀祈請既有常處雖雨霑衣而禮不廢于是邑之士女咸曰宜之乃建碑刊石垂示後裔其辭曰於穆堂闕堂闕昭明經之營之不日而成匪奢匪儉惟德是程匪豐匪約惟禮是榮虔恭禋祀黍稷芬馨神具醉止降福穰穰見藝文類聚七初學記五古文苑殺刺史邯鄲商下令敢有臨商喪死不令赦見魏志龐淯傳奏記王畼五教在寬著之經典湯去三面八方歸仁武王入殷先去炮格之刑高祖鑒秦唯定三章之法孝文皇帝感一緹縈蠲除肉刑卓茂文翁召父之徒皆疾惡嚴刻務崇溫厚仁賢之政流聞後世夫明哲之君網漏吞舟之魚然後三光明于上人物悅于下言之若迂其效甚近發屋伐樹將為嚴烈雖欲懲惡難以聞遠以明府上智之才日月之曜敷仁惠之政則海內改觀實有折枝之易而無挾山之難郡為舊都侯甸之國園廟出于章陵三后生自新野士女沾教化黔首仰風流自中興以來功臣將相繼世而隆愚以為懇懇用刑不如行恩孳孳求姦未若禮賢舜舉皋陶不仁者遠隨會為政晉盜奔秦虞芮入境讓心自生化人在德不在用刑見後漢王龔附傳應詔上言討先零東羌術略臣伏見先零東羌雖數叛逆而降于皇甫規者已二萬許落善惡既分餘寇無幾今張奐躊躇久不進者當慮外離內合兵往必驚且自冬踐春屯結不散人畜疲羸自亡之勢徒更招降坐制強敵耳臣以為狼子野心難以恩納勢窮雖服兵去復動唯當長矛挾脅白刃加頸耳計東種所餘三萬餘落居近塞內路無險折非有燕齊秦趙從橫之勢而久亂并涼纍侵三輔西河上郡已各內徙安定北地復至單危自雲中五原西至漢陽二千餘里胸奴種羌竝擅其地是為癰疽伏疾留滯脅下如不加誅轉就滋大今若以騎五千步萬人車三千兩三冬二夏足以破定無慮用費為錢五十四億如此則可令群羌破盡胸奴長服內徙郡縣得反本土伏計永初中諸羌反叛十有四年用二百四十億永和之末復經七年用八十餘億費耗若此猶不誅盡餘孽復起于茲作害今不暫疲人則永寧無期臣庶竭駑劣伏待節度見後漢段熲傳復上言東羌事臣本知東羌雖衆而軟弱易制所以比陳愚慮思為永寧之算而中郎將張奐說虜強難破宜用招降聖朝明監信納瞽言故臣謀得行奐計不用事藝相反遂懷猜恨信叛羌之訴飾潤辭意云臣兵纍見折衄又言羌一氣所生不可誅盡山谷廣大不可空靜血流汙野傷和致災臣伏念周秦之際戎狄為害中興以來羌寇最盛誅之不盡雖降復叛今先零雜種纍以反覆攻沒縣邑剽略人物發冢露尸禍及生死上天震怒假手行誅昔邢為無道衛國伐之師興而雨臣動兵涉夏連獲甘澍歲時豐稔人無疵疫上占天心不為災傷下察人事衆和師克自橋門以西落川以東故官縣邑更相通屬非為深險絶域之地車騎安行無應折衄案奐為漢吏身當武職駐軍二年不能平寇虛欲修文戢戈招降獷敵誕辭空說僭而無徵何以言之昔先零作寇趙充國徙令居內煎當亂邊馬援遷之三輔始服終叛至今為鯁故遠識之士以為深憂今傍郡戶口單少數為羌所創毒而欲令降徒與之雜居是猶種枳棘于良田養虺蛇于室內也故臣奉大漢之威建長久之策欲絶其本根不使能殖本規三歲之費用五十四億今適期年所耗未半而餘寇殘燼將向殄滅臣每奉詔書軍不內御願卒斯言一以任臣臨時量宜不失權便見後漢段熲傳諫開鴻池鴻池泛溉已且百頃猶復增而深之非所以崇唐虞之約己遵孝文之愛人也見後漢趙典傳奏諫封恩澤侯夫無功而賞勞者不勸上忝下辱亂象干度且高祖之誓非功臣不封宜一切削免爵土以存舊典見後漢趙典傳與李傕書公前託為董公報讎然實屠陷王城殺戮大臣天下不可家見而戶說也今與郭汜爭睚眥之隙以成千鈞之讎民在塗炭各不聊生曾不改悟遂成禍亂朝廷仍下明詔欲令和解上命不行咸澤日損而復欲轉乘輿于黃白城更幸非所此誠老夫所不達也于易一過為過再為涉三而弗改滅其頂凶不如早共和解引軍還屯上安萬乘下全生民豈不幸甚見魏志董卓傳注引獻帝起居注袁宏後漢紀二十八後漢趙典傳上言宜封梁冀妻孫壽大將軍有周公之功今既封諸子則其妻宜為邑君見後漢梁冀傳詣闕上書臣聞仲尼歎鳳鳥不至河不出圖自傷卑賤不能致也今陛下居得致之位又有能致之資而和氣未應賢愚失序者勢分權臣上下壅隔之故也夫四時之運功成則退高爵厚寵鮮不致災今大將軍位極功成可為至戒宜遵懸車之禮高枕頤神傳曰木實繁者披枝害心若不抑損權盛將無以全其身矣左右聞臣言將側目切齒臣特以童蒙見拔故敢忘忌諱昔舜禹相戒無若丹朱周公戒成王無如殷王紂願除誹謗之罪以開天下之口見後漢梁冀傳延熹八年日蝕舉賢良方正對策臣聞立天之道曰陰與陽立人之道曰仁與義故夫婦正則父子親父子親則君臣通君臣通則仁義立仁義立則陰陽和而風雨時矣夫吉凶在人水旱由政故勢在臣下則地震坤裂下情不通則日月失明百姓怨恨則水旱暴興人主驕淫則澤不下流由此觀之君其綱也臣其紀也綱紀正則萬目張君臣正則萬國理故能父慈子孝夫信婦貞兄愛弟順如此則陰陽和風雨時萬物得所矣見袁宏後漢紀二十二除北新城長告縣人昔文翁在蜀道著巴漢庚桑瑣隸風移碨磊吾雖小宰猶有社稷苟赴期會理文墨豈本志乎見後漢劉梁傳七舉丹楹縹壁紫柱虹梁桷榱朱緑藻梲玄黃鏤以金碧雜以夜光鴻臺百層千雲參差仰觀八極遊目無涯玉樹青蔥鸞鶴竝栖隨珠明月照曜其陂緑柱朱榱青瑣璧璫見御覽一百八十七華組之纓從風紛紜見御覽六百八十六又八百十九佩則結緑懸黎寶之微妙荷彩昭爛流景揚輝見御覽六百九十二黼黻之服紗縠之裳繁飾參差微鮮若霜見御覽六百九十六雙轅覆井芰荷垂英見文選景福殿賦注九旒之冕散耀垂文見文選七啓注先生昭然神悟霍爾體輕見文選何敬叔雜詩注七啓注酤以醢醯和以蜜飴見文選七命注芻豢既陳異饌竝羞勺藥之調煎炙蒸臑酤以醯醢和以蜜飴見書鈔一百四十二菰粱之飯入口叢流送以熊蹯咽以豹胎見書鈔一百四十四鯉魮之膾分豪析釐見書鈔一百四十五辨和同論夫事有違而得道有順而失義有愛而為害有惡而為美其故何乎蓋明智之所得暗僞之所失也是以君子之于事也無適無莫必考之以義焉得由和興失由同起故以可濟否謂之和好惡不殊謂之同春秋傳曰和如羹焉酸苦以劑其味君子食之以平其心同如水焉若以水濟水誰能食之琴瑟之專一誰能聽之是以君子之行周而不比和而不同以救過為正以匡惡為忠經曰將順其美匡救其惡則上下和睦能相親也昔楚恭王有疾召其大夫曰不穀不德少主社稷失先君之緒覆楚國之師不穀之罪也若以宗廟之靈得保首領以歿請為靈若厲大夫許諸及其卒也子囊曰不然夫事君者從其善不從其過赫赫楚國而君臨之撫正南海訓及諸夏其寵大矣有是寵也而知其過可不謂恭乎大夫從之此違而得道者也及靈王驕淫暴虐無度芊尹申亥從王之欲以殯于乾溪殉之二女此順而失義者也鄢陵之役晉楚對戰陽穀獻酒子反以斃此愛而害之者也臧武仲曰孟孫之惡我藥石也季孫之愛我美疢也疢毒滋厚石猶生我此惡而為美者也孔子曰智之難也有臧武仲之智而不容于魯國抑有由也作不順而施不恕也蓋善其知義譏其違道也夫知而違之僞也不知而失之暗也暗與僞焉其患一也患之所在非徒在智之不及又在及而違之者矣故曰智及之仁不能守之雖得之必失之也夏書曰念茲在茲庶事恕施忠智之謂矣故君子之行動則思義不為利回不為義疚進退周旋唯道是務苟失其道則兄弟不阿苟得其義雖仇讎不廢故解狐蒙祁奚之薦二叔被周公之害勃鞮以逆文為成傅瑕以順厲為敗管蘇以憎忤取進申侯以愛從見退考之以義也故曰不在逆順以義為斷不在憎愛以道為貴禮記曰愛而知其惡憎而知其善考義之謂也見後漢劉梁傳劉梁碑附君遷桂陽太守班序以正以仁為首以義為先見書鈔
