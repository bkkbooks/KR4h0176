body:
  text: 劉楨大暑賦其為暑也羲和總駕發扶木太陽為輿達炎燭靈威參垂步朱轂赫赫炎炎烈烈暉暉若熾燎之附體又溫泉而沈肌獸喘氣于玄景鳥戢翼于高危農畯捉鐏而去時織女釋杼而下機溫風至而增熱歊悒懾而無依披襟領而長嘯冀微風之來思見藝文類聚五黎陽山陽自魏都而南邁迄洪川以朅休想王旅之旌旄望南路之遐修御輕駕而西徂過舊塢之高區爾乃逾峻超連罔一登九息遂臻其陽南蔭黃河左覆金城青壇承祀高碑頌靈珍木駢羅奮華揚榮雲興風起蕭瑟清泠延首南望願瞻舊鄉桑梓增敬慘切懷傷河源汨其東遊陽烏飄而南翔覩衆物之集華退欣欣而樂康見藝文類聚七良遊未厭白日潛輝見文選謝叔源遊西池詩注魯都賦昔大庭氏肇建厥居少昊受命亦都茲焉見藝文類聚六十一巨海分焉傾瀉百川見初學記六山則連罔屬嶺曀魅峽北紫金揚暉于鴻岸水精潛光乎雲穴岱宗邈層秀干氣霧以高越其木則赤桋青松文莖蕙棠洪幹百圍高徑穹皇竹則填彼山陔根濔阪域夏簜攢包徑條並殖蒙雪含霜不渝其色翠實離離鳳凰攸食見藝文類聚六十一北堂書鈔一百五十八初學記二十八芳果萬名攢羅廣庭霜滋靈潤時至則零見御覽九百六十四黍稷油油粳族垂芒殘穗滿渥一穎千箱見初學記二十七祿鷁蔥鶖見御覽九百二十五水産衆夥名有彝倫頒首莘尾豐顱重齗戴兵挾刃盤甲曲鱗見藝文類聚六十一其鹽則高盆再波酌海臻素嵯凝結皓若雪氛見書鈔一百四十六又有鹽沈漭沈煎炙暘春焦暴濆沫疏鹽自殷挹之不損取之不動見書鈔一百四十六女工則絳綺縠見御覽八百十六纖纖絲屐爛爓鮮新靈草尋夢華榮奏口表以文組綴以珠蠙步蹈安審接迹承身見書鈔一百三十六初學記二十六御覽六百九十七且觀其時謝節移和族綏宗招歡合好肅戒友朋龍燭九枝逸稻壽陽賦湛露以留客召麗妙新倡衆緩侍側鱗附盈房蛾眉清眸顏若雪霜玄髮矅粉澤不含丹吮素巧笑妍詳袿裾紛裶振佩鳴璜插曜日之珍笄珥明月之珠璫舞人就列整飾容華和顏揚眸眄風長歌飄乎猋彶身如轉波尋虛騁迹願與節和縱修袖以終曲若奔星之赴河及其素秋二七天漢指隅民胥袚褉國于水嬉緹帷彌津丹帳覆洲日暮宴罷車騎就衢蓋如飛鶴馬如遊魚伊歲之冬雲氣清晞水沍露凝冰雪皚皚見藝文類聚六十一書鈔一百三十五初學記三又四又十五御覽三百八十一七百二七百十八金陛玉砌玄枑雲柯見文選王融曲水詩序注應門巖巖朱扉含光路殿巋其隆崇文陛巘其高驤聽迅雷于長除若有聞而復亡其園囿苑沼駢田接連淥池分浪以帶石垠文隅瓊岸華玉依津邦乃大狩振揚炎威教民即戒講習興師落幕包括連結營圍長罼掩壑大羅被睪毛群隕殪羽族殲剝填崎塞畎不可勝録見藝文類聚六十一御覽八百三十二戢武器于有炎之庫放戎馬于巨野之坰見水經泗水注彼齊諸儒繪辨端衣散佩垂紳金聲玉色溫故知新訪魯都之區域吊先生之遺貞見御覽一百五十六遂志賦幸遇明后因志東傾披此豐草乃命小生生之小矣何茲云當牧馬于路役車低昂愴恨惻切我獨西行去峻溪之鴻洞觀日日于朝陽釋叢棘之餘剌踐檟林之柔芳皎玉粲以曜目榮日華以舒光信此山之多靈何神分之煌煌聊且遊觀周歷高岑仰攀高枝側身遺陰磷磷䃹䃹以廣其心伊天皇之樹葉必結根于仁方梢吳夷于東隅掣叛臣乎南荊戢于戈于內庫我馬而不行揚洪恩于無涯聽頌聲之洋洋四寓奠以無為玄道穆以普將翼雋乂于上列退仄陋于下場襲切服之蕪薉託蓬盧以遊翔豈放言而云爾乃旦夕之可忘見藝文類聚二十六清慮賦結東阿之扶桑接西雷乎燭龍入鐐碧之間出水精之都上青臒之山蹈琳珉之塗玉樹翠葉上栖金鳥見初學記二十七文選雪賦注御覽八百八錯華玉以茨屋駢雄黃以為墀紛以瑤蕊糅以玉夷見初學記二十七御覽一百八十五後布玳瑁之席前設觜蠵之筵憑文瑤之几對精金之盤見書鈔一百三十三引兩條御覽七百六又七百九又八百七又八百九虞氏之爨加火珠之甑炊嘉禾之米和蓂莢之飯見書鈔一百四十四仰稱木韭俯拔廉薑見御覽九百七十四瓜賦楨在曹植坐廚人進瓜植命為賦促立成其辭曰含金精之流芳冠種瓜以作珍三星隅溫風節暮枕翹于藤流美遠布黃華炳曄潛實獨著豐細異形圓方殊務揚暉發藻九釆雜揉厥初作苦終然允甘應時湫熟含蘭吐芳藍皮蜜理素肌丹瓤乃命圃師貢其最良投諸清流一流一藏更布象牙之席薰玳瑁之筵憑彤玉之几酌撩碧之樽析以金刀四剖三離承之以雕盤羃之以纖絺甘逾蜜房冷亞冰圭見藝文類聚八十七文選顏延年皇太子釋奠會詩注初學記十又二十七引四條又御覽二百四十六八百十九九百七十八與曹植書明使君始垂哀憐意眷日崇譬之疾病乃使炎農分藥岐伯下針疾雖未除就沒無恨何者以其天醫至神而榮魄自盡也見御覽七百三十九肅以素秋則落見文選潘正叔贈陸機詩注又劉琨重贈盧詩注又張協七命注諫曹植書家丞邢顒北土之彥少秉高節玄靜淡泊言少理多真雅士也楨誠不足同貫斯人並列左右而楨禮遇殊特顒反疏簡私懼觀者將謂君侯習近不肖禮賢不足採庶子之春華忘家丞之秋實為上招謗其罪不小以此反側見魏志邢顒傳答魏太子丕借廓落帶書楨聞荊山之璞曜元后之寶隨侯之珠燭衆士之好南垠之金登窈窕之首貂𧳰之尾綴侍臣之幘此四寶者伏杇石之下潛汙泥之中而揚光千載之上發彩疇昔之外亦皆未能初自接于至尊也夫尊者所服卑者所修也貴者所御賤者所先也故夏屋初成而大匠先立其下嘉禾始熟而農夫先嘗其粒恨楨所帶無他妙飾若實殊異尚可納也見魏志王粲傳注引典略又略見御覽六百八十七六百八十八處士國文甫碑先生執乾靈之貞潔稟神祇之正性咳笑則孝悌之端著匍匐則清節之兆見齠齔以及成人體無懈容口無愆辭競競業業小心畏忌勤讓同儔敬事長老雖周之樂正子春漢之江都董相其飭躬力行無以尚之是以長安師其仁朋友欽其義閨門稱其慈宗屬懷其惠既乃潛身窮巖遊心載籍薄世名也初海內之亂不視膳羞十有餘年憂心泣血不勝其哀形銷氣竭以建安十七年四月卒于時龍德逸民黃髮實臾綴文通儒有方彥士莫不拊心長號如喪同生咸以為誄所以昭行也銘所以旌德也古之君子既沒而令問不忘者由斯一者也銘曰懿矣先生天授德度外清內白如玉之素逍遙九皋方回是慕不計治萃名與殊路知我者希韞櫝未酤喪過乎哀遘疾不悟早世永頽違此榮𧙓咨爾未徒聿修歡故見藝文類聚三十七上疏陳事臣聞人非天地無以寓生天地非人無以為靈是故帝非人不立人非帝不寧夫天之與帝帝之與民猶頭之與足相須而行混同一體自然之勢也臣竊觀之今玄象錯度日月不明地裂川溢妖祥並興胤仍絶民率流亡昔夏癸由此而廢商辛以斯而喪若不悔寤恐懼將無及矣伏惟陛下年隆德茂中天稱號襲常存之慶循不易之制目不視鳴條之事耳不聞檀車之聲天災不有痛于肌膚震蝕不即損于聖體故蔑三光之謬輕上天之怒怡民飢之憂忽震裂之變輕無嗣之禍殆國家之命非所以彰美祖業克保天祉者也伏念高祖之起始自布衣拾暴秦之敝追亡周之鹿合散扶傷克成帝業功既顯矣勤亦至矣流福遺祚至于陛下陛下既不能增明烈考之軌而忽高祖之勤妄假利器委授國柄使群醜刑隸芟刈小民雕敝諸夏虐流遠近故天降衆異以戒陛下陛下不悟而競令虎豹窟于麑場豺狼乳于春囿斯豈唐咨禹稷益典朕虞議物賦土蒸民之意哉又今牧守長吏上下交競封豕長蛇蠶食天下貨殖者為窮冤之魂貧餒者作飢寒之鬼高門獲東觀之辜豐室羅妖叛之罪死者悲于窀穸生者戚于朝野是愚臣所為咨嗟長懷歎息者也且秦之將亡正諫者誅諛進者賞嘉言結于忠舌國命出于讒口擅閻樂于咸陽授趙高以車府權去己而不知威離身而不顧古今一揆成敗同勢願陛下遠覽強秦之傾近察哀平之變得失昭然禍福可見臣又聞危非仁不扶亂非智不救故武丁得傅説以消鼎雉之災周宣用申甫以濟夷厲之荒竊見故冀州刺史南陽朱穆前鳥桓校尉臣同郡李膺皆履正清修貞介絶俗穆前在冀州奉憲操平摧破姦黨彈糾豪傑掃滅叨惡肅清萬里不仁者遠雖山甫不畏強禦誠無以逾也膺後歷典牧守正身率下及掌戎馬鎮撫北疆神武揚於朔州疆胡懾于漠北文既俎豆武亦干戈遂身退家無私積斯實中興之良佐國家之柱臣也宜還本朝挾輔王室上齊七耀下鎮萬國不合久屈間曹委于草莽臣敢吐不時之義于諱言之朝猶冰霜見日必至消滅臣恐小人道長遂成其敗犯冒天顏言誠非議知必以身脂鼎鑊為海內笑所學之事將復何恨不學鬼谷之于東齊而習秦儀之于周魏賈壬孫于蜀都交猗頓之貨殖如此亦可以示王室之爵置天地之位矣臣始悲天下之可悲今天下亦悲臣之愚惑也見袁宏後漢紀二十一後漢劉陶傳合録成篇與樂松袁貢連名上疏言張角聖王以天下耳目為視聽故能無不聞見今張角支黨不可勝計前司徒揚賜奏下詔書切敕州郡護送流民會賜去位不復捕録雖會赦令而謀不解散四方私言云角等竊入京師覘視朝政鳥聲獸心私共鳴呼州郡忌諱不欲聞之但更相告語莫肯公文宜下明詔重募角等賞以國土有敢回避與之同罪見後漢劉陶傳陳要急八事疏臣聞事之急者不能安言心之痛者不能緩聲竊見天下前遇張角之亂後遭邊章之寇每聞羽書告急之聲心灼內熱四體驚竦今西羌逆類私署將帥皆多段熲時吏曉習戰陳識知山川變詐萬端臣常懼其輕出河東馮翊鈔西軍之後東之函谷據厄高望今果已攻河東恐遂轉更豕突上京如是則南道斷絶車騎之軍孤立關東破膽四方動搖威之不來叫之不應雖有田單陳平之策計無所用臣前驛馬上便宜急絶諸郡賦調冀尚可安事付主者留連至今莫肯求問今三郡之民皆以奔亡南出武關北徙壺谷冰駭風散唯恐在後今其存者尚十三四軍吏士民悲愁相守民有百走退死之心而無一前鬭生之計西寇浸前去營咫尺胡騎分布已至諸陵將軍張溫天性精勇而主者旦夕迫促軍無後殿假令失利其敗不救臣自知言數見厭而言不自裁者以為國安則臣蒙其慶國危則臣亦先亡也謹復陳當今要急八事乞須臾之間深垂納省見後漢劉陶傳詣闕上書訟朱穆伏見弛刑徒朱穆處公憂國拜州之日志清姦惡誠以常侍貴寵父子兄弟布在州郡競為虎狼噬食小人故穆張理天綱補綴漏目羅取殘禍以塞天意由是內官咸共恚疾謗讟煩興讒隙仍作極其刑謫輸作左校天下有識皆以穆同勤禹稷而被共鯀之戾若死者有知則唐帝怒于崇山重華忿于蒼墓矣當今中官近習竊持國柄手握王爵口含天憲運賞則使餓隸富于季孫呼吸令伊顏化為桀跖而穆獨亢然不顧身害非惡榮而好辱惡生而好死也徒感王綱之不攝懼天網之久失故竭心懷憂為上深計臣願黥首繫趾代穆校作見後漢朱穆傳改鑄大錢議聖王承天制物與人行止建功則衆悅其事興戎而師樂其旅是故靈臺有子來之人武旅有鳧藻之士皆舉合時宜動順人道也臣伏讀鑄錢之詔平輕重之議訪覃幽微不遺窮賤是以藿食之人謬延逮及敢懸書象魏聽罪絳闕蓋以為當今之憂不在于貨在民有飢勞之怨海內無耳目之變乃箕子所謂佯愚而對也臣不達殷人佯愚之慮欲于不問而言甲子之事故念生鮮死久復不敢極諫陳其要請粗言生民之業夫生養之道先食後貨是以先王觀象育物敬授民時使男不逋畝女不下機故君臣之道行王路之教通由是言之食者乃有國之所寶生民之至貴也竊見比年以來良苗盡于蝗螟之口杼柚空於公私之求野無青草室如懸罄所急朝夕之餐所患靡盬之事豈謂錢貨之鍥薄銖兩之輕重哉就使當今沙礫化為南金瓦石變為和玉使百姓渴無所飲飢無所食雖皇羲之純德唐虞之文明猶不能以保蕭牆之內也蓋民可百年無貨不可一朝有飢故食為至急也今議者不達農殖之本多言鑄冶之便或欲因緣行詐以賈國利國利將盡取者爭競造鑄之端于是乎生蓋萬人鑄之一人奪之猶不能給況今一人鑄之則萬人奪之乎雖以陰陽為炭萬物為銅役不食之民使不飢之士猶不能足無厭之求也夫欲民殷財阜要在止役禁奪則百姓不勞而足陛下聖德愍海內之憂戚傷天下之艱難欲鑄錢齊貨以救其敝此猶養魚于沸鼎之中棲鳥于烈火之上水木本魚鳥之所生也用之不時必至焦爛願陛下寬鍥薄之禁後冶鑄之議聽民庶之謠吟問路叟之所憂瞰三光之文耀視山河之分流天下之心國家大事粲然皆見無有遺惑者矣臣嘗誦詩至于鴻鴈于野之勞哀勤百堵之事每喟爾長懷中篇而歎近聽征夫飢勞之聲甚于斯歌是以追悟匹婦吟魯之憂始于此乎見白駒之意屏營倣徨不能監寐伏念當今地廣而不得耕民衆而無所食群小競起進秉國之位鷹揚天下烏鈔求飽吞肌及骨並噬無厭誠恐卒有役夫窮匠起于板築之間投斤攘臂登高遠呼使愁怨之民狼跳虎駭嚮應雲合八方分崩中夏魚潰雖方尺之錢何能有救其危猶舉函牛之鼎絓纖枯之末詩人所以眷然顧之潸焉出涕者也若不早寤恐將及之臣東野狂暗不達大義緣廣及之時對過所問知必以身脂鼎鑊為天下笑見袁宏後漢紀二十六後漢劉陶傳晉書食貨志通典八
