body:
  text: 襄楷詣闕上疏臣聞皇天不言以文象設教堯舜雖聖必曆象日月星辰察五緯所在故能享百年之壽為萬世之法臣竊見去歲五月熒惑入太微犯帝坐出端門不軌常道其閏月庚辰太白入房犯心小星震動中耀中耀天王也傍小星者天王子也夫太微天廷五帝之坐而金火罰星揚光其中于占天子凶又俱入房心法無繼嗣今年歲星久守太微逆行西至掖門還竊執法歲星木精好生惡殺而淹留不去者咎在仁德不修誅罰太酷前七年十二月熒惑與歲星俱入軒轅逆行四十餘日而鄧皇后誅其冬大寒殺鳥獸害魚鱉城傍竹柏之葉有傷枯者臣聞于師曰柏傷竹枯不出三年天子當之今洛陽城中人夜無故叫呼云有火光人聲正喧于占亦與竹柏枯同自春夏以來連有霜雹及大雨雷而臣作威作福刑罰急刻之所感也太原太守劉瓆南陽太守成瑨志除姦邪其所誅翦皆合人望而陛下受閹豎之譖乃遠加考逮三公上書乞哀瓆等不見採察而嚴被譴讓憂國之臣將遂杜口矣臣聞殺無罪誅賢者禍及三世自陛下即位以來頻行誅伐梁孫鄧並見族滅其從坐者又非其數李雲上書明主所不當諱杜衆乞死諒以感悟聖朝曾無赦宥而并被殘戮天下之人咸知其冤漢興以來未有拒諫誅賢用刑太深如今者也永平舊典諸當重論皆須冬獄先請後刑所以重人命也頃數十歲以來州郡玩習又欲避請讞之煩輒託疾病多死牢獄長吏殺生自己死者多非其罪魂神冤結無所歸訴淫厲疾疫自此而起昔文王一妻誕致十子今宮女數千未聞慶育宜修德省刑以廣螽斯之助又七年六月十三日河內野王山上有龍死長可數十丈扶風有星隕為石聲聞三郡夫龍形狀不一小大無常故周易況之大人帝王以為符瑞聞河內龍死諱以為蛇夫龍能變化蛇亦有神皆不當死昔秦之將衰華山神操璧以授鄭客曰今年祖龍死始皇逃之死于沙丘王莽天鳳二年訛言黃山宮有死龍之異後漢誅莽光武復興虛言猶然況于實邪夫星辰麗天猶萬國之附王者也下將畔上故星亦畔天石者安類墜者失勢春秋石五隕宋其後襄公為楚所執秦之亡也石隕東郡今隕扶風與先帝園陵相近不有大喪必有畔逆案春秋以來及古帝王未有河清及學門自壞者也臣以為河者諸侯位也清者屬陽濁者屬陰河當濁而反清者陰欲為陽諸侯欲為帝也太學天子教化之宮其門無故自壞者言文德將喪教化廢也京房易傳曰河水清天下平今天垂異地吐妖人厲疫三者並時而有河清猶春秋麟不當見而見孔子書之以為異也臣前上琅邪宮崇受于吉神書不合明聽臣聞布穀鳴于孟夏蟋蟀吟于始秋物有微而志信人有賤而言忠臣雖至賤誠願賜清間極盡所言見後漢襄楷傳復上書臣伏見太白北入數日復出東方其占當有大兵中國弱四夷強臣又推步熒惑今當出而潛必有陰謀皆由獄多冤結忠臣被戮德星所以久守執法亦為此也陛下宜承天意理察冤獄為劉瓆成瑨虧除罪辟追録李雲杜衆等子孫夫天子事天不孝則日食星期比年日食于正朔三光不明五緯錯戾前者宮崇所獻神書專以奉天地順五行為本亦有興國廣嗣之術其文易曉參同經典而順帝不行故國胤不興孝沖孝質頻世短祚臣又聞之得主所好自非正道神為生虐故周衰諸侯以力征相尚于是夏育申休宋萬彭生任鄙之徒生于其時殷紂好色妲己是出葉公好龍真龍遊廷今黃門常侍天刑之人陛下愛待兼倍常寵係嗣未兆豈不為此天官宦者星不在紫宮而在天市明當給使主市里也今乃反處常伯之位實非天意又聞宮中立黃老浮屠之祠此道清虛貴尚無為好生惡死省欲去奢今陛下嗜欲不去殺罰過理既乖其道豈獲其祚哉或言老子入夷狄為浮屠浮屠不三宿桑下不欲久生恩愛精之至也天神遣以好女浮屠曰此但革囊盛血遂不盼之其守一如此乃能成道今陛下淫女豔婦極天下之麗甘肥飲美單天下之味奈何欲如黃老乎見後漢襄楷傳召詣尚書問狀對臣聞古者本無宦臣武帝末春秋高數遊後宮始置之耳後稍見任至於順帝遂益繁熾今陛下爵之十倍于前至今無繼嗣者豈獨好之而使之然乎見後漢襄楷傳又袁宏後漢紀二十二延熹九年舉至孝對策陳便宜臣聞之于師曰漢為火德火生于木木盛于火故其德為孝其象在周易之離夫在地為火在天為日在天者用其精在地者用其形夏則火王其精在天溫暖之氣養生百木是其孝也冬時則廢其形在地酷烈之氣焚燒山林是其不孝也故漢制使天下誦孝經選吏舉孝廉夫喪親自盡孝之終也今之公卿及二千石三年之喪不得即去殆非所以增崇孝道而克稱火德者也往者孝文勞謙行過乎儉故有遺詔以日易月此當時之宜不可貫之萬世古今之制雖有損益而諒暗之禮未嘗改移以示天下莫遺其親今公卿群寮皆政教所瞻而父母之喪不得奔赴夫仁義之行自上而始敦厚之俗以應乎下傳曰喪祭之禮闕則人臣之恩薄背死亡生者衆矣曾子曰人未有自致者必也親喪乎春秋傳曰上之所為民之歸也夫上所不為而民或為之故加刑罰若上之所為民亦為之又何誅焉昔翟方進以自備宰相而不敢踰制至遭母憂三十六日而除夫失禮之源自上而始古者大喪三年不呼其門所以崇國厚俗篤化之道也事失宜正過勿憚改天下通喪可如舊禮臣聞有夫婦然後有父子有父子然後有君臣有君臣然後有上下有上下然後有禮義禮義備則人知所厝矣夫婦人倫之始王化之端故文王作易上經首乾坤下經首咸恆孔子曰天尊地卑乾坤定矣夫婦之道所謂順也堯典曰釐降二女于媯汭嬪于虞降者下也嬪者婦也言雖帝堯之女下嫁于虞猶屈體降下勤修婦道易曰帝乙歸妹以祉元吉婦人謂嫁曰歸言湯以娶禮歸其妹于諸侯也春秋之義王姬嫁齊使魯主之不以天子之尊加于諸侯也今漢承秦法設尚主之儀以妻制夫以卑臨尊違乾坤之道失陽唱之義孔子曰昔聖人之作易也仰則觀象于天俯則察法于地覩鳥獸之文與天地之宜近取諸身遠取諸物以通神明之德以類萬物之情今觀法于天則北極至尊四星妃后察法于地則崑山象夫卑澤象妻覩鳥獸之文鳥則雄者鳴雊雌能順服獸則牡為唱導牝乃相從近取諸身則乾為人首坤為人腹遠取諸物則木實屬天根荄屬地陽尊陰卑蓋乃天性且詩初篇實首關睢禮始冠婚先正夫婦天地六經其旨一揆宜改尚主之制以稱乾坤之性遵法堯湯式是周孔合之天地而不謬質之鬼神而不疑人事如此則嘉瑞降天吉符出地五韙咸備各以其敘矣昔者聖人建天地之中而謂之禮禮者所以興福祥之本而止禍亂之源也人能枉欲從禮者則福歸之順情廢禮者則禍歸之推禍福之所應知興廢之所由來也衆禮之中婚禮為首故天子娶十二天之數也諸侯以下各有等差事之降也陽性純而能施陰體順而能化以禮濟樂節宣其氣故能豐子孫之祥致老壽之福及三代之季淫而無節瑤臺瓊宮陳妾數百陽竭于上陰隔于下故周公之戒曰不知稼穡之艱難不聞小人之勞惟耽樂之從時亦罔或克壽是其明戒後世之人好福不務其本惡禍不易其軌傳曰截趾適屨孰云其愚何與斯人追欲喪軀誠可痛也臣竊聞後宮采女五六千人從官侍使復在其外冬夏衣服朝夕稟糧耗費縑帛空竭府藏徵調增倍十而稅一空賦不辜之民以供無用之女百姓窮困于外陰陽隔塞于內故感動和氣災異屢臻臣愚以為諸非禮聘未曾幸御者一皆遣出使成妃合一曰通怨曠和陰陽二曰省財用實府庫三曰修禮制綏眉壽四曰配陽施祈螽斯五曰寬役賦安黎民此誠國家之弘利天人之大福也夫寒熱晦明所以為歲尊卑奢儉所以為禮故以晦明寒暑之氣尊卑侈約之禮為其節也易曰天地節而四時成春秋傳曰惟器與名不可以假人孝經曰安上治民莫善于禮禮者尊卑之差上下之制也昔季氏八佾舞于庭非有傷害困於人物而孔子猶曰是可忍也孰不可忍洪範曰惟辟作威惟辟作福惟辟玉食凡此三者君所獨行而臣不得同也今臣僭君服下食上珍所謂害于而家凶于而國者也宜略依古禮尊卑之差及董仲舒制度之別嚴督有司必行其命此則禁亂善俗足用之要見後漢荀淑附傳又略見袁宏後漢紀二十二臣聞火生于木故其德孝漢之諡帝稱孝其義取之也故漢制使天下皆誦孝經選吏則舉孝廉蓋以孝為務也夫喪親自盡孝之終也今二千石不得行三年喪非所以崇孝道而稱大德也頃者漢嗣數乏枝葉不繁其咎未必不由此往者文帝勞謙自約行過乎儉故有遺詔易月謂夷惠激俗當身而已不可以貫萬世而為後嗣法者也見御覽五百四十五五百六十二引荀氏家傳較范書多出五六句奏記讓孝廉伏惟孝廉古之貢士賢則光君愚則虧政爽以迂暗荷當大選見書鈔原本七十九貽李膺書久廢過庭不聞善誘岵瞻望惟日為歲知以直道不容于時山樂水家于陽城道近路夷當即聘問狀嬰疾闕于所仰頃聞上帝震怒貶黜鼎臣人鬼同謀以為天子當貞觀二五利見大人謂夷之初旦明而未融虹霓揚輝棄和取同方今天地氣閉大人休否智者見險投以遠害雖匱人望內合私願想甚欣然不為恨也願怡神無事偃息衡門任其飛沈與時抑揚見後漢李膺傳與郭叔都書陳季方才德秀出超世逸群金相玉質六章虎變終軍賈誼誠無以加宜遂貢之宰相盛其龍光鹽車之驥自非伯樂無以顯名採光剖璞以獨見寶實為足下利之見北堂書鈔三十三御覽六百三十一女誡詩云泉源在左淇水在右女子有行遠父母兄弟明當許嫁配適君子竭節從理昏定晨省夜臥早起和顏悅色事如依恃正身潔行稱為順婦以崇螽斯百葉之祉婚姻九族云胡不喜聖人制禮以隔陰陽七歲之男王母不抱七歲之女王父不持親非父母不與同車親非兄弟不與同筵非禮不動非義不行是故宋伯姬遭火不下堂知必為災傅母不來遂成于灰春秋書之以為高也見藝文類聚二十三漢紀序昔在上聖唯建皇極經緯天地觀象立法乃作書契以通宇宙揚于王庭厥用大焉先王以光演大業肆于時夏亦唯翼翼以監厥後永世作典夫立典有五志焉一曰達道義二曰彰法式三曰通古今四曰著功勛五曰表賢能于是天人之際物之宜粲然顯著罔不能備矣世濟其執不隕其業損益盈虛與時消息雖臧否不同其揆一也是以聖上穆然惟文之瞻前顧後是紹是維臣悅職監祕書攝官承乏祗奉明詔竊惟其宜謹約撰舊書通而敘之總為帝紀列其年月比其時事撮要舉凡存其大體旨少所缺務從省約以副本書以為要結未克厥中亦各其志如其得失以俟君子焉見荀悅漢紀第一凡漢紀其稱年本紀表志傳者書家本語也其稱論者臣悅所論粗表大事以參得失以廣視聽也惟漢四百二十有六載皇帝投亂反正統武興文永惟祖宗之洪業思光啓于萬國闡綜大猷命立國典以及群籍于是乃作考舊通連體要以述漢紀易稱多識前言往行以畜其德詩云古訓是武中興已前一事之事明主賢臣規模法則亦足以監矣撰漢書百篇以綜往事庶幾來者亦有監乎此其辭曰茫茫上古結繩而治書契爰作典謨云備明德坐馨光于萬祀其在中葉實有陶唐丕顯伊則配天惟明蕩蕩厥猷有煥其章至于有周對日重光於赫大漢統辟元功穆穆惟祇二祖六宗明明皇帝纂承洪緒遭國閔凶因于荼蓼實天生德應運建主矯矯俊臣惟國作輔綏我思成有德思祜撥亂反正大建惟序武功既列乃贊斯文惟前軌命我小臣爰著典籍以立舊勳綜往昭來永監後昆侍中悅上見漢紀第三十昔在上聖惟建皇極經緯天地觀象立法及作書契以通宇宙揚于王庭厥用大焉先王光演大業肆于時夏亦惟厥後永世作典夫立典有五志焉一曰達道義二曰章法式三曰通古今四曰著功勳五曰表賢能于是天人之際事物之宜粲然顯著罔不備矣世濟其執不隕其業損益盈虛與時消息臧否不同其一揆也漢四百有六載撥亂反正統武興文永惟祖之洪業思光啓乎萬嗣聖上穆然惟文之恤瞻前顧後是紹是繼闡崇大猷命立國典于是綴敘舊書以述漢書中興以前明主賢臣得失之軌亦足以觀矣見後漢荀悅傳引漢紀序校之本書頗有刪改并移易其次第録此一篇足見史家所載不盡合本書也漢紀目録高祖一第一高祖二第二高祖三第三高祖四第四孝惠第五高后第六孝文上第七孝文下第八孝景第九孝武一第十孝武二第十一孝武三第十二孝武四第十三孝武五第十四孝武六第十五孝昭第十六孝宣一第十七孝宣二第十八孝宣三第十九孝宣四第二十孝元上第二十一孝元中弟二十二孝元下第二十三孝成一第二十四孝成二第二十五孝成三第二十六孝成四第二十七孝哀上第二十八孝哀下第二十九孝平第三十凡漢紀十二世十一帝通王莽二百四十二年一祖三宗高祖定天下孝惠高后值國家無事百姓安集太宗升平世宗建功中宗治平昭景稱治元成哀平歷世陵遲莽遂纂國也凡祥瑞黃龍見鳳凰集麒麟臻神馬出神鳥翔神雀集白虎仁獸獲寶鼎升寶磬神光見山稱萬歲甘露降芝草生嘉禾茂玄稷降醴泉涌木連理凡災異大者日蝕五十六地震十六天開地裂五星集于東井各一太白再經天星孛二十四山崩三十四隕石十一星隕如雨二星晝見三火災二十四河漢水大泛溢為人害十河泛一冬雷五夏雪三冬無冰二天雨血雨草雨魚死人復生男子化為女子嫁為人婦生子枯木復生大石自立建安元年上巡省幸許昌以鎮萬國外命元輔征討不庭內齊七政允亮聖業綜練典籍兼覽傳記其三年詔給事中祕書監荀鈔撰漢書略舉其要假以不直尚書給紙筆虎賁給書吏悅于是約集舊書書撮序表志總為帝紀通比其事例繫年月其祖宗功勳先帝事業國家綱紀天地災異功臣名賢奇策善言殊德異行法式之典凡在漢書者本末體殊大略粗舉其紀傳所遺闕者差少而求志勢有所不能盡繁重之語凡所行之事出入省要刪略其文凡為三十卷數十餘萬言作為帝紀省約易習無妨本書有便于用其旨云爾會悅遷為侍中其五年書成乃奏記云四百有一十六載謂書奏之歲歲在庚辰昔晉之乘楚之檮杌魯之春秋虞夏商周之書其揆一也皆古之令典立之則成其法棄之則墜于地瞻之前存忍焉則廢故君子重之漢書記其義同矣凡漢記有法式焉有監戒焉有廢亂焉有持平焉有兵略焉有政化焉有休祥焉有災異焉有華夏之事焉有四夷之事焉有常道焉有權變焉有策謀焉有詭説焉有術藝焉有文章焉斯皆明主賢臣命世立業群后之盛勛髦俊之遺事是故質之事實而不誣通之萬方而不泥可以興可以治可以動可以靜可以言可以行懲惡而勸善獎成而懼敗茲亦有國之常訓典籍之淵林雖云撰之者陋淺而本末成焉爾故君子可觀之矣見漢紀何大復本又黃姬水本又蔣國祥本迎駕都許議昔高祖東伐為義帝縞素而天下歸心自天子播越將軍首唱義兵徒以山東擾亂未能遠赴關右然猶分遣將帥蒙險通使雖禦難于外乃心無不在王室是將軍匡天下之素志也今車駕旋軫義士有存本之思百姓懷感舊之哀誠因此時奉主上以從民望大順也秉至公以服雄傑大略也扶弘義以致英俊大德也天下雖有逆節必不能為纍明矣韓暹楊奉其敢為害若不時定四方生心後雖慮之無及見魏志荀彧傳散齋得宴樂議禮志云三日齋一日用之猶恐不敬二日伐鼓何居又云君致齋于外夫人致齋于內散齋則是事之漸然則散齋未絶外內與宴樂之事也今一歲之內大小祭祀齋將三百日如此無復用樂之時古今之制當各從所宜若外張多日而內實犯禮乃所以廢齋也散齋宜得從會宴樂見通典一百四十七田疇讓官議君子之道或出或處斯于為善而已故匹夫守志聖人各因而成之鍾繇以為原思辭粟仲尼不與子路拒牛謂之止善雖可以激清勵濁猶不足多也疇雖不合大義有益推讓之風宣如世子議見魏志田疇傳注引魏書報趙儼書輒白曹公公文下郡綿綿絹悉以還民見魏志趙儼傳報曹公書紹聚衆官渡欲與公決勝負公以至弱當至強若不制必為所乘是天下之大機也且紹布之雄能聚人而不能用也以公神武明哲而奉以大順何向而不濟今軍食雖少未若楚漢在榮陽成皋間也是時劉項莫肯先退者以為先退則勢屈也公以十分居一之衆畫地而守之扼其喉而不能進已半年矣情見勢竭必將有變此用奇之時不可失也見袁宏後漢紀二十九又見後漢荀彧傳勸進魏公箋中軍師王凌謝亭侯荀攸前軍師東武亭侯鍾繇左軍師涼茂右軍師毛玠平虜將軍華鄉侯劉勳建武將軍清苑亭侯劉若伏波將軍高安侯夏侯惇揚武將軍都亭侯王忠奮威將軍樂鄉侯劉展建忠將軍昌鄉亭侯鮮于輔武將軍安國亭程昱大中大夫都鄉侯賈詡軍師祭酒千秋亭董昭都亭侯薛洪南鄉亭侯董蒙關內侯王粲傳巽祭酒王選袁渙王朗張承任藩杜襲中護軍國明亭侯曹洪中領軍萬歲亭侯韓浩行驍騎將軍安平亭侯曹仁領護軍將王圖長史萬潛謝奐袁霸等勸進曰自古三代胙臣以土受命中興封秩輔佐皆所以褒功賞德為國藩衛也往者天下崩亂群凶豪起顛越跋扈之儉不可忍言明公奮身出命以徇其難誅二袁篡盜之逆滅黃巾賊亂之類殄夷首逆芟撥荒穢沐浴霜露二十餘年書契以來未有若此功者昔周公承文武之迹受已成之業高枕墨筆拱揖群后商奄之勤不過二年呂望因三分有二之形據八百諸侯之勢暫把旄鉞一時指麾然皆大啓土宇跨州兼國周公八子並為侯伯白牡騂剛郊祀天地典策備物擬則王室榮章寵盛如此之弘也逮至漢興佐命之臣張耳吳芮其功至薄亦城開地南面稱孤此皆明君達主行之于上賢臣聖宰受之于下三代令典漢帝明制今比勞則周呂逸計功則張吳微論制則齊魯重言地則長沙多然則魏國之封九錫之榮況于舊賞猶懷玉而被褐也且列侯諸將幸攀龍驥得竊微勞佩紫懷黃蓋以百數亦將因此傳之萬世而明公獨辭賞于上將使其下懷不自安上違聖朝歡心下失冠帶至望忘輔弼之大業信匹夫之細行攸等所大懼也見魏志武帝紀注引魏書復勸進魏公伏見魏國初封聖朝發慮稽諆謀群寮然後策命而明公久違上指不即大禮今既虔奉詔命副順衆望又欲辭多當少讓九受一是猶漢朝之賞不行而攸等之請未許也昔齊魯之封奄有東海疆域井賦四百萬家基隆業廣易以立功故能成翼戴之勳立一匡之績今魏國雖有十郡之名猶減于曲阜計其戶數不能參半以藩衛王室立垣樹屏猶未足也且聖上覽亡秦無輔之禍懲曩日震蕩之艱託建忠賢廢墜是為願明公恭承帝命無或拒違見魏志武帝紀注引魏書
