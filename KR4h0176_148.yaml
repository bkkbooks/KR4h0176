body:
  text: 臧旻上書訟第五種臣聞士有忍死之辱必有就事之計故季布屈節于朱家管仲錯行于召忽此二臣以可死而不死者非愛身于須臾貪命于苟活隱其智力顧其權略庶幸逢時有所為耳卒遭高帝之成業齊桓之興伯遺其亡逃之行赦其射鉤之讎拔于囚虜之中信其佐國之謀勳效傳于百世君臣載于篇籍假令二主紀過于纖介則此二臣同死于犬馬沈名于溝壑當何由得申其補過之功建其奇奧之術乎伏見故兗州刺史第五種傑然自建在鄉曲無苞苴之嫌步廟堂無擇言之闕天性疾惡公方不曲故論者說清高以種為上序直士以種為首春秋之義選人所長棄其所短録其小善除其大過種所坐以盜賊公負筋力未就罪致徵徙非有大惡昔虞舜事親大杖則走故種逃亡苟全性命冀有朱家之路以顯季布之會願陛下無遺須臾之恩令種有持忠入地之恨見後漢第五種傳酸棗盟辭漢室不幸皇綱失統賊臣董卓乘釁縱害禍加至尊毒流百姓大懼淪喪社稷翦覆四海兗州刺史岱豫州刺史胄陳留太守邈東郡太守瑁廣陵太守超等糾合義兵竝赴國難凡我同盟齊心一力以致臣節隕首喪元必無二志有渝此盟俾墜其命無克遺育皇天后土祖宗明靈實皆鑒之見後漢臧洪傳袁宏後漢紀二十四魏志臧洪傳答陳琳書隔闊相思發于寤寐幸相去步武之閒耳而以趣舍異規不得相見其為愴恨可為心哉前日不遺比辱雅貺述敘禍福公私切至所以不即奉答者既學薄才鈍不足塞詰亦以吾子攜負側室息肩主人家在東州僕為仇敵以是事人雖披中情墮肝膽猶身疏有罪言甘見怪方首尾不救何能恤人且以子之才窮該典籍豈將暗于大道不達余趣哉然猶復云云者僕以是知足下之言信不由衷將以救禍也必欲算計長短辨咨是非是非之論言滿天下陳之更不明不言無所損又言傷告絶之義非吾所忍行也是以損棄紙筆一無所答亦冀遙忖其心知其計定不復渝變也重獲來命援引古今紛紜六紙雖欲不言焉得已哉僕小人也本乏志用中因行役特蒙傾蓋恩深分厚遂竊大州寧樂今日自還接刃乎每登城勒兵觀主人之旗鼓瞻望帳幄感故友之周旋撫弦搦矢不覺涕流之覆面也何者自以輔佐主人無以為悔主人相接過絶等倫當受任之初自謂究竟大事掃清寇逆共尊王室豈悟天子不悅本州見侵郡將遘牖里之厄陳留克創兵之謀請師見拒辭行被拘使洪故君遂至淪滅區區微節無所獲申豈得復全交友之道重虧忠孝之名乎所以忍悲揮戈收淚告絶若使主人少垂古人忠恕之情來者側席去者克己則僕抗季札之志不為今日之戰矣昔張景明登壇喢血奉辭奔走卒使韓牧讓印主人得地然後但以拜章朝主賜爵獲傳之故旋時之閒不蒙觀過之貸而受夷滅之禍呂奉先討卓來奔請兵不獲告去何罪復見斫刺濱于死亡劉子璜奉使踰時辭不獲命畏君懷親以詐求歸可謂有志忠孝無損霸道者也然輒僵斃麾下不蒙虧除慕進者蒙榮違意者被戮此乃主人之利非遊士之願也故僕鑒戒前人守死窮城亦以君子之違不適敵國故也足下當見久圍不解救兵未至感婚姻之義推平生之好以為屈節而苟生勝守義而傾覆也昔晏嬰不降志於白刃南史不曲筆以求存故身傳圖象名垂後世況僕據金城之固驅士人之力散三年之畜以為一年之資匡困補乏以悅天下何圖築室反耕哉但懼秋風揚塵伯圭馬首南向張揚飛燕旅力作難北鄙將告倒懸之急股肱奏乞歸之記耳主人當鑒戒曹輩反旌退師何宜久辱盛怒暴威於吾城之下哉足下譏吾恃黑山以為救獨不念黃巾之合從邪昔高祖取彭越於巨野光武創基兆於緑林卒能龍飛受命中興帝業苟可輔主興化夫何嫌哉況僕親奉璽書與之從事行矣孔璋足下徼利於境外臧洪投命於君親吾子託身於盟主臧洪策名於長安子謂余身死而名滅僕亦笑子生死而無聞焉本同末離努力努力夫復何言見魏志臧洪傳又後漢臧洪傳載此少四百四十餘字其多出者亦四十餘字今合録之又略見袁宏後漢紀二十八上書陳情臣聞天地之于萬物也好生帝王之于萬人也慈愛陛下統天理物為萬國覆作人父母先慈愛後威武先寬容後刑辟自生齒以上咸蒙德澤而臣兄弟獨以無辜為專權之臣所見批抵青蠅之人所共搆會以臣婚姻王室謂臣將撫其背奪其位退其身受其勢于是遂作飛章以被于臣欲使墜萬仞之坑踐必死之地今陛下忽慈母之仁發投杼之怒尚書背繩墨案空劾不復質確其過置于嚴棘之下便奏正臣罪司隸校尉馮羡佞邪承旨廢于王命驅逐臣等不得旋踵臣奔走還郡沒齒無怨臣誠恐卒為豺狼橫見噬食故冒死欲詣闕披肝膽布腹心刺史張敬好為諂諛張設機網復令陛下興雷電之怒司隸校尉應奉河南尹何豹洛陽令袁騰竝驅爭先若赴仇敵罰及死沒髡剔墳墓但未掘壙出尸剖棺露胔耳昔文王葬枯骨公劉敦行葦世稱其仁今殘酷容媚之吏無折中處平之心不顧無辜之害而興虛誣之誹欲使嚴朝必加濫罰是以不敢觸突天威而自竄山林以俟陛下發神聖之聽啓獨覩之明拒讒慝之謗絶邪巧之言救可濟之人援投溺之命不意滯怒不為春夏息淹恚不為順時怠遂馳使郵驛布告遠近嚴文剋剝痛于霜雪張羅海內設罝萬里逐臣者窮人迹追臣者極車軌雖楚購伍員漢求季布無以過也臣遇罰以來三赦再贖無驗之罪足以蠲除而陛下疾臣愈深有司咎臣甫力止則見掃滅行則為亡虜苟生則為窮人極死則為冤鬼天廣而無以自覆地厚而無以自載蹈陸土而有沈淪之憂遠巖牆而有鎮壓之患精誠足以感于陛下而哲王未肯悟如臣犯元惡大憝足以陳于原野備刀鋸陛下當班布臣之所坐以解衆論之疑臣思入國門坐于胏石之上使三槐九棘平臣之罪而閶闔九重陷穽步設舉趾觸罘罝動行絓羅網無緣至萬乘之前永無見信之期矣國君不可讎匹夫讎之則一國盡懼臣奔走以來三離寒暑陰陽易位當暖反寒春常凄風夏降霜雹又連年大風折拔樹木風為號令春夏布德議獄緩死之時願陛下思帝堯五教在寬之德企成湯避遠讒夫之誡以寧風旱以弭災兵臣聞勇者不逃死智者不重困固不為明朝惜垂盡之命願赴湘沅之波從屈原之悲沈江湖之流弔子胥之哀臣功臣苗緒生長王國懼獨含恨以葬江魚之腹無以自別于世不勝狐死首丘之情營魂識路之懷犯冒王怒觸突帝禁伏于兩觀陳訴毒痛然後登金鑊入沸湯糜爛于熾爨之下九死未悔悲夫久生亦復何聊蓋忠臣殺身以解君怒孝子殞命以寧親怨故大舜不避塗廩浚井之難申生不辭姬氏讒邪之謗臣敢忘斯議不自斃以解明朝之忿哉乞以身塞重責願陛下丐兄弟死命使臣一門頗有遺類以崇陛下寬饒之惠先死陳情臨章涕泣泣血漣如見後漢寇恂附傳又見袁宏後漢紀二十一有刪節舉奏中常侍侯覽罪釁覽貪侈奢縱前後請奪人宅三百八十一所田百一十八頃起立第宅十有六區皆有高樓池苑堂閣相望飾以綺畫丹漆之屬制度重深僭類宮省又豫作壽冢石椁雙闕高廡百尺破人居室發掘墳墓虜奪良人妻略婦子及諸罪釁請誅之見後漢書宦者侯覽傳又奏覽母生時交通賓客干亂郡國見後漢書同上答友勸仕進者吾晝察人事夜看乾象天之所廢不可支也方今遠在明夷之爻值勿用之位蓋盤潛居之時非在天利見之會也雖在原陸猶恐滄海橫流吾其魚也況可冒衝風而乘奔波乎未若岩岫頤神娛心彭老優哉游哉聊以卒歲見抱朴子正郭篇又袁宏後漢紀二十三與此略同又後漢郭泰傳有首四語與陳留盛仲明書足下諸人為時棟梁見文選袁宏三國名臣贊注蘇不韋方伍員論子胥雖云逃命而見用強吳憑闔廬之威因輕悍之衆雪怨舊郢曾不終朝而但鞭墓戮尸以舒其憤竟無手刃後主之報豈如蘇子單特孑立靡因靡資強讎豪援據位九卿城闕天阻宮府幽絶埃塵所不能過霧露所不能沾不韋毀身憔慮出於百死冒觸嚴禁陷族禍門雖不獲逞為報已深況復分體斷首以毒生者使皓懷忿結不得其命猶假手神靈以斃之也力唯匹夫功隆千乘比之于員不以優乎見後漢蘇章傳與郭林宗書大木將顛非一繩所維何為棲棲不遑寧處見後漢紀失父零丁敬白諸君行路者敢告重罪自為禍積惡致災天困我今月七日失阿奓念此酷毒可痛傷當以重幣用相償請為諸君說事狀我父軀體與衆異脊背傴僂捲如胾脣吻差不相值此其庶形何能備請復重陳其面目鴟頭鵠頸獦狗啄眼淚鼻涕相追逐吻中含納無齒牙食不能嚼左右蹉似西域駱駝請復重陳其形骸為人雖長甚細材面目芒蒼如死灰眼眶白陷如羹杯見御覽五百九十八遺令敕子吾生于昏暗之世值乎淫侈之俗生不得匡世濟時死何忍自同于世氣絶便斂斂以時服衣足蔽形棺足周身斂畢便穿穿畢便埋其明堂之奠干飯寒水飲食之物勿有所下墳封高下令足自隱知我心者李子堅王子炳也今皆不在制之在爾勿令鄉人宗親有所加也見後漢書范冉傳上書薦孟嘗臣前後七表言故合浦太守孟嘗而身輕言微終不蒙察區區破心徒然而已嘗安仁弘義耽樂道德清行出俗能幹絶群前更守宰移風改政去珠復還饑民蒙活且南海多珠財産易積掌握之內價盈兼金而嘗單身謝病躬耕壟次慝景藏采不揚華藻實羽翮之美用非徒腹背之毛也而沈淪草莽好爵莫及廊廟之寶棄于溝渠且年歲有訖桑榆行盡而忠貞之節永謝聖時臣誠傷心私用流涕夫物以遠至為珍士以稀見為貴槃木朽株為萬乘用者左右為之容耳王者取士宜拔衆之所貴臣以斗筲之姿趨走日月之側思立微節不敢苟私鄉曲竊感禽息亡身進賢見後漢孟嘗傳上諫臣聞之曾子扣舷易水魚聞入淵鳥驚參天見引會稽典録奏罷鴻都文學伏承有詔敕中尚方為鴻都文學樂松江覽等三十二人圖象立贊以勸學者臣聞傳曰君舉必書書而不法後嗣何觀案松覽等皆出于微蔑斗筲小人依憑世戚附託權豪俯眉承睫徼進明時或獻賦一篇或鳥篆盈簡而位升郎中形圖丹青亦有筆不點牘辭不辨心假手請字妖僞百品莫不被蒙殊恩蟬蛻滓濁是以有識掩口天下嗟歎臣聞圖象之設以昭勸戒欲令人君動鑒得失未聞豎子小人詐作文頌而可妄竊天官垂象圖素者也今太學東觀足以宣明聖化願罷鴻都之選以消天下之謗見後漢陽球傳奏劾王甫段熲中常侍冠軍將軍王甫奉職多邪奸以事上其所彈糾皆由睚眥勃海之誅宋后之廢甫之罪也太尉段熲以征伐微功位極人臣不能竭忠報國而諂佞幸宜竝誅戮以示海內見袁宏後漢靈帝紀中光和二年遷平原相教相前蒞高唐志掃姦鄙遂為貴郡所見枉舉昔桓公釋管仲射鉤之讎高祖赦季布逃亡之罪雖以不德敢忘前義況君臣分定而可懷宿昔哉今一蠲往愆期諸來效若受教之後而不改姦狀者不得復有所容矣見後漢陽球傳敕中都官從事且先去大猾當次案豪右見後漢陽球傳春秋公羊經傳解詁序昔者孔子有云吾志在春秋行在孝經此二學者聖人之極致治世之要務也傳春秋者非一本據亂而作其中多非常異義可怪之論說者疑惑至有倍經任意反傳違戾者其勢惟問不得不廣是以講誦師言至于百萬猶有不解時加釀嘲辭援引他經失其句讀以無為有甚可閔笑者不可勝記也是以治古學貴文章者謂之俗儒至使賈逵緣隙奮筆以為公羊可奪左氏可興恨先師觀聽不決多隨二創此世之餘事斯豈非守文持論敗績失據之過哉余竊悲之久矣往者略依胡毋生條例多得其正故遂隱括使就繩墨焉見唐石經本奏上靈懷皇后尊號春秋之義母以子貴宜改葬皇妣追上尊號比穆宗敬宗故事見袁宏後漢紀二十七奏行六隱事太史王立說孝經六隱事令朝廷行之消卻災邪有益聖躬袁宏見後漢紀二十六復奏立學深厚此聖人祕奧行之無損同上被徵少府上書拒命涼州擾亂鯨鯢未滅此臣奮發效命之秋吏士踊躍戀恩念報各遮臣車辭聲氏懇惻未得即路也輒且行前軍事盡心慰恤效力行陳見魏志董卓傳注引靈帝紀斨將湟中義從及秦胡兵皆諧臣曰牢直不華廩賜斷絶妻子飢凍牽挽臣車使不得行羌胡敝腸狗態臣不能禁止輒將順安慰增異復上見後漢董卓傳被璽書拜并州牧復上書拒命臣既無老謀又無壯士天恩誤加掌戎十年士卒大小相狎彌久戀臣畜養之恩為臣奮一旦之命乞將之北州效力邊陲見後漢董卓傳又魏志董卓傳注引靈帝紀到澠池上書請收張讓等臣伏惟天下所以有逆不止者各由黃門常侍張讓等侮慢天常操擅王命父子兄弟竝據州郡一書出門便獲千金京畿諸郡數百萬膏腴美田皆屬讓等至使怨氣上蒸妖賊蜂起臣前奉詔討于扶羅將士飢乏不肯渡河皆言欲詣京師先誅閹豎以除民害從臺閣求乞資直臣隨慰撫以至新安臣聞揚湯止沸不如滅火去薪潰癰雖痛勝如養肉及溺呼船悔之無及昔趙鞅興晉陽之甲以逐君側之惡人今臣輒鳴鼓如洛陽請收讓等以清姦穢見魏志董卓傳注後漢董卓傳注竝引典略又見後漢董卓傳魏志董卓傳又略見袁宏後漢紀二十五署教司徒掾士一不得除用見吳志士燮傳注引吳書策廢少帝案後漢董卓傳遂脅太后策廢少帝蓋卓矯董太后策也孝靈皇帝不究高宗眉壽之𧙓早棄臣子皇帝承紹海內側望而帝天姿輕佻威儀不恪在喪慢惰衰如故焉凶德既彰淫穢發聞損辱神器忝污宗廟皇太后教無母儀統政荒亂永樂太后暴崩衆論惑焉三網之道天地之紀乃有闕罪之大者陳留王協聖德偉茂規矩邈然豐下悅上有堯圖之表居喪哀戚言不及邪岐嶷之性有周成之懿休聲美稱天下所聞宜承洪業為萬世統可以承宗廟廢皇帝為弘農王皇太后還政見魏志董卓傳注引獻帝起居注又後漢董卓傳
