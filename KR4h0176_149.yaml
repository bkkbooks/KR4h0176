body:
  text: 蔡雍霖雨賦夫何季秋之淫雨兮既彌日而成霖瞻玄雲之暗暗兮聽長霤之淋淋中宵夜而嘆息起飾帶而撫琴見藝文類聚二案此賦類聚編于魏曹愁霖賦後題為又愁霖賦張溥等因收入子建集今考文選張協雜詩注引蔡雍霖雨賦云瞻玄雲之暗暗聽長雨之霖霖曹植美女篇引蔡雍霖雨賦云中宵夜而嘆息知此賦在蔡集中漢津賦夫何大川之浩浩兮洪流渺以玄清配名位乎天漢兮披厚土而載形發源自乎嶓冢兮引漾澧而東征納陽谷之所吐兮兼漢沔之殊名總畎澮之群液兮演西土之陰精遇萬山以左回兮旋襄陽而南縈切大別之東山兮與江湘乎通靈嘉清源之體勢兮淡澶湲以安流鱗甲育其萬類兮蛟龍集以嬉遊明珠胎于靈蚌兮夜光潛乎玄洲維神寶其充盈兮豈魚龜之足收于是遊目騁觀南援三州北集京都上控隴坻下接江湖導財運貨懋遷有無既乃風飆蕭瑟勃焉竝興陽侯沛以奔騖洪濤涌以沸騰願乘流以上下窮滄浪乎三澨覷朝宗之形兆瞰洞庭之交會見藝文類聚八初學記七古文苑述行賦延熹二年秋霖雨逾月是時梁冀新誅而徐璜左悺等五侯擅貴于其處又起顯陽苑于城西人徒凍餓不得其命者甚衆白馬令李雲以直言死鴻臚陳君以救雲抵罪璜以余能鼓琴白朝廷敕陳留太守發遣余到偃師病不前得歸心憤此事遂託所過述而成賦余有行于京洛兮遘淫雨之經時塗迍邅其蹇連兮潦汙滯而為災乘馬蹯而不進兮心鬱悒而憤思聊弘慮以存古兮宣幽情而屬詞久宿余于大梁兮誚無忌之稱神哀晉鄙之無辜兮忽朱亥之篡軍歷中牟之舊城兮憎佛肸之不臣問寧越之裔胄兮藐髣佛而無聞經圃田而瞰北境兮晤衛康之封疆迄管邑而增歎兮慍叔氏之啓商過漢祖之所隘兮弔紀信于滎陽降虎牢之曲陰兮路丘墟以盤縈勤諸侯之遠戍兮侈申子之美城稔濤塗之愎惡兮陷夫人以大名登長阪以淩高兮陟蔥山之嶢陘建撫體而立洪高兮經萬世而不傾回峭峻以降阻兮小阜寥其異形岡岑紆以連屬兮溪谷敻其杳冥迫嵯峨以乖邪兮廓巖壑以崢嶸攢棫朴而雜榛楛兮被浣濯而羅生布𧄸菼與臺菌兮緣層崖而結莖行遊目以南望兮覽太室之威靈顧大河于北垠兮瞰洛汭之始并追劉定之攸儀兮美伯禹之所營悼太康之失位兮愍五子之歌聲尋修軌以增舉兮邈悠悠之未央山風汩以飆涌兮氣懆懆而厲涼雲鬱術而四塞兮雨濛濛而漸唐僕夫疲而劬瘁兮我馬虺頽以玄黃格莽丘而稅駕兮陰曀曀而不陽哀衰周之多故兮眺瀕隈而增感忿子帶之淫逸兮唁襄王于壇坎悲寵嬖之為梗兮心惻愴而懷慘乘舫舟而泝湍流兮浮清波以橫厲想宓妃之靈光兮神幽隱以潛翳實熊耳之泉液兮總伊瀍與澗瀨通渠源于京城兮引職貢乎荒裔操吳榜其萬艘兮充王府而納最濟西溪而容與兮息鞏都而後逝愍簡公之失師兮疾子朝之為害玄雲黯以凝結兮集零雨之溱溱路阻敗而無軌兮塗濘溺而難遵率陵阿以登降兮赴偃師而釋勤壯田橫之奉首兮義二士之俠墳佇淹留以候霽兮感憂心之殷殷并日夜而遙思兮宵不寐以極晨候風雲之體勢兮天牢湍而無文彌信宿而後闋兮思逶迤以東運見陽光之皓皓兮懷少弭而有欣命僕夫其就駕兮吾將往乎京邑皇家赫而天居兮萬方徂而星集貴寵扇以彌熾兮僉守利而不戢前車覆而未遠兮後乘驅而競入窮變巧于臺榭兮民露處而寢溼清嘉穀于禽獸兮下糠粃而無粒弘寬裕于便辟兮糾忠諫其駸急懷伊呂而黜逐兮道無因而獲入唐虞眇其既遠兮常俗生于積習周道鞠為茂草兮哀正路之日澀觀風化之得失兮猶紛拿其多違無亮采以匡世兮亦何為乎此畿甘衡門以寧神兮詠都人而思歸爰結蹤而回軌兮復邦族以自綏亂曰跋涉遐路艱以阻兮終其永懷窘陰雨兮歷觀群都尋前緒兮考之舊聞厥事舉兮登高斯賦義有取兮則善戒惡豈云苟兮翩翩獨征無儔與兮言旋言復我心胥兮見古文苑又略見藝文類聚二十七玄表賦庶小善之有益見文選謝眺拜中書記室辭隨王箋注協和婚賦惟情性之至好歡莫備乎夫婦受精靈之造化固神明之所使事深微以玄妙實人倫之端始考遂初之原本覽陰陽之綱紀乾坤和其剛柔艮兌感其脢腓葛覃恐其失時標梅求其庶事惟休和之盛代男女得乎年齒婚姻協而莫違播欣欣之繁祉良辰既至婚禮以舉二族崇飾威儀有序嘉賓僚黨祁祁雲聚車服照路驂騑如舉既臻門屏結軌下車阿傅御豎雁行蹉跎麗女盛飾曄如春華見初學記十四古文苑其在近也若神龍采鱗翼將舉其既遠也若披雲緣漢見織女立若碧山亭亭豎動若翡翠奮其羽衆色燎照視之無主面若明月輝似朝日色若蓮葩肌如凝蜜見藝文類聚十七御覽三百八十一長枕橫施大被竟床莞蒻和軟茵褥調良見北堂書鈔一百三十四粉黛弛落發亂叉脫見書鈔一百三十五檢逸賦夫何姝妖之媛女顏煒燁而含榮普天壤其無儷曠千載而特生余心悅于淑麗愛獨結而未并情罔象而無主意徙倚而左傾晝騁情以舒愛夜託夢以交靈思在口而為簧鳴哀聲獨不敢聆見北堂書鈔一百十青衣賦金生沙礫珠出蚌泥歎茲窈窕産于卑微盼倩淑麗皓齒蛾眉玄髮光潤領如螬蠐修長冉冉碩人其頎綺繡丹裳躡蹈絲扉盤跚蹴蹀坐起昂低和畼善笑動揚朱脣都冶武媚卓躒多姿精慧小心趨事如飛中饋裁割莫能雙追關雎之潔不蹈邪非察其所履世之鮮希宜作夫人為衆女師伊何爾命在此賤微代無樊姬楚莊晉妃感昔鄭季平陽是私故因楊國歷爾邦畿雖得嬿娩舒寫情懷寒雪翩翩充庭盈階兼裳纍鎮展轉倒頽曶昕將曙雞鳴相摧飭駕趣嚴將舍爾乖矇冒矇冒思不可排停停溝側噭噭青衣我思遠逝爾思來追明月昭昭當我戶扉條風狎獵吹豫床帷河上逍遙徙倚庭階南瞻井柳仰察斗機非彼牛女隔于河維思爾念爾惄焉且飢見藝文類聚三十五初學記十九短人賦侏儒短人僬僥之後出自外域戎狄別種去俗歸義慕化企踵遂在中國形貌有部名之侏儒生則象父唯有晏子在齊辨勇匡景拒崔加刃不恐其餘尫么劣厥僂窶㗲嘖怒語與人相距矇昧嗜酒喜索罰舉醉則揚聲罵詈恣口衆人患忌難與竝侶是以陳賦引譬比偶皆得形象誠如所語其詞曰雄荊雞兮鶩鸊鵜鶻鳩雛兮鶉鷃䳄冠戴勝兮啄木兒觀短人兮形若斯巴巔馬兮柙下駒蟄地蝗兮蘆即且繭中蛹兮蠶蠕蝢視短人兮形若斯木門閫兮梁上柱弊鑿頭兮斷柯斧鞞𩌇鼓兮補履朴脫椎枘兮禱薤杵視短人兮形如許見本集初學記十九引兩條瞽師賦夫何矇眛之瞽兮心窮忽以鬱伊目冥冥而無睹兮嗟求煩以愁悲撫長笛以攄憤兮氣轟鍠而橫飛詠新詩之悲歌兮舒滯積而宣鬱何此聲之悲痛兮愴然淚以潛惻類離鵾之孤鳴似杞婦之哭泣見北堂書鈔一百十七引兩條初學記十六御覽七百四十時牢落以失次咢𦀘蹇而陽絶見文選文賦注琴賦爾乃言求茂木周流四垂觀彼椅桐層山之陂丹華煒燁緑葉參差甘露潤其末涼風扇其枝鸞鳳翔其巔玄鶴巢其岐考之詩人琴瑟是宜爰制雅器協之鍾律通理治性恬淡清溢爾乃閒關九絃出入律呂屈伸低昂十指如雨清聲發兮五音舉韻宮商兮動徵羽曲引興兮繁絲撫然後哀聲既發祕弄乃開左手抑揚右手徘徊指掌反覆抑案藏摧于是繁絃既抑雅韻復揚仲尼思歸鹿鳴三章梁甫悲吟周公越裳青雀西飛別鶴東翔飲馬長城楚曲明光楚姬遺歎雞鳴高桑走獸率舞飛鳥下翔感激絃歌一低一昂見藝文類聚四十四北堂書鈔一百九引九條初學記十六文選文賦注又陸機擬古詩注引作琴頌頌即賦字寫誤一彈三欷悽有餘哀見書鈔一百九丹弦既張八音既平文選江淹雜擬詩注苟斯樂之可貴宣簫之足聽見書鈔一百九于是歌人恍惚以失曲舞者亂節而忘形哀人塞耳以惆悵轅馬蹀足以悲鳴見書鈔一百九筆賦昔蒼頡創業翰墨用作書契興焉夫制作上聖立則憲者莫隆乎筆詳原其所由究察其成功鑠乎煥乎弗可尚矣惟其翰之所生于季冬之狡兔性精亟以摽捍體遄迅以騁步削文竹以為管加漆絲之纏束形調摶以直端染玄墨以定色書乾坤之陰陽贊三皇之洪勳敘五帝之休德揚蕩蕩之典文紀三王之功伐兮表八百之肆勤傳六經而輟百氏兮皇極而序彝倫綜人事于暗昧兮贊幽冥于明神象類多喻靡施不協上剛下柔乾坤之正也新故代謝四時之次也圓和正直規矩之極也玄首黃管天地之色也見藝文類聚五十八初學記二十一彈棋賦榮華灼爍萼不韡韡于是列象雕華麗豐腹斂邊中隱四企輕利調博易使馳騁然後柢掣兵綦夸驚或風飄波動若飛若浮不遲不疾如行如留放一敝六功無與儔見藝文類聚七十四古文苑夫張局陳棋取法武備因嬉戲以肄業託歡娛以講事設茲文石其夷如采若錦繢平若停水肌理光澤滑不可屢乘色行巧據險用智見御覽七百五十五圓扇賦裁帛制扇陳象應矩輕徹妙好其輶如羽動角揚徵清風逐暑春夏用事秋冬潛處見北堂書鈔一百三十四傷故粟賦人有折蔡氏祠前粟者故作斯賦樹遐方之嘉木兮于靈宇之前庭通二門以征行兮夾階除而列生彌霜雪之不凋兮當春夏而滋榮因本心以誕節兮挺育櫱之緑英形猗猗以豔茂兮似翠玉之清明何根莖之豐美將蕃熾以悠長適禍賊之災人嗟夭折以摧傷見藝文類聚八十七初學記二十八御覽九百六十四蟬賦白露淒其夜降秋風肅以晨興聲嘶嗌以沮敗體枯燥以冰凝雖期運之固然獨潛類乎大陰要明年之中夏復長鳴而揚音見藝文類聚九十七初學記宋本三十九惟文八惟困乏憂心殷殷天之生我星宿值貧六極之厄獨遭斯勤居處浮𣿖無以自存冬日栗栗上下同雲無衣無褐何以自溫六月徂暑炎赫來臻無絺無綌何以蔽身無食不飽永離歡欣見藝文類聚三十五
