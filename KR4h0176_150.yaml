body:
  text: 蔡雍對詔問災異八事光和元年七月十日詔書尺一召光祿大夫楊賜諫議大夫馬日磾議郎張華蔡雍太史令單揚詣殿金商門引入崇德殿署門內南辟幃中為都座漏未盡三刻中常侍育陽侯曹節冠軍侯王甫從東省出就都座東面十門劉寵龐訓北面楊公南面日磾華雍揚西面受詔書各一通尺一木板草書兩常侍各諭旨朝廷以災異憂懼特旨密問政事所變改施行務令分明賜等稱臣再拜受詔書起就坐五人各一處給財用筆硯為對臣雍言今月十日詔召金商門問臣雍災異之意臣學識淺薄心慮愚暗不足以答聖問綜衆變征營怖悸謹別狀上臣雍頓首頓首詔問曰去月二十九日有黑氣墮溫明殿東庭中黑如車蓋騰起奮迅身五色有體長十餘丈形狀似龍占者以虹霓對虹著于天而降施于庭以臣所聞則所謂天投霓者也不見尾足者不得稱龍易傳曰虹之比無德以色親也潛潭巴曰虹出后妃陰脅王者又曰五色𨒔至照于宮殿有兵革之事演孔圖曰霓者斗之精也天度投霓見態主惑于毀譽合誠圖曰天子外苦兵威內奪臣無忠則天投霓變不空生占不空言意者陛下樞機之內衽席之上獨有以色見進陵尊踰制以招變象若群臣有所毀譽聖意低回未知孰是兵戎未息威權浸移忠言不聞即虹霓所在生也抑內寵任中正決毀譽分直邪各得其所嚴守衛整武備威權之機不以假人則其所救也易傳曰陽感天不旋日書曰唯辟作威唯辟作福臣或為之謂之凶害是以明主尤務焉詔問曰正月三日有白衣入德陽殿門辭稱伯夏教我上殿與中黃門桓賢晤言相往來不得入遂亡去不知姓名臣聞凡人為怪皆黃極道失下或謀上故其傳曰皇之不極是謂不建則有下謀上之病孝成綏和二年八月男子王褒絳衣小冠帶劍入北司馬殿東門上殿大室解帷組佩之招前殿署王業等曰天帝命我居此業收縛考問褒故公車卒病狂不自知入宮乃下獄死是時王莽為大司馬遂為篡亂亦卒誅臣竊思之與綏和時相似而有異被服既不同來入雲龍門而稱伯夏教入殿裏與桓賢言伯夏即故大將軍梁商商子冀冀子不疑等皆以罪受戮殘餘非天所祐以往況今將狂狡之人為王氏之禍未至殿省而覺亡不久伏誅夫誠仰見上帝之厚德也潛潭巴曰有人走入宮不知其名大水為戒天子驚群陰太隆群下並湊強盛也建大中之道舉賢良而寵祿之則其救也經曰皇建其有極斂時五福用敷錫厥庶民惟時厥庶民于汝極錫汝保極詔問曰南宮侍中等聞雌雞欲化為雄尾頭毛已似雄頭尚未變臣聞凡雞為怪皆貌之失也其傳曰貌之不恭是謂不肅時即有雞禍孝宣黃龍元年未央宮輅軫中雌雞化為雄不鳴無距是歲元帝初即位將立妃王氏為后至初元元年丞相史家雌雞化為雄冠距而鳴是歲封后父禁為平陽侯而女立為皇后王氏之寵始盛哀帝晏駕后攝政王莽以后兄子為大司馬由是為亂昔武王伐紂曰牝雞司晨惟家之索易傳曰婦人專政國不靜牝雞雄鳴主不榮夫牝雞但雄鳴尚有索家不榮之名況乃陰陽易體名實變改此誠大異臣竊以意推之頭為元首人君之象也今雞一身已變未至于頭而聖主知之訪問其故是將有其事而不遂成之象也若應之不精政無所改頭冠或成即為患茲大敬慎威儀動作之容斷取御改興政之原則其救也夫以匹夫顏氏之子有過未嘗不知知之未嘗復行易曰不遠復無祗悔元吉詔問曰踐祚以來災眚屢見頻歲月蝕地動風雨不時疾癘流行徑風折樹河洛盛溢臣聞陽微則日蝕陰勝則地震思亂則風貌失則雨視暗則疫癘流行簡宗廟則水不潤下河流滿溢明君臣正上下抑陰尊陽修五事于聖躬致精慮于供御則其救也詔問星辰錯謬臣竊見熒惑變色入太微西門太白正晝而見臣聞熒惑示變人主當精明其德則有休慶之色又以非其月令尊宿法當君臣出端謀戒不臣太白當晝而見是陰陽爭明強國弱弱國強皆有失政又失道而見是為嬴長侯王不榮熒惑主禮太白主兵謹禮事治兵政審察中外之言申明門戶守禦之令以杜漸防萌則其救也昔宋景公小國諸侯三有德言而熒惑為之退舍詔問曰連年蝗蟲至冬蛹其咎安在雍對曰臣聞見符致蝗以象其事易傳曰大作不時天降災厥咎蝗蟲來河圖祕徵篇曰帝貪則政暴而吏酷吏酷則誅深必殺主蝗蟲蝗蟲貪苛之所致也息不急之作省賦斂之費進清仁黜貪虐分損承安屈鉤省別藏以贍國用則其救也易曰得臣無家言有天下者何私家之有詔問南宮平城門內屋武庫屋及外東坦屋各損壞臣愚以為平城門正陽之門與宮連郊祀法駕所從出門之最尊者也武庫禁兵所藏東坦庫之外障國家之本兵也變此二處異于瓦屋易傳曰小人在位上下咸悖厥妖城門內崩潛潭巴曰宮瓦自隳諸侯強陵主易傳曰昔一柱泥故法棄其咎宮室傾圮此皆小人在顯位諸侯強淩主之漸臣意請率由舊章黜小人以尊上整下去暴悖之愆以變柱泥棄法之咎則其救也洪範傳曰六沴作見若時共禦帝用不羞神則不怒五福乃降用彰于下又特詔問比災變互生未知厥咎朝廷焦心載懷恐懼每訪群公卿士庶聞忠言皆各括囊迷固莫肯建忠規闕以雍博學深奧退食在公故特密問宜披演所懷指陳政要所先後勿有依違顧忌以經術分別皂囊封上勿漏所問臣雍伏唯陛下聖德允明深悼災咎德音墾誠褒臣博學深奧退食在公特垂訪及非臣螻蟻愚怯所能堪副斯誠輸寫肝膽出命之秋豈可以顧患避害復使陛下不聞至戒哉臣雍頓首死罪伏思諸異各應皆亡國之怪也天于大漢殷勤不已赤帝之精輔或未衰故屢出妖變以當責讓欲令人君因以感悟則危可為安凶可作吉假使大運已移豈有譴告哉春秋魯定哀公之時周德已絶故數十年無有日蝕此為天所棄故也至于今者災眚之發不于他所遠則門垣近在寺署其為鑒戒紛降目前欲使陛下豁然大寤可謂至切矣幸陛下深問臣敢不盡情以對虹霓墮雌雞化皆婦人姦政之致也自即祚已來中官無地逸竄而乳母趙嬈貴重赫赫生則資富侔于天府死則丘墓踰越園陵兩子受封兄弟典郡過事既已續以永樂門吏霍玉依阻城社大為姦邪盜寵竊權晦惑之罪晚乃發露雖房獨治畏慎疏賤妄乃得姿意事必積浸然後成形虹霓集庭雌雞變化豈不謂是今日道路所言紛紛復云有程大人者察其風聲將為國患宜高其隄防明設禁限深惟趙霍以為至戒且侍御于百里之內而知外事誠當窮治何緣聞之所以令安之也又前詔書實核以玉氣勢為官者踰時不覺司隸校尉岑初考彥時裁取典計教者一人綴之如玉所戒誠不朝可知而還移州釋本問末論者疑太尉張皓與交貫為玉所進暗昧已成非外臣所能審處如誠有之近者不治無以正遠傾邪在官當有所懲光祿勳偉璋所在尤名貪濁九列之中豈宜有此牧守數十選代既不盡由本朝反有異輩無以示四方聖意勤勤欲流清蕩濁扶正黜邪不得但以州郡無課而已長水校尉趙玹屯騎校尉蓋升並叨時幸其貴已足其富已甚當以見災之故為陛下先群臣早引退以解易傳所載小人在位之咎伏見廷尉郭禧敦龐純厚國之老成光祿大夫橋玄聰達方直有山甫之姿故太尉劉寵聞人襲寵忠實守固襲悃愊剛直並宜為謀主數見訪問夫宰相大臣君之四體優崇是委重任用責成納其英慮優遊訪求以盡其情相待以禮相引見論議當因其言居位十數年當此之際尚儉約崇經藝浮輕之人不引在朝廷淺短之書不干于目貴戚斂手中外悚栗莫敢犯禁不獨得之于迫沒之三公也春秋之義以貴治賤遠間親小加大列在六逆陛階增則堂高輔位重則上尊不宜復聽納小吏雕琢大臣也取圖寫讚厲以顛沛群臣慘慘憂懼自危非典衡之道夫憂樂不並喜戚異方畏災責躬念當專一精意以思變則上方巧技之作鴻都篇賦之文宜且息心以示憂懼詩云畏天之怒不敢戲豫天戒誠不可戲也宰府孝廉士之高選不可求以虛名但當察其真偽以加黜陟近者每以辟召不慎切責三公孝廉雜揉試之以文而並以書疏小文一介之技命臣下超取選舉衆心不厭莫之敢言群公尚先意承旨以悅郎吏舍人間職長吏便宜促行誰敢違旨至于宰府孝廉顛倒下開託屬之門上違明王舊典無益于德矣臣願陛下強納忠言忍而絶之側身踊躍思惟萬幾以答天望以導嘉應聖朝既自約厲以身率人左右近臣亦宜戮力從化人自抑損以塞咎戒則天道虧滿鬼神福謙久高不危常滿不逸群公之福諸侯凌主之戒不可不察也臣雍愚戇感激忘身敢觸冒忌諱手書具對夫君臣不密上有漏言之戒下有失身之禍臣敢漏所問願寢臣表無使盡忠之吏受怨姦讎見本集後漢蔡雍傳又袁宏後漢紀二十四戌邊上章朔方髡鉗徙臣雍稽首再拜上書皇帝陛下臣雍被受陛下尢異大恩初由宰府備數典城以叔父故衛尉質時為尚書召拜郎中受詔詣東觀著作遂與群儒並拜議郎沐浴恩澤承答聖問前後六年質奉機密趨走日下遂由端右出相外藩還尹輦轂旬日之中登躡上列父子一門兼受恩寵不能輸寫心力以效絲髮之功一旦被章陷沒辜戮陛下天地之德不忍刀鋸截臣首領得就平罪父子家屬徙充邊方完全軀命喘息相隨非臣無狀所敢復望非臣罪惡所當復蒙非臣辭筆所能復陳臣初決罪雒陽詔獄生出牢戶顧念元初中故尚書郎張俊坐漏泄事當伏重刑已出轂門復聽讀鞫詔書馳救減罪一等輸作左校俊上書謝恩遂以轉徙郡縣促遣遍于吏手不得頃息含辭抱悲無由上達既到徙所乘塞守烽職在候望憂怖焦灼無心復能操筆成草致章闕庭誠知聖朝不責臣謝但懷愚心有所不竟臣自在布衣常以為漢書十志下盡王莽而止世祖以來唯有紀傳無續志者臣所師事故太傅胡廣知臣頗識其門戶略以所有舊事與臣雖未備悉粗見首尾積纍思惟二十餘年不在其位非外吏庶人所得擅述天誘其衷得備著作郎建言十志皆當撰録遂與議郎張華等分受之所使元順難者皆以付臣先治律曆以籌算為本天文為驗請太史舊注考校連年往往頗有差舛當有增損乃可施行為無窮法道至深微不可獨議郎中劉洪密于用算故臣表上洪與共參思圖牒尋繹適有頭角會臣被罪逐放邊野臣竊自痛一為不善使史籍所闕胡廣所校二十年之思中道廢絶不得究竟慺慺之情猶以結心不能違望臣初欲須刑竟乃因縣道具以上聞今年七月九日胸奴始攻郡鹽池縣其時鮮卑連犯雲中五原一月之中烽火不絶不意西夷相與合謀所圖廣遠恐遂為變不知所濟郡縣咸懼不守朝旦臣所在孤危懸命鋒鏑湮滅土灰呼吸無期誠恐所懷隨軀腐朽抱恨黃泉遂不設施謹先顛踣科條諸志臣欲刪定者一所當接續者四前志所無臣欲著者五及經典群書所宜捃托本奏詔書所當依據分別首目并書章左臣初被考妻子迸竄亡失文書無所案請加以惶怖愁恐思念荒散十分不得識一所識者又恐謬誤觸冒死罪披散愚情願下東觀推求諸奏參以璽書以補綴遺闕昭明國體章聞之後雖肝腦流離白骨剖破無所復恨惟陛下留神省察謹因臨戎長霍圉封上有律曆意禮意樂意郊祀意天文意車服意朝會意五行意臣頓首死罪稽首再拜以聞見續漢律曆志下注補引蔡雍戌邊上章又後漢本傳雍上書自陳奏其所箸十意注引雍別傳雍昔作十意云云又藝文類聚八十御覽三百三十五引蔡雍徒朔方上書又本集外傳案本傳別傳皆作十意則劉昭所引禮樂志表志初學記所引天文志原本是意字傳寫變其文耳律曆意前漢志但載十二律不及六十律尺寸相生見宋書律志引蔡雍徒朔方上書凡律所革以變律呂相生至六十也見文選陸倕新刻漏銘注引蔡雍律曆志禮意孝武帝封襌岱宗立明堂于泰山汶上見御覽五百三十三引蔡私雍禮樂志顯宗因祀光武帝于明堂養三老五更于辟雍威儀既盛矣德化未流洽者以其禮樂未具群下無所誦説而庠序尚未設之故也孔子曰譬如為山未成一簣止吾止也見續漢禮儀志上注補引蔡雍禮樂志樂意漢樂四品一曰大豫樂典郊廟上陵殿諸食舉之樂郊樂易所謂先王以作樂崇德殷薦上帝周官若樂六變則天神皆降可得而禮也宗廟樂虞書所謂琴瑟以詠祖考來假詩云肅雍和鳴先祖是聽食舉樂王制謂天子食舉以樂周官王大食則命奏鍾鼓二曰周頌雅樂典辟雍饗射六宗社稷之樂辟雍饗射孝經所謂移風易俗莫善于樂禮記曰揖讓而治天下者禮樂之謂也社稷所謂琴瑟擊鼓以御田祖者也禮記曰夫樂施于金石越于聲音用乎宗廟社稷事乎山川鬼神此之謂也三曰黃門鼓吹天子所以宴樂群臣詩所謂坎坎鼓我蹲蹲舞我者也其短簫鐃歌軍樂也其傳曰黃帝岐伯所作以建威揚德風勸士也蓋周官所謂王大捷則令凱樂軍大獻則令凱歌也孝章皇帝新著歌詩四章列在食舉又制雲臺十二門新詩下太子樂官習誦被聲與舊詩並行者皆當撰録以成樂志見續漢禮儀志中注補引蔡雍禮樂志郊祀意孝明立世祖廟以明再命有功之義後嗣遵儉不復改立皆藏主其中聖明所制一王之法也自執事之吏下至學士莫能知其所以兩廟之意誠宜具録本事建武乙末元和丙寅詔書下宗廟儀及齋令宜入郊祀志永為典式宗廟迭毀議奏國家大體班固録漢書乃置韋賢傳末臣以問胡廣廣以為實宜在郊祀志去中鬼神仙道之語取賢傳宗廟事置其中既合孝明旨又使祀事以類相從見續漢祭祀志下補引蔡雍表志天文意言天體者有三家一曰周髀二曰宣夜三曰渾天宣夜之學絶無師法周髀數術具存考驗天狀多所遺失故史官不用唯渾天者近得其情今史官所用候臺銅儀則其法也立八尺圓體之度而具天地之象以正黃道以察發斂以行日月以步五緯精微深妙萬世不易之道也官有其器而無本書前志亦闕而不論臣求其舊文連年不得在東觀以治律未竟未及成書案略求索竊不自量卒欲寢伏儀下思惟精意案度成數扶以文義潤以道術著成篇章罪惡無狀投畀有北灰滅雨絶世路無由宣博問群臣下及巖穴知渾天之意者使述其義以裨天文志撰建武以來星變彗孛占驗著明者續其後見續漢天文志上注補引蔡雍表志又後漢張衡傳注引漢名臣奏宋書天文志一引蔡雍于朔方上言開元占經一引蔡伯喈于朔方上書初學記二引蔡雍天文志車服意以文義不著之故俗人多失其名見續漢輿漢志上注補引蔡雍表志國家舊章而幽僻藏蔽莫之得見同上俗人失其名故名冕為平天冠五時副車曰五帝鸞旗曰為雞翹金根曰三蓋其制非一見御覽七百七十三引蔡雍車服志永平初詔書下車制度中宮皇太子親服重繒厚練浣已復卿率下以儉化起機諸侯王以下至于士庶嫁娶被服各有科品當傳萬世揚光聖德臣以為宜集舊事儀注本奏以成志也見續漢輿服志下注補引蔡雍表志孝明帝作蠙珠之佩以郊祀天地見御覽六百九十二引蔡雍輿服志朝會意群臣朝見之儀視不晚朝十月朔之故以問胡廣廣曰舊儀公卿以下每月常朝先帝以其頻故省唯六月十月朔朝後復以六月朔盛暑省之見續漢禮儀志中注補引蔡雍曰云云
