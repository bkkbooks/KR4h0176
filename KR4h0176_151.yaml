body:
  text: 蔡雍上始加元服與群臣上壽章伏惟陛下應天淑靈丁期中興誕在幼齡聖姿碩義威儀孔備俯仰龍光顏如日星言稽典謨動蹈規矩緝熙光明思齊周成早智夙就參美顯宗令月吉日始加元服進御幘結以章天休臣妾萬國遐邇大小一心同歡同喜逸豫式歌且舞臣等不勝踊躍鳧藻謹奉牛一頭酒九鍾稽首再拜上千萬壽陛下享茲吉福永守皇極通遵太和靖綏六合宜民宜人受祿于天書曰一人有慶兆民賴之其寧惟永詩曰顒顒卬卬如圭如璋令聞不忘萬壽無疆見本集又略見書鈔一百二十七引蔡雍雜章表賀録換誤上章謝罪今月十八日臣以相國兵討逆賊故河內太守王匡等屯陳破壞斬獲首級詣朝堂上賀臣雍奉賀録故羽林郎將李參遷城門校尉而署名羽林左監右衛在朝堂而不在録咎在臣不詳省案使參以亡為存衍以存為亡錯奏謬録不可行侍御史劾臣不敬當賜刑書懲戒不恪陛下天地之德不辱收戮丙辰詔書以一月俸贖罪臣雍怔營慚怖屏氣纍息不知所自投處臣雍頓首死罪臣不惟石慶數馬之誤簡忽校讎不謹之愆雖見原宥仰愧先臣傷肌入骨不勝忪蒙流汗見本集讓高陽鄉侯章制詔左中郎將蔡雍今封雍陳留雍丘高陽鄉侯下印綬符策假限食五百戶歲五十萬穀各米臣稽首受詔怔營喜懼精魄播超恍惚如夢不敢自信臣伏惟糠粃小生學術虛淺少竊方正長曆宰府備數典城著作東觀無狀取罪捐棄朔野蒙恩徙還退伏畎畝復階朝謁進察憲臺遂充機密令守巴郡還備侍中車駕西還執鞭跨馬及看輪轂升輿下軫扶接聖躬既至舊京出備郎將中外所疑對越省闥群臣之中特見褒異訖無雞犬鳴吠之用常以汗墨愧負恩寵誠不意寤猥與公卿以下録功受賞命服金紫爵至通侯非臣草萊功勞微薄所當被蒙臣雍頓首死罪臣十四世祖肥如侯佐命高祖以受爵賞統嗣曠絶除在匹庶臣孑遺苗裔復蒙顯封前功輕重不侔慚惶纍息無心怡寧唐虞之朝猶美三讓臣者何人受而不讓臣不勝戰悼怵惕詣闕拜章上所假高陽侯印綬符策伏受罪誅臣得微勞被受爵邑光寵榮華耀熠祖禰非臣小族陋宗器量褊狹所能堪勝非臣力用勤勞有所當受誠無安寧甘悅之情拘迫國憲上行下不敢逆苟順恩旨退省金龜紫綬之飾非臣容體所當服佩中讀符策誥戒之詔非臣才量所能祗奉曆日彌久震懼益甚臣聞高祖受命元功翼德者與共天下者爵土故曰使黃河若帶太山若礪國以永存爰及苗裔夫山河至大猶謂之小重功輕賞如此其至也是以戰功之事大有陷堅破敵斬將搴旗之功小有馘截首級履傷涉血之難勤苦軍旅連年纍歲首如蓬葆體如漆幹勞瘁辛苦如此其重也以受爵土誰曰不宜今者聖朝遷都應順天人奔走之役臣僕職分宜然臣事輕葭莩功薄蟬翼臣恐史官録書臣等在功臣之列陷恩澤之科垂名後葉作戒末嗣非本朝之德政御臣之長策臣是以宵寢晨興叩膺增歎心煩慮亂喘呼息吸且鷦鷯巢林不過一枝偃鼠飲河不過滿腹小人之情求足而已不勝大願乞如前章云云臣忝自參省資非哲人藩屏之用器非殿邦佐君之才憂心灼烜耳目昏冒忪蒙蔽罔纍息屏氣臣聞稷契之疇以德受命功德靡堪讓所不如昔之范丏不忘禮讓其下化之春秋采焉臣小醜不足勗勵以躡高蹤以詩人斯亡之戒觀見符策君國之誨兩印雙紱竝在鞶帶至德元功器量宏大猶且踧踖無心寧止況臣螻蟻無功德而散怠茸闒何以居之且晏嬰辭郫殿之邑張良辭三萬之戶書籍紀之以為美談夫人君無弄戲之言憲法有誣枉之效臣不敢違戾飾虛以詎上旨疑確之誠與神明通謹奉章詣闕頓首敢固以請息伏惟留漏刻一省僵沒之日同壽松喬見本集薦太尉董卓可相國并自乞間冗章臣某等聞周有流彘之亂而宣王以興漢有昌邑之難而中宗以昭由此觀之天生神聖特以靖亂整殘丕誕洪業輔佐重臣國之楹棟生應期運稟氣山嶽是故申伯山甫列于大雅蕭曹邴魏載于史籍國遭姦臣孽妾制弄主權纍葉相繼六十餘載火熾流沸浸以不振威移群下福在弄臣海內嗷嗷被其傷毒故大將軍慎侯何進盡忠出身圖議蕩滌以清季朝群凶遘難兵起亂作元舅上卿先寇受害禍至執辱社稷傾危太尉郿侯卓起自東土封畿之外義勇憤發旋赴京師先陳便宜列表奸猾群匿情狀辭意激切感物寤靈精兵虎臣承持卓勢奪擊醜類漏刻之閒靡有孑遺卓聞乖輿已趍河津身率輕騎長驅芒阜上解國家播越之危下救兆民塗炭之禍然後黜廢頑凶爰立聖哲天心聿得萬國賴祜及至差功行賞辭多受少近臣幸臣一人之封戶至萬數今者受爵十有一人總合戶數千不當一非所以褒功賞勳也今月七日卓又上書辭疾讓位乞就國土上違聖主寵嘉之至下乖群心瞻仰之望臣等謹案漢書高祖受命流離藏竄十有二年陛下應期中興龍飛踐阼奸臣嬖孽一時殄盡憎疾臣者隨流埋沒太尉郿侯卓收拾洗濯上臣高第補侍御史轉治書御史陛下天地之大德聽納大臣扶飾文舉遂用臣雍充備機密三月之中充歷三臺光榮昭顯非臣愚蔽不才所當盜竊非臣碎首糜軀所能補報如卓者陛下當益隆委任數加訪問厚其爵賞責以相業之成臣等不勝大願謹陳狀臣雍等頓首頓首死罪死罪臣聞世宗之時田千秋有神明感動至一言以寤聖聽昭發上心故有一日九遷臣雍草萊小臣思謀愚淺生非千秋職不狎練加以新來入朝不更郎署攝省文書其猶面牆陛下統繼大業委政冢宰太傅隗以舊典入録機密事尚書令日磾先輩舊齒德更上公僕射允故司隸校尉河南尹尚書張熹已歷九列魯旭侍中牧守宣藩剖符數郡唯臣官薄微賤特單匹此六臣臣當自知況于論者將謂臣何足以任夙夜寤歎寐息屏營無顏以居無心以寧明時階級人所勸慕乞在他署抱關執籥以守刻漏則臣之心厭抱釋降榮于悴退顯于進不勝區區疑戒不敢肅飾見本集雜章相國金印緑綬位在公上所以殊異休烈群臣莫得而齊見書鈔一百三十一御覽六百八十二薦皇甫規表臣聞唐虞以師師咸熙周文以濟濟為寧區區之楚猶用賢臣為寶衛多君子季札知其不危由此言之忠臣賢士國家之元龜社稷之楨固也昔孝文慍胸奴之生事思李牧于前代孝宣忿奸邪之不散舉張敞于亡命況在于當時謙虛為罪而可遺棄臣伏見護羌校尉皇甫規少明經術道為儒宗修身力行忠亮闡著出處抱義皎然不污藏器林藪之中以辭徵召之寵先帝嘉之群公歸德盜發東嶽莫能嬰討即起家參拜為泰山太守屠斬桀黠綏撫煢弱青兗之郊迄用康乂自是以來方外有事戎狄猾夏追𥳑前勳連見委任伏節舉麾威靈神行演化凶悍使為愨願愛財省穡每有餘資養士御衆悅以亡死論其武勞則漢室之干城課其文德則皇家之腹心誠宜試用以廣振鷺西雍之美臣以頑愚忝污顯烈輒流汗墨不堪之責不勝區區執心所見越職瞽言罪當死唯陛下留神宥察臣雍頓首頓首見本集藝文類聚五十為陳留太守奏上孝子程末事表臣前到官博問掾史孝行卓異者臣門下掾申屠敻稱孝子平丘程未年十四歲時祖父叔病歿末抱伏叔尸號泣悲哀口乾氣少喘息裁屬舅偃哀其羸劣嚼棗肉以哺之未見食噓欷不能吞咽麥飯寒水閒用之舅偃誘勸哽咽益甚是後精美異味遂不過口常在柩旁耳聞叔名目應以淚前太守文穆召署孝義童云以叔未葬不能至府舍臣輒核問掾史邑子殷盛宿彥等辭驗皆合臣即召來見末年十四歲顏色瘦小應對甚詳臣問樂為吏否垂泣求去白歸喪所臣為設食但用麥飯寒水不食肥膩舅本以田作為事家無典學者其志行發于自然非耳目聞見所倣效也雖成人之年如禮識義之士恐不能及伏唯陛下體因心之德當中興之運躬秉萬機建用皇極神紀騁于無方淑畼洽于群生故醇行感時而生美義因政以出清風奮揚休徵誕漫太平之萌昭驗已著臣誠伏見幸甚臣聞魯侯能孝命于夷官張仲孝友侯在左右周宣之興實始于此且烏以反哺託體太陽羔以跪乳為贄國卿禽鳥之微猶以孝寵況未稟純粹之精爽立百行之根原其人殄瘁而德曜彌光其族益章臣不勝願會使未美昭顯本朝謹陳狀臣頓首見本集御覽五百二十一引蔡雍進表九百六十五引蔡雍奏事巴郡太守謝表臣尚書雍免冠頓首死罪臣猥以頑暗連值盛時超自群吏入登機密未及輸力盡心日下五府舉臣任巴郡太守陛下不復參論府舉入奏驚惶失守非所敢安征營纍息不知所措臣雍頓首死罪知納言任重非臣所得久忝今月丁丑一章自聞乞間冗抱關執籥不意録符銀青授任千里求退得進後上先遷為衆所怪不合事宜願乞還詔命盡力他役死而後已臣猥以愚暗盜竊明時周旋三臺充列機衡出入省闥登踏丹墀承隨同位與在行列以受酒禮嘉幣之賜詔書前後賜石鏡奩禮經素字尚書章句白虎奏議合成二百一十二卷及蓮香瓠子薰爐唾壺彈碁石枰梨餳汁器圍盧諸物誠念及下錫惠周至每敕勿謝朝廷之恩前後重疊雖父母之于子孫無以加此未得因緣有事答稱所蒙不意卒遷荷受非任臨時自陳未蒙省許慘結屏營踧踖受拜命服銀青光寵休顯上耀祖先下榮昆裔誠非所望臣雍頓首死罪巴土長遠江山修隔頃來未悉輯睦劉焉撫寧有方柔遠功著臣當以頑蒙不間職政宣畼聖化導遵和風非臣才力所能供給必以忝辱煩污聖朝幸循舊職當竭肝膽從事筋絶骨破以命繼之見本集御覽七百三又七百十七上封事陳政要七事臣伏讀聖旨雖周成遇風訊諸執事宣王遭旱密勿祗畏無以或加臣聞天降災異緣象而至辟歷數發殆刑誅繁多之所生也風者天之號令所以教人也夫昭事上帝則自懷多福宗廟致敬則鬼神以著國之大事實先祀典天子聖躬所當恭事臣自在宰府及備朱衣迎氣五郊而車駕稀出四時至敬屢委有司雖有解除猶為疏廢故皇天不悅顯此諸異鴻範傳曰政悖德隱厥風發屋折木坤為地道易稱安貞陰氣憤盛則當靜反動法為下叛夫權不在上則雹傷物政有苛暴則虎狼食人貪利傷民則蝗蟲損稼去六月二十八日太白與月相迫兵事惡之鮮卑犯塞所從來遠今之出師未見其利上違天文下逆人事誠當博覽衆議從其安者臣不勝憤悶謹條宜所施行七事表左一事明堂月令天子以四立及季夏之節迎五帝于郊所以導致神氣祈福豐年清廟祭祀追往孝敬養老辟雍示人禮化皆帝者之大業祖宗所祗奉也而有司數以蕃國疏喪宮內産生及吏卒小污屢生忌故竊見南郊齊戒未嘗有廢至于它祀輒興異議豈南郊卑而它祀尊哉孝元皇帝策書曰禮之至敬莫重于祭所以竭心親奉以致肅祗者也又元和故事復申先典前後制書推心懇惻而近者以來更任太史忘禮敬之大任禁忌之書拘信小故以虧大典禮妻妾産者齊則不入側室之門無廢祭之文也所謂宮中有卒三月不祭者謂士庶人數堵之室共處其中耳豈謂皇居之曠臣妾之衆哉自今齊制宜如故典庶答風霆災妖之異二事臣聞國之將興至言數聞內知己政外見民情是故先帝雖有聖明之姿而猶廣求得失又因災異援引幽隱重賢良方正敦朴有道之選危言極諫不絶于朝陛下親政以來頻年災異而未聞特舉博選之旨誠當思省述修舊事使抱忠之臣展其狂直以解易傳政悖德隱之言三事夫求賢之道未必一塗或以德顯或以言揚頃者立朝之士曾不以忠信見賞恆被謗訕之誅遂使群下結口莫圖正辭郎中張文前獨盡狂言聖聽納受以責三司臣子曠然衆庶解悅臣愚以為宜擢文右職以勸忠謇宣聲海內博開政路四事夫司隸校尉諸州刺史所以督察姦枉分別白黑者也伏見幽州刺史楊喜益州刺史龐芝涼州刺史劉虔各有奉公疾姦之心喜等所糾其效尤多餘皆枉撓不能稱職或有抱罪懷瑕與下同疾綱網弛縱莫相舉察公府臺閣亦復默然五年制書議遣八使又令三公謠言奏事是時奉公者欣然得志邪枉者憂悸失色未詳斯議所因寢息昔劉向奏曰夫執狐疑之計者開群枉之門養不斷之慮者來讒邪之口今始聞善政旋復變易足令海內測度朝政宜追定八使糾舉非法更選忠清平章賞罰三公歲盡差其殿最使吏知奉公之福營私之禍則衆災之原庶可塞矣五事臣聞古者取士必使諸侯歲貢孝武之世郡舉孝廉又有賢良文學之選于是名臣輩出文武竝興漢之得人數路而已夫書畫辭賦才之小者匡國理政未有其能陛下即位之初先涉經術聽政餘日觀省篇章聊以游意當代博奕非以為教化取士之本而諸生競利作者鼎沸其高者頗引經訓風喻之言下則連偶俗語有類俳優或竊成文虛冒名氏臣每受詔于盛化門差次録第其未及者亦復隨輩皆見拜擢既加之恩難復收改但守奉祿于義已弘不可復使理人及仕州郡昔孝宣會諸儒于石渠章帝集學士于白虎通經釋義其事優大文武之道所宜從之若乃小能小善雖有可觀孔子以為致遠則泥君子固當志其大者六事墨綬長吏職典理人皆當以惠利為績日月為勞褒責之科所宜分明而今在任無復能省及其還者多召拜議郎郎中若器用優美不宜處之冗散如有釁故自當極其刑誅豈有伏罪懼考反求遷轉更相放效臧否無章先帝舊典未嘗有此可皆斷絶以核真僞七事伏見前一切以宣陵孝子者為太子舍人臣聞孝文皇帝制喪服三十六日雖繼體之君父子至親公卿列臣受恩之重皆屈情從制不敢踰越今虛僞小人本非骨肉既無幸私之恩又無祿仕之實惻隱思慕情何緣生而群聚山陵假名稱孝行不隱心義無所依至有姦軌之人通容其中恆思皇后祖載之時東郡有盜人妻者亡在孝中本縣追捕乃伏其辜虛僞雜穢難以勝言又前至得拜後輩被遺或經年陵次以暫歸見漏或以人自代亦蒙寵榮爭訟怨恨凶凶道路太子官屬宜搜選令德豈有但取丘墓凶醜之人其為不祥莫與大焉宜遣歸田里以明詐僞見後漢蔡雍傳諫用三互法疏臣聞國家置官以職建名臣愚淺小才竊假階級官以議為名職以郎為貴智淺謀漏無所獻替夙夜寤歎憂悸怛惕臣雍頓首死罪伏見幽州突騎冀州強弩為天下精兵國家膽核四方有事軍帥奮攻未嘗不取辨于二州也頃者已來連年饉荒穀價一斛至六七百故護烏桓校尉夏育出征鮮卑無功而還士馬死傷者萬數弓兵散亡幾盡生民之本守禦之備無一可恃百姓元元流離溝壑寇賊輩起莫能禁討長吏寒心朝不守夕卒有他方之急則役之不可驅使自為寇虜則誅之不可擒制豈非可憂之難三府選幽州刺史踰月不定臣怪問其故云避三互十一州有禁當取二州而已二州之中少素有威名之士或拘限歲年不應選用狐疑遲淹兩州空懸萬里蕭條無所管繫每冀州長史初除詔書治嚴不過五日今者刺史數旬不選誠非其理愚以為三互之禁禁之薄者以陛下威靈申明禁令對相部主尚生畏懼不敢營辦況乃三互何足為嫌孝景時梁人韓安國坐事被刑起徒中為內史武帝患東越數反拜故待詔會稽朱買臣宣帝時患冀州有盜賊故京兆尹張敞有罪逃命上使使就家召張敞為冀州刺史安國徒隸買臣郡民皆還治其國張敞亡命擢授劇州豈顧三互拘官簿得救時之便也卒獲其用遺芳不滅此先帝不誤已然之事三公明知二州之要尤宜揀選當越境取能以救時弊而乃持畏避自遂之嫌顧爭臣士人之責苟避輕微之科禁竊見日月拘忌選既稽滯又未必審得其人則二部蠢將為憂念願陛下少蠲禁忌上則先帝用三臣之法任職相故吏在家若諸州刺史器用可換者無拘時月三互以差厥中臣慺慺發瞽言幹非義惟陛下留神再省再省見本集又略見藝文類聚五又六十御覽三百四十八伏見幽冀舊壤鎧馬所出比年兵飢漸至空耗今者百姓虛懸萬里蕭條闕職經時吏人延屬而三府選舉逾月不定臣經怪其事而論者云避三互十一州有禁當取二州而已又二州之士或復限以歲月狐疑遲淹以失事會愚以為三互之禁禁之薄者今但申以威靈明其憲令在任之人豈不戒懼而當坐設三互自生留閡邪昔韓安起自徒中朱買臣出于幽賤竝以才宜還守本邦又張敞亡命擢授劇州豈復顧循三互繼以末制乎三公明知二州之要所宜速定當越禁取能以救時敝而不顧爭臣之義苟避輕微之科選用稽滯以失其人臣願陛下上則先帝蠲除近禁其諸州剌史器用可換者無拘日月三互以差厥中見後漢蔡雍傳與本集小異
