body:
  text: 蔡雍日蝕上書四年正月朔日體微傷群臣服赤幘赴宮門之中無救乃各罷歸天有大異隱而不宣求御過是已事之甚者見續漢五行志六熹平二年日蝕注補引蔡雍上書被收時上書自陳光和元年都官從事張恕以辛卯詔書收雍送洛陽詔獄考吏張靜謂雍曰省君章云欲仇怨未有所施法令無以此詔書又刊章家姓名不得對相指斥考事君學多所見古今如此豈一事乎答曰曉是吏遂飲章為文書見後漢蔡雍傳注引雍集議郎糞土臣雍頓首再拜上書皇帝陛下今月十三日臣被尚書召問臣從大鴻臚劉郃前為濟陰太守臣屬吏張宛長休百日郃為司隸又託河內郡吏李奇為州書佐及營護故河南尹羊陟侍御史胡母班郃不為用致怨之狀臣征營怖悸肝膽塗地不知死命所在臣雍死罪臺所問臣三事其遠者六年近者三歲竊自尋案實屬宛奇不及陟班凡休暇小吏非結恨之本與陡姻家臣叔父衛尉質及雍豈敢屬郃申助私黨如臣父子誠有怨恨故中傷郃郃勢所當因臺問具臣恨狀所緣不能受臣為覆蔽內無寸事而謗書外發宜以臣對與郃參驗臣得以學問特蒙褒異執事祕館文學所著列于御前姓名貌狀簡乎聖心今年七月召詣金商門問以災異詔書褒諭責臣喻旨誘臣使言臣實愚戇唯識忠盡出命忘軀不顧後患遂譏切公卿內及寵近臣實區區欲以上對聖問救消災異為陛下延康寧之計而已預知所言者當必怨臣陛下不念忠言密對多所指刺宜加掩蔽誹謗卒至便用疑怪豈不負盡忠之吏哉每有災異詔書輒令百官各上封事欲以改政息譴除凶致吉而言者不蒙延納之福反被陷破亡之禍今群臣皆杜口結舌以臣為戒誰敢復為陛下盡忠者乎臣季父質連見拔擢位在上列臣被蒙恩渥數見訪問言事者因此欲陷臣父子破臣門戶非復發糾姦伏補益國家者也臣年四十有六孤特一身前無立男得以盡節王室託名忠臣死有餘榮然防陛下于此不復聞至言矣臣以愚亢招致禍患自臣職耳臣對問時質為下邳相不聞臣謀今者橫見逮及使質恨以衰老白首隨臣摧沒并內坑坎以快言事厭副其言誠冤誠痛陛下仁篤之心必不忍此思之未至耳臣一入牢檻當為箠楚所迫趨以飲章辭情何緣復達臣死期垂至冒昧自陳乞身當辜戮免質并坐則臣死之日更生之年也唯陛下加餐為萬姓自愛臣雍死罪見本集後漢蔡雍傳和熹鄧后諡議孝和鄧皇后崩群臣謀諡于是尚書陳忠上言以為鄉黨敘孔子威儀俯仰無所遺彤管記君王纖微大小無不舉是以德著圖籍名垂于後伏唯大行皇后規乾則坤兼包日月厥初作合允有休烈貫魚之次加于小媵中饋之敘昭于帷幄遭家不造三元之厄孝殤幼沖國祚中絶海內紛然群臣纍息加以洪流為災札荒為害西戎蠢動武威侵侮并涼猾夏作寇振驚勃碣家有采薇之思人懷殿屎之聲皇太后參圖考表求人之瘼度越平原建立聖主垂疇咨之問遵六事之求勞謙克躬菲薄為務是以尚官損服衣不粲英饔人徹羞膳不過擇黃門闕樂魚龍不作織室絶伎纂組不經尚方抑巧雕鏤不為離宮罕幸儲峙不施遐方斷篚侏離不貢罷出宮妾免遣宗室沒入者六百餘人以紓鬱滯奉率舊禮交饗祖廟以展孝子承歡之敬蠲憲法六千餘事以順漢氏三百之期經藝乖舛恐史闕文命衆儒考校東觀閣學博士一缺廣選十人何有伐檀茅茹不拔屢舉方直顯擢孝子遵忠孝之紀啓大臣喪親之哀疾貪吏受取為姦糾增舊科之罰惡長吏虛偽進退錮之十年追世祖功臣國土或有斷絶封植遺苗以奉其祀爵高蘭諸國胤子以紹三王之後事不稽古不以為政政不惠和不圖于策猶不自專傳謀遠暨允求厥中刑之所加不阿近戚賞之所及不遺側陋終朝反側明發不寢徒以百姓為憂不以天下為樂聖誠著于禁闥而德教被于萬國故自昏墊以迄康乂糴入千石以至數十叛虜降集賊寧邊垂胡輩去塞永元之世以為遺誅今畏服威靈稽顙即斃徼外絶國慕義重譯求獻其琛史官咸賀請作主頌卻而不聽郡國咸上瑞應寢而不宣允恭挹損密勿在勤遭疾不豫垂念臣子御輦在殿顧命群司流恩布澤大赦天下有始有卒同符先聖昔書契所載虞帝二妃夏后塗山高陽有莘姬氏任母徒以正身率內思媚周京為高未有如大行皇后勤精勞思篤繼國之祚正三元之衡康百六之會消無妄之運者也功德巍巍誠不可及漢世后氏無諡至于明帝始建光烈之稱是後轉因帝號加之以德高下優劣混而為一違禮大行受大名小行受小名之制諡法有功安人曰熹帝后一體禮亦宜同大行皇太后宜諡為和熹皇后上稽典訓之正下協先帝之稱見本集後漢曹皇后紀注引蔡雍集又見北堂書鈔九十四朱公叔諡議漢益州刺史南陽朱公叔卒門人陳季圭等議所諡云宜曰忠文子陳留蔡雍議曰昔在聖人之制諡也將以勸善彰惡俾民興行賢愚臧否依事從實雖文武之美靈厲之穢罔不具存自王公以降至于列國大夫皆用配號傳于無窮秦以世言諡而黜其事漢興以來惟天子與五等之爵然後有之公卿大臣其禮闕焉歷世彌久莫之或修益州府君貫綜典術率由舊章始與諸儒考禮定議加陳留府君以益州之諡是後覽之者亦無間焉今子亶纂襲前業不忘遺則孝既至矣禮會宜之謹覽陳生之議思忠文之意參之群學稽之諡法夫萬類莫貴乎人百行莫羡乎忠故夏后氏正以人統教以忠德然則忠也者人德之至也而猶有三焉孔子曰進思盡忠又曰臣事君以忠奉上之忠也曰為人謀而不忠乎又曰忠焉能勿誨乎謀誨之忠也春秋左氏傳曰小大之獄必以情情忠之屬也又曰上思利人曰忠撫下之忠也三者人之則而忠行乎其中益州府君自始事至沒身忠言不輟乎口忠謀不已乎心其在帝室正身危行言如砥矢策合神明蹇蹇之諫文章具存奉上忠矣其在部臣匡救善導出自一心疑不我聽者果有躓覆不測之禍謀誨忠矣爰牧冀州時值凶荒勞心苦思勤恤度事誅斃貪暴糾戢貴黨雖則強禦當官能行夫豈淫刑將有利也發墓盜柩議而不罪夫豈漏姦察以情也撫下忠矣位在牧伯職據納言秉權食祿實有年數而居無畜好財貨不益糲食布衾概謂之精麗昔魯季孫行父卒宰庀家器無衣帛之妾無食粟之馬君子曰相三君矣而無私積可不謂忠乎而諡曰文子春秋外傳曰忠文之實也然則文忠之彰也忠以為實文以彰之事通議合兩名一致是貞儉之稱文也邾子蘧蒢卜遷于繹史曰利于民不利于君公曰民苟利矣孤亦與焉于是遷而遂卒諡曰文公是危身利民之稱文也衛大夫孔圉諡曰文子子貢疑焉惟敏而好學不恥下問仲尼與之是勤學好問之稱文也府君所在屢以忤違阽以深患苟除民害死生以之前後三黜一罹疾廢于身危矣兼包六典命世作帥猶復宗事趙叟示有攸尊能下問矣有一于此猶可以稱況乃忠兼三義文備三德于古志不悖而諡法亦曰宜矣本議曰忠文子按古之以子配諡者魯之季文孟懿子衛之孫文公叔文皆諸侯之臣也至于王室之卿大夫其尊與諸侯並故以公配春秋曰劉卷卒葬劉文公公羊傳曰劉卷者何天子大夫也經又曰王子虎卒左傳曰王叔文公卒而同盟禮也此皆天子大夫得稱其禮與同盟諸侯敵體故也又禮緣臣子咸欲尊其君父故雖侯伯子男之臣自稱其君咸得曰公及其卒也異國之人稱之皆然是以邾子許男稱公以葬春秋之正義也以例言之則府君王室亞卿也有王叔劉氏之比以臣子之辭言之則有邾許稱公之文雖無土而其位是也今曰公猶可若稱子則降等多矣懼禮廢日久將詭時聽周有仲山甫伯陽嘉父優老之稱也宋有正考父魯有尼父配諡之稱也春秋曰孔父子曰伯某父亡之稱也父雖非爵號與天子諸侯咸用優賢禮同順乎門人臣子所稱之宜可于公父之中擇一處焉使不得稱子而已見本集後漢朱穆傳注引袁山松書答丞相可齋議月日詔召尚書問立春當齋迎氣東郊尚書左丞馮方毆殺指揮使于尚書西祠可齋不得無不宜具對議郎臣蔡雍博士任敏死罪對案禮上帝之祠無所為廢齋者所以致齊不敢渙散其意宮室至大指使至微不在齋潔之處元和詔禮無免齋宜以潔靜交神明本無嫌間祠室又寬可齋無疑詩云唯此文王小心翼翼昭事上帝聿懷多福夫齋恭以奉明祀文王所以懷福無有不宜臣雍臣敏愚戇死罪見本集又略見宋書禮志一曆數議三月九日百官會府公殿下東南校尉南面侍中郎將大夫千石六百石重行北面議郎博士西面戶曹令史當坐中而讀詔書公議蔡雍前坐侍中西北近公卿與光晃相難問是非焉見漢書律曆志中注引蔡雍集議郎蔡雍議以為曆數精微去聖久遠得失更迭術術無常是以漢興承秦曆用顓頊元用乙卯百有二歲孝武皇帝始改正朔曆用太初元用丁丑行之百八十九歲孝章皇帝用清河李梵之言改從四分元用庚申今光晃各以庚申為非甲寅為是案曆法黃帝顓頊夏殷周魯凡六家各自有元光晃所據則殷曆元也他元雖不明于圖讖各自一家之術皆當有效于其當時昔太初始用太初丁丑之後有六家紛錯爭訟是非太史令張壽王挾甲寅元以非漢曆雜候清臺課在下第卒以疏闊連見劾奏太初效驗無所漏失是則雖非圖讖之元而有效于前者也及用四分以來考之行度密于太初是又新元效于今者也延光元年中謁者亶誦亦非四分庚申上言當用命曆序甲寅元公卿百寮參議正處竟不施行且三光之行遲速進退不必若一術家以算追而求之取合于當時而已故有古今之異今術之不能上通于古亦猶古術之不能下通于今也由此言之有文于讖無驗于今未必為是有驗于今無言于讖未必為非元命苞乾鑿度皆以為開闢至獲麟二百七十六萬歲及命曆序獲獲麟至漢起庚子蔀之二十三歲竟己酉戊子及丁卯蔀六十九歲合為二百七十五歲漢元年歲在乙未上至獲麟則歲在庚申推此以上上極開闢則不在庚申讖雖無文其數見存而光晃以為開闢至獲麟二百七十五萬九千八百八十六歲獲麟至漢百六十二歲轉差少一百一十四歲云當滿足則上違乾鑿度元命苞中使獲麟不得在哀公十四年下不及命曆序獲麟漢相去四蔀年數與奏記譜注不相應當今曆正月癸亥朔光晃以為乙丑朔乙丑之與癸亥無題勒款識可與衆共別者須以弦望晦朔光魄虧滿可得而見者考其符驗而光晃曆以考靈曜為本二十八宿度數及冬至日所在與今史官甘石舊文錯異不可考校以今渾天圖儀檢天文亦不合于考靈曜光晃誠能自依其術更造望儀以追天度遠有驗于圖書近有效于三光可以易奪甘石窮服諸術者實宜用之難問光晃但言圖讖所言不服元和二年二月甲寅制書曰朕聞古先聖王先天而天不違後天而奉天時史官用太初鄧平術冬至之日日在斗二十二度而曆以為牽牛中星先立春一日則四分數之立春也而以折獄斷大刑于氣已忤用望平和蓋亦遠矣今改行四分以遵于堯以順孔聖奉天之文是始用四分曆庚申元之詔也深引河洛圖讖以為符驗非史官私意獨所興搆而光晃以為固意造妄説違反經文謬之甚者昔堯命羲和曆象日月星辰舜叶時月正日湯武革命治曆明時可謂正矣且猶遇水遭旱戒以蠻夷猾夏寇賊姦宄而光晃以為陰陽不和姦臣盜賊皆元之咎誠非其理元和二年乃用庚申至今九十二歲而光晃言秦所用代周之元不知從秦來漢三易元不常庚申光晃區區信用所學亦妄虛無造欺語之愆至于改朔易元往者壽王之術已課不效亶誦之議不用元和詔書文備義著非群臣議者所能變易續漢律曆志中宋書曆志一御覽十六
