body:
  text: 蔡雍陳留太守行縣頌府君勸耕于屬縣見文選陸機吳趨行注又孔稚圭北山移文注行小黃縣大皓為政建時春陽我君勤止戾茲小黃濟濟群吏攝齊升堂乃訓乃厲示之憲方原罪以心察獄以情欽于刑濫惟務求輕有辜小罪放死從生玄化洽矣黔首用寧惟以作頌式昭德聲見藝文類聚五十行城縣頌曖曖玄路北至考城勸茲穡民東作是營農桑之業為國之經我君勤心德音邈成率爾苗民慎不敬聽女執伊筐男執其耕申戒群僚務在寬平罪人赦宥囹圄用清見藝文類聚五十潁川太守王立義莽流民頌哀此骼胔惋彼孤魂遭水為泥逢風成塵殮以時服葬于洛濱見北堂書鈔三十九胡廣黃瓊頌巖巖山嶽配天作輔降神有周生申及甫允茲漢室誕育二后曰胡曰黃方軌齊武惟道之淵惟德之藪股肱元首代作心膂天之蒸人有則有類我胡我黃鍾厥純懿巍巍特進初踐其位赫赫三事七佩其紱奕奕四牡沃若六轡袞職龍章其文有蔚參曜乾台窮寵極貴功加八荒群生以遂超哉邈猗莫參其二見後漢胡廣傳熹平六年靈帝圖畫廣及太尉黃瓊于省內詔議郎蔡雍為其頌注引謝承書本集外選文選潘嶽西征賦注引末一語顏延之皇太子釋奠會詩注引末二語京兆樊惠渠頌洪範八政一曰食周禮九職一曰農有生之本于是乎出貨殖財用于是乎在九土上沃為大田多稔然而地有埆塉川有墊下溉灌之便行趨不至明哲君子創業農事因高卑之宜驅自行之勢以盡水利而富國饒人自古有焉若夫西門起鄴鄭國行秦李冰在蜀信臣治穰皆此道也陽陵縣東厥地衍隩土氣辛螫嘉穀不植草萊焦枯而涇水長流溉灌維首編戶齊氓庸力不供牧人之吏謀不暇給蓋常興役猶不克成光和五年京兆尹樊君諱陵字得雲勤恤民隱悉心政事苟有可以惠斯人者無聞而不行焉遂咨之郡吏申于政府僉以為因其所利之事者不可已者也乃命方略大吏麴遂令五瓊揣度計慮揆程經用以事上聞副在三府司農遂取財于豪富借力于黎元樹柱纍石委薪積土基跂功堅體勢強壯折湍流款曠陂會之于新渠流水門通窬瀆灑之于畎畝清流浸潤泥潦浮游曩之鹵田化為甘壤粳黍稼穡之所入不可勝算農民熙怡悅豫且康相與謳談壃畔斐然成章謂之樊惠渠云爾其歌曰我有長流莫或閼之我有溝澮莫或達之田疇斥鹵莫修莫治饑饉困瘁莫恤莫思乃有樊君作人父母立我畎畝黃潦膏凝多稼茂止惠乃無疆如何勿喜我壤既營我疆斯成泯泯我人既富且盈為酒為釀蒸畀祖靈貽福惠君壽考且寧見本集藝文類聚九書鈔三十九祖德頌昔文王始受命武王定禍亂至于成王太平乃洽祥瑞畢降夫豈后德熙隆漸浸之所通也是以易嘉積善有餘慶詩稱子孫其保之非特王道然也賢人君子修仁履德者亦其有焉昔我烈祖暨于豫考世載孝友重以明德率禮莫違是以靈祗降之休瑞兔擾馴以昭其仁木連理以象其義斯乃祖禰之遺靈盛德之所貺也豈我童蒙孤稚所克任哉乃為頌曰穆穆我祖世篤其仁其德克明惟懿惟醇宣慈惠和無競伊人巖巖我考蒞之以莊增崇丕顯克構其堂是用祚之休徵惟光厥徵伊何於昭于今園有甘棠別幹同心墳有擾兔宅我柏林神不可誣僞不可加析薪之業畏不克荷矧貪靈貺以為己華惟豫小子豈不是欲干有先功匪榮伊辱見本集藝文類聚二十麟皇矣大角降生靈獸視明禮修麒麟來乳春秋既書爾來告就庶士豫鉏獲諸西狩見初學記二十九白虎犬梁乘精白虎用生思睿信立繞于垣坰見藝文類聚九十九焦君贊猗歟焦君常此玄墨衡門之下栖遲偃息泌之洋洋樂以忘食鶴鳴九皋音亮帝側乃徵乃用將受袞職昊天不弔賢人遘慝不惟一志并此四國如何穹蒼不昭斯域惜哉朝廷喪茲舊德恨以學士將何法則見藝文類聚三十九太尉陳公贊公在百里有西産之惠賜命方伯分陝餘慶餘慶伊何兆民其觀少者是懷老者是安綱紀文王文王用平東督京輦京輦用清乃登三事三事攸寧契稷之佐具干堯庭今則由古於穆誕成見藝文類聚四十六赤泉侯五世像贊見御覽七百五十引孫暘之述畫曰漢靈帝詔蔡雍圖赤泉侯楊喜五世將相形像于省中又詔雍為贊仍令自書之雍文畫書于時獨擅正交論聞之前訓曰君子以朋友講習而正人無有淫朋是以古之交者其義敦以正其誓信以固逮夫周德既衰頌聲既寢伐木有鳥鳴之刺谷風有棄豫之怨其所由來政之缺也自此以降彌以陵遲或闕其始終或彊其比周是以縉紳患其然而論者諄諄如也疾淺薄而攜二者有之惡朋黨而絶交游者有之其論交也曰富貴則人爭趣之貧賤則人爭去之是以君子慎人所以交己審己所以交人富貴則無暴集之客貧賤則無棄舊之賓矣故原其所以來則知其所以去見其所以始則覩其所以終彼貞士者貧賤不待夫富貴富貴不驕夫貧賤故可貴也蓋朋友之道有義則合無義則離善則久要不忘平生之言惡則忠告善誨之不可則止無自辱焉故君子不為可棄之行不患人之遺己也信有可歸之德不病人之遠己也不幸或然則躬自厚而薄責于人怨其遠矣求諸己而不求諸人咎其稀矣夫遠怨稀咎之機咸在乎躬莫之能改也子夏之門人問交于子張而二子各有聞乎夫子然則以交誨也商也寬故告之以拒人師也褊故訓之以容衆各從其行而矯之至于仲尼之正教則泛愛衆而親仁故非善不喜非仁不親交游以方會友以文可無貶也穀梁子亦曰心志既通名譽不聞友之罪也今將患其流而塞其源病其末而刈其本無乃未若擇其正而黜其邪與與其彼農皆黍而獨稷焉夫黍亦神農之嘉穀與稷竝為粢盛也使交而可廢則黍其愆矣括二論而言之則刺薄者博而洽斷交者貞而孤孤有羔羊之節與其不獲已而矯時也走將從夫孤焉見後漢朱穆傳論注銘論春秋之論銘也曰天子令德諸侯言時計功大夫稱伐昔肅慎納貢銘之楛矢所謂天子令德者也若黃帝有巾几之法孔甲有槃杅之誡殷湯有甘誓之勒毚鼎有丕顯之銘武王踐阼咨于太師而作席几楹杖雜銘十有八章周廟金人緘口書背銘之以慎言亦所以勸進人主勗于令德者也昔召公作詔先王賜朕鼎出于武當曾水呂尚作周太師而封于齊其功銘于昆吾之冶獲齊侯寶樽于槐里獲寶鼎于美陽仲山甫有補袞闕式百辟之功周禮司勳凡有大功者銘之太常所謂諸侯言時計功者也宋大夫正考父三命滋益恭而莫侮其國衛孔悝之父莊叔隨難漢陽左右獻公衛國賴之皆銘于鼎晉魏顆獲秦杜回于輔氏銘功于景鐘所謂大夫稱伐者也鐘鼎禮樂之器昭德紀功以示子孫物不朽者莫不朽于金石故碑在京廟兩朝之間近世以來咸銘之于碑德非此族不在銘典此二語從文選新刻漏銘注引補御覽五百九十續漢律曆志中注補引蔡雍命論一段命當作令乃月令論也見卷十二陳仲拳李元禮論仲拳強于犯上元禮長于接下犯上為難接下為易仲舉為先元禮後矣見御覽四百四十七姚信士緯引陳留蔡伯喈云敘樂世祖追修前業釆讖緯之文曰大豫樂府曰黃門鼓吹見北堂書鈔九十六讖篇引蔡雍敘樂車駕上原陵記建寧五年正月車駕上原陵蔡雍為司徒掾從公行到陵見其儀愾然謂同坐者曰聞古不墓祭朝廷有上陵之禮殆為可損今見其儀察其本意乃知孝明皇帝至孝惻隱不可易奪或曰本意云何昔京師在長安時其禮不可盡得聞也光武即世始葬于此明帝嗣位踰年群臣朝正感先帝不復聞見此禮乃帥公卿百寮就園陵而創焉尚書陛西陛為神坐天子事亡如事存之意苟先帝有瓜葛之屬男女華會王侯大夫郡國計吏各向神坐而言庶幾先帝神魂聞之今者日月久遠後生非時人但見其禮不知其哀以明帝聖孝之心親服三年久在園陵初興此儀仰察几筳下願群臣悲切之心必不可堪雍見太傅胡廣曰國家禮有煩而不可省者昔不知先帝用心周密之至于此也廣曰然子宜載之以示學者雍退而記焉後漢禮儀志上注引謝承書又見袁宏後漢紀二十三通典五十二連珠道為知者設馬為御者良賢為聖者用辨為知者通見書鈔九十九引蔡雍連珠臣聞目瞤耳鳴近夫小戒也狐鳴犬嗥家人小妖也猶忌慎動作封鎮書符以防其禍是故天地示異災變橫起則人主恆恐懼而修政見御覽四百五十九引蔡雍廣連珠參絲之絞以絃琴緩張則撓急張則絶御覽八百十四引蔡雍廣連珠東鼎銘維建寧三年秋八月丁丑延公于玉堂前廷乃詔曰其以大鴻臚喬玄為司空再拜稽首以讓帝曰俞往哉三讓然後受命公乃虔恭夙夜帝采勤施八方旁作穆穆以對揚天子丕顯休命越在先民毗佐天子罔不著其股肱畢其思心式率天行式昭德音公亦克紹厥由鑒于法罔敢不法憲于誡罔敢不誡用總是群后保乂帝家勛在方策民咸曰休哉惟帝念功越若來二月丁丑遷于司徒見本集藝文類聚四十七中鼎銘維建寧四年春三月丁丑延公登于玉堂前廷乃制詔曰其以司空喬玄為司徒公拜稽首以讓帝曰俞往哉三讓然後受命公允迪厥德宣力肆勤戰戰兢兢以役帝事越其所以率夫百辟媚于天子天子曰都慎厥身修思永同寅協恭以和天衷德則昭之違則塞之回乃不敢不弼枉乃不敢不匡股肱之事既充三事之繇允備災眚作見乃引其責曰凡庶徵不若彝倫不敘是惟臣之職祗以疾告表越十月庚午記此見本集藝文類聚四十七書鈔五十二御覽二百八西鼎銘維光和元年冬十二月丁巳延公入崇德殿前乃制詔曰其以光祿大夫玄為太尉公拜稽首曰臣聞之三讓莫或克從臣不敢辭臣大馬齒七十可以生可以死其戮力間私悉心在公以盡為臣之節于時侍從陛階與聞公之昌言者莫不惕厲如履薄冰既乃碑表百代見本集黃鉞銘孝桓之季年鮮卑入塞杪盜起胸奴左部梁州叛羌逼逮兵誅淫衍東移高句麗翮子百固逆謀竝發三垂騷然為國憂念西府表喬公昔在涼州柔遠能邇不煩軍師而車師克定及在上谷漢陽連在營郡膂力方剛明集御衆徵拜度遼將軍始受旄鉞鉦鼓之任扞禦三垂公以吏士頻年在外勤于奔命人馬疲羸撓鈍請且息州營橫發之役以補困憊朝廷許之于是儲廩豐饒室磬不懸人逸馬同弓徑矢利而經用省息官有餘資執事無放散之尤簿書有進入之贏治兵示威戎士踴躍旌旗曜日金鼓霆奮守有山嶽之固攻有必克之勢羌戎授首于西疆百固冰散于東鄰鮮卑收迹烽燧不舉視事三年馬不帶鉂弓不受彄是用鏤石作茲鉦鉞軍鼓陳之東階以昭公文武之勛焉銘曰帝命將軍執茲黃鉞威靈振耀如火之烈公之蒞止群狄斯柔齊斧罔設介士斯休見本集藝文類聚六十八北堂書鈔一百十五引此篇為鼎銘鼎銘忠文朱公名穆字公叔有殷之胄微子啓以帝乙元子周武王封諸宋以奉成湯之祀至元子啓生公子朱其孫氏焉後自沛遷于南陽之宛遂大于宋爵位相襲烈祖尚書令肅宗之世守于臨淮考曰實為陳留太守乃及忠文克慎明德以紹服祖禰之遺風悉心臣事用媚天子顯允其勳蹟尋綜六藝契闊馳思所以啓前惑而覺後疑者亹亹焉雖商偃其猶病諸初舉孝廉除郎中尚書侍郎獨念運際存亡之要乃陳五事諫謀深切退處畎畝以察天象驗應著焉孝順晏駕賊發江淮時辟大將軍府實掌其事用拜宛陵令非其好也遂以疾辭復辟大將軍再拜博士高第作御史明司國憲以齊百僚矯枉董直罔肯阿順以黜其位潛于郎中群公竝表乃遷議郎登于東觀纂業前史于是冀州凶荒年饉民匱而貪婪之徒乘之為虐錫命作牧靜其方隅乃攄洪化奮靈武昭令德塞群違貞良者封植殘戾者芟夷去惡除盜無俾比而作慝用陷于非辜復徵拜議郎病免官徵拜尚書清一以考其素正直以醇其德出納帝命乃無不允雖龍作納言山父喉舌靡以尚之享年六十有四漢皇二十一世延熹六年夏四月乙巳卒于官天子痛悼詔曰制詔尚書朱穆立節忠亮世篤爾行虔恪機任守死善道不幸而卒朝廷閔焉今使權謁者中郎楊賁贈穆益州刺史印綬魂而有靈嘉其寵榮嗚呼哀哉肆其孤用作茲寶鼎而銘載休功俾後裔永用享祀以知其先之德見本集酒樽銘酒以成禮弗繼以淫德將以荒過則荒沈盈而不沖古人所針尚鑒茲器茂勗厥心見藝文類聚七十三警枕銘應龍蟠蟄潛德保靈制器象物亦有其形哲人降鑒居安慮傾見北堂書鈔一百三十四藝文類聚七十御覽七百七槃銘華蓋就用以享嘉賓內丹其實外若玄真見御覽七百五十八銅籥銘籥黃鍾之宮長九寸空圍九分容秬黍一千二百粒稱重十二銖兩之為一合三分損益轉生十二律見隋書律曆志上審度祖孝孫云相承傳是蔡雍銅籥女訓舅姑若命之鼓琴必正坐操琴而奏曲若問曲名則捨琴興而對曰某曲坐若近則琴聲必聞若遠左右必有贊其言者凡鼓小曲五終則止大曲三終則止無數變曲無多少尊者之聽未厭不敢早止若願望視他則曲終而後止亦無中曲而息也琴必常調尊者之前不更調張私室若近舅姑則不敢獨鼓若絶遠聲音不聞鼓之可也鼓琴之夜有姊妹之妻則可也見御覽五百七十七女誡禮女始行禮服纁纁絳也絳正色也紅紫不以為褻服緗緑不以上服繒貴厚而色尚深為其堅紉也見御覽八百十四而今之務在奢麗志好美飾帛必薄細釆必輕線或一朝之晏再三易衣從慶移坐不因故服見書鈔未改竄本一百二十九引蔡雍女誡陳禹謨本作衣針張溥等皆為所誤夫心猶首面也是以甚致飾焉面一旦不修飾則塵垢穢之心一朝不思善則邪惡入之人咸知飾其面而莫修其心惑矣夫面之不飾愚者謂之醜心之不修賢者謂之惡愚者謂之醜猶可賢者謂之惡將何容焉故覽照拭面則思其心之潔也傅脂則思其心之和也加粉則思其心之鮮也澤髮則思其心之順也用櫛則思其心之理也立髻則思其心之正也攝鬢則思其心之整也見文選張華女史針注御覽三百六十五四百五十九七百十四七百十八七百二十
