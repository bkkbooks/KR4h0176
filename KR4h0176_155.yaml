body:
  text: 蔡雍九疑山碑巖巖九疑峻極于天觸石膚合興播連雲時風嘉雨浸潤下民芒芒南土實賴厥勛建于虞舜聖德光明克諧頑傲以孝蒸蒸師錫帝世堯而授徵受終文祖璇璣是承泰階以平人以有終遂葬九疑解體而升登此崔嵬託靈神仙見藝文類聚七光武濟陽宮碑惟漢再受命曰世祖光武皇帝考南頓君初為濟陽令濟陽有武帝行過宮常封閉帝將生考以令舍下溼開宮後殿居之建平元年十二月甲子夜帝生時有赤光室中皆明使卜者王長卜之長曰此善事不可言歲有嘉禾一莖生九穗長于凡禾因為尊諱王室中微哀平短祚姦臣王莽偷有神器十有八年罪成惡熟天人致誅帝乃龍見白水淵躍昆滍破前隊之衆殄二公之師收兵略地經營河朔戮力戎功翼戴更始義不即命帝位闕焉於是群公諸將據河洛之文協符瑞之徵僉曰曆數在帝踐祚允宜乃以建武元年六月乙未即位鄗縣之陽五成之陌祀漢配天罔失舊物享國三十有三年方內乂安蠻夷率服巡狩泰山禪梁父皇代之遐迹帝者之上儀罔不畢舉道德餘慶延于無窮先民有言曰樂樂其所自生而禮不忘其本是以虞稱媯汭姬美周原皇天乃眷神宮實始于此厥迹邈哉所謂神麗顯融越不可尚小臣河南尹鞏瑋先祖銀艾封侯歷世卿尹受漢厚恩瑋以商箕餘烈郡舉孝廉為大官丞來在濟陽願見神宮追惟桑梓褒述之義用敢作頌赫矣炎光爰耀其輝篤生聖皇二漢之微稽度乾則誕育靈姿黃孽作慝篡握天機帝赫斯怒爰整其師應期潛見扶陽而飛禍亂克定群凶殄夷匡復帝載萬國以綏巡于四嶽展義省方登封降禪升于中皇爰茲初基天命孔彰子子孫孫保之無疆見本集藝文類聚十二陳留東昏庫上里社碑曰社祀之建尚矣昔在聖帝有五行之官而共工子句龍為后土及其沒也遂為社祀故曰社者土地之主也周禮建為社位左宗廟右社稷戎醜攸行于是受脤土膏恆動于是祈農又班之于兆民春秋之中命之供祠故自有國至于黎庶莫不祀焉惟斯庫上里古陽武之戶牖鄉也秦時有池子華為丞相漢興陳平由此社宰遂佐高帝克定天下為右丞相封曲逆侯孝平之世虞延為太尉司徒封公至延熹中延弟曾孫放字子卿為尚書令外戚梁冀乘寵作亂首策誅之王室以績詔封都亭侯太僕太常司空毗天子而維四方克錯其功往烈有常于是司監爰暨邦人僉以宰相繼踵咸出斯里秦一漢三而虞氏世焉雖有積德餘慶修身之致亦斯社之所相也乃與樹碑作頌以示後昆惟王建祀明事百神乃顧斯社于我兆民明德惟馨其慶聿彰自嬴及漢四輔代昌爰我虞宗乃世重光元勳既立錫茲土疆乃公乃侯帝載用庸神人叶祚且巨且長凡我里人盡受嘉祥刊銘金石永思不忘見本集史記陳丞相世家索隱書鈔八十七御覽五百三十二伯夷叔齊碑熹平五年天下大旱禱請名山求獲答應時處士平陽蘇騰字玄成夢陟首陽有神馬之使在道明覺而思之以其夢陟狀上聞天子開三府請雨使者與郡縣戶曹掾吏登山升祠手書要曰君況我聖主以洪澤之福天尋興雲即降甘雨也見續漢五行志一注補惟君之質體清良兮借佐殷姬忠孝彰兮委國捐爵諫國匡兮譏武伐紂欲喻匡兮時不可救歷運蒼兮追念先侯受命皇兮憂懷感兮雖沒不朽名字芳兮見藝文類聚三十七王子喬碑王孫子喬者蓋上世之真人也聞其仙舊矣不知興于何代博問道家或言潁川或言彥蒙初建斯城則有斯丘傳承先民曰王氏墓紹胤不繼荒而不嗣歷載彌年莫之能紀于永和之元年冬十有二月當臘之夜墓上有哭聲其音甚哀附居者王伯聞而怪之明則登其墓察焉時天洪雪下無人徑見一大鳥迹有祭祀之處左右咸以為神其後有人著大冠絳單衣杖竹策立冢前呼樵孺子尹永昌曰我王子喬也爾勿復取吾墓前樹也須臾忽然不見時令太山萬熙稽故老之言感精瑞之應咨訪其驗信而有徵乃造靈廟以休厥神于是好道之儔自遠來集或絃歌以歌太一或覃思以歷丹丘其疾病尫瘵者靜躬祈福即獲祚若不虔恪輒顛踣故知至德之宅兆實真人之先祖也延熹八年秋八月皇帝遣使者奉犧牲以致祀祗懼之敬肅如也國相東萊王璋字伯義以為神聖所興必有銘表昭示後世是以賴鄉仰伯陽之蹤關民慕尹喜之風乃與會長史邊乾訪及士隸遂樹玄石紀頌遺烈俾志道者有所覽焉伊王君德通靈含光耀秉純貞應大道羡久榮棄世俗飛神形翔雲霄浮太清乘螭龍載鶴軿戴華笠奮金鈴揮羽旗曳霓旌歡罔極壽億齡昭篤孝念所生歲終闕發丹情存墓冢舒哀聲遺鳥迹覺舊城被絳衣垂紫纓呼孺子告姓名由此悟咸布驚修祠宇反几筵饋饎進甘香陳時傾顧馨明禋匡流祉熙帝庭祐邦國相黔民光景福耀無垠見本集水經汳水注御覽三十三引蔡雍王喬録京兆尹樊陵頌碑前漢戶五萬口有十七萬王莽後十不存一永初元年羌戎作虐至光和領戶不盈四千園陵蕃衛粢盛之供百役出焉民用匱乏不堪其事見續漢郡國志一注補注引蔡雍樊陵頌於顯哲尹誕德孔彰膺帝休命謂篤不忘爰納忠式規悟聖皇欽崇園邑大孝允光九命車服昭示采章軒軺四牡承祀蒸嘗多士時貢繇役永息進路孔夷民清險棘同體諸舊兆萌蒙福惠垂無疆守以罔極見藝文類聚六琅玡王傳蔡朗碑君諱朗字仲明蓋倉頡之精胤姬稷之末胄也昔叔度文王之昭建侯于蔡以國氏焉迄于平襄周祚微缺王室遂卑齊晉交爭強楚侵陵昭侯徙于州來公族分遷氏家于圉奕葉載德常歷宮尹以建于茲君雅操明允威厲不猛履孝悌之性懷文藝之才包洞典籍刊摘沈祕知機達要通含神契既討三五之術又采二南之業以魯詩教授生徒雲集莫不自遠並至栖遲不易其志簞食曲肱不改其樂心棲清虛之域行在玉石之間是以德行儒林智周當代四嶽稱名帝曰余聞元和元年徵拜博士舒演奧祕贊理闕文所立卓爾度躡雲蹤其選士也抑頑錯枉進聖擢偉極遺逸于九皋揚明德于側陋拔茅以彙幽滯用濟加以清敏廣平好是正直規誨之策日諫于庭忠讜著烈令聞流行聖朝以藩國貴胄先帝遺體或以繼絶襲位正于阿保未洽雅訓驕盈僭差或蹈憲理非弘直碩儒莫能匡弼蔡君審行修德進退可度遷河間中尉琅邪王傅乃從經術之方示以棐諶之威率禮莫違其國用靖雖安國之輔梁孝仲舒之相江都靡以加焉勳績既盛帝簡其功將授上位遷于紫宮賦壽不永遘此疾凶年五十八永興六年夏卒嗚呼哀哉凡百君子咨痛罔極殷懷傷悼含涕流惻如何昊天喪我師則爰勒斯銘式昭其德銘曰天縱明哲於赫我君含弘光大玄覽孔真潛樂教思韞玉衡門雲龍感應養徒三千珠藏外耀鶴鳴聞天若時徵庸登祚王臣綜彼前疑定此典文參佐七德俾相大藩身沒稱顯永遺令勳表行揚名垂示後昆見本集玄文先生李休碑玄文先生名休字子材南陽宛人也其祖李伯陽周柱下史覿衰世而遁焉其後雄俊豪傑往往崛出自戰國及漢名臣繼踵枝胄散逸其遷于宛尚矣王莽竊位漢祚中移考翼佐世祖匡復郊廟錫封茅土卿相牧守于時相逐休少以好學遊心典謨既綜七經又精群緯鉤深極奧窮覽聖旨居則玩其辭動則察其變雲物不顯必考其占故能獨見前識以先神意若古今常難疑義錯繆前人所希論後學所不覽休盡剖判剝散幽暗昭爛猶發憤于目所不覩體所不間遂登東嶽觀百王遺風習容闕里以協禮衷退而講誨童冠仰焉僔僔如也郡署五官掾功曹司空胡公顯以儒譽特進大鴻臚仍優禮固請秉讓執虛辭此三命不為利回不為義疚臨寵審己不動其守可謂純潔皓素綽有餘裕者已其於鄉黨細行敦睦九族篤信交友不可得而詳也初娶配出後配未字年既五十苗胤不嗣以永壽二年夏五月乙未卒凡其親昭朋徒臭味相與大會而葬之鼎俎之禮節文曲備時令戴君臨喪命諡郡遣丞掾冠蓋咸屆既定而後罷焉于是故好友朋僉以為仲尼既沒文不在茲韞櫝美玉喪莫賈之求而無繼慺爾永思乃刊斯石懿德是丕吁茲先生秉德恭勤天啓哲心其學孔純經緯是綜雅麗是分行己守道匪禮不遵處約不戚聞寵不欣榮不能華威不能震天淑厥命以讓以仁有惠云載惟邦之珍案典考論號曰玄文身沒名彰配黔作鄰遺譽罔極丕昭億年嗚呼哀哉見本集藝文類聚三十七汝南周協碑君諱協字巨勝陳留太守之孫光祿勳之子也君應坤乾之淳靈繼命世之期運玄懿清朗貞厲精粹體仁足以長人嘉德足以合禮總六經之要括河洛之機援天心以立鈞贊幽明以揆時沈靜微密淪于無內寬裕弘博含乎無外巨細洪纖罔不總也是以實繁于華德盈乎譽初以父任拜郎中疾去官察孝廉是時郡守梁氏外戚貴寵非其好也遂以病辭太守復察孝廉乃俯而就之以明可否然猶私存衡門講誨之樂不屑已也又委之而旋故大將軍梁冀專國作威海內從風世之雄材優逸之徒莫不委質從命而顛覆者蓋以多矣聞君洪名前後三辟而卒不降身由是縉紳歸高群公事德太尉司徒再辟三辟察賢良方正州舉孝廉皆病不就擾攘之際災眚仍發聖上詢咨師錫策命公車特徵君仰瞻天象俯效人事世路多險進非其時乃託疾杜門靜居里巷無人迹外庭生蓬蒿如此者十餘年疆禦不能奪其守王爵不能滑其慮至延熹二年乃更闢門延賓享宴娛樂及秋而梁氏誅滅十二月君卒然則識幾知命可覩于斯矣洋洋乎若德雖崇山千仞重淵百尺未足以喻其高究其深也夫三精垂耀處者有表爰在上世作者七人焉有該百行備九德齊光日月洞靈神明如君之至者與亶所謂天民之秀也享年五十不登期考遐邇歎悼痛心失圖乃相與建碑勒銘以徵休美其辭曰厥初生民天賜之性有龐有醇有否有聖伊維周君允丁其正誕茲明德自貽哲命煥乎其文如星之布確乎不拔如山之固追蹤先緒應期作度潛心大猷覃思德謨遁世無悶屢辭王寮洋洋泌丘于以消搖蔑爾童蒙是訓是教瞻彼榮寵譬諸雲霄優哉遊哉侔此弘高名振華夏光耀昆苗清風丕揚德音孔昭見本集朱穆墳前方石碑維漢二十一世延熹六年粵四月丁巳文忠公益州太守朱君名穆字公叔卒于京師其五月丙申葬于宛邑北萬歲亭之陽舊兆域之南其孤野受顧命曰古者不崇墳不封墓祭服雖三年無不于寢今則易之吾不取也爾其無拘于俗無廢于誡野欽率遺意不敢有違封墳三板不起棟宇乃作祠堂于邑中南舊陽里備器鑄鼎銘功載德懼墳封彌久夷于平壤于是依德像緣雅則設茲方石鎮表靈域用慰其孤罔極之懷乃申詞曰歆惟忠文時惟朱父實天生德丕承洪緒彌綸典術允迪聖矩好是貞厲疾彼強禦斷剛若讎柔亦不茹仍用明夷遘難受侮帝曰休哉朕嘉乃功命汝納言胤汝祖蹤父拜稽首翼翼惟恭篤棐不忘夙夜在公昊天不弔降茲篤殃不遺一父俾屏我皇我皇悼心錫詔孔傷位以益州贈之服章用刊彝器宣昭遺光子子孫孫永載寶藏見本集太尉楊秉碑公諱秉字叔節弘農華陰人也其先蓋周武王之穆晉唐叔之后也末葉以支子食邑于楊因氏焉周家既微裔胄無緒暨漢興烈祖楊熹佐命征伐封赤泉侯嗣子業紱冕相繼公之丕考以忠蹇亮弼輔孝安登司徒太尉公承夙緒世篤儒教以歐陽尚書京氏易誨授四方學者自遠而至蓋踰三千初辟司空舉高弟拜侍御史遷豫州兗州刺史任城相徵入勸講拜太中大夫左中郎將尚書出補右扶風留拜光祿大夫遭權嬖貴盛六年守靜外戚火燔乃遷太僕大卿公事絀位浹辰之間俾位河南憤疾豪強見遘姦黨用嬰疾廢起家復拜太常遂陟三司沙汰虛穴料簡貞實抽援表達與之同蘭芳任鼎重從駕南巡為朝碩德然知權過于寵私富侔國大臣苛察望變復還條表以聞啓導上怒其時所免州牧郡守五十餘人叨戾是黜英才是列善否有章京夏清肅在位七載年七十有四延熹八年五月丙戌薨朝廷惜焉寵錫有加自奉嚴敕動遵禮度量材授任當官而行不為義疚疾是苛政益固其守廚無宿肉器不雕鏤夙喪嬪儷妾不嬖御可謂立身無過之地正直清儉該備者矣昔仲尼有垂三戒而公克焉故能匡朝盡直獻可去姦忠侔前後聲塞宇宙非黃中純白窮達一致其惡能立功立事敷聞于下昭升于上若茲巍巍者乎于是門人學徒相與刊石樹碑表勒鴻勳讚懿德傳億年於戲公唯嶽靈天挺德翼至赤精絪縕仁哲生應台任作邦楨帝欽亮訪典刑道不忒迄有成光遐邇穆其清見本集藝文類聚四十六陳留太守胡碩碑君諱碩字季睿交趾都尉之孫太傅安樂侯少子也其先與楚同姓別封于胡以國為氏臻乎漢奕世載德不替舊勳君幼有嘉表克岐克嶷不見異物習與性成孝于二親養色寧意蒸蒸雍雍雖曾閔顏萊無以尚也總角入學治孟氏易歐陽尚書韓詩博綜古文周覽篇籍言語造次必以經綸加之行己忠儉事施順恕公體所安與衆共之驕吝不萌于內喜慍不形于外可謂無競伊人溫恭淑慎者也初以公在司徒除郎中宿衛十年遭叔父憂以疾自免州郡交辟皆不就後以大將軍高弟拜侍御史遷諫議大夫以將軍事免官舉賢良方正不詣公車建寧元年召拜議郎納忠盡規匪懈于位遷侍中虎賁中郎將是年遭疾屢上印綬詔書聽許以侍中養疾其年七月被尚書召不任應命詔使謁者劉悝齎印綬即拜陳留太守君聞使者至加朝服拖紳使者致詔君以手自繫陳辭謝恩其月二十一日遣吏生奉章食後還與丞相答意氣精了是日疾遂大漸刻漏未分奄忽而卒時年四十一天子憫悼詔使謁者王謙送葬以中牢具祠賜錢五萬布百匹贈穀三千斛同位畢至赴弔雲集生榮未艾沒有餘哀于是遐邇縉紳爰暨門人相與歎述君德追痛不永怛切情憭無不永懷行由己作名自人成先民既邁賴茲頌聲嗟我明哲如何勿銘乃作辭曰猗歟懿德令問有彰祗服其訓克構克堂孝思惟則文藝丕光敦厚率忠恕衆悅其良綏弱以仁不云我強爰自登朝進退以方見機而作如鴻之翔乃位常伯恪處左右兼掌虎賁禁戎允理遘茲虐痾帝用悼止俾守陳留庶篤其祉王人既詔景命不俟嗚呼昊天殲我英士如可贖也敦不百己哀哉永傷萬年是紀見本集君諱碩字季睿交址都尉之孫太傅安樂鄉侯之子也順帝時為郎中桓帝時遭叔父憂以疾自免荊州將軍北辟輒辭疾後以高等拜侍御史遷諫議大夫舉賢良方正病不詣公車建寧元年七月拜陳留太守病加不任應召詔使謁者劉悝即授印綬二十一日卒詔出遣使者王謙以中牢具祠特賜錢五萬布一百匹贈穀三千斛儔類赴送遠近鱗集于是陳留主簿高吉蔡軫等咸以郡選充備官屬來迎者三十四人奔驚跋涉願承清化逢天之戚不獲延祚痛心絶望切怛永慕乃相與衰絰庭位號跳靈柩將窆申敕修儀煢煢在疚輿服寮御部引各執其職路人感愴觀者嘆息蓋三綱之序與並育以舊奉新嗟我行人敢不自勗遂樹碑作銘以表令德於藐下國瞻仰俊乂欽見我君爰綏我惠式昭績恩有勞其悴昊天不弔景命顛墜悠悠蒸黎惆悵喪氣政雖未宣古之遺愛祁祁我君習習冠蓋修誠以迓曾不東邁靈魂徘徊靡所瞻建惟其傷矣胸肝摧碎勒銘告哀傳于萬代見本集文選魏都賦注引蔡雍胡億碑云祁祁我君習習冠蓋是六朝唐初本有此篇彼題作胡億蓋誤胡廣子五長整次失名皆夭次億郡舉孝廉不就次寧為議郎少子碩陳留太守詳見母夫人章氏靈表都尉夫人黃氏神誥
