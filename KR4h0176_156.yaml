body:
  text: 蔡邕郭泰碑先生諱泰字林宗太原界休人也其先出自有周王季之穆有虢叔者實有懿德文王咨焉建國命氏或謂之郭即其後也先生誕應天衷聰叡明哲孝友溫恭仁篤慈惠夫其器量弘深姿度廣大浩浩焉汪汪焉奧乎不可測已若乃砥節礪行直道正辭貞固足以幹事隱括足以矯時遂攷覽六經採綜圖緯周流華夏隨集帝學收文武之將墜拯微言之未絕于時纓緌之徒紳佩之士望形表而景附聆嘉聲而響和者猶百川之歸巨海鱗介之宗龜龍也爾乃潛隱衡門收朋勤誨童蒙賴焉用祛其蔽州郡聞德虛己備禮莫之能致群公休之遂辟司徒掾又舉有道皆以疾辭將蹈鴻涯之遐迹紹巢許之絕軌翔區外以舒翼超天衢以高峙稟命不融享年四十有二以建寧二年正月乙亥卒凡我四方同好之人永懷哀悼靡所寘念乃相與惟先生之德以謀不朽之事僉以為先民既沒而德音猶存者亦賴之于見述也今其如何而闕斯禮于是建碑表墓昭明景行俾芳烈奮乎百世令問顯于無窮其辭曰於休先生明德通玄純懿淑靈受之自天崇壯幽浚如山如淵禮樂是悅詩書是敦匪惟摭華乃尋厥根宮牆重仞允得其門懿乎其純確乎其操洋洋縉紳言觀其高棲遲泌丘善誘能教赫赫三事幾行其招委辭召貢保此清妙降年不永民斯悲悼爰勒茲銘摛其光耀嗟爾來世是則是效見文選蓺文類聚三十七處士圈典碑伊漢二十有一世處士有圈典字叔則者夫其生也天真淑性清理條畼精微周密包括道要致思無形深總歷部纖入蓺文藻分葩列如春之榮守根據窮不虛其聲偉德若茲惟世之英乃遂隱身高藪稼穡孔勤童蒙來求彪之用文不義富貴譬諸浮雲州郡禮招休命交集徒加名位而已莫之能起也博士徵舉至孝恥已處而復出若有初而無終潔耿介於丘園慕七人之遺風年七十有五建寧二年六月卒臨沒顧命曰知我者其蔡邕乃為銘載書休美俾來世昆裔永有諷誦以知先生之德其辭曰民之齊敏卓時挺生思心精叡綜物通靈術有玄妙于時游情聞道睹異惕然若驚守死善操與世無營渾其若濁徐然後清綽其若煥終其益貞有恆實難獨秉其經嗟爾來世是瞻是聽見本集蓺文類聚三十七童幼胡根碑故陳留太守胡君子曰根字仲原生有嘉表幼而克才角犀豐盈光潤玉顏聽明敏惠好問早識言語所及智思所生雖成人之德無以加焉稟命不長夙罹凶災年七歲建寍二年遭疾夭逝慈母悼痛昆姊孔懷感襁褓之親愛憐國城之乖離乃權宜就封二祖墓側親屬李陶等相與追慕先君悲悼遺嗣樹碑刊辭以慰哀思辭曰於惟仲原應氣淑靈實有令儀而氣如瑩明之之性與體俱生聞言斯識覩物知名傳者太勤受誨則成柔和順美與人靡爭忿不怨懟喜不驕盈當受永福為光為榮如何昊天降此短齡惜繁華之方曅兮望嚴霜而凋零差童孺之夭逝兮傷慈母之肝情從皇祖乎靈兆兮庶神魄之斯寍哀慘戚以流涕兮念污軫之不呈顧永懷于不朽兮乃託辭于斯銘見本集太傅胡廣碑公諱廣字伯始南郡華容人也其先自媯姓建國南土曰胡子春秋書焉列于諸侯公其後也考以德行純懿官至交趾都尉公寬裕仁愛覆載博大研道知機窮理盡性凡聖哲之遺教文武之未墜罔有不綜年二十七察孝廉除郎中尚書侍郎左丞尚書僕射內正機衡允釐其職文敏畼乎庶事密靜周乎樞機帝用嘉之遷濟陰太守公乃布愷悌宣柔嘉通神化道靈邪取忠肅于不言消奸宄于爪牙是以君子勤禮小人知恥鞠推息于官曹刑戮廢于朝市餘貨委于路衢餘種栖于畎畝遷汝南太守增修前業考績既明入作司農實掌金穀之淵藪和均關石王府以充遂作司徒昭敷五教進作太尉宣畼渾元人倫輯睦日月重光遭國不造帝祚無主援立孝桓以紹宗緒用首謀定策封安樂鄉侯戶邑之數加于群公入錄機事聽納總己致位就弟復拜司空敷土導川俾順其性功遂身退告疾固辭乃為特進爰以休息又拜太常典司三禮敬恭禋祀神明嘉歆永世豐年聿懷多福復拜太尉尋申前業又以特進消遙致位又拜太常遘疾不夷遜位辭爵遷于舊都徵拜太中大夫延和末年聖主革正幸臣誅薨引公為尚書令以二千石居官委以閫外之事釐改度量以新國家弘綱既整袞闕以補乃拜太僕車正馬閑六騶習訓遷太常司徒成宗晏駕推建聖嗣復封故邑與參機密寢疾告退復拜太傅錄尚書事于時春秋高矣繼親在堂朝夕定省不違子道旁無几杖言不稱老居喪致哀率禮不越其接下荅賓雖幼賤降等禮從謙厚尊而彌恭勞思萬機身勤心苦雖老萊子嬰兒其服方叔克壯其猷公旦納于台屋正考父俯而循禮曷以尚茲夫烝烝至孝德本也體和履忠行極也博聞周覽上通也勤勞王家茂功也用能七登九命篤受介祉亮皇聖于六世嘉庶績于九有窮生人之光寵享黃耇之遐紀蹈明德以保身與福祿乎終始年八十有二建寧五年春壬戌薨于位天子悼痛贈策遂賜誄謚曰文恭如前傅之儀而有加焉禮也故吏司徒許詡等相與欽慕崧高蒸民之作取言時計功之則論集行跡銘諸琬琰其詞曰伊漢元輔時惟文恭聰明叡哲思心瘁容畢力天機帝休其庸賦政于外有邈其蹤進作卿士粵登上公百揆時序五典克從萬邦黎獻共唯時雍勳烈既建爵土乃封七被三事再作特進弘唯幼沖作傅以訓赫赫猗公邦家之鎮澤被華夏遺愛不淪日與月與齊光竝運存榮亡顯沒而不泯見本集蓺文類聚四十六又略見三十五文選魏都賦注公諱廣字伯始交趾都尉之元子也公應天淑靈履性貞固九德咸修百行必備遭家不造童而夙孤上奉繼親下慈弱弟崎嶇儉約之中以盡孝友之道及至入學從訓歷觀古今生而知之聞一覩十是以周覽六經博總群議旁貫憲法通識國典年二十七察孝廉除郎中尚書侍郎尚書左丞尚書僕射幹練機事綢繆樞極忠亮唯允𥳑于帝心智略周密冠于庶事遷濟陰太守其為政也寬裕足以容眾和柔足以安物剛毅足以威暴體仁足以勸俗故禁不用刑勸不用賞望之如日月從之如影響思不可忘度不可革遺愛結于人心超無窮而垂則徵拜大司農遂作司農遷太尉以援立之功封安樂鄉侯錄尚書事稱疾屢辭策賜就第復拜司空功成身退俾位特進又拜太尉復以特進致命休神又拜太尉遜位歸爵旋于舊土徵拜太中大夫尚書令太僕太常司徒永康之初以定策元功復封前邑錄尚書事疾病就第又授太傅入參機衡五蹈九列七統三事諒闇之際三據冢宰和神人于宗伯治水土于下台訊五品于司徒耀三辰于上階光弼六世歷載三十自漢興以來鼎臣元輔耋袞老成勳被萬方與祿終始未有若公者焉春秋八十二建寧五年三月壬戌薨于位天子悼惜群后同懷詔五官中郎將任崇奉冊贈以太傅安樂鄉侯印綬拜室家子一人郎中賜東園祕器賜絲帛含斂之備中謁者董詡弔祠護喪錢布賻賜率禮有加賜謚曰文恭昭顯行迹四月丁酉葬于洛陽塋故吏濟陰池喜感公之義率慕黃鳥之哀推尋雅意彷徨舊土休績丕烈宜宣于此乃樹石作頌用揚德音詞曰於皇上德懿鑠孔純大孝昭備思順履信膺其命世保茲舊門淵泉休茂彪炳其文爰尚天機翼翼唯恭夙夜出納紹迹虞龍賦政于外神化玄通普被汝南越用熙雍帝曰休哉命公三事乃耀柔嘉式是百司股肱元首庶績咸釐二氣燮雍五徵來備勳格皇天澤洽后土封建南蕃受茲介祜玉藻在冕毳服艾輔路車雕驂四牡修扈贊事上帝祗祠宗祖陟降盈虧與時消息既明且哲保身遺則同軌旦奭光充區域生榮死哀流統罔極見本集蓺文類聚四十六維漢二十有一世建寧五年春三月既生魄八日壬戌太傅安樂鄉侯胡公薨越若來四月辛酉葬我君文恭于是掾太原王允雁門畢整屬扶風魯宙潁川殷厤等僉謂公之德也柔而不犯威而不猛文而不華實而不朴靜而不滯動而不躁總天地之中和覽生民之上操聰明膚敏兼質先覺涉觀憲法契闊文學睹皋陶之闈閫究孔子之房奧然而約之以禮守之以恭寬之以納眾汎愛多容其誘人也恂恂焉怡怡焉使夫蒙惑開析愎戾優順逸惰能夫勤信及其創基即位發跡機密聖朝其知其能夙夜惟寅以允帝命是以頻繁機極三升而不出焉乃還譚其舊章彌綸古訓貫萬品研精微用補前臣之所闕十年而無愆彊記同乎富平周慎逸于博士偶山甫乎喉舌匹虞龍而納言唯帝命以二郡其為政也導人以德帥物以己敦以忠肅厲以知恥人悅其化天樂其和士相勉于公朝民勸行于私家徽墨縈而靡係鞭朴棄而無加洋洋乎若德宣治嚴以為威寬以為福而已哉五作卿士七蹈相位太僕司農太傅司空各一司徒特進各二太常太尉各三光輔六世歷載三十有餘其致治也通水泉于潤下蕃后土于稼穡訓五品于群黎理人倫于區域耀三辰于渾元協大和乎皇極傅聖德于幼沖率旦奭之舊職譬彼四時功成則退在盈思沖升隆以順建封域于南土踐殊域于特進榮祚統業垂乎來胤公自二郡及登相位凡所辟用遂至大位者故司徒中山祝括其餘登堂據閣賦政策勳樹功流化者蓋不可勝載惟我末臣頑蔽無聞仰慕群賢惡乎可及自公寢疾至于薨斃參與嘗禱列在喪位雖庶物戮力不愆于禮進覩墳塋几筵靈設退顧堂廡音儀永闕感悼傷懷心肝若割相與累次德行撰舉功勳刊之于碑用慰哀思煥文德伊胡后應期運作漢輔喜中興膏民庶澤洪淳亶攸序亙地區充天宇轔高逵踵遐武揚景烈垂不朽仰邃古耀昆後見本集蓺文類聚四十六太傅祠堂碑銘天鑒有漢山岳降靈於赫文恭應期誕生好是懿德柔惠且貞爰在初服皇嘉其聲納于機密機密惟清守于三邦三邦事寧越尹三卿伯揆時序七受帝命作此元輔左右六世靖綏土宇蠢彼群生保賴亶敘紹迹龍夷繼軌山甫遭國不造仍世短祚援立聖嗣保公之謨帝曰文恭朕嘉君功為邑安樂以祐其庸登位特進于異群公休命丕顯光寵克章公拜稽首是對是揚藹藹惟恭民斯攸望春秋既暮倏爾乃喪不憖是遺俾屏於皇新廟奕奕于以烝嘗子子孫孫承嗣無疆見本集彭城姜肱碑先生諱肱字伯淮彭城廣戚人也其先出自帝胤在皇唐蓋與四岳共葉能禮于神舜命秩宗爰封于呂其裔呂望佐周克殷俾侯齊國姓有姜氏即其後也高祖祖父皆豫章太守潁陰令先生既蹈先世之純德體英妙之高姿立性純固百行修備故其平生所能事親惟孝如大舜五十而慕友于兄弟有棠棣之華萼韡之度體惠理和有上德之素安靜守約恩及嬰兒恬蕩之固至操動俗邑中化之外戶不閉冶藏無隱及其學而知之者三墳五典八索九丘俯仰占候推步陰陽有名物定事之能獨見先覩之効然猶學而不厭誨而不倦童冠自遠方而集者蓋千餘人夫水盈而流德交而形是故德行外著洪聲遠布華夏同稱名振當世凡十辟公府九舉賢良方正公車特徵玄纁禮聘又家拜楗為太守太中大夫先生盤桓育德莫之肯就不隕穫于貧賤不充詘于富貴拔乎其萃出乎其類生民之傑也年七十有七熹平二年四月丁巳卒于是從遊弟子陳留申屠蟠等悲悼傷懷懼微言之欲絕感絕倫之盛事乃建碑于墓甄述景行曰邈矣先生應天淑靈孝友是備上德是經弘此文蓺耽怡是寧恂恂善誘童冠來誠有燁其譽有煥其聲顯顯群公竝加辟命赫赫聖皇仍獲其聘委策避國守此玄靜綽乎其裕確乎其操疇昔洪崖雙名竝高嗟乎殞歾縉紳永悼依依我徒靡則靡效勒銘金石彌遠益曜見本集太尉李咸碑公諱咸字元卓汝南西平人蓋秦將李信之後孝武大將軍廣之冑也枝流葉布家于茲土文武繼踵世為著姓曾祖父江夏太守伯父東郡太守公受純懿之姿粹忠清之節夙夜嚴慄孝配大舜敦詩書而悅禮樂觀天文而察地理明略兼洞與神合契操邁伯夷德追孔父舉孝廉除郎中光祿茂才遷衛國公相授高密令勤恤民隱政成功簡遷徐州刺吏百司震肅饕餮風靡惡直醜正恭事法官帝念其勳屢被榮命拜漁陽太守還遷度遼將軍協德魏絳和戎綏邊徵河南尹母憂乞行服闋奔命孝桓皇帝時機密久缺百寮僉允詔拜尚書歷僕射公納言危行不絀以公事去民神憤怒群公薦之帝曰俞哉徵拜將作大匠大司農大鴻臚大僕公所莅任憲天心以教育激垢濁以揚清為國有賞蓋有億兆之心懿鑠之美昭登于上丕顯之化宣聞于下及遷台司位太尉補袞闕敘彝倫天人交格終始無疵雖元凱翼虞周召輔姬未之或踰功遂身退以疾自遜求歸田里告老致仕七十有六熹平四年薨海內咨嗟莫不惻焉于是故吏潁川太守張溫等相與歎曰名莫隆于不朽德莫盛于萬世銘勒顯于鐘鼎清烈光于來裔刊石立碑載德不泯詞曰天垂三台地建五岳降生我哲應鼎之足奕世載德名昭圖錄既文且武桓桓紹續外則折衝內則大麓惟清惟敏品物以熙告老懸車天人靡欺曾不百齡圮我國基人之云亡八極悼思申德作頌光寵宣流鐫紀斯石鴻烈顯休見本集蓺文類聚四十六
