body:
  text: 蔡雍太尉陳球碑君諱球字伯真廣漢太守之元子也蓋周存六代嫣滿繼虞建國于陳逮完徂齊實為陳氏公父自營州來海淮世耽典籍兼通勤誨振裘褐即徵聘答宰司荷顯貢者繼世而傅焉至公剛寡立言懿惠和高明柔克甘味道藝強學博物凡墳素遺訓聖賢立言掬精極微無不究除郎中尚書符節郎恆陵園令換中東城門侯遷繁陽令養老長孤救災匡困化惡以善擾逆以厥澤鴻醇則百姓敬之如神祇愛之如慈親矣暨于考績遭繼母憂禮紀向闋群公爭招遂拜侍御史爾時蠻賊胡蘭李研等蜂聚蛾動剝落荊揚出師命將輒有奔北之困太尉楊公嚴典陳為鵝為兵揚霆激期月獻捷有詔厚賜策書歎述績過畔兵朱蓋等建三牧二守零陵之宜初阻土地平夷編木為城舊有過寇未嘗能亢蓋等望以為入便就館穀公慨然抑留妻子以鎮民心擐甲登埤親帥吏士身當鋒圍城至乎旬有六日傷焰稍逸仍隨馘截威震南夷功光王室詔拜子為郎優勞事列遷魏郡太守徵拜將作大匠會孝桓皇帝崩實掌梓宮事安茶南陽太守父病去官居家半年引授廷尉八議實無㚔民乃遷衛尉遂作司空土濟可黜否盈致仕復拜廷尉進登太常三禮咸時西戎不王選能朝舉荒傷干戈斯戢黜又拜永樂少府年六十有二光和執法三應符守八作卿任相慎在宰割茂思樹為志特立顧秉心茲隆天命弗嗚呼哀哉是凡我困蒙灑掃之廓虛愍將稚泣涕漣如惟不朽實在傳紀乃相勳績銘玄石臨萬國降茲髦爰作民牧遠鎮南近撫服芟凶虐播恩升大鹿沛乎如川礹猶嶽休休之志天為之墮我梁勿思是用鑽勒永萬基見隸釋十文選太尉喬玄碑公諱玄字公祖梁國睢陽人也大鴻臚之曾孫廣川相之孫東萊太守之元子也膺受純性誕有奇表岐疑而超等總角而逸群至矣初紳高明卓異為衆傑雄其性莊疾華尚朴有百折而不撓臨大節而不可奪之風經藝傳記周覽博涉瑰琦在前靡所不識當世是以服重器歸高名州郡交請待以訪斷歷端首則義可行處爪牙而威以布察孝廉除郎中洛陽左尉以公事去辟司徒舉高弟第侍御史直道而往用免其任辟大將軍西府表拜涼州刺史遷齊相以公事去詔書印綬即家拜上谷太守遷漢陽太守徵拜議郎司徒長史巨鹿太守被詔書為將作大匠為受罰者所章拜議郎即徵拜度遼將軍遷河南尹少府大鴻臚遂陟司空司徒託痾遜位起家拜尚書令以疾篤稱拜光祿大夫後拜太尉久病自替復為少府太中大夫春秋七十五光和七年五月甲寅薨公性質直不憚強禦在憲臺則有盡規之忠領州郡則有虎疹之威其拔賢如旋流討惡如霆擊每所臨向清風先翔遠近豫震茲可謂超越衆庶彰于遠邇者已于是故吏司徒博陵顧烈廷尉河南吳整等以為至德在己揚之由人苟不皎述夫何考焉乃共勒嘉石永昭芳烈遂作頌曰赫矣橋父秉文握武內為宗幹出為藩輔在憲彈枉竟由厥矩允牧于涼刈彼裔土爰將度遼亦用齊斧敷教四畿旋統京宇敦茲五服衆庶是與膺踐七命翼我哲聖登空補袞陟徒訓敬尹尉清宸熙帝之政終始為貞典章以定遺愛在民皇哀其命立石刊銘莫逸斯聽魂而有靈萬億其盛見本集藝文類聚四十六太尉喬玄碑陰光光列考伊漢元公克明克哲實睿實聰如淵之浚如嶽之嵩威壯虓虎文繁雕龍撫柔疆垂戎狄率從敷教中夏五典攸通帝謂我后朕嘉君功命君三事時亮天功公拜稽首翼翼惟恭左右天子祗厥勳庸庶績既熙黎民時雍上下謐寧八方和同丕顯伊德作憲萬邦公諱玄字公祖少辟孝廉辟司徒大將軍府為侍御史牧一州典五郡出將邊營入掌機密歷三卿同三司享年七十五光和七年夏五月甲寅以太中大夫薨于京師朝廷所以弔贈如前傅之儀九月乙酉葬于某所三孤故臣門人相與述公言行咨度禮制文德銘于三鼎武功勒于征鉞官簿第次事之實録書于碑陰俾爾昆裔永有仰于碑陰云喬氏之先出自黃帝帝葬于橋山子孫之紹基立姓者咸以為氏漢興世以禮樂為業高祖諱仁位至大鴻臚列名于儒林祖侍中廣州相考東萊太守公稟性貞純幼有弘姿剛而不虐威而不猛聞仁必行睹義斯居文以典術守以純固弱冠從政當官而行刺史周公辟舉從事所部二千石受取有驗公糾發贓罪致之于理時有椒房貴戚之託周公纍息公不為之動史魚之徑直山甫之不阿于是始形舉孝廉除郎中洛陽左尉特進潁王梁不疑為河南尹當事以對是時畏其權寵而為之屈辱者多矣公不折節解印綬去辟司徒舉高第補侍御史以詔書考司隸校尉趙祁事廷尉郭貞私與公書非接使銜命之儀公封書以聞貞以文章得用鬼薪公離司寇辟大將軍梁公幕府屢以救正干其隆指將軍嘉之無言不讎又以高第補侍御史在職旬月羌戎匪茹震驚隴漢西府舉公拜涼州刺史威名克宣凶虜革心清風席卷至則無事車師後部阿羅多卑居相與爭國興兵作亂公遣從事牛稱何傳舉輕車騎奉辭責罪收阿羅多卑居繫燉煌正處以聞阿羅多為王卑居侯稱以奉使副指除侯部候不動干戈揮鞭而定西域之事人以為美談又值饉荒諸郡飢餒公開倉廩以貸救其命主者以舊典宜先請公曰若先請民以死廩訖乃上之詔報曰邊穀不得妄動玄擅出于是玄有汲黯憂民之心後不以為常公達于事情剖斷不疑皆此類也遷齊相視民如保赤子討惡若赴水火刑明賞遂民知勸懼臨淄令賂贓多遂正其罪受鞫就刑沒齒無怨以不先請免官徵拜上谷太守民有父子俱行凶人人惡言當道曉之不止其子殺人公捕得見其侮辨不舉文書以遇赦令蕃縣有帝舜廟以故事齋祠戶曹史張機有懲罰貨祠巫自託以舜命約公云不得譴公覺其姦態收考首伏即日伏辜遷漢陽太守上邽令皇甫貞贓罪明審收考髡鉗死于冀市後以病去徵拜議郎司徒長史循王悝桓帝同産以懷逆謀黜封癭陶王以公長于襟帶拜巨鹿太守悝畏怖明憲檢于靜息自將作大匠徵未到而章謗先入故轉拜議郎遂用免官徵度遼將軍遷河南尹少府大鴻臚司徒司空託病而去悉引衆災雖非己負公皆以自劾遜位歲餘拜尚書令時河間相蓋升以朝廷在藩國時鄰近舊恩歷河南太守太中大夫在郡受取數億以上創毒深刻公表升貪放狼籍不顧天網損辱國家為上招怨當肆市朝以謝兆民幸遇贖令罪除惡在可免升官禁錮終身沒入財賂非法之物以充帑藏懲戒群下連表上不納而升遷為侍中公稱病辭徙拜光祿大夫復拜太尉如前遜位復拜少府病不就職拜太中大夫凡所獲祿皆公府所特表選臨難受位自九列之後咸以明公紀綱張弛勇決不回析見是非明作達于事機燕居從容申申夭夭和樂寬裕愛士親仁凡見公容貌聞公聲音莫不熙怡悅懌思樂模則來者忘歸去者願還雅性謙克不吝于利欲雖衆子群孫並在仕次曾無順媚一言之求身沒之日無獲大位在百里者莫得好縣北方公孫未有若茲者也初公為舍于舊里弟卒推與其孤至于即世柩殯無所清儉仁與之效于斯為著巍巍乎若德允世之表儀也已見本集司徒袁公夫人馬氏碑維光和七年司徒公夫人馬氏薨其十一月葬哀子懿達仁達銜恤哀痛靡所寫懷乃撰録母氏之德履示公之門人覩文感義采石于南山咨之群儒假貞石以書焉夫人右扶風平陵人也曾祖中水侯祖將作大匠考南郡太守中水侯弟伏波將軍女在淑媛作合孝明誕生孝章婚姻帝室世為名族夫人生應靈和德精性妙角犀豐盈實有偉表溫慈惠愛慎而寡言幼從師氏四禮之教早達窈窕德象之儀及笄求匹明哲供治婦業孝敬婉孌畢力中饋後生仰則以為謀憲自公歷據王官至宰相夫人營克家道扶翼政事聰明達乎中外隱括及乎無方不出其機化導宣畼童子無驕逸之尤婦妾無捨力之愆故能窮生人之光寵獲福祿之豐報朝春政于王室躬桑繭于蠶宮春秋六十有三寢疾不永懿等追想定省尋思髣佛哀窮念極不知所裁乃申辭曰於穆母氏其德孔休思齊先始百行聿修宣慈惠和恩澤並周義方之訓如川之流俾我小子蒙昧以彪不享遐年以永春秋往而不返潛淪大幽嗚呼哀哉几筵虛設幃帳空陳品物猶在不見其人魂氣飄颻焉所安神兄弟何依姊妹何親號咷切怛曾不我聞吁嗟上天何辜而然傷逝不續近者不旋見本集太尉劉寬碑文饒弘農華陰人也厥祖出自聖漢臣王侯相繼遭漢中微失其爵土世祖復阼仍有顯位光輔王室公之考作司徒于安勳績昭乎前朝公以嵩高之門好謙儉之操布衣糲食涉履寒苦周覽五經泛篤尚書微潛隱講誨世之榮利不滑其守州郡禮招王公並辟皆不詘志大將軍辟舉高第拜遷梁令喪舊君去官博士徵三府辟皆又不到司隸校尉察茂材太尉有道徵長史侍中延熹八年地震為異聖朝咨問公以對策嘉讜克厭帝心引拜尚書出謐靜雖龍左納言山甫喉舌無以尚焉遷東海相南陽太守公之性也果而能弘裕凱弟無競伊人及其涖官統政推是心也以御萬事故民見德義而興行讓而不爭政不肅而威宣教不舒而德治帝將入學而選定講公宜參誨拜大中大夫勸講于華光之內遷侍中屯騎校尉宗正光祿勳太尉股肱元首宣臣工允敕帝載粵熹寢疾遜位復拜光祿大夫衛尉太尉交會獨引其咎拜永樂少府光祿勳先是時妖民張角造為邪孽逆節有萌公聞罪誅未用首謀先覩封逯鄉侯食邑六百戶春秋六十有六以中平二年二月丁卯薨張良策歎悼贈以車騎將軍印綬位特進賵禭琀斂備禮有加復遣五曰昭烈侯詔策休命宜宣無窮庸器銘勒若古有訓門生郭異等公永慕紼無以慰懷洵涕述高乃兼刊石建碑式序鴻烈其詞曰祇慕祖武允迪不道厥丕如何耽此典謨用聖主納諸軌度統三事行雨布海隅緝熙群生賴祚降命不融民悠慕生榮亡哀厥聲載路門生潁川殷苞京兆河內李照等共所興工范丹碑先生諱丹字史雲陳留外黃人陶唐氏之後也其在周室有士會者為晉大夫以受范邑遂以為氏漢文景之際爰自南陽來家于成安生惠及延延熹二年官至司農廷尉君則其後也君受天正性志高行潔在乎幼弱固已藐然有烈節矣時人未之或知屈為縣吏亟從仕進非其好也退不可得乃託死遁去親戚莫知其謀遂隱竄山中涉五經覽書傳尤篤易尚書學立道通久而後歸遊集太學知人審友苟非其類無所容納介操所在不顧貴賤其在鄉黨也事長惟敬養稚惟愛言行舉動斯為楷式郡縣請召未嘗屈節其有備禮招延虛己迓之者亦為謀奏其忠直以處士舉孝廉除郎中萊蕪長未出京師喪母行服故事服闋後還郎中君遂不從州郡之政凡其事君過則弼之闕則補之通清夷之路塞邪枉之門舉善不拘階次黜惡不畏強禦其事繁博不可詳載雅性謙儉體勤能苦不樂假借與從事荷負徒行人不堪勞君不勝其逸辟太尉府俄而冠帶士咸以群薰見嫉時政用受禁錮君罹其罪閉門靜居九族中表莫見其面晚節禁寬困于屢空而性多檢括不治産業以為卜筮之術得因吉凶道治民情以受薄償且無咎纍乃鬻卦于梁宋之域好事者覺之應時輒去禁既蠲除太尉張公司徒崔公前後四辟皆不就仕不為祿故不牽于位謀不苟合故特立于時是則君之所以立節明行亦其所以後時失途也年七十有四中平二年四月卒太尉張公兗州劉君陳留太守淳于君外黃令劉君僉有休命使諸儒參案典禮作誄著諡曰貞節先生昭其功行録記所履著于耆舊刊石樹銘光示來世於顯貞節天授懿度誕茲明哲允迪德譽如淵之清如玉之素溷之不濁涅之不污用行思忠舍藏思固伯夷是師史鰌是慕榮貧安賤不吝窮忤其死善道遺名之故身沒譽存休聲載路見本集
