body:
  text: 蔡雍陳實碑先生諱實字仲弓潁川許人也含元精之和應期運之數兼資九德總修百行于鄉黨則恂恂焉彬彬焉善誘善導仁而愛人使夫少長咸安懷之其為道也用行舍藏進退可度不徼訐以干時不遷二以臨下四為郡功曹五辟豫州六辟三府再辟大將軍宰聞喜半歲太丘一年德務中庸教敦不肅政以禮成化行有謐會遭黨事禁錮二十年樂天知命淡然自逸交不諂上愛不瀆下見幾而作不俟終日及文書赦宥時年已七十遂隱丘山懸車告老四門備禮間心靜居大將軍何公司徒袁公前後招辟使人曉諭云欲特表便可踐入常伯超補三事佩紆金紫光國垂勳先生曰絶望已久飾巾待期而已皆遂不至弘農楊公東海陳公每在袞職群僚賀之皆舉手曰潁川陳君命世絶倫大位未躋慚于臧文竊位之負故時人高其德重乎公相之位也年八十有三中平三年八月丙子遭疾而終臨沒顧命留葬所卒時服素棺槨財周櫬喪事唯約用過乎儉群公百僚莫不咨嗟巖藪知名失聲揮涕大將軍弔詞錫以嘉諡曰徵士陳君稟嶽瀆之精苞靈曜之純天不憖遺老俾屏我王梁崩哲萎于時靡憲搢紳儒林論德謀迹諡曰文範先生傳曰郁郁乎文哉書曰洪範九疇彝倫攸敘文為德表範為士則存誨沒號不亦宜乎三公遣令史祭以中牢刺史敬弔太守南陽曹府君命官作誄曰赫矣陳君命世是生含光醇德為士作程資始既正守終又令奉禮終沒休矣清聲遣官屬掾吏前後赴會刊石作銘府丞與比縣會葬荀慈明韓元長等五百餘人緦麻設位哀以送之遠近會葬千人已上河南尹种府君臨郡追歎功德述録高行以為遠近鮮能及之重部大掾以時成斯銘斯可謂存榮沒哀死而不朽者也乃作銘曰峨峨崇嶽吐符降神於皇先生抱寶懷珍如何昊穹既喪斯文微言圮絶來者曷聞交交黃鳥爰集于棘命不可贖哀何可極見文選本集君諱實字仲弓潁川許人也其先出自有虞氏中葉當周之盛德有媯滿者武王配以大姬而封諸太昊之墟是為陳胡公春秋之末失其爵土遂以國氏焉世篤懿德令聞不顯君膺皇靈之清和受明哲之上姿憑先民之遐迹秉玄妙之淑行投足而襲其軌施舍而合其量夫其仁愛溫柔足以孕育群生廣大寬裕足以包覆無方剛毅強固足以威暴矯邪正身體化足以陶冶世心先生有四德者故言斯可象靜斯可效是以邦之子弟遐方後生莫不同情瞻仰由其模範從其趣尚戾很斯和爭訟化讓雖嚴威猛政迫以刑戮未若先生潛導之速也其立朝事上也恭順貞厲含章直方無顯諫以彰直不割高而引長常幹州郡腹心之任義則進之以達道否則退之以光操然後德立名宣蓋于當世辟司徒府納規建謀匡弼三事人用昭明台階允寧遷聞喜長清風畼于所漸儉節溢于監司郡政有錯爭之不從即解綬去復辟太尉府遷太丘長民之治情斂欲反于端懿者猶草木之偃于翔風百卉之挺于春陽也以所執不協所屬色斯舉矣不俟終日辟大將軍府道之行廢有分于命乃離密網以就禁錮潛伏不試十有八年大忌蠲除舉賢良方正大將軍司徒並辟君曰七十有懸車之禮況我過諸遂不應其命容止法度老而彌壯凡所履行事類博審不可勝數略舉首目具實録之記在乎其傳春秋八十有三中平三年八月丙子卒大將軍三公使御屬往弔祠會葬作誄諡曰文範先生刺史太守樹碑頌德許令以下至于國人立廟舊邑四時蒸嘗歡哀承祀具如祖禰先生存獲重稱亡歆血食修行于己得斯于人固上世之所罕有前哲之所不過也孤嗣紀銜恤在疚敢録言行終始所守乃有二三友生咨度禮則咸曰君化道神速行于有國法施于民祀典所宗鄉人之祠非此遺孤所得專也昔者先生甚樂茲土築室講誨精靈所寧紀順奉雅意遂定兆域宜有銘勒表墳墓俾後生之歌詠德音者知丘封之存斯也乃作銘曰於熙文考天授弘造淵玄其深巍峨其高剛而無虐柔而不撓誕鋪模憲示為作教君之誨矣民胥效矣道行斯進廢乃斯止鮮我顯泰既多幽否舍榮取辱涅而不淄德之休明賤不為恥超邈其猶莫與方軌見本集維中平五年春三月癸未豫州刺史典以褒功述德政之大經是以作諡封墓興于周禮衛鼎晉銘其昭有實故太丘長潁川許昌陳實字仲弓含聖哲之清和盡人才之上美光明配于日月廣大咨乎天地辟四府宰三城神化著于民物形表圖于丹青巍巍焉其不可尚也洋洋乎其不可測也儉約違時懸車致仕徵辟交至遂不屑就春秋八十有三寢疾而終大將軍賜諡群后建碑國人立廟先生有二子季方元方皆命世希有繼期特立季方盛年早亡亦圖容加諡元方在喪毀瘁消形嘔血純孝過哀率禮不越于時嘉異畫像郡國欽盛德之休明懿鍾鼎之碩義乃樹碑鐫石垂世寵光詞曰於皇先生冠耀八荒闡德之宇探道之綱繼期立表以訓四方惟亮天工群生之望高明允實有馥其芳載德奕世休有烈光欽慕在人舊有憲章過牧斯州庶奉清塵棄豫而邁靡瞻靡聞嗟我懷矣曷所咨詢告哀金石式昭其勤見本集太尉楊賜碑皇帝遣中謁者陳遂侍御史馬助持節送柩陳遵桓典蘭臺令史十人將羽林騎鉦車介士前後鼓吹以驃騎將軍官屬及司空法駕與公卿尚書三臺以下葬我文烈侯三年九月甲申小祥會如初四年九月戊申大祥公卿尚書三臺以下會如小祥之禮公之祖納忠于前朝以罹艱禍父隱約蟄瘁治家師導惟儉之尚公生值歉褊資賄屢空手執勤役遠涉道里以修經術險阻艱難曷所不嘗特以其靜則真一審固動則不違則度含容覆載無競伊人謀無不忠言無不信自在弱冠布衣之中固已流芳名著茂實公孫同倫莫能齊焉者矣州郡禮招莫之能屈委百里位避公車令自侍御史侍中已往道為帝師德為世表體尊名重階級彌崇而公處以恭遜行以固慎德大而心小居高而志降夫驕吝之釁周公其猶病諸而公脫然以為行首不亦泰乎及其所以匡輔本朝忠言嘉謀造膝危辭當事而行言從計納亦不敢宣密誡潛功貽于帝躬家無遺草論者不見嗟乎誠為達事君之體得人臣之上儀者已公素不貴歸非不樂引美故雖仿佛猶不敢載以順公之雅初受封自以功不副賞前後固辭章凡十上憂慍悄悄形于容色雖不克從情旨昭顯晚節為廷尉公曰昔在三后成功惟殷于民而皋陶不與焉蓋吝之也及為特進又曰唯漢重臣中興以來克稱斯位者其為高密元侯乎吾何德以堪諸寢疾顧命無辭要言約戒忠儉而已孤彪銜恤永思綴輯所履以贊銘之銘曰赫赫烈侯卓爾超倫於唯楊公乃華降神故能明哲德亞聖人受茲介福位極人臣包羅五典本道根真為國之師誨尚經文頻歷鄉校五登鼎鉉建名著忠崔越前賢攘災興化蟊賊不臻風雨有時屢獲有年三葉宰相應祚于天臨晉是侯子子孫孫億兆不窮如山之堅四時潔祠以承奉尊祀事孔明奉亡如存馥馥芬芬以慰顯魂公諱賜字伯猷弘農華陰人姬姓之國有楊侯者公其後也其在漢室赤泉侯佐高丞相翼宣咸以盛德光于前朝祖司徒考太尉繼迹宰司咸有勳烈公承家崇軌受天醇素欽承奉媾間于伐柯烈風雖變不易其趣文以典籍尋道入奧操清行朗潛晦幽間不答州郡之命辟大將軍府不得已而應之遷陳倉令公乃因是行退居廬公車特徵以病辭司徒舉高第拜侍中越騎校尉帝篤先業將問故訓公以群公之舉進授尚書于禁中遷少府光祿勳敬揆百事莫不時序庶尹知恤閶闔推清列作司空地平天成陰陽不忒公遂身避託疾告退又以光祿大夫受命司徒敬敷五品宣洽人倫燮和化理股肱耳目之任靡不克明及至太尉四時順動三光耀潤群生豐遂太和交薄三作六卿五蹈三階受爵開國應位特進非盛德休功假于天人孰能該備寵榮兼包令錫如公之至者乎公體資明哲長于知見凡所辟選升諸帝朝者莫非瑰才逸秀并參儲佐惟我下流二三小臣穢損清風愧于前人乃糾合同僚各述所審紀公勳績刊石立銘以慰永懷天降純嘏篤生柔嘉俾胤祖考光輔國家三業在服帝載用和粵暨我公允執丕貞在棟伊隆于鼎斯寧德被宇宙華夏以清受茲介福履祚孔成為邑河渭袞冕紱珽以佐天子祗事三靈丕顯伊德萬邦作程爰銘爰贊式昭懿聲見本集公諱賜字伯猷兼通五典周覽篇籍以為尚書帝王之政要有國之大本也是以三葉相承研其精義五代之微言王政之約綱罔不尋其端源究其條貫凜乎其見聖人之情旨也蓋以蹈騰餘蹤思高遊夏以初潛山澤授誨童冠後生賴以發祛蒙蔽文其材素者蓋不可勝數乃由宰府遂作帝臣于時聖幼將入學群公以公溫故知新德宜師保乃以越騎校尉援侍華光之內帝座己北面以納大誨其教人善誘則恂恂焉罔不伸也引情致喻則誾誾焉罔不釋也迄用有成緝熙光明惟帝念功六在九卿三事勛假皇天澤充區域疆土建封申增戶邑人臣之極位兼而有之然處豐益約九命滋恭可謂高朗令終有始有卒者已于是門生大將軍何進等瞻仰洙泗公喪之禮糾合朋徒稽諸典則僉以為匡弼之功政事之實詔策之文則史臣志其詳若夫道術之美授之方策則是門人二三小子所特貫綜敢竭不才撰録所審言于碑乃申頌曰巍巍聖猷匪師不昭士子困蒙匪師不教於皇文父邈哉伊超如玉之固如嶽之喬鑽之斯堅仰之彌高示我顯德授我無隱正席傳道承帝之問誨茲一人萬邦作順微微我徒實賴遺訓文武作式元勛既奮光啓爵土垂統末胤存榮亡哀沒而不泯見本集曰漢有國師司空文烈侯楊公惟司徒之孫太尉公之胤子皇祖考以懿德胥及聿勤式建丕休勳啓洪範公祗服弘業克丕堂構小乃不敢不慎大亦不敢不戒用罔有擇言失行在于其躬洎在辟舉先志載言罔不攸該乃自宰臣以從王事立功不有用辭其祿逮作御史允執國憲納于侍中在帝左右爰董武事王師孔間群公以舊德碩儒道通術明宜建師保延入華光侍宴露寢敷典誥之精旨達聖王之聰睿帝以機密齋栗常伯劇任鮮克知臧以釐其采命公再作少府俾率其屬以熙庶績天地作險國家丕承軍門祛禁式遏寇虐命公再作光祿亦總其熊羆之士不二心之臣保乂帝家巖巖大理惟制民命命公作廷尉惟刑之恤旁施四方惟明折獄蔽罪于憲之中亦惟三禮六樂國之元幹命公作太常明德惟馨八音克諧神人以和永世豐年溥天率土而衆莫外命公作司空公惟戢之翊明其政時惟休哉唯天陰騭下民彝倫所由順序命公作司徒而敬敷五教以親百姓父義母慈兄友弟恭子孝時惟休哉昭孝于辟雍命公作三老帝恭以祗敬遵有虞于上庠茫茫大運垂光烈耀命公作太尉璇璣運周七精循軌時惟休哉帝欲宣力于四方公則翼之辟道或回公則弼之虔恭夙夜不敢荒寧用對揚天子丕顯休命天子大簡其勳用授爵賜封侯于臨晉功成化洽景命有傾帝乃震慟執書以泣命于左中郎將郭儀作策賜公驃騎將軍臨晉侯印綬兼號特進諡以文烈寵命畢備而後即世肆其孤彪敢儀古式昭銘景烈銘曰天鑒有漢誕生元輔世作三事勛在王府乃及伊公克光前矩悉心畢力胤其祖武化洽群生澤霑區宇帝曰文烈朕嘉君功為邑河渭建茲土封申備九錫以祚其庸位此特進于異群公昔在申呂匡佐周宣嵩山作頌大雅揚言今我文烈帝載用熙參光日月比功四時身沒名存永世慕思見本集藝文類聚四十六文選褚淵碑文注初學記十一太尉袁湯碑邈矣高蹤孰能剋茲見文選傳長虞贈何劭王濟詩注司空袁逢碑凡所臨君明而先覺故能教不肅而化成政不嚴而事治其惠和也晏晏然其博大也洋洋焉信可謂兼三才而該剛柔無射于人斯矣銘曰天鑒有漢賜茲世輔顯允厥德昭胤休序峨峨雍宮禮樂備舉穆穆天子孝敬允敘降拜屏著奉饋西序威儀聿修化溢區宇乃尹京邑總齊禁旅見藝文類聚四十七司空房楨碑公言非法度不出于口行非至公不萌于心治身則伯夷之潔也儉嗇則季文之約也盡忠則史魚之直也剛平則山甫之勵也總茲四德式是百辟夙夜匪懈以事一人枉絲髮樹私恩不為也討無禮當強暴弗避也是以功隆名顯在世孤特不獲愷弟寬厚之譽享年垂老至于積世門無立車堂無宴客衣不變裁食不兼味雖易之貞厲詩之羔羊無以加也明明在公實惟房后誕應正德式作漢輔邪慝是仇直亮是與剛則不吐柔則不茹媚茲天子以靖土宇見藝文類聚十七
