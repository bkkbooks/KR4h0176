body:
  text: 蔡邕翟先生碑世以仁義為質學問為業爰暨先生固天縱德應運立言繼期五百實行形于州里明哲與聖合契該通五經兼洞墳籍為萬里之場圃九隩之林澤挹之若江湖仰之若華光玄玄焉測之則無源汪汪焉酌之則不竭可謂生民之英者已國失元博學失表式凡百搢紳哀矣泣血人百其身匪云來復于是鄉黨乃相與登山伐石而勒名曰邈矣先生厥德孔真腹心弘道深高入神王錫三命觀國之賓其樹富貴忽若浮雲既不降志亦不辱身見蓺文類聚三十七荊州剌史度尚碑君資天地之正氣含太極之純精明潔鮮于白珪貞操厲乎寒松視鑒出于自然英風發乎天骨事親以孝則行侔于曾閔結交以信則契明于黃石溫溫然弘裕虛引落落然高風起世信荊山之良寶靈川之明珠也爰在弱冠英風固以揚于四海矣拜為荊州刺史仗沖靜以臨民施仁義以接物恩惠著于萬里誠信畼于殊俗由是撫亂以治綏擾以靜也帝嘉其功錫以車服方將掃除寇逆清一宇宙廓天步之艱難寍陵夷之屯否見蓺文類聚卷五十文選袁宏三國名臣贊注桓彬碑彬有過人者四夙智早成岐嶷也學優文麗至通也仕不苟祿絕高也辭隆從窳絜操也見後漢書桓榮附傳袁滿來碑茂德休行曰袁滿來太尉公之孫司徒公之子逸才淑姿實天所受聰遠通敏越齠齔在闕明習易學從誨如流百家眾氏遇目能識事不再舉問一及三具始知終情性周備夙有奇節孝智所生順而不驕篤友兄弟和而無忿氣決泉達無所凝滯雖冠帶之中士校材考行無以加焉允公族之殊異國家之輔佐眾律其器士嘉其良雖則童稚令聞芬芳降生不永年有十五四月壬寅遭疾而卒既苗而不穗凋殞華英嗚呼悲夫乃假碑旌于墓嗟其傷矣惟以告哀見本集袁喬碑于茲德聲發聞遐邇見文選張華勵志詩注袁成碑呱呱孤嗣含哀長慟見文選曹植王仲宣誄注楊復碑文學之徒擁書抱籍自遠而至稟釆豐華斟酌洪流者雍雍焉誾誾焉見書鈔九十六景命不延遘此顛沛見文選袁宏三國名臣賢注趙歷碑加以思謀深長達于從政見文選潘岳馬汧督誄注何休碑孝友盡于閨庭見文選王仲寶褚淵碑文注辭述川流文章雲浮同上貞定直父碑其接友也審辨真偽明于知人度始終而後交情不疎邈親見初學記十八御覽四百九郡掾吏張祠堂碑掾諱玄字伯雅河南偃師人也其先張仲者實以孝友為名左右周室大漢初興張蒼為丞相封北平侯其後自河內遷于茲土世為顯姓掾天姿恭恪宣慈惠和允恭博敏惻隱仁恕正身履道以協閨庭損用節財以瞻疏族動中規矩言合典式不知名彰不飾行著可謂仁粹淑貞自然之素者已論者嘉之州郡禮招署致掾史沈靜寡欲不求榮祿是以豐于天爵薄于人位某月日遭疾而卒掾孫翻以貞固之質受過庭之訓獲執戟出宰相邑遷太守得大夫之祿奉烝嘗之祠尋原祚之所由而至于此先考積善之餘慶陰德之陽報乃于是立祠堂假碑勒銘式明令德以示乎後詞曰於惟我考允迪懿德治信斯順其儀不忒仁惠周洽行惟模則篤垂餘慶貽此燕翼邈矣遺孫用懷多福刊名金石流于罔極見本集太傅安樂侯胡公夫人靈表夫人編縣舊族章氏之長子也字曰顯章令儀小心秉操塞淵仁孝婉順率禮無遺體季蘭之姿蹈思齊之迹永初三年年十有五爰初來嫁誕成家道仰奉慈姑竭歡致敬俯誨膝下化導周悉至德脩于幾微徽音畼于神明故能參妊姒之功兼生人之榮朝春路寢贊桑蠶宮光寵有祭服有充前後奉斯禮者三十餘載夫人生五男長曰整伯齊次曰億叔韡次曰寍穉威次曰碩季叡伯仲各未加冠遭厲氣同時夭折叔讓郡孝廉及季更歷州寍舉茂才葉令京令為議郎季以高第為侍御史諫議大夫侍中虎賁中郎將陳留太守皆早即世夫人哀悼劬顇由是被疾遭太夫人憂篤年七十七建寧三年薨夫人之存也契闊中饋婉戀供養依生奉仁紹述雅意其閏月附于太夫人窀穸于茲地魂而有靈欽明定省神心欣焉其實寧之元女金盈追慕永思憯怛罔極遂及斯表鐫著堅珉頌曰悲母氏之不永兮懷殷恤以摧傷惟子道之無窮惜聞誨之未央庶黃耇以期頤胡委我以夙喪憂心怛以激切亦割肝以絕腸昔先聖之遺辭言仁者其壽長嗟母氏之憂患體愷悌以慈良失延年之報祜獨何棄乎穹蒼日月忽以將暮抱長結以含愁尋脩念于在昔原疾病之所由遭元子之弱夭心傷顇以自憂暨叔季之隕終哀情結以彌綢皇姑沒而中感遂大漸兮連流疾燄燄而日遘氣微微以長消精魂飄以遐翔曾不可乎援招爾乃順旨于冥冥繼存意于不違爰祔靈于皇姑尚魂魄之有依潛幽室之黯漠惜昭明之景輝一往超以未及傾阻邈其彌遲顧新廟以累欷伏几筵而增悲嗟既逝之益遠眇悠悠而不追見本集交趾都尉胡府君夫人黃氏神誥夫人江陵黃氏之季女字曰烈嬴其先出自伯翳別封于黃以國氏焉高祖父汝南太守曾祖父延城大尹祖父番禺令父以主簿嘗證太守事奉明君以立臣節漢南之事以為美談初都尉君娶于故豫州刺史即黃君之姊生太傅安樂侯廣及卷令康而卒繼室以夫人二孤童紀未齔育于夫人夫人懷聖善之姿韜慈母之仁撫育二孤導以義方思齊先姑神罔時恫致能迄用有成誕膺繁祉廣歷五卿七公再封之祿康亦由孝廉宰牧二城九鼎之義夫人是享爰暨稚孫更仕三官或典百里或作虎臣銀艾貂蟬近侍顯尊受茲介福于我夫人自都尉任于京師及廣兄弟式敘漢朝夫人居京師六十有餘載其乘輅執贄朝皇后採柔桑于蠶宮手三盆于繭館者蓋三十年上有帝室龍光之休下有堂宇斤斤之祚心耽其榮體安其玄遠圖長慮用遺舊居欲留此焉康寧之時丞以為言夫人年九十一建寧二年薨于太傅府是月辛酉公之季子陳留太守碩卒于洛陽左池里舍公銜哀悼祗慎其屬遵奉遺意不敢失墜乃俾元孫顯咨度群儒以考其衷僉曰昔帝舜沒于蒼梧殯于虞郊二妃薨于江湘不即兆于九疑延陵季子實惟吳人長子道終卜葬嬴博夫遭時而制不遠遷徙魂氣所之不繫丘壟帝舜以之神罔時怨季札以之仲尼嘉焉鑒帝籍之高論綜精靈之幽情稽先人之遐迹順母氏之所寧茲事體通而義同允不可替于是公乃為辭昭告先考然後卜定宅兆龜筮襲從遂營窀穸之事舉封樹之禮十月既望粵翼日己酉葬我夫人黃氏及陳留太守碩于此高原雒陽東界關亭之阿天子使中常侍謁者李納弔且送葬賻錢二十萬布二百匹再以中牢祠群后畢會榮哀孔備于時濟陽故吏舊民中常侍勾陽于肅等二十三人思應慕化推本議銘著斯碑石俾諸昆裔瞻仰以知禮之用是為神誥及申頌曰於穆夫人家邦之媛昔在嬴氏黃國氏建致于近祖亦降于漢天祚明德福祚流衍既作母儀履信思順登壽耄耋用永蕃孌子孫以仁追稽先典度茲洛濱齊迹湘靈配名古人休矣耀光千億斯年見本集議郎胡公夫人哀讚議郎夫人趙氏字曰永姜允有令德秉心塞淵舒詳閑雅儀節孔備女師四典窈窕德象罔不習熟以供婦道議郎早世檢誨幼孤義方以導其性中禁以閑其情孤顥儉節用免咎悔少辟侍中襲先公之爵以議郎出為濟陰太守是時夫人寢疾未薨而國家方有滎陽寇賊震驚帝師𥳑選州辟授任進衛不得辭王命親醫藥夫人乃自矜精稟氣力俛起若愈以勸遣顥到官月餘所疾暴盛春秋五十八中平四年薨于京師顥有剖符之寄偪于國典疾篤不得顧親增感氣絕不能自存慎終之事闕焉永廢雖不毀以隨沒亦困悴而傷懷知我如此不如無生號跳告哀以乞骸骨踰年然後獲聽追惟考君存時之命迎棺舊土同穴此城孤心摧割靡所底念仰瞻二親或有神誥靈表之文敢曰亮闇敘我憂痛作哀讚書之于碑愍于小子夙罹孔艱嚴考殞歿我在齠年母氏鞠育載矜載憐殷斯勤斯慈愛備存匪惟驕之範我軌度教誨嚴肅昭示好惡俾我克類畏威忌怒用免咎悔踐繼先祖即爵其土二將是臨與帝剖符守于濟陰夫人寢疾榮此寵休疾用歡痊翊日斯瘳將征將邁從養陶丘景命徂逝不愍少留疾大漸以危亟兮精微微而浸衰逼王職于憲典兮子孫忽以替違目不臨此氣絕兮手不親夫含飯陳衣衾而不省兮合綆棺而不見昔予考之即世兮安宅兆于舊邦依存意以奉亡兮遷靈柩而同來考妣痛以慘兮離乖神柩集而移兮增哀黃壚密而無閒兮出入闃其無門舁柩在茲兮不知魂景之所存悼孤衷之不遂兮思情憭以傷肝幽情淪于后坤兮精哀達乎昊乾見本集濟北相崔君夫人誄維延熹四年故濟北相夫人卒嗚呼哀哉世喪母儀宗殞憲師哀哀孝子靡所瞻依凡百赴弔至止增悲投涕歔欷共敘赫姿乃作誄曰清和有鑠時維哲母令儀令色爰以資始塞淵其心淑慎其止于母斯勤在子斯敏仰覽篇籍俯釐絲枲多才多蓺于何不有休譽邈焉允女之英乃及崔君惟德是行其德伊何實明實粹虔恭事機契闊中饋敦此婉順疾彼攸遂思齊徽音晨興夜寢穆穆其猷莫之與二天祚明德底之方穀於赫崔君膺茲祉祿夫人有胤翼此清淑仁風溫潤義惠優渥敷恩中外施浹疏族食不兼膳服不纖縠以儉為榮以奢為辱堂堂其胤惟世之良于其令母受茲義方訓以柔和董以嚴剛怒不傷愛喜不亂莊納之軌度終然允臧是用登隮享其寵光雖則崇盛猶匪寧息同其婦子茂師其職服貴無荒尊不舍力密勿不忘惟德之極昔在共姜陪臣之母勞兼紡績仲尼是紀矧茲夫人帝室命婦猶日孜孜復禮克己人亦有言仁者壽長宜登永年黃耇無疆昊天不弔降此殘殃寢疾彌留粹爽悴傷慘怛孝子惴惴其惶靡神不舉無藥不將嗚呼哀哉于是孝子長號氣絕復蘇號呼告哀不知其辜昊天上帝忍弔遺孤尋想遊靈焉識所徂嗚呼哀哉既殯神柩薄言于歸冢辛喪儀循禮無遺切切喪主瘠羸衰哀情兮長慕涕兮無晞行旅揮涕千里于咨乃謀卜筮言考其良逝彼兆域于時翳藏冥冥窀穸無時有陽燈燭既滅馬道納光形影不見定省何望嗟其哀矣不可彌忘日月代序古皆有喪由斯夫人榮烈有章配彼哲彥既隆且昌顧影赫奕饋供孔將惟以慰懷庶無永傷嗚呼哀哉見本集告遷都祝嘏辭嗣曾孫皇帝某敢昭告于皇祖高皇帝各以后配昔受命京師都于長安國享十有一世歷年二百一十載遭王莽之亂宗廟隳壞世祖復帝祚遷都洛陽以服中土享一十一世歷年一百六十五載予末小子遭家不造早統洪業奉嗣無疆關東民吏敢行稱亂總連州縣擁兵聚眾以圖叛逆震驚王師命將征服股肱大臣推皇天之命以已行之事遷都舊京昔周德缺而斯干作應運變通自古有之于是乃以三月丁亥來自雒越三日丁巳至于長安敕躬不慎寢疾旬日賴祖宗之靈以獲有瘳吉旦齋宿敢用潔牲一元大武柔毛剛鬣商祭明眎香合嘉蔬香萁鹹鹺豐本明粢醴酒用告遷來尚饗見本集九祝辭高皇帝使工祝承致多福無疆于爾嗣曾孫皇帝使爾受祿于天宜此舊都萬國和同兆民康乂眉壽萬年子子孫孫永守民庶勿替引之見本集祝祖文元正令子時惟嘉良乾坤交泰太簇運陽乃祀祖靈以祈福祥見書鈔一百五十五蓺文類聚五白帖祖餞祝令歲淑月日吉時良爽應孔嘉君當遷行神龜吉兆林氣煌煌著卦利貞天見三光鸞鳴雍雍四牡彭彭君既升輿道路開張風伯雨師洒道中央陽遂求福蚩尤辟兵倉龍夾轂白虎扶行朱雀道引玄武作侶勾陳居中厭伏四方往臨邦國長樂無疆見御覽七百三十六祓禊文洋洋暮春厥日除已尊卑煙鶩惟女與士自求多福在洛之涘見書鈔一百五十四又一百五十五文選閒居賦注又石闕銘注初學記三弔屈原文迴口世而遙弔託白水而騰文見書鈔一百二鵊軒翥鸞鳳挫翮啄碎琬琰實其瓴甋皇車奔而失轄執轡忽而不顧卒壞覆而不振顧抱后其何補見蓺文類聚四十題曹娥碑後黃絹幼婦外孫齏臼見後漢列女曹娥傳
