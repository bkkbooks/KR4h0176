body:
  text: 蔡邕篆勢字畫之始因于鳥跡蒼頡循聖作則制文體有六篆要妙入神或象龜文或比龍鱗紓體放尾長翅短身穨若黍稷之垂穎蘊若虫蛇之棼縕揚波振激鷹跱鳥震延頸脅翼勢似淩雲或輕舉內投微本濃末若絕若連似露緣絲凝垂下端從者如懸衡者如編杳杪者邪趣不方不圓若行若飛岐岐翾翾遠而望之若鴻鵠群遊絡繹遷延迫而視之湍際不可得見指撝不可勝原研桑不能數其詰屈離婁不能覩其隙閒般倕揖讓而辭巧籀誦拱手而韜翰處篇籍之首目粲粲彬彬其可觀摛華豔于紈素為學蓺之範閑嘉文德之弘蘊懿作者之莫刊思字體之俯仰舉大略而論旃見本集晉書衛恆傳蓺文類聚七十四初學記二十一御覽七百四十九隸勢鳥跡之變乃惟佐隸蠲彼繁文崇此𥳑易厥用既弘體象有度奐若星陳鬱若雲布其大徑尋細不容髮隨事從宜靡有常制或穹窿恢廓或節比鍼列或砥平繩直或蜿蜒繆戾或長邪角趣或規旋矩折修短相副異體同勢奮筆輕舉離而不絕纖波濃點錯落其閒若鍾簴設張庭燎飛烟嶄嵓崔嵯高下屬連似崇臺重宇增雲冠山遠而望之若飛龍在天近而察之心亂目眩奇姿譎誕不可勝原研桑所不能計宰賜所不能言何草篆之足算而斯文之未宣豈體大之難覩將祕奧之不傳聊佇思而詳觀舉大略而論旃見本集勸學篇人無貴賤道在者尊見文選潘岳閒居賦注木以繩直金以淬剛必須砥礪就其鋒鋩見御覽七百六十七明珠不瑩不發其光其光寶玉不琢不成圭璋見御覽八百三鼫鼠五能不成一技五技者能飛不能上屋能緣不能窮木能泅不能渡豄能走不能絕人能藏不能覆身是也見爾雅釋獸釋文引蔡伯喈勸學篇螾無爪牙輭弱不便穿穴洞地食塵飲泉見蓺文類聚六蟹有八足加以二螯見世說新語紕漏篇注引蔡邕勸學章周之師氏居虎門左見北史劉芳傳儲副君也見一切經音義二大般涅槃經六引蔡邕勸學又九佛本行集經十二引同傭賣力也見一切經音義六妙法蓮華經二引蔡邕勸學注瞻彼頑薄執性不固心游目蕩意與手互見御覽百九十上谷次仲初變古形見張懷瓘書斷上法書要錄七墨池編一又七齊相杜度姜守名篇見書斷中法書要錄八墨池編七扶風曹喜建初稱善見書斷中法書要錄八墨池編一又七聖皇篇程邈刪古立隸文見書斷上法書要錄七墨池編七月令問答問者曰子何為著月令說也曰予幼讀記以為月令體大經問不宜與記書雜錄竝行而記家記之又略及前儒特為章句者皆用意傳非其本旨又不知月令徵驗布在諸經周官左傳皆實與禮記通他議橫生紛紛久矣光和元年予被謗章罹重罪徙朔方內有獫狁敵衝之釁外有寇虜鋒鏑之艱危險凜凜死亡無日過被學者聞家就而考之亦自有所覺寤庶幾頗得事情而訖未有記著于文字也懼顛蹶隕墜無以示後同于朽腐竊誠思之書有陰陽升降天文厤數事物制度可假以為本敦辭託說審求厤象其要者莫大于月令故遂于憂怖之中晝夜密勿昧死成之旁貫五經參互群書至及國家律令制度遂定厤數盡天地三光之情辭繁多而曼衍非所謂理約而達也道長日短危殆兢惕取其心盡而已故不復加刪省蓋所以探賾辨物庶幾多識前言往行之流也苟使學者以為可覽則余死而不朽也問者曰子說月令多類以周官左氏假無周官左氏傳月令為無說乎曰夫根柢植則枝葉必相從也月令與周官竝為時王政令之記異文而同體官名百職皆周官解月令甲子沈子所謂似春秋也若夫太昊蓐收句芒祝融之屬左傳造義彊說生名者同是以用之問者曰既用古文于厤數不用三統用四分何也曰月令所用參諸厤象非一家之事傳之于世不曉學者宜以當時所施行夫密近者三統已疏闊廢弛故不用也問者曰既不用三統以驚蟄為孟春中雨水為二月節皆三統說也獨用之何曰孟春月令曰蟄蟲始震在正月也中春始雨水則雨水二月也以其合故用之問者曰厤云小暑季夏節也而今文見于五月何也曰今不以厤節言據時始暑而記也厤于大雪小雪大寒小寒皆去十五日然則小暑當去大暑十五日不得及四十五日不以節言據時暑也問者曰中春令不用犧牲以珪璧更皮幣不用犧牲何也曰是月獻羔以太牢祀高禖宗廟之祭以中月安得用犧牲祈者求之祭也著令者豫設水旱疫癘當禱祈用犧牲者是用之助生養傳祈以弊代牲章亦因于高禖之事乃造說曰更者刻木代牲如廟有桃更此說自欺極矣經典傳記無刻木代牲之說蓋書有轉誤三豕渡河之類也問者曰仲冬令曰閹尹申宮令謹門閭今曰門闈何也曰閹尹者內官也主宮室出入宮中之門曰闈閹尹之職也閭里門非閹尹所主知當作闈也問者曰令曰七騶咸駕今曰六騶何也曰本官職者莫正于周官周官天子馬六種六種別有騶故知六騶左氏傳晉程鄭為乘馬御六騶屬焉無言七者知當為六也問者曰令以中秋築城郭于經傳為非其時詩曰定之方中作于楚宮定營室也九月十月之交西南方中故傳曰小昏正而栽築即營室也昏正者昏中也栽築者栽木而始築也今文在前一月不合于經傳也問者曰子說三難皆以日行為本古論周官禮記說以為但逐惡而已獨安所取之曰取之于月令而已四時通等而夏無難文由日行也春行少陰秋行少陽冬行太陰陰陽皆使不干其類故冬春難以助陽秋難以達陰至夏節太陽行太陰自得其類無所扶助獨不難取之于是也問者曰反令每行一時轉三旬以應行三月政也春行夏令則雨水不時謂孟夏也草木早枯中夏也國乃有恐季夏也今總合為一事不分別施之于三月何也曰說者見其三旬不得傳注而為之說有所滯礙不得通矣孟秋反令行冬令則草木枯後乃大水敗其城郭即分為三事後乃大水在誰後也城郭為獨自壞非水所為也季冬令曰行春令則胎夭多傷民多蠱疾命之曰逆即分為三事行季冬令為不感災異但命之曰逆也知不得斬絕分應一月也其類皆如此令之所述略舉其尤者也問者曰春食麥羊夏食菽雞秋食麻犬冬食黍豕之屬但以為時味之宜不合之于五行月令服食器械之制皆順五行者也說所食獨不以五行不已略乎曰蓋亦思之矣凡十二辰之禽五時所食者必家人所畜丑牛未羊戌犬酉雞亥豕而已其餘龍虎以下非食也春木王木勝土土王四季四季之禽牛屬季夏犬屬季秋故曰未羊可以為春食也夏火王火勝金酉雞可以為夏食也季夏土王土勝水當食豕而食牛土五行之尊者牛五畜之大者四時之牲無足以配土德者故以牛為季夏食也秋金王金勝木寅虎非可食者犬豕而無角虎屬也故以犬為秋食也冬水王水勝火當食馬而禮不以馬為牲故以其類而食豕也然則麥為木菽為金麻為火黍為水各配其牲為食也雖有此說而米鹽精粹不合于易卦所為之禽及洪範傳五事之畜近似卜筮之術故予略之不以為章句聊以應閒見有說而已問記曰養三老五更子獨曰五叟周禮曰八十一御妻今曰御妾何也曰字誤也叟長老之稱也其字與更相似書者轉誤遂以為更嫂字女旁瘦字中從叟今皆以為更矣立字法者不以形聲何得以為字以嫂瘦推之知是更為叟也妻者齊也惟一適人稱妻其餘皆妾位最下也是以不得言妻云也見本集說郛明堂論明堂者天子太廟所以宗祀其祖以配上帝者也夏后氏曰世室殷人曰重屋周人曰明堂東曰青陽南曰明堂西曰總章北曰玄堂中央曰太室易曰離也者明也南方之卦也聖人南面而聽天下鄉明而治人君之位莫正于此焉故雖有五名而主以明堂也其正中皆曰太廟謹承天順時之令昭令德宗祀之禮明前功百辟之勞起尊老敬長之義顯教幼誨稺之學朝諸侯選造士于其中以明制度生者乘其能而至死者論其功而祭故為大教之宮而四學焉官司備焉譬如北辰居其所而眾星拱之萬象翼之政教之所由生變化之所由來明一統也故言明堂事之大義之深也取其宗祀之貌則曰清廟取其正室之貌則曰太廟取其尊崇則曰太室取其鄉明則曰明堂取其四門之學則曰太學取其四面之周水圓如璧則曰辟雍異名而同事其實一也春秋因魯取宋之奸賂則顯之太廟以明聖王建清廟明堂之義經曰取郜大鼎于宋戊申納于太廟傳曰非禮也君人者將昭德塞違故昭令德以示子孫是以清廟茅屋昭其儉也夫德儉而有度升降有數文物以紀之聲明以發之以臨照百官百官于是乎戒懼而不敢易紀律所以明大教也以周清廟論之魯太廟皆明堂也魯禘祀周公于太廟明堂猶周宗祀文王于清廟明堂也禮記檀弓曰王齋禘于清廟明堂也孝經曰宗祀文王于明堂禮記明堂位曰太廟天子曰明堂又曰成王幼弱周公踐天子位以治天下朝諸侯于明堂制禮作樂頒度量而天下大服成王以周公有大勳勞于天下命魯公世世禘祀周公于太廟以天子之禮升歌清廟下管象舞所以異魯于天下也取周清廟之歌歌于魯太廟明魯之太廟猶周之清廟也皆所以昭文王周公之德以示子孫也易傳太初篇曰天子旦入東學晝入南學暮入西學太學在中央天子之所自學也禮記保傅篇曰帝入東學尚親而貴仁入西學尚賢而貴德入南學尚齒而貴信入北學尚貴而尊爵入太學承師而問道與易傳同魏文侯孝經傳曰太學者中學明堂之位也禮記古文明堂之禮曰膳夫于是相禮日中出南闈見九侯反問于相日側出西闈視五國之事日入出北闈視帝節猷爾雅曰宮中之門謂之闈王居明堂之禮又別陰陽向東南稱門西北稱闈故周官有門闈之學師氏教以三德守王門保氏教以六蓺守王闈然則師氏居東門南門保氏居西門北門也知掌教國子與易傳保傅王居明堂之禮參相發明為學四焉文王世子篇曰凡大合樂則遂養老天子至乃命有司行事興秩節祭先聖先師焉始之養也適東序釋奠于先老遂設三老五更之位焉言教學始之于養老由東方歲始也又春夏學干戈秋冬學羽籥皆習于東序凡祭與養老乞言合語之禮皆小樂正詔之于東序又曰大司成論說在東序然則詔學皆在東序東序東之堂也學者聚焉故稱詔太學仲夏之月令祀百辟卿士之有德于民者禮記太學志曰禮士大夫學于聖人善人祭于明堂無其位者祭于太學禮記昭穆篇曰祀先賢于西學所以教諸侯之德也即所以顯行國禮之處也太學明堂之東序也皆在明堂辟雍之內月令記曰明堂者所以明天氣統萬物明堂上通于天象日辰故下十二宮象日辰也水環四周言王者動作法天地德廣及四海方此水也禮記盛德篇曰明堂九室以茅蓋屋上圓下方此水名曰辟雍王制曰天子出征執有罪反釋奠于學以訊馘告樂記曰武王伐殷薦俘馘于京太室詩魯頌云矯矯虎臣在泮獻馘京鎬京也太室辟雍之中明堂太室與諸侯泮宮俱獻馘焉即王制所謂以訊馘告者也禮記曰祀乎明堂所以教諸侯之孝也孝經曰孝悌之至通于神明光于四海詩云自西自東自南自北無思不服言行孝者則曰明堂行悌者則曰太學故孝經合以為一義而稱鎬京之詩以明之凡此皆明堂太室辟雍太學事通文合之義也其制度之數各有所依堂方百四十四尺坤之策也屋圜屋徑二百一十六尺乾之策也太廟明堂方三十六丈通天屋徑九丈陰陽九六之變也圜蓋方載六九之道也八闥以象八卦九室以象九州十二宮以應十二辰三十六戶七十二牖以四戶八牖乘九室之數也戶皆外設而不閉示天下不藏也通天屋高八十一尺黃鍾九九之實也二十八柱列于四方亦七宿之象也堂高三丈以應三統四鄉五色者象其行外廣二十四丈應一歲二十四氣四周以水象四海王者之大禮也見本集續漢祭祀志中注補引蔡邕明堂論說郛月令篇名因天時制人事天子發號施令祀神受職每月異禮故謂之月令所以順陰陽奉四時效氣物行王政也成法具備各從時月藏之明堂所以示承祖考神明明不敢泄瀆之義故以明堂冠月令以名其篇自天地定位有其象聖帝明君世有紹襲蓋以裁成大業非一代之事也易正月之卦曰泰其經曰王用享于帝吉孟春令曰乃擇元日祈穀于上帝顓頊厤術曰天元正月己巳朔旦立春日月俱起于天廟營室五度月令孟春之月日在營室堯典曰乃命羲和欽若昊天厤象日月星辰敬授人時令曰乃命太史守典奉法司天日月星辰之行易曰不利為寇利用禦寇令曰兵戎不起不可從我始書曰歲二月同律度量衡中春令曰日夜分則同度量鈞衡石凡此皆合于大禮王政其類不可盡稱戴禮夏小正傳陰陽生物之後王事之次則夏之月令也殷人無文及周而備文義所說博衍深遠宜周公之所著也官號職司與周官合周書七十二篇而月令第五十三古者諸侯朝正于天子受月令以歸而藏諸廟中天子藏之于明堂每月告朔朝廟出而行之周室既衰諸侯怠于禮魯文公廢告朔而朝仲尼譏之經曰閏月不告朔猶朝于廟刺舍大禮而徇小儀自是告朔遂闕而徒用其羊子貢非廢其令而請去之仲尼曰賜也爾愛其羊我愛其禮庶明王復興君人者昭而明之稽而用之耳無逆聽令無逆政所以臻乎大順陰陽和年穀豐太平洽符瑞由此而至矣秦相呂不韋著書取月令為紀號淮南王安亦取以為第四篇改名曰時則故偏見之徒或云月令呂不韋作或云淮南皆非也見本集說郛蔡君畫像頌文同三閭孝齊參騫見蔡邕別傳東國宗敬邕不言名咸稱蔡君兗州陳留竝圖畫形像而頌之日
