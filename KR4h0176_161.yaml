body:
  text: 陸康上疏諫鑄銅人臣聞先王治世貴在愛民省徭輕賦以寧天下除煩就約以崇簡易故萬姓從化靈物應德末世衰主窮奢極侈造作無端興制非一勞割自下以從苟欲故黎民吁嗟陰陽感動陛下聖德承天當隆盛化而卒被詔書畝斂田錢鑄作銅人伏讀惆悵悼心失圖夫什一而稅周謂之徹徹者通也言其法度可通萬世而行也故魯宣稅畝而蝝災自生哀公增賦而孔子非之豈有聚奪民物以營無用之銅人捐捨聖戒自蹈亡王之法哉傳曰君舉必書書而不法後世何述焉陛下宜留神省察改敝從善以塞兆民怨恨之望見後漢陸康傳上言請條列立宋皇后禮儀尚書令臣囂僕射臣鼎尚書臣旭臣乘臣謗臣謨臣詣稽首言伏惟陛下履乾則坤動合陰陽群臣大小咸以長秋宮未定遵舊依典章表仍聞歷時乃聽今月吉日以宋貴人為皇后應期正位群生兆庶莫不式舞易稱受茲介祉詩云干祿百福子孫千億萬方幸甚今吉日定臣請太傳太尉司徒司空太常條列禮儀正處上群臣妾無得壽如故事臣囂臣鼎臣旭臣乖臣謗臣謨臣詣愚暗不達大義誠惶誠恐頓首死罪稽首再拜以聞見續漢禮儀志中注補引蔡質所記立宋皇后儀上封事陳得失臣聞和氣應于有德妖異生乎失政上天告譴則王者思其愆政道或虧則姦臣當其罰夫蛇者陰氣所生鱗者甲兵之符也鴻範傳曰厥極弱時則有蛇龍之孽又熒惑守亢裴回不去法有近臣謀亂發于右不知陛下所與從容帷幄之內親信者為誰宜急斥黜以消天戒臣又聞惟虺惟蛇女子之祥伏惟皇太后定策宮闥援立聖明書云父子兄弟罪不相及竇氏之誅豈宜咎延太后幽隔空宮愁感天心如有霧露之疾陛下當何面目以見天下昔周襄王不能敬事其母戎狄遂至交侵孝和皇帝不絶竇后之恩前世以為美談禮為人後者為之子今以桓帝為父豈得不以太后為母哉援神契曰天子行孝四夷和平方今邊境日蹙兵革蜂起自非孝道何以濟之願陛下仰慕有虞蒸蒸之化俯思凱風慰母之念臣又聞爵賞之設必酬庸勳開國承家小人勿用今功臣久外未蒙爵秩阿母寵私乃享大封大風雨雹亦由于茲又故太傅陳蕃輔相陛下勤身王室夙夜匪懈而見陷群邪一旦誅滅其為酷濫駭動天下而門生故吏竝離徙錮蕃身已往人百何贖宜還其家屬解除禁網夫台宰重器國命所繼今之四公唯司空劉寵斷斷首善除皆素餐致寇之人必有折足覆餗之凶可因災異竝皆罷黜徵故司空王畼長樂少府李膺竝居政事庶災變可消國祚惟永臣山藪頑暗未達國典策曰無有所隱敢不盡愚用忘諱忌伏惟陛下裁其誅罰見後漢謝弼傳又略見袁宏後漢紀二十三語次不同薦董扶表資游夏之德述孔氏之風內懷焦董消復之術方今并涼騷擾西戎蠢叛宜敕公車特詔待以異禮咨謀奇策見蜀志劉焉傳注引益部耆舊傳請釋王允疏夫內視反聽則忠臣竭誠寬賢矜能則義士厲節是以孝文納馮唐之說晉悼宥魏絳之罪允以特選受命誅逆撫順曾未期月州境澄清方欲列其庸勳請加爵賞而以奉事不當當肆大戮責輕罰重有虧衆望臣等備位宰相不敢寢默誠以允宜蒙三槐之聽以昭忠貞之心見後漢王允傳奏遷董后孝仁皇后使故中常侍夏惲永樂太僕封諝等交通州郡辜較在所珍寶貨賂悉入西省蕃后故事不得留京師輿服有章膳羞有品請永樂后遷宮本國見後漢董后紀析里橋郙閣頌惟斯析里處漢之右溪源漂疾橫柱于道涉秋霖漉盆溢滔濔濤波滂沛激揚絶道漢水逆讓稽滯商旅路當二州經用䘢沮沮縣士民或給州府休謁往還恆失日晷行理咨嗟郡縣所苦斯溪既然郙閣尤甚緑崖鑿石處隱定柱臨長三百餘丈接木相連號為萬柱過者栗栗載乘為下常車迎布歲數千兩遭遇隤納人物俱隋沈沒洪淵酷烈為禍自古迄今莫不創楚于是太守漢陽阿陽李君諱翕字伯都以建寧三年三月辛已到官思惟惠利有以綏濟聞此為難其日久矣嘉念高帝之開石門元功不朽乃俾衡官掾下辨仇審改解危殆即便求隱析里大橋于今乃造校致攻堅工巧雖昔魯班亦莫擬象又醳散關之嶄漯從朝陽之平燥減西高閣就安寧之石道禹導江河以靖四海經記厥績艾康萬里臣勒石示後乃作頌曰降茲惠君克明俊德允武允文躬儉尚約化流若神愛氓如子平均精通晧穹三納苻銀所厥垂勳香風有鄰仍致瑞應豐稔樂行人夷欣慕君靡已乃詠新詩兮川兌之閒高山崔嵬水流蕩蕩地既塉確兮與寇為鄰以析分或失緒業兮至于困貧危危纍卵兮聖朝閔憐𨱞艾究兮幼救傾兮全育孑遺劬勞日稷兮惟惠勤勤黃邵朱龔兮蓋不充贏兮百姓歡欣僉曰太平兮文翁復存建寧五年四月十八日癸時衡官仇審字孔信從史位漢德為此頌故吏下辨子長書此云云時石師南威明見碑拓本隸釋四黽池五瑞畫像白鹿黃龍甘露降承露嘉禾木連理君昔在黽池修崤嶔之道德治精通致黃龍白鹿之瑞故圖畫其像見碑拓本隸釋四盧公範凡八月旦上承露盤赤松子柏上露囊以膏面皮古人用點炙枝以梨子為之反銀盞中者朱砂銀枝子也本注盧公範者盧慎家之法也見御覽二十五凡臘日上藻豆袋頭膏面脂口脂見御覽三十三始立太學石經上書臣少從通儒故南郡太守馬融受古學頗知今之禮記特多回允臣前以周禮諸經發起粃謬敢率愚淺為之解詁而家乏無力供繕寫上願得將能書生二人共詣東觀就官財糧專心研精合尚書章句考禮記失得庶裁定聖典刊正碑文古文科斗近于為實而厭抑流俗降在小學中興以來通儒達士班固賈逵鄭興父子並敦悅之今毛詩左氏周禮各有傳記其與春秋共相表裏宜置博士為立學官以助後來以廣聖意見後漢盧植傳日食上封事臣聞五行傳曰晦而月見謂之朓王侯其舒此謂君政舒緩故日食晦也春秋傳曰天子避位移時言其相掩不過移時而閒者日食自巳過午既食之後雲霧暗曖比年地震彗孛互見臣聞漢以火德化當寬明近色信讒忌之甚者如火畏水故也案今年之變皆陽失陰侵消禦災凶宜有其道謹略陳八事一曰用良二曰原禁三曰禦癘四曰備寇五曰修禮六曰遵堯七曰御下八曰散利用良者宜使州郡核舉賢良隨方委用責求選舉原禁者凡諸黨錮多非其罪可加赦恕申宥回枉禦癘者宋后家屬竝以無辜委骸橫尸不得收葬疫癘之來皆由于此宜敕收拾以安遊魂備寇者侯王之家賦稅減削愁窮思亂必致非常宜使給足以防未然修禮者應徵有道之人若鄭玄之徒陳明洪範禳服災咎遵堯者今郡守刺史二月數遷宜依黜陟以章能否縱不九載可滿三歲御下者請謁希爵一宜禁塞遷舉之事責成主者散利者天子之體理無私積宜弘大務蠲略細微見後漢盧植傳又續漢五行志六注引續漢本傳植上書丙子蝕自已過午云云今此少丙子二字奏事王后無子擇立長親年均以德德均決之以卜筮所以承先祖也見初學記十后妃者所以郊天祭地祇奉祖宗外以肅恭明神內以正九嬪理陰德者猶天之有地陽之有陰見初學記十丘明之傳本末春秋博物盡變囊括古今苞裹人事見書鈔原本九十五獻書規竇武植聞嫠有不恤緯之事漆室有倚楹之戚憂深思遠君子之情夫士立爭友義貴切磋書陳謀及庶人詩詠詢于芻蕘植誦先王之書久矣敢愛其瞽言哉今足下之于漢朝猶旦奭之在周室建立聖主四海有繫論者以為吾子之功于斯為重天下聚目而視攢耳而聽謂準之前事將有景風之祚尋春秋之義王后無嗣擇立親長年均以德德均則決之卜筮今同宗相後披圖案牒以次建之何勳之有豈橫叨天功以為己力乎宜辭大賞以全身名又比世祚不競仍外求嗣可謂危矣而四方未寧盜賊伺隙恆嶽勃碣特多姦盜將有楚人脅比尹氏立朝之變宜依古禮置諸子之官徵王侯愛子宗室賢才外崇訓道之義內息貪利之心簡其良能隨用爵之彊幹弱枝之道也見後漢盧植傳酈文勝誄自齔未成童著書十餘箱文體思奧爛有文章針縷百家見書鈔原本九十九到長沙敕史謹遇良善治官曹文書必循治以盜賊付太守見吳志孫堅傳注引魏書上言討鮮卑鮮卑仍犯塞百姓怨苦自春以來三十餘發請徵幽州諸郡兵出塞討之一冬二春必能禽滅見袁宏後漢紀二十後漢烏桓傳蔡雍集通典一百九十六請收張讓表張讓等滔慢天常擅操王命父子兄弟并據州郡一書出門高獲千金下數百膏腴美田皆屬讓等使變氣上蒸妖賊蜂起見後漢董卓傳注引典略上言曆元不宜用庚申曆元不正故妖民叛寇益州盜賊相續為曆用甲寅為元而用庚申圖緯無以庚為元者近秦所用代周之元太史治歷郎中郭香劉固意造妄說乞本庚申元經緯明受虛欺重誅見續漢律曆志中平議馮恂宗誠曆術侍中韓說博士蔡較穀城門候劉洪右郎中陳調于太常府覆校注說平議難問恂各對恂術以五千六百四十月有九百六十一食為法而除成分空加縣法推建武以來俱得三百二十七食其十五食錯案其官素注天見食九十八與兩術相應其錯辟二千一百誠術以百三十五月二十三食為法乘除成月從建康以上減四十一建康以來減三十五以其俱不食恂術改易舊法誠術中復減損論其長短無以相踰各引書緯自證文無義要取追天而已夫日月之術日循黃道月從九道以赤道儀日冬至去極俱一百一十五度其入宿也赤道在斗二十一而黃道在斗十九兩儀相參日月之行曲直有差以生進退故月行井牛十四度以上其在角婁十二度以上皆不應率不行以是言之則術不差不改不驗不用天道精微度數難定術法多端曆紀非一未驗無以知其是未差無以知其失失然後改之是然後用之此謂允執其中今誠術未有差錯之謬恂術未有獨中之異以無驗改未失是以檢將來為是者也誠術百三十五月二十三食其文在書籍學者所修施行日久官守其業經緯日月厚而未愆信于天文述而不作恂久在候部詳心善意能揆儀度定立術數推前校往亦與見食相應然協曆正紀欽若昊天宜率舊章如甲辰丙申詔書以見食為比今宜施用誠術棄放恂術史官課之後有效驗乃行其法以審術數以順改易見續漢律曆志中上書訟黨人夫黨人者或耆年淵德或衣冠英賢皆宜股肱王室左右大猷者也而久被禁錮辱在泥涂謀反大逆尚蒙赦宥黨人何罪獨不開恕乎所以災異屢見水旱薦臻皆由于斯宜加沛然以副天心見袁宏後漢紀二十四熹平五年上疏言沖帝母質帝母宜賜爵孝沖皇帝母虞大家質帝母陳夫人皆誕育聖明而未有溢號今當以母氏序列于外戚雖在薨歿猶宜爵贈況二母見存而無寵者乎即違母以子貴之義又不可以示後世見袁宏後漢紀二十四後漢虞美人傳編入宦官趙祐文上疏論宦官昔孝和帝市與中常侍鄭衆謀誅大將軍竇憲由是宦官秉權安帝幼沖和熹太后兄大將軍鄧騭輔政太后適崩中常侍江京等殺騭安帝登遐黃門孫程又殺車騎將軍閻顯孝桓帝又與中常侍單超等共誅大將軍梁冀陛下即阼太傳陳藩大將軍竇武尚書令尹勳等欲誅宦官絶其奸擅盡忠王室建萬世策機事不密為中常侍朱瑀等所殺此即陛下所見今宦官強盛威傾人主天下鉗口莫敢言者海內怨望妖孽竝作四方兵起萬姓辛苦陛下尚可以安奈后嗣何見華陽國志十下漢中士女上疏請誅中官臣聞天下之禍不由于外皆興于內是故虞舜升朝先除四凶然後用十六相明惡人不去則善人無由進也今張角起于趙魏黃巾亂于六州此皆釁發蕭牆而禍延四海者臣受戎任奉辭伐罪始到潁川戰無不剋黃巾雖盛不足為廟堂憂也臣之所懼在于治水不自其源末流彌增其廣耳陛下仁德寬容多所不忍故閹豎弄權忠臣不進誠使張角梟夷黃巾變服臣之所憂甫益深耳何者夫邪正之人不宜共國亦猶冰炭不可同器彼知正人之功顯而危亡之兆見皆將巧辭飾說共長虛僞夫孝子疑于屢至市虎成于三夫若不詳察真僞忠臣將復有杜郵之戮矣陛下宜思虞舜四罪之舉速行讒佞放殛之誅則善人思進姦凶自息臣聞忠臣之事君猶孝子之事父也子之事父焉得不盡其情使臣身被鈇鉞之戮陛下少用其言國之福也見後漢傅燮傳又見袁宏後漢紀二十四有小異議棄涼州對昔冒頓至逆也樊噲為上將云願得十萬衆橫行胸奴中憤激奮勵未失臣節也不顧計之當與不當耳季布猶廷斥曰噲可斬前朝星之今涼州天下之衝要國家之蕃衛也堯舜時禹貢載之殷周之世列為侯伯高祖平海內使酈商別定隴右世宗拓境列置四郡議者以為斷胸奴之右臂今牧御者失理使一州叛逆海內為之騷動陛下臥不安寢烈為宰相不念為國思所以緝之之策乃欲割棄一方萬里之土臣竊惑之若使左衽之虜得居此地為害數世今以徑士堅甲利兵姦雄因之為亂此天下至慮社稷之深憂也且無涼州則三輔危三輔危則京師薄矣若烈不知憂之是極蔽也知而欲棄是不忠也二者擇而處之烈必有之見袁宏後漢紀二十五諫耿鄙使君統政日淺人未知教孔子曰不教人戰是謂棄之今率不習之人越大隴之阻將十舉十危而賊聞大軍將至必萬人一心邊兵多勇其鋒難當而新合之衆上下未和萬一內變雖悔無及不若息軍養德明賞必罰賊得寬挺必謂我怯群惡爭勢其離可必然後率已教之人討已離之賊其功可坐而待也今不為萬全之福而就必危之禍竊為使君不取見後漢傅燮傳肉刑議蓋禮樂所以導民刑罰所以威之是故君子忌禮而小人畏刑雖湯武之隆成康之盛不專用禮樂亦陳肉刑之法而康哉之歌興清廟之頌作由此推之肉刑之法不當除也經有墨劓剕割之制至于鑿顛抽脅烹煮之刑衛鞅所述為非咎陶所造呂侯所述據經按傳肉刑不當除有五驗請言其理荀卿論之備矣太古質簡制事朴略故耒耜未用于牛而孤矢不加筋鐵智所暗也不識事宜以為聖人純一之教不如賢者支離之術鄭衛可以易咸池激楚可以陵韶武耶斯不足復難矣見藝文類聚五十四與張叔威書吾與足下義結素恩比同生見初學記十八又御覽四百十作執素疑是紈素之誤諫曹公南征治天下之大具有二文與武也用武則先威用文則先德威德足以相濟而後王道備矣往者天下大亂上下失序明公用武攘之十平其九今未承王命者吳與蜀也吳有長江之險蜀有崇山之阻難以威服易以德懷愚以為可且按甲寢兵息軍養士分土定封論功行賞若此則內外之心固有功者勸而天下知制矣然後漸興學校以導其善性而長其義節公神武震于四海若修文以濟之則普天之下無思不服矣今舉十萬之衆頓之長江之濱若賊負固深藏則士馬不能逞其能奇變無所其權則大威有屈而敵心未能服矣唯明公思虞舜舞干戚之義全威養德以道制勝見魏志武帝紀建安十九年公征孫權注引九州春秋王命敘昔在唐虞之禪列于帝典殷周之代敘于詩書天之曆數昭焉著明周篤后稷公劉積德行仁至乎文武遂成王業雖五德殊運或禪或征其變化應天與時消息其道一也故雖有威力非天命不授雖有運命非功烈不章我高祖襲唐之統受命龍興討秦滅項光有萬國世祖攘亂奄復帝宇人鬼協謀徵祥煥然皆順乎天而應乎人也然則帝王之起必有天命瑞應自然之符明統顯祚豐懿之業加以茂德成功賢智之助而後君臨兆民為神民所保祐永世所尊崇未見運敘無紀次勳澤不加于民而可力爭覬覦神器者也豪傑見二祖無尺地之階為專智力乘釁而起不知天祚聖哲帝王自有真也哀哉非徒暗于將來又不考之于既往矣自開闢以來姦雄妄動不識天命勇不足畏強不足憚未有成資而敢失順視不軌之事也哉夫行潦之流不致江海之深丘垤之資不成太山之高魚鱉之類不希雲龍之軌一官之守不經天人之變當王莽之末英雄四起而鄧禹耿弇識世祖之福祚贏糧閒行進其策謀遂荷胥附之任享佐命之寵張玄慕蘇秦蒯通之業周旋囂述西說竇融言未及終而梁統已誅之矣禹弇見命祚之兆其福如彼張玄蔽逆順之理其禍如此審斯二事趣舍之分明矣且世祖之興有四一曰帝皇之正統二曰形相多異表三曰體文而知武四曰履信而好士加之以聰明獨斷達于事機發策如神應視遠如見近偏旅首進摧莽軍百萬之衆單師獨征平河北萬里之功識鄧隆之將敗知劉興之必死然猶乾乾日昃博采訓咨拔吳漢于小尹擢馬武于行伍寵功臣以兼國之爵顯卓茂以非次之位言語政事文學之士咸盡其材致之宰相權勇畢力于征伐搢紳悉心于左右此其所以成大業也高祖方娠有雲龍之表其始入秦五星同軌以旅于東井在天之符也世祖之徵符其詳可聞也其初育則靈光鑒于室隩嘉禾滋于邑壤其望舊廬有火光之異其渡呼沱有河合之應西門君惠光識其諱強華獻符千里同驗劉歆改名而隕其身王祥錯卦而見吉兆故王遵謂之天授非人力也覽廢興之運會觀徵瑞之攸祚審天應之萌兆察人物之所附念功而道退無非次而妄據後之人誠能昭然遠覽曠然深悟收莽述之暗惑忠鄧耿之弘慮好謀而要成臨事而知懼距張玄之邪說思在三之明數則福祿衍于無窮世不失其通路矣見藝文類聚十皇后針煌煌四星天垂曜赫赫后妃則是效納二女揚茂教正位于內囂輟暴辛亂妲已則情悅牝雞亂晨祀用絶孝成寬柔弛紀綱王擅朝權專椒房巨猾是緣弄神器故禍不出所憎出所愛是以在昔明后新其化匪唯訓外訓于內見藝文類聚十五
