body:
  text: 全後漢文卷八十二張升陳留郡有白鳩出于郡界陳留郡有白鳩出于郡界守命門下守命門下曹吏張升作白鳩賦曰曹吏張升作白鳩賦曰名梟鳩名梟鳩貌甚雍容貌甚雍容丹青緑目丹青緑目耳象重重耳象重重見御覽九百二十一見御覽九百二十一與任彥堅書纏綿恩好庶蹈高蹤見文選潘嶽西征賦注寡婦賦注陸機贈馮文熊詩注又弔魏武帝文注恩作惠蹈作躡今將老弱處于窮澤漸漬汀濘當何聊賴見文選七命注友論噓枯則冬榮吹生則夏落見文選魏都賦注劉峻絶交論注黃綺引身巖棲南嶽見文選稽康與仙濤絶交書注對事客問酈炎曰吳王曷不傳子而傳兄弟四人傳者將以致國乎季札季札不受雖有僚立闔閭之弒春秋猶以不受為義不殺為仁而桓談以吳之篡弒滅亡釁由季札札不思上放周公之攝位而下慕曹臧之謙讓名已細矣春秋之趣豈謂爾乎炎曰夫四王之輕命致國乎季子謂其能流慶百世也季子不受內有篡殺之亂外致滅亡之禍雖知潔已之可為不惟宗廟之絶祀其痛矣問曰周制諸侯父死子繼若札從先私志受非所繼是浮行豈節義之謂與闔閭之欲國蓋緣札之雅意故曰季子雖至不吾廢也今如吾子之云則君子何稱乎炎曰光知季子仁而無權故肆意焉季子不能討是則春秋所譏仁而不武無能達也子之云公羊也公羊不以父命辭王父命以王父命辭父命不以家事辭國政以國政辭家事衛輒拒父猶謂之可況以國治篡弒之子乎祭仲行權公羊嘉之云君可以死易生國可以存易亡季子不然猶可善乎此蓋公羊之失非義之通者也周公誅二叔不為不仁宋穆受兄國不為不義君子急病而讓夷故踐明堂朝諸侯非榮其位為時之急也以季子之才君國子民行化四方與夫句踐相去幾何若令向時見國危亂慕周公急時之義思先君致國之意攝政持統邁其威德奚翅遷都琅琊尚征上國朝齊宋鄭魯衛執玉之君哉孔子稱可與立道未可與權權反經而善聖之達節者也季子守節之士故非其量度乎問者因又謂炎曰古者聖人封建諸侯皆云百里取象于雷雷何取也炎曰易震為雷亦為諸侯雷震驚百里曰何以知之炎曰以其數知之夫陽動為九其數卅六陰靜為八其數卅二震一陽動二陰靜故曰百里聞者稱善見古文苑又略見御覽十三遺令書維熹平六年冬十二月乃裂裳書白嚴考之神坐炎荷天之罪以致于死名歿身斃神而有知炎之歸覲在旦夕之間耳若其無知將何面目少見靈魂哉其自即安其自愛臣去矣亂矣永滅亡矣白老母無懷憂懷憂何為無增悲增悲何施寒必厚衣無炎誰為母厚衣暑必輕服無炎誰為母輕服棄炎無念此常厚衣不尤不怨此常輕服矣聖人達于死生賢者力而慕之炎之中心私有所慕每讀漢書楊王孫裸葬班固以為賢于秦始皇意常壯之然裸以見先人若炎不為也其布巾取覆頭布衣用蔽形具棺取容身鑿地取容棺若獲罪于衆耶石槨速朽蠲其罪哉堅固不加喪葬瀆先君之兆域必于瘠確之處而已呼甘陵夫人共居也白興讓考喪早葬讓之等元昆勉之以老母相纍不可使老母無曹也加供養謝嫂以老母相託若死者復知必使其言不愧嗟哉邈之遺孤其名曰止戈汝長自為之寧咨爾止戈汝未有所識吾謂汝有所識其先見汝耳汝未有所聞吾猶謂汝耳有所聞而告汝人之喪也非父則母非昆則弟非姊則妹人之孤也齔齒其少矣汝之孤也曾未滿兩旬汝無自以為微弱物有微弱于汝者乃其長而繁焉后稷棄之寒冰隘巷矣汝比之猶逸焉於菟之在虎乳極矣汝比之猶易焉乃終不在乃始在在懼惟生無懼管蔡之逸厥終乃不逸之易厥終不易言咨嗟止戈汝能言則讚之顧言汝能行則履我之所訓剛焉柔焉弱焉強焉學焉愚焉仕焉隱焉懼汝身之柔可不厲汝以剛乎懼汝之剛可不厲以柔乎懼汝之弱可以訓汝之強懼汝之愚以不勗汝以學懼汝之隱可不敕汝以仕乎消息汝躬調和汝體思乃考言念乃考訓必博學以著書以續受父母久業我十七而作酈篇二十四而州書矣二十七而作七平矣其賦誦誄自少為之苟吾戒汝剋從祭為甘苟示誠汝剋違梁奠為苦汝無逸于丘無湎于酒無安于忍事君莫如忠事親莫如孝朋友莫如信修身莫如禮汝哉其勉之下邳衛府君我之諸曹掾督郵濟北寧府君我繇之成就陳留韓府君察我孝廉陳留楊君辟我右北平從事祭酒今我溺于地下思恩則孤而靡報汝有可以倒戟背戈無孤之矣陳留蔡伯喈與我初不相見吾仰之猶父不敢以為兄彼必愛以為弟九江廬府君吾父事之張公裒張子傳幼業王延壽王子衍我之朋友也鮮于中優吾先姑之所出也若不足焉汝苟足往而朝覲之汝不敏往從之學焉汝苟往取任焉咨爾止戈吾蔑復有言焉其永覽于此見古文苑上言流尸事海邊有流尸露冠絳服感謝夢曰我伯夷弟孤竹君也求見掩藏吏民有嗤者皆死見博物志禱山川辭輔為郡股肱不進諫納忠薦賢退惡和調陰陽至令天下否隔萬物燋枯百姓喁喁無所告訴咎盡在輔太守內省責己自曝中庭使輔謝罪為民祈福曰無效令敢自誓至日中雨不降請以身塞無狀見搜神記蝗蟲疏春秋義曰蝗者貪擾之氣所生天意若曰貪很之人蠶食百姓若蝗食禾稼而擾萬民獸齧人者象暴政若獸而齧人京房易傳曰小人不義而反尊容則虎食人辟歷殺人以象暴政妄有喜怒政以賄成刑放于寵推類敘意探指求源皆象群下貪很成教妄施或若蝗蟲宜敕正衆邪請審選舉退屏貪暴魯僖公小國諸侯敕政修己斥退邪臣尚獲其報六月甚雨之應豈況萬乘之主修善求賢宜舉敦朴以輔善政陛下參堯舜之聖秉獨見之明恢太平之業教經好學流布遠近可留須臾神慮則可致太平招休徵矣見後漢蔡雍傳注引漢名臣奏與王匡書自古以來未有下士諸侯舉兵向京師者案劉向傳曰擲鼠忌器器猶忌之況卓今處宮闕之內以天子為藩屏幼主在宮如何可討僕與太傳馬公太僕趙岐少府陰修俱受詔命關東諸郡雖實嫉卓猶以銜奉王命不敢玷辱而足下獨囚僕于獄欲以釁鼓此悖暴無道之甚者也僕與董卓有何親戚義豈同惡而足下張狼虎之口吐長蛇之毒恚卓遷怒何甚酷哉死者人之所難然恥為狂夫所害若亡者有靈當訴足下于皇天夫婚姻者禍福之機今日著矣曩為一體今為血讎亡人子二人則君之甥身沒之後慎勿令臨僕尸骸也見魏志袁紹傳注引謝承後漢書又見後漢袁紹傳有刪節亡人子二人作亡人二女與劉子惠書董卓無道天下所共攻死在旦暮不足為憂但卓死之後當復回師討文節擁強兵何凶逆寧可得置見後漢袁紹傳注引英雄記薦任安表安味清道度厲節高邈揆其器量國之元寶宜處弼疑之輔以消非常之咎玄纁之禮所宜招命見蜀志秦宓傳注引益部耆舊傳遺張魯據漢中上書米賊斷道不得復通見蜀志劉焉傳建議選牧伯刺史太守貨賂為官割剝百姓以致離叛可選清名重臣以為牧伯鎮安方夏見蜀志劉焉傳下張魯解福教夫靈仙養命猶節松霞而厚身嗜味奚能尚道見弘明集八進諫王畼夫奢不僭上儉不逼下循道行禮貴處可否之間蘧伯玉恥獨為君子府君不希孔聖之明訓而慕夷齊之末操無乃皎然自遺于世乎見後漢王畼傳又見魏志劉表傳注引謝承書後定喪服既除喪有來弔者以縞冠深衣于墓受之畢事反吉見通典八十三君來弔臣主人待君到脫頭絰貫左臂去杖出門迎門外再拜乃獻還先入門東壁向君讓君于前聽進即堂先哭乃止于廬外伏哭當先君止君起致辭子對而不言稽顙以答之見通典八十三母為長子齊縗三年始死不徒跣拊心哭泣女子已嫁而反在室父卒為母與母為長子同齊縗杖周者父在為母不徒跣哭踊無數凡四不食為曾祖父母不敢以輕服服至尊減其月則當大功九月但三月耳始死哭泣三日為舊君之母妻為曾祖父母同見通典八十四父亡則祖後則不得為祖母三年以為婦人之服不可踰夫孫為祖服周父亡之後為祖母不得踰祖也見通典八十九上言復華山下民租田口算狀光和二年十二月庚午朔十三日壬午弘農太守臣毅頓首死罪上尚書臣毅頓首頓首死罪死罪謹案文書臣以去元年十一月到官其十二月奉祠西嶽華山省視廟舍及齋衣祭器率皆久遠有垢故魯不修大室春秋作譏臣以神嶽至尊宜加恭肅輒遣行事荀斑與華陰令先讜以漸繕治成就之後仍雨甘雪瀸潤宿麥惠滋黎庶臣即日以詔書齋祠雪未消澤時日清和神歡民喜誠聖朝勞神日昃廣被四表覆育之德神人被施遐邇大小莫不幸甚臣毅頓首頓首死罪死罪讜又書言縣當孔道加奉尊嶽一歲四祠養牲百日常當充肥用穀稿三千餘斛或有請雨齋禱役費兼倍每被詔書調發無差山高聽下恐近廟小民不堪役賦有飢寒之窘違宗神之教乞差諸賦復華下十里以內民租田口算以寵神靈廣祈多福隆中興之祚臣輒聽行盡力奉宣詔書思惟惠利增異復上臣毅誠惶誠恐頓首頓首死罪死罪上尚書掾臣條屬臣淮書佐臣謀弘農太守上祠西嶽乞縣賦發差復華下十里以內民租田口算狀見隸釋二迅風賦惟巽卦之為體吐神氣而成風纖微無所不入廣大無所不充經營八荒之外宛轉豪毛之中察本莫見其始揆末莫覩其終啾啾颼颼吟嘯相求阿那徘徊聲若歌謳摶之不可得繫之不可留見藝文類聚一解擯賦丹鴻可殺蚤見御覽九百五十一剌世疾邪賦伊五帝之不同禮三王亦又不同樂數極自然變化非是故相反駮德政不能救世溷亂賞罰豈足懲時清濁春秋時禍敗之始戰國愈增其荼毒秦漢無以相踰越乃更加其怨酷寧計生民之命為利己而自足于茲迄今情偽萬方佞諂日熾剛克消亡舐痔結駟正色徒行嫗𡟥名勢撫拍豪強偃蹇反俗立致咎殃捷懾逐物日富月昌渾然同惑孰溫孰涼邪夫顯進直士幽藏原斯瘼之攸興實執政之匪賢女謁掩其視聽兮近習秉其威權所好則鑽皮出其毛羽所惡則洗垢求其瘢痕雖欲竭誠而盡忠路絶嶮而靡緣九重既不可啓又群吠之狺狺安危亡于旦夕肆嗜欲于目前奚異涉海之失柂坐積薪而侍燃榮納由于閃榆孰知辨其蚩妍故法禁屈橈于勢族思澤不逮于單門寧飢寒于堯舜之荒歲兮不飽暖于當今之豐年乘理雖死而非亡違義雖生而匪存有秦客者乃為詩曰河清不可俟人命不可延順風激靡草富貴者稱賢文籍雖滿腹不如一囊錢伊優北堂上抗髒倚門邊魯生聞此辭繫而作歌曰勢家多所宜咳唾自成珠被褐懷金玉蘭蕙化為芻賢者雖獨悟所困在群愚且各守爾分勿復空馳驅哀哉復哀哉此是命矣夫見後漢趙一傳北堂書鈔一百三十八御覽六百九十三七百六十七七百七十一窮鳥賦昔原大夫贖桑下絶氣傳稱其仁秦越人還虢太子結脈世著其神設曩之二人不遭仁遇神則結絶之氣竭矣然而糒脯出乎車軨針石運乎手爪今所賴者非直車軨之糒脯手爪之針石也乃收之於斗極還之於司命使乾皮復含血枯骨復被肉允所謂遭仁遇神真所宜傳而著之余畏禁不敢班班顯言竊為窮鳥賦一篇其辭曰有一窮鳥戢翼原野罩網加上機穽在下前見蒼隼後見驅者繳彈張右羿子彀左飛丸激矢交集于我思飛不得欲鳴不可舉頭畏觸搖足恐墮內獨怖急乍冰乍火幸賴大賢我矜我憐昔濟我南今振我西鳥也雖頑猶識密恩內以書心外用告天天乎祚賢歸賢永年且公且侯子子孫孫見後漢趙一傳又見藝文類聚九十御覽三百五十又四百八十六報羊陟書惟君明睿平斯宿心見文選謝靈運富春褚詩注報皇甫規書君學成師範縉紳歸慕仰高希驥歷年滋多旋轅兼道渴于言侍沐浴晨興昧旦守門實望仁兄昭其懸遲以貴下賤握髮垂接高可敷玩墳典起發聖意下則抗論當世消弭時災豈悟君子自生怠倦失恂恂善誘之德同亡國驕惰之志蓋見幾而作不俟終日是以夙退自引畏使君勞昔人或歷説而不遇或思士而無從皆歸之于天不尤于物今一自譴而已豈敢有猜仁君忽一匹夫于德何損而遠辱手筆追路相尋誠足愧也一之區區曷云量己其嗟可去謝也可食誠則頑薄實識其趣但關節疢動膝灸壞潰請俟它日乃奉其情輒誦來貺永以自慰見後漢趙一傳非草書余郡士有梁孔達薑孟穎者皆當世之彥哲也然慕張生之草書過于希顏孔焉孔達寫書以示盂穎皆口誦其文手楷其篇無怠倦焉于是後生之徒競慕二賢守令作篇人撰一卷以為祕玩余懼其背經而趨俗此非所以弘道興世也又想羅趙之所見蚩沮故為説草書本末以慰羅趙息梁薑焉竊覽有道張君所與朱使君書稱正氣可以消除邪人無其釁妖不自作誠可謂信道抱真知命樂天者也若夫褎杜崔沮羅趙昕昕有自臧之意者無乃近于矜伎賤彼貴我哉夫草書之興也其于近古乎上非天象所垂下非河洛所吐中非聖人所造蓋秦之末刑峻網密官書煩冘戰攻並作軍書交馳羽檄分飛故為隸草趣急速耳示簡易之旨非聖人之業也但貴刪難省煩損復為單務取易為易知非常儀也故其讚曰臨事從宜而今之學草書者不思其簡易之旨以為杜崔之法龜蛇所見也其𢺈扶拄桎詰屈犮乙不可失也齔齒以上苟任涉學皆廢倉頡史籀競以杜崔為楷私書相與猶謂就書適迫遽故不及草草本易而速今反以難而遲失指多矣凡人各殊氣血異筋骨心有疏密手有巧拙書之好醜在心與手可強為哉若人顏有美惡豈可學有相若耶昔西施心疢捧胸而顰衆愚效之祗增其醜趙女善舞行步媚蠱學者弗獲失節匍匐夫杜崔張子皆有超俗絶世之才博學餘暇遊手于斯後世慕焉專用為務鑽堅仰高忘其罷勞夕惕不息仄不暇食十日一筆月數丸墨領袖如皂唇齒常黑雖處衆坐不遑談戲展指畫地以草劌壁臂穿皮刮指爪摧折見䚡出血猶不休輟然其為字無益于工拙亦如效顰者之增醜學步者之失節也且草書之人蓋技藝之細耳鄉邑不以此較能朝廷不以此科吏博士不以此講試四科不以此求備徵聘不問此意考績不課此字徒善字既不達于政而拙草亦無損于治推斯言之豈不細哉夫務內者必闕外志小者必忽大俯而捫蝨不暇見天地天地至大而不見者方鋭精于機蝨乃不暇焉第以此篇研思鋭精豈若用之于彼七經稽曆協律推步期程探賾鉤深幽贊神明覽天地之心推聖人之情析疑論之中理俗儒之諍依正道于邪説濟雅樂不鄭聲興至德之和睦弘大倫之玄清窮可以守身遺名達可以尊主致平以茲命世永監後生不亦淵乎見法書要録一墨池編御覽六百一七百四十九諫徵朱俊疏昔秦用白起燕任樂毅皆曠年歷載乃克敵俊討潁川已有功效引師南指方略已設臨軍易將兵家所忌宜假日月責其成功見後漢朱俊傳袁宏後漢紀二十四作張溫議與此小異征討板楯蠻方略對板循七姓以射殺白虎立功先漢本為義民復除徭役但出賨錢口歲四十其人勇敢能戰昔永切中羌數入漢川郡縣破壞不絶若線後得板循救之羌死敗殆盡故號為神兵羌人畏忌傳語種輩勿復南行至建和二年羌復入漢牧守遑遑復賴板楯連摧破之若微板楯則蜀漢之民為左衽矣前車騎將軍馮緄南征武陵雖受丹陽精兵之鋭亦倚板楯以成其功近益州之亂朱龜以并涼徑卒討之無功太守李顒亦以板楯討而平之忠功如此本無惡心長吏鄉亭更賦至重僕役過于奴婢箠楚隆于囚虜至乃嫁妻賣子或自剄割雖陳冤州郡而牧守不為通理去闕庭遙遠不能自聞含怨呼天叩心窮谷愁苦于賦役因羅于酷刑故邑落相聚以至叛戾非有深謀至計僭號以圖不軌今但選明能牧守益其資穀安便賞募從其利隟自然安集不煩征伐也昔中郎將尹就伐羌擾動益部百姓諺曰虜來尚可尹將殺我就征還後羌自破退如臣愚見權之遺軍不如任之州郡見華陽國志又見後漢南蠻傳上言黨錮禮從祖兄弟別居異財恩義已輕服屬疏末而今黨人錮及五族既乖典訓之文有謬經常之法見後漢黨錮傳序因虎見上言虎見憲陵又見平樂觀下隸皆訛言也洪範之論言之不從則有毛之蟲之孽虎者西方之獸為禽剛猛強梁之物也居而穴處不可覩見今于先帝園陵為害又言見于城下皆在位者仁恩不著有苛剋殺戮之意乎此乃大兵劇賊之徵不可不防也見袁宏後漢紀二十四光和三年中郎將張均上言上言請斬十常侍竊惟張角所以能興兵作亂萬民所以樂附之者其源皆由十常侍多放父兄子弟昏親賓客典據州郡辜榷財利侵掠百姓百姓之冤無所告訴因起從角學道謀議不軌相聚為盜賊今宜悉斬十常侍懸其頭于南郊以謝百姓又遣使者布告天下可不須師旅而大寇自消見袁宏後漢紀二十四後漢張讓傳作郎中中山張鈞上書均鈞可異者微止是一人上書武庫禁兵所在國司之禁為災深矣見初學記二十四引謝承後漢書光和中武庫屋自壞司隸許永上書云云御覽一百九十一引作許冰對詔問夢祥宋皇后親與陛下共承宗廟母臨萬國歷年已久海內蒙化過惡無聞而虛聽讒妒之説以致無辜之罪身嬰極誅禍及家族天下臣妾咸為怨痛勃海王悝桓帝母弟也處國奉藩未嘗有過陛下曾不證審遂伏其辜昔晉侯失刑亦夢大厲被髮屬地天道明察鬼神難誣宜并改葬以安冤魂反宋后之徙家復勃海之先封以消厥咎見後漢靈帝宋皇后紀謀作難詭上靈帝書黑山賊攻劫郡縣求得起兵見魏志武帝紀注引九州春秋
