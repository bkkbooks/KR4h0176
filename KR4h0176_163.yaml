body:
  text: 孔融上書薦謝該臣聞高祖創業韓彭之將征討暴亂陸賈叔孫通進說詩書光武中興吳耿佐命范升衛宏修述舊業故能文武並用成長久之計陛下聖德欽明同符二祖勞謙厄運三年乃歡今尚父鷹揚方叔翰飛王師電鷙群凶破殄始有櫜弓臥鼓之次宜得名儒典綜禮紀竊見故公車司馬令謝該體曾史之淑性兼商偃之文學博通群藝周覽古今物來有應事至不惑清白異行敦悅道訓求之遠近少有儔匹若乃巨骨出吳隼集陳庭黃熊入寢亥有二首非夫洽聞者莫識其端也雋不疑定北闕之前夏侯勝辨常陰之驗然後朝士益重儒術今該實卓然比跡前列閒以父母老疾棄官欲歸道路險塞無由自致猥使良才抱璞而逃踰越山河沈淪荊楚所謂往而不反者也後日當更饋樂以釣由余剋像以求傅說豈不煩哉臣愚以為可推録所在召該令還楚人止孫卿之去國漢朝追匡衡于平原尊儒貴學惜失賢也見後漢謝該傳上書請準古王畿制臣聞先王分九圻以遠及近春秋內諸夏而外夷狄詩云封畿千里惟民所止故曰天子之居必以衆大言之周室既衰六國力征授賂割裂諸夏鎬京之制商邑之度歷載彌久遂以暗昧秦兼天下政不遵舊革剗五等掃滅侯甸築城萬里濱海立門欲以六合為一區五服為一家關衛不要遂使陳項作難家庭臨海擊柝不救聖漢因循未之匡改猶依古法潁川南陽陳留上黨三海近郡不封爵諸侯臣愚以為千里國內可略從周官六鄉六遂之文分比北郡皆令屬司隸校尉以正王賦以崇帝室役自近以寬遠繇華貢獻外薄四海揆文奮武各有典書見袁宏後漢紀二十九建安九年九月大中大夫孔融上書云云上書先帝褒厚老臣懼其殞越是故扶接助其氣力三公刺腋近為憂之非警戒也云備大臣非其類也見御覽三百六十九引東觀漢記上三府所辟稱故吏事三府所辟州郡所辟其不謁署不得稱故吏臣惟古典春秋女在其國稱女在途稱婦然則在途之臣應與為比殼梁傳曰天子之宰通于四海三公之吏不得以未至為差狐突曰策名委質二乃辟也奉命承教策名也昔公孫嬰齊卒于貍蜃時未入國魯公以大夫之禮加焉傳曰吾固許之返為大夫延陵季子解劍帶徐君之墓明心許之信況受三公之招修拜辱之辭有資父事君之志邪臣愚以禮宜從重三公所召雖未就職便為故吏見通典六十八薦禰衡疏臣聞洪水橫流帝思俾乂旁求四方以招賢俊昔孝武繼統將弘祖業疇咨熙載群士響臻陛下睿聖纂承基緒遭遇厄運勞謙日昃惟嶽降神異人竝出竊見處士平原禰衡年二十四字正平淑質貞亮英才卓礫初涉藝文升堂睹奧目所一見輒誦於口耳所暫聞不忘于心性與道合思若有神弘羊潛計安世默識以衡準之誠不足怪忠果正直志懷霜雪見善若驚疾惡如讎任座抗行史魚厲節殆無以過也鷙鳥纍百不如一鶚使衡立朝必有可觀飛辨騁辭溢氣坌涌解疑釋結臨敵有餘昔賈誼求試屬國詭係單于終軍欲以長纓牽致徑越弱冠慷慨前世美之近日路粹嚴象亦用異才擢拜臺郎衡宜與為比如得龍躍天衢振翼雲漢揚聲紫微垂光虹霓足以昭近署之多士增四門之穆穆鈞天廣樂必有奇麗之觀帝室皇居必蓄非常之寶若衡等輩不可多得激楚揚阿至妙之容臺牧者之所貪飛兔騕裊絶足奔放良樂之所急臣等區區敢不以聞陛下篤慎取士必須效試乞令衡以褐衣召見必無可觀釆臣等受面欺之罪見後漢禰衡傳又魏志荀彧傳注引禰衡傳文選又藝文類聚五十三崇國防疏竊聞領荊州牧劉表桀逆放恣所為不軌至乃郊祭天地擬儀社稷雖昏僭惡極罪不容誅至于國體宜且諱之何者萬乘至重天王至尊身為聖躬國為神器陛級縣遠祿位限絶猶天之不可階日月之不可踰也每有一豎臣輒去圖之若形之四方非所以杜塞邪萌愚謂雖有重戾必宜隱忍賈誼所謂擲鼠忌器蓋謂此也是以齊兵次楚唯責包茅王師敗績不書晉人前露袁術之罪今復下劉表之事是使跛牂欲窺高岸天險可得而登也案表跋扈擅誅列侯遏絶詔命斷盜貢篚招呼元惡以自營衛專為群逆主萃淵藪郜鼎在廟章孰甚焉桑落瓦解其藝可見臣愚以為宜隱郊祀之事以崇國防見後漢孔融傳馬日磾不宜加禮議日磾以上公之尊秉髦節之使御命直指寧輯東夏而曲媚姦臣為所牽率章表署用輒使首名附下罔上姦以事君昔國佐當晉軍而不撓宜僚臨白刃而正色王室大臣豈得以見脅為辭又袁術僭逆非一朝一夕日磾隨從周旋歷歲漢律與罪人交關三日已上皆應知情春秋魯叔孫得臣卒以不發揚襄仲之罪貶不書日鄭人討幽公之亂斫子家之棺聖上哀矜舊臣未忍追案不宜加禮見後漢孔融傳又見袁宏後漢紀三十九肉刑議古者敦龐善否不別吏端刑清政簡一無過失百姓有罪皆自取之末世陵遲風化壞亂政撓其俗法害其教故曰上失其道民散久矣而欲繩之以古刑投之以殘棄非所謂與時消息者也紂斫朝涉之脛天下謂為無道夫九牧之地千八百君若各刖一人是天下常有千八百紂也求俗休和弗可得也且被刑之人慮不念生志在思死類多趨惡莫復歸正夙沙亂齊伊戾禍宋趙高英布為世大患不能止人遂為非也適足絶人還為善耳雖忠如鬻權信如卞和智如孫臏冤如巷伯才如史遷達如子政一離刀鋸沒世不齒是太甲之思庸穆公之霸秦南雎之骨立衛武之初筵陳湯之都賴魏尚之守邊無所復施也漢開改惡之路凡為此也故明德之君遠度深惟棄短就長不苟革其政者也見後漢孔融傳又見御覽六百四十九引續漢書又袁宏後漢紀三十晉書刑法志藝文類聚五十四通典一百六十八南陽王馮東海王祗祭禮對聖恩敦睦感時增思悼二王之靈發哀愍之詔稽度前典以正禮制竊觀故事前梁懷王臨江愍王齊哀王臨淮懷王並薨無後同産昆弟即景武昭明四帝是也未聞前朝修立祭祀若臨時所施則不列傳紀臣愚以為諸在沖齔聖慈哀悼禮同成人加以號諡者宜稱上恩祭祀禮畢而後絶之至于一歲之限不合禮意又違先帝已然之法所未敢處見後漢孔融傳告高密相立鄭公鄉教昔齊置士鄉越有君子軍皆異賢之意也鄭君好學實懷明德昔太史公廷尉吳公謁者僕射鄧公皆漢之名臣又南山四皓有園公夏黃公潛光隱耀世加其高皆悉稱公然則公者仁德之正號不必三事大夫也今鄭君鄉宜曰鄭公鄉昔東海于公僅有一節猶或戒鄉人侈其門閭矧乃鄭公之德而無駟牡之路可廣開門衢令容高車號為通德門見後漢鄭玄傳又御覽一百五十七引鄭玄別傳鄭門增門之崇令高車結駟之路出麥五斛以酬執事者之勞見御覽八百三十八引孔融教高密侯國箋言繕治鄭公宅教鄭公久游南夏今艱難稍平儻有歸來之思無寓人于我室毀傷其藩垣林木必繕治牆宇以俟還教高密令志士鄧子然告困焉得愛釜庾之問以惕烈士之心與豆三斛後乏復言見御覽八百四十一告昌安縣教邑人高幼自言辟得井中鼎夫鼎久潛于井德之休明雖小重也黃耳金鉉利貞之象國遭凶荒彝器出或者明以饗人見初學記七答王修舉孝廉讓邴原教原之賢也吾已知之矣昔高陽氏有才子八人堯不能用舜實舉之原可謂不患無位之士以遺後賢不亦可乎見魏志王修傳注引融集重答王修掾漬身潔己歷試諸難謀而鮮過惠訓不倦余嘉乃勳應乃懿德用升爾于王庭其可辭乎見魏志王修傳注引融集喻邴原舉有道書修性保貞清虛守高危邦不入久潛樂土王室多難西遷鎬京聖朝勞謙疇咨清我徂求定策命懇惻國之將隕釐不恤緯家之將亡緹縈跋涉彼匹婦也猶執此義實望根矩仁為己任授手援溺振民于難乃或晏晏居息莫我肯顧謂之君子固如此乎根矩根矩可以來矣見魏志邴原傳注引原別傳遣問邴原書隨會在秦賈季在翟咨仰靡所歎息增懷頃知來至近在三山詩不云乎來歸自鎬我行永久今遣五官掾奉問榜人舟楫之勞禍福動靜告慰亂階未已阻兵之雄若棋奕爭梟見魏志邴原傳注引原別傳與王朗書世路隔塞情問斷絶感懷增思前見章表知尋湯武罪已之跡自投東裔同鯀之罰覽省未周涕隕潸然主上寬仁貴德宥過曹公輔政思賢竝立策書屢下殷勤款至知櫂舟浮海息駕廣陵不意黃能突出羽淵也談笑有期勉行自愛見魏志王朗傳注遺張紘書聞大軍西征足不留鎮不有居者誰守社稷深固折衝亦大勳也無乃李廣之氣倉髮益怒樂一當單于以盡餘憤乎南北竝定世將無事孫叔投戈絳灌俎豆亦在今日但用離析無緣會面為愁歎耳道直途清相見豈復難哉見吳志張紘傳注引吳書又遺張紘書前勞手筆多篆書每舉篇見字欣然獨笑如復睹其人也見吳志張紘傳注引吳書答虞仲翔書示所著易傳自商瞿以來舛錯多矣去聖彌遠衆說騁辭曩聞延陵之理樂今睹吾君之治易乃知東南之美者非但會稽之竹箭焉又觀象雲物察應寒溫原其禍福與神會契可謂探頤窮道者已方世清聖上求賢者梁邱以卦筮寧世劉向以洪範昭名想當來翔追縱前烈相見乃盡不復多陳見吳志虞翻傳藝文類聚五十五與韋休甫書使君足下懷遠垂勳西戎即敘前別意恨甚多不悉辛從事至承獲所訊喜而起居不恙而到也云便結駟徑至舊治西土之人宗服合德鮮仇祟好順風化萬里雍穆如樂之和雖為國家威靈感應亦實士縠堪事之效也昔伯安由幽都而登上司子琰以豫州而取宰相近事未遠當勉功業已豐此慶耳閒僻疾動不得復與足下岸幘廣坐舉杯相于以為邑邑前日元將來淵才亮茂雅度弘毅偉世之器也昨日仲將復來懿性真實文敏篤誠保家之主也不意雙珠近出老蚌甚珍貴之遣書通心見魏志荀彧傳注藝文類聚五十三案涼州太守韋康字元將康弟誕字仲將皆韋端子與宗從弟書知晚節豫學既美大弟因而能寤又合君先加我之義豈唯仁弟實專承之凡我宗族猶或賴焉見藝文類聚五十五與諸卿書鄭康成多臆說人見其名學為有所出也證案大較在五經四部書如非此文近為妄矣若子所執以為郊天鼓必當麒麟之皮也寫孝經本當曾子家策乎見御覽六百八先日多惠胡桃深如知篤意見藝文類聚八十七御覽九百七十一與許博士書今足下遠以彝器金石竝志為國家來儀之端亦丈夫之大勳見北堂書鈔與曹公書薦邊讓邊讓為九州衣被則不足為單衣襜褕有餘見御覽六百九十三七百七引邊讓別傳與曹公書論盛孝章歲月不居時節如流五十之年忽焉已至公為如滿融又過二海內知識零落殆盡惟會稽盛孝章尚存其人困于孫氏妻孥湮沒單孑獨立孤危愁苦若使憂能傷人此子不得復永年矣春秋傳曰諸侯有相滅亡者桓公不能救則桓公恥之今孝章實丈夫之雄也天下談士依以揚聲而身不免于幽執命不期于旦夕是吾祖不當復論損益之友而朱穆所以絶交也公誠能馳一介之使加咫尺之書則孝章可致友道可弘也今之少年喜謗前輩或能譏平孝章孝章要為有天下大名九牧之民所共稱歎燕君市駿馬之骨非欲以騁道里乃當以招絶足也惟公匡復漢室宗社將絶又能正之正之之術實須得賢珠玉無脛而自至者以人好之也況賢者之有足乎昭王築臺以尊郭隗隗雖小才而逢大遇竟能發明主之至心故樂毅自魏往劇辛自趙往鄒衍自齊往嚮使郭隗倒縣而王不解臨溺而王不拯則士亦將高翔遠引莫有北首燕路者矣凡所稱引自公所知而復有云者欲公祟篤斯義也因表不悉見吳志孫韶傳注引會稽典録文選與曹公書武王伐紂以妲己賜周公見後漢孔融傳操子丕私納袁熙妻甄氏融融乃與操書又見魏志崔琰傳注引魏氏春秋與曹公書啁征烏桓大將軍遠征蕭條海外昔肅慎氏不貢楛矢丁零盜蘇武牛羊可并案也見後漢孔融傳難曹公表劉酒禁書公當初來邦人咸抃舞踴躍以望我后亦既至止酒禁施行酒之為德久矣古先哲王類帝禋宗和神定人以濟萬國非酒莫以也故天垂酒星之曜地列酒泉之郡人著旨酒之德堯非千鍾無以建太平孔非百觚無以堪上聖樊噲解厄鴻門非彘肩巵酒無以奮其怒趙之廝養東迎其王非引扈酒無以激其氣高祖非醉斬白蛇無以暢其靈景帝非醉幸唐姬無以開中興袁盎非醇醪之力無以脫其命定國非酣飲一斛無以決其法故酈生以高陽酒徒著功于漢屈原不餔糟啜醨取困于楚由是觀之酒何負于治者哉見後漢孔融傳注引融集魏志崔琰傳注引張璠漢記藝文類聚七十二又書昨承訓答陳二代之禍及衆人之敗以酒亡者實如來誨雖然徐偃王行仁義而亡今令不絶仁義燕噲以讓失社稷今令不禁謙退魯因儒而損今令不棄文學夏商亦以婦人失天下今令不斷婚姻而將酒獨急者疑但惜穀耳非以亡王為戒也見後漢孔融傳注引融集魏志崔琰傳注引張璠漢記報曹公書猥惠書教告所不逮融與鴻豫州里比鄰知之最早雖嘗陳其功美欲以厚于見私信于為國不求其覆過掩惡有罪望不坐也前者黜退歡欣受之昔趙宣子朝登韓厥夕被其戮喜而求賀況無彼人之功而敢枉當官之平哉忠非三閭智非朝錯竊位為過免罪為幸乃使餘論遠聞所以慚懼也朱彭寇賈為世壯士愛惡相攻能為國憂至于輕弱薄劣猶昆蟲之相囓適足還害其身誠無所至也晉侯嘉其臣所爭者大而師曠以為不如心競性既遲緩與人無傷雖出胯下之負榆次之辱不知貶毀之于己猶蚊虻之過也子産謂人心不相似或矜藝者欲以取勝為榮不念宋人待四海之客大爐不欲令酒酸也至於屈穀巨瓠堅而無竅當以無用罪之耳它者奉尊嚴教不敢失墜郗為故吏融所推進趙衰之拔卻縠不輕公叔之升臣也知同其愛訓誨發中雖懿伯之忌猶不得念況恃舊交而欲自外于賢吏哉輒布腹心修好如初苦言至意終身誦之見後漢孔融傳郗慮承望風旨以微法奏免融官因顯明讎怨操故書激厲融融報案融傳注引續漢書慮字鴻豫山陽高平人少受學于鄭玄答路粹書來彭寇賈之徒當世壯士愛惡相攻能為國患輕薄劣弱者如兩虺相嚙適足還災其身誠無所至見御覽九百三十四案范書以此為報曹公據文選注則曹公書乃路粹所作御覽題為答路粹蓋融集如此今宜兩載之范書兩虺作昆蟲誤周武王漢高祖論武王從后稷以來至其身相積五十世俱有魚鳥之瑞至高祖一身修德瑞有四呂公望形而薦女呂后見雲知其處白蛇分神母哭西入關五星聚又武王伐紂斬而刺之高祖入秦赦子嬰而遣之是寬裕又不如高祖也見藝文類聚十二聖人優劣論荀愔等以為聖人俱受乾坤之醇靈稟造化之和氣該百行之高善備九德之淑懿極鴻源之深閭窮品物之情類曠蕩出于無外沈微淪于無內器不是周不充聖極荀以為孔子稱大哉堯之為君也唯天為大唯堯則之是則為覆蓋衆聖最優之明文也孔以堯作天子九十餘年政化洽于民心雅頌流于衆聽是以聲德發聞遂為稱首則易所謂聖人久于其道而天下化成百年然後勝殘去殺必世而後仁者也故曰大哉堯之為君也堯之為聖也明其聖與諸聖同但以久見稱為君爾見藝文類聚二十又初學記十七引兩條金之優者名曰紫磨猶人之有聖也見御覽八百十一馬之駿者名曰騏驥犬之駿者名曰韓盧犬之有韓盧馬之有騏驥猶人之有聖也名號等設騏驥與韓盧并是寧能頭尾相當八腳如一無有先後之覺矣見御覽八百九十七汝潁優劣論融以汝南士勝潁川士陳長文難曰頗有蕪菁唐突人參也融答之曰汝南戴子高親止千乘萬騎與光武皇帝共揖于道中穎川士雖抗節未有頡頏天子者也汝南許子伯與其友人共說世俗將壞因夜起舉聲號哭穎川士雖頗憂時未有能哭世者也汝南許椽教太守鄧晨圖開稻陂灌數萬頃纍世獲其功夜有火光之瑞韓元長雖好地理未有成功見效如許掾者也汝南張元伯身死之後見夢范巨卿潁川士雖有奇異未有鬼神能靈者也汝南應世叔讀書五行俱下潁川士雖多聰明未有能離婁并照者也汝南李洪為大尉掾弟殺人當死洪自劾詣閣乞代弟命便飲鴆而死弟用得全潁川士雖尚節義未有能殺身成仁如洪者也汝南翟文仲為東郡太守始舉義兵以討王莽潁川士雖疾惡未有能破家為國者也汝南袁公著為甲科郎中上書欲治梁冀潁川士雖慕忠讜未有能投命直言者也見藝文類聚二十二御覽四百四十七肉刑論今之洛陽道橋作徒困千廝役十死一生故國家嘗遣三府齎詔月一按行又置南甄官使者主養病徒僅能存之諸所謂洛豪徒韓伯密加笞三百不中一髡頭至耳髮詣勝此自為刑非國法之意見御覽六百四十二古聖作犀兕革鎧今益領鐵鎧絶聖甚遠見御覽三百五十六賢者所制或踰聖人水碓之巧勝于斷木掘地見御覽七百六十二同歲論弊箄徑尺不足以救盬池之咸阿膠徑寸不能止黃河之濁見御覽七百五十七又七百六十六衛尉張儉碑銘其先張仲實以孝友左右周室晉主夏盟而張老延君譽于四方君稟乾剛之正性蹈高世之殊軌冰潔淵清介然特立雖史魚之勵操叔向之正色未足比焉中常侍同郡侯覽專權王命豺虎肆虐威震天下君以西部督郵上覽禍亂凶國之罪鞠沒賦姦以巨萬計俄而置書案驗部黨君為覽所陷亦章名捕逐當世英雄受命殞身以籍濟君厄者蓋數十人故克免斯艱旋宅舊宇衆庶懷其德王公慕其聲州宰爭命辟大將軍幕府公車特就家拜少府皆不就也復以衛尉徵明詔嚴切敕州郡乃不得已而就之惜乎不登泰階以尹天下致皇代于隆熙銘曰桓桓我君應天淑靈皓素其質允迪忠貞肆志直道進不為榮赴戟驕臣發如震霆凌剛摧堅視危如寧聖主克愛命作喉脣見藝文類聚四十九文選褚淵碑注又齊安陸昭王碑注
