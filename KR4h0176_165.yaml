body:
  text: 陶謙被詔罷兵上書臣聞懷遠柔服非德不集克難平亂非兵不濟是以涿鹿版泉三苗之野有五帝之師有扈鬼方商奄四國有王者之伐自古在昔未有不揚威以弭亂震武以止暴者也臣前初以黃巾亂治受策長驅匪遑啓處雖憲章敕戒奉宣威靈敬行天誅每伐輒克然妖寇類衆殊不畏死父兄殲殪子弟群起治屯連兵至今為患若承命解甲弱國自虛釋武備以資亂損官威以益寇今目兵罷明日難必至上忝朝廷軝授之本下令群凶日月滋蔓非所以強幹弱枝遏惡止亂之務也臣雖愚蔽忠恕不昭抱恩念報所不忍行輒勒部曲申令警備出芟強寇唯力是視入宣德澤躬奉職事冀效微勞以贖罪負見魏志陶謙傳注引吳書華夏沸擾于今未弭包茅不入職貢多闕寤寐憂歎無日敢寧誠思貢獻必至薦羞獲通然後銷鋒解甲臣之願也臣前調穀百萬斛已在水次敕兵衛送同上奏記朱俊徐州刺史陶謙前揚州剌史周乾琅邪相陰德東海相劉馗彭城相汲廉北海相孔融沛相袁忠太山太守應劭汝南太守徐璆前九江太守服虔博士鄭玄等敢言之行車騎將軍河南尹莫府國家既遭董卓重以李傕郭泛之禍幼主劫執忠良殘敝長安隔絶不知吉凶是以臨官尹人搢紳有識莫不憂懼以為自非明哲雄霸之士曷能克濟禍亂自起兵以來于茲三年州郡轉相顧望未有奮擊之功而互爭私變更相疑惑謙等并共咨諏議消國難僉曰將軍君侯既文且武應運而出凡百君子靡不顒顒故相率厲簡選精悍堪能深入直指南陽多持資糧足支半歲謹同心腹委之元帥見後漢朱俊傳表袁紹罪狀臣聞皇義以來始有君臣上下之事張化以導民刑罰以禁暴今行車騎將軍袁紹託其先軌寇竊人爵既性暴亂厥行淫穢昔為司棣校尉會值國家喪禍之際太后承攝何氏輔政紹專為邪媚不能舉直至令丁原焚燒孟津招來董卓造為亂根紹罪一也卓既入雒而主見質紹不能權譎以濟君父而棄置節傳迸竄逃亡忝辱爵命背上不忠紹罪二也紹為渤海太守默選戎馬當攻董卓不告父兄至使太傳門戶太僕母子一旦而斃不仁不孝紹罪三也紹既興兵涉歷二年不恤國難廣自封殖乃多以資糧專為不急割剝富室收考責錢百姓吁嗟莫不痛怨紹罪四也韓馥之迫竊其虛位矯命詔恩刻金印玉璽每下文書皂囊施檢文曰詔書一封邟鄉侯印昔新室之亂漸以即真今紹所施擬而方之紹罪五也紹令崔巨業侯視星日財貨賂遺與共飲食克期會合攻鈔郡縣此豈大臣所當宜為紹罪六也紹與故虎牙都尉劉勳首共造兵勳仍有效又降伏張楊而以小忿枉害于勳信用讒慝殺害有功紹罪七也紹又上故上谷太守高焉故甘陵相姚貢橫責其錢錢不備畢二人并命紹罪八也春秋之義子以母貴紹母親為婢使紹實微賤不可以為人後以義不宜乃據豐隆之重任忝污王爵損辱袁宗紹罪九也又長沙太守孫堅前領豫州剌史驅走董卓掃除陵廟其功莫大紹令周昂盜居其位斷絶堅糧令不得入使卓不被誅紹罪十也臣又每得後將軍袁術書云紹非術類也紹之罪戾雖南山之竹不能載昔姬周政弱王道陵遲天子遷都諸侯背叛于是齊桓立柯亭之盟晉文為踐土之會伐荊楚以致菁茅誅曹衛以彰無禮臣雖闒茸名非先賢蒙被朝恩當此重任職在鈇鉞奉辭伐罪輒與諸將州郡兵討紹等若事克捷罪人斯得庶續桓文忠誠之效攻戰形狀前後續上見魏志公孫瓚傳注引典略瓚表紹罪狀臣聞皇義以來君臣道著張禮以導人設刑以禁暴今車騎將軍袁紹託承先軌爵任崇厚而性本淫亂情行浮薄昔為司隸值國多難太后承攝何氏輔朝紹不能舉直錯枉而專為邪媚招來不軌疑誤社稷至令丁原焚燒孟津董卓造為亂始紹罪一也卓既無禮帝主見質紹不能開設權謀以濟君父棄置節傳迸竄逃亡忝辱爵命背違人主紹罪二也紹為勃海當攻董卓而默選戎馬不告父兄至使太傅一門纍然同斃不仁不孝紹罪三也紹既興兵涉歷二載不恤國難廣自封植乃多引資糧專為不急割刻無方考責百姓其為痛怨莫不吁嗟紹罪四也逼迫韓馥竊奪其州矯刻金玉以為印璽每有所下輒皂囊施檢文稱詔書昔亡新僭侈漸以即真觀紹所擬將必階亂紹罪五也紹令星工伺望祥妖賂遺財貨與共飲食剋會期日攻鈔郡縣此豈大臣所當施為紹罪六也紹與故虎牙都尉劉勳首共造兵勳降服張楊纍有功效而以小忿枉加酷害信用讒慝濟其無道紹罪七也故上谷太守高焉故甘陵相姚貢紹以貪婪橫責其錢錢不備畢二人并命紹罪八也春秋之義子以母貴紹母親為傅婢地實微賤據職高重享福豐隆有苟進之志無虛退之心紹罪九也又長沙太守孫堅前領豫州剌史遂能驅走董卓掃除陵廟忠勤王室其功莫大紹遣小將盜居其位斷絶堅糧不得深入使董卓久不服誅紹罪十也昔姬周政弱王道陵遲天子遷徙諸侯背畔故齊桓立柯會之盟晉文為踐土之會伐荊楚以致菁茅誅曹衛以彰無禮臣雖闒茸名非先賢蒙被朝恩負荷重任職在鈇鉞奉辭伐罪輒與諸將州郡共討紹等若大事克捷罪人斯得庶續桓文忠誠之效見後漢公孫瓚傳瓚乃上疏與袁紹書趙太僕以周召之德銜命來征宣揚朝恩示以和睦曠若開雲見日何喜如之昔賈復寇恂亦爭士卒欲相危害遇光武之寬親俱陛見同輿共出時人以為榮自省邊鄙得與將軍共同此福此誠將軍之眷而瓚之幸也見魏志袁紹傳注趙太僕以周邵之德銜命來征宣揚朝恩示以和睦曠若開雲見日何喜如之昔賈復寇恂爭相危害遇世祖解紛遂同輿并出釁難既釋時人美之自惟邊鄙得與將軍共同斯好此誠將軍之羞而瓚之願也見後漢袁紹傳瓚因此以書譬紹與英雄記小異今并録之遣行人文則齎書告子續袁氏之攻似若神鬼鼓甲鳴于地中梯衝舞吾樓上日窮月踧無所聊賴汝當碎首于張燕速致輕騎到者當起烽火于北吾當從內出不然吾亡之後天下雖廣汝欲求安足之地其可得乎見魏志公孫瓚傳注引典略又引獻帝春秋昔周末喪亂僵尸蔽地以意而推猶為否也不圖今日親當其鋒袁氏之攻狀若鬼神梯衝舞吾樓上鼓角鳴于地中日窮月急不遑啓處鳥厄歸人滀水陵高汝當碎首于張燕馳驟以告急父子天性不言而動且厲五千鐵騎于北隰之中起火為應吾當自內出奮揚威武決命于斯不然吾亡之後天下雖廣不容汝足矣見後漢公孫瓚傳注引獻帝春秋與袁術書議立劉虞為帝帝非孝靈子欲依絳灌誅廢少主迎立代王故事虞功德治行華夏少二當今公室枝屬皆莫能及昔光武去定王五世以大司馬令河北耿弇馮異勸即尊號卒代更始今劉公自恭王枝別其數亦五以大司馬領幽州牧此其與光武同讖云神人將在燕分濟陰男子王定得玉印文曰虞為天子又見兩日出于代郡謂虞當代立并見魏志公孫瓚傳注引吳書詐作京師三公移書州郡陳董卓罪惡見逼迫無以自救企望義兵解國患難見魏志武紀注引英雄記上書獻帝臣本當迎大駕知曹操忠孝奉迎都許臣前與操交兵今操保傳陛下臣為外將欲以兵自隨恐有嫌疑是以待罪徐州進退未敢自寧見魏志呂布傳注引英雄記答曹公布獲罪之人分為誅首手命慰勞厚見褎獎重見購捕袁術等詔書布當以命為效見魏志呂布傳注引英雄記與韓暹楊奉書二將軍拔大駕來東有元功于國當書勳竹帛萬世不朽今袁術造逆當共誅討奈何與賊臣還共伐布布有殺董之功與二將軍俱為功臣可因今共擊破術建功于天下此時不可失也見魏志呂布傳注引九州春秋二將軍親扶大駕而布手殺董卓俱立功名當垂竹帛今袁術造逆宜共誅討奈何與賊還來伐布可因今者同力破術為國除害建功天下此時不可失也見後漢呂布傳留書與袁術足下恃軍強盛常言猛將武士欲相吞滅每抑止之耳布雖無勇虎步淮南一時之間足下鼠竄壽春無出頭者猛將武士為悉何在足下喜為大言以誣天下天下之人安可盡誣古者兵交使在其間造策者非布先唱也相去不遠可復相聞見魏志呂布傳注引英雄記與琅邪相蕭建書天下舉兵本以誅董卓耳布殺卓來詣關東欲求兵西迎大駕光復洛京諸將自還相攻莫肯念國布五原人也去徐州五千餘里乃在天西北角今不來共爭天東南之地莒與不邳相去不遠宜當共通君如自遂以為郡郡作帝縣縣自王也昔樂毅攻齊呼吸下齊七十餘城唯莒即墨二城不下所以然者中有田單故也布雖非樂毅君亦非田單可取布書與智者詳共議之見魏志呂布傳注引英雄記表劾裴茂之茂之擅出囚徒疑有姦故宜置于理見袁宏後漢紀二十七又後漢董卓傳末句作請收之説袁紹襲許與公爭天下者曹操也操今東擊劉備兵連未可卒解今舉軍而襲其後可一往而定兵以幾動斯其時也見後漢袁紹傳諫攻許曹操既破劉備則許下非復空虛且操善用兵變化無方衆雖少未可輕也今不如久持之將軍據山河之固擁四州之衆外結英雄內修農戰然後簡其精鋭分為奇兵乘虛迭出以擾河南救右則擊其左救左則擊其右使敵疲於奔命人不得安業我未勞而彼已困不及三年可坐剋也今釋廟勝之策而決成敗于一戰若不如志悔無及也見後漢袁紹傳又見魏志袁紹傳少首二語説袁紹將軍弱冠登朝播名海內值廢立之際則忠義憤發卓雖凶暴弗能加兵昔相如叱秦晏嬰哭莊方之將軍曷足以喻單騎出奔則卓懷怖懼濟河而北則渤海稽首擁一郡之卒撮冀州之衆威震河朔名重天下雖黃巾猾亂黑山跋扈舉軍東向則青州可定還討黑山則張燕可滅回師北首則劉虞必喪震脅戎狄則胸奴順從橫大河之北合四川之地收英雄之用擁百萬之衆迎大駕于長安復宗廟于洛邑號令天下以討未服以此爭鋒誰敢禦之比及數年此功不難見袁宏後漢紀二十六又見後漢袁紹傳魏志袁紹傳皆有刪節説袁紹迎天子都鄴將軍纍葉輔弼世濟忠義今朝廷播越宗廟毀壞觀諸州郡外託義兵內圖相滅未有存恤民者且今州城粗定宜迎大駕安宮鄴都挾天子而令諸侯蓄士馬以討不庭誰能禦之見後漢袁紹傳注引獻帝傳又見後漢袁紹傳又袁宏後漢紀二十八諫袁紹出長子談為青州世稱一兔走衢萬人逐之一人獲之貪者悉止分定故也且年均以賢德均以卜古之制也願上惟先代成敗之戒下思逐兔分定之義見魏志袁紹傳注引九州春秋又見後漢袁紹傳又袁宏後漢紀二十九諫南師師出歷年百姓疲弊倉廩無積賦役方殷此國之深憂也宜先遣使獻捷天子務農逸民若不得通表曹氏隔我王路然後進屯黎陽漸營河南益作舟船繕治器械分遣精騎鈔其邊鄙令彼不得安我取其逸三年之中事可坐定也見魏志袁紹傳注引獻帝傳見後漢袁紹傳袁宏後漢紀二十九蓋救亂誅暴謂之義兵恃衆憑強謂之驕兵兵義無敵驕者先滅曹氏迎天子安宮許都今舉師南向于義則違且廟勝之策不在強弱曹氏法令既行士卒精練非公孫瓚坐受圍者也今棄萬全之術而興無名之兵竊為公懼之同上諫濟河勝負變化不可不詳今宜留屯延津分兵官渡若其克獲還迎不晚設其有難衆弗可還見魏志袁紹傳注引獻帝傳獻書袁談配聞良藥苦口而利于病忠言逆耳而便于行願將軍祓心抑怒終省愚辭蓋春秋之義國君死社稷忠臣死王命苟有圖危宗廟敗亂國家王網典津親疏一也是以周公垂泣而斃管蔡之獄季友歔欷而行針叔之鴆何則義重人輕事不得已也昔衛靈公廢蒯瞶而立輒蒯瞶為不道入戚以篡衛師伐之春秋傳曰以石曼姑之義為可以拒之是以蒯瞶終獲叛逆之罪而曼姑之享忠臣之名父子猶然豈況兄弟乎昔先公廢絀將軍以續賢兄立我將軍以為適嗣上告祖靈下書譜諜先公謂將軍為兄子將軍謂先公為叔父海內遠近誰不備聞且先公即世之日我將軍斬衰居廬而將軍齋于堊室出入之分于斯益明是時凶臣逢紀妄畫蛇足曲辭諂媚交亂懿親我將軍奮赫然之怒誅不旋時將軍亦奉命承旨加以淫刑自是以後雍疽破潰骨肉無絲髮之嫌自疑之臣皆保生全之福故悉遣強胡簡命名將料整器械選擇戰士殫府庫之財竭食士之實其所以供奉將軍何求而不備君臣相率共衛旌麾戰為雁行賦為幣主雖傾倉覆庫翦剝民物上下欣戴莫敢告勞何則推戀戀忠赤之情盡家家肝腦之計脣齒輔車不相為賜謂為將軍心合意同混齊一體必當并威偶勢禦寇寧家何圖凶險讒慝之人造飾無端誘導姦利至令將軍翻然改圖忘孝友之仁聽豺狼之謀誣先公廢立之言違近者在喪之位悖網紀之理不顧逆順之節橫易冀州之主欲當先公之繼遂放兵鈔撥屠城殺吏交尸盈原裸民滿野或有髡剃髮膚割截支體冤魂痛于幽冥創痍號于草棘又乃圖獲鄴城許賜秦胡財物婦女豫有分界或云告令吏士云孤雖有老母輒使身體完具而已聞此言者莫不驚愕失氣悼心揮涕使太夫人憂哀憤悶于堂室我州君臣士友假寐悲歎無所措其手足念欲靜師拱默以聽執事之圖則懼違春秋死命之節貽太夫人不測之患隕先公高世業且三軍憤慨人懷私怒我將軍辭不獲已以館陶之役是時外為禦難內實乞罪既不見赦而徒屬各二三其心臨陳叛戾我將軍進退無功首尾受敵引軍奔避不敢告辭亦謂將軍當少垂親親之仁貺以緩追之惠而乃尋蹤躡軌無所逃命困獸必鬭以干嚴行而將軍師旅士崩瓦解此非人力乃天意也是後又堂將軍改往修來克已復禮追還孔懷如初之愛而縱情肆怒趣破家門企踵鶴立連結外讎散鋒放火播增毒螫烽煙相望涉血千里遺城厄民引領悲怨雖欲勿救惡得已哉故遂引軍東轅保正疆埸雖近郊壘未侵境域然望旌麾能不永歎伏惟將軍至孝蒸蒸發于岐嶷友于之性生于自然章之以聰明行之以敏達覽古今之舉措覩興敗之徵符輕榮財之于冀土貴名位于正嶽何意奄然迷沈墮賢哲之操積怨肆忿取破家之禍翹企延頸待望讎敵委慈親于虎狼之牙以逞一朝之志豈一痛哉配等備先公家臣奉廢立之命而圖等于國家禮有常刑故奮弊州之賦以除將軍之疾若乃天啓于心早行其誅則我將軍匍匐悲號于將軍股掌之上配等亦袒躬布體以待斧鉞之刑若必不悛有以國斃圖頭不縣軍不旋踵願將軍詳度事宜錫以環玦見魏志袁紹傳注引漢晉春秋又後漢袁紹傳各有刪節今合録之
