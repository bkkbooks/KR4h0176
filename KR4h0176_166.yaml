body:
  text: 劉熙釋名序熙以為自古造化制器立象有物以來迄于近代或典禮所制或出自民庶名號雅俗各方名殊聖人于時就而弗改以成其器著于既往哲夫巧士以為之名故興于其用而不易其舊所以崇易簡省事功也夫名之于實各有義類百姓日用而不知其所以之意故撰天地陰陽四時邦國都鄙車服喪紀下及民庶應用之器論敘指歸謂之釋名凡二十七篇至于事類未能究備凡所不載亦欲智者以類求之博物君子其于答難解惑王父幼孫朝夕侍問以塞可謂之士聊可省諸見釋名宋本與秦宓書貧賤困苦亦何時可以終身卞和衒玉以耀世宜一來與州尊相見見蜀志秦宓傳與王商書文休倜儻瑰瑋有當世之具足下當以為指南見蜀志許靖傳靖字文休春秋釋例序漢興博物洽聞著述之士前有司馬遷揚雄劉歆後有鄭衆賈逵班固近即馬融鄭玄其所著作違義正者遷尢多纍舉一兩事以言之史記不識畢公文王之子而言與周同姓揚雄著法言不識六十四卦云所從來尚矣見御覽六百十八與劉恭嗣書黃旗紫蓋恆見東南終成天下者揚州之君乎見文選謝元暉始出尚書省詩陸倕石闕銘注誡子書聞汝充役室如懸磬何以自辨論德則吾薄說居則吾貧勿以薄而志不壯貧而行不高也見藝文類聚二十三上表漢帝孫策驍雄與項籍相似宜加貴寵召還京邑若被詔不得不還若放于外必作世患見吳志孫討逆傳注引江表傳奏劾吳碩碩以瓦器奉職天臺不思先公而務私家背奧媚竈苟諂大臣昔孔子誅少正卯以顯刑戮碩宜放肆以懲姦僞若久舍不黜必縱其邪惑傷害忠正為患不細見袁宏後漢紀二十七奏記曹公辭賜絹穀東曹掾田疇言前以無功橫被封賞之賜以實自歸教從所執昨到下車絹三千匹穀五千斛驚愕怪懼未敢自寧乞還藏府以為軍儲見御覽與弟圄書固今年五十七鬢髮已白所為容身而遊滿腹而去周觀天下獨未見益州耳昔嚴夫子嘗言經有五涉其四州有九遊其八欲類此子矣見水經江水注一報孫權移書有德見歸無德見叛不應復還見吳志孫權傳注引江表傳瓌材枕賦有卓爾之殊瓌超詭異以邈絶且其材色也如藝之黃其為香也如蘭之芳其文彩也如霜地而金莖紫葉而紅榮有若蒲陶之蔓延或如兔絲之煩縈有若喜禾之垂穎又似靈芝之吐英其似木者有類桂枝之闌干或象灌木之叢生其似鳥者若驚鶴之徑逝或類鴻鶤之上征有若孤雌之無味或效鴛鴦之交頸紛雲興而氣蒸般星羅而流精何衆文之冏朗灼倏爚而發明曲有所方事有所成每則異姿動各殊名衆夥不可殫形制為方枕四角正端會緻密固絶際無閒形妍體法既麗且間高卑得適辟堅每安不屑珠碧之飾助不煩錐鋒之鐫鏤無丹漆之彤朱罔觿象之佐副較程形而靈露真衆妙該而悉備圭璋特達璵璠富也美梓逡巡不敢與竝相思庶幾晞風于未列神龍之姿衆鱗相絶昔詩人稱角枕之粲季世加以錦繡之飾皆比集異物費日勞力傷用害民有損于德豈如茲瓌既剖既斫斯須速成一材而已莫與混并纖微無加而美曄春榮見藝文類聚七十御覽七百七為孫會稽責袁術僭號書蓋上天垂司過之星聖王建敢諫之鼓設非謬之備急針闕之言何哉凡有所長必有所短也去冬傳有大計無不悚懼旋知供備頁獻萬夫解惑頃聞建議復欲追遵前圖即事之期便有定月益使撫然想是流妄設其必爾民何望乎曩日之舉義兵也天下之士所以響應者董卓擅廢置害太后弘農王略蒸宮人發掘園陵暴逆至此故諸州郡雄豪聞聲慕義神武外振卓遂內殲元惡既斃幼主東顧俾保傳宣命欲令諸軍振旅于河北通謀黑山曹操放毒東齊劉表稱亂南荊公孫瓚炮烋北幽劉繇決力江滸劉備爭盟淮隅是以未獲承備弓戢戈也今備繇既破操等飢餒謂當與天下合謀以誅醜類捨而不圖有自取之志非海內所望一也昔成湯化桀稱有夏多罪武王伐紂日殷有罪罰重哉此二王者雖有聖德宜當君世如使不遭其時亦無由興矣幼主非有惡于天下徒以春秋尚少脅于彊臣若無過而奪之懼未合于湯武之事二也卓雖狂狡至廢主自與亦猶未也而天下聞其桀虐攘臂同心而疾之以中土希戰之兵當邊地徑悍之虜所以斯須游魂也今四方之人皆玩敵而便戰鬭矣可得而勝者以彼亂而我治彼逆而我順也見當世之紛若欲大舉以臨之適足取禍三也天下神器不可虛干必須天贊與人力也殷湯有白鳩之祥周武有赤鳥之瑞漢高有星聚之符世祖有神光之徵皆因民困悴于桀紂之政毒苦于秦莽之役故能芟去無道致成其志今天下非患于幼主未見命之應驗而欲一旦卒然登即尊號未之或有四也天子之貴四海之富誰不欲焉義不可勢不得耳陳勝項籍王莽公孫述之徒皆南面稱孤莫之能濟帝王之位不可橫冀五也幼主岐嶷若除其逼去其鯁必成中興之業夫致主于周成之盛自受旦奭之美此誠所望于尊明也縱使幼主有他改異猶望推宗室之譜屬論近親之賢良以紹劉統以固漢宗皆所以書功金石圖形丹青流慶無窮垂聲管絃捨而不為為其難者想明明之素必所不忍六也五世為相權之重勢之盛天下莫得而比焉忠貞者必曰宜夙夜思惟所以扶國家之躓頓念社稷之危殆以奉祖之志以報漢室之恩其忽履道之節而彊進取之欲者將日天下之人非家吏則門生也孰不從我四方之敵非吾匹則吾役也誰能違我盍乘纍世之勢起而取之哉二者殊數不可不詳察者也所貴于聖哲者以其審于機宜慎于舉措若難圖之事難保之勢以激群敵之氣以先衆人之心公義既不可私計又不利明哲不處八也世人多惑于圖緯而牽非類比合文字以悅所事苟以阿上惑衆終有後悔者自往迄今未嘗無之不可不深擇而熟思也九也尊明所見之餘耳庶備起豫補所遺忘忠言逆耳幸留神聽見吳志孫討逆傳注引吳録策使張紘為書又引典略云張昭之辭袁宏後漢紀亦作張昭裴松之曰此書必紘所作董卓無道陵虐王室禍加太后暴及弘農天子播越宮廟焚毀是以豪傑發憤沛然俱起元惡既斃幼主東顧乃使王人奉命宣明朝恩偃武修文與之更始而河北異謀于黑山曹操毒被于東徐劉表僭亂于南荊公孫叛逆于朔北五禮阻兵玄德爭盟是以未獲從命弓戢戈也嘗謂使君與國同規而舍是弗恤完然有自取之志懼非海內企望之意也成湯討桀稱有夏多罪武王伐紂曰殷有重罰此二王者雖有聖德假使時無失道之過無由逼而取也今主上非有惡于天下徒以幼小脅于彊臣異于湯武之時也又聞幼主明智聰敏有夙成之德天下雖未被其恩咸歸心焉若輔而興之則旦奭之美率土所望也使君五世相承為漢宰輔榮寵之盛莫與為比宜效忠守節以報王室時人多惑圖緯之言妄牽非類之文苟以悅主為美不顧成敗之計今古所慎可不孰慮忠言逆耳駮議致憎苟有益于尊明無所敢辭見後漢袁術傳又見袁宏後漢紀二十九與孔融書虞仲翔前頗為論所侵美寶為質雕摩益光不足以損見吳志虞翻傳臨困授子靖留箋自古有國有家者咸欲修德政以比隆盛世至于其治多不馨香非無忠臣賢佐暗于治體也由主不勝其情弗能用耳夫人情憚難而趣易好同而惡異與治道相反傳曰從善如登從惡如崩言善之難也人君承奕世之基據自然之勢操八柄之威甘易同之歡無假取於人而忠臣挾難進之術吐逆耳之言其不合也不亦宜乎離則有釁巧辨緣閒眩於小忠戀于恩愛賢愚雜錯長幼失敘其所由來情亂之也故明君悟之求賢如饑渴受諫而不厭抑情損欲以義割恩上無偏謬之授下無希冀之望宜加三思含垢藏疾以成仁覆之大見吳志張紘傳瓌材枕針彧彧其文馥馥其芬出自幽阻升于氈茵允瓌允麗惟淑惟珍安安文枕二彼辨冠冠御于晝枕式于昏代作充用榮己寧身興寢有節適性和神見藝文類聚七十又略見北堂書鈔一百三十四作銘
