body:
  text: 仲長統昌言上德教者人君之常任也而刑罰為之佐助焉古之聖帝明王所以能親百姓訓五品和萬邦蕃黎民召天地之嘉應降鬼神之吉靈者實德是為而非刑之攸致也至于革命之期運非征伐用兵則不能定其業姦宄之成群非嚴刑峻法則不能破其黨時勢不同所用之數亦宜異也教化以禮義為宗禮義以典籍為本常道行于百世權宜用于一時高辛已往則聞其人不見其書唐虞夏殷則見其書不詳其事周氏已來載籍具矣所不可得而易者也故制不足則引之無所至禮無等則用之不可依法無常則網羅當道路教不明則士民無所信引之無所至則難以致治用之不可依則無所取正網羅當道路則不可得而避士民無所信則其志不知所定非治理之道也誠令方來之作禮簡而易用儀省而易行法明而易知教約而易從篇章既著勿復刊剟儀故既定勿復變易而人主臨之以至公行之以至仁一德于恆久先之用已身又使通治亂之大體總綱紀而為輔佐知稼穡之艱難者親民事而布惠利政不分于外戚之家權不入不宦豎之門下無侵民之吏京師無佞邪之臣則天神可降地祗可出大治之後有易亂之民者安寧無故邪心起也大亂之後有易治之勢者創艾禍災樂生全也刑繁而亂益甚者法難勝避苟免而無恥也教興而罰罕用者仁義相厲廉恥成也任循吏于大亂之會必有恃仁恩之敗用酷吏于清治之世必有殺良民之殘此其大數也篇名缺我有公心焉則士民不敢念其私矣我有平心焉則士民不敢行其險矣我有儉心焉則士民不敢放其奢矣此躬行之所徵者也開道塗焉起提防焉舍我塗而不由踰提防而橫行逆我政者也誥之而知罪可使悔遏于後矣誥之而不知罪明刑之所取也教有道禁不義而身以先之令德者也身不能先而總略能行之嚴明者也忠仁為上勤以守之其成雖遲君子之德也譎詐以御其下欺其民而取其心雖有立成之功至德之所不貴也見群書治要理亂篇豪傑之當天命者未始有天下之分者也無天下之分故戰爭者競起焉于斯之時並偽假天威矯據方國擁甲兵與我角才智程勇力與我競雌雄不知去就疑誤天下蓋不可數也角知者皆窮角力者皆負形不堪復伉勢不足復校乃始羈首係頸就我之銜紲耳夫或曾為我之尊長矣或曾與我為等儕矣或曾臣虜我矣或曾執囚我矣彼之蔚蔚皆胸詈腹詛幸我之不成而以奮其前志詎肯用此為終死之分邪及繼體之時民心定矣普天之下賴我而得生育由我而得富費安居樂業長養子孫天下宴然皆歸心于我矣豪傑之心既絶士民之志已定貴有常家尊在一人當此之時雖下愚之才居之猶能使恩同天地威侔鬼神暴風疾霆不足以方其怒陽春時雨不足以喻其澤周孔數千無所復角其聖賁育百萬無所復奮其勇矣彼後嗣之愚主見天下莫敢與之違自謂若天地之不可亡也乃奔其私嗜騁其邪欲君臣宣淫上下同惡目極角抵之觀耳窮鄭衛之聲入則耽于婦人而不反出則馳于田獵而不還荒廢庶政棄亡人物澶漫彌流無所底極信任親愛者盡佞諂容説之人也寵貴隆豐者盡后妃姬妾之家也使餓狼守庖廚飢虎牧牢豚遂至熬天下之脂膏斫生人之骨髓怨毒無聊禍亂並起中國擾攘四夷侵叛土崩瓦解一朝而去昔之為我哺乳之子孫者今盡是我飲血之寇讎也至于運徙勢去猶不覺悟者豈非富貴生不仁沈溺致愚疾邪存亡以之迭代政亂從此周復天道常然之大數也又政之為理者取一切而已非能斟酌賢愚之分以開盛衰之數也日不如古彌以遠甚豈不然邪漢興以來相與同為編戶齊民而以財力相君長者世無數焉而清潔之士徒自苦于茨棘之間無所益損于風俗也豪人之室連棟數百膏田滿野奴婢于群徒附萬計船車賈販周于四方廢居積貯滿于都城琦賂寶貨巨室不能容馬牛羊豕山谷不能受妖童美妾填乎綺室倡謳妓樂列乎深堂賓客待見而不敢去車騎交錯而不敢進三牲之肉臭而不可食清醇之酎敗而不可飲睇盼則人從其目之所視喜怒則人隨其心之所慮此皆公侯之廣樂君長之厚實也苟能運智許者則得之焉苟能得之者人不以為罪焉源發而橫流路開而四通矣求士之舍榮樂而居窮苦棄放逸而赴束縛夫誰肯為之者邪夫亂世長而化世短亂世則小人貴寵君子困賤當君子困賤之時局高天蹐厚地猶恐有鎮厭之禍也逮至清世則復入于矯枉過正之檢老者耄矣不能及寬饒之俗少者方壯將復困于衰亂之時是使姦人擅無窮之福利而善士挂不赦之罪辜苟目能辨色耳能辨聲口能辨味體能辨寒溫者將皆以修潔為諱惡設智巧以避之焉況肯有安而樂之者邪斯下世人主一切之愆也昔春秋之時周氏之亂世也逮乎戰國則又甚矣泰政乘并兼之勢放虎狼之心屠裂天下吞食生人暴虐下已已招楚漢用兵之苦甚于戰國之時也漢二百年而遭王莽之亂計其殘夷滅亡之數又復倍乎秦項矣以及今日名都空而不居百里絶而無民者不可勝數此則又甚于亡新之時也悲夫不及五百年大難三起中間之亂尚不數焉變而彌猜下而加酷推此以往可及于盡矣嗟乎不知來世聖人救此之道將何用也又不知天若窮此之數欲何至邪見本傳損益篇作有利于時制有便于物者可為也事有乖于數法有玩于時者可改也故行于古有其迹用于今無其功者不可不變變而不如前易而多所敗者亦不可不復也漢之初興分王子弟委之以士民之命假之以殺生之權于是驕逸自恣志意無厭魚肉百姓以盈其欲報蒸骨血以快其情上有篡叛不軌之姦下有暴亂殘賊之害雖藉親屬之恩蓋源流形勢使之然也降爵削土稍稍割奪卒至于坐食奉祿而已然其汙穢之行淫昏之罪猶尚多焉故淺其根本輕其恩義猶尚假一日之尊收士民之用況專之于國擅之于嗣豈可鞭笞叱吒而使唯我所為者乎時政雕敝風俗移易純朴已去智慧已來出于禮制之防放于嗜欲之域久矣固不可授之以柄假之以資者也是故收其奕世之權校其從橫之勢善者早登否者早去故下土無壅滯之士國朝無專貴之人此變之善可遂行者也井田之變豪人貨殖館舍布于州郡田畝連于方國身無半通青綸之命而竊三辰龍章之服不為編戶一伍之長而有千室名邑之役榮樂過于封君勢力侔于守令財賂自營犯法不坐刺客死士為之投命致使弱力少智之子被穿帷敗寄死不斂冤枉窮困不敢自理雖亦由網禁疏闊蓋分田無限使之然也今欲張太平之紀網立至化之基趾齊民財之豐寡正風俗之奢儉非井田實莫由也此變有所敗而宜復者也肉刑之廢輕重無品下死則得髡鉗下髡鉗則得鞭笞死者不可復生而髡者無傷于人髡笞不足懲中罪安得不至于死哉夫雞狗之攘竊男女之淫奔酒醴之賂遺謬誤之傷害皆非值于死者也殺之則甚重髡之則甚輕不制中刑以稱其罪則法令安得不參差殺生安得不過謬乎今患刑輕之不足以懲惡則假臧貨以成罪託疾病以諱殺科條無所準名實不相應恐非帝王之通法聖人之良制也或曰過刑惡人可也過刑善人豈可復哉曰若前政以來未曾枉害善人者則有罪不死也是為忍于殺人也而不忍于刑人也今令五刑有品輕重有數科條有序名實有正非殺人逆亂鳥獸之行甚重者皆勿殺嗣周氏之祕典續呂侯之祥刑此又宜復之善者也易曰陽一君二臣君子之道也陰二君一臣小人之道也然則寡者為人上者也衆者為人下者也一伍之長才足以長一伍者也一國之君才足以君一國者也天下之王才足以王天下者也愚役于智猶枝之附幹此理天下之常法也制國以分人立政以分事人遠則難綏事總則難了今遠州之縣界或相去數百千里雖多山陵汙澤猶有可居人種穀者焉而諸夏有十畝共桑之迫遠州有曠野不發之田代俗安土有死無去君長不使誰能自往緣邊之地亦可因罪徙人便于守禦當更制其境界使遠者不過二百里明版籍以相數閲審什伍以相連持限夫田以斷并兼定五刑以救死亡益君長以興政理急農桑以豐委積去末作以一本業敦教學以移情性表德行以厲風俗核才藝以敘官宜簡精悍以習師田修武器以存守戰嚴禁令以防僭差信賞罰以驗懲勸糾遊戲以杜姦邪察奇刻以絶煩暴審此十六者以為政務操之有常課之有限安寧勿懈墮有事不迫遽聖人復起不能易也向者天下戶過千萬除其老弱但戶一丁壯則千萬人也遺漏既多又蠻夷戎狄居漢地者尚不在焉丁壯十人之中必有堪為其什伍之長推什長以上則百萬人也又什取之則佐史之才已上十萬人也又十取之則可使在政理之位者萬人也以筋力用者謂之人人求丁壯以才智用者謂之士士貴耆老充此制以用天下之人猶將有儲何嫌乎不足也故物有不求未有無物之歲也士有不用未有少士之世也夫如此而後可以用天性究人理興頓廢屬斷絶網羅遺漏拱押天人矣或曰善為政者欲除煩去苛并官省職為之以無為事之以無事何子之言云云也曰若是三代不足摹聖人未可師也君子用法制而至于化小人用法制而至于亂均是一法制也或以之化或以之亂行之不同也苟使豺狼牧羊豚盜跖主征稅國家昏亂吏人放肆則惡復論損益之間哉夫人待君子然後化理國待蓄積乃無憂患君子非自農桑以求衣食者也蓄積非橫賦斂以取優饒者也奉祿誠厚則割剝貿易之罪乃可絶也蓄積誠多則兵寇水旱之災不足苦也故由其道而得之民不以為奢由其道而取之民不以為勞天災流行開倉庫以稟貸不亦仁乎衣食有餘損靡麗以散施不亦義乎彼君子居位為士民之長固宜重肉纍帛朱輪四馬今反謂薄屋者為高藿食者為清既失天地之性又開虛偽之名使小智居大位庶績不咸熙未必不由此也得拘潔而失才能非立功之實也以廉舉而以貪去非士君子之志也夫選用必取善士善士富者少而貧者多祿不足以供養安能不少營私門乎從而罪之是設機置穽以待天下之君子也盜賊凶荒九州代作飢饉暴至軍旅卒發橫稅弱人割奪吏祿所恃者寡所取者猥萬里懸乏首尾不救徭役並起農桑失業兆民呼嗟于昊天貧窮轉死于溝壑矣今通肥饒之率計稼穡之入令畝收三斛斛取一斗未為甚多一歲之間則有數年之儲雖興非法之役恣奢侈之欲廣愛幸之賜猶未能盡也不循古法規為輕稅及至一方有警一面被災未逮三年校計騫矩坐視戰士之蔬食立望飢殍之滿道如之何為君行此政也二十稅一名之曰貊況三十稅一乎夫薄吏祿以豐軍用緣于秦征諸侯續以四夷漢承其業遂不改更危國亂家此之由也今田無常民民無常居吏食日稟祿班未定可為法制畫一定科租稅十一更賦如舊今者士廣民稀中地未墾雖然猶當限以大家勿令過制其地有草者盡曰官田力堪農事乃聽受之若聽其自取後必為姦也見本傳法誡篇周禮六典冢宰二王而理天下春秋之時諸侯明德者皆一卿為政爰及戰國亦皆然也秦兼天下則置丞相而二之以御史大夫自高帝逮于孝成因而不改多終其身漢之隆盛是惟在焉夫任一人則政專任數人則相倚政專則和諧相倚則違戾和諧則太平之所興也違戾則荒亂之所起也光武皇帝慍數世之失權忿強臣之竊命矯枉過直政不任下雖置三公事歸臺閣自此以來三公之職備員而已然政有不理猶加譴責而權移外戚之家寵被近習之豎親其黨類用其私人內充京師外布列郡顛倒賢愚貿易選舉被駑守境貪殘牧民撓擾百姓忿怒四夷招致乖叛亂離斯瘼怨氣並作陰陽失和三光虧缺怪異數至蟲螟食稼水旱為災此皆戚宦之臣所致然也反以策讓三公至于死免乃足為叫呼倉天號咷泣血者也又中世之選三公也務于清愨謹慎循常習故者是婦女之檢柙鄉曲之常人耳惡足以居斯位邪勢既如彼選又如此而欲望三公勳立于國家績加于生民不亦遠乎昔文帝之于鄧通可謂至愛而猶展申屠喜之志夫見任如此則何患于左右小臣哉至于近世外戚宦豎請託不行意氣不滿立能陷人于不測之禍惡可得彈正之哉曩者任之重而責之輕今者任之輕而責之重昔賈誼感絳侯之困辱因陳大臣廉恥之分開引自裁之端自此以來遂以成俗繼世之主生而見之習其所嘗曾莫之悟鳴呼可悲夫左手據天下之圖右手刎喉愚者猶知難之況明哲君子哉光武奪三公之重至今而加甚不假后黨以權數世而不行蓋親疏之勢異也母后之黨左右之人有此至親之勢故其貴任萬世嘗然之敗無世而無之莫之斯鑒亦可痛矣未若置丞相自總之若委三公則宜分任責成夫使為政者不當與之婚姻婚姻者不當使之為政也如此在位病人舉用失賢百姓不安爭訟不息天地多變人物多妖然後可以分此罪矣或曰政在一人權甚重也曰人實難得何重之嫌昔者霍禹竇憲鄧騭梁冀之徒藉外戚之權管國家之柄及其伏誅以一言之詔詰朝而決何重之畏乎今夫國家漏神明于媟近輸權重于婦黨算十世而為之者八九焉不此之罪而彼之疑何其詭邪見本傳
