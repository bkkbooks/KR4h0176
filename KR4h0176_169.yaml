body:
  text: 仲長統昌言下建旗伐鼓高烽明侯守邊之猛將非中國之良吏和鑾法駕清道而行便辟揖讓諸夏之威儀非夷狄之有也見意林廉隅貞潔者德之令也流逸奔隨者行之汙也風有所從來俗有所由起病其末者刈其本惡其流者塞其源夫男女之際明別其外內遠絕其聲者激厲其廉恥塗塞其虧隙由尚有匈心之逸念睇盼之過視而況開其門導其徑者乎今嫁娶之會捶杖以督之戲謔酒醴以趣之情欲宣淫佚于廣眾之中顯陰私于族親之閒汙風詭俗生淫長姦莫此之甚不可不斷者也見群書治要董賢之于哀帝無骨肉絲髮之親又不能傳其氣類定其繼嗣以丈夫宴接之歡自成膠漆也見意林漢興以來皆引母妻之黨為上將謂之輔政而所賴以治理者甚少而所坐以危亡者甚眾妙采于萬夫之望其良猶未可得而遇也況欲求之兆妾之黨取之于驕盈之家徼天幸以自獲其人者哉夫以丈夫之智猶不能久處公正長思利害耽榮樂寵死而後已又況愚人之愚而望其遵巡正路謙虛節儉深圖遠慮為國家校計者乎故其欲關豫朝政愜快私願是乃理之自然也昔趙綰不奏事于太后而受不測之罪王章陳日蝕之變而取背叛之誅夫二后不甚名為無道之婦人猶尚如此又況呂后飛燕傳昭儀之等乎夫母之于我尊且親于其私親亦若我父之欲厚其父兄子弟也妻之于我愛且媟于其私親亦若我之欲厚我父兄子弟也我之欲盡孝順于慈母無所擇事矣我之欲效恩情于愛妻妾亦無所擇力矣而所求于我者使非我有四體之勞苦肌膚之疾病也夫以此欬唾盼睇之閒至易也誰能違此者乎唯不世之主抱獨斷絕異之明有堅剛不移之氣然後可庶幾其不陷沒流淪耳見群書治要景帝顯位刺史者皆是宦臣子弟猶如豺狼守肉鬼魅侍疾見意林日在天之內在人之外見意林宦豎者傳言給使之臣也拚埽是為超走是供傅近房臥之內交錯婦人之閒又亦實刑者之所宜也天文宦者四星在帝坐傍而周禮有其官職至于武皇游宴後庭置中書之官領受軍事孝宣之世則以弘恭為中書令石顯為僕射中宗嚴明二豎不敢容錯其姦心也後暨孝元常抱病而留好于音樂悉以樞機委之石顯則昏迷霧亂之政起而仇忠害正之禍成矣鳴呼父子之閒相監至近而明闇之分若此豈不良足悲邪孝桓皇帝起自蠡吾而登至尊侯覽張讓之等以亂承亂政令多門權利竝作迷荒帝主濁亂海內高命士惡其如此直言正諭與相摩切被誣見陷謂之黨人靈皇帝登自解犢以繼孝桓中常侍曹節侯覽等造為維綱帝終不寤寵之日隆唯其所言無求不得凡貪淫放縱僭淩橫恣撓亂內外螫噬民化隆自順桓之時盛極孝靈之世前後五十餘年天下亦何緣得不破壞邪古之聖人立禮垂典使子孫少在師保不令處于婦女小人之間蓋猶見此之良審也見群書治要和神氣懲思慮避風溼節飲食適嗜欲此壽考之方也不幸而有疾則鍼石湯藥之之所去也肅禮容居中正康道德履仁義敬天地恪宗廟此吉祥之術也不幸而有災則克己責躬之所復也然而有禱祈之禮史巫之事者盡中正竭精誠也下世其本而為姦邪之階于是淫厲亂神之禮興焉侜張變怪之言起焉丹書厭勝之物作焉故常俗忌諱可笑事時世之所遂往而通人所深疾也且夫堀地九仞以取水鑿山百步以攻金入林伐木不卜日適野刈草不擇時及其搆而居之制而用之則疑其吉凶不亦迷乎簡郊祉慢祖禰逆時令背大順而反求福祐于不祥之物取信誠于愚惑之人不亦誤乎彼圖家畫舍轉局指天者不能自使室家滑利子孫貴富而望其能致之干我不亦惑乎今有嚴禁于下而上不去非教化之法也諸厭勝之物非禮之祭皆所宜急除者也情無所止禮為之儉欲無所齊法為之防越禮宜貶踰法宜刑先王之所以紀綱人物也若不制此二者人情之縱橫馳騁誰能度其所極者哉表正則影直範端則器良行行之于上禁之于下非元首之教也君臣士民竝順私心又大亂之道也頃皇子皇女有夭折年未及殤爵加王主之號葬從成人之禮非也及下殤以上已有國邑之名雖不合古制行之可也王侯者所與共受氣于祖考幹合而枝分者也性類純美臭味芬香孰有加此乎然而生長于驕溢之處自恣于色樂之中不聞典籍之法言不因師傅之良教故使其心同于夷狄其行比于禽獸也長幼相效子孫相襲家以為風世以為俗故姓族之殷不與王侯婚者不以其五品不和睦閨門不潔盛邪所貴于善者以其有禮義也所賤于惡者以其有罪過也今以所貴者教民以所賤者教親不亦悖乎可令王侯子弟悉入大學廣之以他山肅之以二物則腥臊之汙可除而芬芳之風可發矣見群書治要有天下者莫不君之以王而治之以道道有大中所以為貴也又何慕于空言高論難行之術哉今為宮室者崇臺數十層長階十百仞延袤臨浮雲上樹九大旗珠玉翡翠以為飾連幃為城搆帳為宮起臺榭則高數十百尺璧帶加珠玉之物木土被綈錦之飾不見夫之女子成市于宮中未曾御之婦人生幽于山陵繼體之君誠欲行道雖父之所興可有所壞者也雖父之美人可有所嫁者也至若門庭足以容朝賀之會同公堂足以陳千人之坐席臺榭足以覽都民之有無防闥足以殊五等之尊卑宇殿高顯敞而不加以雕采之巧錯塗之飾是自其中也苑囿池沼百里而還使芻蕘雉菟者得時往焉隨農郄而講事因田狩以教戰上虔郊廟下虞賓客是又自其中也嫡庶之數使從周制妾之無子與希幸者以時出之均齊恩施以廣子姓使令之人取足相供時其上下通其隔曠是又自然其中也在位之人有乘柴馬弊車者矣食菽藿者矣有親飲食之蒸烹者矣有過客不敢沽酒市脯者矣有妻子不到官舍者矣有還奉祿者矣有辭爵賞者矣莫不稱述以為清邵非不清邵而不可以言中也好節之士有遇君子而不食其食者矣有妻子凍餒而不納善人之施者矣有茅茨蒿屏而上漏下溼者矣有窮居僻處求而不可得見者矣莫不歎美以為高潔此非不高潔而不可以言中也夫世之所以高此者亦有由然先古之制休廢時王之政不平直正不行詐偽獨售于是世俗同共知節義之難復持也乃舍正從邪背道而馳姦彼獨能介然不為故見貴也如使王度昭明祿除從古服章不中法則詰之以典制貨財不及禮則閒之以志故向所稱以清邵者將欲何矯哉向所歎云高潔者將以何厲哉故人主能使違時詭俗之行無所復剴摩困若難為之約無所復激切步驟乎平夷之塗偃息乎大中之居人享其宜物安其所然後足以稱賢聖之王公中和人君子矣見群書治要古者君之于臣無不荅拜也雖王者有變不必相因猶宜存其大者御史大夫三公之列也今不為起非也為太子時太傅即位之後宜常答其拜少傅可比三公為之起周禮主為三公六卿錫衰為諸侯緦衰為大夫士疑衰及于其病時皆自問焉古禮雖難悉奉行師傅三公所不宜闕者也凡在京師大夫以上疾者可遣使修賜問之恩州牧郡守遠者其死然後有弔贈之禮也坐而論道謂之三公作而行之謂之士大夫論道必求高明之士幹事必使良能之人非獨三太三少可與言也凡在列位者皆宜及焉故士不與其言何以知其術之淺深不試之事何以知其能之高下與群臣言議者又非但用觀彼之志行察彼之才能也乃所以自弘天德益聖性也猶十五志學朋友講習自強不息德與年進至于七十然後從心而不踰矩況于不及中規者乎而不自勉也公卿列校侍中尚書皆九州之選也而不與之從容言議諮論古事訪國家正事問四海豪英琢磨珪璧染練金錫何以昭仁心于民物廣令聞于天下哉人主有常不可諫者五焉一曰廢后黜正二曰不節情欲三曰專愛一人四曰寵幸佞諂五曰驕貴外戚廢后黜正覆其國家者也不節情欲伐其性命者也專愛一人絕其繼嗣者也寵幸佞諂壅蔽忠正者也驕貴外戚淆亂政治者也此為疾痛在于膏肓此為傾危比于累卵者也然而人臣破首分形所不能救止也不忌初故仁也以計御情智也以嚴專制禮也豐之以財而勿與之位亦足以為恩也封之以土而勿與之權亦足以為厚也何必友年彌世惑賢亂國然後于我心乃快哉見群書治要人愛我我愛之人憎我我憎之見意林天下士有三俗選士而論族姓閥閱一俗交遊趨富貴之門二俗畏服不接于貴尊三俗天下之士有三可賤慕名而不知實一可賤不敢正是非于富貴二可賤向盛背衰三可賤見意林天下學士有三姦焉實不知詳不言一也竊他人之記以成已說二也受無名者移知者三也見意林知言而不能行謂之疾此疾雖有天醫莫能治也同于我者何必可愛異于我者何必可憎智足以立難成之事能足以圖附者不黨疏者不遺見意林婦人有朝哭良人暮適他士涉歷百庭顏色不愧今公侯之宮卿士之家侍妾數十晝則以醇酒淋其骨髓夜則以房室輸其血氣見意林人之性有山峙淵停者患在不通嚴剛貶絕者患在傷士廣大闊蕩者患在無檢和順恭慎者患在少斷端愨清潔者患在拘狹辯通有辭者患在多言安舒沈重者患在後時好古守經者患在不變見意林疏濯胸臆澡雪腹心使之芬香皓潔白不可汙也見意林道德仁義天性也織之以成其物練之以致其情瑩之以發其光見文選廣絕交論注意林御覽四百三人之事親也不去乎父母之側不倦乎勞辱之事唯父母之所言也唯父母之所欲也于其體之不安則不能寢于其湌之不飽則不能食孜孜為此以沒其身惡有為此人父母而憎之者也人之事君也言無小大無所愆也事無勞逸無所避也其見識知也則不恃恩寵而加敬其見遺忘也則不懷怨恨而加勤安危不貳其志險易不革其心孜孜為此以沒其身惡有為此人君長而憎之者也人之交士也仁愛篤恕謙遜敬讓忠誠發乎內信效著乎外流言無所受受憎無所偏幽闇則攻己之所短會同則述人之所長有負我者我又加厚焉有疑我者我又加信焉患難必相恤利必相及行潛德而不有立潛功而不名孜孜為此以沒其身惡有與此人交而憎之者也故事親而不為親所知是孝未至者也事君而不為君所知是忠未至者也與人交而不為人所知是信義未至者也父母怨咎人不以正已審其不然可違而不報也父母欲與人以官位爵祿而才實不可可違而不從也父母欲為奢泰侈靡以適心快意可違而不許也父母不好學問疾子孫之為之可違而學也父母不好善士惡子孫交之可違而友也士友有患故待己而濟父母不欲其行可違而往也故不可違而違非孝也可違而不違亦非孝也好不違非孝也好違亦非孝也其得義而已也見群書治要昔高祖誅秦項而陟天子之位光武討篡臣而復已亡之漢皆受命之聖主也蕭曹丙魏平勃霍光之等夷諸呂尊大宗廢昌邑而立孝宣經緯國家鎮安社稷一代之名臣也二主數子之所以震威四海布德生民建功立業流名百世者唯人事之盡耳無天道之學焉然則王天下大臣者不待于知天道矣所貴乎用天之道者則指星辰以授民事順四時而興功業其大略也吉凶之祥又何取焉故知天道而無人略者是巫醫卜祝之伍下愚不齒之民也信天道而背人略者是昏亂迷惑之主覆國亡家之臣也問者曰治天下者壹之乎人事抑亦有取諸天道也曰所取于天道者謂四時之宜也所壹于人事者謂治亂之實也周禮之馮相保章其無所用邪曰大備于天人之道耳是非治天下之本也是非理生民之要也曰然則本與要奚所存邪曰王者官人無私唯賢是親勤䘏政事屢省功臣賞錫期于功勞刑罰歸乎罪惡政平民安各得其所則天地將自從我而正矣休祥將自應我而集矣惡物將自舍我而亡矣求其不然乃不可得也王者所官者非親屬則寵幸也所愛者非美色則巧佞也以同異為善惡以喜怒為賞罰取乎麗女怠乎萬機黎民冤枉類殘賊雖五方之兆不失四時之禮斷獄之政不違冬日之期蓍龜積于廟門之中犧牲群于麗碑之間馮相坐臺上而不下祝史伏壇旁而不去猶無益于敗亡也從此言之人事為本天道為末不其然與故審我已善而不復恃乎天道上也疑我未善引天道以自濟者其次也不求諸己而求諸天者下愚之主也令夫王者誠忠心于自省專思慮于治道自省無愆治道不謬則彼嘉物之生休祥之來是我汲井而水出爨竈而火燃者耳何足以為賀者邪故歡于報應喜于珍祥是劣者之私情未可謂大上之公德也見群書治要英辭雨集妙句雲來見意林北堂書鈔一百歎賞類作英才若雨妙句如雲文選沈約宋書謝靈運傳論注作英辭雨下愛相攻命之自然也愜快以志人情之所欲也見意林𠻳舌下泉咽之名曰胎食得道者生六翮于臂長毛羽于腹飛無階之蒼天度無窮之世俗見意林北方寒而其人壽南方暑而其人夭此寒暑之方驗于人者也鈞之蠶也寒而餓之則引日多溫而飽之則日少此寒溫餓飽之為修短驗于物者也見意林御覽八百二十五行氣可以不飢不病吾始者未之信也至于為之者盡乃然矣養性之方若此至約而吾未之能也豈不以心馳于世務思銳于人事哉他人之不能者又必與吾同此疾也昔有明師知不死之道者燕君使人學之不捷而師死燕君怒其使者將加誅焉諫者曰夫所憂者莫過乎死所重者莫急乎生彼自喪其生亦安能令吾君不死也君乃不誅其諫辭則此為良說矣然亦非至當之論使彼有不死之方若吾所聞行氣之法則彼說師之死者未必不知道也直不能棄世事而為之故雖知之而無益耳非無不死之法者也見枹朴子內篇至理河南密縣有卜成者學道經久乃與家人辭去其始步稍高遂入雲中不復見此所謂舉形輕飛白日昇天仙之上者也見枹朴子內篇至理薊子訓不知何郡人到陳公舍自云今日當死陳公與之一著單衣入室寢日中果死見御覽六百九十一魏王所集方士名上黨王真隴西封君達甘陵甘始魯女生譙國華佗字元化東郭延年唐霅冷壽光河南卜式張貂薊子訓汝南費長房鮮奴辜魏國軍吏河南趙聖卿陽城郄儉字孟節廬江左慈字元放右十六人魏文帝東阿王仲長統所說典論又云王仲統云甘始左元放東郭延年行容成御婦人法竝為丞相所錄閒行其術亦得其驗降就道士劉景受雲母九子元方年三百歲莫知所在武帝恆御此藥亦云有驗劉德治淮南王獄得枕中鴻寶秘書及子向咸共奇之信黃白之道可成謂神仙之道可致卒亦無驗乃以罹罪也見博物志五案此二條出典論又與子建相亂非皆昌言原文故附載焉自𠻳舌下泉以下當同在一篇湯契後秦益後益即皋陶子也見意林案此已下依本傳治要意林寫出不紊仲長子原次已下各書引見于原次無考依各書先後錄之使居有良田廣宅背山臨流溝池環帀竹木周布場圃築前果園樹後舟車足以代步涉之難使令足以息四體之役養親有兼珍之膳妻拏無苦身之勞良朋萃止則陳酒肴以娛之嘉時吉日則烹羔豚以奉之躕躇畦苑遊戲平林濯清水追涼風鈞游鯉弋高鴻諷于舞雩之下詠歸高堂之上安神閨房思老氏之玄虛呼吸精和求至人之仿佛與達者數子論道講書俯仰二儀錯綜人物彈南風之雅操發清霜之妙曲逍遙一世之上睥睨天地之閒不受當時之責永保性命之期如是則可以陵霄漢出宇宙之外矣豈羨夫入帝王之門哉見本傳統常以為凡遊帝王者欲以立身揚名耳而名不常存人生易滅優游偃仰可以自娛欲卜居清曠以樂其志論之曰云云據文選閒居賦注引昌言曰溝池自周竹木自環今此有溝池環帀竹木周布二語知即三十四篇之一疑在自敘篇或當以卜居名篇胡維新兩京遺篇題為樂志論而出之昌言外非也天為之時而我不農穀亦不可得而取之青春生焉時雨降焉始之耕田終之簠簋惰者釜之勤者鍾之矧夫不為而尚乎食也哉見齊民要術序叢林之下為倉庾之坻魚鱉之堀為耕稼之場者此君長所用心也是以太公封而斥鹵播嘉穀鄭白成而關中無饑年蓋食魚鱉而藪澤之形可見觀草木而肥墝之勢可知見齊民要術序稼穡不修桑果不茂畜產不肥鞭之可也柂落不完垣牆不平埽除不淨笞之可也此督課之方也且天子親耕皇后親蠶況夫田父而懷窳惰乎見齊民要術序鮑魚之肆不自以氣為臭四夷之人不自以食為異生習然也居積習之中見生然之事孰自知也斯何異蓼中之蟲而不知藍之甘乎見齊民要術序宗均為九江守五日一聽事夏以旦冬以中見北堂書鈔未改本三十六清淨公卿大夫莫不先歷三七之官雖有賢才皆級次進官之有級猶階之有等也升階越等其步也亂登朝越等敗禮傷法是以古人之初仕也雖有賢才皆以級賜進焉賈生有言治國取人務在求能故裁國之無利器猶鏤以鉛刀而望其切不亦疏乎見御覽二百三冢宰堯官也見蓺文類聚四十五御覽二百六今人主不思神芝朱草甘露零醴泉涌而患枇杷荔枝之腐亦鄙甚矣見蓺文類聚八十七白孔六帖一百御覽九百七十一枇杷又荔枝漢安帝時有異物生于長樂宮延年廄後東廡柏樹及永巷南園合歡樹議者以為芝草也群臣皆賀受賜見蓺文類聚八十九御覽九百六十笏以書君教令記善刺過今之持版以象焉見初學記二十六御覽六百四十五又六百九十二淑清穆和之氣既宣醇醲之化既浹見文選魏都賦注斧帳翠屏之不坐見文選天台山賦注古之葬者松柏梧桐以識其墳也見文選潘安仁懷舊賦注阮籍詠懷詩注陸機門有車馬客行注古詩驅車上東門注丘遲與陳伯之書注陳琳為袁紹檄豫州注喜怒哀樂好惡謂之六情見文選文賦注乘此風順此流而下走誰復能為此限者哉見文選琴賦注捷疾馳影響人閒也見文選贈白馬王彪詩注築臺起功見文選謝靈運還舊園詩注案此疑有天下者篇約文聞上古之隱士或夫負妻戴以入山澤伏重岫之內窟窮皋之底見文選陶淵明經曲阿詩注張景陽七命注蕩蕩乎若昇天路而不知夫所登也子若昇天路也見文選謝靈運入華子岡詩注曹子建襍詩注與吳季重書注彊者勝弱智者欺愚見文選陸機塘上行注事求絲髮之舋見文選鮑照白頭吟注有軍興之大役焉有凶荒之殺用焉如此則清修潔皎之士固當食荼盬膽枕藉荊棘見文選謝元暉始出尚書省詩注引之以教義見文選任彥昇為卞彬謝脩卞忠貞墓啟注又奏彈劉整注清如冰碧潔如霜露輕賤世俗高立獨步此士之次也見文選曹子建與楊德祖書注節操淩高雲見文選石季倫思歸引序注周禮女巫掌歲時祓除疾病禊者潔也于水上盥潔也已者祉也邪疾已去祈介祉也見文選顏延年曲水詩序注姦慝既弭警蹕清夷見文選顏延年曲水詩序注又王元長曲水詩序注子長班固述作之士見文選王文憲集序注高光二祖之神武遇際會而不能得見文選干令升晉武革命論注為音樂則歌兒舞女千曹而迭起見文選宦者傳論注探心測意世加甚焉見文選演連珠注運籌于几案之前而所制者乃百代之後見文選石闕銘注五位以正方面見文選石闕銘注直道正辭貞亮之節見文選郭林宗碑文注百夫之豪州以千計見文選頭佗寺碑文注以一人之好惡裁萬品之不同見文選頭佗寺碑文注規矩可模者師傅之德也見文選齊安陸王碑文注救患赴急跋涉奔波者憂樂之盡也見文選齊竟陵王行狀注昔秦用商君之法張彌天之網然陳涉大呼于沛澤之中天下饗應人不為用者怨毒結于天下也見長短經政體攻玉以石布以灰見御覽八百二十六
