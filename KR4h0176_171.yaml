body:
  text: 王粲七釋潛虛丈人違世遁俗恬淡清玄渾沌淳朴薄禮愚學無為無欲均同死生混齊榮辱于是大夫聞而歎曰蓋聞君子不以仕易道不以身後時進德修業與世同理今子深藏其身高栖其志外無所營內無所事見藝文類聚五十七道在養志實氣將定其氣莫先五味見書鈔一百四十二凍縹玄酎醴白腐清見書鈔一百四十八霜熊之掌文鹿之茸見書鈔一百四十二黿羹蠵臛見書鈔一百四十二又一百四十四御覽三百六十一作蠙臛晨鳧宿鷃五黃搗珍腸見書鈔一百四十二肴以多品羞以珍名脯鮪桂蠹石夔瓊晶鱉寒鮑熱異和殊馨乃有西旅游梁御宿青粲瓜州紅參糅相半軟滑膏潤入口流散見書鈔一百四十二又一百四十四初學記二十六御覽八百五十邯鄲才女三齊巧士名唱祕舞承間竝理七盤陳于廣庭疇人儼其齊俟揄皓袖以振策竦并足而軒跱邪睨鼓下伉音赴節安翹足以徐擊馺頓身而傾折翩飄微霍亂精蕩神巴渝代起鞞鐸響振見藝文類聚五十七文選文賦注又舞賦注農功既登玄陰戒寒乃致衆庶大獵中原植旌附表班授行曲絙綱連置彌山跨谷流鋒四射畢罕橫厲奮千芟稍繫弛鷹犬以搏噬弦不虛控矢不徒注僵禽連積隕鳥若雨見藝文類聚五十七御覽三百五十麗才美色希世特立豐膚曼肌弱骨纖形鬒髮玄鬢修項秀頸紅顏照曜曄若苕榮戴明中之羽雀離華錜之葳蕤珥照夜之雙璫煥煜以垂暉見書鈔一百三十六藝文類聚五十七揚娥眉而順止見御覽三百六十八聖人在位時邁其德先天弗違稽若古則睿哲文明允恭玄塞登俊乂于壠畝舉賢才才于仄微置彼周行列于邦畿九德咸事百僚師師于是四海之內咸變時雍普天率土比屋可封是以棲林隱谷之夫逸迹放言之士鑒乎有道貧賤是恥見藝文類聚二十七休風偃物淳化玄通見北堂書鈔十聲暨海外同上太廟頌思皇烈祖時邁其德肇啓洪源貽宴我則我休厥成聿先厥道丕明丕欽允時祖考於穆清廟翼嚴休微祁祁髦士厥德允升懷想成位咸奔在宮無思不若永觀厥崇綏庶邦和四宇九功備彝樂序建崇牙設璧羽六拊奏八音舉昭大孝衎妣祖念武功收醇祐見初學記十三靈壽杖頌茲杖靈木以介眉壽奇幹貞正不待矯輮據貞斯直杖之爰茂見藝文類聚六十九正考父讚恂恂正父應德孔盛身為國卿族則公姓年在耆耋三葉聞政誰能不怠申慈約敬饘粥豫口傴僂受命名書金鼎祚及後聖見初學記十七反金人贊君子亮直行不柔辟友賤不恥誨焉是益我能發蹤彼用遠迹一言之賜過乎璵璧末世不敦義與茲易而言匪忠退有其謫見藝文類聚十九難鍾荀太平論聖莫盛于堯而洪水方割丹朱淫虐四族凶佞矣帝堯因之而三苗畔戾矣禹又因而防風為戮矣此三聖古之所大稱也繼踵相承且二百年而刑罰未嘗一世而乏也然則此三聖能平三聖能平則何世能致之乎孔子稱曰唯上智與下愚不移不移者丹朱四凶三苗之謂也當紂之世殷不小大好草竊姦宄周公遷殷頑民于洛邑其下愚之人必有之矣周公之于三聖不能踰也三聖有所不化矣有所不移矣周公之不能化殷之頑民所可知也苟不可移必或犯罪罪而弗刑是失所也犯而刑之刑不可錯矣孟軻有言盡信書不如無書有大而言之者刑錯之屬也豈億兆之民歷數十年而無一人犯罪一物失所哉謂之無者盡信書之謂也見藝文類聚十一爵論依律有奪爵之法此謂古者爵行之時民賜爵則喜奪爵則懼故可以奪賜而法也今爵事廢矣民不知爵者何也奪之民亦不懼賜之民亦不喜是空設文書而無用也今誠循爵則上下不失實而功勞者勸得占之道合漢之法以貨財為賞者不可供以復除為賞者租稅損減以爵為賞者民勸而費省故古人重爵也見藝文類聚五十一爵自一級轉登十級而為列侯譬猶秩自百石轉遷而至于公也而近世賞人者皆不由等級從無爵封列侯原其所以爵廢故也司馬法曰賞不踰時欲民速得為善之利也近世爵廢人有小功無以賞也乃積纍焉須事足乃封侯非所以速為而及時也上觀古高祖封功臣及白起衛鞅皆稍賜爵而五大夫客卿庶長以至于侯非一頓而封也夫稍稍賜爵與功大小相稱而俱登既得其義且侯次有緒使慕進者遂之不倦矣見御覽百九十八儒吏論士同風于朝農同業于野雖官職務殊地氣異宜然其致功成利未有相害而不通者也古者八歲入小學學六甲五方書計之事十五入大學學君臣朝廷王事之紀則文法典藝具存于此矣至乎未世則不然矣執法之吏不窺先王之典搢紳之儒不通律令之要彼刀筆之吏豈生而察刻哉起于几案之下長于官曹之閒無溫裕文雅以自潤雖欲無察刻弗能得矣竹帛之儒豈生而迂緩也起于講堂之上遊于鄉校之中無嚴獸猛斷割以自裁雖欲不迂緩弗能得矣先王見其如此也是以博陳其教輔和民性達其所壅袪其所敝吏服雅訓儒通文法故能寬猛濟剛柔自克也見藝文類聚五十二御覽六百十三三輔論湘潛先生江濱逸老將集論雲夢玄公豫焉先生稱曰蓋聞戒不可動兵不可揚今劉牧建德垂芳名烈既彰矣曷乃稱兵舉衆殘我波靈逸老曰是何言與天生五材金作明威長沙不軌敢作亂違我牧覩其然乃赫爾發憤且上征下戰去暴舉順州牧之兵建拂天之旌鳴振地之鼓玄胄曜日犀甲如堵以此衆戰孰能嬰御劉牧之懿子又未聞乎履道懷智休迹顯光灑掃群虜艾撥穢荒走袁術于西境馘射貢乎武當遏孫堅于漢南追揚定于折商見藝文類聚五十九安身論蓋崇德莫盛乎平安身安身莫大乎存政存政莫重乎無私無私莫深乎寡欲是以君子安其身而後動易其心而後語定其交而後行然則動者吉凶之端也語者榮辱之主也求者利病之幾也行者安危之決也故君子不妄動也必適于道不徒語也必經于理不苟求也必造于義不虛行也必由于正夫然用能免或擊之凶厚自天之佑故身不安則殆言不順則悖交不審則惑行不篤則危四者存乎中則患憂接乎外矣憂患之接必生于自私而興于有欲自私者不能成其私有欲者不能濟其欲理之至也務本論古者之理國也以本為務八政之于民也以食為首是以黎民時雍降福孔皆也故仰司星辰以審其時俯耕籍田以率其力封祀農稷以神其事祈穀報年以寵其功設農師以監之置田畯以董之黍稷茂則喜而受賞田不墾則怒而加罰都不得有游民室不得有懸耜野積踰冬奪者無罪場功過限竊者不刑所以競之于閉藏也先王籍田以力任力以夫議其老幼度其遠近種有常時耘有常節牧有常期此賞罰之本種不當時耘不及節牧不應期者必加其罰苗實踰等必加其賞也農益地辟則吏受大賞也農損地挾則吏受重罰夫火之災人也甚于怠農慎火之力也輕于秬耘通邑大都有嚴令則火稀無嚴令則燒者數非賞罰不能濟也見藝文類聚六十五末世之吏負青幡而布春冬有觀農之名無賞罰之實荊州文學記官志有漢荊州牧曰劉君稽古若時將紹厥績乃稱曰於先王之為世也則象天地軌儀憲極設教導化敘經志業用建雍泮焉立師保焉作為禮樂以作其性表陳載籍以持其志上知所以臨下下知所以事上官不失守民聽無悖然後太階平焉夫文學也者人倫之守大教之本也乃命五業從事宋衷所作文學延朋徒焉宣德音以贊之降嘉禮以勸之五載之閒道化大行耆德故者綦母闔等負書荷器自遠而至者三百有餘人于是童幼猛進武人革面總角佩𩽨委介免胄比肩繼踵川逝泉涌亹亹如也兢兢如也遂訓六經講禮物諧八音協律呂修紀歷理刑法六路咸秩百氏備矣夫易惟談天人神致用故繫稱旨遠辭文言中事隱韋編三絶固哲人之驪淵也書實紀言而詁訓莊昧通乎爾雅則文意曉然故子夏歎書昭昭若日月之明離離如星辰之行言昭灼也詩主言志詁訓周書摛風裁興藻詞譎喻溫柔在誦最稱衰矣禮以立體據事章條纖曲執而後顯採綴生言莫非寶也春秋辨理一字見義五后六鷁以詳備成文雅門兩觀以先後顯旨婉章志晦原已邃矣尚書則覽文如詭而尋理則畼春秋則觀辭立曉而訪義方隱此聖文殊致表裏之異體者也天降純嘏有所底授臻于我君受命既茂南牧是建荊衡作守時邁淳德宣其丕繇厥繇伊何四國交阻乃赫斯威爰整其旅虔夷不若屢戡寇侮誕啓洪軌敦崇聖緒典墳既章禮樂咸舉濟濟搢紳盛茲階宇祁祁髦俊集爰處和化普畼休徵時敘品物宣育百穀繁蕪勳格皇穹聲被四宇見藝文類聚三十八御覽六百八倣連珠臣聞明主之舉也不待近習聖君用人不拘毀譽故呂尚一見而為師陳平烏集而為輔臣聞記功志過君臣之道也不念舊惡賢人之業也是以齊用管仲而霸功立秦任孟明而晉恥雪臣聞振鷺雖材非六翮無以翔四海帝王雖賢非良臣無以濟天下臣聞觀于明鏡則疵瑕不滯于軀聽于直言則過行不纍乎身見藝文類聚五十七蕤賓鐘銘有魏匡國誕成天功砥綏六合纂定庶邦承民靡戾休徵惟同皇命孔昭造茲衡鐘紀之以三平之以六允嘉氣齊允淑表聲韶和民聲以睦時作蕤賓永享遐福無射鐘銘有魏匡國成功允章格于上下光于四方休徵時序人說時康造茲衡鐘有命自皇三以紀之六以平之厥量孔嘉厥齊孔時音聲和協人德同熙聽之無射用以啓期初學記十八硯銘昔在皇頡爰初書契以代結繩民察官理庶績誕興在世季末革藻流淫文不寫行書不盡心淳村澆散俗以崩沈墨運翰藻榮辱是若念茲在茲惟玄是宅見藝文類聚五十八初學記二十一刀銘侍中關內侯臣粲言奉命作刀銘及示以其敘二報誠必朝氏之刀而張常為工矣輒思作銘謹奉陋不足覽相時陰陽制茲利兵和諸色劑考諸濁清灌襞以數質象以呈附反載穎舒中錯形陸剸犀兕水截鯢鯨君子服之式章威靈無日不虞戒不在明見藝文類聚六十文選七命注初學記二十二御覽三百四十六弔夷齊文歲旻秋之仲月從王師以南征濟河津而長驅踰芒阜之崢嶸覽首陽于東隅見孤竹之遺靈心於悒而感懷意惆悵而不平壇宇而遙弔抑悲古之幽情知養老之可歸忘除暴之為念潔已躬以騁志愆聖哲之大倫忘舊惡而希古退採薇以窮居守聖人之清概要既死而不渝厲清風于貪士立果志于懦夫到于今而見稱為作者之表符雖不同于大道合尼父之所譽見藝文類聚三十七
