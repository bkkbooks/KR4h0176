body:
  text: 阮瑀紀征賦仰天民之高衢兮慕在昔之遐軌希篤聖之崇綱兮惟哲而為紀同天工而人代兮匪賢智其能使五材陳而並序靜亂由乎干戈惟蠻荊之作讎符治兵而濟河遂臨河而就濟瞻禹績之茫茫距疆澤以潛流經崑崙之高岡目幽蒙以廣衍遂霑濡而難量見藝文類聚五十九止欲賦夫何淑女之佳麗顏㶷㶷以流光歷千代其無匹超古今而特章執妙年之方盛性聰惠以和良稟純潔之明節後申禮以自防重行義以輕身志高尚乎貞薑豫情説其美麗無須臾而有忘思桃夭之所宜願無衣之同裳懷紆結而不畼兮魂一夕而九翔出房戶以躑躅覩天漢之無津傷匏瓜之無偶悲織女之獨勤還伏枕以求寐庶通夢而交神神惚恍而難遇思交錯以繽紛遂終夜而靡見東方旭以既晨知所思之不得乃抑情以自信見藝文類聚十八佇延首以極視兮意謂是而復非見文選謝宣遠張子房詩注范彥龍贈張稷詩注曹顏遠思友人詩注謝玄暉齊敬皇后哀册文注箏賦惟夫箏之奇妙極五音之幽微苞群聲以作主冠衆樂而為師稟清和于律呂籠絲木以成資身長六尺應律數也故能清者感天濁者合地五聲並用動靜簡易大興小附重發輕隨折而復扶循覆逆開浮沈抑揚升降綺靡殊聲妙巧不識其為平調定均不疾不徐遲速合度君子之衢也慷慨磊落桌礫盤紆壯士之節也曲高和寡妙妓雖工伯牙能琴于茲為朦皎懌翕純庶配其蹤延年新聲豈比能同陳惠李文曷能是逢見藝文類聚四十四初學記十六兩引鸚鵡賦惟翩翩之豔鳥誕嘉類于京都穢夷風而弗處慕聖惠而來徂被坤文之黃色服離光之朱形配秋英以離緑苞天地以耀榮見藝文類聚九十一謝曹公箋一得披玄雲望白日惟力是視敢有二心見文選謝靈運擬魏太子鄴中集詩注為曹公作書與孫權離絶以來于今三年無一日而忘前好亦猶姻媾之義恩情已深違異之恨中間尚淺也孤懷此心君豈同哉每覽古今所由改趣因緣侵辱或起瑕舋心忿意危用成大變若韓信傷心于失楚彭寵積望于無異盧綰嫌畏于已隙英布憂迫于情漏此事之緣也孤與將軍恩如骨肉割授江南不屬本州豈若淮陰捐舊之恨抑遏劉馥相厚益隆寧放朱浮顯露之奏無匿張勝貸故之變匪有陰構賁赫之告固非燕王淮南之舋也而忍絶王命明棄碩交實為佞人所構會也夫似是之言莫不動聽因形設象易為變觀示之以禍難激之以恥辱大丈夫雄心能無憤發昔蘇秦説韓羞以牛後韓王按劍作色而怒雖兵折地割猶不為悔人之情也仁君年壯氣盛緒信所嬖既懼患至兼懷忿恨不能復遠度孤心近慮事勢遂齎見薄之決計秉翻然之成議加劉備相扇揚事結舋連推而行之想畼本心不願于此也孤之薄德位高任重幸蒙國朝將泰之運蕩平天下懷集異類嘉得全功長享其福而姻親坐離厚援生隙常恐海內多以相責以為老夫苞藏禍心陰有鄭武取胡秉之詐乃使仁君翻然自絶以是忿忿懷㘇反側常思除棄小事更申前好二族俱榮流祚後嗣以明雅素中誠之效抱懷數年未得散意昔赤壁之役遭離疫氣燒船自還以避惡地非周瑜水軍所能抑挫也江陵之守物盡榖殫無所復據徙民還師又非瑜之所能敗也荊土本非己分我盡與君冀取其餘非相侵肌膚有所割損也思計此變無傷于孤何必自遂于此不復還之高帝設爵以延田橫光武指河而誓朱鮪君之負纍豈如二子是以至情願聞德音往年在譙新造舟船取足自載以至九江貴欲觀湖漅之形定江濱之民耳非有深入攻戰之計將恐議者大為己榮自謂策得長無西患重以此故未肯回情然智者之慮慮于未形達者所規規于未兆是故子胥知姑蘇之有麋鹿輔果識智伯之為趙禽穆生謝病以免楚難鄒陽北遊不同吳禍此四士者豈聖人哉徒通變思深以微知著耳以君之明觀孤術數量君所據相計土地豈勢才力乏不能遠舉割江之表宴安而已哉甚未然也若恃水戰臨江塞要欲令王師終不得渡亦未必也夫水戰千里情巧萬端越為三軍吳曾不禦漢潛夏陽魏豹不意江河雖廣其長難衛也凡事有宜不得盡言將修舊好而張形勢更無以威脅重敵人然有所恐恐書無益何則往者軍逼而自引還今日在遠而興慰納辭遜意狹謂其力盡適以增驕不足相動但明效古當自圖之耳昔淮南信左吳之策漢隗囂納王元之言彭寵受親吏之計三夫不寤終為世笑梁王不受詭勝竇融斥逐張玄二賢既覺福亦隨之願君少留意焉若能內取子布外擊劉備以效赤心用復前好則江表之任長以相附高位重爵坦然可觀上令聖朝無東顧之榮下令百姓保安全之福君享其榮孤受其利豈不快哉若忽至誠以處僥幸婉彼二人不忍加罪所謂小人之仁大仁之賊大雅之人不肯為此也若憐子布願言俱存亦能傾心去恨順君之情更與從事取其後善但禽劉備亦足為效開設二者審處一焉聞荊楊諸將並得降者皆言交州為君所執豫章距不承執事疫早並行人兵減損各求進軍其言云云孤聞此言未以為説然道路既遠降者難信幸人之災君子不為且又百姓國家之有加懷區區樂欲崇和庶幾明德來見昭副不勞而定于孤益貴是故按兵守次遺書致意古者兵交使在其中願仁君孤虛心回意以應詩人補袞之歎而慎周易牽復之義濯鱗清流飛翼天衢良時在茲勗之而己見文選藝文類聚二十五為曹公與劉備書披懷解帶投分寄意見文選潘嶽金谷集作詩注文質論蓋聞日月麗天可瞻而難附群物著地可見而易制夫遠不可識文之觀也近而易察質之用也文虛質實遠疏近密援之斯至動之應疾兩儀通數固無攸失若乃陽春敷華遇衝風而隕落素葉變秋既究物而定體麗物若偽醜器多牢華璧易碎金鐵難陶故言多方者中難處也術鐃津者要難求也意弘博者情難足也性明察者下難事也通士以四奇高人必有四難之忌且少言辭者政不煩也寡知見者物不擾也專一道者思不散也混濛蔑者民不備也質士以四短違人必有四安之報故曹參相齊寄託獄市欲令姦人有所容立及為宰相飲酒而已故夫安劉氏者周勃正嫡位者周勃大臣木強不至華言孝文上林苑欲拜嗇夫釋之前諫意崇敦朴自是以降其為宰相皆取堅強一學之士安用奇才使變典法見藝文類聚二十二弔伯夷余以王事適彼洛師瞻望首陽敬弔伯夷東海讓國西山食薇重德輕身隱景潛暉求仁得仁報之仲尼沒而不朽身沈名飛見藝文類聚三十七齊都賦齊國實坤德之膏腴而神州之奧府其川瀆則洪河洋洋發源崑崙九流分逝北朝滄淵驚波沛厲浮沫揚奔南望無垠北顧無鄂蒹葭蒼蒼莞菰沃若瑰禽異鳥辟萃朱其間帶華蹈縹披紫垂丹應節往來翕習翩翩靈芝生乎丹石發翠華之煌煌其寶玩則玄蛤抱璣駮蚌含璫見藝文類聚六十一水經河水注一若其大利則海濱博諸溲鹽是鍾皓皓乎若白雪之積鄂鄂乎若景阿之崇見書鈔一百四十六三酒既醇五齊惟醹見書鈔一百四十八青春季月上除之良無大無小祓于水陽見初學記四纖纚細纓薄配蟬翼自尊及卑頃我元服見御覽六百八十六蘭豕臑羔炮鄨膾鯉嘉旨雜遝豐實左右前徹後著惡可悉數見書鈔一百四十二窗櫺參差景納陽軒見文選曹子建贈徐幹詩注構夏殿宏覆起層榭以高驤龍楹螭桷山𡵒雲牆其後宮內庭嬪妾之館衆偉所施極巧窮變然後修龍榜遊洪池折珊瑚破琉日既仄而西舍乃反宮而棲遲歡幸在側便嬖侍隅含清歌以詠志流玄眸而微眄竦長袖以合節紛翩翩其迅王乃乘華玉雷動旌旗虹亂盈乎靈圃之中于是羽族咸興毛群盡起上敝穹庭下被皋藪見藝文類聚六十一御覽三百三十八矢流鏑絓張羅蠶飛鋋抱雄戈見御覽三十九西征賦奉明辟之渥德與遊軫而西伐過京邑以以釋駕觀帝居之舊制伊吾儕之挻力獲載筆而從師無嘉以云補徒荷祿而蒙私并小人之所幸雖身安而心違庶區宇之今定入告成乎后皇登明堂而飲至銘功烈乎帝裳見藝文類聚五十九序征賦余因茲以從邁兮聊畼目乎所經觀庶士之繆殊察風流之濁清沿江浦以左轉涉雲夢之無陂從青冥以極望上連薄乎天維刊梗林以廣塗慎沮洳以高蹊攬循環其萬般互千里之長湄行兼時而易節迄玄氣之消微道蒼神之受謝逼鶉鳥之將栖慮前事之既終亦何為乎久稽乃振旅以復蹤泝朔風而北歸及中區以釋勤超栖遲而無依見藝文類聚五十九哀別賦秣余馬以俟濟兮心儃恨而不盡仰深沈之掩藹兮重增悲以傷情見初學記十八嘉夢賦序昔贏子與其交遊于漢水之上其夜夢見神女見初學記七冠賦纖麗細纓輕配蟬翼尊日元飾貴為首服君子敬慎自強不忒見初學記二十六團扇賦惟合歡之奇扇肇伊之纖素仰明月以取象規圓體之儀度見書鈔一百三十四御覽七百二又八百十四車渠碗賦圜德應規巽從易安大小得宜容如可觀盛彼清醴承以雕盤因歡接口媚于君顏見藝文類聚七十三七喻有逸俗先生者耦耕乎巖石之下栖遲乎窮谷之岫萬物不干其志王公不易其好寂然不動莫之能懼見藝文類聚五十七賓曰大宛之犧三江之魚雲鶬水鵠熊蹯豹胎見藝文類聚五十七書鈔一百四十二引二條若乃日異如飢聊膾美鮮橫者毫折縱者縷分白踰委毒赤過擒丹見書鈔一百四十五引二條南士之粳東湖之菰見初學記二十六豐屋廣夏崇闕百里見文選陸倕石闕銘注連觀飛榭旋室回房見文選魯靈光殿賦注又月賦注黼幬施于宴室華蓐布乎象床懸明珠于長韜燭宵夜而為陽玄鬢擬于雲霧豔色過乎芙蓉揚蛾眉而微睇雖毛施其不當見藝文類聚五十七戰國之際秦儀之徒智略兼人辨利軼軌倜儻挾義觀釁相時圖爵位佩六紱謀貨財則輸海內一怒而諸侯懼安居而天下憩人主見弄于股掌之上而莫之知惡也見御覽四百六十四失題總螭虎之徑卒即矯塗其如夷見書鈔十三暑賦暑景未徂時維六月林鍾紀度祝融司節大火揚光炎氣酷烈沈陽騰射滯暑散越區寓鬱煙物焦人渴煌煌野火燌薄中原翕翕盛熱蒸我層軒溫風淟涊動靜增煩雖託陰宮罔所避證乃灑白汗身如漆點水若流泉粉扇靡效宴戲鮮歡庶望秋節慰我愁歎見藝文類聚五書鈔一百三十五初學記三抑檢賦翳炎夏之白日救隆暑之赫曦見文選潘嶽在懷縣詩注明賦脣實範緑眼惟雙穴雖蜂膺眉鬢梓見書鈔一百五十八案此有脫誤愁思賦何秋之憯悽處寒夜而懷愁風清涼以激志兮樹動葉而鼓條雲朝隮于西泛兮遂憤薄于丹丘潛白日于玄陰兮翳朗月于重幽零雨濛其迅集潢潦汨以橫流聽峻階之回霤心沈切以增憂嗟王事之靡盬士感時而情悲願出身以徇役式簡書以忘歸時陟岵以旋顧涕漸纓而鮮晞聽鳴鶴之哀音知我行之多違悵俯仰而自憐志荒咽而摧威聊弦歌以厲志勉奉職于閨闈見藝文類聚三十五初學記三弭愁賦傷有間之淑女採薜荔于朝陽露素質之皎皎綰立髮以流光結翠葉于珠簪擢丹華于緑房點圜的之熒熒映雙輔而相望襲遊間之妓服褥阿縠之桂裳紉畹蘭于纓佩動暗暖以遺芳既容冶而多好且妍惠之纖微顧見豫之獨立知我情之思歸鳴環瑱以回若欲進而行遲眷紅顏之曄曄何的皪之少群整桂冠而自飾敷綦藻之華文從景炎而猗靡粲綿邈以繽紛時暸眇以含笑收婉媚以愁人見藝文類聚三十五述征賦時三月之暮春逼干戈之急難見御覽三百五十述行賦茫茫河濱實多沙塵見文選謝靈運擬魏太子鄴中集詩注涉洙泗而飲馬兮恥少長之齗齗見史記魯世家索隱引繁欽述行賦避地賦朝余發乎泗洲夕余宿乎留鄉見水經濟水注二征天山賦有漢丞相武平侯曹公仗節東征口六軍于三江浮五湖以耀武素甲玄焰皓旰流光左駢雄戟右攢干將彤弧朱矰丹羽絳房望之如火焰奪朝陽華旗翳雲霓聚刃曜日鋩于是轒轀雲趨威弧雨發鉦鼓雷鳴猛火風烈躍刃霧散虜鋒摧折呼吸無聞醜類剝滅見藝文類聚五十九御覽三百三十九三百五十三建章風闕賦築雙鳳之崇闕表大路以遐通上規圜以穹隆下矩折而繩直長楹森以駢停修桶揭以舒翼象玄圃之層樓肖華蓋之麗天當蒸暑之暖赫步北楹而周旋鷦鵬振而不及豈歸雁之能翔抗神鳳以甄甍似虞庭之鏘鏘櫨六翮以撫跱俟高風之清涼華鍾金獸列在南廷嘉樹蓊薆奇鳥哀鳴臺榭臨池萬種千名周櫩輦道屈繞紆縈見藝文類聚六十二三胡賦莎車之胡黃目深精員耳狹頤康居之胡焦頭折頞高輔陷口眼無黑眸頰無餘肉罽賓之胡面象炙蝟頂如持囊隅目赤眥洞頞仰鼻見御覽三百六十九三百八十二碩似鼬皮色象婁橘見御覽九百六十六橘桑賦上似華蓋紫極北形下象鳳闕萬桷一楹叢枝互出乃錯乃并曄曄隆暑涼風自生微條纖繞隨風浮沈陽蜩鳴其南枝寒蟬噪其北陰秋風忽其將來咸感節而悲吟玩庇蔭之厚惠情眷眷而愛深見藝文類聚八十八御覽九百五十五柳賦有寄生之孤柳託余寢之南隅順肇陽以吐牙因春風以揚敷交緑葉而重葩轉紛錯以扶疏鬱青青以畼茂紛冉冉以陸離浸朝露之清液曜華采之猗猗見藝文類聚八十九與魏太子書正月八日壬寅領主簿繁欽死罪死罪近屢奉箋不足自宣頃諸鼓吹廣求異妓時都尉嶭訪車子年始十四能喉囀引聲與笳同音白上呈見果如其言即日故共觀試乃知天壤之所生誠有自然之妙物也潛氣內轉哀音外激大不抗越細不幽散聲悲舊笳曲美常均及與黃門鼓吹溫胡迭唱迭和喉所發音無不響應曲折沈浮尋變入節自初呈試中間二旬胡欲慠其所不知尚之以一曲巧竭意匱既已不能而此孺子遺聲抑揚不可勝窮優遊轉化餘弄未盡暨其清激悲吟雜以怨慕詠北狄遐征奏胡馬之長思悽入肝脾哀感頑豔是時日在西隅涼風拂衽背山臨溪流泉東逝同坐仰歎觀者俯聽莫不泫泣殞涕悲懷慷慨自左𩥄史妠謇姐名倡能識以來耳目所見僉曰詭異未之聞也竊惟聖體兼愛好奇是以因箋先白委曲伏想御聞必含餘歡冀事速訖旋侍光塵寓目階庭與聽斯調宴喜之樂蓋亦無量欽死罪死罪見文選藝文類聚四十三御覽五百七十三為史叔良作移零陵檄金鼓震天丹旗曜野巨堙既設見御覽三百三十六川里先生訓處則抗區外之志出則規非常之功實哲士之高趣雅人之遠圖故呂尚垂翼北海以待鷹揚之任黃綺削迹南山以集神器之贊見藝文類聚三十六硯頌有般倕之妙匠兮眖詭異于遐都稽山川之神瑞兮識璇之內敷遂縈繩于規矩兮假卞氏之遺模擬渾靈之肇制兮效羲和之毀隅鉤三趾于夏鼎兮象辰宿之相扶供無窮之妙用兮御几筵而優遊見初學記二十一硯讚顧尋斯硯乃生翰墨自昔頡皇傳之罔極或薄或厚乃圓乃方方如地象圓如天常班采散色漚染豪芒點黛文字耀明典章施而不德吐惠無疆浸漬甘液吸受流光見藝文類聚五十八又初學記二十一三引尚書針龍作納言帝命惟允山甫翼周實司喉吻赫赫禁臺萬邦所庭無曰我平而慢爾衡無曰我審而怠爾明四嶽阿骸績用不成虞登八凱五教聿清舉涉其私乃忝服榮正直是與伊道之經先人匪懈永世流聲君子下問敢告侍廷見初學記十一案古文苑以為崔駰作威儀針其有退朝偃息間居營操弄碁文局樗蒱言不及義負勝是圖見御覽七百五十四嘲應德槤文應德溫云昔與季叔才俱到富波飲于酒肆日暮留宿主人有養女年十五肥頭赤面形似鮮卑偶説之夜與通姦便住足下見御覽八百二十八丘雋碑故右扶風都尉主簿有丘雋者從都尉討叛胡官兵敗績卒伍奔散都尉臨陳墮馬雋于是下馬授甲以身禦寇遂死戰場都尉乘雋馬得免見御覽三百二十五又四百二十一
