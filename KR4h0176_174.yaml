body:
  text: 路粹枉狀奏孔融少府孔融昔在北海見王室不靜而招合徒衆欲規不軌云我大聖之後而見滅于宋有天下者何必卯金刀及與孫權使語謗訕朝廷又融為九列不遵朝儀禿巾微行唐突宮掖又前與白衣禰衡跌蕩放言云父之于子當有何親論其本意實為情欲發耳子之于母亦復奚為譬如寄物瓶中出則離矣既而與衡更相贊揚衡謂融曰仲尼不死融答曰顏回復生大逆不道宜極重誅見後漢孔融傳又見魏志王粲傳注引典略與此小異為曹公與孔融書蓋聞唐虞之朝有克讓之臣故麟凰來而頌聲作也後世德薄猶有殺身為君破家為國及至其敝睚眥之怨必讎一餐之惠必報故鼂錯念國遘禍于袁盎屈平悼楚受譖于椒蘭彭寵傾亂起自朱浮鄧禹威損失于宗馮由此言之喜怒憂愛禍福所因可不慎與昔廉藺小國之臣猶能相下寇賈倉卒武夫屈節崇好光武不問伯升之怨齊侯不疑射鉤之虜夫立大操者豈纍細故哉往聞二君有執法之平以為小介當收舊好而怨毒漸積志相危害聞之憮然中夜而起昔國家東遷文舉盛歎鴻豫名實相副綜達經學出於鄭玄又明司馬法鴻豫亦稱文舉奇逸博聞誠怪今者與始相違孤與文舉既非舊好又於鴻豫亦無恩紀然願人之相美不樂人之相傷是以區區思協歡好又知二君群小所搆孤為人臣進不能風化海內退不能建德和人然撫養戰士殺身為國破浮華交會之徒計有餘矣見後漢孔融傳案文選任昉王文憲集序注引路粹為曹公與孔融書云邀一言之譽者計有餘矣證知此文是路粹作今此無邀一言之譽者范史有刪節也與曹公書足下平生常喟然有匡佐之志今其時矣見魏志陳思王傳注引魏略厲志賦覽前志而博觀求余心之所安雖疲駑而才弱敢舍力而不攀懿躬稼之克在賤善射而隕殘羡首陽之遺譽憎千駟之餘訕宗舍藏之偉節薄鼎角之自干嘉法言之令揚悼説難之喪韓鑿登險之敗績顧清道以自間瞻亢龍而懼進退廣志于伐檀雖德厚而祚卑猶不忘于盤桓薰以芬香而自燒兔亦取斃于毫翰援大雅以為戒眺襲勝而自歎嗟世俗之參差將未審乎好惡咸隨情而與議固真偽以紛錯穢杯盂之周用令瑚槤以抗閣恨騾驢之進庭屏騏驥于溝壑疾青蠅之染白悲小辨之靡託惡晨婦之蒙厚痛三代之見薄惟受性之朴拙亮未達乎測度顧鍾子之既沒牙輟絃而不作敦三思之彌憤動循牆之茲恪勉夕改以補朝履日新而悔昨以上見藝文類聚二十六苟神祗之我昭永明目而無怍見文選沈約奏彈王源注周成漢昭論成王昭帝俱以襁褓之幼託于冢宰流言讒興此其所值艱險相似者也夫以發金縢然後垂泣與計日而便覺詐書明之遲速既有差矣且叔父兄子非相嫌之處異姓君臣非相信之地霍光罹人謗而不出周公賴天變而得入推此數者齊本而論末計重而況輕漢昭之優周成甚明者也成王秀而獲實其美在終昭帝苗而未秀其得在始必不得已而論二主余與夫始者見藝文類聚十二御覽八十九振短翮與鸞鳳並翔見文選沈約和謝宣城詩注刑禮論天垂象聖人則之天之為歲也先春而後秋君之為治也先禮而後刑春以生長為德秋以殺戮為功禮以教訓為美刑以威嚴為用故先生而後殺天之為歲先教而後罰君之為治也天不以久遠更其春冬而人也得以古今改其禮刑哉太古之世民故質朴質朴之民宜其易化是以中古之君子或結繩以治或象刑惟明夏后肉辟民轉姦詐刑彌滋繁禮亦如之由斯言之古之刑省禮亦宜略今所論辨雖出傳記之前夫流東源不得西景正形不得傾自然之勢也後世禮刑俱失于前先後之宜故自有常今夫先刑者用其末也由禮禁未然之前謂難明之禮古人不能行也案如所云禮嫂叔不親之屬也非太古之禮也所云禮者豈此也哉古者民少而獸多未有所爭民無患則無所思故未有君焉後民禍多強暴弱于是有賢人焉平其多少均其有無推逸取勞以身先之民獲其利歸而樂之樂之得為君焉夫刑之記君也精具筋力民畏其強而不敢校得為君也恐上古未具刑罪之品設逋亡之法懼彼為我而以勇力侵暴于已能與則校不能歸奉之明矣且上古之時賊耳非所謂君也上古雖質宜所以為君會當先別男女定夫婦分土地班食物此先以禮也夫婦定而後禁淫焉貨物正而後止竊此後刑也見藝文類聚五十四御覽二十五蔡伯喈女賦伊大宗之令女稟神惠之自然在華年之二八披鄧林之曜鮮明六列之尚致服女史之話言參過庭之明訓才朗悟而通玄當三春之嘉月時將歸于所天曳丹羅之輕裳戴金翠之華鈿羡榮曜之所茂哀寒霜之已繁豈偕老之可期庶盡歡于餘年何大願之不遂飄微軀于逆邊行悠悠于日遠入穹谷之寒山慚柏舟于千祀負冤魂于黃泉我羈虜其如昨經春秋之十二忍胡顏之重恥恐終風之我萃詠芳草于萬里想音塵之髣佛祈精爽于交夢終寂寞而不至哀我生之何辜為神靈之所棄仰蕣華其已落臨桑榆之歔欷入穹廬之祕館亟踰時而經節歎殊類之非匹傷我躬之無説循膚體以深念歎蘭澤之空設佇美目于胡望向凱風而泣血見藝文類聚三十彈棊賦文石為局金碧齊精隆中夷外緻理肌平卑高得適既安且貞棊則象齒選乎南藩禮密身重腹隱頭騫驍悍説敏不輕不軒列數二八取象官軍微章采列爛焉可觀于是二物既設主人延賓粉石霧散六師列陳迹行王首左右相親成列告誓三令五申事中軍政言含禮文號令既通兵棊啓路運若回颷疾似飛兔前中卻儛賈其餘怒風馳火燎令牟取五恍哉忽兮誠足慕也若夫氣竭力殘弱膽怯心進不及敵中路為擒仁而不武春秋所針剛優徑勇忿速輕急推敵阻隧我廢彼立君子去是過猶不及見藝文類聚七十四述初賦郁州者故蒼梧之山也心説而怪之聞其上有仙士石室也乃往觀焉見一道人獨處休休然不談不對顧非己所及也見水經淮水注初學記八登州山以望滄海琰性頑口訥至二十九初關書傳聞北海有鄭徵君者當世名儒遂往造焉道由齊都而作述初賦曰見藝文類聚二十七有鄭氏之高訓吾將往乎發矇濯余髮于蘭池振余佩于清風望高密以亟征戾衡門而造止覿遊夏之峨峨聽大猷之篇記高洪崖之耿介羡安期之長生登州山以永望臨洞浦之廣溟左揚皮于暘谷右濯岸于濛泛運混元升降與三光而終始蓬萊蔚其潛興瀛壼崛以駢羅列金臺之𡾰嵼方玉闕之嵯峨見藝文類聚二十七初學記六倚高閭以周眄兮觀秦門之將將見水經淮水注吾夕濟于郁州見水經淮水注朝發兮樓臺回盼兮句榆頓食兮島山暮宿兮郁州見封氏聞見記六奏記曹公讓邴原等徵事邴原議郎張範皆秉德純懿志行忠方清靜足以厲俗貞固足以幹事所謂龍翰鳳翼國之重寶舉而用之不仁者遠見魏志邴原傳露版答曹公蓋聞春秋之義立子以長加五官將仁孝聰明宜承正統琰以死守之見魏志崔琰傳諫世子書蓋聞盤于遊田書之所戒魯隱觀魚春秋譏之此周孔之格言二經之明義殷鑒夏后詩稱不遠子卯不樂禮以為忌此又近者之得失不可不深察也遠族富強公子寬放盤遊滋侈義聲不聞哲人君子俄有色斯之志熊罷壯士墮于吞噬之用固所以擁徒百萬跨有河朔無所容足也今邦國殄瘁惠康未洽士女企踵所思者德況公親御戎馬上下勞慘世子宜遵大路慎以行正思經國之高略內鑒近戒外揚遠節深惟儲副以身為寶而猥襲虞旅之賤服忽馳騖而陵險志雉兔之小娛忘社稷之為重斯誠有識所以惻心也唯世子燔翳捐褶以塞衆望不令老臣獲罪於天見魏志崔琰傳與葛元甫書今遣送許子十卷貧不及素但以紙耳見北堂書鈔一百四視楊訓褒贊魏王表與訓書省表事佳耳時乎時乎會當有變見魏志崔琰傳大將軍夫人寇氏誄英雄景附見文選七命注對狀臣聞蕭生縊死困于石顯賈子放外讒在絳灌白起賜劍于杜郵朝錯致誅于東市伍員絶命于吳都斯數子者或妒其前或害其後臣垂齠執簡纍勤取官職在機近人事所竄屬臣以私無藝不絶語臣以冤無細不理人情淫利為法所禁法禁於利勢能害之青蠅橫生為臣所謗謗臣之人藝不在他昔王叔陳生爭正王廷宣子平理命舉其契是非有宜曲直有所春秋嘉焉是以書之臣不言此無有時人説臣此言必有徵要乞蒙宣子之辨而求王叔之對若臣以曲聞即刑之日方之安駟之贈賜劍之來比之重賞之惠謹以狀對見魏志毛玠傳四孤議當須分別此兒有識未有識耳有識以往自知所生雖創更生之命受育養之慈枯骨復肉亡魂更存當以生活之恩報公嫗不得出所生而背恩情報生以死報施以力古之道也見通典六十九奏記曹公陳黃白異議臣聞枳棘之林無梁柱之質涓流之水無洪波之勢是以在職七年忠讜不昭于時功業不見于事欣于所受俯㘇不報未嘗不長夜起坐中飯釋餐何者力少任重不堪而懼也謹貢所議如左見魏志王修傳注引魏略誡子書自汝行之後恨恨不樂何者我實老矣所恃汝等也皆不在目前意遑遑也人之居世忽去便過日月可愛也故禹不愛尺璧而愛寸陰時過不可還若年大不可少也欲汝早之未必讀書并學作人汝今踰郡越山河離兄弟去妻子者欲令見舉動之宜效高人遠節聞一得三志在善人左右不可不慎善否之要在此際也行止與人務在饒之言思乃出行詳乃動皆用情實道理違斯敗矣父欲令子善唯不能殺身其餘無惜也見藝文類聚二十三御覽四百五十九奏請公卿將校子弟詣博士案王制立大學小學自王太子以下皆教以詩書而升之司馬謂賢者任之以官故能致刑措之盛立太平之化也今學博上並設表章而無所教授兵戎未戢人並在公而學者少可聽公卿二千石六百石子弟在家及將校子弟見為郎舍人皆可聽詣博士受業其高才秀達學通一藝太常為作品式見通典五十三諫魏王南征疏臣聞文王與紂之事是時天下括囊無疚凡百君子莫肯用訊今大王體則乾坤廣開四聰使賢愚各建所規伏惟先王功無與比而今能言之類不稱為德故聖人曰得百姓歡心兵書曰戰危事也是以國力戰強秦承弊幽王不爭周道用興愚謂大王且當委重本朝而守其雌抗威虎臥功業可成而今創基便復起兵兵者凶器必有凶擾擾則思亂亂出不意臣謂此危危于纍卵昔夏啓隱神三年易有不遠而復論有不憚改誠願大王揆古察今深謀遠慮與三年大夫算其長短臣沐浴先王之遇又初改政復受重任雖知言觸龍麟阿諛近福竊感所誦危而不持見魏志文帝紀注引魏略食論苦荼久食益意思見御覽八百六十七上疏對曹公臣聞天地之性惟人為貴人之所貴莫貴于生唐荒無始劫運無窮人生其間忽如電過每一思此罔然心熱生不再來逝不可進何不抑情養性以自保惜今四海垂定太平之際又當須展才布德當由萬年萬年無窮當由修道道甚易知但莫能行臣常聞道人蒯京已年一百七十八而甚丁壯言人當朝朝服食玉泉琢齒使人丁壯有顏色去三蟲而堅齒玉泉者口中唾也朝旦未起早漱津令滿口乃吞之琢齒三七遍如此者乃名曰練精見千金方八十一與先主及法正書今大事垂可立如何釋此去乎見蜀志先主傳與諸葛亮書問馬超超人才可誰比類見蜀志關羽傳封還曹操所賜告辭書竊以日在天之上心在人之內日在天之上普照萬方心在人之內以表丹誠丹誠者信義也某昔受降之日有言曰主亡則輔主存則歸新受曹公之寵顧久蒙劉主之恩光丞相新恩劉主舊義恩有所報義無所斷今之主託某以之望形立相覓迹求功刺顏良于白馬誅文丑于南坡丞相厚恩滿有所報每留所賜之物盡在府庫封針伏望台慈俯垂鑒照見尺牘案此後人所依託疏論劉備劉備以梟雄之姿而有關羽張飛熊虎之將必非久屈為人用意者愚謂大計宜徙備置吳盛為築宮室多其美女玩好以娛其耳目分此二人各置一方使如瑜者得挾與攻戰大事可定也今猥割土地以資業之聚此三人俱在疆埸恐蛟龍得雲雨終非池中物也見吳志周瑜傳疏薦魯肅當今天下方有事役是瑜乃心夙夜所憂願至尊先慮未然然後康樂今既與曹操為敵劉備近在公安邊境密邇百姓未附宜得良將以鎮撫之魯肅智略足任乞以代瑜瑜隕踣之日所懷盡矣見吳志魯肅傳疾困與吳主權箋瑜以凡才昔受討逆殊特之遇委以腹心遂荷榮任統御兵馬志執鞭弭自效戎行規定巴蜀次取襄陽馮賴靈武謂若在握至以不謹道遇暴疾昨自醫療日加無損人生有死死修短命矣誠不足惜但恨微志未展不復奉教命耳方今曹公在北疆場未靜劉備寄寓有似養虎天下之事未知終始此朝士吁食之秋至尊垂慮之日也魯肅忠烈臨事不苟可以代瑜人之將死其言也善儻或可採瑜死不朽矣見吳志魯肅傳注引江表傳裴松之案此箋與本傳所載意旨雖同其辭乖異耳遺劉先主書龐士元非百里才也使處治中別駕之任始當展其驥足耳見蜀志龐統傳答吳主權書帝王之起皆有驅除羽不足忌見吳志呂蒙傳疏請治疾羽討樊而多留備兵必恐蒙圖其後故也蒙常有病乞分士衆還建業以治疾為名羽聞之必撤備兵盡赴襄陽大軍浮江晝夜馳上襲其空虛則南邵可下而羽可禽也見吳志呂蒙傳
