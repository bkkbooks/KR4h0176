body:
  text: 闕名蜀郡太守何君閣道碑蜀郡太守平陵何君遣掾覽邛舒鮪將徒治道造遵楗閣袤五十五丈用功千一百九十八日建武中元二年六月就道史任雲陳春主見隸釋四云莽漢之際習俗相尚以即位初元冠于新歷之上故此碑有建武中元之文東夷傳云建武中元二年倭奴國奉貢鄐君開褎斜道摩崖刻石永平六年漢中郡以詔書受廣漢蜀郡巴郡徒二千六百九十人開通褎余道太守巨鹿鄐君部掾治級王宏史荀茂張宇韓岑弟典功作太守丞廣漢楊顯將領用始作橋格六百卅三間大橋五為道二百五十八里郵亭驛置徒司空褎中縣官寺并六十四所凡用功七十六萬六千八百餘人瓦卅六萬九千八百四器用錢百四十九萬九千四百餘斛粟九年四月成就益州東至京師去就安隱見碑拓本又宋晏袤釋文郫縣摩崖刻石攻此石省三處閣直錢萬二千永元六年見古刻叢鈔嘉州夾江縣摩崖平鄉明亭大道北與茂陵西與青衣越巂通界回曲危險扶風王君為民興利除害遣掾何章修治故書崖以頌之見隸釋四羊竇道跋云又有摩崖四百餘字云云蓋和帝永元八年也南安長王君平鄉道碑維平鄉明高大道北與武陽西與蜀郡青衣越巂通界制中涪山上隨沿回曲危經隨險登高望天車馬不通不蟲周古古磨民吏能自二有崖易之遭不進膽崖橫道臨大江危或墮不止陷復為民害永元七季十月南安長右扶風倉壬君民興利除害遣掾何童史道興與有秩道家因民力崖平碓及泊潭山格通達平直廣大道長及畸灰賊盜區止車馬馳驅無所畏商市平百姓如願開采石今刻石之功恩及子孫去危就安萬世無患永永無窮後因掾橋義尉曹史任政楊莫丞汁邡王卿江元尉綿竹楊卿椽楊弘主泊山史易子永元八年四月十日兼戶曹掾何童史道興造書崖師朱仲王回左大炅皆富昌明下立馴孝王前南長方主見隸續十一祀三公山碑元初四年常山相隴西馮君到官承飢衰之後口惟三公御語山三條別神迥在領西吏民禱祀興雲膚寸偏雨四維遭離羌寇蝗旱鬲我民流道荒醮祠希罕口奠不行由是之來和氣荒臻乃來道要本祖其原以三公德廣其靈尤神處幽道艱存之者難卜擇吉口治東就衡山起堂立壇雙闕夾門薦牲納禮以寧其神神熹其位甘雨屢降報如景響國界大豐穀斗三錢民無疾苦永保其年長史魯國顏洨五官掾閰祐戶曹史紀受將作掾王笧元氏令茅匡丞吳音廷掾郭洪戶曹史翟福工宋高等刊石紀焉見碑本嵩嶽太室石闕銘惟中嶽崇高神君冢土岱氣最純春生萬物膚寸起雲潤施源流洪濛沛宣並天四海莫不蒙恩聖朝肅敬衆庶所尊齋試奉祀戰栗盡勤以頌功德刻石紀文垂顯以傳後賢元初五年四月陽城口長左馮翊萬年呂常始造作此石闕見碑本青衣尉趙孟麟羊竇道碑羊竇道舊故南上高山下人深谷危駿回百姓患苦永初六年青衣尉南安趙孟麟更易由此道濱江平澤無盜賊差近草里騎馬儋負水弱得過除去危難行人萬姓莫不蒙恩傳于無究乎維世青衣尉趙君故治所書佐郡督郵隨牒除到間六日郡召守蜀鐵官長積四月治狀亦明徙守成都今復還歸尉官羊竇故道高危君雯崖易道盜賊徵止老弱往來無患時典主通道者積綌故吏梁𣲩捕盜賊王留百姓過者皆蒙恩君延壽萬年書此盛巨永元十一月九日造見隸釋四案羊竇故道和帝永元年造至安帝永初六年改修漢安長陳君閣道碑永建五年孟春下旬漢安長蜀郡青衣陳君到官約垂意惠民施無為之政行不言之教德化深行盜賊少五穀豐茂百姓晏然各得其所君思所以利民大小悉備屯道本有根閣二百餘丈窅陷壞絶車馬疆頓常以農時發民治歲歲造更直世餘萬君躬自案行以眇思省去根閣今就土著長無勞費為萬世基百姓行人歡悅歌詠郵亭掾尹𤶿臣有述君之義故勒此石以示後賢其辭曰惟此故道險阻危難根閣扼臨江緣凶秋雨水潦陷穿車馬疆頓修隧隕顛行旅創苦發賦加民乃至于今遭我陳君舍道施德蹈義履仁治合中和化行若神清過夷齊行同參騫以身率下非禮不言思惟儉約所以利民追哺飯露宿草百姓安樂不勞不煩又省此閣就乎平便民無經賦行人離患時丞馮卿廉約勤勤好施樂欽承奉宣掾史遵憲各建忠咸百福子子孫孫時道橋掾董闕二字見隸續十五國三老袁良碑君諱良字厚卿陳國扶也厥先舜苗世為封君周之興虞閼父典陶正嗣滿為陳侯至玄孫濤塗初氏父字立姓曰袁魯僖公四季為大夫哀十一季頗作司徒其末或適齊梳而袁生獨留陳當秦之亂隱居河洛高祖破項實從其册天下既定還宅扶樂孝武征和三季生曾孫幹斬賊公先勇拜黃門郎封關內侯食遺鄉六百戶後錫金紫仙修城之鄝幹薨子經嗣經薨子山嗣傳國三世至王莽而絶君即山之曾孫纘神明之洪族資天德之清則惇綜易詩而説禮樂舉孝廉郎中謁者將作大匠丞相令廣陵太守討江賊張路等威震徐方謝病歸家孝順初政咨白三府舉君徵拜議郎符節令時元子光博平令中子騰尚書郎少子璋謁者詔書璧可父事群司從君父子俱列三臺夫人結髮上為三老使者節安車親几杖之尊袒割之養君實饗之後拜梁相帝御九龍殿引君對覿與酒飯賜飲册曰頃者連遇運害災條備至陰陽不和寒暑不節昔孔子制義承奉則有興盛之福慢期即致來咎之變朕從妙身襲裘繼業二九之戒今直其際圖記占恆在藩國自先帝至德猶有七國之謀蓋治世者不諱其難朕追寤社稷之重恐有交會諸國王侯開導從驕滿之漸令姦邪因緣生慝相以顯選蕳練內升昔掌苻竟惠撫我民故連拔授不問次典郡職重親執經緯隱括在手往者王尊發縱於平陽清約藩輔其節衎然忠臣之義有獻善去否其加精微測切防絶朕疚心以戒今特賜錢十萬雜繒世匹壬具劍佩書刀繡文印衣無極手巾各一佳悉乃心勉崇協同便宜數上君子曰優賢之寵於斯盛矣宰縣治郡無民不思載八十五以病致仕永建六季二月戊辰卒居罔室廬殯於假館昔行父平仲小國之卿其儉猷稱況漢大夫父子同升而無𡑡堵不遭丘明實録之時使前哲孤名而君獨立於是厥孫衛尉滴司徒掾弘乃刊石他銘其辭曰飛清邈紛其厲跨高鋪雲際作帝父振濊登華龍眺天坐酌不揮凱以邁民被澤挹畿乂丈本德曜其碣煌煌數萬世見隸釋六洛陽上東門橋右石柱銘陽嘉四年乙酉千申詔書以城下漕渠東通河濟南引江淮方貢委輸所由而至使中謁者魏郡清淵馬憲監作石橋梁柱敦敕工匠盡要妙之巧攢立重石纍高周距橋工路博流通萬里云云河南尹邳崇隗丞渤海重合雙福水曹掾中牟任防史王蔭史趙興將作吏睢申翔道橋掾成皋卑國洛陽令江雙丞平陽降監掾王騰之主石作右北平山仲三月起作八月畢成見水經穀水注敦煌太守裴岑碑惟漢永和二年八月敦煌太守雲中裴岑將郡兵三千人誅呼衍王等斬馘部衆克敵全師除西域之灰蠲四郡之害邊竟艾安振威到此立海祠以表萬世見碑本漢故益州太守北海相景君銘惟漢安二年仲秋故北海任城景府君卒鳴呼哀哉國寶英彥失疇列宿虧精晚學後時于何穹倉布命授期有生有死天實為之豈夫仁哲彼克不遺於是故吏諸生相與論曰上世群后莫不流光於無窮垂芬耀於書篇身歿而行明體亡而名存或著形像於列圖或頌於菅弦後來詠其烈竹帛敘其勳乃他誄曰伏惟明府受質自天孝弟淵懿師禮蹈仁根道核藝抱淑守真晶白清方克己治身實渘實剛乃武乃文遵孝孝謁假階司農流德元城興利惠民強衙改節微弱蒙恩威立澤宣化行如神帝嘉厥功授以符命守郡益州路遐戀親躬自遜讓夙宵朝廷建英忠讜辨秩東衍璽追嘉錫據北海相部城十九鄰邦歸向分明好惡先以敬讓殘偽易心輕黠踰竟號梟不鳴分子還養元元鰥寡蒙佑以寧蓄道修德曰祉以榮紛紛令儀明府體之仁義道術明府膺之黃朱邵父明府三之台輔之任明府宜之以病被徵委位致仕民志思慕遠近搔首農夫醳耒商人空市隨輿飲淚奈何朝廷奪我慈父去官未旬病乃困危圭璧之質臨卒不回歔欷霣絶奄忽不追孝子憉𢣦顛倒剝摧遂不克寤永潛長歸州里鄉黨隕涕奔哀故吏忉怛歔欷低徊四海冠蓋驚𢝆傷褱大命所期實惟天授明王設位明府不就臣子欲養明府弗留歍呼哀哉辭曰孝積幽穸表至口兮翔議郎兮再命虎將綏元元兮規莢矩謨主忠信兮羽衛藩屏撫萬民兮恩彌盛兮宜參鼎拂豎幹楨兮不永麋壽棄臣子兮仁敷海外著甘棠兮口石勒銘口不亡兮見碑拓本又見隸釋六北海相景君碑陰豎建虎惟故臣吏慎終追遠諒暗沈思守衛墳園仁綱禮備陵成宇立樹列既就聖典有制三載已究當離墓側永懷靡既文不可勝以義割志乃著遺辭以明厥意魂靈瑕顯降垂嘉祐見碑拓本隸續十六蔡攜碑攜字叔業有周之胄昔蔡叔沒成王命其子仲使踐諸侯之位以國氏姓君其後也君曾祖父勳哀帝時以孝廉為長安邰長及君之身增修厥德順帝時以司空高第遷新蔡長年七十九卒長子稜字伯直處俗孤黨不協于時垂翼華髮人爵不升年五十二卒諡法曰清白守節曰貞純行不差曰定見後漢蔡雍傳注引雍祖攜碑云云案蔡雍有貞定直父碑今此即雍撰否不能定之敦煌長史武斑碑建和元年大歲在丁亥二月辛已朔草三日癸卯長史同敦煌長史武君諱斑字宣張昔殷王武丁克伐鬼方元功章炳勳臧王府官族分析因以為氏焉武氏蓋其後也商周假邈歷世壙遠不隕其美漢興以來爵位相踵朝忠臣君幼門顏閔之懋質長敷斿夏之文學慈惠寬孝友玄妙苞羅術藝貫洞聖博兼耽綜典籍思純求福不回清聲美行闡形遠近州郡貪其高賢少請以歲舉翼紫宮詔除光顯王室有于國帝庸嘉之掌司古領校祕𨞓研幽微追昔劉向辨賈之徒比萬矣時戎匡正一朝廷惟憂有司舉君班到官之日癘吏士哮虎之怒薄伐並百姓賴之邦域既寧久勞于外當還本朝以敘左右以永嘉元年月日遭疾不哀哉于是金鄉長河間高陽史恢等追惟昔日同歲郎署咸以為自古在昔先聖與仁興替人存生榮死哀是為萬年伊君遺德口孔之珍故石銘碑以旌德焉其辭曰於惟武君允德允恭受天休命積祉所鍾其在孩提岐嶷發蹤謙口守約唯誼是從孝深凱風志潔羔羊樂是恬此策光孳孳臨川窺見口牆庶仰箕首微妙玄通口然清邈升為帝股肱扶助大和萬民逌蒙顯宗史官書功昊天上帝降茲鞠凶暗忽徂逝宮不享耆耇大命百遼惟后帝感傷學夫喪師士女悽愴旌表金石令問不忘垂後昆憶載歎誦見碑本隸釋六武氏石闕銘建和元年大歲在丁亥三月庚戍朔四日癸丑孝子武始公弟綏宗景興開明使石工孟孚季弟卯造此關直錢十五萬孫宗作師子直四萬開明子宣張仕濟陰年草五曹府君察舉孝廉除敦煌長史被病夭沒苗秀不遂鳴呼哀哉士女𤹯傷見碑本司隸校尉楊孟文石門頌惟川靈定位川澤股躬澤有所注川有所通余谷之川其澤南隆八方所達益域為充高祖受命興於漢中道由子午出殽入秦建定帝位以漢𧦄焉後以子午途路澀難更隨圍谷復通堂光凡此四道垓尢艱至於永平其有四年詔書開余鑿通石門中遭元二西夷虐殘橋梁斷絶子午復修上則縣峻屈曲流顛下則入冥廎寫輸淵平阿泥常蔭鮮晏木石相距利磨確胳臨危槍𥓘履尾心寒空輿輕騎滯礙弗前惡蟲𦿝狩蛇蛭毒蟃未秋截霜稼苗夭殘終年不登匱餧之患卑者楚惡尊者弗安愁苦之難焉可具言於是明知故司隸校尉楗為武陽楊君厥字孟文深執忠伉數上奏請有司議駮君遂執爭百遼咸從帝用是聽廢子由斯得其度經功飭爾要敞而晏平清涼調和蒸蒸文寧至建和二年仲冬上旬漢中太守楗為武陽王升字稚紀涉歷山道推序本原嘉君明知美其仁賢勒石頌德以明厥勳其辭曰君德明明焫煥彌光刺過拾遺厲清八荒奉魁承杓綏億衙強春宣聖日秋貶若霜無偏蕩蕩真雅以方寧靜蒸庶政與乾通輔主匡君修禮有常咸曉地理知世紀綱言必忠義匪石厥章恢弘大節讜而益明揆往卓今謀合朝情醳艱即安有勳有榮禹鑿龍門君其繼縱上順什極下答坤皇自南自北四海攸通君子安樂庶士悅雍商人咸農夫永同春秋記異今而紀功垂流億載世嘆誦序曰明哉仁知豫識難易原度天道安危所歸勤竭誠榮榮名休麗五官掾南鄭趙邵字季南屬褎中漢強字産伯書佐西成王戎字文寶主王府君閔谷道難分置六部道橋特遺行丞事西成輔服字顯公都督掾南鄭巍整字伯玉後遣趙誦字公梁案察中曹卓行造作石𧂐萬世之基或解高格下就平易行者欣然焉伯玉即日從署行丞事守安陽長見隸釋四廣漢長王君治石路碑表惟右部官國之珍寶衝路危險俠石磐岩道人馬行為民隆害歷世彌久靡有留心長廣漢王君建和二年冬任掾楊攻沿治破壤又從塗口繇平井間道至別得去危就安功夫九百餘日成就通達永傳億歲無窮記弟子楊子欽奉為作定達造見隸釋四案碑文蓋楊子欽所作也子欽無考漳河神壇碑河內修武縣張導字景明以建和三年為巨鹿太守漳津泛濫土不稼穡導披按地圖與丞彭參掾馬道嵩等原其逆順揆其表裏修防排通以正水路功績有成民用嘉賴見水經濁漳水注惟和平元年正月朝歌長鄭郴造張公建良之山運置綦陽刊鑿涿摩立左右闕表神道豎碑廟堂之前到五月乃成長之銘勒神懿光祕後昆其辭曰於穆張公含和泰清受符皇極乾剛坤靈何天之休元亨利貞無貴神耀洞度泉殷商北坰嶽朝綦陽厥土敞平芝草茂木潚潚滋榮群萌勳激川通懷廟克儉捐盈詔命有司祭以中牲歲聿再慶公其饗零興來億載歷數萬君太顯猶昭拂英勳錫介福惠此吏民國無災寇屢獲豐年皇帝眉壽干祿于天牧守皆升握台輔辰長與丞尉超遷相因休烈烈無臨犁陽營謁者李君畏敬公靈好鄭長文徹奉佐工悃愊殷勤吏熹且惶作歌九章達李君頌公德芳其辭曰綦水湯湯揚清波東疏折于河朝歌縣以潔靜無穢瑕公守相駕蜚魚往來悠忽遂熹娛祐此兆民寧厥居出自綦松柏鬱茂蘭公神往來乘浮雲種德收福惠斯民家饒戶富無貧疆界家靜和睦朝歌蕩陰及犁陽三女所處各殊方三門鼎列推其鄉時攜甥幼歸侯公夫人容饗觴穆風屑兮起壇旁樂吏民兮永未央鹿呦呦兮庭文樂樂兮飲清泉兮見伏兮不駭驚惟公德兮之所寧上陵廟兮助三牲天時和兮甘露泠日番兮無虧傾蜚兮朱鳥棲榮兮鳴喈喈鳶鵠勦兮乳徘徊給御卵兮獻于西惟公德兮之所懷池水兮釣臺粲四角樓兮臨深澗魚岌岌兮踊躍見振鱗尾兮遊旰旰時釣取兮給亨獻惟公德兮之所衍栗蕭草兮藂鋪陳新美萌兮香苾芬蕙草生兮滿園田競苔茗兮給萬錢惟公德兮之所門堂鬱兮文耀光公神赫兮坐東方明暴視兮儼卬卬夫人女兮列在旁陳君處北兮從官車騎駱驛兮交錯重乘輗軺兮駕蜚龍驂白鹿兮從仙偅遊北嶽兮與天通玄碑既立雙闕建兮大路畔兮亭長閽扞難兮列種槐梓方茂爛兮天下遠近不見兮公神日著聲洞遍兮乾川傳億萬兮監犁陽營謁者豫章南昌李朝伯丞左馮翊夏陽趙寵德雅朝歌長潁川陽城鄭郴作林左尉京兆水陽里郭虞子扶風安陵邵公處士巍郡封仲舉處士巍郡犁陽見隸釋三案此碑前半張公神道闕銘文朝歌屬長鄭郴撰郴字伯林潁川陽城人後半歌九章無吏撰名氏嚴欣碑惟漢中興卯金休烈和平元年歲治東宮星屬角房月建朱烏中呂之均萬物慈躬華澤青蔥蚑行蠕動咸守厥常人物同授獨遭災霜顛霣落壽不寬弘經設三命君獲其央年六十有九禮勝蚤夭咨嗟痛兮鳴呼悲傷故著名噌嘆歔欷發噴授舒慮嚝喟其辭曰伊嘆嚴君謹欣字少通兆自楚祖孝相承招命道術治嚴氏春秋馮君章句衆書淵靡不覽君體性慈仁常容忠公清白好善博愛有文有武兼備幼為郡掾史會稽諸暨尉守烏程毗陵餘暨章安山陰長以疾去官後為丹陽陵陽丞守春谷長舉孝廉遷東牟兵相長典牧十城所在若神宣布政聲甘棠貧細隨附賢士敬名行旅歌慎於所鄭實與相似恩澤奐昺名臧文威如哮虎仙南𠇙德配公劉宣二風至今不滅年何億掩忽摧藏於是宮送君莫不悲哀舒氣唁後宮貴人上君魂靈柩農夫桑婦嘆欲人偅優目哀嗟君云斯身甘復次子昔先豫女斯有命不可追留鳴呼哀哉何棠所宰癌十城布化垂光明功名休赫盛巍難𦿝障今歌於道甘棠君不享黃耇壽霣沒歸且于中嶽玄照洞倉弘高刻畫文磐堂列種諸奇樹何楇靈魂審有知福祚遺子
