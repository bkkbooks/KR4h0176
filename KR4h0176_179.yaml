body:
  text: 闕名從事武梁碑故從事武掾掾諱梁字綏宗掾體德忠孝岐嶷有異治韓詩經闕幘傳講兼通河雒諸子傳記廣學甄徹窮綜典靡不覽州郡請召辭疾不就安衡門之陋樂朝聞之義誨人以道臨川不倦恥世雷同不窺權門年踰從心執節抱介終始不二彌彌蓋固大位不濟為衆所傷年七十四元嘉元年季夏三日遭疾隕靈烏呼哀哉孝子仲章季章季立孝孫子僑躬修子道竭家所有選擇名石南山之陽擢取妙好色無斑黃前設壇後建祠堂良匠衛改雕文刻畫羅列成行攄騁技巧委蛇有章垂示後嗣萬世不忘其辭曰懿德玄通幽以明兮隱居靖處休曜章兮樂道忽榮垂蘭芳兮身歿名存見隸釋六武梁祠堂畫像伏戲倉精初造工業畫卦結繩以理海內祝誦氏無所造為未有耆欲刑罰未施神農氏回宜教田辟土種穀以振萬民黃帝多所改作造兵裳立宮室姑姊其室失火取兄子往輒得其子赴火如亡示其誠也曾子孝以通神明貫感祗著乎朱方後世凱式無綱老萊子楚人也事親至孝衣服斑連嬰兒之態令親有歡君子嘉之孝道大焉丁蘭二親終後立木為父鄰人假物乃借與郎中王政碑君諱政字季酺漢中太守之孫從事掾之第三子也姿履穆之操愛敬以事生哀戚以送終奉歐陽尚書研典賁侃上童冠聿集承義方郡端右州辟從事衛上先公有羔羊之潔無申棠之欲不營己好是正直仰不守防東長威雙行師下以儉決訟明民無淫佚革弭閭里風化宣流家施舉孝廉除郎中三署馳名見者宗當豐人爵登彼神命罕修仁不卒從氛暴年五十以元嘉三年春正月戊寅既歿而不於是門徒士夫君咸有乃相與立石表行以後其辭曰於明君方白時言樂笑由徑不曲職在公事君謇退食絶私逶蛇允仁慈讓忘清潔己惟德之宅有嘉厥聲令問孔碩養俟夕階不以勒銘昭厥德見隸續一孔廟置百石卒史孔和碑司徒臣雄司空臣戒稽首言魯前相瑛書言詔書崇聖道勉藝孔子作春秋制孝經五經演易系辭經緯天地幽贊神明故特立廟褒成侯四時來祠事已即去廟有禮器無常人掌領請置百石卒史一人典主守廟春秋饗禮財出玉家錢給大酒宜須報謹問大常祠曹掾牟史郭玄辭對故事辟雍禮未行祠先聖師侍祠者孔子孫大宰大祝令各一人皆備爵大常丞監祠河南尹給牛羊豕雞各一大司農給米祠臣愚以為如瑛言孔子大聖則象乾坤為漢制作先世所尊祠用衆牲長吏備欲加寵子孫敬恭明祀傳于罔極可許臣請魯相為孔子廟置百石卒史一人掌領禮器出王家錢給大酒直他如故事臣雄臣戒愚戇誠惶誠恐頓首頓首死罪死罪臣稽首以聞制曰可元嘉三年三月草七日壬寅奏洛陽宮司徒公河南原武吳雄字季高司空公蜀郡成都趙戒字意伯元嘉三年三月丙子朔草七日壬寅司徒雄司空戒下魯相丞書從事下當用者選其年卌以上經通一藝雜試通利能奉弘先聖之禮為宗所歸者如詔書書到言永興元年六月甲辰朔十八日辛酉魯相平行長史事卞守長擅叩頭死罪敢言之司徒司空府壬寅詔書為孔子廟置百石卒史一人掌主禮器選年卌以上經通一藝雜試能事弘先聖之禮為宗所歸者平叩頭叩頭死罪死罪謹案文書守文學掾魯孔和師孔憲戶曹史孔覽等雜試和修春秋嚴氏經通高第事親至孝能奉先聖之禮為宗所歸除和補名狀如牒平惶恐叩頭死罪死罪上司空府贊曰巍巍大聖赫赫彌章相乙瑛字少卿平原高唐人令鮑疊字老子生於曲濄間見水經陰溝水注北濄水之側有李母碑是永興元年譙令長沙王阜所立碑云李母碑老子生于曲濄間見水經陰溝水注故宛令益州刺史南郡襄陽李字孟初神祠之碑舉孝廉除補郎中遷史卒官口故吏民追思德化更訊治立碑復祠下垣宇樹木皆不中犬人共案文文永興二年六月己亥朔十日宛令部勸農賊捕掾李龍南部游屋有守祠義民今聽復無時令琅琊開陽貴君諱咸伯河南雒陽虞衍字元博仲興掾吳定尉功曹史伯時嗇夫劉俊叔艾佐戶伯吏佐元舉時賊捕掾李龍升高京甫供功曹史左治時亭長張河漫海唐談伯祖見碑拓本孔謙碑孔謙字德讓者宣尼公草世孫都尉君子之子也幼體蘭石自然之姿長膺清妙孝友之行述家業修春秋經升堂講誦深究聖指弱冠而仕歷郡諸曹史季草四永興二季七月遭疾不祿見隸釋六魯相韓敕造孔廟禮器碑惟永壽二年青龍在涒歎霜月之靈皇極之日魯相河南京韓君追惟太古華胥生皇雄顏育孔寶俱制元道百王不改孔子近聖為漢定道自天王以下至于初學莫不𩥉思嘆卬師鏡顏氏聖舅家居魯親里并官聖妃在安樂里聖族之親禮所宜異復顏氏并官氏邑中徭發以尊孔心念聖歷世禮樂陵遲秦項作亂不尊圖書倍道畔德離敗聖輿食糧亡于沙丘君於是造立禮器樂之音符鍾磬瑟鼓雷洗觴觚爵鹿柤梪籩柉禁壼修飾宅廟更作二輿朝車威熹宣抒玄汙以注水流法舊不煩備而不奢上合紫臺稽之中和下合聖制事得禮儀于是四方土仁聞君風耀敬咏其德尊琦大人之意逴彌之思乃共立表石紀傳億載其文曰皇戲統華胥承天畫卦顏育空桑孔制元孝俱祖紫宮大一所授前闓九頭以升言教後制百王獲麟來吐制不空作承天之語乾元以來三九之載八皇三代至孔乃備聖人不世期五百載三陽吐圖二陰出讖制他之義以俟知奧於穆韓君獨見天意復聖二族逴越絶思修造禮樂胡輦器用存古舊宇殷勤宅廟朝車威熹出誠造漆不水解工不爭賈深除玄污水通四注禮器升堂天雨降澍百姓欣和舉國蒙慶神靈祐誠竭敬之報天與厥福永享牟壽上極華紫旁伎皇代刊石表銘與軋運耀長期蕩蕩於盛復授赫赫罔窮聲垂億載見隸釋一輔字世于炎君卿衛特以才明敏達拜小黃門遝事和熹后孝安帝安思皇后時為大宮令孝順皇帝踐胙之復引拜小黃門遷臧府令當拜中常侍讓與同郡錡任後以病孫位起家復拜謁者令中尚方遷中常侍遭順帝棄天下扶佐孝沖孝質帝兼領黃門令順烈皇后攝政以君舊拜長樂太僕遭孝質無嗣乃定冊帷幕愋立聖主有安社稷之勳建和二年七月已已詔冊曰蓋聞春秋之采毫毛之善大漢典制有恩澤之封輔歷世守省恪恭位著建立之際處乎左右常伯之職同協意以亮天功往者鄭衆蔡倫行事科比其封輔為葉吉成侯和平中君復轉拜大長秋兼以侍之位括統前後明先帝法令曉舊章之事周密淑慎奉已守度在寵弗盈能自挹損爵日隆持之益懼每所典領威禁不犯遠惡辟害不離艱難所謂摩而不鄰涅而不緇者朝廷禮之以君耇老有機杖之賜年六十有二永壽二年十二丙子薨中外咨悼賻贈等昔菅蘇之尹楚以直見疏死記其張卿之在漢季布之以安高后論德比隆君實越於是鄉人姻族乃相與刊石樹碑昭宣令問其辭曰盛德之休實生君侯天授厥美忠貞以退翼軒達華樞六帝四后是咨是諏錫以寵衣紫艾兼紓幹國棟家以光以舒後禮人誰泥我貴不濡君守固終始不渝旌之萬祀顯耀永譽見隸釋十七案水經滍水注有漢中常侍長樂太僕吉成侯州苞碑云六帝四后是咨是諏州苞即州輔之誤郎中鄭固碑君諱固字伯堅蓍君元子也含中和之淑質履上仁孝友著乎閨門至行立乎鄉黨初受業於歐陽遂窮究於典藉膺游夏之文學襄冉季之政事弱冠仕郡吏諸曹掾史主簿督郵五官掾功曹入則腹心出則爪牙忠以衛上清以自修犯顏謇愕造膝佹辭加以好成方類推賢達善逡遁退讓當世以此服之邦后珍瑋以為儲舉先屈計掾奉我貢清眇冠乎群彥德能蕳乎聖心延熹元年二月十九日詔拜郎中非其好也以疾錮辭未滿期限從其本規乃遘凶愍年卅二其四月草四日遭命隕身痛如之何先是君大男孟子有楊烏之才善性形於岐嶷見於垂髦年七歲而叐大君夫人所共哀也故建共墳配食斯以慰考妣之心琦琣延以為至德不紀則鍾鼎奚銘昔姃武弟述其兄綜行於蔑陋獨曷敢忘乃刊石以旌遺芳其辭曰於惟郎中實天生德頤親誨弟雯恭竭力教我義方導我禮則傳宣孔業他世幕式從政事上忠以自勖貢計王庭華夏歸服帝用嘉之顯拜殊特將從雅意色斯自得乃遭氛災隕命顛沛家失所怙國忠直俯哭誰訴叩唬焉告嗟嗟孟子苗而弗育奉我元兄修孝罔極魂而有靈亦歆斯勒見隸釋六丹陽太守郭旻碑君諱旻字臣公有周之裔之穆為文王卿士子孫君膺天休明德矜之溫良慈恕羲以將之厥為不可測加以體明道術律小杜洪纖觱舉弊罪當然獨少仕州郡宣著嘉名察孝廉除郎中謁者使監南甄官翔聲省其傷疾𤵸完命已免丹數遷敬陵園令廷尉左平治書侍御史獄刑無頗憲台如砥以父憂去官還拜郎中侍御史遭母憂服除復拜郎中治書侍御史彌縫弱遷冀州刺史墉明否萬里他孚九郡咸寧河朔凱豫徵拜尚書命國之喉躬親功顯朝異焉是時淮夷蠢迪帝疇克綏書褎蠣俾守丹楊荒治亂召攜懷遠齊逸俗通聖化黎民用康移風易為政四年以公事去官退修玄默惟莫反初過耳順寢疾耳頽延熹元𠂖十月戊戍卒其十二月丙申葬微言絶矣諸子曷仰三載禮闋乃群相與刻石勒銘昭所辭曰於休我師恂恂郭君既明且哲耽此憲孝睦觀國用惟左易輸勤讚理士師獄無放紛三典執王人柔遐能邇克亮蛇機夙夜惟寅獫蠻幜波用綏海濱絹訛神功遂身退運光暉有翕永世不泯昔君即世雖立碑頌裁足載字加有瑕股君之弟故太尉公薨歸葬舊陵于是從子故五原太守鴻議郎柔及胤孫范懷祖之乃更刊石不改前文蓋用昭明祖勳德以宣達情庶傳不朽呼云爾見隸續三又十九字元賓魯相之孫成德東安平令北海相守之弟子中牟令兄子也君生也即有殊摻修孝行鄉黨乾乾積善念於濟人故朋疇宗親受爵位者皆也加有聰明睿哲之才博五經之滋味覽群書之要圖藉擒翰著作時人莫能預其思辨論文章爛孝廉亢弘名于三署揚清厲于海內除倉龍司馬詔試經第一衛尉察尤異遷吳令憲春陽以加惠則陰擊有高宰鄭見思之歌視事二稔民用寧康以不媚雲之高翻翥色斯辟州從事雖進退不枉尺直撏睪聖朝旌勳公車徵拜議郎當豐姻媾光國興家育殲我良人年卌八延熹二年二月卒天子閔咨嗟使者臨弔賻賵特加於是族舊門莫不傷瘁立銘以詠君德其辭曰藐無倫揚休聲為三臣播忠冊列帝庭名顯章光四建靈石垂鴻勳昭來括示後昆見隸釋六張休崖涘銘太凶雖高無得而擬劍道雖險孰可為比吁嗟此山高且險只上視彼蒼相去能幾宜乎昆侖日月所蔽行九過茲鮮不垂涕深念于斯刊銘崖涘漢延熹二年三月初張休見隸續十九王君造四縣邸碑惟茲陳國故曰淮陽郡云云清惠著聞為百姓惠愛求賢養士千有餘人賜與田宅吏舍自捐俸錢助之成邸五官掾西華陳騏等二百五人以延熹二年云云故其頌曰修德立功四縣回附見水經二十二渠水注陳城內有漢相王君造四縣邸碑文字剝闕不可悉識其略曰云云楚相孫叔敖碑楚相孫君諱饒字叔敖本是縣人也六國時期思屬楚楚都南郢南郢即南郡江陵縣也君受純靈之精懷絶世之才有大賢次聖之質少見技首蛇對其母泣吾將死母問其故曰吾聞見技首蛇者死今日見之母曰若奈之何吾行數十步念獨吾死可空復令他人見之死為因埋掩其刑母曰若無憂焉其陰德玄善遂為父母九族所異及其為相布政以道孝文象之度敬授民時聚藏於山殖物於藪宣導川谷波障源湶溉灌澤堤防湖浦以為池沼鍾天地之美收九睪之利以殷潤國家家富人喜優游樂業拭序朝墅無螟豐年蕃庶人有曾閔貞孝之行四民美好從容中節高梱改幣一朝而化其憂國忘私乘馬三年不別牝牡繼高陽重藜五舉子文之統其忠信廉勇禮樂文章軌儀同制其富國充民明天時盡地力霆堅禹稷不能踰也專國權寵而不榮華一旦可得百金至於沒齒而無分銖之蓄破玉玦不以寶財遺子孫終始若去不善如絶弦辟患害於無形狷節高義敦良奇介自曹臧孤竹吳札子罕之倫不能驂也生於季末仕于靈王立溷濁而澄清處幽昏而照明其遺武餘恨不與戲皇帝代同世世為列姃國在朝廷其意常墨墨若冠章甫而坐塗炭也病甚臨卒將無棺槨令其子曰優孟曾許千金貸吾孟楚之樂長與相君相善雖言千金實不負也卒後數年莊王置酒以為樂優孟乃言孫君相楚之功即慷慨商歌曲曰貪吏而可為而不可為廉吏而可為而不可為貪吏而不可為者當時有汙名而可為者子孫以家成廉吏而可為者當時有清名而不可為者子孫困窮披狷而賣薪貪吏常苦富廉吏常苦貧獨不見楚相孫叔敖廉潔不受錢涕泣數行若首王王心感動覺悟問孟孟具列對即求其子而加封焉子辭父有命如楚不忘亡臣社稷而欲有賞必於潘國下溼墝埆人所不貪遂封潘鄉潘即固始也三九無嗣國絶祀廢固始令段君夢見孫君則存其後就其故祠為架廟屋立石銘碑春秋蒸嘗明神報祚即歲遷長掖太守及期思縣宰段君諱光字世賢魏郡鄴人庶慕先賢體德允恭篤古尊舊奉履憲章欽翼天道五興通文藉祭祠祗肅神明臨縣一載志在惠康葬枯稟乏爰育藜蒸討掃醜類鰥寡是矜杜僞養善是忠表仁感想孫君乃發嘉訓興祀立壇勤勤愛敬念意自然刻石銘碑千載表績萬古標記福祐期思縣興士熾孫氏蒙恩漢延熹三年五月草八日立見隸釋三延熹三年歲在中夏之節政在封表期思長光視事一紀訪問國中耆年舊齒素聞孫君楚時良輔本起此邦垂名於後博求遺苗曾茲孫子孝龜吉辰五月辛卯宜以存廢可立碑祀招請諸孫都會國右郭西道北處所顯好興上牢祭倡優鼓舞式序其胄授之端首光以不肖貪追賢烈以自榮寵時丞左馮翊姓如諱武尉京兆周陵詳集共造戶曹掾裒騰令史許松相君有三嗣長子即封食邑固始少子在江陵中子居三虛襲業縝林二宗則其苗胄也相君卒後十有餘世有渤海太守字武伯武伯有二子長子字伯尉少子字仲尉仕郡為掾史伯尉有一子字世伯舉江夏孝廉城門侯仲尉有二子長子字孝伯荊州從事弟世信仕掾功曹會平哀之間宗黨為賊寇所殺世伯孝伯世信各遺一子財八九歲微弱不能仕學世伯子字子仲治産於績虛有六男一女大子字長都次子蘭卿次弟字仲陽次弟字叔通次弟字衛公次弟字劉卿此縝宗六父也孝伯子字文亦不仕學治産於材虛亦有六男一女大子字惠明次弟字次卿次弟字聖公次弟字稚卿次弟字産卿次弟字少都此材宗六父也世信一子相承季陵文卿孝公此虛一父別其高祖與材高祖父親兄弟孫氏宗族別譜紀也見隸釋三中常侍樊安碑君諱安字子仲南陽湖陽人也厥祖曰仲山父翼佐周宣出納王命為之喉舌以致中興食采於樊子孫氏焉亦世載德守業不銜在漢中葉篤生哲媛他合南頓實産世祖征討逆畔復漢郊廟而樊氏以帝元舅顯受茅土封寵五國壽張侯以功德加位特進其次竝以高聲處卿校侍中尚書據州典郡不可勝載為天下著性君幼以好學治韓詩論語孝經兼通記傳古今異義甘貧樂約意不回二天姿淑慎稟性有直秉操不移不以覬貴世政促峻邑宰寡識慢賢役德被以勞事然後慷慨礉憤宦于王室歷中黃門冗從假史拜小黃門小黃門右史遷臧府令中常侍其事上也貞固密慎矜矜戰戰作主股肱助國視聽外職不誣內言不泄為近臣楷模是以兄弟竝盛雙據二郡宗親賴榮年五十有六以永壽四年二月甲辰卒朝思其忠追拜騎都尉寵以印紱莢書褎歎賻贈有加嗣子遷實以幼弱夙敘王爵而喪所天禮備復位以延熹三年冬十有一月自上蒸祭乃尋惟烈考恭修之懿勒之碑石俾不失隧其辭曰肅肅我君帝躬是翼王事多難我君是力秉此小心以亮皇職惟帝念功庸以輿服大命傾霣魂神仙伏龜艾追遷用光其德藹藹遺稱他呈他式勒銘茲石垂示罔極勳名不剟永昭千億制詔中常侍樊安宿衛歷年恭恪淑慎嬰被疾病不幸蚤終今使湖陽邑長劉操追號安為騎都尉贈印綬魂而有靈嘉其寵榮烏呼哀哉延熹元年八月草四日丁酉下見隸釋六又見古文苑九君諱字元賓御史君之孫茂材君之子也其先出自周室歷秦及漢有國有家宰相牧守踵武相襲皆能輸力盡規紀功載籍迄君之身天鍾其美體茲明迹不器之量溫慈惠和行以忠恕弱冠喪父以孝立稱敦書悅禮心術藝土階環堵兼業並授門徒雲集盛于洙泗學優而仕位極州郡察孝廉郎謁者考工菀陵葉封丘令經國以禮帥下以德黎庶有恥莫用蛑賊遠屏姦軌掃迹以母憂去官服祥辟司空府補闕銜好是正直旻穹不弔降茲嗟年世有八延熹四年五月辛酉遭命而終國隕柱石之佐世喪英彥之士遠近嗟莫不傷焉咸以為絶美殊勳宜在金石垂示無窮乃作銘曰於穆王君穹天生德明允篤誠小心祇翼永言孝思閨庭允勑濟濟學徒來宗來式牧守加禮班敘志職貢皇國宿衛帝側王用錫命撫臨三國三國克寧乃大明服頌君永垂罔極見隸續十九
