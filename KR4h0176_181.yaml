body:
  text: 闕名漢故執金吾丞武榮碑君諱榮字含和治魯詩經韋君章句闕幘傳講孝經論語漢書史記左氏國語廣學甄微靡不貫綜久斿大學藐然高厲鮮於雙匹學優則仕為州書佐郡曹史主薄督郵五官掾功曹守從事年世六汝南蔡府君察舉孝廉郎中遷執金吾丞遭孝桓大憂屯守玄武戚哀悲𢝆加遇害氣遭疾隕靈君即吳郡府卿之中子敦煌長史之次弟也廉孝相承亦世載德不忝命不竟台衡蓋觀德於始述行於終於是刊石勒銘垂示無窮其辭曰天降雄彥資才卓茂仰高鑽堅允文允武內幹三署外口師旅口勒屯守奮威武旌旗絳天雷震電舉耀赫然陵帷哮虎當遂股肱之元輔天何不弔降此咎慟乎我君仁如不壽爵不副德位不稱功咸懷傷愴遠近哀同身沒萬世諷誦見碑拓本君諱富波君之子也天性少有令問敦孝以敕內名行以修外紹烈隆構厥基既仕州郡會孝順皇帝四巡以掾史召見帝嘉其忠臣之苗器其璵璠之質詔拜郎中遷常凶長史換楗為府丞君雖詘而就之以順時政非其好也乃翻然輕舉皋司纍辟應於司徒州察茂才遷鮦陽侯相金城太守德以化圻民威以懷殊俗慕義者不肅而成帥服者變衽而屬疆易不爭障塞無事功顯不伐委而退焉直南蠻蠢迪王師出征以君文武備兼廟勝先戰拜車騎將軍從事軍還策勳復以疾辭後乃徵拜議郎五官中郎將沛相天吏之治副當神人秩禮之選舉不踰賢故望大和則俟生育晞嚴霜則畏享戮欣悅竦栗寬猛必衷遭貴戚專權不稱請求考績不論徵還議官年五十六建寧元年三月癸丑遘疾而卒朝廷愍惜百遼歎傷民假爾莫不隕涕故吏戴條等追在三之分感秦人之哀願從贖其無由庶考斯之頌儀乃鐫石立碑劫銘鴻烈光於億載俾永不滅其辭曰明明楊君懿鑠其德其德伊何克忠克力勤止厥身帥靡革謨茲典猶道以經國班化梨元既清且寧武稜攜二文懷假冥遠人斯服休士充庭剛柔攸得以和以平勳速藐矣莫與爭光甘棠遺愛東征企皇念彼恭人惄焉永傷立言不朽先民所臧載名金石貽於無疆見隸釋七子十九世之孫公始即位辟故襄威卿為𣎶曹屬東閣祭酒以尚公拜上疾病卒官有子男二人各致身晨以與君建寧元年三月十八日丙申晨從四月十一日戊子到官謁孔子冢念歿親五內慘惻霰然隕涕故令晨追感亡父見遇立石以示後昆魂而有神照其見隸續十一續十一史晨饗孔廟碑相河南史君諱晨字伯時從越騎校尉拜建寧元年四月十一日戊子到官乃以令日拜謁孔子望見闕觀式路虔跽既至升堂屏氣拜手祗肅屑僾髣佛若在依依舊宅神之所安春秋復禮稽度玄靈而無公出享獻之薦欽回春饗導物嘉會述修璧雍社稷品制即上尚書參以符驗乃敢承祀餘胙賦賜刊石勒銘并列本奏大漢延期彌歷億萬時長史廬江舒李謙敬讓五官掾魯孔畼功曹史孔淮戶曹掾嶭東門榮史文陽馬琮守廟百石孔讚副掾孔綱故尚書孔立元世河東大守孔彪元上處土孔褎文禮皆會廟堂國縣員冘吏無大小空府竭寺咸俾來觀并畔宮文學先生執事諸弟子合九百七人雅歌吹笙考之六律八音克諧蕩邪反正奉爵稱壽相樂終日於穆肅雍上下蒙福長享利貞與天無極史君饗後部史仇誧縣吏劉耽等補完里中道之周左墻垣壞決作屋塗色修通大溝西流里外南注城池恐縣吏斂民侵擾百姓自以城池道濡麥給令還所斂民錢材史君念孔瀆顏母井去市遼遠百姓酤買不能得香酒美肉於昌平亭下立會市因彼左右咸所願樂又敕瀆井復民餝治桐車馬於瀆上東行道表南北各種一行梓夫子冢顏母幵舍及魯公冢守吏凡四人月與佐除見隸釋一竹邑侯相張壽碑君諱壽字仲吾其先蓋晉大夫張老盛德之裔世載勳遵師紀律不忝厥緒為冠帶理義之宗君孝友恭懿明允篤信敦悅經睢習父東光君業兼綜六藝博物多識略涉傳記矯取其用股肱州郡匡國達賢登善濟可登斑敘優能正躬帥陪臨疑獨照確然不撓有孔甫之風舉孝廉除郎中給事竭者贊衛王臺婁忠謇上嘉其節仍授命莢匡其京輦昭德塞違內平外成舉無遺愆遷竹邑侯相明德慎罰縣奉采土遭江楊劇賊上下征役賦彌年萌於戈杼軸罄殫君下車崇尚儉節軀自菲薄儲侍非法悉無所留并官相領省倉小府御吏朝無姦官野無淫寇教民樹藝三農九穀稼嗇滋殖國無災祥歲聿豐穰皤白之老率其子弟以修仁義蛑賊不起厲疾不行視事年載黔首樂化戶口增多國寧民殷功刊王府將授轓邦對揚其勛功曹周憐前將放濫君徹澄清憐顧愆悔過督郵周紘承會表問君常懷色斯舍無宿儲遂用高逝老弱相攜樊換持車千人以上沛相名君駱驛要請君捐祿收名固執不顧民無所邛國違所賴上下同戚州郡聞知旌弓禮招復為從事𧡪𧡪虎視不折其節辟司徒府進退以禮含弘內光疏皓爾𩔉天不遘疾無瘳年八十建寧元年五月辛酉卒鳴呼哀哉夫積修純固者為天人所鍾功假於民者敘在銘典於俊訪諸儒林刊石樹碑式昭令徽其辭曰亮元德於我君膺清茂體懿純超三署垂令甄聲號憲臺矯王業弼紫微彈群司清公緩薄賦牧邦畿梨蒸殷四荒饑感良臣哀其靈朅輕舉來征民歎思暨輿人宰府命遂名振射彌闡垂令紀永不刊于胥德流後昆見隸釋七衛尉衡方碑府君諱方字興祖肇先蓋堯之苗本姓則有伊尹在殷之世號稱阿衡因而氏焉土家於平陸君之烈祖少以濡術安貧樂道履該顏原兼修季由聞斯行諸仁癘土階夷愍之貢經常伯之位左馮翊先帝所尊垂名竹帛考廬江大守兄雁門太守孝長發其祥誕降于君天資純懿昭前之美少以文塞敦厖允元長以欽明耽詩悅書秋仕郡辟州舉孝廉除郎中即仜侯相膠東令遵尹鐸之導保彰二城參國起按斑敘本肇末化速郵州舉導尤異遷會稽東部都尉將繼南仲邵虎之軌飛翼軫之旌操參綏來王之蠻會喪太夫人感背人之凱風悼蓼儀之劬勞寢暗凷仍上言倍榮向哀扎服祥除徵拜議郎右北平大守尋李廣之在邊恢巍絳之和戎戎戢土佚費省巨億懷靜有績遷潁川太守修清滌俗招扳隱逸光大茅茹國外浮諼淡界繆動氣泄狂歸來洙泗用行舍藏征拜議郎遷大醫令京兆尹舊都餘化詩人所詠並有亡新君隆寬栗鶉火光物隕霜剿姦振滯起舊存亡繼絶恩降乾太威肅剝本朝録功入登衛翼紫宮夙夜惟寅禕在公有單襄穆典謨之風詔選賢良招先逸民君務在寬失順其文舉已從者退就敕巾永康之末君衛孝桓建寧初政朝用舊臣留拜步兵校尉處六師之師維時階將授緄職受任浹旬閹離寢疾年六十有三建寧元年二月五日癸丑卒詔遣使弔賻禮百臨會莫不失聲其年九月十七日辛酉德㘸蓋雅頌興而清廟肅中庸起而祖宗故仲尼既歿諸子綴論斯干作歌用昭於宣諡以銘以勒勳於是海內門生故吏采嘉石樹靈碑鐫茂伐祕將來其辭曰峨峨我君懿烈孔純高朗神武歷世忠孝馮隆鴻軌不忝前人寬猛不主德義是經韜綜頙溫故前呈攬英接𥝙踵迹晏平初據百里顯顯令聞濟康下民曜武南會邊民是鎮惟憂及退身參議帝室剖符守藩北靖有有聲旋守中嶽幽滯以榮邁種舊京含澤戴仁攸寧剋長剋君不虞不陽維明維允耀此聲香能哲能惠剋亮天功入統光光法言稽古道而後行兢兢業業素絲羔羊誾誾侃侃顒顒昂昂何規履矩金玉其相謇謇王臣群公憲章樂旨君子天疆銘勒金石問萬世是傳見碑拓本冀州從事張表碑君諱表字元異系帝高辛爰暨后稷張仲孝友雅藝伎載天挻留侯應期佐治與漢龍興誕發神謀君其胤也懿烈純德繼踵相承于來我君亦邦之雄兼才伯知高朗令融該覽群緯靡不究窮初仕郡為督郵鷹撮霆擊威德日隆糾剔荷𠈸抵拂頑訩屬城祗肅千里折中入為主簿含謨吐忠委蛇公門謇謇匪躬將美匡醜對揚休光歷五官掾功曹山時行貢真絀僞遏漸防萌后臧其勛俾守梨陽正身帥下神化通方伯術職嘉君義綱旌命骩任北國用寧遂播芳譽有馥其馨當陟台階注紀王庭顙矩未合實命不同度時否泰盤桓利貞歸斯服舍之則藏復攸陶父怡志嶽陽恬靜湛泊匪偟時榮春秋六十四以建寧元季三月癸已薨疾而終其季十有一月丙寅克葬僉以為洪德宜演述億載彌以新功烈不讚紀後來無所聞于是刊石勒銘以示後昆其辭曰於穆君兮煥流芳闡洪軌兮休烈彰令德攸兮宣重光仕郡州兮迪民康宜圭臣兮為楝梁旻不淑兮降淪霜凋芝華兮殲彥良伊哲人兮壽不將世雖短兮名悠長位雖少兮功悠揚伐松柏兮構斯堂鏤金石兮敻不亡萬子孫兮永蒸嘗見隸釋八之情窮七道之奧綜書藉賢仕郡歷五官掾功曹司隸從事仍辟大尉遷定潁侯相特以儒學詔書敕留定經東觀順玄介之指蠲歷世之疑天子焉擢拜議郎遷高陽令德以柔民刑以威姦是以黎庶愛若冬日畏如秋旻恩洽化布未有成頎甫斑方授銀苻聞母氏疾病孝蒸內發醳榮投黻步出城寺衣不暇車不俟駕載馳躬親嘗禧追䢨曾參繼迹樂正百行之主于斯為盛復辟司徒舉治劇拜思善侯相遭從兄沛相憂篤義忘寵飄然輕舉位淹名顯敷聞于下宜幹帝室他國輔臣上天不惠不我遺年五十有三年十月草八日壬寅卒凡百隕涕縉紳摧傷門徒小子喪茲師范悲將焉告卬叫窮倉感三成之義惟銘勒之制皆所已紀盛德傳無窮者也若茲不刊後哲曷聞故樹斯石以昭厥勳其辭曰玄乾鐘德于我楊君其德伊何如玉如瑩蒸蒸其孝恂恂其仁躬尚節儉文綱紀典謨見隸釋十一魯相史晨奏祀孔子廟碑建寧二年三月癸卯朔七日已酉魯相臣晨長史臣謙頓首死罪上尚書臣晨頓首頓首死罪死罪臣蒙厚恩受任苻守得在奎婁周孔舊寓不能闡弘德政恢崇一變夙夜憂怖纍息屏營臣晨頓首頓首死罪死罪臣以建寧元年到官行秋饗飲酒畔宮畢復禮孔子宅拜謁神坐仰瞻榱桷俯視几筵靈所馮依肅肅猶存而無公出酒脯之祠臣即自以奉錢修上案食醊具以敘小節不敢空謁臣伏念孔子乾坤所挺西狩獲麟為漢制作故孝經援神挈曰玄丘制命帝卯行又尚書考靈耀曰丘生倉際觸期稽度為赤制故作春秋以明文命綴紀撰書修定禮義臣以為素王稽古德亞皇代雖有褎成世享之封四時來祭畢即歸國臣伏見臨辟雍日祠孔子以大牢長吏備爵所以尊先師重教化也夫封土為社立稷而祀皆為百姓興利除害以祈豐穰月令祀百辟卿士有益于民矧乃孔子玄德煥炳光于上下而本國舊居復禮之日闕而不祀誠朝廷聖恩所宜特加臣寢息耿耿情所思惟臣輒依社稷出王家穀春秋行禮以共禋祀餘賜先生執事臣晨頓首頓首死罪死罪臣盡力思惟庶政報稱為效增異輒上臣晨誠惶誠頓首頓首死罪死罪上尚書時副言大傅大尉司徒司空太司農府治所部從事昔在仲尼汁光之精大帝所挺顏母育靈承敝遭衰黑不代倉流應聘嘆鳳不臻自衛反魯養徒三千獲麟趣他端門見徵而書著紀黃玉響應主為漢制道審可行乃作春秋復演孝經刪定六藝象與天談鉤河擲雒卻揆未然巍巍蕩蕩與乾比崇見隸釋一金鄉長侯成碑君諱成字伯盛山陽防東人也其先出自豳岐周文之後封于鄭鄭共仲賜氏曰侯厥胤宣多以功佐國要盟齊魯嘉會自邡因以為家焉漢之興也侯公納英濟大上皇于鴻溝之厄諡曰安國君曾孫酺封明統侯光武中興玄孫霸為臨淮大守擁兵從光武平定天下轉拜執法右刺姦五威司命大司徒公封於陵侯枝葉繁茂或家河洧或邑山濟君則上黨太守之弟幼履慈孝之德長執忠謇之操治春秋經博綜書傳以典藉教授滋滋履真安貧樂道忽于時榮敬上接下溫故知新翹節建志冠于群倫孝友內著仁義外宣郡請署主簿督郵五官掾功曹守金鄉長即家假印綬君介心如石不易其志刺史嘉其高名辟部東平泰山治中從事君睿精謙虛委蛇衡門以禮盤桓名德可尊行顯身隱縣輿養神聖人制命曰仁常存今胡不然喪此國偉君年八十一建寧二年歲在已酉四月二日癸酉遭疾而卒嗚呼哀哉于是遐邇士仁祁祁來庭集會如雲號哭發哀泣涕汍蘭將去白日歸彼玄陰同盟必至縞素填街存有顯名終有遺勳魂如有靈嘉斯寵榮于是儒林衆俊惟想邢景乃樹立銘石以揚淑美其辭曰於穆君德姿履正平乾皇所挻應符如生耽藝樂術恬忽世榮虛位禮請介然不傾壽非南山不俟河清梁木圮頽鴻儀催零昆嗣切剝哀慟感情乃銘乃勒億載永寧夫人以延熹七年歲在甲辰十一月三日庚午遭疾終見隸釋十八孝廉柳敏碑故孝廉柳君諱敏字愚卿其先蓋五行星仲草八舍柳宿之精也放像為用縣設為道商家而禪而主或聞生柳惠國大夫而流俗稱焉君父以孝廉除郎中部府丞君追祖繼體歷職五官功曹守宕渠令本初元年太守蜀郡君復察舉君命失年君清節儉約厲風子孫固窮守陋不堂無文麗墓無碑識建寧元年縣長同歲楗為屬國趙臺公憤然念素帛之義其二年十月甲子為君立碑傳于萬基因勒銘歎之厥辭曰惟斯柳君天資鯁襲祖風行無遺闕授政股肱諫爭匡弼奮威外梱屬城震栗宰守伯煩垂名所立表貢王庭望極爵位何辜穹倉官寵不遂豫惟三六庶昔延季建豎斯碑傳于萬世子孫繁昌永不漫滅嗚呼哀哉辭曰山陵玄室斯邦兮先人修質尚約清兮汶飭不雕處靈臧兮季子信舊帶樹松兮僑俗追歿激揚兮亡而像存樂嘉靈兮宗子于集喈其鳴兮四祀蒸嘗不廢充兮見隸釋八淳於長夏承碑君諱承字仲充東萊府君之孫大尉掾之中子右中郎將弟也纍葉牧守印紱典據十有餘人皆德任其位名豐其爵是故寵祿傳於歷世策薰著於王室君鍾其美受性淵懿含和履仁治詩尚書兼覽群藝靡不尋畼州郡更請屈已匡君為主薄督郵五官掾功曹上計掾守令冀州從事所在執憲彈繩糾枉忠潔清肅進退以禮允道篤愛先人後己克讓有終察孝不行大傅胡公歆其德美旌招俯就羔羊在公四府歸高除淳於長到官正席流恩褎善糾姦示惡旬月化行風俗改易轓軒六戀飛躍臨津不日則月皓天不弔此良人季五十有六建寧三季六月癸已淹疾卒官嗚呼痛哉臣隸辟踊悲動左右百姓號咷若喪考妣咳孤憤泣忉怛傷摧勒銘金石惟以告哀其辭曰於穆皇祖天挺應期佐時理物紹縱先軌積德勤約燕於孫子君之群戚并時繁祉明明君德令問不已高山景行慕前賢列庶同如蘭意願未止中遭冤叐不終其紀夙世霣祚早喪懿寶抱器幽潛永歸蒿里痛矣如之行路感動黨魂有靈垂後不見碑拓本郎中馬江碑君諱江字元海者濟陰乘氏人之長孫湯官丞之元子其先帝顓頊翳嬴之後世在趙國以功封趙賜號馬服因遂氏焉暨于君身乾靈特挺岐嶷有度玄然清妙長有令稱通韓詩經贊業聖典左書右琴明於光上之術顯於君臣之道郡將平原高君深昭其德以和平元年舉孝廉除郎中謙虛接下冠名三署昊天不遭離癘年卌元嘉三年正失貞幹仕喪儀宗於是盟軌遼醜縞素來赴慘痛號咷者不可勝數矣夫人冤句曹氏終溫淑慎咸曰女師年五十五建寧三年十二月卒君中弟字文緒位主薄督郵志行期落落自有大節年卅二早世短折故塋迫芒兆告斯士先君之庚地處還敞神東看祖禰西眷舊廬皇神仿佛爰居乃碑銘勒厥勳其辭曰鑠鴻德赫含光天爵衛紫聲著于周京榱桷存其人亡藏顧几筵悽懷傷嗟詩云感凱風歎寒泉惟梓桑靈期裔永克昌歿不朽久彌章見隸釋八青陂碑青陂在縣坤地源起桐柏淮川別流入于潺湲徑新息墻陂衍入褒信界灌溉五百餘頃見水經汝水注建寧三年新蔡長汝南緱氏李言上請修復青陂司徒臣訓尚書臣襲奏可于洛陽宮青陂東塘南樹碑慎令劉修碑君諱修字伯麟從事君履和而至少罹囏苦身服田畝動乎儉中從虛弟克諧其于鄉黨遜遜如也卑謙博愛恕已接人政事君則安上竭節不求聲譽故為五福所歸流神明所時兄弟竝典干城子孫盈門克昌堂構非至德淳粹其孰能與斯舉孝廉除郎中以將事去官辟從事司徒掾典掌邊事遷慎令行無為之政崇淡泊以惠利素苦風痺到官期月見臣吏敕兒子人命呼吸不欲煩擾吏民欲生見舊土歸終於家百姓追逐扣馬攀輪遂不復還年六十七建寧四年五月甲戍卒二弟龍純攣哀孔懷孤生俊協郃長號恩慕立此碑銘以表景行其辭曰於惟君德忠孝正直至行通洞高明柔克鬼神富謙受茲介福知命不延引輿旋歸忽然輕舉曒拔葵人皆有亡貴終譽兮歿而不朽垂名著兮見隸釋
