body:
  text: 闕名西狹頌漢武都太守漢湯阿湯李君諱翕字伯都天姿明敏敦詩說禮膺祿美厚繼世郎吏幼而宿衛弱冠典城有阿鄭之化是以三𦵿符守致黃龍嘉禾木連甘露之瑞動順經古先之以博愛陳之以德義示之以好惡不肅而成不嚴而治朝中惟靜威儀抑抑督郵郡職不出府門政約令行強不暴寡知不詐愚屬縣趍教無對會之事徼外來庭面縛二千餘人年穀屢登倉庾惟億百姓有蓄粟麥五錢郡西狹中道危難阻峻緣崖俾閣兩山壁立隆崇造雲下有不測之溪厄苲促迫財容車騎進不能濟見不能駐數有顛覆霣隧之害過者創楚惴惴其栗君踐其險若涉淵水歎曰詩所謂如集于木如臨于谷斯其殆哉困其事則為設備今不圖之為患無已敕衡官有秩李瑾掾仇審因常繇道徒鐉燒破析刻臽崔嵬減高就埤平夷正曲柙致土石堅固廣大可以夜涉四方無雍行人歡悀民歌德惠穆如清風乃刊斯石曰赫赫明后柔嘉惟則克長克君牧守三國三國清平詠歌懿德瑞降豐稔民以貨稙威思竝隆遠人賓服鐉山浚瀆路以安直繼禹之迹亦世賴福建寧四年六月十三日壬寅造時府丞右扶風陳倉呂國字文寶門下掾下辨李虔字子行故從事議曹掾下辨李旻字仲齊故從事主簿下辨李遂字子華故從事主簿上祿石祥字元祺五官掾上祿張亢字惠叔故從事功曹下辨姜納字元嗣故從事尉曹史武都王尼字孔光衡官有秩下辨李瑾字瑋甫從史位下辨仇靖字漢德書文下辨道長廣漢汁邡任詩字幼起下辨丞安定朝那皇甫彥字子才見碑拓本又見隸釋四無丞右扶風陳倉呂國以下十二人名博陵太守孔彪碑君諱彪字元上孔子十九世之孫潁川君之元子也君少履天姿自然之正帥禮不爽好惡不愆考衷度修身踐言龍德而學不至於穀浮游塵埃之外嚼焉泛而不俗郡將嘉其所履前後聘召蓋不得已乃翻爾束帶玄論窮理直道事人仁必有勇可以託六授命如毛諾則不宿美之至也莫不歸服舉孝廉除郎中博昌侯疾病留宿遷京府丞未出京師遭大君憂泣踰皋魚喪過乎哀謹畏舊章服竟還署試拜尚書侍郎無偏無黨遵王之素薦可黜否出度日恪位佇所在祗肅拜治書御史膺皋陶之廉恕參之律袛用既平博陵太守郡阻山以饑饉斯多草竊罔不賊劉曼張丙等白日攻剽坐家不命君下車之初五教以博口削四凶勝殘乃爰尚桓桓拯馬蠲害醜類已殫路不拾遺斯民以安發號施憲每合天心之所惡不以強人義之所欲不以姓樂政而歸於德望如父母順如流水遷下邳相河東大守舉此君子風也未怒而懼不令而從雲行雨施大和海內歸公卿之任矣勞而不伐有實若虛固執謙需以病辭官去位闔以孝竭餘暇𢔦彈琴擊磬之味而不改其靜上帝棐諶天秩未究將據師輔之紀之綱而疾彌流乃隕乃年卅九建寧四年七月辛未哀哉魂神超邁家兮冥冥遺孤忉絶于嗟想形哀遠念不欲生群臣號咷靡所復逞夫逝往不可追兮功識惟君之軌迹兮如列宿之錯置易建八卦揆軗辭述而不作彭祖賦詩皆讚所見于時頌是吏崔王沛等伏信好古敢詠顯乃刊斯石欽銘洪基昭示後昆申錫鑒思其辭曰穆穆我君大聖之胄惇懿允元睿其玄秀惟嶽降精誕生忠良奉應郡貢亮彼我克明王道辨物居方周也正名朝無枇政直哉惟清出統華夏化以典城猾殄迸賢倚庭帝重乃勛自征所臨如神之翰先民是程宜乎三事金鉉利貞而潔白駒俾世憤惻當享眉耇莫匪爾極大邈矣不意于嗟悲兮息庶幾復焉所力咨乎不朽沒而德存伊尹之休格于皇天惟我君績表于丹清永永無沂與日月并於嗟於以慰靈見碑本隸釋八石門銘建寧四年十一月黃場石見水經濟水注君諱字仲奇元城君之弟四子其先蓋周之胄緒虞郭建國享土受胙政衰道失晉克其邦遭嬴項之際高祖初起運天符命𢇛秦擲楚遂定漢基枝葉雲布列於國郡或潁川馮翊公卿校尉將相州郡令問休貴自東郡衛國家乎河內彼亦世載德以臻於君君惠兄竹邑侯相次尚書侍郎次濟北相順弟臨沂長次徐州刺史次中山相次雒陽令咸以孝廉公府茂選貞亮曒白翼翼瑛彥配周之八為國楨幹君幼有岐嶷天然之資長有明肅弘雅之操剛毅多略有凶甫之縱沈懿敦篤為萬夫之望為郡五官掾功曹司隸中都官從事虎視耽耽鷹電擊貴戚肅承莫不畏憚三辟將軍府徵書粲粲貞亮直方謇謇衎衎忠信可結義然後諫舉廉比陽長五教加仁施于惠康焉於之武以抑於彊改邑移風遺愛不忘聞兄疾病率爾逝將職有闕賴君匡復辟司徒拜軍中候當授城萬里膺揚念妨弟路遜位恬榮修黃老之術謙守足之讓祿有不究命有短長臨孔明殘隕貞良卒被氛氣掩忽徂亡年六十有六建寧四年九月丙子卒五年三孝孤忉乎悲𢝆剝裂行路泣血辟踊傷絶凡百君子靡不哀惻喪國之鎮朝失模式奐乎位未副德刊石甄表以昭罔極其辭曰鑠明德穆郭君外忠潔內資親烈桓桓煥有文所臨風崇和陸垂以仁赫斯發威若神動規櫃禮義遵徽縱顯功加民感兄疾電損官妙海聞亮矣清寡匹倫爵不副命乖分土歔欷惜增歎孝流涕痛傷肝魂靈餝號有榮永存勒金石示後昆見隸釋九武都太守李翕天井道碑蓋除患蠲難為惠鮮能行之斯道狹阻有坂危峻天井臨深之厄冬雪則凍渝夏雨滑汰頓躓傷害民苦拘駕推排之役勤勞無已過者戰戰以為大戚大守漢陽阿陽李君履之若辟風雨部西部道橋掾李鐉鎚西坂天井凶止人丈四尺堅無臽潰安無傾覆四方賴之民悅無彊君德惠也刊勒紀述以示萬載建寧五年四月草五日已酉訖成見隸續十一成陽靈臺碑惟帝堯母昔者慶都兆舍窮精氏姓曰伊體蘭石之操履規櫃之度則乾坤之象通三光之曜游觀河濱感赤龍交如生堯厥後堯來祖統慶都告以河龍堯歷三河有龍授圖躬行聖政以育苗萌火陽之盛先暗後明遂以侯伯𨒭踐帝宮慶都仙歿蓋㘸于茲欲人莫知名曰靈臺上立黃屋堯所奉祠下營以水神龍所熹靈龜隱形汾踊波流比目魚濯鱗通泉玄礫菟蘆生臺涯貫長歷久崇如不穨三代改易荒廢不修五運精還漢受濡期興滅繼絶如堯為之承祠基年魚復生故有靈臺嗇夫魚師衛仕驛憲魚服之筵壽之際道小衰沮遂遭亡新禮祠絶矣於是故廷尉仲定深惟大漢隆盛德被四表大平未至靈瑞未下四夷數侵軍甲數擾匪皇啓居日稷不夏案經考典河洛祕薁漢感赤龍堯之苗胄當修堯祠追遠復舊復治黃屋推原聖意災生變見天以譴告前後奏上陳敘大義詔祥塞咎為漢來祚朝廷克省帝納其謀歲以春秋奉大牢祠時廷尉選位連自表奏招英嘉命遂見聽為大中大夫歸治黃殿令月吉日立𧠺塋興業會工厥處夷平上合天意下應餝五色精上闕通天戶嚮少陽前設大壂俟神之堂地致石墠其下清涼可舞八以大章時濟陰太守巍郡審晃成陽令博陵菅遵各遣大掾輔助仲君經之營之不日成之神靈精氣依怙于人廢之則亡存之則神復帥群宗貧富相均共慕市碑著立功訓勒石銘中門之表卜擇元日齊革精誠先薦毛血謹慎犧牲祈祠獲福神享其靈甘雨時降百穀孰成幽荒率服徐方來庭萬國蒙祉黎元賴榮莫不被德咸歌頌聲其辭曰於赫慶都德彌大兮承神精耀統赤裔兮爰生聖堯名蓋世兮上受符命𨒭帝制兮廣彼之恩流荒外兮歷紀盈千垂遺愛兮陵廟復崇享大祭兮上來多怙降福沛兮萬國禧寧孰不賴兮光宣美勛永𦿝兮垂視罔極億萬歲兮濟陰太守魏郡陰安審君諱晃字元讓從公車令來成陽令博陵蠡吾菅君諱遵字君臺從東明門司馬來丞潁川新汲尹茂字伯舉遷下邳尉尉潁川襄城楊調字君舉仲欣伯海從右中郎將遷巨鹿太守仲球伯儀從大尉掾遷呂長仲選孟高辟司徒府遷從不絶皆興治大聖黃屋之力惟仲阿東年在元冠幼有中質遵櫃蹈規上仁好義見群從無者代出錢萬以立碑大意翻然君子善之恩加骨鄉朝所稱縣令菅君即請署門下議生都市掾官未可測矣仇福字仲淵纍世同居州里稱術慈孝大聖立祠時令菅君欲造黃屋壂廡來索忠良咸白福見隸釋一字伯起氏焉聖漢龍興楊喜佐命克項於垓錫公侯之胄必復其始是以神祗降祚乃生於公實履忠貞恂美且仁博學甄微靡道不該又明尚書歐陽河洛緯度窮神知變與聖同符鴻漸衡門群英雲集咸共飲酌其流者有踰三千至德通洞天爵不應貽我三魚以章懿德遠近由是知為亦世繼明而出者矣州郡虛己競以禮招大將軍辟舉茂才除襄城令遷荊州刺史東萊涿郡太守所在先陽春以布化後秋霜以宣威寬猛惟中五教時序功洽三邦聞于帝京徵旋本朝歷大僕大常遂究司徒大尉立朝正色恪勤竭忠無德不恮靡惡不形將訓品物以濟大清而青蠅嫉正醜直實繁橫共構譖慷慨暴薨於時群后卿士凡百黎萌靡不欷歔垂涕悼其為忠獲罪乾監孔昭神鳥送葬王室感寤姦佞伏辜公功乃伸追録元勳書慰勞賻賵有加除二子郎中長子牧富波侯相次讓趙常山相次秉實能纘修復登上司陪陵京師次奉黃門侍郎牧子統金城太守沛相讓子著高陽令皆以宰府為官奉遵先訓易世不替天鍾嘉祚永世罔極統之門人汝南陳熾等緣在三義一頌有清廟故敢慕奚斯之追述樹玄石于墳道其辭曰穆穆楊公命世而生乃台吐耀乃嶽降精明明天子實公是匡冥冥六合實公是光謇謇其直皎皎其清懿矣盛德萬世垂榮勒勳金石日月同烔見隸釋十二東海廟碑惟永壽元年春正月有漢東海相南陽桓君念四時享祀有常每飾臺切旋則陀崩矜閔吏費者不永寧几尊靈祗敬鬼神實為黔𥡓祈福咸慕義民相帥四面並集乃部掾何俊左榮殿作兩傳起三樓經構既立事業畢成俊等鐫石欲榮非仁也故遂闕而不著初縣典祠雖有出附增之絶請求姑息之源瀕海鹽月有貴賤收責侵侔民多限貧富俱均下不容姦仁憂惠康民賴其利熹平元年夏四月東海相山陽滿君初朐令進瞻壇退宴禮堂嘉羡君功既爾是乃退咨惜勛績不著後世無聞遂作頌曰浩浩倉海百川之宗經落八極潢洪波潤物雲雨出焉天淵禎祥所昔在前代昭事百有司齊肅致力四時奉祀蓋亦所以敬恭明神報功闕倚傾于櫟桓君是繕是修慕不日而成功孫退述爰勒斯銘芳烈永著載垂馨見隸釋二碑陰闕者秦始皇所立名之秦東門闕事在史記見隸釋二故民吳仲山碑熹平元年十二月上旬吳公仲山少立名迹約身彫己節度無隻不貪仕進隱匿世間府縣請召未曾𨶳城守鮮貧苦不豫輝榮兄弟三人居其中央事長接幼出入敖詳元少不幸棄世早亡乾蓋載八十有長年壽未究而遭禍央子孫飲泣呼招不能還與世疆爾𢠔𤹯奈何何惟公德美布惠州里遠近假求不言無有春秋舉𠏞給與無已不逆人意率導以理市庭佑渠飲食空斗收襜遺孤皆置門裏先亡為葬幼弱娶婦受恩者無販不能悲嗟效社里其因捐施豈誰照矣公本有三息遺孤二莊無分少德父有餘財東西南北不能起樓高殿觀不色宗諸邂逅連有不得兼官徹傍象不及大孤漸亡父憂在夙夜如有空蓋神零有知水徂挺焉焉矣矣子孫萬歲見隸釋九司隸校尉楊淮碑故司隸校尉楊君厥諱淮字伯邳舉考廉尚書侍郎上蔡雒陽令將軍司長史任城金城河東山陽太守御史中丞為尚書尚書令司隸校尉將作大匠河南尹伯邳從弟諱弼字穎伯舉孝廉西邦長伯母憂去官復舉孝廉尚書侍郎遷注丞冀州刺史大醫令不邳相元弟功德牟盛當究三事不幸早隕國喪名臣州里去覆二君清頌約身自守俱大司隸孟文之元孫也黃門同郡卞玉字子圭以熹平二年二月草一日謁歸過此追述勒銘故財表紀見隸續十一米巫祭酒張普題字熹平二年三月一日天未鬼兵胡九仙歷道成玄施延命道匹一無布於伯氣定召祭酒張普萌生趙廣王盛黃楊奉等受微經十二卷祭酒約施天師道法無極才見隸續三武都太守耿勳碑漢武都太守右扶風茂陵耿君諱勳字伯瑋其先本自巨鹿世有令名為漢建功俾侯三國卿守將帥爵位相承以迄于君君敦詩說禮家仍典軍壓難和戎武慮慷慨以得奉貢上計廷陳惠康安遏之謀上納其謨拜郎上黨府丞掌令考績有成符莢乃胙熹平二年三月六日癸酉郎官奉宣詔書哀閔垂恩猛不殘義寬不宥姦喜不縱慝威不戮仁賞恭罰否畀奧流其於統系寵存贈亡篤之至也歲在癸丑厥運淫雨傷害稼穡率土普議開倉振淡身冒炎赫火星之熱至屬縣巡行窮匱陟降山谷經營拔涉草止露宿扶活養餐千有餘人出奉錢兩振衣賜給貧乏發荒田耕種賦與寡獨王佳小男楊孝等三百餘戶減省貪吏二百八十人勸勉趍時百姓樂業老者得終其壽幼者得以全育甘棠之丈不是過矣又開故道銅官鑄作錢器興利無極外羌且居等怖威悔惡重譯乞降修治狹道分子效力復大小民得衆兆之歡心可謂卬之若明神者已夫美政不紀人無述焉國人命歎刊勒斯石表示無窮其辭曰泰華惟嶽神曜吐精育茲令德既哲且明實謂耿君天胙顯榮司牧蒞政布化惟成柔嘉惟則穆如風清勤恤民隱拯厄扶傾匪皇啓處東撫西征赤子遺慈以活以生山靈挺寶胸災乃平愷悌父母民賴以寧熹平三年四月二十日壬戍西部道橋掾下辨李造見碑拓本又隸續十一漢故司隸校尉忠惠父魯君碑君諱峻字仲嚴山陽昌邑人其先周文公之碩胄伯禽之懿緒以載于祖考之銘也君則監營謁者之孫修武令之子體純和之德秉仁義之操治魯詩兼通顏氏春秋博覽群書無物不刊學為偄宗行為𣎶表漢始仕佐職牧守敬愘恭儉州里歸稱舉孝廉除郎中謁者河內大守丞喪父如禮辟司徒府舉高第侍御史東郡頓丘令視事四年比縱豹産化行如流遷九江大守殘酷之刑行循吏之道統政載穆若清風有黃霸召信臣在潁南之歌以公事去官休神家弄未能一朞為司空𡉐畼所舉徵拜議郎太尉長史御史中丞延熹七年二月丁卯拜司隸校尉董督京輦掌察群寮蠲細舉大榷然疏發不為小威以濟其仁弸中獨斷以效其節案奏公彈絀五卿華夏袛肅佞穢者遠遭母憂自氣拜議郎服竟還拜屯騎校尉以病遜位守疏廣止足之計樂於陵灌園之契閈門靜居琴書自娛年六十二熹平元年月癸酉卒明年四月庚子葬於是門生汝南干沛國丁直魏郡馬萌勃海呂圖任城吳盛陳留誠屯東郡夏侯宏等三百草人追惟在昔游夏之徒作諡宣尼君事帝則忠臨民則惠乃昭告神明諡君曰忠惠父息睿不才弱冠而孤承堂弗構𣂔薪弗何悲蓼莪之不報痛昊天之靡嘉頓企有紀能不號刊石敘哀其銘曰岩岩山嶽礧落彰䡈棠棠忠惠令德孔㜰命時生雅度宏綽允文允武厥姿烈逴內懷溫潤外撮強虐督司京師穆然清邈當緄職為國之榷匪究南山遐邇忉凡百君子欽諡嘉樂永傳啻齡㬇矣的的見隸釋九碑木廣漢屬國侯李翊碑君諱翊字輔國牂柯大守曾孫謁者孫從事君之元子也其先出自箕子之苗奕世載德迄君之身幼有貞恪謙約之操長柯芬芳成人之行通經綜緯兼究古雅初妣憂勤思盡情及繼母嗣承慈愛如前養則竭力克勤和顏名顯近遠論者稱焉郡守嘉貪禮請署督𨛀五官功曹守長朝有申甫之節居則會閔之風延熹六年大守東萊李君懿其高潔順天報國察舉孝廉除郎中特慕供養常託疾在家時益部擾穰為三府所選拜廣漢屬國侯到官鷹揚威褱以文得殊俗歡心撥理之效至建寧元年遭從事君憂去官二交追孿詠其甘棠竭孝道以送終松柏而憔刑禮服既盡州郡爭取比群部諸郡深執匪棲遲不就童冠相娛閨門雍雍夷史之高著臨究前軌當為國之幹臣穹旻逝皇祚不永年五十四以熹平二年卒凡百慘愴同時感傷九內外莫不絶傷於是乃采石勒銘垂示後昆赫赫惟忠屬國李侯發迹邑屋聲冠方嵎貢德王室顯名遼疇御侮鎮戎經為大儒考憂釋紼公義卓休終而有禮哀榮兼殊沒而含曜比列陵於嗟兮魂靈烏呼悲夫見隸釋九
