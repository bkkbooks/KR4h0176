body:
  text: 闕名玄儒先生婁壽碑先生諱壽字元考南陽隆人也曾祖父攸春秋以大夫侍講至五官中郎將祖父大常博士徵朱爵司馬親父安貧守賤不可榮以祿先生童孩多奇岐嶷有志捥髮傳業好學不厭不攸廉隅不飭小行溫然而恭慨然而義善與人交久而能敬榮且溺之耦耕甘山林之杳藹遁世無悶恬佚淨漠𢓡衡門下學上達有朋自遠冕紳莘莘朝夕講習樂以忘憂郡縣禮請終不回顧高位厚祿固不動心蔍絺大布之衣糲蔬菜之食蓬戶茅宇棬樞甕牖樂天知命榷乎其不可拔也是以守道識真之士高尚其事鄉䣊州鄰貢親愛懷年七十有八熹平三年正月甲子不祿國人乃相與論德處諡刻石作銘其詞曰皇矣先生褱德惟明優于春秋玄嚜有成知賤為貴與世無爭𢓡衡門禮義滋醇窮下不苟知我者天身歿聲鬯千載作珍綿之日月與金石存見碑拓本又隸釋九弟富波君之少子也生姿令哲長履忠孝立仁行道實體彌隆世授尚書為國師輔君述而好古少傅祖業兼苞載藉靡不周覽英儒仰則景附其高應禮州郡仍奉貢覲寮類假爾僉服歸稱大駕省方為郡功曹召見專對克厭帝心擢拜郎中除右都侯間整宮衛闈闥肅焉遷繁陽令崇德尚儉以興政化和育威恩以移風俗野無姦回宿不命閽教學吏士精橫侍者常百餘人咸訓典誨帥導以鄰遠歸懷爰集疆埸州郡嘉異並上絶逋大司農劉侑復表列將有命授會叔父大尉公薨委榮輕舉投黻如遺吏民攀轅老弱軔輪追慕跋涉蓋二千餘人續留守闕上書歷年運穀萬斛助官振貧以乞還君自非慈愛孰能若茲有司聳昧莫能識察君潔已以休不愈祿求趨功顯弗有入于林處靖衡門童冠如雲故乃名問俞高休聲益著三府兢辟五入宰朝常登茂御復紹祖烈旻穹不惠年五十一熹平三年三月已丑卒國失其良民望永絶京夏凡百靡不愍悼故吏臣隸叫天訴墜唾乎何及哀矣慛傷感惟既歿德之隆者莫盛不㱙乃共追厥勳鐫石示後俾延億軨垂不翳髦其辭曰惟嶽降靈於我明君膺天鐘慶誕德孔醇溫恭博敏貞皎藐倫帝嘉忠懿乃詔寵光俾侯禁宮夙夜是勤命出化宰清風穆神委蔑成勳赴義長逝民思遺愛奔告于𥝍頎不審真莫肯慰揚徲樂志縉紳仰從二公並招當為國暉壽不早葉隕林朋徒潺湲士女愴悲百其身皇不我豫銘頌玄石見隸釋九桂陽太守周憬功勳銘桂陽太守周府君者徐州下邳人也諱憬字君光體性敦仁天姿篤厚行興閨門名州里舉孝廉拜尚書侍郎遷汝南固始相遂拜桂陽乃宣魯衛之政敷二南之澤政以德綏化猶風騰撫集丞細綏有方進則貞直退則錯枉崇舉濟濟吉土充朝招訓蒙開誘六蔽君子道長小人道消信感神祇靈瑞符嘉榖生於墅奇草像萐莆異根之樹超然連理於此時邦域惟寧郡又異南海接比商旅所臻自瀑亭至乎曲紅一由此水其水源也出於王之山山蓋隆於天泉肇沸踊發射其顛分流離散為十二川彌陵隮阻丘阜錯連隅陬壅藹末由騁焉爾乃貫山鑽石經揚爭怒浮沈潛伏蛇龍蛣屈澧隆鬱浥千渠萬澮合聚溪澗下迄安六瀧他難湍瀨𣶨𣶨泫泫潺湲雖詩稱百川沸騰高岸為谷深谷為陵蓋莫若斯天軓所經惡得已改其下注也若奔車失轡狂牛無縻勿巟忽臚睦不相知及其上也則群輩相隨檀柁提唱號慷慨沈深不前其成敗也非徒喪寶玩隕珍奇贊珠貝流象犀也往古來今變甚終矣於是府君乃思夏后之遺訓應龍之畫傷行旅之悲窮哀祤人困厄感蜀守冰殄絶犁魋嘉夫昧淵永用夷易乃命良吏帥壯夫排穨石投之寥高填下鑿截回曲弼水之邪性順導其經脈斷硍濭之電波弱陽侯之洶涌由是小溪乃平直大道允通利抱布貿絲交易而至升涉周旋功萬於前除昔樹塞於茲雖非龍門之鴻績亦人君之德宗故船人歎於水渚行旅語於塗陸孔子曰禹不決江疏河吾其魚矣於是熹平三季歲在攝提仲冬之月曲紅長零陵重安區祉字景賢遵承典憲宣揚德訓帥禮不越欽仰高山乃與邑子故吏龔臺郭蒼龔雒等命工擊石建碑於瀧上勒銘公功傳之萬世垂示無窮其辭曰乾坤剖兮建兩儀剛柔分兮有險夷咨中嶽兮穆崔嵬歎衡林兮獨傾虧增陡峭兮甚嶇崎鯀莫涉兮禹不規仰王兮又峗俯瀧淵兮怛以悲岸參天兮無路徯石縱橫兮㳅洄洄波隆隆兮聲若雷或抱貨兮以從利或追恩兮有赴義泛舟輯兮有不避躬軀于玄池委性命兮于芒縲憯寒栗兮不皇計忽隨流兮殆忘歸懿賢后兮發聖英閈不通兮治斯溪蹶巨石兮以湮填開切兮導曲機摧六瀧兮弱兮散其波威怒定兮混灡灡息聊啾兮逝兮蛟龍臧睦老唱兮臚人歌名冠卉兮超踰倫今稱兮耀流沙功斐斐兮鏡海裔君乎君壽不訾見隸釋四聞喜長韓仁碑熹平四年十一月甲子朔草二日乙酉司隸河南尹校尉空暗典統非任素無績勳宣善仁前在聞喜經國以禮刑政得中有子産君子尉表上遷愧里令除書未到不幸短命喪身為祀則祀之王制之禮也書到郡遺吏以少牢祠勒異行勗厲清惠以旌其美豎石訖成表言如律十一月草二日乙酉河南母君丞喜謂京寫墳道頭訖成表言會月世日如律令見碑拓本帝堯碑帝堯者蓋昔世之聖王也其先出自塊嵬翼火之精有神龍首出于常羊生赤也名紀見乎河雒爰嗣八九慶都與赤龍交而生伊堯及堯之生也不凡等胸龍顏角眉八采謖自侯伯遊於玄河之上龍龜負銜投鈴授與然後堯乃受命蜀鹿秉圖書察度表御九州統屬理聞名應郵五緯順晷然後風化大洽普天不功成告讓遂禪舜黃聖漢龍興纘堯之緒祠以上犧暨於亡新圮漢之業禮祠祀是故廷尉卿以為大聖親垂隆烈遺歌在民而壇場夷替屏懾無位非所以表神聖民者焉復舊典造立靈廟以一大牢春秋秩祠是以好道之疇自遠方集或弦琴一或談歷丹田痾者恭祈福即獲祚若不虔愘輒赴癲故知至德之宅兆實真聖之祖也熹平四年冬十二月濟陰大守河南張寵丞潁川李政成陽令陳國鄭真故巨鹿太守仲欣故廣宗長仲選故以長仲球丞百石已氏讓禮等咸各有惟追慕聖烈乃共立壇墠刊碑紀石已章聖德後有於赫大聖奕孔禎純性發蘭石生自馥芬琦表射出雙握嘉文排啓闛闔馳步順敘五品用訓民不作忒化洽百蠻歷運遭七乃禪舜焉功綿日月名勒管弦立靈廟兮休神釐兮湘黔民億不殄兮祉無圻故濟陰太守劉郃字季承漁陽泉州人也自以體別枝布堯之裔胄下車出奉萬為祠醊弱至于朔旦特復五百稱玄玄孫以敘嘉敬舊祠屬縣君以為奉事神聖禮虔當宜崇祖濯以汁敕縣設供曹掾史令養性犧即堯陵廟神亨靈洞執己嘉瑞李樹連理生於堯圖府殿夙早拜遷中大夫後太守河南張寵繼擬前緒到官始初出錢二千敬致禮祠臨立壇碑特復群為始學徒莫不勸樂咸曰張父敦我已德厲我已仁將獲禎應齊風前人鸞皇解將悉臻矣密勿匪休將悉至矣熹平四年十二月十日癸卯立時將作吏胡能守堯掾仇伯爰掾成余見隸釋一豫州從事尹宙碑君諱宙字周南其先出自有殷乃迄于周世作師尹赫赫之盛因以為氏吉甫相周宣勛力有章文則作頌武襄獫狁二子著詩列於風雅及其玄孫言多世事景王載在史典秦兼天下侵暴大族支判流或居三川或徙趙地漢興以三川為潁川分趙地為巨鏕故子心騰於楊縣致位執金吾子孫以銀艾相繼在潁川者家於傿陵克纘祖業牧守相亞君東平相之玄會稽太守之曾富波侯相之孫守長社令之元子也君體溫良恭儉之德篤親於九族恂恂於鄉黨交朋會友貞賢是與治公羊春秋經博通書傳仕郡歷主簿督郵五官掾功曹守昆陽令州辟從事立朝正色進思盡忠舉衡以處事清身以寓時高位不以為榮卑官不以為恥含純履軌秉心惟常京夏歸德宰司嘉焉年六十有二遭離寢疾熹平六年四月已卯卒於是論功敘實宜勒金石乃作銘曰於鑠明德於我尹君龜銀之胄奕世載勛綱紀本朝優劣殊分守攝百里遺愛在民佐翼牧伯諸夏肅震當漸鴻羽為漢輔臣位不福德壽不隨仁景命不永早即幽昏名光來世萬祀不泯見碑拓本堂邑令費鳳碑惟熹平六年歲格于大㐬無射之月堂邑令費君寢疾卒鳴呼哀哉於是夫人元弟故守卜胤追誄而之其辭曰君體履柔和溫其如玉修孝友乎閨閾執忠謇於王室立迹州郡仕更右職舉直錯枉強𠌗貢孝三署勛譽有則出宰近甸民懷厥德色斯輕翔翻然高潔王人述職分班爵台招助鼎調物退已進弟不營榮祿栖遲歷稔項領滯畜鄣土不庭黔民作虐命君政化行從善遷恩三基致道有恥且格牧守拴功轉左堂邑垂拱不言而民帥伏三時之間卒以洽旻天不弔命也早歿春秋六十六梨儀瘁傷泣涕連漉豈愛我躬命不可贖臨終迷內發祖業良田畝直一金推豫弟息辭位讓財行義高邵卓不可及名實相副有始有卒人善𤹯兮切惻故吏故鄣施業字世堅義民堂邑戚忠忠年十有一慈考早隕喪以備於禮制蓬首而壞而消辟地行母氏以而悼傷服菲五五縗杖其未除廣陵之郡守東海聞寢疾而終卒凡百普悲舜化比屋之餘慶隨棺柩車哀以而逆之祖載已畢訖還返其故鄉君其節操悲其有每以其老親忠君厚德念君之仁恩聞君之隕隧剝斷而辛酸復截縗麻杖君之柩棺扶號而竭泣涕其甫於岐山其從之迷君而到官上書而君盡禽息之君之君三於山列種嘉奇樹特為之潤鮮忠業與猶君恩使然雖君有大化孰能爾者難子喪之終思其顏而死可贖不愛人今君於彼卓譎而超倫吏氏慕高蹤來者其如雨偉名建石垂示於見隸釋九費鳳別碑君舅家中孫甘陵石勛字子才載馳載驅來奔於喪庭肝崔意悲感切傷心瞻彼碑誄懷之好音司馬慕藺相南容復白圭仰之以彌高鑽之而彌堅不堪哀且思敘詩之一篇庶幾昔子夏起夫子之所言其辭曰君諱鳳字伯蕭梁相之元子九江大守之長兄也世德襲爵銀艾相亞恢遐祖之鴻軌拓前代之休蹤邈逸越而難繼非群愚之所頌仁義本於心慈孝著於性言不失典術行不越矩度清潔皎爾埿而不滓恤憂矜厄施而不記由近及遠靡不覆載故能闡令名而雲騰揚盛聲而風布踐郡右職三貢獻計辟州式部忠以衛上漢安二年吳郡大守東海郭君以君有逶蛇之節自公之操年三十一舉孝廉拜郎中除陳國新乎長神化風靡惠以流下靜而為治匪煩匪擾乾乾日稷矜此黔首功成事就色斯高舉宰司委職位思賢以自輔玄懿守謙虛白駒以逐隉丹陽有越寇沒命君討理之試守故鄣長蓋危亂有不讓乂畏此之罪罔而牧爰止其師旅鴥若飛鷹若夫虓虎強者綏以德弱者以仁撫簡在上帝心功訓而特紀轓輿宰堂邑基月而致道視遂據于卿尹中表之恩情兄弟與甥舅蔦與女蘿性樂松之茂好聞君顯令名舉宗為歡喜不悟奄忽終藏形而匿景耕夫釋耒耜棄婦投鉤莒道阻而且長望遠戾如雨莢馬循大路搴裳而涉洧悠悠歌黍離黃鳥集於楚惴惴之臨穴送君於厚士嗟嗟悲且傷每食不絶夫人篤舊好不以存亡改文平感渭陽悽愴益以甚諸姑咸璧踊爰及君伯姊孝孫字元宰生不識考妣追惟厥祖恩蓬首斬縗杖世所不能為流稱於鄉黨見吾若君存剝裂而不已一別會無期相去三千里絶翰永慷慨泣下不可止見隸釋九樊毅修華嶽碑山經曰泰華之山削成四方其高五千仞廣十里周禮職方氏華謂之西嶽祭視三公者以能興雲雨産萬物通精氣有益於人則祀之故帝舜受堯曆數親自巡省設五鼎之奠紫燎埋致敬神祗艾用昭明百穀繁殖犁民時雍鳥獸率舞鳳皇來儀暨夏殷周未之有改也其德休明則有禎祥荒淫臊濊篤災必降秦違其典璧遺鄗池二世以亡漢祖應運禮遵陶唐祭則獲福亦世克昌亡新滔逆鬼神不亨建武之初彗掃頑凶更率舊章敢用玄牡牲牷必充天惟醇祐萬國以康光和二年有漢元舅五侯之胄謝陽之孫曰樊府君諱毅字仲德承考讓國家干河南究職州郡辟公府除防東長中都令誅強撫瘠民二鄙以清命守斯邦威隆秋霜恩踰冬日景化既宣由復夕惕惟寵祿之報順民之則孟冬十月齋祠西嶽以傳窄狹不足處尊卑廟舍舊久牆屋傾亞世室不修春秋作譏特部行事荀斑與縣令先讜以漸補治設中外館圖珍琦畫怪嶽瀆之精所出禎秀役不干時而功已著暫勞久逸神永有憑自古泰山邴邑由存五嶽尊同哀此勤民獨不賴福乃上復十里內工商農賦克厭帝心嘉瑞仍畣風雨應時瀸潤品物君舉必書兄乃盛德惠及神人可無述焉於是功曹郭敏主簿魏襲戶曹史許禮等遂刊玄石銘勒鴻勛垂曜啻軨永有昭識其辭曰兩儀剖判清濁始分陽凝成山陰積為川泰氣雍容洪波𣲩臻堯命伯禹決江開汶坤靈既定兆民乃列祀典辨於群神因瀆祭地嶽以配天世主遵修永亨歷年赤鋭煌煌受茲福京夏密清殊俗賓服令問不違可謂至德德音孔昭實為我后出自中興大漢之舅本枝繁昌延慶長久俾守西嶽達奉神禮改傳飾廟靈則有濟降瑞畣祚景風凱悌惟風及雨成我稷黍穡民用章康艾室宇刊銘紀誦克配梁甫見隸釋二太尉陳球碑君諱球字伯真有虞氏之裔也當周盛德有虞遏父為陶公生公子完適齊為桓公公正其後強大遂有齊土楚漢之官生屯有令名廣漢太守公既慕世業不隊前軌孝友祗穆典誥微言雅頌情指憲發綱統莫不守其條貫綜其倫理穗換東城門侯虔恭職司夙夜匪解遷繁陽令寬以溫而不遺迹邈而不喪母去官服除辟司徒府拜侍御史陸梁荊揚州郡弱莫能禁禦大尉楊秉舉公帥徯弱難一而平詔書十萬州公發遣家屬辟難公赫有言者斬乃悉人民老弱共村為大弧攻前遇之弘衆而遁全郡保拜子男作大匠孝桓晏駕躬親功司空喬玄表公為河南惟明克公遂作司空通導水泉稼嗇繁阜陰陽致仕賜榮而退復拜永樂少府光和而不撓雖有周之申甫漢之匡翟知公之明德其辭曰於顯明德峻哲亶不度伊見隸釋十案隸釋別有陳球后碑依文選注編入蔡雍集君諱君之少子心仁而孝弟其先出高辛興自于周蕃虞郭在河魏之間遭晉荒強乃喪厥土亦世孳孳職思其勳子孫纓布家于樂土𡆬國為氏昔在霸世雄彥棊跱郭隗吐奇顯於戰國歷秦迄漢將相不輟君其苗胄也而溫恭蒸蒸不違學事官曹清身夙興居豐能約持滿不傾資於父母忠以事君性天自然斷斷休導之於鄉其譽日章在國必達正身履方束修勤恪在公明明進納府密勿其光恩仁發越宗黨階式序堂堂故能弱冠榮寵紀綱入踐賊決與當服職鍛涷事無留荒歷郡諸曹掾史主簿督郵五官掾功曹守假牧伯虛貪君卞亮遂顯辟彈糾臨時所割肅然靡邦不思當登大階為國哲謀皓天不弔降此凶災君季一以光和二季大荒軷紙月戊申暗曶而終親戚傷懷同僚涕泠以其三年十月葬冠蓋四輯縉紳盈庭痛君懷春凋柯霜榮哀哀考妣追惟霣靈卜商唬咷喪子失名兄弟咨嗟憯忉傷情孤配禍嗣憔悴煢營悼君短折永歸幽冥自古皆死先民有呈歿不巧蓋謂合聲建石立碑顯揚洪貞攄功美表示後生魂而有知萬軷熙寧懿矣君純淑清性蘭石履圭瑩祖有周世揚聲冠二代為德經胤倉烈系洪纓世作磊為台衡串千軷涵山停傷春樹不垂馨明珠玷夜光虧紫芝凋高岡頽庶斯言訓孔懷見隸續十九分氣建立乾坤乾為物父坤為物母運生六子為土為山風雨天有九部地有八極天地通神明別序州有九山丘成土北之凶升阻上為祈首含陰寶南號三公厥體嵩厚峻極于天鼎足帝二郡宗祀奉公嘉佑為形兆觸石雲不崇而雨陰氛廓莫不德配五嶽王公所緒四時圭壁月醮酒脯公降靈得志列群后或在王庭輔翼聖主揚雨時降和其寒暑年豐歲稔分我稷黍倉府既盈以穀士女得進陳其鼎俎黃龍白虎伏在山所禽獸億兩為耦草木畼茂巨仞不數下民知禁順時而取皆受德化非性能者願明公垂恩罔極保我國君群犁百姓受元恩光和四年歲在辛酉四月朔二日甲子元氏左尉上郡白土樊瑋字子義瑋要陵側陋出從幽谷遷於喬木得在中州尸素食祿以弱歸於族明歡以足觀聽道無拾遺消扞難路無怨讟得應廉選貢名王室靈祗福祚施之册於是感恩立銘勒石乃作頌曰儼儼明公民所贍兮凶窈窕石巖巖兮高倉侯群神兮興雲致雨除民患兮長吏肅恭心兮四時奉祀黍稷兮用兮百姓家給國富殷兮仁愛下下民附親兮假邇攜負來若雲兮或有薪采投輻檀兮或有鬼阻出兮或有耘兮或有隱遁辟語言兮或有恬淡養皓然兮或有呼吸求長存兮跂行喙息皆恩兮佑樊瑋出谷遷兮封侯食邑傳子孫兮刻石紀德示後昆兮永永不億載年兮舉將南陽冠軍君姓馮諱巡字季祖修六經之要析之曆受命北征為民父母攘去寇凶用無姦越竟民移俗改恭肅神祗敬而不怠皇靈佑風雨時節農執耜或耘或童妾壼饁敬而賓之稼穡穰穰穀至錢叔粟如火咸褱仁心君姿前哲喬札季文篤稂秀不為苛煩愍俗陵遲咨山無隱士藪無逸民褱道以德慕此百姓歐歌得我惠君功參周邵受祿于天長履景福子子孫孫見隸釋三殽坑君神祠碑天地定位山嶽讀諸侯事其細祭法曰山林川谷有益於民在祀典夫中條之山者蓋華嶽之體也石堤樹谷南通商雒以屬熊耳百川鍾集充崖滿谷時有盛雨彭濞涌溢乘高趨下揚波跳沫于是殽坑以為之夤承寫其流北注諸渭蠲泄滀暴使不為害前世通利吏民興貴有御史大夫將軍牧伯故為立祠以報其功自亡新已來其祀隋廢坑稱堙塞堤防沮潰漂沒田疇浸敗亭市神怒民怨懸遂以賤仕宦失官踣弊不震迄光和四年作詻之歲令河東聞熹君諱字君為政以德五教時序肅恭明神敬奉禋祀勤恤民隱而除其害愍一懸之陵遲懼至之無備追惟伯禹遏治之利乃復浚治殽坑通利其水紹修舊祀弘祏其祠使民報祈視於社稷其有征拜州郡辟召皆當來辭大小有差殽坑君尚饗後之人是遵是奉神必據焉光和四年六月辛未造見隸釋二
