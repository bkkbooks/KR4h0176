body:
  text: 闕名稿長蔡湛頌君諱湛字子德河內修武人也其先周封叔葉文王采食蔡則其氏歷世卿尹有功王室迄于大漢繼踐繁隆內任台翼外作股肱元初之擾攘君考銜詔東掃其難宰化符守吳郡再在復牧青州風聲所加布愛樹之美湛則其中子也少耽七典碩材州郡名寶鄉黨辟州從事上舉孝廉以疾辭讓應司徒府除廣川長公事去官復辟大尉以熹平四年六月乙卯詔書除政也躬清潔以革穢班五禮以齊衆官則不勞民亦無事于斯孝翕習而帥蕭滌而雲消爾乃來幽秀于巖列嘯于閭閻欽耆賢以命齊俗以殊禮良足而思節為惡迎化而移心風清和而琬琰時雨應氣而投間嘉祥臻生年穀豐儲歲有其成遠鄰附就戶口增前視事三年遷高邑令吏民追思如朝夕思焉夫播禮以正俗少律以擲姦無為而稱治蕩蕩有功飛陶唐氏其孰能乎鄭産密豹之徒殆不及矣蓋良君興遺愛民刊銘樹今之通義也于是吏栗尹等相與合會立碑起頌刊斯石焉其辭曰穆穆蔡君國之俊綱應禮不降其光乃就台鼎厲足高協莢公門袞職是望賦廣川不挫其芳乃旋色厲更迹惟良舒羽來臨我國是煌靡不網禱不通民用寧風俗以康三載勳最功蹬王府命作高邑臨拜州吏民追思乃銘其敘昭示裔亦孔之表君德含洪有君子道四焉聖朝明哲以爵寵賢光和四年十二月甲詔書拜并州刺史光和四年七月七日丁見隸釋五月辛卯朔草二日壬子大常臣耽丞敏頓首上尚書謹案文書男子常山蓋高上黨范遷詣為元氏三公神本初元年二月癸酉光和二年二月戊子詔書出其縣錢給四時祠具去年五月常山相巡遣吏王勳三弘褎詣三公山請雨山神即使高傳言令勳褎歸雨可得三公即與龍靈山無極山共興雲交雨國相巡元氏令王翊各白芊塞神山復使高與遷及縣吏和下令俱詣大常為無極山神索法食比三公山臣疑高遷言不實輒移本國核今常山相書言部督郵書掾成熹參訊實問熹縣令翊各言無極山與天墮俱生從上至體可三里所立石為體二丈五尺所政南上青下黃白色前政平可布兩大席山周匝草餘在西南卅里縣界有名山其三公封龍靈山皆得法食每長吏祈福吏民禱告如言有驗乞合無極山比三公封龍靈山祠七牲出用王家錢小費蒙大福尊神以圭璧為信臣以愚為如巡言為民來福以祠祀為本請少府給圭璧本市祠具如癸酉戊子詔書故事報臣耽愚戇頓首頓首上尚書制曰可大尚承書從事上月十七日丁丑尚書令忠奏雒陽宮光和四年八月辛酉朔十七日丁丑尚書令忠下光和四年八月辛酉朔十七日丁丑大常耽丞敏下常山相從事下承用者如詔書書到言昔在禮典國有名山能異材用興雲出雨為民來福除央則祀元氏縣有先時三公封龍靈山已得法食而獨未光和四年二月所子大男蓋高上黨范遷奏記大常大常下郡國相南陽馮府君咨之前志問耆叟僉以為實神且明每國縣水旱及民疾病禱祈輒應時有報又有終南之敦物與岱崇之松及楊疏之條蕩焉材用于是乎出官民于是乎給在禮秩祀有功必報今時無極山應法食誠其宜耳于是言大常奏可其年八月丁丑詔書聽其九月更造神廟恢祐祠宮置吏犧牲從制月醮時祠禮與三山同乃立碑銘德頌山之神焉其辭曰巖巖無極厥體巍巍嵩萬常梯浚谷千刃窈窕隈楙林青倉氣蔚伊礙遙望儼然即就有威觸石膚寸興雲祁祁雨我公田遂及我私百穀用成家有其資禱禳請祈應速不迡鳥獸草木番茂隆猥神為之哀欽案禮典咨古遺則功加于民官報其德今備七牲圭璧法食改館興廟恢祐宇室增益吏役恭君下職月醮醮祀肅枑齊壼必博碩酒必嘉栗粢盛馨香如禮不失君歆享降福孔官民禱祈僉密勿有以禳解報應可必法食將祐我君我君高衆多子孫君其遺慶副稱云見隸釋三溧陽長潘乾校官碑蓋漢三百八十有七載于銘功著斯金石畀誄曰溧陽長潘君諱乾字元卓陳國長平人蓋楚大傅潘崇之末緒也君稟資南霍之禱天德之絶操髫髦克敏學典謨祖講詩易剖演奧藝外覽百家衆挈聖抱不測之謀秉高世之介屈私趨公即仕佐上郡位既畢孔武赳箸疾惡義形從風征暴執訊獲首除曲阿尉禽姦戔猾寇息善歡履菰竹之廉蹈公儀之潔察廉除茲初厲清肅賦仁義之風之迹垂化放呼岐周流愛雙呼親臤寶智進直退慝布政優優令儀令色獄無吁嗟之冤野無叩胸之結矜孤頤老表孝貞節重義輕利制戶六百省無正繇不責自畢百姓心歡官不失實于是遠人聆聲景附樂受一廛既來安之復役三季惟泮宮之教反失俗之禮構修學宮宗懿招德既安且寧干侯用張籩豆用敶發彼有的雅容間鍾磬縣矣于胥樂焉乃作敘曰翼翼聖慈惠我𦺙蒸貽我潘君平茲溧陽彬文赳武扶弱抑強刈鯁雄流惡顯忠咨疑元老師臤作朋修學童冠琢質繡章實天生德有漢將興尚旦在昔我君存今即此龜艾遂尹三梁永世支百民人所彰子子孫孫畀爾熾昌丞沛國銍趙勳字蔓伯左尉河內汲董並字公房右尉豫章南昌程陽字孝遂時將作吏名戶曹掾楊淮議曹掾李就議曹掾柏檜戶曹史賀從掾位侯祖主記史吳超門下史吳訓門下史吳翔門下史時球光和四季十月己丑朔草一日己酉造見碑拓本隸釋五童子逢盛碑童子諱盛字伯彌薄令之玄孫遂成君之曾孫安平君之孫五官掾之長子也胎懷正氣生克自然撫育孩嬰弱而能言至于垂髦智惠聰哲過庭受誡退誦詩禮心開意審聞一知十書畫規匱制中園𣔶日就月將學有緝熙才亞后橐當為師楷自天生授罔不在初謂當遂令儀令色整齊圭角立朝進仕究竟人爵克啓厥後以彰明德胤嗣昭達何寤季世皓天不惠伯強涇行降此大戾年十有二歲在協給五月乙已噓吸不反夭隕精晃苗而不秀命有悠短無可奈何慈父悼傷割哀回鯉其十二月丁酉而安措諸永潛黃壚沒而不存于是門生東武孫理下密王升等感憿三成一列同義故共刊石敘述才美以銘不巧其辭曰嘉嗣伯彌天授其姿蚤克岐嶷聰睿敏達當遂逶迆立號建基時非三代苻命無恆人生在世壽無金石身潛名彰顯于後葉光和四年四月五日丁卯立見隸釋十安平相孫根碑府君諱根字元石司空公之伯子樂安大守之兄子漢陽大守侍御史之兄乘氏令之考厥先出自有殷玄商之系子湯之苗至于東大虐仁聖武定周封干之墓胤裔分析避地匿軌姓曰孫為各以文憲將相諸國君其胄也於君權輿發基有嶷受性明睿聞一知十誦詩習藉研綜其真講童冠以營發憤臨川教誨不倦節操慷慨毅仲行束鞶立朝政事敏通心小志大日宵在公琦其分式敘在位極驥之路察孝抱疚中司乃就匡鼎以忠三事歸稱遷邯鄲長興吏所好去奐有成遷雍奴令先施博愛威而不猛換元氏考城令以塞延佇後我之望圻甫考績聖朝蕳議大夫升降闛闥天子是裨讜言未列遭公夫人憂憔悴消形齒不見口服闋徵拜議郎謁者濟濟衎謇不撓遷荊州刺史蠢爾獫狁手稽顙德澤流征速于置郵聖上貪昵徵拜議郎御坐無雙輔弼唐虞上稽古功紀宗彝無善不章遷安平相遵修前列五教訪赫赫之譽虓溫之仁以寧土強求已不媚以疾去官闔門守家不競時榮養育孤稚以保壽年上乾弗祐獲疾固七十有一以光和四年十二月乙已卒鳴呼有哀孝嗣夙夜不舍嚴父孝孫臨殯禮服承後忉怛有感惟古聖孔尼喪鯉嬴縮有命不可增損于是握粟卜葬中坰冠奔赴充衢塞庭同胞惻愴涕淚交零呱呱豎子號咷失聲故吏門生邦人咸曰令問弗銘勒孰覩孰聞乃立石碑昭名不巧其辭曰皇矣府君含德厚純恢廓術藝以道蒞民行行義勇無猾不儐抑抑圭質光容有暉綏強以弱以仁罰惡以威賞善以恩仲伯撥亂蔡足譎權巖恪色正不犯子養珉化與産配哉九域相彼大國東菅儉不損晏宣慈惠和柔不可詘桓桓烈烈剛不可折城其父祚子孫不見隸釋十君諱字元丕京兆牙都尉之有畢萬者仙去仕晉逢勛封魏秦良爰暨于君稟軋氣之純懿履輶奚之聖哲苞容允執虔恭其仕州郡也躬素忠謇犯而勿欺兼綜憲法通識百典孝廉除郎中尚書侍郎右丞遭泰夫人憂服闋還臺拜尚書侍郎秉總廷績特拜左丞每在選舉遜讓匪石鑽前忽後遂耽思舊章尋微貫能樞衡匡弼九年而岡愆西羌放動餘類未𨍐酬咨郡尞惟德是與拜涼州刺史流以蕩邪志樂季文粟帛之介公儀徹織庖園之節崇文德以來遠斑下彝戎賓服干戈戢藏施舍弗券求善不猒舉不失選官不易方百工惟時有優洋洋奐乎若德光耀冠乎諸牧蓋四之序功成則退君屢辭以疾三無窮而垂式度不可革幣芾其縱而眉耇不往徂疾來升春秋十光和四民失慈父四海之內莫匪摧傷于是故吏茂才雲中太守漢陽胄從事威較琰等不遠萬里斷制縗裳感恩奔哀乃與門生平原曹𥠟等山石於戲使君既鷹渘德貢躡帝宇入參文昌出化西土仁義充衍澤洽德世記其軌辭疾輕居棄榮潛處不卒苻宿究是台輔三方共黯徂落不留舜禹二書應臻于己丑辰五盈虧猶有代序茲后土光耀見隸釋十梁相孔耽神祠碑君諱耽兄弟三人君最長厥先出自殷烈殷家者質故君字伯本初魯遭亡新之際苗胄析離始定茲者從叔陽以來君少治禮經遭元二輱軻人民相食舞土茅茨躬采菱蕅消形瘦臘以養其親慈仁質桶精靜訹信天授之性飛其學也治産小有追念祖母故舞魂構于是君乎竭凱風以惆憀惟蓼儀以愴悢恃闓郭藏造作堂穻增土種柏孝心達填平石上見神蛇有頃復亡放蘢羅之雉救窮禽之厄小弟升高遊巟畜積道富財貧君引共居卌餘年雖賕舛如義合故天應厥證木生連理成體一焉下則容人上則洪茂馨卓流布縣請署主薄功曹府招稽議邵將烏程沈府君表病委職署君行事假穀孰長印黻總領文書季踰皓首縣車家巷黃髡巟老背有胎表孫息敖姚歡樂壽考觀金石之消知萬物有終始圖千載之洪慮定吉兆于天府目覩工匠之所營心欣悅于所處其內洞房四通外則長廡功賦合出卅萬以光和五年歲在壬戍夏六月訖成于此行夫君子欽美含歌如頌曰君之德兮性自然蹈仁義兮履䟔純惻隱至兮神蛇存皇垂象兮木連理矜鳥獸兮放舍旃享黻榮兮景號宣達情性兮覩未然永億載兮傳功勳刊石祠兮示哲賢見隸釋五漢成陽令唐扶頌君諱扶字正南潁川郾人也其先出自慶都感赤龍生堯王有天下大號為唐治致雍熹尊天重民禪位虞光受茅土通天三統苗胄枝分相土脈居因氏唐焉纍世含祚受天之怙胤嗣彌光為漢台輔君父孝廉郎中早卒季父蜀郡蜀郡從弟會稽會稽從弟南陽君從兄東萊太守南陽弟司空公在朝逶隨正色竭忠為國討暴六侯俱封受土襲爵金縉十三君繼厥緒少有岐嶷耽道好古敦書詠詩綜緯河雒底究群典戔士進守舞陽丞弱冠守昆陽尉潁陽令隱練州郡所臨有帝嘉其德特拜郎中察能治劇除豫章塢陽長夷粵㨭忮強難化君奮威揚武視以好惡蠻貉振疊稽顙𨸲服上前逋干有餘萬盜賊衰息境界晏然三載有成州郡諍表遷成陽令承先聖之弘軌見讚像之高蹤遂興無為之治優賢揚歷表善絀惡遵九德以綏民崇晏晏之惠康風移俗易莫不革心朝有公卓家有參騫分郟之治優隆於君追惟堯德廣被之恩依陵亳廟造立授堂四遠童冠摳衣受業著録千人朝益莫習衎衎誾誾尼父授魯曷以復加靈祇瑞應木連理生白菟𦃚鳩遊君園庭蕩蕩之治莫能名焉三司察功朝廷審真以君威恩並流文武兼興東萊海濱須君以寧詔書換君昌陽令吏民慕戀士女惟艱捺牽君車輪不得行君臣流涕道路琅玕迫有詔命靡由復還于是故從事仲字仲授張躬萬督郵仲規郡掾閭葵仲瑝處士王蕫額閭葵斑等乃共刊石樹頌歌君之美其辭曰赫赫唐君帝堯之苗氏族不一各任所安本同末異蓋謂斯焉君體煥炳有芬有馨如山如嵩如不傾如如海淡如不盈惟直如矢秉銓據衡在朝肅肅閨門雍雍廉踰伯叔潔如圭璋賦政于外爰及鬼方匯夷來降寇賊迸亡梨庶攸寧黔首歡康以德綏撫宣恩六陽以仁恤弱以義抑強恩由春夏威如秋霜賞罰分審白黑著明憂者閔稚不侮寡矜耽樂道述咀嚼七經五六六七訓導若神接下施與投財如捐吏服其德民歸其恩父父子子君君臣臣不𨸲自舉不拘不煩囹圄空虛國無佞民德及草蟲澤流無垠蜎飛蠕動咸賴我君顯顯令稱德音常存光和六季二月壬午朔草五日丙午處士閭葵斑戀念唐君為立碑斑字宣高修春秋嚴氏大子讓公謙襲斑業次龔叔謙治尚書歐陽次廉仲潔小夏侯耽經史兮履仁義內和陸兮外奔赴以家財兮讚君號諸學兮相埤助垂後世兮不之譽見隸釋五白石神君碑蓋聞經國序民莫急于禮禮有五經莫重于祭祭有二義或祈或以章德祈以弭害古先哲王類帝禋宗望于山川遍于群神建立兆域修設壇屏所以昭孝息民輯寧上下也白石神君居九山之數參三條之一兼將軍之號秉斧鉞之威體連封龍氣通北嶽幽讚天地長育萬物觸石而出膚寸而合不終朝日而澍雨沾洽前後國縣屢有祈請指日刻期應時有驗猶自抱損不求禮秩縣界有六名山三公封龍靈山先得法食去光和四年三公守民蓋高等始為無極山詣大常求法食相縣以白石神君道德灼然乃具載本末上尚書求依無極為比即見聽許于是遂開祏舊兆改立殿堂營宇既定禮秩有常縣出經用備其犧牲奉其圭璧潔其粢盛旨酒欣欣燔炙芬芬敬恭明祀降福孔殷故天無伏陰地無鮮陽水無沈氣火無災燀時無逆數物無害生用能光遠宣朗顯融昭明年穀歲熟百姓豐盈粟升五錢國界安寧𡭗乃陟景山登崢巆采玄石勒功名其辭曰巖巖白石峻極大清皓皓素質因體為名惟山降神髦士挺生濟濟俊乂朝野充盈災害不起五穀熟成乃依無極聖朝見聽遂興靈宮于山之陽營宇之制是度是量卜云其吉終然允臧匪奢匪儉率由舊章華殿清間肅雍顯相玄圖靈像穆穆皇皇四時禋祀不愆不忘擇其令辰進其馨香犧牲玉帛黍稷稻糧神降嘉祉萬壽無疆子子孫孫永永番昌見隸釋三碑本幽州刺史朱龜碑君諱龜字伯靈廣陵太守之孫昆陽令之元子也君系祖考之鴻軌履大和之世載德不隕仁義成于束修孝弟根其本性然而虛己下士勞謙克厚載多容察孝廉除郎中尚書侍郎以將事去官三府更辟以大尉高第堂之論建弘遠之議磊落煥炳臨疑獨逝故能光明越聞顯于區夏英聲公族於時益州蠻夷侵寇邊鄙陸梁山野為害日甚朝廷以君文能武不御史中丞討彼亂略君統整群帥方謀並設威神庭電燭於上下至郡授手乞降永昌大守曹鸞上解黨以不糾摘獲戾胥靡潛於巷群辟輒以疾辭鮮卑數犯鄣塞僉復舉君拜幽州刺史爾乃邁種禁以糾姦宄養善繇時雨之澍品物除惡如農夫之務去草適其疆土門衛弛柝而無怵惕百姓不復屯其城塢出塞追寇咨歎策詔并涼以君為式命不少廷年六十四以光和六年故吏牟化等僉以為夫有嘉功祀而不輟或銘鐘鼎書是述已乃立碑寢而作頌曰星精一縕馮儀哲人我君受之膺其淑真研綜典藝實好斯文𥸨徽馨名懿允升蠢爾夷貉蕩我邊氓銜命督使武氣飆騰董以幽方不率天常撫以仁德渙若風翔分命部隊出竟觀兵禽遠驅甲綏我土疆降年不永匱民之望烈烈遺勛景炎彌光見隸釋十
