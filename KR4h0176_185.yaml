body:
  text: 闕名司隸從事郭究碑君諱究字長全汲人也其先出自郭叔應運挺度實有懿德文武咨焉條枝雲疏班華夏世載令問昭前之光咸攄玄謨理物佐時君則元城君之孫雒陽君之適南和尚書濟北軍中臨沂徐州中山君之從子也河嶽降祚幼而有跲孝弟恭肅與性俱成溫慈惠和覩義輕財懷刑拜讜舍已從人蹈中庸之路處匹直之節內省不疚兼姿問物格能臨疑弗惑弱冠踐郡歷主簿督郵五官掾功曹守令長含章吐忠或從王事嚴可恐柔順可愛進善替否所舉見則雖趙武之佐晉宋甫之癘色操籌撰功君其越諸辟司隸從事郡都官耽耽鷹揚所蒞以齊翕然之論風飛川流本朝察孝貢器帝庭恬榮忽浮委爵禮讓群公側席書垂置郵不幸短祚命登六辰春秋草八而卒中平元年歲在甲子三月而葬悲夫破鏌鋣之刃而不宰元摧晨風之翼而不厲天耆姪士女鳴悒惟孤嗣叫號涕零如雨咸曰晨有歿曆數猶終自古迄茲孰能保存生榮死哀奕貴遺稱敢慕衛悝讚先之義乃伐石興碑以旌厥魂俾後永有鑑焉其辭曰於鑠我君皇精蘊良昭德塞違克紀克綱握櫃綜規步履方麟跱清朝委蛇自公棟隆千里庶績艾康佐命牧伯扶義遏私繩彈枉屬以改榮名京邑桓知幾當享爵壽作漢輔毗靈祇貪哀逝葉翼微哲人其徂萬夫慘慛銘勳金石以慰孔懷見隸釋十郃陽令曹全碑君諱全字景完敦煌效穀人也其先蓋周之胄武王秉乾之機翦伐殷商既定爾勳福祿攸同封弟叔振鐸于曹國因氏焉秦漢之際曹參夾輔王室世宗廓土䐃竟子孫遷于雍州之郊分止右扶風或在安定或處武都或居隴西或家敦煌枝分葉布所在為雄君高祖父敏舉孝廉武威長史巴郡朐忍令張掖居延都尉曾祖父述孝廉謁者金城長史夏陽令蜀郡西部都尉祖父鳳孝廉張掖屬國都尉丞右扶風隃麋侯相金城西部都尉北地大守父琫少貫名州郡不幸早世位不副德君童齔好學甄極毖緯無文不綜賢孝之性根生于心收養季祖母供事繼母先意承志存亡之敬禮無遺闕是以鄉人為之諺曰重親致歡曹景完易世載德不隕其名及其從政清擬夷齊直慕史魚歷郡右職上計掾史仍辟涼州常為治中別駕紀綱萬里朱紫不謬出典諸郡彈枉糾邪貪暴洗心同僚服德遠近憚威建寧二年舉孝廉除郎中拜西域戊部司馬時疏勒國王和德弒父篡位不供職貢君興師征討有之仁分醪之惠攻城野戰謀若涌泉威牟諸賁和德面縛歸死還師振旅諸國禮遺且二百萬悉以薄官遷右扶風槐里令遭同産弟憂棄官續遇禁罔潛隱家巷七年光和六年復舉孝廉七年三月除郎中拜酒泉祿福長詙賊張角起兵幽冀兗豫荊揚同時竝動而縣民郭家等復造逆亂燔燒城寺萬民騷擾人不安三郡告急羽檄仍至于時聖主咨諏群僚咸曰君哉轉拜郃陽令收合餘燼芟夷殘迸絶其本根遂訪故老商暲俊艾王敞王畢等恤民之要存慰高年撫育鰥寡以家錢糴米粟賜𤵸盲大女桃斐等合匕首藥神明膏親至離亭部吏王宰程橫等賦與有疾者咸蒙瘳暖惠政之流甚於置郵百姓繈負反者如雲戢治牆屋市肆列陳風雨時節歲獲豐年農夫織婦百工戴恩縣前以河平元年遭白茅谷水災害退于戍亥之間興造城郭是後舊姓及修身之士官位不登君乃閔縉紳之徒不濟開南寺門承望華嶽鄉明而治庶使學者李儒欒規程寅等各獲人爵之報廓廣聽事官舍廷曹廓閣升降揖讓朝覲之階費不出民役不干時門下掾王敞録事掾王畢主簿王歷戶曹掾秦尚功曹史王顓等嘉慕奚斯考甫之美乃共刊石紀功其辭曰懿明后德義章貢王庭征鬼方威布烈安殊巟還師旅臨槐里感孔懷赴喪紀嗟逆賊燔城市特受命理殘圮芟不臣寧黔首繕官寺開南門闕嵯峨望垂山鄉明治惠沾渥吏樂政民給足君高升極鼎足中平二年十月丙辰造見碑本漢故穀城長蕩陰令張君表頌君諱遷字公方陳留己吾人也君之先出自有周周宣王中興有張仲以孝友為行披覽詩雅煥知其祖高帝龍興有張良善用籌蒂在帷幕之內決勝負千里之外析圭于留文景之間有張釋之建忠弼之謨帝遊上林問禽狩所有苑令不對更問嗇夫嗇夫事對于是進嗇夫為令令退為嗇夫釋之議為不可苑令有公卿之才嗇夫喋喋小吏非社稷之重上從言孝武時有張騫廣通風俗開定畿㝢南苞八蠻西羈六戎北震五狄東勤九夷荒遠既殯各貢所有張是輔漢世載其德爰既且于君蓋其繵縺纘戎鴻緒牧守相係不殞高問孝弟于家中謇于朝治京氏易聰麗權略藝于從畋少為郡吏隱練職位常在股肱數為從事聲無細聞徵拜郎中除穀城長蠶月之務不閉四門臘正之𠐐休囚歸賀八月莢民不煩于鄉隨就虛落存恤高年路無拾遺犁種宿墅黃巾初起燒平城市斯縣獨全子賤孔蔑其道區別尚書五教君崇其寬詩云愷悌君降其恩東里潤色君垂其仁邵伯分陝君懿于棠晉陽珮瑋西門帶弦君之體素能雙其勛流化八基遷蕩陰令吏民頡頏隨送如雲周公東征西人怨思奚斯讚魯考父頌殷前哲遺芳有功不書後無述焉于是刊石豎表銘勒萬載三代以來雖遠猶近詩云舊國其命惟新於穆我君既敦既純雪白之性孝友之仁紀行來本蘭生有芬克岐有兆綏御有勛利器不覿魚不出淵國之良幹垂愛在民𦿝沛棠樹溫溫恭人乾道不繆唯淑是親既多受祉永享南山干祿無疆子子孫孫惟中平三年歲在攝提二月震節紀日上旬陽氣厥析感思舊君故吏韋萌等僉然同聲債師孫興刊石立表以示後昆共享天祚億載萬年見碑本小黃門譙敏碑君諱敏字漢達鄴君之中子章君之弟郎中君之昆也其先故國師譙贛深明𥮏隩讖録圖緯能精微天意傅道與京君明君承厥後不忝其美幼其好學才略聰睿詩書是綜言合雅謨慮中聖權既休在公忠允篤誠以直佐主帥下惟約肅將王命振之於外群寮有司各敬爾儀君商時度世引己倍權守靜微冗韜光韞土以遠悔咎恥與鄰人羼竝㭘驅識真之𣎶謂君為哲在昔寧武當亨南山難老之禱昊天不惠降茲琥疾年五十有七以中平二年三月九日戊寅卒鳴呼哀哉國喪良佐家隕楝梁遐邇咨悼𣎶女哀懷寮朋親戚莫不失聲泣涕雙流于是立表寫憤斯銘傳於罔極其辭曰於穆使君盛德照明爰惟懿業帥由舊章文武彬彧柔而能剛屈道從政令名顯揚臣多醜直是用遜讓且以育姿優遊京曷遘罹景命不長屋楝傾覆君喪亡如何如何吁嗟昊蒼身退名存永世遺芳中平四年七月草八日癸卯造見隸釋十一巴郡大守張納碑君諱納字子郎勃海南皮人也其先之胄立姓定氏應天文像炎漢龍興留侯維幹枝裔滋布竝極爵秩君之曾祖暨其先考軌迹相繼俱州追侔昔人丕顯其光鍾美積德實乃育君膺大雅之淑姿修蒸蒸之孝友綜覽賁典靡古不通察孝廉除郎中尚書侍郎夙宵在公匪懈于職遷甘陵句令親病去官念復義章海內辟司空司徒府厲引股桓弗就復辟大尉舉高第拜侍御史迪謨弼諧密靖王室楊州寇賊陸梁作難五府表君中丞督武汾沄所向禽殪日不移晷收功獻捷省息錢穀還充府帑朝以騷震剖苻守任綏慰駭散曩者征克大勛丙子璽書封都亭侯姃公曲阜尚父營丘周啓厥自君到官也勤思乾乾暇食菲身約儉矯時麗清踰公儀潔如素絲旌甄秀異抽拔孤以內照外貪叨革悔姦遁刑無斧鉞之害行無拘紲之人朐忍蠻夷滔天蠢動乘虛唐突忿斯怒爰整干戈虎耽搏則有獲群醜懾怖絶迹幽鎮集乖離俾寧業宇恤淡凍餒賦出梁益頻年杼柚其空恤流轉漕穀恆輸沮戊申詔書騰前付冀道迥且艱潮上如舊常章雖得家不行哨然愍悼民亦勞止繇是辭疾闔閣委政中閼敦慈養之之怨故大尉掾王府丞李元掾史張勤黎景馮經趙中毋俊蒲勝猶潭等庶慕奚斯之義共論敘紀著休烈刊頌其辭曰篤生我君姿兼申甫懿豔帥典稽古正始順元允恭肅恪唯禮是遵乃訓五品敷教在寬含乾坤其潤如雨其主既修沮梪導我以文且衛寇暴建此式勛四竟家謐群庶艾安童謠德慕思昔在邵伯今也復穆矣卓爾超倫于胥令問光乎𢡃年見隸釋五碑陰中平五年三月上旬書君升台祚承天百福子孫千億同上君諱字建慕修其緒溫良恭儉敦詩積而能散菲薄其身博施芬芳畼于諸夏郡仍優署五官掾功曹州辟從事司徒楊公辟以兄憂不至其後司徒袁公仍辟除新長遷圉令播德二城風曜穆清當會被疾去官年六十有八以中平五年冬十一月壬寅卒斯詠紀伐以毖後昆其辭曰天實高唯聖同戲我君羡其縱體弘仁蹈中庸所臨歷有休功追景行亦難雙刊金石示萬邦初平元年十二月草八日立見隸釋十一益州太守高眹修周公禮殿記漢初平五年倉龍甲戍昊天季月循舊築周公禮壂始自文翁應期鑿度開建畔宮立堂布觀廟門相鉤司延公辟相承至于甲午故府梓潼文君增造吏寺二百餘閒四百年之際變異蜂啓旋機離常王衡失統強桀并兼人褱僥幸戰兵雷合民散失命烈火飛炎一都之舍官民寺室同日一朝合為灰炭獨留文翁石廟門之兩觀禮樂崩坥風俗混亂誦讀已絶倚席離散夫禮興則民壽樂興則國化郡將陳留高君節符典境迄斯十有三載會直擾亂慮匡救濟民塗炭閔斯丘虛冠學者表儀大小推誠興復第館八音克諧鬼方來觀為後昌基神不見隸釋一巴郡太守樊敏碑君諱敏字升達肇祖宓戲遺苗后稷為堯種樹舍潛于岐天顧亶甫乃萌昌發周室衰微霸伯匡弼晉為韓魏魯分為揚充曜封邑厥土河東楚漢之際或居于楚或集于梁君纘其緒華南西疆濱近聖禹飲汝茹汸總角好學治春秋嚴氏經貫𥤯道度無文不睹于是國君備禮招請濯冕題剛傑立忠謇有夷史之直卓密之風鄉黨見歸察孝除郎永昌長史遷宕渠令布化三載遭離母憂五五斷仁大將軍辟光和之中京師擾穰雄孤綏綏冠履同囊投核長驅畢志枕企國復重察辭病不就再奉朝娉十辟外臺常為治中諸部從事舉直錯枉談思舊制彈叨糾貪務鉏民穢患苦政俗喜怒作律案罪祋人不顧倡𠎮告子屬孫敢若此者不入墓門州里僉然號曰吏師季世不祥米巫凶瘧續蠢青羌姦狡竝起陷附者衆君執一心賴無汙恥復辟司徒道隔不往牧伯劉公三世欽重表授巴郡後漢中秋老身以助義都尉養疾閭里又行褎義校尉君仕不為人祿不為己桓桓大度體蹈箕首當窮台緄松僑協軌八十有四歲在汁洽紀驗期臻奄曶臧形凡百咸痛士女涕泠臣子褎術刊勒銘其辭曰於戲與考經德炳明勞謙損益耽古儉清立朝正色能無撓廎威恩御下持滿億盈所歷見慕遺歌景形書載俊乂股肱幹楨有物有則模楷後生宜參鼎鉉稽建皇靈王路阪險鬼方不庭恆戢節足輕寵賤榮故大選而捐陪臣晏嬰𨚍殿留侯距齊非辭福也乃辟禍兮亂曰演元垂嶽瀆兮金精大佐實生賢兮欲救民德彌大兮遭偶陽九百六會兮當遐年今遂逝兮嗚呼哀哉魂神兮建安十年三月上旬造石工劉盛息懆書見隸釋十一益州太守高頤碑君諱頤守貫方其先出自帝顓頊之苗胄裔乎逢伯陵者殷湯受命陵有功食采齊樂邑世為正卿氏采建姓至高為桓公將南陽之師而成魯美于春秋訖漢有四城關外家道至君立親仁樂善游心無藉無翔仕郡辟州清寋之不淪時舉孝廉州表蜀郡北部府丞武令阿鄭之賦晏之性試守廣漢屬國都尉猶宓子之在密李牧之鎮代試守益州大守之罰膺求由之政事斑芳聲于國畿理高滿之危溢當登緄職綏時雍運未濟天降害貞良建安十四年八月于官卒臣吏播舉而悲叫梨庶踊泣而忉怛追恩念義縗絰墳側因作頌曰穆穆我君帝顓之胄匡輔齊桓無其偶苗裔流衍彼梁州惟君立節卓爾絶殊學從政無茹柔宰城子牧惠澤沾優剖符典郡威德示民敬讓閼斷苞組宜享漢輔德將舒乾流戾見隕徂凡百悽愴痛乎何辜祚爾後嗣子孫之模見隸釋十一君諱字子其先蓋帝顓頊高陽氏之苗裔周有天下成王建國熊繹封楚慶祚於亦世載德世餘代君高祖父籌自汝南吳子靈王玄孫大漢龍興舉鄉拜議郎南巡郡國封龍平祖父旻舉大司馬郊隧曾祖父範督郵守長州辟元君應上計祖父師上計掾君喬字漢舉更督郵主簿五官三奏辟頃志皓首不肯應就君立述唯仁與祖父治歐羊尚書六日七分少仕州郡臨朝謇鄂孔甫之操以忠孝稱更諸曹賊曹主記史督郵五官功曹州舉孝廉上計掾興平元年八月二十八日壬寅詔書除補桂陽曲紅長既敦文武為政果達臨化宣惠所去遺績視事六載荊奔掩迫之害罹災致寇郡潰亂鎮南將軍荊州牧侯山陽劉君諱表字景升以君稟純履正出自帝宇緬榮輕舉厲志疾躬牧侯鰣為民所安命還拜綏民校尉領曲紅長復蒞五年政隆上古㳖移歸懷繈負而至吏民作誦曰彼熊父兮解我患害安我移遭母憂去官陽九應會王室威君功顯宿著海內咨美拜騎都尉受命立灌陽縣督長六載無為而治稽則先民附無怨曠聲君春秋七十有一以草一年三月丙寅卒官吏民懷慕官屬五從黃郭奚湯扶送靈哀如雕傷顧見農夫泣淚路堣皆懷悽愴哀我惠君君同産弟望季公質性慷慨史魚之直吏功曹列掾督郵都梁長早終君長子稱孝存姿操敦良耽志好學博覽雅藝曹列三奏辟召于州終昔周文公作頌宋成考父公子奚斯追羡遺績紀述前勳于是刊碑以示後緄其詞曰赫赫熊君遷基字漢興伐項巡行南土顯封受爵遂爾延祖絫葉休隆君胤其緒克明盛德字牧城社所在有績龜銀之祚河雒挺録為國毗輔懿懿其操穆穆其姿光光其行桓桓其威清虛淡泊後嗣式序冠秩之應實賴厥後昊天忽然枕榮終祐喪我良則國失良輔其存也榮其亡也哀銘勒金石沒而不朽靈也有知祐福子孫支干相生吉而無咎詩云嘉樂君子顯顯令德延于無極追敘君兮懷純精名稱于州里兮樞機發動執忠貞兮溷亂而不惑不柱身事汗君兮捐土爵而進退崇禮約行兮舉動而不跌遭濁而自靖兮泥而不滓穢鳴呼君兮匪石是為州郡禮遇兮名貫于四表德稱竝宣先兮賢比于前列郤之歎岐兮束修稷由文武兮興後葉子孫殖兮世享祿龍潛體于枯木兮就生存是以刊石兮為君立碑攬瑛雄之迹兮以來嗣長基而廣宇兮後世無廢違故長沙荼陵長文春字季秋質操貞良慈仁泛愛治天官日度風角列宿明知聖術在官修德民歌遺風春秋七十以道殞遷宗胤不紀故為宣昭故桂陽陰山豫章長重安侯相杜暉字慈明體質弘亮敦仁好道治易梁丘春秋公羊氏綜覽百家無所不甄典歷三城居官清惠遺愛在民春秋六十終族後術故因顯德以示來胤建安草一年十月丙寅朔一日丙寅大歲丙申碑師舂陵程福造見隸釋十一
