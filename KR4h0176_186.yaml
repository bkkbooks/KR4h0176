body:
  text: 闕名戚伯著碑本周末嗣戚氏襲以興勃海君玄孫伯著之碑胄周別封氏衛戚邑而為姓焉下缺漢之王舅是時寵特進朝侯大僕光祿侍中監營持節功充列王室遇謗于呂委位捐爾調官近土考十罔營安措東山子孫孝弟篤學應鄉舉止選位至屬國尉京兆府丞勃海太守功德渙彰伯著勃海君玄孫季景長子也二七府召禮性仁知約身學事漆略胥通筆墨敏疾儀容茂盛議者觀始謂復龜銀之緒天乎大歲丁亥娉妻朱氏旬期著橫遇躬度不蒙禱卜奄遂霣歿豈魂俱靈父哀母悲傷其國絶口怛泯宗緒遠近悽愴失氣伊唯唅卿相之伯著見碑拓本隸釋十二仙人唐公房碑君字公房成固人蓋帝堯之之故能舉家去上陟皇耀統御陰陽騰清躡浮命壽無疆雖王公之尊四海之富曾毛天地之性斯其至貴者也耆老相傳以為王莽居攝二年君為郡吏土域啖瓜旁有真人左右莫察而君獨進美瓜又從而敬禮之真人者遂與期壻谷口山上乃與君神藥曰服藥以後當移意萬里知鳥獸言語是時府在西成去家七百餘里休謁往徠轉景即至闔郡驚焉白之府君從為御吏鼠齧䡊車被具君乃畫地為獄召鼠誅之視其腹中果有被具府君賓燕欲從學道公房頃無所進府君怒敕尉部吏收公房妻子公房乃先歸于谷口呼其師告以厄急其師與之歸以藥飲公房妻子曰可去矣妻子攣家不忍去又曰豈欲得俱去乎妻子曰固所願也于是乃以藥塗屋柱飲牛馬六畜須臾有大風玄雲來迎公房妻子屋宅六畜翛然與之俱去昔喬松崔白皆一身得道而公房舉家俱濟盛矣傳曰賢者所存澤流百世故使壻鄉春夏毋蚊蚋秋冬鮮繁霜癘蠱蚋遐厺其螟遐百穀收入天下莫知斯德祐之效也道牟群仙德潤故鄉知德者鮮歷世莫紀漢中大守南陽郭君諱芝字公載修北辰之政馳周邵之風歆樂唐君神靈之美以為道重者名邵德厚者廟尊乃發嘉教躬損奉錢倡率群義繕廣斯廟和祈福布之兆民刻石昭音揚君靈譽其辭曰遂享神藥超浮雲兮翱見隸釋三碑本酸棗令劉熊碑君諱熊字孟廣陵海西人也厥祖天皇大帝垂精接感篤生聖明仍其則子孫亨之分源而流枝葉扶疏出王別胤受爵列土封侯載德相繼丕顯光武皇帝之玄廣陵王之孫俞鄉侯之季子也誕生照明岐嶷踰絶長柴守約履勤體聖心敦五經之瑋圖兼古業核其妙行修言道宜京夏莫不師卬六藉五典如源如泉既練州郡卷舒委隨忠貞效官出省楊土流化南城政猶北辰衆星所從三祀有成來臻我邦循東之惠抑禮官賞進厲頑約之以禮博之以文政敦始初慎徽五典勤恤民殷心顧下仁恩如冬日威猛烈炎夏貪究革情清修勸慕德惠潛流鬯芳旁布尤愍縣濟濟之儀孜孜之踰帥厲後學致之雍泮草上之風莫不嚮應悅誨日新砥素七業勃然而興威居今而好古雖未盡道善必有所由處民之秉彝實我劉父其人魯無君子斯焉取旃允我劉父言善誘人講禮習聆匪徒豐學屢獲有年載克成神民協欣兩不相傷故德友歸焉自古在昔先民有作洪勳則甄盛刻表諸來世垂之罔極褎賢表善揚幽拔微式序在位量能授宜官無曠事為正以卒為更愍念蒸民勞苦不均為作正彈造設門更富者不獨逸樂貧者順四時積和感畼歲為豐穰賦稅不煩實我劉父吏民愛若慈父畏若神明悔令德清越孤竹德牟産奇誠宜褎顯照其憲則乃相咨度諏詢采托謠言刊詩三章其辭曰清和穆鑠實惟乾坤惟嶽降靈篤生我君服骨睿聖允鍾厥醇誕生岐嶷言協墳德震耀孝行通神動履規繩文彰彪繽成是正服以道德民有父子然後有君臣理財正辭束帛戔戔夢刻像鶴鳴一震天臨保漢實生勳明試賦授夷夏已親嘉錫來撫潛化如神其神伊何靈不傷人猗歟明哲秉道之樞養之福惟德之偶淵乎其長渙乎成功暇民豫新我通用行則達以誘我邦賴茲劉父用説其蒙澤零年豐黔首歌頌見隸釋五梁相費泛碑梁相諱泛字仲慮此邦之人也其先季文為魯大夫有功封費因姼為姓秦項兵起避地于此遂留家焉世業稼穡好學禮樂大漢之官司相繼絶而復續至梁府君以孝友至行聞于鄉邑仕更郡右寋質直在公履法察孝廉除郎中屯騎司馬遷蕭令𥅔民如子先教後罰流玄默之化奉以忠信守以敦篤在位九年百姓移風苛慝不作姦寇不發變爭路銷推讓道生三年不斷獄禎祥感應時沛有蝗獨不入界由此顯名國以狀聞朝廷嘉諸拜梁相宣慈惠不帥自正當登台階延究眉耇被病遜位春秋八十卒二子鳳由宰府至堂邑令政九江大守適孫感奚斯之義刊銘玄石旌勒厥美俾覽焉其辭曰穆穆顯祖厥德懿鑠播勛于前丕碩基業遺愛于民福流後胙庶昌在堂室功烈休矣末昆勠力見隸釋十一荊州從事范鎮碑漢故荊州從事苑君諱鎮字仲弓南陽茿陽人也其先出自苑柏何為晉樂正世掌朝禮之制失其官次侈以自儹采春秋録微撰祖諸世有苑子園實能紀陰陽之理其稱微而顯名著遂茲盛建功子孫爰居來宅茿陽君即其胄也君肇建仁義之基始創五福之衢韜律大杜綜皋陶甫侯之遺風故易稱師出以律五用是綱平不柱理政以憲循須律定紀功績德州里水蓄流速行著即休先公門之忠盡節君父遂登朝階為郡督郵列掾膺姿菅蘇靖供衛上方平不阿嚴而不清介之曒然發越州伯是聞備禮招納以部江夏過郡歷縣莫不雲披風靡畏威褱德垂芳遺藻紀歌于今當陟泰階配耀嶽嵩壽不極旄早世隕終景胙之胤二葉州郡官有世功位即繼倫于乃欽樹玄石甄德表勛其辭曰於惟從事茂德翔芉構基崇業侯室侯堂潔擬季文仁若春風義以繼志禮為宗匡虔慈愛與世無傷上德不德身翳名章靈永邁矣享斯榮光見隸釋十二浚儀令衡立碑君諱立字元節其先出自伊尹阿衡官有為氏君其胄也曾祖父以儒林清節建于官至左馮出固君幼有嘉長而傳帥業友尊賢泛愛含弘髮為縣功曹無儋石之蓄乃潔已約仕為史遷蕭尉紀吾浚善良隱情見懷然乃志高蹈濯鱗常為從昭違朝政望有人諸友含哀傷悼相與論述以為先歿問者也刊斯石以銘代其辭曰於穆從事淑慎廣淵柔嘉其德儀問孔芬其芬如何允孝允有烈勳宜享難老彭祖為昊天不弔降此咎氛嗚痛感此有靈貽厥後昆見隸釋十二趙相雍勸闕碑高祖父諱竇字伯著孝廉河南令侍御史九江太守君子望字伯桓右校令望子陟孝廉朐忍令陟弟朗字仲曼孝廉弘農令武都太守朗弟勸字叔孝廉成皋令趙國相勸子煜字稚孝廉資中長江令都尉自右校君以舊墓在水闕而墳墓多地勢斯造墳壠樹碑銘至趙國府君在官五載蒞政清平有甘棠之化年卌五卒于官故吏民漢中太守邯鄲等慕戀恩德刊石稱頌焉見隸釋十二闕林山碑君國者不躋高堙下先時或斷山罔以通平道民多病守長冠軍張仲瑜乃與邦人築斷故山道作此銘見水經注沔水中明刻本沔水下引此與郭輔碑謂並無年號皆不知何代人也今姑録于郭輔碑之前郭輔碑先生諱輔字甫成其先出自有周王季之中于為文王卿士采食于虢至于武王錫而封之後世謂之郭春秋之時為晉所并遭戰國秦漢子孫流分來居荊土氏國立姓焉傳云聖賢之後必有達者先生應焉其少也孝友而悅學其長也寬舒如好施是以宗親歸懷鄉䣊高尚直已而行年五十有二遇疾而終有四男三女咸高賢姣孋富貴顯榮可謂子孫繁者已其季女明文潁川之夫人也感惟考妣克昌之德登山采石致於墓道邑人縉紳刻石作歌昭示來嗣其辭曰實惟先生虢仲之裔盛德遺祀休矣亦世孝友貞信仁恕好惠直己自求不欲榮勢綽綽令人獲道之至篤生七子鍾天之祉堂堂四俊碩大婉敏娥娥三妃行追大姒葉葉昆嗣福祿茂止克昌厥後身去烈在鐫石作歌昭示萬祀見隸釋十二曹小史夏堪字德帝禹之精苗侯之遺零陵太守之根嗣也易世承系休祚仍垂印紼豔罔託堪繼令縱受氣蹈真年在洗奉親恭順束修操潔冰雪苛獲縣選初涉府朝典職首曹聰施布天殲良善卒遘瘮疴霣命犮摧國貞胤收傳寵遭官遼臨𠰀慈恩感踴族姻追傷娉會謝氏并靈合柩古命有之仲泥何㤞鳴呼哀哉其辭曰嗟德含勳質圭玉性馥芬視操希騏顏悓龍階望浮雲趼尺水津未強春華萌遭雹霜壽不究魄蜚揚情悲切著篇章刊石銘傳萬年見隸釋十二李翊夫人碑廣漢屬國侯夫人節行潔靜德配古之聖母早失匹壽眉耇不射憤然殷𤹯稱列迹厥辭曰昔彼衛姃輔齊匹桓文母循導周室獲蕃於戲夫人藏侯苗焉自彼適斯蹈禮伉言恭順承舅孝行布宣述嬪慈惠聰達楚樊繼姑入室勤養拳拳育理家道群宗為軒求福不回操無遺愆約身紡績殖賄圃園敬薑誨子叔敖陰恩男三女二雍穆閨門女則哲禮男則與權節義踰古訓導不煩九族和親若葉附根歲在大淵精魂奄昏飛神天庭收荊玄都莫不歎息涕零嗚呼明智有德咸曰何辜害我仁良顛犮殂𤹯感路人泣霑泥塗逝而不返子孫呱呱歎曰陰陽分兮鍾律茲星月列兮有四時神宓兮萬姓熹壽十二兮九九期五三末兮在姃秋發兮春華殆周公九兮成稱災靡黃髮兮蓋夭胎世有皇兮氣所裁赴鴻淵兮逝不來鳳延頸兮泣交頙悲兮涕隕零寐耿耿兮慛傷情彼倉天兮訴神靈𢝆切剝兮年不榮蘭𦭒亡兮喪芝英誰不忉兮作偯聲疇號兮鳴杞之至兮感動城陟四極兮升天庭日司命兮致不平飛蜂蠆兮害仁良魂魄孤兮獨煢陳礿祠兮返所生幽糸見兮存厥荊嗟曰遐兮適窅見隸釋十二休字元堅蓋之苗裔也載踵勛業文武相濟君曾號稱三郎中早終君纂考鴻軌體履弘懿敬為主動以禮讓為先每在周儕推人抑己而後流馨香播越名實先登仕郡歷五官淑瑋遂察孝廉除郎中光祿主昭德塞違韜光翳耀隱身殉道隘窮不悶匪令始實通四海之門塗禁防既釋辟司徒府秉忠蹈潔勞滿奏上拜新都令謙自劾寢疾于家季六有二月戊寅卜葬大守安平趙府君嘉厥高邈尼父之美宋敘三命之伐存有立名歿宜見旌守節日貞博聞曰文請諡休為貞文子爾乃祐詞曰文允垂棘勤典素精孔墨高難隱深不測紫極遐罻罔退潛伏靈闥張鼎武掌既盈命玄石勒立堂祠跱神德歿不朽傳兆億見隸續一年九月草九日故山陽府卒史防東守尉司馬字季德先出氏之裔胄也三代常為侯伯周武克商其胤族仲施于民迄于世濟其美不霣其功金銀翼衛彌熾于季德幼有聲文柔惠恭接物耽古好學褱道五針規克誦其詩既優明允篤誠不小畏慎如臨于谷在公明明委蛇其德德肅肅壽黃耇永亨五福猥遭溫疾喪犮華榮郡人諸友鄂驚會集流涕霑發舊宅消邢幽門百兩旁旁幡悠悠送者悲德金石播魂而有嘉寵休烏呼哀哉見隸續一秦君碑余聞湯武千載周孔異世以義相高況余忝祿踐迹遵基竊慕揚善喟然而歎其鄙辭曰於穆秦君命世優邁承祖皇裔出睪紀行録功必本其初惟君總角勵志仲尼從容六藝佃田疇升階英妙轉典蒸黎為政崇博五教並和仁賢敘位法依蕭何囹圄空虛鄉無逋逃凡百肅雍莫不率從境內既寧路不資遺耕夫千畝餘種不歸立清介白食茹拔葵三年有成嬰兒謠歌鼓腹善德踊躍嘔唏水靜魚集國富民繁戶增十倍牧守孔嘉怒不斷刑寬不容非化準邠邵比翮而飛永如南山不缺不虧略取大較丹書刻石垂示後昆識者察焉見顧氏金石文字記黎陽山碑縣取山之名取水之陽以為名也見水經注河水五山河馮隆有精英兮見文選吳都賦注司馬遷碑高門華池在茲夏陽見水經河水注四黃香墓碑延陵慈父葬于嬴博孟光貞婦窆夫于吳見蘇州志宋乾道初梅里蘇忠翊直卜葬得古冢乃黃香墓碑刻隸書案黃香江夏安陸人而葬于梅里故碑文為此語漢陽太守碑敦方足以正衆邪肅清足以濟殊俗不吐剛而諂上不茹柔而黷下見廣川書跋上谷長史侯相碑侯氏出自倉頡之後逾殷歷周各以氏分或著楚魏或顯齊秦晉卿士蒍斯其胄也食采華陽今蒲坂北亭即是城也見水經汾水注比干冢銘殷大夫比干之墓見水經清水注虞詡碑諱詡字定安虞仲之後為朝歌令武都太守見水經陰溝水注金城縣太山冠蓋里銘峨峨南嶽烈烈離明實敷俊乂君子以生惟此君子作漢之英德為龍光聲化鶴鳴見水經沔水中注漂水又沍金城縣縣有太山山下有廟漢末名士居其中荊州刺史行部見之雅嘆其盛號為冠蓋里刻石銘之此碑於永嘉中始為人所毀其餘文有可傳者其辭云云獨公山古墓磚文筮言吉龜言凶公三百年墮水中見御覽五百五十九引鄭緝之東陽記獨公山有古墓臨溪其磚文曰云云義熙中冢猶半存案義熙前三百年蓋東漢安帝時葬也上虞縣古冢磚文居在本土厥姓黃卜葬于此大富強易卦吉龜卦凶見御覽五百五十九引會稽十城地志瑟琶折古墓甓字瑟琶筮云吉龜云凶八百年墮水中見御覽五百五十九引輿地志琵琶折有古墓半在水中甓有隱起字云云謝靈運取甓至京師諸貴傳觀之案謝靈運前八百年當戰國之初然不言是篆文恐亦漢時墓耳鍾山壙中銘龜言土蓍言水甸服黃鍾啓靈址瘞在三上庚墮遇七中已六千三百浹辰交二九重三四百圮唐鄭欽識之曰卜宅者庾葬之歲月而先識墓圮日辰甸服五百也黃鍾十一也由大同四年卻求漢建武四年凡五百一十一年葬以三月十日庚寅三上庚也圮以七月十二日已已七中已也浹辰十二也建武四年三月至大同四年七月六千三百一十二月月一交故曰六千三百浹辰交二九十八也重三六也建武四年三月十日距大同四年七月十二日十八萬八千四百日故曰二九重三四百圮見舊唐書儒學鄭欽傳窆石銘沛國臨濉時窆石室永建六年五月十五日太歲在未所遭作大吉利窆石室侯來歸我有之見廣川書跋宋元祐二年永城下得石如豐碑其上刻銘瑜字雉璜聰明敏達觀物無滯清論所加必為成器醜議所指沒齒無怨見後漢史弼傳注引先賢行狀嘏辭賜孝桓皇帝福恭懷皇后命工祝承致多福無疆于爾孝曾孫皇帝使爾受祿于天宜稼于田眉壽萬年介爾景福俾守爾民勿替引之太常再拜太牢左辨以致皇帝見續漢祭祀志下注補引丁孚漢儀有桓帝祠恭懷皇后祝文嘏辭賜皇帝福陳留吏牘上有書潁川弘農可問河南南陽不可問見御覽六百六引東觀漢記時天下墾田多不實詔檢覆核百姓嗟怨諸郡遣使帝見陳留史牘上有書視之云云案此建武時書朱雀闕天下大亂曹節王甫幽殺太后常侍侯覽多殺黨人公卿皆尸祿無有忠言者見後漢曹節傳熹平元年竇太后崩有何人書朱雀闕言移書曹公昔在濟南毀壞神壇其道乃與中黃太乙同似若知道今更迷惑漢行已盡黃家當立天之大運非君才力所能存也見魏志武紀初平三年注引魏書賊乃移書太祖求并北成南上言臣纍世蒙恩不可勝數孝章皇帝聖思遠慮遂欲見成就故令烏桓鮮卑討北虜斬單于首級破壞其國今所新降虛渠等詣臣自言去歲三月中發虜庭北單于創刈南兵又畏丁令鮮卑遁逃遠去依安侯河西今年正月骨都侯等復共立單于異母兄右賢王為單于其人以兄弟爭立並各離散臣與諸王骨都侯及新降師雜議方略皆曰宜及北虜分爭出兵討伐破北成南并為一國令漢家長無北念又今月八日新降右須日逐鮮堂輕從虜庭遠來詣臣言北虜諸部多欲內顧但恥自發遣故未有至者若出兵奔擊必有響應今年不往恐復並一臣伏念先父歸漢以來被蒙覆載嚴塞明侯大兵擁護積四十年臣等生長漢地開口仰食歲時賞賜動輒億萬雖拱垂安枕慚無報效之地願發國中及諸部故胡新降精兵遣左谷蠡王師子左呼衍日逐王須訾將萬騎出朔方左賢王安國右大且渠王交勒蘇將萬出居延期十二月同會虜地臣將餘兵萬人屯五原朔方塞以為拒守臣素愚淺又兵衆單少不足以防內外願遣執金吾耿秉度遼將軍鄧鴻及西河雲中五原朔方上郡太守並力而北令北地安定太守各屯要害冀因聖帝威神一舉平定臣國成敗要在今年已敕諸部嚴兵馬訖九月龍祠悉集河上唯陛下載哀省察見後漢南胸奴傳肅宗崩竇太后臨朝其年七月單于上言上書請都護願復遣子入侍更請都護都護不出誠迫于胸奴見後漢西域莎車傳沙彌卜慧章句序昔在佛世經法未記言出尊口弟子誦習辭約而義博説鮮而妙湥佛既泥洹微言永絶猶穀水消竭日月隕墜于是衆賢共使阿難演其所聞凡所著出十二部經其後高明各為注説章句解故或以十數有菩薩者出自安息字世高韜弘稽古靡經不綜愍俗童蒙示以橋梁于是漢邦敷宣佛法凡厥所出數百萬言或以口解或以文傳唯沙彌十慧未聞湥説夫十者數之終慧者道之本也物非數不定行非道不度其文郁郁其用亹亹廣彌三界近觀諸身調以不敏得充賢次學未浹聞行未中四夙罹凶咎遘和上憂長無過庭善誘之教悲窮自潸無所繫心于是發憤忘食因間歷思遂作十慧章句不敢自專事喻衆經上以達道德下以慰己志創奧博崇尚之賢不足留意未升堂室者可以啓蒙焉見釋藏迹十出三藏記集十般舟三昧經記般舟三昧經光和二年十月八日天竺菩薩竺佛朔于洛陽出菩薩法護時傳言者月支菩薩支讖授與河南洛陽孟福字元士隨侍菩薩張蓮字少安筆授令後普著在建安十三年于佛寺中校定悉具足後有寫者皆得南無佛又言建安三年歲在戊子八月八日于許昌寺校定見釋藏迹七案菩薩法護當有誤晉初有竺法護非即此佛説興起行經序所謂崑崙山者則閻浮利地之中心也山皆寶石周匝有五百窟窟皆黃金常五百羅漢居之阿槈大泉外周圍山山內平地泉處其中泉岸皆黃金以四獸頭出水其口各繞一匝己還復其方出投四海象口所出者則黃河是也其泉方各二十五由延湥三厥劣一厥劣者七里也泉中有金臺臺方一由延臺上有金蓮華以七寶為莖如來將五百羅漢常以月十五日于中説戒因舍利弗問佛十事宿緣後以十五日時將本弟子説訖乃止如是至九往所以十問而九答者以木鏘之對人間償之欲示人宿緣不可逃避故也又阿槈泉中非有漏礙形所可周遊雖有阿難為如來所接也所以殷勤告舍利弗者欲化諸龍故也見釋藏與八抗表與沙門竺法蘭比校五嶽十八仙觀太上三洞弟子道士褚善信等六百九十人死罪上言臣聞太上無形無名無極無上虛無自然大道元首自從造化道教從生無為之尊自然之父上古同遵百王不易今陛下道邁羲皇德過堯舜光澤四海八表歸仁臣等竊承陛下棄本逐末求教西域臣觀西域所事者既是胡神所説者不參華夏復請胡人令翻其語託同似漢臣等思忖陛下雖翻得此語恐非大道如不依信願陛下恕臣等罪聽與驗試臣等五嶽諸山道士多有聰明智慧博通經典從元皇已來太上經術悉能曉了太虛符咒並皆明達或有吞符餌氣或有策使鬼神或有入火不燒或有履水不溺或有白日升天或有隱形于地至于方藥法術無有不能者願陛下許臣等得與比校一則聖上意安二則得辨真偽三則大道有歸四則不亂華俗臣等若比對不如任聽重決若臣等比對有勝乞除虛詐臣等誠惶誠恐死罪死罪以聞見釋藏集古今佛道論衡又續論衡又破邪論上又略見法苑珠林六十八又廣宏明集一自敘漢延光元年新野山北豫受仙君神丹要訣道成去世付之名山如有得者列為真人行乎去來何為俗間不死之要道在神丹行氣導引俯仰屈伸服食草木可得延年不能度世以至乎仙子欲聞道此是要言積學所致無為合神上士為之勉力加勤下愚大笑以為不然能知神丹久視長安于是陰君裂黃素寫丹經一通封一文石之函置嵩高山一通黃櫨之簡漆書之封以青玉之函置太華山一通黃金之簡刻而書之封以白銀之函置蜀綏山一封縑書合為十篇付弟子使世世當有所傳付又著詩三篇以示將來其一曰惟余之先佐命唐虞爰逮漢世紫艾重紆豫獨好道而為匹夫高尚素志不仕王侯貪生得生亦又何求超迹蒼霄乘龍駕浮青雲承翼與我為仇入火不灼蹈波不濡消遙太極何慮何憂傲戲仙都顧愍群愚年命之逝如彼川流奄忽未幾泥土為儔奔馳索死不肯暫休其二章曰豫之聖師體道之真升降變化喬松為鄰唯余同學十有二人寒苦求道歷二十年中多怠墮志行不堅痛乎諸子命也自天天不妄授道必歸賢身沒幽壤何時可還唯爾將來勤加精研勿為流浴富貴所牽神道一成升彼九天壽同三光何但億千其三章曰惟余束髮少好道德棄家隨師東西南北委放五濁避世自匿三十餘年明山之側寒不遑衣飢不暇食思不敢歸勞不敢息奉事聖師承歡悅色面垢足胝乃見哀識遂受要訣恩深不測妻子延年咸享無極黃白已成貨財千億使役鬼神玉女侍側今得度世神丹之力陰君處民間百七十年色如女子白日升天而去見神仙傳四御覽六百六十四太平廣記八自理表高貴不尚節畝壟之夫而箕踞遺類研繁失機婢妾其性媚世求顯偷窮很鄙有辱天官易譏負乘誠高之謂臣不勝鬼言謹因千里驛聞見水經淇水注光武建武二年冀作公廨未就而亡後守趙高計工用二百萬五官黃秉功曹劉適言四百萬錢于是冀乃鬼見白日道從入府與高及秉等對共計校定為適秉所割匿冀乃書表自理其略言云云付高上之高以狀聞詔下還冀西河田宅妻子焉兼為差代以弭幽中之訟與兒他書告他當從府君出案行當以八月八日日中時武陵城南溝中畔頓汝是時必往見搜神記建安四年武陵女子李娥病死埋城外已十四日比舍蔡仲聞冢中有聲發出遂活自言為司命誤召到得遣出過西門適見外兄劉伯文相勞問以書一封與其兒他娥乃致伯文書他識其紙是父亡時送箱巾也書不可曉詣費長房讀之到期于城南待之果至聞有呼聲曰他來汝得我所寄李娥書不邪因與藥一丸辟來年妖厲題門珠門珠門國雖存無射年欲知此書盧耽還見御覽一百八十三引郡國志廣州盧耽仕州為治中有仙術刺史步騭惡之以狀聞後誅之𥘩後題其門云云太守削之隨削字更生
