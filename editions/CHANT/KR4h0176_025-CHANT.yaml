body:
  text: 成帝徙陳湯制廷尉增壽當是湯前有討郅支單于功其免湯為庶人徙邊見漢書陳湯傳徙解萬年制故將作大匠萬年佞邪不忠妄為巧詐多賦斂煩繇役興卒暴之作卒徒蒙辜死者連屬毒流眾庶海內怨望雖蒙赦令不宜居京師見漢書陳湯傳大赦詔迺者火災降於祖廟有星孛於東方始正而虧咎孰大焉書云惟先假王正厥事群公孜孜帥先百寮輔朕不逮崇寬大長和睦凡事恕己毋行苛刻其大赦天下使得自新見漢書成紀赦罪減賦詔迺者徙泰畤后土于南郊北郊朕親飭躬郊祀上帝皇天報應神光並見三輔長無共張繇役之勞赦奉郊縣長安長陵及中都官耐罪徒減天下賦錢算四十見漢書成紀遣使循行天下詔迺者郡國被水災流殺人民多至千數京師無故訛言大水至吏民驚恐奔走乘城殆苛暴深刻之吏未息元元冤失職者眾遣諫大夫林等循行天下見漢書成紀舉賢良方正詔蓋聞天生眾民不能相治為之立君以統理之君道得則草木昆蟲咸得其所人君不德謫見天地災異婁發以告不治朕涉道日寡舉錯不中乃戊申日蝕地震朕甚懼焉公卿其各思朕過失明白陳之女無面從退有後言丞相御史與將軍列侯中二千石及內郡國舉賢良方正能直言極諫之士詣公車朕將覽焉見漢書成紀詔有司復東平削縣蓋聞仁以親親古之道也前東平王有闕有司請廢朕不忍又請削朕不敢專惟王之至親未嘗忘於心今聞王改行自新尊修經術親近仁人非法之求不以奸吏朕甚嘉焉傳不云乎朝過夕改君子與之其復前所削縣如故見漢書宣元六王傳加秩王尊詔制詔御史東郡河水盛長毀壞金隄未決三尺百姓惶恐奔走太守身當水衝履咫尺之難不避危殆以安眾心吏民復還就作水不為災朕甚嘉之秩尊中二千石加賜黃金二十斤見漢書王尊傳改元河平詔河決東郡流漂二州校尉王延世隄塞輒平其改元為河平賜天下吏民爵各有差見漢書成紀東郡河決流漂二州校尉延世隄防三旬立塞其以五年為河平元年卒治河者為著外繇六月惟延世長於計策功費約省用力日寡朕甚嘉之其以延世為光祿大夫秩中二千石賜爵關內侯黃金百斤見漢書溝洫志日蝕求言大赦詔朕獲保宗廟戰戰栗栗未能奉稱傳曰男教不修陽事不得則日為之蝕天著厥異辜在朕躬公卿大夫其勉悉心以輔不逮百寮各修其職惇任仁人退遠殘賊陳朕過失無有所諱大赦天下見漢書成紀免丞相王商詔制詔御史蓋丞相以德輔翼國家典領百寮協和萬國為職任莫重焉今樂昌侯商為丞相出入五年未聞忠言嘉謀而有不忠執左道之辜陷于大辟前商女弟內行不修奴賊殺人疑商教使為商重臣故抑而不窮今或言商不以自悔而反怨懟朕甚傷之惟商與先帝有外親未忍致于理其赦商罪使者收丞相印綬見漢書王商傳議減省律令詔甫刑云五刑之屬三千大辟之罰其屬二百今大辟之刑千有餘條律令煩多百有餘萬言奇請它比日以益滋自明習者不知所由欲以曉喻眾庶不亦難乎於以羅元元之民夭絕亡辜豈不哀哉其與中二千石二千石博士及明習律令者議減死刑及可蠲除約省者令較然易知條奏書不云乎惟刑之恤哉其審核之務準古法朕將盡心覽焉見漢書刑法志閔楚王被疾詔蓋聞天地之性人為貴人之行莫大於孝楚王囂素行孝順仁慈之國以來二十餘年孅介之過未嘗聞朕甚嘉之今迺遭命離于惡疾夫子所痛曰蔑之命矣夫斯人也而有斯疾也朕甚閔焉夫行純茂而不顯異則有國者將何勗哉書不云乎用德章厥善今王朝正月詔與子男一人俱其以廣戚縣戶四千三百封其子勳為廣戚侯見漢書宣元六王傳順時令詔昔在帝堯立羲和之官命以四時之事令不失其序故書云黎民於蕃時雍明以陰陽為本也今公卿大夫或不信陰陽薄而小之所奏請多違時政傳以不知周行天下而欲望陰陽和調豈不謬哉其務順四時月令見漢書成紀舉博士詔古之立太學將以傳先王之業流化於天下也儒林之官四海淵原宜皆明於古今溫故知新通達國體故謂之博士否則學者無述焉為下所輕非所以尊道德也工欲善其事必先利其器丞相御史其與中二千石二千石雜舉可充博士位者使卓然可觀見漢書成紀勸農詔夫洪範八政以食為首斯誠家給刑錯之本也先帝劭農薄其租稅寵其強力令與孝弟同科間者民彌惰怠卿本者少趨末者眾將何以矯之方東作時其令二千石勉勸農桑出入阡陌致勞來之書不云乎服田力嗇乃亦有秋其勗之哉見漢書成紀封王音為安陽侯詔車騎將軍音宿衛忠正勤勞國家前為御史大夫以外親宜典兵馬入為將軍不獲宰相之封朕甚慊焉其封音為安陽侯食邑與五侯等俱三千戶見漢書元后傳治冤獄詔朕承天地獲保宗廟明有所蔽德不能綏刑罰不中眾冤失職趨闕告訴者不絕是以陰陽錯謬寒暑失序日月不光百姓蒙辜朕甚閔焉書不云乎即我御事罔克耆壽咎在厥躬方春生長時臨遣諫大夫理等舉三輔三河弘農冤獄公卿大夫部刺史明申敕守相稱朕意焉其賜天下民爵一級女子百戶牛酒加賜鰥寡孤獨高年帛逋貸未入者勿收見漢書成紀封丙吉孫詔制詔丞相御史蓋聞褒功德繼絕統所以重宗廟廣賢聖之路也故博陽侯吉以舊恩有功而封今其祀絕朕甚憐之夫善善及子孫古今之通誼也其封吉孫中郎將關內侯昌為博陽侯奉吉後見漢書丙吉傳封史丹為武陽侯詔夫褒有德賞元功古今通義也左將軍丹往時導朕以忠正秉義醇壹舊德茂焉其封丹為武陽侯國東海郯之武彊聚戶千一百見漢書史丹傳選賢詔古之選賢傅納以言明試以功故官無廢事下無逸民教化流行風雨和時百穀用成眾庶樂業咸以康寧朕承鴻業十有餘年數遭水旱疾疫之災黎民婁困於飢寒而望禮義之興豈不難哉朕既無以率道帝王之道日以陵夷意乃招賢選士之路鬱滯而不通與將舉者未得其人也其舉敦厚有行義能直言者冀聞切言嘉謀匡朕之不逮見漢書成紀恤民詔數敕有司務行寬大而禁苛暴訖今不改一人有辜舉宗拘繫農民失業怨恨者眾傷害和氣水旱為災關東流冗者眾青幽冀部尤劇朕甚痛焉未聞在位有惻然者孰當助朕憂之已遣使者循行郡國被災害什四以上民貲不滿三萬勿出租賦逋貸未入皆勿收流民欲入關輒籍內所之郡國謹遇以理務有以全活之思稱朕意見漢書成紀罷昌陵詔朕執德不固謀不盡下過聽將作大匠萬年言昌陵三年可成作治五年中陵司馬殿門內尚未加功天下虛耗百姓罷勞客土疏惡終不可成朕惟其難怛然傷心夫過而不改是謂過矣其罷昌陵及故陵勿徙吏民令天下毋有動搖之心見漢書成紀龍見日蝕詔乃者龍見于東萊日有蝕之天著變異以顯朕郵朕甚懼焉公卿申敕百寮深思天誡有可省減便安百姓者條奏所振貸貧民勿收見漢書成紀吏民助振贍者賜爵詔關東比歲不登吏民以義收食貧民入穀物助縣官振贍者已賜直其百萬以上加賜爵右更欲為吏補三百石其吏也遷二等三十萬以上賜爵五大夫吏亦遷二等民補郎十萬以上家無出租賦三歲萬錢以上一年見漢書成紀封淳于長等詔前將作大匠萬年佞邪不忠知昌陵卑下不可為萬歲居奏請營作建置郭邑妄為巧詐積土增高多賦斂煩繇役興卒暴之作卒徒蒙辜死者連屬百姓罷極天下匱竭常侍閎前為大司農中丞數奏昌陵不可成侍中衛尉長數白宜早止徙家反故處朕以長言下閎章公卿議者皆合長計長首建至策閎典主省大費民以康寧閎前賜爵關內侯黃金百斤其賜長爵關內侯食邑千戶閎五百戶萬年佞邪不忠毒流眾庶海內怨望至今不息雖蒙赦令不宜居京師其徙萬年敦煌郡見漢書成紀又見陳湯傳又見佞幸淳于長傳遣使循行詔天災仍重朕甚懼焉惟民之失職臨遣大中大夫嘉等循行天下存問耆老民所疾苦其與部刺史舉惇樸遜讓有行義者各一人見漢書成紀詔有司乃者地震京師火災婁降朕甚懼之有司其悉心明對厥咎朕將親覽焉見漢書成紀禁奢侈詔聖王明禮制以序尊卑異車服以章有德雖有其財而無其尊不得逾制故民興行上義而下利方今世俗奢僭罔極靡有厭足公卿列侯親屬近臣四方所則未聞修身遵禮同心憂國者也或乃奢侈逸豫務廣第宅治園池多畜奴婢被服綺穀設鐘鼓備女樂車服嫁娶葬埋過制吏民慕效濅以成俗而欲望百姓儉節家給人足豈不難哉詩不云乎赫赫師尹民具爾瞻其申敕有司以漸禁之青綠民所常服且勿止列侯近臣各自省改司隸校尉察不變者見漢書成紀孛星見求直言詔乃者日蝕星隕謫見于天大異重仍在位默然罕有忠言今孛星見于東井朕甚懼焉公卿大夫博士議郎其各悉心惟思變意明以經對無有所諱與內郡國舉方正能直言極諫者各一人北邊二十二郡舉勇猛知兵法者各一人見漢書成紀還許旦及親屬詔蓋聞仁不遺遠誼不忘親前平安剛侯夫人謁坐大逆罪家屬幸蒙赦令歸故郡朕惟平恩戴侯先帝外祖魂神廢棄莫奉祭祀念之未嘗忘于心其還平恩侯旦及親屬在山陽郡者見漢書外戚孝成許后傳還馮參詔中山孝王短命早薨願以舅宜鄉侯參為關內侯歸家朕甚愍之其還參京師以列侯奉朝請見漢書馮奉世附傳又見宣元六王傳立定陶王欣為皇太子詔朕承太祖鴻業奉宗廟二十五年德不能綏理宇內百姓怨望者眾不蒙天祐至今未有繼嗣天下無所係心觀于往古近事之戒禍亂之萌皆繇斯焉定陶王欣於朕為子慈仁孝順可以承天序繼祭祀其立欣為皇太子封中山王舅諫大夫馮參為宜鄉侯益中山國三萬戶以慰其意賜諸侯王列侯金天下當為父後者爵三老孝弟力田帛各有差見漢書成紀封孔吉詔蓋聞王者必存二王之後所以通三統也昔成湯受命列為三代而祭祀廢絕考求其後莫正孔吉其封吉為殷紹嘉侯見漢書成紀報烏珠留右鞮單于詔藩擅稱詔從單于求地法當死更大赦二今徙藩為濟南太守不令當匈奴見漢書匈奴傳夏侯藩使匈奴求地單于遣使上書以藩求地狀聞詔報單于策許嘉將軍家重身尊不宜以吏職自累賜黃金二百斤以特進侯就朝位見漢書外戚傳下白虎殿策方正直言天地之道何貴王者之法何如六經之義何上人之行何先取人之術何以當世之治何務各以經對見漢書杜欽傳賜王音策書外家何甘樂禍敗而欲自黥劓相戮辱於太后前傷慈母之心以危亂國外家宗族強上一身寖弱日久今將一施之君其召諸侯令待府舍見漢書元后傳冊免薛宣君為丞相出入六年忠孝之行率先百僚朕無聞焉朕既不明變異數見歲比不登倉廩空虛百姓飢饉流離道路疾疫死者以萬數人至相食盜賊並興群職曠廢是朕之不德而股肱不良也乃者廣漢群盜橫恣殘賊吏民朕惻然傷之數以問君君對輒不如其實西州鬲絕幾不為郡三輔賦斂無度酷吏並緣為奸侵擾百姓詔君案驗復無欲得事實之意九卿以下咸承風指同時陷于謾欺之辜咎繇君焉有司法君領職解嫚開謾欺之路傷薄風化無以帥示四方不忍致君于理其上丞相高陽侯印綬罷歸見漢書薛宣傳賜史丹策左將軍寑病不衰願歸治疾朕愍以官職之事久留將軍使躬不瘳使光祿勳賜將軍黃金五十斤安車駟馬其上將軍印綬宜專精神務近醫藥以輔不衰見漢書史丹傳賜翟方進冊皇帝問丞相君有孔子之慮孟賁之勇朕嘉與君同心一意庶幾有成惟君登位於今十年災害並臻民被飢餓加以疾疫溺死關門牡開失國守備盜賊黨輩吏民殘賊毆殺良民斷獄歲歲多前上書言事交錯道路懷奸朋黨相為隱蔽皆亡忠慮群下凶凶更相嫉妒其咎安在觀君之治無欲輔朕富民便安元元之念間者郡國穀雖頗孰百姓不足者尚眾前去城郭未能盡還夙夜未嘗忘焉朕惟往時之用與今一也百僚用度各有數君不量多少一聽群下言用度不足奏請一切增賦稅城郭堧及園田過更算馬牛羊增益鹽鐵變更無常朕既不明隨奏許可後議者以為不便制詔下君君云賣酒醪後請止未盡月復奏議令賣酒醪朕誠怪君何持容容之計無忠固意將何以輔朕帥導群下而欲久蒙顯尊之位豈不難哉傳曰高而不危所以長守貴也欲退君位尚未忍君其孰念詳計塞絕姦原憂國如家務便百姓以輔朕朕既已改君其自思強食慎職使尚書令賜君上尊酒十石養牛一君審處焉見漢書翟方進傳賜趙婕妤書問飛燕趙婕妤夫人有誠必應以實憤懣充中必形於色詩云鼓鍾于宮聲聞于外猶此言之真偽之效難以欺矣夫君子貴素文足通殷勤而已亦何必華辭哉自以親婕妤異于他人故不能無言亦不以深相過望前數以顏色不平應對舒遲為譴卒不能自改婕妤方見親幸之時老母在堂兩弟皆簪金貂並侍于側同列比舍豈不謂婕妤妹弟尊幸哉今過蒙譴獨謂老親兩弟何見御覽一百四十四引婦人集答趙皇后因閱來奏喜慶交集夫妻之私義均一體社稷之重嗣續其先妊體方初保綏宜厚葯有性者勿舉食無毒者可親有懇求上無煩箋奏口授官使可矣見秦醇趙飛燕別傳報匡衡君以道德修明位在三公先帝委政遂及朕躬君遵修法度勤勞公家朕嘉與君同心合意庶幾有成今司隸校尉尊妄詆欺加非於君朕甚閔焉方下有司問狀君何疑而上書歸侯乞骸骨是章朕之未燭也傳不云乎禮義不愆何恤人之言君其察焉專精神近醫藥強食自愛見漢書成帝紀又見匡衡傳報王鳳朕承先帝聖緒涉道未深不明事情是以陰陽錯繆日月無光赤黃之氣充塞天下咎在朕躬今大將軍迺引過自予欲上尚書事歸大將軍印綬罷大司馬官是明朕之不德也朕委將軍以事誠欲庶幾有成顯先祖之功德將軍其專心固意輔朕之不逮毋有所疑見漢書元后傳報張禹朕以幼年執政萬機懼失其中君以道德為師故委國政君何疑而數乞骸骨忽忘雅素欲避流言朕無聞焉君其固心致思總秉諸事推以孳孳無違朕意加賜黃金百斤養牛上尊酒大官致餐侍醫視疾使者臨問見漢書張禹傳報許皇后皇帝問皇后所言事聞之夫日者眾陽之宗天光之貴王者之象人君之位也夫以陰而侵陽虧其正體是非下陵上妻乘夫賤踰貴之變與春秋二百四十二年變異為眾莫若日蝕大自漢興日蝕亦為呂霍之屬見以今揆之豈有此等之效與諸侯拘迫漢制牧相執持之也又安獲齊趙七國之難將相大臣褢誠秉忠唯義是從又惡有上官博陸宣成之謀若夫徒步豪桀非有陳勝項梁之群也匈奴夷狄非有冒頓郅支之倫也方外內鄉百蠻賓服殊俗慕義八州懷德雖使其懷挾邪意猶不足憂又況其無乎求於夷狄無有求於臣下無有微後宮也當何以塞之日者建始元年正月白氣出於營室營室者天子之後宮也正月於尚書為皇極皇極者王氣之極也白者西方之氣其於春當廢今正於皇極之月興廢氣於後宮視后妾無能懷任保全者以著繼嗣之微賤人將起也至其九月流星如瓜出於文昌貫紫宮尾委曲如龍臨於鉤陳此又章顯前尤著在內也其後則有北宮井溢南流逆理數郡水出流殺人民後則訛言相傳驚震女童入殿咸莫覺知夫河者水陰四瀆之長今乃大決沒漂陵邑斯昭陰盛盈溢違經絕紀之應也迺昔之月鼠巢於樹野鵲變色五月庚子鳥焚其巢太山之域易曰鳥焚其巢旅人先笑後號咷喪牛于易凶言王者處民上如鳥之處巢也不顧卹百姓百姓畔而去之若鳥之自焚也雖先快意說笑其後必號而無及也百姓喪其君若牛亡其毛也故稱凶泰山王者易姓告代之處今正於岱宗之山甚可懼也三月癸未大風自西搖祖宗寢廟揚裂帷席折拔樹木頓僵車輦毀壞檻屋災及宗廟足為寒心四月己亥日蝕東井轉旋且索與既無異己猶戊也亥復水也明陰盛咎在內於戊己虧君體著絕世於皇極顯禍敗及京都於東井變怪眾備末重益大來數益甚成形之禍月以迫切不救之患日寖婁深咎敗灼灼若此豈可以忽哉書云高宗彤日粵有雊雉祖己曰惟先假王正厥事又曰雖休勿休惟敬五刑以成三德即飭椒房及掖庭耳今皇后有所疑便不便其條刺使大長秋來白之吏拘於法亦安足過蓋矯枉者過直古今同之且財幣之省特牛之祠其於皇后所以扶助德美為華寵也咎根不除災變相襲祖宗且不血食何戴侯也傳不云乎以約失之者鮮審皇后欲從其奢與朕亦當法孝武皇帝也如此則甘泉建章可復興矣世俗歲殊時變日化遭事制宜因時而移舊之非者何可放焉君子之道樂因循而重改作昔魯人為長府閔子騫曰仍舊貫如之何何必改作蓋惡之也詩云雖無老成人尚有典刑曾是莫聽大命以傾孝文皇帝朕之師也皇太后皇后成法也假使太后在彼時不如職今見親厚又惡可以逾乎皇后其刻心秉德毋違先后之制度力誼勉行稱順婦道減省群事謙約為右其孝東宮毋闕朔望推誠永究爰何不臧養名顯行以息眾讙垂則列妾使有法焉皇后深惟毋忽見漢書外戚孝成許后傳于是省減椒房掖廷用度皇后乃上疏上于是采劉向谷永之言以報報王鳳朕秉事不明政事多闕故天變婁臻咸在朕躬將軍迺深引過自予欲乞骸骨而退則朕將何嚮焉書不云乎公無困我務專精神安心自持期於亟瘳稱朕意焉見漢書元后傳報翟方進定陵侯長已伏其辜君雖交通傳不云乎朝過夕改君子與之君何疑焉其專心壹意毋怠近醫藥以自持見漢書翟方進傳幼弱減死罪令年未滿七歲賊斬殺人及犯殊死者上請廷尉以聞得減死見漢書刑法志鼎銘寇盜平黃河清見鼎錄
