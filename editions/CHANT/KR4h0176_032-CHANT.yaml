body:
  text: 賈誼旱雲賦帷昊文之大旱兮失精和之正理遙望白雲之蓬勃兮滃澹澹而妄止運清濁之澒洞兮正重沓而並起嵬隆崇以崔巍兮時彷彿而有似屈卷輪而中天兮象虎驚與龍駭相搏據而俱興兮妄倚儷而時有遂積聚而給沓兮相紛薄而慷慨若飛翔之從橫兮揚波怒而澎濞正惟布而雷動兮相擊衝而破碎或窈窕而四塞兮誠若雨而不墜陰陽分而不相得兮更惟貪邪而狼戾終風解而霧散兮陵遲而堵潰或深潛而閉藏兮爭離而並逝廓蕩蕩其若滌兮日照照而無穢隆盛暑而無聊兮煎砂石而爛煟湯風至而合熱兮群生悶滿而愁憒畎畝枯槁而失澤兮壤石相聚而為害農夫垂拱而無事兮釋其鉏耨而下淚憂疆畔之遇害兮痛皇天之靡惠惜穉稼之旱夭兮離天災而不遂懷怨心而不能已兮竊託咎于在位獨不聞唐虞之積烈兮與三代之風氣時俗殊而不還兮恐功久而壞敗何操行之不得兮政失中而違節陰氣辟而留滯兮猒暴至而沈沒嗟乎惜葉太劇何辜于天無恩澤忍兮嗇夫何寡德矣既已生之不與福矣來何暴也去何躁也孳孳望之其可悼也憭兮慄兮以鬱怫兮念思白雲腸如結兮終怨不雨甚不仁兮布而不下甚不信兮白雲何怨柰何人兮見古文苑虡賦牧太平以深志象巨獸之屈奇妙彫文以刻鏤舒循尾之采垂舉其鋸牙以左右相指負大鐘而欲飛見蓺文類聚四十四妙彫文以刻鏤兮象巨獸之屈奇兮戴高角之峨峨負大鐘而顧飛美哉爛兮亦天地之大式見初學記十六攖擊拳以蟉虯負大鐘而欲飛見御覽五百八十二鵩鳥賦誼為長沙王太傅三年有鵩鳥飛入誼舍止于坐隅鵩似鴞不祥鳥也誼既以讁居長沙長沙卑溼誼自傷悼以為壽壽不得長迺為賦以自廣其辭曰單閼之歲兮四月孟賈庚子日斜兮鵩集予舍止于坐隅貌甚閒暇異物來集兮私怪其故發書占之兮讖言其度曰野鳥入處兮主人將去請問于鵩兮予去何之吉乎告我凶言其災淹速之度兮語予其期鵩乃歎息舉首奮翼口不能言請對以臆萬物變化兮固無休息斡流而遷兮或推而還形氣轉續兮變化而蟺沕穆無窮兮胡可勝言禍兮福所倚福兮禍所伏憂喜聚門兮吉凶同域彼吳強大兮夫差以敗越棲會稽兮句踐霸世斯游遂成兮卒被五刑傅說胥靡兮乃相武丁夫禍之與福兮何異糾纆命不可說兮孰知其極水激則旱兮矢激則遠萬物回薄兮振蕩相轉雲蒸雨降兮錯繆相紛大鈞播物兮坱軋無垠天不可與慮兮道不可與謀遲速有命兮惡識其時且夫天地為鑪兮造化為工陰陽為炭兮萬物為銅合散消息兮安有常則千變萬化兮未始有極忽然為人兮何足控摶化為異物兮又何足患小智自私兮賤彼貴我達人大觀兮物無不可貪夫徇財兮烈士殉名夸者死權兮品庶每生怵迫之徒兮或趨東西大人不曲兮意變齊同愚士繫俗兮窘若囚拘至人遺物兮獨與道俱眾人惑惑兮好惡積億真人恬漠兮獨與道息釋知遺形兮超然自喪寥廓忽荒兮與道翱翔乘流則逝兮得坻則止縱軀委命兮不私與己其生若浮兮其死兮若休澹乎若深泉之靜泛乎若不繫之舟不以生故自寶兮養空而浮德人無累知命不憂細故蔕芥兮何足以疑見史記賈誼傳漢書賈誼傳文選蓺文類聚九十二惜誓惜余年老而日衰兮歲忽忽而不反登蒼天而高舉兮歷眾山而日遠觀江河之紆曲兮離四海之霑濡攀北極而一息兮吸沆瀣以充虛飛朱鳥使先驅兮駕太一之象輿蒼龍蚴虯于左驂兮白虎騁而為右騑建日月以為蓋兮載玉女于後車馳騖于杳冥之中兮休息虖崑崙之墟樂窮極而不猒兮願從容虖神明涉丹水而駝騁兮右大夏之遺風黃鵠之一舉兮知山川之紆曲再舉兮睹天地之圜方臨中國之眾人兮託回飆乎尚羊乃至少原之兮赤松王喬皆在旁二子擁瑟而調均兮余因稱乎清商澹然而自樂兮吸眾氣而翱翔念我長生而久僊兮不如反余之故鄉黃鵠後時而寄處兮鴟梟群而制之神龍失水而陸居兮為螻蟻之所裁夫黃鵠神龍猶如此兮況賢者之逢亂世哉壽冉冉而日衰兮固儃回而不息俗流從而不止兮眾枉聚而矯直或偷合而苟進兮或隱居而深藏若稱量之不審兮同權概而就衡或推迻而苟容兮或直言之諤諤傷誠是之不察兮并紉茅絲以為索方世俗之幽昏兮眩白黑之美惡放山淵之龜玉兮相與貴夫礫石梅伯數諫而至醢兮來革順志而用國悲仁人之盡節兮為小人之所賊比干忠諫而剖心兮箕子被髮而佯狂水背流而源竭兮木去根而不長非重軀以慮難兮惜傷身之無功已矣哉獨不見夫鸞鳳之高翔兮乃集大皇之循四極而回周兮見盛德而後下彼聖人之神德兮遠濁世而自藏使麒麟可得羈而係兮又何以異虖犬羊見楚辭十一上疏陳政事臣竊惟事勢可為痛哭者一可為流涕者二可為長太息者六若其它背理而傷道者難徧以疏舉進言者皆曰天下已安已治矣臣獨以為未也曰安且治者非愚則諛皆非事實知治亂之體者也夫抱火厝之積薪之下而寢其上火未及燃因謂之安方今之勢何以異此本末舛逆首尾衡決國制搶攘非甚有紀胡可謂治陛下何不壹令臣得孰數之于前因陳治安之策試詳擇焉夫射獵之娛與安危之機孰急使為治勞智慮苦身體乏鍾鼓之樂勿為可也樂與今同而加之諸侯軌道兵革不動民保道領匈奴賓服四荒鄉風百姓素朴獄訟衰息大數既得則天下順治海內之氣清和咸理生為明帝沒為明神名譽之美垂於無窮禮祖有功而宗有德使顧成之廟稱為太宗上配太祖與漢亡極建久安之勢成長治之業以承祖廟以奉六親至孝也以幸天下以育群生至仁也立綱陳紀輕重同得後可以為萬世法程雖有愚幼不肖之嗣猶得蒙業而安至明也以陛下之明達因使少知治體者得佐下風致此非難也其具可素陳于前願幸無忽臣謹稽之天地驗之往古按之當今之務日夜念此至孰也雖使禹舜復生為陛下計亡以易此夫樹國固必相疑之勢下數被其殃上數爽其憂甚非所以安上而全下也今或親弟謀為東帝親兄之子西鄉而擊今吳又見告矣天子春秋鼎盛行義未過德澤有加焉猶尚如是況莫大諸侯權力且十此者乎然而天下少安何也大國之王幼弱未壯漢之所置傅相方握其事數年之後諸侯之王大抵皆冠血氣方剛漢之傅相稱病而賜罷彼自丞尉以上徧置私人如此有異淮南濟北之為邪此時而欲為治安雖堯舜不治黃帝曰日中必蔧操刀必割今令此道順而全安甚易不肯早為已乃墮骨肉之屬而抗剄之豈有異秦之季世乎夫以天子之位乘今之時因天之助尚憚以危為安以亂為治假設陛下居齊桓之處將不合諸侯而匡天下乎臣又以知陛下有所必不能矣假設天下如曩時淮陰侯尚王楚黥布王淮南彭越王梁韓信王韓張敖王趙貫高為相盧綰王燕陳豨在代令此六七公者皆亡恙當是時而陛下即天子位能自安乎臣有以知陛下之不能也天下殽亂高皇帝與諸公併起非有仄室之勢以豫席之也諸公幸者乃為中涓其次廑得舍人材之不逮至遠也高皇帝以明聖威武即天子位割膏腴之地以王諸公多者百餘城少者乃三四十縣惪至渥也然其後十年之間反者九起陛下之與諸公非親角材而臣之也又非身封王之也自高皇帝不能以是一歲為安故臣知陛下之不能也然尚有可諉者曰疏臣請試言其親者假令悼惠王王齊元王王楚中子王趙幽王王淮陽共王王梁靈王王燕厲王王淮南六七貴人皆亡恙當是時陛下即位能為治乎臣又知陛下之不能也若此諸王雖名為臣實皆有布衣昆弟之心慮亡不帝制而天子自為者擅爵人赦死辠甚者或戴黃屋漢法令非行也雖行不軌如厲王者令之不肯聽召之安可致乎幸而來至法安可得加動一親戚天下圜視而起陛下之臣雖有悍如馮敬者適啟其口匕首已陷其匈矣陛下雖賢誰與領此故疏者必危親者必亂已然之效也其異姓負彊而動者漢已幸勝之矣又不易其所以然同姓襲是跡而動既有徵矣其勢盡又復然殃禍之變未知所移明帝處之尚不能以安後世將如之何屠牛坦一朝解十二牛而芒刃不頓者所排擊剝割皆眾理解也至於髖髀之所非斤則斧夫仁義恩厚人主之芒刃也權勢法制人主之斤斧也今諸侯王皆眾髖髀也釋斤斧之用而欲嬰以芒刃臣以為不缺則折胡不用之淮南濟北勢不可也臣竊跡前事大抵彊者先反淮陰王楚最彊則最先反韓信倚胡則又反貫高因趙資則又反陳豨兵精則又反彭越用梁則又反黥布用淮南則又反盧綰最弱最後反長沙乃在二萬五千戶耳功少而最完勢疏而最忠非獨性異人也亦形勢然也曩令樊酈絳灌據數十城而王今雖以殘亡可也令信越之倫列為徹侯而居雖至今存可也然則天下之大計可知已欲諸王之皆忠附則莫若令如長沙王欲臣子之勿菹醢則莫若令如樊酈等欲天下之治安莫若眾建諸侯而少其力力少則易使以義國小則亡邪心令海內之勢如身之使臂臂之使指莫不制從諸侯之君不敢有異心輻湊並進而歸命天子雖在細民且知其安故天下咸知陛下之明割地定制令齊趙楚各為若干國使悼惠王幽王元王之子孫畢以次各受祖之分地地盡而止及燕梁它國皆然其分地眾而子孫少者建以為國空而置之須其子孫生者舉使君之諸侯之地其削頗入漢者為徙其侯國及封其子孫也所以數償之一寸之地一人之眾天子亡所利焉誠以定治而已故天下咸知陛下之廉地制壹定宗室子孫莫慮不王下無倍叛之心上無誅伐之志故天下咸知陛下之仁法立而不犯令行而不逆貫高利幾之謀不生柴奇開章之計不萌細民鄉善大臣致順故天下咸知陛下之義臥赤子天下之上而安植遺腹朝委裘而天下不亂當時大治後世誦聖壹動而五業附陛下誰憚而久不為此天下之勢方病大瘇一脛之大幾如要一指之大幾如股平居不可屈信一二指搐身慮亡聊失今不治必為錮疾後雖有扁鵲不能為已病非徒瘇也又苦𨂂盭元王之子帝之從弟也今之王者從弟之子也惠王親兄子也今之王者兄子之子也親者或亡分地以安天下疏者或制大權以偪天子臣故曰非徒病瘇也又苦𨂂盭可痛哭者此病是也天下之勢方倒縣凡天子者天下之首何也上也蠻夷者天下之足何也下也今匈奴嫚娒侵掠至不敬也為天下患至亡已也而漢歲致金絮采繒以奉之夷狄徵令是主上之操也天子共貢是臣下之禮也足反居上首顧居下倒縣如此莫之能解猶為國有人乎非亶倒縣而已又類辟且病痱夫辟者一面病痱者一方痛今西邊北邊之郡雖有長爵不輕得復五尺以上不輕得息斥候望烽燧不得臥將吏被介冑而睡臣故曰一方病矣醫能治之而上不使可為流涕者此也陛下何忍以帝皇之號為戎人諸侯勢既卑辱而禍不息長此安窮進謀者率以為是固不可解也亡具甚矣臣竊料匈奴之眾不過漢一大縣以天下之大困於一縣之眾甚為執事者羞之陛下何不試以臣為屬國之官以主匈奴行臣之計請必係單于之頸而制其命伏中行說而笞其背舉匈奴之眾唯上之令今不獵猛敵而獵田彘不搏反寇而搏畜菟翫細娛而不圖大患非所以為安也德可遠施威可遠加而直數百里外威令不信可為流涕者此也今民賣僮者為之繡衣絲履偏諸緣內之閑中是古天子后服所以廟而不宴者也而庶人得以衣婢妾白縠之表薄紈之裏緁以偏諸美者黼繡是古天子之服今富人大賈嘉會召客者以被牆古者以奉一帝一后而節適今庶人屋壁得為帝服倡優下賤得為后飾然而天下不屈者殆未有也且帝之身自衣皁綈而富民牆屋被文繡天子之后以緣其領庶人㜸妾緣其履此臣所謂舛也夫百人作之不能衣一人欲天下亡寒胡可得也一人耕之十人聚而食之欲天下亡飢不可得也飢寒切于民之肌膚欲其亡為姦邪不可得也國已屈矣盜賊直須時耳然而獻計者曰毋動為大耳夫俗至大不敬也至亡等也至冒上也進計者猶曰毋為可為長太息者此也商君遺禮義棄仁恩并心於進取行之二歲秦俗日敗故秦人家富子壯則出分家貧子壯則出贅借父耰鉏慮有德色母取箕箒立而誶語抱哺其子與公併倨婦姑不相說則反脣而相稽其慈子耆利不同禽獸者亡幾耳然并心而赴時猶曰蹶六國兼天下功成求得矣終不知反廉愧之節仁義之厚信并兼之法遂進取之業天下大敗眾掩寡智欺愚勇威怯壯陵衰其亂至矣是以大賢起之威震海內德從天下曩之為秦者今轉而為漢矣然其遺風餘俗猶尚未改今世以侈靡相競而上亡制度棄禮誼捐廉恥日甚可謂月異而歲不同矣逐利不耳慮非顧行也今其甚者殺父兄矣盜者剟寢戶之簾搴兩廟之器白晝大都之中剽吏而奪之金矯偽者出幾十萬石粟賦六百餘萬錢乘傳而行郡國此其亡行義之先至者也而大臣特以簿書不報期會之間以為大故至于俗流失世壞敗因恬而不知怪慮不動於耳目以為是適然耳夫移風易俗使天下回心而鄉道類非俗吏之所能為也俗吏之所務在于刀筆筐篋而不知大禮陛下又不自憂竊為陛下惜之夫立君臣等上下使父子有禮六親有紀此非天之所為人之所設也夫人之所設不為不立不植則僵不修則壞筦子曰禮義廉恥是謂四維四維不張國乃滅亡使筦子愚人也則可筦子而少知治禮則是豈可不為寒心哉秦滅四維而不張故君臣乖亂六親殃戮姦人並起萬民離叛凡十三歲而社稷為虛今四維猶未備也故姦人幾幸而眾心疑惑豈如今定經制令君君臣臣上下有差父子有親各得其宜姦人亡所幾幸而群臣眾信上不疑惑此業壹定世世長安而後有所持循矣若夫經制不定是猶度江河亡維楫中流而遇風波船必覆矣可為長太息者此也夏為天子十有餘世而殷受之殷為天子二十餘世而周受之周為天子三十餘世而秦受之秦為天子二世而亡人性不甚相遠也何三代之君有道之長而秦無道之暴也其故可知也古之王者太子乃生固舉以禮使士負之有司齊肅端冕見之南郊見于天也過闕則下過廟則趨孝子之道也故自為赤子而教固已行矣昔者成王幼在繈抱之中召公為太保周公為太傅太公為太師保保其身體傅傅之德義師道之教訓三公之職也于是為置三少皆上大夫也曰少保少傅少師是與太子宴者也故乃孩提有識三公三少因明孝仁禮義以道習之逐去邪人不使見惡行于是皆選天下之端士孝悌博聞有道術者以衛翼之使與太子居處出入故太子乃生而見正事聞正言行正道左右前後皆正人也夫習與正人居之不能毋正猶生長於齊不能不齊言也與不正人居之不能毋不正猶生長于楚之地不能不楚言也故擇其所耆必先受業乃得嘗之擇其所樂必先有習乃得為之孔子曰少成若天性習貫如自然及太子少長知妃色則入于學學者所學之官也學禮曰帝入東學上親而貴仁則親疏有序而恩相及矣帝入南學上齒而貴信則長幼有差而民不誣矣帝入西學上賢而貴德則聖智在位而功不遺矣帝入北學上貴而尊爵則貴賤有等而下不隃矣帝入太學承師問道退習而考于太傅太傅罰其不則而匡其不及則德智長而治道得矣此五學者既成于上則百姓黎民化輯於下矣及太子既冠成人免於保傅之嚴則有記過之史徹膳之宰進善之旌誹謗之木敢諫之鼓瞽史誦詩工誦箴諫大夫進謀士傳民語習與智長故切而不媿化與心成故中道若性三代之禮春朝朝日秋暮夕月所以明有敬也春秋入學坐國老執醬而親餽之所以明有孝也行以鸞和步中采齊趣中肆夏所以明有度也其於禽獸見其生不食其死聞其聲不食其肉故遠庖廚所以長恩且明有仁也夫三代之所以長久者以其輔翼太子有此具也及秦而不然其俗固非貴辭讓也所上者告訐也固非貴禮義也所上者刑罰也使趙高傅胡亥而教之獄所習者非斬劓人則夷人之三族也故胡亥今日即位而明日射人忠諫者謂之誹謗深計者謂之妖言其視殺人若艾草菅然豈惟胡亥之性惡哉彼其所以道之者非其理故也鄙諺曰不習為吏視已成事又曰前車覆後車誡夫三代之所以長久者其已事可知也然而不能從者是不法聖智也秦世之所以亟絕者其轍跡可見也然而不避是後車又將覆也夫存亡之變治亂之機其要在是矣天下之命縣於太子太子之善在于早諭教與選左右夫心未濫而先諭教則化易成也開於道術智誼之指則教之力也若其服習積貫則左右而已夫胡粵之人生而同聲耆欲不異及其長而成俗累數譯而不能相通行者有雖死而不相為者則教習然也臣故曰選左右早諭教最急夫教得而左右正則太子正矣太子正而天下定矣書曰一人有慶兆民賴之此時務也凡人之智能見已然不能見將然夫禮者禁於將然之前而法者禁於已然之後是故法之所用易見而禮之所為生難知也若夫慶賞以勸善刑罰以懲惡先王執此之政堅如金石行此之令信如四時據此之公無私如天地耳豈顧不用哉然而曰禮云禮云者貴絕惡于未萌而起教于微眇使民日遷善遠辠而不自知也孔子曰聽訟吾猶人也必也使毋訟乎為人主計者莫如先審取舍取舍之極定于內而安危之萌應于外矣安者非一日而安也危者非一日而危也皆以積漸然不可不察也人主之所積在其取舍以禮義治之者積禮義以刑罰治之者積刑罰刑罰積而民怨背禮義積而民和親故世主欲民之善同而所以使民善者或異或道之以德教或敺之以法令道之以德教者德教洽而民氣樂敺之以法令者法令極而民風哀哀樂之感禍福之應也秦王之欲尊宗廟而安子孫與湯武同然而湯武廣大其德行六七百歲而弗失秦王治天下十餘歲則大敗此亡它故矣湯武之定取舍審而秦王之定取舍不審矣夫天下大器也今人之置器置諸安處則安置諸危處則危天下之情與器亡以異在天子之所置之湯武置天下於仁義禮樂而德澤洽禽獸草木廣裕德被蠻貊四夷累子孫數十世此天下所共聞也秦王置天下於法令刑罰德澤亡一有而怨毒盈于世下憎惡之如仇讎禍幾及身子孫誅絕此天下之所共見也是非其明效大驗邪人之言曰聽言之道必以其事觀之則言者莫敢妄言今或言禮誼之不如法令教化之不如刑罰人主胡不引殷周秦事以觀之也人主之尊譬如堂群臣如陛眾庶如地故陛九級上廉遠地則堂高陛亡級廉近地則堂卑高者難攀卑者易陵理勢然也故古者聖王制為等列內有公卿大夫士外有公侯伯子男然後有官師小吏延及庶人等級分明而天子加焉故其尊不可及也里諺曰欲投鼠而忌器此善諭也鼠近于器尚憚不投恐傷其器況于貴臣之近主乎廉恥節禮以治君子故有賜死而亡戮辱是以黥劓之辠不及大夫以其離主上不遠也禮不敢齒君之路馬蹴其芻者有罰見君之几杖則起遭君之乘車則下入正門則趨君之寵臣雖或有過刑戮之辠不加其身者尊君之故也此所以為主上豫遠不敬也所以體貌大臣而厲其節也今自王侯三公之貴皆天子之所改容而禮之也古天子之所謂伯父伯舅也而令與眾庶同黥劓髡刖笞傌棄市之法然則堂不亡陛虖被戮辱者不泰迫虖廉恥不行大臣無乃握重權大官而有徒隸亡恥之心虖夫望夷之事二世見當以重法者投鼠而不忌器之習也臣聞之履雖鮮不加於枕冠雖敝不以苴履夫嘗已在貴寵之位天子改容而體貌之矣吏民嘗俯伏以敬畏之矣今而有過帝令廢之可也退之可也賜之死可也滅之可也若夫束縛之係緤之輸之司寇編之徒官司寇小吏詈罵而榜笞之殆非所以令眾庶見也夫卑賤者習知尊貴者之一旦吾亦乃可以加此也非所以習天下也非尊尊貴貴之化也夫天子之所嘗敬眾庶之所嘗寵死而死耳賤人安宜得如此而頓辱之哉豫讓事中行之君智伯伐而滅之移事智伯及趙滅智伯豫讓釁面吞炭必報襄子五起而不中人問豫子豫子曰中行眾人畜我我故眾人事之智伯國士遇我我故國士報之故此一豫讓也反君事讎行若狗彘已而抗節致忠行出虖列士人主使然也故主上遇其大臣如遇犬馬彼將犬馬自為也如遇官徒彼將官徒自為也頑頓亡恥奊詬亡節廉恥不立且不自好苟若而可故見利則逝見便則奪主上有敗則因而挻之矣主上有患則吾苟免而已立而觀之耳有便吾身者則欺賣而利之耳人主將何便于此群下至眾而主上至少也所託財器職業者粹於群下也俱亡恥俱苟安則主上最病故古者禮不及庶人刑不至大夫所以厲寵臣之節也古者大臣有坐不廉而廢者不謂不廉曰簠簋不飾坐汙穢淫亂男女無別者不曰污穢曰帷薄不修坐罷軟不勝任者不謂罷軟曰下官不職故貴大臣定有其辠矣猶未斥然正以呼之也尚遷就而為之諱也故其在大譴大何之域者聞譴何則白冠氂纓盤水加劍造請室而請辠耳上不執縛係引而行也其有中罪者聞命而自弛上不使人頸盭而加也其有大辠者聞命則北面再拜跪而自裁上不使捽抑而刑之也曰子大夫自有過耳吾遇子有禮矣遇之有禮故群臣自憙嬰以廉恥故人矜節行上設廉恥禮義以遇其臣而臣不以節行報其上者則非人類也故化成俗定則為人臣者主耳忘身國耳忘家公耳忘私利不苟就害不苟去唯義所在上之化也故父兄之臣誠死宗廟法度之臣誠死社稷輔翼之臣誠死君上守圄扞敵之臣誠死城郭封疆故曰聖人有金城者比物此志也彼且為我死故吾得與之俱生彼且為我亡故吾得與之俱存夫將為我危故吾得與之皆安顧行而忘利守節而伏義故可以託不御之權可以寄六尺之孤此厲廉恥行禮誼之所致也主上何喪焉此之不為而顧彼之久行故曰可為長太息者此也見漢書賈誼傳
