body:
  text: 司馬相如美人賦司馬相如美麗閑都遊于梁王梁王說之鄒陽譖之于王曰相如美則美矣然服色容治妖麗不忠將欲媚辭取說遊王後宮王不察之乎王問相如曰子好色乎相如曰臣不好色也王曰子不好色何若孔墨乎相如曰古之避色孔墨之徒聞齊饋女而遐逝望朝歌而迴車譬猶防火水中避溺山隅此乃未見其可欲何以明不好色乎若臣者少長西土鰥處獨居室宇遼廓莫與為娛臣之東鄰有一女子雲髮豐豔蛾眉皓齒顏盛色茂景曜光起恆翹翹而西顧欲留臣而共止登垣而望臣三年于茲矣臣棄而不許竊慕大王之高義命駕東來途出鄭衛道由桑中朝發溱洧暮宿上宮上宮閒館寂寥虛門閤晝掩曖若神居臣排其戶而造其堂芳香芬烈黼帳高張有女獨處婉然在床奇葩逸麗淑質豔光覩臣遷延微笑而言曰上客何國之公子所從來無乃遠乎遂設旨酒進鳴琴臣遂撫絃為幽蘭白雪之曲女乃歌曰獨處室兮廓無依思佳人兮情傷悲有美人兮來何遲日既暮兮華色衰敢託身兮長自私玉釵挂臣冠羅袖拂臣衣時日西夕玄陰晦冥流風慘冽素雪飄零閑房寂謐不聞人聲于是寢具既設服玩珍奇金鉔薰香黼帳低垂裀褥重陳角枕橫施女乃弛其上服表其褻衣皓體呈露弱骨豐肌時來親臣柔滑如脂臣乃脈定于內心正于懷信誓旦旦秉志不回翻然高舉與彼長辭見古文苑蓺文類聚十八初學記十九長門賦孝武皇帝陳皇后時得幸頗妒別在長門宮愁悶悲思聞蜀郡成都司馬相如天下工為文奉黃金百斤為相如文君取酒因于解悲愁之辭而相如為文以悟主上陳皇后復得親幸其辭曰夫何一佳人兮步逍遙以自虞魂踰佚而不反兮形枯槁而獨居言我朝往而暮來兮飲食樂而忘人心慊移而不省故兮交得意而相親伊予志之慢愚兮懷貞愨之懽心願賜問而自進兮得尚君之玉音奉虛言而望誠兮期城南之離宮脩薄具而自設兮君曾不肯乎幸臨廓獨潛而專精兮天漂漂而疾風登蘭臺而遙望兮神怳怳而外淫浮雲鬱而四塞兮天窈窈而晝陰雷殷殷而響起兮聲象君之車音飄風迴而起閨兮舉帷幄之襜襜桂樹交而相紛兮芳酷烈之誾誾孔雀集而相存兮玄猨嘯而長吟翡翠脅翼而來萃兮鸞鳳翔而北南心憑噫而不舒兮邪氣壯而攻中下蘭臺而周覽兮步從容于深宮正殿塊以造天兮鬱竝起而穹崇閒徙倚于東廂兮觀夫靡靡而無窮擠玉戶以撼金鋪兮聲噌吰而似鍾音刻木蘭以為榱兮飾文杏以為梁羅丰茸之遊樹兮離樓梧而相橕施瑰木之欂櫨兮委參差以梁時仿佛以物類兮象積石之將將五色炫以相曜兮爛耀耀而成光緻錯石之瓴甓兮象瑇瑁之文章張羅綺之幔帷兮垂楚組之連綱撫柱楣以從容兮覽曲臺之央央白鶴噭以哀號兮孤雌跱于枯楊日黃昏而望絕兮悵獨託于空堂懸明月以自照兮徂清夜于洞房援雅琴以變調兮奏愁思之不可長案流徵以卻轉兮聲幼妙而復揚貫歷覽其中操兮意慷慨而自卬左右悲而垂淚兮涕流離而從橫舒息悒而增欷兮蹝履起而彷徨揄長袂以自翳兮數昔日之諐殃無面目之可顯兮遂頹思而就床摶芬若以為枕兮席荃蘭而茝香忽寢寐而夢想兮魄若君之在旁惕寤覺而無見兮魂迋迋若有亡眾雞鳴而愁予兮起視月之精光觀眾星之行列兮畢昴出于東方望中庭之藹藹兮若季秋之降霜夜曼曼其若歲兮懷鬱鬱其不可再更澹偃蹇而待曙兮荒亭亭而復明妾人竊自悲兮究年歲而不敢忘見文選蓺文類聚三十梨賦唰嗽其漿見文選魏都賦劉逵注魚葅賦見北堂書鈔一百四十六上書諫獵臣聞物有同類而殊能者故力稱烏獲捷言慶忌勇期賁育臣之愚竊以為人誠有之獸亦宜然今陛下好淩岨險射猛獸卒然遇軼才之獸駭不存之地犯屬車之清塵輿不及還轅人不暇施巧雖有烏獲逢蒙之伎力不得用枯木朽株盡為難矣是胡越起于轂下而羌夷接軫也豈不殆哉雖萬全無患然本非天子之所宜近也且夫清道而後行中路而後馳猶時有銜橛之變而況涉乎蓬蒿騁乎丘墳前有利獸之樂而內无存變之意其為害也不亦難矣夫輕萬乘之重不以為安而樂出于萬有一危之塗以為娛臣竊為陛下不取也蓋明者遠見于未萌而智者避危于无形禍固多藏于隱微而發于人之所忽者也故鄙諺曰家累千金坐不垂堂此言雖小可以喻大臣願陛下之留意幸察見史記本傳漢書本傳文選蓺文類聚二十四喻巴蜀檄告巴蜀太守蠻夷自擅不討之日久矣時侵犯邊境勞士大夫陛下即位存撫天下安集中國然後興師出兵北征匈奴單于怖駭交臂受事屈膝請和康居西域重譯納貢稽首來享移師東指閩越相誅右弔番禺太子入朝南夷之君西僰之長常效貢職不敢墯怠延頸舉踵喁喁然皆鄉風慕義欲為臣妾道里遼遠山川阻深不能自致夫不順者已誅而為善者未賞故遣中郎將往賓之發巴蜀之士各五百人以奉幣衛使者不然靡有兵革之事戰鬭之患今聞其乃發軍興制驚懼子弟憂患長老郡又擅為轉粟運輸皆非陛下之意也當行者或亡逃自賊殺亦非人臣之節也夫邊郡之士聞熢舉燧燔皆攝弓而馳荷兵而走流汗相屬惟恐居後觸白刃冒流矢議不反顧計不旋踵人懷怒心如報私讎彼豈樂死惡生非編列之民而與巴蜀異主哉計深慮遠急國家之難而樂盡人臣之道也故有剖符之封析珪而爵位為通侯居列東第終則遺顯號於後世傳土地于子孫行事甚忠敬居位甚安佚名聲施于無窮功烈著而不滅是以賢人君子肝腦塗中原膏液潤野屮而不辭也今奉幣使至南夷即自賊殺或亡逃抵誅身死無名諡為至愚恥及父母為天下笑人之度量相越豈不遠哉然此非獨行者之罪也父兄之教不先子弟之率不謹寡廉鮮恥而俗不長厚也其被刑戮不亦宜乎陛下患使者有司之若彼悼不肖愚民之如此故遣信使曉諭百姓以發卒之事因數之以不忠死亡之罪讓三老孝弟以不教誨之過方今田時重煩百姓已親見近縣恐遠所谿谷山澤之民不徧聞檄到亟下縣道使咸喻陛下意無忽見漢書司馬相如傳文選蓺文類聚五十八報卓文君書五味雖甘寍先稻黍五色有燦而不掩韋布惟此綠衣將執子之釜錦水有鴛漢宮有木誦子喜吟而回予故步當不令負丹青感白頭也見荅盛擥問作賦合綦組以成文列錦繡而為質一經一緯一宮一商此作賦之迹也賦家之心苞括宇宙總覽人物斯乃得之于內不可得其傳也見御覽五百八十七引西京雜記難蜀父老漢興七十有八載德茂存乎六世威武紛云湛恩汪濊群生霑濡洋溢乎方外于是乃命使西征隨流而攘風之所被罔不披靡因朝冉從駹定莋存邛略斯榆舉苞蒲結軌還轘東鄉將報至于蜀都耆老大夫縉紳先生之徒二十有七人儼然造焉辭畢進曰蓋聞天子之于夷狄也其義羈縻勿絕而已今罷三郡之士通夜郎之塗三年于茲而功不竟士卒勞倦萬民不贍今又接之以西夷百姓力屈恐不能卒業此亦使者之累也竊為左右患之且夫邛莋西僰之與中國竝也歷年茲多不可記已仁者不以德來強者不以力并意者殆不可乎今割齊民以附夷狄獘所恃以事無用鄙人固陋不識所謂使者曰烏謂此乎必若所云則是蜀不變服而巴不化俗也僕尚惡聞若說然斯事體大固非觀者之所覯也余之行急其詳不可得聞已請為大夫粗陳其略蓋世必有非常之人然后有非常之事有非常之事然后有非常之功非常者固常人之所異也故曰非常之元黎民懼焉及臻厥成天下晏如也昔者洪水沸出氾濫衍溢民人升降移徙崎嶇而不安夏后氏戚之乃堙洪原決江疏河灑沈澹災東歸之于海而天下永寧當斯之勤豈惟民哉心煩于慮而身親其勞躬傶骿胝無胈膚不生毛故休烈顯乎無窮聲稱浹乎于茲且夫賢君之踐位也豈特委瑣握𪘏拘文牽俗循誦習傳當世取說云爾哉必將崇論谹議創業垂統為萬世規故馳騖乎兼容并包而勤思乎參天貳地且詩不云乎普天之下莫非王土率土之濱莫非王臣是以六合之內八方之外浸淫衍溢懷生之物有不浸潤于澤者賢君恥之今封疆之內冠帶之倫咸獲嘉祉靡有闕遺矣而夷狄殊俗之國遼紀異黨之域舟車不通人迹罕至政教未加流風猶微內之則犯義侵禮于邊境外之則邪行橫作放殺其上君臣易立尊卑失序父兄不辜幼孤為奴虜係絫號泣內鄉而怨曰蓋聞中國有至仁焉德洋恩普物靡不得其所今獨曷為遺己舉踵思慕若枯旱之望雨盭夫為之垂涕況乎上聖又烏能已故北出師以討強胡南馳使以誚勁越四面風德二方之君鱗集仰流願得受號者以億計故乃關沬若徼牂牁鏤靈山梁孫原創道德之塗垂仁義之統將博恩廣施遠撫長駕使疏逖不閉曶爽闇昧得耀乎光明以偃甲兵于此而息討伐於彼遐邇一體中外禔福不亦康乎夫拯民於沈溺奉至尊之休德反衰世之陵夷繼周氏之絕業天子之急務也百姓雖勞又烏可以已哉且夫王者固未有不始于憂勤而終于佚樂者也然則受命之符合在于此方將增太山之封加梁父之事鳴和鸞揚樂頌上咸五下登三觀者未覩指聽者未聞音猶焦朋已翔乎寥廓而羅者猶視乎藪澤悲夫于是諸大夫茫然喪其所懷來失厥所以進喟然並稱曰允哉漢德此鄙人之所願聞也百姓雖勞請以身先之敞罔靡徙遷延而辭避見漢書本傳文選蓺文類聚二十五封禪文伊上古之初肇自顥穹生民歷選列辟以迄乎秦率邇者踵武聽逖者風聲紛輪威蕤堙滅而不稱者不可勝數也繼昭夏崇號諡略可道者七十有二君罔若淑而不昌疇逆失而能存軒轅之前遐哉邈乎其詳不可得聞已五三六經載籍之傳維見可觀也書曰元首明哉股肱良哉因斯以談君莫盛于堯臣莫賢于后稷后稷創業于唐公劉發迹於西戎文王改制爰周郅隆大行越成而后陵夷衰微千載亡聲豈不善始善終哉然無異端慎所由于前謹遺教于後耳故軌迹夷易易遵也湛恩厖洪易豐也憲度著明易則也垂統理順易繼也是以業隆于繈保而崇冠乎二后揆厥所元終都攸卒未有殊尤絕迹可考今者也然猶躡梁甫登大山建顯號施尊名大漢之德逢涌原泉沕潏曼羨旁魄四塞雲布霧散上暢九垓下泝八埏懷生之類沾濡浸潤協氣橫流武節焱逝爾陿游原迥闊泳末首惡鬱沒闇昧昭晰昆蟲闓懌回首面內然后囿騶虞之珍群徼麋鹿之怪獸導一莖六穗於庖犧雙觡共抵之獸獲周餘放龜于岐招翠黃乘龍於沼鬼神接靈圉賓於閒館奇物譎詭俶儻窮變欽哉符瑞臻茲猶以為德薄不敢道封禪蓋周躍魚隕杭休之以燎微夫斯之為符也以登介丘不亦恧乎進攘之道何其爽與於是大司馬進曰陛下仁育群生義征不譓諸夏樂貢百蠻執贄德牟往初功無與二休烈液洽符瑞眾變期應紹至不特創見意者太山梁父設壇場望幸蓋號以況榮上帝垂恩儲祉將以慶成陛下嗛讓而弗發也挈三神之歡缺王道之儀群臣焉或謂且天為質闇示珍符固不可辭若然辭之是泰山靡記而梁父罔幾也亦各竝時而榮咸濟厥世而屈說者尚何稱于後而云七十二君哉夫修德以錫符奉符以行事不為進越也故聖王弗替而修禮地祇謁款天神勒功中岳以章至尊舒盛德發號榮受厚福以浸黎民皇皇哉斯事天下之壯觀王者之卒業不可貶也願陛下全之而后因雜縉紳先生之略術使獲曜日月之末光絕炎以展采錯事猶兼正列其義祓飾厥文作春秋一藝將襲舊六為七攄之無窮俾萬世得激清流揚微波蜚英聲騰茂實前聖之所以永保鴻名而常為稱首者用此宜命掌故悉奏其儀而覽焉于是天子沛然改容曰俞乎朕其試哉乃遷思回慮總公卿之議詢封禪之事詩大澤之博廣符瑞之富遂作頌曰自我天覆雲之油油甘露時雨厥壤可游滋液滲漉何生不育嘉穀六穗我穡曷蓄匪唯雨之又潤澤之匪唯徧我氾布護之萬物熙熙懷而慕之名山顯位望君之來君兮君兮侯不邁哉𣪂𣪂之獸樂我君圃白質黑章其儀可喜旼旼穆穆君子之態蓋聞其聲今視其來厥塗靡從天瑞之徵茲爾於舜虞氏以興濯濯之麟游彼靈畤孟冬十月君徂郊祀馳我君輿帝用享祉三代之前蓋未嘗有宛宛黃龍興德而升采色玄耀炳炳煥煇煌正陽顯見覺寤黎烝于傳載之云受命所乘厥之有章不必諄諄依類託寓諭以封巒披藝觀之天人之際已交上下相發允答聖王之事兢兢翼翼故曰于興必慮衰安必思危是以湯武至尊嚴不失肅祗舜在假典顧省厥遺此之謂也見漢書司馬相如傳文選蓺文類聚十題市門不乘赤車駟馬不過汝下也見華陽國志凡將篇淮南宋蔡舞嗙喻見說文二上鐘磬竽笙筑坎侯見蓺文類聚四十四黃潤纖美宜製襌見文選蜀都賦舊注烏喙桔梗芫華款冬貝母木櫱萎苓草芍藥桂漏盧蜚廉𦼉菌荈詑白斂白芷菖蒲芒消莞椒茱萸見陸羽茶經下案此轉寫脫四字白芷之白後人妄補漢蓺文志言凡將篇無復字菛菁當門見北戶錄注案此非完句署門一生一死乃知交情一貧一富乃知交態一貴一賤交情乃見見史記汲黯鄭當時傳贊始翟公為廷尉賓客填門及廢門外可設雀羅翟公復為廷尉賓客欲往翟公乃大署其門為書謝罪湯無尺寸之功起刀筆吏陛下幸致位三公無以塞責然謀陷湯者三長史也見漢書張湯傳與楊王孫書王孫苦疾僕迫從上祠雍未得詣前願存精神省思慮進醫藥厚自持竊聞王孫先令臝葬令死者亡知則已若其有知是戮尸地下將臝見先人竊為王孫不取也且孝經曰為之棺槨衣衾是亦聖人之遺制何必區區獨守所聞願王孫察焉見漢書楊王孫傳病且終令其子吾欲臝葬以反吾真必亡易吾意死則為布囊盛尸入地七尺既下從足引脫其囊以身親土見漢書楊王孫傳報祁侯繒它書蓋聞古之聖王緣人情不忍其親故為制禮今則越之吾是以臝葬將以矯世也夫厚葬誠亡益于死者而俗人競以相高靡財單幣腐之地下或乃今日入而明日發此真與暴骸于中野何異且夫死者終生之化而物之歸者也歸者得至化者得變是物各反其真也反真冥冥亡形亡聲乃合道情夫飾外以華眾厚葬以鬲真使歸者不得至化者不得變是使物各失其所也且吾聞之精神者天之有也形骸者地之有也精神離形各歸其真故謂之鬼鬼之為言歸也其尸塊然獨處豈有知哉裹以幣帛鬲以棺槨支體絡束口含玉石欲化不得鬱為枯腊千載之後棺槨朽腐乃得歸土就其真宅繇是言之焉用久客昔帝堯之葬也窾木為匵葛藟為緘其穿下不亂泉上不泄殠故聖王生易尚死易葬也不加功于亡用不損財于亡謂今費財厚葬留歸鬲至死者不知生者不得是謂重惑於戲吾不為也見漢書楊王孫傳又見荀悅漢紀劉向說苑皆小異
