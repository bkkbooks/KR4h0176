body:
  text: 董仲舒說武帝使關中民種麥春秋它穀不書至于麥禾不成則書之以此見聖人於五穀最重麥與禾也今關中俗不好種麥是歲失春秋之所重而損生民之具也願陛下幸詔大司農使關中民益種宿麥令毋後時見漢書食貨志又言限民名田古者稅民不過什一其求易共使民不過三日其力易足民財內足以養老盡孝外足以事上共稅下足以畜妻子極愛故民說從上至秦則不然用商鞅之法改帝王之制除井田民得賣買富者田連阡伯貧者亡立錐之地又顓川澤之利管山林之饒荒淫越制踰侈以相高邑有人君之尊里有公侯之富小民安得不困又加月為更卒已復為正一歲屯戍一歲力役三十倍于古田租口賦鹽鐵之利二十倍于古或耕豪民之田見稅什五故貧民常衣牛馬之衣而食犬彘之食重以貪暴之吏刑戮妄加民愁亡聊亡逃山林轉為盜賊赭衣半道斷獄歲以千萬數漢興循而未改古井田法雖難卒行宜少近古限民名田以澹不足塞并兼之路鹽鐵皆歸于民去奴婢除專殺之威薄賦斂省繇役以寬民力然後可善治也見漢書食貨志廟殿火災對春秋之道舉往以明來是故天下有物視春秋所舉與同比者精微眇以存其意通倫類以貫其理天地之變國家之事粲然皆見亡所疑矣按春秋魯定公哀公時季氏之惡已孰而孔子之聖方盛夫以盛聖而易孰惡季孫雖重魯君雖輕其勢可成也故定公二年五月兩觀災兩觀僭禮之物天災之者若曰僭禮之臣可以去已見辠徵而後告可去此天意也定公不知省至哀公三年五月桓宮釐宮災二者同事所為一也若曰燔貴而去不義云爾哀公未能見故四年六月亳社災兩觀桓釐廟亳社四者皆不當立天皆燔其不當立者以示魯欲其去亂臣而用聖人也季氏亡道久矣前是天不見災者魯未有賢聖臣雖欲去季孫其力不能昭公是也至定哀乃見之其時可也不時不見天之道也今高廟不當居遼東高園殿不當居陵旁於禮亦不當立與魯所災同其不當立久矣至於陛下時天乃災之者殆亦其時可也昔秦受亡周之敝而亡以化之漢受亡秦之敝又亡以化之夫繼二敝之後承其下流兼受其猥難治甚矣又多兄弟親戚骨肉之連驕揚奢侈恣睢者眾所謂重難之時者也陛下正當大敝之後又遭重難之時甚可憂也故天災若語陛下當今之世雖敝而重難非以太平至公不能治也視親戚貴屬在諸侯遠正最甚者忍而誅之如吾燔遼東高廟乃可視近臣在國中處旁仄及貴而不正者忍而誅之如吾燔高園殿乃可云爾在外而不正者雖貴如高廟猶災燔之況諸侯乎在內不正者雖貴如高園殿猶燔災之況大臣乎此天意也辠在外者天災外辠在內者天災內燔甚辠當重燔簡辠當輕承天意之道也見漢書五行志上雨雹對元光元年七月京師雨雹鮑敞問董仲舒曰雹何物也何氣而生之仲舒曰陰氣脅陽氣天地之氣陰陽相半和氣周迴朝夕不息陽德用事則和氣皆陽建已之月是也故謂之正陽之月陰德用事則和氣皆陰建亥之月是也故謂之正陰之月十月陰雖用事而陰不孤立此月純陰疑于無陽故謂之陽月詩人所謂日月陽止者也四月陽雖用事而陽不獨存此月純陽疑于無陰故亦謂之陰月自十月以後陽氣始生于地下漸冉流散故言息也陰氣轉收故言消也日夜滋生遂至四月純陽用事自四月以後陰氣始生于天上漸冉流散故云息也陽氣轉收故言消也日夜滋生遂至十月純陰用事二月八月陰陽正等無多少也以此推移無有差慝運動抑揚更相動薄則熏蒿歊蒸而風雨雲霧雷電雪雹生焉氣上薄為雨下薄為霧風其噫也雲其氣也雷其相擊之聲也電其相擊之光也二氣之初蒸也若有若無若實若虛若方若圓攢聚相合其體稍重故雨乘虛而墜風多則合速故雨大而疏風少則合遲故雨細而密其寒月則雨凝于上體尚輕微而因風相襲故成雪焉寒有高下上暖下寒則上合為大雨下凝為冰霰雪是也雹霰之至也陰氣暴上雨則凝結成雹焉太平之世則風不鳴條開甲散萌而已雨不破塊潤葉津莖而已雷不驚人號令啟發而已電不眩目宣示光耀而已霧不塞望浸淫被洎而已雪不封條凌殄毒害而已雲則五色而為慶三色而成矞露則結味而成甘結潤而成膏此聖人之在上則陰陽和風雨時也政多紕繆則陰陽不調風發屋雨溢河雪至牛目雹殺驢馬此皆陰陽相蕩而為祲沴之妖也敞曰四月無陰十月無陽何以明陰不孤立陽不獨存邪仲舒曰陰陽雖異而所資一氣也陽用事此則氣為陽陰用事此則氣為陰陰陽之時雖異而二體常存猶如一鼎之水而未加火純陰也加火極熱純陽也純陽則無陰息火水寒則更陰矣純陰則無陽加火水熱則更陽矣然則建已之月為純陽不容都無復陰也但是陽家用事陽氣之極耳薺麥枯由陰殺也建亥之月為純陰不容都無復陽也但是陰家用事陰氣之極耳薺麥始生由陽升也其著者葶藶死于盛夏款冬華于嚴寒水極陰有溫泉火至陽而有涼焰故知陰不得無陽陽不容都無陰也敞曰冬雨必暖夏雨必涼何也曰冬氣多寒陽氣自上躋故人得其暖而上蒸成雪矣夏氣多暖陰氣自下昇故人得其涼而上蒸成雨矣敞曰雨既陰陽蒸四月純陽十月純陰斯則無二氣相薄則不雨乎曰然純陽純陰雖在四月十月但月中之一日耳敞曰月中何日曰純陽用事未夏至一日純陰用事未冬至一日朔旦夏至冬至其正氣也敞曰然則未至一日其不雨乎曰然頗有之則妖也和氣之中自生災沴能使陰陽改節暖涼失度敞曰災沴之氣其常存邪曰無也時生耳猶乎人四支五臟中也有時及其病也四支五臟皆病也敞遷延負牆俛揖而退見古文苑粵有三仁對江都王問仲舒曰粵王句踐與大夫泄庸種蠡謀伐吳遂滅之孔子稱殷有三仁寡人亦以為粵有三仁桓公決疑于管仲寡人決疑于君仲舒對曰臣愚不足以奉大對聞昔者魯君問柳下惠我欲伐齊何如柳下惠曰不可歸而有憂色曰吾聞伐國不問仁人此言何為至于我哉徒見問爾猶且羞之況設詐以伐吳虖由此言之粵本無一仁夫仁人者正其誼不謀其利明其道不計其功是以仲尼之門五尺之童羞稱五伯為其先詐力而後仁誼也苟為詐而已故不足稱於大君子之門也五伯比于他諸侯為賢其比三王猶武夫之與美玉也見漢書董仲舒傳案此對見春秋䋣露卷九奏江都王求雨求雨之方損陽益陰願大王無收廣陵女子為人祝者一月租賜諸巫者諸巫母大小皆相聚于郭門為小壇以脯酒祭女獨擇寬大便處移市市使無內丈夫丈夫無得相從飲食令吏妻各往視其夫皆到即起雨注而已見續漢書禮儀志中注補引仲舒奏江都王請雨書秋以桐魚九枚見御覽九百五十六詣丞相公孫弘記室書江都相董仲舒叩頭死罪再拜上言君侯以周召自然休質擢升三公統理海內總緝百僚未有半言之教郡國翕然望風更思改新以助致治群眾所占必有成功仲舒叩頭死罪仲舒愚戇素無治名大漢之檢式數蒙君侯哀憐之恩誤被非任無以稱職仲舒竊見宰職任天下之重群心所歸惟須賢佐以成聖化願君侯大開蕭相國求賢之路廣選舉之門既得其人接以周公下士之意即奇偉隱世異倫之人各思竭愚歸往聖德英俊滿朝百能備具即君侯大立則道德弘通化流四極仲舒愚陋經術淺薄所識褊陋不能贊揚萬分君侯所棄捐竊聞春秋曰賢聖博觀以章其名擇善者從之無所不聽又曰近而不言為諂遠而不言為怨故輒披心陳誠仲舒叩頭死罪死罪夫堯舜三王之業皆繇仁義為本仁者所以理人倫也故聖王以為治首或曰發號出令利天下之民者謂之仁政疾天下之害于人者謂之仁心二者備矣然後海內應以誠惟君侯深觀往古思本仁義至誠而已方今關東五穀咸貴家有飢餓其死傷者半盜賊竝起發亡不止良民被害為聖主憂咎皆由仲舒等典職防禁無素當先坐仲舒叩頭死罪死罪仲舒至愚以為扶衰止姦本在吏耳宜一攷察天下領民之吏留心署置以明消滅邪枉之迹使百姓各安其產業無有寇盜之患以蠲主憂仲舒叩頭死罪謹奉春秋署置術再拜君侯足下見古文苑論禦匈奴義動君子利動貪人如匈奴者非可以仁義說也獨可說以厚利結之於天耳故與之厚利以沒其意與盟于天以堅其約質其愛子以累其心匈奴雖欲展轉奈失重利何奈欺上天何奈殺愛子何夫賦斂行賂不足當三軍之費城郭之固無以異於貞士之約而使邊城守境之民父兄緩帶稚子咽哺胡馬不窺于長城而羽檄不行于中國不亦便于天下乎見漢書匈奴傳贊山川頌山則巃嵷𡾋崔嵬㠑巍久不崩阤似夫仁人志士孔子曰山川神祇立寶藏殖器用資曲直合大者可以為宮室臺榭小者可以為舟輿浮灄大者無不中小者無不入持斧則斫折鐮則艾生人立禽獸伏死人入多功而不言是以君子取辟也且積土成山無損也成其高無害也成其大無虧也小其上泰其下久長安後世無有去就儼然獨處唯山之意詩云節彼南山惟石巖巖赫赫師尹民具爾瞻此之謂也水則源泉混混沄沄晝夜不竭既似力者盈科後行既似持平者循微赴下不遺小閒既似察者循谿谷不迷或奏萬里而必至既似知者鄣防山而能清淨既似知命者不清而入潔清而出既似善化者赴千仞之壑入而不疑既似勇者物皆困于火而水獨勝之既似武者咸得之而生失之而死似有德者孔子在川上曰逝者如斯夫不舍晝夜此之謂也見古文苑案此頌見春秋䋣露十六救日食祝炤炤大明瀸滅無光柰何以陰侵陽以卑侵尊見周禮宗伯太祝注請雨祝昊天生五穀以養人今五穀病旱恐不成實敬進清酒膊脯再拜請雨雨幸大樹見春秋䋣露十六又見續漢禮儀志中注補止雨祝天生五榖以養人今淫雨太多五榖不和敬進肥牲清酒以請社靈幸為止雨除民所苦無使陰滅陽陰滅陽不順于天天之常意在于利人人願止雨敢告于社見春秋䋣露十六李少君家錄少君有不死之方而家貧無以市其藥物故出于漢以假塗求其財道成而去見抱朴子內篇論仙引董仲舒所撰李少君家錄上言勿塞決河江河之決皆天事未易以人力為彊塞塞之未必應天見史記何渠書漢書溝洫志上言引渭穿渠異時關東漕粟從渭中上度六月而罷而渭水道九百餘里時有難處引渭穿渠起長安並南山下至河三百餘里徑易漕度可令三月罷而渠下民田萬餘頃又可得以溉田此損漕省卒而益肥關中之地得穀見史記河渠書漢書溝洫志匈奴和親議漢與匈奴和親率不過數歲即復倍約不如勿許興兵擊之見史記韓安國傳建元六年匈奴來請和親天子下其議大行王恢議元光五年舉賢良對策臣聞上古堯舜之時不貴爵賞而民勸善不重刑罰而民不犯躬率以正而遇民信也末世貴爵厚賞而民不勸深刑重罰而姦不止其上不正遇民不信也夫厚賞重刑未足以勸善而禁非必信而已矣是故因能任官則分職治去無用之言則事情得不作無用之器即賦斂省不奪民時不妨民力則百姓富有德者進無德者退則朝廷尊有功者上無功者下則群臣逡罰當罪則姦邪止賞當賢則臣下勸凡此八者治民之本也故民者業之即不爭理得則不怨有禮則不暴愛之則親上此有天下之急者也故法不遠義則民服而不離和不遠禮則民親而不暴故法之所罰義之所去也和之所賞禮之所取也禮義者民之所服也而賞罰順之則民不犯禁矣故畫衣冠異章服而民不犯者此道素行也臣聞之氣同則從聲比則應今人主和德于上百姓和合于下故心和則氣和氣和則形和形和則聲和聲和則天地之和應矣故陰陽和風雨時甘露降五穀登六畜蕃嘉禾興朱草生山不童澤不涸此和之至也故形和則無疾無疾則不夭故父不喪子兄不哭弟德配天地明竝日月則麟鳳至龜龍在郊河出圖洛出書遠方之君莫不說義奉幣而來朝此和之極也臣聞之仁者愛也義者宜也禮者所履也智者術之原也致利除害兼愛無私謂之仁明是非立可否謂之義進退有度尊卑有分謂之禮擅殺生之柄通壅塞之塗權輕重之數論得失之道使遠近情偽必見于上謂之術凡此四者治之本道之用也皆當設施不可廢也得其要則天下安樂法設而不用不得其術則主蔽於上官亂于下此事之情屬統垂業之本也臣聞堯遭鴻水使禹治之未聞禹之有水也若湯之旱則桀之餘烈也桀紂行惡受天之罰禹湯積德以王天下因此觀之天德無私親順之和起逆之害生此天文地理人事之紀臣弘愚戇不足以奉大對見漢書公孫弘傳上疏言治道陛下有先聖之位而無先聖之名有先聖之名而無先聖之吏是以勢同而治異先世之吏正故其民篤今世之吏邪故其民薄政獘而不行令倦而不聽夫使邪吏行獘政用倦令治薄民民不可得而化此治之所以異也臣聞周公旦治天下朞年而變三年而化五年而定唯陛下之所志見漢書公孫弘傳對冊書問治道愚臣淺薄安敢比材于周公雖然愚心曉然見治道之可以然也夫虎豹馬牛禽獸之不可制者也及其教馴服習之至可牽持駕服唯人之從臣聞揉曲木者不累日銷金石者不累月夫人之于利害好惡豈比禽獸木石之類哉朞年而變臣弘尚竊遲之見漢書公孫弘傳上書乞骸骨臣聞天下通道五所以行之者三君臣父子夫婦長幼朋友之交五者天下之通道也仁知勇三者所以行之也故曰好問近乎知力行近乎仁知恥近乎勇知此三者知所以自治知所以自治然後知所以治人未有不能自治而能治人者也陛下躬孝弟監三王建周道兼文武招倈四方之士任賢序位量能授官將以厲百姓勸賢材也今臣愚駑無汗馬之勞陛下過意擢臣弘卒伍之中封為列侯致位三公臣弘行能不足以稱加有負薪之疾恐先狗馬填溝壑終無以報德塞責願歸侯乞骸骨避賢者路見史記公孫弘傳漢書公孫弘傳上言徙汲黯為右內史右內史界部中多貴人宗室難治非素重臣不能任請徙黯為右內史奏禁民挾弓弩民不得挾弓弩十賊彍弩百吏不敢前盜賊不輒伏辜免脫者眾害寡而利多此盜賊所以蕃也禁民不得挾弓弩則盜賊執短兵短兵接則眾者勝以眾吏捕寡賊其勢必得盜賊有害無利則莫犯法刑錯之道也臣愚以為禁民毋得挾弓弩便見漢書吾丘壽王傳郭解罪議解布衣為任俠行權以睚肶殺人解不知此辠甚于解知殺之當大逆無道見漢書郭解傳請為博士置弟子員議丞相御史言制曰蓋聞導民以禮風之以樂婚姻者居室之大倫也今禮廢樂崩朕甚愍焉故詳延天下方正博聞之士咸登諸朝其令禮官勸學講議洽聞舉遺興禮以為天下先太常議與博士弟子崇鄉里之化以廣賢材焉謹與太常臧博士平等議曰聞三代之道鄉里有教夏曰校殷曰庠周曰序其勸善也顯之朝廷其懲惡也加之刑罰故教化之行也建首善自京師始由內及外今陛下昭至德開大明配天地本人倫勸學脩禮崇化厲賢以風四方太平之原也古者政教未洽不備其禮請因舊官而興焉為博士官置弟子五十人復其身太常擇民年十八已上儀狀端正者補博士弟子郡國縣道邑有好文學敬長上肅政教順鄉里出入不悖所聞者令相長丞上屬所二千石二千石謹察可者當與計偕詣太常得受業如弟子一歲皆輒試能通一蓺以上補文學掌故缺其高弟可以為郎中者太常籍奏即有秀才異等輒以名聞其不事學若下材及不能通一蓺輒罷之而請諸不稱者罰臣謹案詔書律令下者明天人分際通古今之義文章爾雅訓辭深厚恩施甚美小吏淺聞不能究宣無以明布諭下治禮次治掌故以文學禮義為官遷留滯請選擇其秩比二百石以上及吏百石通一蓺以上補左右內史大行卒史比百石以下補郡太守卒史皆各二人邊郡一人先用誦多者若不足乃擇掌故補中二千石屬文學掌故補郡屬備員請著功令佗如律令見史記儒林傳序荅東方朔書譬猶龍之未升與魚鱉為伍及其升天鱗不可覩見蓺文類聚九十六上書乞骸骨臣幸得待罪丞相疲駑無以輔治城郭倉廩空虛民多流亡罪當伏斧質上不忍致法願歸丞相侯印乞骸骨歸避賢者路見漢書萬石君傳
