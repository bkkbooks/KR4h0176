body:
  text: 東方朔七諫平生于國兮長于原笡言語訥譅兮又無彊輔淺智褊能兮聞見又寡數言便事兮見怨門下王不察其長利兮卒見棄乎原笡伏念思過兮無可改者群眾成朋兮上浸以惑巧佞在前兮賢者滅息堯舜聖已沒兮孰為忠直高山崔巍兮水流湯湯死日將至兮與麋鹿同坑塊兮鞠當道宿舉世皆然兮余將誰告斥逐鴻鵠兮近習鴟梟斬伐橘柚兮列樹苦桃便娟之脩竹兮寄生乎江潭上葳蕤而防露兮下泠泠而來風孰知其不合兮若竹柏之異心往者不可及兮來者不可待悠悠蒼天兮莫我振理竊怨君之不寤兮吾獨死而後已初放惟往古之得失兮覽私微之所傷堯舜聖而慈仁兮後世稱而弗忘齊桓失于專任兮夷吾忠而名彰晉獻惑于孋姬兮申生孝而被殃偃王行其仁義兮荊文寤而徐亡紂暴虐失位兮周得佐乎呂望脩往古以行恩兮封比干之丘壟賢俊慕而自附兮日浸淫而合同明法令而脩理兮蘭芷幽而有芳若眾人之妒予兮箕子寤而佯狂不顧地以貪名兮心怫鬱而內傷聯蕙芷以佩兮過鮑肆而失香正臣端其操行兮反離謗而見攘世俗更而變化兮伯夷餓于首陽獨廉潔而不容兮叔齊久而逾明浮雲陳而蔽晦兮日月乎無光忠臣貞而欲諫兮讒諛毀而在旁秋草榮其將實兮微霜下而夜降商風肅而害生兮百草育而不長眾竝諧以妒賢兮孤聖特而易傷懷計謀而不見用兮巖穴處而隱藏成功隳而不卒兮子胥死而不葬世從俗而變化兮隨風靡而成行信直退而毀敗兮虛偽進而得當追悔過之無及兮豈盡忠而有功廢制度而不用兮務行私而去公終不變而死節兮惜年齒之未央將方舟而下流兮冀幸君之發矇痛忠言之逆耳兮恨申子之沈江願悉心之所聞兮遭值君之不聰不開寤而難道兮不別橫之與縱聽奸臣之浮說兮絕國家之久長滅規矩而不用兮背繩墨之正方離憂患而乃寤兮若縱火于秋蓬業失之而不救兮尚何論乎禍凶彼離畔而朋黨兮獨行之士其何望日漸染而不自知兮秋毫微哉而變容眾輕積而折軸兮原咎雜而累重赴湘沅之流澌兮恐逐波而復東懷沙礫而自沈兮不忍見君之蔽壅沈江世沈淖而難論兮俗岑峨而嵾嵯清泠泠而殲滅分溷湛湛而日多梟鴞既以成群兮玄鶴弭翼而屏移蓬艾親入御于床弟兮馬蘭踸踔而日加棄捐葯芷與杜衡兮余柰世之不知芳何何周道之平易兮然蕪穢而險戲高陽無故而委塵兮唐虞點灼而毀議誰使正其真是兮雖有八師而不可為皇天保其高兮后土持其久服清白以逍遙兮偏與乎玄英異色西施媞媞而不得見兮𡠜母勃屑而日侍桂蠹不知所淹留兮蓼蟲不知徒乎葵菜處湣湣之濁世兮今安所達乎吾志意有所載而遠逝兮固非眾人之所識驥躊躇于獘輂兮遇孫陽而得代呂望窮因而不聊生兮遭周文而舒志甯戚飯牛而商歌兮桓公聞而弗置路室女之方桑兮孔子過之以自侍吾獨乖刺而無當兮心悼怵而耄思思比干之恲恲兮哀子胥之慎事悲楚人之和氏兮獻寶玉以為石遇厲武之不察兮羌兩足以畢斮小人之居勢兮視忠正之何若改前聖之法度兮喜囁嚅而妄作親讒諛而疏賢聖兮訟謂閭娵為醜惡愉近習而蔽遠兮孰知察其黑白卒不得效其心容兮安眇眇而無所歸薄專精爽以自明兮晦冥冥而壅蔽年既已過太半兮然埳軻而留滯欲高飛而遠集兮恐離罔而滅敗獨冤抑而無極兮傷精神而壽夭皇天既不純命兮余生終無所依願自沈于江流兮絕橫流而徑逝寍為江海之泥塗兮安能久見此濁世怨世賢士窮而隱處兮廉方正而不容子胥諫而靡軀兮比干忠而剖心子推自割而飤君兮德日忘而怨深行明白而日黑兮荊棘聚而成林江離棄于窮巷兮蒺藜乎東廂賢者蔽而不見兮讒諛進而相朋梟鴞竝進而俱鳴兮鳳皇飛而高翔願壹往而徑逝兮道壅絕而不通怨思居懃其誰告兮獨永思而憂悲內自省而不慚兮操愈堅而不衰隱二年而無決兮歲忽忽其若頹憐余身不足以卒意兮冀一見而復歸哀人事之不幸兮屬天命而委之咸池身被疾而不間兮心沸熱其若湯冰炭不可以相竝兮吾固知乎命之不長哀獨苦死之無樂兮惜子年之未央悲不反余之所居兮恨離子之故鄉鳥獸驚而失群兮猶高飛而哀鳴孤死必首丘兮夫人孰能不反其真情故人疏而日忘兮新人近而俞好莫能行于杳冥兮孰能施于無報苦眾人之皆然兮乘回風而遠遊凌恆山其若陋兮聊愉娛以忘憂悲虛言之無實兮苦眾口之鑠金過故鄉而一顧兮泣戲欷而霑衿厭白玉以為面兮懷琬琰以為心邪氣入而感內兮施玉色而外淫何青雲之流瀾兮微霜降之蒙蒙徐風至而徘徊兮疾風過之湯湯聞南藩樂而欲往兮至會稽而且止見韓眾而宿之兮問天道之所在借浮雲以送予兮載雌霓而為旌駕青龍以馳騖兮班衍衍之冥冥忽容容其安之兮超慌忽其焉如苦眾人之難信兮願離群而遠舉登巒山而遠望兮好桂樹之冬榮觀天火之炎煬兮聽大壑之波聲引八維以自道兮含沆瀣以長生居不樂以時思兮食草木之秋實飲菌若之朝露兮構桂木而為室雜橘柚以為囿兮列夷與椒楨鵾鶴孤而夜號兮哀居者之誠貞自悲哀時命之不合兮傷楚國之多憂內懷清之潔白兮遭亂世離尤惡耿介之直行兮世溷濁而不知何君臣之相失兮上沅湘而分離測汨羅之湘水兮知時固而不反傷離散之交亂兮遂側身而既遠處玄舍之幽門兮穴巖石而窟石從水蛟而為徒兮與神龍乎休息何山石之嶄巖兮靈魂屈而偃蹇含素水而蒙深兮日眇眇而既遠哀形體之離解兮神雨而無舍惟椒蘭之不反兮魂迷惑而不知路願無過之設行兮雖滅沒之自樂痛楚國之流亡兮哀靈脩之過到固時俗之溷濁兮志瞀迷而不知路念私門之正匠兮遙涉江而遠去念女嬃之嬋媛兮涕泣流乎於悒我決死而不生兮雖重追吾何及戲疾瀨之素水兮望高山之蹇產哀高丘之赤岸兮遂沒身而不返哀命怨靈脩之浩蕩兮夫何執操之不固悲太山之為隍兮孰江河之可涸願承間而效志兮怨犯忌而干諱卒撫情以寂寞兮然怊悵而自悲玉與石其同匱兮貫魚眼與珠璣駑駿雜而不分兮服罷生而驂驥年滔滔而自遠兮壽冉冉而愈衰心悇憛而煩冤兮蹇超搖而無冀固時俗之工巧兮滅規矩而改錯卻騏驥而不乘兮策駑駘而取路當世豈無騏驥兮誠無王良之善馭見執轡者非其人兮故駒跳而遠去不量鑿而正枘兮恐矩矱之不同不論世而高舉兮恐操行之不調弧弓弛而不張兮孰云知其所至無傾危之患難兮焉知賢士之所死俗推佞而進富兮節行張而不著賢良蔽而不群兮朋曹比而黨譽邪說飾而多曲兮正法弧而不公直士隱而避匿兮讒諛登乎明堂棄彭咸之娛樂兮滅巧倕之繩墨菎蕗雜于黀蒸兮機蓬矢以射革駕蹇驢而無策兮又何路之能極以道鍼而為釣兮又何魚之能伯牙之絕弦兮無鍾子期而聽之和抱璞而泣血兮安得良工而剖之同音者相和兮同無者相似飛鳥號其群兮鹿鳴求其友故叩宮而宮應兮彈角而角動虎嘯而谷風至兮龍舉而景雲往音聲之相和兮言物類之相感也夫方圜之異形兮勢不可以相錯列子隱身而窮合處兮世莫可以寄託眾鳥皆有行列兮鳳獨翔翔而無所薄經濁世而不得志兮願側身巖穴而自託欲闔口而無言兮嘗被君之厚德獨便悁而懷毒兮愁鬱鬱之焉極念三年積思兮願壹見而陳詞不及君而騁說兮世孰可為明之身寢疾而日愁兮情沈抑而不揚眾人莫可與論道兮悲精神之不通謬諫亂日鷥皇孔鳳日以遠兮畜鳧鴐鵝雞鶩滿堂壇兮鼃黽游乎華池要褭奔亡兮騰駕橐駝鉛刀進御兮遙棄太阿拔搴玄芝兮列樹芋荷橘柚萎枯兮苦李旖旎甂甌登于明堂兮周鼎潛乎深淵自古而固然兮吾何怨乎今之人見楚辭嗟伯夷窮隱處兮窟穴自藏其隨接而得志兮不若從孤竹于首陽見北堂書鈔一百五十八上書自薦臣朔少失父母長養兄嫂年十二學書三冬文史足用十五學擊劍十六學詩書誦二十二萬言十九學孫吳兵法戰陣之具鉦鼓之教亦誦二十二萬言凡臣朔固已誦四十四萬言又常服子路之言臣朔年二十二長九尺三寸目若縣珠齒若編貝勇若孟賁捷若慶忌廉若鮑叔信若尾生若此可以為天子大臣矣臣朔昧死再拜以聞見漢書東方朔傳諫除上林苑臣聞謙遜靜愨天表之應應之以福驕溢靡麗天表之應應之以異今陛下累郎臺恐其不高也弋獵之處恐其不廣也如天不為變則三輔之地盡可以為苑何必盩厔鄠杜乎奢侈越制天為之變上林雖小臣尚以為大也夫南山天下之阻也南有江淮北有河渭其地從汧隴以東商雒以西厥壤肥饒漢興去三河之地止霸產以西都涇渭之南此所謂天下陸海之地秦之所以虜西戎兼山東者也其山出玉石金銀銅鐵豫章檀柘異類之物不可勝原此百工所取給萬民所卬足也又有秔稻梨栗桑麻竹箭之饒土宜薑芋水多䵷魚貧者得以人給家足無飢寒之憂故酆鎬之間號為土膏其賈畝一金今規以為苑絕陂池水澤之利而取民膏腴之地上乏國家之用下奪農桑之業棄成功就敗事損耗五穀是其不可一也且盛荊棘之林而長養麋鹿廣狐兔之苑大虎狼之虛又壞人冢墓發人室廬令幼弱懷土而思耆老涕泣而悲是其不可二也斥而營之垣而囿之騎馳東西車騖南北又有深溝大渠夫一日之樂不足以危無隄之輿是其不可三也故務苑之大不恤農時非所以彊國富人也夫殷作九市之宮而諸侯叛靈王起章華之臺而楚民散秦興阿房之殿而天下亂糞土愚臣忘生觸死逆盛意犯隆指罪當萬死不勝大願願陳泰階六符以觀天變不可不省見漢書東方朔傳化民有道對堯舜禹湯文武成康上古之事經歷數千載尚難言也臣不敢陳願近述孝文皇帝之時當世耆老皆聞見之貴為天子富有四海身衣弋綈足履革舄以韋帶劍莞蒲為席兵木無刃衣縕無文集上書囊以為殿帷以道德為麗以仁義為準于是天下望風成俗昭然化之今陛下以城中為小圖起建章左鳳闕右神明號稱千門萬戶木土衣綺繡狗馬被繢罽宮人簪瑇瑁垂珠璣設戲車教馳逐飾文朱樷珍怪撞萬石之鐘擊雷霆之鼓作俳優舞鄭女上為淫侈如此而欲使民獨不奢侈失農事之難者也陛下誠能用臣朔之計推甲乙之帳燔之於四通之衢卻走馬示不復用則堯舜之隆宜可與比治矣易曰正其本萬事理失之豪氂差以千里願陛下留意察之見漢書東方朔傳對詔淩山越海窮天乃止見文選海賦注臨終諫天子詩云營營青蠅止于蕃愷悌君子無信讒言讒言罔極交亂四國願陛下遠巧佞退讒言見史記褚先生補傳與公孫弘借車書蓋聞爵祿不相責以禮同類之游不以遠近為敘是以東門先生居蓬戶空穴之中而魏公子一朝以百騎尊寵之呂望未嘗與文王同席而坐一朝讓以天下半大丈夫相知何必撫塵而游垂髮齊年偃伏以日數哉見初學記十八御覽四百十朔當從甘泉願借外廄之後乘木槿夕死朝榮士亦不長貧也見蓺文類聚八十九與友人書不可使塵網名韁拘鎖怡然長笑脫去十洲三梟相期拾瑤草吞日月之光華共輕舉耳非有先生論非有先生仕於吳進不稱往古以廣主意退不能揚君美以顯其功默然無言者三年矣吳王怪而問之曰寡人獲先人之功寄于眾賢之上夙興夜寐未嘗敢怠也今先生率然高舉遠集吳地將以輔治寡人誠竊嘉之體不安席食不甘味目不視靡曼之色耳不聽鐘鼓之音虛心定志欲聞流議者三年于茲矣今先生進無以輔治退不揚主譽竊為先生不取也蓋懷能而不見是不忠也見而不行主不明也意者寡人殆不明乎非有先生伏而唯唯吳王曰可以談矣寡人將竦意而聽焉先生曰於戲可乎哉可乎哉談何容易夫談者有悖于而目佛于耳謬于心而便于身者或有說於目順於耳快于心而毀于行者非有明王聖主孰能聽之吳王曰何為其然也中人以上可以語上也先生試言寡人將覽焉先生對曰昔者關龍逢深諫于桀而王子比干直言于紂此二臣者皆極慮盡忠閔王澤不下流而萬民騷動故直言其失切諫其邪者將以為君之榮除主之禍也今則不然反以為誹謗君之行無人臣之禮果紛然傷于身蒙不辜之名戮及先人為天下笑故曰談何容易是以輔弼之臣瓦解而邪諂之人竝進遂及飛廉惡來革等三人皆詐偽巧言利口以進其身陰奉彫瑑刻鏤之好以納其心務快耳目之欲以苟容為度遂往不戒身沒被戮宗廟崩阤國家為墟放戮聖賢親近讒夫詩不云乎讒人罔極交亂四國此之謂也故卑身賤體說色微辭愉愉煦煦終無益于主上之治即志士仁人不忍為也將儼然作矜莊之色深言直諫上以拂人主之邪下以損百姓之害則忤于邪主之心歷于衰世之法故養壽命之士莫肯進也遂居深山之間積土為室編蓬為戶彈琴其中以詠先王之風亦可以樂而忘死矣是以伯夷叔齊避周餓于首陽之下後世稱其仁如是邪主之行固足畏也故曰談何容易于是吳王懼然易容捐薦去几危坐而聽先生曰接輿避世箕子被髮佯狂此二子者皆避濁世以全其身者也使遇明王聖主得清讌之閒寬和之色發憤畢誠圖畫安危揆度得失上以安主體下以便萬民則五帝三王之道可幾而見也故伊尹蒙恥辱負鼎俎和五味以干湯太公釣于渭之陽以見文王心合意同謀無不成計無不從誠得其君也深念遠慮引義以正其身推恩以廣其下本仁祖誼褒有德祿賢能誅惡亂總遠方壹統類美風俗此帝王所由昌也上不變天性下不奪人倫則天地和洽遠方懷之故號聖王臣子之職既加矣于是裂地定封爵為公侯傳國子孫名顯後世民到于今稱之以遇湯與文王也太公伊尹以如此龍逢比干獨如彼豈不哀哉故曰談何容易于是吳王穆然俛而深惟仰而泣下交頤曰嗟乎余國之不亡也綿綿連連殆哉世之不絕也于是正明堂之朝齊君臣之位舉賢材布德惠施仁義賞有功親節儉減後宮之費損車馬之用放鄭聲遠佞人省庖廚去侈靡卑宮館壞苑囿填池塹以與貧民無產業者開內藏振貧窮存耆老恤孤獨薄賦斂省刑辟行此三年海內晏然天下大洽陰陽和調萬物咸得其宜國無災害之變民無飢寒之色家給人足畜積有餘囹圄空虛鳳皇來集麒麟在郊甘露既降朱草萌芽遠方異俗之人嚮風慕義各奉其職而來朝賀故治亂之道存亡之端若此易見而君人者莫肯為也臣愚竊以為過故詩云王國克生惟周之貞濟濟多士文王以寧此之謂也見漢書東方朔傳文選蓺文類聚二十四隱真論處天地之先不以為長在萬古之下不以為久隨時應變與物俱化見釋藏陪字號唐釋法琳辨正論荅客難客難東方朔曰蘇秦張儀一當萬乘之主而都卿相之位澤及後世今子大夫脩先王之術慕聖人之義諷誦詩書百家之言不可勝數著于竹帛脣腐齒落服膺而不釋好學樂道之效明白甚矣自以智能海內無雙則可謂博聞辯智矣然悉力盡忠以事聖帝曠日持久官不過侍郎位不過執戟意者尚有遺行邪同胞之徒無所容居其故何也東方先生喟然長息仰而應之曰是固非子之所能備也彼一時也此一時也豈可同哉夫蘇秦張儀之時周室大壞諸侯不朝力政爭權相禽以兵并為十二國未有雌雄得士者彊失士者亡敨談說行焉身處尊位珍寶充內外有廩倉澤及後世子孫長享今則不然聖帝流德天下震懾諸侯賓服連四海之外以為帶安於覆盂動猶運之掌賢不肖何以異哉遵天之道順地之理物無不得其所故綏之則安動之則苦尊之則為將卑之則為虜抗之則在青雲人上抑之則在深泉之下用之則為虎不用則為鼠雖欲盡節效情安知前後夫天地之大士民之眾竭精談說竝進輻湊者不可勝數悉力募之困于衣食或失門戶使蘇秦張儀與僕竝生于今之世曾不得掌故安敢望常侍郎乎故曰時異事異雖然安可以不務脩身乎哉詩云鼓鐘于宮聲聞于外鶴鳴于九皋聲聞于天苟能脩身何患不榮太公體行仁義七十有二乃設用于文武得信厥說封于齊七百歲而不絕此士所以日夜孳孳敏行而不敢怠也辟若䳭鴒飛且鳴矣傳曰天不為人之惡寒而輟其冬地不為人之惡險而輟其廣君子不為小人之匈匈而易其行天有常度地有常形君子有常行君子道其常小人計其功詩云禮義之不愆何恤人之言故曰水至清則無魚人至察則無徒冕而前旒所以蔽明黈纊充耳所以塞聰明有所不見聰有所不聞舉大德赦小過無求備於一人之義也枉而直之使自得之優而柔之使自求之揆而度之使自索之蓋聖人教化如此欲自得之自得之則敏且廣矣今世之處士魁然無徒廓然獨居上觀許由下察接輿計同范蠡忠合之胥天下和平與義相扶寡耦少徒固其宜也子何疑于我哉若夫燕之用樂毅秦之任李斯酈食其之下齊說行如流曲從如環所欲必得功若丘山海內定國家安是遇其時也子又何怪之邪語曰以筦闚天以蠡測海以莛撞鐘豈能通其條貫考其文理發其音聲哉繇是觀之譬猶鼱鼩之襲狗孤豚之咋虎至則靡耳何功之有今以下愚而非處士雖欲勿困固不得已此適足以明其不知權變而終或于大道也見漢書本傳文選蓺文類聚二十五荅驃騎難干將莫邪天下之利劍也水斷鵠雁陸斷馬牛將以補履曾不如一錢之錐騏驎綠耳蜚鴻驊騮天下良馬也將以捕鼠于深宮之中曾不如跛貓十洲記序臣學仙者耳非得道之人以國家盛美特招延儒墨于文網之內抑絕俗之道擯虛詭之迹臣故韜隱逸而赴玉庭藏養生而侍朱闕矣亦由尊上好道且復欲徜徉威儀也曾隨師主之履行北至朱陵枎桑之國溽海冥夜之丘純陽之陵始青之下月宮之閒內游七丘中旋十洲踐赤縣而遨五嶽行陂澤而息名山臣自少及今周流六天涉歷八極于是矣未若陵虛之子飛真之官上下九天洞視百方北極鉤陳而并華蓋南翔太丹而栖大夏東之通陽之霞西薄寒穴之野日月所不逮星漢所不與其上無復物其下無復底臣之所識始愧不足以酬廣訪矣旱頌維昊天之大旱失精和之正理遙望白雲之酆淳滃曈曈而亡止陽風吸習而熇熇群生閔懣而愁憒隴畝枯槁而允布壤石相聚而為害農夫垂拱而無為釋其耰鉏而下涕悲壇畔之遭禍痛皇天之靡濟見蓺文類聚一百寶甕銘寶雲生于露壇祥風起于月館望三壼如盈尺視八鴻如縈帶見王子年拾遺記誡子明者處世莫尚于中優哉游哉與道相從首陽為拙侯惠為工飽食安步以仕代農依隱玩世詭時不逢是故才盡者身危好名得華有群者累生孤貴者失和遺餘者不匱自盡者無多聖人之道一龍一蛇形見神藏與物變化隨時之宜無有常家見蓺文類聚二十三御覽四百五十九東方朔占子日東風卯日雨丑日東風辰日雨寅日東風已日雨卯日東風午日雨辰日東風未日雨已日東風申日雨午日東風即日雨未日東風申日雨申日東風子日雨酉日東風丑日雨戍日東風寅日雨亥日東風辰日雨甲子日雨丙寅止乙丑日雨丁卯止丙寅日雨即日止丁卯雨夕止戊辰雨夜半止已已雨立止庚午日雨辛未止辛未日雨戊寅止壬申日雨即日止癸酉日雨甲戍止甲戍日雨即時止已卯日雨立止庚辰日雨即止辛已日雨癸未止壬午日雨即日止癸未日雨甲申止甲申日雨即止乙酉日雨丙戍止丙戍日雨即止丁亥日雨即時止戊子日雨庚寅止已丑日雨庚寅止庚寅日雨即時止辛卯日雨即止壬辰日雨辛丑止癸已日雨夕止甲午日雨即時止乙未日雨丁酉止丙申日雨夕止丁酉日雨已亥止戊戍日雨辛丑止已亥日雨即止庚子日雨壬辰止辛丑日雨壬寅止壬寅日雨即止癸卯日雨即時止甲辰日雨即止乙已日雨丙午止丙午日雨即止丁未日雨即時止戊申日雨庚戍止已酉日雨辛亥止庚戊日雨即止辛亥日雨癸丑止壬子日雨癸丑止癸丑日雨即時止甲寅日雨即止乙卯日雨丙辰止丙辰日雨丁已止丁已日雨即時止戊午日雨即止己未日雨即止庚申日雨即止辛酉日雨即時止壬戍日雨即時止癸亥日雨即時止子日雨立止不止寅日止丑日雨寅日止不止至卯日止寅日雨即止不止卯日止卯日雨即止不止已日止辰日雨已日止已日雨未日止不止申日止午日雨立止不止至十日陰未日雨申日止不止戍日止申日雨夕止見月不見日久陰酉日雨立止不止久陰戍日雨立止不止久陰亥日雨立止不止久陰此其大概也見開元占經九十二凡霧氣不順四時逆相交錯微風小雨為陰陽氣亂之象從寅至辰已以上周而復始為逆者不成積日不解者晝夜昏闇天下欲分離見開元占經一百一正月朔日雨歲中下田麥成禾黍小貴三月得已朔大麥熟庚朔禾熟兵賊起辛朔下田不收壬朔赤地千里米穀貴癸朔熟三月有三卯大豆好無三卯旱種禾四月丙朔夏苗長四月無三卯旱種麻常以正月一日夜半子時候侯東方有黃色雲者春大赦南方有黃色雲者夏有赦西方有黃色雲者秋有赦北方有黃色雲者冬有赦雜者皇太子有赦有黑雲雜者必有皇后若女子之赦見開元占經一百十一
