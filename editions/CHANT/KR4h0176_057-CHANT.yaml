body:
  text: 劉歆遂初賦遂初賦者劉歆所作也歆少通詩書能屬文成帝召為黃門侍郎中壘校尉侍中奉車都尉光祿大夫歆好左氏春秋欲立於學官時諸儒不聽歆乃移書太常博士責讓深切為朝廷大臣非疾求出補吏為河內太守又以宗室不宜典三河徙五原太守是時朝政已多失矣歆以論議見排擯志意不得之官經歷故晉之域感今思古遂作斯賦以歎征事而寄己意昔遂初之顯祿兮遭閶闔之開通蹠三台而上征兮入北辰之紫宮備列宿於鉤陳兮擁大常之樞極總六龍於駟房兮奉華蓋於帝側惟太階之侈闊兮機衡為之難運懼魁杓之前後兮遂隆集於河濱遭陽侯之豐沛兮乘素波以聊戾得玄武之嘉兆兮守五原之燧二乘駕而既俟僕夫期而在口馳太行之嚴防兮入天井之喬關岡岑以升降兮馬龍騰以超攄無雙駟以優遊兮濟黎侯之舊居心滌蕩以慕遠兮迴高都而北征劇彊秦之暴虐兮弔趙括於長平好周文之嘉德兮躬尊賢而下士騖駟馬而觀風兮慶辛甲於長子哀衰周之失權兮數辱而莫扶執孫蒯于屯留兮救王師於途吾過不虒而歎息兮悲平公之作臺背宗周而不䘏兮苟偷樂而惰怠枝葉落而不省兮公族闃其無人曰不爨而俞甚兮政委棄於家門載約屨而正朝服兮降皮棄以為履寶礫石於廟堂兮面隋和而不眡始建衰而造亂兮公室由此遂卑憐後君之寄寓兮唁靖公於銅鞮越侯田而長驅兮釋叔向之飛患悅善人之有救兮勞祁奚於太原何叔子之好直兮為群邪之所惡賴祁子之一言兮幾不免乎落雙美不必為偶兮時有差而不相及雖韞寶而求賈兮嗟千載其焉合昔仲尼之淑聖兮竟隘窮乎蔡陳彼屈原之貞專兮卒放沈於湘淵何方直之難容兮柳下黜而三辱蘧瑗抑而再犇兮豈材知之不足揚蛾眉而見妒兮固醜女之情也曲木惡直繩兮亦小人之誠也以夫子之博觀兮何此道之必然空下時而矔世兮自命己之取患悲積習之生常兮固明智之所別叔群既在皁隸兮六卿興而為桀荀寅肆而顓恣兮吉射叛而擅兵憎人臣之若茲兮責趙鞅於晉陽軼中國之都邑兮登句注以陵厲歷雁門而入雲中兮超絕轍而遠逝濟臨沃而遙思兮垂意兮邊都野蕭條以寥廓兮陵谷錯以盤紆飄寂寥以荒䀛兮沙埃起之杳冥迴風育其飄忽兮迴颭颭之泠泠薄涸凍之凝滯兮茀谿谷之清涼漂積雪之皚皚兮涉凝露之降霜揚雹霰之復陸兮慨原泉之淩陰激流澌之漻淚兮窺九淵之潛淋慼悽愴以慘怛兮颯風漻以冽寒獸望浪以穴竄兮鳥脇翼之浚浚山蕭瑟以鵾鳴兮樹木壞而哇吟地坼裂而憤忽急兮石捌破之巖巖天烈烈以厲高兮廖𡌉窗以梟牢雁邕邕以遲遲兮野觀鳴而嘈嘈望亭隧之皦皦兮飛旗幟之翩翩迴百里之無家兮路修遠而綿綿於是勒障塞而固守兮奮武靈之精誠攄趙奢之策慮兮威謀完乎金城外折衝以無虞兮內撫民以永寍既邕容以自得兮唯惕懼於笁寒攸潛溫之玄室兮滌濁穢於太清反情素於寂漠兮居華體之冥冥玩琴書以條畼兮考性命之變態運四時而覽陰陽兮總萬物之珍怪雖窮天地之極變兮曾何足乎留意長恬淡以懽娛兮固賢聖之所喜亂曰幽潛德含聖神兮抱奇內光自得真兮寵幸浮寄奇無常兮寄之去留亦何傷兮大人之度品物齊兮舍位之過忽若遺兮求位得位固其常兮守信保己比老彭兮見蓺文類聚二十七古文苑甘泉宮賦軼陰陵之地室過陽谷之秋城迴天門而鳳舉躡黃帝之明庭冠高山而為居乘崑崙而為宮案軒轅之舊處居北辰之閎中背共工之幽都向炎帝之祝融封巒為之東序緣石闕之天梯桂木雜而成行芳肸嚮之依依翡翠孔雀飛而翱翔鳳凰止而集棲甘醴湧於中庭兮激清流之瀰瀰黃龍遊而蜿蟺兮神龜沈於玉泥離宮特觀接比相連雲起波駭星布彌山高巒峻阻臨眺曠衍深林蒲葦涌水清泉芙蓉菡萏菱荇蘋蘩豫章雜木楩松柞棫女貞烏勃桃李棗檍見蓺文類聚六十二初學記二十四章黼黻之文帷見文選西都賦注雲闕蔚之巖巖眾星接之皚皚見文選鮑照君子有所思行注燈賦惟茲蒼鶴修麗以奇身體剼削頭頸委虵負斯明燭躬含冰池明無不見照察纖微以夜繼晝烈者所依見蓺文類聚八十上山海經表侍中奉車都尉光祿大夫臣秀領校祕書言校祕書太常屬臣望所校山海經凡三十二篇今定為一十八篇已定山海經者出於唐虞之際昔洪水洋溢漫衍中國民人失據崎嶇於邱陵巢於樹木鯀既無功而帝堯使禹繼之禹乘四載隨山刊木定高山大川蓋與伯翳主驅禽獸命山川類草木別水土四岳佐之以周四方逮人迹之所希至及舟輿之所罕到內別五方之山外分八方之海紀其珍寶奇物異方之所生水土草木禽獸昆蟲麟鳳之所止禎祥之所隱及四海之外絕域之國殊類之人禹別九州任土作貢而益等類物善惡著山海經皆聖賢之遺事古文之著明者也其事質明有信孝武皇帝時常有獻異鳥者食之百物所不肯食東方朔見之言其鳥名又言其所當食如朔言問朔何以知之即山海經所出也孝宣皇帝時擊磻石於上郡陷得石室其中有反縛盜械人時臣秀父向為諫議大夫言此貳負之臣也詔問何以知之亦以山海經對其文曰貳負殺窫窳帝乃梏之疏屬之山桎其右足反縛兩手上大驚朝士由是多奇山海經者文學大儒皆讀學以為奇可以考禎祥變怪之物見遠國異人之謠俗故易曰言天下之至賾而不可亂也博物之君子其可不惑焉臣昧死謹上見宋本山海經又道藏本孝武廟不毀議臣聞周室既衰四夷竝侵獫狁最彊於今匈奴是也至宣王而伐之詩人美而頌之曰薄伐獫狁至于太原又曰嘽嘽推推如霆如雷顯允方叔征伐獫狁荊蠻來威故稱中興及至幽王犬戎來伐殺幽王取宗器自是之後南夷與北夷交侵中國不絕如綫春秋紀齊桓南伐楚北伐山戎孔子曰微管仲吾其被髮左衽矣是故棄桓之過而錄其功以為伯首及漢興冒頓始彊破東胡禽月氏并其土地地廣兵彊為中國害南越尉佗總百粵自稱帝故中國雖平猶有四夷之患且無寧歲一方有急三面救之是天下皆動而被其害也孝文皇帝厚以貨賂與結和親猶侵暴無已甚者興師十餘萬眾近屯京師及四邊歲發屯備虜其為患久矣非一世之漸也諸侯郡守連匈奴及百粵以為逆者非一人也匈奴所殺郡守都尉略取人民不可勝數孝武皇帝愍中國罷勞無安寧之時乃遣大將軍驃騎伏波樓船之屬南滅百粵起七郡北攘匈奴降昆邪十萬之眾置五屬國起朔方以奪其肥饒之地東伐朝鮮起玄菟樂浪以斷匈奴之左臂西伐大宛並三十六國結烏孫起敦煌酒泉張掖以鬲婼羌裂匈奴之右肩單于孤特遠遁于幕北四垂無事斥地遠境起十餘郡功業既定乃封丞相為富民侯以大安天下富實百姓其規橅可見又招集天下賢俊與協心同謀興制度改正朔易服色立天地之祠建封禪殊官號存周後定諸侯之制永無逆爭之心至今累世賴之單于守藩百蠻服從萬世之基也中興之功未有高焉者也高帝建大業為太祖孝文皇帝德至厚也為文太宗孝武皇帝功至著也為武世宗此孝宣帝所以發德音也禮記王制及春秋穀梁傳天子七廟諸侯五大夫三士二天子七日而殯七月而葬諸侯五日而殯五月而葬此喪事尊卑之序也與廟數相應其文曰天子三昭三穆與太祖之廟而七諸侯二昭二穆與太祖之廟而五故德厚者流光德薄者流卑春秋左氏傳曰名位不同禮亦異數自上以下降殺以兩禮也七者其正法數可常數者也宗不在此數中宗變也苟有功德則宗之不可預為設數故於殷太甲為太宗大戊曰中宗武丁曰高宗周公為毋逸之戒舉殷三宗以勸成王繇是言之宗無數也然則所以勸帝者之功德博矣以七廟言之孝武皇帝未宜毀以所宗言之則不可謂無功德禮記祀典曰夫聖王之制祀也功施於民則祀之以勞定國則祀之能救大災則祀之竊觀孝武皇帝功德皆兼而有焉凡在於異姓猶將特祀之況於先祖或說天子五廟無見文又說中宗高宗者宗其道而毀其廟名與實異非尊德貴功之意也詩云蔽芾甘棠勿鬋勿伐邵伯所茇思其人猶愛其樹況宗其道而毀其廟乎迭毀之禮自有常法無殊功異德固以親疏相推及至祖宗之序多少之數經傳無明文至尊至重難以疑文虛說定也孝宣皇帝舉公卿之議用眾儒之謀既以為世宗之廟建之萬世宣布天下臣愚以為孝武皇帝功烈如彼孝宣皇帝崇立之如此不宜毀見漢書韋玄成傳又略見御覽八十八引劉歆宗廟議惠景及太上皇寢園議禮去事有殺故春秋外傳曰日祭月祀時享歲貢終王祖禰則日祭曾高則月祀二祧則時享壇墠則歲貢大禘則終王德盛而游廣親親之殺也彌遠則彌尊故禘為重矣孫居王父之處正昭穆則孫常與祖相代此遷廟之殺也聖人於其祖出於情矣禮無所不順故無毀廟自貢禹建迭毀之議惠景及太上寢園廢而為虛失禮意矣見漢書韋玄成傳功顯君喪服議居攝之義所以統立天功興崇帝道成就法度安輯海內也昔殷成湯既沒而太子蚤夭其子太甲幼少不明伊尹放諸桐宮而居攝以興殷道周武王既沒周道未成成王幼少周公屏成王而居攝以成周道是以殷有翼翼之化周有刑錯之功今太皇太后比遭家之不造委任安漢公宰尹群僚衡平天下遭孺子幼少未能共上下皇天降瑞出丹石之符是以太皇大后則天明命詔安漢公居攝踐祚將以成聖漢之業與唐虞三代比隆也攝皇帝遂開祕府會群儒制禮作樂卒定庶官茂成天功聖心周悉卓爾獨見發得周禮以明因監則天稽古而損益焉猶仲尼之聞韶日月之不可階非聖哲之至孰能若茲綱紀咸張成在一匱此其所以保佑聖漢安靖元元之效也今功顯君薨禮庶子為後為其母緦傳曰與尊者為體不敢服其私親也攝皇帝以聖德承皇天之命受太后之詔居攝踐阼奉漢大宗之後上有天地社稷之重下有元元萬機之憂不得顧其私親故太皇太后建厥元孫俾侯新都為哀侯後明攝皇帝與尊者為體承宗廟之祭奉共養太皇大后不得顧其私親也周禮曰王為諸侯緦縗弁而加環絰同姓則麻異姓則葛攝皇帝當為功顯君緦縗弁而加麻環絰如天子弔諸侯服以應聖制見漢書王莽傳上移書讓太常博士歆親近欲建立左氏春秋及毛詩逸禮古文尚書皆列於學官哀帝令歆與五經博士講論其議諸儒博士或不肯置對歆因移書太常博士責讓之曰昔唐虞既衰而三代迭興聖帝明王累起相襲其道甚著周室既微而禮樂不正道之難全也如此是故孔子憂道之不行歷國應聘自衛反魯然後樂正雅頌乃得其所修易序書制作春秋以記帝王之道及夫子沒而微言絕七十子終而大義乖重遭戰國棄籩豆之禮理軍旅之陳孔氏之道抑而孫吳之術興陵夷至于暴秦焚經書殺儒士設挾書之法行是古之罪道術由是遂滅漢興去聖帝明王遐遠仲尼之道又絕法度無所因襲時獨有一叔孫通略定禮儀天下惟有易卜未有他書至孝惠之世乃除挾書之律然公卿大臣絳灌之屬咸介冑武夫莫以為意至孝文皇帝始使掌故朝錯從伏生受尚書尚書初出于屋壁朽折散絕今其書見在時師傳讀而已詩始萌芽天下眾書往往頗出皆諸子傳說猶廣立於學官為置博士在漢朝之儒唯賈生而已至孝武皇帝然後鄒魯梁趙頗有詩禮春秋先師皆起於建元之閒當此之時一人不能獨盡其經或為雅或為頌相合而成泰誓後得博士集而讀之故詔書曰禮壞樂崩書缺簡脫朕甚閔焉時漢興已七八十年離於全經固已遠矣及魯恭王壞孔子宅欲以為宮而得古文於壞壁之中逸禮有三十九篇書十六篇天漢之後孔安國獻之遭巫蠱倉卒之難未及施行及春秋左氏丘明所修皆古文舊書多者二十餘通臧於祕府伏而未發孝成皇帝愍學殘文缺稍離其真乃陳發祕臧校理舊文得此三事以考學官所傳經或脫簡傳或脫編博問民閒則有魯國柏公趙國貫公膠東庸生之遺學與此同抑而未施此乃有識者之所惜閔士君子之所嗟痛也往者綴學之士不思廢絕之闕苟因陋就寡分文析字煩言碎辭學者罷老且不能究其一藝信口說而背傳記是末師而非往古至於國家將有大事若立辟雍封禪巡狩之儀則幽冥而莫知其原猶欲保殘守缺挾恐見破之私意而無從善服義之公心或懷妬嫉不考情實雷同相從隨聲是非抑此三學以尚書為備謂左氏為不傳春秋豈不哀哉今聖上德通神明繼統揚業亦閔文學錯亂學士若茲雖昭其情猶依違謙讓樂與士君子同之故下明詔試左氏可立不遣近臣奉指銜命將以輔弱扶微與二三君子比意同力冀得廢遺今則不然深閉固距而不肯試猥以不誦絕之欲以杜塞餘道絕滅微學夫可與樂成難與慮始此乃眾庶之所為耳非所望士君子也且此數家之事皆先帝所親論今上所考視其古文舊書皆有徵驗內外相應豈苟而已哉夫禮失求之於野古文不猶愈於野乎往者博士書有歐陽春秋公羊易則施孟然孝宣皇帝猶復廣立穀梁春秋梁丘易大小夏侯尚書義雖相反猶並置之何則與其過而廢之也寧過而立之傳曰文武之道未墬於地在人賢者志其大者不賢者志其小者今此數家之言所以兼包大小之義豈可偏絕哉若必專己守殘黨同門妬道真違明詔失聖意以陷於文吏之議甚為二三君子不取也見漢書劉歆傳文選蓺文類聚五十八荅文學誠思拾遺冀以云補見文選注與揚雄書從取方言歆卭頭昨受詔宓五官郎中田儀與官婢陳徵駱驛等私通盜刷越巾事即其夕竟歸府詔問三代周秦軒車使者遒人使者以歲八月巡路求代語僮謠歌戲欲得其最目因從事郝隆求之有日篇中但有其目無見文者歆先君數為孝成皇帝言當使諸儒共集訓詁爾雅所及五經所詁不合爾雅者詁為病及諸經氏之屬皆無證驗博士至以窮世之博學者偶有所見非徒無主而生是也會成帝未以為意先君又不能獨集至於歆身修軌不暇何偟更創屬聞子雲獨採集先代絕言異國殊語以為十五卷其所解略多矣而不知其目非子雲澹雅之才沈鬱之思不能經年銳積以成此書良為勤矣歆雖不遘過庭亦克識先君雅訓三代之書蘊藏於家直不計耳今聞此甚為子雲嘉之已今聖朝留心典誥發精於殊語欲以驗攷四方之事不勞戎馬高車之使坐知傜俗適子雲攘意之秋也不以是時發倉廩以振贍殊無為明語將何獨挈之寶上以忠信明於上下以置恩於罷朽所謂知蓄積善布施也蓋蕭何造律張倉推厤皆成之於帷幕貢之於王門功列於漢室名流乎無窮誠以隆秋之時收藏不殆饑春之歲散之不疑故至於此今謹使密人奉手書願頗與其最目得使入籙令聖朝留明明之典歆叩頭卭頭見方言古文苑新序論秦孝公保崤函之固以廣雍州之地東并河南北收上郡國富兵彊長雄諸侯周室歸籍四方來賀為戰國霸君秦遂以彊六世而并諸侯亦皆商君之謀也夫商君極身無二慮盡公不顧私使民內急耕織之業以富國外重戰伐之賞以勸戎士法令必行內不私貴寵外不偏疏遠是以令行而禁止法出而姦息故雖書云無偏無黨詩云周道如砥其直如矢司馬法之勵戎士周后稷之勸農業無以易此此所以并諸侯也故孫卿曰四世有勝非幸也數也然無信諸侯畏而不親夫霸君若齊桓晉文者桓不倍柯之盟文不負原之期而諸侯畏其彊而親信之存亡繼絕四方歸之此管仲舅犯之謀也今商君倍公子卬之舊恩棄交魏之明信詐取三軍之眾故諸侯畏其彊而不親信也藉使孝公遇齊桓晉文得諸侯之統將合諸侯之君驅天下之兵以伐秦秦則亡矣天下無桓文之君故秦得以兼諸侯衛鞅始自以為知霸王之德原其事不喻也昔周召施善政及其死也後世思之蔽芾甘棠之詩是也嘗舍於樹下後世思其德不忍伐其樹況害其身乎管仲奪仲氏邑三百戶無怨言今衛鞅內刻刀鋸之刑外深鈇鉞之誅步過六尺者有罰棄灰於道者被刑一日臨渭而論囚七百餘人渭水盡赤號哭之聲動於天地畜怨積讎比於丘山所逃莫之隱所歸莫之容身死車裂滅族無姓其去霸王之佐亦遠矣然惠王殺之亦非也可輔而用也使衛鞅施寬平之法加之以恩申之以信庶幾霸者之佐哉見史記商君傳贊集解引新序論索隱曰新序是劉歆所撰其中論商君故裴氏引之斛銘律嘉量斛方尺而圓其外庣旁九釐五毫羃百六十二寸深尺積一千六百二十寸容十斗見隋書律厤志上
