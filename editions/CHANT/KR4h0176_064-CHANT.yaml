body:
  text: 何武上封事薦辛慶忌虞有宮之奇晉獻不寐衛青在位淮南寢謀故賢人立朝折衝厭難勝於亡形司馬法曰天下雖安忘戰必危夫將不豫設則亡以應卒士不素厲則難使死敵是以先帝建列將之官近戚主內異姓距外故姦軌不得萌動而破滅誠萬世之長冊也光祿勳慶忌行義修正柔毅敦厚謀慮深遠前在邊郡數破敵獲虜外夷莫不聞乃者大異並見未有其應加以兵革久寢春秋大災未至而豫禦之慶忌宜在爪牙官以備不虞見漢書辛慶忌傳上書薦傅喜喜行義修絜忠誠憂國內輔之臣也今以寑病一旦遣歸眾庶失望皆曰傅氏賢子以論議不合於定陶太后故退百寮莫不為國恨之忠臣社稷之衛魯以季友治亂楚以子玉輕重魏以無忌折衝項以范增存亡故楚跨有南土帶甲百萬鄰國不以為難子玉為將則文公側席而坐及其死也君臣相慶百萬之眾不如一賢故秦行千金以間廉頗漢散萬金以疏亞夫喜立於朝陛下之光輝傅氏之廢興也見漢書傅喜傳奏置三公官古者民樸事約國之輔佐必得賢聖然猶則天三光備三公官各有分職今末俗之弊政事煩多宰相之材不能及古而丞相獨兼三公之事所以久廢而不治也宜建三公官定卿大夫之任分職授政以考功效見漢書朱博傳奏置州牧古選諸侯賢者以為州伯書曰咨十有二牧所以廣聰明燭幽隱也今部刺史居牧伯之位秉一州之統選第大吏所薦位高至九卿所惡立退任重職大春秋之義用貴治賤不以卑臨尊刺史位下大夫而臨二千石輕重不相準失位次之序臣請罷刺史更置州牧以應古制見漢書朱博傳奏請內史如都尉往者諸侯王斷獄治政內史典獄事相總綱紀輔王中尉備盜賊今王不斷獄與政中尉官罷職并內史郡國守相委任所以壹統信安百姓也今內史位卑而權重威職相踰不統尊者難以為治臣請相如太守內史如都尉以順尊卑之序平輕重之權見漢書何武傳上封事薦朱雲治道在於得賢御史之官宰相之副九卿之右不可不選平陵朱雲兼資文武忠正有智略可使以六百石秩試守御史大夫以盡其能見漢書朱雲傳上疏劾韋玄成丞相韋玄成容身保位亡能往來見漢書朱雲傳對問罷邊備事狀周秦以來匈奴暴桀寇侵邊境漢與尤被其害臣聞北邊塞至遼東外有陰山東西千餘里草木茂盛多禽獸本冒頓單于依阻其中治作弓矢來出為寇是其苑囿也至孝武世出師征伐斥奪此地攘之於幕北建塞徼起亭隧築外城設屯戍以守之然後邊境得用少安幕北地平少草木多大沙匈奴來寇少所蔽隱從塞以南徑深山谷往來差難邊長老言匈奴失陰山之後過之未嘗不哭也如罷備塞戍卒示夷狄之大利不可一也今聖德廣被天覆匈奴匈奴得蒙全活之恩稽首來臣夫夷狄之情困則卑順彊則驕逆天性然也前以罷外城省亭隧今裁足以侯望通烽火而已古者安不忘危不可復罷二也中國有禮義之教刑罰之誅愚民猶尚犯禁又況單于能必其眾不犯約哉三也自中國尚建梁以制諸侯所以絕臣下之覬欲也設塞徼置屯戍非獨為匈奴而已亦為諸屬國降民本故匈奴之人死其思舊逃亡四也近西羌保塞與漢人交通吏民貪利侵盜其畜產妻子以此怨恨起而背畔世世不絕今罷乘塞則生嫚易分爭之漸五也往者從軍多沒不還者子孫貧困一旦亡出從其親戚六也又邊人奴婢愁苦欲亡者多曰聞匈奴中樂無奈侯望急何然時有亡出塞者七也盜賊桀黠群輩犯法如其窘急亡走北出則不可制八也起塞以來百有餘年非皆以土垣也或因山巖石木柴僵落谿谷水門稍稍平之卒徒築治功費久遠不可勝計臣恐議者不深慮其終始欲以壹切省繇戍十年之外百歲之內卒有它變障塞破壞亭隧滅絕當更發屯繕治累世之功不可卒復九也如罷戍卒省侯望單于自以保塞守御必深德漢請求無已小失其意則不可測開夷狄之隙虧中國之固十也非所以永持至安威制百蠻之長策也見漢書匈奴傳下上疏言吏多苛政陛下至德仁厚哀閔元元躬有日仄之勞而亡佚豫之樂允執聖道刑罰惟中然而嘉氣尚凝陰陽不和是臣下未稱而聖化獨有不洽者也臣竊伏思其一端殆吏多苛政政教煩碎大率咎在部刺史或不循守條職舉錯各以其意多與郡縣事至開私門聽讒佞以求吏民過失譴呵及細微責義不量力郡縣相迫促亦內相刻流至眾庶是故鄉黨闕於嘉賓之懽九族忘其親親之恩飲食周急之厚彌衰送往勞來之禮不行夫人道不通則陰陽否鬲和氣不興未必不由此也詩云民之失德乾餱以愆鄙語曰苛政不親煩苦傷恩方刺史奏事時宜明申敕使昭然知本朝之要務臣愚不知治道唯明主察焉見漢書嶭宣傳奏免張放放驕蹇縱恣奢淫不制前侍御史修等四人奉使至放家逐名捕賊時放見在奴從者閉門設兵弩射吏距使者不肯內知男子李游君欲獻女使樂府音監景武強求不得使奴康等之其家賊傷三人又以縣官事怨樂府游徼莽而使大奴駿等四十餘人群黨盛兵弩白晝入樂府攻射官寺縛束長吏子弟斫破器物宮中皆犇走伏匿莽自髡鉗衣赭衣及守令史調等皆徒跣叩頭謝放放乃止奴從者支屬並乘權勢為暴虐至求吏妻不得殺其夫或恚一人妄殺其親屬輒亡入放第不得幸得勿治放行輕薄連犯大惡有感動陰陽之咎為臣不忠首罪名雖顯前蒙恩驕逸悖理與背畔無異臣子之惡莫大於是不宜宿衛在位臣請免放歸國以銷眾邪之萌厭海內之心見漢書張湯附傳奏事漢興以來深考古義惟萬變之備於是制宮室出入之儀正輕重之罰故司馬殿省門闥至五六重周衛擊刁斗近臣侍側尚不得著鉤帶入房防未然也陛下聖德純備海內晏然此國家之明制必前後備虎賁見御覽二百四十一三百三十八三百五十四竝引漢名臣奏曰丞相嶭宣奏茂陵寢上食日玄鳥來集吐所含大豆紫黑色翱翔殿上此陛下永與天無極天下幸甚見蓺文類聚九十九引漢名臣奏曰丞相嶭宣奏手自牒書封與高陵令陽湛吏民條言君如牒或議以為疑於主守盜馮翊敬重令又念十金法重不忍相暴章故密以手書相曉欲君自圖進退可復伸眉於後即無其事復封還記得為君分明之見漢書嶭宣傳移書責櫟陽令謝游告櫟陽令吏民言令治行煩苛適罰作使千人以上賊取錢財數十萬給為非法賣買聽任富吏賈數不可知證驗以明白欲遣吏考案恐負舉者恥辱儒士故使掾平鐫令孔子曰陳力就列不能者止令詳思之方調守見漢書嶭宣傳移書勞勉頻陽令尹賞粟邑令嶭恭昔孟公綽優於趙魏而不宜滕薛故或以德顯或以功舉君子之道焉可憮也屬縣各有賢君馮翊垂拱蒙成願勉所職卒功業見漢書嶭宣傳移書池陽追署廉吏王立縣所舉廉吏獄掾王立家私受賕而立不知殺身以自明立誠廉士甚可閔惜其以府決曹掾書立之柩以顯其魂府掾史素與立相知者皆予送葬見漢書嶭宣傳下賊曹掾張扶教蓋禮貴和人道尚通日至吏以令休所繇來久曹雖有公職事家亦望私恩意掾宜從眾歸對妻子設酒肴請鄰里壹笑相樂斯亦可矣見漢書嶭宣傳上書謝恩臣豐駑怯文不足以勸善武不足以執邪陛下不量臣能否拜為司隸校尉未有以自效復秩臣為光祿大夫官尊責重非臣所當處也又迫年歲衰暮常恐卒填溝渠無以報厚德使論議士譏臣無補長獲素餐之名故常願損一旦之命不待時而斷姦臣之首縣於都市編書其罪使四方明知為惡之罰然後卻就斧鉞之誅誠臣所甘心也夫以布衣之士尚猶有刎剄之交今以四海之大曾無伏節死誼之臣率盡苟合取容阿黨相為念私門之利忘國家之政邪穢濁溷之氣上感于天是以災變數見百姓困乏此臣下不忠之效也臣誠恥之亡已凡人情莫不欲安存而惡危亡然忠臣直士不避患害者誠為君也今陛下天覆地載物無不容使尚書令堯賜臣豐書曰夫司隸者刺舉不法善善惡惡非得顓之也免處中和順經術意恩深德厚臣豐頓首幸甚臣竊不勝憤懣願賜清宴唯陛下裁幸見漢書諸葛豐傳復上書臣聞伯奇孝而棄於親子胥忠而誅於君隱公慈而殺於弟叔武弟而殺於弟兄夫以四子之行屈平之材然猶不能自顯而被刑戮豈不足以觀哉使臣殺身以安國蒙誅以顯君臣誠願之獨恐未有云補而為眾邪所排令讒夫得遂正直之路雍塞忠臣沮心智士杜口此愚臣之所懼也見漢書諸葛豐傳上書讓封邑故事封丞相不滿千戶而獨臣過制誠慚懼願還千戶見漢書朱博傳奏復置御史大夫帝王之道不必相襲各繇時務高皇帝以聖德受命建立鴻業置御史大夫位次丞相典正法度以職相參總領百官上下相監臨歷載二百年天下安寧今更為大司空與丞相同位未獲嘉祐故事選郡國守相高第為中二千石選中二千石為御史大夫任職者為丞相位次有序所以尊聖德重國相也今中二千石未更御史大夫而為丞相權輕非所以重國政也臣愚以為大司空官可罷復置御史大夫遵奉舊制臣願盡力以御史大夫為百僚率見漢書朱博傳奏復置刺史漢家至德溥大宇內萬里立置郡縣部刺史奉使典州督察郡國吏民安寧故事居部九歲舉為守相其有異材功效著者輒登擢秩卑而賞厚咸勸功樂進前丞相方進奏罷刺史更置州牧秩真二千石位次九卿九卿缺以高弟補其中材則苟自守而已恐功效陵夷姦軌不禁臣請罷州牧置刺史如故見漢書朱博傳奏封事免孔光傅喜丞相光志在自守不能憂國大司馬喜至尊至親阿黨大臣無益政治見漢書朱博傳奏免師丹爵邑前高昌侯宏首建尊號之議而為丹所劾奏免為庶人時天下衰麤委政於丹丹不深惟襃廣尊親之義而妄稱說抑貶尊號虧損孝道不忠莫大焉陛下聖仁昭然定尊號宏以忠孝復封高昌侯丹惡逆暴著雖蒙赦令不宜有爵邑請免為庶人見漢書師丹傳奏免傅喜何武爵士喜武前在位皆無益於治雖已退免爵土之封非所當得也請皆免為庶人見漢書朱博傳奏免王莽爵士莽前不廣尊尊之義抑貶尊號虧損孝道當伏顯戮幸蒙赦令不宜有爵土請免為庶人見漢書王莽傳上出教主簿贛老生不習吏禮主簿且教拜起閑習迺止見漢書朱博傳敕功曹官屬多襃衣大袑不中節度自今掾史衣皆令去地三寸見漢書朱博傳口占檄文府告姑幕令丞言賊發不得有書檄到令丞就職游徼王卿力有餘如律令見漢書朱博傳移游徼王卿書王卿憂公甚效檄到齎伐閱詣府部掾以下亦可用漸盡其餘矣見漢書朱博傳
