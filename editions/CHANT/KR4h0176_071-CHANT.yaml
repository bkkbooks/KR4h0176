body:
  text: 楊雄冀州箴洋洋冀州鴻原大陸嶽陽是都島夷被服潺湲河流表以碣石三后攸降列為侯伯隆周之末趙魏是宅冀土糜沸炫沄如湯更盛更衰載從載橫陪臣擅命天王是替趙魏相反秦拾其弊北築長城恢夏之場漢興定制改列藩王仰覽前世厥力孔多初安如山後崩如崖故治不忘亂安不忘危周宗自怙云焉有予隳六國奮矯果絕其維牧臣司冀敢告在階見蓺文類聚六初學記八古文苑青州箴茫茫青州海岱是極鹽鐵之地鉛松怪石群水攸歸萊夷作牧貢篚以時莫怠莫違昔在文武封呂于齊厥土塗泥在丘之營五侯九伯是討是征馬殆其銜御失其度周室荒亂小白以霸諸侯僉服復尊京師小白既沒周卒陵遲嗟茲天王附命下土失其法度喪其文武牧臣司青敢告執矩見藝文類聚六初學記八古文苑兗州箴悠悠濟河兗州之㝢九河既導雷夏攸處草繇木條漆絲絺紵濟漯既通降丘宅土成湯五徙卒都于毫盤庚北度牧野是宅丁感雊雉祖己伊忠爰正厥事遂緒高宗厥後陵遲顛覆湯緒西伯戡黎祖伊奔走致天威命不恐不震婦言是用牝雞司晨三仁既知武果戎殷牧野之禽豈復能耽甲子之朝豈復能笑有國雖久必畏天咎有民雖長必懼人殃箕子歔欷厥居為墟牧臣司兗敢告執書見蓺文類聚七初學記八古文苑徐州箴海岱伊淮東海是渚徐州之土邑于蕃宇大野既瀦有羽有蒙孤桐蠙珠泗沂攸同實列蕃蔽侯衛東方民好農蠶大野以康帝癸及辛不祗不恪沈愐于酒而忘其東作天命湯武勦絕其緒祚降周任姜鎮于琅邪姜氏絕苗田氏攸都事由細微不慮不圖禍如丘山本在萌牙牧臣司徐敢告僕夫見蓺文類聚六初學記八古文苑揚州箴夭矯揚州江漢之滸彭蠡既瀦陽鳥攸處橘柚羽貝瑤琨篠簜閩越北垠沅湘攸往獷矣淮夷蠢蠢荊蠻翩彼昭王南征不旋人咸躓于垤莫躓于山咸跌于汙莫跌于川明哲不云我昭童蒙不云我㗃湯武聖而師伊呂桀紂悖而誅逢干蓋邇不可不察遠不可不親靡有孝而逆父罔有義而忘君太伯遜位基吳紹類夫差一誤太伯無祚周室不匡句踐入霸當周之隆越裳重譯春秋之末侯甸叛逆元首不可不思股肱不可不孳堯崇屢省舜盛欽謀牧臣司揚敢告執籌見蓺文類聚六初學記八御覽九百七十古文苑荊州箴杳杳巫山在荊之陽江漢朝宗其流湯湯夏君遭鴻荊衡是調雲夢塗泥包匭菁茅金玉砥礪象齒元龜貢篚百物世世以饒戰戰慄慄至桀荒溢曰我在帝位若天有日不順庶國孰敢余奪亦有成湯果秉其鉞放之南巢號之以桀南巢茫茫多楚與荊風飄以悍氣銳以剛有道後服無道先強世雖安平無敢日豫牧臣司荊敢告執御見蓺文類聚六初學記八古文苑豫州箴郁郁荊河伊洛是經滎播枲漆惟用攸成田田相挐廬廬相距夏殷不都成周攸處豫野所居爰在鶉墟四隩咸宅寓內莫如陪臣執命不慮不圖王室陵遲喪其爪牙靡哲靡聖捐失其正方伯不維韓卒擅命文武孔純至厲作昏成康孔寍至幽作傾故有天下者毋曰我大莫或余敗毋曰我強靡克余亡夏宅九州至于季世放于南巢成康太平降及周微帶蔽屏營屏營不起施于孫子王赧為極實絕周祀牧臣司豫敢告柱史見蓺文類聚七初學記八古文苑益州箴巖巖岷山古曰梁州華陽西極黑水南流茫茫洪波鯀湮降陸于時八都厥民不隩禹導江沱岷嶓啟乾遠近底貢磬錯砮丹絲麻條畼有粳有稻自京徂畛民攸溫飽帝有桀紂湎沈頗僻遏絕苗民滅夏殷績爰周受命復古之常幽厲夷業破絕為荒秦作無道三方潰叛義兵征暴遂國于漢拓開疆宇恢梁之野列為十二光羨虞夏牧臣司梁是職是圖經營盛衰敢告士夫見蓺文類聚六初學記八古文苑雍州箴黑水西河橫截崑崙邪指閶闔畫為雍垠上侵積石下礙龍門自彼氐羌莫敢不來庭莫敢不來臣每在季主常失厥緒侯紀不貢荒侵其寓陵遲衰微秦據以戾興兵山東六國顛沛上帝不寍命漢作京隴山以徂列為西荒南排勁越北啟彊胡并連屬國一護攸都蓋安不忘危盛不諱衰牧臣司雍敢告贅衣見蓺文類聚六初學記八古文苑案初學記八又割分此為涼州箴幽州箴蕩蕩平川惟冀之別北阸幽都戎夏交偪伊昔唐虞實為平陸周末荐臻迫于獯鬻晉溺其陪周使不阻六國擅權燕趙本都東限穢貊羨及東胡強秦北排蒙公城疆大漢初定分狄之荒元戎屢征如風之騰義兵涉漠偃我邊萌既定且康復古虞唐盛不可不圖衰不可或忘隄潰蟻穴器漏箴芒牧臣司幽敢告侍旁見蓺文類聚六初學記八古文苑并州箴雍別朔方河水悠悠北辟獯鬻南界涇流畫茲朔土正直幽方自昔何為莫敢不來貢莫敢不來王周穆遐征犬戎不享爰貊伊德侵玩上國宣王命將攘之涇北宗幽罔識日用爽蹉既不俎豆又不干戈犬戎作難斃于驪阿太上曜德其次曜兵德兵俱顛靡不悴荒牧臣司并敢告執綱見蓺文類聚六初學記八古文苑交州箴交州荒裔水與天際越裳是南荒國之外爰自開闢不羈不絆周公攝祚白雉是獻昭王陵遲周室是亂越裳絕貢荊楚逆叛四國內侵蠶食周京臻于季赧遂以滅亡大漢受命中國兼該南海之宇聖武是恢稍稍受羈遂臻黃支杭海三萬來牽其犀盛不可不憂隆不可不懼顧瞻陵遲而忘其規摹亡國多逸豫而存國多難泉竭中虛池竭瀨乾牧臣司交敢告執憲見蓺文類聚六初學記八古文苑司空箴普彼坤靈侔天作則分制五服畫為萬國乃立地官空惟是職茫茫九州都鄙盈區綱以群牧綴以方侯烈烈雋乂翼翼王臣臣當其官官當其人九十之政七賦以均昔在季葉班祿遺賢掊克充朝而象恭滔天匪人斯力匪政斯敕流貨市寵而苞苴是鬻王路斯荒孰不傾覆空臣司土敢告在側見蓺文類聚四十七作揚雄初學記十一作崔駰古文苑作揚雄注云一作崔駰案文選西都賦注引首二句作揚雄尚書箴皇皇聖哲允敕百工命作齋慄龍惟納言是機是密出入王命王之喉舌獻善宣美而讒說是折我視云明我聽云聰載夙載夜惟允惟恭故君子在室出言如風動于民人渙其大號而萬國平信春秋譏漏言易稱不密則失臣兌吉其和巽吝其頻書稱其明申申厥鄰昔秦尚權詐官非其人符璽竊發而扶蘇隕身一姦愆命七廟為墟威福同門床上維辜書臣司命敢告侍隅見蓺文類聚四十八作揚雄古文苑作崔瑗注云一作揚雄大司農箴時維大農爰司金穀自京徂荒粒民是斛肇自厥功實施惟食厥僚后稷有無遷易實均實嬴惟都作程旁施衣食厥民攸生上稽二帝下閱三王什一而征為民作常遠近貢篚百則不忘帝王之盛實在農植季周爛熳而東作不敕膏腴不穫庶物竝荒府庫殫虛靡積倉箱陵遲衰微周卒以亡秦收大半二世不瘳泣血之求海內無聊農臣司均敢告執繇見蓺文類聚四十九初學記十二古文苑侍中箴光光常伯儵儵貂璫見文選曹植責躬詩注劉琨贈盧諶詩注光祿勳箴經兆宮室畫為中外廊殿門闥限以禁衛國有固衛人有藩籬各有攸保守以不岐昔在夏殷桀紂淫湎符牛之飲門戶荒亂郎雖執戟謁者參差殿中成市或室內鼓鼙忘其廊廟而聚夫逋逃四方多罪載號載呶內不可不省外不可不清德人立朝義士充庭祿臣司光敢告執經見初學記十二古文苑大鴻臚箴蕩蕩唐虞經通垓極陶陶百王天工人力畫為上下羅條百職人有材能寮有級差遷能授官各有攸宜主以不廢官以不隳昔在三代二季不蠲穢德慢道署非其人人失其材職反其官寀寮荒耄國政如漫文不可武武不可文大小上下不可奪倫鴻臣司爵敢告在鄰見蓺文類聚四十九初學記十二古文苑宗正卿箴巍巍帝堯欽親九族經哲宗伯禮有攸訓屬有攸籍各有育子代以不錯昔有夏時少康不恭有仍二女五子家降晉獻悖統宋宣亂序齊桓不胤而忘其宗緒周譏戎女魯喜子同高作秦祟而扶蘇被凶宗廟荒墟魂靈靡附伯臣司宗敢告執主見初學記十二古文苑衛尉箴茫茫上天崇高其居設置山險畫為防禦重垠累垓以難不律闕為城衛以待暴卒國以有固民以有內各保其守永修不敗維昔庶僚官得其人荷戈而歌中外以堅齊桓怵惕宿衛不敕門非其人戶廢其職曹子摽劍遂成其詐軻挾匕首而衛人不寤二世妄宿敗于望夷閰樂矯詔戟者不推尉臣司衛敢告執維見蓺文類聚四十九初學記十二太僕箴肅肅太僕車馬是供鏘鏘和鑾駕彼時龍昔在二帝巡狩四宅王用三驅前禽是射紂作不令武王征殷檀車孔夏四騵孔昕僕夫執鞗載騂載駰我輿云安我馬云閑雖馳雖驅匪逸匪愆昔有淫羿馳騁忘歸景公千駟而淫于齊詩好牡馬牧于坰野輦車就牧而詩人興魯廄焚問人仲尼厚醜孟子蓋惡夫廄多肥馬而野有餓殍僕臣司駕敢告執皁見蓺文類聚四十九初學記十二古文苑廷尉箴天降五刑維夏之績亂茲平民不回不僻昔在蚩尤爰作淫刑延于苗民夏氏不寍穆王耄荒甫侯伊謨五刑訓天周以阜基厥後陵遲上帝不孤周輕其制秦繁其辜五刑紛紛靡遏靡止寇賊滿山刑者半市昔在唐虞象刑天民是全紂作炮烙墜人于淵故有國者無云何謂是刖是劓無云何害是剝是割惟虐惟殺人其莫泰殷以刑顛秦以酷敗獄臣司理敢告執謁見蓺文類聚四十九初學記十二古文苑太常箴翼翼太常實為宗伯穆穆靈祗寢廟奕奕稱秩元祀班于群神我祀既祗我粢孔蠲匪愆匪忒公尸攸宜弗祈弗求惟德之報不矯不誣庶無罪悔昔在成湯曷為不弔棄禮慢祖夔子不祀楚師是虜魯人躋僖臧文不悟文隳太室桓納郜賂災降二宮用誥不祧故聖人在位無曰我貴慢行繁祭無曰我材輕身恃巫東鄰之犧牛不如西鄰之麥魚秦殞望夷隱斃鍾巫常臣司宗敢告執書見蓺文類聚四十九作揚雄初學記十二作崔駰古文苑作崔駟注云一作揚雄少府箴實實少府奉養是供紀經九品臣子攸同海內帑孥祁祁如雲家有孝子官有忠臣共僚率舊聖則越遵民以不擾國以不煩昔在帝季癸辛之世酒池糟隄而象箸以噬至于躭樂流湎而妲末作崇共寮不御不恢夏殷喪其國康而卒以陵遲嗜不可不察欲不可不圖未嘗失之于約常失于奢府臣司共敢告執觚見古文苑執金吾箴溫溫唐虞重襲純孰經表九德張設武官以御寇賊如虎有牙如鷹有爪國以自固獸以自保牙爪葸葸動作宜時用之不理實反生災秦政暴戾播其威虐亡其仁義而思其殘酷猛不可重任威不可獨行堯咨虞舜惟思是尚吾臣司金敢告執璜見古文苑將作大匠箴侃侃將作經構宮室牆以禦風宇以蔽日寒暑攸除鳥鼠攸去王有宮殿民有宅居昔在帝世茅茨土階夏卑宮觀在彼溝洫桀作瑤臺紂為璇室人力不堪而帝業不卒詩詠宣王由儉改奢觀豊上六大屋小家春秋譏刺書彼泉臺兩觀雉門而魯以不恢或作長府而閔子以仁秦築驪阿嬴姓以顛故人君無云我貴榱題是遂毋云我富淫作極遊在彼牆屋而忘其國戮作臣司匠敢告執猷見蓺文類聚四十九古文苑城門校尉箴幽幽山川徑塞九路盤石唐芒襲險重固國有城溝家有柝柜各有攸堅民以不虞德懷其內險難其外王公設險而承以盤蓋昔在上世有殷有夏癸辛不德而設夫險阻湯武爰征而莫遏莫禦作君之危不可德少而城溝伊保不可德希而城溝是依唐虞長德而四海永懷秦恢長城而天下畔乖尉臣司城敢告在階見古文苑太史令箴昔在太古爰初肇記天地之紀重黎是司降及唐虞乃命羲和欽若昊天百政攸宜夏帝不慎羲和不令湎時亂日帝旅爰征庶寮至殷唯天為難夏氏黷德而明神不蠲見御覽二百三十五博士箴洋洋三代典禮是修畫為辟雍國有學校侯有泮宮各有攸教德用不陵昔在文王經營其軌勖于德音而思皇多士多士作楨惟周以寍國人興讓虞芮質成公劉挹行潦而濁亂斯清官操其業士執其經昔聖人之綏俗莫美于施化故孔觀夫人之學而知為王之易大舜南面無為而衽席平還師階級之閒三苗以懷秦作無道軌決天紀漫彼王迹而坑夫術士詩書是泯家言是守俎豆不陳而顛其社稷故仲尼不對問陳而胡簋是遵原伯非學而閔子知周之不振儒臣司典敢告在賓見蓺文類聚四十六作揚雄古文苑作崔瑗國三老箴負乘覆餗姦寇侏張見文選劉琨荅盧諶詩注太樂令箴陶陶五帝設為六樂笙磬既同鍾鼓羽籥周序神人協于萬國見北堂書鈔未刪改本五十五案陳禹謨本無首二句太官令箴時惟膳夫實司王饔祁祁庶羞口實是供群物百品八珍清觴以御賓客以膳于王見御覽二百二十九上林苑令箴茫茫大田芃芃作穀山有徑陸野有林麓夷原汙藪禽獸攸伏魚鼈以時芻蕘咸殖國以殷富民以家給昔在帝羿共田徑游弧矢是尚而射夫封豬不顧于愆卒遇後憂是以田獲三驅不可過差麀鹿攸伏不如德至衡臣司虞敢告執指見古文苑御覽二百三十二元后誄新室文母太后崩天下哀痛號哭涕泗思慕功德咸上柩誄之銘曰惟我有新室文母聖明皇太后姓出黃帝西陸昌意實生高陽純德虞帝孝聞四方登陟帝位禪受伊唐爰初胙土陳田至王營相厥宇度河濟旁沙麓之靈太陰之精天生聖姿豫有祥禎作合于漢配元生成孝順皇姑聖敬齊莊內則純備後烈丕光肇初配元天命是將兆徵顯見新都黃龍漢成既終胤嗣匪生哀帝承祚惟離典經尚是言異大命俄顛厥年夭隕大終不盈文母覽之千載不傾博選大智新都宰衡明聖作佐與圖國艱以度戹運徵立中山庶其可濟博采淑女備其姪娣覲禮高禖祈廟嗣繼靡格匪天靡動匪地穆穆明明昭事上帝弘漢祖考夙夜匪懈興滅繼絕博立侯王親睦庶族昭穆序明帝致支屬靡有遺荒咸被祚慶冀以金火赤仍有央勉進大聖上下兼該群祥眾瑞正我黃來火德將滅惟后于斯天之所壞人不敢支哀平夭折百姓分離祖宗之愆終其不全天命有託謫在于前屬遭不造榮極而遷皇天眷命黃虞之孫歷世運移屬在聖新代于漢劉受祚于天漢祖受命赤傳于黃攝帝受禪立為真皇允受厥中以安黎眾漢祖黜廢移定安公皇皇靈祖惟若孔臧降茲珪璧命服有常為新帝母鴻德不忘欽德伊何奉命是行菲薄服食神祗是崇尊不虛統惟祗惟庸隆循人敬先民是從承天祗家允恭虔恪豐阜庶卉旅力不射恤民于留不皇詭作別計千邑國之是度還奉于此以處貧薄罷苑置縣築里作宅以處貧窮哀此嫠獨起常盈倉五十萬斛為諸生儲以勸好學志在黎元是勞是勤春巡灞滻秋臻黃山夏撫樗杜冬卹涇樊大射饗飲飛羽之門綏宥耆幼不拘婦人刑女歸家以育貞信玄冥季冬搜狩上蘭寅賓出日東秩暘谷鳴鳩拂羽勝降桑木蠶于繭館躬執筐曲帥導群妾咸脩蠶蔟分繭理絲女工是敕遐邇蒙祉中外禔福自京逮海靡不仰德成類存生秉天地經無物不理無人不寍尊號文母與新有成世奉長壽靡墮有傾著德太常注諸旒旌鳴呼哀哉以昭鴻名享國六十殂落而崩四海傷懷擗踊拊心若喪考妣遏密八音鳴呼哀哉萬方不勝德被海表彌流魂精去此昭昭就彼冥冥忽兮不見超兮西征既作下宮不復故庭爰緘伊銘鳴呼哀哉見蓺文類聚十五古文苑琴清英昔者神農造琴以定神禁婬嬖去邪欲反其真者也舜彈五絃之琴而天下治堯加二絃以合君臣之恩也見通典一百四十四御覽五百七十七尹吉甫子伯奇至孝後母譖之自投江中衣苔帶藻忽夢見水仙賜其美藥思惟養親揚聲悲歌船人聞而學之吉甫聞船人之聲疑似伯奇援琴作子安之操見水經注三十三江水一御覽五百七十八雉朝飛操者衛女傅母之所作也衛侯女嫁于齊太子中道問太子死問傅母曰何如傅母曰且往當喪喪畢不肯歸終之以死傅母悔之取女所自操琴于冢上鼓之忽有二雉俱出墓中傅母撫雌雉曰女果為雉邪言未畢俱飛而起忽然不見博母悲痛援琴作操故曰雉朝飛見蓺文類聚九十御覽五百七十八九百十七又見郭茂倩樂府晉王謂孫息曰子鼓琴能令寡人悲乎息曰令處高臺邃宇連屋重戶藿肉漿酒倡樂在前難可使悲者乃謂少失父母長無兄嫂當道獨坐暮無所止于此者乃可悲耳乃援琴而鼓之晉王酸心哀涕曰何子來遲也見御覽五百七十七祝牧與妻偕隱作琴歌云天下有道我黼子佩天下無道我負子戴見馬驌繹史家牒子雲以甘露元年生以天鳳五年卒葬安陵阪上所厚沛郡桓君山平陵如子禮弟子鉅鹿侯芭共為治喪諸公遺世子朝臣郎吏行事者會送桓君山為斂賻起祠塋侯芭負土作墳號曰玄冢見蓺文類聚四十御覽五百五十八竝引楊雄家牒案家牒不知何人時所譔今附載揚雄集後
