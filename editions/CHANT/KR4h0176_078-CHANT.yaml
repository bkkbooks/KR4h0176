body:
  text: 劉立聞翟義舉兵上書願備軍吏為國討賊內報私怨見漢書翟方進傳上言宜益安漢公國邑春秋天子將娶於紀則襃紀子稱侯安漢公國未稱古制見漢書王莽傳上上書言莽宜居攝周成王幼少稱孺子周公居攝今帝富於春秋宜令安漢公行天子事如周公見漢書王莽傳上上書言齊郡新井七月中齊郡臨淄縣昌興亭長辛當一暮數夢曰吾天公使也天公使我告亭長曰攝皇帝當為真即不信我此亭中當有新井亭長晨起視亭中誠有新井見漢書王莽傳上駁息夫躬謀閒匈奴議中國常以威信懷伏夷狄躬欲逆詐造不信之謀不可許且匈奴賴先帝之德保塞稱蕃今單于以疾病不任奉朝賀遣使自陳不失臣子之禮臣祿自保沒身不見匈奴為邊竟憂也見漢書息夫躬傳議禽賊方略太史令宗宣典星曆侯氣變以凶為吉亂天文誤朝廷太傅平化侯飾虛偽以媮名位賊夫人之子國師嘉信公顛倒五經毀師法令學士疑惑明學男張邯地理侯孫陽造井田使民棄土業犧和魯匡設六筦以窮工商說符侯崔發阿諛取容令下情不上通宜誅此數子以慰天下見漢書王莽傳下匈奴不可攻當與和親臣恐新室憂不在匈奴而在封域之中也同上奏廢劉氏西域將欽上言九月辛巳戊己校尉史陳良終帶共賊殺校尉刀護劫略吏士自稱廢漢大將軍亡入匈奴又今月癸酉不知何一男子遮臣建車前自稱漢氏劉子輿成帝下妻子也劉氏當復趣空宮收繫男子即常安姓武字仲皆逆天違命大逆無道請論仲及陳良等親屬當坐者奏可漢氏高皇帝比著戒云罷吏卒為賓食誠欲承天心全子孫也其宗廟不當在常安城中及諸劉為諸侯者當與漢俱廢陛下至仁久未定前故安眾侯劉崇徐鄉侯劉快陵鄉俟劉曾扶恩侯劉貴等更聚眾謀反今狂狡之虜或妄自稱亡漢將軍或稱成帝子子輿至犯夷滅連未止者此聖恩不蚤絕其萌牙故也臣愚以為漢高皇帝為新室賓享食明堂成帝異姓之兄弟平帝壻也皆不宜復入其廟元帝與皇太后為體聖恩所隆禮亦宜之臣請漢氏諸廟在京師者皆罷諸劉為諸侯者以戶多少就五等之差其為吏者皆罷待除于家上當天心稱高皇帝神靈塞狂狡之萌見漢書王莽傳中劾奏昆彌使者夷狄以中國有禮誼故詘而服從大昆彌君也今序臣使於君使之上非所以有夷狄也奉使大不敬見漢書王莽傳中上哀帝疏請復師丹邑爵竊見免大司空丹策書泰深痛切君子作文為賢者諱丹經為世儒宗德為國黃耇親傅聖躬位在三公所坐者微海內未見其大過事既已往免爵大重京師識者咸以為宜復丹邑爵使奉朝請四方所瞻卬也唯陛下財覽眾心有以尉復師傅之臣見漢書師丹傳奏事秦設重刑而群盜盈山赤衣半道見初學記二十刑罰引漢名臣奏事劾奏金欽欽幸得以通經術超擢侍帷幄重蒙厚恩封襲爵號知聖朝以世有為人後之誼前遭故定陶太后背本逆天孝哀不獲厥福迺者呂寬衛寶復造姦謀至于反逆咸伏厥辜太皇太后懲艾悼懼逆天之咎非聖誣法大亂之殃誠欲奉承天心遵明聖制專壹為後之誼以安天下之命數臨正殿延見群臣講習禮經孫繼祖者謂亡正統持重者也賞見嗣日磾後成為君持大宗重則禮所謂尊祖故敬宗大宗不可以絕者也欽自知與當俱拜同誼即數揚言殿省中教當云云當即如其言則欽亦欲為父明立廟而不入夷侯常廟矣進退異言頗惑眾心亂國大綱開禍亂源誣祖不孝罪莫大焉尢非大臣所宜大不敬秺侯當上母南為太夫人失禮不敬見漢書金日磾傳劾奏陳遵遵兄弟幸得蒙恩超等歷位遵爵列侯備郡守級州牧奉使皆以舉直察枉宣揚聖化為職不正身自慎始遵初除乘藩車入閭巷過寡婦左阿君置酒歌謳遵起舞跳梁頓仆坐上暮因留宿為侍婢扶臥遵知飲酒飫宴有節禮不入寡婦之門而湛酒溷肴亂男女之別輕辱爵位羞汙印韍惡不可忍聞臣請皆免見漢書游俠陳遵傳奏為莽祠祖禰設騎從安漢公祠祖禰出城門城門校尉宜將騎士從入有門衛出有騎士所以重國也見漢書王莽傳上陳崇又奏奏可上書言破翟義陛下奉天洪範心合寶龜膺受元命豫知成敗咸應兆占是謂配天配天之主慮則移氣言則動物施則成化臣崇伏讀詔書下日竊計其時聖思始發而反虜仍破詔文始書反虜大敗制書始下反虜畢斬眾將未及齊其鋒芒崇未及盡其愚慮而事已決矣見漢書王莽傳上奏請班莽戒八篇安漢公遭子宇陷于管蔡之辜子愛至深為帝室故不敢顧私惟宇遭辠喟然憤發作書八篇以戒子孫宜班郡國令學官以教授見漢書王莽傳上奏羌豪內屬羌豪良願等種人口可萬二千人願為內臣獻仙水海允谷鹽池平地美草皆予漢民自居險阻處為藩蔽問良願降意對曰太皇太后聖明安漢公至仁天下太平五穀成孰或禾長丈餘或一粟三米或不種自生或璽不蠶自成甘露從天下醴泉自地出鳳皇來儀神爵降集從四歲以來羌人無所疾苦故思樂內屬宜以時處業置屬國領護見漢書王莽傳上奏并石文武功長孟通浚井得白石上圓下方有丹書著石文曰告安漢公莽為皇帝見漢書王莽傳上令李業詣獄養病教賢者不避害譬猶彀弩射市薄命者先死聞業名稱故欲與之為治而反託疾乎令詣獄養病見後漢李業傳獻符命銅璧文太皇太后當為新室文母太皇太后見漢書元后傳慰志賦嘉昔人之遘辰兮美伊傅之遌時應規矩之淑質兮過班倕而裁之協準矱之貞度兮同斷金之玄策何天衢于盛世兮超千載而垂績豈修德之極致兮將天祚之攸適愍余生之不造兮丁漢氏之中微氛霓鬱以橫厲兮羲和忽以潛暉六柄制于家門兮王綱漼以陵遲黎共奮以跋扈兮羿浞狂以瓷雎睹嫚臧而乘釁兮竊神器之萬機思輔弼以媮存兮亦號咷以詶咨嗟三事之我負兮乃迫余以天威豈無熊僚之微介兮悼我生之殲夷庶明哲之末風兮懼大雅之所譏遂翕翼以委命兮受符守乎艮維恨遭閉而不隱兮違石門之高蹤揚蛾眉于復關兮犯孔戒之冶容懿氓蚩之悟悔兮慕白駒之所從乃稱疾而屢復兮歷三祀而見許悠輕舉以遠遁兮託峻峗以幽處竫潛思于至賾兮騁六經之奧府皇再命而紹卹兮乃云眷乎建武運欃槍以電埽兮清六合之土宇聖德滂以橫被兮黎庶愷以鼓舞闢四門以博延兮彼幽牧之我舉分畫定而計決兮豈云賁乎鄙耇遂懸車以縶馬兮絕時俗之進取歎莫春之成服兮闔衡門以埽軌聊優游以永日兮守姓命以盡齒貴啟體之歸全兮庶不忝乎先子見後漢崔駰傳奏高句驪事貉人犯法不從騶起正有它心宜令州郡且尉安之今猥被以大罪恐其遂畔夫餘之屬必有和者匈奴未克夫餘穢貉復起此大憂也見漢書王莽傳中諫立匈奴須卜當當在匈奴右部兵不侵邊單于動靜輒語中國此方面之大助也于今迎當置長安槀街一胡人耳不如在匈奴有益見漢書王莽傳下諫伐匈奴臣聞匈奴為害所從來久矣未聞上世有必征之者也後世三家周秦漢征之然皆未有得上策者也周得中策漢得下策秦無策焉當周宣王時獫允內侵至于涇陽命將征之盡境而還其視戎狄之侵譬猶蟁蝱之螫歐之而已故天下稱明是為中策漢武帝選將練兵約齎輕糧深入遠戍雖有克獲之功胡輒報之兵連禍結三十餘年中國罷耗匈奴亦創艾而天下稱武是為下策秦始皇不忍小恥而輕民力築長城之固延袤萬里轉輸之行起於負海疆境既完中國內竭以喪社稷是為無策今天下遭陽九之阸比年饑饉西北邊尤甚發三十萬眾具三百日糧東援海代南取江淮然後乃備計其道里一年尚未集合兵先至者聚居暴露師老械弊勢不可用此一難也邊既空虛不能奉軍糧內調郡國不相及屬此二難也計一人三百日食用糒十八斛非牛力不能勝牛又當自齎食加二十斛重矣故地沙鹵多乏水草以往事揆之軍出未滿百日牛必物故且盡餘糧尚多人不能負此三難也胡地秋冬甚寒春夏甚風多齎鬴鍑薪炭重不可勝食糒飲水以歷四時師有疾疫之憂是故前世伐胡不過百日非不欲久勢力不能此四難也輜重自隨則輕銳者少不得疾行虜徐遁逃勢不能及幸而逢虜又累輜重如遇險阻銜尾相隨虜要遮前後危殆不測此五難也大用民力功不可必立臣伏憂之今既發兵宜縱先至者令臣尤等深入霆擊且以創艾胡虜見漢書匈奴傳下三將軍論王翦為秦將滅燕燕王喜奔逃東夷秦王曰齊楚何先李信曰楚地廣齊地狹楚人勇齊人怯請先從事于易見御覽四百三十七白起平原君勸趙孝成王受馮亭王曰受之秦兵必至武安君必將誰能當之者乎對曰澠池之會臣察武安君小頭而面銳瞳子白黑分明視瞻不轉小頭而面銳者敢斷決也瞳子白黑分明者見事明也視瞻不轉者執志強也可與持久難與爭鋒廉頗之為人也勇鷙而愛士知難而忍恥與之野戰則不如持守足以當之王從其計見世說言語篇注銅匱檢署天帝行璽金匱圖見漢書王莽傳上赤帝行璽某傳予黃帝金策書上書言匈奴狀匈奴南將軍右伊秩訾將人眾寇擊諸國見漢書匈奴傳下上言虜犯邊捕虜生口虜犯邊者皆孝單于咸子角所為見漢書王莽傳中諫限田井田雖聖王法其廢久矣周道既衰而民不從秦知順民之心可以獲大利也故滅廬井而置阡陌遂王諸夏訖今海內未厭其敝今欲違民心追復千載絕迹雖堯舜復起而無百年之漸弗能行也天下初定萬民新附誠未可施行見漢書王莽傳中
