body:
  text: 劉玄到長安下詔大赦非王莽子他皆除其罪見漢書王莽傳下上書諫更始方今賊寇始誅王化未行百官有司宜慎其任夫三公上應台宿九卿下括河海故天工人其代之陛下定業雖因下江平林之埶斯蓋臨時濟用不可施之既安宜釐改制度更延英俊因才授爵以匡王國今公卿大位莫非戎陳尚書顯官皆出庸伍資亭長賊捕之用而當輔佐綱維之任唯名與器聖人所重今以所重加非其人望其毗益萬分興化致理譬猶緣木求魚升山採珠海內望此有以闚度漢祚臣非有憎疾以求進也但為陛下惜此舉厝敗材傷錦所宜至慮惟割既往謬妄之失思隆周文濟濟之美見後漢劉玄傳報馮異書軼本與蕭王首謀造漢結死生之約同榮枯之計今軼守洛陽將軍鎮孟津俱據機軸千載一會思成斷金唯湥達蕭王願進愚策以佐國安人見後漢馮異傳下書劉聖公聖公降者封長沙王過二十日勿受見後漢劉玄傳赤眉下書移檄州郡制詔部刺史郡太守曰朕孝成皇帝子子輿者也昔遭趙氏之禍因以王莽篡殺賴知命者將護朕躬解形河濱削迹趙魏王莽竊位獲罪于天天命祐漢故使東郡太守翟義嚴鄉侯劉信擁兵征討出入胡漢普天率土知朕隱在人閒南嶽諸劉為其先驅朕仰觀天文乃興于斯以今月壬辰即位趙宮休氣熏蒸應時獲雨蓋聞為國子之襲父古今不易劉聖公未知朕故且持帝號諸興義兵咸以助朕皆當裂土享祚子孫已詔聖公及翟太守亟與功臣詣行在所疑刺史二千石皆聖公所置未覩朕之沈滯或不識去就強者負力弱者惶惑今元元創痍已過半矣朕甚悼焉故遣使者班下詔書見後漢王昌傳上疏謝封代王臣芳過託先帝遺體棄在邊陲社稷遭王莽廢絕以是子孫之憂所宜共誅故遂西連羌戎北懷匈奴單于不忘舊德權立救助是時兵革竝起往往而在臣非敢有所貪覬期于奉承宗廟興立社稷是以久僭號位十有餘年罪宜萬死陛下聖德高明躬率眾賢海內賓服惠及殊俗以胏附之故赦臣芳罪加以仁恩封為代王使備北藩無以報塞重責冀必欲和輯匈奴不敢遺餘力負恩貸謹奉天子玉璽思望闕庭見後漢盧芳傳與諸將盟凡我同盟三十一將十有六姓允承天道興輔劉宗如懷姦慮明神殛之高祖文皇武皇俾墜厥命厥宗受兵族類滅亡見後漢隗囂傳移檄告郡國漢復元年七月己酉朔己巳上將軍隗囂白虎將軍隗崔左將軍隗義右將軍楊廣明威將軍王遵雲旗將軍周宗等告州牧部監郡卒正連率大尹尹尉隊大夫屬正屬令故新都侯王莽慢侮天地悖道逆理鴆殺孝平皇帝篡奪其位矯託天命偽作符書欺惑眾庶震怒上帝反戾飾文以為祥瑞戲弄神祇歌頌禍殃楚越之竹不足以書其惡天下昭然所共聞見今略舉大端以喻吏民蓋天為父地為母禍福之應各以事降莽明知之而冥昧觸冒不顧大忌詭亂天術援引史傳昔秦始皇毀壞謚法以一二數欲至萬世而莽下三萬六千歲之厤言身當盡此度循亡秦之軌推無窮之數是其逆天之大罪也分裂郡國斷截地絡田為王田賣買不得規錮山澤奪民本業造起九廟窮極土作發冢河東攻劫丘壟此其逆地之大罪也尊任殘賊信用姦佞誅戮忠正覆按口語赤車奔馳法冠晨夜冤繫無辜妄族眾庶行炮烙之刑除順時之法灌以醇醯裂以五毒政令日變官名月易貨幣歲改吏民昏亂不知所從商旅窮窘號泣市道設為六管增重賦斂刻剝百姓厚自奉養苞苴流行財入公輔上下貪賄莫相檢考民坐挾銅炭沒入鍾官徒隸殷積數十萬人工匠飢死長安皆臭既亂諸夏狂心益悖北攻強胡南擾勁越西侵羌戎東摘濊貊使四境之外竝入為害緣邊之郡江海之瀕滌地無類故攻戰之所敗苛法之所陷饑饉之所夭疾疫之所及以萬萬計其死者則露屍不掩生者則奔亡流散幼孤婦女流離係虜此其逆人之大罪也是故上帝哀矜降罰于莽妻子顛殞還自誅刈大臣反據亡形已成大司馬董忠國師劉歆衛將軍王涉皆結謀內潰司命孔仁納言嚴尤秩宗陳茂舉眾外降今山東之兵二百餘萬已平齊楚下蜀漢定宛洛據敖倉守函谷威命四布宣風中岳興滅繼絕封定萬國遵高祖之舊制修孝文之遺德有不從命武軍平之馳使四夷復其爵號然後還師振旅橐弓臥鼓申命百姓各安其所庶無負子之責見後漢隗囂傳下杜林令杜伯山天子所不能臣諸侯所不能友伯夷叔齊恥食周粟今且從師友之位須道開通使順所志見後漢杜林傳上書止討蜀三輔單弱劉文伯在邊未宜謀蜀見後漢隗囂傳復上書止討蜀蜀道危險棧閣敗絕丈尺之地側不得通述性嚴酷上下相患須其罪惡孰著大呼響應之勢也見袁宏後漢紀五上疏謝罪吏人聞大兵卒至驚恐自救臣囂不能禁止兵有大利不敢廢臣子之節親自追還昔虞舜事父大杖則走小杖則受臣雖不敏敢忘斯義今臣之事在于本朝賜死則死加刑則刑如遂蒙恩更得洗心死骨不朽見後漢隗囂傳又見袁宏後漢紀五有刪節說隗囂足下欲承天順民輔漢而起今立者乃在南陽王莽尚據長安雖欲以漢為名其實無所受命將何以見信于眾乎宜急立高廟稱臣奉祠所謂神道設教求助人神者也且禮有損益質文無常削地開兆茅茨土階以致其肅敬雖未備物神明其舍諸見後漢隗囂傳辭謝隗囂書足下將建伊呂之業弘不世之功而大事草創英雄未集以望異域之人疵瑕未露欲先崇郭隗想望樂毅故欽承大旨順風不讓將軍以至德尊賢廣其謀慮動有功發中權基業以定大勳方緝今俊乂竝會羽翮比肩望無耆耇之德而猥託賓客之上誠自愧也雖懷介然之節欲潔去就之分誠終不背其本貳其志也何則范蠡收責勾踐乘偏舟于五湖咎犯謝罪文公亦逡巡于河上夫以二子之賢勒銘兩國猶削迹歸愆請命乞身望之無勞蓋其宜也望聞鳥氏有龍池之山微徑南通與漢相屬其傍時有奇人聊及閑暇廣求其真願將軍勉之見後漢隗囂傳又見袁宏後漢紀小異說樊崇等更始荒亂政令不行故使將軍得至於此今將軍擁百萬之眾西向帝城而無稱號為群賊不可以久不如立宗室挾義誅伐以此號令誰敢不服見後漢劉盆子傳又見袁宏後漢紀三有刪節為隗囂游說河西更始事業已成尋復亡滅一姓不再興之效今即有所主便相係屬一旦拘制自令失柄後有危殆雖悔無及今豪傑競逐雌雄未決當各據其土宇與隴蜀合從高可為六國下不失尉佗見後漢竇融傳詔李業業起則授大位不起則賜鶴見袁宏後漢紀三說公孫述方今四海波蕩匹夫橫議軍割據千里地什湯武若奮威德以投天隙霸王之業成矣宜改名號以鎮百姓見後漢公孫述傳復說公孫述今山東饑饉人庶相食兵所屠滅城邑丘墟蜀地沃野千里土壤膏腴果實所生無穀而飽女工之業覆衣天下名材竹幹器械之饒不可勝用又有魚鹽銅銀之利浮水轉漕之便北據漢中杜褎斜之險東守巴郡拒扞關之口地方數千里戰士不下百萬見利則出兵而略地無利則堅守而力農東下漢水以窺秦地南順江流以震荊揚所謂用天因地成功之資今君王之聲聞於天下而名號未定志士狐疑宜即大位使遠人有所依歸見後漢公孫述傳說公孫述兵者帝王之大器古今所不能廢也昔秦失其守豪傑竝起漢祖無前人之迹立錐之地起于行陳之中躬自奮擊與項羽戰大小百餘兵破身困者數矣然猶不止故軍敗復合創愈復戰何則前死而成功踰于卻就于滅亡也隗囂遭遇運會割有雍州兵強士附威加山東遇更始政亂復失天下眾庶引領四方瓦解囂不及此時推危乘勝以爭天命而退欲為西伯之事尊師章句賓友處士偃武息戈卑辭事漢喟然自以文王復出也今漢帝釋關隴之憂專精東伐四分天下而有其三使西州豪杰咸居心于山東發閒使召攜貳則五分而有其四若舉兵天水必至沮潰是則然矣天水既定則九分而有其八陛下以梁州之地內奉萬乘外給三軍百姓愁困不堪上命將有王氏自潰之變臣之愚計以為宜與漢和親不者當及天下之望未絕豪杰尚可招誘急以此時發國內精兵令田戎據江陵臨江南之會倚巫山之固築壘堅守傳檄吳楚長沙以南必隨風而靡令延岑出漢中定三輔天水隴西拱手自服如海內震搖冀有大利見袁宏後漢紀六後漢公孫述傳昔湯以七十里王天下文王方百里臣諸侯其次漢祖敗而復征傷瘳復戰故能擒秦亡楚以弱為強況今地方數千杖戟百萬天下之心未有所歸不東出荊門北陵關隴與之進取則王業不全子孫不久安也見華陽國志五臨命戒子統吾綈褎中有先祖所傳祕記為漢家用爾其修之見後漢楊厚傳災異對諸王子多在京師容有非常宜亟發遣各還本國見後漢楊子傳又見續漢天文志中注補
