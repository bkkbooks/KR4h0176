body:
  text: 張禹上鄧太后表新野君不安車駕連日宿止臣等誠竊惶懼臣聞王者動設先置止則交戟清道而後行清室而後御離宮不宿所以重宿衛也陛下體烝烝之至孝親省方藥恩情發中久處單外百官露止識者所不安宜且還宮上為宗廟社稷下為萬國子民見後漢張禹傳奏事案令丞相奏事司直持案長史將簿中二千石奏事皆與其丞合緣以臣下各得盡心竭誠而事公明見御覽二百五十三引漢名臣奏臣聞天有三光以成其化方今三公之官不備丞相獨綱領天下萬事最眾多明不盡獨見誠非一人之所作也見書鈔五十引漢名臣奏事曰張禹奏上疏薦太子侍從臣伏見皇太子仁厚寬明發言高遠卓然絕異非人所能及也今平陽公主薨悲哀發中形體骨立恩愛惻隱世希是見臣愚淺不識大體以為宜選名儒高行以充師傅門訊起居之日太傅時賜讌所以宣德音以成聖德也侍中丁鴻仁而有讓達于從政謁者費惲資性敦篤遵令法度如竝侍左右必能發起微意增廣徽猷者也見袁宏後漢紀十上疏辭典郡臣愚以經術給事左右少不更職不曉文法猥當剖符典郡班政千里必有負恩辱位之咎臣竊私自分殊不慮出城闕冀蒙留恩託備宂官群僚所不安耳目所聞見不敢避好醜見後漢張酺傳上疏薦王青青三世死節宜蒙顯異見後漢張酺傳上疏平竇氏罪刑臣愚以為竇氏之事宜下理官與天下共平其罪恐後世不見其事竇氏盛時群臣莫不阿附唯恐在後皆以害為伊呂比鄧夫人于文母及陛下發雷電之怒皆以為罪不容誅何前後之相背也賴聖朝明達析其中伏見夏陽候瓌前為光祿勳每與臣相見常有勵節竭忠庶幾之心檢敕賓客未嘗犯法聞王政有三宥之義故蔡叔流言周公原本而誅臣愚以為可黜瓌爵關內侯還京師竭忠供養比陽主以優屬重示厚德見袁宏後漢紀十三臣實愚蠢不及大體以為竇氏雖伏厥辜而罪刑未著後世不見其事但聞其誅非所以垂示國典貽之將來宜下理官與天下平之方憲等寵貴群臣阿附惟恐不及皆言憲受顧命之託懷伊呂之忠至乃復比鄧夫人于文母今嚴威既行皆言當死不復顧其前後考折厥衷臣伏見夏陽侯瓖每存忠善前與臣言常有盡節之心檢敕賓客未嘗犯法臣聞王政骨肉之刑有三宥之義過厚不過薄今議者為瓌選嚴能相恐其迫切必不完免宜裁加貸宥以崇厚德見後漢張酺傳上言宜令刺史奏事如舊典臣聞王者法天熒惑奏事太微故州牧刺史入奏事所以通下問知外事也數十年以來重其道歸煩擾故時止勿奏事今因以為故事臣愚以為刺史視事滿歲可令奏事如舊典問州中風俗所好惡過所道事所聞見考課眾職下章所告及所自舉有意者賞異之其尤無狀逆詔書行罪法冀敕戒其餘令各敬慎所職于以衰滅貪邪姦佞見續漢百官志五注補引東觀書奏劾曹褎擅制漢禮破亂聖術宜加刑誅見後漢曹褎傳又見袁宏後漢紀十三敕子蕃顯節陵掃地露祭欲率天下以儉吾為三公既不能宣揚王化令吏人從制豈可不務節約乎其無起祠堂可作稾蓋廡施祭其下而已見後漢張酺傳又略見袁宏後漢紀十四日食上封事臣聞日者陽精守實不虧君之象也月者陰精盈毀有常臣之表也故日食者臣乘君陰陵陽月滿不虧下驕盈也昔周室衰季皇甫之屬專權于外黨類強盛侵奪主勢則日月薄食故詩曰十月之交朔月辛卯日有食之亦孔之醜春秋日食三十六弒君三十二變不空生各以類應夫威柄不以放下利器不以假人覽觀往古近察漢興傾危之禍靡不由之是以三桓專魯田氏擅齊六卿分晉諸呂握權統嗣幾移哀平之末廟不血食故雖有周公之親而無其德不得行其勢也今大將軍雖欲敕身自約不敢僭差然而天下遠近皆惶怖承旨刺史二千石初除謁辭求通待報雖奉符璽受臺敕不敢便去久者至數十日背公室向私門此迺上威損下權盛也人道悖于下效驗見于天雖有隱謀神照其情垂象見戒以告人君閒者月滿先節過望不虧此臣驕溢背君專功獨行也陛下未深覺悟故天重見戒誠宜畏懼以防其禍詩云敬天之怒不敢戲豫若敕政責躬杜漸防萌則凶妖銷滅害除福湊矣夫壞崖破巖之水源自涓涓干雲蔽日之木起于葱青禁微則易救末者難人莫不忽于微細以致其大恩不忍誨義不忍割去事之後未然之明鏡也臣愚以為左官外附之臣依託權門傾覆諂諛以求容媚者宜行一切之誅閒者大將軍再出威振州郡莫不賦斂吏人遣使貢獻大將軍雖云不受而物不還主部署之吏無所畏憚縱行非法不伏罪辜故海內貪猾競為姦吏小民吁嗟怨氣滿腹臣聞天不可以不剛不剛則三光不明王不可以不彊不彊則宰牧從橫宜因大變改政匡失以塞天意見後漢丁鴻傳又略見袁宏後漢紀十三又御覽四百五十三引東觀記上言舉孝廉用口率凡口率之科宜有階品蠻夷錯雜不得為數自今郡國率二十萬口歲舉孝廉一人四十萬二人六十萬三人八十萬四人百萬五人百二十萬六人不滿二十萬二歲一人不滿十萬三歲一人見後漢丁鴻傳奏東巡瑞應臣聞古帝王統治天下五載巡狩至于岱宗柴祭于天望秩山川協時月正日同斗斛權衡使人不爭陛下尊履蒸蒸奉承弘業祀五帝于明堂配以光武二祖四宗咸有告祀膽望太山嘉澤降澍柴祭之日白氣上升與燎烟合黃鵠群翔所謂神人以和答響之休符也見後漢丁鴻傳注引東觀記與弟盛書鴻貪經書不顧恩義弱而隨師生不供養死不飯唅皇天先祖竝不祐助身被大病不任茅土前上疾狀願辭爵仲公章寢不報迫且當襲封謹自放棄逐求良醫如遂不廖永歸溝壑見後漢丁鴻傳又見袁宏後漢紀十三果賦冬實之杏春熟之甘見御覽九百六十八上書請宥劉愷孔子稱能以禮讓為國于從政乎何有竊見居巢侯劉般嗣子愷素行孝友謙讓絜清讓封弟憲潛身遠迹有司不原樂善之心而繩以循常之法懼非長克讓之風成含弘之化前世扶陽侯韋玄成近有陵陽侯丁鴻鄳侯鄧彪竝以高行潔身辭爵未聞貶削而皆登三事今愷景仰前修有伯夷之節宜蒙矜宥全其先功以增聖朝尚德之美見後漢劉愷傳條奏左氏長義臣謹擿出左氏三十事尤著明者斯皆君臣之正義父子之紀綱其餘同公羊者十有七八或文簡小異無害大體至如祭仲紀季伍子胥叔術之屬左氏義深于君父公羊多任于權變其相殊絕固以甚遠而冤抑積久莫肯分明臣以永平中上言左氏與圖讖合者先帝不遺芻蕘省納臣言寫其傳詁藏之祕書建平中侍中劉歆欲立左氏不先暴論大義而輕移太常恃其義長詆挫諸儒諸儒內懷不服相與排之孝哀皇帝重逆眾心故出歆為河內太守從是攻擊左氏遂為重讎至光武皇帝奮獨見之明興立左氏穀梁會二家先師不曉圖讖故令中道而廢凡所以存先王之道者要在安上理民也今左氏崇君父卑臣子強幹弱枝勸善戒惡至明至切至直至順且三代異物損益隨時故先帝博觀異家各有所採易有施孟復立梁丘尚書歐陽復有大小夏侯今三傳之異亦猶是也又五經家皆無以證圖讖明劉氏為堯後者而左氏獨有明文五經家皆言顓頊代皇帝而堯不得為火德左氏以為少昊代黃帝即圖讖所謂帝宣也如令堯不得為火則漢不得為赤其所發明補益實多陛下通天然之明建大聖之本改元正歷垂萬世則是以麟鳳百數嘉瑞雜遝猶朝夕恪勤游情六蓺研機綜微靡不審覈若復留意廢學以廣聖見庶幾無所遺失矣見後漢賈逵傳永平頌威震赤谷見書鈔十三連珠夫君人者不飾不美不足以一民見文選景福殿賦注建初元年大旱上書臣聞善善及子孫惡惡止其身百王常典不易之道也秦政酷烈違啎天心一人有罪延及三族高祖平亂約法三章太宗至仁除去收孥萬姓廓然蒙被更生澤及昆蟲功垂萬世陛下聖明德被四表今以比年久旱災疫未息躬自菲薄廣訪失得三代之隆無以加焉臣竊按春秋水旱之變皆應暴急惠不下流自永平以來仍連大獄有司窮考轉相牽引掠拷冤濫家屬徙邊加以北征匈奴西開三十六國頻年服役轉輸煩費又遠屯伊吾樓蘭車師戊己民懷土思怨結邊域傳曰安土重居謂之眾庶昔殷民近遷洛邑且猶怨望何況去中土之肥饒寄不毛之荒極乎且南方暑濕障毒互生愁困之民足以感動天地移變陰陽矣陛下留念省察以濟元元見後漢楊終傳復上書秦築長城功役繁興胡亥不革卒亡四海故孝元棄珠崖之郡光武絕西域之國不以介鱗易我衣裳魯文公毀泉臺春秋譏之曰先祖為之而己毀之不如勿居而已以其無妨害于民也襄公作三軍昭公舍之君子大其復古以為不舍則有害于民也今伊吾之役樓蘭之屯久而未還非天意也見後漢楊終傳上言宜令諸儒論考五經同異宣帝博徵群儒論定五經于石渠閣方今天下少事學者得成其業而章句之徒破壞大體宜如石渠故事永為後世則見後漢楊終傳戒衛尉馬廖書終聞堯舜之民可比屋而封桀紂之民可比屋而誅何者堯舜為之隄防桀紂示之驕奢之故也詩曰皎皎練絲在所染之上智下愚謂之不移中庸之流要在教化春秋殺太子母弟直稱君甚惡之者坐失教也禮制人君之子年八歲為置少傅教之書計以開其明十五置太傅教之經典以道其志漢興諸侯王不力教誨多觸禁忌故有亡國之禍而乏嘉善之稱今君位地尊重海內所望豈可不臨深履薄以為至戒黃門郎年幼血氣方盛既無長君退讓之風而要結輕狡無行之客縱而莫誨視成任性鑒念前往可為寒心君侯誠宜以臨深履薄為戒見後漢楊終傳五經宜為章句疏臣聞詩書禮樂定自孔子發明章句始於子夏其後諸家分析各有異說漢承亂秦經典廢絕本文略存或無章句收拾缺遺建立明經博徵儒術開置太學孔聖既遠微旨將絕故立博士十有四家設甲乙之科以勉勸學者所以示人好惡改敝就善者也伏見太學試博士弟子皆以意說不修家法私相容隱開生姦路每有策試輒興諍訟論議紛錯互相是非孔子稱述而不作又曰吾猶及史之闕文疾史有所不知而不肯闕也今不依章句妄生穿鑿以遵師為非義意說為得理輕侮道術浸以成俗誠非詔書實選本意改薄從忠三代常道專精務本儒學所先臣以為博士及甲乙策試宜從其家章句開五十難以試之解釋多者為上引文明者為高說若不依先師義有相伐皆正以為非五經各取上第六人論語不議射策雖所失或久差可矯革見後漢徐防傳試論語本文章句但通度勿以射策冀令學者務本有所一心專精師門思核經意事得其實道得其真于此弘廣術尊重聖業有益于化雖從來久大經衰微學門寖淺誠宜反本改矯其失見後漢徐防傳注引東觀記上封事言赦宜及亡命聖恩所以減天下死罪使戍邊者欲實疆境而重人命也去死就生與老弱復相見莫不歡喜自丙子以來犯罪者甚多應入重論今已牢獄者蒙更生之恩也而始被執錄者獨受大辟之刑示不均也書曰王道蕩蕩無偏無黨均大恩以令民見袁宏後漢紀十二聖恩所以減死罪使戍邊者重人命也今死罪亡命無慮萬人又自赦以來捕得甚眾而詔令不及皆當重論伏惟天恩莫不蕩宥死罪以下竝蒙更生而亡命捕得獨不沾澤臣以為赦前犯死罪而繫在赦後者可皆勿笞詣金城以全人命有益于邊見後漢郭躬傳上疏劾竇瓌臣聞臧文仲之事君也見有禮于君者事之如孝子之養父母見無禮于君者誅之如鷹鸇之逐鳥雀案夏陽侯瓌本出輕薄志在邪僻學無經術而妄搆講舍外招儒徒實會姦桀輕忽天威侮慢王室又造作巡狩封禪之書惑眾不道當伏誅戮而主者營私不為國計夫涓流雖寡浸成江河灂火雖微卒能燎野履霜有漸可不懲革宜尋呂產專竊之亂永惟王莽篡逆之禍上安社稷之計下解萬夫之惑見後漢酷吏周紆傳上疏言諸竇臣聞百王之失咸以陰盛凌陽而權移于下大臣專朝而勢去公室未有君德休明而臣下闚𨵦主一其柄而社稷傾危者伏念先帝聖德未永蚤早棄萬國陛下富于春秋纂承大業今諸舅執政外戚盈朝非所以寧王室示天下也經曰夫天地乘互則眾生大傷君臣失序則萬民受殃政失不救其極不測當今所急上宜以義自割下宜以謙自引四舅可長爵土之榮皇太后永無慚負宗廟之憂誠計之上者見袁宏後漢紀十三後漢樂恢傳各有刪節今合錄之上書諫征匈奴春秋之義王者不理夷狄得其地不可墾發得其人無益于政故明王之于夷狄羇縻而已孔子曰遠人不服則脩文德以來之以漢之盛不務脩舜禹周公之德而無故興干戈動兵革以求無用之物臣誠惑之見後漢樂恢傳注引東觀記拜騎都尉上書辭謝仍受厚恩無以報效夫政在大夫孔子所疾世卿持權春秋以戒聖人懇惻不虛言也近世外戚富貴必有驕溢之敗今陛下思慕山陵未遑政事諸舅寵盛權行四方若不能自損誅罰必加臣壽命垂盡臨死竭愚惟蒙留神見後漢樂恢傳答潁川杜安書干主求祿非平生操也見袁宏後漢紀十三建初元年大旱上疏臣聞為不善而災報得其應也為善而災至遭時運也陛下即位日新視民如傷而不幸耗旱時運之會爾非政教之所致也昔成湯遭旱因自責省故散積減御損膳而大有年意者陛下未為成湯之事焉見孔叢子連叢上又見續漢五行志一注補上書自訟臣之愚意以為凡言誹謗者謂實無此事而虛加誣之也至如孝武皇帝政之美惡顯在漢史坦如日月是為直說書傳實事非虛謗也夫帝者為善則天下之善咸歸焉其不善則天下之惡亦萃焉斯皆有以致之故不可以誅于人也且陛下即位以來政教未過而德澤有加天下所具也臣等獨何譏刺哉假使所非實是則固應悛改儻其不當亦宜含容又何罪焉陛下不推原大數深自為計徒肆私忿以快其意臣等受戮死即死耳顧天下之人必回心易慮以此事闚陛下心自今以後苟見不可之事終莫復言者矣臣之所以不愛其死猶敢極言者誠為陛下深惜此大業陛下若不自惜則臣何賴焉齊桓公親揚其先君之惡以唱管仲然後群臣得盡其心今陛下迺欲以十世之武帝遠諱實事豈不與桓公異哉臣恐有司卒然見構銜恨蒙枉不得自敘使後世論者擅以陛下有所方比寧可復使子孫追掩之乎謹詣闕伏待重誅見後漢孔僖傳雨雹對皆陰乘陽之徵也今貴臣擅權母后黨盛陛下增脩聖德慮此二者而已夫物之相感各以類推其甚者必有山崩地震白氣相因其事不可盡論往者延平之中鄧后稱制而東垣巨屋山大崩聲動安邑即前事之驗者見孔叢子連叢下
