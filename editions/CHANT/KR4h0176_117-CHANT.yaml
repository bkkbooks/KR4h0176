body:
  text: 應邵風俗通義周禮五黨為州州疇也州有長使之相周足也見蓺文類聚六御覽百五十七周制天子方千里分為百縣縣有四郡郡者群也故左氏傳曰上大夫受縣下大夫受郡至秦始皇初置三十六郡以監縣縣平也見意林史記秦始皇本紀正義蓺文類聚六御覽百五十七周禮百里曰同所以獎王室協風俗總名為縣縣玄也首也從系倒首舉首易偏矣言當玄靜平徭役也見水經注二御覽百五十七周禮五家為鄰四鄰為里春秋國語五家為軌十軌為里里者止也里有司司五十家共居止同事春秋通其所也見續漢書百官志注廣韻六止御覽百五十七國家制度大率十里一鄉見續漢書百官志注謹案春秋國語畺有寓望謂今亭也民所安定也亭有樓從高省丁聲也漢家因秦大率十里一亭亭留也今語有亭侍蓋行旅宿食之所館也亭亦平也訟諍吏留辨處勿失其正也亭吏舊名負弩改為亭長或謂亭父見御覽百九十四續漢書百官志注中人城北四十里有左人亭鮮虞故邑見御覽百六十一鯀作城郭城盛也從土成聲郭大也見意林水經注二郭亦謂之郛郛者亦大也見初學記二十四御覽百九十三論語夫子宮牆數仞禮記季武子入宮不敢哭由是言之宮室一也秦漢以來尊者以宮為常號下乃避之云室耳弟子職曰室中握手論語曰譬如宮牆由是言之宮其外室其內也見御覽百七十四魯昭公設兩觀于門是謂之闕從門欮聲見水經注十六殿堂象東井形刻作荷蔆荷蔆水物也所以厭火見蓺文類聚六十三初學記七廣韻三十二霰御覽百七十五又百八十八屋止也見廣韻一屋案天子有外屏令臣下氣息見意林屏卿大夫以帷士以簾稍有弟以自鄣蔽也示臣臨見自整屏風處也見廣韻四十靜御覽百八十五門戶鋪首謹案百家書云公輸般見水上蠡謂之曰開汝匣見汝形蠡適出頭般以足畫圖之蠡引閉其戶終不可得開般遂施之門戶欲使閉藏當如此周密也見蓺文類聚七十四御覽百八十八又七百五十鑰施懸魚魚翳伏淵源欲令楗閉如此見御覽百八十四府聚也公卿牧守道德之所聚也見廣韻九麌通鑑注漢紀七眾經音義十作公卿牧守文書財賄所聚也廷正也言縣廷郡廷朝廷皆取平均正直也見後漢郭太傳注通鑑注周紀二寺司也諸官府所止皆曰寺寺者嗣也理事之吏嗣續于其中也今尚書侍御史謁者所止皆曰寺見文選吳都賦注又劉楨贈徐幹詩注又應瑒岑文瑜書注京師有長壽街萬歲街士馬若此非一街者攜也離也四出之路攜離而別也見御覽百九十五廣韻十三佳閈城外郭內里門也見御覽百八十二市恃也養贍老少恃以不匱也亦謂之市井俗說市井謂至市鬻賣者當于井上洗濯其物香潔及自嚴飾乃到市也謹案春秋井田記人年三十受田百畝以食五口五口為一戶父母妻子也公田十畝廬舍五畝成田一頃十五畝八家而九頃二十畝共為一井廬舍在內貴人也公田次之重公也私田在外賤私也井田之義一曰無泄地氣二曰無費一家三曰同風俗四曰合巧拙五曰通財貨因井為市交易而退故稱市井也見詩陳風正義後漢劉寵傳注初學記二十四御覽百九十一又八百二十七漢改郵為置置者度其遠近之閒置之也今吏郵書掾府督郵職掌此見續漢書輿服志注傳舍案諸侯及使者有傳信乃得舍于傳耳今刺史行部車號傳車從事督郵見文選范雲贈張徐州詩注又任昉哭范僕射詩注南北曰阡東西曰陌河南以東西為阡南北為陌見史記秦本紀索隱意林初學記二十四文選藉田賦注御覽百九十五困學紀聞十六里語云越陌度阡更為客主見文選武帝短歌行注菀蘊也言薪蒸所蘊積也見意林初學記二十四御覽百九十六囿者畜魚鱉之處也囿猶有也見御覽百九十六園援也从口袁聲四晧園公亦本園者見御覽八百二十四圃補也从口甫聲同上井法也節也言法制居人令節其飲食無窮竭也見初學記七御覽百八十九孫子云金城湯池而無粟者太公墨翟不能守之見意林孫子有金城湯池之說後人因此開地為池以養魚鼈見初學記七海一云朝夕池見初學記六下云一云天池亦云大壑巨壑出老子及風俗通丞者承也相者助也見蓺文類聚四十五漢武帝諱徹改曰通侯或曰列侯秦時六國未平將帥皆家關中故稱關內侯通侯言其功大通于王室列者言其功德列著乃饗爵也見御覽百九十八牧守長不宜數易案尚書有考績孔子曰如有用我者期月而已三年有成鄭子產從政三年民乃歌之聖賢尚須漸進況中才乎數易豈不紛錯道路也見意林尚書御史臺皆以官倉頭為史主賦舍凡守其門戶見續漢百官志注有秩則田閒大夫言其官裁有秩耳見續漢百官志注通鑑注周紀五嗇者省也夫賦也言消息百姓均其役賦見續漢百官志注古制本無奴婢奴婢皆是犯事者或原之奴者劣婢者卑陋臧者被臧罪沒入為官奴婢獲者逃亡獲得為奴婢也見蓺文類聚三十五初學記三十九易云利見大人大人與聖人其義一也見意林論語云君子上達臧孫紇曰後有達者將在孔丘乎同上儒者區也言其區別古今居則翫聖哲之詞動則行典藉之道援先王之制立當時之事綱紀國體原本要化此通儒也若能納而不能出能言而不能行講誦而已無能往來此俗儒也見後漢杜林傳注又賈逵傳注章帝時以賈逵為通儒時人語曰問事不休賈長頭見意林禮云群居五人長者必異席今呼權貴作長者非也同上管子云先生施教弟子則之非知古之道是師者之稱諸生弟子學者非一故曰諸先生者當如醒學者譬如醉言生俱醉獨有醒者同上祭酒禮云飲酒必祭尊其先也孫卿在齊最是老師故三稱祭酒同上士詩云殷士膚敏髦士俊秀雅士博達列士有不易之分處士隱居放言同上見文選曹子建雜詩注引烈士者有不易之分又鸚鵡賦注引處士者隱居放言也易曰師貞丈人吉非徒尊老須德行先人也傳云杖德莫如信言其恩德可信杖也同上禮云十尺曰丈成人之長也夫者膚也言其智膚敏宏教也故曰丈夫同上論語云匹夫匹婦傳云一晝一夜成一日一男一女成一室案古人男女作衣用二匹今人單衣故言匹夫同上夫人當龍變起不繫鄉里若止繫風俗見善不徒故謂之俗人同上禮言簡不肖案生子鄙陋不似父母曰不肖今人謙辭亦曰不肖同上見文選報任少卿書注生子不似父母者曰不肖方言人不事事而放蕩謂之無賴不可恃賴也猶高祖謂太上皇云大人以臣無賴也同上采女案采者擇也以歲八月雒陽民遣中大夫與掖廷丞相工閱視童女年十三以上二十以下長壯妖潔有法相者載入後宮見文選皇后紀論注漢以八月算人后家以金帛賂遺主者以求入也見後漢皇后紀注列侯尚公主國人尚翁主以妻制夫陽屈于陰爾見初學記十御覽百五十四易稱帝乙歸妹以祉元吉婦人謂嫁娶之禮曰歸歸其妹于諸侯亨終吉也見初學記十延熹中中常侍單超左悺徐璜具瑗唐衡在帝左右縱其姦慝時人為之語曰左迴天徐轉日具獨坐唐應聲言其信用甚于轉圓也見御覽三百九十三又四百九十六禮臣子無爵諡君父之義也故群臣累其功美葬日遣太尉于南郊告天而諡之見後漢明帝紀注天子新崩未有諡故且稱大行皇帝見後漢安帝紀注文選元皇后哀策文注又通典七十九作前帝諡未定臣子稱大行以別嗣主宮車晏駕謹案史記曰王稽謂范睢曰夫事有不可知者有不可奈何者一旦宮車晏駕是事不可知也君雖恨于臣是無可奈何謂秦昭王以天年終也昔周康王一旦晏起詩人以為深刺天子當夜寢早作身省萬機如今崩殞則為晏駕矣見文選竟陵王行狀注又恨賦注梓宮者禮天子以梓器宮者存時所居緣生事亡因以為名凡人呼棺亦為宮也見後漢明帝紀注文選齊敬皇后哀策文注御覽五百五十葬之郭北北首求諸幽之道見文選詠懷詩注案秦昭王太后始臨朝也見意林十月謂之應鍾何應者應也鍾者動也言萬物應陽而動不藏也見御覽二十七十二月律謂之大呂何大者太也旅拒也言陽氣欲出陰不許也呂之言拒也依即拒難之也見御覽二十七月與星竝無光日照之乃光耳如以鏡光照日則影見壁月初見西方月望後光見東北一照也見御覽六吳牛望月則喘彼之苦于日見月怖亦喘之矣見御覽四風或清明來久長不搖樹木枝葉離地三二丈者此有龍德在其下風或清明不及二三尺者此君子之風也見蓺文類聚一御覽九猛風曰颲涼風曰瀏微風曰飉小風曰颼小風從孔來曰見初學記一御覽九積冰曰凌壯冰曰凍冰流曰澌冰解曰泮見初學記七御覽六十八醬成于鹽而鹹于鹽夫物之變有時而重見蓺文類聚七十二御覽八百六十五五月有落梅風江淮以為信風又其霖霪號為梅雨沾衣服皆敗黦見御覽九百七十夫火者南方陽光輝為明聖人嚮之而治取其象也見初學記二十五言人清高如冰之潔見文選漢高祖功臣頌注南陽酈縣有甘谷谷中水甘美云其山上大有菊華水從山上流下得其滋液谷中三十餘家不復穿井仰飲此水上壽者百二三十中者百餘歲七八十者名之為天菊華輕身益氣令人堅強故也司空王畼太尉劉寬太傅袁隗為南陽太守聞有此事令酈縣月送水三十斛用之飲食諸公多患風眩皆得廖蓺文類聚八十一初學記二十七御覽五十四又九百九十六案明帝起居注上東巡泰山到滎陽有烏飛鳴乘輿上虎賁王吉射中之作辭曰烏烏啞啞引弓射洞左腋陛下壽萬歲臣為二千石帝賜錢二百萬令亭壁悉畫為鳥也見初學記三十御覽七百三十六又九百二十梧桐生于嶧山陽巖石之上采東南孫枝為琴聲甚雅見御覽九百五十九柘材為弓彈而放快見御覽九百五十八橙皮可以為醬虀見御覽九百七十一菖蒲放花人得食之長年見御覽九百九十九謹案詩曰手如柔荑荑者茅始熟中穰也既白且滑見御覽九百九十六蓬生麻中不扶自植見蓺文類聚八十五御覽九百九十五桑車榆轂聞聲之見蓺文類聚八十八舟漂汎似散蓮花見北堂書鈔未刪改本一百三十七荊鱉令死尸隨水土荊人求之不得也鱉令至岷山下已復生起見蜀望帝帝使鱉令鑿巫山然後蜀得陸處望帝自以德不如以國禪與鱉令為蜀王號曰開明見御覽五十六秦昭王遣李冰為蜀郡太守開成都兩江溉田萬頃江水有神歲取童女二人以為婦不然為水災主者白出錢百萬以行聘冰曰不須吾自有女到時裝飾其女當以沈水徑至神祠上神坐舉酒酹曰今得傅九族江君大神當見尊顏相進酒冰先投杯但澹澹不耗冰厲聲曰江君相輕當相伐耳拔劍忽然不見良久有兩蒼牛鬭于岸旁有閒冰還流汗謂官屬曰吾鬭疲極當相助也若欲知我南向腰中正白者我綬也主薄乃刺殺北面者江神遂死蜀人慕其氣決凡壯健者因名冰兒見水經注三十三蓺文類聚九十四史記河渠書正義御覽二百六十一又六百八十二又八百九十九穎川張欽孟孝吳楚反與亞夫常為前鋒陷陳潰圍傍人觀曰壯哉此君欽聞自矜遂死軍見御覽三百八十六張仲春武帝時人也善雅歌與李延年同時每奏新歌莫不稱善然不知休息終至于敗亡以人之進退當有節奏見御覽五百七十二汝南周勃辟太尉清詔使荊州見後漢第五種傳注袁湯時年八十六有子十二人見後漢袁安傳注光祿華肸上戴就為主事見後漢獨行傳注太山巖石松樹鬱鬱蒼蒼如雲中見文選謝朓之宣城詩注謹案自郊貙膢春秋饗射天子射麑掩雉獻諸宗廟扶陽發滯養老致敬化之至也見御覽三十三謹案禮臣有大喪三年不呼其門見御覽五百四十六武帝廣開獻書之路立五經博士開弟子員設科射策勸以官祿訖于元始百有餘年書積如丘山傳業浸眾枝葉䋣滋經說百萬言蓋祿利之路然也見御覽六百八光武車駕徙都洛陽載素𥳑紙經凡二千兩董卓盪覆王室天子西移中外倉卒所載書七十車于道遇雨分半投棄卓又燒焫觀閣經籍盡作灰燼所有餘者或作囊帳先王之道幾煙滅矣見意林御覽六百十九今宴飲大會皆先黍𦞦見北堂書鈔一百四十四御覽八百五十昭帝時大官上食羹中有髮切中有土令丞坐不謹敬皆論死見御覽八百六十一牛乃耕農之本百姓所仰為用最大國家之為強弱也建武之初軍役亟動牛亦損耗農業頗廢米石萬錢天愛斯民扶助聖主事有徵應于是旅穀彌望野繭被山見蓺文類聚八十五御覽八百三十七鈴柄施懸魚魚者欲君臣沈靜如魚之入水不可復得聞見耳見御覽三百三十八彭祖壽年八百歲猶恨唾遠見御覽三百八十七趙王好大眉人閒半額楚王好廣領國人沒頸齊王好細腰後宮有餓死者見御覽三百八十九又四百九十六東海王景興議曰晏平仲以齊君奢故澣其朝冠振其鹿裘見御覽八百二十六吳王夫差大敗齊于艾陵還誅子胥取其身流之江決其目東門曰使汝視越之入吳也見匡謬正俗八穎川黃子廉者每飲馬投錢于水中見御覽四百二十六又八百三十六案愆禮卷載太原郝子廉事絕相類此云潁川黃子廉唯姓不同耳豈本一事而傳者異與汝南陳伯敬行必矩步坐必儼然目有所見不食其肉見書鈔一百四十五御覽三百九十三又八百六十二伯魚之生適有饋孔子魚者嘉以為瑞故名鯉字伯魚見御覽九百三十五丁壯小犢跳梁弄角飲水數石生芻十束當風路夜至死不曲見御覽八百九十九俗云亂如蘊者糞除不潔艸介集眾火就燒之謂之蘊言其烟氣縕縕取其希有淆亂見御覽八百七十一鎌刀自葵積芻蕘之效見御覽七百六十四案里語厚哉鮑管探腸案腹不清然尚不盥何其財而生喜怒也見御覽三百九十五刻葦傷盜為槍見御覽三百五十四耳珠曰璫見書鈔百三十五御覽七百十八火斗曰尉見廣韻八未織毛褥謂之氍瑜見廣韻十虞丸毛謂之踘見御覽七百五十四以上四條疑出服虔通俗文笈學士所以負書箱如冠籍箱也見御覽七百十一題云風俗記顏色厚取顧眄所以親密見文選嵇叔夜贈秀才入軍詩注汝南主簿應劭議宜為舊君諱論者皆互有異同見三國吳志七注云事在風俗通彭城孝廉張子矯議云若君臣不得相襲作名周穆王諱滿至定王時王孫滿厲王諱胡莊王之子名胡見意林謹案律者法也皋陶謨虞始造律蕭何成以九章此關諸百王不易之道也時所制曰令漢書著于甲令夫吏者治也當先自正然後正人故文書下如律令言當履繩墨動不失律令也見文選陳琳檄豫州文注蓺文類聚五十四御覽六百三十八作故承憲履繩動不失律令也
