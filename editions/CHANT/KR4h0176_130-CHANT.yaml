body:
  text: 李尢函谷關賦惟皇漢之休烈兮包八極以據中混無外之盪盪兮惟唐典之極崇萬國喜而洞洽兮何天衢以流通襟要約之險固兮制關楗以擒非其南則有蒼梧荔浦離水謝沭匯浦零中以窮海陸于北則有蕭居天井壼口石陘貫越代朔以臨胡庭緣邊邪指陽會玉門淩測龍堆或置以口于西則有隨隴武夷白水江零沔漢阻曲路由山泉奮水遼溢連是經爾迺周覽以汎觀兮歷眾關以遊目惟夸闊之顯麗兮羌莫盛乎函谷施雕礱以作好建峻敞之堅重殊中外以隔別翼巍巍之高崇命尉臣以執鑰統群類之所從嚴固守之猛厲操戈鉞而𤾕聰蕃鎮造而惕息侯伯過而震忡惟函谷之初設險前有姬之苗流嘉尹喜之望氣知真人之西遊爰物色以遮道為著書而肯留自周轍之東遷秦虎眎乎中州文馳齊而懼追譎雞鳴于狗偷睢背魏而西逝託衾衣以免搜大漢承弊以建德革厥舊而運修準令宜以就制因茲勢以立基蓋可以詰非司邪括執喉咽季末荒戍墮闕有年天閔群黎命我聖君稽符皇乾孔適河文中興再受二祖同勳永平承緒欽明奉循上羅三關下列九門會萬國之玉帛徠百蠻之貢冠蓋紛其雲合車馬動而雷奔察言服以有譏捐繻傳而勿論于以廓襟度于神聖法易簡于乾坤見蓺文類聚六初學記七古文苑玉女流眄而下視見文選魯靈光殿賦注盛夏臨凓而含霜焉見文選七啟注辟雍賦卓矣煌煌永元之隆含宏該要周建大中蓄純和之優渥兮化盛溢而茲豐見御覽五百三十四太學既崇三宮既章靈臺司天群耀彌光太室宗祀布政國陽辟芷巖巖規圓矩方階序牖闥雙觀四張流水湯湯造舟為梁神聖班德由斯以匡喜喜濟濟春射秋饗王公群后卿士具集攢羅鱗次差池雜遝延忠信之純一兮列左右之貂璫三后八蕃師尹舉卿加休慶德稱壽上觴戴甫垂畢其儀蹌蹌是以乾坤所周八極所要夷戎蠻羌儋耳哀牢重譯響應抱珍來朝南金大璐玉象犀龜見蓺文類聚三十八初學記十三興雲動雷飛屑風雨見文選海賦注萬騎躨跜以攫拏見文選魯靈光殿賦注德陽殿賦曰若炎唐稽古作先開三階而參會錯金銀于兩楹入青陽而窺總章歷戶牖之所經連璧組之潤漫雜虬文之蜿蜒爾乃周閣迴帀峻樓臨門朱闕巖巖嵯峨概雲青瑣禁門廓廡翼翼華蟲詭異密采珍縟達蘭林以西通中方池而特立果竹鬱茂以蓁蓁鴻雁沛裔而來集德陽之比斯曰濯龍葡萄安石蔓延蒙籠橘柚含桃甘果成叢文㮰曜水光映煌煌見蓺文類聚六十二初學記二十八御覽九百七十平樂觀賦乃設平樂之顯觀章秘瑋之奇珍習禁武以講捷厭不羈之遐鄰徒觀平樂之制鬱崔嵬以離婁赫巖巖其崟峉紛電影以盤旴彌平原之博敞處金商之維陬太廈累而鱗次承岧嶢之翠樓過洞房之轉闥歷金環之華鋪南切洛濱北陵倉山龜池泱漭果林榛榛天馬沛艾鬣尾布分爾乃太和隆平萬國肅清殊方重譯絕域造庭四表交會抱珍遠并雜遝歸誼集于春正翫屈奇之神怪顯逸才之捷武百僚于時各命所主方曲既設秘戲連敘逍遙俯仰節以鞀鼓戲車高橦馳騁百馬連翩九仞離合上下或以馳騁覆車顛倒烏獲扛鼎千鈞若羽吞刃吐火燕躍鳥峙陵高履索踊躍旋舞飛丸跳劍沸渭回擾巴渝隈一踰肩相受有仙駕雀其形蚴虬騎驢馳射狐兔驚走侏儒巨人戲謔為耦禽鹿六駮白象失首魚龍曼延㟪山阜龜螭蟾蜍挈琴鼓缶見蓺文類聚六十三東觀賦臣雖頑鹵慕小雅斯干歎詠之美敷華實于雍堂集幹質于東觀東觀之蓺孼孼洋洋上承重閣下屬周廓步西蕃以徙倚好綠樹之成行歷東崖之敞座庇蔽芾之甘棠前望雲臺後帀德陽道無隱而不顯書無闕而不陳覽三代而采宜包郁郁之周文見蓺文類聚六十三七款奇宮閑館迴庭洞門井榦廣望重閣相因夏屋渠渠嵯峨合連前臨都街後據流川梁王青黎盧橘是生白華綠葉扶疏冬榮與時代序孰不墮零黃景炫炫眩林曜封金衣朱裏班理內充滋味偉異淫樂無窮副以苷蔗豐弘誕節纖液玉津旨于飴密見蓺文類聚五十七又初學記二十八引兩條又御覽九百七十四鴻柿若瓜見萬覽九百七十一龍鼉水處見文選蜀都賦注迴皇競集見文選長笛賦注季秋未際高風猋厲見文選七命注神奔電驅星流矢騖則莫若益野騰駒也見文選七命注懷戎頌見華陽國志十中政事論見華陽國志十中云七篇河銘洋洋河水赴宗于海經自中州龍圖所在黃函白神赤符以信昔有周武集會孟津魚入王舟乃往克殷大漢承緒懷附遐鄰邦事來濟各貢厥珍見蓺文類聚八又九引孟津銘又水經河水一注洛銘洛出熊耳東流會集夏禹導疏經于洛邑玄龜赤字漢符是立帝都通路建國南鄉萬乘終濟造舟為梁三都五州貢篚萬方廣視遠聽審任賢良元首昭明庶類是康見初學記六鴻池陂銘鴻澤之陂聖王所規開源東注出自城池見水經穀水注漸臺中起列館參差見文選謝朓晚登三山望京邑詩注函谷關銘函谷險要襟帶喉咽尹從李老留作二篇孟嘗離秦奔騖東征夜造稽疑誦以雞鳴范睢將入自盛以囊元鼎革移錯之新安舍彼西阻東即高原長墉重關閒固不踰簡易易從與乾合符見蓺文類聚六明堂銘布政之室上圓下方體則天地在國正陽牕闥四設流水洋洋順節行化各居其房春恤幼孤夏進賢良秋厲威武冬謹關梁見蓺文類聚三十八御覽五百三十三太學銘漢遵禮典崇興六蓺修周之理埽秦之弊褎建儒宮廣置異記開延學者勸以爵位見蓺文類聚三十八辟雍銘惟王所建方中圓外清流四帀蕩滌濁穢見御覽五百三十四東觀銘周氏舊區皇漢寔循房闥內布疏綺外陳升降三除貫啟七門是謂東觀書籍林淵列侯弘雅治掌蓺文見蓺文類聚六十三文選陸機贈顧彥先詩注永安宮銘合歡黃堂中和是遵舊廬懷本新果畼春侯臺集道俾司星辰豐業廣德以協天人萬福來助嘉娛永欣見蓺文類聚六十二初學記二十四雲臺銘周氏舊居惟漢襲因崇臺嶒峻上礙蒼雲垂示億載俾率舊章人修其行而國其昌見蓺文類聚六十二初學記二十四德陽殿銘皇穹垂象以示帝王紫微之側弘誕彌光大漢體天承以德陽崇弘高麗苞受萬方內綜朝貢外示遐荒見蓺文類聚六十二初學記二十四鞫城銘圜鞠方牆倣象陰陽法月衝對二六相當建長立平其例有常不以親疏不有阿私端心平意莫怨其非鞫政由然況乎執機見蓺文類聚五十四文選景福殿詩注京師城銘天險匪登地險丘陵帝王設險乾坤是承見蓺文類聚六十三初學記二十四高安館銘巍巍高安明聖是修嶕嶢麗館窗闥列周增臺顯敞禁室靜幽長除臨起櫺檻相承聖朝明察同保休徵見蓺文類聚六十三文選蜀都賦注七啟注平樂館銘乃興平樂弘敞麗光層樓通閣禁闥洞房棼梁照曜朱華飾當騁武舒秘以示幽荒如榮普覆然後來王見蓺文類聚六十三上林苑銘顯宗備禮明慮弘湥見文選鮑照放歌行注闕銘皇上尊嚴萬姓載依國都攸處建設端闈表樹兩觀雙闕巍巍見蓺文類聚六十二悉心聽省乃無窮冤見文選陸倕石闕銘注門銘門之設張為宅表會納善閑邪擊柝防害見蓺文類聚六十三初學記二十四御覽一百八十三穀城門銘穀門北中位當于子太陰主刑殺伐事首見蓺文類聚六十三作殺伐為首初學記二十四作為始御覽一百八十三案雒陽城十二門今缺丑門一銘上東門銘上東少陽厥位在寅條風動物月值孟春見後魏書李順附傳李騫釋情賦注中東門銘中東處仲月位當卯倉庚有聲鷹隼匿爪除去桎梏獄訟勿考見蓺文類聚六十三初學記二十四御覽一百八十三旌門銘旌門值季位月在辰順陽布位貧乏是振見御覽百八十三開陽門銘開陽在孟位月惟已清門冠節太陽進起見蓺文類聚六十三初學記二十四平城門銘平門督師午位處中外臨僚侍內達帝宮正陽南面炎暑赫融見御覽一百八十三津城門銘津名自定位月在未溫風鬱暑鷹鳥習鷙見蓺文類聚六十三初學記二十四廣陽門銘廣陽位孟厥月在申涼風時至白露已分見蓺文類聚六十三御覽一百八十三雍城門銘雍門處中位月在酉盲風寒濁雁歸山阜見蓺文類聚六十三初學記二十四上西門銘上西在季位月惟戍菊黃豺祭號令嚴悉見御覽一百八十三夏城門銘夏門值孟位月在亥不周用事玄冥幽晦陰陽不通蝃蝀匿采迎冬北壇順陰所在見蓺文類聚六十三初學記二十四御覽一百八十三堂銘因邑制宅爰興殿堂夏屋渠渠高敞清涼家以師禮修奉蒸嘗延賓西階主近東廂宴樂嘉客吹笙鼓簧見蓺文類聚六十三室銘室以安寍寢息幽閑窒塞空隟遮遏風寒無曰寂寞屋漏昭然見御覽一百七十四楹銘幹彊體正雖重不移上下相安高而不危見御覽一百八十七牖銘天設牕牖開光照陰施于明堂以象八風見御覽一百八十八井銘井之所尚寒泉冽清法律取象不概自平多取不損少汲不盈執憲若斯何有邪傾見蓺文類聚九竈銘燧人造火竈能以興五行接備陰陽相乘見蓺文類聚八十御覽一百八十六鍾簴銘周因殷禮損益可知漢因于周猶若重規人因秦器事有可施鴻鍾怒簴物得其宜聲揚遠聞文耀委迤見蓺文類聚四十四琴銘琴之在音盪滌邪心雖有正性其感亦深存雅卻鄭浮侈是禁條畼和正樂而不淫見蓺文類聚四十四初學記十六笛銘剡削長幹二孔修長出自西涼流離浩蕩壯士抑揚見初學記十六引兩條漏刻銘昔在先聖配天垂則仰釐七曜俯順坤德乃建日官俾立漏刻昏明既序景曜不忒唐命羲和敬授人時縣象著明帝以崇熙季末不虔德衰于茲挈壼失節刺流在詩聖哲稽古帝則是欽尺璧非寶重此寸陰昧旦丕顯敬聽漏音思我王度如玉如金見蓺文類聚六十八引漏刻銘又引漏銘北堂書鈔一百三十初學記二十五屏風銘舍則潛辟用則設張立必端直處必廉方雍閼風邪霧露是抗奉上蔽下不失其常見蓺文類聚六十九北堂書鈔一百三十二初學記二十五御覽七百一書案銘居則致樂承顏接賓承奉奏記通達謁刺尊上荅下道合仁義見書鈔一百三十三御覽七百十經橈銘瞻之在前忽焉在後進新習故不舍于口子在川上逝者如斯及年廣學無問不知見蓺文類聚五十五讀書枕銘聽政理事怠則覽書傾倚偃息隨體興居寤心起意猶愈宴娛見蓺文類聚五十五筆銘筆之強志庶事分別七術雖眾猶可解說口無擇言駟不及舌筆之過誤愆尤不滅見蓺文類聚五十八初學記二十一錯佩刀銘佩之有錯抑武揚文豈為麗好將戒其身見蓺文類聚六十初學記二十二御覽三百四十六金馬書刀銘巧冶鍊剛金馬託形貢文錯鏤兼勒工名淬以清流礪以越砥見蓺文類聚六十初學記二十二兩引又御覽三百四十六寶劍銘五材竝用誰能去兵龍淵耀奇太阿飛名陸斷犀兕水截鯢鯨縉紳咸服翼宣儀刑豈徒振武義合金聲戟銘鼓戟之設以戒非常秉執操持邪暴是防須臾之分終日為殃山陵之禍起于豪芒見文選鮑照白頭吟注御覽三百五十三弧矢銘弦木為弧剡木為矢協并八極四方同紀見蓺文類聚六十初學記二十二御覽三百五十良弓銘弓矢之作爰自曩時鄉射載禮招命在詩妙稱顏高巧發由基不爭之美亦以辨儀見御覽三百四十七案蓺文類聚六十初學記二十二作晉李充弩銘粵自近古發意所覩前聖制弓後世建弩機牙發矢執醜破虜克獲雖屢猶不可常忘戰者危極武者傷見蓺文類聚六十御覽三百四十八彈銘昔之造彈起意弦木以丸為矢合竹為樸漆飾膠治不用筋角丸彈之利以弋鳧鶩晉靈驕悖群臣是彈樂其如躍趨如避丸見蓺文類聚六十御覽三百五十鎧銘甲鎧之施扞禦鋒矢尚其堅剛或用犀兕內以存身外不傷害有似仁人厥道廣大好德者寍好戰者危專智恃力君子不為見初學記二十二御覽三百五十六盾銘吳旂魯瞂戎兵特須見御覽三百五十七鞍銘驅鶩馳逐騰躍覆被雖其捷習亦有顛沛井羸其瓶罔不斯敗見文選赭白馬賦注初學記二十二御覽三百五十八轡銘轡御在手急緩必時賞罰在心中和是思馬知良御進取道里人知善政令行禁止見初學記二十二御覽三百五十八馬箠銘御者箠策示有威怒東野之敗督責過度見初學記二十三御覽三百五十九鉦銘誓節師旅申嚴號令以肅紀律萬眾是聽武庫銘摶噬爪牙鋒距之先毒螫芒刺矛矢以存聖人垂象五兵已陳見初學記二十四臥床銘體之所安寢處如歡夕惕敬慎崇德遠奸見書鈔一百三十三初學記二十五御覽七百六几銘昔帝軒轅仁智恭恕恐事之有闕作倚几之法見書鈔一百三十三御覽七百十虛左致賢設坐來賓筵床對几盛養已陳殽仁飯義枕典席文道可醉飽何必清醇見書鈔一百三十三几則索口賢知難求西伯善養二老來游同上席銘施席接賓士無愚賢值時所有何必羊豚見蓺文類聚六十九初學記二十五靈壽杖銘亭亭奇幹實曰壽靈甘泉潤根清靈流莖乃制為杖扶危定傾既憑其實亦貴其名見北堂書鈔一百三十三蓺文類聚六十九𪊧尾銘撝成德柄言為訓辭鑒彼逸傲念茲在茲見北堂書鈔一百三十四鏡銘鑄銅為鑑整飭容顏修爾法則正爾衣冠見北堂書鈔一百三十六蓺文類聚七十初學記二十五熏罏銘上似蓬萊吐氣委虵芳烟布寫化白為香見北堂書鈔一百三十五印銘赤紱在服非印不明棨傳符節非印不行龜紐犢鼻用爾作程見初學記二十六研墨銘書契既造研墨乃陳煙石相附筆疏以申篇籍永垂紀志功勳見初學記二十一分為硯銘墨硯銘二篇今合錄之御覽六百五冠幘銘冠為元服幘為首飾君子敬慎自彊不忒見初學記二十六文履銘文以表德質以體仁乃製茲履文質斌斌顯允明哲卑以牧身步此坦道絕彼埃塵見書鈔一百三十六初學記二十六舟楫銘舟楫之利譬猶輿馬輦重歷遠以濟天下相風視波窮究川野安審懼慎終無不可見北堂書鈔一百三十七蓺文類聚七十一初學記二十五小車銘圓蓋象天方軫則地輪法陰陽動不相離合之嗛噓疏達開通兩輜障邪尊卑是從輗軏之用信義所同見蓺文類聚七十一又初學記二十五引兩條御覽七百七十三天軿車銘爰氏本造後裔飾雍輪以代步屏以蔽容輪軿并合出入周通追仁赴義惟禮是恭見蓺文類聚七十一御覽七百七十三鼎銘五鼎大和滋味集具雖快其口損之為務見蓺文類聚七十三盤銘或以承觴或以受物既舉清觴又成口實見蓺文類聚七十三御覽七百五十八盂銘飲無求辭纔以相娛荒沈過差可不慎與見文選嵇康與山濤絕交書注樽銘樽設在堂以俟俊乂三山共承雕琢錯帶見蓺文類聚七十三杯銘小之為杯大之為閜杯閜之用無施不可以飲以享慎斯得正周公之美驕𠫤為病見蓺文類聚七十三羹魁銘羊羹不徧駟馬長驅見御覽七百五十八安哉銘安哉令名甘旨是盛埏埴之巧甄陶所成食彼美珍思此鹿鳴見御覽七百六十匱匣銘國有都邑家有匣匱貨賄之用我之利器見御覽七百十四豐侯銘豐侯荒繆醉亂迷逸乃象其形為禮戒式後世傳之固無止說見御覽七百六十二箕銘神農植穀以養蒸民箕主簸揚糠粃乃陳見御覽七百六十五圍棊銘詩人幽憶感物則思志之空閒翫弄遊竟局為憲矩棊法陰陽道為經緯方錯列張見蓺文類聚七十四金羊燈銘賢哲勉務惟日不足金羊載耀作明以續見蓺文類聚八十初學記二十五權衡銘夫審輕重莫若權衡正是正非其唯賢明見御覽八百三十
