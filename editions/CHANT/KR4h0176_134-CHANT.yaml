body:
  text: 張衡羽獵賦皇上感天威之慘烈思太昊之觀虞虞人表林麓而廓菜藪翦荊梓而夷榛株于是鳳皇獻歷太僕駕具蚩尤先驅雨師清路山靈護陳方神蹕御羲和奉轡弭節西征翠蓋葳蕤鸞鳴瓏玲山谷為之澹淡丘陵為之簸傾于是皇輿綢繆遷延容與抗天津于伊洛敻遙集乎南圃大詔獵者競逐長驅輕車飆厲羽騎電騖霧合雲集波流雨注馬蹂麋鹿輪轔雉兔弓不妄彎弩不虛舉鳥驚絓羅獸與矢遇見蓺文類聚六十六初學記二十二乘瑤珠之雕軒建輝天之華旗見御覽八百九風颯颯其扶輪見文選魏文帝芙蓉池作詩注開閶闔兮坐紫宮見文選陸機漢高祖功臣頌注扇賦寤茲竹以成扇乃畫象而造儀惟規上而矩下播采爛以雜施見北堂書鈔一百三十四檐舟口以尋弱隨俯仰而成形同上髑髏賦張平子將遊目于九野觀化乎八方星回日運鳳舉龍驤南遊赤野北陟幽鄉西經昧谷東極扶桑于是季秋之辰微風起涼聊回軒駕左翔右昂步馬于疇阜逍遙乎陵岡顧見髑髏委于路旁下居淤壤上負玄霜平子悵然而問之曰子將并糧推命以夭逝乎本喪此土流遷來乎為是上智為是下愚為是女人為是丈夫于是肅然有靈但聞神響不見其形荅曰吾宋人也姓莊名周游心方外不能自修壽命終極來此玄幽公子何以問之對曰我欲告之于五岳禱之于神祗起子素骨反子四肢取耳北坎求目南離使東震獻足西坤授腹五內皆還六神盡復子欲之不乎髑髏曰公子之言殊難也死為休息生為役勞冬水之凝何如春冰之消榮位在身不亦輕于塵毛飛風曜景秉尺持刀巢許所恥伯成所逃況我已化與道逍遙離朱不能見子野不能聽堯舜不能賞桀紂不能刑虎豹不能害劍戟不能傷與陰陽同其流與元氣合其樸以造化為父母以天墜為床褥以雷電為鼓扇以日月為燈燭以雲漢為川池以星宿為珠玉合體自然無情無欲澄之不清渾之不濁不行而至不疾而速于是言卒響絕神光除滅顧盼發軫乃命僕夫假之以縞巾衾之以玄塵為之傷涕酬于路濱見古文苑蓺文類聚十七初學記十四御覽三百七十四又略見文選顏延之五君詠注郭泰機贈傳咸詩注冢賦載輿載步地勢是觀降此平土陟彼景山一升一降乃心斯安爾乃隳巍山平險陸刊藂林鑿盤石起峻壟構大淳高岡冠其南平原承其北列石限其壇羅竹籓其域系以脩隧洽以溝瀆曲折相連迤靡相屬乃樹靈木靈木戎戎繁霜峨峨匪雕匪琢周旋顧盼亦各有行乃相厥宇乃立厥堂直之以繩正之以日有覺其材以構玄室奕奕將將崇棟廣宇在冬不涼在夏不暑祭祀是居神明是處脩隧之際亦有掖門掖門之西十一餘半下有直渠上有平岸舟車之道交通舊館寒淵慮弘存不忘亡恢厥廣壇祭我兮子孫宅兆之形規矩之制希而望之方以麗踐而行之巧以廣幽墓既美鬼神既寍降之以福于以之平如春之卉如日之升見古文苑蓺文類聚四十初學記十四鴻賦序南寓衡陽避初寒也若其雅步清音遠心高韻鵷鸞已降罕見其儔而鍛翮牆陰偶影獨立唼味粃粺雞鶩為伍不亦傷乎予五十之年忽焉已至永言身事慨然其多緒乃為之賦聊以息慰見御覽九百十九東巡誥惟二月初吉帝將狩于岱嶽展義省方觀風設教丙寅朏率群賓備法駕以祖于東門乙酉觀禮于魯而休齊焉已丑屆于靈宮是日也有鳳雙集于臺壬辰祀上帝于明堂帝曰咨于不材為天地主慄慄翹翹百僚萬幾心之謂矣孰朕之勞上帝有靈不替朕命誕敢不祗承凡庶與祭于壇墠之位者曰懷爾邦君實願先帝載厥大宗以左右朕躬群臣曰帝道橫被旁行海表一人有韙萬民賴之從巡助祭者茲惟嘉瑞乃歌曰皇皇者鳳通玄知時萃于山趾與帝邀期吉事有祥惟漢之祺帝曰朕不敢當亦不敢蔽天之吉命見蓺文類聚三十九初學記十三御覽五百三十七陽嘉二年京師地震對策臣聞政善則休祥降政惡則咎徵見苟非聖人或有失誤昔成王疑周公而大風拔樹木開金縢而反風至天人之應速于影響故周詩曰無曰高高在上日監在茲間者京師地震雷電赫怒夫動靜無常變改正道則有奔雷土裂之異自初舉孝廉迄今二百歲矣皆先孝行行有餘力始及文法辛卯詔以能宣章句奏案為限雖有至孝猶不應科此棄本而就末曾子長于孝然實魯鈍文學不若游夏政事不若冉季今欲使一人兼之苟外可觀內必有闕則違選舉孝廉之制矣且郡國守相割符寧境為國大臣一旦免黜十有餘人吏民罷于送迎之役新故交際公私放濫或臨政涖民為百姓取便而以小過免之是為奪人父母使嗟號也又察選舉一任三府臺閣秘密振暴于外貨賂多行人事流通今真偽渾淆昏亂清朝此為下陵上替分威共德災異之興不亦宜乎易不遠復論不憚改朋友交接且不宿過況于帝王承天理物以天下為公者乎中間以來妖星見于上震裂著于下天誡詳矣可為寒心明者消禍于未萌今既見矣修政恐懼則轉禍為福矣見袁宏後漢紀十八水者五行之首滯而逆流者人君之恩不能下及而教逆也潛潭巴曰水逆者反命也宜修德以應之見續漢五行志三注補引敦煌實錄張衡對策表奏以蝕今年三月朔方覺日蝕此郡懼有兵患臣愚以為可敕北邊須塞郡縣明烽火遠斥侯深藏固閉無令穀畜外露見續漢五行志六陽嘉四年注補表求合正三史臣伏見陛下思光先緒以典籍為本而史書枝別條異不同一貫建武以來新裁未就見初學記二十一臣仰幹史職敢徼官守竊貪成訓自忘頑愚願得專于東觀畢力于紀記竭思于補闕俾有漢休烈比久長于天地竝光明于日月昭示萬嗣永永不朽也見後漢張衡傳注引衡表上順帝封事臣竊見京師為害兼所及民多病死有滅戶人人恐懼朝廷燋心以為至憂臣官在于改變禳災思任防救未知所由夙夜征營臣聞國之大事在祀祀莫大于郊天奉祖方今道路流言僉曰孝安皇帝南巡路崩從駕左右行慝之臣欲徵諸國王子故不發喪衣車還宮偽遣大臣竝禱請命臣處外治不知其審然尊靈見罔豈能無怨且凡夫私子有不蠲猶為譴謫況以大穢用禮郊廟孔子曰曾謂泰山不如林放乎天地明察降禍見災乃其理也又閒者有司正以冬至之後奏開恭陵神道陛下至孝不忍距逆或發冢移尸月令仲冬土事無作慎無發蓋及起大眾以固而閉地氣上泄是謂發天地之房諸蟄則死民必疾疫又隨以喪厲氣未息恐其殆此二年欲使知過改悔五行傳曰六沴作見若時共禦帝用不差神不怒萬福乃降用章于下臣愚以為可使公卿處議所以陳術改過取媚神祇自求多福也見續漢五行志五注補上疏陳事伏惟陛下宣哲克明繼體承天中遭傾覆龍德泥蟠今乘雲高躋磐桓天位誠所謂將隆大任必先倥偬之也親履艱難者知下情備經儉易者達物偽故能一貫萬機靡所疑惑百揆允當庶績咸熙冥獲福祉神祇受譽黎庶而陰陽未和災眚屢見神明幽遠宜鑒在茲福仁禍淫景響而應因德降休乘失致咎天道雖遠吉凶可見近世鄭蔡江樊周廣王聖皆為效矣故恭儉畏忌必蒙祉祚奢淫滔慢鮮不夷戮前事不忘後事之師也夫情勝其性流遯忘反豈唯不肖中才皆然苟非大賢不能見得思義故積惡成釁罪不可解也向使能瞻前顧後援鏡自戒則何陷于凶患乎貴寵之臣眾所屬仰其有愆尤上下知之褒美譏惡有心皆同故怨讟溢乎四海神明降其禍辟也頃年雨常不足思求所失則洪範所謂僭恆暘若者也懼群臣奢侈昏踰典式自下逼上用速咎徵又前年京師地震土裂裂者威分震者人擾也君以靜唱臣以動和威自上出不趣于下禮之正也竊懼聖思厭倦制不專己恩不忍割與眾共威威不可分德不可共洪範曰臣有作威作福玉食害于而家凶于而國天鑒孔明雖疏不失災異示人前後數矣而未見所革以復往悔自非聖人不能無過願陛下思惟所以稽古率舊勿令刑德八柄不由天子若恩從上下事依禮制禮制修則奢僭息事合宜則無凶咎然後神望允塞災消不至矣見後漢張衡傳又見袁宏後漢紀十九少九句請禁絕圖讖疏臣聞聖人明審律厤以定吉凶重之以卜筮雜之以九宮經天驗道本盡于此或觀星辰逆順寒燠所由或察龜策之占巫覡之言其所因者非一術也立言于前有徵于後故智者貴焉謂之讖書讖書始出蓋知之者寡自漢取秦用兵力戰功成業遂可謂大事當此之時莫或稱讖若夏侯勝眭孟之徒以道術立名其所述著無讖一言劉向父子領校祕書閱定九流亦無讖錄成哀之後乃始聞之尚書堯使鯀理洪水九載績用不成鯀則殛死禹乃嗣興而春秋讖云共工理水凡讖皆云黃帝伐蚩尤而詩讖獨以為蚩尤敗然後堯受命春秋元命包中有公輸班與墨翟事見戰國非春秋時也又言別有益州益州之置在于漢世其名三輔諸陵世數可知至于圖中訖于成帝一卷之書互異數事聖人之言勢無若是殆必虛偽之徒以要世取資往者侍中賈逵摘讖互異三十餘事諸言讖者皆不能說至于王莽篡位漢世大禍八十篇何為不戒則知圖讖成于哀平之際也且河洛六蓺篇錄已定後人皮傅無所容篡永元中清河宋景遂以厤紀推言水災而偽稱洞視玉版或者至于棄家業入山林後皆無效而復采前世成事以為證驗至于永建復統則不能知此皆欺世罔俗以昧勢位情偽較然莫之糾禁且律厤卦侯九宮風角數有徵效世莫肯學而競稱不占之書譬猶畫工惡圖犬馬而好作鬼魅誠以實事難形而虛偽不窮也宜收藏圖讖一禁絕之則朱紫無所眩典籍無瑕玷矣見後漢張衡傳論貢舉疏古者以賢取士諸侯歲貢孝武之代郡舉孝廉又有賢良太學之選于是名臣皆出文武竝興漢之得人數路而已夫書畫辭賦才之小者匡國理政未有能焉陛下即位之初先訪經術聽政餘日觀省篇章聊以游蓺當代博奕非以教化取士本而諸生競利作者鼎沸其高者頗引古訓風喻之言下則連偈俗語有類俳優或竊成文虛冒名氏臣每受詔于盛化門差次錄第其未及者亦復隨輩皆見拜擢既加之恩難復收改但守俸祿于義已加不可復使理人及任州郡昔孝宣會諸儒于石渠章帝集學士于白虎通經釋義其事優大文武之道所宜從之乃若小能小善雖有可觀孔子以為致遠則泥君子故當致其大者遠者也見通典十六論舉孝廉疏自初舉孝廉到今二百年必先孝行行有餘力乃艸文法耳今詔書一以能誦章句結奏案為限雖有至孝不當其科所謂損本而求未者也自改試以來累有妖星震裂之菑是天意不安于此法故也奏事飛塵增山霧露助海見初學記二御覽十二厤議五紀論推步行度當時比諸術為近然猶未稽于古及向子歆欲以合春秋橫斷年數損夏益周攷之表紀差謬數百兩厤相課六千一百五十六歲而太初多一日冬至日直斗而云在牽牛迂闊不可復用昭然如此史官所共見非獨衡興前以為九道密近今議者以為有闕及甲寅元復多違失皆未可取正昔仲尼順假馬之名以崇君之義況天之厤數不可任疑從虛以非易是見續漢律厤志中延光二年尚書郎張衡周興以為與崔瑗書乃者以朝駕明日披讀太玄經知子雲特極陰陽之數也以其滿汎故故時人不務此非特傳記之屬心實與五經擬漢家得二百歲卒乎所以作興者之數其道必顯一代常然之符也玄四百歲其興乎竭已精思以揆其義更使人難論陰陽之事足下累世窮道極微子孫必侖世不絕且幅寫一通藏之以待能者見太玄經范望注本載陸績述玄引張平子與崔子玉書吾觀太玄方知子雲妙極道數乃與五經相擬非徒傳記之屬使人難論陰陽之事漢家得天下二百歲之書也復二百歲殆將終乎所以作者之數必顯一世常然之符也漢四百歲玄其興矣見後漢張衡傳注云自此以上竝衡與崔瑗書之文也與特進書蓬萊太史之祕府道家所貴衡再得當之竊為幸矣見北堂書鈔鉛刀強可一割見文選其言之不慚恃鮑子之知我見文選曹植與楊德祖書注酸者不能不苦于言見文選應閒觀者觀余去史官五載而復還非進取之勢也唯衡內識利鈍操心不改或不我知者以為失志矣用為閒余余應之以時有遇否性命難求因茲以露余誠焉名之應閒云見後漢張衡傳注引衡集有閒余者曰蓋聞前哲首務務于下學上達佐國理民有云為也朝有所聞則夕行之立功立事式昭德音是故伊尹思使君為堯舜而民處唐虞彼豈虛言而已哉必旌厥素爾咎單巫咸寔守王家申伯樊仲實幹周邦服衮而朝介圭作瑞厥跡不朽垂烈後昆不亦丕歟且學非以要利而富貴萃之貴以行令富以施惠惠施令行故易稱以大業質以文美實由華興器賴雕飾為好人以輿服為榮吾子性德體道篤信安仁約己博蓺無堅不鑽以思世路斯何遠矣曩滯日官今又原之雖老氏曲全進道若退然行亦以需必也學非所用術有所仰故臨川將濟而舟楫不存焉徒經思天衢內昭獨智固合理民之式也故嘗見謗于鄙儒深厲淺揭隨時為義曾何貪於于支離而習其孤技邪參輪可使自轉木雕猶能獨飛已垂翅而還故棲盍亦調其機而銛諸昔有文王自求多福人生在勤不索何獲曷若卑體屈己美言以相剋鳴于喬木乃金聲而玉振之用後勳雪前吝婞佷不柔以意誰靳也應之曰是何觀同而見異也君子不患位之不尊而患德之不崇不恥祿之不夥而恥智之不博是故蓺可學而行可力也天爵高懸得之在命或不速而自懷或羨旃而不臻求之無益故智者偭而不思阽身以徼幸固貪夫之所為未得而豫喪也枉尺直尋議者譏之盈欲虧志孰云非羞于心有猜則簋飧饌餔猶不屑餐旌瞀以之意之無疑則兼金盈百而不嫌辭孟軻以之士或解裋褐而襲黼黻或委臿築而據文軒者度德拜爵量績受祿也輸力致庸受必有階渾元初基靈軌未紀吉凶紛錯人用朣朦黃帝為斯深慘有風后者是焉亮之察三辰于上跡禍福乎下經緯厤數然後天步有常則風后之為也當少昊清陽之末實或亂德人神雜擾不可方物重黎又相顓頊而申理之日月即次則重黎之為也人各有能因蓺受任鳥師別名四叔三正官無二業事不竝濟晝長則宵短日南則景北天且不堪兼況以人該之夫玄龍迎夏則陵雲而奮鱗樂時也涉冬則淈泥而潛蟠避害也公旦道行故制典禮以尹天下懼教誨之不從有人之不理仲尼不遇故論六經以俟來辟恥一物之不知有事之無範所攷不齊如何可一夫戰國交爭戎車競驅君若綴旒人無所麗燭武縣縋而秦伯退師魯連係箭而聊城弛柝從往則合橫來則離安危無常要在說夫咸以得人為梟失士為尤故樊噲披帷入見高祖高祖踞洗以對酈生當此之會乃黿鳴而鱉應也故能同心戮力勤恤人隱奄受區夏遂定帝位皆謀臣之由也故一介之策各有攸建子長諜之爛然有第夫女魃北而應龍翔洪鼎聲而軍容息溽暑至而鶉火棲寒冰沍而黿鼉蟄今也皇澤宣洽海外混同萬方億醜并質共劑若修成之不暇尚何功之可立立事有三言為下列下列且不可庶矣奚冀其二哉于茲縉紳如雲儒士成林及津者風攄失塗者幽僻遭遇難要趨偶為幸世易俗異事埶舛殊不能通其變而一度以揆之斯契船而求劍守株而伺兔也冒愧逞願必無仁以繼之有道者所不履也越王句踐事此故厥緒不永捷徑邪至我不忍以投步干進苟容我不忍以歙肩雖有犀舟勁楫猶人涉卬否有須者也姑亦奉順敦篤守以忠信得之不休不獲不吝不見是而不惽居下位而不憂允上德之常服焉方將師天老而友地典與之乎高睨而大談孔甲且不足慕焉稱殷彭及周聃與世殊技固孤是求子憂朱泙曼之無所用吾恨輪扁之無所教也子睹木雕獨飛愍我垂翅故棲吾感鼃蛙附鴟悲爾先笑而後號也斐豹以獘督燔書禮至以掖國作銘弦高以牛餼退敵墨翟以縈帶全城貫高以端辭顯義蘇武以禿節效貞蒱且以飛矰逞巧詹何以沈鉤致精弈秋以棊局取譽王豹以清謳流聲僕進不能參名于二立退又不能群彼數子愍三墳之既頹惜八索之不理庶前訓之可鑽聊朝隱乎柱史且韞櫝以待價踵顏氏以行止曾不慊夫晉楚敢告誠于知己見後漢張衡傳可剖其孫枝見文選琴賦注條上司馬遷班固所敘不合事易稱宓戲氏王天下宓戲氏沒神農氏作神農氏沒黃帝堯舜氏作史遷獨載五帝不記三皇今宜并錄帝系黃帝產青陽昌意周書曰乃命少皞清清即青陽也今宜實定之見後漢張衡傳注引衡集王莽本傳但應載篡事而已至于編年月紀災祥宜為元后本紀又更始居位人無異望光武初為其將然後即真宜以更始之號建于光武之初見後漢張衡傳
