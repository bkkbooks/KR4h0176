body:
  text: 張衡七辯無為先生祖述列仙背世絕俗唯誦道篇形虛年衰志猶不遷于是七辯謀焉曰無為先生淹在幽隅藏聲隱景剗迹窮居抑其不韙盍往辯諸乃階而就之虛然子曰樂國之都設為閑館工輸制匠譎詭燠爛重屋百層連閣周漫應門鏘鏘華闕雙建雕蟲彤綠螭虹蜿蜒于是彈比翼落鸝黃加雙鶤經鴛鴦然後擢雲舫觀中流搴芙蓉集芳洲縱文身摶潛鱗探水玉拔瓊根收明月之照曜翫赤瑕之璘豳迴飆拂其寮蘭泉注其庭此宮室之麗也子盍歸而處之乎彫華子曰玄清白醴蒲陶醲嘉肴雜醢三臡七菹荔支黃甘寒梨乾榛沙餳石蜜遠國儲珍于是乃有蒭豢腯牲麋麛豹胎飛鳧棲鷩養之以時鞏洛之鱒割以為鮮審其齊和適其辛酸芳以薑椒拂以桂蘭華薌重秬滍皋香秔會稽之菰冀野之粱灂淩輭麪糅以青秔珍羞雜遝灼爍芳香此滋味之麗也子盍歸而食之安存子曰淮南清歌燕餘材舞列乎前堂遞奏代敘結鄭衛之遺風揚流哇而咏激楚鼙鼓口吹竽籟應律金石合奏妖冶邀會觀者交目衣解忘帶于是樂中日晚移即昏庭美人妖服變曲為清改賦新詞轉歌流聲此音樂之麗也子盍歸而聽諸闕丘子曰西施之徒姿容脩嫮弱顏回植妍夸閑暇形似削成腰如束素蝤蠐之領阿那宜顧淑性窈窕秀色美豔鬢髮玄髻光可以鋻靨輔巧笑清眸流眄皓齒朱脣的皪粲練于是紅華曼理遺芳酷烈侍夕先生同茲宴假明蘭燈指圖觀列蟬緜宜愧夭紹紆折此女色之麗也子盍歸而從之空桐子曰交阯緅絺筒中之紵京城阿縞譬之蟬羽製為時服以適寒暑駟秀騏之駮駿載軨獵之輶車建采虹之長旃系雌霓而為旗逸駭飆于青丘超廣漢而永逝此輿服之麗也子盍歸而乘之微霧之冠飛融之纓見御覽六百八十四案二語當在前段內依衛子曰若夫赤松王喬羨門安期噓吸沆瀣飲醴茹芝駕應龍戴行雲桴弱水越炎氛覽八極度天垠上游紫宮下棲崑崙此神仙之麗也子盍行而求之先生乃興而言曰吁美哉吾子之誨穆如清風啟乃嘉猷實慰我心矯然傾首邪睨玄圃軒臂矯翼將飛未舉蹊路詭怪見文選丘遲旦發漁浦潭詩案此語當在前段內髣無子曰在我聖皇躬勞至思參天兩地匪怠厥司率由舊章遵彼前謀正邪理謬靡有所疑旁窺八索仰鏡三墳講禮習樂儀則彬彬是以英人底材不賞而勸學而不厭教而不倦于是二八之儔列乎帝庭揆事施教地平天成然後建明堂而班辟雍和邦國而悅遠人化明如日下應如神漢雖舊邦其政惟新而先生乃翻然迴面曰君子一言于是觀智先民有言談何容易予雖蒙蔽不敏指趣敬授教命敢不是務見蓺文類聚五十七四愁詩序張衡不樂久處機密陽嘉中出為河閒相時國王驕奢不遵法度又多豪右并兼之家衡下車治威嚴能內察屬縣姦猾行巧劫皆密知名下吏收捕盡服擒諸豪俠游客悉惶懼逃出境郡中大冶爭訟息獄無繫囚時天下漸弊鬱鬱不得志為四愁詩效屈原以美人為君子以珍寶為仁義以水深雪雰為小人思以道術相報貽于時君而懼讒邪不得以通見文選南陽文學儒林書贊南陽太守上黨鮑君愍文學之弛廢懷儒林之陵遲乃命匠修而新之崇肅肅之儀揚濟濟之化見北堂書鈔綬笥銘南陽太守鮑德有詔所賜先公綬笥傳世用之時德更治笥衡時為德主薄作銘曰懿矣茲笥爰藏寶紳冠纓組履文章日信皇用我賜俾作帝臣服其令服鸞封艾民天祚明德大賚福仁垂光厥世子孫克神厥器惟舊中實惟新周公惟事七涓有鄰見初學記二十又二十六又御覽六百八十二七百十一司徒呂公誄昔呂皇祖帝交之緒伯夷秩唐唐宗允敘四岳在虞傳土佐禹克厭帝心姓姜氏呂登是南邦以家以處降及于周穆侯作輔寡于九族九族用寍登受八命衮職靡傾黃耳金鉉公餗以盈綽兮其寬皦兮其清既明且哲式保令名斿旍從風駟牡超驤去此寍寓歸于幽堂玄室冥冥修夜彌長見蓺文類聚四十七文選謝朓齊敬皇后哀增文注司空陳公誄敬仲初育發繇卜筮鳳飛觀國流光末裔天祚明德德茂于公入孝出友爰肅爰邕兼學多識窮理知幾德音孔昭翻爾灰飛賦政二城還集皇闈公實省之亹亹庶績公實靜之藹藹百僚公實愍之乃陟司空纂禹之跡導揚徽庸致訓京畿協和萬邦萬邦既協殊服來同眇論前績莫與比蹤見蓺文類聚四十七後作鴻臚職掌九賓輯寍侯衛懷柔遠人見北堂書鈔五十四大司農鮑德誄昔君烈祖平顯奕世敬叔生牙美管交賴至于中葉種德以邁種德伊何去虛適參建旄屯留其茂如林降及我君總角有聲遺蒙萬穀寵祿斯丁守約勤學克勞其形濬哲之資日就月成業業學徒童蒙我求舍厥往著去風即雅濟濟京河實為西魯昔我南都惟帝舊鄉同于郡國殊于表章命視如公弁冕鳴璜若惟允之實耀其光導以仁惠教以義方習射矍相饗老虞庠羌髡作虐艱我西鄰君斯整旅耀武月頻蠢蠢戎虜是慴是震知德者鮮惟君克舉既厭帝心將處台輔命有不永時不我與天實為之孰其能禦股肱或毀何痛如之國喪遺愛如何無思見蓺文類聚四十九靈憲昔日先王將步天路用定靈軌尋緒本元先準之於渾體是謂正議立度而皇極有逌建也樞運有逌稽也乃建乃稽斯經天常聖人無心因茲以生心故靈憲作興曰太素之前幽清玄靜寂寞冥默不可為象厥中惟虛厥外惟無如是者永久焉斯謂溟滓蓋乃道之根也道根既建自無生有太素始萌萌而未兆并氣同色渾沌不分故道志之言云有物渾成先天地生其氣體固未可得而形其遲速固未可得而紀也如是者又永久焉斯謂龐鴻蓋乃道之幹也道幹既育萬物成體于是元氣剖判剛柔始分清濁異位天成于外地定于內天體于陽故圓以動地體于陰故平以靜動以行施靜以合化堙鬱構精時育庶類斯謂天元蓋乃道之實也在天成象在地成形天有九位地有九域天有三辰地有三形有象可效有形可度情性萬殊旁通感薄自然相生莫之能紀于是人之精者作聖實始紀綱而經緯之崑崙東南有赤縣之州風雨有時寒暑有節苟非此土南則多暑北則多寒東則多風西則多陰故聖王不處焉中州含靈外制八輔八極之維徑二億三萬二千三百里南北則短減千里東西則廣增千里自地至天半于八極則地之深亦如之通而度之則是渾也將覆其數用重差鉤股縣天之景薄地之儀皆移千里而差一寸得之過此而往者未之或知也未之者知者宇宙之謂也宇之表無極宙之端無窮天有兩儀以儛道中其可覩樞星是也謂之北極在南者不著故聖人弗之名焉其世之遂九分而減二陽道左迴故天運左行有驗于物則人氣左嬴形右繚也天以陽迴地以陰浮是故天致其動稟氣舒光地致其靜承侯施明天以順動不失其中則四時順至寒暑不忒致生有節故品物用生地以靈靜作合承天清化致養四時而後育故品物用成凡至大者莫如天至厚者莫如地至質者曰地而已至多莫如水水精為漢漢周于天而無列焉思次質也地有山嶽以宣其氣精種為星星也者體生于地精成于天列居錯峙各有逌屬紫宮為皇極之居六微為五帝之庭明堂之房大角有席天市有坐蒼龍連蜷于左白虎猛據于右朱雀奮翼于前靈龜圈首于後黃神軒轅于中六閇既畜而狼蚖魚鼈罔有不具在野象物在朝象宮在人象事于是備矣懸象著明莫大乎日月其徑當天周七百三十六分之一地廣二百四十二分之一日者陽精之宗積而成鳥象烏而有三趾陽之類其數奇月者陰精之宗積而成獸象兔蛤焉陰之類其數偶其後有馮焉者羿請不死之藥于西王母姮娥竊之以奔月將往枚筮之于有黃有黃占之曰吉翩翩歸妹獨將西行逢天晦芒毋驚毋恐後且大昌姮娥遂託身于月是為蟾蠩夫日譬猶火月譬猶水火則外光水則含景故天日宣明于晝納明于夜如有瑕必露其匿人君者仰則焉夫月端其形而潔其質向日稟光月光生于日之所照魄生于日之所蔽當日則光盈就日則光盡也眾星被耀因水轉光當日之衝光常不合者蔽于地也是謂闇虛在星則星微遇月則月食日之薄地暗其明也繇暗視明明無所屈是以望之若大方其中天天地同明繇明瞻暗暗還自奪故望之若小火當夜而揚光在晝則不明也月之于夜與日同而差微星則不然強弱之差也五星五行之精眾星列布其以神著有五列焉是有三十五名一居中央謂之北斗動變定占實司王命四布于方各七為二十八宿日月運行歷示吉凶五緯經次用告禍福則天心于是見矣中外之官常明者百有二十四可名者三百二十為星二千五百而海人之占未存焉微星之數蓋萬一千五百二十庶物蠢蠢咸得繫命不然何以㧾而理諸夫三光同形有似珠玉神守精存麗其質而宣其明及其衰神歇精斁于是乎有隕星然則奔星之所墜至地則石矣凡文耀麗乎天其動者七日月五星是也周旋右迴天道者貴順也近天則遲遠天則速行則屈屈則留回留回則逆逆則遲迫于天也行遲者覿于東覿于東者屬陽行速者覿于西覿于西者屬陰日與月共配合也攝提熒惑地侯見晨附于日也太白晨星見昏附于月也二陰三陽參天兩地故男女取則焉方星巡鎮必因常度苟或盈縮不逾于次故有列司作使曰老子四星周伯王逢絜芮各一錯乎五緯之閒其見無期其行無度實妖經星之所審而察之然後吉凶宣周其詳可盡見續漢天文志上注開元占經一又五又六十四左傳序正義又桓三年正義史記天官書正義隋書天文志上北堂書鈔一百四十九又一百五十又一百五十六蓺文類聚一又九十五初學記八御覽一又二又四又七又一百五十七又八百六十九廣韻二十四鹽渾天儀渾天如雞子天體圓如彈丸地如雞中黃孤居于內天大而地小天表裏有水天之包地猶殼之裹黃天地各乘氣而立載水而浮周天三百六十五度四分之一又中分之則一百八十二度八之五覆地上一百八十二度八分之五繞地下故二十八宿半見半隱其兩端謂之南北極北極乃天之中也在正北出地上三十六度然則北極上規經七十二度常見不隱南極天之中也在正南入地三十六度南極下規七十二度常伏不見兩極相去一百八十二度半強天轉如車轂之運也周旋無端其形渾渾曰渾天也赤道橫帶天之腹去南北二極各九十一度十九分度之五橫帶者東西圍天之中腰也然則北極小規去赤道五十五度半南極小規亦道出地入地之數是故各九十一度半強也黃道斜帶其腹出赤道表裏各二十四度日之所行也日與五行黃道無虧盈月行九道春行東方青道二夏行南方赤道二秋行西方白道二冬行北方黑道二四季還行黃道故月行虧盈東西隨入節也日最短經黃道南在赤道外二十四度是其表也日最長經黃道北在赤道內二十四度是其裏也故夏至去極六十七度而強冬至去極百一十五度亦強也冬至日行南至斗二十一度則去極一百一十五度少強是故日最短夜最長景極長日出辰日入申晝行地上一百四十六度少強夜行地下二百一十九度少強夏至日在井二十五度去極六十七度少強是故日最長夜最短景極短日出寅日入戌晝行地上二百一十九度少強夜行地下一百四十六度少強則黃道斜截赤道者即春秋分之去極也斜截赤道者東西交也然則春分日在奎十四度少強西交干奎也秋分日在角五度弱東交于角也此黃道二之交中去極俱九十一度少強故景居二至長短之中奎十四角五出卯入酉日晝行地上夜行地下俱一百八十二度半強故晝夜同也今此春分去極九十一度少強秋分去極九十一度少強者就夏厤晷景之法以為率也上頭橫行第一行者黃道進退之數也本當以銅儀日月度之則可知也以儀一歲乃竟而中間又有陰雨難率成也是以作小渾盡赤道黃道乃調賦三百六十五度四分之一從冬至所在始起令之相當直也取北極及衝各鍼穿之為軸取薄竹篾穿其兩端令兩穿中閒與渾半等以貫之令察之與渾相切摩也乃從鍼半起以為百八十二度八分之五盡衝鍼之半焉又中分其鍼篾扚去其半令其半之際正直與兩端鍼半相直令篾半之際從冬至起一度一移之視篾之半際少多赤道幾何也其所多少則進退之數也從北極數之則去極之度也各分赤道黃道為二十四氣一氣相去十五度十六分之七每一氣者黃道進退一度焉所以然者黃道直時去南北極近其處地小而橫行與赤道等故以篾度之于赤道多也設一氣令十六日者皆常率四日差少半也令一氣十五日不能半耳故使中道三日之中差少半三氣一節故四十六日而差令三度也至于差三之時而五日同率者一其實一節之閒不能四十六日也令殘日居其策故五日同率也其率雖同先之皆強後之皆弱不可勝計耳至于三而復有進退者黃道稍斜于橫行得度故也春分秋分所以退者黃道始起更斜矣于橫行不得度故也亦每一氣一度焉故三氣一節亦差三度也至三氣之後稍遠而直故橫行得度而稍進也立春立秋橫行稍退矣而度猶云進者以其所退減其所進猶有盈餘未盡故也立夏立冬橫行稍進而度猶之退者以其所進增其所退猶有不足未畢故也以此論之日行非有進退也而以赤道量度黃道使之然也本二十八宿相去度數以赤道為距耳故黃道亦有進退也冬至在斗二十一度少半最遠時也而此厤斗二十度二十一俱一百一十五度強矣冬至宜與之同率焉夏至在井二十一度半強最近時也而此厤井二十三度一十四俱六十七度強矣夏至宜與之同率焉見續漢律厤志注補開元占經一案開元占經引作渾儀圖注天市二十二星帝座有一耳見開元占經六十五以銅為器再疊差置實以清水下各開孔以玉虬吐漏水入兩壼右為夜左為晝見初學記二十五案以下二條引俱作漏水轉渾天儀注蓋上又鑄金銅仙人居左壼為胥徒居右壼皆以左手抱箭右手指刻以別天時早晚見初學記二十五文選陸佐公新刻漏銘注玄圖玄者無形之類自然之根作于太始莫之與先包含道德搆掩乾坤橐籥元氣稟受無原見御覽一文選盧子諒贈劉琨詩注梟羊喜獲先笑後愁見文選吳都賦劉淵林注
