body:
  text: 段恭因會上疏伏見道路行人農夫織婦皆曰太尉龐參竭忠盡節徒以直道不能曲心孤立群邪之閒自處中傷之地臣猶冀在陛下之世當蒙安全而復以讒佞傷毀忠正此天地之大禁人主之至誡昔白起賜死諸侯酌酒相賀季子來歸魯人喜其紓難夫國以賢化君以忠安今天下咸欣陛下有此忠賢願卒寵任以安社稷見後漢龐參傳竇太后不宜別葬議皇太后自在椒房有聰母儀之德遭時不造援立聖明承繼宗廟功烈至重先帝晏駕因遇大獄遷居空宮不幸早世家雖獲罪事非太后今若別葬誠失天下之望且馮貴人冢墓被發骸骨暴露與賊併尸魂靈汙染且無功于國何宜上配至尊見後漢陳球傳又見袁宏後漢紀二十三有小異與司徒劉劭書公出自宗室位登臺鼎天下瞻望社稷鎮衛豈得雷同容容無違而已今曹節等放縱為害而久在左右又公兄侍中受害節等永樂太后所親知也今可表徙衛尉陽球為司隸校尉以次收節等誅之政出聖主天下太平可翹足而待也見後漢陳球傳又見袁宏後漢紀二十四有小異荅袁術書昔秦末世肆暴恣情虐流天下毒被生民民不堪命故遂土崩今雖季世未有亡秦苛暴之亂也曹將軍神武應期興復典刑將撥平兇慝清定海內信有徵矣足下當戮力同心匡翼漢室而陰謀不軌以身試禍豈不痛哉若迷而知反尚可以免吾備舊知故陳至情雖逆于耳骨肉之惠也欲吾營私阿附有犯死不能也見魏志袁術傳又見袁宏後漢紀二十八少末二句遺使詣袁紹告迎劉備為徐州牧天降災沴禍臻鄙州州將殂殞生民無主恐懼姦雄一旦承隙以詒盟主日昃之憂輒共奉故平原相劉備府以為宗主永使百姓知有依歸方今寇難縱橫不遑釋甲謹遣下吏奔告于執事見蜀志先主傳注引獻帝春秋奏劾劉嘉趙世光祿勳劉嘉廷尉趙世皆以被病篤困空文武之位闕上卿之贊既無忠信斷金之用而有敗禮傷化之尤不謹不敬請廷尉治嘉罪河南尹治世罪見續漢百官志二注補引蔡質漢儀奏記外黃令梁配伏聞大女緱玉為父報讎獄鞫已決不勝感悼之情敢陳所聞昔太原周黨感春秋之義辭師復讎當時論者猶高其節況玉女弱耳無所聞心無所激內無同生之謀外無交遊之助直推父子之情奮發怒之心手刃莫大之讎僵尸流血當時聞之人無勇怯莫不張膽增氣輕身重義攘袂高談稱羨其美今聞玉幽執穽檻罪名已定皆心低意沮悵恨長歎蟠雖愚昧以為玉之節義歷代未有定足以感無恥之孤激忍辱之子假玉不值明時尚望旌閭表墓顯異後嗣況事在清聽不加八議哀矜之貸誠為朝廷痛之見御覽四百四十一引杜預女記又見袁宏後漢紀二十五建康元年舉賢良方正對策陛下聖德欽明聞災責躬咨嗟群僚招延敢諫臣得踐天庭承大問此誠臣寫憤畢命之期也臣伏惟孝順皇帝初勤王政綱紀四方天下欣然幾以獲治自後遭姦偽威分近習中常侍小黃門凡數十人同氣相求如市賈焉競思作變導上以非畜貨聚馬戲謔是聞又因緣嬖倖受賂賣爵輕使賓客交錯其閒分贓解罪以攘大威公卿已下至于佐史交私其門終無紀極頑凶子弟布列州郡竝為豺狼暴虐群生天下擾擾從亂如歸至令風敗俗壞招災致寇故每有征戰鮮不挫傷官民竝竭上下窮虛臣在關西竊聽風聲未聞國家有所先後而威福之來咸歸權倖陛下體兼乾坤聰哲純茂攝政之初撥用忠貞其餘維綱多所改正遠近翕然望見太平而地震之後霧氣白濁明不光旱魃為虐大賊從橫血流川野庶品不安譴誠累至殆以姦臣權重之所致也今宜庭問百寮常侍以下尤無狀者亟便絀遣與眾共之披埽凶黨收入財賄以塞痛怨以答天誡大雅曰敬天之怒無敢戲豫此之謂也大將軍梁冀河南尹不疑處周邵之任為社稷之鎮加與王室世為姻族今日立號雖尊可也而天下區區願其霈然增修謙節省去游娛不急之費割減廬第無益之飾近儒術考論經書輔佐日月宜有至效夫君者舟也民者水也朝之群臣乘舟者也大將軍兄弟操楫者也雖曰眾也在所欲之苟能卒志畢力守遵常軌以度元元所謂福也或乃怠弛中流而捐楫放棹將淪波濤歸咎受愆可不慎乎夫德不稱祿猶鑿墉之趾以益其高豈暴力審功安固之道哉凡諸猾酒徒戲客皆耳納邪聲口出諂言甘心逸游唱造不義亦宜貶斥以懲不軌令冀等深思得賢之福失人之累又在位素餐尚書怠職有司依違莫肯糾察故使陛下專受諂諛之言不聞戶牖之外臣誠知阿諛有福深言近禍豈敢隱心以避誅責乎臣生長邊遠希步紫庭怖慴失守言不盡心見袁宏後漢紀十九後漢皇甫規傳各有刪節合錄成篇永康元年舉賢良方正對詔問日食天之于王者如君之于臣父之于子也誡以災妖使從福祥陛下八年之中三斷大獄一除內嬖再誅外臣而災異猶見人情未安者殆賢愚進退威刑所加有非其理也前太尉陳蕃劉矩忠謀高世廢在里巷劉祐馮緄趙典尹勳正直多怨流放家門李膺王畼孔翊潔身守禮終無宰相之階至於鉤黨之釁事起無端虐賢傷善哀及無辜今興改善政易于覆手而群臣杜口鑒畏前害互相瞻顧莫肯正言伏願陛下暫留聖明容受謇直則前責可弭後福必降見後漢皇甫規傳求自效疏臣比年以來數陳便宜羌戎未動策其將反馬賢始出頗知必敗誤中之言在可考校臣每惟賢等擁眾四年未有成功懸師之費且百億計出于平人回入姦吏故江湖之人群為盜賊青徐荒饑襁負流散夫羌戎潰叛不由承平皆由邊將失于綏御乘常守安則加侵暴苟競小利則致大害微勝則虛張首級軍敗則隱匿不言軍士勞怨困于猾吏進不得快戰以徼功退不得溫飽以全命餓死溝渠暴骨中原徒見王師之出不聞振旅之聲酋豪泣血驚懼生變是以安不能久敗則經年臣所以搏手叩心而增歎者也願假臣兩營二郡屯列坐食之兵五千出其不意與護羌校尉趙沖共相首尾土地山谷臣所曉習兵埶巧便臣已更之可不煩方寸之印尺帛之賜高可以滌患下可以納降若謂臣年少官輕不足用者凡諸敗將非官爵之不高年齒之不邁臣不勝至誠沒死自陳見後漢皇甫規傳上疏言羌事自臣受任志竭愚鈍實賴兗州刺史牽顥之清猛中郎將宗資之信義得承節度幸無咎譽今猾賊就滅太山略平復聞群羌並皆反逆臣生長邠岐年五十有九昔為郡吏再更叛羌豫籌其事有誤中之言臣素有固疾恐犬馬齒窮不報大恩願乞冗官備單車一介之使勞來三輔宣國威澤以所習地形兵勢佐助諸軍臣窮居孤危之中坐觀郡將已數十年矣自鳥鼠至于東岱其病一也力求猛敵不如清平勤明吳孫未若奉法前變未遠臣誠戚之是以越職盡其區區見後漢皇甫規傳上疏自訟四年之秋戎醜蠢戾爰自西州侵及涇陽舊都懼駭朝廷西顧明詔不以臣愚駑急使軍就道幸蒙威靈遂振國命羌戎諸種大小稽首輒移書營郡以訪誅納所省之費一億以上以為忠臣之義不敢告勞故恥以片言自及微效然比方先事庶免罪悔前踐州界先奏郡守孫雋次及屬國都尉李翕督軍御史張稟旋師南征又上涼州刺史郭閎漢陽太守趙熹陳其過惡執據大辟凡此五臣支黨半國其餘墨綬下至小吏所連及者復有百餘吏託報將之怨子思復父之恥載贄馳車懷糧步走交搆豪門競流謗讟云臣私報諸羌謝其錢貨若臣以私財則家無擔石如物出于官則文簿易考就臣愚惑信如言者前世尚遺匈奴以宮姬鎮烏孫以公主今臣但費千萬以懷叛羌則良臣之才略兵家之所貴將有何罪負義違理乎自永初以來將出不少覆軍有五動資巨億有旋車完封寫之權門而名成功立厚加爵封今臣還督本土糾舉諸郡絕交離親戮辱舊故眾謗陰害固其宜也臣雖汙穢廉絜無聞今見覆沒恥痛實深傳稱鹿死不擇音謹冒昧略上見後漢皇甫規傳上書薦中郎將張奐自代臣聞人無常俗而政有治亂兵無強弱而將有能否伏見中郎將張奐才略兼優宜正元帥以從眾望若猶謂愚臣宜充軍事者願乞冗官以為奐副見後漢皇甫規傳上言宜豫黨錮臣前薦故大司農張奐是附黨也又臣昔論輸左校時太學生張鳳等上書訟臣是為黨人所附也臣宜坐之見後漢皇甫規傳與劉司空牋明公至德佐國憂世雖贈兩梁冠及鮐魚一雙服厚尊貺榮施其宏見御覽四百七十八與馬融書謹遣掾尚許奉書裁上絮被一雙韤一量以通微意見書鈔一百三十四御覽七百九十七八百十九追謝趙壹書蹉跌不面企德懷風虛心委質為日久矣側聞仁者愍其區區冀承清誨以釋遙悚今旦外白有一尉兩計吏不道屈尊門下更啟乃知已去如印綬可投夜豈待旦惟君明叡平其夙心寍當慢傲加于所天在悖惑不足具責儻可原察追修前好則何福如之謹遣主簿奉書下筆氣結汗流竟趾見後漢趙壹傳女師箴觀象制教肇經乾坤家有王義室有嚴君各有定位陰陽是分昔在軒轅陶化正刑刑于壼闈以臨百官煌煌后妃女紞是閑穆穆夫人爰採潔蘩師禮莫違而神岡時怨關睢首化萬國承流實有淑女允作好述唐媛興媯文母盛周厥德不回弘濟大猷咨爾庶妃鑾路斯邁戰戰兢兢厲省鞶帶漸進不形變起無外行難著而易喪事易失而難退動若順流應如發機奉上惟敬撫下唯慈怨豈在明患生不思見蓺文類聚十五初學記十仍用四分厤議建厤之本必先立元元正然後定日法法定然後度周天以定分至三者有程則厤可成也四分厤仲紀之元起于孝文皇帝後元三年歲在庚辰上四十五歲歲在乙未則漢興元年也又上二百七十五歲歲在庚申則孔子獲麟二百七十六萬歲尋之上行復得庚申歲歲相承從下尋上其執不誤此四分曆元明文圖讖所著也太初元年歲在丁丑上極其元當在庚戌而日丙子言百四十四歲超一辰凡九百九十三超歲有空行八十二周有奇乃得丙子案歲所超于天元十一月甲子朔旦冬至日月俱超日行一度積三百六十五度四分度一而周天一帀名曰歲歲從一辰日不得空周天則歲無由超辰案百七十一歲二蔀一章小餘六十三自然之數也夫數出於抄曶以成毫氂毫氂積累以成分寸兩儀既定日月始離初行生分積分成度日行一度一歲而周故為術者各生度法或以九百四十或以八十一法有細觕以生兩科其歸一也日法者日之所行分也日垂令明行有常節日法所該通遠無已損益毫釐差以千里自此言之數無緣得有虧棄之意也今欲飾平之失斷法垂分恐傷大道以步日月行度終數不同四章更不得朔餘一雖言九道去課進退恐不足以補其闕且課厤之法晦朔變弦以月食天驗昭著莫大焉今以去六十三分之法為厤驗章和元年以來日變二十事月食二十八事與四分厤更失定課相除四分尚得多而又使近孝章皇帝厤度審正圖儀晷漏與天相應不可復尚文曜鉤曰高辛受命重黎說文唐堯即位羲和立渾夏后制德昆吾列神成周改號長弘分官運斗樞曰常占有經世史所明洪範五紀論曰民閒亦有黃帝諸厤不如史官記之明也自古及今聖帝明王莫不取言于羲和常占之官定精微于晷儀正眾疑祕藏中書改行四分之原及光武皇帝數下詔書草創其端孝明皇帝課校其實孝章皇帝宣行其法君更三聖年歷數十信而徵之舉而行之其元則上統開闢其數則復古四分宜如甲寅詔書故事見續漢律厤志中祭牙文恭羞太牢絜薦遐靈推轂之仕實討不庭天道助順正直聰明見蓺文類聚六十初學記二十一御覽三百三十九上書請合葬竇太后臣聞禹湯聞惡是用無過桀紂聞以亡其國中常侍曹節張讓王甫等因寵乘勢賊害忠良讒譖故大將軍竇武太傅陳蕃虛遭無刑之舋被以滔天之罪陛下不復省覽猥發雷霆之怒海內賢愚莫不痛心武以歿矣無可柰何皇太后親與孝桓皇帝共奉宗廟母養蒸庶擊于天心仁風豐霈四海所宗禮為人後者為人之子陛下仰繼先帝豈得不以太后為母存既未蒙顧復之報歿又不聞諒闇之哀太后未崩武先坐誅存亡各異事不相逮而恚武不己欲貶太后非崇有虞之孝昭蒸蒸之仁八方聞之莫不泣血昔秦始皇母后不謹陷幸郎吏始皇暴怒幽閉母后感茅焦之言立駕迎母置酒作樂供養如初夫以秦后之惡始皇之悖尚納茅焦之語不失母子之恩豈況太后不以罪沒陛下之過有重始皇臣謹冒昧陳誠左手齎章右手執藥詣闕自聞唯陛下揆茅焦之諫弘始皇之寤復母子之恩崇皇太后園陵之禮上釋皇乾震動之怒下解黎庶酸楚之情也如遂不省臣當飲鴆自裁下覲先帝且陳得失終不為刀鋸所裁見袁宏後漢紀二十三臣伏惟章德竇后虐害恭懷安思閻后家犯惡逆而和帝無異葬之議順朝無貶降之文至于衛后孝武皇帝身所廢棄不可以為比今長樂太后尊號在身親嘗稱制坤育天下且援立聖明光隆皇祚太后以陛下為子陛下豈得不以太后為母子無黜母臣無貶君宜合葬宣陵一如舊制見後漢陳球傳案此與袁宏紀所載互異奏事春秋之義貶纖介之惡采毫毛之善也見文選潘勖九錫文注奏記大將軍梁商將軍天覆厚恩愍舅光冤結前者溫教許為平議雖未下吏斷決其事已蒙神明顧省之聽皇天后土實聞德音竊獨踴躍私自慶幸諝聞春秋之義原情定過赦事誅意故許止雖弒君而不罪趙盾以縱賊而見書此仲尼所以垂王法漢世所宜遵前修也傳曰人心不同譬若其面斯蓋謂大小窳隆醜美之形至于鼻目眾竅毛髮之狀未有不然者也情之異者剛柔舒急倨敬之閒至于趨利避害畏死樂生亦復均也諝與光骨肉義有相隱言其冤濫未必可諒且以人情平論其理光衣冠子孫徑路平易位極州郡日望徵辟亦無瑕穢纖介之累無故刊定詔書欲以何名就有所疑當求其便安豈有觸冒死禍以解細微譬猶療飢于附子止渴于酖毒未入腸胃已絕咽喉豈可為哉昔東海孝婦見枉不辜幽靈感革天應枯旱光之所坐情既可原守闕連年而終不見理呼嗟紫宮之門泣血兩觀之下傷和致災為害滋甚凡事更赦令不應復案夫以罪刑明白尚蒙天恩豈有冤謗無徵反不得理是為刑宥正罪戮加誣侵也不偏不黨其若是乎明將軍德盛位尊人臣無二言行動天地舉厝移陰陽誠能留神沛然曉察必有于公高門之福和氣立應天下幸甚見後漢霍諝傳又見袁宏紀十八各有刪節文亦小異荅張奐書離別三年夢想言念何日有違伯英來惠書盈四紙讀之三復喜不可言見蓺文類聚三十一御覽五百九十五與張奐書烈士徇名立功立事見文選潘岳閑居賦注又王遲與陳伯之書注與高彪書今茲以五經為鼎簠書傳為俎籩祖述堯舜憲章文武未暇蜯也宜勿以為念見御覽九百四十一與段紀明書得知窮兵極遠大捷而反雖齊桓之制令支服流沙霍將軍之封祁連辛武賢之截醜虜蔑以加焉莫不魚爛雲除震懼稽顙矣見書鈔一百十七兵勢貽劉祐書昔太伯三讓人無德而稱焉延陵高揖華夏仰風吾子懷蘧氏之可卷體甯子之如愚微妙玄通沖而不盈蔑三光之明未暇以天下為事何其劭與見後漢劉祐傳與李文德書夫道之將廢所謂命也流聞乃欲相為求還東觀來命雖篤所未敢當吾嘗昧爽櫛梳坐于客堂食赤鳥之麰麥飲化益之玄醴折張騫大宛之蒜歃晉國郇瑕氏之鹽朝則誦羲文之易虞夏之書歷公旦之典禮覽仲尼之春秋夕則消搖內階詠詩南軒百家眾氏投閒而作洋洋乎其盈耳也渙爛兮其溢目也紛紛欣欣兮其獨樂也當此之時不知天之為蓋地之為輿不知世之有人己之有軀也雖漸離擊筑傍若無人高鳳讀書不知暴雨方之于吾未足況也且吾自束脩已來為人臣不陷于不忠為人子不陷于不孝上交不諂下交不黷從此而歿下見先君遠祖可不慚赧如此而不以善止者恐如教羿射者也慎勿迷其本棄其生也見後漢延篤傳又御覽四百三十一九百七十七仁孝論觀夫仁孝之辯紛然異端互引典文代取事據可謂篤論矣夫人二致同源總率百行非復銖兩輕重必定前後之數也而如欲分其大較體而名之則孝在事親仁施品物施物則功濟于時事親則德歸于己于己則事寡濟時則功多推此以言仁則遠矣然物有出微而著事有由隱而章近取諸身則耳有聽受之用目有察見之明足有致遠之勞手有飾衛之功功雖顯外本之者心也遠取諸物則草木之二始于萌芽終于彌蔓枝葉扶疏榮華紛縟木雖繁蔚致之者根也夫仁人之有孝猶四體之有心腹枝葉之有本根也聖人知之故曰夫孝天之經也地之義也人之行也君子務本本立而道生孝悌也者其為仁之本與然體大難備物性好偏故所施不同事少兩兼者也如必對其優劣則仁以枝葉扶疏為大孝以本根充實為先可無訟也或謂先孝後仁非仲尼序回參之意蓋以為仁孝同質而生純體之者則互以為稱虞舜顏回是也若偏而體之則各有其目公劉曾參是也夫曾閔以孝悌為至德管仲以九合為仁功未有論德不先回參考功不大夷吾以此而言各從其稱者也見後漢延篤傳又御覽四百十九
