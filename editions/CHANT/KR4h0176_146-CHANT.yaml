body:
  text: 侯瑾箏賦物順合于律呂音協同于宮商朱絃微而慷慨兮哀氣切而懷傷見初學記十六于是急絃促柱變調改曲卑殺纖妙微聲繁縟散清商而流轉兮若將絕而復續紛曠蕩以繁奏邈遺世而越俗若乃察其風采練其聲音美哉蕩乎樂而不淫雖懷思而不怨似豳風之遺音于是雅曲既闋鄭衛仍修新聲順變妙弄優遊微風漂裔冷氣輕浮感悲音而增歎愴顦悴而懷愁若乃上感天地下動鬼神享祀宗祖酬酢嘉賓移風易俗混同人倫莫有尚于箏者矣見蓺文類聚四十四又初學記十六引兩條又略見文選月賦注陸機猛虎行注謝靈運擬鄴中集詩注劉峻廣絕交論注皇德頌敘侯瑾字子瑜敦煌人少孤貧依宗人居性篤學恆傭作為資暮還輒爇薪讀書見御覽八百二十九復刺遺馬融書伏聞高問為日久矣冀一見寵光敘腹心之願以啟其蔽不圖辭之以疾昔周公父文王兄武王九命作相以尹華夏猶握沐吐食以接白屋之士天下歸德歷載邈矣今君不能相見宜哉見御覽六百六引雜事承服風問從來有年故不待介者而謁大君子之門冀一見龍光以敘腹心之願不圖遭疾幽閉莫啟昔周公旦父文兄武九命作伯以尹華夏猶揮沐吐餐垂接白屋故周道以隆天下歸德公今養痾傲士故其宜也見後漢高彪傳督軍御史箴餞贈第五永文武將墜迺俾俊臣整我皇綱董此不虔古之君子即戎忘身昭其果毅尚其桓桓師尚七十氣冠三軍詩人作歌如鷹如鸇天有太一五將三門地有九變丘陵山川人有計策六奇五閒總茲三事謀則咨詢無曰己能務在求賢淮陰之勇廣野是尊周公大聖石碏純臣以威克愛目義滅親勿謂時險不正其身勿謂無人莫識己真忘富遺貴福祿迺存枉道依合復無所觀先公高節越可永遵佩藏斯戒以厲終身見後漢高彪傳淳化閣帖二清誡天長而地久人生則不然又不養以福祿全其壽年飲酒病我性思慮害我神美色伐我命利慾亂我真神明無聊賴愁毒于眾煩中年棄我逝忽若風過山形氣各分離一往不復還上士愍其痛抗志淩雲煙滌蕩棄穢累飄邈任自然退修清以淨吾存玄中玄澄清翦思慮泰清不受塵恍惚中有物希微無形端智慮赫赫盡谷神綿綿存見蓺文類聚二十三大儺賦于吉日之上戊將大蜡于臘烝先茲日之酉久宿潔淨以清澄乃班有司聚眾大儺天子坐華駿臨朱軒凭玉几席文彌率百隸之侲子群鼓噪于宮垣見御覽五百三十與妻徐淑書不能養志當給郡使隨俗順時僶俛當去知所苦故爾未有瘳損想念悒悒勞心無己當涉遠路趨走風塵非志所慕慘慘少樂又計往還將彌時節念發同怨意有遲遲欲暫相見有所屬託今遣車往想必自力見蓺文類聚三十二重報妻書車還空反甚失所望兼敘遠別恨恨之情顧有悵然間得此鏡既明且好形觀文彩世所希有意甚愛之故以相與并致寶釵一雙價值千金龍虎組履一緉好香四種各一斤素琴一張常所自彈也明鏡可以鏡形寶釵可以耀首芳香可以馥身去穢麝香可以辟惡氣素琴可以娛耳見蓺文類聚三十二書鈔一百三十六引兩條御覽六百九十七七百十七七百十八又九百八十一引兩條露布上書移副三府臣聞皇后天下母德配坤靈得其人則五氏來備不得其人則地動搖宮比年災異可謂多矣皇天之戒可謂至矣高祖受命至今三百六十四歲君期一周當有黃精代見姓陳項虞田許氏不可令此人居太尉太傅典兵之官舉厝至重不可不慎班功行賞宜應其實梁冀雖持權專擅虐流天下今以罪行誅猶召家臣搤殺之耳而猥封謀臣萬戶以上高祖聞之得無見非西北列將得無解體孔子曰帝者諦也今官位錯亂小人詔進財貨公行政化日損尺一拜用不經御省是帝欲不諦乎見後漢李雲傳又略見袁宏後漢紀二十一詣巴郡太守自訟孝桓帝以并州史泰山但望字伯闔為巴郡太守懃恤民隱郡文學掾宕渠趙芬掾弘農馮尤墊江龔榮王祈李溫臨江嚴就胡良文愷安漢陳禧閬中黃閶江州母成陽譽喬就張紹牟存平直等詣望自訟曰郡境庭遠千里給吏兼將人從冬往夏還夏單冬複惟逾時之役懷怨曠之思其昏喪吉凶不得相見解緩補綻下至薪菜之物無不躬買于市富者財得自供貧者無以自久是以清儉天枉不聞加以水陸艱難山有猛獸思迫期會隕身江河投死虎口咨嗟之歎歷世所苦天之應感乃遭明府欲為更新童兒匹婦懽喜相賀將去遠就近釋危蒙安縣無數十民無遠邇恩加未生澤及來世巍巍之功勒于金石乞以文書付計掾史人鬼同符必獲嘉報芬等幸甚見華陽國志一白趙芬等事芬等前後百餘人歷政訟訴未蒙感悟明府遠機布政稽當皇極為民庶命救患德合天地澤潤河海開辟以來今遇慈父經曰奕奕梁山惟禹甸之有倬其道韓侯受命比隆等盛于斯為美見華陽國志一請分郡疏謹按巴郡圖經境界南北四千東西五千周萬餘里屬縣十四鹽鐵五官各有丞史戶四十六萬四千七百八十口百八十七萬五百三十五遠縣去郡千二百至千五百里鄉亭去縣或三四百或及千里土界遐遠令尉不能窮詰姦凶時有賊發督郵追案十日乃到賊已遠逃蹤跡滅絕罪錄逮捕證驗文書詰訊即從春至冬不能究訖繩憲未加或遇德令是以賊盜公行姦宄不絕榮等及隴西太守馮含上谷太守陳弘說往者至有劫閬中令楊殷終津侯姜昊傷尉蘇鴻彭亭侯孫魯雍亭侯陳已殷侯樂普又有女服賊千有餘人布散千里不即發覺謀成乃誅其害陸覆水煞郡掾枳謝盛塞威張御魚服令尹尋主簿胡直若此非一給吏休謁往還數千閉囚須報或有彈劾動便歷年吏坐踰科恐失冬節侵疑先死如當移傳不能待報輒自刑戮或長吏忿怒冤枉弱民欲赴訴郡官每憚還往太守行桑農不到四縣剌史行部不到十縣郡治江州時有溫風遙縣客吏多有疾病地勢側險皆重屋累居數有火害又不相容結舫水居五百餘家二江之會夏水漲盛壞散顛溺死者無數而江州以東濱江山險其人半楚姿庇敦重墊江以西土地平敞精敏輕疾上下殊俗情性不同敢欲分為二郡一治臨江一治安漢各有桑麻丹漆布帛魚池鹽鐵足相供給兩近京師榮等自欲義出財帛造立府寺不費縣官得百姓懽心孝武以來亦分吴蜀諸郡聖德廣被民物滋繁增置郡土釋民之勞誠聖主之盛業也臣雖貪大郡以自優暇不忍小民顒顒蔽隔謹具以聞見華陽國志一遺書敕子胤夫含氣之倫有生必終蓋天地之常期自然之至數是以通人達士鑒茲性命以存亡為晦明死生為朝夕故其生也不為娛亡也不為戚夫亡者元氣去體貞魂游散反素復始歸于無端既已消仆還合糞土土為棄物豈有性情而欲制其厚薄調其燥溼邪但以生者之情不忍見形之毀迺有掩骼埋窆之制易曰古之葬者衣以薪藏之中野後世聖人易之以棺椁棺椁之造自黃帝始爰自陶唐逮于虞夏猶尚簡樸或瓦或木及至殷人而有加焉周室因之制兼二代復重以牆翣之飾表以旌銘之儀招福含斂之禮殯葬宅兆之期棺椁周重之制衣衾稱襲之數其事煩而害實品物碎而難備然而秩爵異級貴賤殊等自成康以下其典稍乖至于戰國漸至穨陵法度衰毀上下僭雜終使晉侯請隧秦伯殉葬陳大夫設參門之木宋司馬造石椁之奢爰暨暴秦違道廢德滅三代之制興淫邪之法國貲糜于三泉人力單于酈墓玩好窮于糞土伎巧費于窀穸自生民以來厚終之敝未有若此者雖有仲尼重明周禮墨子勉以古道猶不能禦也是以華夏之士爭相陵尚違禮之本事禮之末務禮之華棄禮之實單家竭財以相營赴廢事生而營終亡替所養而為厚葬豈云聖人制禮之意乎記曰喪雖有禮哀為主矣又曰喪與其易也寧戚今則不然并棺合椁以為孝愷豐貲重襚以昭惻隱吾所不取也昔舜葬蒼梧二妃不從豈有匹配之會守常之所乎聖主明王其猶若斯況于品庶禮所不及古人時同即會時乖則別動靜應禮臨事合宜王孫裸葬墨夷露骸皆達于性理貴于速變梁伯鸞父沒卷席而葬身亡不反其尸彼數子豈薄至親之恩亡忠孝之道邪況我鄙闇不得不敏薄意內昭志有所慕上同古人下不為咎果必行之勿生疑異恐爾等目厭所見耳諱所議必欲改殯以乖吾志故遠采古聖近揆行事以悟爾心但欲制坎令容棺椁棺歸即葬平地無墳勿卜時日葬無設奠勿留墓側無起封樹於戲小子其勉之哉吾蔑復有言矣見後漢趙咨傳廣野君廟碑延熹六年十二月雍丘令董生仰餘徽于千載遵茂美于絕代命縣人萇照為文用章不朽之德輟洗分餐諮謀帝猷陳鄭有涿鹿之功海岱無牧野之戰大康華夏綏靜黎物生民以來功盛莫崇見水經睢水注在獄自列狀前長沙賊胡蘭作難荊州餘黨散入交阯磐身膺甲冑涉危履險討擊凶患斬殄渠師餘燼鳥竄冒遁還奔荊州刺史度尚懼磐先言怖畏罪戾伏奏見誣磐備位方伯為國爪牙而為尚所枉受罪牢獄夫事有虛實法有是非磐實不辜赦無所除如忍以苟免永受侵辱之恥生為惡吏死為敝鬼乞傳尚詣廷尉面對曲直足明真偽尚不徵者磐埋骨牢檻終不虛出望塵受枉見後漢度尚傳上書劾朱瑀臣聞治國之要得賢則安失賢則危故舜有臣五人而天下治湯舉伊尹不仁者遠陛下即位之初未能萬機皇太后念在撫育權時攝政故中常侍蘇康管霸應時誅殄太傅陳蕃大將軍竇武尚書令尹勳知中官姦亂考其黨與志清朝政華容侯朱瑀知事覺露禍及其身遂興造逆謀作亂王室撞蹋省闥執奪璽綬迫脅陛下聚會群臣離間骨肉母子之恩遂誅蕃武及尹勳等因共割裂城社自相封賞父子兄弟被蒙尊榮素所親厚布在州郡或登九列或據三司不惟祿重位尊之責而苟營私門皮剝小民甚于狼虎多蓄財貨繕治第舍連里竟巷盜取御水以作魚釣車馬服玩擬于天家群公卿士杜口吞聲莫敢有言州牧郡守承順風旨辟召選舉釋賢取愚故蟲蝗為之生夷寇為之起天意憤盈積十餘年矣故頻歲日食于上地震于下所以譴戒人主欲令覺悟誅鉏無狀昔高宗以雉雊之變故獲中興之功近者神祇啟悟陛下發赫斯之怒故王甫父子應時馘截路人士女莫不稱善若除父母之讎誠怪陛下復忍孽臣之類不悉殄滅昔秦信趙高以危其國吳使刑人身遘其禍虞公抱寶牽馬魯昭見逐乾侯以不用宮之奇子家駒以至滅辱今瑀等竝在左右陛下春秋富盛以不忍之恩赦夷族之罪懼惑佞諂以作不軌姦謀一成悔亦何及臣為郎十五年皆耳目聞見瑀之所為誠皇天所不復赦願陛下留漏刻之聽裁省臣表埽滅醜類以荅天怒與瑀考驗有不如言願受湯鑊之誅妻子并徙以絕妄言之路見袁宏後漢紀二十四光和三年又見後漢曹節傳上言王漢月食注之失推漢己巳元則考靈曜旃蒙之歲乙卯元也與光晃甲寅元相經緯于以追天作厤校三光之步今為疏闊孔子緯一事見二端者明厤興廢隨天為節甲寅厤于孔子時效己巳目顓頊秦所施用漢興草創因而不易至元封中迂闊不審更用太初應期三百改憲之節甲寅己巳讖雖有文略其年數是以學人各傳所聞至于課校罔得厥正夫甲寅元天正正月甲子朔旦冬至七曜之起始于牛初乙卯之元人正己巳朔旦立春三光聚天廟五度課兩元端閏餘差百五十二分之三朔三百四中節之餘二十九以效信難聚漢不解說但言先人有書而已以漢成注參官施行術不同二十九事不中見食二事案漢習書見己巳元謂朝不聞不知聖人獨有興廢之義史官有附天密術甲寅己巳前已施行效後格而不用河平疏闊史官已廢之而漢以去事分爭殆非其意雖有師法與無同課又不近密其說蔀數術家所共知無所采取見續漢律厤志中為司隸奏單安徐盛此等皆宮宦昆叔刀鋸之餘橫蒙恩私剖符三河不能思展命力以荅天地敢張豺狼之口吞噬百姓之命罪深釁重人鬼同疾臣銜命操斤翦其凶醜輒孝核贓罪事皆伏上見袁宏後漢紀二十二上書興黨獄司隸李膺御史中丞陳蕃汝南范滂潁川杜密南陽岑晊等相與結為黨誹謗朝廷迫脅公卿自相薦舉三桓專魯六卿分晉政在大夫春秋所譏赫者天子所以布大德于天下蘇枯解難者也而膺等公于赦後論殺無忌方命為虐行其私威且膺等養太學游士交結諸郡生徒更相驅馳共為部黨誹訕朝廷疑亂風俗不可長見後漢黨錮傳序延熹八年舉賢良方正上書陳事臣瑜自念東國鄙陋得以豐沛枝胤被蒙復除不給卒伍故太尉楊秉知臣竊闚典籍猥見顯舉誠冀臣愚直有補萬一而秉忠謨不遂命先朝露臣在下土聽聞歌謠驕臣虐政之事遠近呼嗟之音竊為辛楚泣血漣如幸得引錄備荅聖問泄寫至情不敢庸回誠願陛下且以須臾之慮覽今往之事人何為咨嗟天曷為動變蓋諸侯之位上法四七垂文炳燿關乎盛衰者也今中官邪孼比肩裂土皆競立胤嗣繼體傳爵或乞子疏屬或買兒市道殆乖開國承家之義古者天子一娶九女娣姪有序河圖授嗣正在九房今女嬖令色充積閨帷皆當盛其玩飾宂食空宮勞散精神生長六疾此國之費也生之傷也且天地之性陰陽正紀隔絕其道則水旱為并詩云五日為期六日不詹怨曠作歌仲尼所錄況從幼至長幽藏歿身又常侍黃門亦廣妻娶怨毒之氣結成妖眚行路之言官發略人女取而復置轉相驚懼孰不悉然無緣空生此謗鄒衍匹夫杞氏匹婦尚有城崩霜隕之異況乃群輩咨怨能無感乎昔秦作阿房國多刑人今第舍增多窮極奇巧掘山攻石不避時令促以嚴刑威以正法民無罪而覆入之民有田而覆奪之州郡官府各自考事姦情賕賂皆為吏餌民愁鬱結起入賊黨官輒興兵誅討其罪貧困之民或有賣其首級以要酬賞父兄相代殘身妻孥相視分裂窮之如彼伐之如此豈不痛哉又陛下以北辰之尊神器之寶而微行近習之家私幸宦者之舍賓客市買熏灼道路因此暴縱無所不容今三公在位皆博達道蓺而各正諸己莫或匡益者非不智也畏死罰也惟陛下設置七臣以廣諫道及開東序金滕史官之書從堯舜禹湯文武致興之道遠佞邪之人放鄭衛之聲則政致和平德感祥風矣臣悾悾推情言不足採懼以觸忤征營慴悸見後漢劉瑜傳太白出西方上書皇太后太白犯房左驂上將星入太微其占宮門當閉將相不利姦人在主傍願急防之見後漢竇武傳與竇武陳蕃書星辰錯繆不利大臣宜速斷大計見後漢竇武傳馬賦吾有駿馬名曰騏雄龍頭鳥目麟腹虎胸尾如雪彗耳如插筒見御覽八百九十七神龍賦大哉龍之為德變化屈伸隱則黃泉出則升雲聖賢其似之乎惟天神上帝之馬含胎春夏房心所作軒照形角尾規矩見蓺文類聚九十六
