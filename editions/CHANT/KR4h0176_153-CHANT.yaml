body:
  text: 蔡邕難夏育請伐鮮卑熹平六年夏護烏桓校尉育上言鮮卑仍犯諸郡自春已來三十餘發請徵幽州諸郡兵出塞擊之冬春足以埽滅時故護羌校尉田晏以他論刑被原私留京師用尚書行賄通謀中常侍王甫求為將甫建議當出師與育并力詔書遂用為破鮮卑中郎將使匈奴中郎將南單于以下與育晏三道竝出時朝廷大臣多以為不便召公卿百官會議議郎蔡邕以為書戒猾夏易伐鬼方周宣王命南仲吉甫攘獫狁威蠻荊漢有衛霍闐顏瀚海竇憲燕然之事征討殊類所由尚矣然而時有同異勢有可否故謀有得失事有成敗不可齊也自漢興以來匈奴常為邊害而未聞鮮卑之事昔謀臣竭精武夫僇力而所見常異其設不戰之計守禦之固者皆社稷之臣永久之策也孝武皇帝情存遠略志闢四方南伐百越北討強胡西征大宛東并朝鮮因文景之蓄藉天下之饒兵出數十年閒帑藏空竭官民俱匱乃興鹽鐵酤榷之利設告緡重稅之令民不堪命起為盜賊關東紛然道路不通繡衣直指之使奮鈇鉞而竝出然後僅得寧息既而覺悟乃息兵罷役封丞相為富民侯故主父偃曰夫務戰勝窮武事未有不悔者也夫以世宗神武將卒良猛財賦充實所拓廣遠而猶有悔焉況無彼時地利人財之備而欲輕動此其不可一也鮮卑種眾新盛自匈奴北遁以來據其故地稱兵十萬彌地千里才力勁健意智益生加以關塞不嚴禁網多漏精金良鐵出者莫察皆為賊有漢民逋逃為其謀主兵利馬疾過于匈奴昔段熲良將習兵善戰經營西羌猶十餘年今育晏以一年之期專勝必克育晏才策未能過熲鮮卑種眾又不弱于西羌乃欲張設近期誘戲朝廷三年不成必迫于害禍結兵連不得中休轉運糧饟不可勝給天無豐歲官殫見財民人流移于四方不能還其骸骨以此時興議橫發一發不已必至再三諸夏之內弱者伏尸彊者作寇邊陲之患手足之蚧瘙也中國之困胸背之瘭疽也其不可二也育云自春以來三十餘發方今郡縣盜賊劫摽人財攻犯官民日月有之冠帶之圻吏調政密尚不能禁況此醜虜群類抵冒心不受仁瞻不畏威而可使斷無盜竊昔者高祖乃忍平城之恥呂后甘棄慢書之咎方之于今何者為甚是其不可三也天設山河秦築長城漢起塞垣所以別外內異殊俗也其外則分之夷狄其內則任之良吏嗣後遵業慎奉所遺苟無蹙國內侮之患則可矣豈與蟲螘狡寇計爭往來之數哉乃欲越幕踰域城度塞出攻得地不可耕農得民不可冠帶破之不可殄盡而本朝必為之旰食四海必為之焦枯其不可四也夫煎盡府帑之蓄以恣輕事之人專勝者未必克挾疑者未必敢眾所謂危聖人不任朝議有嫌明主不行是其不可五也案育一戰所獲不如所失昔淮南王安諫伐越曰天子之兵有征無戰言其莫敢校也如使越人蒙死徼幸以逆執事廝輿之卒有一不備而歸者雖得越王之首猶為大漢羞之而育欲以齊民易醜虜皇威辱外夷就如其言猶已危矣況乎得失不可量邪昔珠崖郡反孝元皇帝納賈損之言而下詔曰珠崖背畔今議者或曰可討或曰棄之朕日夜惟思羞威化不行則欲伐之狐疑避難則守為長宜通乎時變且憂萬民夫萬民之飢餓與蠻夷之不討何者為大宗廟之祭凶年猶有不備況避不遜之辱哉今關東大困無以相贍又當動兵非但勞民而已凶年隨之罷弊有不可勝言者其罷珠崖郡此元帝所以發德音也夫卹民救急雖成郡列縣尚猶棄之況以鄣塞之外未嘗為民居者乎臣愚以為宜止攻伐之計令諸營甲士循行塞垣屯守衝要以堅牢不動為務若乃守邊之術李牧善其略保塞之論嚴尢申其要遺業猶在文章具存循二子之策守先帝之規臣曰可矣臣邕愚戇議不足采臣邕頓首見本集袁宏後漢紀二十四後漢鮮卑傳通典一百九十六宗廟選毀議左中郎將臣邕議以為漢承亡秦滅學之後宗廟之制不用周禮每帝即位輒立一廟不止于七不列昭穆不定迭毀孝元皇帝時丞相匡衡御史大夫貢禹始建大議請依典禮孝文孝武孝宣皆以功德茂盛尊崇廟稱為宗不毀孝文曰太宗孝武曰世宗孝宣曰中宗初孝宣尊崇孝武時中正大臣夏侯勝等猶執異議欲出世宗不應為宗至孝成皇帝時議猶不定太僕王舜中壘校尉劉歆據經傳義謂不可毀上從其議古人據正重慎不敢私其君父若此其至也後遭王莽之亂光武皇帝受命中興廟稱世祖孝明皇帝聖德聰明政參文宣廟稱顯宗孝章皇帝至孝烝烝仁恩涷大海內賴祉廟稱肅宗比方前事得禮之宜自此以下政事多釁權移臣下嗣帝殷勤各欲襃崇至親而已臣下懦弱莫能執夏侯之直故遂衍濫無有方限今聖朝遵古復禮以求厥中誠合事宜禮傳封儀自依家法不知國家舊有宗儀聖主賢臣所共刱定欲就六廟黜損所宗違先帝舊章未可施行臣謹案禮制七廟三昭三穆與太祖七孝元皇帝世在弟第八光武皇帝世在弟九故以元帝為考廟尊而奉之孝明遵述亦不敢毀元帝于今朝九世以七廟言之則非所宗親盡宜毀八月酬報可出元帝主比惠景昭成哀平帝五年而再殷合食于太祖孝章皇帝孝安皇帝孝桓皇帝親在三昭孝和皇帝孝順皇帝孝靈皇帝親在三穆廟親未盡四時常陳孝和以下穆宗恭宗敬宗之號皆宜省去以遵先典殊異祖宗不可參竝之義今又總就一堂崇約尚省不復改作惟主及几筵應改而已正數世之所闕為無窮之常典稽禮制之舊則合神明之歡心臣愚戇議不足采臣邕云云見本集袁宏後紀二十六後漢祭祀志下注補引袁山松書載邕議通典四十七被州辟辭讓申屠蟠申屠蟠稟氣玄妙性敏心通喪親盡禮幾于毀滅至行美義人所鮮能安貧樂潛味道守真不為燥溼輕重不為窮達易節方之于邕以齒則長以德則賢見後漢申屠蟠傳與何進書薦邊讓明將軍以申甫之德當中興之隆建上將之任應秉國之權妖寇作孼震驚京師運籌帷幄定策屆勝先擒馬元歸近之變天兵致誅兗豫以清冀荊用次雲消席卷克厭眾心王室已寧萬國兆民莫不賴祉伏惟幕府初開博選清英華髮舊德竝為元龜成功立事莫不畢舉雖振鷺之集西雝濟濟之在周庭無以或加伏見令史陳留邊讓字文禮天授逸才聰明賢智纂成伐柯不遠之則齔齠夙孤不墜家訓及就學便就大典閒不遊戲初覽諸經見本知義尋端極緒授者不能荅其問章句不能邃其意詩書易禮先通三業以次大義略舉眾傳篇章無術不綜心通性達割纖入冥口辨辭長而節之以禮安詳審固守持內定非禮勿動非法不言若處狐疑之論定嫌審之分經典交至檢括參合眾夫寂焉莫之能奪也使讓生于光代在唐虞則元凱之比當仲尼則顏冉之亞豈徒世俗之凡偶兼渾是非講論而已哉才蓺言行卓逸不群階級名位亦宜超然不以常制為限長幼之拘若復輩從此郡選舉非所以彰瓌瑋之高價昭大知之絕足也傳曰函牛之鼎一旦立之以烹雞多汁則淡而不可食少汁則焦而不可熟此言大器之于小用固有所不宜也邕誠竊悁悒怪此寶鼎未受犧牛大羹之和久在煎熬臠胾之閒願明將軍回謀守慮思垂采納就讓疾病當親察之更以屬缺招延表貢行壯列于王府躋之宗伯納之機密展其力用副其器量夫若以年齒為嫌則顏淵不得冠德行之首子奇不得紀治阿之功苟能其事古今一也密疏特表及期而行邦國其昌邕寢疾羸匍匐拜寄不敢須通見本集後漢邊讓傳徒朔方報楊復書昔此徒者故城門校梁伯喜南郡太守馬季長或至三歲近者歲除多得旋返自甘罪戾不敢慕此見段公路北戶錄徒朔方報羊陟書幸得無恙遂至徒所自城以西惟青紫鹽也同上與故郡將子橋伯尉書枉屈麟鸞奉計王室見書鈔四十與梁伯張府君書復惠良筆下士所無見書鈔一百四與袁公書朝夕游談從學宴飲酌麥醴燔乾魚欣欣焉樂在其中矣見書鈔一百四十八文選應瑒百一詩注書大官令執役斯碎非文雅所使也見書鈔五十五侍中執事相見無期惟是筆疏可以當面見書鈔一百四初學記二十一文選陸機謝平平原內史表注邕薄祜早喪二親年逾三十鬢髮二色叔父親之猶若幼童居則侍坐食則比豆御覽四百三十二家祖居常言客有三當死夜半蠶時至人室家也今者一行而犯其兩見御覽八百二十五釋誨閑居翫古不交當世感東方朔客難及揚雄班固崔駰之徒設疑以自通乃斟酌群言韙其是而矯其非作釋誨以戒厲云爾有務世公子誨于華顛胡老曰蓋聞聖人之大寶曰位故以仁守位以財聚人然則有位斯貴有財斯富行義達道士之司也故伊摯有負鼎之衒仲尼設執鞭之言甯子有清商之歌百里有豢牛之事夫如是則聖哲之通趣古人之明志也今夫子生清穆之世稟醇和之靈覃思典籍韞櫝六經安貧樂賤與世無營沈精重淵抗志高冥包括無外綜祈無形其已久矣曾不能拔萃出群揚芳飛文登天庭序彝倫埽六合之穢慝清宇宙之埃塵連光芒于白日屬炎氣于景雲時逝歲暮默而無聞小子惑焉是以有云方今聖上寬明輔弼賢知崇英逸偉不墜于地德弘者建宰相而裂土才羨者荷榮祿而蒙賜盍亦回塗要至俛仰取容輯當世之利定不拔之功榮家宗于此時遺不滅之令蹤夫獨未之思邪何為守彼而不通此胡老慠然而笑曰若公子所謂覩曖昧之利而忘昭哲之害專必成之功而忽蹉跌之敗者已公子謖爾斂袂而興曰胡為其然也胡老曰居吾將釋汝昔自太極君臣始基有羲皇之洪寧唐虞之至時三代之隆亦有緝熙五伯扶微勤而撫之于斯已降天綱縱人紘弛王塗壞太極陁君臣土崩上下瓦解于是智者騁詐辯者馳說武夫奮勇戰士講銳電駭風馳霧散雲披變詐乖詭以合時宜或畫一策而綰萬金或談崇朝而錫瑞珪連衡者六印磊落合縱者駢組流離隆貴翕習積富無崖據巧蹈機以忘其危夫華離蒂而萎條去幹而枯女冶容而淫士背道而辜人毀其滿神疾其邪利端始萌害漸亦芽速速方轂夭夭是加欲豐其屋乃蔀其家是故天地否閉聖哲潛形石門守晨沮溺耦耕顏歜抱璞蘧瑗保生齊人歸樂孔子斯征雍渠驂乘逝而遺輕夫豈傲主而背國乎道不可以傾也且我聞之日南至則黃鍾應融風動而魚上冰蕤賓統則微陰萌蒹葭蒼而白露凝寒暑相催陰陽代興運極則化理亂相承今大漢紹陶唐之洪烈盪四海之殘災隆隱天之高拆絙地之基皇道惟融帝猷顯丕泯泯庶類含甘吮滋檢六合之群品躋之乎雍熙群僚恭己于職司聖主垂拱乎兩楹君臣穆穆守之以平濟濟多士端委縉綎鴻漸盈階振鷺充庭譬猶鍾山之玉泗濱之石累珪璧不為之盈採浮磬不為之索曩者洪源辟而四隩集武功定而干戈戢玁狁襄而吉甫宴城濮捷而晉凱入故當其有事也則蓑笠竝載擐甲揚鋒不給于務當其無事也則舒紳緩佩鳴玉以步綽有餘裕夫世臣閥子𥊍御之族天隆其祐主豐其祿抱膺從容爵位自從攝須理髥餘官委貴其進取也順傾轉圓不足以喻其便逡巡放屣不足以況其易夫夫有逸群之才人人有優贍之智童子不問疑于老成瞳矇不稽謀于先生心恬澹于守高意無為于持盈粲乎煌煌莫非華榮明哲泊焉不失所寧狂淫振蕩乃亂其情貪夫徇財夸者死權瞻仰此事體躁心煩闇謙盈之効迷損益之數騁駑駘于修路慕騏驥而增驅卑俯乎外戚之門乞助乎近貴之譽榮顯未副從而顛踣下獲熏胥之辜高受滅家之誅前車已覆襲軌而騖曾不鑒禍以知畏懼予誰悼哉害其若是天高地厚跼而蹐之怨豈在明患生不思戰戰兢兢必慎厥尤且用之則行聖訓也舍之則藏至順也夫九河盈溢非一曲所防帶甲百萬非一勇所抗今子責匹夫以清宇宙庸可以水旱而累堯湯乎懼煙炎之毀熸何光芒之敢揚哉且夫地將震而樞星直井無景則日陰食元首寬則望舒眺侯王肅則月側匿是以君子推微達著尋端見緒履霜知冰踐露知暑時行則行時止則止消息盈沖取諸天紀利用遭泰可與處否樂天知命持神任己群車方奔乎險路安能與之齊軌思危難而自豫故在賤而不恥方將騁馳乎典籍之崇塗休息乎仁義之淵藪盤旋乎周孔之庭宇揖儒墨而與為友舒之足以光四表收之則莫能知其所有若乃丁千載之運應神靈之符闓閶闔乘天衢擁華蓋奉皇樞納玄策于聖德宣太平于中區計合謀從己之圖也勳績不立予之辜也龜鳳山翳霧露不除踊躍草萊秪見其愚不我知者將謂之迂修業思真棄此焉如靜以俟命不斁不渝百歲之後歸乎其居幸其獲稱天所誘也罕漫而已非己咎也昔伯翳綜聲于鳥語葛盧辨音于鳴牛董父受氏于豢龍奚仲供德于衡輈倕氏興政于巧工造父登御于驊騮非子享土于善圉狼瞫取右于禽囚弓父必精于筋角佽非明勇于赴流壽王創基于格五東方要幸于談優上官效力于執蓋弘羊據相于運籌僕不能參迹于若人故抱璞而優遊于是公子仰首降階忸怩而避胡老乃揚衡含笑援琴而歌歌曰練予心兮浸太清滌穢濁兮存正靈和液畼兮神氣寧情志泊兮心亭亭嗜欲息兮無由生踔宇宙而遺俗兮眇翩翩而獨征見本集後漢蔡邕傳蓺文類聚一十五
