body:
  text: 蓋勳與董卓書昔伊尹霍光權以立功猶可寒心足下小醜何以終此賀者在門弔者在閭可不慎哉見後漢蓋勳傳又見袁宏後漢紀二十五使人書木表使國家尸我于此見袁宏後漢紀二十六募兵議烏桓兵寡而與鮮卑世為仇敵若烏桓被發則鮮卑必襲其家烏桓聞之當復棄軍還救非唯無益于實乃更沮三軍之情鄒靖居近邊塞究其態詐若令靖募鮮卑輕騎五千必有破敗之效見後漢應劭傳皇后敬父母議獻帝皇后父屯騎校尉不其亭侯伏完朝賀公廷完拜如眾臣及皇后往離宮后拜如子禮三公大臣議或以為皇后天下之母也完雖后父不可令后獨拜于朝或以為當交拜也令后存人子之道完不廢人臣之議又子尊不加于父母雖曰天王后猶曰吾季姜欲令完猶行父法后專奉子禮公私之朝后當獨拜或以為皇后至尊父亦至親交拜則父子無別完拜則傷子道后拜則損至尊欲令公朝者完拜如眾臣于公宮后拜如子不知四者何是正禮鄭玄議曰四者不同抑有由焉天子所不臣者三其一后之父母也天子尚不臣者況于后乎春秋魯隱公二年紀裂繻來逆女冬伯姬歸于紀又桓公九年祭公來遂逆王后于紀九年紀季姜歸于京師或言逆女或言逆王后蓋義有所見也女雖嫁為鄰國夫人其尊無以加于父母嫁于天子者此雖己女成言曰王后明當時之尊得加父母也紀季姜歸于京師更稱其字者得行禮而戒之其尊安可加父母耳今不其亭侯在京師禮事出入宜從臣禮若后適離宮及歸寍父母從子禮見通典六十七戒子益恩書吾家舊貧不為父母群弟所容去廝役之吏游學周秦之都往來幽并兗豫之域獲覲乎在位通人處逸大儒得意者咸從奉手有所受焉遂博稽六藝粗覽傳記時睹祕書緯術之奧年過四十乃歸供養假田播殖以娛朝夕遇閹尹擅勢坐黨禁錮十有四年而蒙赦令舉賢良方正有道辟大將軍三司府公車再召比牒并名早為宰相惟彼數公懿德大雅克堪王臣故宜式序吾自忖度無任于此但念述先聖之元意思整百家之不齊亦庶幾以竭吾才故聞命罔從而黃巾為害萍浮南北復歸邦鄉入此歲來已七十矣宿業衰落仍有失誤案之禮典便合傳家今我告爾以老歸爾以事將閒居以安性覃思以終業自非拜國君之命問族親之憂展敬墳墓觀省野物胡嘗扶杖出門乎家事大小汝一承之咨爾煢煢一夫曾無同生相依其勗求君子之道研鑽勿替敬慎威儀以近有德顯譽成于僚友德行立于己志若致聲稱亦有榮于所生可不深念邪可不深念邪吾雖無紱冕之緒頗有讓爵之高自樂以論贊之功庶不遺後人之羞末所憤憤者徒以亡親墳壟未成所好群書率皆腐敝不得于禮堂寫定傳與其人日西方暮其可圖乎家今差多于昔勤力務時無恤飢寒菲飲食薄衣服節夫二者尚令吾寡恨若忽忘不識亦已焉哉見後漢鄭玄傳又見蓺文類聚二十三又御覽四百五十九引鄭玄別傳尚書大傳敘蓋自伏生也伏生為秦博士至孝文時年且百歲張生歐陽生從其學而授之音聲猶有訛誤先後猶有差舛重以篆隸之殊不能無失生終後數子各論所聞以己意彌縫其閒別作章句又特撰大義因經屬指名之曰傳劉子政校書得而上之凡四十一篇至元始詮次為八十三篇見中興書目詩譜敘詩之興也諒不于上皇之世大庭軒轅逮于高辛其時有亡載籍亦蔑云焉虞書曰詩言志歌永言聲依永律和聲然則詩之道放于此乎有夏承之篇章泯棄靡有子遺邇及商王不風不雅何者論功頌德所以將順其美刺過譏失所以匡救其惡各于其黨則為法者彰顯為戒者著明周自后稷播種百穀黎民阻饑茲時乃粒自傳于此名也陶唐之末中葉公劉亦世修其業以明民共財至于太王王季克堪顧天文武之德光熙前緒以集大命于厥身遂為天下父母使民有政有居其時詩風有周南召南雅有鹿鳴文王之屬及成王周公致太平制禮作樂而有頌聲興焉盛之至也本之繇此風雅而來故皆錄之謂之詩之正經後王稍更陵遲懿王始受譖亨齊哀公夷身失禮之後邶不尊賢自是而下厲也幽也政教尤衰周室大壞十月之交民勞板蕩勃爾俱作眾國紛然刺怨相尋五霸之末上無天子下無方伯善者誰賞惡者誰罰紀綱絕矣故孔子錄懿王夷王時詩訖于陳靈公淫亂之事謂之變風變雅以為勤民恤功昭事上帝則受頌聲弘福如彼若違而勿用則被劫殺大禍如此吉凶之所繇憂娛之萌漸昭昭在斯足作後王之鑒于是止矣夷厲以上歲數不明太史年表自共和始歷宣幽平王而得春秋次第以立斯譜欲知源流清濁之所處則循其上下而省之欲知風化芳臭氣澤之所及則傍行而觀之此詩之大綱也舉一綱而萬目張解一卷而眾篇明于力則鮮于思則寡其諸君子亦有樂于是與見附釋音注疏本孝經注敘孝經者三才之經緯五行之紀綱孝為百行之首經者不易之稱僕被難于南城山棲遲巖石之下念昔先人餘暇述夫子之志而注孝經見劉肅大唐新語九御覽四十二太平寰宇記二十三費縣六蓺論六蓺者圖所生也見公羊序疏河圖洛書皆天神言語所以教告王者也見毛詩文王正義路史前紀九太平嘉瑞圖書之出必龜龍銜負焉黃帝堯舜周公是其正也若禹觀河見長人皋陶于洛見黑公湯登堯臺見黑烏至武王渡河白魚躍文王赤雀止于尸秦穆公白雀集于車是其變也易者陰陽之象天地之所變化政教之所自生自人皇初起見禮記大題正義路史前紀五後紀一遂皇之後歷六紀九十一代至伏羲始作十二言之教見禮記大題正義路史前紀二又五太昊帝庖犧氏姓風蛇身人首有聖德燧人歿宓犧皇生其世有五十九姓羲皇始序制作法度皆以木德王也制嫁娶之禮受龍圖以龍紀宮故曰龍師在位合一萬一千一十二年見唐釋法琳辨正論注一宓犧氏為網罟以畋以漁取犧牲以充庖廚故曰庖犧氏見辨正論注一炎帝神農氏姓姜人身牛首有火瑞即以火德王有七世合五百年也見辨正論注一神農斲木為耒耜揉木為耨始教天下種五穀故號為神農也見辨正論注一軒皇姓公孫二十五月而生有珠衡日角之相以土德王天下建寅月為歲首生子二十五人有十二姓凡十三世合治一千七十二年夢受帝籙遂與天老巡河而受之得河圖書師于牧馬小童拜廣成丈人于崆峒山見辨正論注一黃帝佐官有七人蒼頡造書字大撓造甲子隸首做算數容成造厤日岐迫造醫方鬼諛區占侯奚仲造車作律管興墠壇禮也見辨正論注一軒皇有景雲之瑞用雲紀官少昊帝有鳳鳥之瑞故以鳥名官焉見辨正論注一夏曰連山殷曰歸藏周曰周易連山者象山之出雲連連不絕歸藏者萬物莫不歸藏于其中周者者言周道周道無所不備見周易正義八論易之為名也一言而函三義易簡一也變易二也不易三也故繫辭云乾坤其易之蘊邪又云易之門戶邪又云夫乾磪然示人易矣夫坤隤然示人簡矣易則易知簡則易從此言其易簡之法則也又云其為道也屢遷變動不居周流六虛上下無常剛柔相易不可以為典要唯變所適此則言其順時變易出入移動者也又云天尊地卑乾坤定矣卑高以陳貴賤位矣動靜有常剛柔斷矣此則言其張設布列不易者也據茲三義之說易之道廣矣大矣見周易正義八論世說新語文學篇注尚書緯云孔子求書得黃帝玄孫帝魁之書迄于秦穆公凡三千二百四十篇斷遠取近可以為世法者百二十篇以百二篇為尚書十八篇為中侯見尚書序正義若堯知命在舜舜知命在禹猶求于群臣舉于側陋上下交讓務在服人孔子曰民可使由之不可使知之此之謂也見尚書堯典正義民閒得泰誓見向書序正義詩者弦歌諷諭之聲也自書契之興朴略尚質面稱不為諂目諫不為謗君臣之接如朋友然在于懇誠而已斯道稍衰姦偽以生上下相犯及其制禮尊君卑臣君道剛嚴臣道柔順于是箴諫者希情志不通故作詩者以誦其美而譏其過見毛詩譜序正義春秋緯演孔圖云詩含五際六情見毛詩關睢正義唐虞始造其初至周公為六詩見毛詩譜序正義關睢正義孔子錄周衰之歌及眾國聖賢之遺風自文王創基至于魯僖四百年間凡取三百五篇合為國風雅頌見毛詩譜序正義河閒獻王好學其博士毛公善說詩獻王號之曰毛詩見毛詩國風正義未有若今傳訓章句見毛詩關睢正義注詩宗我為主毛義若隱略則更表明如有不同即下己意使可識別也見毛詩鄭氏箋釋文禮者序尊卑之制崇讓合敬也見北堂書鈔九十五御覽六百八禮其初起蓋與詩同時見毛詩譜序正義唐虞有三禮至周分為五禮見周禮春官序官疏漢興高堂生得禮十七篇後得孔氏壁中古文禮凡五十六篇記百三十一篇周禮六篇其十七篇與高堂生所傳同而字多異其十七篇外則逸禮是也見禮記大題正義奔喪正義釋文序錄案大題正義又引云周官壁中所得六篇案漢書蓺文志儒林傳云傳禮者十三家唯高堂生及五傳弟子戴德戴聖名在也見禮記大題正義今禮行于世者戴德戴聖之學也見禮記大題正義戴德傳記八十五篇戴聖傳記四十九篇見禮記大題正義春秋者右史所記之制動作之事也右史記事左史記言見禮記玉藻正義公羊序疏御覽六百八案公羊疏引作春秋者國史所記人君動作之事左史所記為春秋右史所記為尚書孔子記西狩獲麟自號素王為後世命之君制明王之法左傳序正義左氏善于禮公羊善于讖穀梁善于經見穀梁序疏治公羊者胡母生董仲舒董仲舒弟子嬴公嬴公弟子眭孟眭孟弟子莊彭祖及顏安樂安樂弟子陰豐劉向王彥見公羊序疏玄又為之注見孝經序疏案此謂春秋孔子以六蓺題目不同指意殊別恐道離散後世莫知根源故作孝經以總會之見孝經序疏玄又為之注見孝經序疏案此謂孝經自序遭黨錮之事逃難注禮黨錮事解注古文尚書毛詩論語為袁譚所逼來至元城乃注周易見孝經序并注正義唐會要七十七文苑英華七百六十六與人書詣鄭康成學夫學之于人猶土地之有山川也珍寶于是乎出猶樹木之有枝葉本根于是乎庇也見御覽六百七引趙子聲書北海鄭玄字康成學之淵府今與業共往就之故輩不暇領命見北堂書鈔原本九十七遺令閉口寒具不得入見御覽八百六十荅陳鑠問陳鑠問氾閣云為庶母慈己鄭注引內則國君之子有子師慈母保母又曰大夫之子有食母庶母慈己此之謂也內則人君養子之法禮人君之庶母尚無服何以為慈母服乎若欲施大夫大夫無此禮但有食母耳氾閣答曰內則實總國君及大夫養子之禮見通典九十二答桓翱問桓翱問氾閣云久喪不除者為當眾子盡然邪故質焉耳答云昔嘗送鄭君到代陵代陵有人其父死不得其屍其子行喪隨制降殺閣與亡者相知而往弔之還問鄭君所駮異義之事不孝莫大于無後終身不除此為絕先人之統無乃重乎鄭君答云庶子自可攝祭閣覆云無庶子當何以又答云族人可以其倫代之閣覆言又云無族人云何則不復相答推此而詳但使一嫡子不除耳見通典一百三誚青衣賦彼何人斯悅此豔姿麗辭美譽雅句斐斐文則可嘉志卑意微鳳兮鳳兮何德之衰高岡可華何必棘茨醴泉可飲何必洿泥隋珠彈雀堂溪刈葵鴛鶵啄鼠何異乎鴟歷觀古今禍福之階多由嬖妾淫妻書戒牝鷄詩載哲婦三代之季皆由斯起晉獲驪戎斃壞恭子有夏取仍覆宗絕祀叔肸納申聽聲狼似穆子私庚豎牛餒己黃歇之敗從李園始魯受齊樂仲尼逝矣文公懷安姜笑其鄙周漸將衰康王晏起畢公喟然深思古道感彼關睢德不雙侶得願周公妃以窈窕防微消漸諷諭君父孔氏大之列冠篇首晏嬰潔志不顧景女及雋不疑奉霍不受見尊不迷況此麗豎三族無紀綢繆不序蟹行索妃旁行求偶昏姻無媒宗廟無主門戶不名依其在所生女為妾生男為虜歲時酹祀詣其先祖或于馬廄廚閒灶下東向長跪接狎觴酒悉請諸靈僻邪當主多乞少出銅丸鐵柱積繒累億皆來集聚嫡腕歡心各有先後臧獲之類蓋不足數古之贅婿尚為塵垢況明智者欲作奴父勤節君子無當自逸宜如防水守之以一秦繆思褒故獲終吉見蓺文類聚三十五初學記十九牋中外雲擾萬夫鼎沸見文選曹冏六代論注與太尉朱雋書薦袁遺遺有冠世之懿幹時之量其忠允亮直固天所縱若乃包羅載籍管綜百氏登高能賦睹物知名求之今日邈焉靡儔見魏志武紀注引張超集尼父頌巖巖孔聖異世稱傑量合乾坤明參日月德被八荒名充遐外終于獲麟遺歌魯衛見蓺文類聚二十初學記十七楊四公頌峨峨西岳峻極太清降神挺賢實有景靈靈何為四四楊是丁佐我大侯俾作韓貞明明在上不顯其身帝時疇咨本道求真僉曰于公溫故知新宜保宜傅克贊典墳昔在阿衡左右商王有周文武股肱旦望我漢楊氏作代棟梁蹇蹇匪躬惟國之綱綱弛復整政無亂荒功假皇穹率土以康心盡于朝終然允臧伊德之輔是乃毛羽匪哲匪賢孰云敢舉楊氏蹈之為軌為武軌武伊何盡啟其緒穆穆天子以為心膂於萬斯年克昌厥後見蓺文類聚四十三靈帝河閒舊廬碑赫赫在上陶唐是承繼德二祖四宗是憑上龜鑒乎羲農中結軌乎夏商元首既明股肱惟良乃因舊宇福德所基修飾經構農隙得時樹中天之雙闕崇冠山之華堂通樓閑道丹階紫房金窗鬱律玉璧內璫青蒲克庖朱草棲箱川魚踴躍雲鳥舞翔煌煌大漢合德乾剛體效日月驗化陰陽格于上下震暢八荒三光宣曜四靈效祥天其嘉享豐年穰穰騶虞奏樂鹿鳴薦觴一祝致告福祿來將永保萬國南山無量見蓺文類聚六十四章華臺賦并序楚靈王既遊雲夢之澤息于荊臺之上前方淮之水左洞庭之波右顧彭蠡之隩南眺巫山之阿延目廣望騁觀終日顧謂左史倚相曰盛哉此樂可以遺老而忘死也於是遂作章華之臺築乾谿之室窮木土之技單珍府之實舉國營之數年乃成設長夜之淫宴作北里之新聲于是伍舉知夫陳蔡之將生謀也乃作新賦以諷之胃高陽之苗胤兮承聖祖之洪澤建列藩于南楚兮等威靈于二伯超有商之大彭兮越隆周之兩虢達皇佐之高勳兮馳仁聲之顥赫惠風春施神武電斷華夏肅清五服攸亂旦垂精于萬機兮夕回輦于門館設長夜之歡飲兮展中情之嬿婉竭四海之妙珍兮盡生人之祕玩爾乃攜窈窕從好仇徑肉林登糟丘蘭肴山竦椒酒淵流激玄醴于清池兮靡微風而行舟登瑤臺以回望兮冀彌日而消憂于是招宓妃命湘娥齊倡列鄭女羅陽激楚之清宮兮展新聲而長歌繁手超于北里妙舞麗于陽阿金石類聚絲竹群分被輕袿曳華文羅衣飄颻組綺嬪紛縱輕軀以迅赴若孤鵠之失群振華袂以逶迤若游龍之登雲于是歡嬿既洽長夜向半琴瑟易調繁手改彈清聲發而響激微音逝而流散振弱支而紆繞兮若綠繁之垂榦忽飄飄以輕逝兮似鸞飛于天漢舞無常態鼓無定節尋聲響應修短靡跌長袖奮而生風清氣激而繞結爾乃妍媚遽進巧弄相加俯仰異容忽兮神化體迅輕鴻榮曜春華進如浮雲退如激波雖復柳惠能不咨嗟于是天河既回淫樂未終清籥發徵激楚揚風于是音氣發于絲竹兮飛響軼于雲中比目應節而雙躍兮孤雌感聲而鳴雄美繁手之輕妙兮嘉新聲之彌隆于是眾變已盡群樂既考歸乎生風之廣夏兮修黃軒之要道攜西子之弱腕兮援毛嬪之素肘形便娟以嬋媛兮若流風之靡草美儀操之姣麗兮忽遺生而忘老爾乃清夜晨妙技單收尊俎徹鼓盤惘焉若醒撫劍而歎慮理國之須才悟稼穡之艱難美以尚之佐周善管仲之輔桓將超世而作理焉沈湎于此歡于是罷女樂墮瑤臺思夏禹之卑宮慕有虞之士階舉英奇于仄陋拔髦秀于蓬萊君明哲以知人官隨任而處能百揆時敘庶績咸熙諸侯慕義不召同期繼高陽之絕軌祟成莊之洪基雖齊桓之一匡豈足方于大持爾乃育以仁臨之以明致虔報于鬼神盡肅恭乎上京馳淳化于黎元永歷世而太平見後漢邊讓傳與申屠蟠書勸詣何進大將軍幕府初開徵辟海內并延英俊雖有高名盛德不獲異遇至如先生特加殊禮優而不名申以手筆設几杖之坐引領東望日夜以冀彌秋歷冬經邁二載深拒以疾無惠然之顧重令爰中郎曉暢慇懃至于再三而先生抗志彌高所執益固將軍于是憮然失望而有愧色自以德薄深用咎悔僕竊論之先生高則有餘智則不足當今西戎作亂師旅在外軍國異容動有刑憲今潁川荀爽輿病在道北海鄭玄北面受署彼豈樂羈牽者哉知時不可佚豫也且昔人之隱雖遭其時猶放聲絕跡巢棲茹薇其不遇也則裸身大笑被髮狂歌今先生處平壤游人間吟典籍襲衣裳行與昔人謬而欲蹈其跡擬其事不亦難乎僕願先生優游俯仰貴處可否之閒孔氏可師何必首陽備託臭味庶同休戚是以假飛書以喻左右蟠不答其書亦無懼色見袁宏後漢紀二十五中平五年又略見後漢申屠蟠傳令軍中殺大將軍者即車騎也士吏能為報讎乎見後漢何進傳又略見魏志董卓傳注引英雄記理王允等事興平二年秋朝廷以九月九日見公卿近臣飲宴瑞離席前言故司徒王允見北堂書鈔一百五十五日蝕行冠禮議初平四年正月當祠南效尚書八座議欲卻郊日又定冠禮而月朔日蝕博士孫瑞議按八座書以為正月之日大陽虧曜謫見于天而冠者必有祼享之儀金石之樂飲燕之娛獻酬之報是為聞災不祗肅見異不怵惕也見通典七十八劍銘天生五材金德惟剛從革作辛含影吐商辯物利用勳伐彌彰暨彼良工區冶干將爰造寶劍巨闕墨陽精通皓靈獲茲休祥剖山竭川虹霓消亡昭威耀武震動遐荒楚以定霸越以取強見蓺文類聚六十御覽三百四十四
