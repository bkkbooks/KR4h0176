body:
  text: 禰衡鸚鵡賦時黃祖太子射賓客大會有獻鸚鵡者舉酒于衡前曰禰處士今日無用娛賓竊以此鳥自遠而至明慧聰善羽族之可貴願先生為之賦使四坐咸共榮觀不亦可乎衡因為賦筆不停綴文不加點其辭曰惟西域之靈鳥兮挺自然之奇姿體金精之妙質兮合火德之明輝性辯慧而能言兮才聰明以識機故其嬉遊高峻栖跱幽深飛不妄集翔必擇林紺趾丹嘴綠衣翠衿采采麗容咬咬好音雖同族于羽毛固殊智而異心配鷥皇而等美焉比德于眾禽于是羨芳聲之遠畼偉靈表之可嘉命虞人于隴坻詔伯益于流沙跨崑崙而播弋冠雲霓而張羅雖網維之備設終一目之所加且其容止閑暇守植安停逼之不懼撫之不驚寍順從以遠害不違迕以喪生故獻全者受賞而傷肌者被刑爾迺歸窮委命離群喪侶閉以雕籠翦其翅羽流飄萬里崎嶇重阻踰岷越障載罹寒暑女辭家而適人臣出身而事主彼賢哲之逢患猶棲遲以羈旅矧禽鳥之微物能馴擾以安處眷西路而長懷望故鄉而延佇忖陋體之腥臊亦何勞于鼎俎嗟祿命之衰薄奚遭時之險巇豈言語以階亂將不密以致危痛母子之永隔哀伉儷之生離匪餘年之足惜愈慜眾雛之無知背蠻夷之下國侍君子之光儀懼名實之不副恥才能之無奇羨西都之沃壤識苦樂之異宜懷代越之悠思故每言而稱斯若迺少昊司辰蓐收整轡嚴霜初降涼風蕭瑟長吟遠慕哀鳴感類音聲悽以激揚容貌慘以顦顇聞之者悲傷見之者隕淚放臣為之屢歎棄妻為之歔欷感平生之游處若壎篪之相須何今日之兩絕若胡越之異區順籠檻以俯仰闚戶牖以踟躕想崑山之高嶽思鄧林之扶疏顧六翮之殘毀雖奮迅其焉如心懷歸而弗果徒怨毒于一隅苟竭心于所事敢背惠而忘初託輕鄙之微命委陋賤之薄軀期守死以報德甘盡辭以效愚恃隆恩于既往庶彌久而不渝見文選蓺文類聚九十一書訓夷皓之風見文選顏延之陶徵士誄注魯夫子碑受天至精純粹睿哲崇高足以長世寬容足以廣包幽明足以測神文藻足以辯物然而敏學以求之下問以諏之虛心以受之深思以詠之愍周道之迴遹悼九疇之乖悖故發憤忘食應聘四方魯以太夫之位任以國政之權譬若飛鴻鸞于中庭騁騏驥于閣巷也是以期月之頃五教克諧移風易俗邦國肅焉無思不服懿文德以紓餘綴三五之紀綱流洪耀之休赫曠萬世而揚光夫大明以動天則也廣大無疆地德也六經混成洪式也備此三者聖極也合吉凶于鬼神遂殂落于夢寐是以風烈流行無所不通故立石銘勳以示昭明辭曰煌煌上天篤降若人邈矣悠哉千祀一鄰明德弘監情性存存奕奕純嘏稽憲乾坤曜彼靈祗以訓黎元終日乾乾配天之行在險而正在困而亨窮達之運委諸穹蒼日月則陰天地不光聖叡殂崩大猷不綱見蓺文類聚二十顏子碑稟天地之純和鍾嶽瀆之休靈睿哲之姿誕自初育英絕之才顯乎嬰孩在束脩之齒入宣尼之室德行邁于三千仁風橫于萬國知微知章聞一覺十用行舍藏與聖合契名為四友之冠實盡疏附之益乃安陋巷挹清風甘簞瓢以充飢雖屢空而不憂于時河不出圖周祚未訖仲尼無舜禹之功先生抱元凱之烈乃刊玄石而旌之其辭曰亞聖德蹈高蹤遊洙泗肅禮容備懿體心彌沖秀不實振芳風配聖饋圖辟雍紀德行昭罔窮見蓺文類聚二十初學記十七弔張衡文南嶽有精君誕其姿清和有理君達其機故能下筆繡辭揚手文飛昔伊尹值湯呂望遇旦嗟矣君生而獨值漢蒼蠅爭飛鳳皇已散元龜可霸河龍可絆石堅而朽星華而滅惟道興隆悠永靡絕君音永浮河水有竭君聲永流旦光沒發余生雖後身亦存遊士貴知己君其勿憂見御覽五百九十六玄達賦匪偏人之自韙訴諸衷于來哲見文選謝靈運擬鄴中集詩注冊魏公九錫文制詔使持節丞相領冀州牧武平侯朕以不德少遭愍凶越在西土遷於唐衛當此之時若綴旒然宗廟乏祀社稷無位群凶覬覦分裂諸夏朕無獲焉即我高祖之命將墜于地朕用夙興假寐震悼于厥心曰惟祖惟父股肱先正其孰能恤朕躬乃誘天衷誕育丞相保乂我皇家弘濟于艱難朕實賴之今將授君典禮其敬聽朕命昔者董卓初興國難群后釋位以謀王室君則攝進首啟戎行此君之忠于本朝也後及黃巾反易天常侵我三州延子平民君又討之翦除其迹之以寧東夏此又君之功也韓暹楊奉專用威命又賴君勳則致討克黜其難遂建許都造我京畿設官兆祀不失舊物天地鬼神于是獲乂此又君之功也袁術僭逆肆于淮南懾憚君靈用丕顯謀蘄陽之役橋蕤授首稜威南厲術以隕潰此又君之功也迴戈東指呂布就戮乘軒將反張楊殂斃眭固伏罪張繡稽服此又君之功也袁紹逆亂天常謀危社稷憑恃其眾稱兵內侮當此之時王師寡弱天下寒心莫有固志君執大節精貫白日奮其武怒運諸神策致屆官渡大殲醜類俾我國家拯于危墜此又君之功也濟師洪河拓定四州袁譚高幹咸梟其首海盜奔迸黑山順軌此又君之功也烏丸三種崇亂二世袁尚因之逼據塞北束馬縣車一征而滅此又君之功也劉表背誕不供貢職王師首路威風先逝百城八郡交臂屈膝此又君之功也馬超成宜同惡相濟濱據河潼求逞所欲殄之渭南獻馘萬計遂定邊城撫和戎狄此又君之功也鮮卑丁令重譯而至單于白屋請吏帥職此又君之功也君有定天下之功重之以明德班敘海內宣美風俗旁施勤教恤慎刑獄吏無苛政民不回慝敦崇帝族援繼絕世舊德前功罔不咸秩雖伊尹格于皇天周公光于四海方之蔑如也朕聞先王竝建明德胙之以土分之以民崇其寵章備其禮物所以藩衛王室左右厥世也其在周成管蔡不靖懲難念功乃使邵康公賜齊太公履東至于海西至于河南至于穆陵北至于無棣五侯九伯實得征之世祚太師以表東海爰及襄王亦有楚人不供王職又命晉文登為侯伯錫以二輅虎賁鈇鉞秬鬯弓矢大啟南陽世作盟主故周室之不壞繄二國是賴今君稱丕顯德明保朕躬奉答天命導揚弘烈緩爰九域罔不率俾功高於伊周而賞卑于齊晉朕甚恧焉朕以眇眇之身託于兆民之上永思厥艱若涉淵冰非君攸濟朕無任焉今以冀州之河東河內魏郡趙國中山常山鉅鹿安平甘陵平原凡十郡封君為魏公使使持節御史大夫慮授君印綬書金虎符第一至第五竹使第一至第十錫君玄土苴以白茅爰契爾龜用建冢社昔在周室畢公毛公入為卿佐周邵師保出為二伯外內之任君實宜之其以丞相領冀州牧如故今更下傳璽肅將朕命以允華夏其上故傳武平侯印綬今又加君九錫其敬效命以君經緯禮律為民軌儀使安職業無或遷志是用錫君大輅戎輅各一玄牡二駟君勸分務本穡人民昏作粟帛滯積大業惟興是用錫君袞冕之服赤舄副焉君敦尚謙讓俾民興行少長有禮上下咸和是用錫君軒縣之樂六佾之舞君翼宣風化爰發四方遠人回面華夏充實是用錫君朱戶以居君研其明哲思帝所難官才任賢群善必舉是用錫君納陛以登君秉國之鈞正色處中纖毫之惡靡不抑退是用錫君虎賁之士三百人君糾虔天刑章厥有罪八犯關干紀莫不誅殛是用錫君鈇鉞各一君龍驤虎視旁眺八維揜討逆節折衝四海是用錫君彤弓一彤矢百玈弓十玈矢千君以溫恭為基孝友為德明允篤誠感乎朕思是用錫君秬鬯一卣珪瓚副焉魏國置丞相以下群卿百寮皆如漢初諸侯王之制往欽哉敬服朕命簡恤爾眾時亮庶功用終爾顯德對揚我高祖之休命見文選袁宏後漢紀三十魏志武帝紀擬連珠臣聞媢上以布利者臣之常情主之所患忘身以憂國者臣之所難主之所願是以忠臣背利而脩所難明主排患而獲所願見蓺文類聚五十七尚書令荀彧碑瓌姿奇表見魏志荀彧傳注夫其為德也則主忠履信孝友溫惠高亮以固其中柔嘉以宣其外廉慎以為己任仁恕以察人物踐行則無轍迹出言則無辭費納規無敬辱之心機情有密靜之性若乃奉身蹈道勤禮賁德後之事閒匪云予克然後教以黃中之叡守以貞固之直注焉若洪河之源不可竭也確焉若華嶽之停不可拔也故能言之斯立行之斯成身匪隆污直哉惟情紊綱用亂廢禮復經于是百揆時序王猷允塞告厥成功用俟萬歲見蓺文類聚四十八男女老幼里號巷哭見文選沈約齊安陸昭王碑注道賢論潛公道素淵重有遠大之量劉伶肆意放蕩以宇宙為小雖高栖之業劉所不及而曠大之體同焉見高僧傳四竺道潛字法深王敦弟呂氏春秋序呂不韋者濮陽人也為陽翟之富賈家累千金秦昭襄王者孝公之曾孫惠文王之孫武烈王之子也太子死以庶子安國君柱為太子柱有子二十餘人所幸妃號曰華陽夫人無子安國君庶子名楚其母曰夏姬不甚得幸令楚質于趙而不能顧質數東攻趙趙不禮楚時不韋賈于邯鄲見之曰此奇貨也不可失乃見楚曰吾能大子之門楚曰何不大君之門乃大吾之門邪不韋曰子不知也吾門待子門大而大之楚默幸之不韋曰昭襄王老矣而安國君為太子竊聞華陽夫人無子能立適嗣者獨華陽夫人耳請以千金為子西行事安國君令立子為適嗣不韋乃以寶玩珍物獻華陽夫人因言楚之賢以夫人為天母日夜涕泣思夫人與太子夫人大喜言于安國君于是立楚為適嗣華陽夫人以為己子使不韋傅之不韋取邯鄲姬已有身楚見說之遂獻其姬至楚所生男名之曰正楚立之為夫人暨昭襄王薨太子安國君立華陽夫人為后楚為太子安國君立一年薨諡為孝文王太子楚立是為莊襄王以不韋為丞相封為文信侯食河南雒陽十萬戶莊襄王立三年而薨太子正立是為秦始皇帝尊不韋為相國號稱仲父不韋乃集襦書使著其所聞為十二紀八覽六論訓解各十餘萬言備天地萬物古今之事名為呂氏春秋暴之咸陽市門懸千金其上有能增損一字者與千金時人無能增損者誘以為時人非不能也蓋憚相國畏其勢耳然此書所尚以道德為標的以無為為綱紀以忠義為品式以公方為檢格與孟軻孫卿淮南揚雄相表裏也是以著在錄略誘正孟子章句作淮南孝經解畢訖家有此書尋繹案省大出諸子之右既有脫誤小儒又以私意改定猶慮傳義失其本真少能詳之故復依先儒舊訓輒乃為之解焉以述古儒之旨凡十七萬三千五十四言若有紕繆不經後之君子斷而裁之比其義焉見呂氏春秋元刊本淮南子敘淮南王名安厲王長子也長高皇帝之子也其母趙氏女為趙王張敖美人高皇帝七年討韓信于銅鞮信亡走匈奴上遂北至樓煩還過趙不禮趙王趙王獻美女趙氏女得幸有身趙王不敢內之于宮為築舍于外及貫高等謀反發覺并逮治王盡收王家及美人趙氏女亦與焉吏以得幸有身聞上上方怒趙王未理也趙美人弟兼因辟陽矣審食其言之呂后呂后不肯白辟陽侯亦不強爭及趙美人生男恚而自殺吏奉男詣上上命呂后母之封為淮南王暨孝文皇帝即位長弟上書願相見詔至長安日從游宴驕蹇如家人兄弟怨辟陽侯不爭其母于呂后因椎殺之上非之肉袒北闕謝罪奪四縣還歸國為黃屋左纛稱東帝坐徙蜀嚴道死于雍上閔之封其四子為列侯時民歌之曰一尺繒好童童一升粟飽蓬蓬兄弟二人不能相容上聞之曰以我貪其地邪乃召四侯而封之其一人病薨長子安襲封淮南王次為衡山王次為廬江王太傅賈誼諫曰怨讎之人不可貴也後淮南衡山卒反如賈誼言初安為辯達善屬文皇帝為從父數上書召見孝文皇帝甚重之詔使為離騷賦自旦受詔日早食已上愛而秘之天下方術之士多往歸焉于是遂與蘇飛李尚左吳田由雷被毛被伍被晉昌等八人及諸儒大山小山之徒共講論道德總統仁義而著此書其旨近老子淡泊無為蹈虛守靜出入經道言其大也則燾天載地說其細也則淪于無垠及古今治亂存亡禍福世間詭異瓌奇之事其義也著其文也富物事具類無所不載然其大較歸之于道號曰鴻烈鴻大也列明也以為大明道之言也故夫學者不論淮南則不知大道之之深也是以先賢通賢儒述作之士莫不援采以驗經傳以父諱長故其所著諸長字皆曰脩光祿大夫劉向校定撰具名之淮南又有十九篇者謂之淮南外篇自誘之少從故侍中同縣盧君受其句讀誦舉太義會遭兵災天下棋峙亡失書傳廢不尋修二十餘載建安十年辟司空椽除東郡濮陽令覩時人少為淮南者懼遂淩遲于是以朝餔事畢之間乃深思先師之訓參以經傳道家之言比方其事為之注解悉載本文并舉音讀典農中郎將弁揖借八卷刺之會揖身喪遂亡不得至十七年遷監河東復更補足淺學寡見未能備悉其所不達注以未聞唯博物君子覽而詳之以勸後學者云耳見淮南鴻烈解道藏本動字號答鄧義社主難荀彧問仲長統以社所祭者何神也統荅所祭者土神也侍中鄧義以為不然而難之彧令統荅焉統荅義曰前見逮及敢不敬對退熟惟省郊社之祭國之大事誠非學淺思薄者所宜興論重復亦以鄧君難事有先漸議則既行可謂辭而不可得因而不已者也屯有經綸之義睽有異同之辭歸于建國立家通志斷類也意則欲廣其微以宗實備其論以求真先難而後易出異而歸同乎難曰社祭土主陰氣正所謂句龍土行之官為社則主陰明矣不與記說有違錯也荅曰今記之言社輒與郊連體有本末辭有上下謂之不錯不可得禮運曰政必本於天殽以降命命降於社之謂殽地參于天地竝于鬼神又曰祭帝于郊所以定天位也祀祐于國所以列地利也郊特牲曰社所以神地之道也地載萬物天垂象取財于地取法于天是以專天而親地家主中霤國主社示本也相此之類元尚不道配食者也主以為句龍無乃失歟難曰信如此所言土尊故以以為首在于上宗伯之體所當列上下之敘上句當言天神地祇人鬼何反先人而後地上文如此至下何以獨不可而云社非句龍當為地哉荅曰此形成著體數自上來之次言之耳豈足據使從人鬼之例邪三科之祭各指其體今摘出社稷以為但句龍有烈山氏之子恐非其本意也案記言社土而云何得之為句龍則傳雖言祀句龍為社亦何嫌反獨不可謂之配食乎祭法曰周人禘嚳郊稷祖文王宗武王皆以為配食者若復可須謂之不祭天乎備讀傳者則真土獨據記則疑句龍未若交錯參伍致其義以相成之為善也難曰再特于郊牛者后稷配故也社于新邑牛一羊一豕一所以用二牲者立社位祀句龍緣人事之也如此非祀地明矣以宮室新城故立社耳又曰軍行載社者當行賞罰明不自專故告祖而行實造社而行戮二主明皆人鬼人鬼故以告之必若所云當言載地主于齋車又當言用命賞于天不用命戮于地非謂也所以有死社稷之義者凡賜命受國造建宮室無不立社是奉言所受立不可棄捐苟免而去當死之也易句龍為其社傳有見文今欲易神之相令記附食宜明其徵祀國大事不可不重據經依傳庶無咎悔荅曰郊特牲者天至尊無物以稱專誠而社稷太牢者土于天為卑緣人事以牢祭也社禮今亡并特之義未可得明也昭告之文皆于天地何獨人鬼此言則未敢取者也郊社之次天地之序也今使句龍載冒其名耦文于天以度言之不可謂安矣土者人所依以固而最近者也故立以為守祀居則事之時軍則告之以行戮自順義也何為當平于社不言用命賞于天乎帝王兩儀之參宇中之莫尊者也而盛一官之臣以為士之貴神置之宗廟之上接之郊禘之次俾守之者有死無夫失何聖人制法之參差用禮之偏頗其列在先王人臣之位其于四官爵侔班同比之司徒于數居二縱復令王者不同禮儀相變或有尊之則不過當若五卿之與冢宰此坐之上下行之先後耳不得同祖與社言俱坐處尊位也周禮為禮之經而禮記為禮之傳案經傳求索見文在于此矣鈞之兩者未知孰是去本神而不祭與貶句龍為土配比其輕重何謂為甚經有條例記有明義先儒未能正不可稱是鉤校典籍論本考始矯前易故不從常說不可謂非孟軻曰子豈好辯哉乃不得已也鄭司農之正此之謂也見續漢祭祀志下注補尹文子序尹文子者蓋出于周之尹氏齊宣王時居稷下與宋鈃彭蒙田駢同學于公孫龍公孫龍稱之著書一篇多所彌綸莊子曰不累于物不苟于人不忮于眾願天下之安寍以活于民命人我之養畢足而止以此白心見侮不辱此其道也而劉向亦以其學本于黃老大較刑名家也近為誣矣余黃初末始到京師繆熙伯以此書見示意甚玩之而多脫誤聊試條次撰定為上下篇亦未能究其詳也見尹文子道藏本
