body:
  text: 陳琳大暑賦土潤溽以歊烝時淟涊以溷濁溫風鬱其彤彤譬炎火之燭燭見初學記三止欲賦媛哉逸女在余東濱色曜春華艷過碩人乃遂古其寡儔固當世之無鄰允宜國而寍家實君子之攸嬪伊余情之是說志荒溢而傾移宵炯炯以不寐晝舍食而忘飢歎此風之好我美攜手之同歸忽日月之徐邁庶枯楊之生梯欲語言于玄鳥玄鳥逝以差池道攸長而路阻河廣瀁而無梁雖企予而欲往非一葦之可航展余轡以言歸含憯瘁而就床忽假暝其若寐夢所懽之來征魂翩翩以遙懷若交好而通靈見蓺文類聚十八武軍賦迴天軍于易水之陽以討瓚焉鴻溝參周鹿箛十里薦之以棘為建修櫓干青霄竁深隧下三泉飛雲梯衝神鉤之具不在孫吳之篇三略六韜之術者凡數十事祕莫得聞也乃作武軍賦曰赫赫哉烈烈矣于此武軍當天符之佐運承斗剛而曜震漢季世之不辟青龍紀乎大荒熊狼競以拏攫神寶播乎鎬京于是武臣赫然颺炎天之隆怒叫諸夏而號八荒爾乃擬北落而樹表晞壘壁以結營百校羅歭千部列陳彌方城掩平原于是啟明戒旦長庚告昏火烈具舉鼓角竝震整行按律決敵中原八部方置山布星陳干戈森其若林牙旗翻以如繪千徒從唱億夫求和聲訇隱而動山光赫奕以燭夜其刃也則楚金越冶棠谿名工清堅皓鍔修刺銳鋒陸陷蕊犀水截輕鴻鎧則東湖闕鞏百鍊精剛圅師振椎韋人制縫玄羽縹甲灼爚流光弩則幽都筋骨恒山檿幹通肌畼骨崇媼曲煙大黃沈紫直矢輕弦當鋒推決貫遐洞堅其弓則烏號越棘繁弱角端象弭繡質晢柎文身矢則申息肅慎箘簵空疏焦銅毒鐵簳鏃鳴鍭麗轂撻輈馬則飛雲絕景直鬐騧駵駁龍紫鹿文的𨆀魚走駿驚颷步象雲浮斂鞚則止受銜斯游鉤車轇轕九牛轉牽雷響電激折櫓倒垣其攻也則飛梯臨雲行閣虛溝上通紫電下過三壚蘊隆既備越有神鉤排雷衝則穨高雉烈炬然則頓名樓衝鉤競進熊虎爭先墮垣百疊敝樓數千炎燧四舉元戎齊登若乃清道整列按節徐行龍姿鳳歭灼有遺英南轅反旆爰整其旅胡馬駢足戎車齊軌見蓺文類聚五十九初學記二十二引三條御覽三百三十六又三百四十七又三百四十八三百五十又三百五十六三百五十八神武賦建安十有二年大司空武平侯曹公東征烏丸六軍被介雲輜萬乘治兵易水次于北平可謂神武奕奕有征無戰者已夫闚巢穴者未可與論六合之廣游淇汙者又烏知滄海之深大人之量固非說者之所可識也見蓺文類聚五十九書鈔一百五十八佇盤桓以淹次乃申命而後征覲狄民之故土追大晉之遐蹤惡先縠之懲寇善魏絳之和戎受金石而弗伐蓋禮樂而思終陵九城而上濟起齊軌乎玉繩車軒轔于雷室騎浮厲乎雲宮暉曜連乎白日旂旐繼于電光旆既軼乎白狼殿未出乎盧龍威淩天地勢括十衝單鼓未伐虜已潰崩克俊馘首梟其魁雄爾乃總輯瓌珍茵氈幕幄攘瓔帶佩不飾雕琢華璫玉瑤金麟牙鹿文貝紫瑛縹碧玄綠黼錦繢組毼皮服見蓺文類聚五十九神女賦漢三七之建安荊野蠢而作仇贊皇師以南假濟漢川之清流感詩人之攸歎想神女之來遊儀營魄于髣託嘉夢以通精望陽侯而瀇瀁覩玄麗之軼靈文綘虯之奕奕鳴玉鸞之嚶嚶答玉質于苕華擬豔姿于蕣榮感仲春之和節歎鳴雁之噰噰申握椒以貽予請同宴乎粵房苟好樂之嘉合永絕世而獨昌既歎爾以豔采又說我之長期順乾坤以成性夫何若而有辭見蓺文類聚七十九大荒賦假龜筮以貞吉問神諗以休詳見初學記二十迷迭賦立碧莖之娜婀鋪綵條之蜿蟺下扶疏以布濩上綺錯而交紛匪荀方之可樂實來儀之麗閑動容飾而發微穆斐斐以承顏見蓺文類聚八十一御覽九百八十二馬腦勒賦五官將得馬腦以為寶勒美其英采之光豔也使琳賦之見書鈔一百二十六御覽三百五十八譌謠溪之寶岸臨赤水之朱陂見御覽八百八爾乃他山為錯荊和為理制為寶勒以御君子御覽三百五十八柳賦偉姿逸態英豔妙奇綠條縹葉雜遝纖麗龍鱗鳳翼綺錯交施蔚曇曇其杳藹象翠蓋之葳蕤見初學記二十八鸚鵡賦咨乾坤之兆物萬品錯而殊形有逸姿之令鳥含嘉淑之哀聲抱振鷺之素質被翠羽之縹精見蓺文類聚九十一諫何進召外兵易稱即鹿無虞諺有掩目捕雀夫微物尚不可欺以得志況國之大事其可以詐立乎今將軍總皇威握兵要龍驤虎步高下在心此猶鼓洪鑪燎毛髮耳夫違經合道天人所順而反委釋利器更徵外助大兵聚會彊者為雄所謂倒持干戈授人以柄功必不成祇為亂階見後漢何進傳答東阿王牋琳死罪死罪昨加恩辱命并示龜賦披覽粲然君侯體高世之才秉青萍干將之器拂鐘無聲應機立斷此乃天然異稟非鑽仰者所庶幾也音義既遠清辭妙句焱絕煥炳譬猶飛兔流星超山越海龍驥所不敢追況于駑馬可得齊足夫聽白雪之音觀綠水之節然後東野巴人蚩鄙益著載懽載笑欲罷不能謹韞櫝玩耽以為吟頌琳死罪死罪見文選初學記二十八更公孫瓚與子書蓋聞在昔衰周之世僵尸流血以為不然豈意今日身當其衝袁氏之攻似若神鬼鼓角鳴于地中梯衝舞吾樓上日窮月踧無所𦕼賴汝當碎首于張燕速致輕騎到者起烽火于北吾當從內出不然吾亡之後天下雖廣汝欲求安足之地其可得乎見魏志公孫瓚傳注引典略云紹使陳琳更其書云云答張紘書自僕在河北與天下隔此閒率少于文章易為雄伯故使僕受此過差之譚非其實也今景興在此足下與子布在彼所謂小巫見大巫神氣盡矣見吳志張紘傳注引吳書為曹洪與魏太子書十一月五日洪白前初破賊情奓意奢說事頗過其實得九月二十日書讀之喜笑把玩無厭亦欲令陳琳作報琳頃多事不能得為念欲遠以為懽故自竭老夫之思辭多不可一一粗舉大綱以當談笑漢中地形實有險固四嶽三塗皆不及也彼有精甲數萬臨高守要一人揮戟萬夫不得進而我軍過之若駭鯨之決細網奔兕之觸魯縞未足以喻其易雖云王者之師有征無戰不義而彊古人常有故唐虞之世蠻夷猾夏周宣之盛亦讎大邦詩書歎載言其難也斯皆憑阻恃遠故使其然是以察茲地勢謂為中才處之殆難倉卒來命陳彼妖惑之罪敘王師曠蕩之德豈不信然是夏殷所以喪苗扈所以斃我之所以克彼之所以敗也不然商周何以不敵哉昔鬼方聾昧崇虎讒凶殷辛暴虐三者皆下科也然高宗有三年之征文王有退脩之軍盟津有再駕之役然後殪戎勝殷有此武功焉有星流景集飆奪霆擊長驅山河朝至暮捷若今者也由此觀之彼固不逮下愚則中才之守不然明矣在中才則謂不然而來示乃以為彼之惡稔雖有孫田墨氂猶無所救竊又疑焉何者古之用兵敵國雖亂尚有賢人則不伐也是故三仁未去武王還師宮奇在虞晉不加戎季梁猶在彊楚挫謀暨至眾賢奔絀三國為墟明其無道有人猶可救也且夫墨子之守縈帶為垣高不可登折箸為械堅不可入若乃距陽平據石門攄八陣之列騁奔牛之權焉肯土崩魚爛哉設令守無巧拙皆可攀附則公輸已陵宋城樂毅已拔即墨矣墨翟之術何稱田單之智何貴老夫不敏未之前聞蓋聞過高唐者效王豹之謳遊睢渙者學藻繪之綵閒自入益部仰司馬楊王遺風有子勝斐然之志故頗奮文辭異于他日怪乃輕其家丘謂為倩人是何言歟夫綠驥垂耳于林坰鴻雀戢翼于汙池褻之者固以為園囿之凡鳥外廄之下乘也及整蘭筋揮勁翮陵厲清浮顧盼千里豈可謂其借翰于晨風假足于六駮哉恐猶未信丘言必大噱也洪白見文選為袁紹檄豫州左將軍領豫州刺史郡國相守蓋聞明主圖危以制變忠臣慮難以立權是以有非常之人然後有非常之事有非常之事然後立非常之功夫非常者故非常人所擬也曩者彊秦弱主趙高執柄專制朝權威福由已時人迫脅莫敢正言終有望夷之敗祖宗焚滅汙辱至今永為世鑒及臻呂后季年產祿專政內兼二軍外統梁趙擅斷萬機決事省禁下淩上替海內寒心于是絳侯朱墟興兵奮怒誅夷逆暴尊立太宗故能王道興隆光明顯融此則大臣立權之明表也司空曹操祖父中常侍騰與左悺徐璜竝作妖孼饕餮放橫傷化虐民父嵩乞匄攜養因贓假位輿金輦璧輸貨權門竊盜鼎司傾覆重器操贅閹遺醜本無懿德僄狡鋒協好亂樂禍幕府董統鷹揚掃除凶逆續遇董卓侵官暴國于是提劍揮鼓發命東夏收羅英雄棄瑕取用故遂與操同諮合謀授以裨師謂其鷹犬之才爪牙可任至乃愚佻短略輕進易退傷夷折衂數喪師徒幕府輒復分兵命銳脩完補輯表行東郡領袞州刺史被以虎文獎蹙威柄冀獲秦師一剋之報而操遂承資拔扈肆行凶忒割剝元元殘賢害善故九江太守邊讓英才俊偉天下知名直言正色論不阿諂身首被梟懸之誅妻孥受灰滅之疚自是士林憤痛民怨彌重一夫奮臂舉州同聲故躬破于徐方地奪于呂布彷徨東裔蹈據無所幕府惟彊幹弱枝之義且不登叛人之黨故復授旌擐甲席卷起征金鼓響振布眾奔沮拯其死亡之患復其方伯之位則幕府無德于袞土之民而有大造于操也後會鸞駕反旆群虜寇攻時冀州方有北鄙之警匪遑離局故使從事中郎徐勛就發遣操使繕脩郊廟翊衛幼主操便放志專行脅遷當御省禁卑侮王室敗法亂紀坐領三臺專制朝政爵賞由心刑戮在口所愛光五宗所惡滅三族群談者受顯誅腹議者蒙隱戮百寮鉗口道路以目尚書記朝會公卿充員品而已故太尉楊彪典歷二司享國極位操因緣眥睚被以非罪榜楚參并五毒備至觸情任忒不顧憲網又議郎趙彥忠諫直言義有石納是以聖朝含聽改容加飾操欲迷奪時明杜絕言路擅收立殺不侯報聞又梁孝王先帝母昆墳陵尊顯桑梓松柏猶宜肅恭而操帥將吏士親臨發掘破棺躶尸掠取金寶至令聖隳流涕士民傷懷操又特置發丘中郎將摸金校尉所遇墮突無骸不露身處三公之位而行桀虜之態汙國虐民毒施人鬼加其細政苛慘科防互設罾繳充蹊坑穽塞路舉手挂網羅動足觸機陷是以袞豫有無聊之民帝都有吁嗟之怨歷觀載籍無道之臣貪殘酷烈于操為甚幕府方詰外姦未及整訓加諸含容冀可彌縫而操豺狼野心潛包禍謀乃欲摧撓棟梁孤弱漢室除滅忠正專為梟雄往者伐鼓北征公孫瓚彊寇桀逆拒圍一年操因其未破陰交書命外助王師內相掩襲故引兵造河方舟北濟會其行人發露瓚亦梟夷故使鋒芒挫縮厥圖不果爾乃大軍過蕩西山屠各左校皆束心奉質爭為前登犬羊殘醜消淪山谷于是操師震慴晨夜逋遁屯據敖倉阻河為固欲以螗蜋之斧禦隆車之隧幕府奉漢威靈折衝宇宙長戟百萬胡騎千群奮中黃育獲之士騁良弓勁弩之勢並州越太行青州涉濟漯大軍汎黃河而角其前荊州不宛葉而掎其後雷霆虎步并集虜庭若舉炎火以飛蓬覆滄海以沃熛炭有何不滅者哉又操軍吏士其可戰者皆出自幽冀或故營部曲咸怨曠思歸流涕北顧其餘袞豫之民及呂布張揚之遺眾覆亡迫脅權時苟從各被創痍人為讎若迴旆方徂登高岡而擊鼓吹揚素揮以啟降路必土崩瓦解不俟血刃方今漢室陵遲綱維弛絕聖朝無一介之輔股肱無折衝之勢方畿之內簡練之臣皆垂頭搨翼莫所憑恃雖有忠義之佐脅于暴虐之臣焉能展其節又操持部曲精兵七百圍守宮闕外託宿衛內實拘執懼其篡逆之萌因斯而作此乃忠臣肝腦塗地之秋烈士立功之會可不勖哉操又矯命稱制遣使發兵恐邊遠州郡過聽而給與彊寇弱主違眾旅叛舉以喪名為天下笑則明哲不取也即日幽并青冀四州立竝進書到荊州使勒見兵與建忠將軍協同聲勢州郡各整戎馬羅落境界舉師揚威並匡社稷則非常之功于是乎著其得操首者封五千戶侯賞錢五千萬部曲偏裨將校諸吏降者勿有所問廣宣恩信班揚符賞布告天下咸使知聖朝有拘逼之難如律令見文選又見後漢袁紹傳又見魏志袁紹傳注引魏氏春秋竝有刪節檄吳將校部曲文年月朔日子尚書令彧告江東諸將校部曲及孫權宗親中外蓋聞禍福無門惟人所召夫見機而作不處凶危上聖之明也臨事制變困而能通智者之慮也漸漬荒沈往而不反下愚之蔽也是以大雅君子于安思危以遠疚悔小人臨禍懷佚以待死亡二者之量不亦殊乎孫權小子未辨菽麥要領不足以膏齊斧名字不足以洿簡墨譬猶鷇卵始生翰毛而便陸梁放肆顧行吠主謂為舟楫足以距皇威江湖可以逃靈誅不知天網設張以在綱目釁鑊之魚期于消爛也若使水而可恃則洞庭無三苗之墟子陽無荊門之敗朝鮮之壘不刊南越之旍不拔昔夫差承闔閭之遠跡用申胥之訓兵棲越會稽可謂彊矣及其抗衡上國與晉爭長都城屠于句踐武卒散于黃池終于覆滅身罄越軍及吳王濞驕恣屈彊猖猾始亂自以兵彊國富勢陵京城太尉帥師甫下滎陽則七國之軍瓦解冰泮濞之罵言未絕于口而丹徒之刃已陷其胸何則天威不可當而悖逆之罪重也且江湖之眾不足恃也自董卓作亂以迄于今將三十載其間豪桀縱橫熊據虎跱彊如二袁勇如呂布跨州連郡有威有名十有餘輩其餘鋒捍特起鸇視狼顧爭為梟雄者不可勝數然皆伏鈇嬰鉞首腰分離雲散原燎罔有孑遺近者關中諸將復相合聚續為叛亂阻二華據河渭驅率羌胡齊鋒東向氣高志遠似若無敵丞相秉鉞鷹揚順風烈火元戎啟行未鼓而破伏尸千萬流血漂櫓此皆天下所共知也是後大軍所以臨江而不濟者以韓約馬超逋逸迸脫走還涼州復欲鳴吠逆賊宋建僭號河首同惡相救竝為脣齒又鎮南將軍張魯負固不恭皆我王誅所當先加故且觀兵旋旆復整六師長驅西征致天下誅偏將涉隴則建約梟夷旍首萬里軍入散關則群氐率服王侯豪帥奔走前驅進臨漢中則陽平不守十萬之師土崩魚爛張魯逋竄走入巴中懷恩悔過委質還降巴夷王朴胡賨邑侯杜濩各帥種落共舉巴郡以奉王職鉦鼓一動二方俱定利盡西海兵不鈍鋒若此之事皆上天威明社稷神武非徒人力能立也聖朝寬仁覆載允信允文大啟爵命以示四方魯及胡濩皆享萬戶之封魯之五子各受千室之邑胡濩子弟部曲將校為列侯將軍已下千有餘人百姓安堵四民反業而建約之屬皆為鯨鯢超之妻孥焚首金城父母嬰孩覆尸許市非國家鍾禍于彼降福于此也順逆之分不得不然夫鷙鳥之擊先高攫鷙之勢也牧野之威孟津之退也今者枳棘翦扦戎夏以清萬里肅齊六師無事故大舉天師百萬之眾與匈奴南單于呼完廚及六郡烏桓丁令屠各湟中羌僰奮席卷自壽春而南又使征西將夏侯淵等率精兵五萬及武都氐羌巴漢銳卒南臨汶江搤據庸蜀江夏襄陽諸軍橫截湘沅以臨豫章樓船橫海之師直指吳會萬里期五道並入權之期命于是至矣丞相奉國威為民除害元惡大憝必當梟夷至于枝附葉從皆非詔書所特禽疾故每破滅強敵未嘗不務在先降後誅拔將取才各盡其用是以立功之士莫不翹足引領望風響應昔袁術僭逆王誅將加則廬江大守劉勳先舉其郡還歸國家呂布作亂師臨下邳張遼侯成率眾出降還討眭固辥洪樛尚開城就化官渡之役則張郃高奐舉事立功後討袁尚則都督將軍馬延故豫州刺史陰夔射聲校尉郭昭臨陣來降圍守鄴城則將軍蘇游反為內應審配兄子開門入兵既誅袁譚則幽州大將焦觸攻逐袁熙舉事來服凡此之輩數百人皆忠壯果烈有智有仁悉與丞相參圖畫策折衝討難芟敵搴旗靜安海內豈輕舉措也哉誠乃天啟其心計深慮遠邪正之津明可否之分勇不虛死節不苟立屈身變化唯道所存故乃建丘山之功享不訾之祿朝為仇虜夕為上將所謂臨難知變轉禍為福者也若夫說誘甘言懷寶小惠泥滯苟且沒而不覺隨波漂流與熛俱滅者亦甚眾多吉凶得失豈不哀哉昔歲軍在漢中東西懸隔合肥遺守不滿五千權親以數萬之眾破敗奔走令乃欲當禦雷霆難以冀矣夫天道助順人道助信事上之謂義親親之謂仁盛孝章君也而權誅之孫輔兄也而權殺之賊義殘仁莫斯為甚乃神靈之逋罪下民所同讎辜讎之人謂之凶賊是故伊摯去夏不為傷德飛廉死紂不可謂賢何者去就之道各有宜也丞相深惟江東舊德名臣多在載籍近魏叔英秀出高峙著名海內虞文繡砥礪清節耽學好古周泰明當世雋彥德行脩明皆宜膺受多福保乂子孫而周盛門戶無辜被戮遺類流離湮沒林莽言之可為愴然聞魏周榮虞仲翔各紹堂構能負析薪及吳諸顧陸舊族長者世有高位當報漢德顯祖揚名及諸將校孫權婚親皆我國家良寶利器而竝見驅迮雨絕于天有斧無柯何以自濟相隨顛沒不亦哀乎蓋鳳鳴高岡以遠罻羅賢聖之德也鸋之鳥巢于鳺葦苕苕折子破下愚之惑也今江東之地無異葦苕諸賢處之信亦危矣聖朝開弘曠蕩重惜民命誅在一人與眾無忌故設非常之賞以待非常之功乃霸夫烈士奮命之良時也可不勉乎若能翻然大舉建立元勳以應顯祿福之上也如其未能笇量大小以存易亡亦其次也夫係𨂜在足則猛虎絕其蹯蝮蛇在手則壯士斷其節何則以其所全者重以其所棄者輕若乃樂禍懷寍迷而忘復闇大雅之所保背先賢之去就忽朝陽之安甘折苕之末日忘一日以至覆沒大兵一放玉石俱碎雖欲救之亦無及已故令往購募爵賞科如左檄到詳思至言如詔律令見文選又略見蓺文類聚五十八應譏客有譏余者云聞君子動作周旋無所苟而已矣今主君鍾陰陽之美總賢聖之風固非世人所能及遭豹狼肆虐社稷隕傾既不能抗節服義與主存亡而背枉違難耀茲武功徒獨震撲山東剝落元元結疑本朝假拒群姦使已蒙噂沓之謗而他人受討賊之勳捐功棄力以德取怨今賤文德而貴武勇任權譎而背舊章無乃非至德之純美而有闕于後人哉主人曰是何言也夫兵之設亦久矣所以威不軌而懲淫慝也夫申鳴違父樂羊食子季友鳩兄周公戮弟猶忍而行之王事所不得已也而況將避讒慝之嫌棄社稷之難愛暫勞之民忘水康之樂此庸夫猶所不為何有冠世之士哉昔洪水滔天汎濫中國伯禹躬之過門而不入率萬方之民致力乎溝洫及至簫韶九成百獸率舞垂拱無為而天下晏如夫豈前好勤而後媮樂乎蓋以彼勞求斯逸也夫世治責人以禮世亂則考人以功斯各一時之宜故有論戰陣之權于清廟之堂者則狂矣陳俎豆之器于城濮之墟者則悖矣是以達人君子必相時以立功必揆宜處事孝靈既喪妭官放禍棟臣殘酷宮室焚火主君乃芟凶族夷惡醜蕩滌朝姦清澄守職也既乃卓為封虵幽鳩帝后強以暴國非力所討違而去之宜也是故天贊人和無思不至用能合師百萬若運諸掌者義也今主君以寬弘為宇仁義為廬若地之載如天之壽故當其聞管籥之聲則恐民之病也見羽毛之美則懼士之勞也察稼穡之不時則推民之匱也臨臺觀之崇高則恤役之病也是以虛心恭己取人之謨闢四門廣諫路貴讜言賤巧偽慮不專行功不擅美咨事若不及求諐恐不聞用能使賢智者盡其策勇敢者竭其身故舉無遺闕而風烈宿宣也見蓺文類聚二十五韋端碑撰勒洪伐式昭德音見文選七命注
