body:
  text: 曹節上書功薄賞厚誠有踧踖見文選阮籍為鄭沖勸進晉王牋注白言史官諱占日蝕臣切見道術家常言漢死在戌亥今太歲在丙戌五月甲戌日蝕柳宿朱雀漢家之貴國宿分周地今京師是也史官上占去重見輕見續漢五行志六延熹元年注補引梁冀別傳常侍徐璜白言陰于明堂中禱皇天竇氏無道請皇天輔皇帝誅之令事必成天下得寧見後漢曹節傳上疏陳事臣聞諸侯上象四七下列王土高祖重約非功臣不侯所以重天爵明勸戒也伏聞中常侍曹節王甫張讓等及侍中許相竝為列侯節等宦官祐薄品卑人賤讒諂媚主佞邪徼寵放毒人物疾妒忠良有趙高之禍未被轘裂之誅掩朝廷之明成私樹之黨而陛下不悟妄授茅土開國承家小人是用又并及家人重金兼紫相繼為蕃輔受國重恩不念爾祖述修厥德而交結邪黨下比群佞陛下惑其瑣才特蒙恩澤又授位乖越賢才不升素餐私倖必加榮擢陰陽乖剌稼穡荒蔬人用不康罔不繇茲臣誠知封事已行言之無逮所以冒死干觸陳愚忠者實願陛下損改既謬從此一止臣又聞後宮綵女數千餘人衣食之費日數百金比穀雖賤而戶有饑色案法當貴而今更賤者繇賦發繁數以解縣官寒不敢衣饑不敢食民有斯厄而莫之恤宮女無用填積後庭天下雖復盡力耕桑猶不能供昔楚女悲愁則西宮致災況終年積聚豈無憂怨乎夫天生蒸民立君以牧之君道得則民戴之如父母仰之猶日月雖時有征稅猶望其仁恩之惠易曰悅以使民民忘其勞悅以犯難民忘其死儲君副主宜諷誦斯言南面當國宜履行其事又承詔書當于河間故國起解瀆之館陛下龍飛即位雖從藩國然處九天之高豈宜有顧戀之意且河間疏遠解瀆邈絕而當勞民單力未見其便又今外戚四姓貴幸之家及中官公族無功德者造起館舍凡有萬數樓閣相接丹青素堊雕刻之飾不可單言喪葬逾制奢麗過禮竟相放效莫肯矯拂穀梁傳曰財盡則怨力盡則懟尸子曰君如杅民如水杅方則水方杅圓則水圓上之化下猶風之靡草今上無去奢之儉下有縱欲之敝至使禽獸食民之甘土木衣民之帛昔師曠諫晉平公曰梁柱衣繡民無褐衣池有棄酒士有渴死廄馬秣粟民有饑色近臣不敢諫遠臣不得暢此之謂也又聞前召議郎蔡邕對問于金商門而令中常侍曹節王甫等以詔書喻旨邕不敢懷道迷國而切言極對毀刺貴臣譏呵豎宦陛下不密其言至令宣露群邪項領膏唇拭舌競欲咀嚼造作飛條陛下回受誹謗致邕刑罪室家徙放老幼流離豈不負忠臣哉今群臣皆以邕為戒上畏不測之難下懼劍客之害臣知朝廷不復得聞忠言矣故太尉段熲武勇冠世習于邊事垂發服戎功成皓首歷事二主勳烈獨昭陛下既已式序位登台司而為司隸校尉陽球所見誣脅一身既斃而妻子遠播天下惆悵功臣失望宜徵邕更授任反熲家屬則忠貞路開眾怨已弭矣見後漢呂強傳諫蓄私臧疏天下之財莫不生之陰陽歸之陛下歸之陛下豈有公私而今中尚方斂諸邵之寶中御府積天下之繒西園引司農之臧中廄聚太僕之馬而所輸之府輒有導行之財調廣民困費多獻少姦吏因其利百姓受其敝袁宏紀作輒有導行之財皆出于民今發十而貢一費多而獻少無為使姦吏用巧私門致富也又阿媚之臣好獻其私容諂姑息自此而進袁宏紀此下有其所奉獻皆御府所有無為使從諛之臣得自媟黷也舊典選舉委任三府三府有選參議掾屬咨其行狀度其器能受試任用責以成功若無可察然後付之尚書尚書舉劾請下廷尉覆案虛實行其誅罰今但任尚書或復敕用如是三公得免選舉之負尚書亦復不坐責賞無歸豈肯空自苦勞乎此三語袁宏紀作尚書又無考課之勤陛下虛自勞苦有廢亂之負無所責也夫立言無顯過之咎明鏡無見玼之尤如惡立言以記過則不當學也不欲明鏡之見玼則不當照也願陛下詳思臣言不以記過見玼為責見後漢呂強傳又見袁宏後漢紀二十四上疏苟寵所愛私擢所幸不復為官擇人反為人擇官見文選干寶晉紀總論注引謝承後漢書上言沖帝質帝母未有稱號春秋之義母以子貴隆漢盛典尊崇母氏凡在外戚莫不加寵今沖帝母虞大家質帝母陳夫人皆誕生聖皇而未有稱號夫臣子雖賤尚有追贈之典況二母見在不蒙崇顯之次無以述尊先世垂示後世也見後漢書順帝虞美人紀熹平四年小黃門趙佑議郎卑整上言帝感其言乃拜虞大家為憲陵貴人陳夫人為渤海孝王妃與中常侍趙宋典書大將軍兄弟秉國專朝今與天下黨人謀誅先帝左右掃滅我曹但以碩典禁兵故且沈吟今宜共閉上閣急捕誅之見後漢何進傳大將軍兄弟秉國威權欲與天下黨人共誅內官以碩有兵尚且沈吟觀其旨趣必先誅碩次及諸君今欲除私讎以輔公家見袁宏後漢靈帝紀下二十五
