body:
  text: 班昭東征賦子穀為陳留長大家隨至官作東征賦見文選注引大家集惟永初之七兮余隨子乎東征時孟春之吉日兮撰良辰而將行乃舉趾而升輿兮夕予宿乎偃師遂去故而就新兮志愴悢而懷悲明發曙而不寐兮心遲遲而有違酌罇酒以弛念兮喟抑情而自非諒不登樔而椓蠡兮得不陳力而相追且從眾而就列兮聽天命之所歸遵通衢之大道兮求捷徑欲從誰乃遂往而徂逝兮聊游目而遨魂歷七邑而觀覽兮遭鞏縣之多艱望河洛之交流兮看成皋之旋門既免脫于峻嶮兮歷滎陽而過卷食原武之息足宿陽武之桑閒涉封丘而踐路兮慕京師而竊歎小人性之懷土兮自書傳而有焉遂進道而少前兮得平丘之北邊入匡郭而追遠兮念夫子之厄勤彼衰亂之無道兮乃困畏乎聖人悵容與而久駐兮忘日夕而將昏到長垣之境界察農野之居民睹蒲城之丘墟兮生荊棘之榛榛惕覺寤而顧問兮想子路之威神衛人嘉其勇義兮訖于今而稱云蘧氏在城之東南兮民亦尚其丘墳唯令德為不朽兮身既沒而名存惟經典之所美兮貴道德與仁賢吳札稱多君子兮其言信而有徵後衰微而遭患兮遂陵遲而不興知性命之在天由力行而近仁勉仰高而蹈景兮盡忠恕而與人好正直而不回兮精誠通于明神庶靈祗之鑒照兮祐貞良而輔信亂曰君子之思必成文兮盍各言志慕古人兮先君行止則有作兮雖其不敏敢不法兮貴賤貧富不可求兮正身履道以俟時兮脩短之運愚智同兮靖恭委命唯吉凶兮敬慎無怠思嗛約兮清靜少欲師公綽兮見文選蓺文類聚二十七鍼縷賦鎔秋金之剛精形微妙而直端性通達而漸進博庶物而一貫惟鍼縷之列迹信廣博而無原退逶迤以補過似素絲之羔羊何斗筲之足算咸勒石而升堂見蓺文類聚六十五御覽八百三十大雀賦大家同產兄西域都護定遠侯班超獻大雀詔令大家作賦曰嘉大雀之所集生崑崙之靈丘同小名而大異乃鳳皇之匹疇懷有德而歸義故翔萬里而來遊集帝庭而止息樂和氣而優游上下協而相親聽雅頌之雍雍自東西與南北咸思服而來同見蓺文類聚九十二又御覽九百二十二引曹大家集作大雀頌蟬賦伊玄蟲之微陋亦攝生于天壤當三秋之盛暑陵高木之流響融風被而來遊商焱厲而化往見蓺文類聚九十七又初學記三十引兩條吸清露于丹園抗喬枝而理翮崇皇朝之輝光映豹豹而灼灼見初學記三十御覽九百四十四復丹款之未足留滯恨乎天際見文選庾亮讓中書令表注為兄超求代疏妾同產兄西域都護定遠侯超幸得以微功特蒙重賞爵列通侯位二千石天恩殊絕誠非小臣所當被蒙超之始出志捐軀命冀立微功以自陳效會陳睦之變道路隔絕超以一身轉側絕域曉譬諸國因其兵眾每有攻戰輒為先登身被金夷不避死亡賴蒙陛下神靈且得延命沙漠至今積三十年骨肉生離不復相識所與相隨時人士眾皆已物故超年最長今且七十衰老被病頭髮無黑兩手不仁耳目不聰扶扙乃能行雖欲竭盡其力以報塞天恩迫于歲暮犬馬齒索蠻夷之性悖逆悔老而超旦暮入地久不見代恐開奸宄之源生逆亂之心而公卿大夫咸懷一切莫肯遠慮如有卒暴超之氣力不能從心便為上損國家累世之功下棄忠臣竭力之用誠可痛也故超萬里歸誠自陳苦急延頸踰望三年于今未蒙省錄妾竊聞古者十五受兵六十還之亦有休息不任職也緣陛下以至孝理天下得萬國之歡心不遺小國之臣況超得備侯伯之位故敢觸死為超求哀匄超餘年一得生還復見闕庭使國永無勞遠之慮西域無倉卒之憂超得長蒙文王葬骨之恩子方哀老之惠詩云民亦勞止汔可小康惠此中國以綏四方超有書與妾生訣恐不復相見妾誠傷超以壯年竭忠孝于沙漠疲老則便捐死于曠遠誠可哀憐如不蒙救護超後有一旦之變冀幸超家得蒙趙母衛姬先請之貸妾愚戇不知大義觸犯忌諱見後漢班超傳又略見袁宏後漢紀十四上鄧太后疏伏惟皇太后陛下躬聖德之美隆唐虞之政闢四門而開四聰采狂夫之瞽言納蒭蕘之謀慮妾昭得以愚朽身當盛明敢不披露肝膽以效萬一妾聞謙讓之風德莫大焉故典墳述美神祇降福昔夷齊去國天下服其廉高太伯違邠孔子稱為三讓所以光昭令德揚名于後者也論語曰能以禮讓為國于從政乎何有由是言之推讓之誠其致遠矣今四舅深執忠孝引身自退而以方垂未靜拒而不許如後有毫毛加于今日誠恐推讓之名不可再得緣見逮及故敢昧死竭其愚情自知言不足采以示蟲螘之赤心見後漢列女傳欹器頌侍帝王之密坐見文選曹植與吳季重書注女誡鄙人愚暗受性不敏蒙先君之餘寵賴母師之典訓年十有四執箕箒于曹氏于今四十餘載矣戰戰兢兢常懼黜辱以增父母之羞以益中外之累夙夜劬心勤不告勞而今而後乃知免耳吾性疏頑教導無素恒恐子穀負辱清朝聖恩橫加猥賜金紫實非鄙人庶幾所望也男能自謀矣吾不復以為憂也但傷諸女方當適人而不漸訓誨不聞婦禮懼失容它門取恥宗族吾今疾在沈滯性命無常念汝曹如此每用惆悵閒作女誡七章願諸女各寫一通庶有補益裨助汝身去矣其勖勉之卑弱第一古者生女三日臥之床下弄之瓦塼而齋告焉臥之床下明其卑弱主下人也弄之瓦塼明其習勞主執勤也齋告先君明當主繼祭祀也三者蓋女人之常道禮之典教矣謙讓恭敬先人後己有善莫名有惡莫辭忍辱含垢常若畏懼是謂卑弱下人也晚寢早作勿憚夙夜執務私事不辭劇易所作必成手迹整理是謂執勤也正色端操以事夫主清靜自守無好戲笑潔齋酒食以供祖宗是謂繼祭祀也三者苟備而患名稱之不聞黜辱之在身未之見也三者苟失之何名稱之可聞黜辱之可遠哉夫婦第二夫婦之道參配陰陽通達神明信天地之弘義人倫大節也是以禮貴男女之際詩著關雎之義由斯言之不可不重也夫不賢則無以御婦婦不賢則無以事夫夫不御婦則威儀廢缺婦不事夫則義理墮闕方斯二者其用一也察今之君子徒知妻婦之不可不御威儀之不可不整故訓其男檢以書傳殊不知夫主之不可不事禮義之不可不存也但教男而不教女不亦蔽于彼此之數乎禮八歲始教之書十五而至于學矣獨不可依此以為則哉敬慎第三陰陽殊性男女異行陽以剛為德陰以柔為用男以彊為貴女以弱為美故鄙諺有云生男如狼猶恐其尫生女如鼠猶恐其虎然則修身莫若敬避強莫若順故日敬順之道婦之大禮也夫敬非它持久之謂也夫順非它寬裕之謂也持久者知止足也寬裕者尚恭下也夫婦之好終身不離房室周旋遂生媟黷媟黷既生語言過矣語言既過縱恣必作縱恣既作則侮夫之心生矣此由于不知止足者也夫事有曲直言有是非直者不能不爭曲者不能不訟訟爭既施則有忿怒之事矣此由于不尚恭下者也侮夫不節譴呵從之忿怒不止楚撻從之夫為夫婦者義以和親恩以好合楚撻既行何義之存譴呵既宣何恩之有恩義俱廢夫婦離矣婦行第四女有四行一曰婦德二曰婦言三曰婦容四曰婦功夫云婦德不必才明絕異也婦言不必辯口利辭也婦容不必顏色美麗也婦功不必工巧過人也清閑真靜守節整齊行己有恥動靜有法是謂婦德擇辭而說不道惡語時然後言不厭于人是謂婦言盥浣塵穢服餙鮮潔沐浴以時身不垢辱是謂婦容專心紡績不好戲笑潔齋酒食以奉賓客是謂婦功此四者女人之大德而不可乏之者也然為之甚易唯在存心耳古人有言仁遠乎哉我欲仁而仁斯至矣此之謂也專心第五禮夫有再娶之義婦無二適之文故曰夫者天也天固不可逃夫固不可離也行違神衹天則罰之禮義有愆夫則薄之故女憲曰得意一人是謂永畢失意一人是謂永訖由斯言之夫不可不求其心然所求者亦非謂佞媚苟親也固莫若專心正色禮義居絜耳無淫聽目無邪視出無冶容入無廢飾無聚會群輩無看視門戶此則謂專心正色矣若夫動靜輕脫視聽陝輸入則亂發壞形出則窈窕作態說所不當道觀所不當視此謂不能專心正色矣曲從第六夫得意一人是謂永畢失意一人是謂永訖欲人定志專心之言也舅姑之心豈當可失哉物有以恩自離者亦有以義自破者也夫雖云愛舅姑云非此所謂以義自破者也然則舅姑之心奈何固莫尚于曲從矣姑云不爾而是固宜從令姑云爾而非猶宜順命勿得違戾是非爭分曲直此則所謂曲從矣故女憲曰婦如影響焉不可賞和叔妹第七婦人之得意于夫主由舅姑之愛己也舅姑之愛己由叔妹之譽己也由此言之我臧否譽毀一由叔妹叔妹之心復不可失也皆莫知叔妹之不可失而不能和之以求親其蔽也哉自非聖人鮮能無過故顏子貴于能改仲尼嘉其不貳而況婦人者也雖以賢女之行聰哲之性其能備乎是故室人和則謗掩外內離則惡揚此必然之勢也易曰二人同心其利斷金同心之言其臭如蘭此之謂也夫嫂妹者體敵而尊恩疏而義親若淑媛謙順之人則能依義以篤好崇恩以結援使徽美顯章而瑕過隱塞舅姑矜善而夫主嘉美聲譽曜于邑鄰休光延于父母若夫蠢愚之人于嫂則托名以自高于妹則因寵以驕盈驕盈既施何和之有恩義既乖何譽之臻是以美隱而過宣姑忿而夫愧毀訾布于中外恥辱集於厥身進增父母之羞退益君子之累斯乃榮辱之本而顯否之基也可不慎哉然則求叔妹之心固莫尚于謙順矣謙則德之柄順則婦之行凡斯二者足以和矣詩云在彼無惡在此無射其斯之謂也見後漢列女傳上書自訟妾同產女弟貴人前充後宮蒙先帝厚恩得見寵幸皇天授命誕生聖明而為竇憲兄弟所見譖訴使妾父竦冤死牢獄骸骨不掩老母孤弟遠徙萬里獨妾遺脫逸伏草野常恐沒命無由自達今遭值陛下神聖之運親統萬機群物得所憲兄弟姦惡既伏辜誅海內曠然各獲其宜妾得蘇息拭目更視乃敢昧死自陳所天妾聞太宗即位薄氏蒙榮宣帝繼統史族復興妾門雖有薄史之親獨無外戚餘恩誠自悼傷妾父既冤不可復生母氏年殊七十及弟棠等遠在絕域不知死生願乞收竦朽骨使母弟得歸本郡則施過天地存沒幸賴見後漢梁竦傳又見袁宏後漢紀十四稍有刪節教子中人情性可上下也在其檢耳若放而不檢則入惡也昔西門豹佩韋以自寬宓子賤帶弦以自急故能改身之恒為天下名士見華陽國志十下戒諸女及婦吾之妊身在乎正順及其生也思存于撫愛其長之也威儀以先後之體貌以左右之恭敬以監臨之懃恪以勸之孝順以內之忠信以發之是以皆成而無不善汝曹度幾勿忘吾法也見華陽國志十下敕二婦吾先姑母師也常言聖賢必勞民者使之思善不勞則逸逸則不才吾家不為貧也所以粗食急務者使知苦難備獨居時見華陽國志十下敕弟燮先公為漢忠臣雖死之日猶生之年梁冀以族弟幸濟豈非天乎慎勿有一言加梁氏加梁氏則連主上是又掇禍也見華陽國志十下戒兄子伯思君子疾沒世而名不稱不患年不長也且夫神仙愚惑如繫風捕影非可得也見華陽國志十下與竇玄書竇玄形貌絕異天子以公主妻之舊妻與玄書別曰棄妻斥女敬白竇生卑賤鄙陋不如貴人妾日已遠彼日已親何所告訴仰呼蒼天悲哉竇生衣不厭新人不厭故悲不可忍怨不自去彼獨何人而居我處見蓺文類聚三十答夫秦嘉書知屈圭璋應奉藏使策名王府觀國之光雖失高素皓然之業亦是仲尼執鞭之操也自初承問心願東還迫疾惟宜抱歎而已日月已盡行有伴例想嚴莊已辦發邁在近誰謂宋遠企子望之室邇人遐我勞如何深谷逶迤而君是涉高山巖巖而君是越斯亦難矣長路悠悠而君是踐冰霜慘烈而君是履身非形影何得動而輒俱體非比目何得同而不離于是詠萱草之喻以消兩家之思割今者之恨以待將來之歡今適樂土優游京邑觀王都之壯麗察天下之珍妙得無目玩意移往而不能出耶見蓺文類聚三十二又報嘉書既惠音令兼賜諸物厚顧慇懃出于非望鏡有文彩之麗釵有殊異之觀芳香既珍素琴益好惠異物于鄙陋割所珍以相賜非豐恩之厚孰肯若斯覽鏡執釵情想髣髴操琴詠詩思心成結敕以芳香馥身喻以明鏡鑒形此言過矣未獲我心也昔詩人有飛蓬之感班婕妤有誰榮之歎素琴之作當須君歸明鏡之鑒當待君還未奉光儀則寶釵不設也未侍帷帳則芳香不發也見蓺文類聚三十二又略見御覽七百十七作今君征未還鏡將何施明鏡鑒形當待君至又七百十八九百八十一今奉旄牛尾拂一枚可以拂塵垢越布書鈔一百三十六作越州手巾二枚嚴器中物幾具金錯盌一枚可以盛書水琉璃盌一枚可以服藥酒見蓺文類聚七十三御覽七百三七百十六七百十七七百六十今奉細布韤一量見御覽六百九十七為誓書與兄弟蓋聞君子導人以德矯俗以禮是以列士有不移之志貞女無迴二之行淑雖婦人竊慕殺身成義死而後已夙遘禍罰喪其所天男弱未冠女幼未笄是以僶俛求生將欲長育二子上奉祖宗之嗣下繼祖禰之禮然後覲于黃泉永無慚色仁兄德弟既不能厲高節于弱志發明德于闇昧許我他人逼我干上乃命官人訟之簡書夫智者不可惑以事仁者不可脅以死晏嬰不以白刃臨頸改正直之辭梁寡不以毀形之痛忘執節之義高山景行豈不思齊計兄弟不能匡我以道博我以文雖曰既學吾謂之未也見御覽四百四十一引杜預女記淑喪夫守寡兄弟將嫁之誓而不許為書曰云云荅曹公夫人卞氏書彪袁氏頓首頓首路跂雖近不展淹久歎想之勞情抱山積曹公匡濟天下遐邇以寍四海歸仰莫不感戴小兒疏細謬蒙采拾未有上報果自招罪戾念之痛楚五內傷裂尊意不遺伏辱惠告見明公與太尉書具知委曲度子之行不過父母小兒違越分應至此憐其始立之年畢命埃土遺育孤幼言之崩潰明公所賜已多又加重賚禮頗非宜荷受輒付往信見古文苑惟女子之有行固歷代之彝倫辭父母而言歸奉君子之清塵如懸蘿之附松似浮萍之託津恐施厚而德薄若履冰而臨淵何性命之不造遭世路之險迍榮華曄其始茂所恃奄其徂泯靜閉門以卻埽魂孤煢以窮居刷朱扉以白堊易玄帳以素幬含慘悴其何訴抱弱子以自慰顧顏貌之艵艵對左右而掩涕時翳翳以稍陰日亹亹以西墜鳥淩虛以徘徊雞斂翼以登棲雀分散以群逝還空床以下幃拂衾褥以安寐氣憤薄而交縈抱素枕而歔欷想逝者之有憑因宵夜之髣髴痛存亡之異路終窈漠而不至時荏苒而不留將遷靈以大行駕龍轜于門側設祖祭于前廊旐繽紛以飛揚彼生離其猶難矧永絕而不傷涕流迸以淋浪自銜恤而在疚履春冬之四節風蕭蕭而增勁寒凜凜而彌切霜淒淒而夜降水溓溓而晨結雪翩翩以交零瞻靈宇之空虛悲屏幌之徒設仰皇天而歎息腸一日而九結神爽緬其日永歲功忽其已成惟人生于世上若馳驥之過櫺計先後其何幾亦同歸乎幽冥賤妾煢煢顧影為儔見蓺文類聚三十四又見文選潘岳寡婦賦注陶潛歸去來辭注初學記十四
