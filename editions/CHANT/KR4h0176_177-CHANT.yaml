body:
  text: 闕名刺史周行郡國以六條問事詔刺史班宣周行郡國省察治政黜陟能否斷理冤獄以六條問事非條所問即不省一條強宗豪右田宅踰制以強陵弱以眾暴寡二條二千石不奉詔書遵承典制倍公向私旁詔守利侵漁百姓聚斂為姦三條二千石不䘏疑獄風厲殺人怒則任刑喜則任賞煩擾苛暴剝戮黎元為百姓所疾山崩石裂妖祥訛言四條二千石選署不平苟阿所愛蔽賢寵頑五條二千石子弟怙恃榮勢請託所監六條二千石違公下比阿附豪強通行貨賂割損政令見續漢百官志五注補引蔡質漢儀詔書舊典以尹昆為尚書僕射詔惟君公曹時以太守之術克獎王室其省錄臺事勿令謬誤見北堂書鈔五十九引謝承後漢書尹昆字口淵為侍御七日特拜尚書僕射詔云云案此詔原本缺誤不知何帝俟考祀令天子行有所之出河沉用白馬珪壁各一衣以繒緹五尺又祠用脯二束酒六斗鹽一升涉渭灞涇洛地名水如此者沉珪璧各一律在所給祠其及行沉祠他川水先驅投石少時給珪璧不滿百里者不沉見通典五十四上順帝書臣為陛下子陛下為臣父臣章百上終不見省臣豈可北詣單于以告怨乎見後漢虞詡傳先是寧陽主簿詣闕訴其縣令之枉積六七歲不省主簿乃上書云云月暈上書請赦命昔有大星升漢而西卷舌揚芒迫月營惑犯帝坐則有大臣枉誅星在西方太尉固應之今暈如之宜有赦命錄其遺嗣以除此異見華陽國志延熹二年梁冀誅後月經陽道暈五車史官上書於是下書赦固子燮上言得嚴光有男子披羊裘釣澤中見御覽六百九十四齊國上言上言增科禁古者肉刑嚴重則人畏法令今憲律輕薄故姦軌不勝宜增科禁以防其源見後漢杜林傳建武十四年群臣上言上言桑蠶臣行部入長沙界觀者皆徒跣臣問御佐曰人無履亦苦之否御佐對曰十二月盛寒時並多剖裂血出燃火燎之春溫或濃潰建武中桂陽太守茨充教人種桑蠶人得其利至今江南頗知桑蠶織屨皆充之化也見後漢衛颯傳注引東觀記曰元和中荊州刺史上言上言清河孝王尊號清河孝王至德淳懿載育明聖承天奉祚為郊廟主漢興高皇帝尊父為太上皇宣帝號父為皇考序昭穆置園邑太宗之義舊章不忘宜上尊號曰孝德皇皇妣左氏曰孝德后孝德皇母宋貴人追諡曰敬隱后見後漢清河孝王廣傳有司上言清河孝王至德純一含弘光大既受帝祉載生明聖舊章法制宜有尊號不宜稱王宜曰孝德皇妣曰孝德后祖妣宗貴人曰敬德后見通典七十二有司上言與後漢本傳異今兩存之因天變上言當有陰謀不宜北行見魏志武帝紀注引九州春秋靈帝欲北巡冀州刺史王芬等謀因此作難上書求起兵會北方有赤氣東西竟天太史上言云云帝乃止奏上尊號漢遭王莽宗廟廢絕豪杰憤怒兆人塗炭王與伯升首舉義兵更始因其資以據帝位而不能奉承大統敗亂綱紀盜賊日多群生危蹙大王初征昆陽王莽自潰後拔邯鄲北州弭定參分天下而有其二跨州據土帶甲百萬言武力則莫之敢抗論文德則無所與辭臣聞帝王不可以久曠天命不可以謙拒惟大王以社稷為計萬姓為心見後漢光武紀至中山諸將復上奏復奏受命之符人應為大萬里合信不議同情周之白魚曷足比焉今上無天子海內淆亂符瑞之應昭然著聞宣荅天神以塞群望見後漢光武紀群臣復奏奏禁諸王客諸王所招待者或真偽雜受刑罰者子孫宜可分別見續漢五行志六建武二十八年有人上奏奏請封禪登封告成為民報德百王所同陛下輒拒絕不許臣下不敢頌功述德業河雒讖書赤漢九世當巡封泰山凡三十六事傳奏左帷陛下遂以仲月令辰遵岱嶽之正禮奉圖雒之明文以和靈瑞以為兆民見續漢祭祀志上注引東觀書奏請封禪刻石河雒圖記表章赤漢九世尤著明者前後凡三十六事與博士充等議以為殷統未絕黎庶繼命高宗久勞猶為中興武王因父受命之列據三代郊天因孔子甚美其功後世謂之聖王漢統中絕王莽盜位一民莫非其臣尺土靡不其有宗廟不祀十有八年陛下無十室之資奮振于匹夫除殘去賊興復祖宗集就天下海內治平夷狄慕義功德盛于高宗宣王宜封禪為百姓祈福請親定刻石紀號文太常奏儀制見續漢祭祀志上注引東觀書上至泰山有司復奏奏封禪故事當用方石再累置壇中皆方五尺厚一尺用玉牒書藏方石牒厚五寸長尺三寸廣五寸有玉檢又用石檢十枚列于石傍東西各三南北各二皆長三尺廣一尺厚七寸檢中刻三處深四寸方五寸有蓋檢用金縷五周以水銀和金以為泥玉璽一方寸二分一枚方五寸方石四角又有距石皆再累枚長一丈厚一尺廣二尺皆在圓壇上其下用距石十八枚皆高三尺厚一尺廣二尺如小碑環壇立之去壇三步距石下皆有石跗入地四尺又用石碑高九尺廣三尺五寸厚尺二寸立壇丙地去壇三丈以上以刻書見續漢祭祀志上建武三十二年議封禪所施用有司奏奏請撰集符群臣請令史太撰集符瑞地祇靈應而朱草萌生孝宣帝每有嘉瑞輒以改元神爵五鳳甘露黃龍列為年紀蓋以感致神祇表彰德信是以化致升平稱為中興今天下清寧靈物仍降陛下情存損挹推而不居豈可使祥符顯慶沒而無聞宜令太史撰集以傳來世見後漢光武紀中元元年夏群臣奏奏上明帝廟號孝明皇帝聖德淳茂劬勞日昃身御浣衣食無兼珍澤臻四表遠人慕化僬僥儋耳款塞自至克伐鬼方開道西域威靈廣被無思不服以烝庶為憂不以天下為樂備三雍之教躬養老之禮作登歌正雅樂博貫六藝不舍晝夜聰明淵塞著在圖讖至德所感通于神明功烈光于四海仁風行于千載而深執謙謙自稱不德無起寢廟埽地而祭除日祀之法省送終之禮遂藏主于光烈皇后更衣別室天下聞之莫不悽愴陛下至孝烝烝奉順聖德臣愚以為更衣在中門之外處所殊別宜尊廟曰顯宗其四時褅袷于光武之堂閒祀悉還更衣共進武德之舞如孝文皇帝袷祭高廟故事見後漢章紀有司奏言云云制曰可奏上章帝廟號孝章皇帝崇弘鴻業德化普洽垂意黎民留念稼穡文加殊俗武暢方表戒惟人面無思不服巍巍蕩蕩莫與比隆周頌曰於穆清廟肅雍顯相請上尊廟曰肅宗共進武德之舞見後漢和帝紀章和二年三月辛酉有司上奏制曰可奏請封郭鎮鎮冒犯白刃手劍賊臣姦黨殄滅宗廟以寧功比劉章宜顯爵土以勵忠貞見后漢書郭躬附傳延光中鎮為尚書迎立濟陰王率羽林士擊殺衛尉閻景再遷尚書令三公奏乃封定潁侯奏上順帝廟號孝順皇帝弘秉聖哲龍興統業稽乾則古欽奉鴻烈寬裕晏晏宣恩以極躬自菲薄以崇玄默遺詔貽約顧念萬國衣無製新玩好不飾塋陵損狹不起寢廟遵履前制敬敕慎終有始有卒孝經曰愛敬盡于事親而德教加于百姓詩曰敬慎威儀惟民之則臣請上尊號曰敬宗廟天子世世獻奉藏主祫祭進武德之舞如祖宗故事見續漢祭祀志下注補引東觀書有司奏言云云露布奏可奏薦摯恂恂行侔曾閔學擬仲舒文參長卿才同賈誼誠瑚璉器也宜在宗廟為國楨輔見高士傳恂字季直高士峻十二世孫永元中和帝博求名儒公卿薦恂公車徵及大將軍竇憲舉賢良竝不就奏請案納后禮儀春秋迎王后于紀在塗則稱后今大將軍冀女弟膺紹聖善結婚之際有命既集宜備禮章時進徵幣請下三公太常案禮儀見後漢桓帝梁皇后紀奏加梁冀殊禮入朝不趨劍履不殿謁讚不名禮儀比蕭何悉以定陶成陽餘戶增封為四縣比鄭禹賞賜金錢奴婢綵帛車馬衣服甲第比霍光以殊元勳每朝會與三公絕席十日一入平尚書事宣布天下為萬世法見後漢梁冀傳元嘉元年于是有司奏奏定孝崇皇后喪禮禮為人後制服有降公卿已下各差贈送之禮儀比恭懷皇后見後漢紀二十一元嘉二年四月孝崇皇后崩有司奏奏處正襄楷宦者之官非近世所置漢初張澤為大謁者佐絳侯誅諸呂孝文使趙談參乘而子孫昌盛楷不正辭理指陳要務而析言破律違背經藝假借星宿偽托神靈造合私意誣上罔事請下司隸正楷罪法收送洛陽獄見後漢襄楷傳詔下有司處正尚書承旨奏日云云奏大石自起立事伏聞東平國無鹽縣山中有大石無故一夕自起立臣愚以為石者陰類殆有微人當紹起者漢興以來與今再見其一正以昭帝無繼嗣見今又以陛下無繼嗣復見見白孔六帖引漢名臣奏案文當是桓帝末奏劾蔡邕邕屬張宛長休百日郃假宛五日復屬河南李奇為書佐郃不為召太山黨魁羊陟與邕季父衛尉質對門九族質為尚書營護阿擁令文書不覺郃被詔書考胡母班等辭與陟為黨質及邕頻詣郃問班所及郃不應遂懷怨恨欲必中傷郃見後漢書蔡邕傳邕與司徒劉郃素不相平中常侍程璜遂使人飛章言邕于是詔下尚書召邕詰狀注引邕集其奏曰云云制曰下司隸校尉正處上奏除四帝后尊號和安順桓四帝無功德不宜稱宗又恭懷敬隱恭愍三皇后竝非正嫡不合稱后皆請除尊號制曰可見後漢獻帝紀初平元年有司奏奏請以立秋擇吉日治兵古四時講武皆於農隙漢西京承秦制三時不講唯十月都試車馬幸長水南門會營五士為八陣進退名曰乘之今金革未偃士民素習自今已後可無四時講武但以立秋擇吉日大朝車騎號曰治兵上合禮名下承漢制見魏志武帝紀建安二十一年注引魏書宋書禮志一歸漢議漢承堯運歷數延長今皇帝姓號見于圖書自前世博物道術之士谷子雲夏賀良等建明漢有再受命之符言之久矣故劉子駿改易名字冀應其占及莽末道士西門君惠言劉秀當為天子遂謀立子駿事覺被殺出謂百姓觀者曰劉秀真汝主也皆近事暴著智者所共見也除言天命且以人事論之今稱帝者數人而洛陽土地最廣甲兵最強號令最明觀符命而察人事它姓殊未能當也見後漢竇融傳隗囂使辯士張玄游說河西融等于是召豪傑及諸太守計議其中智者皆曰云云遂決策東向馼梁統重刑議隆刑峻法非明王急務施行日久豈一朝所釐統今所定不宜開可見後漢梁統傳統上疏請重刑罰事下三公廷尉議者以為云云郊祀帝堯議追迹先代無效其五運之祖者故禹不郊黃帝周不效帝嚳漢雖唐之苗裔堯以歷數命舜高祖赤龍火德承運而起當以高祖配堯之後元復于漢宜修奉濟陽成陽縣堯帝之冢雲臺致敬祭祀之禮宜亦如之見御覽五百二十七引東觀漢記有司奏議郊宗議昔周公郊祀后稷以配天宗祀文王以配上帝圖讖著伊堯赤帝之子俱與后稷並受命而為王漢劉祖令宜郊祀帝堯以配天宗祀高祖以配上帝見御覽五百二十七引東觀漢記儆備南匈奴議蠻夷反覆雖難測知然大兵聚會必未敢動搖今宜遣有方略使者之單于庭與杜崇朱徽及西河太守並力觀其動靜如無它變可令崇等就安國會其左右大臣責其部眾橫暴為邊害者共平罪誅若不從命令為權時方略事畢之後裁行客賜亦足以威示百蠻見後漢南匈奴傳永元六年中郎將杜崇與行度遼將軍朱徽上言南單于安國背畔請為之儆備和帝下公卿議皆以為御史大夫遣郡國計吏敕御史大夫敕上計丞長史曰詔書殿下布告郡國臣下承宣無狀多不究百姓不蒙恩被化守丞長史到郡與二千石同力為民興利除害務有以安之稱詔書郡國有茂才不顯者言上殘民貪污煩擾之吏百姓所苦務勿任用方察不稱者刑罰務于得中惡惡止其身選舉民侈過度務有以化之問今歲善惡孰與往年對上問今年盜賊孰與往年得無有群輩大賊對上見漢舊儀永樂大典本又引見續漢百官志一注敕劉洪前郎中馮光司徒掾陳晃各訟歷故議郎蔡邕共補續其志令洪其詣修與漢相參推元課分考校月食審己已元密近有師法洪便從漢受見續漢律厤志中光和二年萬年公乘王漢上月食注太史令修上言漢所作注不與見食相應者二事以同為異者二十九事尚書召穀城門侯劉洪敕曰云云討羌符永初二年六月丁未朔廿日丙寅得車騎將軍幕府文書上郡屬國都尉中二千石守丞廷義縣令三水十月丁未到府受印綬發夫討叛羌急急如律令馬𠦜匹驢二百頭日給見古刻叢鈔八能士書版言事狀臣某言今月若干日甲乙日冬至黃鍾之音調君道得孝道褎督郵保舉博士板狀生事愛敬喪沒如禮理易尚書孝經論語兼崇載籍窮微闡奧師事某官經明受謝見受門徒尚五十人以上正席謝生三郡三人隱居樂道不求聞達身無金痍痼疾三十六屬不與妖惡交通巨侯賞賜行應四科經任博士某官某甲保舉見通典靈帝時諸博士試甲乙科凡學士督書其板舉主保之鍾皓頌林慮懿德非禮不處悅此詩書弦琴樂古五就州招九膺台輔逡巡王命卒歲容與見後漢鍾皓傳諸儒頌之邴原誦邴君行仁落邑無虎邴君行廉路樹成社見御覽五百三十二引邴原別傳原避地遼東里老為之誦資中古碑伏羲讚伏羲蒼精初造工業畫卦結繩以理海內見史子堅隸格孔嵩讚仲山通達卷舒無方屈身厮役挺秀含芳見水經淯水注宛城西有孔嵩舊居嵩字仲山宛人與山陽范式有斷金契貧無養親賃為阿街卒故其贊曰鐵印銘傭力得富錢至億庾一士三田軍門主簿見王子年拾遺記安帝永初時有琅琊王溥即中尉王吉之後嘗穿井得鐵印有銘後以一億錢輸官得中壘校尉三田一土壘字也又引見御覽一百八十九雙魚洗銘富貴昌宜侯王元和二年見拓本騶氏鏡銘騶氏作竟四口服多賀國家人民息天下復風雨時節五穀熟長保二親得天力兮口東王公西王母見隸續十四尚方鏡銘尚方作竟真大好上有仙人不知老渴飲玉泉飢食棗浮游天下敖四海壽比金石國之保見隸續十四尚方作竟四夷服多賀國家人民息胡虜殄滅天下服風雨時節五穀熟長保二親子孫力傳吉後世樂無極兮見博古圖李氏鏡銘李氏作竟佳且好明如日月世之保白虎辟邪主䣄道渴飲玉泉飢食棗浮由天下不知老見拓本鏡銘絜精白而事君怨陰驩之弇明煥玄錫之流澤志疏遠而日忘慎松美之窮嗤外丞驩之可欲說慕安于重泉願永思而母紀內請碩以昭明光輝卓夫日月心忽揚而願忠然壅塞而不池日有憙月有富樂無事常得意美人會竽瑟侍商市程萬物平老復丁復生寧久不見侍前希秋風起予志悲湛若止水皎如秋日清暉內融菱花外發洞照心膽屏除妖孼永世作珍服之無沬尚方御竟大母傷巧工刻之成文章左龍右虎辟不祥朱鳥玄武順陰陽子孫備具居中央湅治銀錫清而明長保二親樂富昌壽敝金石如侯王許氏作竟自有紀青龍白虎居左右聖人周公魯孔子作吏高遷車生耳郡舉孝廉州博士少不努力老乃悔吉天地成日月明五嶽靈四瀆清十二精八卦貞富貴盈子孫寧皆賢英福祿并已上竝見拓本梁商誄孰云忠侯不聞其音背去國家都茲玄陰幽居冥冥靡所且窮見東觀漢記
