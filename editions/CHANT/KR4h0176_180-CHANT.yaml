body:
  text: 闕名成皋令任伯嗣碑字伯嗣南郡編人也其先蓋任座之苗冑君少履岐嶷醇懿之仁而有威仕極州郡舉孝廉除郎中蜀郡府丞江州令以服去官辟築陽侯相延熹五年七月遷來臨縣正身帥下賞恭罰否存䘏寒苦右官朝寂靜姦軌撿手徭賦平均黔庶不擾期月有成政由豹產邦七州喉衢路委蛇郟河阻山崩陁虧齧峻峭危難君發弘謀慮斯南移北徙俠就寬直枉正曲以險為安隤高夷窊顯敞平端功叢廣悅懽然後乃探索隱厲貞禮孝興文偃武脩序畔校善著惡消頑易操威恩並行南蠻㧊扈荊部周遷君桂陽銜夫織妾仿偟道予何莢追送隨慕君未到郡先騰檄告諭以信義繩以憲度狂狡醜類畏怖或豫降服或走逃竄居民安業商旅通濟不戰而寇息罰未加如斯可謂德應神祗獲巛之助垂曜於无窮者已是以都邑謠詠慕昔甄勒勳績永昭于後乃作頌曰惟任君政不世出慈寬惠恕剛猛桀掘應期濟時來牧我國體仁垂義種德伸屈潤槀理冤省結受施既浹升輿南翔西征東怨萬民攸望鐫表口頌億載彌彰見隸續十五真道冢地碑此冢政乎欲負冢土勿取冢地中法取東吉利慎勿取西北土也延熹五年七月中旬真道字直中以錢八千從有親真敖字政直直弟政升升二從弟漢宗市冢地連隨地等彖呂連瀆海江廣廿二丈內人北行瀆廣皆如前錢付畢政等得可中弟子孫道治政等彖左是冢西中等冢左東北祠舍地中等子孫子孫但得宿山居留不得爭舍地爭訟天帝誅疾勉崇孝道先人之約讀如順此書位所堅次比人相愛必不得違犯諸存子孫益中錢酒飯子孫吉不益有所取出即不利後冢東行廣五丈北行不得作冢可示後世冢前也後世作冢從此冢後并墳北行門出西地也見隸續十九冀州刺史王純碑君諱純字伯敦魏郡太守之子其先出自後也厥祖儒宗春秋君天資才敏行不啟而達學不勞而能遵父業術始仕事君立朝正色恂智宣慈惠和以州從事永和二年察孝廉除郎謁者執法操牘舊筆憲臺直邊發無任見徒掌錄遣之或有罪過微刑輕笑深君坐行惡蠲疑閔其粥麋凍餧之患敕大司農徹易衣裝惻隱至恩加窮民其三年有九夷之難出將征西君請詔豫督趣軍糧其所歷彈正赫馨烈宣于方國拜守宮令以父司隸還謁者官遷左都侯喪父服除復拜郎敬北失妹寍歸遂釋印紱司空辟舉高第選侍御史出使楊州聖朝嘉君旋拜徐州流化甘棠過宥罪政尚寬弘視事二載換在冀州西征東怨紀歌遺風以公事去官窮則樂善達則人進則延賓分祿退則卻掃閉門年五十九延熹四年八月廿八日甲寅不隕徂五年十一月十八日丙申葬存有令迹亡述𡥂勳銘載金石永世不刊其頌曰煥矣王君有虞之冑封陳興齊枝葉繁茂君綜典謨無道不究從政履規在公竭謀登翼臺文武兼備發政舉刑親恤將西征命使善細不聖朝嘉異牧徐宰冀惠邊則澹不朽不永年壽縉紳凡百孰不哀思見隸釋七平輿令嶭君碑惟延熹六年春二月平輿令嶭君卒烏虖哀哉吏民其咨咨君之德迺建碑石于墓之側其辭曰於皇降德于茲我君我君肇祖官有世功迺侯于薛苗胤枝分作漢卿尹七世相承君之懿德性此淑真如冰之絜如玉之堅靡術不綜罔禮不遵忻忻之至三族以敦英名委質宣昭令聞升州入宰炳乎其勳莅政已吾爛而有成遷典平輿匪威匪仁寬猛以濟邈矣惟清化未期月遭此竺旻吏民穆卜嘗禱屏營旻天不弔不憖遺君晻曶薨徂命不可攀國人巷哭若喪厥親白號怛童稺吟呻嗟嗟酷痛如何昊乾靈柩旋歸此穸窀哀哀士俊惻爾酸辛婣族畢至素縞填庭於是吏民迺復追歎君初舉孝三署播名爰佐戎來臨汝南剖符之貳千里同塵料揀真賓好此徽聲貢奇達異迥酌清英遺風令歌永矢不愃云君回軫誰不褢歡意迷流乃隕乃顛如可贖也人百其身昔邵臨國民謂之父今也薛君追蹈厥緒身歿言存是謂不朽于我吏民悲慕不已刊石紀銘永昭于後見隸續一都鄉孝子嚴舉碑都鄉都里孝子嚴君父諱字子順結髮治身非義不行郡入州居孝位至蕃車產生三女絕嗣無男憤然恐戶孤寒宗族收集孤以作後禮為人後則為人子舉尤勤和顏以終制行忉怛憤泣憔悴消躬亂不不母老請然後為稽然後行孝順則閨門積行慎心德刑州里莫不稱歌慈仁其前世官賢有秩長思褎大其義造善慕類君子之倫共立碑表勒石述歎以章其芬頌曰炎翟隆徂德配神廣彼明察化及黔首施流潤慈順博愛九族和睦事繼若真行為表式殊性異曾克諧勳無德不勒石示後後生惟則亂曰休哉休哉君施兆民勒石表義仁鎮君明臣孝行著成兮玄北報德奐煥榮兮貫洞祇靈永隻兮禾萬基施兮延熹七年五月辛未朔十一日辛已臨江長愷丞杜謂都言孝子嚴舉為父行喪服制踰禮追恩慕義表門閭有書賢明宰卿應風生是以天仁人孝弟之至通洞神祗蓋淑賞則庶民勸今書到勉加勞來以究言如詔書見隸續十一蜀郡屬國辛通達李仲曾造橋碑惟延熹龍在甲辰三月甲子傷民康集濟舟扶攜憂造此莋橋之基改奢就儉莫不安之以五月甲午竟領道楊荷杜仁領道楊瑗敘德勒石文不能嘆一以褒賢君其辭曰我邦乾川垂極土埶汜反側位在角精崖崖山嶽水汶江漂湍濁道丘阜棧格陵陵地則居新桓竟官夷羌虜賊頃年畔厲有道則服有隘吏民栗赫赫皇辟矜哀下民命彼喉舌拜我明君惟君至德應甫及申恩懷貧其知如漢謀謨若神小閣明府協同斷金西征鄙國撫育犂元除煩省苛公劉之仁單甫牧英不忍戰民恤彼戲險登陵橋壞求正歲歲津滿首呵逆流沈深往往覆沒傷害行人四縣衝衝老弱所湛耿耿實勞慇慇日閔此之艱記吉領道杜泝楊瑗作莋橋梁師爾徒屯待事楊守古荷賊曹掾杜仁至孝殷勤雖不出神祇祐助橋遂考萌兆賴祉子子孫孫百谷豐穰內外靖安必我君高遷取公侯福流後昆萬壽無彊干祿億年亂曰我君明且兮徠儀于國兮吏民河潤受靈福兮莫不慕化心如結兮鼎足期不逝兮見隸釋十五泰山都尉孔宙碑君諱宙字季將孔子十九世之孫也天姿醇嘏齊聖達道少習家訓治嚴氏春秋緝熙之業既就而閨閾之行允恭德音孔昭遂舉孝廉除郎中都昌長祗傳五教尊賢養老躬忠恕及人兼禹湯之辠己故能興朴彫幣濟弘功于易蕳三載考績遷元城令是時東岳嶽黔首猾夏不祠兵遺畔未寍乃擢君典文脩之旬月之間莫不解甲服罪槈田畯喜于荒圃商旅交乎險路會鹿鳴于樂崩復長幼于酬酢稔會遭篤病告困致休得從所好季六十一延熹六年正月乙未疾貴速朽之反真慕寍儉之遺則夕不華明器不設凡百卬高述于是故吏門人乃共陟名山采嘉石勒銘示後俾有彝式其辭曰於顯我君懿德惟光紹聖佗儒身立名彰貢登王室閽是雯夙在公明明乃綏二縣黎儀康於六時廱撫茲岱方勖彼凶人覆俾南畝孔饁山有夷行豐季多黍稱彼光觥帝賴其勳民斯是皇疾乃委其榮忠告慇勤屢省乃聽恭儉自終簠簋不陳生播高譽歿眾令名永不刊億載揚聲延熹七季七月戊造見隸釋七山陽太守祝睦碑君諱睦字元德濟陰已氏人也其先蓋高辛氏之火正以正能淳曜天地曰祝融遂獲豐阜之胙煇裔昌遠大乃侯伯分仕諸夏鄭有祝聃者君其胤也君膺恢懿量在約淵澹潛心耽學該洞七典探賾窮神無物不辯州郡以孝貢察賓于圭庭除北海長史潁川郾令導濟以禮三載之後而民知讓有恥且格君惟老氏名遂身退色斯翻翔紆精衡門道事諮度辟司空府北軍中侯拜大尚書尚書僕射喉舌納言翼皇正樞遷常山相山陽太守齊和五品崇化以寬昭德塞違丕訓其仁抽拔隱伏賢式禮攸堪九功以著當享繁祿為帝幹楨年六十有八延熹七年八月丁已卒臨困紆纊遺令素櫬菨蔞以席賻賵非禮臺不得犯存無玩飾亡導以儉所謂閉終純固者已蓋銘功紀勳所以旌往示來于是迺共登凶鐫石刊勒鴻伐其辭曰懿我君國之光履忠順闡道常升紫徹平機衡統𥮏律章撫二郡踰召黃恭儉己民用康紀頌興詠遺丕稱馥垂令芳生見樂歿不忘名儷日億載揚見隸釋七西嶽華山廟碑周禮職方氏河南山鎮曰華謂之西獄春秋傳曰山嶽則配天乾坤定位山澤通氣雲行雨施既成萬物易之義也祀典曰日月星辰所昭卬也地理山川所生殖也功加于民祀以報之禮記曰天子祭天地及山川歲徧焉自三五迭興其奉山川或在天子或在諸侯是以唐虞疇咨四嶽五歲一巡狩皆以四時之中月各省其方親至其山柴祭燔燎夏商則未聞所損益周鑒于二代十有二歲王巡狩殷國亦有事于方嶽祀以圭璧樂奏六歌高祖初興改秦淫祀大宗承循各詔有司其山川在諸侯者以時祠之孝武皇帝修封禪之禮思登假之道巡省五嶽禋祀豐備故立宮其下宮曰集靈宮壂曰存僊壂門曰望僊門仲宗之世重使使者持節祀焉歲一禱而三祠後不承前至于亡新寖用丘虛託今垣趾營兆猶存建武之元事舉其中禮從其省但使二千石以歲時往祠其有風旱禱請祈求靡不報應自是以來百有餘年有事西巡輒過享祭然其所立碑石刻紀時事文字摩滅莫能存識延熹四年七月甲子弘農太守安國亭侯汝南袁逢掌華嶽之主位應古制脩癈起頓閔其若茲深達和民事神之義精通誠至礿祭之福乃案經傳所載原本所由銘勒斯石垂之于後其辭曰巖巖西嶽峻極穹蒼奄有河朔遂荒華陽觸石興雲雨我農桑資糧品物亦相瑤光崇冠二州古曰雍梁馮于豳岐文武克昌天子展義巡狩省方玉帛之贄禮與岱亢六樂之變舞以致康在漢中葉建設宇堂山嶽之守是秩是望侯惟安國兼命斯章尊脩靈基肅共壇場明德惟馨神歆其芳遏穰凶朼收斂吉祥歲其有年民說無疆袁府君肅恭明神易碑飾闕會遷京兆尹孫府君到欽若嘉業遵而成之延熹八年四月廿九日甲子就袁府君諱逢字周陽汝南女陽人孫府君諱璆字山陵安平信都人時令朱頡字宣得甘陵鄃人丞張昉字少游河南京人左尉唐佑字君惠河南密人主者掾華陰王萇字德長京兆尹敕監都水掾霸陵杜遷市石遣書佐新豐郭香察書刻者潁川邯鄲公脩蘇張工君見舊拓碑本隸釋二山陽太守祝睦後碑故吏王堂等竊聞下有述上之功臣有敘君之德自昔在前列莫不紀名於與者故孔子曰民人登祝上天歆焉用永其世而豐其年𤋯屬欽熙孰不咨賢伐作頌曰伊余祝君兆自蔾幸祝融苖冑承獲禎慶光裔熾邈分仕六國張雄諸夏鄭有祝聃者君其胤也昔祖仕湯湯治於梁洮覬自朔家于濟陰君齔鬈入學修韓詩嚴氏春秋七典並立綜百家文豔彬彧淵然深識怕然執守躬潔冰雪介然清皓漸心于道通神達明無物不覽鄉黨逡逡朝廷便便踐䟭州郡階究右坐以孝察舉讚拜王庭除北海長史潁川郾令化行如風民應如草三載考績名登明堂色斯舉矣退身衡門童冠翔集耽經樂術潛神默記與俗殊好辟司空府北軍軍中侯擢尚書尚書僕射七政錧鎋佐輔斗樞功冠帝庭懿德逴優遷常山相山陽太守協齊行律恢崇三樂追惟九思導闡泮宮附庸同溫化以禮帥由舊章摘隱取伏詶承賢良國無珠藏悉浴蘭湯臺林巨七子在桑乘蕢遠遜竟界尼康休釐充功馨升揚當享紫祚為漢棟梁年六十八寢疾不瘳延熹七年八月丁已卒臨絕絖竢垂誨素棺幣以葭蕟贈襚賵醊非禮之常壹不得當無珍玩歿就以約所謂守忠啟予其去也善蓋彰功表勳所以煥往煇來于是三年禮闋乃相與刊勒金石其辭曰穆我君邦之陽資五就闓道綱陟泰微准樞衡稽列宿覽四方德合乾翼應皇領二郡曜重光化流洽掍豳昌性天約元用長頌聲作令香功烈著遺椒芳存覿榮淪弗忘稱彌煇玄為常見隸釋七漢永康元年月惟昔帝堯聖德慶苞𢎪號赫赫蕩蕩垂基赤精之冑為漢始別陵氣炎熅上交倉玄巍巍之盛乾坤見徵敬脩宗壂長吏奉祠三牲粢饌獻珍于時俵著輝銘宣颺厥休乃招禎祥萬是來鴻名遂顯傳于千秋濟陰太守河南匽師孟府君諱郁字敬達治尚書經博覽眾文天姿瑋度體性溫仁闚極道之要妙游觀六蓺之原據旋機之政務在濟民歷典六郡威教若神遺訓垂歌淵懿允純功績煥炳恩如浩倉咨招巖四股肱賢良廣祈多福虔虔夙興聞帝堯陵在成陽遣戶曹掾史具中牢祠常以甲子日與西宮樂生俱詣大聖陳上古之禮舞先王之樂鞀磬祝圄五音之儀莫不盡備敷列技蓺以榮大聖延熹十年仲春二月陽氣浸陰始雩來享祀群神仰瞻雲漢孟府君奉宣詔書行縣到成陽將辭帝堯行禮未周則景雲四集翔風膏雨即時大降嘉澍優沾利茂萬物陰陽和協百姓賴福是時欣然悅諸產繁殖倉瘐充塞孟府君深惟響應效之經典知聖堯精靈與天通神脩治壂地致璠瑚石闟二坐昭配帝圖象規柜五畫上下相承無所遺失師工旌密有班道之巧使府內百石城吳諱升字三君守衛園陵興置屋詔書大祠升與縣令丞恭奉肅敬齊絜炊熾莫不雍雍列種柏樹吏卒養護南通靈臺東注城域委曲周帀墠然望圖紀萬世功驗永著時令河南河南呂君諱亮字元山宰政宣化慈惠博覆為黎元來福奉事大聖司司不解垂拱無為如始其允君也丞河由州王諱萇字伯盛左尉潁川潁陽諱𢞏字世高皆關綜睢蓺通洞運度詢于上下僉然同謀因孟府大壂自率掾史駐駕便坐南北望表內相副赫如屋赭蘭然成就孟府君必受大聖嘉福公侯傳子孫濟陰吏士歌術功稱萬世常存成陽丞民蒙其榮賜訓發聲呂君諸璧干祿於天令裕衍蔓永流无窮惟序仲氏祖統所出本繼于姃周之遺苗天生仲山甫翼佐中興宣平功遂受封于齊周道衰微失爵忘邦後嗣乖散各相士譯居帝堯萌兆生長葬陵在于成陽聖化常存慕巍巍之盛樂風俗之美遂安處基業屬都鄉高相里因氏仲焉以傳於今子孫承緒履仁好義耽樂道術教授經業雍徒帶眾滋滋汲汲誨人不倦海內稱之曰儒術之宗天監孔明祚善應印紼相承銀艾不絕稟性乾元世世廉約故能高如不危滿如不溢孟府君繕飾壂立百石舍仲氏宗家共作大壂前石磏階陛欄楯貧富相扶會計欣懽不謀同辭錢應時即具招工募石煇然俱至各進琦巧不日成之詔書九月三往大祠諸所造作煥然成就仲氏宗家並受福賜復刊碑勒諜昭示來世俵著孟府君美勳于陽𧵖紀祖禰所出官位宦學皆不可測子子孫孫必蒙大聖休烈之福以勸後進昌熾無極見隸釋一荊州刺史度尚碑君諱尚字博平其先出自顓頊與楚同姓熊嚴之後亦世掌位統國法度秦兼天和之純質秉黃中之正性智舍淵藪仁隆春煖義高秋雲行絜冰霜忼慨壯厲臨休譽固已著矣及其典牧必招振賢才抽拔幽逸選召所任極當世之秀士養民有令聞彌崇暉光日新可謂盛德者已初奉歲計拜郎中除上虞長丕化潛洞百姓數縣恩信並宣令行禁止以從父憂去官更舉孝廉為右校令是時南蠻蠢動擢拜醜殊俗賓服遠人用綏封右鄉侯遷遼東太守旬月之間薉貉寍輯會楊賊畔於拜中郎將料敵勝威謀合神持重瀀於營平深入則輕冠軍附士渥於李廣御同滋味必達井辨幕然後飲舍惠以厚下說以犯難是故所征輒剋師徒無頓寇殄殪干戈載戢走馬以糞朝貪厥重復拜荊州刺史以故秩居冊書尉薦因賜之荊域號慕雖周人之思召伯弗此踰也於是故吏感清廟之頌歎斯父之詩乃曰於惟我侯允懿允明文武是該克忠克貞粵初發藻在彼上虞邁種厥德矣匪祿是榮無言不讎帝揚厥聲俾作配往撫于荊撫荊惟何南夏是邦家截彼海外續莫匪嘉天生我侯實為民望心乎其愛四方是卬如何不永而不巧芳烈遺兮永康元年歲在鶉尾龍集丁未時惟歲下闕見隸釋七車騎將軍馮緄碑君諱緄字皇卿幽州君之元子也少耽學問習父業治春秋嚴韓詩倉氏蒹律大杜弱冠詔除郎還更仕郡歷諸曹史督郵主薄五官掾功曹舉孝廉除右郎中蜀郡廣都長遭直荒亂以德綏撫政化流行到官四載功稱顯著郡察廉吏州舉光異遷楗為武陽令誅疾疆豪以公去官部廣漢別駕治中從事辟司空府侍御史中丞督使徐揚二州討賊范容朱生徐鳳馬勉張嬰等坐迫州郡進兵正法復辟司徒府廷尉左監正治書侍御史廣漢屬國都尉隴西太守坐問吏辜旬不分去官以羌駭動為四府所表復家拜隴西太守上病辟同產弟徵議郎復治書侍御史尚書遼東太守廷尉大常車騎將軍南征五溪蠻夷黃加少高相法氏趙伯潘鴻等斬首萬級沒溺以千數降者十萬人收逋賨布卅萬𠤭不費官財振旅還師臨當受封以謠言奏河內大守中常侍左悺弟坐遜位拜將作大匠河南尹復拜延尉表荊州刺史李隗南陽大守成晉大原大守劉瓆不宜以重論坐正法作左校後詔書特貰拜屯騎校尉復廷尉奏中臣子弟不宜典牧州郡獲過左右遜位永康元年十二薨一要金紫十二銀艾七墨綬將軍體清守約既來歸葬遺令墳塋取藏刑而已不造祠堂可謂履真者矣恐後人不能紀知官所更歷故刊石表績以毖來世孝桓皇帝以命將軍討此彊夷有桓桓烈之姿因謚為桓見隸釋七
